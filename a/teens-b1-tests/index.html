riends, one band", "paras": [["A", "Dana, Timur and Aliya met in Year 7 at a music club in Kostanay. Dana played the piano, Timur had just got his first drum kit, and Aliya wrote poems that nobody had read. ‘We didn’t plan to start a band,’ says Dana. ‘We just liked hanging out in the music room.’"], ["B", "Their first songs were, in Timur’s words, ‘absolutely terrible’. They had no idea how to build up a song, and Aliya’s lyrics were too long for the music. Then their teacher suggested studying how professional artists organise an album by listening to each one from the first track to the last."], ["C", "It helped. Today the band, Northern Lights, has written twelve songs, and they play a mix of pop, rock and a little folk. Their best-known track, ‘Grey Sky’, has a chorus that students at their school sing in the corridors."], ["D", "Last spring they recorded ‘Grey Sky’ on a phone and entered an online contest for young musicians. To their surprise, they came second out of 300 bands. The prize was a day in a real recording studio in Astana."], ["E", "Not everything is easy. Rehearsals take time, and the friends have had to cut down on gaming and social media. They have also learned to deal with negative comments online. ‘Some people say we’re too young,’ says Aliya. ‘But if we listened to them, we would never play anything.’"]]}, "parts": [{"instr": "Choose A, B, or C.", "items": [{"t": "mc", "q": "How did the band start?", "o": ["The friends enjoyed spending time in the music room.", "Their teacher put them in a group.", "They met online."], "a": 0}, {"t": "mc", "q": "What was one problem with their first songs?", "o": ["They had no instruments.", "The lyrics were too long for the music.", "Timur couldn’t play the drums."], "a": 1}, {"t": "mc", "q": "What did their teacher suggest?", "o": ["taking extra music lessons", "listening to whole albums to see how they are organised", "playing other bands’ songs"], "a": 1}, {"t": "mc", "q": "What do we learn about ‘Grey Sky’?", "o": ["It is a folk song.", "Students at their school sing the chorus.", "It was recorded in a studio in Astana."], "a": 1}, {"t": "mc", "q": "What did the band win?", "o": ["some money", "a concert in Astana", "a day in a recording studio"], "a": 2}, {"t": "mc", "q": "How does Aliya feel about negative comments?", "o": ["They won’t stop the band from playing.", "They are probably right.", "They made her leave social media."], "a": 0}]}, {"instr": "Which paragraph (A–E) mentions the following?", "items": [{"t": "match", "q": "a competition the band took part in", "a": "D"}, {"t": "match", "q": "the kinds of music the band plays", "a": "C"}, {"t": "match", "q": "things the friends now do less often", "a": "E"}, {"t": "match", "q": "how the friends first met", "a": "A"}], "opts": ["A", "B", "C", "D", "E"]}]}, {"k": "w", "name": "Writing", "max": 10, "writing": {"tasks": ["Write a blog post (about 150 words) about how you use your phone on a typical day. Which apps do you use, and how could you cut down on screen time?", "Write a story (about 150 words) that begins: ‘When I pressed “upload”, I had no idea the video would go viral.’", "Write an essay (about 150 words): ‘Video games do more good than harm.’ Do you agree?"], "crit": [["Task completion", 4], ["Grammar", 3], ["Vocabulary", 3]]}}, {"k": "l", "name": "Listening", "max": 10, "w": 1, "parts": [{"instr": "Listen to five people talking about their jobs in technology and media. Match the speakers (1–5) to the statements (A–H).", "legend": ["reports news stories", "writes code for mobile apps", "designs websites for companies", "teaches computers to act like humans", "tests video games before they are released", "works with cartoons and special effects", "manages a famous YouTuber’s channel", "conducts research on teenagers and technology"], "opts": ["A", "B", "C", "D", "E", "F", "G", "H"], "items": [{"t": "match", "q": "Speaker 1", "a": "A"}, {"t": "match", "q": "Speaker 2", "a": "C"}, {"t": "match", "q": "Speaker 3", "a": "H"}, {"t": "match", "q": "Speaker 4", "a": "F"}, {"t": "match", "q": "Speaker 5", "a": "D"}], "audio": {"script": [["Narrator", "Speaker one."], ["Speaker 1", "I work for a radio station in Astana. Every morning I get to the studio at five, read about what’s happened overnight, and then I tell listeners about the most important stories. I studied media at university, but the most important skill is staying calm when something goes wrong live."], ["Narrator", "Speaker two."], ["Speaker 2", "Companies come to me when they need a new website. I spend about half my time on design – choosing colours, layouts and pictures – and the other half writing code. Before this I wanted to make mobile apps, but I prefer seeing my work on a big screen."], ["Narrator", "Speaker three."], ["Speaker 3", "I’m a university researcher. At the moment we’re conducting a survey of two thousand teenagers to find out how much time they spend on their phones and how it affects their sleep. The results so far are really interesting."], ["Narrator", "Speaker four."], ["Speaker 4", "I draw characters and then bring them to life on screen. Last year I worked on a cartoon series for children, and now I’m doing special effects for a video game. You need a lot of patience – a few seconds of movement can take a whole day."], ["Narrator", "Speaker five."], ["Speaker 5", "My job is in artificial intelligence. I program machines so that they can understand what people say and answer like a human would. It’s a mix of computer science and psychology, which is why I love it."]]}}, {"instr": "Listen to two friends, Timur and Aliya, talking about Timur’s new games console. Choose A, B, or C.", "items": [{"t": "mc", "q": "Who gave Timur the console?", "o": ["his parents", "nobody – he bought it himself", "his uncle"], "a": 2}, {"t": "mc", "q": "How long can Timur play on school days?", "o": ["one hour", "two hours", "not at all"], "a": 0}, {"t": "mc", "q": "Where is the console?", "o": ["in Ti monstration", "demon_stra_tion", "de_mon_stration"], "a": 1}, {"t": "pron", "o": ["vo_lun_teer", "_vo_lunteer", "volun_teer_"], "a": 2}, {"t": "pron", "o": ["_pas_sionate", "passio_nate_", "pas_sio_nate"], "a": 0}, {"t": "pron", "o": ["repre_sen_tative", "represen_ta_tive", "re_pre_sentative"], "a": 0}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 1, "intro": "Read the article and answer the questions. One mark for each answer.", "passage": {"title": "A trip that never happened", "paras": [["A", "Last year, 15-year-old Aliya Bekova saw an advert for a two-week volunteering trip to Africa. The photos showed smiling teenagers teaching children and holding baby lions. ‘I wanted to go immediately,’ she says. The trip cost more than a million tenge."], ["B", "Her uncle, who works for an international aid organisation, was not so sure. He explained that some voluntourism companies are unethical: they keep wild animals in captivity for photos, and children in some orphanages have to meet a new group of strangers every two weeks."], ["C", "Aliya was shocked, but she still wanted to help. So she looked for projects closer to home. She found a conservation group that protects birds on the lakes near Kostanay, and a centre for elderly people who live alone."], ["D", "Instead of paying a company, Aliya organised a sponsored bike ride with her friends and raised 300,000 tenge for the bird project. The money was used to build safe nesting areas and to put up signs asking fishermen to take their rubbish home."], ["E", "Aliya admits that cycling round a lake is not as exciting as a trip to Africa. ‘But I can see the results,’ she says. ‘The birds came back this spring. If I had gone abroad, I would never have known whether my help made a difference.’"]]}, "parts": [{"instr": "Choose A, B, or C.", "items": [{"t": "mc", "q": "What first attracted Aliya to the trip?", "o": ["the low price", "the photos in the advert", "a friend who was going"], "a": 1}, {"t": "mc", "q": "What did her uncle say about some voluntourism companies?", "o": ["They are too expensive.", "They are dangerous for teenagers.", "They behave unethically."], "a": 2}, {"t": "mc", "q": "Why can short visits be bad for children in orphanages?", "o": ["They have to work for the volunteers.", "They keep meeting new strangers.", "They miss their lessons."], "a": 1}, {"t": "mc", "q": "What did Aliya do instead of paying a company?", "o": ["She got a part-time job.", "She sold cakes at school.", "She organised a sponsored bike ride."], "a": 2}, {"t": "mc", "q": "How was the money used?", "o": ["to buy bikes for the group", "to build nesting areas and put up signs", "to pay the fishermen"], "a": 1}, {"t": "mc", "q": "What does Aliya say in the last paragraph?", "o": ["She can see the results of her work.", "She regrets not going to Africa.", "She wants to go abroad next year."], "a": 0}]}, {"instr": "Which paragraph (A–E) mentions the following?", "items": [{"t": "match", "q": "the job of one of Aliya’s relatives", "a": "B"}, {"t": "match", "q": "the cost of the trip abroad", "a": "A"}, {"t": "match", "q": "how the money raised was spent", "a": "D"}, {"t": "match", "q": "two local projects", "a": "C"}], "opts": ["A", "B", "C", "D", "E"]}]}, {"k": "w", "name": "Writing", "max": 10, "writing": {"tasks": ["Write an email to the head of your school (about 150 words) suggesting a fundraising event. Say what the event is, who it will help and what will happen if the school agrees.", "Write an article for a teen magazine (about 150 words): ‘Volunteering at home is better than volunteering abroad.’ Do you agree?", "Write a speech (about 150 words) for a school council election. Use the first conditional to make your promises."], "crit": [["Task completion", 4], ["Grammar", 3], ["Vocabulary", 3]]}}, {"k": "l", "name": "Listening", "max": 10, "w": 1, "parts": [{"instr": "Listen to five teenagers talking about how they help others. Match the speakers (1–5) to the statements (A–H).", "legend": ["helps at an animal shelter", "raised money by doing a sport", "teaches younger children online", "started a petition", "is a member of the school council", "collects litter in the countryside", "helps older people with technology", "volunteered abroad"], "opts": ["A", "B", "C", "D", "E", "F", "G", "H"], "items": [{"t": "match", "q": "Speaker 1", "a": "C"}, {"t": "match", "q": "Speaker 2", "a": "F"}, {"t": "match", "q": "Speaker 3", "a": "B"}, {"t": "match", "q": "Speaker 4", "a": "E"}, {"t": "match", "q": "Speaker 5", "a": "D"}], "audio": {"script": [["Narrator", "Speaker one."], ["Speaker 1", "I live in a really rural area, so it’s hard to volunteer in person. Once a week I give an online maths lesson to kids in primary school – things like fractions and measurements. Some of them are really shy at first, but after a few lessons they ask me loads of questions."], ["Narrator", "Speaker two."], ["Speaker 2", "Every Sunday morning a group of us go plogging – that’s jogging and picking up rubbish at the same time – along the paths outside town. You wouldn’t believe how many plastic bottles people leave in the fields. We usually fill about ten bags."], ["Narrator", "Speaker three."], ["Speaker 3", "Last month I swam three kilometres in the city pool for a children’s charity. My neighbours and teachers sponsored me, and I raised almost eighty thousand tenge. My arms hurt for days afterwards, but it was for a good cause."], ["Narrator", "Speaker four."], ["Speaker 4", "I was elected to represent Year 9 in September. We meet every two weeks with the head teacher. So far we’ve managed to get new benches in the playground, and now we’re discussing a longer lunch break."], ["Narrator", "Speaker five."], ["Speaker 5", "The bus stop near our school had no shelter, and in winter we had to wait in the snow. So I wrote to the city council and asked people to sign my letter online. We got two thousand signatures, and a new bus shelter is being built now."]]}}, {"instr": "Listen to an interview with the organiser of a charity run. Choose A, B, or C.", "items": [{"t": "mc", "q": "How many people took part in the first run?", "o": ["about three thousand", "about twelve", "about seventy"], "a": 1}, {"t": "mc", "q": "Who will receive the money this year?", "o": ["a children’s hospital", "a local school", "an animal welfare charity"], "a": 2}, {"t": "mc", "q": "Who raised the most money last year?", "o": ["a grandmother", "a professional runner", "a group of students"], "a": 0}, {"t": "mc", "q": "What does Marat say about speed?", "o": ["Everyone has to finish in an hour.", "Many people walk the whole way.", "Only fast runners can take part."], "a": 1}, {"t": "mc", "q": "What will happen next year if there are enough volunteers?", "o": ["There will be a children’s race.", "The race will be longer.", "The run will move to another city."], "a": 0}], "audio": {"script": [["Host", "I’m here with Marat Ospanov, who organises the Kostanay Charity Run. Marat, how did it start?"], ["Expert", "Five years ago, a few friends and I ran ten kilometres to raise money for a local children’s hospital. There were only twelve of us. This year, over three thousand runners have registered."], ["Host", "Who is the money for this year?"], ["Expert", "We choose a different cause every year. This year it’s an animal welfare charity that rescues abandoned dogs."], ["Host", "And how do the runners raise money?"], ["Expert", "Most of them ask friends and family to sponsor them. Some also make online appeals. The top fundraiser last year was a seventy-year-old grandmother who raised over four hundred thousand tenge."], ["Host", "Wow. Do people have to be fast?"], ["Expert", "Not at all. Whereas some professional runners finish in thirty minutes, many people walk the whole way. And about a third come in fancy dress."], ["Host", "What are your plans for the future?"], ["Expert", "If we get enough volunteers, we will add a children’s race next year."]]}}]}, {"k": "s", "name" en angry, this presentation was calm and full of facts. The head was impressed. A second serving counter was opened in January, and a vegetarian dish is now offered every day."], ["E", "Not all the changes have been popular – the new menu includes more vegetables, which some students call ‘ridiculous’. But Nurlan is proud. ‘Somehow we did it,’ he says. ‘And now younger students know that the council isn’t just for show.’"]]}, "parts": [{"instr": "Choose A, B, or C.", "items": [{"t": "mc", "q": "What was one problem with the canteen?", "o": ["The food was too expensive.", "There was nothing for students who don’t eat meat.", "It was closed at lunchtime."], "a": 1}, {"t": "mc", "q": "How did people react to Nurlan’s promise?", "o": ["They didn’t believe him.", "They voted against him.", "They offered to help him."], "a": 0}, {"t": "mc", "q": "How long did students wait in the queue on average?", "o": ["eighteen minutes", "the whole lunch break", "five minutes"], "a": 0}, {"t": "mc", "q": "Why was the head impressed?", "o": ["The presentation was calm and full of facts.", "The students organised a protest.", "The council offered to pay for changes."], "a": 0}, {"t": "mc", "q": "What changes were made?", "o": ["a longer lunch break", "a new canteen manager", "a second counter and a daily vegetarian dish"], "a": 2}, {"t": "mc", "q": "How does Nurlan feel about the result?", "o": ["disappointed", "proud", "surprised that it was easy"], "a": 1}]}, {"instr": "Which paragraph (A–E) mentions the following?", "items": [{"t": "match", "q": "the way the council collected data", "a": "C"}, {"t": "match", "q": "a promise made before an election", "a": "B"}, {"t": "match", "q": "a negative reaction to one of the changes", "a": "E"}, {"t": "match", "q": "a problem that nobody solved for a long time", "a": "A"}], "opts": ["A", "B", "C", "D", "E"]}]}, {"k": "w", "name": "Writing", "max": 10, "writing": {"tasks": ["Write a letter (about 150 words) to your local council asking for a change in your town, for example more bins, a skate park or better buses. Explain why it is needed.", "Write a story (about 150 words) that begins: ‘Nobody believed we could raise the money, but somehow we did it.’", "Write an essay (about 150 words) comparing a holiday abroad with a holiday in your own country. Use whereas to contrast your ideas."], "crit": [["Task completion", 4], ["Grammar", 3], ["Vocabulary", 3]]}}, {"k": "l", "name": "Listening", "max": 10, "w": 1, "parts": [{"instr": "Listen to five people talking about campaigns they have taken part in. Match the speakers (1–5) to the statements (A–H).", "legend": ["joined a demonstration about climate change", "made a video that went viral", "persuaded a shop to stop using plastic bags", "campaigned to protect an old building", "was disappointed by the result of their campaign", "worked with a parents’ association", "spoke in front of politicians", "collected clothes for families in need"], "opts": ["A", "B", "C", "D", "E", "F", "G", "H"], "items": [{"t": "match", "q": "Speaker 1", "a": "C"}, {"t": "match", "q": "Speaker 2", "a": "G"}, {"t": "match", "q": "Speaker 3", "a": "H"}, {"t": "match", "q": "Speaker 4", "a": "E"}, {"t": "match", "q": "Speaker 5", "a": "F"}], "audio": {"script": [["Narrator", "Speaker one."], ["Speaker 1", "There’s a small supermarket near my house, and every customer used to get three or four plastic bags. My friends and I wrote to the manager and gave him a list of ideas. It took months to convince him, but now they only sell paper bags and cloth ones."], ["Narrator", "Speaker two."], ["Speaker 2", "Our group was invited to the regional parliament to talk about bullying in schools. I had to give a five-minute speech in front of about forty politicians. My voice was shaking at the beginning, but afterwards one of them asked for a copy of my speech."], ["Narrator", "Speaker three."], ["Speaker 3", "When floods hit the villages near our city, our class made an appeal on social media. People brought warm coats, boots and blankets to our school, and we packed everything into boxes. Two lorries took it all to the families who had lost their homes."], ["Narrator", "Speaker four."], ["Speaker 4", "We campaigned for a cycle path along the main road for a whole year. We had a petition, posters, even a demonstration on bikes. But in the end the city decided it was too expensive. I was really upset – we had worked so hard."], ["Narrator", "Speaker five."], ["Speaker 5", "The playground at my little sister’s school was in a terrible condition. I helped the parents’ association organise a cake sale and a concert, and together we raised enough money for new swings. Working with adults was strange at first, but they treated me as an equal."]]}}, {"instr": "Listen to two friends, Dana and Timur, talking about a school trip. Choose A, B, or C.", "items": [{"t": "mc", "q": "Why does the council want to change the trip?", "o": ["Students think the dolphin show is unethical.", "Astana is too far away.", "The dolphin show is too expensive."], "a": 0}, {"t": "mc", "q": "Where would the students stay?", "o": ["in a big hotel", "in tents", "in a guest house run by a local family"], "a": 2}, {"t": "mc", "q": "How will they pay the extra cost?", "o": ["Their parents will pay.", "by organising a fundraising day", "The council will pay."], "a": 1}, {"t": "mc", "q": "Why will they travel by train?", "o": ["It is cheaper.", "It is faster.", "It produces less carbon."], "a": 2}, {"t": "mc", "q": "When will the trip be announced?", "o": ["on Monday", "next month", "today"], "a": 0}], "audio": {"script": [["Dana", "Timur, have you heard? The school council wants to change the Year 8 trip."], ["Timur", "Really? I thought we were going to the dolphin show in Astana again."], ["Dana", "That’s the point. Lots of students said keeping dolphins in a small pool is unethical, so the council asked the head for a different trip."], ["Timur", "What’s the new idea?"], ["Dana", "Two days in a Read the article and answer the questions. One mark for each answer.", "passage": {"title": "Is slow travel the future?", "paras": [["A", "For most of the twentieth century, travelling abroad meant a long journey by train, ship or car. Then cheap flights arrived, and suddenly a weekend in another country cost less than a pair of trainers."], ["B", "Today, more and more young Europeans are choosing to travel slowly again. Rail passes allow students to travel through dozens of countries on one ticket, and overnight trains have come back into fashion after many routes had been closed."], ["C", "Supporters say slow travel is not only kinder to the planet but also more satisfying. A train journey can produce several times less carbon than the same trip by plane, and travellers watch the countryside change outside the window instead of a sea of clouds."], ["D", "However, slow travel has drawbacks. It takes much longer, and train tickets are sometimes more expensive than flights. ‘I should have flown,’ admits Nurlan, 17, who spent three days crossing Europe by rail last summer. ‘I ended up with only two days in Barcelona.’"], ["E", "Others think the answer is to fly less often but stay longer. Instead of five short trips a year, they suggest one longer holiday – and choosing places that can be reached by land whenever possible."]]}, "parts": [{"instr": "Choose A, B, or C.", "items": [{"t": "mc", "q": "According to paragraph A, what changed the way people travelled?", "o": ["faster trains", "new motorways", "cheap flights"], "a": 2}, {"t": "mc", "q": "What has happened to overnight trains?", "o": ["They have all been closed.", "They have become popular again.", "They are only for students."], "a": 1}, {"t": "mc", "q": "Why do supporters say slow travel is more satisfying?", "o": ["You can see the landscape.", "It is always cheaper.", "It is faster than flying."], "a": 0}, {"t": "mc", "q": "How does Nurlan feel about his trip?", "o": ["He regrets not flying.", "He loved ever 10, "w": 1, "intro": "Read the article and answer the questions. One mark for each answer.", "passage": {"title": "The Silk Road", "paras": [["A", "For more than 1,500 years, the Silk Road was the most important trade route in the world. It was not a single road but a network of paths that connected China with the Mediterranean, and several of its busiest routes crossed what is now southern Kazakhstan."], ["B", "Silk, paper, spices and horses were carried thousands of kilometres by camel caravans. A journey from one end to the other could take more than a year, so few traders travelled the whole way. Instead, goods were passed from merchant to merchant and from city to city."], ["C", "Travelling the Silk Road was dangerous. Caravans had to cross freezing mountains and burning deserts, and they were often attacked by robbers. To protect travellers, roadside inns called caravanserais were built about one day’s journey apart."], ["D", "But the road carried more than goods. Ideas, languages, religions and inventions spread along it too. Cities such as Otrar and Taraz became rich centres of learning, where scholars from many countries met."], ["E", "In 2014, part of the Silk Road, including several sites in Kazakhstan, was added to the UNESCO World Heritage List. Today, new railways and motorways follow the old routes, and China and Europe are once again connected by land."]]}, "parts": [{"instr": "Choose A, B, or C.", "items": [{"t": "mc", "q": "What was the Silk Road?", "o": ["one long stone road", "a network of routes", "a river"], "a": 1}, {"t": "mc", "q": "How were goods usually transported?", "o": ["by camel caravans", "by ship", "by horse and cart"], "a": 0}, {"t": "mc", "q": "How did goods usually reach the other end of the route?", "o": ["One trader carried them all the way.", "They were sent by sea.", "They were passed between many merchants."], "a": 2}, {"t": "mc", "q": "Why were caravanserais built?", "o": ["to store silk", "to collect money from traders", "t one was happy. Some people at NASA thought a tourist would get in the way of the astronauts’ work."], ["Speaker", "Today, several private companies offer much shorter flights. Passengers go just high enough to see the curve of the Earth and float for a few minutes, and the whole trip lasts only around ten minutes."], ["Speaker", "Tickets are still extremely expensive, but many experts are sure that prices will have fallen a lot by 2050."]]}}]}, {"k": "s", "name": "Speaking", "max": 15, "speaking": {"ask": ["What do you think you will have done by the time you are 25?", "Describe something that was absolutely terrifying.", "What would you do if you were the mayor of Kostanay for a day?", "Tell me about a journey that went wrong. What should you have done?", "Which animal in Kazakhstan would you most like to see in the wild?"], "talk": ["‘Robots will make the world a better place.’", "‘Money spent on space travel should be spent on protecting the Earth.’", "‘Tourism does more harm than good to famous places.’"], "mode": "overall", "max": 15}}]}, {"id": "eoc", "kind": "eoc", "title": "End-of-course Test", "focus": "The whole course (units 1.1–6.5): all grammar and language points, vocabulary, reading, writing, listening and speaking.", "secs": [{"k": "g", "name": "Grammar", "max": 40, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "Why don’t you ___ a look at this app?", "o": ["taking", "to take", "take"], "a": 2}, {"t": "mc", "q": "What about ___ to the cinema tonight?", "o": ["go", "going", "to go"], "a": 1}, {"t": "mc", "q": "If I were you, I ___ to the teacher about it.", "o": ["will talk", "talked", "would talk"], "a": 2}, {"t": "mc", "q": "The school council ___ by the students every year.", "o": ["is elected", "elects", "is electing"], "a": 0}, {"t": "mc", "q": "If you help me with my project, I ___ you with your maths.", "o": ["would help", "helped", "will help"], "a": 2}, {"t": "mc", "q": "I can’t find my ogical", "psycho_lo_gical"], "a": 2}, {"t": "pron", "o": ["_en_vironment", "en_vi_ronment", "envi_ron_ment"], "a": 1}, {"t": "pron", "o": ["ex_pe_rience", "_ex_perience", "expe_ri_ence"], "a": 0}, {"t": "pron", "o": ["ad_ver_tisement", "_ad_vertisement", "adver_tise_ment"], "a": 0}]}]}, {"k": "r", "name": "Reading", "max": 15, "w": 1, "intro": "Read the article and answer the questions. One mark for each answer.", "passage": {"title": "Teenagers who made a difference", "paras": [["A", "Every year, a local newspaper in Kostanay asks readers to nominate teenagers who have made a difference. This year more than 300 names were sent in, and the judges found it very hard to choose. Here are five of the winners."], ["B", "Aliya, 15, noticed that the older people in her building felt lonely and didn’t know how to use their smartphones. She started a free weekly club where teenagers teach pensioners to video-call their grandchildren. ‘They teach us patience,’ she says, ‘and we teach them apps.’"], ["C", "Nurlan, 14, has been training in judo since he was six. This spring he won a national championship, but it was his attitude that impressed the judges most. After every competition he helps to coach younger children at his club – without being paid."], ["D", "Dana, 16, organised a sponsored run that raised over two million tenge for a children’s hospital. Not only did forty students take part, but several teachers ran too – one of them in fancy dress as a snow leopard!"], ["E", "Timur, 15, built a small weather station on his school roof using cheap sensors. His data is now shared online, and local farmers use it to decide when to plant their crops. ‘I should have started years ago,’ he laughs."], ["F", "Finally, Aruzhan, 13, wrote and filmed a short documentary about plastic in the Tobol river. It was watched more than 50,000 times, and as a result the city council agreed to put more bins along the riverbank."]]}, "parts": [{"instr": "Choose A, B, or C.", "items": [{"t": "mc", "q": "How many names were sent to the newspaper?", "o": ["five", "fifty", "more than 300"], "a": 2}, {"t": "mc", "q": "Why did Aliya start her club?", "o": ["Older neighbours were lonely.", "She wanted to earn money.", "Her teacher asked her to."], "a": 0}, {"t": "mc", "q": "What do the pensioners learn at Aliya’s club?", "o": ["how to build websites", "how to speak English", "how to make video calls"], "a": 2}, {"t": "mc", "q": "What impressed the judges most about Nurlan?", "o": ["his attitude", "his medal", "his speed"], "a": 0}, {"t": "mc", "q": "How does Nurlan help younger children?", "o": ["He pays for their lessons.", "He coaches them for free.", "He takes them to competitions."], "a": 1}, {"t": "mc", "q": "How much money did Dana’s run raise?", "o": ["two hundred thousand tenge", "forty thousand tenge", "over two million tenge"], "a": 2}, {"t": "mc", "q": "Who wore fancy dress?", "o": ["Dana", "a teacher", "a doctor"], "a": 1}, {"t": "mc", "q": "Who uses Timur’s weather data?", "o": ["airline pilots", "local farmers", "the newspaper"], "a": 1}, {"t": "mc", "q": "What does Timur regret?", "o": ["building the station on the roof", "sharing his data", "not starting earlier"], "a": 2}, {"t": "mc", "q": "What happened after Aruzhan’s documentary?", "o": ["The river was closed to the public.", "More bins were put along the river.", "She won an international prize."], "a": 1}]}, {"instr": "Which paragraph (A–F) mentions the following?", "items": [{"t": "match", "q": "money raised for people who are ill", "a": "D"}, {"t": "match", "q": "information that helps people who grow food", "a": "E"}, {"t": "match", "q": "a film that led to a change", "a": "F"}, {"t": "match", "q": "young people teaching older people", "a": "B"}, {"t": "match", "q": "how the winners were chosen", "a": "A"}], "opts": ["A", "B", "C", "D", "E", "F"]}]}, {"k": "w", "name": "Writing", "max": 10, "writing": {"tasks": ["Write an essay (about 180 words): ‘Teenagers should spend less time on their phones.’", "Write an article (about 180 words) about the most interesting topic you studied in this course and why you enjoyed it.", "Write a story (about 180 words) about an unforgettable journey or adventure. Use the past perfect and at least two multi-word verbs."], "crit": [["Task completion", 4], ["Grammar", 3], ["Vocabulary", 3]]}}, {"k": "l", "name": "Listening", "max": 10, "w": 1, "parts": [{"instr": "Listen to five teenagers talking about their free time. Match the speakers (1–5) to what they say (A–H).", "legend": ["I run my own YouTube channel.", "I volunteer at weekends.", "I’ve become a vegan.", "I play in a band.", "I’m training for a competition.", "I’ve cut down on gaming.", "I love trying unusual sports.", "I’m learning to make apps."], "opts": ["A", "B", "C", "D", "E", "F", "G", "H"], "items": [{"t": "match", "q": "Speaker 1", "a": "B"}, {"t": "match", "q": "Speaker 2", "a": "F"}, {"t": "match", "q": "Speaker 3", "a": "G"}, {"t": "match", "q": "Speaker 4", "a": "A"}, {"t": "match", "q": "Speaker 5", "a": "C"}], "audio": {"script": [["Narrator", "Speaker one."], ["Speaker 1", "Every Saturday morning I help at the animal shelter. I walk the dogs and clean the cages. I don’t get paid, but I love it."], ["Narrator", "Speaker two."], ["Speaker 2", "I used to play games for six hours a day. Now I put my console away after one hour and go outside instead. I feel so much better."], ["Narrator", "Speaker three."], ["Speaker 3", "Last month I tried underwater hockey, and next week I’m going to try archery on horseback. The stranger the sport, the better!"], ["Narrator", "Speaker four."], ["Speaker 4", "I upload a new video every Friday. I’ve got about two thousand subscribers now, and editing takes me ages!"], ["Narrator", "Speaker five."], ["Speaker 5", "I stopped eating meat, eggs and dairy last year. My mum was worried about protein, but I eat lots of beans and nuts."]]}}, {"instr": "Listen to an interview with a teacher about the school year. Choose A, B, or C.", "items": [{"t": "mc", "q": "Which topic did the students enjoy most?", "o": ["space travel", "volunteering", "sport"], "a": 0}, {"t": "mc", "q": "What did the students debate?", "o": ["spending money on going to Mars", "banning phones at school", "building robots"], "a": 0}, {"t": "mc", "q": "What did the students find difficult?", "o": ["reported speech", "the passive", "the future perfect"], "a": 2}, {"t": "mc", "q": "What happened after the volunteering unit?", "o": ["The class raised money for a hospital.", "The students organised a debate.", "Twelve students started helping at a shelter."], "a": 2}, {"t": "mc", "q": "What is the teacher’s advice?", "o": ["Try never to make mistakes.", "Read in English every day.", "Watch films without subtitles."], "a": 1}], "audio": {"script": [["Host", "Ms Akhmetova, which topic did your students enjoy most this year?"], ["Teacher", "Probably space travel. We had a fantastic debate about whether we should spend money on going to Mars."], ["Host", "Was anything difficult for them?"], ["Teacher", "The grammar in Part 4 – the future perfect. At first everyone said ‘will finished’! But by the end they’d got it."], ["Host", "Did anything surprise you?"], ["Teacher", "The volunteering unit. After it, twelve students started helping at a local animal shelter, and they’re still going every week."], ["Host", "Any advice for next year’s students?"], ["Teacher", "Read in English every day, even for ten minutes. And don’t be afraid of mistakes – that’s how you learn."]]}}]}, {"k": "s", "name": "Speaking", "max": 15, "speaking": {"ask": ["Which unit did you enjoy most this year? Why?", "What advice would you give a student starting this course? (If I were you…)", "What will you have achieved by the end of next year?", "Describe an unforgettable place you have visited.", "What would you change about your school if you could?"], "talk": ["‘Teenagers spend too much time online.’", "‘Every student should do voluntary work.’", "‘Travelling teaches you more than school does.’"], "mode": "overall", "max": 15}}]}];
</script>
<script>
(function(){
'use strict';
/* In-page dialogs: browser alert/confirm boxes are blocked inside claude.ai pages on phones */
function uiAsk(msg,ok,cancel){return new Promise(res=>{
  if(!document.getElementById('ifdlg-css')){const s=document.createElement('style');s.id='ifdlg-css';s.textContent='.ifdlg{position:fixed;inset:0;z-index:2147483000;background:rgba(10,16,32,.55);display:flex;align-items:center;justify-content:center;padding:16px}.ifdlg-box{background:var(--card,var(--paper,#fff));color:var(--fg,var(--ink,#1F2937));border-top:4px solid var(--gold,#C9A227);border-radius:14px;max-width:440px;width:100%;padding:20px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.35);font:inherit}.ifdlg-box p{margin:0 0 16px;font-size:17px;line-height:1.45}.ifdlg-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.ifdlg-row button{font:inherit;font-weight:800;font-size:16px;border-radius:999px;padding:11px 20px;border:2px solid var(--line,#D8E1EE);background:transparent;color:inherit;cursor:pointer;min-height:44px}.ifdlg-row .ifdlg-ok{background:var(--navy,#14213D);border-color:var(--navy,#14213D);color:#fff}@media (prefers-color-scheme:dark){.ifdlg-row .ifdlg-ok{background:var(--gold,#C9A227);border-color:var(--gold,#C9A227);color:#14213D}}';document.head.appendChild(s)}
  const d=document.createElement('div');d.className='ifdlg';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
  d.innerHTML='<div class="ifdlg-box"><p></p><div class="ifdlg-row">'+(cancel?'<button type="button" class="ifdlg-no"></button>':'')+'<button type="button" class="ifdlg-ok"></button></div></div>';
  d.querySelector('p').textContent=msg;const o=d.querySelector('.ifdlg-ok'),n=d.querySelector('.ifdlg-no');o.textContent=ok||'OK';if(n)n.textContent=cancel;
  const kd=e=>{if(e.key==='Escape')done(false)};const done=v=>{d.remove();document.removeEventListener('keydown',kd);res(v)};
  o.onclick=()=>done(true);if(n)n.onclick=()=>done(false);d.addEventListener('click',e=>{if(e.target===d)done(false)});document.addEventListener('keydown',kd);
  document.body.appendChild(d);o.focus()})}
const uiConfirm=(m,ok)=>uiAsk(m,ok||'Yes','Cancel'),uiAlert=m=>uiAsk(m,'OK',null);
const L='ABCDEFGH';
const byKind=k=>TESTS.filter(t=>t.kind===k);
const pairs=k=>{const g={};byKind(k).forEach(t=>{(g[t.group]=g[t.group]||[]).push(t)});return Object.values(g)};
const COLLECTIONS=[
 {name:'Entry test',items:byKind('entry').map(t=>[t])}]
 .concat([1,2,3,4,5,6].map(n=>({name:'Unit tests · Part '+n,items:byKind('quick').filter(t=>t.id.charAt(1)===String(n)).map(t=>[t])})))
 .concat([{name:'Part tests',items:pairs('file')},
 {name:'Progress tests',items:pairs('progress')},
 {name:'End-of-course test',items:byKind('eoc').map(t=>[t])}]);
const ORDER=TESTS.map(t=>t.id);
const KEY='ifa-teens-b1b2-testcentre-v1';
let state;
try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}
if(!state||typeof state!=='object')state={mode:'practice',name:'',cls:'',cur:ORDER[0],sec:'g',tests:{},theme:'',view:'tests'};
if(!TESTS.find(t=>t.id===state.cur))state.cur=ORDER[0];
let saveTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const strip=s=>String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
const T=()=>TESTS.find(t=>t.id===state.cur);
function ts(id){const s=state.tests[id]||(state.tests[id]={});s.a=s.a||{};s.chk=s.chk||{};s.s=s.s||{};s.w=s.w||{};s.plays=s.plays||{};return s}

/* ---------- index items ---------- */
TESTS.forEach(t=>t.secs.forEach(s=>{s.items=[];(s.parts||[]).forEach((p,pi)=>p.items.forEach((it,ii)=>{it.id=s.k+'-'+pi+'-'+ii;it.part=p;s.items.push(it)}));
  const grp={};s.items.forEach(it=>{if(it.grp){(grp[it.grp]=grp[it.grp]||[]).push(it)}});
  Object.values(grp).forEach(arr=>arr.forEach((it,i)=>{it.sibs=arr.slice(0,i).map(x=>x.id)}));}));

/* ---------- viewer & data (filled in asynchronously) ---------- */
const RT={ready:false,user:null,db:null,owner:false,uid:null,canWrite:null,sync:'local',docKey:null,remote:null,writeErr:null,downloads:null,all:[]};
const teacherUI=()=>RT.owner||(RT.ready?RT.sync==='local'&&!RT.user:!window.claude);
const studentLocked=()=>RT.ready&&!RT.owner&&!!RT.user;

/* ---------- theme ---------- */
const themeSel=$('#theme');
function applyTheme(){if(state.theme)document.documentElement.setAttribute('data-theme',state.theme);else document.documentElement.removeAttribute('data-theme');themeSel.value=state.theme||''}
themeSel.onchange=()=>{state.theme=themeSel.value;applyTheme();save()};applyTheme();

/* ---------- answer checking ---------- */
function norm(s){s=String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().replace(/[.!?,;:]+$/,'').replace(/^(to|an|a|the) (?=\S)/,'');
  s=s.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'cannot').replace(/n't\b/g,' not').replace(/'ve\b/g,' have').replace(/'re\b/g,' are').replace(/'ll\b/g,' will').replace(/'m\b/g,' am').replace(/'d\b/g,' had');
  return s.replace(/\s*-\s*/g,'-').replace(/\s+/g,' ').trim()}
function loose(s){return norm(s).replace(/[^a-z0-9 ]+/g,'').replace(/\s+/g,' ').trim()}
function filled(it,v){if(it.t==='gap')return Array.isArray(v)&&v.some(x=>x&&String(x).trim());return v!==undefined&&v!==null&&v!==''}
function gapOK(it,i,x){const alts=(it.a[i]||[]);const f=it.loose?loose:norm;const pre=(it.pre||[])[i];const g=f(x);
  return alts.some(al=>{const n=f(al);if(g===n)return true;if(pre&&n.startsWith(pre.toLowerCase())&&g===n.slice(pre.length))return true;return false})}
function correct(it,v,A){
  if(it.t==='gap'){if(!Array.isArray(v))return false;
    if(it.any){const used=new Set();return v.length>=it.a.length&&it.a.every((_,k)=>{const x=v[k];const j=it.a.findIndex((al,i)=>!used.has(i)&&gapOK(it,i,x));if(j<0)return false;used.add(j);return true})}
    return it.a.every((al,i)=>gapOK(it,i,v[i]||''))}
  if(it.t==='match'&&Array.isArray(it.a)){if(!it.a.includes(v))return false;return !(it.sibs||[]).some(id=>A&&A[id]===v)}
  if(it.t==='pick'&&Array.isArray(it.a))return it.a.includes(v);
  return v===it.a}
function keyText(it){if(it.t==='gap')return it.a.map(a=>(a||[]).join(' / ')).join(' … ');if(it.t==='mc')return L[it.a]+'  '+strip(it.o[it.a]);if(it.t==='pron')return L[it.a]+'  '+it.o[it.a].replace(/[*_]/g,'');if(it.t==='stress')return it.w.map((s,i)=>i===it.a?s.toUpperCase():s).join('·');if(Array.isArray(it.a))return it.a.join(' / ');return it.a}
function ansText(it,v){if(!filled(it,v))return '—';if(it.t==='gap')return v.filter(Boolean).join(' … ');if(it.t==='mc'||it.t==='pron')return L[v]+'  '+strip((it.o[v]||'')).replace(/[*_]/g,'');if(it.t==='stress')return it.w.map((s,i)=>i===v?s.toUpperCase():s).join('·');return String(v)}
const reveal=t=>state.mode==='practice'||ts(t.id).marked;
function final(t,it){const st=ts(t.id),v=st.a[it.id];if(st.marked)return true;if(state.mode!=='practice')return false;return it.t==='gap'?!!st.chk[it.id]:filled(it,v)}

/* ---------- scoring (works for local state and stored records) ---------- */
const secOf=(t,k)=>t.secs.find(s=>s.k===k);
const isTeacherSec=s=>!!(s.writing||s.speaking||(s.k==='l'&&s.manual));
function critMax(s){if(s.writing)return s.writing.crit.reduce((a,c)=>a+c[1],0);const S=s.speaking;if(S.mode==='crit')return S.crit.reduce((a,c)=>a+c[1],0);if(S.mode==='overall')return S.max;return S.tasks.length*10}
function teacherScore(s,marks){if(!marks)return 0;const v=Object.values(marks).reduce((a,b)=>a+(+b||0),0);return Math.min(v,s.max)}
function recScore(t,rec){ // rec: {a, s, w, all:true}
  const out={};let tot=0,auto=0,autoMax=0,pending=false;
  t.secs.forEach(s=>{let sc;
    if(s.writing){sc=teacherScore(s,rec.w);if(!rec.w||!Object.keys(rec.w).length)pending=true}
    else if(s.speaking){sc=teacherScore(s,rec.s);if(!rec.s||!Object.keys(rec.s).length)pending=true}
    else{sc=s.items.reduce((a,it)=>a+((rec.fin?rec.fin(it):true)&&correct(it,rec.a[it.id],rec.a)?s.w:0),0);auto+=sc;autoMax+=s.max}
    out[s.k]=sc;tot+=sc});
  return {secs:out,tot,auto,autoMax,pending,max:t.secs.reduce((a,s)=>a+s.max,0)}}
/* stored answers and marks are JSON strings so a later write replaces them (the class record merges nested objects) */
function recA(r){if(!r)return {};if(typeof r.aj==='string'){try{return JSON.parse(r.aj)}catch(e){}}return r.a||{}}
function recTM(r){if(!r)return null;if(typeof r.tmj==='string'){try{return JSON.parse(r.tmj)}catch(e){}}return r.tm||null}
function localRec(t){const st=ts(t.id);const tm=recTM(RT.remote&&RT.remote.tests&&RT.remote.tests[t.id]);
  const useRemote=studentLocked()&&tm;return {a:st.a,s:useRemote?(tm.s||{}):st.s,w:useRemote?(tm.w||{}):st.w,fin:it=>final(t,it)}}
function secScore(t,s){return recScore(t,localRec(t)).secs[s.k]}
function secDone(t,s){const st=ts(t.id);const r=localRec(t);
  if(s.writing)return Object.keys(r.w||{}).length;if(s.speaking)return Object.keys(r.s||{}).length;
  return s.items.filter(it=>state.mode==='practice'&&!st.marked?final(t,it):filled(it,st.a[it.id])).length}
function secCount(t,s){if(s.writing)return s.writing.crit.length;if(s.speaking){const S=s.speaking;return S.mode==='crit'?S.crit.length:S.mode==='overall'?1:S.tasks.length}return s.items.length}
function secAttempted(t,s){if(s.writing||s.speaking)return secDone(t,s)?s.max:0;return s.items.filter(it=>final(t,it)).length*s.w}
function band(p){if(p>=90)return'Excellent';if(p>=75)return'Good';if(p>=60)return'Satisfactory';if(p>=40)return'Needs revision';return'Needs a lot of revision'}

/* ---------- formatting ---------- */
function fmtPron(s){return esc(s).replace(/\*(.+?)\*/g,'<b class="snd">$1</b>').replace(/_(.+?)_/g,'<u class="str">$1</u>')}
function safeHtml(s){return esc(s).replace(/&lt;(\/?)(b|i|em|u|br|p)&gt;/g,'<$1$2>').replace(/&lt;span class=&quot;hint&quot;&gt;/g,'<span class="hint">').replace(/&lt;\/span&gt;/g,'</span>')}
function fmtStem(s,fill){
  return String(s).split('\n').map(line=>{let m=line.match(/^([AB]):\s*(.*)$/);let pre='';if(m){pre='<span class="spk">'+m[1]+'</span>';line=m[2]}
    const parts=line.split(/_{3,}/);
    return pre+parts.map(safeHtml).join(fill!=null?'<span class="blank filled">'+esc(fill)+'</span>':'<span class="blank" aria-label="gap"></span>')}).join('<br>')}

/* ---------- nav ---------- */
function shortTitle(t){return t.kind==='file'||t.kind==='progress'?('Test '+t.ver):t.title}
function groupTitle(g){const t=g[0];if(t.kind==='file')return t.title.replace(/ Test [AB]$/,'');if(t.kind==='progress')return t.title.replace(/^Progress Test /,'').replace(/ [AB]$/,'');return t.title}
function testTotal(t){return recScore(t,localRec(t)).tot}
function renderNav(){
  let h='';
  if(RT.owner)h+='<div class="tview"><button data-view="teacher" aria-pressed="'+(state.view==='teacher')+'">Teacher dashboard'+(RT.all.length?'<span class="mini">'+RT.all.length+'</span>':'')+'</button><button data-view="tests" aria-pressed="'+(state.view!=='teacher')+'">Tests</button></div>';
  for(const c of COLLECTIONS){if(!c.items.length)continue;h+='<h2>'+esc(c.name)+'</h2><ul>';
    for(const g of c.items){
      if(g.length===1){const t=g[0];const any=t.secs.some(s=>secDone(t,s)>0);
        h+='<li><button data-test="'+t.id+'" aria-current="'+(t.id===state.cur&&state.view!=='teacher')+'"><span>'+esc(t.title)+'</span><span class="mini">'+(any&&reveal(t)?testTotal(t):'')+'</span></button></li>'}
      else{h+='<li class="pair"><span class="pname">'+esc(groupTitle(g))+'</span><span class="pbtns">'+g.map(t=>'<button data-test="'+t.id+'" aria-current="'+(t.id===state.cur&&state.view!=='teacher')+'" aria-label="'+esc(t.title)+'">'+esc(t.ver)+'</button>').join('')+'</span></li>'}}
    h+='</ul>'}
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>goTest(b.dataset.test));
  $('#nav').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;save();renderAll();window.scrollTo(0,0)});
}
function viewSwitch(){if(!RT.owner)return '';const tv=state.view==='teacher';
  return '<div class="vswitch" role="group" aria-label="Switch view"><button data-v="tests" aria-pressed="'+(!tv)+'">Tests <span class="vsub">student view</span></button><button data-v="teacher" aria-pressed="'+tv+'">Teacher dashboard'+(RT.all.length?' <span class="vsub">'+RT.all.length+' result'+(RT.all.length===1?'':'s')+'</span>':'')+'</button></div>'}
function bindSwitch(){document.querySelectorAll('.vswitch [data-v]').forEach(b=>b.onclick=()=>{if(b.dataset.v==='tests'&&!TESTS.find(t=>t.id===state.cur))state.cur=TESTS[0].id;state.view=b.dataset.v;save();renderAll();window.scrollTo(0,0)})}
function goTest(id){stopAudio();stopTimer();state.view='tests';state.cur=id;state.sec=TESTS.find(t=>t.id===id).secs[0].k;save();renderAll();window.scrollTo(0,0)}

/* ---------- main ---------- */
function renderMain(){
  if(state.view==='teacher'&&RT.owner){renderTeacher();return}
  const t=T();if(!secOf(t,state.sec))state.sec=t.secs[0].k;
  let h=viewSwitch()+'<div class="mobile-pick"><label for="mpick" class="sub" style="font-size:.85rem;color:var(--muted)">Test</label><select id="mpick">'+COLLECTIONS.map(c=>'<optgroup label="'+esc(c.name)+'">'+c.items.flat().map(x=>'<option value="'+x.id+'"'+(x.id===t.id?' selected':'')+'>'+esc(x.title)+'</option>').join('')+'</optgroup>').join('')+'</select>'+'</div>';
  h+='<section class="head"><h1>'+esc(t.title)+'</h1><p class="focus">'+esc(t.focus)+'</p><div class="who">'+
     '<label>Student name<input id="sname" value="'+esc(state.name)+'" autocomplete="off"></label>'+
     '<label>Class<input id="sclass" value="'+esc(state.cls)+'" autocomplete="off" style="min-width:110px"></label>'+
     '<div class="mode" role="group" aria-label="Marking mode"><button data-mode="practice" aria-pressed="'+(state.mode==='practice')+'">Instant marking</button><button data-mode="exam" aria-pressed="'+(state.mode==='exam')+'">Exam mode</button></div>'+
     '<p class="modehint">'+(state.mode==='practice'?'Each answer is marked as soon as it is chosen (typed answers when you press Check), and the score updates live. First answer counts.':'Answers stay hidden until you press “Mark test”. Answers can be changed until then.')+'</p>'+syncNote()+'</div></section>';
  h+='<div class="tabs" role="tablist">'+t.secs.map(s=>'<button role="tab" data-sec="'+s.k+'" aria-selected="'+(state.sec===s.k)+'">'+s.name+'<span class="badge">'+badge(t,s)+'</span></button>').join('')+'</div>';
  h+='<section class="sec" id="sec">'+renderSec(t,secOf(t,state.sec))+'</section>';
  const i=t.secs.findIndex(s=>s.k===state.sec);
  h+='<div class="pager">'+(i>0?'<button data-go="'+t.secs[i-1].k+'">Back to '+t.secs[i-1].name+'</button>':'<span></span>')+(i<t.secs.length-1?'<button data-go="'+t.secs[i+1].k+'">Continue to '+t.secs[i+1].name+'</button>':'<span></span>')+'</div>';
  const m=$('#main');m.innerHTML=h;
  $('#mpick').onchange=e=>goTest(e.target.value);
  bindSwitch();
  $('#sname').oninput=e=>{state.name=e.target.value;save();renderLedger();queueSync()};
  $('#sclass').oninput=e=>{state.cls=e.target.value;save();renderLedger();queueSync()};

/* ---------- result codes ---------- */
function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function pack(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if('CompressionStream' in window){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return 'IFA1.'+b64u(buf)}catch(e){}}
  return 'IFA0.'+b64u(raw)}
async function unpack(code){code=String(code).trim().replace(/\s+/g,'');const m=code.match(/^IFA([01])\.(.+)$/);if(!m)throw new Error('This doesn’t look like an IF Academy result code.');
  let bytes=unb64u(m[2]);if(m[1]==='1'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(bytes))}
/* hand in also saves the result to the student's profile and the teachers' results page */

setTimeout(ifPullMarks,2500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)ifPullMarks()});

/* ---------- database sync ---------- */
const slug=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x';
function recordFor(t){const st=ts(t.id);return {aj:JSON.stringify(st.a||{}),wt:st.wt==null?null:st.wt,wr:st.wr||'',wai:st.ai?JSON.stringify(st.ai):'',marked:!!st.marked,handed:!!st.handed,plays:st.plays||{},upd:new Date().toISOString(),mode:state.mode}}
let syncing=false,syncAgain=false,docExists={};
function queueSync(now){if(!RT.db||(RT.sync!=='live'&&!RT.owner))return;clearTimeout(saveTimer);saveTimer=setTimeout(doSync,now?50:2500)}
function currentKey(){if(RT.owner){if(!state.name.trim())return null;return 'dev-'+slug(state.name)+'--'+slug(state.cls)}return RT.uid}
async function doSync(){
  if(syncing){syncAgain=true;return}
  const key=currentKey();if(!key||!RT.db)return;const t=T();if(!t)return;
  syncing=true;
  try{
    const ref=RT.db.doc('results/'+key);
    const rec=recordFor(t);
    if(RT.owner){const st=ts(t.id);rec.tmj=JSON.stringify({w:st.w||{},s:st.s||{}})}
    const head={name:state.name||'',cls:state.cls||'',updated:new Date().toISOString(),src:RT.owner?'device':'student'};
    if(!docExists[key]){const g=await ref.get();docExists[key]=g.exists;
      if(!g.exists){await ref.set(Object.assign({},head,{tests:{[t.id]:rec}}));docExists[key]=true;syncing=false;if(syncAgain){syncAgain=false;doSync()}return}}
    await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}));
    RT.writeErr=null;
  }catch(e){
    if(!RT.owner&&e&&e.code==='invalid_argument'){RT.sync='code';RT.writeErr=null;renderAll()}
    else if(e&&e.code==='quota_exceeded'){RT.writeErr='The class record is full. Ask your teacher to remove old results.';renderLedger()}
    else if(e&&e.code==='unavailable'){setTimeout(queueSync,4000)}
  }
  syncing=false;if(syncAgain){syncAgain=false;doSync()}
}
async function initRuntime(){
  if(!window.claude||typeof window.claude.use!=='function'){RT.ready=true;RT.sync='local';renderAll();return}
  let user=null,db=null,dl=null;
  try{[user,db,dl]=await Promise.all([claude.use('user'),claude.use('db'),claude.use('downloads')])}catch(e){}
  RT.user=user;RT.db=db;RT.downloads=dl;
  if(user){try{RT.owner=await user.isOwner();RT.uid=await user.id();RT.canWrite=await user.can('data.write')}catch(e){}}
  if(RT.owner&&db){RT.sync='owner';subscribeAll()}
  else if(db&&user&&RT.uid&&RT.canWrite!==false){RT.sync='live';subscribeMine()}

  h+='</tbody></table></div>';
  h+='<div id="detail">'+(TV.sel?detailHtml(all.find(r=>r.doc+'|'+r.id===TV.sel)):'')+'</div>';
  h+='<section class="task share"><h3>Sending a test to students</h3><ol class="steps"><li>Open the <b>Share</b> menu at the top of this page and copy the link. Every student uses the same link.</li><li>Tell the class which test to open, for example “Part 2, Test A”. On a phone they choose it from the <b>Test</b> list at the top; on a computer, from the list on the left.</li><li>Students type their name and class on the test. If they’re signed in to your organization with Contributor access, their results appear here as they work. Anyone else presses <b>Send results to teacher</b> and sends you the code to paste below.</li></ol><p class="meta">To see a test exactly as students see it, press <b>Tests</b> at the top. Answers you type there are saved under the name and class you enter, so leave those blank, or use your own name, when you’re only checking a test.</p></section>';
  h+='<section class="task"><h3>Import a result code</h3><p class="meta">Paste the code a student sent you. It’s rescored from their answers and added to the class record.</p><textarea id="impta" class="imp" placeholder="IFA1.…"></textarea><div class="row" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="go" id="impbtn"'+(RT.db?'':' disabled')+'>Import</button><span id="impmsg" class="meta">'+esc(TV.msg)+'</span></div></section>';
  const m=$('#main');const y=window.scrollY;m.innerHTML=h;if(keepScroll)window.scrollTo(0,y);
  $('#ftest').onchange=e=>{TV.test=e.target.value;renderTeacher(true)};
  $('#fcls').onchange=e=>{TV.cls=e.target.value;renderTeacher(true)};
  $('#fq').oninput=e=>{TV.q=e.target.value;const p=e.target.selectionStart;renderTeacher(true);const f=$('#fq');f.focus();f.setSelectionRange(p,p)};
  m.querySelectorAll('[data-row]').forEach(tr=>{const go=()=>{TV.sel=TV.sel===tr.dataset.row?null:tr.dataset.row;renderTeacher(true);const d=$('#detail');if(d&&TV.sel)d.scrollIntoView({behavior:'smooth',block:'start'})};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  const cb=$('#csvbtn');if(cb)cb.onclick=()=>downloadCsv(list);
  $('#impbtn').onclick=importCode;bindSwitch();
  bindDetail(all);
}
function detailHtml(r){
  if(!r)return '';const t=r.t,rec={a:recA(r.r)},tm=recTM(r.r)||{s:{},w:{}};
  let h='<section class="detail"><div class="dhead"><div><h2>'+esc(r.name)+(r.cls?' <span class="muted">'+esc(r.cls)+'</span>':'')+'</h2><p class="meta">'+esc(t.title)+'. '+r.answered+' of '+r.items+' questions answered. Updated '+esc(fmtTime(r.upd))+'.</p></div><div class="big"><span class="num">'+r.sc.tot+'</span><span class="of">/ '+r.sc.max+'</span></div></div>';
  if(r.r.dm)h+='<p class="syncnote">The writing and speaking marks below were entered on the student’s device. Check them and change any that aren’t yours.</p>';h+='<div class="secscores">'+t.secs.map(s=>'<div><span>'+s.name+'</span><b>'+r.sc.secs[s.k]+' / '+s.max+'</b></div>').join('')+'</div>';
  t.secs.forEach(s=>{
    if(s.writing){const W=s.writing;
      h+='<h3 class="part">Writing</h3>'+(r.r.wt!=null&&W.tasks?'<p class="meta">Task chosen: '+(r.r.wt+1)+'</p>':'')+'<div class="wrview">'+(r.r.wr?esc(r.r.wr).replace(/\n/g,'<br>'):'<span class="muted">No writing yet.</span>')+'</div><p class="meta">'+wc(r.r.wr)+' words</p>';
      h+=W.crit.map((c,i)=>rateRow('data-tw',i,c[1],(tm.w||{})[i],c[0]+' (0–'+c[1]+')')).join('<div style="height:6px"></div>')+'<div class="aiw-slot"></div>';return}
    if(s.speaking){const S=s.speaking;h+='<h3 class="part">Speaking</h3><p class="meta">Mark after listening to the student in class.</p>';
      if(S.mode==='crit')h+=S.crit.map((c,i)=>rateRow('data-ts',i,c[1],(tm.s||{})[i],c[0]+' (0–'+c[1]+')')).join('<div style="height:6px"></div>');
      else if(S.mode==='overall')h+=rateRow('data-ts',0,S.max,(tm.s||{})[0],'Mark (0–'+S.max+')');
      else h+=speakTasks(S).map((tk,i)=>rateRow('data-ts',i,10,(tm.s||{})[i],'Task '+(i+1))).join('<div style="height:6px"></div>');
      return}
    const wrong=s.items.filter(it=>!correct(it,rec.a[it.id],rec.a)).length;
    h+='<details class="ans"><summary><b>'+s.name+'</b> '+r.sc.secs[s.k]+' / '+s.max+(wrong?' <span class="muted">('+wrong+' wrong or blank)</span>':'')+'</summary><table class="atable"><thead><tr><th>#</th><th>Question</th><th>Answer</th><th>Key</th></tr></thead><tbody>';
    let n=0;(s.parts||[]).forEach(p=>{p.items.forEach(it=>{n++;const v=rec.a[it.id];const ok=correct(it,v,rec.a);
      const q=strip(it.t==='stress'?it.w.join(''):it.t==='mc'&&!it.q?(it.o||[]).join(' / '):it.qh||it.q||'').replace(/\{\}/g,'___').replace(/\[([^\]]*)\]/g,(m,x)=>'['+x.replace(/\|/g,' / ')+']');
      h+='<tr class="'+(ok?'ok':'no')+'"><td>'+n+'</td><td>'+esc(q.length>110?q.slice(0,108)+'…':q)+'</td><td>'+esc(ansText(it,v))+'</td><td>'+(ok?'✓':esc(keyText(it)))+'</td></tr>'})});
    h+='</tbody></table></details>';
  });
  h+='<div class="row" style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="ghost" id="delrec">Remove this result</button></div></section>';
  return h;
}
function bindDetail(all){
  if(!TV.sel)return;const r=all.find(x=>x.doc+'|'+x.id===TV.sel);if(!r)return;
  const setMark=async(kind,i,n)=>{const tm=JSON.parse(JSON.stringify(recTM(r.r)||{s:{},w:{}}));tm[kind]=tm[kind]||{};if(tm[kind][i]===n)delete tm[kind][i];else tm[kind][i]=n;
    r.r.tmj=JSON.stringify(tm);renderTeacher(true);
    try{await RT.db.doc('results/'+r.doc).update({tests:{[r.id]:{tmj:JSON.stringify(tm)}}})}catch(e){TV.msg='Couldn’t save the mark. Try again.';renderTeacher(true)}};
  document.querySelectorAll('[data-tw]').forEach(b=>b.onclick=()=>setMark('w',+b.dataset.tw,+b.dataset.n));
  const aslot=document.querySelector('.aiw-slot'),wsec=r.t.secs.find(x=>x.writing);if(aslot&&wsec&&window.IFAIW){const txt=r.r.wr||'';let sv=null;try{sv=r.r.wai?JSON.parse(r.r.wai):null}catch(e){}
    IFAIW.panel(aslot,Object.assign(aiwCfg(r.t,wsec,r.r.wt),{key:'t:'+TV.sel+':'+IFAIW.hash(txt),mode:'teacher',getText:()=>txt,stored:sv&&sv.h===IFAIW.hash(txt)?sv:null,
      apply:async res=>{const tm=JSON.parse(JSON.stringify(recTM(r.r)||{s:{},w:{}}));tm.w={};res.s.forEach((v,i)=>tm.w[i]=v);r.r.tmj=JSON.stringify(tm);renderTeacher(true);
        try{await RT.db.doc('results/'+r.doc).update({tests:{[r.id]:{tmj:JSON.stringify(tm)}}})}catch(e){TV.msg='Couldn’t save the mark. Try again.';renderTeacher(true)}}}))}
  document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>setMark('s',+b.dataset.ts,+b.dataset.n));
  const del=$('#delrec');if(del)del.onclick=async()=>{if(!await uiConfirm('Remove '+r.name+'’s result for '+r.t.title+'? This can’t be undone.'))return;
    try{const ref=RT.db.doc('results/'+r.doc);const g=await ref.get();if(g.exists){const d=JSON.parse(JSON.stringify(g.data()));delete (d.tests||{})[r.id];
      if(Object.keys(d.tests||{}).length)await ref.set(d);else await ref.delete()}TV.sel=null}catch(e){TV.msg='Couldn’t remove that result.'}renderTeacher(true)};
}
async function importCode(){
  const raw=$('#impta').value;if(!raw.trim())return;
  try{const o=await unpack(raw);const t=TESTS.find(x=>x.id===o.id);if(!t)throw new Error('That code is for a test this page doesn’t have.');
    if(!o.n)throw new Error('The code has no student name.');
    const key='imp-'+slug(o.n)+'--'+slug(o.c);const ref=RT.db.doc('results/'+key);const g=await ref.get();
    const rec={aj:JSON.stringify(o.a||{}),wt:o.wt==null?null:o.wt,wr:o.wr||'',marked:true,handed:true,plays:o.pl||{},upd:o.at||new Date().toISOString(),mode:'code'};
    const prev=g.exists&&g.data().tests&&recTM(g.data().tests[o.id]);const dm=o.m&&(Object.keys(o.m.s||{}).length||Object.keys(o.m.w||{}).length);if(prev&&(Object.keys(prev.s||{}).length||Object.keys(prev.w||{}).length))rec.tmj=JSON.stringify(prev);else if(dm){rec.tmj=JSON.stringify({s:o.m.s||{},w:o.m.w||{}});rec.dm=true}
    if(g.exists)await ref.update({name:o.n,cls:o.c||'',updated:new Date().toISOString(),src:'import',tests:{[o.id]:rec}});
    else await ref.set({name:o.n,cls:o.c||'',updated:new Date().toISOString(),src:'import',tests:{[o.id]:rec}});
    const sc=recScore(t,{a:o.a||{},s:{},w:{}});
    TV.msg='Imported '+o.n+(o.c?' ('+o.c+')':'')+', '+t.title+': '+sc.auto+' / '+sc.autoMax+' on the automatically marked sections.';TV.sel=key+'|'+o.id;$('#impta').value='';
  }catch(e){TV.msg=(e&&e.message)||'That code couldn’t be read. Check it was copied in full.'}
  renderTeacher(true);
}
async function downloadCsv(list){
  const head=['Student','Class','Test','Status','Updated'].concat(['Grammar','Vocabulary','Pronunciation','Reading','Writing','Listening','Speaking'],['Total','Max','Percent']);
  const keyOf={Grammar:'g',Vocabulary:'v',Pronunciation:'p',Reading:'r',Writing:'w',Listening:'l',Speaking:'s'};
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')].concat(list.map(r=>[r.name,r.cls,r.t.title,r.r.handed?'Handed in':r.r.marked?'Marked':'In progress',r.upd].concat(['Grammar','Vocabulary','Pronunciation','Reading','Writing','Listening','Speaking'].map(n=>{const s=secOf(r.t,keyOf[n]);return s?r.sc.secs[s.k]:''}),[r.sc.tot,r.sc.max,Math.round(r.sc.tot/r.sc.max*100)]).map(q).join(',')));
  try{await RT.downloads.save({filename:'if-academy-c1-results.csv',data:new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'})})}catch(e){}
}
function renderTeacherLedger(){
  const all=rows();const students=new Set(all.map(r=>r.doc));const toMark=all.filter(r=>r.sc.pending&&(r.r.marked||r.r.handed)).length;
  let h='<div class="card-l"><div class="t">Class record</div><div class="st">'+(RT.db?'Live':'Not available in this view')+'</div>'+
    '<div class="big"><span class="num">'+all.length+'</span><span class="of">results</span></div><div class="pct">'+students.size+' student'+(students.size===1?'':'s')+(toMark?'<br><b>'+toMark+'</b> handed in and waiting for writing or speaking marks':'')+'</div>'+
    '<p class="src">Students who are members of your organization with Contributor access save automatically. Students outside it use “Send results to teacher” and send you the code. Results typed on your own device are saved under the name and class entered on the test.</p></div>';
  $('#ledger').innerHTML=h;
  $('#mtotal').innerHTML='<span>Teacher dashboard</span><b>'+all.length+'</b><button id="mjump">Summary</button>';
  $('#mjump').onclick=()=>$('#ledger').scrollIntoView({behavior:'smooth'});
}

function renderAll(){renderNav();renderMain();renderLedger()}
renderAll();
initRuntime();
})();
