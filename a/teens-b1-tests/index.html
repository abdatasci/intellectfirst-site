ough."], ["", "The first lesson is to accept repetitive training. ‘We practise the same moves hundreds of times,’ Timur says. ‘It’s boring sometimes, but in a match my body knows what to do without thinking.’"], ["", "The second lesson is to learn from mistakes. Timur’s coach films every game. Instead of feeling ashamed when they lose, the players watch the video together and talk about what went wrong."], ["", "The third lesson is about support. Timur’s parents drive him to training four times a week, and his older sister helps him with the homework he misses. ‘I couldn’t do it alone,’ he says. ‘When I win a medal, it’s our medal.’"]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "When does Timur train on Saturdays?", "o": ["in the afternoon", "early in the morning", "late at night"], "a": 1}, {"t": "mc", "q": "Why does Timur practise the same moves many times?", "o": ["because his coach is very strict", "so he can do them automatically in a match", "because he finds it exciting"], "a": 1}, {"t": "mc", "q": "What does the team do after losing a game?", "o": ["watch a video of it together", "train for longer", "stop talking about it"], "a": 0}, {"t": "mc", "q": "How does Timur’s sister help him?", "o": ["She drives him to training.", "She films his games.", "She helps him with homework."], "a": 2}, {"t": "mc", "q": "What does Timur mean by ‘it’s our medal’?", "o": ["He shares his medals with his team.", "He hasn’t won a medal yet.", "His family helped him win it."], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a radio presenter interviewing Zarina, a young boxer.", "script": [["Presenter", "Today I’m talking to Zarina, who won a gold medal at the national youth boxing championship. Congratulations!"], ["Zarina", "Thank you! I’m still a bit shocked."], ["Presenter", "When did you start boxing?"], ["Zarina", "When I was ten. My older brother went to a club, and I wanted to do everything he did."], ["Presenter", "What’s the hardest part of training?"], ["Zarina", "Honestly, it’s the running. We go running at seven every morning, even in winter, when it’s minus twenty."], ["Presenter", "Do you ever want to give up?"], ["Zarina", "Sometimes, after a loss. But my coach says every defeat teaches you something."], ["Presenter", "What’s next for you?"], ["Zarina", "I want to pursue boxing at university and, one day, compete at the Olympics."]]}, "parts": [{"items": [{"t": "mc", "q": "What did Zarina win?", "o": ["a silver medal", "a gold medal", "a running race"], "a": 1}, {"t": "mc", "q": "Why did she start boxing?", "o": ["She wanted to copy her brother.", "Her parents made her.", "Her school had a club."], "a": 0}, {"t": "mc", "q": "What is the hardest part of training for her?", "o": ["running in the morning", "lifting weights", "eating healthily"], "a": 0}, {"t": "mc", "q": "What does her coach say about losing?", "o": ["It is never acceptable.", "It only happens to beginners.", "You can learn from it."], "a": 2}, {"t": "mc", "q": "What does Zarina want to do in the future?", "o": ["become a coach", "compete at the Olympics", "stop boxing"], "a": 1}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "-ive adjectives (competitive, creative, active); play / do / go + sport; medal, criticise, willing, accomplish.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences.", "prompts": ["Which sports do you play, do or go?", "Are you a competitive person? Give an example.", "How do you feel when someone criticises you?", "What would you like to accomplish this year?"]}, {"name": "Task", "mins": 3, "lead": "The student compares and contrasts each pair of sports: equipment, place, play / do / go, and which is more competitive.", "prompts": ["football and tennis", "swimming and skiing", "boxing and karate"]}]}}]}, {"id": "t34", "kind": "quick", "group": "t3.4", "title": "Unit 3.4 Test", "focus": "3.4 Being a sports fan: nouns with the suffix -ment (commitment, disappointment, achievement); sports fan and football vocabulary (victory, loss, league, loyal, referee, kick off…).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "disappoint → ___", "o": ["disappointness", "disappointment", "disappointion"], "a": 1}, {"t": "mc", "q": "Playing for a team is a big ___ – you have to train three times a week.", "o": ["commitment", "commitness", "commition"], "a": 0}, {"t": "mc", "q": "There was a lot of ___ in the stadium before the final.", "o": ["excitness", "excitity", "excitement"], "a": 2}, {"t": "mc", "q": "Winning the league was a great ___ for such a small club.", "o": ["achievation", "achievence", "achievement"], "a": 2}, {"t": "mc", "q": "The injured player needed medical ___.", "o": ["treatation", "treatment", "treatness"], "a": 1}, {"t": "mc", "q": "Which word does NOT make a noun with -ment?", "o": ["happy", "enjoy", "agree"], "a": 0}, {"t": "mc", "q": "The fans were shocked by the ___ that the stadium would close.", "o": ["announcement", "announcion", "announcity"], "a": 0}, {"t": "mc", "q": "Which noun comes from the verb ‘improve’?", "o": ["improvation", "improvement", "improvity"], "a": 1}, {"t": "mc", "q": "We made an ___ to meet outside the stadium after the match.", "o": ["arrangation", "arrangeness", "arrangement"], "a": 2}, {"t": "mc", "q": "Her parents gave her lots of ___ before the race.", "o": ["encouragation", "encouragement", "encouragence"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Success in a game or competition = ___", "o": ["loss", "league", "victory"], "a": 2}, {"t": "mc", "q": "A defeat = ___", "o": ["loss", "victory", "commitment"], "a": 0}, {"t": "mc", "q": "A group of teams that play each other for points is a ___.", "o": ["league", "kit", "mechanism"], "a": 0}, {"t": "mc", "q": "A game played at the other team’s stadium is an ___ game.", "o": ["home", "away", "out"], "a": 1}, {"t": "mc", "q": "Always supporting someone or something = ___", "o": ["psychological", "away", "loyal"], "a": 2}, {"t": "mc", "q": "Connected with the mind = ___", "o": ["psychological", "loyal", "physical"], "a": 0}, {"t": "mc", "q": "To give money, time or skills to help achieve something = ___", "o": ["commit", "contribute", "disappoint"], "a": 1}, {"t": "mc", "q": "The person who controls a football match is the ___.", "o": ["goalkeeper", "coach", "referee"], "a": 2}, {"t": "mc", "q": "The number of people a stadium can hold is its ___.", "o": ["capacity", "quantity", "league"], "a": 0}, {"t": "mc", "q": "The shirts, shorts and socks a team wears are its ___.", "o": ["costume", "dress", "kit"], "a": 2}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "The match will <b>k</b>{} off at 7 p.m.", "a": [["ick"]], "pre": ["k"]}, {"t": "gap", "q": "The fans couldn’t stop <b>c</b>{} when we scored.", "a": [["heering"]], "pre": ["c"]}, {"t": "gap", "q": "The <b>g</b>{} made an amazing save with his left hand.", "a": [["oalkeeper"]], "pre": ["g"]}, {"t": "gap", "q": "He got a <b>y</b>{} card for a bad tackle. One more and he’ll be sent off.", "a": [["ellow"]], "pre": ["y"]}, {"t": "gap", "q": "The referee blew the final <b>w</b>{}, and the match was over.", "a": [["histle"]], "pre": ["w"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Why fans stay loyal", "paras": [["", "Nurlan’s team, the Steppe Eagles, has not won the league for twelve years. Last season they lost more games than they won. But every Saturday, Nurlan and his dad still put on their green scarves and go to the stadium."], ["", "Why do fans stay loyal? Psychologists say that supporting a team gives people a feeling of belonging. When you sing and cheer with thousands of other people, you feel part of a big family."], ["", "Even defeats can bring fans closer. After a painful loss, supporters often talk to each other and share their disappointment. Some research suggests this works like a mechanism that protects our mental health."], ["", "Of course, being a fan is also a commitment. Nurlan’s dad spends a lot of money on tickets and travels hundreds of kilometres to away games. ‘It’s not about winning,’ he laughs. ‘Well, maybe a little.’"]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "When did the Steppe Eagles last win the league?", "o": ["last season", "twelve years ago", "never"], "a": 1}, {"t": "mc", "q": "According to psychologists, supporting a team gives people ___.", "o": ["a feeling of belonging", "more free time", "a lot of money"], "a": 0}, {"t": "mc", "q": "What do fans often do after a defeat?", "o": ["stop going to games", "talk to each other about it", "change teams"], "a": 1}, {"t": "mc", "q": "Why is being a fan a commitment for Nurlan’s dad?", "o": ["He has to play for the team.", "He works at the stadium.", "It costs him time and money."], "a": 2}, {"t": "mc", "q": "What does Nurlan’s dad’s last comment show?", "o": ["Winning matters to him a little.", "He doesn’t care about winning at all.", "He wants to stop being a fan."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends, Kamila and Daniyar, talking about a football match.", "script": [["Daniyar", "How was the match on Saturday, Kamila?"], ["Kamila", "Amazing! We won two–one, and it was an away game, so that’s even better."], ["Daniyar", "Did you travel with the other fans?"], ["Kamila", "Yes, we caught a bus at eight in the morning. The journey took four hours!"], ["Daniyar", "Wow. Was the stadium full?"], ["Kamila", "Almost. It has a capacity of about twelve thousand, and our fans were in one corner, singing the whole time."], ["Daniyar", "Who scored?"], ["Kamila", "The other team scored first, from a penalty. Then our captain scored just before half-time, and our new striker got the winner in the last minute."], ["Daniyar", "Any cards?"], ["Kamila", "One of their defenders got a red card. The referee was very strict."]]}, "parts": [{"items": [{"t": "mc", "q": "What was the final score?", "o": ["1–1", "2–1 to the other team", "2–1 to Kamila’s team"], "a": 2}, {"t": "mc", "q": "How did Kamila travel to the match?", "o": ["by train", "by bus", "by car"], "a": 1}, {"t": "mc", "q": "How long did the journey take?", "o": ["eight hours", "four hours", "two hours"], "a": 1}, {"t": "mc", "q": "How did the other team score?", "o": ["from a penalty", "from a free kick", "with a header"], "a": 0}, {"t": "mc", "q": "Who got a red card?", "o": ["Kamila’s team captain", "the new striker", "one of the other team’s defenders"], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "-ment nouns (commitment, disappointment, excitement); victory, loss, loyal, league, away, referee.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences.", "prompts": ["Do you support a sports team? Why?", "What was the biggest disappointment you’ve had as a fan or a player?", "Why do you think fans are so loyal?", "Do you prefer watching sport at home or in a stadium?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Is being a sports fan good for you?", "Why do teams often lose more away games?", "Should clubs do more to support their fans?"]}]}}]}, {"id": "t35", "kind": "quick", "group": "t3.5", "title": "Unit 3.5 Test", "focus": "3.5 Are teenagers really lazy?: giving advice (If I were you, I’d…; Why don’t you…?; How about + -ing; I recommend + -ing; Perhaps you could…); adv  batteries. Apparently, teenagers’ bodies produce the chemical that makes us sleepy later at night than adults’ bodies, so sleeping late at the weekend is basically a way of catching up."], ["", "However, I understand why your parents are concerned. They probably miss spending time with you. If I were you, I’d talk to them and explain how tired you feel on Saturday mornings."], ["", "Why don’t you suggest a compromise? How about going hiking on Sunday afternoon instead of early in the morning? You could also invite a friend. That way, everyone gets what they want. Good luck! – Dana"]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "What does Arman do on weekday evenings?", "o": ["online games", "hiking", "homework"], "a": 2}, {"t": "mc", "q": "What does Arman’s mum want him to do?", "o": ["do more homework", "get up at 6.30 at the weekend", "go hiking with the family"], "a": 2}, {"t": "mc", "q": "According to Dana, why do teenagers sleep late?", "o": ["They play too many games.", "Their bodies make a sleep chemical later.", "They don’t have to go to school."], "a": 1}, {"t": "mc", "q": "Why are Arman’s parents probably concerned?", "o": ["They miss spending time with him.", "His school marks are bad.", "He doesn’t sleep enough."], "a": 0}, {"t": "mc", "q": "What compromise does Dana suggest?", "o": ["hiking every morning", "no hiking at all", "hiking in the afternoon"], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends, Aliya and Ruslan, talking about Ruslan’s problems.", "script": [["Ruslan", "I’m so tired, Aliya. I fell asleep in maths again."], ["Aliya", "Again? What time did you go to bed last night?"], ["Ruslan", "About one. I was catching up on a series."], ["Aliya", "Ruslan! If I were you, I’d turn off the screen by ten."], ["Ruslan", "I know, I know. But I can’t fall asleep early."], ["Aliya", "Why don’t you try reading a book instead? It works for me."], ["Ruslan", "Maybe. And my mum says I’m lazy because I never do any sport now."], ["Aliya", "How about joining the badminton club with me? It’s on Tuesdays and Thursdays after school."], ["Ruslan", "Badminton? That sounds fun, actually. Is it expensive?"], ["Aliya", "No, it’s free for students. I recommend bringing some water – it’s really energetic!"]]}, "parts": [{"items": [{"t": "mc", "q": "Where did Ruslan fall asleep?", "o": ["in a maths lesson", "on the bus", "in the library"], "a": 0}, {"t": "mc", "q": "Why did he go to bed late?", "o": ["He was doing homework.", "He was watching a series.", "He was playing badminton."], "a": 1}, {"t": "mc", "q": "What does Aliya suggest instead of screens?", "o": ["reading a book", "listening to music", "doing exercise"], "a": 0}, {"t": "mc", "q": "When is the badminton club?", "o": ["every day", "on Tuesdays and Thursdays", "at the weekend"], "a": 1}, {"t": "mc", "q": "How much does the club cost for students?", "o": ["a little", "a lot", "nothing"], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "If I were you, I’d…; Why don’t you…?; How about + -ing?; I recommend + -ing; apparently, basically, excuse, recharge your batteries.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences.", "prompts": ["Do you think teenagers are lazy? Why or why not?", "How do you recharge your batteries after a busy week?", "What excuses do people make for not doing exercise?", "Are the sports facilities in your area good?"]}, {"name": "Task", "mins": 3, "lead": "The teacher describes a problem; the student gives advice using a different phrase each time (If I were you…, Why don’t you…?, How about…?, I recommend…).", "prompts": ["I’m always tired at school.", "My parents say I spend too much time on my phone.", "I want to get fit, but I hate the gym."]}]}}]}, {"id": "t41", "kind": "quick", "group": "t4.1", "title": "Unit 4.1 Test", "focus": "4.1 Robot or hum ."], ["Madina", "That’s a bit disappointing. I wanted to meet one."], ["Timur", "Well, I’m sure we’ll find something in our lifetime. Maybe you’ll be the astronaut who finds it!"], ["Madina", "Me? I’m afraid of flying! I’ll stay on Earth, thanks."]]}, "parts": [{"items": [{"t": "mc", "q": "What have scientists found?", "o": ["an alien", "a new galaxy", "water on a planet"], "a": 2}, {"t": "mc", "q": "How far away is the planet?", "o": ["about ten light years", "about a hundred light years", "It’s in our solar system."], "a": 1}, {"t": "mc", "q": "What does Madina doubt?", "o": ["that aliens look like the ones in films", "that the news is true", "that there is water there"], "a": 0}, {"t": "mc", "q": "What does Timur think aliens are likely to be?", "o": ["tall and green", "very small, like bacteria", "similar to humans"], "a": 1}, {"t": "mc", "q": "Why won’t Madina become an astronaut?", "o": ["She doesn’t like science.", "She wants to be a teacher.", "She’s afraid of flying."], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "dependent prepositions (afraid of, depend on, believe in); speculation (bound to, likely, I doubt, no chance); universe, galaxy, orbit, alien.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences, using bound to, likely, I doubt or no chance where possible.", "prompts": ["What are you afraid of?", "Who can you always depend on?", "Do you believe in aliens? How likely is it that we will find them?", "Would you like to travel into space?"]}, {"name": "Statistics task", "mins": 3, "lead": "The student reads out each big number correctly and says what it shows.", "prompts": ["Our galaxy may contain up to 400,000,000,000 stars.", "The Sun is about 150,000,000 kilometres from the Earth.", "A ticket to a space hotel could cost $10,000,000.", "Which of these numbers surprises you most? Why?"]}]}}]}, {"id": "t43", "kind": "quick", "group": "t4. en? It’s inside, so it’s warm."], ["Dana", "Fine. But if a ghost jumps out at me, I’m holding your arm!"], ["Nurlan", "Deal. And after that, I’m going on the roller coaster alone."]]}, "parts": [{"items": [{"t": "mc", "q": "How many times does the roller coaster go upside down?", "o": ["two", "three", "once"], "a": 1}, {"t": "mc", "q": "How long is the queue for the roller coaster?", "o": ["twenty minutes", "an hour", "ten minutes"], "a": 0}, {"t": "mc", "q": "What happened to Dana on a big ride last year?", "o": ["She screamed and felt sick.", "She lost her phone.", "She got very wet."], "a": 0}, {"t": "mc", "q": "Why doesn’t Dana want to go on the water slide?", "o": ["It’s too fast.", "It goes upside down.", "It’s very cold today."], "a": 2}, {"t": "mc", "q": "What do they decide to do together?", "o": ["go on the roller coaster", "go to the haunted house", "go home"], "a": 1}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "extreme adjectives with absolutely / totally / completely; gradable adjectives with very / quite; scream, thrill, upside down, seek.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences.", "prompts": ["What are you afraid of?", "When was the last time you screamed?", "Have you ever been on a roller coaster? How did it feel?", "Do you like horror films? Why or why not?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student uses adverbs + extreme adjectives (absolutely terrifying, totally exhausted…).", "prompts": ["Why do some people love being scared?", "Is it a good idea to face your fears?", "Describe winter in Kostanay, your favourite food and a very long school day."]}]}}]}, {"id": "t44", "kind": "quick", "group": "t4.4", "title": "Unit 4.4 Test", "focus": "4.4 Science for all: relative clauses with who, which, that, whose and where; abbreviations (STEM, UK, VIP, Dr); STEM and equality vocabulary (diverse, obots,’ Dana explains. ‘The new ones show everyone.’"], ["", "Last spring, Dana’s team won a regional competition with a robot that sorts plastic for recycling. She now wants to study engineering at university. ‘I want to show younger girls that STEM is for them too,’ she says."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "How many girls are in the club now?", "o": ["two", "twenty", "ten"], "a": 2}, {"t": "mc", "q": "Why did the teacher invite women engineers?", "o": ["to judge a competition", "to teach programming lessons", "to make the club more diverse"], "a": 2}, {"t": "mc", "q": "What does the programmer’s team make?", "o": ["robots for schools", "apps for hospitals", "posters"], "a": 1}, {"t": "mc", "q": "What was wrong with the old posters?", "o": ["They showed only boys.", "They were too small.", "They had spelling mistakes."], "a": 0}, {"t": "mc", "q": "What did the team’s winning robot do?", "o": ["It sorted plastic for recycling.", "It cleaned classrooms.", "It played football."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends, Kamila and Aliya, talking about subjects for next year.", "script": [["Kamila", "Have you chosen your subjects for next year, Aliya?"], ["Aliya", "Almost. The deadline is next Friday, isn’t it?"], ["Kamila", "Yes. I’m taking biology, chemistry and English."], ["Aliya", "Biology? Like your aunt?"], ["Kamila", "Exactly. She’s a scientist who studies water pollution in lakes. She’s fascinating to talk to."], ["Aliya", "So you’re following in her footsteps! I want to do physics and computer science."], ["Kamila", "Aren’t they at the same time?"], ["Aliya", "They were, but the head teacher sorted it out. Physics is now on Mondays and Wednesdays."], ["Kamila", "Great. And what do you want to be?"], ["Aliya", "An engineer who designs solar panels. Kazakhstan has so much sun!"]]}, "parts": [{"items": [{"t": "mc", "q": "When is the deadline for choos ossible to avoid or prevent = ___", "o": ["overall", "inevitable", "unique"], "a": 1}, {"t": "mc", "q": "Living with people, as pets or on farms = ___", "o": ["domestic", "aggressive", "wild"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Fast food is often highly <b>p</b>{}.", "a": [["rocessed"]], "pre": ["p"]}, {"t": "gap", "q": "Elephants <b>c</b>{} plants for many hours every day.", "a": [["hew"]], "pre": ["c"]}, {"t": "gap", "q": "The dog was <b>a</b>{} and tried to bite me.", "a": [["ggressive"]], "pre": ["a"]}, {"t": "gap", "q": "<b>D</b>{} lived on Earth millions of years ago.", "a": [["inosaurs"]], "pre": ["D"]}, {"t": "gap", "q": "Many people died in the <b>f</b>{} when there was no rain for three years.", "a": [["amine"]], "pre": ["f"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Will we be taller, smarter… or smaller?", "paras": [["", "Humans have changed a lot over millions of years, and evolution hasn’t stopped. Scientists can’t know for sure what we will look like in a thousand years, but they can speculate by looking at trends."], ["", "One trend is height. People today are much taller than our early ancestors, mainly because of better nutrition. In some countries, the average man is now over 180 centimetres tall."], ["", "Other parts of the body may get smaller. We eat soft, cooked and processed food, so we don’t need to chew as much as early humans did. As a result, our teeth and jaws are likely to keep getting smaller."], ["", "Technology may change us most of all. Medical advances already let doctors check our genes for diseases. In the future, parents might even select features for their children. Some people think this is exciting; others find it worrying."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "How can scientists guess how humans will change?", "o": cheap to farm."], "a": 2}, {"t": "mc", "q": "Where did Aigerim’s brother try insects?", "o": ["in Thailand", "in Kostanay", "at school"], "a": 0}, {"t": "mc", "q": "What does Timur think about robot teachers?", "o": ["He thinks they will come very soon.", "He would like one.", "He doubts they will replace most teachers."], "a": 2}, {"t": "mc", "q": "Which prediction do they rank first?", "o": ["robot teachers", "eating insects", "one language"], "a": 1}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "word formation (evolve – evolution, gene – genetic); phrasal verbs (speed up, take over, calm down); nutrition, rely on, inevitable, species.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences.", "prompts": ["How do you think humans will change in the next thousand years?", "Which features did you get from your parents?", "What do you rely on every day?", "What helps you calm down when you’re stressed?"]}, {"name": "Role play / Discussion", "mins": 3, "lead": "Student and teacher discuss the predictions and agree on a ranking from most to least likely.", "prompts": ["Most of our protein will come from insects.", "All our energy will come from the sun and wind.", "Most people will live to 120."]}]}}]}, {"id": "t51", "kind": "quick", "group": "t5.1", "title": "Unit 5.1 Test", "focus": "5.1 Amazing Animals: compound adjectives (white-coloured, English-speaking, well-known, cold-blooded…); nasty, loyal, venom, nocturnal, predator, harmless, seabed, depth.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "The Komondor is a large, ___ dog with rope-like hair.", "o": ["white-colour", "white-coloured", "coloured-white"], "a": 1}, {"t": "mc", "q": "I’d love to live in an ___ country one day.", "o": ["English-speak", "speaking-English", "English-speaking"], "a": 2}, {"t": "mc", "q": "We live on the top floor of a ___ building.", "o": ["twenty-storey", "twenty-storeys", "storey-twenty"], "a": 0}, {"t": "mc", "q": "Cristiano Ronaldo is a ___ footballer.", "o": ["good-known", "well-knowing", "well-known"], "a": 2}, {"t": "mc", "q": "This camera isn’t expensive, but it takes ___ photos.", "o": ["high-quality", "high-qualities", "quality-high"], "a": 0}, {"t": "mc", "q": "My grandad’s phone is a bit ___ – it can’t even send photos.", "o": ["old-fashion", "old-fashioned", "fashioned-old"], "a": 1}, {"t": "mc", "q": "Snakes and lizards are ___ animals, so they lie in the sun to warm up.", "o": ["cold-blood", "blooded-cold", "cold-blooded"], "a": 2}, {"t": "mc", "q": "We bought a ___ ticket because we weren’t coming back.", "o": ["one-ways", "one-way", "way-one"], "a": 1}, {"t": "mc", "q": "The platypus is a very strange-___ animal: a mammal that lays eggs.", "o": ["looking", "look", "looked"], "a": 0}, {"t": "mc", "q": "Which sentence is correct?", "o": ["She’s a well-known singer.", "She’s a well known-singer.", "She’s a wellknown-singer."], "a": 0}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Active at night: ___.", "o": ["harmless", "loyal", "nocturnal"], "a": 2}, {"t": "mc", "q": "The poisonous liquid that some snakes and spiders produce: ___.", "o": ["seabed", "venom", "depth"], "a": 1}, {"t": "mc", "q": "An animal that kills and eats other animals: a ___.", "o": ["predator", "mate", "flock"], "a": 0}, {"t": "mc", "q": "Not able to hurt anyone: ___.", "o": ["harmless", "nasty", "venomous"], "a": 0}, {"t": "mc", "q": "Always supporting someone, like a good dog: ___.", "o": ["rare", "weird", "loyal"], "a": 2}, {"t": "mc", "q": "The bottom of the sea or ocean: the ___.", "o": ["depth", "beak", "seabed"], "a": 2}, {"t": "mc", "q": "Very bad or unpleasant: ___.", "o": ["loyal", "nasty", "cute"], "a": 1}, {"t": "mc", "q": "How deep something is the long-eared hedgehog, a small nocturnal animal that lives in the desert. Its huge ears are not just for hearing – they also let heat escape from its body, so it can stay cool on hot summer nights. It eats insects, so it is completely harmless to humans."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "According to the writer, many people think amazing animals live mainly ___.", "o": ["in tropical rainforests", "in deserts", "in the mountains"], "a": 0}, {"t": "mc", "q": "What does the saiga’s nose do in winter?", "o": ["It filters out dust.", "It helps the saiga find water.", "It warms the air."], "a": 2}, {"t": "mc", "q": "What happened to the number of saigas?", "o": ["It has fallen every year.", "It has stayed the same.", "It fell and then grew again."], "a": 2}, {"t": "mc", "q": "Why have many local people never seen a snow leopard?", "o": ["It is hard to see among the rocks.", "It only lives in zoos.", "It sleeps all winter."], "a": 0}, {"t": "mc", "q": "How do the hedgehog’s ears help it?", "o": ["They help it find water.", "They protect it from predators.", "They help it stay cool."], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear Nurlan talking about a school trip to a wildlife centre.", "script": [["Nurlan", "Last week our class went to a wildlife centre about forty kilometres from Kostanay. It was a two-hour bus ride, but it was worth it."], ["Nurlan", "The first animal we saw was a huge brown bear. The keeper told us it was rescued from a circus, so it can’t survive in the wild."], ["Nurlan", "My favourite part was the night house. It’s dark inside because all the animals there are nocturnal – there were owls, bats and a tiny hedgehog."], ["Nurlan", "Then we watched a snake being fed. Aliya was terrified, but the keeper said it was completely harmless – it isn’t venomous at all."], ["Nurlan", "Next time I’d like to go on a three-day trip to the mountains to look for snow leopards. My dad thinks I’m crazy!"]]}, "parts": [{"items": [{"t": "mc", "q": "How long was the bus ride?", "o": ["forty minutes", "two hours", "three days"], "a": 1}, {"t": "mc", "q": "Why can’t the bear live in the wild?", "o": ["It used to live in a circus.", "It is too old.", "It is injured."], "a": 0}, {"t": "mc", "q": "Why is the night house dark?", "o": ["The animals in it are active at night.", "The lights were broken.", "The keepers were asleep."], "a": 0}, {"t": "mc", "q": "What did the keeper say about the snake?", "o": ["It was venomous.", "It wasn’t dangerous.", "It was very rare."], "a": 1}, {"t": "mc", "q": "What would Nurlan like to do next time?", "o": ["feed the snake himself", "visit a circus", "go on a trip to the mountains"], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "compound adjectives; nocturnal, venom, predator, harmless, loyal, seabed.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What is the strangest animal you know? Describe it using two compound adjectives.", "Have you ever seen a wild animal in Kazakhstan? Where?", "Which animals are you most afraid of? Why?", "Would you like a pet? Which animal would be the most loyal?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Should wild animals be kept in zoos?", "Is it important to protect all animals, even nasty or dangerous ones?", "Why do you think some animals look so weird?"]}]}}]}, {"id": "t52", "kind": "quick", "group": "t5.2", "title": "Unit 5.2 Test", "focus": "5.2 Predicting the Weather: weather idioms (raining cats and dogs, talk a lot of hot air, feel it in my bones) and weather adjectives (foggy, icy, stormy); forecast, emerge, legend, shadow, reliable, sensitive, observe, detect, accurate, ancestor.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "Take an umbrella – it’s raining cats and ___!", "o": ["dogs", "mice", "birds"], "a": 0}, {"t": "mc", "q": "Don’t believe him – he just talks a lot of hot ___.", "o": ["wind", "air", "water"], "a": 1}, {"t": "mc", "q": "There was so much ___ this morning that we couldn’t see the road.", "o": ["foggy", "fog", "fogged"], "a": 1}, {"t": "mc", "q": "Walk carefully – the pavements are very ___ today.", "o": ["icy", "ice", "icing"], "a": 0}, {"t": "mc", "q": "It was a ___ night, with strong winds and heavy rain.", "o": ["storm", "stormful", "stormy"], "a": 2}, {"t": "mc", "q": "My grandma says it will snow tomorrow – she can feel it in her ___.", "o": ["heart", "feet", "bones"], "a": 2}, {"t": "mc", "q": "Red sky at night, sailors’ ___.", "o": ["delight", "fright", "light"], "a": 0}, {"t": "mc", "q": "Look at those black clouds! It’s ___ to rain soon.", "o": ["probable", "likely", "possibly"], "a": 1}, {"t": "mc", "q": "It’s highly ___ that it will snow tomorrow – it’s already minus ten.", "o": ["probable", "probably", "probability"], "a": 0}, {"t": "mc", "q": "Count the seconds between the ___ and the thunder to know how far away the storm is.", "o": ["lighting", "lightening", "lightning"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "A description of what the weather will be like: a ___.", "o": ["legend", "forecast", "shadow"], "a": 1}, {"t": "mc", "q": "Come out from somewhere and become visible: ___.", "o": ["observe", "detect", "emerge"], "a": 2}, {"t": "mc", "q": "An old story that may or may not be true: a ___.", "o": ["joint", "flash", "legend"], "a": 2}, {"t": "mc", "q": "Something you can trust to be correct: ___.", "o": ["sensitive", "nasty", "reliable"], "a": 2}, {"t": "mc", "q": "Able to notice very small changes: ___.", "o": ["reliable", "sensitive", "probable"], "a": 1}, {"t": "mc", "q": "Watch something very carefully: ___.", "o": ["observe", "emerge", "invent"], "a": 0}, {"t": "mc", "q": "Notice something that is difficult to see or hear: ___.", "o": ["delight", "detect", "forecast"], "a": 1}, {"t": "mc", "q": "A sudden loud noise: a ___.", "o": ["bang", "flash", "shadow"], "a": 0}, {"t": "mc", "q": "People in your family who lived a long time ago: ___.", "o": ["ancestors", "legends", "neighbours"], "a": 0}, {"t": "mc", "q": "An imaginary line around the middle of the Earth: the ___.", "o": ["equator", "horizon", "seabed"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Every February the groundhog comes out and looks for its <b>s</b>{}.", "a": [["hadow"]], "pre": ["s"]}, {"t": "gap", "q": "Weather forecasts for next month are rarely <b>a</b>{}.", "a": [["ccurate"]], "pre": ["a"]}, {"t": "gap", "q": "We saw a <b>f</b>{} of lightning over the lake.", "a": [["lash"]], "pre": ["f"]}, {"t": "gap", "q": "There was heavy snow and a strong wind – a real <b>b</b>{}.", "a": [["lizzard"]], "pre": ["b"]}, {"t": "gap", "q": "When it’s cold and wet, the <b>j</b>{} in my knees hurt.", "a": [["oints"]], "pre": ["j"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Can animals predict the weather?", "paras": [["", "For thousands of years, farmers have watched animals to guess what the weather will do. Today we have satellites and weather apps, but many people in villages near Kostanay still say that animals are better forecasters."], ["", "Some of these beliefs have a scientific basis. Before rain, the air pressure falls and the air becomes wetter. Insects fly lower, so the birds that eat them, such as swallows, fly lower too. That is why ‘swallows flying low’ is quite a reliable sign of rain."], ["", "Other beliefs are less accurate. Many people think cows lie down before a storm, but scientists have found that cows usually lie down when they are tired or full – not because they can detect bad weather."], ["", "However, some animals really are sensitive to changes we cannot notice. Birds can hear very low sounds from storms hundreds of kilometres away, and they sometimes leave an area a day or two before a storm arrives. So next time the birds disappear, it might be time to find your umbrella."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why have farmers watched animals for so long?", "o": ["to check that they are healthy", "to guess what the weather will do", "to protect them from storms"], "a": 1}, {"t": "mc", "q": "What happens before it rains?", "o": ["The air becomes drier.", "The air pressure falls.", "Insects fly higher."], "a": 1}, {"t": "mc", "q": "Why do swallows fly low before rain?", "o": ["They are tired.", "They can’t see well.", "They follow the insects they eat."], "a": 2}, {"t": "mc", "q": "What does the writer say about cows?", "o": ["They always lie down before storms.", "They can hear storms.", "The belief about them is not reliable."], "a": 2}, {"t": "mc", "q": "What can some birds do?", "o": ["change the air pressure", "predict snow a week before", "hear storms that are very far away"], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends, Dana and Timur, planning a trip.", "script": [["Dana", "Timur, are we still going to the lake on Saturday?"], ["Timur", "I’m not sure. The forecast says it’s going to rain cats and dogs in the afternoon."], ["Dana", "Really? My grandad says it’ll be sunny. He says he can feel it in his bones."], ["Timur", "Your grandad also told us he once saw fish falling from the sky! He talks a lot of hot air sometimes."], ["Dana", "That really happens! Strong winds can pick up small fish. Anyway, why don’t we go in the morning? The forecast is usually accurate for the next day."], ["Timur", "Good idea. Let’s meet at nine at the bus stop and come back before two."]]}, "parts": [{"items": [{"t": "mc", "q": "Where do they want to go?", "o": ["to the mountains", "to the park", "to the lake"], "a": 2}, {"t": "mc", "q": "What does the forecast say about Saturday afternoon?", "o": ["It will snow.", "There will be heavy rain.", "It will be sunny."], "a": 1}, {"t": "mc", "q": "Why does Dana’s grandad think it will be sunny?", "o": ["He feels it in his body.", "He checked an app.", "He watched the birds."], "a": 0}, {"t": "mc", "q": "What does Dana say about fish falling from the sky?", "o": ["It can really happen.", "Her grandad invented it.", "It happens every summer."], "a": 0}, {"t": "mc", "q": "When will they come back?", "o": ["at nine o’clock", "before two o’clock", "in the evening"], "a": 1}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "weather idioms and weather adjectives; forecast, reliable, observe, detect, accurate, legend.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What’s the weather like in Kostanay today? Use two weather adjectives.", "How do you check the weather forecast?", "Do you know anyone who talks a lot of hot air?", "What’s the worst weather you have ever been in?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Can animals really predict the weather?", "Are weather apps more reliable than old sayings?", "How does the weather change people’s plans and moods?"]}]}}]}, {"id": "t53", "kind": "quick", "group": "t5.3", "title": "Unit 5.3 Test", "focus": "5.3 Save our Seas: the second conditional (If we ate fewer fish, our oceans would have time to recover); ecosystem, oxygen, consumption, sustainable, frequent, oil spill, dump, tonne, float, melt, habitat, emissions.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "If we ___ fewer fish, there would be more fish in the sea.", "o": ["ate", "eat", "would eat"], "a": 0}, {"t": "mc", "q": "If I ___ you, I’d stop using plastic bags.", "o": ["were", "am", "would be"], "a": 0}, {"t": "mc", "q": "What ___ you do if you saw an oil spill on the beach?", "o": ["will", "would", "did"], "a": 1}, {"t": "mc", "q": "If people didn’t dump rubbish in rivers, the water ___ much cleaner.", "o": ["will be", "would be", "is"], "a": 1}, {"t": "mc", "q": "Sea levels ___ so fast if the ice caps didn’t melt.", "o": ["won’t rise", "didn’t rise", "wouldn’t rise"], "a": 2}, {"t": "mc", "q": "If I ___ a lot of money, I’d help clean up the Aral Sea.", "o": ["have", "would have", "had"], "a": 2}, {"t": "mc", "q": "We’d swim here if the water ___ so dirty.", "o": ["isn’t", "wouldn’t be", "wasn’t"], "a": 2}, {"t": "mc", "q": "If you could save one sea animal, which one ___ you choose?", "o": ["did", "will", "would"], "a": 2}, {"t": "mc", "q": "We use the second conditional to talk about situations that are ___.", "o": ["unlikely or imaginary", "certain to happen", "finished in the past"], "a": 0}, {"t": "mc", "q": "If fishing ___ more sustainable, fish numbers would increase.", "o": ["were", "will be", "would be"], "a": 0}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "All the plants and animals in one area: an ___.", "o": ["emission", "ecosystem", "oxygen"], "a": 1}, {"t": "mc", "q": "The gas in the air that we need to breathe: ___.", "o": ["steam", "oxygen", "venom"], "a": 1}, {"t": "mc", "q": "The act of using energy, food or products: ___.", "o": ["consumption", "protection", "construction"], "a": 0}, {"t": "mc", "q": "Not harmful to the environment and able to continue: ___.", "o": ["sustainable", "frequent", "acidic"], "a": 0}, {"t": "mc", "q": "Happening often: ___.", "o": ["sustainable", "long-term", "frequent"], "a": 2}, {"t": "mc", "q": "Throw something away in the wrong place: ___.", "o": ["float", "dump", "melt"], "a": 1}, {"t": "mc", "q": "Stay on the surface of the water and not sink: ___.", "o": ["sink", "float", "melt"], "a": 1}, {"t": "mc", "q": "Change from a solid to a liquid when it gets warm: ___.", "o": ["freeze", "float", "melt"], "a": 2}, {"t": "mc", "q": "A unit of weight equal to 1,000 kilograms: a ___.", "o": ["tonne", "metre", "litre"], "a": 0}, {"t": "mc", "q": "The natural home of an animal or plant: a ___.", "o": ["trace", "habitat", "spill"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "The oceans <b>s</b>{} all the continents.", "a": [["urround"]], "pre": ["s"]}, {"t": "gap", "q": "Scientists have found tiny <b>t</b>{} of plastic in almost every fish.", "a": [["races"]], "pre": ["t"]}, {"t": "gap", "q": "Cars and factories produce <b>e</b>{} that warm the planet.", "a": [["missions"]], "pre": ["e"]}, {"t": "gap", "q": "Ocean temperatures have been <b>c</b>{} high for the past thirty years.", "a": [["onsistently"]], "pre": ["c"]}, {"t": "gap", "q": "We need <b>l</b>{} solutions, not quick fixes.", "a": [["ong-term"]], "pre": ["l"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "The sea that came back", "paras": [["", "Sixty years ago, the Aral Sea between Kazakhstan and Uzbekistan was one of the largest lakes in the world. Fishing towns like Aralsk were busy, and thousands of people worked on boats."], ["", "Then everything changed. Water from the two rivers that fed the sea was taken to grow cotton. The sea began to shrink, the water became too salty for most fish, and old ships were left lying in the sand. Dust and salt from the dry seabed blew across villages and made people ill."], ["", "In 2005, Kazakhstan finished a dam to keep water in the northern part of the sea. The results surprised many scientists. The water level rose by several metres, the water became less salty, and fish began to return."], ["", "Today, the North Aral Sea is still much smaller than before, but fishermen are working again. Experts say that if every country managed its water more carefully, other damaged lakes and seas would recover too. The Aral Sea shows that it is not always too late."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "What was Aralsk like sixty years ago?", "o": ["a quiet desert village", "a busy fishing town", "a big cotton farm"], "a": 1}, {"t": "mc", "q": "Why did the sea begin to shrink?", "o": ["The summers became hotter.", "People dumped rubbish in it.", "River water was used for farming."], "a": 2}, {"t": "mc", "q": "What problem did the dry seabed cause?", "o": ["Dust and salt made people ill.", "Floods destroyed villages.", "Ships couldn’t reach the town."], "a": 0}, {"t": "mc", "q": "What happened after the dam was built?", "o": ["The water got saltier.", "The sea became bigger than before.", "Fish came back."], "a": 2}, {"t": "mc", "q": "What do experts believe?", "o": ["The Aral Sea is now back to normal.", "Better water management would help other seas.", "Dams always damage lakes."], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a radio interview with Aliya, who organised a river clean-up.", "script": [["Host", "Aliya, you organised a clean-up of the Tobol river last weekend. How did it go?"], ["Aliya", "Really well! Forty students came, and we collected about two hundred kilos of rubbish in three hours."], ["Host", "What did you find most?"], ["Aliya", "Plastic bottles, definitely. But we also found a car tyre and an old bicycle!"], ["Host", "Why do you think people dump rubbish there?"], ["Aliya", "I think they just don’t think about it. If there were more bins near the river, people would use them."], ["Host", "What’s next?"], ["Aliya", "We’re writing to the city council. If they agreed to put in ten new bins, we’d do a clean-up every month."]]}, "parts": [{"items": [{"t": "mc", "q": "How many students took part?", "o": ["forty", "two hundred", "ten"], "a": 0}, {"t": "mc", "q": "What did they find most of?", "o": ["car tyres", "old bicycles", "plastic bottles"], "a": 2}, {"t": "mc", "q": "How long did the clean-up take?", "o": ["the whole weekend", "a month", "three hours"], "a": 2}, {"t": "mc", "q": "Why does Aliya think people dump rubbish?", "o": ["They want to annoy others.", "They don’t think about it.", "There are too many bins."], "a": 1}, {"t": "mc", "q": "What would the students do if the council agreed?", "o": ["organise a clean-up every month", "stop the clean-ups", "buy their own bins"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "second conditional; ecosystem, sustainable, consumption, oil spill, dump, emissions.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["When did you last visit a river, lake or sea? What did you do there?", "What would you do if you saw someone dumping rubbish in a river?", "If you were in charge of Kostanay, what would you change to help the environment?", "Do you eat a lot of fish? Do you know where it comes from?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Which is the biggest problem for our oceans: plastic, overfishing or climate change?", "If everyone stopped eating fish, would the oceans recover?", "What can teenagers do to protect seas and rivers?"]}]}}]}, {"id": "t54", "kind": "quick", "group": "t5.4", "title": "Unit 5.4 Test", "focus": "5.4 The Secret World of Mammals: multi-word verbs (set up, zoom in, go wrong, get rid of, put up, come back, die out); recover, trap, estimate, monitor, protection, disturbance, visible, curious, insight.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "We ___ a camera trap in the garden to film foxes at night.", "o": ["set off", "set back", "set up"], "a": 2}, {"t": "mc", "q": "The animal is very small. Can you ___ so we can see it better?", "o": ["zoom out", "zoom off", "zoom in"], "a": 2}, {"t": "mc", "q": "Something ___ with my camera and it didn’t record anything.", "o": ["went wrong", "went down", "went over"], "a": 0}, {"t": "mc", "q": "Mum wants to ___ the old sofa in the garage.", "o": ["get rid of", "get on with", "get away with"], "a": 0}, {"t": "mc", "q": "I’ve ___ a poster of a snow leopard on my bedroom wall.", "o": ["put off", "put up", "put down"], "a": 1}, {"t": "mc", "q": "The fox ___ to the same place every night to look for food.", "o": ["comes off", "comes back", "comes up"], "a": 1}, {"t": "mc", "q": "If we don’t protect them, many species will ___.", "o": ["die out", "die down", "die in"], "a": 0}, {"t": "mc", "q": "Beavers ___ in Britain hundreds of years ago, but now they’re back.", "o": ["died out", "have died out", "were die out"], "a": 0}, {"t": "mc", "q": "Could you help me ___ the tent before it gets dark?", "o": ["put out", "put on", "put up"], "a": 2}, {"t": "mc", "q": "Hedgehog numbers fell, but they’re starting to ___ now.", "o": ["come down", "come back", "come off"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Return to a normal state after a difficult time: ___.", "o": ["monitor", "recover", "disturb"], "a": 1}, {"t": "mc", "q": "A piece of equipment for catching animals: a ___.", "o": ["sensor", "estimate", "trap"], "a": 2}, {"t": "mc", "q": "A guess about a number when you don’t know it exactly: an ___.", "o": ["estimate", "insight", "evidence"], "a": 0}, {"t": "mc", "q": "Watch and check something over a period of time: ___.", "o": ["recover", "hunt", "monitor"], "a": 2}, {"t": "mc", "q": "Something that prevents harm or injury: ___.", "o": ["disturbance", "protection", "decline"], "a": 1}, {"t": "mc", "q": "Something that interrupts or changes a normal situation: a ___.", "o": ["protection", "trap", "disturbance"], "a": 2}, {"t": "mc", "q": "Able to be seen: ___.", "o": ["curious", "visible", "nocturnal"], "a": 1}, {"t": "mc", "q": "Wanting very much to know about something: ___.", "o": ["curious", "visible", "harmless"], "a": 0}, {"t": "mc", "q": "A deep understanding of what something is like: an ___.", "o": ["insight", "estimate", "habitat"], "a": 0}, {"t": "mc", "q": "Animals that feed their babies on milk: ___.", "o": ["reptiles", "mammals", "amphibians"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "A <b>m</b>{} sensor turns the camera on when something moves.", "a": [["otion"]], "pre": ["m"]}, {"t": "gap", "q": "After many years, wild boar are living in the <b>w</b>{} again.", "a": [["ild"]], "pre": ["w"]}, {"t": "gap", "q": "The number of hedgehogs is in <b>d</b>{} in many countries.", "a": [["ecline"]], "pre": ["d"]}, {"t": "gap", "q": "Members of the <b>p</b>{} can help scientists by sharing their photos.", "a": [["ublic"]], "pre": ["p"]}, {"t": "gap", "q": "The red deer is the largest <b>s</b>{} of land mammal in the UK.", "a": [["pecies"]], "pre": ["s"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Night cameras on the steppe", "paras": [["", "Last spring, a group of students from a school in Kostanay joined a project in the Naurzum Nature Reserve. Their job was to set up camera traps and find out which mammals live there."], ["", "Camera traps are small cameras with motion sensors. When an animal walks past, the camera takes a photo or a short video. Because nobody needs to be there, the animals are not disturbed, and the cameras can be left for weeks."], ["", "The students put up six cameras near a lake. After a month, they came back to collect them. Most of the videos showed hares and corsac foxes, which are mostly nocturnal. One camera had fallen over in the wind, so it only filmed the sky."], ["", "The biggest surprise was a wolf, which walked right up to a camera and looked into it curiously. ‘We zoomed in and saw it really clearly,’ said Timur, 15. Scientists say the students’ videos give them useful insights and help them monitor animal numbers."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Where did the students set up the cameras?", "o": ["in their school garden", "in a nature reserve", "in a city park"], "a": 1}, {"t": "mc", "q": "Why don’t camera traps disturb animals?", "o": ["They are very small.", "They only work in the day.", "No people need to be there."], "a": 2}, {"t": "mc", "q": "How long did the students leave the cameras?", "o": ["one night", "a whole year", "about a month"], "a": 2}, {"t": "mc", "q": "What went wrong with one camera?", "o": ["It fell over.", "A wolf broke it.", "Its battery died."], "a": 0}, {"t": "mc", "q": "How do the videos help scientists?", "o": ["They help them monitor animal numbers.", "They help them catch wolves.", "They show where to build new lakes."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends, Dana and Aliya, talking about a camera trap.", "script": [["Dana", "Aliya, did you look at the videos from your camera trap?"], ["Aliya", "Yes! I set it up behind our garage on Friday. On the first night something went wrong – it only recorded the wind!"], ["Dana", "Oh no. What about the second night?"], ["Aliya", "Much better. At about two in the morning a hedgehog came out from under the fence. Then a cat chased it away."], ["Dana", "Did the hedgehog come back?"], ["Aliya", "Yes, an hour later. My little brother wants to put up a feeding station for it, but Mum says we should just leave it alone."]]}, "parts": [{"items": [{"t": "mc", "q": "Where did Aliya put the camera?", "o": ["in a tree", "on the fence", "behind the garage"], "a": 2}, {"t": "mc", "q": "What happened on the first night?", "o": ["A cat broke the camera.", "The camera didn’t record any animals.", "It recorded a hedgehog."], "a": 1}, {"t": "mc", "q": "When did the hedgehog appear?", "o": ["at midnight", "early in the evening", "at about two in the morning"], "a": 2}, {"t": "mc", "q": "What did the cat do?", "o": ["It ate the hedgehog’s food.", "It chased the hedgehog away.", "It knocked the camera over."], "a": 1}, {"t": "mc", "q": "What does Aliya’s mum think?", "o": ["They should leave the hedgehog alone.", "They should build a feeding station.", "They should catch the hedgehog."], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "multi-word verbs; recover, monitor, estimate, disturbance, visible, curious.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Which wild mammals live near your home?", "If you set up a camera trap, where would you put it?", "Is there anything in your house your parents want to get rid of?", "What have you put up on the walls of your bedroom?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Why is it important to monitor animal numbers?", "Can ordinary people really help scientists?", "Which animals in Kazakhstan are in danger of dying out?"]}]}}]}, {"id": "t55", "kind": "quick", "group": "t5.5", "title": "Unit 5.5 Test", "focus": "5.5 The power of nature: not only … but also (and inversion: Not only is it clean, but it is also cheap); generate, solar panel, turbine, install, drawback, fossil fuel, unlimited, dam, steam, greenhouse gas.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "Solar power is not only clean ___ also cheap.", "o": ["and", "or", "but"], "a": 2}, {"t": "mc", "q": "Not only ___ wind power cheap, but it is also clean.", "o": ["is", "it is", "does"], "a": 0}, {"t": "mc", "q": "Not only ___ the dam produce electricity, but it also stores water.", "o": ["do", "does", "is"], "a": 1}, {"t": "mc", "q": "Not only ___ she install solar panels, but she also bought an electric car.", "o": ["did", "does", "has"], "a": 0}, {"t": "mc", "q": "Hydroelectric power is not only reliable but ___ efficient.", "o": ["too", "as well", "also"], "a": 2}, {"t": "mc", "q": "The new wind farm will not only create jobs but also ___ pollution.", "o": ["reducing", "reduce", "reduces"], "a": 1}, {"t": "mc", "q": "Not only ___ fossil fuels pollute the air, but they will also run out one day.", "o": ["are", "do", "does"], "a": 1}, {"t": "mc", "q": "Which sentence is correct?", "o": ["Not only is it windy, but it is also cold.", "Not only it is windy, but also it cold.", "Not only windy is it, but cold also."], "a": 0}, {"t": "mc", "q": "We use not only … but also to ___.", "o": ["compare two opposite ideas", "talk about the past", "add emphasis to two connected ideas"], "a": 2}, {"t": "mc", "q": "Not only ___ we saved money, but we have also helped the planet.", "o": ["did", "are", "have"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Produce energy or electricity: ___.", "o": ["install", "generate", "absorb"], "a": 1}, {"t": "mc", "q": "Equipment that uses sunlight to make electricity: a ___.", "o": ["solar panel", "turbine", "dam"], "a": 0}, {"t": "mc", "q": "A machine with blades that turn to produce power: a ___.", "o": ["panel", "turbine", "chimney"], "a": 1}, {"t": "mc", "q": "Fix something in place so it can be used: ___.", "o": ["generate", "store", "install"], "a": 2}, {"t": "mc", "q": "A disadvantage or problem: a ___.", "o": ["drawback", "benefit", "source"], "a": 0}, {"t": "mc", "q": "Coal, oil and gas: ___.", "o": ["renewable energies", "fossil fuels", "greenhouse gases"], "a": 1}, {"t": "mc", "q": "Without any end or limit: ___.", "o": ["unreliable", "unlikely", "unlimited"], "a": 2}, {"t": "mc", "q": "A wall built across a river to hold back water: a ___.", "o": ["dam", "turbine", "cliff"], "a": 0}, {"t": "mc", "q": "The hot gas that water changes into when it boils: ___.", "o": ["smoke", "fog", "steam"], "a": 2}, {"t": "mc", "q": "Gases such as carbon dioxide that make the planet warmer: ___ gases.", "o": ["greenhouse", "glasshouse", "hothouse"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Wind and solar are <b>r</b>{} sources of energy.", "a": [["enewable"]], "pre": ["r"]}, {"t": "gap", "q": "Burning coal causes a lot of air <b>p</b>{}.", "a": [["ollution"]], "pre": ["p"]}, {"t": "gap", "q": "Water can be stored in a dam, so hydroelectric power is very <b>r</b>{}.", "a": [["eliable"]], "pre": ["r"]}, {"t": "gap", "q": "Iceland gets a lot of its energy from <b>g</b>{} power.", "a": [["eothermal"]], "pre": ["g"]}, {"t": "gap", "q": "LED light bulbs are much more <b>e</b>{} than old ones.", "a": [["fficient"]], "pre": ["e"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Wind on the steppe", "paras": [["", "Kazakhstan is a land of huge open spaces and strong winds. For many years, however, most of its electricity has come from coal, a fossil fuel that is cheap but produces a lot of greenhouse gases."], ["", "Things are starting to change. Not only are new wind farms being built on the windy steppe, but large solar farms have also appeared in the sunny south. Near the town of Yereymentau, dozens of turbines now generate electricity for thousands of homes."], ["", "Renewable energy has drawbacks too. When the wind stops or clouds cover the sun, the turbines and panels produce less power, so the country still needs other sources. Some people also say that wind farms spoil the view and are noisy."], ["", "Even so, many young people are excited. ‘Our steppe isn’t only beautiful – it’s also full of free energy,’ says Dana, 14, from Kostanay. The government hopes that by 2050 half of the country’s energy will come from cleaner sources."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Where has most of Kazakhstan’s electricity come from?", "o": ["wind", "coal", "the sun"], "a": 1}, {"t": "mc", "q": "Where are the large solar farms?", "o": ["near Yereymentau", "in the south", "in Kostanay"], "a": 1}, {"t": "mc", "q": "What is one drawback of wind and solar power?", "o": ["They don’t always produce the same amount of power.", "They produce greenhouse gases.", "They are too cheap."], "a": 0}, {"t": "mc", "q": "What does Dana think?", "o": ["Wind farms are ugly.", "Coal is the best choice.", "The steppe could provide a lot of energy."], "a": 2}, {"t": "mc", "q": "What does the government hope will happen by 2050?", "o": ["Half of the energy will come from cleaner sources.", "All wind farms will close.", "The country will use more coal."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear Timur presenting his school project about solar panels.", "script": [["Timur", "For my project, I looked at the solar panels my uncle installed on his house in the village last year."], ["Timur", "He has ten panels, and they cost about the same as a small car. That’s the biggest drawback – they’re not cheap."], ["Timur", "But not only do they give him electricity for the house, they also heat the water for his shower in summer."], ["Timur", "In winter they produce less, because the days are short and the panels are sometimes covered with snow. My uncle has to climb up and clear them!"], ["Timur", "He thinks the panels will pay for themselves in about seven years."]]}, "parts": [{"items": [{"t": "mc", "q": "Who installed the solar panels?", "o": ["Timur’s father", "Timur’s uncle", "Timur’s teacher"], "a": 1}, {"t": "mc", "q": "How many panels are there?", "o": ["ten", "seven", "twenty"], "a": 0}, {"t": "mc", "q": "What is the biggest drawback?", "o": ["the noise", "the size", "the price"], "a": 2}, {"t": "mc", "q": "Why do the panels produce less in winter?", "o": ["The cold breaks them.", "His uncle switches them off.", "The days are short and there is snow."], "a": 2}, {"t": "mc", "q": "When will the panels pay for themselves?", "o": ["next year", "in about seven years", "in about ten years"], "a": 1}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "not only … but also; generate, install, drawback, fossil fuel, renewable, turbine.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What energy does your family use to heat your home?", "Would you like solar panels on your house? Why or why not?", "Describe your town using not only … but also.", "Have you ever seen a wind farm or a dam?"]}, {"name": "Role play / Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Role play: you are a mayor who wants a wind farm near the town; the teacher is a farmer who is against it. Persuade them.", "Should Kazakhstan stop using coal completely?", "Is it the government’s job or everyone’s job to use less energy?"]}]}}]}, {"id": "t61", "kind": "quick", "group": "t6.1", "title": "Unit 6.1 Test", "focus": "6.1 Planes, trains, and automobiles: transport and travel language (by train, on foot, miss the bus) and multi-word verbs (make up for, end up, lose track of); freedom, c or the night: ___.", "o": ["nightly", "tonight", "overnight"], "a": 2}, {"t": "mc", "q": "Impossible to forget: ___.", "o": ["forgettable", "unforgettable", "unforgiving"], "a": 1}, {"t": "mc", "q": "A very large amount of money: a ___.", "o": ["fare", "fee", "fortune"], "a": 2}, {"t": "mc", "q": "Giving pleasure because it gives you what you wanted: ___.", "o": ["satisfying", "satisfied", "tiring"], "a": 0}, {"t": "mc", "q": "A different, longer route you take to avoid something: a ___.", "o": ["horizon", "journey", "detour"], "a": 2}, {"t": "mc", "q": "The line where the land seems to meet the sky: the ___.", "o": ["horizon", "equator", "border"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "A bicycle has the smallest carbon <b>f</b>{} of any vehicle.", "a": [["ootprint"]], "pre": ["f"]}, {"t": "gap", "q": "We were stuck in a traffic <b>j</b>{} for two hours.", "a": [["am"]], "pre": ["j"]}, {"t": "gap", "q": "There are too many cars on our roads – it isn’t <b>s</b>{}.", "a": [["ustainable"]], "pre": ["s"]}, {"t": "gap", "q": "Electric <b>v</b>{} are becoming more popular every year.", "a": [["ehicles"]], "pre": ["v"]}, {"t": "gap", "q": "In some cities, cars are <b>b</b>{} from the centre.", "a": [["anned"]], "pre": ["b"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Three ways to Almaty", "paras": [["", "Every summer, Aliya’s family visits her grandparents in Almaty, about 2,000 kilometres from Kostanay. This year they couldn’t agree how to travel, so each person chose a different way to get there."], ["", "Aliya’s dad flew. The flight took about three hours, which was very convenient, but it was the most expensive choice – and flying is by far the worst type of transport for the planet."], ["", "Aliya and her mum took the train. The journey took almost two days, but they slept comfortably overnight, played cards and watched the steppe go past. ‘It was slow, but unforgettable,’ says Aliya."], ["", "Her older brother, Nurlan, drove with two friends. They shared the cost of petrol, which made it cheap, and they had the freedom to stop wherever they wanted. However, they got lost twice and ended up arriving a day after everyone else!"]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why did the family travel in different ways?", "o": ["They couldn’t agree how to go.", "There weren’t enough tickets.", "They wanted to save money."], "a": 0}, {"t": "mc", "q": "What was good about flying?", "o": ["It was cheap.", "It was quick.", "It was good for the planet."], "a": 1}, {"t": "mc", "q": "How did Aliya feel about the train journey?", "o": ["She found it boring.", "She will always remember it.", "She thought it was too expensive."], "a": 1}, {"t": "mc", "q": "Why was driving cheap for Nurlan?", "o": ["His car is electric.", "His friends paid for everything.", "He shared the cost of petrol."], "a": 2}, {"t": "mc", "q": "What happened to Nurlan?", "o": ["He arrived last.", "He arrived first.", "He took the train home."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear Timur buying a train ticket.", "script": [["Clerk", "Good morning. How can I help?"], ["Timur", "Hi. I’d like a ticket to Astana for Friday, please."], ["Clerk", "One way or return?"], ["Timur", "Return, please. I’m coming back on Sunday evening."], ["Clerk", "The overnight train leaves at ten past eleven at night and arrives at about eight in the morning. Is that OK?"], ["Timur", "Perfect. I can sleep on the train, so I won’t lose a day."], ["Clerk", "Students get twenty per cent off. Do you have your student card?"], ["Timur", "Yes, here it is."]]}, "parts": [{"items": [{"t": "mc", "q": "Where does Timur want to go?", "o": ["Almaty", "Astana", "Kostanay"], "a": 1}, {"t": "mc", "q": "What kind of ticket does he buy?", "o": ["a one-way ticket", "a return ticket", "a first-class ticket"], "a": 1}, {"t": "mc", "q": "When does the train leave?", "o": ["at 8 in the morning", "at 10 at night", "at 11.10 at night"], "a": 2}, {"t": "mc", "q": "Why does Timur like the overnight train?", "o": ["It’s faster than flying.", "It’s cheaper than the bus.", "He won’t lose a day."], "a": 2}, {"t": "mc", "q": "What discount do students get?", "o": ["20%", "10%", "50%"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "transport language and multi-word verbs; freedom, convenience, overnight, unforgettable, detour.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["How do you usually get to school?", "What was your last long journey? How did you travel?", "Have you ever ended up somewhere you didn’t plan to go?", "Is freedom or convenience more important to you when you travel?"]}, {"name": "Debate", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["‘Teenagers should get free public transport.’ Agree or disagree?", "‘It is always better to take the train than to fly.’ Agree or disagree?", "‘Cars should be banned from the centre of Kostanay.’ Agree or disagree?"]}]}}]}, {"id": "t62", "kind": "quick", "group": "t6.2", "title": "Unit 6.2 Test", "focus": "6.2 The most dangerous journey on Earth: should have + past participle for regrets (I should have taken a jacket) and multi-word verbs (fill up, pump up); icy, controversy, fog, conflict, breathtaking, cliff, nearby, extend, set; bike parts (brakes, tyre, chain, saddle).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "I’m freezing. I should ___ a warmer jacket.", "o": ["brought", "have brought", "bring"], "a": 1}, {"t": "mc", "q": "We got lost. We ___ checked the map before we left.", "o": ["should", "must", "should have"], "a": 2}, {"t": "mc", "q": "You ___ cycled so fast down the hill – it was dangerous.", "o": ["shouldn’t have", "shouldn’t", "haven’t"], "a": 0}, {"t": "mc", "q": "My tyre is flat. I should have ___ it up before the trip.", "o": ["pump", "pumped", "pumping"], "a": 1}, {"t": "mc", "q": "We need to ___ the car with petrol before we drive into the mountains.", "o": ["fill in", "fill out", "fill up"], "a": 2}, {"t": "mc", "q": "In summer the sun ___ at about nine o’clock.", "o": ["sets", "sits", "settles"], "a": 0}, {"t": "mc", "q": "The fog was so thick that we ___ see the edge of the road.", "o": ["didn’t can", "couldn’t", "can’t to"], "a": 1}, {"t": "mc", "q": "I should have ___ more water – I was so thirsty.", "o": ["drunk", "drank", "drink"], "a": 0}, {"t": "mc", "q": "‘I forgot my helmet.’ ‘You ___ have forgotten it!’", "o": ["shouldn’t", "mustn’t", "don’t"], "a": 0}, {"t": "mc", "q": "We ___ left earlier – now we’re going to be late.", "o": ["should had", "had should", "should have"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Very cold or covered with ice: ___.", "o": ["foggy", "icy", "nearby"], "a": 1}, {"t": "mc", "q": "Public argument about something people strongly disagree about: ___.", "o": ["fortune", "summit", "controversy"], "a": 2}, {"t": "mc", "q": "A serious disagreement or fight between groups or countries: a ___.", "o": ["cliff", "conflict", "crash"], "a": 1}, {"t": "mc", "q": "Very exciting or impressive to look at: ___.", "o": ["breathtaking", "icy", "nasty"], "a": 0}, {"t": "mc", "q": "A high area of rock, often next to the sea: a ___.", "o": ["valley", "track", "cliff"], "a": 2}, {"t": "mc", "q": "Not far away: ___.", "o": ["overnight", "distant", "nearby"], "a": 2}, {"t": "mc", "q": "Make something longer or larger: ___.", "o": ["fill up", "extend", "set"], "a": 1}, {"t": "mc", "q": "A small hole in a tyre: a ___.", "o": ["puncture", "pedal", "gear"], "a": 0}, {"t": "mc", "q": "The seat on a bicycle: the ___.", "o": ["saddle", "chain", "brake"], "a": 0}, {"t": "mc", "q": "The top of a mountain: the ___.", "o": ["summit", "slope", "valley"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Always wear a <b>h</b>{} when you ride a bike.", "a": [["elmet"]], "pre": ["h"]}, {"t": "gap", "q": "Put some oil on the <b>c</b>{} if it makes a noise.", "a": [["hain"]], "pre": ["c"]}, {"t": "gap", "q": "Change <b>g</b>{} before you start going up a steep hill.", "a": [["ear"]], "pre": ["g"]}, {"t": "gap", "q": "Push the <b>p</b>{} with your feet to make the bike move.", "a": [["edals"]], "pre": ["p"]}, {"t": "gap", "q": "Thick <b>f</b>{} made it hard to see the road.", "a": [["og"]], "pre": ["f"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "The ladder to school", "paras": [["", "For most teenagers, the journey to school means a bus ride or a short walk. But for the children of Atule’er, a village in the mountains of south-west China, it used to be one of the most dangerous journeys on Earth."], ["", "The village sits on top of a cliff, about 800 metres above the valley. For years, the only way down was a set of old wooden ladders tied together with plants. Children as young as six climbed them with heavy school bags, sometimes in fog or rain."], ["", "In 2016, photos of the climb went viral and caused a lot of controversy. People asked why nothing had been done earlier. Soon afterwards, a steel ladder with more than 2,500 steps was built. It was safer, but the climb still took about two hours."], ["", "A few years later, most families moved to new flats in a nearby town. Some villagers were sad to leave their breathtaking views, but parents were relieved. ‘We should have moved years ago,’ one mother said. ‘Now my children walk to school in ten minutes.’"]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Where is Atule’er?", "o": ["at the bottom of a valley", "next to the sea", "on top of a cliff"], "a": 2}, {"t": "mc", "q": "What were the old ladders made of?", "o": ["steel", "stone", "wood"], "a": 2}, {"t": "mc", "q": "What happened in 2016?", "o": ["The village was destroyed.", "Photos of the climb were shared widely online.", "Children stopped going to school."], "a": 1}, {"t": "mc", "q": "How long did the climb take on the steel ladder?", "o": ["ten minutes", "about two hours", "a whole day"], "a": 1}, {"t": "mc", "q": "How did one mother feel about moving?", "o": ["She wanted to go back.", "She wished it had happened earlier.", "She was angry about it."], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear Dana and her brother Timur getting ready for a bike ride.", "script": [["Dana", "Timur, have you checked your bike? We’re leaving in twenty minutes."], ["Timur", "Sort of. The back tyre was a bit flat, so I pumped it up."], ["Dana", "What about the brakes? The road down from the lake is really steep."], ["Timur", "They’re fine. But my chain is making a strange noise."], ["Dana", "Put some oil on it. And don’t forget your helmet this time."], ["Timur", "I know, I know. Last time I forgot it and Mum was furious. I should have listened to her."], ["Dana", "And fill up your water bottle. It’s going to be really hot."]]}, "parts": [{"items": [{"t": "mc", "q": "When are they leaving?", "o": ["in twenty minutes", "in two hours", "tomorrow morning"], "a": 0}, {"t": "mc", "q": "What did Timur do to his back tyre?", "o": ["He changed it.", "He fixed a puncture.", "He pumped it up."], "a": 2}, {"t": "mc", "q": "Why does Dana ask about the brakes?", "o": ["The brakes are new.", "The road is steep.", "Timur crashed last time."], "a": 1}, {"t": "mc", "q": "What is wrong with Timur’s chain?", "o": ["It’s broken.", "It’s too long.", "It makes a noise."], "a": 2}, {"t": "mc", "q": "What happened last time?", "o": ["Timur forgot his helmet.", "Timur got a puncture.", "Dana fell off her bike."], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "should have + past participle; icy, fog, cliff, breathtaking, controversy; bike parts.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["How do you get to school? Is your journey safe?", "What’s the most breathtaking view you have ever seen?", "Tell me about something you should have done differently last week.", "Can you fix your own bike? What can you check?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Would you like to cycle down a dangerous road? Why or why not?", "Why do people choose dangerous adventure holidays?", "Should the government always make dangerous journeys safer?"]}]}}]}, {"id": "t63", "kind": "quick", "group": "t6.3", "title": "Unit 6.3 Test", "focus": "6.3 The best and worst holidays: adjectives with suffixes -able, -y and -al (unbeatable, sandy, tropical, vertical) and holiday types (city break, cruise, camping holiday); excel, cabin, stimulate, unique, literally, horizontal, vertical, tropical.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "Our hotel was right next to a long, ___ beach.", "o": ["sanded", "sandy", "sandful"], "a": 1}, {"t": "mc", "q": "The views from the cable car were ___ – the best I’ve ever seen.", "o": ["unbeatable", "beatable", "unbeating"], "a": 0}, {"t": "mc", "q": "Bali is a ___ island with palm trees and hot weather all year.", "o": ["tropic", "tropicful", "tropical"], "a": 2}, {"t": "mc", "q": "The ride drops fifty metres straight down
