*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}

/* masthead */
.mast{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.mast-in{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.mast svg{width:44px;height:52px;flex:none}
.mast img.crest{width:47px;height:60px;flex:none;display:block}
.mast .school{font-family:var(--serif);font-size:1.25rem;letter-spacing:.01em}
.mast .sub{color:#C9D6EA;font-size:.95rem}
.mast .grow{flex:1}
.mast select{background:transparent;border:1px solid #3A5285;border-radius:6px;padding:6px 8px;color:#fff}
.mast select option{color:#000}

/* layout */
.wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:24px;padding:22px 20px 60px}
nav.tests h2{font-size:1rem;color:var(--muted);font-family:var(--sans);font-weight:700;margin:4px 0 8px}
nav.tests ul{list-style:none;margin:0 0 18px;padding:0}
nav.tests li button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 10px;border-radius:0 6px 6px 0;display:flex;justify-content:space-between;gap:8px}
nav.tests li button:hover{background:var(--ice)}
nav.tests li button[aria-current="true"]{border-left-color:var(--gold);background:var(--paper);font-weight:700}
nav.tests li button .mini{color:var(--muted);font-size:.85rem;font-weight:400}
nav.tests .soon{color:var(--muted);font-size:.92rem;padding:5px 13px}
.mobile-pick{display:none}

main{min-width:0}
.head{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.head h1{font-size:2rem;color:var(--ink)}
.head .focus{color:var(--muted);margin:4px 0 14px}
.who{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.who label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.who input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:180px}
.mode{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.mode button{border:0;background:var(--paper);padding:8px 14px;font-size:.92rem}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}
.modehint{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:0}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 12px 9px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs .badge{font-weight:400;font-size:.82rem;margin-left:5px;color:var(--muted)}

.sec h2{font-size:1.5rem;margin-bottom:4px}
.part{font-family:var(--serif);font-size:1.08rem;margin:26px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.part:first-of-type{border-top:0;padding-top:0;margin-top:10px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:32px 1fr;gap:4px 8px}
.q .n{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:1.05rem;padding-top:1px}
.q .stem{margin-bottom:8px}
.q .spk{display:inline-block;font-weight:700;width:1.4em;color:var(--muted)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--muted);margin:0 3px;line-height:1.1}
.blank.filled{border-bottom-color:var(--gold);font-weight:700;padding:0 3px;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 12px;display:flex;gap:8px;align-items:baseline;text-align:left;min-height:40px}
.opt:hover:not(:disabled){border-color:var(--navy2)}
.opt .l{font-weight:700;color:var(--muted);font-size:.85rem}
.opt.sel{border-color:var(--navy2);background:var(--ice)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg);text-decoration:line-through;text-decoration-thickness:1px}
.opt.key{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt b.snd{color:var(--gold);font-weight:700}
.opt u.str{text-decoration:underline 2px;text-underline-offset:3px;font-weight:700}
.q .verdict{grid-column:2;font-size:.88rem;margin-top:6px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}

.reading{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.text{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 22px;font-family:var(--serif);line-height:1.65;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.text h3{font-size:1.25rem;margin-bottom:10px}
.text p{margin:0 0 12px}

.player{background:var(--navy);color:#fff;border-radius:10px;padding:16px 18px;margin:12px 0 18px}
.player .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.player button{border:1px solid #4A6399;background:#1C3161;color:#fff;border-radius:6px;padding:8px 14px;font-weight:700}
.player button.primary{background:var(--gold);border-color:var(--gold);color:#1a1405}
.player button:disabled{opacity:.45;cursor:not-allowed}
.player label{font-size:.85rem;color:#C9D6EA;display:flex;gap:6px;align-items:center}
.player select{background:#0B1731;color:#fff;border:1px solid #4A6399;border-radius:6px;padding:5px 6px;max-width:220px}
.player .status{font-size:.9rem;color:#C9D6EA;margin-top:10px}
.player .plays{margin-left:auto;font-size:.9rem}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;font-size:.88rem}
.script{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:16px}
.script p{margin:0 0 6px}
.script p.now{background:var(--gold2);border-radius:4px}
.script b{font-family:var(--serif)}

.bands{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:.92rem;margin:10px 0 18px}
.bands table{border-collapse:collapse;width:100%}
.bands td{padding:3px 8px 3px 0;vertical-align:top}
.bands td:first-child{font-weight:700;white-space:nowrap;color:var(--gold)}
.task{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.task h3{font-size:1.15rem}
.task .meta{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.task ul{margin:0 0 12px;padding-left:1.2em}
.task li{margin-bottom:4px}
.task .card{border-left:3px solid var(--gold);padding:6px 12px;background:var(--ice);border-radius:0 6px 6px 0;margin-bottom:10px;font-family:var(--serif)}
.timer{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.timer .clock{font-family:var(--serif);font-size:1.4rem;min-width:3.2em}
.timer button,.ghost{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px}
.rate{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rate .lab{font-size:.88rem;color:var(--muted);margin-right:4px}
.rate button{width:36px;height:36px;border:1.5px solid var(--line);background:var(--bg);border-radius:6px;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

.pager{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.pager button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;font-weight:700}

/* ledger */
aside.ledger{position:sticky;top:14px;align-self:start}
.card-l{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px}
.card-l .t{font-family:var(--serif);font-size:1.1rem}
.card-l .st{color:var(--muted);font-size:.88rem;margin-bottom:12px;min-height:1.3em}
.big{display:flex;align-items:baseline;gap:6px;font-family:var(--serif);margin:4px 0 2px}
.big .num{font-size:3.4rem;line-height:1;color:var(--ink)}
.big .of{font-size:1.2rem;color:var(--muted)}
.pct{font-size:.95rem;color:var(--muted);margin-bottom:14px}
.pct b{color:var(--ink)}
.rowl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.93rem;margin-bottom:9px}
.rowl .bar{grid-column:1/3;height:5px;background:var(--ice);border-radius:3px;overflow:hidden}
.rowl .bar i{display:block;height:100%;background:var(--navy2);transition:width .25s}
.rowl .v{font-variant-numeric:tabular-nums}
.ledger .actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ledger .actions button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:700}
.ledger .actions button.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.src{font-size:.78rem;color:var(--muted);margin-top:14px;line-height:1.4}
.mobile-total{display:none}

@media (max-width:1100px){
  .wrap{grid-template-columns:200px minmax(0,1fr)}
  aside.ledger{grid-column:1/3;position:static}
}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{grid-template-columns:minmax(0,1fr);padding:14px 12px 110px;gap:14px}
  nav.tests{display:none}
  .mobile-pick{display:block;margin-bottom:12px}
  .mobile-pick select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
  aside.ledger{grid-column:auto}
  .reading{grid-template-columns:minmax(0,1fr)}
  .text{position:static;max-height:none}
  .mode{margin-left:0}
  .head h1{font-size:1.6rem}
  .mobile-total{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;border-top:3px solid var(--gold);z-index:10}
  .mobile-total b{font-family:var(--serif);font-size:1.3rem}
  .mobile-total button{background:none;border:1px solid #4A6399;color:#fff;border-radius:6px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* C1 additions */
.ex-note{color:var(--muted);font-size:.92rem;margin:-4px 0 10px}
.ex-note b{color:var(--ink)}
.legend{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 16px;font-size:.95rem}
.legend b{color:var(--gold);font-family:var(--serif);margin-right:6px}
.bankbox{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 12px}
.bankbox span{border:1px dashed var(--line);background:var(--paper);border-radius:6px;padding:3px 10px;font-family:var(--serif)}
.bankbox b,.mq b{color:var(--gold)}
input.gap{display:inline-block;border:0;border-bottom:2px solid var(--muted);background:transparent;padding:1px 4px;margin:0 3px;font-weight:700;color:var(--ink);border-radius:0;min-width:5em}
input.gap:focus{outline:none;border-bottom-color:var(--gold);background:var(--ice)}
input.gap.ok{border-bottom-color:var(--ok);color:var(--ok)}
input.gap.no{border-bottom-color:var(--no);color:var(--no)}
.chk{margin-left:8px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 10px;font-size:.88rem;font-weight:700}
.pk{display:inline-flex;border:1.5px solid var(--line);border-radius:7px;overflow:hidden;vertical-align:baseline;margin:2px 3px}
.pk button{border:0;background:var(--bg);padding:2px 10px}
.pk button+button{border-left:1.5px solid var(--line)}
.pk button.sel{background:var(--ice);font-weight:700}
.pk button.ok{background:var(--okbg);color:var(--ok);font-weight:700}
.pk button.no{background:var(--nobg);color:var(--no);text-decoration:line-through}
.pk button.key{box-shadow:inset 0 0 0 2px var(--ok)}
.pk button:disabled{cursor:default}
.mrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.mq{font-family:var(--serif);font-size:1.05rem}
.mrow select{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 10px;min-width:130px}
.mrow select.ok{border-color:var(--ok);background:var(--okbg)}
.mrow select.no{border-color:var(--no);background:var(--nobg)}
.syl{display:flex;gap:5px;flex-wrap:wrap}
.syl button{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 12px;font-family:var(--serif);font-size:1.15rem;min-width:44px}
.syl button.sel{border-color:var(--navy2);background:var(--ice);text-decoration:underline;text-underline-offset:4px}
.syl button.ok{border-color:var(--ok);background:var(--okbg);text-decoration:underline;text-underline-offset:4px}
.syl button.no{border-color:var(--no);background:var(--nobg)}
.syl button.key{border-color:var(--ok);border-style:dashed}
.syl button:disabled{cursor:default}
.text p b.lab{color:var(--gold);margin-right:8px}
.wtasks label{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.wtasks label:first-child{border-top:0}
.wtasks em{color:var(--muted)}
textarea.wr{width:100%;min-height:300px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:14px 16px;line-height:1.65;resize:vertical;font:inherit;color:inherit}
.wc{text-align:right;color:var(--muted);font-size:.9rem;margin:4px 0 14px}
.rate.wide button{width:40px}
.papers{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:.88rem;color:var(--muted)}
.papers div{display:flex;justify-content:space-between;gap:10px}
.papers b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
nav.tests h2 .cnt{font-weight:400}



/*EXTRA-START*//* v2 additions */
.tview{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.tview button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tview button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tview .mini{font-weight:400;font-size:.85rem;opacity:.85}
nav.tests li.pair{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 4px 13px}
nav.tests li.pair .pname{font-size:.97rem}
nav.tests li.pair .pbtns{display:flex;gap:4px}
nav.tests li.pair .pbtns button{width:auto;min-width:38px;justify-content:center;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--paper);font-weight:700}
nav.tests li.pair .pbtns button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.syncnote{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:2px 0 0;padding:6px 10px;border-left:3px solid var(--gold);background:var(--ice);border-radius:0 6px 6px 0}
.syncnote.ok{border-left-color:var(--ok)}
.hint{color:var(--muted);font-size:.92em}
input.gap.wide{min-width:min(100%,24em)}
.task.prompt p{margin:0 0 8px}
.task.prompt p:last-child{margin:0}
.muted{color:var(--muted);font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:8px}
.filters label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:160px}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.rtable{width:100%;border-collapse:collapse;font-size:.93rem}
.rtable th{text-align:left;font-weight:700;color:var(--muted);font-size:.82rem;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
.rtable td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.rtable td.num,.rtable th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtable tbody tr{cursor:pointer}
.rtable tbody tr:hover{background:var(--ice)}
.rtable tbody tr.on{background:var(--ice);box-shadow:inset 3px 0 0 var(--gold)}
.rtable td.empty{color:var(--muted);text-align:center;padding:22px;cursor:default}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-left:6px;color:var(--muted);vertical-align:middle}
.tag.warn{border-color:var(--gold);color:var(--gold)}
.detail{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dhead h2{font-size:1.4rem}
.secscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 4px}
.secscores div{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;font-size:.9rem}
.wrview{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.6;max-height:320px;overflow:auto;margin-bottom:6px}
details.ans{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
details.ans summary{padding:10px 12px;cursor:pointer}
.atable{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--paper)}
.atable th{text-align:left;color:var(--muted);font-size:.78rem;padding:6px 10px;border-bottom:1px solid var(--line)}
.atable td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.atable tr.no td:nth-child(3){color:var(--no)}
.atable tr.ok td:nth-child(4){color:var(--ok)}
.codebox{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.codebox p{margin:0 0 8px;font-size:.9rem}
.codebox textarea,textarea.imp{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);word-break:break-all}
.codebox button{margin-top:8px}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-weight:700}
.go{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:8px;padding:9px 14px;font-weight:700}
.go:disabled{opacity:.6;cursor:default}
@media print{.mast,nav.tests,.mobile-pick,.who,.tabs,.pager,.mobile-total,.ledger .actions,.player,.linkbtn{display:none!important}.wrap{display:block}aside.ledger{position:static;margin-top:20px}body{background:#fff}}

.vswitch{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.vswitch button{flex:1;border:0;background:transparent;padding:11px 12px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.vswitch button+button{border-left:1px solid var(--line)}
.vswitch button[aria-pressed="true"]{background:var(--navy);color:#fff}
.vswitch .vsub{font-weight:400;font-size:.8rem;opacity:.8}
.share ol.steps{margin:6px 0 8px;padding-left:20px}.share ol.steps li{margin:4px 0}
@media (min-width:901px){nav.tests .tview{display:none}}
@media print{.vswitch{display:none!important}}
/*EXTRA-END*/</style>

  function prompt(c,text){
    var crit=c.crit.map(function(x,i){return (i+1)+". "+x[0]+" (0–"+x[1]+")"+(x[2]?": "+x[2]:"")}).join("\n");
    var max=c.crit.reduce(function(a,x){return a+x[1]},0);
    return "You are an experienced, fair English examiner marking the writing part of "+c.exam+". The writer is "+(c.who||"a learner of English")+". Mark with the criteria below, exactly as a careful teacher would: reward what is there, do not inflate, and keep the level of the test in mind.\n\n"+
     "TASK:\n"+(typeof c.task==="function"?c.task():c.task)+(c.words?"\nLength asked for: "+c.words+".":"")+"\n\nCRITERIA (total "+max+"):\n"+crit+(c.bands?"\n\nMARK SCHEME:\n"+c.bands:"")+
     "\n\nANSWER ("+words(text)+" words), between the markers:\n<<<\n"+String(text).slice(0,6000)+"\n>>>\n\nIf the answer is blank, off-task, copied from the task or not in English, give 0 for every criterion.\n"+
     "Reply with JSON only: {\"scores\":["+c.crit.map(function(){return 0}).join(",")+"],\"comments\":["+c.crit.map(function(){return '"one short sentence"'}).join(",")+"],\"feedback\":\"2–3 encouraging, specific sentences for the learner in simple English\",\"corrections\":[{\"wrong\":\"exact words from the answer\",\"right\":\"corrected version\",\"why\":\"very short reason\"}],\"cefr\":\"A1|A2|B1|B2|C1|C2\"}  Give up to 6 corrections of the most important errors.";

      var cm=c.crit.map(function(x,i){return String(j&&j.comments&&j.comments[i]||"")});
      var corr=(j&&Array.isArray(j.corrections)?j.corrections:[]).slice(0,6).map(function(x){return{w:String(x&&x.wrong||""),r:String(x&&x.right||""),y:String(x&&x.why||"")}}).filter(function(x){return x.w||x.r});
      return{s:sc,c:cm,total:sc.reduce(function(a,b){return a+b},0),max:c.crit.reduce(function(a,x){return a+x[1]},0),fb:String(j&&j.feedback||""),corr:corr,cefr:String(j&&j.cefr||""),h:h(text),at:new Date().toISOString(),n:c.crit.map(function(x){return x[0]}),m:c.crit.map(function(x){return x[1]})};

    return '<h4>'+hdr+'</h4>'+(stale?'<p class="aiw-m">You have changed your writing since this mark. Mark it again to update it.</p>':'')+t+
      '<p class="aiw-m">'+(c.mode==="teacher"?"Check it, then use it or change it. The final mark is yours.":"An AI estimate, marked on the same criteria as your teacher uses. Your teacher can change it.")+'</p>';

mc", "q": "The ___ of buses in our village is terrible – only two a day.", "o": ["frequent", "frequently", "frequency"], "a": 2}, {"t": "mc", "q": "Gaming has the potential ___ help students with maths.", "o": ["to", "for", "of"], "a": 0}, {"t": "mc", "q": "There is huge potential ___ growth in the games industry.", "o": ["to", "of", "for"], "a": 2}, {"t": "mc", "q": "My parents are anxious ___ how much time I spend online.", "o": ["of", "about", "with"], "a": 1}, {"t": "mc", "q": "People are playing online games ___ increasing frequency.", "o": ["in", "with", "at"], "a": 1}, {"t": "mc", "q": "Someone who speaks many languages is ___.", "o": ["multilingual", "multiplayer", "multiple"], "a": 0}, {"t": "mc", "q": "This is a ___ game – you can play with people all over the world.", "o": ["multiplayer", "multicoloured", "multiple"], "a": 0}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "A PlayStation is an example of a games ___.", "o": ["controller", "screen", "console"], "a": 2}, {"t": "mc", "q": "We should be able to talk openly about our mental ___.", "o": ["mind", "state", "health"], "a": 2}, {"t": "mc", "q": "My mum told me to ___ my console and do my homework.", "o": ["cut down", "put away", "take over"], "a": 1}, {"t": "mc", "q": "I should ___ on the amount of sugar I eat.", "o": ["put away", "cut down", "turn down"], "a": 1}, {"t": "mc", "q": "In a multiplayer game, the person you play against is your ___.", "o": ["opponent", "partner", "referee"], "a": 0}, {"t": "mc", "q": "The ___ in this game are amazing – everything looks real.", "o": ["graphics", "lyrics", "genres"], "a": 0}, {"t": "mc", "q": "In ___ games you have to plan carefully to win.", "o": ["multiple", "frequency", "strategy"], "a": 2}, {"t": "mc", "q": "I’m not really ___ video games – I prefer football.", "o": ["onto", "off", "into"], "a": 2}, {"t": "mc", "q": "Otto ___ his mum to let him play, but she me for homework and more sleep.’ His mum is happy, too – although she says one hour often becomes an hour and a half."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "What was Timur’s problem before?", "o": ["He didn’t have a games console.", "He was bad at maths games.", "He played until late and was always tired."], "a": 2}, {"t": "mc", "q": "According to the study, which students can do better at school?", "o": ["students who never play", "students who play sometimes", "students who play every day"], "a": 1}, {"t": "mc", "q": "What kind of game did Timur start playing?", "o": ["a big multiplayer game", "a football game", "a single-player strategy game"], "a": 2}, {"t": "mc", "q": "Why does Timur think his marks improved?", "o": ["Games made him cleverer.", "He had more time for homework and sleep.", "His teacher gave him extra lessons."], "a": 1}, {"t": "mc", "q": "What does Timur’s mum say?", "o": ["He should stop gaming completely.", "He sometimes plays for longer than an hour.", "She enjoys playing with him."], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear Dana interviewing her friend Nurlan for a school project on gaming.", "script": [["Dana", "Nurlan, can I ask you some questions for my project? It’s about gaming habits."], ["Nurlan", "Sure. Go ahead."], ["Dana", "How often do you play video games?"], ["Nurlan", "Not very often, actually. Maybe twice a week, usually at the weekend."], ["Dana", "And how long do you play for?"], ["Nurlan", "About forty minutes. After that I get bored. I’d rather be outside on my bike."], ["Dana", "Do you play alone or with other people?"], ["Nurlan", "Alone, mostly. Multiplayer games make me anxious – people shout at you if you make a mistake."], ["Dana", "Interesting. Do you think gaming affects your marks?"], ["Nurlan", "Not mine. But my cousin Arman plays every night for three hours, and his marks are terrible. His parents took his console away last month."], ["Dana", "Wow. Last question – would you like a job in the games industry?"], ["Nurlan", "Maybe in graphics. I love drawing, so designing game worlds would be cool."]]}, "parts": [{"items": [{"t": "mc", "q": "How often does Nurlan play video games?", "o": ["about twice a week", "every evening", "only in the holidays"], "a": 0}, {"t": "mc", "q": "Why does he usually stop after about forty minutes?", "o": ["His mum tells him to.", "He gets bored.", "His eyes start to hurt."], "a": 1}, {"t": "mc", "q": "Why doesn’t Nurlan like multiplayer games?", "o": ["They are too expensive.", "His internet is too slow.", "Other players shout at him."], "a": 2}, {"t": "mc", "q": "What happened to Nurlan’s cousin Arman?", "o": ["His marks got much better.", "He started playing on his own.", "His parents took his console away."], "a": 2}, {"t": "mc", "q": "What job might Nurlan like in the future?", "o": ["designing graphics for games", "testing games", "being a professional gamer"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "anxious/anxiety, frequent/frequency, potential for, multi-; games console, multiplayer, cut down on, put away, opponent, graphics.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["How often do you play video games, and for how long?", "Do you prefer single-player or multiplayer games? Why?", "What makes you feel anxious, and what helps you relax?", "Is there anything you would like to cut down on?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Can video games really help students get better marks?", "Should parents limit how much time teenagers spend gaming?", "Should schools use video games in lessons?"]}]}}]}, {"id": "t14", "kind": "quick", "group": "t1.4", "title": "Unit 1.4 Test", "focus": "1.4 YouTubers: words that change stress as nouns and verbs (conduct) and job/industry words (broadcaster – broadcasting, animator – animation); YouTube vocabulary (view, subscriber, revenue, host, found, acquire).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "A person who works in broadcasting is a ___.", "o": ["broadcast", "broadcaster", "broadcasting"], "a": 1}, {"t": "mc", "q": "Someone who makes cartoons works in ___.", "o": ["animator", "animate", "animation"], "a": 2}, {"t": "mc", "q": "A ___ writes computer programs.", "o": ["coder", "coding", "code"], "a": 0}, {"t": "mc", "q": "She wants a job in web ___.", "o": ["development", "developer", "develop"], "a": 0}, {"t": "mc", "q": "My cousin is a software ___ at a big tech company.", "o": ["engineering", "engineer", "engine"], "a": 1}, {"t": "mc", "q": "In the noun ‘conduct’ (He was sent off for bad conduct), the stress is on ___.", "o": ["the second syllable", "both syllables equally", "the first syllable"], "a": 2}, {"t": "mc", "q": "In the verb ‘conduct’ (We conducted a survey), the stress is on ___.", "o": ["the first syllable", "the second syllable", "neither syllable"], "a": 1}, {"t": "mc", "q": "An ___ programmer teaches machines to act like humans.", "o": ["animation", "AI", "broadcast"], "a": 1}, {"t": "mc", "q": "Researchers ___ a survey about teenagers’ dream jobs.", "o": ["founded", "hosted", "conducted"], "a": 2}, {"t": "mc", "q": "Which word is stressed on the first syllable?", "o": ["a record (noun)", "to record (verb)", "to present (verb)"], "a": 0}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "The video has been watched two million times – that’s two million ___.", "o": ["subscribers", "revenues", "views"], "a": 2}, {"t": "mc", "q": "People who choose to follow a YouTube channel are its ___.", "o": ["subscribers", "views", " y, has more than 40,000. Her short videos show simple recipes that teenagers can make without help."], ["", "Aliya says the hardest part is not filming but editing. ‘A ten-minute video can take five hours to edit,’ she explains. ‘You need a lot of patience. And you have to keep people watching – if the first ten seconds are boring, they leave.’"], ["", "Her parents were not sure at first. Her father wanted her to become a doctor and worried that the internet was not a safe place. They agreed on some rules: no personal information in videos, homework first, and all comments are checked by her mother."], ["", "The channel now earns a small amount of revenue from adverts, which Aliya saves for university. She does not plan to be a full-time YouTuber, though. ‘I’d like to study animation,’ she says. ‘YouTube taught me that I love telling stories, not just cooking.’"]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Who were Aliya’s first subscribers?", "o": ["mostly members of her family", "about 40,000 teenagers", "other cooking YouTubers"], "a": 0}, {"t": "mc", "q": "According to Aliya, what is the most difficult part of her work?", "o": ["filming", "cooking", "editing"], "a": 2}, {"t": "mc", "q": "Why are the first ten seconds of a video important?", "o": ["That is where the adverts go.", "Aliya says her name then.", "Viewers leave if they are boring."], "a": 2}, {"t": "mc", "q": "Which rule did Aliya’s family agree on?", "o": ["She can only film at weekends.", "Her mother checks the comments.", "Her father edits the videos."], "a": 1}, {"t": "mc", "q": "What does Aliya want to do in the future?", "o": ["become a full-time YouTuber", "study animation", "become a doctor"], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a careers adviser, Mr Bekov, talking to a student, Timur, about jobs in tech.", "script": [["Timur", "Mr Bekov, I want to be a YouTuber. Is that a real job?"], ["Mr Bekov", "It can be, but only a very small number of people earn enough to live on. What do you enjoy about it?"], ["Timur", "I like making the videos – filming, editing, adding music and effects."], ["Mr Bekov", "Then you could think about broadcasting or animation. Those industries need people with exactly those skills."], ["Timur", "What would I need to study?"], ["Mr Bekov", "For animation, you need to be good at art and design. For broadcasting, a media course would help. Are you good at maths?"], ["Timur", "Not bad. Why?"], ["Mr Bekov", "Because if you like computers, software engineering is another option. It’s tough, but there are lots of jobs."], ["Timur", "My parents would prefer that, I think."], ["Mr Bekov", "Well, here’s my advice. Keep making videos as a hobby – it develops your creativity and time management. But choose a subject at university that gives you more options."]]}, "parts": [{"items": [{"t": "mc", "q": "What does Mr Bekov say about being a YouTuber?", "o": ["It isn’t a real job.", "You need a university degree.", "Very few people earn enough money from it."], "a": 2}, {"t": "mc", "q": "What does Timur enjoy most?", "o": ["being famous online", "making and editing videos", "watching other YouTubers"], "a": 1}, {"t": "mc", "q": "For animation, you need to be good at ___.", "o": ["maths", "media studies", "art and design"], "a": 2}, {"t": "mc", "q": "Why does Mr Bekov mention software engineering?", "o": ["There are lots of jobs in it.", "It is an easy subject.", "Timur’s parents work in it."], "a": 0}, {"t": "mc", "q": "What is Mr Bekov’s advice?", "o": ["Keep making videos as a hobby.", "Stop making videos and study.", "Start a broadcasting job now."], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "conduct (noun/verb), broadcaster, animator, coder, software engineer; views, subscribers, revenue, edit, patience, creativity.", "tasks": [{"name": "Long turn", "mins": 3, "lead": "The student compares two picture  photos are public at first."], "a": 2}, {"t": "mc", "q": "In WordDuel, you play against ___.", "o": ["your classmates", "the computer", "someone you don’t know"], "a": 2}, {"t": "mc", "q": "Which app did the class think was the most useful?", "o": ["PhotoQuest", "WordDuel", "StudyStreak"], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear Aliya asking her older cousin Marat for advice about a fitness app.", "script": [["Aliya", "Marat, I want to get fitter before the school sports day. Do you know any good apps?"], ["Marat", "If I were you, I’d try RunBuddy. It’s free and it makes a personalised plan for you."], ["Aliya", "Do I have to register?"], ["Marat", "Yes, but only with an email. Then you activate your account from the link they send you."], ["Aliya", "My mum’s worried about apps that share your location."], ["Marat", "That’s fair. Why don’t you turn off location sharing in the privacy settings? You can still use the app."], ["Aliya", "OK. How often should I run?"], ["Marat", "The app starts slowly – three times a week, twenty minutes. What about asking Dana to join you? It’s easier when you’re not alone."], ["Aliya", "Good idea. She’s much more motivated than me!"], ["Marat", "And would you like to borrow my old headphones? Running with music helps."], ["Aliya", "Yes, please! Thanks, Marat."]]}, "parts": [{"items": [{"t": "mc", "q": "Why does Aliya want a fitness app?", "o": ["to get fitter for sports day", "to win a running contest", "to lose weight for a party"], "a": 0}, {"t": "mc", "q": "What does Marat say about RunBuddy?", "o": ["It’s expensive but good.", "It’s only for professional runners.", "It’s free and personalised."], "a": 2}, {"t": "mc", "q": "What is Aliya’s mother worried about?", "o": ["apps that share your location", "the cost of the app", "the time Aliya spends on her phone"], "a": 0}, {"t": "mc", "q": "How does the app’s plan start?", "o": ["a run every day", "three runs donkeys", "digging", "litter"], "a": 2}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Firefighters <b>r</b>{} three dogs from the burning house.", "a": [["escued"]], "pre": ["r"]}, {"t": "gap", "q": "You don’t have to wait until you’re a <b>g</b>{} to make a difference.", "a": [["rown-up"]], "pre": ["g"]}, {"t": "gap", "q": "Child <b>l</b>{} must be stopped – children should be at school.", "a": [["abour"]], "pre": ["l"]}, {"t": "gap", "q": "Our school’s parent <b>a</b>{} organised a clean-up of the park.", "a": [["ssociation"]], "pre": ["a"]}, {"t": "gap", "q": "I help my grandmother with the <b>d</b>{} in her vegetable garden.", "a": [["igging"]], "pre": ["d"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Saturdays at the shelter", "paras": [["", "Every Saturday morning, while most of her friends are still asleep, 14-year-old Dana Ospanova takes the bus to an animal shelter on the edge of Kostanay. She cleans the cages, feeds about thirty dogs and takes the friendliest ones for a walk. The work is unpaid and often cold, but Dana says it is the best part of her week."], ["", "Many of the animals were abandoned by their owners, and some arrive frightened and thin. ‘When a dog that was scared of people finally lets you touch it, that’s an amazing feeling,’ Dana says."], ["", "Volunteering has changed Dana too. She used to be very shy and never spoke in class. Now she gives short talks at local schools about looking after pets and asks students to help with food collections. ‘I didn’t know I had any leadership skills,’ she laughs."], ["", "The shelter’s manager, Ruslan, says teenage volunteers are some of the most reliable helpers he has. However, he reminds them that volunteering should not get in the way of schoolwork. Dana agrees: she only goes on Saturdays and does her homework on Sundays."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "What does Dana do at the shelter?", "o": ["She builds new cages.", "She cleans, feeds and walks the dogs.", "She works in the office."], "a": 1}, {"t": "mc", "q": "How does Dana feel about her work?", "o": ["It’s the best part of her week.", "It’s boring but useful.", "She would like to be paid for it."], "a": 0}, {"t": "mc", "q": "What does Dana find amazing?", "o": ["when a frightened dog starts to trust her", "when a family adopts a dog", "when her friends visit the shelter"], "a": 0}, {"t": "mc", "q": "How has volunteering changed Dana?", "o": ["She wants to become a vet.", "She has less time for her friends.", "She is more confident now."], "a": 2}, {"t": "mc", "q": "What does Ruslan say about teenage volunteers?", "o": ["They are reliable, but school comes first.", "They are too young to help.", "They should come every day."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear Timur telling his friend Aliya about volunteering in his grandparents’ village.", "script": [["Aliya", "Timur, where were you all last weekend?"], ["Timur", "In my grandparents’ village. I joined a volunteer group that helps older people there."], ["Aliya", "What did you do?"], ["Timur", "Mostly practical things. On Saturday we fixed a fence and did some digging in an old man’s vegetable garden. He can’t do it himself any more."], ["Aliya", "Sounds tiring!"], ["Timur", "It was! But on Sunday I taught two grandmothers how to make video calls. Their grandchildren live in Astana and Germany."], ["Aliya", "That’s lovely. Were they good at it?"], ["Timur", "Not at first. One kept pressing the wrong button. But by the end she called her grandson by herself and started crying because she was so happy."], ["Aliya", "Are you going again?"], ["Timur", "Yes, next month. Actually, they need more volunteers. Do you want to come? You don’t need any special skills – just patience."], ["Aliya", "I’d love to. I’ll ask my parents tonight."]]}, "parts": [{"items": [{"t": "mc", "q": "Who does Timur’s volunteer group help?", "o": ["children at a village school", "older people in the village", "animals on a farm"], "a": 1}, {"t": "mc", "q": "What did Timur do on Saturday?", "o": ["He taught video calls.", "He travelled to Astana.", "He fixed a fence and dug a garden."], "a": 2}, {"t": "mc", "q": "Where do the grandmothers’ grandchildren live?", "o": ["in the same village", "in Kostanay", "in Astana and Germany"], "a": 2}, {"t": "mc", "q": "Why did one grandmother cry?", "o": ["She kept pressing the wrong button.", "She was happy that she could call her grandson.", "She missed her grandson."], "a": 1}, {"t": "mc", "q": "What do new volunteers need, according to Timur?", "o": ["patience", "special skills", "a car"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "un- adjectives (unpaid, unfair, unreliable); voluntary, shelter, passionate, leadership, conservation, self-confidence, rural.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Have you ever done any voluntary work? What did you do?", "What are you passionate about?", "Is there an animal shelter or a conservation project near where you live?", "Describe a time when something seemed unfair to you."]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Should all students do some voluntary work every year?", "Is it better to help people or animals?", "Can teenagers really make a difference in their community?"]}]}}]}, {"id": "t22", "kind": "quick", "group": "t2.2", "title": "Unit 2.2 Test", "focus": "2.2 Ethical travel: strong adjectives and negative prefixes (furious, miserable, ridiculous; dishonest, unethical); responsible tourism vocabulary (carbon footprint, captivity, under threat, ecosystem, awareness).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "I wasn’t just angry – I was absolutely ___!", "o": ["annoyed", "furious", "cross"], "a": 1}, {"t": "mc", "q": "Flying cars for everyone by next year? That’s a ___ idea.", "o": ["ridiculous", "sincere", "beneficial"], "a": 0}, {"t": "mc", "q": "The opposite of honest is ___.", "o": ["unhonest", "inhonest", "dishonest"], "a": 2}, {"t": "mc", "q": "Using wild animals in circuses is ___.", "o": ["disethical", "unethical", "inethical"], "a": 1}, {"t": "mc", "q": "It rained every day of our holiday and we felt ___.", "o": ["miserable", "beneficial", "sincere"], "a": 0}, {"t": "mc", "q": "Which adjective can go with ‘absolutely’?", "o": ["angry", "sad", "furious"], "a": 2}, {"t": "mc", "q": "Volunteering abroad can be ___ for both volunteers and local people.", "o": ["beneficial", "benefit", "beneficially"], "a": 0}, {"t": "mc", "q": "He always says what he really means. He’s very ___.", "o": ["awkward", "dishonest", "sincere"], "a": 2}, {"t": "mc", "q": "It was an ___ moment when I called my teacher ‘Mum’.", "o": ["beneficial", "awkward", "sincere"], "a": 1}, {"t": "mc", "q": "The journey was very ___: three trains, two buses and a ferry.", "o": ["sincere", "dishonest", "complicated"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Flying increases your carbon ___.", "o": ["footprint", "awareness", "ecosystem"], "a": 0}, {"t": "mc", "q": "Sharks are under ___ because of overfishing.", "o": ["captivity", "threat", "destruction"], "a": 1}, {"t": "mc", "q": "Animals in zoos live in ___.", "o": ["captivity", "ecosystems", "slums"], "a": 0}, {"t": "mc", "q": "Dolphins and whales are ___, not fish.", "o": ["reptiles", "ecosystems", "mammals"], "a": 2}, {"t": "mc", "q": "The campaign aims to raise ___ of plastic pollution.", "o": ["footprint", "threat", "awareness"], "a": 2}, {"t": "mc", "q": "Humans are ___ for the destruction of many forests.", "o": ["unethical", "responsible", "sincere"], "a": 1}, {"t": "mc", "q": "A very poor area of a city with houses in bad condition is a ___.", "o": ["shelter", "slum", "ecosystem"], "a": 1}, {"t": "mc", "q": "The ___ of the rainforest is a disaster for wildlife.", "o": ["destruction", "awareness", "captivity"], "a": 0}, {"t": "mc", "q": "All the plants and animals in a lake form an ___.", "o": ["ecosystem", "awareness", "footprint"], "a": 0}, {"t": "mc", "q": "Travelling abroad to do volunteer work is called ___.", "o": ["conservation", "sightseeing", "voluntourism"], "a": 2}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Riding elephants is <b>u</b>{} because the animals are often treated badly.", "a": [["nethical"]], "pre": ["u"]}, {"t": "gap", "q": "Taking the train instead of flying reduces your carbon <b>f</b>{}.", "a": [["ootprint"]], "pre": ["f"]}, {"t": "gap", "q": "Polar bears are under <b>t</b>{} because the ice is melting.", "a": [["hreat"]], "pre": ["t"]}, {"t": "gap", "q": "Throwing rubbish in the lake damages the local <b>e</b>{}.", "a": [["cosystem"]], "pre": ["e"]}, {"t": "gap", "q": "Some children were <b>m</b>{} when the volunteers left.", "a": [["iserable"]], "pre": ["m"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Is your holiday helping or harming?", "paras": [["", "Every year, thousands of young people pay to spend a few weeks volunteering abroad. They teach English, build schools or work with animals. This kind of travel, called voluntourism, sounds wonderful – but experts say it is not always as helpful as it looks."], ["", "One problem is time. Children in orphanages may get close to a volunteer, only to see them leave after two weeks. Some charities say this can make children miserable and unable to trust adults. Another problem is skills: a teenager with no training may build a wall that local builders then have to rebuild."], ["", "Animal projects can also be unethical. Some ‘sanctuaries’ keep tigers or elephants in captivity so that tourists can take photos with them, and the money does not help wild animals at all."], ["", "So should you stay at home? Not necessarily. Responsible organisations work with local people, ask volunteers to stay for longer and choose tasks that match their skills. Before you book, ask where the money goes and who decides what work is needed. Think about your carbon footprint, too – sometimes the most ethical trip is the one closer to home."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "What is the writer’s main point in the first paragraph?", "o": ["Voluntourism is always harmful.", "Voluntourism is cheaper than a normal holiday.", "Voluntourism isn’t always as helpful as it seems."], "a": 2}, {"t": "mc", "q": "Why can short visits be bad for children in orphanages?", "o": ["Volunteers are often rude to them.", "They get close to volunteers who soon leave.", "The children have to work for the volunteers."], "a": 1}, {"t": "mc", "q": "What problem with untrained volunteers is mentioned?", "o": ["They are often lazy.", "Their work may need to be done again.", "They spend too much money."], "a": 1}, {"t": "mc", "q": "Some animal ‘sanctuaries’ ___.", "o": ["keep animals so tourists can take photos", "return animals to the wild", "are run by local people"], "a": 0}, {"t": "mc", "q": "What advice does the writer give?", "o": ["Never travel abroad.", "Only work with animals.", "Ask where your money goes."], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear Dana and her father planning a family holiday.", "script": [["Dad", "So, Dana, where shall we go this summer? Your mum wants Turkey again."], ["Dana", "Dad, return flights for four people make a huge carbon footprint. What about Burabay? We can go by train."], ["Dad", "The train takes all night, though."], ["Dana", "That’s part of the fun! And we’d spend our money in local guest houses, not big international hotels."], ["Dad", "Fair point. But your brother wants to see dolphins. There’s a dolphin show in Turkey."], ["Dana", "Those dolphins live in captivity, Dad. It’s really unethical. They swim in a tiny pool all their lives."], ["Dad", "I didn’t know that. Hmm. Is there anything for him to do in Burabay?"], ["Dana", "There’s horse riding, boat trips on the lake and hiking. And he can see wild animals in the national park."], ["Dad", "All right. I’ll talk to your mum. But if it rains all week and we’re miserable, it’s your fault!"], ["Dana", "Deal!"]]}, "parts": [{"items": [{"t": "mc", "q": "Why doesn’t Dana want to fly to Turkey?", "o": ["because it is too expensive", "because she doesn’t like hot weather", "because of the carbon footprint"], "a": 2}, {"t": "mc", "q": "What does Dana’s father say about the train?", "o": ["It takes all night.", "It is too expensive.", "There are no tickets left."], "a": 0}, {"t": "mc", "q": "Why does Dana prefer local guest houses?", "o": ["They are more comfortable.", "The money stays with local people.", "They have swimming pools."], "a": 1}, {"t": "mc", "q": "What does Dana think about the dolphin show?", "o": ["It is unethical.", "It is boring.", "It is too far away."], "a": 0}, {"t": "mc", "q": "What does Dad say at the end?", "o": ["He will book the train now.", "He will talk to Dana’s mum.", "They will go to Turkey."], "a": 1}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "furious, miserable, ridiculous, awkward, beneficial, complicated; unethical, carbon footprint, captivity, under threat, ecosystem.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", . The hospital used the extra money to paint the playroom and buy a games console. ‘We were amazed by people’s generosity,’ says their teacher. The students are already planning next year’s event."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why did the students want to raise money?", "o": ["for a school trip", "for an animal shelter", "for a hospital playroom"], "a": 2}, {"t": "mc", "q": "How much did the cake sale raise?", "o": ["200,000 tenge", "45,000 tenge", "610,000 tenge"], "a": 1}, {"t": "mc", "q": "How did the students raise money on the walk?", "o": ["They sold cakes along the way.", "They sold tickets to watch.", "People sponsored them for each kilometre."], "a": 2}, {"t": "mc", "q": "What was special about Timur?", "o": ["He wore the penguin costume.", "He walked much further than most students.", "He organised the whole event."], "a": 1}, {"t": "mc", "q": "How did the hospital use the extra money?", "o": ["It built a new hospital.", "It painted the playroom and bought a console.", "It gave the money back."], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a radio reporter talking to Dana at the start of a charity fun run.", "script": [["Reporter", "Hi! You look fabulous. What are you dressed as?"], ["Dana", "A sunflower! It’s really hot inside this costume, though."], ["Reporter", "Why are you running today?"], ["Dana", "I’m raising money for an animal welfare charity. They look after dogs and cats that have been abandoned."], ["Reporter", "How much have you raised so far?"], ["Dana", "About thirty thousand tenge. My aunt promised to double it if I finish in under an hour."], ["Reporter", "That’s generous! How far is the race?"], ["Dana", "It’s ten kilometres – it’s not a full marathon, thank goodness. My older brother is doing the half marathon, though."], ["Reporter", "Is he here?"], ["Dana", "Somewhere at the front. He started twenty minutes ago, so I’ll never catch him u exception", "trainee"], "a": 1}, {"t": "mc", "q": "A ___ teacher is still learning how to teach.", "o": ["head", "council", "trainee"], "a": 2}, {"t": "mc", "q": "Rain was ___ down, so we stayed inside.", "o": ["pouring", "seeking", "dropping"], "a": 0}, {"t": "mc", "q": "The council is ___ new ideas from students.", "o": ["seeking", "pouring", "excepting"], "a": 0}, {"t": "mc", "q": "My parents were very ___ of my decision to join the council.", "o": ["sympathetic", "dull", "supportive"], "a": 2}, {"t": "mc", "q": "___ for the school council means asking students to vote for you.", "o": ["Walking", "Running", "Seeking"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Everyone voted for Aliya to be the class <b>r</b>{}.", "a": [["epresentative"]], "pre": ["r"]}, {"t": "gap", "q": "The students gave a <b>p</b>{} to the head teacher about their idea.", "a": [["resentation"]], "pre": ["p"]}, {"t": "gap", "q": "Our election <b>c</b>{} promised longer lunch breaks.", "a": [["ampaign"]], "pre": ["c"]}, {"t": "gap", "q": "Council members <b>v</b>{} on every new idea.", "a": [["ote"]], "pre": ["v"]}, {"t": "gap", "q": "The head teacher was very <b>s</b>{} of the plan.", "a": [["upportive"]], "pre": ["s"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "How we got a quiet room", "paras": [["", "At our school in Kostanay, the corridors are noisy and crowded at break time. Many students, especially younger ones, told the school council that they had nowhere calm to go. So last autumn the council decided to ask the head for a ‘quiet room’."], ["", "Our first idea failed. We simply asked for a room, and the head said there wasn’t one available. Then our council president, Dana, had a better idea. ‘If we find a room ourselves and plan everything, she will listen,’ she said."], ["", "We looked everywhere and finally found an old storeroom next to the library. We asked students what they wanted in the room: beanbags, books, plants and a ‘no phones’ rule. A trainee art teacher offered to help us paint it, and parents donated furniture."], ["", "When we presented our plan, the head was impressed. ‘If you look after it, you can have it,’ she said. The quiet room opened in February. It is used by about forty students every day, and, with only one exception, nobody has broken the no-phones rule."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why did students want a quiet room?", "o": ["They needed a place for homework.", "The corridors were noisy and crowded.", "The council needed a meeting room."], "a": 1}, {"t": "mc", "q": "Why did the council’s first request fail?", "o": ["The head said there was no room available.", "It was too expensive.", "The students didn’t vote for it."], "a": 0}, {"t": "mc", "q": "Where is the quiet room?", "o": ["next to the library", "next to the head’s office", "in the old gym"], "a": 0}, {"t": "mc", "q": "Who helped to paint the room?", "o": ["the head", "the younger students", "a trainee art teacher"], "a": 2}, {"t": "mc", "q": "What did the head say about the plan?", "o": ["They had to pay for the furniture.", "Only council members could use the room.", "They could have the room if they looked after it."], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two students, Timur and Aliya, preparing for a school council election.", "script": [["Timur", "Aliya, I’ve written my speech for the council election. Can I practise it on you?"], ["Aliya", "Sure. Go ahead."], ["Timur", "‘If you vote for me, I will make sure every class has a voice. I will also ask for a water fountain on every floor.’"], ["Aliya", "That’s good, but it’s a bit dull. You need something more exciting at the start."], ["Timur", "Like what?"], ["Aliya", "Tell a story. Remember when the heating broke and we had lessons in our coats? Start with that."], ["Timur", "Oh, good idea. Then I can say that if students report problems, the council will act quickly."], ["Aliya", "Exactly. And don’t promise things you can’t do. Last year someone promised no homework on Fridays. Nobody believed him."], ["Timur", "Ha! OK. When is the election?"], ["Aliya", "Next Thursday. The speeches are on Tuesday in the hall."], ["Timur", "Will you help me make a poster as well?"], ["Aliya", "If you buy me a hot chocolate, I will!"]]}, "parts": [{"items": [{"t": "mc", "q": "What does Timur promise in his speech?", "o": ["no homework on Fridays", "a water fountain on every floor", "longer lunch breaks"], "a": 1}, {"t": "mc", "q": "What does Aliya think of the speech at first?", "o": ["It’s a bit boring.", "It’s much too long.", "It’s excellent."], "a": 0}, {"t": "mc", "q": "What does Aliya suggest?", "o": ["speaking more loudly", "starting with a story", "making the speech shorter"], "a": 1}, {"t": "mc", "q": "What does Aliya say about last year’s election?", "o": ["Someone made a promise nobody believed.", "Timur lost by one vote.", "The speeches were cancelled."], "a": 0}, {"t": "mc", "q": "When are the speeches?", "o": ["on Thursday", "on Friday", "on Tuesday"], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "somehow, somewhere, someone, something; first conditional (If you vote for me, I will …); council, head, supportive, sympathetic, dull, trainee.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Who is the head of your school? What are they like?", "In your opinion, what is the dullest subject at school? Why?", "What will you do if you get good marks this term?", "Has someone ever been really supportive of you? What did they do?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Should students have a say in school rules?", "What would you change if you were on the school council?", "Is it better to have a strict head teacher or a friendly one?"]}]}}]}, {"id": "t31", "kind": "quick", "group": "t3.1", "title": "Unit 3.1 Test", "focus": "3.1 Unusual sports: modal verbs would, might, could and ’d (hypothetical situations, possibility, past ability); have a + noun; sports vocabulary (have a go at, tournament, prohibited, artificial, energetic…).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "If you could be any athlete for a day, who ___ you be?", "o": ["would", "will", "did"], "a": 0}, {"t": "mc", "q": "I’m not sure yet, but I ___ try sepak takraw at the weekend.", "o": ["might to", "would to", "might"], "a": 2}, {"t": "mc", "q": "When I was eight, I ___ swim, but I couldn’t ride a bike.", "o": ["can", "could", "might"], "a": 1}, {"t": "mc", "q": "I’d love to go canoeing. ___ you like to come with me?", "o": ["Would", "Will", "Might"], "a": 0}, {"t": "mc", "q": "In ‘I’d try it if I had the chance’, ‘I’d’ means ___.", "o": ["I had", "I did", "I would"], "a": 2}, {"t": "mc", "q": "You ___ be great at joggling – you’re good at juggling and running!", "o": ["could to", "could", "can to"], "a": 1}, {"t": "mc", "q": "Which modal verb is the past of ‘can’?", "o": ["might", "could", "would"], "a": 1}, {"t": "mc", "q": "Which sentence talks about a possibility?", "o": ["I can swim 50 metres.", "Would you like a drink?", "It might rain during the match."], "a": 2}, {"t": "mc", "q": "Let’s have a ___ at curling – it looks fun!", "o": ["go", "try", "play"], "a": 0}, {"t": "mc", "q": "After the match, I always have a long ___.", "o": ["showering", "shower", "showered"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "A person who rescues swimmers at a pool or beach is a ___.", "o": ["lifeguard", "referee", "coach"], "a": 0}, {"t": "mc", "q": "Not natural, made by people = ___", "o": ["curved", "energetic", "artificial"], "a": 2}, {"t": "mc", "q": "Not allowed = ___", "o": ["registered", "prohibited", "regarded"], "a": 1}, {"t": "mc", "q": "A competition with different rounds or levels is a ___.", "o": ["lesson", "defence", "tournament"], "a": 2}, {"t": "mc", "q": "To move smoothly over ice or a wet floor is to ___.", "o": ["slide", "sweep", "vary"], "a": 0}, {"t": "mc", "q": "To clean the floor with a brush is to ___.", "o": ["slide", "regard", "sweep"], "a": 2}, {"t": "mc", "q": "Ticket prices ___ depending on the day you go.", "o": ["sweep", "vary", "register"], "a": 1}, {"t": "mc", "q": "A place with a frozen floor for skating is an ___.", "o": ["ice rink", "ice court", "ice pitch"], "a": 0}, {"t": "mc", "q": "The part of a team that stops the other team scoring is the ___.", "o": ["attack", "defence", "referee"], "a": 1}, {"t": "mc", "q": "If something is available for people to choose, it is ___.", "o": ["in offer", "at offer", "on offer"], "a": 2}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "The ball <b>c</b>{} through the air and landed in the lake.", "a": [["urved"]], "pre": ["c"]}, {"t": "gap", "q": "Everyone has to <b>r</b>{} for sports week by Friday.", "a": [["egister"]], "pre": ["r"]}, {"t": "gap", "q": "My little brother is so <b>e</b>{} – he never gets tired!", "a": [["nergetic"]], "pre": ["e"]}, {"t": "gap", "q": "Many people <b>r</b>{} curling as a strange sport, but it’s really exciting.", "a": [["egard"]], "pre": ["r"]}, {"t": "gap", "q": "We went <b>c</b>{} on the Tobol River last summer.", "a": [["anoeing"]], "pre": ["c"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Sports you might not know", "paras": [["", "Bored of football? Underwater hockey might be the sport for you. Players wear masks and fins and use a small stick to push a heavy puck along the bottom of a swimming pool. You can’t breathe underwater, of course, so you have to come up for air every 20 or 30 seconds."], ["", "Bossaball comes from Spain and mixes volleyball, football and gymnastics. It is played on an inflatable court with a trampoline on each side. Players can hit the ball with any part of their body, and the points vary depending on where the ball lands."], ["", "Chess boxing is exactly what it sounds like. Two opponents take turns playing chess and boxing, one round of each. You can win by checkmate or by knockout, so you need a quick brain as well as strong arms. Some people regard it as the hardest sport in the world."], ["", "Finally, in Kazakhstan, many children have a go at asyk atu, a traditional game played with sheep bones. Players try to knock their opponent’s bones out of a line by throwing a heavy bone at them. UNESCO has recognised the game as an important part of Kazakh culture."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "In underwater hockey, players must ___.", "o": ["come up for air regularly", "play without masks", "stay on the surface"], "a": 0}, {"t": "mc", "q": "Bossaball is played ___.", "o": ["on an inflatable court", "in a swimming pool", "on ice"], "a": 0}, {"t": "mc", "q": "In bossaball, the number of points ___.", "o": ["is always the same", "depends on the player’s height", "depends on where the ball lands"], "a": 2}, {"t": "mc", "q": "Chess boxing players need ___.", "o": ["only good chess skills", "a quick mind and physical strength", "a partner and a trampoline"], "a": 1}, {"t": "mc", "q": "What do players use in asyk atu?", "o": ["sheep bones", "stones", "sticks and a puck"], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two students, Dana and Timur, choosing an activity for sports week.", "script": [["Timur", "Hi Dana. Have you registered for sports week yet?"], ["Dana", "Not yet. What’s on offer this year?"], ["Timur", "There’s ice skating, climbing, canoeing and something called padel."], ["Dana", "Canoeing would be fun, but it’s October in Kostanay! The river might be freezing."], ["Timur", "True. And the ice rink is in the city centre, so we’d need to take a bus."], ["Dana", "What about climbing? It looks really energetic."], ["Timur", "I’m not very tall, but I could try. The wall is in the school gym, and they let you practise on Monday."], ["Dana", "Great. Let’s have a go at climbing, then. If I fall, you can laugh at me!"], ["Timur", "Deal. I’ll register us both today."]]}, "parts": [{"items": [{"t": "mc", "q": "Why doesn’t Dana want to go canoeing?", "o": ["She can’t swim.", "It’s too expensive.", "The water might be very cold."], "a": 2}, {"t": "mc", "q": "Where is the ice rink?", "o": ["next to the school", "in the city centre", "by the river"], "a": 1}, {"t": "mc", "q": "Where is the climbing wall?", "o": ["in the school gym", "in the city centre", "at a sports club"], "a": 0}, {"t": "mc", "q": "When can students practise climbing?", "o": ["at the weekend", "on Monday", "on Friday"], "a": 1}, {"t": "mc", "q": "Who will register for the activity?", "o": ["Dana", "their teacher", "Timur"], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "would, might, could, ’d; have a go at, tournament, prohibited, energetic, on offer.", "tasks": [{"name": "Role play", "mins": 3, "lead": "The teacher is a new student at a sports centre; the student answers and makes suggestions, using would, might and could.", "prompts": ["What sports are on offer this term?", "I can’t swim. Which sport would be good for me?", "Are any sports prohibited for students under 16?", "What might I need to bring to my first lesson?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["If you could invent a new sport, what would it be like?", "Which unusual sport would you like to have a go at? Why?", "Should dangerous sports be prohibited?"]}]}}]}, {"id": "t32", "kind": "quick", "group": "t3.2", "title": "Unit 3.2 Test", "focus": "3.2 Sports stars going vegan: separable and inseparable phrasal verbs (cut out, cut down on, look after, call off, get on with); diet and sport vocabulary (protein, dairy, carbohydrate, cruelty, organic…).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "I want to cut ___ on sugar this month.", "o": ["out", "down", "off"], "a": 1}, {"t": "mc", "q": "The match was cancelled because of the snow. They called ___.", "o": ["it off", "off it", "it of"], "a": 0}, {"t": "mc", "q": "Choose the correct sentence.", "o": ["She cut out of her diet meat.", "She out cut meat of her diet.", "She cut meat out of her diet."], "a": 2}, {"t": "mc", "q": "Which phrasal verb CANNOT be separated?", "o": ["cut out", "call off", "get on with"], "a": 2}, {"t": "mc", "q": "Do you get ___ your brother?", "o": ["with on", "on with", "on"], "a": 1}, {"t": "mc", "q": "Who looks ___ your dog when you’re on holiday?", "o": ["after", "for", "out"], "a": 0}, {"t": "mc", "q": "What time did you get ___ last night? I didn’t hear you come home.", "o": ["on", "off", "in"], "a": 2}, {"t": "mc", "q": "Vegans cut ___ all animal products, including milk and eggs.", "o": ["out", "down", "up"], "a": 0}, {"t": "mc", "q": "Choose the correct sentence.", "o": ["I need to cut down fast food on.", "I need to cut down on fast food.", "I need to cut on down fast food."], "a": 1}, {"t": "mc", "q": "Because of the storm, they had to ___.", "o": ["call off it", "call the race of", "call the race off"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Food that is made from milk is ___.", "o": ["organic", "dairy", "protein"], "a": 1}, {"t": "mc", "q": "Meat, fish and eggs contain a lot of ___.", "o": ["protein", "carbohydrates", "spices"], "a": 0}, {"t": "mc", "q": "Bread, rice and pasta are full of ___.", "o": ["carbohydrates", "protein", "herbs"], "a": 0}, {"t": "mc", "q": "A sport with fast cars on a track is ___.", "o": ["cycling", "motor racing", "sailing"], "a": 1}, {"t": "mc", "q": "Behaviour that causes pain to animals or people is ___.", "o": ["appearance", "barrier", "cruelty"], "a": 2}, {"t": "mc", "q": "The footballer made his 100th ___ for the club.", "o": ["appearance", "championship", "cruelty"], "a": 0}, {"t": "mc", "q": "Food grown without chemicals is ___.", "o": ["spontaneous", "dairy", "organic"], "a": 2}, {"t": "mc", "q": "Green leaves like mint and basil that we use in cooking are ___.", "o": ["spices", "herbs", "carbohydrates"], "a": 1}, {"t": "mc", "q": "Something that stops you from doing something is a ___.", "o": ["barrier", "championship", "protein"], "a": 0}, {"t": "mc", "q": "Done naturally, without any planning = ___", "o": ["truly", "spontaneous", "inspired"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Her coach <b>i</b>{} her to train harder.", "a": [["nspired"]], "pre": ["i"]}, {"t": "gap", "q": "Black pepper and cumin are <b>s</b>{}.", "a": [["pices"]], "pre": ["s"]}, {"t": "gap", "q": "He <b>o</b>{} many problems to become a champion.", "a": [["vercame"]], "pre": ["o"]}, {"t": "gap", "q": "If you <b>t</b>{} want to help animals, try eating less meat.", "a": [["ruly"]], "pre": ["t"]}, {"t": "gap", "q": "She won the national <b>c</b>{} in Astana last year.", "a": [["hampionship"]], "pre": ["c"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Aliya’s plant-powered year", "paras": [["", "Last January, Aliya, a 15-year-old swimmer from Kostanay, decided to try a plant-based diet. She had read about tennis stars and footballers who had cut out meat and dairy, and she wanted to see if it could work for her too."], ["", "Her coach was worried at first. ‘Swimmers need a lot of protein,’ he told her. So Aliya made a plan with a nutritionist. She started eating more beans, nuts and lentils, and she cut down on white bread and sweets."], ["", "The first month was hard. Her grandmother is famous for her beshbarmak, a meat dish, so family dinners were difficult. But the family soon learned to cook new dishes with lots of herbs and spices."], ["", "Six months later, Aliya won two medals at a regional championship. She isn’t sure the diet was the only reason. ‘I also slept more and trained harder,’ she says. ‘But I feel great, and I’m proud I didn’t give up.’"]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why did Aliya try a plant-based diet?", "o": ["Her doctor told her to.", "Her coach suggested it.", "She read about sports stars who did it."], "a": 2}, {"t": "mc", "q": "What was her coach worried about?", "o": ["that she would eat too many sweets", "that she would stop swimming", "that she wouldn’t get enough protein"], "a": 2}, {"t": "mc", "q": "What did Aliya cut down on?", "o": ["white bread and sweets", "beans and nuts", "vegetables"], "a": 0}, {"t": "mc", "q": "Why were family dinners difficult at first?", "o": ["Her family didn’t eat together.", "Her grandmother usually cooked meat.", "She didn’t like herbs."], "a": 1}, {"t": "mc", "q": "What does Aliya say about her medals?", "o": ["The diet may not be the only reason.", "The diet was the only reason.", "She was disappointed with them."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends, Madina and Nurlan, talking about Veganuary.", "script": [["Madina", "Nurlan, are you doing Veganuary with the sports club?"], ["Nurlan", "Veganuary? What’s that?"], ["Madina", "You eat only plant-based food for the whole of January. Ten people from our club have signed up."], ["Nurlan", "A whole month? I’m not sure I could cut out cheese. I eat it every day!"], ["Madina", "You could start by cutting down on meat, then. Even that helps the planet."], ["Nurlan", "But don’t athletes need protein?"], ["Madina", "Sure, but you can get it from beans, lentils and nuts. Our coach is going to give us a recipe book."], ["Nurlan", "Hmm. And what if I eat a burger by mistake?"], ["Madina", "Then you just start again the next day. Nobody’s perfect."], ["Nurlan", "OK, I’ll have a go. But I’m not giving up my grandma’s pancakes!"]]}, "parts": [{"items": [{"t": "mc", "q": "When does Veganuary take place?", "o": ["in June", "for one week in spring", "in January"], "a": 2}, {"t": "mc", "q": "How many people from the club have signed up?", "o": ["two", "ten", "twenty"], "a": 1}, {"t": "mc", "q": "What would be hardest for Nurlan to cut out?", "o": ["meat", "bread", "cheese"], "a": 2}, {"t": "mc", "q": "Where can athletes get protein, according to Madina?", "o": ["only meat and fish", "beans, lentils and nuts", "sports drinks"], "a": 1}, {"t": "mc", "q": "What does Nurlan decide?", "o": ["to try it", "to say no", "to wait until next year"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "separable and inseparable phrasal verbs (cut out, cut down on, look after, get on with); protein, dairy, organic, cruelty.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences, using phrasal verbs where possible.", "prompts": ["What food could you cut down on to be healthier?", "Could you cut out meat for a month? Why or why not?", "Who looks after you when you are ill?", "Do you get on with everyone in your class?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Should top athletes eat a plant-based diet?", "Is organic food worth the extra money?", "What would you put on a healthy school menu?"]}]}}]}, {"id": "t33", "kind": "quick", "group": "t3.3", "title": "Unit 3.3 Test", "focus": "3.3 Becoming a champion: adjectives with the suffix -ive (repetitive, active, destructive); play / do / go + sport; vocabulary for success and sports equipment (medal, pursue, accomplish, criticise, goggles, court…).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "Doing the same exercise again and again is ___.", "o": ["repeatful", "repeatly", "repetitive"], "a": 2}, {"t": "mc", "q": "A person who always wants to win is ___.", "o": ["competitive", "competeive", "competition"], "a": 0}, {"t": "mc", "q": "Something connected with action or movement is ___.", "o": ["actful", "active", "actical"], "a": 1}, {"t": "mc", "q": "destroy + -ive = ___", "o": ["destroyive", "destructive", "destroytive"], "a": 1}, {"t": "mc", "q": "My sister has a very ___ mind – she invents amazing games.", "o": ["creatful", "creation", "creative"], "a": 2}, {"t": "mc", "q": "We ___ judo twice a week.", "o": ["do", "play", "go"], "a": 0}, {"t": "mc", "q": "My brother ___ skiing every winter.", "o": ["plays", "does", "goes"], "a": 2}, {"t": "mc", "q": "Let’s ___ tennis after school.", "o": ["play", "go", "do"], "a": 0}, {"t": "mc", "q": "Which sport do we use with ‘go’?", "o": ["basketball", "swimming", "karate"], "a": 1}, {"t": "mc", "q": "The team played a very ___ game and didn’t let in a single goal.", "o": ["defendive", "defensive", "defenceive"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "A round piece of metal given to winners is a ___.", "o": ["medal", "trophy", "ticket"], "a": 0}, {"t": "mc", "q": "To try to achieve something over a lo
