<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>IF Block Quest · IF Academy</title>
<meta name="description" content="IF Block Quest: 3D English games for kids, teens and adults — build your avatar, then Word Mine, Grammar Obby and Tower Climb, from Starters to C2.">
<meta name="theme-color" content="#0b1f3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
  :root{--navy:#0b1f3a;--gold:#c9a24e;--ink:#1b2333;--ok:#1f9d55;--bad:#d64545}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1f3a;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5;pointer-events:none}
  .hud span{background:rgba(11,31,58,.82);border:1px solid rgba(255,255,255,.15);padding:8px 14px;border-radius:999px;font-weight:800;font-size:15px;white-space:nowrap}
  .top-l{position:fixed;top:10px;left:10px;z-index:6;display:flex;gap:8px}
  .top-l button,.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:var(--gold);color:#1a1208;box-shadow:0 4px 0 #8a6d2c}
  .top-l button{padding:9px 13px;background:rgba(255,255,255,.92);color:var(--navy);box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25)}
  .screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1c3d6e,#0b1f3a 70%);padding:18px;overflow:auto}
  .card{background:#fff;color:var(--ink);border-radius:22px;padding:24px;max-width:760px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
  .card h1{margin:0 0 4px;font-size:30px;color:var(--navy)}.card .sub{color:#5d6676;margin:0 0 16px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .mode{border:2px solid #e4dccd;border-radius:18px;padding:16px;cursor:pointer;background:#fffdf7;text-align:left;font:inherit;color:inherit}
  .mode.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,78,.25)}
  .mode b{display:block;font-size:19px;margin:6px 0 4px;color:var(--navy)}.mode small{color:#5d6676;line-height:1.4;display:block}
  .mode .ic{font-size:34px}
  .lv{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .lv button{font:inherit;font-weight:800;border:2px solid #e4dccd;background:#fff;border-radius:12px;padding:10px 16px;cursor:pointer;color:var(--navy)}
  .lvh{flex-basis:100%;font:800 12px Inter,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8a7a55;margin-top:4px}
  .avd{margin:0 0 12px;border:2px solid #e4dccd;border-radius:14px;padding:8px 12px;background:#fffdf7}.avd summary{cursor:pointer;font-weight:800;color:var(--navy)}
  .avr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.avr b{width:76px;font-size:13px;color:#5d6676}
  .avc{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c9c2b4;cursor:pointer}.avc.on{box-shadow:0 0 0 3px var(--gold)}
  .avt{font:700 13px Inter,Arial,sans-serif;border:2px solid #e4dccd;background:#fff;border-radius:10px;padding:5px 9px;cursor:pointer}.avt.on{border-color:var(--gold);background:#fff6df}
  .lv button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .keys{font-size:13px;color:#5d6676;margin-top:12px;line-height:1.5}
  .q{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,12,28,.55);padding:16px}
  .q .card{max-width:560px}
  .q h2{margin:0 0 6px;color:var(--navy);font-size:22px}
  .q .opts{display:grid;gap:10px;margin-top:14px}
  .q .opts button{font:inherit;font-weight:700;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid #e4dccd;background:#fff;cursor:pointer;color:var(--ink)}
  .q .opts button.ok{border-color:var(--ok);background:#e7f8ec}.q .opts button.no{border-color:var(--bad);background:#fdeaea}
  .toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:rgba(11,31,58,.92);padding:10px 18px;border-radius:999px;font-weight:700;z-index:25;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  #qpanel{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:9;display:none;width:min(760px,calc(100vw - 24px));background:rgba(11,31,58,.92);border:2px solid var(--gold);border-radius:18px;padding:10px 14px 8px;text-align:center;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #qpanel .qq{font-weight:800;font-size:clamp(17px,2.6vw,22px);line-height:1.25;margin-bottom:8px}
  #qpanel .qa{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  #qpanel .qa button{font:inherit;color:#fff;border:0;cursor:pointer;border-radius:12px;padding:8px 14px;font-weight:800;font-size:clamp(15px,2.2vw,19px);box-shadow:0 4px 0 rgba(0,0,0,.3);touch-action:manipulation}
  #qpanel .qa button:hover{filter:brightness(1.08);transform:translateY(-1px)}#qpanel .qa button:active{transform:translateY(3px);box-shadow:none}
  #qpanel .qa b{display:inline-block;background:rgba(255,255,255,.95);color:#0b1f3a;border-radius:6px;padding:0 6px;margin-right:4px}
  #qpanel .qh{font-size:12px;opacity:.75;margin-top:6px}
  @media (pointer:coarse){#qpanel{bottom:auto;top:58px}}
  .act{position:fixed;right:22px;bottom:150px;z-index:8;display:none}
  .act button{width:84px;height:84px;border-radius:50%;font-size:30px;padding:0}
  .touch{display:none}
  @media (pointer:coarse){.touch{display:block}}
  .joy{position:fixed;left:22px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);z-index:8}
  .joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75)}
  .jump{position:fixed;right:22px;bottom:40px;width:96px;height:96px;border-radius:50%;z-index:8;font:inherit;font-weight:800;font-size:16px;border:0;background:var(--gold);color:#1a1208;box-shadow:0 5px 0 #8a6d2c}
  .hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.8;z-index:5;text-align:center;pointer-events:none}
  @media (pointer:coarse){.hint{display:none}}
</style>
</head>
<body data-no-nav>
<canvas id="c"></canvas>
<div class="top-l"><button id="home" title="Home">🏠</button><button id="menu" title="Menu">☰ Menu</button></div>
<div class="hud" id="hud"></div>
<div class="hint" id="hint"></div>
<div class="act" id="act"><button class="btn" id="mine" aria-label="Mine">⛏</button></div>
<div class="touch"><div class="joy" id="joy"><i></i></div><button class="jump" id="jump">Jump</button></div>
<div class="toast" id="toast"></div>
<div id="qpanel"></div>

<div class="screen" id="start">
  <div class="card">
    <h1>IF Block Quest</h1>
    <p class="sub">3D English games for kids, teens and adults — build your avatar, then mine, run and climb.</p>
    <div class="grid2">
      <button class="mode on" data-mode="mine"><span class="ic">⛏️</span><b>Word Mine · like Minecraft</b><small>Explore a block island. Find the glowing word blocks, mine them and answer to collect gems.</small></button>
      <button class="mode" data-mode="obby"><span class="ic">🏃</span><b>Grammar Obby · like Roblox</b><small>A parkour course in the sky. Jump onto the platform with the right answer — wrong ones fall!</small></button>
      <button class="mode" data-mode="tower"><span class="ic">🗼</span><b>Tower Climb · like Roblox</b><small>Climb the obby tower: dodge red kill bricks, bounce on green pads, grab coins and answer at every checkpoint.</small></button>
    </div>
    <div class="lv" id="levels"></div>
    <details class="avd"><summary>🎨 My avatar</summary><div id="avatar"></div></details>
    <select id="crs" aria-label="Course and unit" style="width:100%;margin:0 0 12px;padding:10px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.15);font:600 14px Inter,Arial,sans-serif;background:#fff;color:#1d2b4f"></select>
    <button class="btn" id="play" style="width:100%;font-size:18px">▶ Play</button>
    <p class="keys">Computer: <b>W A S D</b> or arrows to move, <b>Space</b> to jump, drag the mouse to turn the camera, <b>E</b> to mine.<br>Phone/tablet: joystick to move, Jump button, swipe to turn the camera.</p>
  </div>
</div>

<div class="q" id="q"><div class="card"><p class="sub" id="qk" style="margin:0 0 4px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:#b08a3e"></p><h2 id="qt"></h2><div class="opts" id="qo"></div></div></div>

<script src="lib/three-0.160.0.min.js"></script>
