b a tree", "stand still", "run"], ["Where did Leo learn this?", "from a friend", "from a book", "in a documentary"], ["What problem does Leo see with Maria's idea?", "Bears can climb trees.", "Trees are too high.", "Bears run fast."], ["What does Maria finally say she'd do?", "stay at home", "call the police", "take a photo"]]}, "s": {"focus": "second conditional, present perfect with for and since, animals, fears.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["How long have you lived in your town?", "What would you do if you won a lot of money?", "Are you afraid of anything?", "What's your favourite animal? Why?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["If you could be any animal, what would you be?", "Tell the teacher about someone you've known for a long time."]}]}});
TESTS.push({"id": "f9", "kind": "file", "title": "File Test 9", "focus": "File 9: if + past, would + infinitive (second conditional), present perfect + for and since, present perfect or past simple? (2), animals, phobias and words related to fear, biographies.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACCACABABBACBBCBAABC", "q": [["If I _____ time, I'd learn to play the piano.", "had", "have", "would have"], ["If you _____ a famous person, who would you be?", "would be", "are", "were"], ["I'd buy a big house if I _____ rich.", "would be", "am", "were"], ["What would you do if you _____ your job?", "lost", "would lose", "lose"], ["If it wasn't so expensive, I _____ a new phone.", "'ll buy", "buy", "'d buy"], ["She _____ happier if she lived by the sea.", "would be", "is", "will be"], ["If I knew the answer, I _____ you.", "'ll tell", "'d tell", "told"], ["I've had this car _____ five years.", "for", "ago", "since"], ["They've known each other _____ they were children.", "for", "since", "from"], ["He's been ill _____ last Monday.", "for", "since", "ago"], ["How long _____ you had your dog?", "have", "did", "are"], ["We _____ in this flat for six months.", "lived", "live", "'ve lived"], ["I _____ my best friend since 2015.", "knew", "'ve known", "know"], ["My grandparents _____ married in 1975.", "have been", "got", "have got"], ["She _____ in London for two years, but now she lives in Almaty.", "has lived", "lives", "lived"], ["How long _____ he work for that company before he left?", "does", "did", "has"], ["I _____ any coffee today.", "haven't had", "didn't have", "don't have"], ["Shakespeare _____ 37 plays.", "wrote", "has written", "writes"], ["They _____ each other for ten years and they're still best friends.", "knew", "'ve known", "know"], ["When _____ you start learning English?", "do", "have", "did"]]}, "v": {"parts": [[0, "Animals: choose the correct word."], [6, "Fear: choose the correct word."], [12, "Biographies: choose the correct word."]], "k": "AABBABCBBACACBBCACAC", "q": [["A _____ is a big cat with orange and black stripes.", "tiger", "leopard", "lion"], ["A _____ is a farm animal that gives us wool.", "sheep", "goat", "cow"], ["A _____ is an insect that can sting you.", "butterfly", "wasp", "fly"], ["A _____ carries water in its hump and lives in the desert.", "donkey", "camel", "horse"], ["A _____ is a big sea animal with very sharp teeth.", "shark", "dolphin", "whale"], ["A _____ is a small animal that likes cheese, people say.", "rabbit", "mouse", "squirrel"], ["I'm absolutely _____ of snakes.", "terror", "terrifying", "terrified"], ["Don't be _____. The dog won't bite you.", "scary", "scared", "scaring"], ["The fear of small spaces is called _____.", "arachnophobia", "claustrophobia", "agoraphobia"], ["He _____ when he saw the ghost.", "screamed", "laughed", "cried out loud at"], ["She has a _____ of heights.", "scare", "fright of", "fear"], ["The film was so _____ that I closed my eyes.", "scary", "scared", "afraid"], ["She _____ school when she was seventeen.", "stopped of", "finished up", "left"], ["He _____ to Almaty in 2010 to find work.", "changed", "moved", "went over"], ["They _____ in love when they were at university.", "felt", "fell", "got"], ["She _____ a job as a journalist.", "made", "took on", "got"], ["They had three children and then they got _____.", "divorced", "married off", "separate"], ["He _____ in 1990 at the age of 80.", "dead", "death", "died"], ["She _____ from medical school in 2005.", "graduated", "finished out", "passed out"], ["He _____ a famous company when he was only 25.", "opened up", "began up", "started"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "AACACBABBC", "q": [["w*or*m", "sh*or*t", "h*or*se"], ["b*ea*r", "d*ee*r", "f*ea*r"], ["m*ou*se", "c*ow*", "cr*ow*"], ["sp*i*der", "b*ee*", "sh*ee*p"], ["b*u*tterfly", "d*u*ck", "b*u*ll"], ["croco_dile_", "_cro_codile", "cro_co_dile"], ["go_ril_la", "goril_la_", "_go_rilla"], ["_kan_garoo", "kanga_roo_", "kan_ga_roo"], ["e_le_phant", "_e_lephant", "ele_phant_"], ["clau_stro_phobia", "_clau_strophobia", "claustro_pho_bia"]]}, "r": {"title": "The life of a nature hero", "k": "BACAB", "text": ["Sir David Attenborough is probably the most famous nature presenter in the world. He was born in London in 1926, and as a child he collected fossils and stones. He studied natural sciences at Cambridge University and graduated in 1947.", "In 1952 he joined the BBC. His first programme about animals was called Zoo Quest, and he travelled to Africa, Asia and South America to film it. Since then, he has made more than a hundred programmes and has visited every continent on Earth.", "Attenborough has seen many amazing animals in his life. One of his favourite moments was in 1978 in Rwanda, when he sat next to a family of mountain gorillas. 'If I had to choose one moment, it would be that one,' he has said.", "Today, Attenborough is in his late nineties, but he is still working. For the last twenty years he has spoken a lot about climate change and plastic in the oceans. 'If we did nothing, we would lose many of the animals I have filmed,' he says. 'But it's not too late.'"], "q": [["What did Attenborough collect as a child?", "butterflies", "fossils and stones", "photos of animals"], ["When did he graduate?", "in 1947", "in 1952", "in 1926"], ["What was his first animal programme called?", "Planet Earth", "Life on Earth", "Zoo Quest"], ["Where did he sit with gorillas?", "in Rwanda", "in a zoo", "in South America"], ["What has he spoken about for the last twenty years?", "gorillas only", "climate change and plastic", "his life"]]}, "l": {"setting": "You will hear a radio programme about phobias.", "k": "BAABC", "script": [["Presenter", "Today we're talking about phobias. With me is Dr Anna Ward. Anna, how many people have a phobia?"], ["Dr Ward", "About one in ten people. The most common are fear of spiders, fear of heights and fear of flying."], ["Presenter", "Where do phobias come from?"], ["Dr Ward", "Often from a bad experience when we were children. But sometimes children learn them from their parents. If your mother screamed every time she saw a spider, you'd probably be scared of them too."], ["Presenter", "Can you cure a phobia?"], ["Dr Ward", "Yes. One popular treatment is to meet your fear slowly. For example, with spiders, first you look at a photo, then a spider in a box, and after some weeks you hold one."], ["Presenter", "How long does it take?"], ["Dr Ward", "It depends, but many people feel much better after six to eight weeks."]], "q": [["How many people have a phobia?", "about half", "about one in ten", "about one in three"], ["Which is NOT one of the most common phobias, according to Dr Ward?", "fear of the dark", "fear of spiders", "fear of flying"], ["Where can children learn phobias from?", "their parents", "their friends", "TV"], ["What is the last step of the spider treatment?", "looking at a photo", "holding a spider", "seeing a spider in a box"], ["How long does treatment often take?", "two weeks", "a year", "six to eight weeks"]]}, "s": {"focus": "second conditional, present perfect + for / since, present perfect or past simple, animals, fears, biographies.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["How long have you studied English?", "What would you do if you had a free day tomorrow?", "Have you ever been really frightened? What happened?", "What animal would you like to have as a pet?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about the life of someone you admire (a family member or a famous person).", "prompts": ["when and where he / she was born", "important moments in his / her life", "what he / she has done", "why you admire him / her"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["What would you change about your town if you were the mayor?", "Should people keep wild animals as pets?", "Why do you think people are afraid of things that can't hurt them?"]}]}});
TESTS.push({"id": "q10", "kind": "quick", "title": "Quick Test 10", "focus": "File 10: the passive (be + past participle), used to, might / might not, people from the past (invent, discover), school subjects, word building (noun formation).", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACAABCBCAB", "q": [["The telephone _____ by Alexander Graham Bell.", "was invented", "invented", "is invent"], ["These cars _____ in Japan.", "make", "are making", "are made"], ["English _____ all over the world.", "is spoken", "speaks", "is speaking"], ["The Mona Lisa _____ by Leonardo da Vinci.", "was painted", "is painting", "painted"], ["I _____ have long hair when I was a teenager.", "was used to", "used to", "use to"], ["_____ you use to play football?", "Were", "Do", "Did"], ["She _____ to like coffee, but now she loves it.", "doesn't use", "didn't use", "not used"], ["I _____ go out tonight. I'm not sure.", "must", "will", "might"], ["It _____ rain later. Take an umbrella.", "might", "mights", "might to"], ["We _____ come to the party. We're very busy.", "might no", "might not", "mightn't to"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "AABCBAACBC", "q": [["Marie Curie _____ radium.", "discovered", "invented", "wrote"], ["Who _____ the first computer?", "invented", "discovered", "found out"], ["I hated _____ at school. All those numbers!", "history", "maths", "literature"], ["In _____ we learned about other countries and their rivers.", "chemistry", "physics", "geography"], ["In _____ we did experiments in the lab.", "literature", "chemistry", "history"], ["The _____ of the new hospital took two years.", "construction", "constructing", "construct"], ["I'd like some _____ about the course.", "information", "inform", "informing"], ["There's a big _____ between the two cities.", "different", "differ", "difference"], ["He's a famous _____ of children's books.", "writing", "writer", "write"], ["The _____ of the internet changed the world.", "inventing", "invent", "invention"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "ABBAC", "q": [["*u*ntil", "*u*seful", "*u*sed"], ["m*igh*t", "wr*i*tten", "wr*i*te"], ["pr*e*sented", "p*ai*nted", "inv*e*nted"], ["in_ven_tion", "_in_vention", "inven_tion_"], ["_ge_ography", "geo_gra_phy", "ge_o_graphy"]]}, "r": {"title": "School 100 years ago", "k": "AACBB", "text": ["One hundred years ago, school in Kazakhstan was very different. Many children didn't use to go to school at all – they used to help their parents with the animals.", "In towns, schools were small and classes were often big – sometimes forty or fifty students in one room. Students used to write on small boards because paper was expensive.", "Teachers were very strict. Students had to stand up when they answered a question. Today things have changed: classes are smaller, every school has computers, and students might even study online."], "q": [["What did many children use to do instead of school?", "help with the animals", "stay in bed", "work in shops"], ["How many students were sometimes in one class?", "forty or fifty", "about twenty", "over a hundred"], ["Why did students use to write on small boards?", "Teachers liked it.", "They didn't have pens.", "Paper was expensive."], ["What did students have to do when they answered?", "raise both hands", "stand up", "write the answer"], ["What might students do today?", "stand all lesson", "study online", "write on boards"]]}, "l": {"setting": "You will hear Daniyar and his grandmother talking about the past.", "k": "ABCAB", "script": [["Daniyar", "Grandma, what did you use to do in your free time when you were young?"], ["Grandma", "We didn't have TV, so we used to play outside a lot. We used to swim in the river in summer."], ["Daniyar", "Did you use to have a phone?"], ["Grandma", "No! There was one phone in the whole village. It was in the post office."], ["Daniyar", "Wow. What was your favourite subject at school?"], ["Grandma", "History. I used to love stories about the past. Maybe that's why I like telling you stories now!"]], "q": [["Why did Grandma play outside a lot?", "They didn't have TV.", "Her parents told her to.", "She lived on a farm."], ["Where did she use to swim?", "in the sea", "in the river", "in a swimming pool"], ["Where was the village phone?", "at the school", "in her house", "in the post office"], ["What was her favourite subject?", "history", "geography", "maths"], ["What does she like doing now?", "watching TV", "telling stories", "swimming"]]}, "s": {"focus": "the passive, used to, might, school subjects.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What did you use to do when you were a child?", "What was your favourite subject at school?", "What might you do this weekend?", "What is your town famous for? What is made there?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Talk about something that was invented that changed your life", "How is school today different from school in the past?"]}]}});
TESTS.push({"id": "f10", "kind": "file", "title": "File Test 10", "focus": "File 10: the passive (be + past participle), used to, might / might not, people from the past (invent, discover, design…), school subjects, word building (noun formation).", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ABBABCBCCACABACBBACA", "q": [["This bridge _____ in 1890.", "was built", "built", "is built"], ["The first car _____ by Karl Benz.", "designed", "was designed", "is designing"], ["Coffee _____ in Brazil and Colombia.", "grows up", "is grown", "is growing"], ["Penicillin _____ by Alexander Fleming in 1928.", "was discovered", "discovered", "is discovered"], ["Our house _____ last year.", "painted", "was painted", "is painted"], ["_____ these photos taken by you?", "Was", "Did", "Were"], ["Football _____ in almost every country in the world.", "plays", "is played", "is playing"], ["The Harry Potter books _____ by J. K. Rowling.", "are writing", "wrote", "were written"], ["I _____ like vegetables, but now I love them.", "don't use to", "didn't used", "didn't use to"], ["My dad _____ smoke, but he stopped ten years ago.", "used to", "use to", "was used"], ["_____ you use to walk to school?", "Do", "Were", "Did"], ["We _____ live in a village before we moved to Almaty.", "used to", "use", "were used to"], ["There _____ be a cinema here, but now it's a supermarket.", "use to", "used to", "was"], ["I'm not sure, but I _____ go to university abroad.", "might", "will", "must"], ["She _____ be at home. Her car isn't outside.", "mights not", "doesn't might", "might not"], ["Take a coat. It _____ get cold later.", "would to", "might", "might to"], ["We _____ have time to visit you. We'll see.", "mightn't to", "might not", "not might"], ["He _____ come. He said he was very tired.", "might not", "might no", "doesn't might"], ["The tickets _____ be expensive. Let's check online.", "must to", "might to", "might"], ["_____ you go to the concert? I'm not sure yet.", "Will", "Do", "Might"]]}, "v": {"parts": [[0, "People from the past: choose the correct word."], [6, "School subjects: choose the correct word."], [12, "Word building: choose the correct word."]], "k": "BACBBACBACCAABBACACB", "q": [["Who _____ the telephone?", "found", "invented", "discovered"], ["Columbus _____ America in 1492.", "discovered", "designed", "invented"], ["Gaudí _____ many famous buildings in Barcelona.", "wrote", "discovered", "designed"], ["Beethoven _____ nine symphonies.", "built", "composed", "painted"], ["Picasso _____ more than 20,000 works of art.", "discovered", "painted", "composed"], ["The Taj Mahal was _____ for a queen.", "built", "composed", "invented"], ["In _____ we learn about plants and animals.", "chemistry", "physics", "biology"], ["In _____ we learn about what happened in the past.", "maths", "history", "geography"], ["_____ is about energy, light and how things move.", "Physics", "Biology", "Literature"], ["In _____ we read poems and novels.", "IT", "languages", "literature"], ["In _____ we learn to use computers and write programs.", "PE", "art", "IT"], ["In _____ we do sport.", "PE", "ICT", "DT"], ["I have a big _____ tomorrow.", "decision", "decide", "decisive"], ["Thank you for your _____.", "helpful", "help", "helpless"], ["The _____ of the new president was big news.", "electing", "election", "elect"], ["This flat needs a lot of _____.", "improvement", "improving", "improve"], ["The _____ of the meeting is on page 2.", "describing", "describe", "description"], ["What's your _____? I'm a student.", "occupation", "occupy", "occupying"], ["There was a lot of _____ when the team won.", "exciting", "excite", "excitement"], ["She has a lot of _____ as a teacher.", "experiment", "experience", "expert"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "CAACCBAABB", "q": [["c*o*lour", "disc*o*vered", "inv*e*nted"], ["*u*nder", "*u*niversity", "*u*sed"], ["b*i*ke", "b*ui*ld", "b*ui*lt"], ["wr*o*te", "dr*o*ve", "m*igh*t"], ["*ch*air", "*ch*oose", "*ch*emistry"], ["histo_ry_", "_his_tory", "his_to_ry"], ["ge_o_graphy", "_ge_ography", "geo_gra_phy"], ["dis_co_vered", "_dis_covered", "disco_ve_red"], ["lite_ra_ture", "_li_terature", "li_te_rature"], ["inven_tion_", "in_ven_tion", "_in_vention"]]}, "r": {"title": "Accidental inventions", "k": "BCBAA", "text": ["Some of the world's most useful things were invented by accident.", "In 1945, an American engineer called Percy Spencer was working with a radar machine when he noticed that the chocolate bar in his pocket had melted. He tried putting some popcorn near the machine, and it popped. This is how the microwave oven was invented. The first microwave was almost two metres tall!", "The Post-it note was created by two people at the 3M company. In 1968, Spencer Silver was trying to make a very strong glue, but he made a weak one by mistake. Nobody knew what to use it for. Six years later, his colleague Art Fry was singing in a church choir and his paper bookmarks kept falling out of his book. He remembered Silver's glue – and the Post-it was born.", "And crisps? The story says they were first made in 1853 by a chef in New York. A customer kept sending his potatoes back because they were 'too thick'. The angry chef cut them as thin as possible and fried them. The customer loved them.", "So if you make a mistake today, don't worry. You might have just invented something!"], "q": [["What did Percy Spencer notice?", "His machine was broken.", "His chocolate had melted.", "His popcorn was cold."], ["How tall was the first microwave?", "three metres", "about half a metre", "almost two metres"], ["What was Spencer Silver trying to make?", "weak glue", "a very strong glue", "a bookmark"], ["Why did Art Fry need the glue?", "His bookmarks kept falling out.", "He was writing a book.", "He worked in a church."], ["Why did the chef make the potatoes very thin?", "He was angry with the customer.", "He made a mistake.", "He wanted to save potatoes."]]}, "l": {"setting": "You will hear Ms Clark talking to her students about a school trip.", "k": "BABCA", "script": [["Ms Clark", "OK, everyone, listen. Next Friday we're going to the Science Museum in the capital."], ["Student", "How are we getting there, Ms Clark?"], ["Ms Clark", "By train. It leaves at 7.45, so you have to be at the station at 7.30. Don't be late!"], ["Student", "What are we going to see?"], ["Ms Clark", "There's a new exhibition about inventions. You'll see the first telephones and some early computers. There might also be a talk by a scientist, but that isn't confirmed yet."], ["Student", "Do we need to bring money?"], ["Ms Clark", "Lunch is included, but you might want some money for the museum shop."], ["Student", "When will we be back?"], ["Ms Clark", "At about six in the evening."]], "q": [["Where are the students going?", "to a university", "to a science museum", "to a factory"], ["What time should they be at the station?", "7.30", "7.45", "6.00"], ["What is the new exhibition about?", "space", "inventions", "animals"], ["What isn't confirmed yet?", "lunch", "the train", "a talk by a scientist"], ["What might students want money for?", "the museum shop", "the train ticket", "lunch"]]}, "s": {"focus": "the passive, used to, might, people from the past, school subjects, noun formation.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What did you use to do at school that you don't do now?", "What were your best and worst subjects?", "What is your country famous for? What is produced there?", "What might you do next summer?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about an invention that is important to you.", "prompts": ["what it is and who invented it (if you know)", "when you use it", "how life was before it", "how it might change in the future"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Which is the most important invention in history? Why?", "How was life different for your grandparents?", "Should all students learn programming at school?"]}]}});
TESTS.push({"id": "q11", "kind": "quick", "title": "Quick Test 11", "focus": "File 11: expressing movement (prepositions of movement), word order of phrasal verbs, so / neither + auxiliaries, sport, phrasal verbs, similarities.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BAACCAABCB", "q": [["The cat jumped _____ the wall.", "through", "over", "across of"], ["We walked _____ the forest.", "through", "over", "up to"], ["She ran _____ the stairs.", "down", "over", "through"], ["Please turn _____. I'm trying to sleep.", "down the music it", "the music it down", "the music down"], ["Take your shoes off. Take _____ off.", "it", "they", "them"], ["I've lost my keys. Can you help me look _____?", "for them", "for it", "them for"], ["A: I love chocolate.\nB: So _____ I.", "do", "have", "am"], ["A: I'm not tired.\nB: Neither _____ I.", "do", "am", "have"], ["A: I went to the gym yesterday.\nB: So _____ I.", "was", "do", "did"], ["A: I haven't seen that film.\nB: Neither _____ I.", "do", "have", "did"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CAABCABCBA", "q": [["The goalkeeper _____ the ball.", "stopped up", "caught out", "saved"], ["Our team _____ the match 3–1.", "won", "beat", "scored"], ["We _____ the other team 2–0.", "beat", "won", "gained"], ["He _____ a goal in the last minute.", "made", "scored", "shot"], ["You play tennis on a tennis _____.", "pitch", "track", "court"], ["You play football on a football _____.", "pitch", "ring", "court"], ["Please _____ the form.", "fill on", "fill in", "fill up of"], ["I want to _____ smoking.", "give off", "give in", "give up"], ["Can you _____ the music? It's too loud.", "turn over", "turn down", "turn off of"], ["I _____ my grandmother. We both have blue eyes.", "take after", "look up", "get on"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "ACBBA", "q": [["w*or*k", "sc*ore*", "sp*or*t"], ["b*a*ll", "h*a*ll", "g*oa*l"], ["b*a*ll", "w*o*n", "c*our*t"], ["bas_ket_ball", "_bas_ketball", "basket_ball_"], ["_vol_leyball", "volley_ball_", "vol_ley_ball"]]}, "r": {"title": "Twin sporting stars", "k": "BCAAB", "text": ["Karina and Kamila are seventeen-year-old twins from Shymkent, and they both play volleyball for the national junior team.", "'We're very similar,' says Karina. 'I love chocolate and so does Kamila. I don't like getting up early and neither does she!' They started playing when they were nine and they train together six days a week.", "But on the court they are different. Karina is a better attacker and Kamila is better at defending. 'When we play together, we're very strong,' says their coach. 'They always know where the other one is.'"], "q": [["How old are the twins?", "six", "seventeen", "nine"], ["What do they both NOT like?", "chocolate", "training", "getting up early"], ["When did they start playing volleyball?", "at nine", "at six", "at seventeen"], ["Who is better at attacking?", "Karina", "both", "Kamila"], ["What does the coach say about them?", "They argue a lot.", "They know where the other one is.", "They play better alone."]]}, "l": {"setting": "You will hear two friends talking about a football match.", "k": "CAABB", "script": [["Aidar", "Did you watch the match last night?"], ["Tom", "Yes! What a game! We were losing 1–0 at half time."], ["Aidar", "I know. I was so nervous. Then our captain scored in the 70th minute."], ["Tom", "And the winning goal in the 89th minute! I jumped off the sofa."], ["Aidar", "So did I! My neighbours probably thought I was crazy."], ["Tom", "Are you going to the next match on Saturday?"], ["Aidar", "Yes, I've already bought my ticket. Have you?"], ["Tom", "Not yet. I'll buy one online tonight."]], "q": [["What was the score at half time?", "0–0", "1–0 to their team", "1–0 to the other team"], ["When did their captain score?", "in the 70th minute", "in the 89th minute", "at half time"], ["What did Tom do after the winning goal?", "jumped off the sofa", "called Aidar", "ran outside"], ["When is the next match?", "on Sunday", "on Saturday", "tonight"], ["What will Tom do tonight?", "watch another match", "buy a ticket online", "call Aidar"]]}, "s": {"focus": "prepositions of movement, phrasal verbs, so / neither, sport.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Do you do any sport?", "What sport do you like watching?", "Who do you take after in your family?", "What have you given up or would like to give up?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Find three things you and the teacher have in common (So do I / Neither do I)", "Describe the way from your home to this school (go along, across, past…)."]}]}});
TESTS.push({"id": "f11", "kind": "file", "title": "File Test 11", "focus": "File 11: expressing movement (prepositions of movement), word order of phrasal verbs, so / neither + auxiliaries, sport, phrasal verbs, similarities.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BACAABBCACBBAACCACBB", "q": [["The ball went _____ the window and broke it.", "across", "through", "along"], ["We walked _____ the river until we reached the bridge.", "along", "into", "through"], ["He swam _____ the lake to the other side.", "over to", "through", "across"], ["The plane flew _____ the mountains.", "over", "through of", "under"], ["She came _____ of the room and closed the door.", "out", "off", "away"], ["They ran _____ the hill to see the view.", "along", "up", "over"], ["The car drove _____ the tunnel.", "over", "through", "across"], ["Go _____ the bank and turn left.", "across of", "through", "past"], ["I'll pick _____ at the station.", "you up", "up you", "you"], ["Turn _____. You'll wake the baby.", "off it", "it off the TV", "the TV off"], ["Can you look _____ this word in the dictionary?", "it up", "up", "up it"], ["If you don't know the answer, look it _____.", "after", "up", "for"], ["My jacket is on the floor. I'll hang _____.", "it up", "up it", "it"], ["A: I'm really hungry.\nB: So _____ I.", "am", "do", "have"], ["A: I don't like jazz.\nB: Neither _____ I.", "don't", "am", "do"], ["A: I've been to Paris.\nB: So _____ I.", "did", "am", "have"], ["A: I can't swim.\nB: Neither _____ I.", "can", "can't", "do"], ["A: I didn't go out last night.\nB: Neither _____ I.", "didn't", "was", "did"], ["A: I was born in March.\nB: So _____ I!", "did", "was", "am"], ["A: I'll be late tomorrow.\nB: So _____ I.", "am", "will", "do"]]}, "v": {"parts": [[0, "Sport: choose the correct word."], [8, "Phrasal verbs: choose the correct word."], [17, "Similarities: choose the correct word."]], "k": "ABABCBCCACBAACABABBC", "q": [["The _____ blew his whistle at the end of the match.", "referee", "captain", "player"], ["They _____ 2–2 in the final.", "beat", "drew", "lost"], ["You need a racket to play _____.", "tennis", "volleyball", "golf"], ["The runners ran around the _____.", "pitch", "track", "court"], ["We're going to the _____ to see the match.", "gym", "swimming pool", "stadium"], ["He _____ his leg playing football.", "damaged up", "injured", "broke out"], ["The fans _____ when their team scored.", "shouted at", "clapped off", "cheered"], ["Our team is training for a big _____.", "game play", "sports", "competition"], ["Please _____ your coat. It's cold outside.", "put on", "put off", "put out"], ["The plane is going to _____ in five minutes.", "take out", "take on", "take off"], ["I _____ my old toys to the charity shop.", "gave up", "gave away", "gave in"], ["_____! There's a car coming!", "Look out", "Look up", "Look after"], ["Can you _____ my dog while I'm on holiday?", "look after", "look for", "look at"], ["Let's _____ for a run in the park.", "go over", "go off", "go out"], ["Don't _____! You can do it.", "give up", "give in to", "give back"], ["I _____ early this morning – at 5 a.m.", "woke off", "woke up", "woke on"], ["We need to _____ how to get there.", "find out", "find up", "find off"], ["My brother and I are very _____.", "same", "similar", "like"], ["She looks _____ her mother.", "as", "like", "similar"], ["We have a lot _____ common.", "of", "at", "in"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "CABAABBACC", "q": [["w*o*n", "r*u*n", "b*ea*t"], ["c*oa*ch", "sp*o*rt", "b*a*ll"], ["r*a*cket", "p*a*ss", "m*a*tch"], ["*th*ough", "*th*rough", "*th*row"], ["p*a*st", "acr*o*ss", "al*o*ng"], ["_com_petition", "compe_ti_tion", "com_pe_tition"], ["gymnas_tics_", "gym_nas_tics", "_gym_nastics"], ["ath_le_tics", "_ath_letics", "athle_tics_"], ["ma_ra_thon", "mara_thon_", "_ma_rathon"], ["_re_feree", "re_fe_ree", "refe_ree_"]]}, "r": {"title": "The marathon runner who started at 50", "k": "CABBA", "text": ["Galina Ivanova from Petropavlovsk ran her first marathon at the age of fifty-three. Before that, she had never done any sport. 'I used to sit at my desk all day and then sit on the sofa all evening,' she says.", "Everything changed when her daughter asked her to come for a run in the park. 'I could only run for two minutes,' Galina laughs. 'Then I had to stop and walk. But I enjoyed it, and so did my daughter.'", "They started going out three times a week. After a year, Galina could run ten kilometres without stopping. Two years later, she ran the Almaty Marathon in four hours and forty minutes.", "Now she is sixty and she has run eleven marathons, including in Berlin and Tokyo. 'People say, \"I'm too old to start.\" So did I,' she says. 'But your body doesn't know how old you are. Just put on your trainers and go out of the door.'"], "q": [["How old was Galina when she ran her first marathon?", "60", "50", "53"], ["Who asked her to go running?", "her daughter", "a friend", "her doctor"], ["How long could she run the first time?", "two kilometres", "two minutes", "ten minutes"], ["How long did her first marathon take?", "4 hours 14 minutes", "4 hours 40 minutes", "3 hours 40 minutes"], ["What is her advice?", "Just start.", "See a doctor first.", "Run with a friend."]]}, "l": {"setting": "You will hear Sabina and Alex, who have just met, finding things in common.", "k": "ABABC", "script": [["Alex", "So, Sabina, what do you do in your free time?"], ["Sabina", "I love swimming. I go to the pool three times a week."], ["Alex", "So do I! Which pool do you go to?"], ["Sabina", "The one near the park. I usually go in the morning, before work."], ["Alex", "Really? I go in the evening. That's why I've never seen you. Do you do any other sports?"], ["Sabina", "Not really. I don't like team sports."], ["Alex", "Neither do I. I'm not very good at football. What about watching sport?"], ["Sabina", "I watch tennis. I went to a tournament in Astana last year."], ["Alex", "I've never been to a tournament, but I'd like to. Maybe we could go together next time!"]], "q": [["What sport do they both do?", "swimming", "tennis", "football"], ["When does Sabina usually go to the pool?", "at lunchtime", "in the morning", "in the evening"], ["Why hasn't Alex seen Sabina at the pool?", "They go at different times.", "Sabina has just started.", "They go to different pools."], ["What doesn't Sabina like?", "swimming", "team sports", "watching sport"], ["What has Sabina been to?", "a swimming competition", "a football match", "a tennis tournament"]]}, "s": {"focus": "prepositions of movement, phrasal verbs, so / neither, sport.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What sports do you do or watch?", "What do you usually put on when it's cold?", "Who do you look after or who looks after you?", "Describe how you get from your home to work or school."]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about a sport you like or an important match you remember.", "prompts": ["what sport and why you like it", "where and when", "who played or who you watched", "what happened"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Find four things you have in common with the teacher", "Should sport be compulsory at school?", "Are famous footballers paid too much?"]}]}});
TESTS.push({"id": "q12", "kind": "quick", "title": "Quick Test 12", "focus": "File 12: past perfect, reported (indirect) speech, questions without auxiliaries, verb phrases, say or tell?, revision.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BABABACACC", "q": [["When I arrived, the film _____ already started.", "has", "had", "was"], ["She was sad because she _____ her job.", "had lost", "has lost", "loses"], ["I _____ never seen the sea before that holiday.", "was", "had", "have"], ["He said he _____ tired.", "was", "will be", "is"], ["She told me she _____ a new car.", "has buy", "had bought", "buys"], ["They said they _____ come to the party.", "would", "will", "can"], ["Who _____ the window?", "did break", "breaked", "broke"], ["What _____ yesterday?", "happened", "happen", "did happen"], ["Which team _____ the match?", "wins", "did win", "won"], ["Who _____ you that?", "tells", "did tell", "told"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BABACCACBA", "q": [["She _____ me she was hungry.", "said", "told", "spoke"], ["He _____ that he was going to be late.", "said", "told", "talked"], ["Can you _____ me a story?", "say", "tell", "speak"], ["He always _____ the truth.", "tells", "says", "speaks"], ["I _____ goodbye and left.", "told", "spoke", "said"], ["When I got home, I found that someone had _____ into my house.", "breaked", "broke", "broken"], ["By the time we got there, everyone had _____.", "left", "leaved", "leave"], ["I _____ my keys in the car.", "opened out", "closed up", "locked"], ["She _____ a lot of money on the lottery.", "earned", "won", "gained"], ["I realised I had _____ my passport at home.", "left", "forgotten at", "lost on"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "BACAB", "q": [["tr*ai*n", "s*ai*d", "s*a*y"], ["g*o*t", "g*o*ld", "t*o*ld"], ["h*a*d", "h*a*ppened", "w*a*nt"], ["re_por_ted", "_re_ported", "repor_ted_"], ["_re_membered", "re_mem_bered", "remem_bered_"]]}, "r": {"title": "The man who lost his memory", "k": "CBABA", "text": ["In 2008, a man was found in a park in Toronto, Canada. He was wet and confused, and he couldn't remember anything – not his name, his age or where he lived.", "Doctors said he had probably had an accident. The police showed his photo on TV, but nobody recognised him. For months he lived in a hospital and later in a small flat. He learned to cook and read again.", "Four years later, a woman in Norway saw his photo on the internet. She told the police that the man was her brother, Edgar, who had disappeared in 2007! The family had looked for him for years."], "q": [["Where was the man found?", "in a hospital", "in Norway", "in a park in Toronto"], ["What did he not remember?", "how to walk", "his name, age and home", "how to speak"], ["What did the doctors think?", "He had probably had an accident.", "He was lying.", "He was ill."], ["Who recognised him?", "the police", "his sister", "a doctor"], ["When had he disappeared?", "in 2007", "in 2012", "in 2008"]]}, "l": {"setting": "You will hear Meruyert telling her friend about a bad day.", "k": "CABBA", "script": [["Friend", "Hi Meruyert. How was your interview?"], ["Meruyert", "A disaster! When I got to the office, I realised I had left my CV at home."], ["Friend", "Oh no!"], ["Meruyert", "And then I went to the wrong floor. By the time I found the right room, the interview had already started."], ["Friend", "What did they say?"], ["Meruyert", "The manager said it was no problem and told me to sit down. She was really nice."], ["Friend", "So how did it go?"], ["Meruyert", "Actually, quite well. She said they would call me next week."]], "q": [["What had Meruyert forgotten?", "her keys", "her phone", "her CV"], ["What was the next problem?", "She went to the wrong floor.", "The office was closed.", "She was ill."], ["What had happened when she found the room?", "They had cancelled it.", "The interview had started.", "The manager had left."], ["What did the manager tell her?", "to come back later", "to sit down", "to go home"], ["When will they call her?", "next week", "in a month", "tomorrow"]]}, "s": {"focus": "past perfect, reported speech, questions without auxiliaries, say / tell.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What had you already done before you came to class today?", "Who told you some good news recently? What did they say?", "Who taught you to ride a bike?", "What happened on your last birthday?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Tell the teacher a story about a bad day (use had + past participle)", "Report what three people said to you this week."]}]}});
TESTS.push({"id": "f12", "kind": "file", "title": "File Test 12", "focus": "File 12: past perfect, reported (indirect) speech, questions without auxiliaries, verb phrases, say or tell?, revision of verb forms.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BABABCBCCBCAACABCBAA", "q": [["When we got to the station, the train _____ left.", "has already", "had already", "already"], ["I couldn't pay because I _____ my wallet at home.", "'d left", "leave", "'ve left"], ["She _____ to Japan before, so she knew the city.", "was being", "had been", "has been"], ["They were hungry because they _____ anything all day.", "hadn't eaten", "didn't eaten", "haven't eaten"], ["When I opened the door, I saw that someone _____ the window.", "breaks", "had broken", "has broken"], ["_____ you ever seen snow before you moved to Canada?", "Have", "Did", "Had"], ["He said he _____ my email.", "doesn't received", "hadn't received", "hasn't received"], ["She said that she _____ living in Almaty.", "is", "has been", "was"], ["They told us they _____ the next day.", "come", "will come", "would come"], ["He said he _____ speak French.", "can to", "could", "can"], ["She told me she _____ to the dentist the day before.", "goes", "has been", "had been"], ["'I'm tired,' he said. → He said he _____ tired.", "was", "is", "had"], ["'We'll call you,' they said. → They said they _____ call me.", "would", "will", "can"], ["'I don't like cats,' she said. → She said she _____ like cats.", "hadn't", "doesn't", "didn't"], ["Who _____ the first iPhone?", "designed", "did design", "designs"], ["What _____ you most about the book?", "did surprise", "surprised", "surprises"], ["Which of your friends _____ the party?", "did organise", "organises", "organised"], ["Who _____ you the news?", "tells", "told", "did tell"], ["Who _____ at the party last night?", "did you see", "you saw", "saw you"], ["How many people _____ to the concert?", "came", "come", "did come"]]}, "v": {"parts": [[0, "say or tell?: choose the correct word."], [6, "Verb phrases: choose the correct word."], [18, "Revision: choose the correct word."]], "k": "BCABBABAACBBCCACBAAC", "q": [["He _____ me a funny joke.", "said", "told", "spoke"], ["What did she _____?", "speak", "tell", "say"], ["She _____ she would be late.", "said", "told to", "told"], ["Don't _____ lies.", "speak", "tell", "say"], ["He _____ hello to everyone.", "told", "said", "spoke"], ["Can you _____ me the way to the station?", "tell", "speak", "say"], ["I _____ a promise and I kept it.", "did", "made", "took"], ["She _____ a decision to leave her job.", "made", "did", "had"], ["We _____ a lot of fun at the party.", "had", "made", "did"], ["Can you _____ me a favour?", "make", "give", "do"], ["He _____ his driving test three times before he passed.", "missed", "failed", "lost"], ["I _____ the bus and had to walk.", "lost", "missed", "failed"], ["They _____ an argument about money.", "did", "made", "had"], ["Let's _____ a break. I'm tired.", "do", "make", "take"], ["She _____ a speech at the wedding.", "gave", "made out", "did"], ["I _____ my phone on the train.", "forgot on", "lost on", "left"], ["Can you _____ an eye on my bag?", "have", "keep", "take care"], ["He _____ a fortune on the lottery.", "won", "earned", "got rich"], ["I've lived here _____ 2010.", "since", "from", "for"], ["If I _____ you, I'd say sorry.", "am", "would be", "were"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "BACBACAABC", "q": [["w*ai*ted", "s*ai*d", "m*a*de"], ["g*o*t", "t*o*ld", "wr*o*te"], ["th*ough*t", "c*augh*t", "th*ou*sand"], ["w*or*d", "b*ear*d", "h*ear*d"], ["*s*ure", "*s*ay", "*s*aid"], ["or_ga_nised", "orga_ni_sed", "_or_ganised"], ["de_ci_sion", "_de_cision", "deci_sion_"], ["re_mem_bered", "_re_membered", "remem_bered_"], ["_dis_appeared", "disap_peared_", "dis_ap_peared"], ["acci_dent_", "ac_ci_dent", "_ac_cident"]]}, "r": {"title": "The note in the bottle", "k": "ABCAB", "text": ["In 2019, a ten-year-old boy called Arman was walking along the beach of the Caspian Sea near Aktau with his father when he found an old green bottle. Inside there was a note.", "The note was written in English. It said: 'Hello! My name is Sarah and I am eight years old. I live in Scotland. If you find this, please write to me.' There was an address. The note had been in the sea for more than twenty years!", "Arman's father explained that the Caspian Sea isn't connected to the oceans, so the bottle couldn't have come from Scotland by sea. They found out later that Sarah's uncle had worked on an oil platform near Aktau in the 1990s. Sarah had given him the bottle and asked him to throw it into the sea there.", "Arman wrote a letter to the address. A few weeks later, he got a reply. Sarah, who was by then in her thirties and had a son of her own, said she had almost forgotten about the bottle. 'I couldn't believe it,' she wrote. 'I cried when I read your letter.' The two families now talk online every month."], "q": [["Where did Arman find the bottle?", "on a beach near Aktau", "on an oil platform", "in Scotland"], ["How long had the note been in the sea?", "ten years", "more than twenty years", "eight years"], ["How did the bottle get into the Caspian Sea?", "It came from Scotland by sea.", "Sarah threw it there.", "Sarah's uncle threw it there."], ["How did Sarah feel when she read Arman's letter?", "She cried.", "She was confused.", "She was angry."], ["What do the families do now?", "visit each other every year", "talk online every month", "write letters every week"]]}, "l": {"setting": "You will hear Kate telling her friend about a phone call from her old school friend.", "k": "AACBB", "script": [["Friend", "You look happy, Kate. What's happened?"], ["Kate", "I had a call from Dana last night! We hadn't spoken for ten years."], ["Friend", "Wow. How did she find your number?"], ["Kate", "She said she had seen my photo on a friend's social media page and asked for my number."], ["Friend", "What's she doing now?"], ["Kate", "She told me she was working as a doctor in Almaty. And she said she had got married two years ago."], ["Friend", "Are you going to meet?"], ["Kate", "Yes. She said she would come to Kostanay next month to visit her parents, so we're going to have dinner together."], ["Friend", "That's lovely. Who stopped calling, by the way? Why did you lose contact?"], ["Kate", "Nobody really. She moved to Almaty for university and we just got busy. It happens."]], "q": [["How long had they not spoken?", "ten years", "one year", "two years"], ["How did Dana find Kate's number?", "She asked a friend.", "She called Kate's parents.", "It was on social media."], ["What is Dana's job?", "nurse", "teacher", "doctor"], ["When did Dana get married?", "last month", "two years ago", "ten years ago"], ["Why did they lose contact?", "They had an argument.", "They got busy after Dana moved.", "Kate changed her number."]]}, "s": {"focus": "past perfect, reported speech, questions without auxiliaries, say / tell, verb phrases.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What's the best news someone has told you recently?", "Who taught you most at school? What did he / she say?", "What had you done before you started this course?", "What happened the last time you missed a bus or train?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Tell a story about a surprising or lucky moment.", "prompts": ["when and where it happened", "what had happened before", "what people said", "how it ended"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Is it important to stay in touch with old school friends?", "Do you believe people who say they never lie?", "What has been the most useful thing in this English course?"]}]}});

themeSel.onchange=()=>{state.theme=themeSel.value;applyTheme();save()};
applyTheme();

/* scoring */
function secData(t,k){if(k==='r')return{q:t.r.q,k:t.r.k,w:t.rw||2};if(k==='l')return{q:t.l.q,k:t.l.k,w:t.rw||2};return{q:t[k].q,k:t[k].k,w:1}}
function secScore(t,k){const st=ts(t.id);if(k==='s')return Object.values(st.s).reduce((a,b)=>a+b,0);const d=secData(t,k);let c=0;for(const i in st.a[k]){if(L[st.a[k][i]]===d.k[i])c+=d.w}return c}
function secDone(t,k){const st=ts(t.id);if(k==='s')return Object.keys(st.s).length;return Object.keys(st.a[k]).length}
function secCount(t,k){if(k==='s')return t.s.tasks.length;return secData(t,k).q.length}
const reveal=t=>state.mode==='practice'||ts(t.id).marked;
function band(p){if(p>=90)return'Excellent';if(p>=75)return'Good';if(p>=60)return'Satisfactory';if(p>=40)return'Needs revision';return'Needs a lot of revision'}

/* text formatting */
function fmtPron(s){return esc(s).replace(/\*(.+?)\*/g,'<b class="snd">$1</b>').replace(/_(.+?)_/g,'<u class="str">$1</u>')}
function fmtStem(s,filled){
  return s.split('\n').map(line=>{
    let m=line.match(/^([AB]):\s*(.*)$/);let pre='';
    if(m){pre='<span class="spk">'+m[1]+'</span>';line=m[2]}
    const parts=line.split(/_{3,}/);
    return pre+parts.map(esc).join(filled!=null?'<span class="blank filled">'+esc(filled)+'</span>':'<span class="blank" aria-label="gap"></span>')
  }).join('<br>');
}

/* nav */
function renderNav(){
  let h='';
  for(const c of COLLECTIONS){
    h+='<h2>'+esc(c.name)+'</h2>';
    if(!c.ids.length){h+=c.link?'<p class="soon"><a href="'+c.link+'" target="_blank" rel="noopener" style="color:inherit">'+esc(c.linkText)+'</a></p>':'<p class="soon">Not added yet</p>';continue}
    h+='<ul>';
    for(const id of c.ids){const t=TESTS.find(x=>x.id===id);const tot=secsFor(t).reduce((a,s)=>a+secScore(t,s.k),0);const any=secsFor(t).some(s=>secDone(t,s.k)>0);
      h+='<li><button data-test="'+id+'" aria-current="'+(id===state.cur)+'"><span>'+esc(t.title)+'</span><span class="mini">'+(any&&reveal(t)?tot:'')+'</span></button></li>'}
    h+='</ul>';
  }
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>goTest(b.dataset.test));
}
function goTest(id){stopAudio();stopTimer();state.cur=id;state.sec='g';save();renderAll();window.scrollTo(0,0)}

     '<label>Student name<input id="sname" value="'+esc(state.name)+'" autocomplete="off"></label>'+

function qBlock(t,k,i,item,isPron){
  const st=ts(t.id),d=secData(t,k),ch=st.a[k][i],rv=reveal(t),right=L.indexOf(d.k[i]);
  const stem=isPron?null:item[0],opts=isPron?item:item.slice(1);
  const locked=(state.mode==='practice'&&ch!=null)||st.marked;
  let h='<div class="q" id="q-'+k+'-'+i+'"><div class="n">'+(i+1)+'</div><div>';
  if(stem!=null)h+='<div class="stem">'+fmtStem(stem,(ch!=null&&stem.indexOf('___')>-1)?opts[ch]:null)+'</div>';
  h+='<div class="opts">';
  opts.forEach((o,j)=>{let c='opt';
    if(ch===j)c+=' sel';
    if(rv&&ch!=null){if(j===ch)c+=(j===right?' ok':' no');else if(j===right)c+=' key'}
    h+='<button class="'+c+'" data-k="'+k+'" data-i="'+i+'" data-j="'+j+'"'+(locked?' disabled':'')+' aria-pressed="'+(ch===j)+'"><span class="l">'+L[j]+'</span><span>'+(isPron?fmtPron(o):esc(o))+'</span></button>'});
  h+='</div>';
  if(rv&&ch!=null)h+='<div class="verdict '+(ch===right?'ok">Correct':'no">Answer: '+L[right]+'  '+(isPron?opts[right].replace(/[*_]/g,''):esc(opts[right])))+'</div>';
  return h+'</div></div>';
}
function listBlock(t,k,obj,isPron){
  let h='',pi=0;
  obj.q.forEach((item,i)=>{
    if(obj.parts&&pi<obj.parts.length&&obj.parts[pi][0]===i){h+='<h3 class="part">'+esc(obj.parts[pi][1])+'</h3>';pi++}
    h+=qBlock(t,k,i,item,isPron)});
  return h;
}

function renderSec(t,k){
  if(k==='g')return'<h2>Grammar</h2>'+listBlock(t,'g',t.g,false);
  if(k==='v')return'<h2>Vocabulary</h2>'+listBlock(t,'v',t.v,false);
  if(k==='p')return'<h2>Pronunciation</h2>'+listBlock(t,'p',t.p,true);
  if(k==='r'){
    return'<h2>Reading</h2><p class="focus" style="color:var(--muted)">Read the text and choose A, B, or C. '+((t.rw||2)===1?'One mark':'Two marks')+' for each answer.</p><div class="reading"><article class="text"><h3>'+esc(t.r.title)+'</h3>'+t.r.text.map(p=>'<p>'+esc(p)+'</p>').join('')+'</article><div>'+t.r.q.map((q,i)=>qBlock(t,'r',i,q,false)).join('')+'</div></div>';
  }
  if(k==='l')return renderListening(t);
  if(k==='s')return renderSpeaking(t);
}
function bindSec(t){
  document.querySelectorAll('#sec .opt').forEach(b=>b.onclick=()=>{
    const st=ts(t.id),k=b.dataset.k,i=+b.dataset.i,j=+b.dataset.j;
    if(st.marked)return;
    if(state.mode==='practice'&&st.a[k][i]!=null)return;
    st.a[k][i]=j;save();refreshQ(t,k,i);renderTabs();renderLedger();renderNav();
  });
  if(state.sec==='l')bindListening(t);
  if(state.sec==='s')bindSpeaking(t);
}
function refreshQ(t,k,i){
  const el=document.getElementById('q-'+k+'-'+i);if(!el)return;
  const src=k==='r'?t.r.q[i]:k==='l'?t.l.q[i]:t[k].q[i];
  el.outerHTML=qBlock(t,k,i,src,k==='p');
  const nel=document.getElementById('q-'+k+'-'+i);
  nel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const st=ts(t.id),j=+b.dataset.j;if(st.marked)return;if(state.mode==='practice'&&st.a[k][i]!=null)return;
    st.a[k][i]=j;save();refreshQ(t,k,i);renderTabs();renderLedger();renderNav()});
}
function renderTabs(){const t=T(),SECS=secsFor(t);document.querySelectorAll('.tabs [data-sec]').forEach(b=>{const s=SECS.find(x=>x.k===b.dataset.sec);b.querySelector('.badge').textContent=reveal(t)?secScore(t,s.k)+'/'+s.max:secDone(t,s.k)+'/'+secCount(t,s.k)})}

/* listening */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let voices=[],playing=false,paused=false,chosenVoice='';
function loadVoices(){if(!synth)return;const all=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang)||v.lang==='en');
  const rank=v=>(/en[-_]GB/i.test(v.lang)?3:/en[-_](IE|AU|NZ)/i.test(v.lang)?2:/en[-_]US/i.test(v.lang)?1:0)+(v.localService?0.5:0);
  voices=all.sort((a,b)=>rank(b)-rank(a));
  const sel=document.getElementById('voice');if(sel)fillVoices(sel)}
function fillVoices(sel){sel.innerHTML='<option value="">Automatic (British first)</option>'+voices.map(v=>'<option value="'+esc(v.name)+'"'+(v.name===chosenVoice?' selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('')}
if(synth){loadVoices();if(synth.addEventListener)synth.addEventListener('voiceschanged',loadVoices);else synth.onvoiceschanged=loadVoices}
function stopAudio(){if(synth){synth.cancel()}playing=false;paused=false}
function renderListening(t){
  const st=ts(t.id);const lim=2;
  let h='<h2>Listening</h2><p style="color:var(--muted);margin:0">'+esc(t.l.setting)+' Choose A, B, or C. '+((t.rw||2)===1?'One mark':'Two marks')+' for each answer.</p>';
  h+='<div class="player">';
  if(!synth){h+='<p style="margin:0">Audio playback isn\'t available in this browser. The teacher can reveal the script and read it aloud.</p>'}
  else{
    h+='<div class="row"><button class="primary" id="lplay">'+(paused?'Resume':'Play recording')+'</button><button id="lpause">Pause</button><button id="lstop">Stop</button><span class="plays" id="lplays">Plays used: '+st.plays+' of '+lim+'</span></div>';
    h+='<div class="row" style="margin-top:10px"><label>Voice <select id="voice"></select></label><label>Speed <select id="rate"><option value="0.85">Slower</option><option value="0.95" selected>Normal</option><option value="1.05">Faster</option></select></label></div>';
    h+='<div class="status" id="lstatus">'+(st.plays>=lim?'Both plays used. The teacher can allow another play.':'Press play when the class is ready.')+'</div>';
    h+='<div class="row" style="margin-top:6px"><button class="linkbtn" id="lreset" style="color:#E7D6A2">Teacher: allow another play</button></div>';
  }
  h+='</div>';
  h+='<p><button class="linkbtn" id="ltoggle">'+(st.showScript?'Hide script':'Show script (teacher)')+'</button></p>';
  if(st.showScript)h+='<div class="script" id="lscript">'+t.l.script.map((ln,i)=>'<p data-line="'+i+'"><b>'+esc(ln[0])+':</b> '+esc(ln[1])+'</p>').join('')+'</div>';
  h+=t.l.q.map((q,i)=>qBlock(t,'l',i,q,false)).join('');
  return h;
}
function bindListening(t){
  const st=ts(t.id),lim=2;
  const tg=$('#ltoggle');if(tg)tg.onclick=()=>{st.showScript=!st.showScript;save();$('#sec').innerHTML=renderSec(t,'l');bindSec(t)};
  if(!synth)return;
  const vs=$('#voice');fillVoices(vs);vs.onchange=()=>{chosenVoice=vs.value};
  $('#lreset').onclick=()=>{st.plays=Math.max(0,st.plays-1);save();$('#lplays').textContent='Plays used: '+st.plays+' of '+lim;$('#lstatus').textContent='One more play allowed.'};
  $('#lpause').onclick=()=>{if(playing&&!paused){synth.pause();paused=true;$('#lplay').textContent='Resume';$('#lstatus').textContent='Paused.'}};
  $('#lstop').onclick=()=>{stopAudio();$('#lplay').textContent='Play recording';$('#lstatus').textContent='Stopped.';markLine(-1)};
  $('#lplay').onclick=()=>{
    if(paused){synth.resume();paused=false;$('#lplay').textContent='Play recording';$('#lstatus').textContent='Playing…';return}
    if(playing)return;
    if(st.plays>=lim){$('#lstatus').textContent='Both plays used. The teacher can allow another play.';return}
    st.plays++;save();$('#lplays').textContent='Plays used: '+st.plays+' of '+lim;
    speakScript(t,+$('#rate').value);
  };
}
function markLine(i){document.querySelectorAll('#lscript p').forEach(p=>p.classList.toggle('now',+p.dataset.line===i))}
function speakScript(t,rate){
  synth.cancel();
  const speakers=[...new Set(t.l.script.map(l=>l[0]))];
  const base=chosenVoice?voices.find(v=>v.name===chosenVoice):voices[0];
  const pool=chosenVoice?[base]:voices.slice(0,4);
  const pitches=[1,1.18,0.88,1.08];
  const q=[];
  t.l.script.forEach((ln,li)=>{
    const si=speakers.indexOf(ln[0]);
    const v=pool.length?pool[si%pool.length]:null;
    const pitch=(pool.length>si)?1:pitches[si%pitches.length];
    (ln[1].match(/[^.!?…]+[.!?…]*[”"’']?\s*/g)||[ln[1]]).forEach(s=>{s=s.trim();if(!s)return;
      const u=new SpeechSynthesisUtterance(s);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
      u.rate=rate;u.pitch=pitch;u.ifVoice=si%2?"female":"male";u.onstart=()=>markLine(li);q.push(u)});
  });
  if(!q.length)return;
  playing=true;paused=false;$('#lstatus').textContent='Playing…';
  q[q.length-1].onend=()=>{playing=false;paused=false;const s=$('#lstatus');if(s)s.textContent='Finished. Answer the questions below.';markLine(-1)};
  q.forEach(u=>{u.onerror=()=>{playing=false}});
  q.forEach(u=>synth.speak(u));
}

/* speaking */
let timer=null,timerLeft=0,timerTask=-1;
function stopTimer(){if(timer)clearInterval(timer);timer=null;timerTask=-1}
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function renderSpeaking(t){
  const st=ts(t.id);
  let h='<h2>Speaking</h2><p style="color:var(--muted);margin:0">The teacher gives each task a mark from 0 to 10 using the guide below. Useful language this file: '+esc(t.s.focus)+'</p>';
  h+='<div class="bands"><table><tr><td>9–10</td><td>Fluent and relaxed, wide range of grammar and vocabulary from the file, very few errors, clear pronunciation.</td></tr><tr><td>7–8</td><td>Mostly fluent, good range, some errors that don\'t block understanding.</td></tr><tr><td>5–6</td><td>Completes the task with pauses; limited range; errors sometimes affect meaning.</td></tr><tr><td>3–4</td><td>Short answers, frequent errors, needs help from the teacher.</td></tr><tr><td>0–2</td><td>Very little language produced.</td></tr></table></div>';
  t.s.tasks.forEach((tk,i)=>{
    h+='<div class="task"><h3>Task '+(i+1)+': '+esc(tk.name)+'</h3><div class="meta">About '+tk.mins+' minute'+(tk.mins>1?'s':'')+'. '+esc(tk.lead)+'</div>';
    if(tk.card)h+='<div class="card">'+esc(tk.card)+'</div>';
    h+='<ul>'+tk.prompts.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>';
    const left=timerTask===i?timerLeft:tk.mins*60;
    h+='<div class="timer"><span class="clock" id="clock'+i+'">'+mmss(left)+'</span><button data-tstart="'+i+'">'+(timerTask===i&&timer?'Pause':'Start timer')+'</button><button data-treset="'+i+'">Reset</button></div>';
    h+='<div class="rate" role="group" aria-label="Mark for task '+(i+1)+'"><span class="lab">Mark</span>';
    for(let n=0;n<=10;n++)h+='<button data-task="'+i+'" data-n="'+n+'" aria-pressed="'+(st.s[i]===n)+'">'+n+'</button>';
    h+='</div></div>';
  });
  return h;
}
function bindSpeaking(t){
  const st=ts(t.id);
  document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const i=+b.dataset.task,n=+b.dataset.n;
    if(st.s[i]===n)delete st.s[i];else st.s[i]=n;save();
    b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(st.s[i]===+x.dataset.n)));
    renderTabs();renderLedger();renderNav()});
  document.querySelectorAll('[data-tstart]').forEach(b=>b.onclick=()=>{const i=+b.dataset.tstart;
    if(timerTask===i&&timer){clearInterval(timer);timer=null;b.textContent='Resume';return}
    if(timerTask!==i){stopTimer();document.querySelectorAll('[data-tstart]').forEach(x=>x.textContent='Start timer');timerTask=i;timerLeft=t.s.tasks[i].mins*60}
    b.textContent='Pause';
    timer=setInterval(()=>{timerLeft--;const c=document.getElementById('clock'+i);if(c)c.textContent=mmss(Math.max(0,timerLeft));
      if(timerLeft<=0){clearInterval(timer);timer=null;if(c)c.textContent='Time';b.textContent='Start timer';timerTask=-1}},1000)});
  document.querySelectorAll('[data-treset]').forEach(b=>b.onclick=()=>{const i=+b.dataset.treset;if(timerTask===i)stopTimer();
    const c=document.getElementById('clock'+i);if(c)c.textContent=mmss(t.s.tasks[i].mins*60);const s=document.querySelector('[data-tstart="'+i+'"]');if(s)s.textContent='Start timer'});
}

/* ledger */
let confirmReset=false;
function renderLedger(){
  const t=T(),st=ts(t.id),rv=reveal(t),SECS=secsFor(t),maxT=SECS.reduce((a,s)=>a+s.max,0);
  const tot=SECS.reduce((a,s)=>a+secScore(t,s.k),0);
  const answered=SECS.reduce((a,s)=>a+secDone(t,s.k),0),count=SECS.reduce((a,s)=>a+secCount(t,s.k),0);
  const done=SECS.reduce((a,s)=>a+(s.k==='s'?(secDone(t,s.k)?s.max*secDone(t,s.k)/secCount(t,s.k):0):secDone(t,s.k)*(s.k==='r'||s.k==='l'?(t.rw||2):1)),0);
  const pctAll=Math.round(tot/maxT*100);const pctDone=done?Math.round(tot/done*100):0;
  let h='<div class="card-l"><div class="t">'+esc(t.title)+'</div><div class="st">'+(state.name?esc(state.name):'Student name not entered')+(state.cls?', '+esc(state.cls):'')+'</div>';
  if(rv){
    h+='<div class="big"><span class="num">'+tot+'</span><span class="of">/ '+maxT+'</span></div>';
    h+='<div class="pct">'+(done?'<b>'+pctDone+'%</b> of marks attempted so far':'Scores appear here as questions are answered')+(answered===count?'<br>Final result: <b>'+band(pctAll)+'</b>':'')+'</div>';
  }else{
    h+='<div class="big"><span class="num">'+answered+'</span><span class="of">/ '+count+' answered</span></div><div class="pct">Scores are hidden in exam mode until the test is marked.</div>';
  }
  SECS.forEach(s=>{const sc=secScore(t,s.k),d=secDone(t,s.k),n=secCount(t,s.k);
    const w=rv?sc/s.max*100:d/n*100;
    h+='<div class="rowl"><span>'+s.name+'</span><span class="v">'+(rv?sc+' / '+s.max:d+' / '+n)+'</span><span class="bar"><i style="width:'+w+'%"></i></span></div>'});
  h+='<div class="actions">';
  if(state.mode==='exam'&&!st.marked)h+='<button class="go" id="markbtn">Mark test</button>';
  h+='<button id="resetbtn">'+(confirmReset?'Press again to clear all answers':'Reset this test')+'</button></div>';
  h+='<p class="src">Written for IF Academy to follow the syllabus of English File Pre-intermediate (A2). Listening uses the device\'s built-in voices.</p></div>';
  $('#ledger').innerHTML=h;
  const mb=$('#markbtn');if(mb)mb.onclick=()=>{st.marked=true;save();renderAll()};
  $('#resetbtn').onclick=()=>{if(!confirmReset){confirmReset=true;renderLedger();setTimeout(()=>{if(confirmReset){confirmReset=false;renderLedger()}},4000);return}
    confirmReset=false;stopAudio();stopTimer();delete state.tests[t.id];save();renderAll()};
  $('#mtotal').innerHTML='<span>'+esc(t.title)+'</span>'+(rv?'<b>'+tot+' / '+maxT+'</b>':'<b>'+answered+' / '+count+'</b>')+'<button id="mjump">Scores</button>';
  $('#mjump').onclick=()=>$('#ledger').scrollIntoView({behavior:'smooth'});
}
function renderAll(){renderNav();renderMain();renderLedger()}
/* In-page dialogs: browser alert/confirm boxes are blocked inside claude.ai pages on phones */
function uiAsk(msg,ok,cancel){return new Promise(res=>{

/* ===== IF Academy class record layer (teacher dashboard, live saving, result codes) ===== */
const HASF=typeof FK==='function';
const isF=t=>HASF&&FK(t);
const RT={ready:false,user:null,db:null,dl:null,owner:false,uid:null,canWrite:null,sync:'local',all:[],remote:null,writeErr:null};

const slug=s=>ifTr(String(s||'').toLowerCase()).normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x';
/* answers and marks are stored as JSON strings so each write replaces them (the class record merges nested objects) */
function recA(r){if(!r)return {};if(typeof r.aj==='string'){try{return JSON.parse(r.aj)}catch(e){}}return r.a||{}}
function recTM(r){if(!r)return null;if(typeof r.tmj==='string'){try{return JSON.parse(r.tmj)}catch(e){}}return r.tm||null}
const teacherSec=k=>k==='s'||k==='w';

/* score any stored record with the engine's own scoring */
function withRec(t,r,fn){
  const had=Object.prototype.hasOwnProperty.call(state.tests,t.id),orig=state.tests[t.id];
  const tm=recTM(r)||{},a=JSON.parse(JSON.stringify(recA(r)));
  if(!isF(t))['g','v','p','r','l'].forEach(k=>{if(!a[k])a[k]={}});
  const rec={a,s:Object.assign({},tm.s||{}),marked:true,plays:0};
  if(isF(t))rec.w={text:r.wt||'',mark:tm.w==null?null:tm.w};
  state.tests[t.id]=rec;
  try{return fn()}finally{if(had)state.tests[t.id]=orig;else delete state.tests[t.id]}
}
function recScore(t,r){return withRec(t,r,()=>{
  const S=secsFor(t),secs={};let tot=0,auto=0,autoMax=0,pending=false,answered=0,items=0;
  S.forEach(s=>{const sc=secScore(t,s.k);secs[s.k]=sc;tot+=sc;
    if(teacherSec(s.k)){if(!secDone(t,s.k))pending=true}
    else{auto+=sc;autoMax+=s.max;answered+=secDone(t,s.k);items+=secCount(t,s.k)}});
  return {secs,tot,auto,autoMax,pending,answered,items,S,max:S.reduce((a,s)=>a+s.max,0)}})}

/* ---------- student view: lock teacher-only marks ---------- */
function lockMarks(){
  if(!studentLocked())return;
  const groups=[...document.querySelectorAll('#sec .rate')].filter(g=>g.querySelector('[data-task],[data-wmark]'));
  groups.forEach(g=>g.querySelectorAll('button').forEach(b=>{b.disabled=true;b.style.cursor='default'}));
  document.querySelectorAll('#ltoggle,[data-lscript],#lreset,[data-lmore]').forEach(b=>{const p=b.closest('p,.row');(p||b).style.display='none'});
  if(groups.length&&!document.querySelector('#sec .marknote')){
    const p=document.createElement('p');p.className='syncnote marknote';
    p.textContent=state.sec==='w'?'Your teacher marks your writing. The mark appears here when it is ready.':'Your teacher gives these marks after talking with you. They appear here when they are ready.';
    groups[0].parentNode.insertBefore(p,groups[0]);
  }
}
function viewSwitch(){if(!RT.owner)return '';const tv=state.view==='teacher';
  return '<div class="vswitch" role="group" aria-label="Switch view"><button data-v="tests" aria-pressed="'+(!tv)+'">Tests <span class="vsub">student view</span></button><button data-v="teacher" aria-pressed="'+tv+'">Teacher dashboard <span class="vsub" id="vcount">'+(RT.all.length?RT.all.length+' student'+(RT.all.length===1?'':'s'):'class record')+'</span></button></div>'}
function bindSwitch(){document.querySelectorAll('.vswitch [data-v]').forEach(b=>b.onclick=()=>{stopAudio();stopTimer();state.view=b.dataset.v;saveLocal();renderAll();window.scrollTo(0,0)})}

}

/* ---------- result codes ---------- */
function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function pack(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if('CompressionStream' in window){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return 'IFA1.'+b64u(buf)}catch(e){}}
  return 'IFA0.'+b64u(raw)}
async function unpack(code){{const mm=String(code).match(/IFA[01]\.[A-Za-z0-9_-]+/);if(mm)code=mm[0]}code=String(code).trim().replace(/\s+/g,'');const m=code.match(/^IFA([01])\.(.+)$/);if(!m)throw new Error('This doesn’t look like an IF Academy result code.');
  let bytes=unb64u(m[2]);if(m[1]==='1'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(bytes))}
/* hand in (button or time up) also saves the result to the student's profile and the teachers' results page */
function ifPullMarks(){try{if(RT.owner||!state||!state.tests)return;let ch=0;Promise.all(Object.keys(state.tests).map(async id=>{const st=state.tests[id];if(!st||!st.handed||!st.rid||!st.s||typeof st.s!=='object')return;const r=await fetch('/api/tests/marks/'+encodeURIComponent('ifr-'+st.rid));if(!r.ok)return;const j=await r.json();if(j&&j.s&&JSON.stringify(st.s)!==JSON.stringify(j.s)){st.s=Object.assign({},j.s);ch=1}})).then(()=>{if(ch){save();renderAll()}}).catch(()=>{})}catch(e){}}
setTimeout(ifPullMarks,2500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)ifPullMarks()});
function ifSendNow(t){if(RT.owner)return;const st=ts(t.id),box=$('#codebox'),code='';if(!box)return;setTimeout(()=>{try{if(!window.IFR)return;if(!st.rid){st.rid=IFR.newId();try{(typeof _save==='function'?_save:save)()}catch(e){}}const S=secsFor(t).map(s=>[s.name,teacherSec(s.k)&&!secDone(t,s.k)?null:secScore(t,s.k),s.max]);const W=[isF(t)?(fw(t).text||''):''];box.innerHTML='';IFR.box(box,{id:st.rid,c:'English File Pre-intermediate Test Centre',lv:'A2',t:t.title,v:'',n:state.name,cl:state.cls,s:S,w:W,x:code})}catch(e){console.error('IFR',e)}},0)}
async function showCode(){
  const t=T(),st=ts(t.id);
  if(!state.name.trim()){await uiAlert('Please type your name and class at the top of the test first.');const f=$('#sname');if(f)f.focus();return}
  if(!st.marked&&!await uiConfirm('Send your results now? Your test will be marked and locked.'))return;
  st.marked=true;st.handed=true;_save();
  const code=await pack({v:1,n:state.name,c:state.cls,id:t.id,a:st.a,wt:isF(t)?fw(t).text:'',m:{s:st.s||{},w:isF(t)?(fw(t).mark==null?null:fw(t).mark):null},at:new Date().toISOString()});
  renderAll();
  const box=$('#codebox');if(!box)return;setTimeout(()=>{try{if(!window.IFR)return;if(!st.rid){st.rid=IFR.newId();try{(typeof _save==='function'?_save:save)()}catch(e){}}const S=secsFor(t).map(s=>[s.name,teacherSec(s.k)&&!secDone(t,s.k)?null:secScore(t,s.k),s.max]);const W=[isF(t)?(fw(t).text||''):''];box.innerHTML='';IFR.box(box,{id:st.rid,c:'English File Pre-intermediate Test Centre',lv:'A2',t:t.title,v:'',n:state.name,cl:state.cls,s:S,w:W,x:code})}catch(e){console.error('IFR',e)}},0);
  box.innerHTML='<div class="codebox"><p><b>Your result code.</b> Copy it and send it to your teacher, for example in a message.</p><textarea readonly id="codeta">'+esc(code)+'</textarea><button class="go" id="copycode">Copy code</button></div>';
  const ta=$('#codeta');ta.focus();ta.select();
  $('#copycode').onclick=async()=>{try{await navigator.clipboard.writeText(code);$('#copycode').textContent='Copied'}catch(e){ta.select();$('#copycode').textContent='Press Ctrl+C to copy'}};
}

/* ---------- saving to the class record ---------- */
let saveTimer=null,syncing=false,syncAgain=false,lastSent={};const docExists={};
function recordFor(t){const st=ts(t.id);const r={aj:JSON.stringify(st.a||{}),wt:isF(t)?(fw(t).text||''):'',marked:!!st.marked,handed:!!st.handed,mode:state.mode};
  if(RT.owner)r.tmj=JSON.stringify({s:st.s||{},w:isF(t)?(fw(t).mark==null?null:fw(t).mark):null});return r}
function currentKey(){if(RT.owner){if(!state.name.trim())return null;return 'dev-'+slug(state.name)+'--'+slug(state.cls)}return RT.uid}
function queueSync(now){if(!RT.db||(RT.sync!=='live'&&!RT.owner))return;clearTimeout(saveTimer);saveTimer=setTimeout(doSync,now?50:2500)}
async function doSync(){
  if(syncing){syncAgain=true;return}
  const key=currentKey();if(!key||!RT.db)return;const t=T();if(!t)return;
  const rec=recordFor(t);const sig=key+'|'+t.id+'|'+state.name+'|'+state.cls+'|'+JSON.stringify(rec);if(lastSent[key+'|'+t.id]===sig)return;
  syncing=true;
  try{
    rec.upd=new Date().toISOString();
    const ref=RT.db.doc('results/'+key);
    const head={name:state.name||'',cls:state.cls||'',updated:rec.upd,src:RT.owner?'device':'student'};
    if(!docExists[key]){const g=await ref.get();docExists[key]=g.exists;
      if(!g.exists){await ref.set(Object.assign({},head,{tests:{[t.id]:rec}}));docExists[key]=true}
      else await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}))}
    else await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}));
    lastSent[key+'|'+t.id]=sig;RT.writeErr=null;
  }catch(e){
    if(!RT.owner&&e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='permission_denied')){RT.sync='code';RT.writeErr=null;renderAll()}
    else if(e&&e.code==='quota_exceeded'){RT.writeErr='The class record is full. Ask your teacher to remove old results.';renderLedger()}
    else if(e&&e.code==='unavailable'){setTimeout(()=>queueSync(),4000)}
  }
  syncing=false;if(syncAgain){syncAgain=false;doSync()}
}
function applyTeacherMarks(){
  if(!studentLocked()||!RT.remote||!RT.remote.tests)return false;let changed=false;
  for(const id in RT.remote.tests){const t=TESTS.find(x=>x.id===id);if(!t)continue;const tm=recTM(RT.remote.tests[id]);if(!tm)continue;
    const st=ts(id);const s=tm.s||{};if(JSON.stringify(st.s||{})!==JSON.stringify(s)){st.s=Object.assign({},s);changed=true}
    if(isF(t)){const W=fw(t),wm=tm.w==null?null:tm.w;if(W.mark!==wm){W.mark=wm;changed=true}}}
  return changed;
}
function subscribeMine(){try{RT.db.doc('results/'+RT.uid).onSnapshot(s=>{RT.remote=s.exists?JSON.parse(JSON.stringify(s.data()||{})):null;if(s.exists)docExists[RT.uid]=true;
  if(applyTeacherMarks()){_save();renderAll()}},e=>{})}catch(e){}}
function subscribeAll(){try{RT.db.collection('results').onSnapshot(s=>{RT.all=s.docs.map(d=>Object.assign({_id:d.id},JSON.parse(JSON.stringify(d.data()||{}))));
  if(state.view==='teacher'){renderTeacher(true);renderTeacherLedger()}else{const c=$('#vcount');if(c)c.textContent=RT.all.length?RT.all.length+' student'+(RT.all.length===1?'':'s'):'class record'}},e=>{})}catch(e){}}
async function initRuntime(){
  if(!window.claude||typeof window.claude.use!=='function'){RT.ready=true;RT.sync='local';return}
  let user=null,db=null,dl=null;
  try{[user,db,dl]=await Promise.all([claude.use('user'),claude.use('db'),claude.use('downloads')])}catch(e){}
  RT.user=user;RT.db=db;RT.dl=dl;
  if(user){try{RT.owner=await user.isOwner();RT.uid=await user.id();RT.canWrite=await user.can('data.write')}catch(e){}}
  if(RT.owner&&db){RT.sync='owner';subscribeAll()}
  else if(db&&user&&RT.uid&&RT.canWrite!==false){RT.sync='live';subscribeMine()}
  else if(user){RT.sync='code'}
  else RT.sync='local';
  if(!RT.owner&&state.view==='teacher')state.view='tests';
  RT.ready=true;renderAll();
}

/* ---------- teacher dashboard ---------- */
const TV={test:'',cls:'',q:'',sel:null,msg:''};
function rows(){
  const out=[];
  RT.all.forEach(d=>{const tests=d.tests||{};Object.keys(tests).forEach(id=>{const t=TESTS.find(x=>x.id===id);const r=tests[id];if(!t||!r)return;
    let sc;try{sc=recScore(t,r)}catch(e){return}
    out.push({doc:d._id,id,t,r,d,sc,name:d.name||'(no name)',cls:d.cls||'',upd:r.upd||d.updated||'',src:d.src||''})})});
  return out.sort((a,b)=>String(b.upd).localeCompare(String(a.upd)));
}
function fmtTime(s){if(!s)return '';try{const d=new Date(s);return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}catch(e){return s}}
