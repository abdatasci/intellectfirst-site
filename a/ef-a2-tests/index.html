:root[data-theme="dark"]{
  --navy:#0B1731; --navy2:#22386B; --ice:#18284A; --ice2:#243A66;
  --gold:#D2AE52; --gold2:#5E4C1E; --paper:#13213F; --bg:#0D1830;
  --ink:#E6ECF6; --muted:#A3B0C8; --line:#2A3C63;
  --ok:#6FD39F; --okbg:#133A2A; --no:#F08A80; --nobg:#40191A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}

/* masthead */
.mast{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.mast-in{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.mast svg{width:44px;height:52px;flex:none}
.mast .school{font-family:var(--serif);font-size:1.25rem;letter-spacing:.01em}
.mast .sub{color:#C9D6EA;font-size:.95rem}
.mast .grow{flex:1}
.mast select{background:transparent;border:1px solid #3A5285;border-radius:6px;padding:6px 8px;color:#fff}
.mast select option{color:#000}

/* layout */
.wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:24px;padding:22px 20px 60px}
nav.tests h2{font-size:1rem;color:var(--muted);font-family:var(--sans);font-weight:700;margin:4px 0 8px}
nav.tests ul{list-style:none;margin:0 0 18px;padding:0}
nav.tests li button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 10px;border-radius:0 6px 6px 0;display:flex;justify-content:space-between;gap:8px}
nav.tests li button:hover{background:var(--ice)}
nav.tests li button[aria-current="true"]{border-left-color:var(--gold);background:var(--paper);font-weight:700}
nav.tests li button .mini{color:var(--muted);font-size:.85rem;font-weight:400}
nav.tests .soon{color:var(--muted);font-size:.92rem;padding:5px 13px}
.mobile-pick{display:none}

main{min-width:0}
.head{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.head h1{font-size:2rem;color:var(--ink)}
.head .focus{color:var(--muted);margin:4px 0 14px}
.who{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.who label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.who input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:180px}
.mode{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.mode button{border:0;background:var(--paper);padding:8px 14px;font-size:.92rem}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}
.modehint{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:0}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 12px 9px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs .badge{font-weight:400;font-size:.82rem;margin-left:5px;color:var(--muted)}

.sec h2{font-size:1.5rem;margin-bottom:4px}
.part{font-family:var(--serif);font-size:1.08rem;margin:26px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.part:first-of-type{border-top:0;padding-top:0;margin-top:10px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:32px 1fr;gap:4px 8px}
.q .n{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:1.05rem;padding-top:1px}
.q .stem{margin-bottom:8px}
.q .spk{display:inline-block;font-weight:700;width:1.4em;color:var(--muted)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--muted);margin:0 3px;line-height:1.1}
.blank.filled{border-bottom-color:var(--gold);font-weight:700;padding:0 3px;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 12px;display:flex;gap:8px;align-items:baseline;text-align:left;min-height:40px}
.opt:hover:not(:disabled){border-color:var(--navy2)}
.opt .l{font-weight:700;color:var(--muted);font-size:.85rem}
.opt.sel{border-color:var(--navy2);background:var(--ice)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg);text-decoration:line-through;text-decoration-thickness:1px}
.opt.key{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt b.snd{color:var(--gold);font-weight:700}
.opt u.str{text-decoration:underline 2px;text-underline-offset:3px;font-weight:700}
.q .verdict{grid-column:2;font-size:.88rem;margin-top:6px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}

.reading{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.text{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 22px;font-family:var(--serif);line-height:1.65;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.text h3{font-size:1.25rem;margin-bottom:10px}
.text p{margin:0 0 12px}

.player{background:var(--navy);color:#fff;border-radius:10px;padding:16px 18px;margin:12px 0 18px}
.player .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.player button{border:1px solid #4A6399;background:#1C3161;color:#fff;border-radius:6px;padding:8px 14px;font-weight:700}
.player button.primary{background:var(--gold);border-color:var(--gold);color:#1a1405}
.player button:disabled{opacity:.45;cursor:not-allowed}
.player label{font-size:.85rem;color:#C9D6EA;display:flex;gap:6px;align-items:center}
.player select{background:#0B1731;color:#fff;border:1px solid #4A6399;border-radius:6px;padding:5px 6px;max-width:220px}
.player .status{font-size:.9rem;color:#C9D6EA;margin-top:10px}
.player .plays{margin-left:auto;font-size:.9rem}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;font-size:.88rem}
.script{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:16px}
.script p{margin:0 0 6px}
.script p.now{background:var(--gold2);border-radius:4px}
.script b{font-family:var(--serif)}

.bands{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:.92rem;margin:10px 0 18px}
.bands table{border-collapse:collapse;width:100%}
.bands td{padding:3px 8px 3px 0;vertical-align:top}
.bands td:first-child{font-weight:700;white-space:nowrap;color:var(--gold)}
.task{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.task h3{font-size:1.15rem}
.task .meta{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.task ul{margin:0 0 12px;padding-left:1.2em}
.task li{margin-bottom:4px}
.task .card{border-left:3px solid var(--gold);padding:6px 12px;background:var(--ice);border-radius:0 6px 6px 0;margin-bottom:10px;font-family:var(--serif)}
.timer{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.timer .clock{font-family:var(--serif);font-size:1.4rem;min-width:3.2em}
.timer button,.ghost{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px}
.rate{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rate .lab{font-size:.88rem;color:var(--muted);margin-right:4px}
.rate button{width:36px;height:36px;border:1.5px solid var(--line);background:var(--bg);border-radius:6px;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

.pager{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.pager button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;font-weight:700}

/* ledger */
aside.ledger{position:sticky;top:14px;align-self:start}
.card-l{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px}
.card-l .t{font-family:var(--serif);font-size:1.1rem}
.card-l .st{color:var(--muted);font-size:.88rem;margin-bottom:12px;min-height:1.3em}
.big{display:flex;align-items:baseline;gap:6px;font-family:var(--serif);margin:4px 0 2px}
.big .num{font-size:3.4rem;line-height:1;color:var(--ink)}
.big .of{font-size:1.2rem;color:var(--muted)}
.pct{font-size:.95rem;color:var(--muted);margin-bottom:14px}
.pct b{color:var(--ink)}
.rowl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.93rem;margin-bottom:9px}
.rowl .bar{grid-column:1/3;height:5px;background:var(--ice);border-radius:3px;overflow:hidden}
.rowl .bar i{display:block;height:100%;background:var(--navy2);transition:width .25s}
.rowl .v{font-variant-numeric:tabular-nums}
.ledger .actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ledger .actions button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:700}
.ledger .actions button.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.src{font-size:.78rem;color:var(--muted);margin-top:14px;line-height:1.4}
.mobile-total{display:none}

@media (max-width:1100px){
  .wrap{grid-template-columns:200px minmax(0,1fr)}
  aside.ledger{grid-column:1/3;position:static}
}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{grid-template-columns:minmax(0,1fr);padding:14px 12px 110px;gap:14px}
  nav.tests{display:none}
  .mobile-pick{display:block;margin-bottom:12px}
  .mobile-pick select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
  aside.ledger{grid-column:auto}
  .reading{grid-template-columns:minmax(0,1fr)}
  .text{position:static;max-height:none}
  .mode{margin-left:0}
  .head h1{font-size:1.6rem}
  .mobile-total{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;border-top:3px solid var(--gold);z-index:10}
  .mobile-total b{font-family:var(--serif);font-size:1.3rem}
  .mobile-total button{background:none;border:1px solid #4A6399;color:#fff;border-radius:6px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mast img.crest{width:47px;height:60px;flex:none;display:block}
/*CLASS-START*//* v2 additions */
.tview{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.tview button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tview button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tview .mini{font-weight:400;font-size:.85rem;opacity:.85}
nav.tests li.pair{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 4px 13px}
nav.tests li.pair .pname{font-size:.97rem}
nav.tests li.pair .pbtns{display:flex;gap:4px}
nav.tests li.pair .pbtns button{width:auto;min-width:38px;justify-content:center;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--paper);font-weight:700}
nav.tests li.pair .pbtns button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.syncnote{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:2px 0 0;padding:6px 10px;border-left:3px solid var(--gold);background:var(--ice);border-radius:0 6px 6px 0}
.syncnote.ok{border-left-color:var(--ok)}
.hint{color:var(--muted);font-size:.92em}
input.gap.wide{min-width:min(100%,24em)}
.task.prompt p{margin:0 0 8px}
.task.prompt p:last-child{margin:0}
.muted{color:var(--muted);font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:8px}
.filters label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:160px}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.rtable{width:100%;border-collapse:collapse;font-size:.93rem}
.rtable th{text-align:left;font-weight:700;color:var(--muted);font-size:.82rem;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
.rtable td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.rtable td.num,.rtable th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtable tbody tr{cursor:pointer}
.rtable tbody tr:hover{background:var(--ice)}
.rtable tbody tr.on{background:var(--ice);box-shadow:inset 3px 0 0 var(--gold)}
.rtable td.empty{color:var(--muted);text-align:center;padding:22px;cursor:default}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-left:6px;color:var(--muted);vertical-align:middle}
.tag.warn{border-color:var(--gold);color:var(--gold)}
.detail{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dhead h2{font-size:1.4rem}
.secscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 4px}
.secscores div{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;font-size:.9rem}
.wrview{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.6;max-height:320px;overflow:auto;margin-bottom:6px}
details.ans{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
details.ans summary{padding:10px 12px;cursor:pointer}
.atable{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--paper)}
.atable th{text-align:left;color:var(--muted);font-size:.78rem;padding:6px 10px;border-bottom:1px solid var(--line)}
.atable td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.atable tr.no td:nth-child(3){color:var(--no)}
.atable tr.ok td:nth-child(4){color:var(--ok)}
.codebox{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.codebox p{margin:0 0 8px;font-size:.9rem}
.codebox textarea,textarea.imp{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);word-break:break-all}
.codebox button{margin-top:8px}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-weight:700}
.go{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:8px;padding:9px 14px;font-weight:700}
.go:disabled{opacity:.6;cursor:default}
@media print{.mast,nav.tests,.mobile-pick,.who,.tabs,.pager,.mobile-total,.ledger .actions,.player,.linkbtn{display:none!important}.wrap{display:block}aside.ledger{position:static;margin-top:20px}body{background:#fff}}

.vswitch{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.vswitch button{flex:1;border:0;background:transparent;padding:11px 12px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.vswitch button+button{border-left:1px solid var(--line)}
.vswitch button[aria-pressed="true"]{background:var(--navy);color:#fff}
.vswitch .vsub{font-weight:400;font-size:.8rem;opacity:.8}
.share ol.steps{margin:6px 0 8px;padding-left:20px}.share ol.steps li{margin:4px 0}
@media (min-width:901px){nav.tests .tview{display:none}}
@media print{.vswitch{display:none!important}}
/*CLASS-END*/

<script>
/* IF Academy – "Send result to teacher" (result code IFR1) */
(function(){
"use strict";
var DASH="/me/";
function b64url(str){var bytes=new TextEncoder().encode(str),bin="";for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function newId(){var a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789",s="";var r=new Uint8Array(14);(window.crypto||{}).getRandomValues?crypto.getRandomValues(r):r.forEach(function(_,i){r[i]=Math.random()*256});for(var i=0;i<14;i++)s+=a[r[i]%a.length];return s}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var CSS=".ifr{margin-top:18px;border:2px solid var(--gold,#C29B40);border-radius:6px;padding:14px 16px;background:var(--gold-soft,#F3E7C9)}.ifr h3{margin:0 0 4px;font-size:20px}.ifr p{margin:0 0 10px;font-size:15px}.ifr textarea{width:100%;min-height:118px;font:inherit;font-size:14px;border:1px solid var(--line,#CBD6E4);border-radius:4px;padding:8px 10px;background:var(--paper,#fff);color:var(--ink,#15213A)}.ifr .ifr-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}.ifr button{border:0;border-radius:4px;padding:9px 16px;font:inherit;font-weight:700;background:var(--navy,#0F1E3D);color:#fff;cursor:pointer}.ifr button.l{background:transparent;color:var(--ink,#15213A);border:1px solid var(--navy2,#1B2F5A);font-weight:400}.ifr .ifr-m{font-size:14px}.ifr .ifr-w{color:var(--bad,#B23A3A);font-size:14px;margin-bottom:8px}@media print{.ifr{display:none}}";
function ensureCss(){if(document.getElementById("ifr-css"))return;var st=document.createElement("style");st.id="ifr-css";st.textContent=CSS;document.head.appendChild(st)}
/* p = {id, c, lv, t, v, n, cl, s:[[label,score|null,max]...], w:[texts]} */
function message(p){
  var tot=0,max=0,pend=[];p.s.forEach(function(x){max+=x[2];tot+=x[1]||0;if(x[1]==null)pend.push(x[0])});
  var o={id:p.id,c:p.c,lv:p.lv,t:p.t,v:p.v||"",n:p.n||"",cl:p.cl||"",d:new Date().toISOString(),s:p.s,w:(p.w||[]).filter(function(x){return x&&String(x).trim()})};
  var code="IFR1."+b64url(JSON.stringify(o));
  return "IF Academy test result\nStudent: "+(p.n||"(no name)")+(p.cl?" · "+p.cl:"")+"\nTest: "+p.lv+" · "+p.t+(p.v?" "+p.v:"")+"\nScore: "+tot+" / "+max+(pend.length?" ("+pend.join(" and ")+" not marked yet)":"")+"\n"+code+(p.x?"\n"+p.x:"");
}
function box(container,p){
  ensureCss();var old=container.querySelector(".ifr");if(old)old.remove();
  var msg=message(p);var d=document.createElement("div");d.className="ifr";
  d.innerHTML="<h3>Send this result to your teacher</h3>"+(p.n?"":"<div class='ifr-w'>Write your name at the top of the test first, so your teacher knows it’s you.</div>")+
    "<p>Tap <b>Share</b> and send it on WhatsApp or Telegram, or copy the message and paste it into a chat with your teacher.</p>"+
    "<textarea readonly aria-label='Result message'>"+esc(msg)+"</textarea><div class='ifr-row'>"+(navigator.share?"<button type='button' data-a='share'>Share</button>":"")+"<button type='button' class='"+(navigator.share?"l":"")+"' data-a='copy'>Copy message</button><span class='ifr-m' aria-live='polite'></span></div>";
  container.appendChild(d);

    if(b.dataset.a==="share"){navigator.share({title:"IF Academy test result",text:msg}).catch(function(){})}
    else{var ok=function(){m.textContent="Copied. Paste it into a chat with your teacher."};
      var fb=function(){ta.focus();ta.select();try{document.execCommand("copy");ok()}catch(e){m.textContent="Select the message and copy it."}};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(msg).then(ok,fb);else fb()}
  }});
}
window.IFR={box:box,newId:newId,message:message,DASH:DASH};
})();

</script>

TESTS.push({"id": "entry", "kind": "entry", "title": "Entry Test", "focus": "A placement check before starting English File Pre-intermediate: present and past tenses, can, comparatives and superlatives, going to, present perfect, quantities, and everyday vocabulary.", "rw": 1, "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ABCABBABBAABCBCCAACAACCBC", "q": [["Where _____ your parents live?", "do", "does", "are"], ["My brother _____ like spicy food.", "isn't", "doesn't", "don't"], ["Look! Those people _____ outside the bank.", "wait", "waits", "are waiting"], ["I _____ to the cinema last weekend.", "went", "was go", "go"], ["_____ you see the match yesterday?", "Were", "Did", "Have"], ["We _____ TV when the lights went out.", "watched", "were watching", "are watching"], ["There aren't _____ eggs in the fridge.", "any", "no", "some"], ["How _____ sugar do you take?", "lot", "much", "many"], ["This test is _____ than the last one.", "easyer", "easier", "more easy"], ["It's the _____ city I've ever visited.", "most beautiful", "more beautiful", "beautifulest"], ["I'm _____ study medicine at university.", "going to", "go to", "going"], ["_____ you ever been to Turkey?", "Did", "Have", "Are"], ["She's lived here _____ 2018.", "for", "from", "since"], ["I can't come. I _____ my homework yet.", "didn't finish", "haven't finished", "don't finish"], ["He's _____ tall to be a jockey.", "very", "enough", "too"], ["You _____ wear a seat belt in a car. It's the law.", "can", "might", "must"], ["I think it _____ rain tomorrow.", "will", "is", "does"], ["If it's sunny, we _____ to the beach.", "'ll go", "go", "went"], ["Would you like _____ to the party?", "come", "coming", "to come"], ["I enjoy _____ with my friends.", "chatting", "chat", "to chat"], ["This is the woman _____ helped me.", "who", "which", "where"], ["She asked me _____ I was.", "how old was", "old how", "how old"], ["The phone _____ by Alexander Graham Bell.", "invented", "is invented", "was invented"], ["I _____ play football every day when I was a child.", "was used to", "used to", "use to"], ["I've already _____ lunch.", "have", "having", "had"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CAABAABACBCBABCCACBBABCAC", "q": [["I always _____ my homework before dinner.", "take", "make", "do"], ["Can you _____ me a favour?", "do", "make", "give"], ["She's very _____. She talks to everybody.", "friendly", "quiet", "lazy"], ["He's got short _____ hair.", "thin", "curly", "tall"], ["I need to _____ a train to Astana.", "catch", "get on", "lose"], ["It's cold. Put _____ your coat.", "on", "off", "in"], ["We stayed in a lovely hotel _____ the beach.", "in", "on", "at"], ["Can I _____ your phone? Mine is dead.", "borrow", "rent", "lend"], ["She _____ her exam. She was very happy.", "failed", "took", "passed"], ["I'm looking _____ my glasses. Have you seen them?", "after", "for", "at"], ["He works very hard. He's a _____ person.", "lazy", "relaxed", "hard-working"], ["I _____ a lot of money on clothes.", "waste of", "spend", "pay"], ["Turn _____ the TV. I'm trying to sleep.", "off", "up", "on"], ["They got _____ in 2015 and now have two children.", "marriage", "married", "marry"], ["My mum is a great cook. Her soup is _____!", "ugly", "disgusting", "delicious"], ["My car broke _____ on the motorway.", "up", "out", "down"], ["I'm _____ in history. I read a lot about it.", "interested", "interesting", "interest"], ["Can you _____ me how to get to the station?", "speak", "say", "tell"], ["She's _____ of spiders.", "frightening", "afraid", "scary"], ["We had a _____ time at the party.", "big", "great", "high"], ["I don't _____ much free time.", "have", "do", "make"], ["The flight was _____ because of the snow.", "lost", "cancelled", "missed"], ["He's the _____ of a big company.", "employee", "worker", "manager"], ["I'm going to _____ a bath.", "have", "do", "make"], ["Let's _____ a taxi. It's raining.", "make", "do", "take"]]}, "r": {"title": "A new start in a new city", "k": "BABAACBACC", "text": ["When Dana Seitkali was twenty-four, she lived in Kostanay and worked as a receptionist in a hotel. She enjoyed meeting people, but she wanted something different. 'I loved cooking,' she says. 'Every weekend I made cakes for my friends and family. One day my friend said, \"Why don't you open a café?\" I laughed, but I couldn't stop thinking about it.'", "Dana saved money for three years. She also did an online course in business and spent her holidays working in a café in Almaty to learn how it worked. In 2021 she moved to Astana, where her sister lived, and opened a small café near the university.", "The first months were very hard. 'I worked fourteen hours a day and I didn't have any free time,' she says. 'Some days only five or six customers came in. I almost gave up.' But slowly students started telling their friends about her cakes. Now the café is busy from morning till night and she has six people working for her.", "'I've never been happier,' says Dana. 'My advice? If you have a dream, start planning it today. It won't be easy, but it will be worth it.' Next year she is going to open a second café in Almaty."], "q": [["What was Dana's job in Kostanay?", "waitress", "receptionist", "cook"], ["Who gave her the idea of opening a café?", "a friend", "a customer", "her sister"], ["How long did she save money?", "one year", "three years", "fourteen months"], ["Why did she work in a café in Almaty?", "to learn how a café works", "because her sister lived there", "to earn more money"], ["Why did she choose Astana?", "Her sister lived there.", "It's near Kostanay.", "She studied at the university there."], ["Where is her café?", "in the city centre", "in a hotel", "near the university"], ["What was difficult at the beginning?", "She couldn't find workers.", "There weren't many customers.", "The rent was expensive."], ["How did the café become popular?", "Students told their friends.", "It was in a newspaper.", "She advertised online."], ["How many people work for her now?", "fourteen", "five", "six"], ["What is she going to do next year?", "move back to Kostanay", "do a business course", "open a café in Almaty"]]}, "l": {"setting": "You will hear Ben and his friend Aliya talking about a weekend away.", "k": "BAACABACBC", "script": [["Aliya", "Hi Ben. You look tired. Did you have a good weekend?"], ["Ben", "It was interesting! I went camping in the mountains with my brother."], ["Aliya", "Camping? In October? Wasn't it cold?"], ["Ben", "Very cold. It was minus two on Saturday night. We weren't really ready for it."], ["Aliya", "What happened?"], ["Ben", "Well, on Saturday we walked for about five hours. The views were amazing. But when we were putting up the tent, it started to snow."], ["Aliya", "Oh no!"], ["Ben", "And then my brother realised he'd forgotten the gas for the cooker. So we couldn't make any hot food."], ["Aliya", "So what did you eat?"], ["Ben", "Bread, cheese and chocolate. And cold water! We didn't sleep very well."], ["Aliya", "Did you come home early?"], ["Ben", "Yes. We were supposed to stay until Monday, but we left on Sunday morning. We went to a café in the first village and had the biggest breakfast of my life."], ["Aliya", "Would you go camping again?"], ["Ben", "Definitely – but in July next time!"]], "q": [["Who did Ben go camping with?", "his friends", "his brother", "Aliya"], ["What was the temperature on Saturday night?", "–2°", "2°", "–12°"], ["How long did they walk on Saturday?", "about five hours", "about two hours", "all day"], ["What happened when they were putting up the tent?", "They lost the tent.", "It started to rain.", "It started to snow."], ["What did they forget?", "the gas for the cooker", "warm clothes", "the food"], ["What did they eat on Saturday evening?", "nothing", "bread, cheese and chocolate", "hot soup"], ["When did they plan to come home?", "on Monday", "on Saturday", "on Sunday"], ["Where did they go on Sunday morning?", "to a shop", "to the mountains", "to a café"], ["What did Ben think of the breakfast?", "It was cold.", "It was the biggest of his life.", "It was expensive."], ["When does Ben want to go camping again?", "in October", "never", "in July"]]}, "s": {"focus": "present and past tenses, future plans, present perfect, everyday topics.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Tell me about yourself and your family.", "What did you do last weekend?", "What are you going to do this summer?", "Have you studied English before? Where?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about a place you visited and liked.", "prompts": ["where and when you went", "who you went with", "what you did there", "why you liked it"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Why is English important for you?", "What's the best way to learn new words?", "What do you find difficult in English?"]}]}});
TESTS.push({"id": "q1", "kind": "quick", "title": "Quick Test 1", "focus": "File 1: word order in questions, present simple, present continuous, common verb phrases, describing people, clothes, prepositions of place.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "AACCBBACBA", "q": [["Where _____ last night?", "did you go", "you went", "went you"], ["_____ do you go to the gym? Three times a week.", "How often", "How long", "How much"], ["What kind of music _____?", "like you", "you like", "do you like"], ["My sister _____ in a bank.", "work", "is work", "works"], ["He _____ get up early at the weekend.", "isn't", "doesn't", "don't"], ["Why _____ that coat? It's really hot today.", "do you wear", "are you wearing", "you are wearing"], ["I _____ a book about Japan at the moment.", "'m reading", "read", "reads"], ["She usually _____ jeans, but today she's wearing a dress.", "is wearing", "wear", "wears"], ["_____ your brother live near here?", "Is", "Does", "Do"], ["We _____ to music in the car every day.", "listen", "'re listening", "listens"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BCAABCBCAA", "q": [["She's _____. She never says what she's thinking.", "friendly", "shy", "talkative"], ["He isn't fat, he's _____.", "short", "tall", "slim"], ["My dad has got a _____. He shaves it every summer.", "beard", "fringe", "wavy"], ["I _____ a lot of time on social media.", "spend", "pass", "do"], ["She's very _____ – she always wants to win.", "generous", "competitive", "quiet"], ["I can't find my bag. Is it _____ the table?", "between", "opposite to", "under"], ["Can you hang your jacket _____ the door?", "at", "on", "in"], ["He's wearing a smart _____ and tie.", "sweater", "trainer", "suit"], ["Take off your _____. It's hot in here.", "sweater", "earrings", "tights"], ["She wears _____ around her neck.", "a necklace", "a ring", "a bracelet"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "CAABB", "q": [["c*u*rly", "sh*ir*t", "sh*o*rt"], ["w*oo*l", "s*ui*t", "b*oo*ts"], ["*y*ellow", "*j*acket", "*j*eans"], ["gene_rous_", "_ge_nerous", "ge_ne_rous"], ["_com_petitive", "com_pe_titive", "compe_ti_tive"]]}, "r": {"title": "The best-dressed teacher in town", "k": "BAACB", "text": ["Every morning, students at School No. 12 in Kostanay wait to see what Mr Nurlan Bekov is wearing. The 45-year-old geography teacher is famous for his colourful suits and his collection of more than two hundred ties.", "'I started wearing bright clothes about ten years ago,' he says. 'I noticed students were more interested in the lesson when I was wearing something fun.' Today he's wearing a green suit, a yellow shirt and a tie with maps on it.", "His students love it. 'He's very funny and kind,' says Madina, 15. 'And he always explains things clearly.' His wife is less excited. 'Our wardrobe is full,' she laughs. 'I have one shelf for my clothes!'"], "q": [["How old is Mr Bekov?", "12", "45", "15"], ["What does he collect?", "ties", "shirts", "maps"], ["Why did he start wearing bright clothes?", "Students were more interested.", "He wanted to be on TV.", "His wife bought them."], ["What is he wearing today?", "a yellow suit", "a suit with maps", "a green suit"], ["What is his wife's problem?", "She doesn't like his ties.", "There isn't space for her clothes.", "She has to buy his clothes."]]}, "l": {"setting": "You will hear Lena describing a person in a police station.", "k": "AABCB", "script": [["Officer", "So, can you describe the man who took your bag?"], ["Lena", "Yes. He was quite tall – about one metre eighty – and slim."], ["Officer", "How old was he?"], ["Lena", "I think he was about thirty."], ["Officer", "And his hair?"], ["Lena", "Short and dark, and he had a beard. Not a very long one."], ["Officer", "What was he wearing?"], ["Lena", "Jeans and a grey hoodie. And white trainers."], ["Officer", "Where did it happen?"], ["Lena", "In the café opposite the station. My bag was on the chair next to me."]], "q": [["How tall was the man?", "about 1.80 m", "about 1.60 m", "about 1.90 m"], ["How old was he?", "about 30", "about 40", "about 20"], ["What did he have on his face?", "glasses", "a short beard", "a long beard"], ["What colour was his hoodie?", "black", "white", "grey"], ["Where was the bag?", "on the table", "on the chair next to Lena", "under the table"]]}, "s": {"focus": "question word order, present simple and continuous, describing people, clothes.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What do you usually wear at the weekend?", "How often do you buy new clothes?", "Who in your family do you look like?", "What are you reading or watching at the moment?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Describe a friend: what does he / she look like and what is he / she like?", "Ask the teacher three questions about his / her free time."]}]}});
TESTS.push({"id": "f1", "kind": "file", "title": "File Test 1", "focus": "File 1: word order in questions, present simple, present continuous, common verb phrases, describing people (appearance and personality), clothes, prepositions of place.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CAABCCABBCBABBABCAAC", "q": [["_____ to music when you study?", "Listen you", "You listen", "Do you listen"], ["What time _____ every day?", "do you get up", "you get up", "get up you"], ["Who _____ your best friend at school?", "was", "did", "were"], ["How long _____ to get to work?", "takes it", "does it take", "it takes"], ["_____ any brothers or sisters?", "You have", "Have you do", "Do you have"], ["What _____ do in your free time?", "like you to", "you like to", "do you like to"], ["My grandfather _____ every morning.", "runs", "is run", "run"], ["_____ she speak Spanish?", "Do", "Does", "Is"], ["They _____ live in the city centre.", "doesn't", "don't", "aren't"], ["He usually _____ his bike to work.", "'s riding", "ride", "rides"], ["I _____ a tracksuit because I'm going to the gym.", "wears", "'m wearing", "wear"], ["What _____ at the moment? A new series on Netflix.", "are you watching", "you are watching", "do you watch"], ["My parents _____ in Turkey this week.", "stay", "'re staying", "stays"], ["She _____ meat. She's a vegetarian.", "don't eat", "doesn't eat", "isn't eating"], ["Listen! Somebody _____ the piano upstairs.", "'s playing", "plays", "play"], ["I _____ what you mean. Can you explain?", "'m not understanding", "don't understand", "not understand"], ["This soup _____ really good.", "taste", "is tasting", "tastes"], ["_____ your brother still at university?", "Is", "Has", "Does"], ["We _____ English twice a week.", "have", "'re having", "has"], ["_____ do you usually spend on clothes?", "How often", "How many", "How much"]]}, "v": {"parts": [[0, "Describing people: choose the correct word."], [8, "Clothes: choose the correct word."], [14, "Prepositions of place: choose the correct word."]], "k": "ACBCBACBABCBABCACABA", "q": [["She has long, _____ hair.", "straight", "tall", "slim"], ["He's not very tall. He's _____ height.", "normal", "middle", "medium"], ["My uncle has no hair. He's _____.", "curly", "bald", "blond"], ["She's very _____. She always helps other people.", "mean", "lazy", "kind"], ["He's so _____ – he never does anything at home.", "hard-working", "lazy", "shy"], ["She's very _____. She never gets angry or stressed.", "calm", "nervous", "bossy"], ["He's _____ – he always tells everyone what to do.", "funny", "quiet", "bossy"], ["My sister is _____. She always tells the truth.", "stubborn", "honest", "selfish"], ["I always wear a _____ when I go swimming in the sea.", "swimsuit", "suit", "tracksuit"], ["In winter I wear a woolly _____ on my head.", "glove", "hat", "scarf"], ["He's wearing a _____ under his jacket.", "belt", "coat", "shirt"], ["These _____ are too big. I need a smaller size.", "trouser", "trousers", "pair trousers"], ["Put _____ your coat. It's cold outside.", "on", "off", "up"], ["Can I _____ on these shoes, please?", "test", "try", "put"], ["The café is _____ the bank and the pharmacy.", "opposite", "next", "between"], ["My phone is _____ my bag.", "in", "at", "on"], ["There's a picture _____ the sofa.", "on top", "between", "above"], ["The bus stop is _____ the school, across the road.", "opposite", "next", "between"], ["The cat is sleeping _____ my bed.", "below of", "under", "between"], ["The car park is _____ the supermarket.", "behind", "in front", "between"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "CABBABACAC", "q": [["c*o*rd", "sh*or*ts", "sh*ir*t"], ["*w*ho", "*w*ear", "*w*hite"], ["w*ear*", "b*ear*d", "ch*air*"], ["s*ui*t", "b*oo*k", "sh*oe*s"], ["*ch*eap", "*sh*ort", "*sh*y"], ["ge_ne_rous", "_ge_nerous", "gene_rous_"], ["_car_digan", "cardi_gan_", "car_di_gan"], ["relia_ble_", "_re_liable", "re_li_able"], ["_cha_racter", "charac_ter_", "cha_rac_ter"], ["in_te_resting", "inte_res_ting", "_in_teresting"]]}, "r": {"title": "What do your clothes say about you?", "k": "BABCA", "text": ["A new study says that people make decisions about you in the first seven seconds after they meet you – and your clothes are one of the most important things they notice.", "Psychologist Dr Karen Pine asked 300 people to look at photos of the same man. In some photos he was wearing a smart suit made for him; in others he was wearing a suit he bought in a supermarket. People thought the man in the expensive suit was more confident and successful – even though they only saw the photos for three seconds.", "Colours are important too. 'Dark blue says you are calm and honest,' says Dr Pine. 'Red says you are strong, but some people think it's aggressive. If you have a job interview, wear blue.'", "So should we all buy expensive clothes? Not really. 'Clothes that fit well are more important than clothes that cost a lot,' Dr Pine says. 'And smile! A smile is the best thing you can wear.'"], "q": [["How quickly do people decide what they think of you?", "in a few minutes", "in about seven seconds", "in about three seconds"], ["What did the people in the study look at?", "photos", "videos", "real people"], ["What did people think of the man in the expensive suit?", "He was friendlier.", "He was more confident.", "He was more honest."], ["What colour does Dr Pine recommend for job interviews?", "red", "black", "dark blue"], ["What is more important than expensive clothes?", "clothes that fit well", "a good haircut", "bright colours"]]}, "l": {"setting": "You will hear Marat interviewing his new flatmate, Jess.", "k": "AABCB", "script": [["Marat", "So, Jess, where are you from?"], ["Jess", "I'm from Manchester, in England. I'm here for a year to teach English."], ["Marat", "Great. What do you do in your free time?"], ["Jess", "I love running. I usually run every morning before work, about five kilometres."], ["Marat", "Every morning? Wow. Do you cook?"], ["Jess", "Not very well, I'm afraid! But I'm learning. At the moment I'm doing an online course in Kazakh cooking."], ["Marat", "Really? Are you a tidy person?"], ["Jess", "Quite tidy, yes. But I'm not very quiet – I sing all the time!"], ["Marat", "That's OK. I play the guitar, so I'm not quiet either."], ["Jess", "Perfect. Maybe we can start a band!"]], "q": [["Why is Jess in Kazakhstan?", "to teach English", "to study", "for a holiday"], ["When does she usually run?", "every morning", "at weekends", "every evening"], ["How far does she run?", "about 10 km", "about 5 km", "about 15 km"], ["What is she learning online?", "the Kazakh language", "the guitar", "Kazakh cooking"], ["What does Jess say about herself?", "She's untidy.", "She sings a lot.", "She's very quiet."]]}, "s": {"focus": "question word order, present simple and present continuous, describing people, clothes.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Where do you live and who do you live with?", "What do you usually do on weekday evenings?", "What are you doing these days to improve your English?", "What do you usually wear to work or school?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Describe a person you admire.", "prompts": ["who he / she is", "what he / she looks like", "what he / she is like as a person", "why you admire him / her"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Are first impressions important? Why?", "Do you think people spend too much money on clothes?", "What personality is good for a teacher, a doctor, or a manager?"]}]}});
TESTS.push({"id": "q2", "kind": "quick", "title": "Quick Test 2", "focus": "File 2: past simple (regular and irregular), past continuous, time sequencers and connectors (so, because, but, although), holidays, prepositions of time and place, verb phrases.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BAABCBACAC", "q": [["We _____ a great time in Spain last year.", "haved", "had", "have"], ["_____ you enjoy the concert?", "Did", "Do", "Were"], ["I _____ my wallet on the bus.", "left", "leaved", "leave"], ["I _____ a shower when you called.", "had", "was having", "were having"], ["What _____ you doing at eight o'clock last night?", "did", "was", "were"], ["While they _____ dinner, the lights went out.", "have", "were having", "had"], ["_____ breakfast, we went to the beach.", "After", "Then", "When"], ["It was raining, _____ we stayed at home.", "but", "because", "so"], ["_____ I was tired, I went to the party.", "Although", "So", "Because"], ["She didn't come _____ she was ill.", "although", "so", "because"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CABABACACB", "q": [["We _____ a car and drove around the island.", "lent", "took", "hired"], ["I _____ sunbathing on the beach all day.", "spent", "lost", "passed"], ["It was a really _____ holiday. We loved it.", "awful", "amazing", "boring"], ["We went _____ holiday to Turkey.", "on", "in", "to"], ["I was born _____ 1999.", "on", "in", "at"], ["The party is _____ Saturday night.", "on", "at", "in"], ["We arrived _____ Almaty at midnight.", "at", "to", "in"], ["They arrived _____ the airport late.", "at", "to", "in"], ["The weather was _____. It rained every day.", "sunny", "wonderful", "terrible"], ["The hotel was _____. We could walk to everything.", "crowded", "central", "uncomfortable"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "BACBA", "q": [["l*ear*ned", "p*ar*ked", "w*or*ked"], ["walk*ed*", "wait*ed*", "want*ed*"], ["c*augh*t", "b*ough*t", "l*o*st"], ["sight_see_ing", "_sight_seeing", "sightsee_ing_"], ["a_ma_zing", "ama_zing_", "_a_mazing"]]}, "r": {"title": "The worst holiday ever?", "k": "CAABB", "text": ["Last summer Asel and her husband went to Italy for a week. Everything went wrong.", "First, their flight was four hours late, so they arrived at the hotel at three in the morning. Then they found that the hotel was next to a busy road, so they couldn't sleep. On the second day, while they were walking around Rome, someone stole Asel's bag with her phone and passport.", "They spent the next two days at the police station and the embassy. 'But the strange thing is, we loved the holiday,' says Asel. 'The police were very kind and we met an amazing Italian family who invited us for dinner. We're going back next year!'"], "q": [["Why did they arrive at the hotel late?", "They missed the train.", "They got lost.", "Their flight was late."], ["What was the problem with the hotel?", "It was noisy.", "It was far from Rome.", "It was dirty."], ["What were they doing when someone stole the bag?", "walking around Rome", "having dinner", "sleeping at the hotel"], ["Where did they spend two days?", "at the beach", "at the police station and embassy", "with an Italian family"], ["How does Asel feel about the holiday now?", "She was bored.", "She loved it.", "She hated it."]]}, "l": {"setting": "You will hear Tom telling Dina about an accident.", "k": "BBCAA", "script": [["Dina", "Tom! What happened to your arm?"], ["Tom", "I broke it last Saturday. I was riding my bike in the park."], ["Dina", "Did you fall off?"], ["Tom", "Yes. I was going quite fast and a dog ran in front of me. I tried to stop, but I fell."], ["Dina", "Oh no! Did anyone help you?"], ["Tom", "Yes, the dog's owner called an ambulance. She was really nice."], ["Dina", "How long do you have to wear that?"], ["Tom", "Six weeks. So no more bike rides until July!"]], "q": [["When did Tom break his arm?", "last week", "last Saturday", "last Sunday"], ["What was he doing?", "running", "riding his bike", "walking his dog"], ["Why did he fall?", "The road was wet.", "He was going too slowly.", "A dog ran in front of him."], ["Who called the ambulance?", "the dog's owner", "a doctor", "Tom"], ["How long must he wear the cast?", "six weeks", "two weeks", "six days"]]}, "s": {"focus": "past simple and past continuous, sequencers, holidays.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Where did you go on your last holiday?", "What were you doing at this time yesterday?", "What did you do last weekend?", "Have you ever had a bad holiday?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Tell the teacher about a memorable day in your life (use first, then, after that, finally)", "What makes a holiday good or bad?"]}]}});
TESTS.push({"id": "f2", "kind": "file", "title": "File Test 2", "focus": "File 2: past simple (regular and irregular verbs), past continuous, time sequencers and connectors, holidays, prepositions of time and place (at, in, on), verb phrases.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACCABACCBABAABBCABCB", "q": [["We _____ in a lovely hotel in Antalya.", "stayed", "stay", "staied"], ["They _____ the museum because it was closed.", "didn't visited", "not visited", "didn't visit"], ["I _____ some souvenirs for my family.", "buyed", "buy", "bought"], ["_____ you take a lot of photos?", "Did", "Were", "Have"], ["Where _____ you go for your honeymoon?", "were", "did", "do"], ["He _____ his arm when he was skiing.", "broke", "breaked", "broken"], ["We _____ a fantastic view from our room.", "haved", "have", "had"], ["At ten o'clock last night I _____ TV.", "watched", "am watching", "was watching"], ["It _____ when we left the house.", "rained", "was raining", "rains"], ["What _____ when the teacher came in?", "were you doing", "you were doing", "did you do"], ["I _____ my friend while I was walking to work.", "meet", "met", "was meeting"], ["They were driving home when they _____ the accident.", "saw", "see", "were seeing"], ["She _____ for the bus when it started to snow.", "was waiting", "waits", "waited"], ["_____ arriving at the hotel, we went straight to the beach.", "Before that", "After", "Then"], ["We had dinner. _____ we went for a walk.", "When", "Then", "After"], ["_____ I was at the airport, I bought a book.", "During", "Then", "While"], ["The tickets were expensive, _____ we bought them anyway.", "but", "so", "because"], ["I was hungry, _____ I made a sandwich.", "although", "so", "because"], ["_____ it was cold, we went swimming.", "So", "Because", "Although"], ["We went home early _____ the weather was terrible.", "although", "because", "so"]]}, "v": {"parts": [[0, "Holidays: choose the correct word."], [6, "Prepositions of time and place: choose the correct word."], [14, "Verb phrases: choose the correct word."]], "k": "ABCBBABCACBAABCABACC", "q": [["We _____ in a tent by the lake.", "camped", "sunbathed", "sightsaw"], ["We _____ the sights in Paris.", "looked", "saw", "watched"], ["I want to _____ a room with a sea view.", "hire", "take", "book"], ["The beach was very _____. There were people everywhere.", "empty", "crowded", "peaceful"], ["The food was _____. I didn't eat anything.", "delicious", "disgusting", "amazing"], ["We went to the old town and took a lot of _____.", "photos", "views", "pictures of"], ["I was born _____ 14th March.", "at", "on", "in"], ["We go skiing _____ February.", "on", "at", "in"], ["I'll see you _____ the weekend.", "at", "in", "on"], ["She's working _____ night this week.", "on", "in", "at"], ["I met him _____ a party.", "in", "at", "on"], ["They live _____ a small village.", "in", "on", "at"], ["We arrived _____ Istanbul at 7 a.m.", "in", "to", "at"], ["I left my keys _____ home.", "on", "at", "in"], ["I _____ an exam yesterday. It was hard.", "did make", "made", "took"], ["We _____ a good time at the party.", "had", "made", "did"], ["Did you _____ an argument with him?", "take", "have", "do"], ["I _____ a mistake. I'm sorry.", "made", "did", "had"], ["Can you _____ me a photo?", "do", "make", "send"], ["She _____ her phone in the taxi.", "lost at", "forgot at", "left"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "AABABCCABC", "q": [["br*o*ke", "s*aw*", "w*ore*"], ["want*ed*", "rain*ed*", "play*ed*"], ["m*a*de", "s*ai*d", "st*ay*ed"], ["t*ough*", "b*ough*t", "th*ough*t"], ["c*au*ght", "l*au*ghed", "t*au*ght"], ["ho_li_day", "holi_day_", "_ho_liday"], ["_a_mazing", "ama_zing_", "a_ma_zing"], ["_beau_tiful", "beauti_ful_", "beau_ti_ful"], ["_a_partment", "a_part_ment", "apart_ment_"], ["_dis_gusting", "disgus_ting_", "dis_gus_ting"]]}, "r": {"title": "The day I met my hero", "k": "BABCA", "text": ["When I was sixteen, I was crazy about tennis and my hero was the Kazakh player Elena Rybakina. I had posters of her on my bedroom wall and I watched all her matches on TV.", "In 2023 my parents gave me a fantastic birthday present: tickets for a tournament in Astana. On the second day, while we were having lunch in a café near the stadium, a tall woman with a cap walked in. At first I didn't recognise her. Then she took off her cap. It was Elena!", "I was so nervous that I couldn't speak. My dad asked her for a photo and she smiled and said yes. She also asked me if I played tennis. I told her I trained four times a week. 'Keep going,' she said. 'And enjoy it.'", "I still have the photo on my wall. Now I'm nineteen and I coach children at a tennis club. When they're tired or bored, I tell them what Elena told me."], "q": [["How old was the writer when he / she met Elena?", "twenty-three", "sixteen", "nineteen"], ["What was the birthday present?", "tickets for a tournament", "a poster", "a tennis racket"], ["Where did the writer meet Elena?", "in the stadium", "in a café", "at a tennis club"], ["What did Elena ask?", "for the writer's ticket", "for a photo", "if the writer played tennis"], ["What does the writer do now?", "coaches children", "plays professionally", "works in a café"]]}, "l": {"setting": "You will hear Aigerim telling her friend about a trip to Georgia.", "k": "BACAB", "script": [["Friend", "So how was Georgia?"], ["Aigerim", "Wonderful! We flew to Tbilisi and spent three days there. Then we hired a car and drove to the mountains."], ["Friend", "Was the driving difficult?"], ["Aigerim", "A bit. The roads in the mountains are very narrow. And while we were driving, some cows walked into the road!"], ["Friend", "Ha! What was the food like?"], ["Aigerim", "Delicious. We ate khachapuri every day – it's bread with cheese and egg. I put on two kilos!"], ["Friend", "And the weather?"], ["Aigerim", "Hot in Tbilisi, about thirty-five degrees. But in the mountains it was cool and it rained one day."], ["Friend", "Would you go back?"], ["Aigerim", "Definitely. Next time I want to go to the Black Sea coast."]], "q": [["How long did they stay in Tbilisi?", "a week", "three days", "two days"], ["How did they travel to the mountains?", "by hired car", "by plane", "by bus"], ["What happened while they were driving?", "It snowed.", "They had an accident.", "Some cows walked into the road."], ["What was the weather like in the mountains?", "cool, with one rainy day", "very hot", "snowy"], ["Where does she want to go next time?", "the mountains", "the Black Sea coast", "Tbilisi"]]}, "s": {"focus": "past simple and past continuous, sequencers and connectors, holidays, prepositions.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Where did you go on holiday last year?", "What were you doing at 9 o'clock yesterday evening?", "What did you do on your last birthday?", "Where were you born and when?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about a memorable holiday or trip.", "prompts": ["where you went and who with", "where you stayed", "what you did there", "something that happened (good or bad)"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Do you prefer beach holidays or city holidays? Why?", "What's more important on holiday: good weather or good food?", "Tell the teacher a short story about something that went wrong."]}]}});
TESTS.push({"id": "q3", "kind": "quick", "title": "Quick Test 3", "focus": "File 3: be going to (plans and predictions), present continuous for future arrangements, defining relative clauses, airports, verbs + prepositions.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACABCBACBA", "q": [["I'm _____ learn to drive this summer.", "going to", "go to", "going"], ["Look at that man! He's going _____ off his bike.", "falling", "fall", "to fall"], ["_____ you going to watch the match?", "Are", "Do", "Will"], ["I _____ my dentist tomorrow at four.", "seeing", "'m seeing", "see"], ["What _____ this weekend?", "you are doing", "do you do", "are you doing"], ["We _____ to Turkey on Friday. We've got the tickets.", "fly", "'re flying", "flies"], ["A pilot is someone _____ flies planes.", "who", "which", "where"], ["That's the hotel _____ we stayed last year.", "which", "who", "where"], ["Is this the bag _____ you bought yesterday?", "who", "that", "where"], ["The man _____ lives next door is a doctor.", "who", "where", "which"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BABACBCCAA", "q": [["You collect your suitcases at _____.", "departures", "baggage reclaim", "the gate"], ["Show your _____ at passport control.", "passport", "luggage", "boarding pass"], ["Your flight leaves from _____ 7.", "terminal desk", "gate", "check-in"], ["The flight was _____ because of the storm.", "cancelled", "landed", "boarded"], ["I'm waiting _____ my sister.", "to", "at", "for"], ["Don't worry _____ the exam.", "of", "about", "for"], ["It depends _____ the weather.", "to", "of", "on"], ["Can you look _____ my cat this weekend?", "at", "for", "after"], ["I always argue _____ my brother.", "with", "to", "at"], ["She paid _____ the coffees.", "for", "to", "on"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "AABBC", "q": [["fl*igh*t", "g*a*te", "l*a*te"], ["t*e*rminal", "l*e*ft", "ch*e*ck"], ["*wh*ich", "*wh*o", "*wh*ere"], ["depar_tures_", "de_par_tures", "_de_partures"], ["pas_sen_ger", "passen_ger_", "_pas_senger"]]}, "r": {"title": "Airport life", "k": "ABCBA", "text": ["Gate 4 at Astana airport is busy on a Friday evening. Here are three people waiting for the same flight to Istanbul.", "Kanat is a businessman. 'I fly to Istanbul twice a month. I'm meeting a client tomorrow morning and I'm coming back on Sunday. I always take hand luggage only – it's quicker.'", "Saule and her daughter Mira are going on holiday. 'We're going to stay in a hotel by the sea,' says Mira, who is eight. 'I'm going to swim every day!'", "Bob is a student from Canada. He's going to study in Istanbul for six months. 'I'm a bit nervous,' he says. 'I don't speak any Turkish yet, but I'm going to learn.'"], "q": [["Why is Kanat going to Istanbul?", "to meet a client", "to study", "for a holiday"], ["When is Kanat coming back?", "in two weeks", "on Sunday", "on Friday"], ["Why does Kanat take hand luggage only?", "It's cheaper.", "His bag is small.", "It's quicker."], ["Where are Saule and Mira going to stay?", "in the city centre", "in a hotel by the sea", "with friends"], ["How long is Bob going to stay?", "six months", "a year", "two weeks"]]}, "l": {"setting": "You will hear an announcement at an airport and a conversation.", "k": "BCABA", "script": [["Announcement", "Passengers on flight TK 349 to Istanbul, please go to gate 12. This flight is now boarding."], ["Man", "Excuse me, which gate did they say?"], ["Woman", "Gate twelve. Is that your flight too?"], ["Man", "Yes. I thought it was gate two. I'm so glad I asked!"], ["Woman", "Are you going on holiday?"], ["Man", "No, I'm going to a conference. I'm giving a talk on Tuesday."], ["Woman", "Good luck! I'm visiting my daughter. She lives in Istanbul."]], "q": [["Where is the flight going?", "Tbilisi", "Istanbul", "Ankara"], ["Which gate is it?", "2", "20", "12"], ["What gate did the man think it was?", "2", "12", "22"], ["Why is the man travelling?", "on holiday", "for a conference", "to visit family"], ["Who is the woman visiting?", "her daughter", "her son", "a friend"]]}, "s": {"focus": "going to, present continuous for arrangements, relative clauses, travel.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What are you doing this evening?", "What are you going to do next summer?", "Have you got any plans for the weekend?", "What's something you're going to learn this year?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Explain these words without saying them (use who / which / where): a pilot, an airport, a suitcase", "Do you prefer travelling by plane or train? Why?"]}]}});
TESTS.push({"id": "f3", "kind": "file", "title": "File Test 3", "focus": "File 3: be going to (plans and predictions), present continuous (future arrangements), defining relative clauses, airports, verbs + prepositions, paraphrasing.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CBBAABABCBCCAACCABBA", "q": [["I'm _____ start a new job in May.", "go to", "going", "going to"], ["We're not _____ have a party this year.", "going", "going to", "go to"], ["_____ she going to buy that flat?", "Will", "Is", "Does"], ["Be careful! You're going to _____ that glass.", "drop", "dropped", "dropping"], ["It's 8.55 and the bus leaves at 9. We're going _____ it.", "to miss", "miss", "missing"], ["He hasn't studied. I think he's going _____ the exam.", "fail", "to fail", "failing"], ["What _____ going to wear to the wedding?", "are you", "do you", "you are"], ["I _____ my grandparents on Sunday. It's all arranged.", "visit", "'m visiting", "will visiting"], ["_____ you doing anything on Saturday night?", "Do", "Will", "Are"], ["She _____ married in June.", "gets", "'s getting", "get"], ["They _____ to Paris tomorrow – I've seen their tickets.", "fly", "flying", "'re flying"], ["What time _____ the doctor tomorrow?", "you see", "do you see", "are you seeing"], ["We _____ dinner with Tom tonight.", "'re having", "has", "have"], ["A waiter is a person _____ serves food in a restaurant.", "who", "which", "where"], ["A fridge is something _____ keeps food cold.", "where", "who", "that"], ["That's the café _____ I met my wife.", "which", "who", "where"], ["The woman _____ car was stolen called the police.", "whose", "who's", "who"], ["Is this the book _____ you were talking about?", "where", "that", "who"], ["I know a shop _____ sells cheap shoes.", "where", "which", "who"], ["The people _____ live upstairs are very noisy.", "who", "where", "which"]]}, "v": {"parts": [[0, "Airports: choose the correct word."], [7, "Verbs + prepositions: choose the correct word."], [15, "Paraphrasing: choose the word that the definition describes."]], "k": "BAACABBCCABCBBCABCAA", "q": [["You go to _____ to get your boarding pass.", "arrivals", "check-in", "baggage reclaim"], ["You can buy cheap perfume in the _____ shop.", "duty-free", "customs", "security"], ["They check your bags for dangerous things at _____.", "security", "the gate", "arrivals"], ["When you land, you go to _____.", "departures", "check-in", "arrivals"], ["The plane is going to _____ in five minutes. Fasten your seat belt.", "take off", "get off", "go off"], ["I'm sorry, your bag is too heavy. You need to pay for extra _____.", "baggage reclaim", "luggage", "flight"], ["Have a good _____!", "travel", "trip", "journey to"], ["I'm thinking _____ moving to Almaty.", "for", "on", "about"], ["What are you laughing _____?", "of", "on", "at"], ["I'd like to apply _____ this job.", "for", "to", "at"], ["Who does this bag belong _____?", "for", "to", "of"], ["I dreamed _____ my old school last night.", "for", "on", "about"], ["Can you help me look _____ my keys?", "after", "for", "at"], ["She spends a lot of money _____ shoes.", "in", "on", "for"], ["I agree _____ you.", "to", "on", "with"], ["A person who drives a taxi.", "taxi driver", "taxi company", "taxi rank"], ["The place where you wait for a plane to board.", "arrivals hall", "departure lounge", "runway"], ["The thing that you use to open a door.", "handle", "lock", "key"], ["A person who travels on a plane, bus or train.", "passenger", "pilot", "tourist"], ["The place where planes take off and land.", "runway", "terminal desk", "gate"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "BACABACBCA", "q": [["l*a*nd", "l*a*te", "c*a*nnot"], ["*y*et", "*j*et", "*j*ourney"], ["b*oar*d", "f*or*", "w*or*k"], ["fl*y*ing", "tr*i*p", "t*i*cket"], ["t*o*p", "cust*o*ms", "dr*o*p"], ["de_par_tures", "depar_tures_", "_de_partures"], ["_se_curity", "secu_ri_ty", "se_cu_rity"], ["passen_ger_", "_pas_senger", "pas_sen_ger"], ["travel_ler_", "tra_vel_ler", "_tra_veller"], ["a_rri_vals", "_a_rrivals", "arri_vals_"]]}, "r": {"title": "Stuck at the airport", "k": "BCBAA", "text": ["Most of us hate waiting at airports for a few hours. But Mehran Karimi Nasseri lived at Charles de Gaulle Airport in Paris for eighteen years, from 1988 to 2006.", "Nasseri was born in Iran. He wanted to live in England, but when he arrived at the airport his papers were lost and the British didn't let him in. The French sent him back to the airport, and he stayed there – in Terminal 1, on a red bench.", "Every day he followed the same routine. He got up at 5.30 a.m., before the passengers arrived, and washed in the toilets. He read books, wrote in his diary and studied economics. Airport workers who knew him gave him food and newspapers.", "His story became famous. In 2004 Steven Spielberg made a film called The Terminal with Tom Hanks, which was based on his life. Nasseri finally left the airport in 2006 because he was ill. He died in 2022, at the same airport where he lived for so long."], "q": [["How long did Nasseri live at the airport?", "eight years", "eighteen years", "six years"], ["Where did he want to live?", "in France", "in Iran", "in England"], ["Why did he get up at 5.30?", "to catch a flight", "before passengers arrived", "to start work"], ["Who gave him food?", "airport workers", "the French government", "passengers"], ["Why did he leave the airport in 2006?", "He was ill.", "He moved to England.", "He got his papers."]]}, "l": {"setting": "You will hear Rustam calling a friend about his travel plans.", "k": "BABAC", "script": [["Rustam", "Hi Gulya! Guess what – I'm flying to Seoul next week!"], ["Gulya", "Seoul! That's amazing. Are you going on holiday?"], ["Rustam", "Half and half. I'm going to a three-day conference for work, and then I'm staying for a week to travel."], ["Gulya", "When are you leaving?"], ["Rustam", "On Thursday at 6 a.m. I'm going to get a taxi to the airport at 3.30."], ["Gulya", "Ouch, that's early. Where are you staying?"], ["Rustam", "For the conference, in a hotel near the centre. Then I'm going to stay with a friend who works in Busan."], ["Gulya", "What are you going to do there?"], ["Rustam", "Lots of things! I'm going to try all the street food and I'm going to climb a mountain near the city."], ["Gulya", "Sounds great. Take lots of photos!"]], "q": [["How long is the conference?", "a week", "three days", "five days"], ["What day is Rustam leaving?", "Thursday", "Friday", "Tuesday"], ["What time is the taxi coming?", "3.00", "3.30", "6.00"], ["Where is he staying after the conference?", "with a friend in Busan", "in a hotel in Busan", "in a hotel in Seoul"], ["What is he going to do in Busan?", "visit museums", "go to the beach", "try street food and climb a mountain"]]}, "s": {"focus": "be going to, present continuous for arrangements, relative clauses, travel and airports.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What are you doing tomorrow evening?", "What are your plans for the next holiday?", "What do you think you're going to do after this course?", "What was the last trip you made?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about your plans for next year.", "prompts": ["something you're going to learn", "somewhere you're going to go", "something you've already arranged", "what you think next year is going to be like"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Describe these to the teacher without saying the word: a dentist, a passport, a museum", "Do you like airports? Why / why not?", "What's the best way to travel long distances?"]}]}});
TESTS.push({"id": "q4", "kind": "quick", "title": "Quick Test 4", "focus": "File 4: present perfect + yet, just, already, present perfect or past simple?, something / anything / nothing, housework, make or do, shopping, adjectives ending -ed and -ing.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BABBAACCAC", "q": [["I've _____ finished my homework. Look!", "ever", "just", "yet"], ["Have you done the washing-up _____?", "yet", "just", "already"], ["She's _____ bought a new car.", "yet", "already", "still"], ["I _____ that film. It's great.", "saw", "'ve seen", "'ve saw"], ["We _____ to the cinema last night.", "went", "'ve gone", "'ve been"], ["_____ you ever been to Japan?", "Have", "Did", "Are"], ["When _____ you buy that jacket?", "do", "have", "did"], ["I'm bored. There's _____ to do.", "something", "anything", "nothing"], ["Is there _____ in the fridge? I'm hungry.", "anything", "anyone", "nothing"], ["_____ called you. I think it was your mother.", "Anyone", "No one", "Someone"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "ABCAABACCB", "q": [["I always _____ the bed in the morning.", "make", "do", "clean"], ["Can you _____ the ironing?", "make", "do", "have"], ["Please _____ the rubbish. It smells.", "take off", "put out of", "take out"], ["I need to _____ the floor. It's dirty.", "sweep", "tidy", "lay"], ["The film was really _____. I fell asleep.", "boring", "bored", "bore"], ["I was very _____ when I heard the news.", "surprise", "surprised", "surprising"], ["Can I _____ this dress on?", "try", "put", "test"], ["These jeans don't _____ me. They're too small.", "match", "suit", "fit"], ["I'd like to _____ these shoes. They're broken.", "give up", "try on", "take back"], ["The shop assistant gave me a _____ for my money.", "recipe", "receipt", "ticket"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "CBABA", "q": [["d*o*ne", "s*o*n", "g*o*ne"], ["m*u*ch", "y*e*t", "j*u*st"], ["f*i*nished", "fr*igh*tened", "t*i*red"], ["in_te_resting", "_in_teresting", "inte_res_ting"], ["em_ba_rrassed", "_em_barrassed", "embar_rassed_"]]}, "r": {"title": "Who does the housework?", "k": "AACBB", "text": ["A new survey asked 2,000 families in Kazakhstan about housework. In most homes, women still do more – about three hours a day, compared to one and a half hours for men.", "But things are changing. 'My husband has just learned to cook,' says Aliya from Pavlodar. 'He's already made plov twice! It was delicious.'", "Children help less than before. 'My son is fifteen and he hasn't made his bed yet this year,' laughs one mother. 'He says he's too busy with homework.'", "The most hated job? Ironing. 'Nobody likes it,' says the report. 'Many families have stopped doing it completely.'"], "q": [["How many families answered the survey?", "2,000", "200", "20,000"], ["How much housework do men do a day?", "about 1.5 hours", "about 30 minutes", "about 3 hours"], ["What has Aliya's husband learned to do?", "iron", "clean the windows", "cook"], ["What hasn't the fifteen-year-old done this year?", "done his homework", "made his bed", "cooked"], ["What is the most hated job?", "washing up", "ironing", "cooking"]]}, "l": {"setting": "You will hear Nina and her flatmate Kate talking about jobs in the flat.", "k": "BAACB", "script": [["Nina", "Kate, have you done the shopping yet?"], ["Kate", "Yes, I've just come back. I've bought milk, bread and some fruit."], ["Nina", "Great. Did you remember the coffee?"], ["Kate", "Oh no! I forgot. Sorry."], ["Nina", "Never mind. I've already cleaned the kitchen. Can you do the vacuuming?"], ["Kate", "OK. But I haven't had lunch yet. Can I do it later?"], ["Nina", "Sure. My parents are coming at six, so we have time."]], "q": [["What has Kate just done?", "the cooking", "the shopping", "the cleaning"], ["What did Kate forget?", "coffee", "bread", "milk"], ["What has Nina already done?", "cleaned the kitchen", "made lunch", "done the vacuuming"], ["Why does Kate want to wait?", "She's tired.", "She's going out.", "She hasn't had lunch."], ["Who is coming at six?", "Kate's parents", "Nina's parents", "a friend"]]}, "s": {"focus": "present perfect (yet, just, already), past simple, housework, shopping.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What housework do you do? What do you hate doing?", "What have you done today?", "What's the last thing you bought? Where did you buy it?", "Have you ever taken something back to a shop?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Do you prefer shopping online or in shops? Why?", "Tell the teacher about something that surprised you recently."]}]}});
TESTS.push({"id": "f4", "kind": "file", "title": "File Test 4", "focus": "File 4: present perfect + yet, just, already, present perfect or past simple? (1), something, anything, nothing, etc., housework, make or do, shopping, adjectives ending -ed and -ing.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CBBCBCACABAABBACCAAB", "q": [["I've _____ had a coffee, thanks. I don't want another one.", "yet", "ever", "just"], ["They haven't arrived _____.", "just", "yet", "already"], ["Have you _____ booked the hotel? That was quick!", "yet", "already", "ever"], ["She's _____ called. She wants you to call her back.", "still", "yet", "just"], ["We _____ the new James Bond film. Have you?", "'ve saw", "'ve seen", "saw"], ["He _____ his car yet.", "didn't sell", "hasn't sell", "hasn't sold"], ["I _____ to Almaty three times.", "'ve been", "'ve gone", "went"], ["A: Have you ever eaten horse meat?\nB: Yes, I _____ it at my uncle's wedding.", "'ve eaten", "eat", "ate"], ["When _____ you move to this city?", "did", "do", "have"], ["I _____ this jacket last week. Do you like it?", "buy", "bought", "'ve bought"], ["_____ you ever lost your passport?", "Have", "Did", "Were"], ["My parents _____ married in 1995.", "got", "have got", "get"], ["I _____ him since we were at school.", "don't see", "haven't seen", "didn't see"], ["There's _____ at the door. Can you open it?", "anyone", "someone", "no one"], ["I didn't buy _____ at the market.", "anything", "something", "nothing"], ["_____ knows where the keys are. Nobody!", "Anyone", "Someone", "No one"], ["Let's go _____ quiet for dinner.", "nowhere", "anywhere", "somewhere"], ["I've looked everywhere, but I can't find my phone _____.", "anywhere", "somewhere", "nowhere"], ["There's _____ in the fridge. We need to go shopping.", "nothing", "something", "anything"], ["Did you meet _____ interesting at the party?", "no one", "anyone", "nobody"]]}, "v": {"parts": [[0, "Housework and make or do: choose the correct word."], [8, "Shopping: choose the correct word."], [14, "-ed and -ing adjectives: choose the correct word."]], "k": "ACBCABCACACCBBABBABA", "q": [["I'll _____ the dinner tonight.", "make", "do", "have"], ["Who's going to _____ the washing-up?", "clean", "make", "do"], ["She _____ a lot of noise when she gets home late.", "does", "makes", "has"], ["I need to _____ the shopping.", "go", "make", "do"], ["Have you _____ your homework?", "done", "made", "had"], ["Could you _____ the table? Dinner is ready.", "do", "lay", "make"], ["Please _____ your room. It's a mess!", "make", "do up", "tidy"], ["I _____ my best, but I failed the exam.", "did", "gave", "made"], ["Excuse me, where are the _____ rooms? I want to try this on.", "dressing up", "trying", "changing"], ["Can I pay by _____?", "card", "credit", "money"], ["These shoes are in the _____. They're 50% off.", "discount", "offer price", "sale"], ["What _____ are you? Medium?", "measure", "number", "size"], ["It's too expensive. I can't _____ it.", "spend", "afford", "pay"], ["I ordered a new phone _____. It's arriving tomorrow.", "in internet", "online", "on net"], ["I'm _____ in buying a new car.", "interested", "interesting", "interest"], ["That was a really _____ film. I was scared.", "frightened", "frightening", "fright"], ["She was very _____ when she failed her driving test.", "disappoint", "disappointed", "disappointing"], ["I'm so _____. I've worked twelve hours today.", "tired", "tiring", "tire"], ["The ending of the book was very _____.", "surprised", "surprising", "surprise"], ["He felt _____ when he fell over in the street.", "embarrassed", "embarrass", "embarrassing"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "CBBACACABA", "q": [["*ea*ten", "b*ee*n", "y*e*t"], ["d*o*ne", "h*o*me", "s*o*n"], ["m*a*de", "s*ai*d", "p*ai*d"], ["s*a*le", "w*a*shing", "w*a*tch"], ["*j*ust", "*j*acket", "*y*et"], ["ex_ci_ted", "exci_ted_", "_ex_cited"], ["frighte_ning_", "frigh_te_ning", "_frigh_tening"], ["disap_poin_ted", "dis_ap_pointed", "_dis_appointed"], ["_em_barrassing", "em_ba_rrassing", "embar_rass_ing"], ["ex_haus_ted", "_ex_hausted", "exhaus_ted_"]]}, "r": {"title": "Buy nothing for a year", "k": "ABCBA", "text": ["In January 2024, a family from Almaty decided to do something unusual: buy nothing new for a whole year, except food and medicine.", "'We realised our flat was full of things we didn't need,' says Aigul Abenova, mother of two. 'Every weekend we went to the shopping centre because we were bored. It wasn't making us happy.'", "So far, the family has saved about 900,000 tenge. They've learned to repair clothes and they've borrowed things from neighbours. 'Our son needed a bike, so we found a second-hand one online,' says Aigul. 'He's already ridden it more than his old new one!'", "It hasn't always been easy. 'The hardest moment was my daughter's birthday,' says Aigul. 'She wanted a new dress. In the end her grandmother made one for her, and she loved it.'", "Have they bought anything new? 'Only one thing,' Aigul laughs. 'Our washing machine broke in May. We couldn't wait a year for that!'"], "q": [["Why did the family decide to stop buying things?", "It wasn't making them happy.", "Their flat was small.", "They didn't have money."], ["Why did they go to the shopping centre every weekend?", "It was near their flat.", "They were bored.", "They needed food."], ["How did they get a bike for their son?", "His grandmother gave him one.", "They borrowed one.", "They bought a second-hand one."], ["What happened on the daughter's birthday?", "She didn't get a present.", "Her grandmother made her a dress.", "They bought her a dress."], ["What new thing did they buy?", "a washing machine", "a bike", "a dress"]]}, "l": {"setting": "You will hear a customer in a clothes shop.", "k": "BCBAA", "script": [["Assistant", "Hello, can I help you?"], ["Customer", "Yes. I bought this shirt here last week, but it'
