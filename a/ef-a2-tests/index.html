s too small. Can I change it?"], ["Assistant", "Of course. Have you got the receipt?"], ["Customer", "Yes, here it is."], ["Assistant", "Thank you. What size is it?"], ["Customer", "Small. I need a medium, I think."], ["Assistant", "I'm afraid we haven't got this colour in medium. We've only got it in blue or black."], ["Customer", "Hmm. Can I try the black one?"], ["Assistant", "Sure. The changing rooms are over there, next to the shoes."], ["Customer", "Thanks… It fits. I'll take it."], ["Assistant", "Great. And there's no extra cost – it's the same price."]], "q": [["When did the customer buy the shirt?", "yesterday", "last week", "last month"], ["What's the problem with the shirt?", "It's broken.", "It's the wrong colour.", "It's too small."], ["What size does the customer need?", "small", "medium", "large"], ["Which colour does the customer try?", "black", "white", "blue"], ["How much extra does the customer pay?", "nothing", "a little", "half the price"]]}, "s": {"focus": "present perfect (yet, just, already, ever), past simple, something / anything, housework, shopping.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What have you done this week that you enjoyed?", "What housework do you do? Which jobs do you hate?", "What's the best thing you've ever bought?", "Have you ever bought something you never used?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about shopping habits.", "prompts": ["where you usually buy clothes", "how often you go shopping", "online or in shops", "something you bought recently and why"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Do people buy too many things today?", "Should children help with housework? What should they do?", "Tell the teacher about an embarrassing or surprising moment."]}]}});
TESTS.push({"id": "q5", "kind": "quick", "title": "Quick Test 5", "focus": "File 5: comparative adjectives and adverbs, as … as, superlatives (+ ever + present perfect), quantifiers, too, not enough, time expressions with spend, waste, save, describing a town or city, health and the body.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CBCAABAABC", "q": [["My new phone is _____ than my old one.", "fastest", "more fast", "faster"], ["She drives _____ than her brother.", "carefullier", "more carefully", "more careful"], ["This bag isn't as heavy _____ that one.", "like", "than", "as"], ["Almaty is the _____ city in Kazakhstan.", "biggest", "most big", "bigger"], ["It's the best film I've _____ seen.", "ever", "already", "never"], ["What's the most expensive thing you've ever _____?", "buyed", "bought", "buy"], ["I'm too _____ to go out tonight.", "tired", "much tired", "tiring"], ["You don't drink _____ water.", "enough", "too much", "too"], ["There are too _____ cars in the city centre.", "much", "many", "enough"], ["I eat too _____ chocolate.", "enough", "many", "much"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "ABACBACBAC", "q": [["I _____ two hours a day on my phone.", "spend", "waste", "pass"], ["Let's take the motorway. We'll _____ time.", "spend", "save", "waste"], ["Don't _____ your time on that game.", "waste", "spend up", "save"], ["The city centre is very _____. There are always lots of people.", "empty", "quiet", "crowded"], ["There's a lot of traffic and _____ in the city.", "clean air", "pollution", "parks"], ["My village is very _____. Nothing happens here.", "quiet", "lively", "noisy"], ["I hurt my _____ playing tennis. I can't hold anything.", "ankle", "knee", "wrist"], ["You hear with your _____.", "lips", "ears", "eyes"], ["I've got a sore _____. I can't speak.", "throat", "back", "stomach"], ["I ate too much and now I have a _____.", "headache", "toothache", "stomach ache"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "AACBB", "q": [["s*ou*nd", "th*u*mb", "st*o*mach"], ["h*ea*rt", "br*ea*th", "h*ea*lthy"], ["*k*ey", "*c*old", "*c*ity"], ["_po_llution", "po_llu_tion", "pollu_tion_"], ["dan_ge_rous", "_dan_gerous", "dange_rous_"]]}, "r": {"title": "Two cities, one family", "k": "BBAAC", "text": ["Marat lives in Astana and his sister Gulnar lives in Almaty. They often argue about which city is better.", "'Astana is newer and cleaner than Almaty,' says Marat. 'The buildings are more modern and the streets are wider. But it's much colder in winter – it's the second coldest capital in the world!'", "'Almaty is more beautiful,' says Gulnar. 'We have the mountains, and the weather is warmer. But there's too much traffic and the air isn't as clean as in Astana.' Both agree on one thing: 'Kostanay, where we grew up, has the friendliest people!'"], "q": [["Which city does Marat say is cleaner?", "Almaty", "Astana", "Kostanay"], ["What is Astana like in winter?", "rainy", "very cold", "warm"], ["What does Gulnar like about Almaty?", "the mountains", "the traffic", "the modern buildings"], ["What problem does Almaty have?", "too much traffic", "too much snow", "no parks"], ["Where did Marat and Gulnar grow up?", "in Almaty", "in Astana", "in Kostanay"]]}, "l": {"setting": "You will hear a doctor talking to a patient, Mr Lee.", "k": "BAACB", "script": [["Doctor", "Good morning, Mr Lee. What's the problem?"], ["Mr Lee", "I've had a bad back for about two weeks, doctor."], ["Doctor", "Do you do any exercise?"], ["Mr Lee", "Not much. I don't have enough time. I work in an office all day."], ["Doctor", "How many hours do you sit at your desk?"], ["Mr Lee", "About ten hours a day."], ["Doctor", "That's too long. You need to stand up and walk around every hour. And try swimming twice a week."], ["Mr Lee", "Swimming? I can't swim very well."], ["Doctor", "Then walking is fine – thirty minutes a day."]], "q": [["How long has Mr Lee had a bad back?", "about two days", "about two weeks", "two months"], ["Why doesn't he do exercise?", "He doesn't have enough time.", "He doesn't like sport.", "He's too tired."], ["How long does he sit at his desk?", "about ten hours a day", "about six hours a day", "about eight hours a day"], ["How often should he stand up?", "twice a day", "every two hours", "every hour"], ["What does the doctor finally suggest?", "swimming every day", "walking 30 minutes a day", "running"]]}, "s": {"focus": "comparatives and superlatives, too / enough, describing a city, health.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Compare your town with another town you know.", "What's the most beautiful place you've ever been to?", "Do you get enough sleep?", "What do you do to stay healthy?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Is it better to live in a city or in the countryside?", "Do you waste a lot of time? On what?"]}]}});
TESTS.push({"id": "f5", "kind": "file", "title": "File Test 5", "focus": "File 5: comparative adjectives and adverbs, as … as, superlatives (+ ever + present perfect), quantifiers, too, not enough, time expressions (spend, waste, save), describing a town or city, health and the body.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CCBCAACCABCBAABBABAB", "q": [["Train tickets are _____ than plane tickets.", "more cheap", "cheapest", "cheaper"], ["Our new flat is _____ than the old one.", "most comfortable", "comfortabler", "more comfortable"], ["My sister speaks English _____ than me.", "more well", "better", "more good"], ["You need to work _____ if you want to pass.", "more hardly", "more hard", "harder"], ["The weather today is _____ than yesterday.", "worse", "badder", "more bad"], ["He isn't as tall _____ his father.", "as", "so", "than"], ["My car is as old _____ yours.", "like", "than", "as"], ["This is the _____ beach I've ever visited.", "more beautiful", "beautifulest", "most beautiful"], ["It was the _____ day of my life.", "happiest", "happier", "most happy"], ["What's the _____ place you've ever been to?", "hotter", "hottest", "most hot"], ["That's the worst meal I've _____ eaten.", "yet", "never", "ever"], ["Who's the _____ person you know?", "most funny", "funniest", "funnier"], ["This coffee is too _____. I can't drink it.", "hot", "much hot", "enough hot"], ["I'm not old _____ to drive.", "enough", "very", "too"], ["There isn't _____ milk for a cake.", "too", "enough", "too much"], ["I've got too _____ work this week.", "enough", "much", "many"], ["There are too _____ people on this bus.", "many", "much", "lot"], ["She doesn't sleep _____.", "too", "enough", "too much"], ["I ate too _____ biscuits. Now I feel ill.", "many", "much", "enough"], ["He drives _____ than anyone I know.", "dangerouslier", "more dangerously", "most dangerously"]]}, "v": {"parts": [[0, "Time expressions: choose the correct word."], [4, "Describing a town or city: choose the correct word."], [11, "Health and the body: choose the correct word."]], "k": "ACABCCBACBAACAABBCBB", "q": [["I _____ an hour a day doing exercise.", "spend", "save", "waste"], ["Waiting for the bus is a _____ of time.", "spend", "lose", "waste"], ["Online shopping _____ me a lot of time.", "saves", "wastes", "spends"], ["Hurry up! We don't have much time to _____.", "save up", "spare", "waste up"], ["The streets are very _____. Nobody throws rubbish.", "dirty", "polluted", "clean"], ["There's a lot of _____ – the air is very dirty.", "traffic jam", "crowd", "pollution"], ["It's a _____ city with lots of bars and restaurants.", "boring", "lively", "quiet"], ["The old town is very _____. Lots of tourists go there.", "historic", "modern", "industrial"], ["It's a big _____ city. There are lots of factories.", "lively", "historic", "industrial"], ["The capital is in the _____ of the country.", "up", "north", "northern"], ["The roads are always busy. There's a lot of _____.", "traffic", "transport", "people"], ["I can't walk. I hurt my _____ when I was running.", "ankle", "elbow", "wrist"], ["He broke his _____ – he can't play the piano.", "knee", "toe", "finger"], ["Open your _____ and say 'Aaah'.", "mouth", "nose", "ear"], ["I've got a _____. My nose is running and I keep sneezing.", "cold", "stomach ache", "sore throat"], ["She has a high _____. She feels very hot.", "headache", "temperature", "pain"], ["I've got _____. I ate something bad.", "a cough", "food poisoning", "flu"], ["The doctor gave me some _____ for my cough.", "prescription pills", "illness", "medicine"], ["You should _____ down for a few days.", "stay", "lie", "lay"], ["Your _____ pumps blood around your body.", "stomach", "heart", "lungs"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "BCCABACBAA", "q": [["n*e*ck", "th*u*mb", "h*ea*d"], ["br*ea*the", "t*ee*th", "br*ea*th"], ["s*a*fe", "w*a*ste", "m*a*ny"], ["sn*ow*", "t*ow*n", "cr*ow*ded"], ["*c*old", "*k*nee", "*c*ough"], ["in_dus_trial", "indus_tri_al", "_in_dustrial"], ["pollu_tion_", "_po_llution", "po_llu_tion"], ["histo_ric_", "his_to_ric", "_his_toric"], ["_tem_perature", "tem_pe_rature", "tempe_ra_ture"], ["_me_dicine", "medi_cine_", "me_di_cine"]]}, "r": {"title": "The happiest city in the world?", "k": "ABABC", "text": ["Every year the World Happiness Report chooses the happiest countries in the world. For several years Finland has been number one. But what makes its capital, Helsinki, such a happy place to live?", "First, the city isn't as crowded as other European capitals. Only about 650,000 people live there, and there are parks and forests everywhere. Nobody lives more than three hundred metres from a green space.", "Second, it's safe and clean. Helsinki is one of the least polluted cities in Europe. Public transport is excellent, so many people don't need a car. 'I save about an hour a day because I don't sit in traffic,' says Mikko, an IT worker.", "But Helsinki isn't perfect. The winters are long and dark – in December there are only six hours of daylight. And it's one of the most expensive cities in Europe. 'Coffee costs more than in Almaty, that's for sure,' laughs Dana, a student from Kazakhstan. 'But people here are calm and they trust each other. I've never felt so relaxed.'"], "q": [["How many people live in Helsinki?", "about 650,000", "about 6,500,000", "about 300,000"], ["How far is everyone from a green space?", "about one hour", "no more than 300 metres", "about 3 kilometres"], ["How much time does Mikko save every day?", "about an hour", "about two hours", "thirty minutes"], ["What is a problem in Helsinki?", "traffic", "long, dark winters", "pollution"], ["What does Dana like about Helsinki?", "Coffee is cheap.", "The weather is warm.", "People are calm and trust each other."]]}, "l": {"setting": "You will hear Alan asking his friend Zarina about moving to the countryside.", "k": "BAABC", "script": [["Alan", "So, Zarina, how is life in the village?"], ["Zarina", "Much better than in the city! It's quieter and the air is cleaner."], ["Alan", "Don't you miss anything?"], ["Zarina", "Well, the shops. The nearest supermarket is fifteen kilometres away. And there isn't a cinema."], ["Alan", "How do you get to work?"], ["Zarina", "I work from home three days a week. The other two days I drive – it takes about forty minutes."], ["Alan", "That's quite far."], ["Zarina", "Yes, but in the city it took me an hour by bus because of the traffic. So I save time now!"], ["Alan", "And are you healthier?"], ["Zarina", "Definitely. I walk my dog every morning in the fields and I sleep much better."]], "q": [["What does Zarina say about the village?", "It's more exciting.", "It's quieter and cleaner.", "It's cheaper."], ["How far is the nearest supermarket?", "15 km", "50 km", "5 km"], ["How many days a week does she drive to work?", "two", "five", "three"], ["How long did her journey take in the city?", "forty minutes", "an hour", "fifteen minutes"], ["What does she do every morning?", "goes to the gym", "drives to work", "walks her dog"]]}, "s": {"focus": "comparatives and superlatives, as … as, too / enough, describing a town, health.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What's the best thing about your town? What's the worst?", "What's the most interesting place you've ever visited?", "How do you spend your free time? How much time do you waste?", "What do you do when you have a cold?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Compare two places where you have lived or that you know well.", "prompts": ["size and people", "transport and traffic", "things to do", "which one you prefer and why"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["What makes a city a good place to live?", "Do young people today get enough exercise?", "Is it better to be a big fish in a small town or a small fish in a big city?"]}]}});
TESTS.push({"id": "q6", "kind": "quick", "title": "Quick Test 6", "focus": "File 6: will / won't for predictions, will / won't for decisions, offers and promises, review of verb forms, opposite verbs, verb + back, adjectives + prepositions.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACBBCCAABA", "q": [["I think it _____ snow tonight.", "will", "is", "does"], ["Don't worry. You _____ fail the exam.", "don't", "aren't", "won't"], ["Do you think she _____ the job?", "gets", "'ll get", "getting"], ["It's cold in here. I _____ close the window.", "am going", "'ll", "'m"], ["I _____ tell anyone your secret. I promise.", "don't", "'m not", "won't"], ["_____ I help you with your bags?", "Will", "Do", "Shall"], ["A: I've left my wallet at home.\nB: Don't worry. I _____ for lunch.", "'ll pay", "pay", "'m paying"], ["I _____ to the gym three times a week.", "go", "'m going", "'ll go"], ["What _____ when I called you?", "have you done", "were you doing", "did you do"], ["I _____ my keys. Have you seen them?", "'ve lost", "lose", "lost"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CBBACAABAC", "q": [["The opposite of 'push' is _____.", "carry", "drop", "pull"], ["The opposite of 'remember' is _____.", "miss", "forget", "lose"], ["The opposite of 'win' is _____.", "fail", "lose", "pass"], ["Can I borrow your pen? I'll give it _____ tomorrow.", "back", "return", "again"], ["Please call me _____ when you're free.", "after", "again", "back"], ["I'm really good _____ maths.", "at", "on", "in"], ["She's afraid _____ dogs.", "of", "at", "from"], ["I'm tired _____ waiting. Let's go.", "with", "of", "from"], ["He's very proud _____ his children.", "of", "for", "about"], ["I'm not very interested _____ politics.", "about", "on", "in"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "CABAB", "q": [["h*o*t", "w*a*nt", "w*o*n't"], ["g*o*", "l*o*se", "m*o*ve"], ["*th*at", "*th*ink", "*th*ey"], ["_op_timist", "op_ti_mist", "opti_mist_"], ["pessi_mist_", "_pe_ssimist", "pe_ssi_mist"]]}, "r": {"title": "Optimist or pessimist?", "k": "BACAB", "text": ["Are you an optimist or a pessimist? Scientists say that optimists usually live longer, healthier lives.", "A study at a university in the USA followed 70,000 women for eight years. The most optimistic women were 30% less likely to die of heart disease than the most pessimistic women. 'Optimists sleep better, eat better and do more exercise,' says one researcher.", "The good news? You can learn to be more optimistic. Try this: every evening, write down three good things that happened during the day. Researchers say that after a few weeks, you'll feel happier."], "q": [["According to scientists, optimists usually _____.", "earn more money", "live longer", "work harder"], ["How long did the study follow the women?", "eight years", "thirty years", "seventy years"], ["What do optimists do, according to a researcher?", "sleep more", "work less", "sleep better"], ["What should you write every evening?", "three good things from the day", "three plans for tomorrow", "three problems"], ["When will you feel happier?", "after a year", "after a few weeks", "after one day"]]}, "l": {"setting": "You will hear two friends, Max and Leila, talking about a party.", "k": "ABCBA", "script": [["Max", "Leila, are you coming to Dana's party on Saturday?"], ["Leila", "I'd love to, but I don't know. I've got an exam on Monday."], ["Max", "Oh, come on! You'll do well – you always do."], ["Leila", "I'm not so sure. This one is really difficult."], ["Max", "Look, I'll help you study on Friday. Then you can come on Saturday."], ["Leila", "Really? OK, that's a deal. What shall I bring?"], ["Max", "Dana said bring something to drink. I'll bring a cake."], ["Leila", "Great. I'll bring some juice."]], "q": [["When is the party?", "on Saturday", "on Monday", "on Friday"], ["Why isn't Leila sure about going?", "She's ill.", "She has an exam.", "She's working."], ["What does Max offer to do?", "drive her to the party", "buy a present", "help her study"], ["What is Max going to bring?", "juice", "a cake", "nothing"], ["What is Leila going to bring?", "juice", "a present", "a cake"]]}, "s": {"focus": "will / won't (predictions, offers, promises), adjectives + prepositions.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Do you think it will rain tomorrow?", "Are you an optimist or a pessimist?", "What are you good at? What are you bad at?", "What are you afraid of?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Make three predictions about life in 2050", "Your friend has a problem. Make two offers and one promise to help."]}]}});
TESTS.push({"id": "f6", "kind": "file", "title": "File Test 6", "focus": "File 6: will / won't for predictions, will / won't for decisions, offers and promises, review of verb forms (present, past, future), opposite verbs, verb + back, adjectives + prepositions.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CBAABCABACCBABCCAABB", "q": [["I'm sure you _____ the new job.", "love", "loving", "'ll love"], ["They _____ win the match. They're playing really badly.", "don't", "won't", "aren't"], ["I don't think it _____ cold tomorrow.", "'ll be", "be", "is"], ["_____ we have flying cars in 2050?", "Will", "Are", "Do"], ["People _____ live on Mars one day.", "are", "might", "can"], ["I'm hungry. I think I _____ a sandwich.", "make", "'m make", "'ll make"], ["A: The phone's ringing.\nB: I _____ it.", "'ll answer", "'m answering", "answer"], ["_____ I carry that for you?", "Will", "Shall", "Do"], ["I _____ be late again. I promise.", "won't", "'m not", "don't"], ["We _____ you a postcard from Paris.", "send", "sending", "'ll send"], ["_____ you lend me some money? I'll pay you back tomorrow.", "Shall", "Are", "Will"], ["That box looks heavy. I _____ you.", "'m helping", "'ll help", "help"], ["She _____ in a hospital. She's a nurse.", "works", "will work", "is working"], ["Sh! The baby _____.", "sleeps", "'s sleeping", "will sleep"], ["I _____ my wallet yesterday.", "was losing", "'ve lost", "lost"], ["We _____ dinner when the doorbell rang.", "have", "had", "were having"], ["_____ you ever been to Italy?", "Have", "Will", "Did"], ["I _____ him tomorrow at the airport. It's all arranged.", "'m meeting", "meet", "met"], ["She _____ her homework yet.", "doesn't finish", "hasn't finished", "didn't finish"], ["Look at the sky. It _____ rain.", "will", "'s going to", "is"]]}, "v": {"parts": [[0, "Opposite verbs and verb + back: choose the correct word."], [9, "Adjectives + prepositions: choose the correct word."]], "k": "CBBAACBCCBACAABBACAB", "q": [["The opposite of 'buy' is _____.", "pay", "spend", "sell"], ["The opposite of 'start' is _____.", "stop to", "finish", "close up"], ["The opposite of 'pass an exam' is _____ an exam.", "miss", "fail", "lose"], ["The opposite of 'turn on' is _____.", "turn off", "turn down", "turn out"], ["The opposite of 'teach' is _____.", "learn", "know", "study"], ["The opposite of 'lend' is _____.", "give", "take back", "borrow"], ["Can you give me _____ my book? I need it.", "return", "back", "again"], ["I'm out at the moment. Can I call you _____?", "later back", "again", "back"], ["The shop was closed, so we came _____ home.", "again", "return", "back"], ["She's very good _____ languages.", "in", "at", "on"], ["I'm bored _____ this film.", "with", "of", "at"], ["My son is crazy _____ football.", "of", "for", "about"], ["He's angry _____ me because I was late.", "with", "about", "at me for"], ["I'm worried _____ my exam.", "about", "for", "of"], ["This town is famous _____ its apples.", "of", "for", "about"], ["I'm very fond _____ my grandmother.", "with", "of", "for"], ["She's married _____ a doctor.", "to", "with", "at"], ["I'm sorry _____ being late.", "of", "to", "for"], ["Are you interested _____ art?", "in", "on", "for"], ["Kostanay is close _____ the Russian border.", "of", "to", "at"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "AACBBCCABA", "q": [["sh*a*ll", "g*o*", "w*o*n't"], ["kn*ow*", "pr*o*mise", "sh*o*p"], ["l*o*se", "ch*oo*se", "l*o*st"], ["l*a*st", "f*ai*l", "p*a*ss"], ["p*u*ll", "sh*u*t", "p*u*sh"], ["op_ti_mist", "opti_mist_", "_op_timist"], ["_pe_ssimistic", "pe_ssi_mistic", "pessi_mis_tic"], ["_a_ccident", "acci_dent_", "a_cci_dent"], ["_re_member", "re_mem_ber", "remem_ber_"], ["_in_terested", "in_te_rested", "inte_res_ted"]]}, "r": {"title": "Predictions that went wrong", "k": "BACAB", "text": ["Predicting the future is difficult – even for experts. Here are some famous predictions that were completely wrong.", "In 1876, a manager at a big telegraph company wrote that the telephone 'has too many problems' and would never be important. Today there are more mobile phones in the world than people.", "In 1943, Thomas Watson, the head of IBM, said: 'I think there is a world market for maybe five computers.' He didn't imagine that one day almost everyone would carry a computer in their pocket.", "In 1995, an American writer said that online shopping would never be popular. 'People won't buy things they can't touch,' he wrote. Twenty-five years later, online shops were selling more than five trillion dollars of products every year.", "Of course, some predictions were right. In 1900, an engineer called John Watkins predicted that people would see photos from the other side of the world 'in seconds'. So what will happen in the next hundred years? Maybe it's better not to say!"], "q": [["What did the 1876 manager think about the telephone?", "It was too expensive.", "It wasn't important.", "It was very useful."], ["How many computers did Thomas Watson think the world needed?", "about five", "millions", "about fifty"], ["Why did the 1995 writer think online shopping wouldn't be popular?", "It wasn't safe.", "It was too slow.", "People couldn't touch the products."], ["Which prediction was correct?", "John Watkins' prediction about photos", "the 1995 writer's", "Thomas Watson's"], ["What is the writer's final advice?", "Predictions are easy.", "It's better not to make predictions.", "Experts are usually right."]]}, "l": {"setting": "You will hear Sam talking to his mum about his weekend plans.", "k": "ABBCA", "script": [["Mum", "Sam, what are you doing this weekend?"], ["Sam", "On Saturday I'm going to the football match with Arman. It starts at three."], ["Mum", "Do you think your team will win?"], ["Sam", "I hope so, but probably not. The other team is top of the league."], ["Mum", "Will you be home for dinner?"], ["Sam", "Yes, I'll be back by seven. I promise."], ["Mum", "Good. Your grandparents are coming. Oh, and can you help me in the garden on Sunday?"], ["Sam", "Sure. I'll cut the grass in the morning, but I can't do the afternoon – I have to study."], ["Mum", "That's fine. Thank you, love."]], "q": [["Who is Sam going to the match with?", "Arman", "his grandparents", "his mum"], ["What time does the match start?", "1 o'clock", "3 o'clock", "7 o'clock"], ["What does Sam think about the match?", "His team will win easily.", "His team probably won't win.", "It will be cancelled."], ["Who is coming for dinner?", "Arman", "his friends", "his grandparents"], ["What will Sam do on Sunday morning?", "cut the grass", "study", "play football"]]}, "s": {"focus": "will / won't for predictions, decisions, offers and promises; review of verb forms; adjectives + prepositions.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What do you think you'll do this evening?", "What are you good at? What are you interested in?", "Who will win the next World Cup, do you think?", "What are you worried about at the moment?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about how you think life will be different in 30 years.", "prompts": ["homes and transport", "work and school", "technology", "one thing that won't change"]}, {"name": "Role play", "mins": 2, "lead": "Teacher and student act out the situation on the card.", "card": "Your friend is moving house this weekend. The teacher is the friend.", "prompts": ["offer to help with three things", "make a promise", "make a prediction about the new home", "decide what you'll bring"]}]}});
TESTS.push({"id": "q7", "kind": "quick", "title": "Quick Test 7", "focus": "File 7: uses of the infinitive (with to), uses of the gerund (-ing), have to, don't have to, must, mustn't, verbs + infinitive, verbs + gerund, modifiers.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CACBABCAAB", "q": [["I'd like _____ a new language.", "learning", "learn", "to learn"], ["It's important _____ enough water.", "to drink", "drinking", "drink"], ["I went to the shop _____ some bread.", "for buy", "for buying", "to buy"], ["_____ is good for your health.", "To swimming", "Swimming", "Swim"], ["I'm thinking of _____ a new car.", "buying", "to buy", "buy"], ["She's good at _____ people's names.", "remember", "remembering", "to remember"], ["You _____ wear a uniform at our school. It's a rule.", "don't have to", "mustn't", "have to"], ["You _____ smoke in here. It's forbidden.", "mustn't", "must", "don't have to"], ["We _____ get up early tomorrow. It's Sunday.", "don't have to", "mustn't", "have to"], ["_____ she have to work at weekends?", "Has", "Does", "Must"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "AABCBCAACB", "q": [["I've decided _____ a gap year.", "to take", "take", "taking"], ["I enjoy _____ in the rain.", "walking", "walk", "to walk"], ["She stopped _____ when she was 30.", "to smoke", "smoking", "smoke"], ["Do you mind _____ the window?", "open", "to open", "opening"], ["I hope _____ you again soon.", "see", "to see", "seeing"], ["I forgot _____ the door.", "lock", "locking", "to lock"], ["The film was _____ boring. I fell asleep.", "incredibly", "a bit", "not very"], ["It's _____ cold today. Wear a hat.", "really", "a bit of", "not"], ["My English is _____ good, but not perfect.", "very much", "a lot", "quite"], ["I'm _____ tired – I only slept four hours.", "a little bit of", "extremely", "not at all"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "BBAAC", "q": [["m*u*stn't", "m*u*sic", "m*u*st"], ["h*a*ve", "h*a*te", "h*a*s"], ["*g*ym", "*g*et", "*g*ood"], ["in_cre_dibly", "incre_dib_ly", "_in_credibly"], ["ab_so_lutely", "_ab_solutely", "abso_lute_ly"]]}, "r": {"title": "School rules around the world", "k": "ABACB", "text": ["In Japan, students have to clean their classrooms every day. Schools don't have cleaners, because teachers think it's important to learn to look after your environment.", "In France, students don't have to go to school on Wednesday afternoons in many schools. Instead, they do sport or other activities.", "In Kazakhstan, many schools have a strict uniform. 'You mustn't wear trainers or jeans,' says Aruzhan, 14. 'And you have to stand up when the teacher comes in.'", "In Finland, children don't start school until they are seven, and they don't have to do much homework. But Finnish students are among the best in the world."], "q": [["Why do Japanese students clean their classrooms?", "to learn to look after the environment", "to earn money", "because they are punished"], ["What do many French students do on Wednesday afternoons?", "homework", "sport or other activities", "clean the school"], ["What mustn't Aruzhan wear?", "trainers or jeans", "a tie", "a uniform"], ["When do Finnish children start school?", "at six", "at five", "at seven"], ["What is true about Finnish students?", "They do a lot of homework.", "They're among the best in the world.", "They wear uniforms."]]}, "l": {"setting": "You will hear Kate asking Dias about his new job.", "k": "ABACB", "script": [["Kate", "So, Dias, how's the new job at the hotel?"], ["Dias", "It's good, but there are a lot of rules!"], ["Kate", "Like what?"], ["Dias", "Well, I have to wear a suit every day, and I mustn't use my phone at the reception desk."], ["Kate", "What time do you start?"], ["Dias", "At seven. But I don't have to work at weekends, which is great."], ["Kate", "Do you have to speak English?"], ["Dias", "Yes, all the time. Most guests are from abroad. I'm practising a lot."]], "q": [["Where does Dias work?", "in a hotel", "in a bank", "in a shop"], ["What does he have to wear?", "jeans", "a suit", "a uniform"], ["What mustn't he do at reception?", "use his phone", "speak Russian", "eat"], ["When doesn't he have to work?", "in the evenings", "on Mondays", "at weekends"], ["Why does he speak English a lot?", "He wants to.", "Most guests are from abroad.", "His boss is English."]]}, "s": {"focus": "infinitive and gerund, have to / must / mustn't, modifiers.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What do you enjoy doing at the weekend?", "What do you have to do every day?", "What would you like to learn this year?", "What are you thinking of doing next summer?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["What are three rules in your home or workplace?", "What do you think is the best way to learn a language? (Learning… / It's important to…)"]}]}});
TESTS.push({"id": "f7", "kind": "file", "title": "File Test 7", "focus": "File 7: uses of the infinitive (with to), uses of the gerund (verb + -ing), have to, don't have to, must, mustn't, verbs + infinitive, verbs + gerund, modifiers.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ABBCBBAACBBAACACBACC", "q": [["I need _____ to the bank.", "to go", "go", "going"], ["It's difficult _____ a job here.", "finding", "to find", "find"], ["I called her _____ her happy birthday.", "for wish", "to wish", "wishing"], ["I don't know what _____.", "saying", "say", "to say"], ["He promised _____ me with my homework.", "help", "to help", "helping"], ["_____ is my favourite sport.", "To run", "Running", "Run"], ["I'm not very good at _____.", "cooking", "to cook", "cook"], ["I'm looking forward to _____ you.", "seeing", "see", "to see"], ["After _____ lunch, we went for a walk.", "to have", "have", "having"], ["She left without _____ goodbye.", "to say", "saying", "say"], ["I can't stand _____ for buses.", "to wait", "waiting", "wait"], ["You _____ be 18 to vote in Kazakhstan.", "have to", "don't have to", "mustn't"], ["You _____ bring food. There's a café.", "don't have to", "have to", "mustn't"], ["You _____ touch that. It's very hot!", "don't have to", "have to", "mustn't"], ["I _____ go now. My train leaves in ten minutes.", "must", "don't have to", "mustn't"], ["Do you _____ work on Saturdays?", "has to", "must", "have to"], ["She _____ wear glasses for reading.", "have to", "has to", "must to"], ["We _____ to wait long for the doctor yesterday.", "didn't have", "mustn't", "haven't"], ["You _____ tell anyone. It's a secret.", "haven't to", "don't have to", "mustn't"], ["Students _____ use dictionaries in the exam. It's not allowed.", "have to", "don't have to", "mustn't"]]}, "v": {"parts": [[0, "Verbs + infinitive or gerund: choose the correct word."], [12, "Modifiers: choose the correct word."]], "k": "ABCCBCCBABABAACACABB", "q": [["I want _____ a doctor.", "to be", "be", "being"], ["Would you like _____ a drink?", "having", "to have", "have"], ["She finished _____ her essay at midnight.", "to write", "write", "writing"], ["I've decided _____ smoking.", "give up", "giving up", "to give up"], ["They hope _____ to Canada next year.", "move", "to move", "moving"], ["He spends hours _____ video games.", "to play", "play", "playing"], ["Have you ever tried _____ sushi?", "make", "made", "making"], ["I don't mind _____ the washing-up.", "do", "doing", "to do"], ["I'm learning _____ the guitar.", "to play", "playing", "play"], ["She refused _____ the bill.", "paying", "to pay", "pay"], ["I keep _____ my keys!", "forgetting", "to forget", "forget"], ["Remember _____ the lights when you go out.", "turning off", "to turn off", "turn off"], ["It's _____ hot. Let's go swimming.", "really", "not at all", "a little bit of"], ["The exam was _____ easy. Everybody passed.", "incredibly", "a bit", "not very"], ["I'm _____ hungry. I'll just have a sandwich.", "incredibly", "extremely", "a bit"], ["This road is _____ dangerous. Drive carefully.", "very", "a lot", "quite a"], ["The hotel was _____ nice, but not amazing.", "extremely", "really very", "quite"], ["It's _____ cold for July.", "a bit", "a bit of", "a little of"], ["He's _____ rich. He has three houses and a plane.", "quite a", "incredibly", "a bit"], ["I'm _____ sure. Can you check?", "not much", "not very", "very not"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "CCABBABCAA", "q": [["m*u*st", "m*u*stn't", "p*u*t"], ["*h*appy", "*h*ave", "*h*our"], ["h*a*ve", "w*ai*t", "h*a*te"], ["f*u*n", "r*u*le", "r*u*n"], ["*j*ob", "*g*o", "*g*ym"], ["ex_tre_mely", "extre_me_ly", "_ex_tremely"], ["incre_dib_ly", "in_cre_dibly", "_in_credibly"], ["dif_fi_cult", "diffi_cult_", "_dif_ficult"], ["re_mem_ber", "_re_member", "remem_ber_"], ["im_por_tant", "_im_portant", "impor_tant_"]]}, "r": {"title": "The rules of the road", "k": "BBCAA", "text": ["Driving rules are different in every country, and some of them are very strange.", "In Germany, you mustn't stop on the motorway – not even if your car runs out of petrol. If it happens, you'll have to pay a fine. On some parts of the German motorway there is no speed limit, so you don't have to drive slowly. But most drivers stay under 130 km/h.", "In Russia, you have to keep your car clean. If your car is very dirty, the police can give you a fine. In Japan, you mustn't splash people with water from puddles when you drive past – it's against the law.", "In Kazakhstan, everyone in the car has to wear a seat belt, and you mustn't use your phone while you're driving unless it's hands-free. 'Learning to drive here is not easy,' says Bolat, a driving instructor in Kostanay. 'You have to pass a computer test and a practical test. And in winter, you have to learn to drive on ice!'"], "q": [["What mustn't you do on a German motorway?", "drive fast", "stop", "use your phone"], ["Is there always a speed limit on German motorways?", "Yes, it's very low.", "No, not on some parts.", "Yes, it's 130 km/h."], ["Why can the police give you a fine in Russia?", "if you drive slowly", "if you stop", "if your car is very dirty"], ["What is against the law in Japan?", "splashing people with water", "washing your car", "driving at night"], ["According to Bolat, what do learners have to do in winter?", "learn to drive on ice", "stop driving", "take a third test"]]}, "l": {"setting": "You will hear an interview with a woman who works on a cruise ship.", "k": "BBACA", "script": [["Interviewer", "Sophie, what's it like working on a cruise ship?"], ["Sophie", "Amazing, but very hard. I work in the restaurant – twelve hours a day, seven days a week."], ["Interviewer", "Seven days? You don't have any days off?"], ["Sophie", "No. Our contracts are for six months, and you have to work every day. But then you have two months' holiday."], ["Interviewer", "Are there a lot of rules?"], ["Sophie", "Yes. Workers mustn't use the passenger swimming pools. And we have to wear our uniform all the time, even when we're not working."], ["Interviewer", "What do you enjoy most?"], ["Sophie", "Seeing new places. When we stop in a port, we don't have to work for a few hours, so I go sightseeing. Last month I visited Barcelona, Rome and Athens."], ["Interviewer", "Would you recommend the job?"], ["Sophie", "Yes, if you like meeting people and you aren't afraid of hard work!"]], "q": [["Where does Sophie work on the ship?", "at the swimming pool", "in the restaurant", "in the shop"], ["How long is her contract?", "two months", "six months", "twelve months"], ["What mustn't workers do?", "use the passenger pools", "go sightseeing", "take holidays"], ["When can she go sightseeing?", "in her holidays only", "on her days off", "when the ship stops in a port"], ["Who does she recommend the job to?", "people who like meeting people and hard work", "people who want to save money", "people who like swimming"]]}, "s": {"focus": "infinitive and gerund, verbs + infinitive / gerund, have to, don't have to, must, mustn't.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What do you have to do at work or school that you don't enjoy?", "What do you enjoy doing in your free time?", "What are you looking forward to?", "What would you like to stop doing?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about the rules in a place you know (your school, workplace, or a sports club).", "prompts": ["what you have to do", "what you mustn't do", "what you don't have to do", "which rule you agree or disagree with"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Should children have to do homework every day?", "Is it easy to learn to drive in Kazakhstan?", "What's more important: being good at something or enjoying it?"]}]}});
TESTS.push({"id": "q8", "kind": "quick", "title": "Quick Test 8", "focus": "File 8: should / shouldn't, if + present, will + infinitive (first conditional), possessive pronouns, get, confusing verbs, adverbs of manner.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BAACABCCAB", "q": [["You look tired. You _____ go to bed.", "shouldn't", "should", "must to"], ["You _____ eat so much sugar. It's bad for you.", "shouldn't", "should", "don't should"], ["_____ I call him or send a message?", "Should", "Will", "Do"], ["If it rains, we _____ the picnic.", "cancel", "cancelled", "'ll cancel"], ["If you _____ hard, you'll pass.", "study", "studied", "will study"], ["I won't go _____ you come with me.", "when not", "if", "unless not"], ["This isn't my bag. Is it _____?", "your", "you", "yours"], ["That car is _____. They bought it last week.", "them", "their", "theirs"], ["Whose phone is this? It's _____.", "hers", "her", "she"], ["If she _____ the bus, she'll be late.", "missed", "misses", "will miss"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CBBABCAACA", "q": [["I always _____ nervous before exams.", "do", "make", "get"], ["What time did you _____ home last night?", "arrive", "get", "go"], ["It's _____ dark. Let's go home.", "doing", "getting", "making"], ["I'm going to _____ a new phone.", "get", "have to", "do"], ["Can you _____ me your pen? I'll give it back.", "rent", "lend", "borrow"], ["I don't _____ anything about cars.", "meet", "learn", "know"], ["We _____ a lot of money on the holiday.", "spent", "wasted on", "paid"], ["He drives very _____. He's never had an accident.", "carefully", "careful", "careless"], ["She sang _____ – everyone loved it.", "beautiful", "beauty", "beautifully"], ["Please speak _____. The baby is asleep.", "quietly", "quite", "quiet"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "ABCAB", "q": [["sh*ou*lder", "sh*ou*ld", "w*ou*ld"], ["wh*ere*", "h*er*s", "th*eir*s"], ["*g*ood", "*g*et", "*g*ym"], ["_care_fully", "careful_ly_", "care_ful_ly"], ["beau_ti_fully", "_beau_tifully", "beauti_ful_ly"]]}, "r": {"title": "Advice from a grandmother", "k": "ABBCA", "text": ["My grandmother is 92 and she has given me a lot of advice in my life. Here are her three best tips.", "'You should always say thank you. If you're polite to people, they'll be polite to you.'", "'You shouldn't go to bed angry. If you have an argument with someone you love, talk about it before you sleep.'", "'Never lend money to friends unless you don't need it back! If you lend money, you'll lose the money and the friend.' I didn't listen to that last one. She was right."], "q": [["How old is the grandmother?", "92", "29", "82"], ["What should you always say?", "sorry", "thank you", "goodbye"], ["What shouldn't you do?", "argue with friends", "go to bed angry", "talk about problems"], ["What will happen if you lend money to friends?", "They'll pay you back.", "You'll be rich.", "You'll lose the money and the friend."], ["Did the writer follow the last piece of advice?", "No", "Yes", "We don't know"]]}, "l": {"setting": "You will hear Zara asking her friend for advice.", "k": "BBAAC", "script": [["Zara", "I need your advice. My boss has offered me a job in Almaty."], ["Friend", "That's great! Why do you need advice?"], ["Zara", "Well, it's more money, but I'll have to leave my family and friends."], ["Friend", "I think you should take it. If you don't, you'll always ask 'what if?'."], ["Zara", "Maybe. But if I go, I'll miss my grandmother. She's ill."], ["Friend", "You should talk to her. She'll probably tell you to go."], ["Zara", "You're right. I'll visit her this evening."]], "q": [["What has Zara's boss offered her?", "a new office", "a job in Almaty", "more holidays"], ["What is good about the job?", "more free time", "more money", "it's near her family"], ["What does her friend think she should do?", "take the job", "ask TESTS.push({"id": "f8", "kind": "file", "title": "File Test 8", "focus": "File 8: should / shouldn't, if + present, will + infinitive (first conditional), possessive pronouns, get, confusing verbs, adverbs of manner.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CBCACCABBACBABAACBBA", "q": [["You _____ see a doctor about that cough.", "ought", "shouldn't", "should"], ["You _____ drive when you're tired.", "should", "shouldn't", "not should"], ["I think we _____ leave now, or we'll be late.", "shouldn't", "must to", "should"], ["What do you think I _____ wear to the interview?", "should", "must to", "will"], ["_____ we bring anything to the party?", "Have", "Will", "Should"], ["If you _____ now, you'll catch the train.", "will leave", "left", "leave"], ["If it _____ tomorrow, we'll stay at home.", "snows", "will snow", "snowed"], ["I'll be angry if you _____ late again.", "will be", "are", "were"], ["If I see her, I _____ her the news.", "tell", "'ll tell", "told"], ["What will you do if you _____ the exam?", "fail", "failed", "will fail"], ["You won't get better unless you _____ the medicine.", "will take", "don't take", "take"], ["If you don't hurry, you _____ the bus.", "missed", "'ll miss", "miss"], ["This isn't my coat. Mine is blue. Is it _____?", "yours", "yours'", "your"], ["Those seats are _____. Please don't sit there.", "our", "ours", "us"], ["Is this pen his or _____?", "hers", "she's", "her"], ["My flat is smaller than _____.", "theirs", "them", "their"], ["A: Whose keys are these?\nB: They're _____.", "my", "me", "mine"], ["He drives _____. He's had three accidents.", "danger", "dangerously", "dangerous"], ["She speaks French very _____.", "goodly", "well", "good"], ["They worked _____ to finish on time.", "hard", "hardly", "hardy"]]}, "v": {"parts": [[0, "get: choose the correct word."], [8, "Confusing verbs: choose the correct word."]], "k": "ABAACBBACBACCBBACBAC", "q": [["I usually _____ up at seven.", "get", "have", "go"], ["Let's _____ a taxi to the station.", "do", "get", "make"], ["She _____ married last year.", "got", "went", "became"], ["I'm _____ hungry. What's for dinner?", "getting", "going", "doing"], ["Did you _____ my message?", "arrive", "take", "get"], ["We _____ lost in the old town.", "made", "got", "went"], ["They _____ to the airport two hours early.", "went", "got", "arrived"], ["He's _____ better after his operation.", "getting", "doing", "making"], ["Can I _____ your car this weekend?", "lend", "rent out", "borrow"], ["I'll _____ you some money. You can pay me back next week.", "pay", "lend", "borrow"], ["I didn't _____ anybody at the party.", "know", "learn", "meet"], ["I'd like to _____ your parents.", "know", "knowing", "meet"], ["The film was so sad that she _____.", "shouted", "laughed", "cried"], ["Don't _____ at me! I'm not deaf.", "cry", "shout", "speak"], ["Did you _____ the football match yesterday?", "see at", "watch", "look"], ["Can you _____ me the time, please?", "tell", "speak", "say"], ["Please _____ the plates on the table.", "bring up", "take", "put"], ["I'm going to _____ my driving test tomorrow.", "do it", "take", "make"], ["She can't _____ her glasses.", "find", "look", "search"], ["I need to _____ some money for my holiday.", "gain up", "win", "earn"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "ABCABAACBC", "q": [["y*ou*rs", "c*ou*ld", "sh*ou*ld"], ["h*i*s", "m*i*ne", "th*i*s"], ["*h*is", "*h*ers", "*h*ours"], ["m*ee*t", "sp*e*nd", "l*e*nd"], ["qu*i*te", "qu*i*ck", "qu*ie*tly"], ["_dan_gerously", "dange_rous_ly", "dan_ge_rously"], ["_care_lessly", "care_less_ly", "careless_ly_"], ["deter_mined_", "_de_termined", "de_ter_mined"], ["heavi_ly_", "_hea_vily", "hea_vi_ly"], ["_au_tomatically", "au_to_matically", "auto_ma_tically"]]}, "r": {"title": "Superstitions", "k": "BAABC", "text": ["A superstition is a belief that if you do something, something good or bad will happen. Most countries have them, and many people follow them – even if they say they don't believe in them!", "In Kazakhstan, people say that you shouldn't whistle inside the house, because if you do, you'll lose money. Also, you shouldn't shake hands over the doorway – it's believed to bring an argument.", "In Britain, if you see a black cat walk in front of you, it's lucky. But in many other countries, including the USA, it's unlucky! In Italy, the unlucky number is not 13 but 17, and many hotels don't have a room with that number.", "In Turkey, if your right hand itches, people say that you'll get some money soon. If your left hand itches, you'll spend it!", "Do superstitions work? Scientists say no – but they also say that people who believe they are lucky are often more relaxed and successful. So maybe it's not the superstition that matters, but how you feel."], "q": [["Why shouldn't you whistle inside in Kazakhstan?", "It's rude.", "You'll lose money.", "You'll have an argument."], ["What does a black cat mean in Britain?", "good luck", "bad luck", "money"], ["What is the unlucky number in Italy?", "17", "13", "7"], ["In Turkey, what happens if your left hand itches?", "You'll meet someone.", "You'll spend money.", "You'll get money."], ["What do scientists say about people who feel lucky?", "They believe in superstitions.", "They have more money.", "They're often more relaxed and successful."]]}, "l": {"setting": "You will hear Marat calling a radio programme for advice.", "k": "BCBAA", "script": [["Presenter", "Hello, Marat. What's your problem?"], ["Marat", "Hi. My neighbours are very noisy. They play loud music every night until two or three in the morning."], ["Presenter", "Oh dear. Have you talked to them?"], ["Marat", "Yes, twice. They said they'd stop, but they didn't."], ["Presenter", "OK. I think you should write them a polite letter. If you write everything down, it will be clearer for them."], ["Marat", "And if that doesn't work?"], ["Presenter", "Then you should talk to the building manager. And keep a diary of the nights when there's noise."], ["Marat", "Should I call the police?"], ["Presenter", "Only if it continues after that. If you call the police now, things will probably get worse."], ["Marat", "Thanks. I'll write the letter tonight."]], "q": [["What is Marat's problem?", "a broken door", "noisy neighbours", "his landlord"], ["Until what time do they play music?", "midnight", "1 a.m.", "2 or 3 a.m."], ["What does the presenter suggest first?", "calling the police", "writing a polite letter", "moving house"], ["Why shouldn't he call the police now?", "Things will probably get worse.", "It's too expensive.", "The police won't come."], ["What will Marat do tonight?", "write the letter", "talk to the manager", "call the police"]]}, "s": {"focus": "should, first conditional, possessive pronouns, get, confusing verbs, adverbs.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What should a visitor to your town see?", "What will you do if you have free time this weekend?", "Do you know any superstitions?", "Who's the best driver in your family? Why?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Give advice to a student who is starting at your school or job.", "prompts": ["what he / she should do on the first day", "what he / she shouldn't do", "what will happen if…", "one thing you wish someone had told you"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Should we listen to our parents' advice?", "Do you believe in luck?", "What's better: to borrow money from a bank or from friends?"]}]}});
TESTS.push({"id": "q9", "kind": "quick", "title": "Quick Test 9", "focus": "File 9: if + past, would + infinitive (second conditional), present perfect + for / since, present perfect or past simple?, animals, phobias and words related to fear, biographies.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACBACAACBB", "q": [["If I _____ a lot of money, I'd buy a house by the sea.", "had", "have", "would have"], ["What _____ you do if you saw a snake?", "did", "will", "would"], ["If she lived nearer, I _____ her more often.", "visit", "'d visit", "'ll visit"], ["I wouldn't do that if I _____ you.", "were", "would be", "am"], ["I've lived here _____ ten years.", "since", "from", "for"], ["She's worked at the bank _____ 2019.", "since", "ago", "for"], ["How long _____ you known Asel?", "have", "did", "do"], ["They _____ married for twenty years.", "were", "are", "'ve been"], ["He _____ to Japan three years ago.", "has gone", "went", "'s been"], ["I _____ my keys. I can't get in.", "lose", "'ve lost", "lost"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CACBCBABAA", "q": [["A _____ is a large animal with a very long neck.", "bear", "camel", "giraffe"], ["_____ make honey.", "Bees", "Mosquitoes", "Butterflies"], ["An eagle is a kind of _____.", "fish", "insect", "bird"], ["A dolphin is a very intelligent _____ animal.", "desert", "sea", "farm"], ["She's terrified _____ flying.", "from", "about", "of"], ["I'm _____ of the dark.", "scary", "scared", "scaring"], ["That film was really _____. I couldn't sleep.", "frightening", "frightened", "afraid"], ["He has a _____ of spiders. He can't be in the same room as one.", "terror", "phobia", "fear of"], ["She was born in 1950 and _____ in 2015.", "died", "death", "dead"], ["He _____ from university in 1998.", "graduated", "finished up", "ended"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "ABABC", "q": [["h*or*se",
