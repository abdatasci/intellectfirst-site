<html lang="en">

<title>KET Booster Arcade — 16 units</title>
<style>
:root{--navy:#14204A;--navy2:#22306A;--navy3:#2C3C80;--ice:#CADCFC;--gold:#C9A13A;--goldl:#E3C46A;--white:#fff;--green:#3FA55E;--red:#D9534F;--ink:#1B2340;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--navy:#0F1838;--navy2:#1C2858}}
:root[data-theme="dark"]{--navy:#0F1838;--navy2:#1C2858}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--navy);color:var(--white);font-family:Calibri,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;font-size:17px}
h1,h2,h3{font-family:Cambria,Georgia,"Times New Roman",serif;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:20px 18px 40px}
.top{display:flex;align-items:center;gap:12px}
.top svg{width:42px;height:48px;flex:none}
.brand{font-size:14px;color:var(--ice)}
.brand b{color:var(--goldl);display:block;font-size:16px}
button{font:inherit;cursor:pointer;border:none;border-radius:12px}
button:focus-visible{outline:3px solid var(--goldl);outline-offset:3px}
.hero{margin:28px 0 18px}
.hero h1{font-size:clamp(34px,7vw,56px);line-height:1.05}
.hero p{color:var(--ice);max-width:60ch;line-height:1.5}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}
.mode{background:var(--navy2);border-radius:18px;padding:22px;text-align:left;color:var(--white);border:2px solid transparent;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--goldl);transform:translateY(-2px)}
.mode .em{font-size:40px}
.mode h2{font-size:24px;margin:8px 0 6px;color:var(--goldl)}
.mode p{margin:0;color:var(--ice);line-height:1.45;font-size:15px}
.mode .best{margin-top:12px;font-size:13px;color:var(--goldl)}
label.nm{display:block;margin-top:20px;color:var(--ice);font-size:15px}
input.nm{margin-top:6px;width:100%;max-width:320px;padding:12px 14px;border-radius:12px;border:2px solid var(--navy3);background:var(--navy2);color:var(--white);font:inherit}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
.pill{background:var(--navy2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.pill.gold{background:var(--gold);color:var(--navy)}
.bar{height:12px;background:var(--navy2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--goldl),var(--gold));width:100%;transition:width .1s linear}
.bar.low i{background:var(--red)}
.tag{display:inline-block;background:var(--navy3);color:var(--goldl);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;margin-top:16px}
.q{font-family:Cambria,Georgia,serif;font-size:clamp(22px,4.2vw,30px);line-height:1.3;margin:12px 0 18px}
.opts{display:grid;gap:12px}
.opt{background:var(--white);color:var(--ink);text-align:left;padding:16px 18px;font-size:18px;display:flex;gap:12px;align-items:center;border:3px solid transparent}
.opt .k{background:var(--navy);color:var(--goldl);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.ok{background:#E3F4E8;border-color:var(--green)}
.opt.no{background:#FBE7E6;border-color:var(--red)}
.opt:disabled{cursor:default}
.fb{min-height:54px;margin-top:14px;color:var(--ice);line-height:1.45}
.fb b{color:var(--goldl)}
.pop{position:fixed;left:50%;top:28%;transform:translate(-50%,0);font-family:Cambria,Georgia,serif;font-size:44px;font-weight:700;color:var(--goldl);pointer-events:none;animation:pop .8s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}30%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.next{background:var(--gold);color:var(--navy);font-weight:700;padding:14px 22px;margin-top:8px}
.ghost{background:transparent;color:var(--ice);border:2px solid var(--navy3);padding:12px 18px}
.build{min-height:74px;background:var(--navy2);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:2px dashed var(--navy3)}
.build.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.tile{background:var(--white);color:var(--ink);font-weight:700;padding:12px 16px;font-size:19px;box-shadow:0 3px 0 var(--gold)}
.tile:hover{transform:translateY(-2px)}
.placed{background:var(--goldl);color:var(--navy);border-radius:10px;padding:10px 14px;font-weight:700;font-size:19px}
select.nm{display:block}
.clue{color:var(--ice);margin:8px 0 12px}
.result{text-align:center;margin-top:30px}
.result .big{font-family:Cambria,Georgia,serif;font-size:72px;color:var(--goldl);line-height:1}
.stars{font-size:40px;letter-spacing:6px;margin:10px 0}
.review{text-align:left;background:var(--navy2);border-radius:16px;padding:16px 18px;margin-top:20px}
.review li{margin:8px 0;line-height:1.4;color:var(--ice)}
.review li b{color:var(--white)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function show(id){["home","quiz","game","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pop(t){const d=document.createElement("div");d.className="pop";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
function name(){return ($("pname").value.trim()||"Player")}
function refreshBest(){if(typeof sel==="undefined")return;const q=store.get(bk("djd_q")),g=store.get(bk("djd_g"));$("bestQ").textContent=q?"Best on this device: "+q:"";$("bestG").textContent=g?"Best on this device: "+g:""}
const sel=document.getElementById("unit");sel.innerHTML='<option value="0">All units (mixed)</option>'+UNITS.map(u=>'<option value="'+u.n+'">Unit '+u.n+" — "+u.name+" ("+u.topics.join(", ")+")</option>").join("");
function pickQ(){const v=+sel.value;let qs=v?UNITS[v-1].quiz:shuffle(UNITS.flatMap(u=>u.quiz)).slice(0,20);return qs.map(q=>({t:v?UNITS[v-1].name:"Mixed",q:q[0],o:q[1],a:q[2],e:"Answer: <b>"+q[1][q[2]]+"</b>"}))}
function pickS(){const v=+sel.value;const src=v?UNITS[v-1].rush:UNITS.flatMap(u=>u.rush);return src.map(r=>[r[0],r[1],"Build the sentence"])}
function bk(k){return k+"_"+sel.value}
sel.onchange=refreshBest;
refreshBest();
let last="quiz";
/* QUIZ */
let qi,qs,score,streak,tick,tLeft,wrong,qList;
const QT=15;
function startQuiz(){last="quiz";qList=shuffle(pickQ());qi=0;score=0;streak=0;wrong=[];show("quiz");askQ()}
function askQ(){const q=qList[qi];$("qNum").textContent=(qi+1)+" / "+qList.length;$("qScore").textContent=score+" pts";$("qStreak").textContent="🔥 "+streak;
 $("qTag").textContent=q.t;$("qText").innerHTML=q.q;$("qFb").innerHTML="";$("qNext").classList.add("hidden");
 const box=$("qOpts");box.innerHTML="";
 q.o.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML='<span class="k">'+"ABCD"[i]+'</span><span>'+o+'</span>';b.onclick=()=>answer(i);box.appendChild(b)});
 tLeft=QT;updBar();clearInterval(tick);tick=setInterval(()=>{tLeft-=.1;updBar();if(tLeft<=0){clearInterval(tick);answer(-1)}},100)}
function updBar(){const w=Math.max(0,tLeft/QT*100);$("qBar").firstElementChild.style.width=w+"%";$("qBar").classList.toggle("low",tLeft<5)}
function answer(i){clearInterval(tick);const q=qList[qi];const btns=[...$("qOpts").children];btns.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");if(k===i&&i!==q.a)b.classList.add("no")});
 if(i===q.a){streak++;let pts=100+Math.round(tLeft*10);if(streak>=3)pts*=2;score+=pts;pop("+"+pts+(streak>=3?" 🔥x2":""));$("qFb").innerHTML="<b>Correct!</b> "+q.e}
 else{streak=0;wrong.push(q);$("qFb").innerHTML="<b>"+(i<0?"Time's up!":"Not quite.")+"</b> "+q.e}
 $("qScore").textContent=score+" pts";$("qStreak").textContent="🔥 "+streak;
 const n=$("qNext");n.textContent=qi<qList.length-1?"Next question":"See my score";n.classList.remove("hidden");n.focus()}
$("qNext").onclick=()=>{qi++;if(qi<qList.length)askQ();else endQuiz()};
function endQuiz(){const max=qList.length*300;const pct=score/max;const correct=qList.length-wrong.length;
 const best=+store.get(bk("djd_q"))||0;if(score>best)store.set(bk("djd_q"),score);refreshBest();
 finish(score,pct>.55?3:pct>.35?2:1,name()+", you got "+correct+" / "+qList.length+" correct."+(score>best?" New best score on this device!":""),wrong.map(q=>"<li><b>"+q.q.replace(/<[^>]+>/g,"")+"</b><br>"+q.o[q.a]+"</li>"))}
/* GAME */
let gs,gTimer,gT,gDone,gOrder,gPlaced,gTiles,gDeck;
function startGame(){last="game";gs=0;gDone=0;gT=60;gDeck=shuffle(pickS());show("game");nextSent();clearInterval(gTimer);
 gTimer=setInterval(()=>{gT-=.1;$("gTime").textContent="⏱ "+Math.ceil(Math.max(0,gT))+"s";$("gBar").firstElementChild.style.width=Math.max(0,Math.min(100,gT/60*100))+"%";$("gBar").classList.toggle("low",gT<10);if(gT<=0){clearInterval(gTimer);endGame()}},100)}
function nextSent(){if(!gDeck.length)gDeck=shuffle(pickS());const s=gDeck.pop();gOrder=s[0].split(" ");gPlaced=[];$("gClue").textContent=s[2]+" — tap the words in order. One word doesn't belong!";
 gTiles=shuffle(gOrder.concat([s[1]]).map((w,i)=>({w,id:i})));renderG()}
function renderG(){$("gBuild").innerHTML=gPlaced.length?gPlaced.map(w=>'<span class="placed">'+w+'</span>').join(""):'<span style="color:var(--ice)">Your sentence appears here…</span>';
 const t=$("gTiles");t.innerHTML="";gTiles.forEach(o=>{const b=document.createElement("button");b.className="tile";b.textContent=o.w;b.onclick=()=>tap(o,b);t.appendChild(b)});
 $("gDone").textContent="✅ "+gDone;$("gScore").textContent=gs+" pts"}
function tap(o,b){const need=gOrder[gPlaced.length];if(o.w===need){gPlaced.push(o.w);gTiles=gTiles.filter(x=>x!==o);gs+=10;
  if(gPlaced.length===gOrder.length){gDone++;gs+=50;gT=Math.min(60,gT+5);pop("+60 ⏱+5s");renderG();setTimeout(nextSent,450);return}renderG()}
 else{gT-=2;const bd=$("gBuild");bd.classList.remove("shake");void bd.offsetWidth;bd.classList.add("shake");pop("−2s")}}
$("gUndo").onclick=()=>{if(!gPlaced.length)return;const w=gPlaced.pop();gTiles.push({w,id:Math.random()});gs=Math.max(0,gs-10);renderG()};
$("gSkip").onclick=()=>{gT-=5;nextSent()};
function endGame(){const best=+store.get(bk("djd_g"))||0;if(gs>best)store.set(bk("djd_g"),gs);refreshBest();
 finish(gs,gDone>=6?3:gDone>=3?2:1,name()+", you built "+gDone+" sentence"+(gDone===1?"":"s")+"."+(gs>best?" New best score on this device!":""),[])}
function finish(sc,st,msg,rev){show("result");$("rScore").textContent=sc;$("rStars").textContent="★".repeat(st)+"☆".repeat(3-st);
 $("rTitle").textContent=st===3?"Superstar!":st===2?"Great work!":"Good try — play again!";$("rMsg").textContent=msg;
 const r=$("rReview");if(rev.length){r.innerHTML="<h3 style='color:var(--goldl)'>Review these</h3><ul>"+rev.join("")+"</ul>";r.classList.remove("hidden")}else r.classList.add("hidden")}
$("goQuiz").onclick=startQuiz;$("goGame").onclick=startGame;
$("rAgain").onclick=()=>last==="quiz"?startQuiz():startGame();$("rHome").onclick=()=>{clearInterval(tick);clearInterval(gTimer);show("home")};
</script>
