<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><script src="/tg.js"></script><script src="/if-runtime.js"></script></head><body>
<title>PET Test Centre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: sticky exam bar + single reading column (max 980px); papers read like a Cambridge answer booklet. */
:root{
  --navy:#14213D; --navy-2:#22335C; --gold:#C9A227; --gold-deep:#8A6A08;
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#EEF4FB; --tint:#DCE8F5;
  --ink:#16213A; --muted:#56627A; --line:#D3DDEA; --on-navy:#FFFFFF; --on-gold:#14213D;
  --ok:#23784A; --ok-bg:#E3F3EA; --bad:#B03A2E; --bad-bg:#FBE9E6; --warn:#9A6A00;
  --f-head:"Caladea", Cambria, Georgia, "Times New Roman", serif;
  --f-body:"Carlito", Calibri, "Segoe UI", system-ui, sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,33,61,.06), 0 6px 18px rgba(20,33,61,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1528; --surface:#15213D; --surface-2:#1B2A4C; --tint:#223560; --ink:#E9EEF7; --muted:#A3B1CB; --line:#2B3D66;
  --gold:#D8B444; --gold-deep:#E3C46A; --ok:#5CC08A; --ok-bg:#163A2A; --bad:#F08A7C; --bad-bg:#3D1F1C; --warn:#E3C46A; --navy-2:#2A3F6E; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1528; --surface:#15213D; --surface-2:#1B2A4C; --tint:#223560; --ink:#E9EEF7; --muted:#A3B1CB; --line:#2B3D66;
  --gold:#D8B444; --gold-deep:#E3C46A; --ok:#5CC08A; --ok-bg:#163A2A; --bad:#F08A7C; --bad-bg:#3D1F1C; --warn:#E3C46A; --navy-2:#2A3F6E; color-scheme:dark }
*{box-sizing:border-box}
html{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5; min-height:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--navy); z-index:30}
h1,h2,h3,h4{font-family:var(--f-head); line-height:1.2; margin:0; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit; text-decoration-color:var(--gold); text-underline-offset:3px}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.wrap{max-width:1000px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--navy); color:var(--on-navy); border-bottom:3px solid var(--gold)}
.bar .wrap{display:flex; align-items:center; gap:14px; padding-block:10px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; background:none; border:0; color:inherit; padding:0; text-align:left}
.brand img{width:34px; height:auto}
.brand b{display:block; font-family:var(--f-head); font-size:19px; letter-spacing:.01em}
.brand small{display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#E3C46A}
.nav{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap}
.nav button{background:transparent; border:0; color:#CFDAEE; padding:7px 11px; border-radius:8px; font-size:15px}
.nav button[aria-current="page"], .nav button:hover{background:rgba(255,255,255,.1); color:#fff}
.examstrip{display:flex; gap:10px; align-items:center; flex-wrap:wrap; width:100%; border-top:1px solid rgba(255,255,255,.14); padding-top:8px}
.examstrip .ttl{font-family:var(--f-head); font-size:17px}
.clock{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:700; background:var(--gold); color:var(--on-gold); padding:4px 12px; border-radius:999px; font-size:16px}
.clock.low{background:#E05A4A; color:#fff}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:3px 10px; border-radius:999px; background:var(--surface-2); color:var(--muted); font-weight:700; letter-spacing:.02em}
.bar .pill{background:rgba(255,255,255,.12); color:#E3EAF7}

main{padding-block:22px 60px}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-deep)}
.lead{color:var(--muted); max-width:62ch}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px; box-shadow:var(--shadow); min-width:0}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.stack{display:flex; flex-direction:column; gap:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.hidden{display:none!important}

.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:10px 16px; border-radius:9px; font-weight:700; font-size:16px; display:inline-flex; align-items:center; gap:8px; justify-content:center}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold); color:var(--on-gold); border-color:var(--gold)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.navy{background:var(--navy); color:#fff; border-color:var(--navy)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad); border-color:var(--bad)}
.btn.sm{padding:6px 11px; font-size:14px}
.btn:disabled{opacity:.5; cursor:default}

.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field label{font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.input, select.input, textarea.input{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 12px; width:100%; min-width:0}
textarea.input{min-height:220px; line-height:1.6; resize:vertical}

/* home */
.hero{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:stretch}
@media (max-width:760px){ .hero{grid-template-columns:1fr} }
.hero h1{font-size:clamp(30px,5vw,44px); color:var(--ink); margin-top:6px}
.hero .who{background:var(--navy); color:#fff; border-color:var(--navy)}
.hero .who label{color:#C9D6EA}
.hero .who .input{background:#1E2D52; border-color:#33467A; color:#fff}
.candno{font-family:var(--f-head); font-size:22px; color:#E3C46A; font-variant-numeric:tabular-nums}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:transparent; padding:8px 14px; font-weight:700; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy); color:#fff}
.papers{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-top:12px}
.paper{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; border:1px solid var(--line); background:var(--surface-2); border-radius:9px; padding:12px 14px}
.paper:hover{border-color:var(--gold)}
.paper b{font-family:var(--f-head); font-size:19px}
.paper span{font-size:14px; color:var(--muted)}
.paper.speak{background:var(--navy); color:#fff; border-color:var(--navy)}
.paper.speak span{color:#C9D6EA}
.studiocard{background:linear-gradient(135deg,var(--navy) 0%, var(--navy-2) 100%); color:#fff; border:0}
.studiocard .lead{color:#C9D6EA}
.studiocard h2{font-size:28px}

.overview{width:100%; border-collapse:collapse; font-size:15px}
.overview th,.overview td{padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
.overview th{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.tablebox{overflow-x:auto}

/* paper */
.parttabs{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 18px}
.parttabs a{text-decoration:none; color:var(--ink); border:1px solid var(--line); background:var(--surface); padding:5px 12px; border-radius:999px; font-size:14px; font-weight:700}
.parttabs a .c{color:var(--muted); font-weight:400}
.part{scroll-margin-top:130px; margin-bottom:26px}
.parthead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--navy); padding-bottom:6px; margin-bottom:14px}
:root[data-theme="dark"] .parthead{border-color:var(--gold)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .parthead{border-color:var(--gold)} }
.parthead h2{font-size:24px}
.instr{font-style:italic; color:var(--muted); margin:0 0 14px}
.qn{flex:none; width:30px; height:30px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .qn{background:var(--gold); color:var(--on-gold)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .qn{background:var(--gold); color:var(--on-gold)} }
.q{display:flex; gap:12px; align-items:flex-start; padding:14px 0; border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q > div{flex:1; min-width:0}
.notice{border:2px solid var(--ink); border-radius:6px; padding:12px 14px; white-space:pre-line; font-weight:700; background:var(--surface); max-width:440px; text-align:center}
.message{border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:12px 14px; white-space:pre-line; background:var(--tint); max-width:440px}
.opts{display:flex; flex-direction:column; gap:6px; margin-top:10px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 12px; width:100%}
.opt .lz{flex:none; width:26px; height:26px; border-radius:50%; border:2px solid var(--muted); display:grid; place-items:center; font-weight:700; font-size:13px; color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--navy); background:var(--surface-2)}
.opt[aria-pressed="true"] .lz{background:var(--navy); border-color:var(--navy); color:#fff}
:root[data-theme="dark"] .opt[aria-pressed="true"] .lz{background:var(--gold); border-color:var(--gold); color:var(--on-gold)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .opt[aria-pressed="true"] .lz{background:var(--gold); border-color:var(--gold); color:var(--on-gold)} }
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt:disabled{cursor:default}
.pics{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:10px; max-width:460px}
.pic{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative}
.pic .em{font-size:34px; line-height:1}
.pic .lt{position:absolute; top:5px; left:7px; font-weight:700; font-size:13px; color:var(--muted)}
.pic small{font-size:13px; color:var(--muted); text-align:center}
.pic[aria-pressed="true"]{border:2px solid var(--navy); background:var(--surface-2)}
:root[data-theme="dark"] .pic[aria-pressed="true"]{border-color:var(--gold)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pic[aria-pressed="true"]{border-color:var(--gold)} }
.pic.right{border:2px solid var(--ok); background:var(--ok-bg)}
.pic.wrong{border:2px solid var(--bad); background:var(--bad-bg)}

.two{display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media (max-width:760px){ .two{grid-template-columns:1fr} }
.textbox{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px 18px}
.textbox h3{font-size:22px; margin-bottom:4px}
.textbox p{margin:0 0 10px}
.ad{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface)}
.ad b{font-family:var(--f-head)}
.people .q{align-items:center}
.sel{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 10px; min-width:76px; font-weight:700}
.sel.right{border-color:var(--ok); background:var(--ok-bg)} .sel.wrong{border-color:var(--bad); background:var(--bad-bg)}
.gap{display:inline-flex; align-items:center; gap:4px; vertical-align:baseline}
.gap .gn{font-size:12px; font-weight:700; background:var(--navy); color:#fff; border-radius:4px; padding:0 5px}
:root[data-theme="dark"] .gap .gn{background:var(--gold); color:var(--on-gold)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .gap .gn{background:var(--gold); color:var(--on-gold)} }
.gap input, .gap select{border:0; border-bottom:2px solid var(--muted); background:transparent; width:110px; padding:0 4px; font-weight:700; border-radius:0}
.gap select{width:auto}
.gap input.right, .gap select.right{border-color:var(--ok); color:var(--ok)}
.gap input.wrong, .gap select.wrong{border-color:var(--bad); color:var(--bad)}
.fix{font-size:13px; color:var(--ok); font-weight:700}
.cloze{line-height:2.3}
.sents{display:grid; gap:6px}
.sents div{display:flex; gap:10px} .sents b{color:var(--gold-deep)}
.sticky-foot{position:sticky; bottom:0; padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent, var(--bg) 30%); z-index:5}
.confirm{border:1px solid var(--gold); background:var(--surface); border-radius:10px; padding:12px 14px}

/* listening */
.player{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px}
.player .btn{padding:7px 13px; font-size:15px}
.wave{display:inline-flex; gap:3px; align-items:flex-end; height:18px}
.wave i{width:3px; background:var(--gold); border-radius:2px; height:30%}
.playing .wave i{animation:w 0.9s infinite ease-in-out}
.playing .wave i:nth-child(2){animation-delay:.15s}.playing .wave i:nth-child(3){animation-delay:.3s}.playing .wave i:nth-child(4){animation-delay:.45s}
@keyframes w{0%,100%{height:25%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){ .playing .wave i{animation:none; height:70%} }
.script{background:var(--surface-2); border-radius:8px; padding:10px 14px; font-size:15px; margin-top:10px}
.script p{margin:4px 0}
.notes{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px 18px}
.notes h3{font-size:20px; margin-bottom:6px}
.notes .q{padding:9px 0}

/* writing */
.email{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.email .hdr{background:var(--surface-2); padding:8px 14px; font-size:14px; color:var(--muted); border-bottom:1px solid var(--line)}
.email .ln{display:grid; grid-template-columns:1fr 170px; gap:12px; padding:6px 14px; align-items:center; white-space:pre-line}
@media (max-width:560px){ .email .ln{grid-template-columns:1fr} }
.email .note{color:#B03A2E; font-weight:700; font-style:italic; border-left:3px solid var(--gold); padding-left:8px}
:root[data-theme="dark"] .email .note{color:#F08A7C}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .email .note{color:#F08A7C} }
.wc{font-variant-numeric:tabular-nums; font-weight:700; font-size:14px}
.wc.ok{color:var(--ok)} .wc.low{color:var(--warn)} .wc.high{color:var(--bad)}
.check{display:flex; gap:8px; align-items:flex-start; font-size:15px}
.choice{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:560px){ .choice{grid-template-columns:1fr} }
.choice button{text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:12px 14px}
.choice button[aria-pressed="true"]{border:2px solid var(--gold); background:var(--surface-2)}
.choice .big{font-family:var(--f-head); font-weight:700; font-size:17px; display:block}
.choice .small{display:block; font-size:14px; color:var(--muted)}
.choice .eyebrow{display:block}

/* results */
.score{display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center}
@media (max-width:560px){ .score{grid-template-columns:1fr} }
.dial{width:150px; height:150px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--gold) calc(var(--p)*1%), var(--tint) 0); }
.dial div{width:118px; height:118px; border-radius:50%; background:var(--surface); display:grid; place-items:center; text-align:center}
.dial b{font-family:var(--f-head); font-size:34px; display:block; line-height:1}
.dial small{color:var(--muted); font-size:13px}
.bars{display:grid; gap:8px}
.barrow{display:grid; grid-template-columns:70px 1fr 54px; gap:10px; align-items:center; font-size:14px}
.barrow .tr{height:10px; background:var(--tint); border-radius:99px; overflow:hidden}
.barrow .tr i{display:block; height:100%; background:var(--navy)}
:root[data-theme="dark"] .barrow .tr i{background:var(--gold)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .barrow .tr i{background:var(--gold)} }
.barrow span:last-child{text-align:right; font-variant-numeric:tabular-nums}
.band{display:inline-block; padding:3px 10px; border-radius:6px; font-weight:700; font-size:14px}
.band.A{background:#1F6F45; color:#fff}.band.B{background:#2E6DA4; color:#fff}.band.C{background:#5B6FA8; color:#fff}.band.A2{background:#9A6A00; color:#fff}.band.low{background:#8C3A2E; color:#fff}.band.pending{background:var(--surface-2); color:var(--muted)}
.slip{border:2px dashed var(--gold); border-radius:10px; padding:14px; background:var(--surface)}
.code{font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:12px; word-break:break-all; background:var(--surface-2); padding:10px; border-radius:6px; max-height:120px; overflow:auto; user-select:all}

/* speaking */
.stage{background:var(--navy); color:#fff; border-radius:14px; padding:22px; display:flex; flex-direction:column; gap:16px; min-height:420px}
.stage .who{display:inline-flex; gap:8px; align-items:center; background:rgba(255,255,255,.1); padding:4px 12px; border-radius:999px; font-weight:700; font-size:14px; align-self:flex-start}
.stage .who i{width:10px; height:10px; border-radius:50%; background:var(--gold); display:inline-block}
.stage h2{font-size:clamp(24px,4vw,36px); color:#fff}
.stage .lead{color:#C9D6EA}
.stage .btn{border-color:#33467A; background:#1E2D52; color:#fff}
.stage .btn.primary{background:var(--gold); color:#14213D; border-color:var(--gold)}
.ring{--p:100; width:92px; height:92px; border-radius:50%; background:conic-gradient(#E3C46A calc(var(--p)*1%), rgba(255,255,255,.12) 0); display:grid; place-items:center; flex:none}
.ring div{width:74px; height:74px; border-radius:50%; background:var(--navy); display:grid; place-items:center; font-family:var(--f-head); font-size:24px; font-variant-numeric:tabular-nums}
.stage > .photo{max-width:640px}
.photo{border-radius:10px; overflow:hidden; background:#fff; aspect-ratio:3/2; max-width:100%; width:100%}
.photo svg{display:block; width:100%; height:100%}
.optgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:560px){ .optgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.optgrid > *{background:#fff; color:#14213D; border-radius:12px; padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; border:2px solid transparent; font-weight:700; font-size:15px}
.optgrid .em{font-size:38px; line-height:1}
.optgrid button[aria-pressed="true"]{border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,.35)}
.stepper{display:flex; gap:4px}
.stepper i{height:5px; flex:1; border-radius:3px; background:rgba(255,255,255,.18)}
.stepper i.on{background:#E3C46A}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.tabs button{border:1px solid var(--line); background:var(--surface); padding:8px 14px; border-radius:999px; font-weight:700; font-size:15px}
.tabs button[aria-selected="true"]{background:var(--navy); color:#fff; border-color:var(--navy)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--surface); padding:5px 12px; border-radius:999px; font-size:14px}
.chip[aria-pressed="true"]{background:var(--gold); color:var(--on-gold); border-color:var(--gold); font-weight:700}
.stage .chip{background:#1E2D52; border-color:#33467A; color:#fff}
.stage .chip[aria-pressed="true"]{background:var(--gold); color:#14213D}
.are{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.are div{background:rgba(255,255,255,.08); border-radius:10px; padding:10px; font-size:14px; color:#C9D6EA}
.are b{display:block; font-family:var(--f-head); font-size:22px; color:#E3C46A}
.thumbs{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px}
@media (max-width:560px){ .thumbs{grid-template-columns:repeat(2,minmax(0,1fr))} }
.thumbs button{padding:0; border:2px solid transparent; border-radius:8px; overflow:hidden; background:none}
.thumbs button[aria-pressed="true"]{border-color:var(--gold)}
.thumbs svg{display:block; width:100%; height:auto}
.phr{columns:2 260px; gap:16px}
.phr .card{break-inside:avoid; margin-bottom:14px; padding:14px 16px}
.phr ul{margin:6px 0 0; padding-left:18px}
.big-n{font-family:var(--f-head); font-size:44px; line-height:1; color:#E3C46A; font-variant-numeric:tabular-nums}

/* teacher */
.tbl{width:100%; border-collapse:collapse; font-size:15px}
.tbl th,.tbl td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap}
.tbl th{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); position:sticky; top:0; background:var(--surface)}
.tbl td.num{font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:var(--surface-2)}
.crit{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; font-size:15px}
.crit select{width:70px}
.status{font-size:14px; padding:8px 12px; border-radius:8px; background:var(--surface-2)}
.empty{padding:26px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:10px}
.aiout{white-space:pre-wrap; font-size:15px; background:var(--surface-2); border-radius:8px; padding:12px}
footer{color:var(--muted); font-size:13px; padding-block:20px 30px; border-top:1px solid var(--line)}

    p3: {
      title: "Saturdays at the shelter",
      byline: "by Zarina, 14",
      text: [
        "When my parents said no to a dog for the fifth time, my aunt had an idea. ‘If you really love animals,’ she said, ‘why don't you help the ones who need it most?’ She's a vet, and she knew the animal shelter near our town was looking for young volunteers.",
        "I'll be honest: on my first Saturday I nearly went home after an hour. Nobody had told me that most of the job is cleaning. I spent the whole morning washing bowls and sweeping floors, and I didn't even touch a dog. The manager, Mrs Bekova, noticed my face. ‘Everyone starts with the boring jobs,’ she said kindly. ‘The animals need to trust you first.’",
        "She was right. By my third month I was taking dogs for walks and helping to feed the cats. My favourite was an old grey dog called Bars. He was afraid of everyone when he arrived, and for weeks he hid in the corner of his cage. I started sitting next to him and reading my school books out loud. One day he put his head on my knee, and I almost cried.",
        "Volunteering has changed me more than I expected. I used to be very shy at school, but now I talk to visitors every week, explaining which animals need homes. My teachers say I'm much more confident in class discussions, too.",

      ],
      qs: [

function setStrip(title, sub) {

function startClock(minutes, onEnd) {
  const t0 = Date.now(), limit = S.mode === "exam" && minutes ? minutes * 60 : null;
  const tick = () => {
    const el = $("#clock"); if (!el) return;
    const used = (Date.now() - t0) / 1000;
    if (limit) { const left = limit - used; el.textContent = fmt(left) + " left"; el.classList.toggle("low", left < 300); if (left <= 0) { clearTimer(); onEnd && onEnd(); } }
    else el.textContent = fmt(used) + " practice";
  };
  tick(); S.timer = setInterval(tick, 1000);
  return () => Math.round((Date.now() - t0) / 1000);
}

/* ---------- shared answer widgets ---------- */
function optList(qi, opts, ans) {
  return `<div class="opts" role="group">${opts.map((o, i) => `<button class="opt" data-q="${qi}" data-v="${L(i)}" aria-pressed="${ans[qi] === L(i)}"><span class="lz">${L(i)}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
}
function bindOpts(ans, onChange) {
  $$(".opt[data-q], .pic[data-q]").forEach(b => b.addEventListener("click", () => {
    if (b.disabled) return;
    const q = +b.dataset.q; ans[q] = b.dataset.v;

    onChange && onChange();
  }));
  $$("select[data-q], input[data-q]").forEach(el => el.addEventListener("input", () => { ans[+el.dataset.q] = el.value; onChange && onChange(); }));
}
function finishBar(label, count, total) {

}
function askFinish(unanswered, done) {

/* ---------- LISTENING ---------- */
function listening(tid) {
  const T = TESTS[tid], Li = T.listening, ans = Array(25).fill(""), exam = S.mode === "exam";
  const recs = [];
  setStrip(T.title + " · Listening", "4 parts · 25 questions · you hear each recording twice");
  const player = (ri, label) => `<div class="player" data-rec="${ri}"><button class="btn navy" data-play="${ri}">▶ ${label}</button><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="small muted" data-st="${ri}">${exam ? "Plays twice" : "Practice: replay any time"}</span></div>`;
  let h = TTS.ok ? "" : `<div class="card" style="border-color:var(--bad)"><b>This browser can't read the recordings aloud.</b> Open the test in Chrome, Edge or Safari, or ask your teacher to read the scripts.</div>`;
  h += `<nav class="parttabs">${["1–7", "8–13", "14–19", "20–25"].map((r, i) => `<a href="#lp${i + 1}">Part ${i + 1} <span class="c">${r}</span></a>`).join("")}</nav>`;
  h += `<section class="part" id="lp1"><div class="parthead"><span class="eyebrow">Questions 1–7</span><h2>Part 1</h2></div><p class="instr">For each question, choose the correct answer.</p>`;
  Li.p1.forEach((q, i) => { const ri = recs.push(q) - 1; h += `<div class="q"><span class="qn">${i + 1}</span><div><b>${esc(q.q)}</b><div class="pics" role="group">${q.opts.map((o, k) => `<button class="pic" data-q="${i}" data-v="${L(k)}" aria-pressed="false"><span class="lt">${L(k)}</span><span class="em" aria-hidden="true">${o.e}</span><small>${esc(o.l)}</small></button>`).join("")}</div>${player(ri, "Play")}<div class="script hidden" data-script="${ri}"></div></div></div>`; });
  h += `</section><section class="part" id="lp2"><div class="parthead"><span class="eyebrow">Questions 8–13</span><h2>Part 2</h2></div><p class="instr">For each question, choose the correct answer.</p>`;
  Li.p2.forEach((q, i) => { const n = 7 + i, ri = recs.push(q) - 1; h += `<div class="q"><span class="qn">${n + 1}</span><div><span class="muted">${esc(q.intro)}</span><br><b>${esc(q.q)}</b>${optList(n, q.opts, ans)}${player(ri, "Play")}<div class="script hidden" data-script="${ri}"></div></div></div>`; });
  const p3 = Li.p3, r3 = recs.push(p3) - 1;
  h += `</section><section class="part" id="lp3"><div class="parthead"><span class="eyebrow">Questions 14–19</span><h2>Part 3</h2></div><p class="instr">${esc(p3.intro)} For each question, write the correct answer in the gap. Write one or two words or a number or a date or a time.</p><div class="notes"><h3>${esc(p3.title)}</h3>`;
  p3.notes.forEach((n, i) => { const qi = 13 + i; h += `<div class="q"><span class="qn">${qi + 1}</span><div>${esc(n[0])} <span class="gap"><input data-q="${qi}" aria-label="Question ${qi + 1}" autocomplete="off" spellcheck="false"></span> ${esc(n[2])}</div></div>`; });
  h += `${player(r3, "Play Part 3")}<div class="script hidden" data-script="${r3}"></div></div></section>`;
  const p4 = Li.p4, r4 = recs.push(p4) - 1;
  h += `<section class="part" id="lp4"><div class="parthead"><span class="eyebrow">Questions 20–25</span><h2>Part 4</h2></div><p class="instr">${esc(p4.intro)} For each question, choose the correct answer.</p>${player(r4, "Play Part 4")}<div class="script hidden" data-script="${r4}"></div>`;
  p4.qs.forEach((q, i) => { const n = 19 + i; h += `<div class="q"><span class="qn">${n + 1}</span><div><b>${esc(q.q)}</b>${optList(n, q.opts, ans)}</div></div>`; });
  h += `</section>` + finishBar("Finish Listening", 0, 25);
  app.innerHTML = h;
  const upd = () => $("#answered").textContent = ans.filter(Boolean).length + " of 25 answered";

  $$("[data-play]").forEach(b => b.addEventListener("click", async () => {
    const ri = +b.dataset.play, box = b.closest(".player"), st = $(`[data-st="${ri}"]`);

    const done = await TTS.play(recs[ri], exam ? 2 : 1, t => st.textContent = exam ? `Playing · ${t} of 2` : "Playing");
    box.classList.remove("playing");
    if (exam) { b.textContent = done ? "✓ Played" : "▶ Play"; b.disabled = done; if (!done) plays[ri] = false; st.textContent = done ? "Finished" : "Stopped – you can start again"; }
    else { b.textContent = "▶ Play again"; st.textContent = "Practice: replay any time"; }
  }));
  const used = startClock(null);
  function submit() { clearTimer(); TTS.stop(); go("result", { tid, p: "L", ans, secs: used() }); }
  $("#finish").onclick = () => askFinish(ans.filter(a => !a).length, submit);

/* ---------- RESULT (after a paper) ---------- */
function result(r) {
  const T = TESTS[r.tid];
  const sl = { v: 1, n: S.cand.name, g: S.cand.group, c: S.cand.no, t: r.tid, p: r.p, d: Date.now(), s: r.secs };
  let sc = null;
  if (r.p === "W") sl.w = r.w; else { sl.a = r.ans; sc = score(r.tid, r.p, r.ans); }

function copyText(text, el, msg) {

function speakingSteps(Sp, n) {
  const st = [];
  st.push({ part: 1, who: "both", text: "Good morning. Can I have your mark sheets, please? I'm your examiner. Let's start.", secs: 0 });
  Sp.p1.phase1.forEach(q => { st.push({ part: 1, who: "A", text: q, secs: 15 }); st.push({ part: 1, who: "B", text: q, secs: 15 }); });
  st.push({ part: 1, who: "A", text: Sp.p1.phase2[0], secs: 30 }, { part: 1, who: "A", text: Sp.p1.phase2[1], secs: 30 }, { part: 1, who: "B", text: Sp.p1.phase2[2], secs: 30 }, { part: 1, who: "B", text: Sp.p1.phase2[3], secs: 30 });
  st.push({ part: 2, who: "A", text: "Now, I'm going to show each of you a photograph, and I'd like you to talk about it. " + Sp.p2.A.prompt, scene: Sp.p2.A.scene, secs: 60 });
  st.push({ part: 2, who: "B", text: Sp.p2.B.prompt, scene: Sp.p2.B.scene, secs: 60 });
  st.push({ part: 3, who: "both", text: "Now, in this part of the test you're going to talk about something together. " + Sp.p3.situation + " " + Sp.p3.task + " All right? Now, talk together.", opts: Sp.p3.opts, secs: 150 });
  Sp.p4.forEach((q, i) => st.push({ part: 4, who: i % 2 ? "B" : "A", text: q, secs: 40 }));
  st.push({ part: 5, who: "both", text: "Thank you. That is the end of the test.", secs: 0 });
  return st;
}
function runSpeaking(tid, names, voice) {
  const Sp = TESTS[tid].speaking, steps = speakingSteps(Sp, names); let i = 0, left = 0, total = 0, paused = false;
  const draw = () => {
    clearTimer(); TTS.stop();
    const s = steps[i];
    if (s.part === 5) return speakEnd(tid, names);
    const who = s.who === "both" ? `${names.A} & ${names.B}` : names[s.who];
    app.innerHTML = `<section class="stage">
      <div class="stepper">${steps.slice(0, -1).map((x, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div>

      ${s.opts ? `<div class="optgrid">${s.opts.map(o => `<div><span class="em" aria-hidden="true">${o.e}</span>${esc(o.l)}</div>`).join("")}</div>` : ""}
      ${s.part === 1 && s.secs >= 30 ? `<p class="lead" style="margin:0">Give a full answer: say what, then why, then an example.</p>` : ""}
      ${s.part === 3 ? `<div class="chips">${["What about…?", "That's a good idea, because…", "I'm not sure about that.", "Which one shall we choose?", "So we agree that…"].map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>` : ""}
      <div class="row" style="margin-top:auto"><button class="btn" id="back" ${i ? "" : "disabled"}>Back</button>${voice ? `<button class="btn" id="rep">Repeat question</button>` : ""}<button class="btn" id="pause">${s.secs ? "Pause" : ""}</button><button class="btn primary" id="next" style="margin-left:auto">${i === steps.length - 2 ? "Finish" : "Next"}</button></div>
    </section>`;
    if (!s.secs) $("#pause").remove();
    left = s.secs; total = s.secs; paused = false;
    const tick = () => { if (paused || !$("#rt")) return; left--; $("#rt").textContent = fmt(left); $("#ring").style.setProperty("--p", Math.max(0, left / total * 100)); if (left <= 0) { clearTimer(); $("#rt").textContent = "Stop"; } };
    const startT = () => { if (s.secs) S.timer = setInterval(tick, 1000); };
    if (voice && TTS.ok) TTS.say(s.text, "f").then(() => { if (steps[i] === s) startT(); }); else startT();
    $("#next").onclick = () => { i++; draw(); };
    $("#back").onclick = () => { if (i) { i--; draw(); } };
    if ($("#rep")) $("#rep").onclick = () => TTS.say(s.text, "f");
    if ($("#pause")) $("#pause").onclick = () => { paused = !paused; $("#pause").textContent = paused ? "Resume" : "Pause"; };
  };
  draw();
}

    box.innerHTML = `<section class="stage"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap;gap:16px"><div><span class="eyebrow" style="color:#E3C46A">One-Minute Challenge</span><h2 style="margin-top:6px">Talk about ${esc(topic)}</h2><p class="lead" style="margin:4px 0 0">Speak for 60 seconds without stopping. Your partner taps "Hesitation" every time you stop, say "erm" or switch to Russian. Each one costs 5 points.</p></div><div class="ring"><div>1:00</div></div></div>
    <div class="row" style="gap:24px"><div><span class="small" style="color:#C9D6EA">Hesitations</span><div class="big-n" id="um">${um}</div></div><div><span class="small" style="color:#C9D6EA">Score</span><div class="big-n" id="pts">${60 - um * 5}</div></div><div><span class="small" style="color:#C9D6EA">Best on this device</span><div class="big-n">${best}</div></div></div>
    <div class="row" style="margin-top:auto"><button class="btn" id="spin">New topic</button><button class="btn primary" id="go">${running ? "Running…" : "Start"}</button><button class="btn" id="um1" style="margin-left:auto">+ Hesitation</button></div></section>`;
    $("#spin").onclick = () => { clearTimer(); running = false; um = 0; topic = pick(STUDIO.minute.filter(x => x !== topic)); draw(); };
    $("#um1").onclick = () => { if (!running) return; um++; $("#um").textContent = um; $("#pts").textContent = Math.max(0, 60 - um * 5); };
    $("#go").onclick = () => { if (running) return; um = 0; running = true; $("#um").textContent = 0; $("#pts").textContent = 60; $("#go").textContent = "Running…"; countdown(box, 60, () => { running = false; const p = Math.max(0, 60 - um * 5); if (p > store.get("minuteBest", 0)) store.set("minuteBest", p); $("#go").textContent = "Start"; $("#pts").textContent = p + (p >= 45 ? " ★" : ""); }); };
  };
  draw();
}
function stPhrases(box) {
  box.innerHTML = `<div class="phr">${STUDIO.phrases.map(g => `<div class="card"><b style="font-family:var(--f-head);font-size:18px">${esc(g.t)}</b><ul>${g.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>`;
}

/* ---------- TEACHER DASHBOARD ---------- */
const ATT = "data/results/attempts";
async function saveSpeaking(name, group, tid, marks) {
  const raw = Object.values(marks).reduce((a, b) => a + b, 0);
  const id = "s" + hash(name + group + tid + Date.now());
  await S.db.doc(ATT + "/" + id).set({ name, group, cand: "", test: tid, paper: "S", marks, raw, max: 25, scale: scale("S", raw), ts: Date.now(), src: "teacher" });
}
function teacher() {
  if (!window.claude) { app.innerHTML = teacherNote("Open this page in Claude to use the teacher dashboard.", "The dashboard saves results to your Claude account, so it only works on the published page while you're signed in as the teacher. Tests and result codes work anywhere, including the downloaded file."); return; }
  if (!S.teacherReady) { app.innerHTML = `<div class="empty">Checking your account…</div>`; return; }
  if (!S.owner) { app.innerHTML = teacherNote("This area is for the teacher.", "Students: finish a paper and send the result code to your teacher."); return; }
  if (!S.db) { app.innerHTML = teacherNote("Results storage isn't available right now.", "Reload the page. If it keeps happening, check that you're signed in to Claude."); return; }
  app.innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:14px"><div class="stack" style="gap:4px"><span class="eyebrow">Teacher dashboard · only you can see this</span><h1 style="font-size:32px">Class results</h1></div><button class="btn" id="csv">Download CSV</button></div>
  <section class="grid g2">
    <div class="card stack" style="gap:10px"><h3 style="font-size:20px">Add result codes</h3><p class="small muted" style="margin:0">Paste one or more codes from students (WhatsApp messages are fine; everything that isn't a code is ignored). Answers are marked again here.</p><textarea class="input" id="codes" style="min-height:110px" placeholder="IFPET-…"></textarea><div class="row"><button class="btn primary" id="add">Add results</button><span class="small" id="addMsg"></span></div></div>
    <div class="card stack" style="gap:10px"><h3 style="font-size:20px">Add speaking marks</h3><div class="row"><div class="field" style="flex:1"><label for="spn">Student</label><input class="input" id="spn" list="names"></div><div class="field" style="flex:1"><label for="spg">Group</label><input class="input" id="spg" list="groups"></div><div class="field"><label for="spt">Test</label><select class="input" id="spt"><option value="T1">Test 1</option><option value="T2">Test 2</option></select></div></div>
      <div class="crit">${[["gv", "Grammar & vocabulary"], ["dm", "Discourse management"], ["pr", "Pronunciation"], ["ic", "Interactive communication"], ["ga", "Global achievement"]].map(([k, l]) => `<label for="sp${k}">${l}</label><select class="input" id="sp${k}">${[0, 1, 2, 3, 4, 5].map(v => `<option ${v === 3 ? "selected" : ""}>${v}</option>`).join("")}</select>`).join("")}</div>
      <div class="row"><button class="btn primary" id="addS">Save speaking marks</button><span class="small" id="sMsg"></span></div></div>
  </section>
  <section class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h3 style="font-size:20px">Students</h3><div class="row"><select class="input" id="fg" style="width:auto"><option value="">All groups</option></select><input class="input" id="fq" placeholder="Search name" style="width:180px"></div></div><div id="sum" style="margin-top:10px"></div></section>
  <section class="card" style="margin-top:16px"><h3 style="font-size:20px">All papers</h3><div id="list" style="margin-top:10px"></div></section>
  <section id="detail" style="margin-top:16px"></section>
  <datalist id="names"></datalist><datalist id="groups"></datalist>`;
  $("#add").onclick = addCodes;
  $("#addS").onclick = async () => {
    const n = $("#spn").value.trim(); if (!n) { $("#sMsg").textContent = "Type the student's name."; return; }
    const marks = {}; ["gv", "dm", "pr", "ic", "ga"].forEach(k => marks[k] = +$("#sp" + k).value);
    try { await saveSpeaking(n, $("#spg").value.trim(), $("#spt").value, marks); $("#sMsg").textContent = "Saved ✓"; $("#spn").value = ""; } catch (e) { $("#sMsg").textContent = "Couldn't save: " + (e.message || e.code); }
  };
  $("#fg").onchange = renderRows; $("#fq").oninput = renderRows;
  $("#csv").onclick = downloadCSV;
  if (!S.downloads) $("#csv").remove();
  if (!S.unsub) S.unsub = S.db.collection(ATT).orderBy("ts", "desc").onSnapshot(snap => { S.rows = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (S.view === "teacher") renderRows(); }, e => { const l = $("#list"); if (l) l.innerHTML = `<div class="empty">Couldn't load results (${esc(e.code)}). Reload the page.</div>`; });
  renderRows();
}
function teacherNote(t, s) { return `<div class="card stack" style="max-width:640px"><span class="eyebrow">Teacher dashboard</span><h2 style="font-size:26px">${esc(t)}</h2><p class="lead" style="margin:0">${esc(s)}</p></div>`; }
async function addCodes() {
  const txt = $("#codes").value, found = txt.match(/IFPET-[A-Za-z0-9_-]+-[a-z0-9]+/g) || [];
  if (!found.length) { $("#addMsg").textContent = "No result codes found in the text."; return; }
  let added = 0, dup = 0, bad = 0;
  for (const code of [...new Set(found)]) {
    const o = readSlip(code); if (!o) { bad++; continue; }
    const id = "r" + hash(code);
    if (S.rows.some(r => r.id === id)) { dup++; continue; }
    const doc = { name: o.n || "Unnamed", group: o.g || "", cand: o.c || "", test: o.t, paper: o.p, ts: o.d || Date.now(), secs: o.s || 0, src: "code" };
    if (o.p === "W") { doc.writing = { p1: String(o.w?.p1 || "").slice(0, 4000), p2c: o.w?.p2c || "", p2: String(o.w?.p2 || "").slice(0, 4000) }; doc.raw = null; doc.max = 40; doc.scale = null; }
    else { const sc = score(o.t, o.p, o.a || []); doc.answers = (o.a || []).map(String); doc.raw = sc.raw; doc.max = sc.max; doc.scale = sc.scale; doc.parts = sc.parts.map(p => p.raw); }
    try { await S.db.doc(ATT + "/" + id).set(doc); added++; } catch (e) { bad++; }
  }
  $("#addMsg").textContent = `${added} added${dup ? ` · ${dup} already in the list` : ""}${bad ? ` · ${bad} not valid (check the whole code was copied)` : ""}`;
  if (added) $("#codes").value = "";
}
function filtered() {
  const g = $("#fg")?.value || "", q = norm($("#fq")?.value || "");
  return S.rows.filter(r => (!g || r.group === g) && (!q || norm(r.name).includes(q)));
}
function renderRows() {
  const list = $("#list"); if (!list) return;
  const groups = [...new Set(S.rows.map(r => r.group).filter(Boolean))].sort();
  const fg = $("#fg"), cur = fg.value;
  fg.innerHTML = `<option value="">All groups</option>` + groups.map(g => `<option ${g === cur ? "selected" : ""}>${esc(g)}</option>`).join("");
  $("#groups").innerHTML = groups.map(g => `<option value="${esc(g)}">`).join("");
  $("#names").innerHTML = [...new Set(S.rows.map(r => r.name))].map(n => `<option value="${esc(n)}">`).join("");
  const rows = filtered();
  if (!S.rows.length) { list.innerHTML = `<div class="empty">No results yet. Paste students' result codes above, or mark a speaking test.</div>`; $("#sum").innerHTML = `<div class="empty">Students appear here once you add their results.</div>`; return; }
  list.innerHTML = `<div class="tablebox"><table class="tbl"><thead><tr><th>Date</th><th>Student</th><th>Group</th><th>Test</th><th>Paper</th><th>Marks</th><th>Scale</th><th></th></tr></thead><tbody>${rows.map(r => { const b = band(r.scale); return `<tr><td>${new Date(r.ts).toLocaleDateString()}</td><td>${esc(r.name)}</td><td>${esc(r.group)}</td><td>${esc(TESTS[r.test]?.title || r.test)}</td><td>${PAPERS[r.paper]}</td><td class="num">${r.raw == null ? "–" : r.raw + "/" + r.max}</td><td><span class="band ${b.k}">${r.scale ?? (r.paper === "W" ? "Needs marking" : "–")}</span></td><td><button class="btn sm" data-open="${esc(r.id)}">Open</button></td></tr>`; }).join("")}</tbody></table></div>`;
  $$("[data-open]").forEach(b => b.onclick = () => openDetail(b.dataset.open));
  const by = {};
  rows.slice().sort((a, b) => a.ts - b.ts).forEach(r => { const k = r.name + "|" + r.group; by[k] = by[k] || { name: r.name, group: r.group, p: {} }; if (r.scale != null) by[k].p[r.paper] = r.scale; });
  const people = Object.values(by).sort((a, b) => a.name.localeCompare(b.name));
  $("#sum").innerHTML = `<div class="tablebox"><table class="tbl"><thead><tr><th>Student</th><th>Group</th><th>Reading</th><th>Writing</th><th>Listening</th><th>Speaking</th><th>Overall</th></tr></thead><tbody>${people.map(pp => { const v = Object.values(pp.p), ov = v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null, b = band(ov); return `<tr><td>${esc(pp.name)}</td><td>${esc(pp.group)}</td>${["R", "W", "L", "S"].map(k => `<td class="num">${pp.p[k] ?? "–"}</td>`).join("")}<td><span class="band ${b.k}">${ov == null ? "–" : ov + " · " + b.t}</span>${v.length && v.length < 4 ? ` <span class="small muted">${v.length}/4 papers</span>` : ""}</td></tr>`; }).join("")}</tbody></table></div><p class="small muted" style="margin:8px 0 0">Latest score for each paper. Overall is the average of the papers that have a score.</p>`;
}
function openDetail(id) {
  const r = S.rows.find(x => x.id === id); if (!r) return;
  const box = $("#detail"), T = TESTS[r.test];
  let h = `<div class="card stack"><div class="row" style="justify-content:space-between"><div><span class="eyebrow">${esc(T.title)} · ${PAPERS[r.paper]} · ${new Date(r.ts).toLocaleString()}</span><h2 style="font-size:24px">${esc(r.name)} <span class="muted" style="font-size:16px">${esc(r.group)}${r.cand ? " · " + esc(r.cand) : ""}</span></h2></div><button class="btn sm" id="closeD">Close</button></div>`;
  if (r.paper === "R" || r.paper === "L") {
    const sc = score(r.test, r.paper, r.answers || []);
    h += `<div class="bars" style="max-width:420px">${sc.parts.map(p => `<div class="barrow"><span>Part ${p.part}</span><span class="tr"><i style="width:${p.raw / p.max * 100}%"></i></span><span>${p.raw}/${p.max}</span></div>`).join("")}</div>`;
    const wrong = sc.detail.filter(d => !d.ok);
    h += wrong.length ? `<p class="small muted" style="margin:0">Questions to go over: ${wrong.map(d => `<b>${d.n}</b> (${esc(d.g || "blank")} → ${esc(d.acc[0])})`).join(", ")}</p>` : `<p>All correct.</p>`;
    if (r.secs) h += `<p class="small muted" style="margin:0">Time used: ${fmt(r.secs)}</p>`;
  }
  if (r.paper === "S") h += `<div class="crit" style="max-width:420px">${Object.entries(r.marks || {}).map(([k, v]) => `<span>${({ gv: "Grammar & vocabulary", dm: "Discourse management", pr: "Pronunciation", ic: "Interactive communication", ga: "Global achievement" })[k]}</span><b>${v}/5</b>`).join("")}</div>`;
  if (r.paper === "W") {
    const W = T.writing, m = r.wmarks || {};
    const crit = [["c", "Content"], ["ca", "Communicative achievement"], ["o", "Organisation"], ["l", "Language"]];
    const form = (part) => `<div class="crit">${crit.map(([k, l]) => `<label for="w${part}${k}">${l}</label><select class="input" id="w${part}${k}">${[0, 1, 2, 3, 4, 5].map(v => `<option ${v === (m[part]?.[k] ?? 3) ? "selected" : ""}>${v}</option>`).join("")}</select>`).join("")}</div>`;
    h += `<div class="two"><div class="stack" style="gap:8px"><b>Part 1 · Email to ${esc(W.p1.from)} <span class="muted small">${words(r.writing.p1)} words</span></b><div class="textbox" style="white-space:pre-wrap">${esc(r.writing.p1) || "<span class='muted'>(blank)</span>"}</div>${form("p1")}</div>
      <div class="stack" style="gap:8px"><b>Part 2 · ${esc(r.writing.p2c || "no task chosen")} <span class="muted small">${words(r.writing.p2)} words</span></b><div class="textbox" style="white-space:pre-wrap">${esc(r.writing.p2) || "<span class='muted'>(blank)</span>"}</div>${form("p2")}</div></div>
      <div class="row"><button class="btn primary" id="saveW">Save marks</button>${S.sample ? `<button class="btn" id="ai">Suggest marks with Claude</button>` : ""}<span class="small" id="wMsg"></span></div><div id="aiOut"></div>`;
  }
  h += `<div class="row" style="border-top:1px solid var(--line);padding-top:10px"><button class="btn danger sm" id="del">Delete this paper</button><span id="delC"></span></div></div>`;
  box.innerHTML = h; box.scrollIntoView({ behavior: "smooth", block: "start" });
  $("#closeD").onclick = () => box.innerHTML = "";
  $("#del").onclick = () => { $("#delC").innerHTML = `<span class="small">Delete for good?</span> <button class="btn danger sm" id="delY">Delete</button> <button class="btn sm" id="delN">Cancel</button>`; $("#delY").onclick = async () => { await S.db.doc(ATT + "/" + id).delete(); box.innerHTML = ""; }; $("#delN").onclick = () => $("#delC").innerHTML = ""; };
  if (r.paper === "W") {
    $("#saveW").onclick = async () => {
      const wm = { p1: {}, p2: {} }; let raw = 0;
      ["p1", "p2"].forEach(p => ["c", "ca", "o", "l"].forEach(k => { wm[p][k] = +$(`#w${p}${k}`).value; raw += wm[p][k]; }));
      try { await S.db.doc(ATT + "/" + id).update({ wmarks: wm, raw, scale: scale("W", raw) }); $("#wMsg").textContent = `Saved ✓ ${raw}/40 · scale ${scale("W", raw)}`; } catch (e) { $("#wMsg").textContent = "Couldn't save. Try again."; }
    };
    if ($("#ai")) $("#ai").onclick = () => aiMark(r);
  }
}
async function aiMark(r) {
  const T = TESTS[r.test], W = T.writing, out = $("#aiOut"), btn = $("#ai");
  const task1 = W.p1.lines.map(([t, n]) => t + (n ? `  [note: ${n}]` : "")).join("\n");
  const t2 = r.writing.p2c === "story" ? W.p2.story : W.p2.article;
  const prompt = `You are an experienced Cambridge B1 Preliminary for Schools writing examiner. Mark two answers by a 12–14-year-old learner using the official B1 Preliminary assessment scales: Content, Communicative Achievement, Organisation and Language, each 0–5.

PART 1 TASK (email, about 100 words, must answer all four notes):
${task1}

PART 1 ANSWER:
${r.writing.p1 || "(blank)"}

PART 2 TASK (${r.writing.p2c || "not chosen"}, about 100 words):
${t2.heading}
${t2.lines.join("\n")}

PART 2 ANSWER:
${r.writing.p2 || "(blank)"}

Reply with only JSON in this shape:
{"p1":{"c":0,"ca":0,"o":0,"l":0,"comment":"2-3 sentences for the student, simple English"},"p2":{"c":0,"ca":0,"o":0,"l":0,"comment":"2-3 sentences"},"corrections":["up to 5 short corrections like: 'I go yesterday' -> 'I went yesterday'"]}`;
  btn.disabled = true; out.innerHTML = `<div class="aiout">Thinking…</div>`;
  try {
    const j = await S.sample.json(prompt, { modelTier: "default" });
    ["p1", "p2"].forEach(p => ["c", "ca", "o", "l"].forEach(k => { const v = Math.max(0, Math.min(5, Math.round(+j?.[p]?.[k] || 0))); const el = $(`#w${p}${k}`); if (el) el.value = v; }));
    out.innerHTML = `<div class="aiout"><b>Suggested marks are filled in above. Check them, then press Save.</b>\n\nPart 1: ${esc(j?.p1?.comment || "")}\n\nPart 2: ${esc(j?.p2?.comment || "")}${Array.isArray(j?.corrections) && j.corrections.length ? "\n\nCorrections:\n• " + j.corrections.map(esc).join("\n• ") : ""}</div>`;
  } catch (e) {
    const msg = { not_granted: "Claude isn't allowed on this page. Allow it when asked, or mark by hand.", rate_limited: "Too many requests just now. Try again in a minute.", invalid_json: "Claude's reply couldn't be read. Try again." }[e.code] || "Couldn't get suggested marks. Mark by hand or try again.";
    out.innerHTML = `<div class="aiout">${esc(msg)}</div>`;
    if (e.code === "not_granted" || e.code === "sampling_disabled") btn.remove();
  } finally { if (btn) btn.disabled = false; }
}
async function downloadCSV() {
  const head = ["date", "student", "group", "candidate_no", "test", "paper", "marks", "max", "scale", "grade"];
  const lines = [head.join(",")].concat(filtered().map(r => [new Date(r.ts).toISOString().slice(0, 10), r.name, r.group, r.cand, r.test, PAPERS[r.paper], r.raw ?? "", r.max, r.scale ?? "", band(r.scale).t].map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")));
  try { await S.downloads.save({ filename: "IF-Academy-PET-results.csv", data: lines.join("\n") }); } catch (e) {}
}

/* ---------- boot ---------- */
go("home");
(async () => {
  if (!window.claude) { S.teacherReady = true; return; }
  try {
    const [user, db, sample, dl] = await Promise.all([claude.use("user"), claude.use("db"), claude.use("sample"), claude.use("downloads")]);
    S.owner = user ? await user.isOwner() : false; S.db = db; S.sample = sample; S.downloads = dl;
  } catch (e) {}
  S.teacherReady = true;
  if (S.view === "teacher") teacher();
})();
})();
