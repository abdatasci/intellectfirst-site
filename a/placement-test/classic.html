<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IF Placement Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F1E3D;--navy2:#1C3161;--ice:#E7EFF8;--gold:#B38A2A;--gold2:#E7D6A2;--paper:#FFFFFF;--bg:#F3F6FA;
  --ink:#15213B;--muted:#56637D;--line:#D5DEEA;--ok:#1E7A4B;--okbg:#E3F3EA;--no:#B0271F;--nobg:#FBE7E5;
  --serif:Cambria,Caladea,Georgia,"Times New Roman",serif;--sans:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0B1731;--navy2:#22386B;--ice:#18284A;--gold:#D2AE52;--gold2:#5E4C1E;--paper:#13213F;--bg:#0D1830;
  --ink:#E6ECF6;--muted:#A3B0C8;--line:#2A3C63;--ok:#6FD39F;--okbg:#133A2A;--no:#F08A80;--nobg:#40191A}}
:root[data-theme="dark"]{--navy:#0B1731;--navy2:#22386B;--ice:#18284A;--gold:#D2AE52;--gold2:#5E4C1E;--paper:#13213F;--bg:#0D1830;
  --ink:#E6ECF6;--muted:#A3B0C8;--line:#2A3C63;--ok:#6FD39F;--okbg:#133A2A;--no:#F08A80;--nobg:#40191A}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
.mast{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.mast-in{max-width:980px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.mast img{width:44px;height:56px;flex:none}
.mast .school{font-family:var(--serif);font-size:1.25rem}
.mast .sub{color:#C9D6EA;font-size:.95rem}
.mast .grow{flex:1;min-width:0}
.mast .tabs{display:flex;gap:6px}
.mast .tabs button{background:transparent;border:1px solid #3A5285;color:#fff;border-radius:8px;padding:6px 12px;font-size:.92rem}
.mast .tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:700}
main{max-width:820px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px}
.card+.card{margin-top:16px}
.lead{color:var(--muted);margin:6px 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.grid{grid-template-columns:1fr}.mast .sub{display:none}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
label.f input,label.f select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:1rem;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 18px;font-weight:700}
.btn.go{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.facts div{background:var(--bg);border-radius:10px;padding:12px;font-size:.92rem;color:var(--muted)}
.facts b{display:block;color:var(--ink);font-family:var(--serif);font-size:1.15rem}
@media (max-width:620px){.facts{grid-template-columns:1fr}}
.prog{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:.92rem}
.bar{height:6px;background:var(--ice);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.skill{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.stem{font-size:1.25rem;font-family:var(--serif);margin:0 0 16px}
.passage{background:var(--bg);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:12px 16px;margin:0 0 14px;font-family:var(--serif);line-height:1.6}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:baseline;font-size:1.05rem}
.opt:hover{border-color:var(--navy2)}
.opt .l{font-weight:700;color:var(--muted);font-size:.85rem;min-width:1.2em}
.opt.sel{border-color:var(--navy2);background:var(--ice)}
.blank{display:inline-block;min-width:4em;border-bottom:2px solid var(--muted);margin:0 3px}
.player{background:var(--navy);color:#fff;border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.player button{background:var(--gold);border:0;color:#1a1405;border-radius:8px;padding:9px 16px;font-weight:700}
.player button:disabled{opacity:.5}
.player .st{font-size:.9rem;color:#C9D6EA}
.note{font-size:.88rem;color:var(--muted)}
.wait{display:flex;align-items:center;gap:12px;color:var(--muted);padding:28px 0}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{transition:none}}
textarea.w{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.5}
.res-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lvl{font-family:var(--serif);font-size:3.6rem;line-height:1;color:var(--navy2)}
:root[data-theme="dark"] .lvl{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lvl{color:var(--gold)}}
.lvlname{font-family:var(--serif);font-size:1.3rem}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px 0 6px}
.scale div{text-align:center;font-size:.78rem;color:var(--muted);padding:8px 0;border-radius:6px;background:var(--bg);font-weight:700}
.scale div.on{background:var(--navy);color:#fff}
.group{border:2px solid var(--gold);background:var(--gold2);border-radius:10px;padding:14px 16px;margin:16px 0}
:root[data-theme="dark"] .group{color:var(--ink)}
.group b{font-family:var(--serif);font-size:1.2rem}
.sk{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;font-size:.95rem;margin:6px 0}
.sk .b{height:8px;background:var(--ice);border-radius:4px;overflow:hidden}
.sk .b i{display:block;height:100%;background:var(--navy2)}
.sk .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;color:var(--muted);font-size:.8rem;padding:8px;border-bottom:2px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--ice)}
.pill.ai{background:var(--okbg);color:var(--ok)}
.share textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);font-size:.9rem}
.fb{background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:.95rem}
details summary{cursor:pointer;color:var(--muted)}
</style>
</head>

/* ---------- adaptive model (Bayesian IRT on a 0–7 ability scale) ---------- */
const GRID=[];for(let x=0;x<=7.0001;x+=0.05)GRID.push(+x.toFixed(2));
function prior(band){const m=AGEBANDS[band].prior,sd=1.6,mx=AGEBANDS[band].max+1;return GRID.map(x=>x>mx?1e-6:Math.exp(-0.5*((x-m)/sd)**2))}
function pCorrect(theta,b,n){const c=1/n;return c+(1-c)/(1+Math.exp(-2.2*(theta-b)))}
function update(post,lvl,ok,n){const b=lvl+0.45;const out=post.map((p,i)=>{const pc=pCorrect(GRID[i],b,n);return p*(ok?pc:1-pc)});const s=out.reduce((a,v)=>a+v,0)||1;return out.map(v=>v/s)}
function est(post){const s=post.reduce((a,v)=>a+v,0)||1;const m=post.reduce((a,v,i)=>a+v*GRID[i],0)/s;const sd=Math.sqrt(post.reduce((a,v,i)=>a+v*(GRID[i]-m)**2,0)/s);return{m,sd}}

${avoid||'- (none yet)'}

function validItem(it,skill){
  if(!it||typeof it.stem!=='string'||!Array.isArray(it.options)||it.options.length!==4)return false;
  const o=it.options.map(x=>String(x).trim());if(o.some(x=>!x)||new Set(o.map(x=>x.toLowerCase())).size!==4)return false;
  if(!(it.answer>=0&&it.answer<4))return false;
  if((skill==='g'||skill==='v')&&!/_{3,}/.test(it.stem))return false;
  if(skill==='r'&&!(it.passage&&it.passage.length>40))return false;
  if(skill==='l'&&!(it.script&&it.script.length>20))return false;
  if(S.used.includes(it.stem))return false;
  return true;
}
function norm(it,skill,lvl,src){
  const ord=shuffle([0,1,2,3]);
  return{skill,lvl,src,stem:it.stem.trim(),passage:it.passage||'',script:it.script||'',opts:ord.map(i=>String(it.options[i]).trim()),ans:ord.indexOf(it.answer)};
}
function fetchAI(lvl,skill){
  if(!RT.sample||RT.aiOK===false||inflight)return inflight;
  const key=lvl+'|'+skill;
  inflight=(async()=>{
    try{
      const r=await RT.sample.json(aiPrompt(lvl,skill,skill==='r'||skill==='l'?2:4),{modelTier:'default',cache:false});
      const items=(r&&r.items||[]).filter(it=>validItem(it,skill)).map(it=>norm(it,skill,lvl,'ai'));
      (Q[key]=Q[key]||[]).push(...items);RT.aiOK=true;
    }catch(e){
      if(e&&(e.code==='not_granted'||e.code==='unavailable'||e.code==='forbidden')){RT.aiOK=false;RT.aiNote='AI questions are not available here, so this test uses the IF question bank.'}
      else if(e&&e.code==='rate_limited'){RT.aiNote='Using the IF question bank for a moment.'}
    }finally{inflight=null}
  })();
  return inflight;
}
function bankItem(lvl,skill){
  const kq=x=>(x.s==='r'||x.s==='l')?x.q:x.p;const pool=(BANK[lvl]||[]).filter(x=>!S.used.includes(kq(x)));
  let p=pool.filter(x=>x.s===skill);if(!p.length)p=pool;
  if(!p.length)return null;
  const x=p[rnd(p.length)];
  if(x.s==='r'||x.s==='l')return norm({stem:x.q,passage:x.s==='r'?x.p:'',script:x.s==='l'?x.p:'',options:x.o,answer:0},x.s,lvl,'bank');
  return norm({stem:x.p,options:x.o,answer:0},x.s,lvl,'bank');
}
function nextLevel(){

function prefetch(){

    const t0=Date.now();
    while(!it&&Date.now()-t0<9000&&RT.aiOK!==false){await (inflight||new Promise(r=>setTimeout(r,300)));it=(Q[key]||[]).shift();if(!it&&!inflight&&Date.now()-t0<9000)fetchAI(l,sk)}
  }
  if(!it)it=bankItem(l,sk)||bankItem(l,'g')||bankItem(Math.max(0,l-1),'v')||bankItem(Math.min(6,l+1),'g');
  return it;
}

/* ---------- screens ---------- */
let VIEW='test';
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===VIEW));
  if(VIEW==='teacher')return renderTeacher();
  if(S.phase==='start')return renderStart();
  if(S.phase==='q')return renderQ();
  if(S.phase==='write')return renderWrite();
  if(S.phase==='done')return renderResult();
}
function renderStart(){
  $('#app').innerHTML=`<div class="card">
  <h1>English Placement Test</h1>
  <p class="lead">This test finds your English level. The questions get harder when you answer correctly and easier when you make a mistake, so everyone finishes at their own level. Most people finish in 15–25 minutes.</p>
  <div class="facts"><div><b>14–26 questions</b>Grammar, vocabulary, reading${TTS?', listening':''}</div><div><b>Adapts to you</b>Every test is different</div><div><b>Pre-A1 → C2</b>Shows your level and the right IF group</div></div>
  <div class="grid">
   <label class="f">Full name<input id="nm" value="${esc(S.name)}" autocomplete="name"></label>
   <label class="f">Age<input id="ag" inputmode="numeric" value="${esc(S.age)}" placeholder="e.g. 11"></label>
   <label class="f">Phone or Telegram (optional)<input id="ct" value="${esc(S.contact)}"></label>
   <label class="f">Who is taking the test?<select id="bd">${Object.entries(AGEBANDS).map(([k,b])=>`<option value="${k}" ${S.band===k?'selected':''}>${b.name}</option>`).join('')}</select></label>
  </div>
  <p class="note" style="margin-top:14px">Don’t guess wildly. If you don’t know, choose the answer you think is most likely. You can’t go back to a question. ${TTS?'Use headphones or turn the sound on for listening questions.':''}</p>
  <div class="row" style="margin-top:12px"><button class="btn go" id="go">Start the test</button></div>
  <p class="note" id="ainote">${RT.aiOK===false?'This device will use the IF question bank.':'New questions are written for you by AI as you go.'}</p></div>`;
  const ag=$('#ag');ag.oninput=()=>{const a=parseInt(ag.value,10);if(a)$('#bd').value=a<=9?'kid':a<=12?'junior':a<=17?'teen':'adult'};
  $('#go').onclick=()=>{
    const nm=$('#nm').value.trim();if(!nm){$('#nm').focus();$('#nm').style.borderColor='var(--no)';return}
    S=Object.assign(fresh(),{name:nm,age:$('#ag').value.trim(),contact:$('#ct').value.trim(),band:$('#bd').value});
    S.post=prior(S.band);S.phase='q';S.started=new Date().toISOString();save();
    $('#app').innerHTML='<div class="card"><div class="wait"><div class="spin"></div>Preparing your first questions…</div></div>';
    nextQ();
  };
}
let loadingQ=false;
async function nextQ(){
  if(loadingQ)return;loadingQ=true;
  let it;try{it=await pickItem()}finally{loadingQ=false}
  if(!it){return finishMC()}
  S.cur=it;S.used.push(it.stem);save();renderQ();prefetch();
}
function stemHtml(s){return s.split(/\n|(?=\bB:)/).map(line=>esc(line.trim()).replace(/_{3,}/g,'<span class="blank"></span>')).join('<br>')}
let plays=0;
function renderQ(){
  const it=S.cur;if(!it){$('#app').innerHTML='<div class="card"><div class="wait"><div class="spin"></div>Loading…</div></div>';return nextQ()}
  plays=0;const n=S.n+1,est_=est(S.post);
  const pct=Math.min(100,Math.max(n/MAX_Q,est_.sd<0.8?(n/MIN_Q)*0.9:0)*100);
  let body='';
  if(it.skill==='r')body+=`<div class="passage">${esc(it.passage).replace(/\n/g,'<br>')}</div>`;
  if(it.skill==='l')body+=`<div class="player"><button id="play">▶ Play</button><span class="st" id="pst">You can listen twice.</span></div>`;
  $('#app').innerHTML=`<div class="card">
   <div class="prog"><span>Question ${n}</span><span>${esc(S.name)}</span></div><div class="bar"><i style="width:${pct}%"></i></div>
   <span class="skill">${SKN[it.skill]}</span>${body}
   <p class="stem">${stemHtml(it.stem)}</p>
   <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
   <div class="row" style="margin-top:16px;justify-content:space-between"><span class="note">${esc(RT.aiNote)}</span><button class="btn go" id="next" disabled>Next</button></div></div>`;
  let sel=null;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));$('#next').disabled=false});
  $('#next').onclick=()=>answer(sel);
  if(it.skill==='l'){$('#play').onclick=()=>speak(it.script)}
}
function speak(script){
  if(!TTS||plays>=2)return;plays++;const b=$('#play'),st=$('#pst');b.disabled=true;st.textContent='Playing…';
  speechSynthesis.cancel();
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const gb=vs.filter(v=>/GB|UK/i.test(v.lang+v.name));
  const pool=(gb.length?gb:vs);const lines=script.split(/\n|(?=\b[AB]:)/).map(s=>s.trim()).filter(Boolean);
  lines.forEach((ln,i)=>{const m=ln.match(/^([AB]):\s*(.*)$/);const u=new SpeechSynthesisUtterance(m?m[2]:ln);
    const who=m?(m[1]==='A'?0:1):0;if(pool.length){u.voice=pool[who%pool.length];u.lang=u.voice.lang}else u.lang='en-GB';
    u.rate=S.cur&&S.cur.lvl<=1?0.85:0.95;u.pitch=pool.length>1?1:(who?1.25:0.9);
    if(i===lines.length-1)u.onend=()=>{b.disabled=plays>=2;st.textContent=plays>=2?'No more plays.':'You can listen once more.'};
    speechSynthesis.speak(u)});
}
function answer(sel){
  const it=S.cur;if(sel==null)return;
  const ok=sel===it.ans;
  S.post=update(S.post,it.lvl,ok,4);S.n++;S.skillIdx++;
  S.hist.push({s:it.skill,l:it.lvl,ok,src:it.src,q:it.stem.slice(0,140),a:it.opts[sel],k:it.opts[it.ans]});
  S.cur=null;save();
  try{speechSynthesis.cancel()}catch(e){}
  const e=est(S.post);
  if(S.n>=MAX_Q||(S.n>=MIN_Q&&e.sd<SD_STOP))return finishMC();
  $('#app').innerHTML='<div class="card"><div class="wait"><div class="spin"></div>Next question…</div></div>';
  nextQ();
}
function finishMC(){
  const e=est(S.post);S.mc={m:e.m,sd:e.sd};
  if(RT.sample&&RT.aiOK!==false&&S.band!=='kid'&&e.m>=1){S.phase='write';save();return renderWrite()}
  return finalize(null);
}
const WTASK=[
 '',
 'Write 3–5 sentences about your family or your best friend. What do they look like? What do they like doing?',
 'Write an email to a friend (50–80 words) about your last weekend. What did you do, where did you go, and how did you feel?',
 'Write 80–120 words: Describe a problem in your town or school and suggest how to solve it.',
 'Write 120–160 words: Some people think young people spend too much time online. Do you agree? Give reasons and examples.',
 'Write 150–200 words: To what extent should governments control what people eat? Present a balanced argument and your own view.',
 'Write 150–200 words: Is it ever right to break a rule? Discuss with nuance, using examples.'];
function renderWrite(){
  const l=Math.max(1,Math.min(6,Math.round(S.mc.m)));const task=WTASK[l];S.wtask=task;S.wl=l;save();
  $('#app').innerHTML=`<div class="card"><span class="skill">Writing · last task</span><h2>Write a short text</h2>
   <p class="lead">${esc(task)}</p><textarea class="w" id="wt" placeholder="Write here…" spellcheck="false">${esc(S.wdraft||'')}</textarea>
   <div class="row" style="justify-content:space-between;margin-top:10px"><span class="note" id="wc">0 words</span><div class="row"><button class="btn" id="skip">Skip writing</button><button class="btn go" id="fin">Finish the test</button></div></div></div>`;
  const wt=$('#wt'),wc=()=>{$('#wc').textContent=(wt.value.trim().match(/\S+/g)||[]).length+' words';S.wdraft=wt.value;save()};wt.oninput=wc;wc();
  $('#skip').onclick=()=>finalize(null);
  $('#fin').onclick=async()=>{
    const txt=wt.value.trim();if((txt.match(/\S+/g)||[]).length<8){wt.focus();return}
    $('#app').innerHTML='<div class="card"><div class="wait"><div class="spin"></div>Marking your writing…</div></div>';
    let w=null;
    try{
      w=await RT.sample.json([{role:'user',content:`You are an experienced Cambridge English examiner. Assess this placement-test writing by ${AGEBANDS[S.band].name.toLowerCase()} learner. Task: "${task}"
Text (between the markers):
<<<
${txt.slice(0,2500)}
>>>
Judge only the English shown (range, accuracy, organisation, task completion). If the text is off-task, copied or not English, give "Pre-A1".
Reply JSON only: {"cefr":"Pre-A1|A1|A2|B1|B2|C1|C2","position":"low|mid|high","feedback":"2 short sentences for the learner, encouraging and specific","teacher_note":"1–2 sentences for the teacher: main strengths and errors"}`}],{modelTier:'default',cache:false});
    }catch(e){w=null}
    finalize(w&&LV.includes(w.cefr)?{lvl:LV.indexOf(w.cefr),pos:w.position,fb:w.feedback||'',tn:w.teacher_note||'',text:txt,task}:{text:txt,task});
  };
}
function recGroup(l,frac,band,age){
  const hi=frac>=0.6;
  if(band==='kid')return [['Starters','Pre A1 Starters'],['Movers','A1 Movers'],['Flyers','A2 Flyers'],['KET','KET – strong for this age; discuss with the teacher']][Math.min(l,3)];
  if(band==='junior')return [['Starters','Pre A1 Starters'],['Movers','A1 Movers'],hi?['KET','KET (A2 Key)']:['Flyers','A2 Flyers'],['PET','PET (B1 Preliminary) or a B1 Teen group'],['B2 Teen','B2 Teen']][Math.min(l,4)];
  if(band==='teen')return [['A2-Teens','A2-Teens, with extra support (beginner)'],['A2-Teens','A2-Teens'],hi?['KET','KET (A2 Key) or A2-Teens']:['A2-Teens','A2-Teens'],hi?['PET','PET (B1 Preliminary)']:['B1 Teen','B1 Teen (groups A–D, choose by timetable)'],['B2 Teen','B2 Teen'],['C1','C1 or IELTS'],['C1','C1 / IELTS']][Math.min(l,6)];
  return [['Elementary','English File Elementary (A1) – beginner group or individual'],['Elementary','English File Elementary (A1)'],['Pre-intermediate','English File Pre-intermediate (A2)'],['B1-B2 Adults','B1-B2 Adults (English File Intermediate)'],hi?['IELTS','B2-Adults or IELTS preparation']:['B2-Adults','B2-Adults (Upper-intermediate)'],['C1','C1 (English File Advanced) or IELTS'],['C1','C1 / IELTS (very high level)']][Math.min(l,6)];
}
function finalize(w){
  let th=S.mc.m;
  if(w&&w.lvl!=null){const wt=w.lvl+(w.pos==='high'?0.75:w.pos==='low'?0.25:0.5);th=0.8*th+0.2*wt}
  th=Math.max(0,Math.min(6.99,th));const l=Math.floor(th),frac=th-l;
  const by={};S.hist.forEach(h=>{const b=by[h.s]=by[h.s]||{n:0,ok:0};b.n++;if(h.ok)b.ok++});
  const g=recGroup(l,frac,S.band,+S.age);
  S.result={theta:+th.toFixed(2),lvl:l,cefr:LV[l],pos:frac<0.33?'low':frac<0.66?'mid':'high',sd:+S.mc.sd.toFixed(2),group:g[0],groupText:g[1],skills:by,n:S.n,
    correct:S.hist.filter(h=>h.ok).length,ai:S.hist.filter(h=>h.src==='ai').length,writing:w,finished:new Date().toISOString()};
  S.phase='done';save();saveRemote();renderResult();
}
async function saveRemote(){
  if(!RT.db||!RT.uid)return;
  const r=S.result;const rec={name:S.name,age:S.age,band:S.band,contact:S.contact,at:r.finished,cefr:r.cefr,pos:r.pos,theta:r.theta,sd:r.sd,group:r.group,groupText:r.groupText,
    n:r.n,correct:r.correct,ai:r.ai,skills:r.skills,writing:r.writing?{cefr:r.writing.lvl!=null?LV[r.writing.lvl]:'',pos:r.writing.pos||'',note:r.writing.tn||'',task:r.writing.task||'',text:(r.writing.text||'').slice(0,3000)}:null,
    hist:S.hist.map(h=>[h.s,h.l,h.ok?1:0,h.src==='ai'?1:0])};
  try{const ref=RT.db.doc('placements/'+RT.uid);const g=await ref.get();const old=g.exists?(g.data().history||[]):[];
    const hist=[{at:rec.at,cefr:rec.cefr,pos:rec.pos,group:rec.group}].concat(old).slice(0,8);
    await ref.set(Object.assign(rec,{history:hist}));S.saved=true;save();const n=$('#savenote');if(n)n.textContent='Your result has been sent to IF Academy.'}
  catch(e){const n=$('#savenote');if(n)n.textContent='Send the message below to your teacher so they get your result.'}
}
function shareText(){const r=S.result;return `IF Academy placement test\nName: ${S.name}${S.age?' ('+S.age+')':''}${S.contact?'\nContact: '+S.contact:''}\nLevel: ${r.cefr} (${r.pos}) – ${LVNAME[r.lvl]}\nRecommended group: ${r.groupText}\nQuestions: ${r.n}, correct: ${r.correct}${r.writing&&r.writing.lvl!=null?'\nWriting: '+LV[r.writing.lvl]:''}\nDate: ${new Date(r.finished).toLocaleDateString('en-GB')}`}
function renderResult(){
  const r=S.result;
  $('#app').innerHTML=`<div class="card">
   <p class="note">Result for ${esc(S.name)}</p>
   <div class="res-top"><div class="lvl">${r.cefr}</div><div><div class="lvlname">${LVNAME[r.lvl]}</div><div class="note">${r.pos==='high'?'Strong at this level, close to the next one':r.pos==='low'?'Just reached this level':'Solid at this level'}</div></div></div>
   <div class="scale">${LV.map((x,i)=>`<div class="${i===r.lvl?'on':''}">${x}</div>`).join('')}</div>
   <div class="group">Recommended IF group<br><b>${esc(r.groupText)}</b></div>
   ${Object.entries(r.skills).map(([k,v])=>`<div class="sk"><span>${SKN[k]}</span><div class="b"><i style="width:${Math.round(v.ok/v.n*100)}%"></i></div><span class="v">${v.ok}/${v.n}</span></div>`).join('')}
   <p class="note">Correct answers are not the whole story: harder questions count for more, so your level is based on which questions you got right.</p>
   ${r.writing&&r.writing.fb?`<div class="fb"><b>Writing:</b> ${esc(r.writing.fb)}</div>`:''}
   <p class="note" id="savenote">${S.saved?'Your result has been sent to IF Academy.':RT.db?'Saving your result…':'Send the message below to your teacher so they get your result.'}</p>
   <div class="share"><textarea readonly id="sh">${esc(shareText())}</textarea>
   <div class="row" style="margin-top:8px">${navigator.share?'<button class="btn gold" id="shr">Share</button>':''}<button class="btn" id="cp">Copy</button><button class="btn" id="again">New test</button></div></div></div>`;
  if($('#shr'))$('#shr').onclick=()=>navigator.share({title:'IF placement result',text:shareText()}).catch(()=>{});
  $('#cp').onclick=()=>{const t=$('#sh');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>$('#cp').textContent='Copied',()=>{try{document.execCommand('copy');$('#cp').textContent='Copied'}catch(e){}})};
  $('#again').onclick=()=>{if(!confirmNew())return;S=fresh();save();render()};
  if(!S.saved&&RT.db)saveRemote();
}
function confirmNew(){return true}

/* ---------- teacher view ---------- */
let TROWS=null,TSUB=false,TOPEN=null;
function renderTeacher(){
  if(!RT.owner){VIEW='test';return render()}
  if(!TSUB&&RT.db){TSUB=true;RT.db.collection('placements').onSnapshot(s=>{TROWS=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.at||'').localeCompare(a.at||''));if(VIEW==='teacher')renderTeacher()},()=>{TROWS=[];if(VIEW==='teacher')renderTeacher()})}
  const rows=TROWS;
  let h=`<div class="card"><h2>Placement results</h2><p class="lead">Every student who finishes while signed in to claude.ai with “Can use” access appears here. Others send you their result message.</p>`;
  if(!rows)h+='<div class="wait"><div class="spin"></div>Loading…</div>';
  else if(!rows.length)h+='<p class="note">No results yet.</p>';
  else h+=`<div class="scroll"><table class="t"><thead><tr><th>Date</th><th>Name</th><th>Age</th><th>Level</th><th>Group</th><th>Writing</th><th>Qs</th></tr></thead><tbody>${rows.map(r=>`<tr data-id="${esc(r.id)}" style="cursor:pointer"><td>${esc((r.at||'').slice(0,10))}</td><td><b>${esc(r.name)}</b><div class="note">${esc(r.contact||'')}</div></td><td>${esc(r.age||'')}</td><td><span class="pill">${esc(r.cefr)} ${esc(r.pos||'')}</span></td><td>${esc(r.groupText||r.group||'')}</td><td>${r.writing&&r.writing.cefr?esc(r.writing.cefr):'—'}</td><td>${r.n||''}${r.ai?' <span class="pill ai">AI '+r.ai+'</span>':''}</td></tr>${TOPEN===r.id?`<tr><td colspan="7"><div class="fb">${Object.entries(r.skills||{}).map(([k,v])=>SKN[k]+' '+v.ok+'/'+v.n).join(' · ')} · ability ${r.theta} ± ${r.sd}${r.writing?`<br><b>Writing task:</b> ${esc(r.writing.task)}<br><b>Examiner note:</b> ${esc(r.writing.note||'—')}<details><summary>Show text</summary><p style="white-space:pre-wrap">${esc(r.writing.text)}</p></details>`:''}${(r.history||[]).length>1?'<br><b>Earlier attempts:</b> '+r.history.slice(1).map(x=>esc(x.at.slice(0,10)+' '+x.cefr)).join(', '):''}<br><span class="note">Level path: ${(r.hist||[]).map(x=>LV[x[1]]+(x[2]?'✓':'✗')).join(' → ')}</span></div></td></tr>`:''}`).join('')}</tbody></table></div>`;
  h+='</div>';
  $('#app').innerHTML=h;
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{TOPEN=TOPEN===tr.dataset.id?null:tr.dataset.id;renderTeacher()});
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;render()});
if(TTS){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
render();
if(window.claude&&claude.use)initRuntime();else{RT.aiOK=false;render()}
</script>
