<!doctype html><html><head><script src="../../if-runtime.js"></script><link rel="manifest" href="../../manifest.webmanifest"><link rel="apple-touch-icon" href="../../brand/apple-touch-icon.png"><meta name="theme-color" content="#0B2545"><style>select{max-width:100%}</style><link rel="icon" href="../../brand/favicon-64.png"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IF Grammar Game Centre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: one-column app. Hub = CEFR staircase (A1 low step → C1 high step) → level screen (topics + five game cards) → full-width game stage. */
:root{
  --bg:#F3F7FC; --surface:#FFFFFF; --ink:#1A2433; --muted:#53627A; --line:#D5E2F0; --soft:#E6F0FA;
  --brand:#0B1F3A; --brand2:#16305A; --on-brand:#FFFFFF; --on-brand-muted:#CFE0F3;
  --gold:#C9A227; --gold-ink:#0B1F3A; --gold-soft:#F6E7B5; --gold-text:#8A6A0A;
  --ok:#1F7A4D; --okbg:#E3F4EA; --bad:#B3261E; --badbg:#FBE7E5;
  --s1:#E6F0FA; --s1t:#0B1F3A; --s2:#CFE0F3; --s2t:#0B1F3A; --s3:#8FADD3; --s3t:#0B1F3A; --s4:#16305A; --s4t:#FFFFFF; --s5:#0B1F3A; --s5t:#FFFFFF;
  --field1:#1B3C6B; --field2:#0B1F3A; --field3:#061327;
  --serif:Cambria,"Caladea",Georgia,serif; --sans:Calibri,"Carlito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081629; --surface:#0F2645; --ink:#EAF1FA; --muted:#A3B6CC; --line:#24406A; --soft:#16305A;
  --brand:#183A68; --brand2:#21497F; --on-brand:#FFFFFF; --on-brand-muted:#CFE0F3;
  --gold-soft:#3A3115; --gold-text:#E4C45A; --ok:#6FD39C; --okbg:#123B2A; --bad:#FF8A80; --badbg:#44191A;
  --s1:#1A3257; --s1t:#EAF1FA; --s2:#1F3D69; --s2t:#EAF1FA; --s3:#26487A; --s3t:#FFFFFF; --s4:#2E5791; --s4t:#FFFFFF; --s5:#C9A227; --s5t:#0B1F3A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081629; --surface:#0F2645; --ink:#EAF1FA; --muted:#A3B6CC; --line:#24406A; --soft:#16305A;
  --brand:#183A68; --brand2:#21497F; --on-brand:#FFFFFF; --on-brand-muted:#CFE0F3;
  --gold-soft:#3A3115; --gold-text:#E4C45A; --ok:#6FD39C; --okbg:#123B2A; --bad:#FF8A80; --badbg:#44191A;
  --s1:#1A3257; --s1t:#EAF1FA; --s2:#1F3D69; --s2t:#EAF1FA; --s3:#26487A; --s3t:#FFFFFF; --s4:#2E5791; --s4t:#FFFFFF; --s5:#C9A227; --s5t:#0B1F3A;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.1}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top img{width:40px;height:auto;flex:none}
.top .name{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.top .name b{font-family:var(--serif);font-size:19px}
.top .name span{font-size:13px;color:var(--muted)}
.top .tools{margin-left:auto;display:flex;gap:8px}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700}
.crumb{border:0;background:none;color:var(--muted);padding:0;font-size:15px;font-weight:700}
.crumb:hover{color:var(--ink)}
.primary{background:var(--gold);color:var(--gold-ink);border:0;border-radius:10px;padding:13px 24px;font-weight:700;font-size:17px}
.secondary{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 18px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}

/* HUB */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:22px}
.hero h1{font-size:clamp(36px,7.5vw,64px)}
.hero p{margin:10px 0 0;color:var(--muted);max-width:58ch}
.stairs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:340px;margin-bottom:18px}
.step{position:relative;border:0;border-radius:14px 14px 6px 6px;text-align:left;padding:14px 14px 16px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:0;transition:transform .15s}
.step:hover{transform:translateY(-4px)}
.step .code{font-family:var(--serif);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:1}
.step .lname{font-weight:700;font-size:16px}
.step .ldesc{font-size:13.5px;opacity:.85;line-height:1.35}
.step .stars{font-size:14px;letter-spacing:2px;margin-top:4px}
.step.l1{height:44%;background:var(--s1);color:var(--s1t)}
.step.l2{height:58%;background:var(--s2);color:var(--s2t)}
.step.l3{height:72%;background:var(--s3);color:var(--s3t)}
.step.l4{height:86%;background:var(--s4);color:var(--s4t)}
.step.l5{height:100%;background:var(--s5);color:var(--s5t);box-shadow:inset 0 0 0 2px var(--gold)}
.step .rec{position:absolute;top:-13px;left:12px;background:var(--gold);color:var(--gold-ink);font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.hubinfo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hubinfo div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px}
.hubinfo b{display:block;font-family:var(--serif);font-size:17px;margin-bottom:2px}

/* LEVEL */
.lvhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;margin:6px 0 18px}
.badge{width:96px;height:96px;border-radius:20px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:44px}
.lvhead h1{font-size:clamp(28px,5vw,42px)}
.lvhead p{margin:6px 0 0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 20px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px;align-items:start;transition:border-color .15s,transform .15s}
.game:hover{border-color:var(--gold);transform:translateY(-2px)}
.game svg{grid-row:span 3;width:52px;height:52px}
.game h3{font-size:20px}
.game p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.4}
.game .best{font-size:13.5px;font-weight:700;color:var(--gold-text)}
.game.team{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.game.team p{color:var(--on-brand-muted)}
.game.team .best{color:var(--gold)}

/* PLAY (shared) */
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.hud .clock{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;min-width:2.1ch}
.hud .clock.low{color:var(--bad)}
.hud .stat{font-variant-numeric:tabular-nums;line-height:1.1}
.hud .stat b{display:block;font-family:var(--serif);font-size:24px}
.hud .stat span{font-size:12.5px;color:var(--muted)}
.hud .grow{flex:1}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .2s linear}
.streak{display:flex;align-items:center;gap:8px;min-height:26px;margin-bottom:10px;flex-wrap:wrap}
.flames{display:flex;gap:3px}
.flames i{width:11px;height:18px;border-radius:6px 6px 3px 3px;background:var(--soft);transition:background .2s,transform .2s}
.flames i.on{background:var(--gold);transform:translateY(-2px)}
.mult{font-weight:700;color:var(--gold-text)}
.lives{display:flex;gap:5px}
.lives i{width:20px;height:22px;background:var(--gold);clip-path:polygon(50% 0,100% 18%,100% 55%,50% 100%,0 55%,0 18%)}
.lives i.off{opacity:.18}
.tag{font-size:13px;color:var(--muted);margin:0 0 4px}
.q{font-family:var(--serif);font-size:clamp(21px,3.8vw,29px);line-height:1.28;margin:0 0 16px;overflow-wrap:anywhere}
.opts{display:grid;gap:9px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;gap:11px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:18px;min-width:0}
.opt span{overflow-wrap:anywhere}
.opt kbd{flex:none;width:26px;height:26px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font:700 13px var(--sans);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.ok,.chunk.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad,.chunk.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled,.chunk:disabled{cursor:default}
.feedback{margin-top:14px;padding:11px 14px;border-left:4px solid var(--gold);background:var(--soft);border-radius:0 8px 8px 0;font-size:16px}
.feedback b{color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.float{position:absolute;font:700 22px var(--serif);color:var(--gold);pointer-events:none;animation:up 1s forwards;z-index:3}
@keyframes up{to{transform:translateY(-46px);opacity:0}}

/* meteor */
.sky{position:relative;height:clamp(320px,54vh,520px);background:radial-gradient(ellipse at 50% 120%,var(--field1) 0%,var(--field2) 48%,var(--field3) 100%);border-radius:12px;overflow:hidden;touch-action:manipulation;user-select:none}
.sky::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 22%,#ffffffa0,transparent),radial-gradient(1px 1px at 72% 12%,#ffffff90,transparent),radial-gradient(1.5px 1.5px at 40% 44%,#ffffff70,transparent),radial-gradient(1px 1px at 88% 58%,#ffffff80,transparent),radial-gradient(1px 1px at 25% 72%,#ffffff60,transparent),radial-gradient(1.5px 1.5px at 62% 80%,#ffffff60,transparent)}
.ground{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--field1);border-top:2px solid var(--gold)}
.ground.hit{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.met{position:absolute;transform:translateX(-50%);min-height:56px;padding:8px 8px 8px 30px;border-radius:14px 14px 22px 22px;background:linear-gradient(160deg,#2A4A7A,#122A4D);border:2px solid var(--gold);color:#fff;font-size:16px;line-height:1.2;text-align:center;display:flex;align-items:center;justify-content:center;box-shadow:0 -14px 22px -10px #C9A22788}
.met kbd{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:19px;height:19px;border-radius:5px;background:#C9A227;color:#0B1F3A;font:700 12px/19px var(--sans)}
.met.good{background:#1F7A4D;border-color:#fff;opacity:0;transition:opacity .35s}
.met.wrong{background:#C0392B;border-color:#fff}
.met.reveal{background:#1F7A4D;border-color:#fff}
.banner{position:absolute;left:10px;right:10px;bottom:40px;background:#061327EE;border:1.5px solid #C9A227;color:#fff;border-radius:10px;padding:9px 13px;font-size:15px;z-index:4}
.banner b{color:#E4C45A}
.lvup{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 clamp(32px,7vw,52px) var(--serif);text-align:center;z-index:5}
.lvup small{display:block;font:400 17px var(--sans);color:#CFE0F3}

/* builder */
.line{min-height:58px;border:1.5px dashed var(--line);border-radius:11px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.line.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.line.bad{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.bank{display:flex;flex-wrap:wrap;gap:7px}
.tile{border:1.5px solid var(--brand2);background:var(--soft);border-radius:9px;padding:7px 12px;font-size:18px}
.tile:disabled{opacity:.25;cursor:default}

/* hunter */
.chunks{display:flex;flex-wrap:wrap;gap:7px;font-family:var(--serif);font-size:clamp(20px,3.6vw,25px)}
.chunk{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 11px}
.chunk:hover:not(:disabled){border-color:var(--gold)}

/* team */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tm{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
.tm.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;background:var(--gold-soft)}
.tm b{display:block;font-family:var(--serif);font-size:26px;font-variant-numeric:tabular-nums}
.tm span{font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 16px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.field{display:grid;gap:6px;margin-bottom:16px}
.field input{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;max-width:260px}

/* results */
.big{font-family:var(--serif);font-size:clamp(58px,14vw,96px);line-height:1;margin:4px 0;font-variant-numeric:tabular-nums}
.newbest{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:700;border-radius:999px;padding:3px 12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}
.stats div{background:var(--soft);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-family:var(--serif);font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:13.5px;color:var(--muted)}
.review{list-style:none;margin:10px 0 0;padding:0}
.review li{border-top:1px solid var(--line);padding:10px 0;font-size:16px}
.review .w{color:var(--bad);text-decoration:line-through}
.review .r{color:var(--ok);font-weight:700}
.review p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
/* placement */
.plbars{display:grid;gap:8px;margin:16px 0}
.plbar{display:grid;grid-template-columns:42px minmax(0,1fr) 46px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.plbar b{font-family:var(--serif);font-size:20px}
.plbar .track{height:16px;background:var(--soft);border-radius:8px;overflow:hidden}
.plbar .track i{display:block;height:100%;background:var(--gold)}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--soft)}
.dots i.done{background:var(--brand2)}
.dots i.now{background:var(--gold)}


.top{flex-wrap:wrap}
.top .tools{flex-wrap:wrap;justify-content:flex-end}
.namebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.namebox .label{display:block}
.namebox input{border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;min-width:0;flex:1 1 200px;max-width:320px}
.pstrip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:15px}
.h2{font-size:24px;margin:26px 0 10px}
.focus{background:var(--gold-soft);border-radius:12px;padding:12px 14px;margin:4px 0 8px}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px;align-items:start}
.lvcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.lvtop{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lvtop b{display:block;font-family:var(--serif);font-size:18px}
.mini-badge{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:20px;flex:none}
.tlist{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 74px 74px;gap:10px;align-items:center;font-size:14.5px}
.trow .tname{overflow-wrap:anywhere}
.trow .track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.trow .track i{display:block;height:100%}
.trow .tnum{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.mini{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700}
.mini:hover{border-color:var(--gold)}
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.prow{cursor:pointer}.prow:hover td{background:var(--soft)}
.pdet td{background:var(--bg)}
.rep{width:100%;min-height:150px;margin-top:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font:14px/1.5 var(--sans)}
@media (max-width:560px){.trow{grid-template-columns:minmax(0,1fr) 64px 66px}.trow .track{grid-column:1/-1;grid-row:2}.top .tools .icon-btn{padding:6px 9px;font-size:13px}}
@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .stairs{grid-template-columns:1fr;height:auto;gap:8px}
  .step{height:auto!important;flex-direction:row;align-items:center;gap:14px;border-radius:12px;padding:12px 14px}
  .step .code{font-size:34px;flex:none;width:58px}
  .step .rec{position:static;order:5;margin-left:auto}
  .step.l1{margin-right:32%}.step.l2{margin-right:24%}.step.l3{margin-right:16%}.step.l4{margin-right:8%}
  .step .ldesc{display:none}
  .hubinfo{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts.two{grid-template-columns:1fr}
  .stage{padding:15px}
  .met{font-size:14px;padding-left:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Grammar notes */
.nbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-6px 0 20px}
.nbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px}
.nbtn svg{width:18px;height:18px;flex:none}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.ncard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:5px;min-height:96px}
.ncard:hover{border-color:var(--gold)}
.ncard b{font-family:var(--serif);font-size:18px;line-height:1.15}
.ncard span{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ncard i{font-style:normal;font-size:12px;font-weight:700;color:var(--gold-text);margin-top:auto}
.rulebtn{position:absolute;top:10px;right:10px;z-index:6;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--gold);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.rulebtn svg{width:16px;height:16px}
.stage.hasrule{padding-top:54px}
.nov{position:fixed;inset:0;z-index:100;background:rgba(6,19,39,.62);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.npanel{background:var(--surface);color:var(--ink);border-radius:16px;max-width:760px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden}
.nhead{background:var(--brand);color:var(--on-brand);padding:16px 20px;display:flex;gap:12px;align-items:flex-start}
.nhead h2{font-size:26px;color:var(--on-brand)}
.nhead small{display:block;color:var(--on-brand-muted);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.nhead .x{margin-left:auto;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;width:36px;height:36px;font-size:20px;flex:none}
.nbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:16px}
.nrule{font-size:17px;margin:0}
.nh{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.ninfo{display:flex;flex-direction:column;gap:12px}
/* formula */
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fchip{background:var(--brand);color:var(--on-brand);border-radius:8px;padding:6px 11px;font-weight:700;font-size:15px}
.frow .fchip:nth-child(4n+3){background:var(--gold);color:var(--gold-ink)}
.fplus{color:var(--gold-text);font-weight:700;font-size:18px}
/* table */
.ntbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:15px}
.ntbl th{background:var(--brand);color:var(--on-brand);text-align:left;padding:8px 10px;font-size:13px;letter-spacing:.03em}
.ntbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.ntbl tr:nth-child(even) td{background:var(--soft)}
.ntbl td:first-child{font-weight:700}
.tscroll{overflow-x:auto}
/* contrast */
.nvs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.nvs .vsx{align-self:center;font-family:var(--serif);font-weight:700;color:var(--gold-text);font-size:18px}
.vcard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft)}
.vcard.b{border-color:var(--gold);background:var(--gold-soft)}
.vcard b{font-family:var(--serif);font-size:19px;display:block}
.vcard em{font-style:normal;font-size:13.5px;color:var(--muted);display:block;margin-bottom:6px}
.vcard ul{margin:0;padding-left:18px;font-size:15px}
@media (max-width:560px){.nvs{grid-template-columns:1fr}.nvs .vsx{justify-self:center}}
/* scale */
.nsc{padding:6px 4px 0}
.nsc .bar2{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--s2),var(--s4),var(--gold))}
.nsc .pins{position:relative;height:62px}
.nsc .pin{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:14px;text-align:center;line-height:1.15;max-width:120px}
.nsc .pin::before{content:"";width:2px;height:14px;background:var(--ink);margin-bottom:4px}
.nsc .pin.l{transform:none;align-items:flex-start;text-align:left}.nsc .pin.r{transform:translateX(-100%);align-items:flex-end;text-align:right}
.nsc .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
/* timeline */
.ntl svg{width:100%;height:auto;display:block}
/* examples / mistake / russian */
.nex{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.nex li{padding:8px 12px;border-left:4px solid var(--gold);background:var(--soft);border-radius:0 8px 8px 0}
.nmis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nmis div{border-radius:10px;padding:9px 12px;font-size:15.5px}
.nmis .w{background:var(--badbg);color:var(--ink)}.nmis .w b{color:var(--bad)}
.nmis .c{background:var(--okbg);color:var(--ink)}.nmis .c b{color:var(--ok)}
.nmis .w s{text-decoration-color:var(--bad)}
@media (max-width:520px){.nmis{grid-template-columns:1fr}}
.nru{border:1.5px dashed var(--s3);border-radius:12px;padding:12px 14px;background:var(--surface)}
.nru .nh{display:flex;align-items:center;gap:8px}
.nru .flag{display:inline-block;background:var(--brand);color:var(--on-brand);border-radius:5px;padding:1px 6px;font-size:11px;letter-spacing:.05em}
.nru p{margin:0;font-size:16px}
.nfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:14px}
.nfoot .sec{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 18px;font-weight:700}
.nlink{border:0;background:none;color:var(--gold-text);font-weight:700;padding:0;text-decoration:underline;font-size:15px;margin-left:6px}
.rubar{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
/* practice modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:0 0 22px}
.mode{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px;align-items:start;text-align:left;border:1.5px solid var(--gold);background:var(--gold-soft);border-radius:14px;padding:16px 18px;color:var(--ink)}
.mode:hover{transform:translateY(-2px)}
.mode svg{grid-row:span 3;width:52px;height:52px}
.mode h3{font-size:20px}.mode p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.4}.mode .best{font-size:13.5px;font-weight:700;color:var(--gold-text)}
/* exercises */
.exhd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.expart{margin-top:18px}
.exhead{display:flex;gap:10px;align-items:flex-start;font-weight:700;margin:0 0 10px}
.exletter{flex:none;width:28px;height:28px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--serif)}
.exol{margin:0;padding-left:28px;display:flex;flex-direction:column;gap:10px}
.exol li{padding-left:4px}.exol li::marker{font-weight:700;color:var(--muted)}
.exq{font-size:17.5px;line-height:2.1}
.exorig{line-height:1.5;color:var(--muted);margin-bottom:2px}
.exline{line-height:2.1}
.extag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--gold-text);background:var(--gold-soft);border-radius:5px;padding:0 6px;margin-right:6px;line-height:1.7;vertical-align:2px}
.exin{border:0;border-bottom:2px solid var(--s3);background:var(--soft);border-radius:6px 6px 0 0;padding:2px 6px;font-size:17px;max-width:100%;color:var(--ink)}
.exin:focus{outline:none;border-bottom-color:var(--gold);background:var(--gold-soft)}
.exin.ok{border-bottom-color:var(--ok);background:var(--okbg)}.exin.bad{border-bottom-color:var(--bad);background:var(--badbg)}
.exfb{font-size:15px;min-height:0}.exok{color:var(--ok);font-weight:700}.exbad{color:var(--bad);font-weight:700}
.exbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.exscore{margin-top:16px;padding:16px;border-radius:12px;background:var(--soft)}.exscore p{margin:4px 0 10px}
.exscore .secondary{display:inline-flex;gap:6px;align-items:center}.exscore .secondary svg{width:16px;height:16px}
/* speaking */
.tkbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-4px 0 14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
#tksel{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);max-width:100%}
.tkhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
.tkrole{font-size:13px;font-weight:700;background:var(--gold-soft);color:var(--gold-text);border-radius:999px;padding:3px 10px}
.tkq{font-size:clamp(24px,4vw,32px);margin:10px 0 16px;line-height:1.2}
.tk.proj .tkq{font-size:clamp(30px,5.4vw,46px)}
.tktools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tktimer{position:relative;width:58px;height:58px;margin-right:4px}.tktimer svg{width:58px;height:58px}
.tktimer b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14.5px}
.pill:hover{border-color:var(--gold)}.pill.on{background:var(--bad);border-color:var(--bad);color:#fff}
#aud{height:36px;max-width:100%}
.tkrev{display:flex;flex-direction:column;gap:8px}
.tkrev details{border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:var(--soft)}
.tkrev summary{font-weight:700;cursor:pointer}.tkrev ul{margin:8px 0 2px;padding-left:20px}.tkrev p{margin:8px 0 2px}
.tkcheck{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-size:15.5px}
.tkcheck .secondary{padding:7px 14px;display:inline-flex;gap:6px;align-items:center}.tkcheck svg{width:16px;height:16px}
.tkend{border:1.5px dashed var(--gold);border-radius:12px;padding:14px 16px;margin-top:10px}
/* chat */
.chatset{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);margin:6px 0 10px}
.chatset b{display:block;font-family:var(--serif);font-size:18px}.chatset span{font-size:14px;color:var(--muted)}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on-brand)!important;display:grid;place-items:center;font-weight:700;font-size:18px!important}
.chat{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px;max-height:46vh;overflow-y:auto;padding:4px}
.bub{max-width:82%;padding:9px 13px;border-radius:16px;font-size:17px;line-height:1.35}
.bub.them{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.bub.them .who{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.bub.me{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:4px}
.bub.me.good{background:var(--ok);color:#fff}
.bub.me.wrongb{background:var(--badbg);color:var(--ink);text-decoration:line-through;text-decoration-color:var(--bad)}
.bub.me.fix{background:var(--ok);color:#fff}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
@media print{.top,.crumb,.exbar,.nbtn,.rulebtn,#exres{display:none!important}.stage{border:0;padding:0}.exin{background:none;border-bottom:1px solid #000}body{background:#fff;color:#000}}

function levelStats(lv,src){const tp=(src||SAVE.topics)[lv]||{};let r=0,n=0;for(const k in tp){r+=+tp[k].r||0;n+=+tp[k].n||0}return {r,n}}
function pct(r,n){return n?Math.round(r/n*100):0}
function band(p){return p>=80?'var(--ok)':p>=60?'var(--gold)':'var(--bad)'}
const GNAME=id=>({clock:'Beat the Clock',meteor:'Meteor Storm',builder:'Sentence Builder',hunter:'Error Hunter',chat:'Chat Challenge',ex:'Classic exercises'}[id]||id);
function when(t){try{const d=new Date(t);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function weakList(topics,lvs,k){const out=[];(lvs||ORDER).forEach(lv=>{const tp=(topics||{})[lv]||{};for(const t in tp){const v=tp[t];if((+v.n||0)>=3)out.push({lv,t,r:+v.r||0,n:+v.n||0})}});return out.sort((a,b)=>a.r/a.n-b.r/b.n).slice(0,k||3)}

 ru:'Множественное число: обычно + s. Запомните исключения: man → men, woman → women, child → children, foot → feet.'},
'this / that':{v:{t:'t',h:['','near','far'],rows:[['one','this','that'],['more than one','these','those']]},
 r:'Use this / these for things near you and that / those for things far away.',
 e:['This is my phone.','Look at those birds!','These shoes are new.'],x:['This shoes are new.','These shoes are new.'],
 ru:'this / these — «этот / эти» (рядом), that / those — «тот / те» (далеко). С множественным числом: these / those.'},
'can':{v:{t:'f',rows:[['subject','can / can’t','base verb'],['Can','subject','base verb?']]},
 r:'Use can for ability, permission and requests. can never changes: no -s and no to.',
 e:['I can swim.','She can’t drive.','Can I open the window?'],x:['She cans sing.','She can sing.'],
 ru:'can = «могу / умею». После can — глагол без to и без -s: She can sing (не She can to sing).'},
'prepositions':{v:{t:'t',h:['in','on','at'],rows:[['months, years: in May','days: on Sunday','clock times: at 9'],['cities, rooms: in Kostanay','surfaces: on the table','the weekend: at the weekend']]},
 r:'in, on and at show time and place. Learn them as fixed pairs.',
 e:['My birthday is in May.','The keys are on the table.','The lesson starts at 9.'],x:['on July','in July'],
 ru:'in — внутри / месяцы и годы, on — на поверхности / дни, at — точное время. В русском одно «в», а в английском разные предлоги: в мае = in May, в понедельник = on Monday, в 5 часов = at 5.'},
'possessives':{v:{t:'t',h:['Person','Possessive'],rows:[['I','my'],['you','your'],['he / she / it','his / her / its'],['we / they','our / their'],['a name','Timur’s, my parents’']]},
 r:'Possessives show who something belongs to. Add ’s to a name.',
 e:['This is my book.','The dog is eating its food.','This is Timur’s bag.'],x:['This is me pen.','This is my pen.'],
 ru:'my / your / his / her — «мой, твой, его, её». Для имён: Timur’s bag = сумка Тимура. its (о предмете) пишется без апострофа; it’s = it is.'},
'question words':{v:{t:'t',h:['Word','Asks about'],rows:[['Who','a person'],['What','a thing'],['Where','a place'],['When','a time'],['Why','a reason'],['How / How old / How much','way, age, price'],['Whose','the owner']]},
 r:'Start with the question word, then do / does or am / is / are, then the subject.',
 e:['Where do you live?','Who is your teacher?','How old are you?'],x:['Where you live?','Where do you live?'],
 ru:'Порядок слов в вопросе: вопросительное слово + do / does / am / is / are + подлежащее. Где ты живёшь? = Where do you live?'},
'present continuous':{v:[{t:'f',rows:[['subject','am / is / are','verb + -ing']]},{t:'tl',marks:[['now',.5,'NOW','happening now']]}],
 r:'Use the present continuous for actions happening now or around now.',
 e:['Look! It’s raining.','I’m doing my homework now.','What are you doing?'],x:['I doing my homework.','I’m doing my homework.'],
 ru:'Действие происходит сейчас. Нужны оба элемента: am / is / are + глагол с -ing. Я читаю (сейчас) = I am reading.'},
'was / were':{v:{t:'t',h:['Subject','Past of be'],rows:[['I / he / she / it','was / wasn’t'],['you / we / they','were / weren’t']]},
 r:'was and were are the past of am, is and are.',
 e:['I was at home yesterday.','They were at the cinema.','Was it cold?'],x:['We was late.','We were late.'],
 ru:'Прошедшее время глагола to be: was (I, he, she, it) и were (you, we, they). Я был дома = I was at home.'},
'imperatives':{v:{t:'vs',a:['Do it','base verb',['Close the door.','Sit down, please.']],b:['Don’t do it','Don’t + base verb',['Don’t touch that!','Don’t be late.']]},
 r:'Use the base verb to give instructions. Add please to sound polite.',
 e:['Open your books.','Please close the door.','Don’t run!'],x:['Not touch it!','Don’t touch it!'],
 ru:'Повелительное наклонение — просто глагол: Open the door. «Не делай» = Don’t + глагол: Don’t run! = Не беги!'},
'adjectives':{v:{t:'f',rows:[['a / an','adjective','noun'],['subject','be','adjective']]},
 r:'Adjectives go before a noun or after be. They never take -s.',
 e:['a red car','The house is big.','They are good students.'],x:['a car red','a red car'],
 ru:'Прилагательное ставится перед существительным и не меняется: good students (не goods students).'},
'object pronouns':{v:{t:'t',h:['Subject','Object'],rows:[['I','me'],['you','you'],['he / she / it','him / her / it'],['we','us'],['they','them']]},
 r:'Use object pronouns after a verb or a preposition.',
 e:['Listen to me!','I call her every day.','I can’t find them.'],x:['Can you help I?','Can you help me?'],
 ru:'После глагола и предлога: me, him, her, us, them (меня, его, её, нас, их). Помоги мне = Help me.'}
},
A2:{
'past simple':{v:[{t:'t',h:['Type','Form','Examples'],rows:[['regular','verb + -ed','watched, stayed'],['irregular','learn it','went, bought, broke'],['question / negative','did / didn’t + base verb','Did you go? I didn’t go.']]},{t:'tl',marks:[['point',.3,'I went to Astana','finished time'],['now',.78,'NOW','']]}],
 r:'Use the past simple for finished actions at a finished time: yesterday, last week, in 2020.',
 e:['We watched a film yesterday.','She left her keys at home.','Did you see the match?'],x:['Did you saw it?','Did you see it?'],
 ru:'Законченное действие в прошлом. После did / didn’t глагол в начальной форме: Did you go? I didn’t go. Неправильные глаголы нужно выучить: go → went.'},
'present simple / continuous':{v:{t:'vs',a:['Present simple','habits, facts, states',['I usually walk to school.','Water boils at 100°C.']],b:['Present continuous','now, temporary',['Shh! The baby is sleeping.','I’m learning Spanish this year.']]},
 r:'Simple for routines and facts; continuous for now and temporary situations. State verbs such as know, like and understand stay simple.',
 e:['She goes to the gym twice a week.','Why are you laughing?','I understand you.'],x:['I am understanding you.','I understand you.'],
 ru:'Simple — регулярно, всегда (usually, every day). Continuous — сейчас (now, at the moment). Глаголы состояния (know, like, want, understand) не используются с -ing.'},
'comparatives':{v:{t:'t',h:['Adjective','Comparative'],rows:[['short: tall','taller than'],['ends in -y: easy','easier than'],['long: expensive','more expensive than'],['irregular: good / bad / far','better / worse / farther'],['the same','as tall as']]},
 r:'Compare two things with -er than or more … than.',
 e:['The train is faster than the bus.','This book is more interesting.','He is as tall as his brother.'],x:['more taller','taller'],
 ru:'Сравнение двух предметов: короткие прилагательные + -er, длинные — more. Не говорите more taller! «чем» = than.'},
'superlatives':{v:{t:'sc',l:'',r:'',items:[[.08,'big'],[.5,'bigger'],[.92,'the biggest']]},
 r:'Use the + -est or the most to say something is number one in a group.',
 e:['Everest is the highest mountain.','It’s the most expensive restaurant.','good → the best, bad → the worst'],x:['the most good','the best'],
 ru:'Превосходная степень: the + -est или the most. good → the best, bad → the worst. Не забудьте the!'},
'future':{v:{t:'vs',a:['will','decided now, offers, promises, opinions',['I’ll answer it.','I think they’ll win.']],b:['going to','plans made before, evidence now',['I’m going to study medicine.','Look! It’s going to rain.']]},
 r:'Use will for decisions at the moment of speaking and for predictions. Use going to for plans and for things you can see coming.',
 e:['I’ll help you.','We’re going to visit Grandma.','It’s going to rain.'],x:['I going to buy a car.','I’m going to buy a car.'],
 ru:'will — решение в момент речи, обещание, мнение. going to — план, принятый заранее, или очевидный признак (тучи → пойдёт дождь).'},
'some / any':{v:{t:'vs',a:['some','positive sentences, offers, requests',['I’d like some water.','Would you like some cake?']],b:['any','negatives and questions',['There aren’t any eggs.','Is there any milk?']]},
 r:'Use some in positive sentences and offers, and any in negatives and most questions.',
 e:['I bought some bread.','We haven’t got any time.','Have you got any brothers?'],x:['There aren’t some chairs.','There aren’t any chairs.'],
 ru:'some — в утверждениях и предложениях («Хочешь…?»). any — в отрицаниях и вопросах. На русский часто не переводится.'},
'much / many':{v:{t:'vs',a:['many','countable: people, cars, apples',['How many brothers?','not many cars']],b:['much','uncountable: money, time, water',['How much money?','not much time']]},
 r:'Use many with countable plurals and much with uncountable nouns. In positive sentences a lot of sounds more natural.',
 e:['How many people came?','I don’t drink much coffee.','There are a lot of cars.'],x:['How much apples?','How many apples?'],
 ru:'many — с исчисляемыми (яблоки, люди), much — с неисчисляемыми (деньги, вода, время). «Много» в утверждении — a lot of.'},
'must / have to':{v:{t:'t',h:['Form','Meaning'],rows:[['must / have to','it’s necessary'],['mustn’t','it’s not allowed'],['don’t have to','it’s not necessary'],['had to','past: it was necessary']]},
 r:'must and have to mean something is necessary. mustn’t means it’s not allowed. don’t have to means it’s not necessary.',
 e:['You have to wear a seatbelt.','You mustn’t smoke here.','I don’t have to get up early.'],x:['She have to go.','She has to go.'],
 ru:'mustn’t = нельзя. don’t have to = не обязательно (можно не делать). Это разные значения! Прошедшее время: had to.'},
'adverbs of frequency':{v:{t:'sc',l:'0%',r:'100%',items:[[.02,'never'],[.27,'sometimes'],[.5,'often'],[.74,'usually'],[.98,'always']]},
 r:'Frequency adverbs go before the main verb but after be.',
 e:['I usually have breakfast at 7.','She is never late.','How often do you play tennis?'],x:['I go always to bed at ten.','I always go to bed at ten.'],
 ru:'Наречия частоты ставятся перед основным глаголом, но после am / is / are: I always get up early. She is always late.'},
'present perfect':{v:[{t:'f',rows:[['have / has','past participle'],['ever / never / just / already / yet']]},{t:'tl',marks:[['span',.08,.72,'at some time in my life',''],['now',.72,'NOW','']]}],
 r:'Use the present perfect for experiences and for past actions with a result now. Don’t use it with a finished time such as yesterday.',
 e:['Have you ever been to London?','I’ve never eaten sushi.','She has just arrived.'],x:['I’ve seen him yesterday.','I saw him yesterday.'],
 ru:'Опыт (ever, never) и результат сейчас (just, already, yet). Если есть точное время в прошлом (yesterday, last year) — Past Simple.'},
'should':{v:{t:'f',rows:[['subject','should / shouldn’t','base verb'],['Should','I','base verb?']]},
 r:'Use should to give advice. Never put to after should.',
 e:['You should see a doctor.','You shouldn’t eat so much sugar.','Should I take an umbrella?'],x:['You should to go.','You should go.'],
 ru:'should = «следует, стоит» — совет. После should глагол без to.'},
'prepositions of time':{v:{t:'t',h:['at','on','in'],rows:[['clock times','days and dates','months, years, seasons'],['at 7, at noon','on Friday, on 3 May','in May, in 2010'],['at night, at the weekend','on New Year’s Day','in ten minutes (from now)']]},
 r:'Use at for exact times, on for days and dates and in for longer periods.',
 e:['I was born in 2010.','See you on Friday.','We have lunch at noon.'],x:['in Monday','on Monday'],
 ru:'at — точное время, on — дни и даты, in — месяцы, годы и «через»: in ten minutes = через десять минут.'},
'like + -ing':{v:{t:'vs',a:['like / love / hate / enjoy','+ verb-ing',['I love swimming.','He hates getting up.']],b:['would like','+ to + verb',['I’d like to have a coffee.','Would you like to come?']]},
 r:'After like, love, hate and enjoy use -ing. After would like use to.',
 e:['I enjoy playing chess.','I’d like to go home.'],x:['I enjoy to play.','I enjoy playing.'],
 ru:'like / love / enjoy + -ing (нравится делать вообще). would like + to = «хотел бы» (вежливо, сейчас).'},
'too / enough':{v:{t:'vs',a:['too + adjective','more than you want',['too hot','too expensive to buy']],b:['adjective + enough · enough + noun','the right amount',['old enough to drive','enough money']]},
 r:'too means more than you want. enough goes after an adjective and before a noun.',
 e:['The soup is too hot to eat.','He isn’t old enough to drive.','Do you have enough money?'],x:['enough old','old enough'],
 ru:'too = слишком. enough = достаточно: после прилагательного (old enough), но перед существительным (enough money).'},
'possessive pronouns':{v:{t:'t',h:['+ noun','no noun'],rows:[['my','mine'],['your','yours'],['his / her','his / hers'],['our','ours'],['their','theirs']]},
 r:'Use mine, yours, ours and so on when no noun follows.',
 e:['It’s not my pen. It’s yours.','“Whose car is that?” “It’s ours.”'],x:['It’s your.','It’s yours.'],
 ru:'my book — «моя книга» (с существительным). mine — «моя» (без существительного): This book is mine.'},
'past continuous':{v:[{t:'f',rows:[['was / were','verb + -ing']]},{t:'tl',marks:[['span',.12,.52,'I was watching TV…',''],['point',.36,'…when you called',''],['now',.86,'NOW','']]}],
 r:'Use the past continuous for an action in progress at a moment in the past.',
 e:['I was watching TV when you called.','What were you doing at 8 o’clock?'],x:['I watching TV.','I was watching TV.'],
 ru:'Действие длилось в определённый момент прошлого: Я смотрел телевизор, когда ты позвонил = I was watching TV when you called.'}
},
B1:{
'present perfect / past':{v:[{t:'vs',a:['Present perfect','up to now · no time · result now',['I’ve lost my phone.','She’s lived here since 2019.']],b:['Past simple','finished time',['I saw him yesterday.','We went to Turkey in 2022.']]},{t:'tl',marks:[['point',.22,'2022: we went','past simple'],['span',.4,.78,'since 2019 → now','present perfect'],['now',.78,'NOW','']]}],
 r:'Finished time (yesterday, in 2022, ago, When…?) → past simple. A period up to now, or no time at all → present perfect.',
 e:['How long have you known each other?','When did you move here?','It’s the first time I’ve seen snow.'],x:['I’ve seen him yesterday.','I saw him yesterday.'],
 ru:'Если указано законченное время (yesterday, ago, in 2020, When…?) — Past Simple. Если важен результат сейчас или период до настоящего (since, for, ever) — Present Perfect.'},
'past continuous':{v:{t:'tl',marks:[['span',.1,.6,'background: was / were + -ing','I was walking home…'],['point',.38,'event: past simple','…when it started to rain'],['now',.88,'NOW','']]},
 r:'Use the past continuous for the background (the long action) and the past simple for the event that interrupts it.',
 e:['I was watching TV when the lights went out.','While she was cooking, the phone rang.'],x:['While I walked home, it started to rain.','While I was walking home, it started to rain.'],
 ru:'Длительный фон — Past Continuous (was / were + -ing). Короткое событие, которое прерывает фон, — Past Simple.'},
'used to':{v:{t:'vs',a:['used to + verb','a past habit or state, not true now',['I used to play the piano.','There used to be a cinema here.']],b:['didn’t use to · Did … use to?','no -d after did',['I didn’t use to like it.','Did you use to have long hair?']]},
 r:'used to means something was true in the past but isn’t now.',
 e:['I used to smoke, but I stopped.','We used to live in Almaty.'],x:['Did you used to live here?','Did you use to live here?'],
 ru:'used to = «раньше (а теперь нет)». Раньше я жил в Алматы = I used to live in Almaty. После did — use to (без -d).'},
'zero conditional':{v:{t:'f',rows:[['If','+ present','present']]},
 r:'Use the zero conditional for facts and things that are always true.',
 e:['If you heat ice, it melts.','Plants die if they don’t get water.'],x:['If you will heat ice, it melts.','If you heat ice, it melts.'],
 ru:'Нулевой тип: общие факты и законы природы. Оба глагола в настоящем времени.'},
'first conditional':{v:{t:'f',rows:[['If','+ present','will + verb'],['when / as soon as / unless','+ present']]},
 r:'Use the first conditional for real possibilities in the future. Never use will after if or when.',
 e:['If it rains, we’ll stay at home.','Call me as soon as you arrive.','We’ll go unless it rains.'],x:['If it will rain, we’ll stay in.','If it rains, we’ll stay in.'],
 ru:'Реальное условие в будущем. После if, when, as soon as, unless — настоящее время, хотя по-русски будущее: «Если пойдёт дождь» = If it rains.'},
'second conditional':{v:{t:'f',rows:[['If','+ past','would / could + verb'],['If I were you,','I’d …']]},
 r:'Use the second conditional for imaginary situations now or in the future.',
 e:['If I had a million dollars, I’d travel the world.','If I were you, I’d apologise.'],x:['If I would have money, I’d buy it.','If I had money, I’d buy it.'],
 ru:'Нереальное условие — «если бы». В части с if — прошедшее время, в другой части — would. If I were you = «на твоём месте».'},
'passive':{v:[{t:'f',rows:[['object','be','past participle','(by …)']]},{t:'t',h:['Tense','Passive'],rows:[['present','English is spoken here.'],['past','The bridge was built in 1998.'],['present perfect','My phone has been stolen.'],['future','The school will be opened next year.']]}],
 r:'Use the passive when the action matters more than who does it. Change be; keep the past participle.',
 e:['English is spoken all over the world.','The film was directed by Nolan.'],x:['The letter was send yesterday.','The letter was sent yesterday.'],
 ru:'Страдательный залог: be + третья форма глагола. Важно действие, а не кто его сделал: «Мост построили в 1998» = The bridge was built in 1998.'},
'relative clauses':{v:{t:'t',h:['Word','Use for','Example'],rows:[['who','people','the woman who lives next door'],['which / that','things','the book that I’m reading'],['whose','possession','a friend whose father is a pilot'],['where','places','the café where we met'],['when','times','the year when I started']]},
 r:'Relative clauses tell us exactly which person or thing we mean.',
 e:['The woman who lives next door is a doctor.','This is the café where we first met.'],x:['The book who I read was great.','The book that I read was great.'],
 ru:'who — о людях («который»), which / that — о предметах, whose — «чей», where — «где», when — «когда».'},
'modals of deduction':{v:{t:'sc',l:'sure it’s false',r:'sure it’s true',items:[[.04,'can’t'],[.5,'might / may / could'],[.96,'must']]},
 r:'Use must when you’re sure something is true, can’t when you’re sure it isn’t, and might, may or could when it’s possible.',
 e:['She’s been working all day. She must be tired.','That can’t be Timur. He’s in London.','It might rain later.'],x:['He mustn’t be at home. The lights are off.','He can’t be at home. The lights are off.'],
 ru:'must = «наверняка» (уверен, что да), can’t = «не может быть» (уверен, что нет), might = «возможно». mustn’t в этом значении не используется!'},
'-ing or to':{v:{t:'t',h:['Pattern','Verbs','Example'],rows:[['verb + -ing','enjoy, avoid, mind, finish','I enjoy swimming.'],['verb + to','decide, want, hope, promise','I decided to go.'],['preposition + -ing','good at, look forward to','I look forward to seeing you.'],['make / let + base verb','make, let','They let me drive.']]},
 r:'Some verbs take -ing and some take to. After a preposition always use -ing. After make and let use the base verb.',
 e:['I’ve decided to learn Spanish.','Do you mind opening the window?','My parents let me drive.'],x:['I enjoy to swim.','I enjoy swimming.'],
 ru:'Запоминайте глаголы группами: enjoy / avoid / mind + -ing; decide / want / promise + to. После предлога — всегда -ing. make / let + глагол без to.'},
'reported speech':{v:{t:'t',h:['Direct','Reported'],rows:[['“I am tired.”','He said he was tired.'],['“I will call you.”','She said she would call me.'],['“Do you like it?”','He asked if I liked it.'],['“Where do you live?”','She asked where I lived.'],['“Don’t be late.”','He told me not to be late.']]},
 r:'In reported speech the tense usually moves one step back. Questions use normal word order.',
 e:['He said (that) he was tired.','She asked me where I lived.','He told me not to be late.'],x:['She asked me where did I live.','She asked me where I lived.'],
 ru:'Косвенная речь: время сдвигается назад (am → was, will → would). В косвенном вопросе — прямой порядок слов, без do / did. say something, но tell somebody.'},
'so / such':{v:{t:'vs',a:['so','+ adjective / adverb',['The test was so easy.','She speaks so quickly.']],b:['such','+ (a) + adjective + noun',['It was such a good film!','They’re such nice people.']]},
 r:'Use so before an adjective and such before a noun phrase. Add that for a result.',
 e:['I was so tired that I fell asleep.','It was such a beautiful day.'],x:['It was so a nice day.','It was such a nice day.'],
 ru:'so + прилагательное (so tired), such + (a) + прилагательное + существительное (such a good film). Оба значат «такой, так».'},
'present perfect continuous':{v:[{t:'f',rows:[['have / has been','verb + -ing']]},{t:'tl',marks:[['span',.2,.75,'I’ve been waiting for an hour','still going on'],['now',.75,'NOW','']]}],
 r:'Use it for an activity that started in the past and is still going on, or has just stopped and left a visible result.',
 e:['I’ve been waiting for an hour.','You’re out of breath. Have you been running?','How long have you been learning English?'],x:['I wait here for an hour.','I’ve been waiting here for an hour.'],
 ru:'Действие началось в прошлом и продолжается до сих пор: «Я жду уже час» = I’ve been waiting for an hour. В русском здесь настоящее время!'},
'future forms':{v:{t:'t',h:['Form','Use','Example'],rows:[['present continuous','arrangements','I’m seeing the dentist at 3.'],['present simple','timetables','The train leaves at 7.15.'],['going to','plans','I’m going to study law.'],['will','decisions now, predictions','I’ll call you.'],['when / as soon as + present','time clauses','I’ll call when I get home.']]},
 r:'English has several ways to talk about the future. Choose the form by its meaning.',
 e:['What are you doing this weekend?','The film starts at 8.','I’ll call you when I get home.'],x:['I’ll call you when I will get home.','I’ll call you when I get home.'],
 ru:'Договорённость — Present Continuous, расписание — Present Simple, план — going to, решение сейчас — will. После when — настоящее время.'},
'countable / uncountable':{v:{t:'vs',a:['Countable','a book, two books · many · a few',['How many bags?','a suggestion']],b:['Uncountable','advice, information, news, luggage, money · much · a little',['How much luggage?','a piece of advice']]},

CHATB.A1=[
 {title:'New classmate',who:'Dana',set:'You meet a new classmate on the first day.',
  turns:[
   {them:'Hi! I’m Dana. Are you in class 8B?',t:'to be',o:['Yes, I am. I’m Arman.','Yes, I is. I Arman.','Yes, I are. I’m Arman.'],why:'With I we use am: I am / I’m.'},
   {them:'Nice to meet you! Where do you live?',t:'present simple',o:['I live near the park.','I living near the park.','I lives near the park.'],why:'Present simple with I: no -s, no -ing.'},
   {them:'Cool. Have you got any brothers or sisters?',t:'have got',o:['Yes, I’ve got one sister.','Yes, I has got one sister.','Yes, I’ve one sisters.'],why:'I have got + a singular noun after one.'},
   {them:'What does she do?',t:'a / an',o:['She’s an artist.','She’s artist.','She’s a artist.'],why:'We need an before a vowel sound: an artist.'},
   {them:'Wow! Can you draw too?',t:'can',o:['No, I can’t. But I can sing.','No, I don’t can. But I can to sing.','No, I can’t. But I cans sing.'],why:'can’t / can + base verb, no to and no -s.'},
   {them:'Great! What are you doing after school today?',t:'present continuous',o:['I’m playing football with my friends.','I playing football with my friends.','I am play football with my friends.'],why:'Present continuous = am + verb-ing.'}
  ],
  end:'Continue the chat: ask Dana three questions about her family and her hobbies.'},
 {title:'At the café',who:'Max',set:'You are in a café with a friend.',
  turns:[
   {them:'This café is nice! Is there any cake?',t:'there is / are',o:['Yes, there are some cakes on the menu.','Yes, there is some cakes on the menu.','Yes, it are some cakes on the menu.'],why:'Plural cakes → there are.'},
   {them:'What do you want?',t:'a / an',o:['I want a sandwich and an orange juice.','I want sandwich and orange juice.','I want an sandwich and a orange juice.'],why:'a before a consonant sound, an before a vowel sound.'},
   {them:'Look at those people over there! Do you know them?',t:'object pronouns',o:['Yes, I know them. They’re my neighbours.','Yes, I know they. They’re my neighbours.','Yes, I know their. They’re my neighbours.'],why:'After a verb we use the object pronoun them.'},
   {them:'Whose bag is this on the chair?',t:'possessives',o:['It’s my sister’s bag.','It’s my sister bag.','It’s me sister’s bag.'],why:'Add ’s for the owner: my sister’s bag.'},
   {them:'Your sister is here? Where is she?',t:'present continuous',o:['She’s talking on the phone outside.','She talk on the phone outside.','She is talk on the phone outside.'],why:'Action happening now → is + verb-ing.'},
   {them:'OK! The cake is here. How is it?',t:'adjectives',o:['It’s a very good cake!','It’s a cake very good!','It’s a very goods cake!'],why:'The adjective goes before the noun and has no -s.'}
  ],
  end:'Now order food out loud: tell the waiter what you want and ask one question about the menu.'},
 {title:'Weekend news',who:'Aliya',set:'It’s Monday. Your friend asks about your weekend.',
  turns:[
   {them:'Hi! Where were you on Saturday?',t:'was / were',o:['I was at my grandma’s house.','I were at my grandma’s house.','I am at my grandma’s house yesterday.'],why:'Past of be with I is was.'},
   {them:'Nice! Were your cousins there?',t:'was / were',o:['Yes, they were. We were very happy.','Yes, they was. We was very happy.','Yes, they were. We is very happy.'],why:'they / we → were.'},
   {them:'How many cousins have you got?',t:'plurals',o:['I’ve got four cousins: two boys and two girls.','I’ve got four cousin: two boy and two girl.','I’ve got four cousins: two boies and two girls.'],why:'Plural nouns take -s: cousins, boys, girls.'},
   {them:'When is your grandma’s birthday?',t:'prepositions',o:['It’s in July, on the 5th.','It’s on July, in the 5th.','It’s at July, on the 5th.'],why:'in + month, on + date.'},
   {them:'What does your grandma like?',t:'present simple',o:['She likes flowers and old films.','She like flowers and old films.','She is like flowers and old films.'],why:'Present simple with she: verb + -s.'},
   {them:'Sweet! Who do you usually visit on Sunday?',t:'question words',o:['I usually visit my uncle. Who do you visit?','I usually visit my uncle. Who you visit?','I usually visit my uncle. Who does you visit?'],why:'Question word + do + you + verb.'}
  ],
  end:'Tell Aliya about your weekend in four sentences. Use was / were.'},
 {title:'In the classroom',who:'Mr Timur',set:'Your teacher gives instructions and asks questions.',
  turns:[
   {them:'Good morning! Please open your books. Is this your book?',t:'this / that',o:['No, it isn’t. That book over there is mine.','No, it isn’t. Those book over there is mine.','No, it isn’t. This book over there is mine.'],why:'One thing far away → that.'},
   {them:'OK. Everyone, listen. What do you say to a friend who is late?',t:'imperatives',o:['Don’t be late again!','Not be late again!','Don’t late again!'],why:'Negative instruction: Don’t + base verb (be).'},
   {them:'Good. Can you help Arman with exercise 2?',t:'object pronouns',o:['Yes, I can help him.','Yes, I can help he.','Yes, I can help his.'],why:'After help we need the object pronoun him.'},
   {them:'Thank you. Are there any questions?',t:'there is / are',o:['Yes, there is one question. What does “brave” mean?','Yes, there are one question. What does “brave” mean?','Yes, it is one question. What means “brave”?'],why:'One question → there is; questions need does.'},
   {them:'“Brave” means not afraid. Who is brave in your family?',t:'to be',o:['My brother is very brave.','My brother very brave.','My brother are very brave.'],why:'Don’t forget be: my brother is.'},
   {them:'Great! Where is your homework?',t:'possessives',o:['My homework is in my bag.','Me homework is in me bag.','I homework is in I bag.'],why:'Possessive adjective before a noun: my.'}
  ],
  end:'Be the teacher: give your partner three instructions and ask two questions.'}
];

CHATB.A2=[
 {title:'Weekend plans',who:'Dana',set:'Your classmate Dana is texting you on Friday.',
  turns:[
   {them:'Hi! What are you doing at the moment?',t:'present simple / continuous',o:['I’m doing my homework.','I do my homework now.','I doing my homework.'],why:'For something happening now, use am / is / are + -ing.'},
   {them:'What are you going to do this weekend?',t:'future',o:['I’m going to visit my cousins.','I going to visit my cousins.','I’m going visit my cousins.'],why:'Plans use am / is / are + going to + verb.'},
   {them:'Cool! Do you see them often?',t:'adverbs of frequency',o:['No, I usually see them once a month.','No, I see usually them once a month.','No, usually I am see them once a month.'],why:'Frequency adverbs go before the main verb.'},
   {them:'Do you like playing games with them?',t:'like + -ing',o:['Yes, I love playing board games with them.','Yes, I love play board games with them.','Yes, I love to playing board games with them.'],why:'After love, use the -ing form.'},
   {them:'I’m bored. I’ve got nothing to do!',t:'should',o:['You should come with us!','You should to come with us!','You should coming with us!'],why:'After should, use the base verb without to.'},
   {them:'Really? OK! What time do we leave?',t:'prepositions of time',o:['At ten o’clock on Saturday.','In ten o’clock on Saturday.','At ten o’clock in Saturday.'],why:'Use at for clock times and on for days.'}
  ],
  end:'Continue the chat out loud: tell Dana three things you are going to do at your cousins’ house.'},
 {title:'Back from holiday',who:'Arman',set:'You meet your friend Arman after the holidays.',
  turns:[
   {them:'Hey! Where did you go in the holidays?',t:'past simple',o:['I went to Turkey with my family.','I go to Turkey with my family.','I did go to Turkey with my family.'],why:'Finished time in the past: use the past simple (go → went).'},
   {them:'Wow! Have you ever been there before?',t:'present perfect',o:['No, I’ve never been there before.','No, I never was there before.','No, I haven’t never been there before.'],why:'For life experience use the present perfect; never is already negative.'},
   {them:'Was it hot?',t:'comparatives',o:['Yes, it was much hotter than here!','Yes, it was much more hot than here!','Yes, it was much hotter that here!'],why:'Short adjectives take -er + than.'},
   {them:'What was the best thing about the trip?',t:'superlatives',o:['The sea was the best thing.','The sea was the most good thing.','The sea was best thing.'],why:'good → the best (irregular), and we need the.'},
   {them:'Did anything bad happen?',t:'past continuous',o:['I was swimming when I lost my sunglasses!','I swam when I was losing my sunglasses!','I was swim when I lost my sunglasses!'],why:'The long action is past continuous; the short event is past simple.'},
   {them:'Oh no! Did you find them?',t:'past simple',o:['No, I didn’t find them.','No, I didn’t found them.','No, I not found them.'],why:'After didn’t, use the base verb.'}
  ],
  end:'Now ask Arman about his holidays. Ask four past simple questions and answer his questions too.'},
 {title:'At the café',who:'Aliya',set:'You and Aliya are ordering food in a café.',
  turns:[
   {them:'What would you like?',t:'like + -ing',o:['I’d like to have a burger, please.','I’d like have a burger, please.','I like having a burger, please.'],why:'Would like is followed by to + verb.'},
   {them:'Is there any cheese on it?',t:'some / any',o:['Yes, there’s some cheese on it.','Yes, there’s any cheese on it.','Yes, there are some cheese on it.'],why:'Use some in positive sentences; cheese is uncountable, so there is.'},
   {them:'How much money have you got?',t:'much / many',o:['I haven’t got much money — only 2000 tenge.','I haven’t got many money — only 2000 tenge.','I haven’t got much moneys — only 2000 tenge.'],why:'Money is uncountable, so use much.'},
   {them:'Is that enough for a burger?',t:'too / enough',o:['No, it isn’t enough. The burger is too expensive.','No, it isn’t enough. The burger is enough expensive.','No, it isn’t enough. The burger is too much expensive.'],why:'too + adjective means more than we want.'},
   {them:'Don’t worry, I’ll pay. Is this your bag on the chair?',t:'possessive pronouns',o:['No, it isn’t mine. I think it’s Timur’s.','No, it isn’t my. I think it’s Timur’s.','No, it isn’t me. I think it’s Timur’s.'],why:'With no noun after it, use mine.'},
   {them:'OK. Can you give it to Timur later?',t:'object pronouns',o:['Sure, I’ll give it to him.','Sure, I’ll give it to he.','Sure, I’ll give it to his.'],why:'After to, use the object pronoun him.'}
  ],
  end:'Role-play the rest of the visit: order a drink and a dessert, and say what you think of the food.'},
 {title:'New school rules',who:'Timur',set:'Timur is asking you about your school.',
  turns:[
   {them:'Do you have to wear a uniform at your school?',t:'must / have to',o:['Yes, we have to wear a white shirt.','Yes, we must to wear a white shirt.','Yes, we has to wear a white shirt.'],why:'have to + base verb; with we use have, not has.'},
   {them:'Can you use your phone in class?',t:'must / have to',o:['No, we mustn’t use phones in class.','No, we don’t have to use phones in class.','No, we mustn’t to use phones in class.'],why:'mustn’t means it isn’t allowed.'},
   {them:'Do you have to go to school on Saturdays?',t:'must / have to',o:['No, we don’t have to go on Saturdays.','No, we mustn’t go on Saturdays.','No, we don’t must go on Saturdays.'],why:'don’t have to means it isn’t necessary.'},
   {them:'Is your school big?',t:'superlatives',o:['Yes, it’s the biggest school in our town.','Yes, it’s the most big school in our town.','Yes, it’s biggest school in our town.'],why:'big → the biggest (double g).'},
   {them:'Do you like your teachers?',t:'object pronouns',o:['Yes, I like them a lot.','Yes, I like they a lot.','Yes, I like their a lot.'],why:'After a verb, use the object pronoun them.'},
   {them:'What subject is the most difficult for you?',t:'comparatives',o:['Physics. It’s more difficult than maths for me.','Physics. It’s difficulter than maths for me.','Physics. It’s more difficult that maths for me.'],why:'Long adjectives use more + adjective + than.'}
  ],
  end:'Tell Timur three rules at your school: one you have to follow, one thing you mustn’t do, and one thing you don’t have to do.'}

 {title:'Lost phone',who:'Arman',set:'Your friend Arman can’t find his phone.',
  turns:[
   {them:'I can’t find my phone anywhere!',t:'modals of deduction',o:['It must be in your bag. You had it five minutes ago.','It must to be in your bag. You had it five minutes ago.','It can be in your bag for sure. You had it five minutes ago.'],why:'must + base verb when we are sure something is true.'},
   {them:'It isn’t. I looked. When did you last see it?',t:'past continuous',o:['You were using it when we were waiting for the bus.','You used it when we waited for the bus at that moment.','You were use it when we were waiting for the bus.'],why:'Past continuous for two actions in progress at the same time.'},
   {them:'Oh no. Do you think someone took it?',t:'modals of deduction',o:['It might be at the bus stop. Someone might have found it.','It must be stolen for sure, maybe.','It can’t be anywhere, I think.'],why:'might shows something is possible but not certain.'},
   {them:'What should I do?',t:'second conditional',o:['If I were you, I’d call the bus company.','If I was you, I will call the bus company.','If I would be you, I’d call the bus company.'],why:'If I were you + would gives advice.'},
   {them:'Good idea. What did they say? You called them, right?',t:'reported speech',o:['They said someone had found a phone on the bus.','They said someone has found a phone on the bus yesterday.','They told someone had found a phone on the bus.'],why:'In reported speech the tense moves back and we use say (not tell) without a person.'},
   {them:'Brilliant! I’m going to collect it now.',t:'question tags',o:['That’s lucky, isn’t it?','That’s lucky, is it?','That’s lucky, doesn’t it?'],why:'A positive sentence with is takes the negative tag isn’t it.'}
  ],end:'Tell your partner about a time you lost something. How did it happen and did you find it?'},
 {title:'Weekend plans',who:'Dana',set:'Dana wants to make plans for the weekend.',
  turns:[
   {them:'What are you doing on Saturday?',t:'future forms',o:['I’m meeting my cousins in the morning.','I meet my cousins in the morning, I decided.','I will meeting my cousins in the morning.'],why:'Present continuous for an arrangement with other people.'},
   {them:'And in the afternoon? Do you want to see a film?',t:'-ing or to',o:['Yes! I’d love to see the new Marvel film.','Yes! I’d love seeing the new Marvel film.','Yes! I’d love see the new Marvel film.'],why:'would love + to-infinitive.'},
   {them:'Great. What time does it start?',t:'future forms',o:['It starts at 4 o’clock.','It will starting at 4 o’clock.','It is going to starts at 4 o’clock.'],why:'Present simple for timetables.'},
   {them:'Should we take the bus or walk?',t:'too / enough',o:['Let’s take the bus. It’s too far to walk.','Let’s take the bus. It’s too much far to walk.','Let’s take the bus. It’s enough far to walk.'],why:'too + adjective + to-infinitive.'},
   {them:'Do you have money for popcorn?',t:'quantifiers',o:['I have a little money, but not much.','I have a few money, but not much.','I have few money, but not many.'],why:'money is uncountable, so a little (not a few).'},
   {them:'OK. I’ll book the tickets now.',t:'first conditional',o:['Great! I’ll pay you back as soon as I see you.','Great! I’ll pay you back as soon as I will see you.','Great! I pay you back as soon as I will see you.'],why:'After as soon as we use the present, not will.'}
  ],end:'Plan your perfect weekend with your partner. Say what you’re doing, what you’re going to do and what time things start.'},
 {title:'At the museum',who:'Guide',set:'You are on a school trip to a history museum.',
  turns:[
   {them:'Welcome! This building is very old. Can anyone guess when it was built?',t:'passive',o:['Was it built in the nineteenth century?','Did it built in the nineteenth century?','Was it build in the nineteenth century?'],why:'Passive question: was + subject + past participle (built).'},
   {them:'Yes! And this is the room… can you guess?',t:'relative clauses',o:['Is it the room where the first school was?','Is it the room which the first school was?','Is it the room who the first school was?'],why:'where for places.'},
   {them:'Exactly. Have you ever been to a museum like this before?',t:'present perfect / past',o:['No, I’ve never been to one like this.','No, I never was to one like this.','No, I haven’t never been to one like this.'],why:'Present perfect with never for life experience; only one negative.'},
   {them:'This old map is much more detailed than modern ones.',t:'comparisons',o:['Really? It looks much older than I expected.','Really? It looks much more older than I expected.','Really? It looks very older than I expected.'],why:'much + comparative; never more + -er.'},
   {them:'Please don’t touch the paintings.',t:'reported speech',o:['(to a friend) She told us not to touch the paintings.','(to a friend) She told us don’t touch the paintings.','(to a friend) She said us not to touch the paintings.'],why:'tell + person + not to + verb for reported orders.'},
   {them:'Any more questions?',t:'indirect questions',o:['Could you tell us how old this sword is?','Could you tell us how old is this sword?','Could you tell us how old does this sword is?'],why:'Indirect question: normal word order (this sword is).'}
  ],end:'Describe a museum or historic place you know. When was it built, what is kept there, and would you recommend it?'}
];

CHATB.B2=[
 {title:'The missed flight',who:'Daniyar',set:'Your friend calls you after your trip went wrong.',
  turns:[
   {them:'Hey! Why didn’t you come to the airport on time?',t:'past perfect',o:['When I got there, the gate had already closed.','When I got there, the gate has already closed.','When I got there, the gate already closed before.'],why:'The gate closed before you arrived, so use the past perfect: had closed.'},
   {them:'Oh no! Could you have avoided it?',t:'third conditional',o:['If I had left home earlier, I wouldn’t have missed it.','If I left home earlier, I wouldn’t have missed it.','If I would have left earlier, I wouldn’t miss it.'],why:'Imagined past: If + had done, would have done.'},
   {them:'So where are you now?',t:'mixed conditionals',o:['Still in Astana. If I hadn’t missed the flight, I’d be in Dubai now.','Still in Astana. If I didn’t miss the flight, I’d be in Dubai now.','Still in Astana. If I hadn’t missed the flight, I’d have been in Dubai now.'],why:'Past cause, present result: If + had done, would + verb now.'},
   {them:'That’s so annoying. How do you feel?',t:'wish',o:['I wish I had checked the time more carefully.','I wish I checked the time more carefully yesterday.','I wish I would check the time yesterday.'],why:'Regret about the past: wish + past perfect.'},
   {them:'Did they let you change the ticket?',t:'have something done',o:['Yes, I had my ticket changed for tomorrow.','Yes, I had changed my ticket by them for tomorrow.','Yes, I had my ticket change for tomorrow.'],why:'Someone did it for you: have + object + past participle.'},
   {them:'Great. What will you be doing tomorrow at this time?',t:'future continuous / perfect',o:['I’ll be flying over the Caspian Sea!','I’ll fly over the Caspian Sea at this time!','I’ll have been fly over the Caspian Sea!'],why:'An action in progress at a future moment: will be + -ing.'}],
  end:'Tell your partner about a trip that went wrong. Use had done, If I had…, and I wish I had…'},
 {title:'Moving abroad',who:'Ms Clarke',set:'Your English teacher asks about your cousin who moved to Canada.',
  turns:[
   {them:'How is your cousin finding life in Toronto?',t:'be / get used to',o:['She’s slowly getting used to the cold winters.','She’s slowly getting used to the cold winters live.','She slowly used to the cold winters.'],why:'A situation becoming normal: get used to + noun / -ing.'},
   {them:'Did she find a flat easily?',t:'linkers',o:['Yes, despite the high prices.','Yes, despite the prices were high.','Yes, although the high prices.'],why:'despite is followed by a noun, not a full clause.'},
   {them:'What does she miss most?',t:'verbs that change meaning',o:['She misses our family dinners. She remembers cooking with Grandma every Sunday.','She misses our family dinners. She remembers to cook with Grandma every Sunday as a child.','She misses our family dinners. She remembers cook with Grandma.'],why:'remember + -ing = a memory of the past.'},
   {them:'Has she made friends there?',t:'quantifiers',o:['Yes, a few. Her neighbour, who is also from Kazakhstan, helps her a lot.','Yes, few. Her neighbour, that is also from Kazakhstan, helps her a lot.','Yes, a little friends. Her neighbour, who is also from Kazakhstan, help her a lot.'],why:'a few (positive) with countable nouns; who in a non-defining clause.'},
   {them:'Did anyone give her advice before she went?',t:'reporting verbs',o:['Yes, my dad advised her to learn French as well.','Yes, my dad advised her learning French as well.','Yes, my dad suggested her to learn French as well.'],why:'advise + person + to + verb.'},
   {them:'Would you like to live abroad one day?',t:'it’s time / would rather',o:['I’d rather study abroad first and then decide.','I’d rather to study abroad first and then decide.','I’d rather studying abroad first and then decide.'],why:'would rather + base verb, no to.'}],
  end:'Would you move abroad? Discuss with your partner what would be hard to get used to.'},
 {title:'The mystery at school',who:'Aliya',set:'Your classmate tells you some news before the lesson.',
  turns:[
   {them:'Did you hear? Someone broke the window in the science lab!',t:'passive',o:['Really? Has the person been found yet?','Really? Has the person found yet?','Really? Has been the person found yet?'],why:'Present perfect passive: has been + past participle.'},
   {them:'Not yet. The broken glass is all over the floor.',t:'modal perfects',o:['It must have happened last night.','It must happen last night.','It must have happen last night.'],why:'Sure about the past: must have + past participle.'},
   {them:'Some people think it was Timur.',t:'modal perfects',o:['He can’t have done it. He was at the football match.','He mustn’t have done it. He was at the football match.','He can’t do it yesterday. He was at the football match.'],why:'Sure something didn’t happen: can’t have + past participle.'},
   {them:'The head teacher looks really angry.',t:'reporting verbs',o:['I know. She accused the whole class of being careless.','I know. She accused the whole class to be careless.','I know. She accused the whole class for being careless.'],why:'accuse someone of + -ing.'},
   {them:'What should we do?',t:'it’s time / would rather',o:['It’s time we told her what we know.','It’s time we tell her what we know.','It’s time we would tell her what we know.'],why:'It’s time + subject + past simple.'},
   {them:'OK. Who saw something?',t:'participle clauses',o:['Walking past the lab, I saw a ball near the window.','Walking past the lab, a ball was near the window.','Walked past the lab, I saw a ball near the window.'],why:'The participle clause must describe the subject (I).'}],
  end:'Play detective with your partner: invent a mystery and use must have, might have and can’t have.'},
 {title:'Planning a charity event',who:'Arman',set:'You and a friend are organising a charity concert at school.',
  turns:[
   {them:'Who is this concert for?',t:'articles',o:['It’s to help the elderly in our town.','It’s to help elderly in our town.','It’s to help the elderlies in our town.'],why:'the + adjective describes a group of people.'},
   {them:'Who is going to design the posters?',t:'have something done',o:['We’re having them printed by a professional.','We’re having them print by a professional.','We’re having printed them by a professional.'],why:'have + object + past participle.'},
   {them:'Will everything be ready on time?',t:'future continuous / perfect',o:['Yes, by Friday we’ll have sold all the tickets.','Yes, by Friday we’ll sell all the tickets already.','Yes, by Friday we’ll have sell all the tickets.'],why:'Finished before a future time: will have + past participle.'},
   {them:'What if it rains? It’s outside.',t:'linkers',o:['Let’s book the hall in case it rains.','Let’s book the hall in case it will rain.','Let’s book the hall unless it rains.'],why:'in case + present simple = as a precaution.'},
   {them:'Should we invite the mayor?',t:'relative clauses',o:['Yes, and the journalist whose daughter is in our class.','Yes, and the journalist who daughter is in our class.','Yes, and the journalist which daughter is in our class.'],why:'whose shows possession.'},
   {them:'I’m so nervous about it.',t:'wish',o:['Me too. I wish we had more time to prepare.','Me too. I wish we have more time to prepare.','Me too. I wish we would have more time to prepare.'],why:'A wish about now: wish + past simple.'}],
  end:'With your partner, plan your own charity event: who it helps, what you’ll have done by the day, and what could go wrong.'}
];
