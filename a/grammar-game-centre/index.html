 {title:'The job interview',who:'Ms Karimova',set:'You are being interviewed for a marketing manager position at an international company.',
  turns:[
   {them:'Thank you for coming. Why did you leave your previous position?',t:'cleft sentences',o:['What I was looking for was more responsibility, which my old role couldn’t offer.','What I was looking for were more responsibility, which my old role couldn’t offer.','It was more responsibility what I was looking for.'],why:'A What-clause takes a singular verb (was), and the It-cleft needs that, not what.'},
   {them:'I see. Has anything in your career really impressed you?',t:'inversion',o:['Rarely have I seen a team respond to a crisis as well as mine did last year.','Rarely I have seen a team respond to a crisis as well as mine did last year.','Rarely did I have seen a team respond to a crisis as well as mine did.'],why:'After a negative adverb at the start, the auxiliary comes before the subject: Rarely have I seen.'},
   {them:'Your CV says you nearly moved to Dubai. What happened?',t:'future in the past',o:['I was going to accept an offer there, but my family needed me at home.','I will accept an offer there, but my family needed me at home.','I was going to accepted an offer there, but my family needed me at home.'],why:'was going to + base verb describes a past plan that did not happen.'},
   {them:'Looking back, would anything be different if you had stayed in sales?',t:'mixed conditionals',o:['If I had stayed in sales, I wouldn’t have the strategic experience I have now.','If I would have stayed in sales, I wouldn’t have the strategic experience I have now.','If I had stayed in sales, I wouldn’t had the strategic experience I have now.'],why:'A past condition (had stayed) with a present result (wouldn’t have now) is a mixed conditional.'},
   {them:'How do you usually handle criticism?',t:'dependent prepositions',o:['I try not to be too sensitive to it; there’s no point in taking it personally.','I try not to be too sensitive about it; there’s no point to take it personally.','I try not to be too sensitive for it; there’s no point in take it personally.'],why:'We say sensitive to and no point in + -ing.'},
   {them:'Finally, do you think the market will grow next year?',t:'hedging',o:['It seems likely to grow, although the figures appear to be quite uncertain.','It seems likely growing, although the figures appear being quite uncertain.','It is likely it grows, although the figures are appearing uncertain.'],why:'Hedging uses seem/appear + to-infinitive: seems likely to grow, appear to be.'}
  ],
  end:'Ask Ms Karimova two questions of your own about the company, using at least one cleft sentence and one hedging expression.'},
 {title:'The seminar debate',who:'Professor Lee',set:'A university seminar on whether social media does more harm than good.',
  turns:[
   {them:'Let’s begin. What is the main argument against social media?',t:'hedging',o:['It could be argued that it may damage young people’s concentration.','It could argue that it may damage young people’s concentration.','It could be argued that it may to damage young people’s concentration.'],why:'The passive It could be argued that… is the correct hedging formula; may + base verb.'},
   {them:'Interesting. And what about its benefits?',t:'formal linkers',o:['It helps people stay in touch, albeit at the cost of their privacy.','It helps people stay in touch, albeit it costs their privacy a lot.','It helps people stay in touch, despite it costs their privacy.'],why:'albeit is followed by a phrase, not a full clause; despite cannot take a clause.'},
   {them:'Is it true that teenagers spend more time online than adults?',t:'comparison nuance',o:['Yes, and by far the heaviest users are teenagers.','Yes, and by far heavier users are teenagers.','Yes, and the by far heaviest users are teenagers.'],why:'by far goes before the + superlative: by far the heaviest.'},
   {them:'What does the research actually say?',t:'advanced passive',o:['Social media is thought to have contributed to rising anxiety levels.','Social media is thought to have been contributed to rising anxiety levels.','Social media is thought that it contributed to rising anxiety levels.'],why:'An earlier active action needs is thought to have + past participle.'},
   {them:'So what should be done?',t:'subjunctive',o:['I would recommend that schools teach digital literacy from an early age.','I would recommend that schools teaches digital literacy from an early age.','I would recommend schools to teaching digital literacy from an early age.'],why:'recommend that + subject + base verb (subjunctive): schools teach.'},
   {them:'Do you think everyone agrees with that?',t:'quantifier nuance',o:['Few would disagree, but quite a few parents worry about the cost.','A few would disagree, but quite few parents worry about the cost.','Few would disagree, but quite little parents worry about the cost.'],why:'Few = almost nobody (negative); quite a few = a surprisingly large number; parents is countable.'}
  ],
  end:'Sum up your position for the seminar in 4–5 sentences, using one formal linker, one hedge and one cleft sentence.'},
 {title:'The missed flight',who:'Arman',set:'Your friend calls you after a disastrous trip to Istanbul.',

  ],
  end:'Tell Arman about a travel disaster of your own. Use was about to, must have and one inversion.'},

function nrmV(s){s=(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-');
 s=s.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'cannot').replace(/\bshan't\b/g,'shall not').replace(/\bain't\b/g,'is not').replace(/n't\b/g,' not')
  .replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will').replace(/\bcan not\b/g,'cannot');
 s=s.replace(/[.,!?;:"()]/g,' ').replace(/\s+/g,' ').trim();
 const a=s.replace(/'d\b/g,' would').replace(/'s\b/g,' is'),b=s.replace(/'d\b/g,' had').replace(/'s\b/g,' has');
 return [a,b]}
function same(user,ans){const u=nrmV(user);return ans.split('|').some(x=>{const v=nrmV(x);return u.some(p=>v.includes(p))})}
function stripStart(user,start){if(!start)return user;const U=nrmV(user),S=nrmV(start);for(let i=0;i<2;i++){if(S[i]&&U[i].startsWith(S[i]+' '))return U[i].slice(S[i].length+1)}return user}

  $('#tg').textContent=it[0];$('#q').textContent=it[1];$('#fb').innerHTML='';const box=$('#op');box.className='opts'+(opts.length===4?' two':'');box.innerHTML='';

 $('#nt').querySelectorAll('button').forEach(b=>b.onclick=()=>{nt=+b.dataset.k;$('#nt').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));names()});
 $('#pq').querySelectorAll('button').forEach(b=>b.onclick=()=>{per=+b.dataset.k;$('#pq').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
 $('#go').onclick=()=>{const teams=Array.from({length:nt},(_,i)=>({name:($('#tn'+i).value||'Team '+(i+1)).trim(),score:0}));battle(teams,per)};
}
function battle(teams,per){const p=P[L];const {items}=pool('m');const total=teams.length*per;const Q=shuffle(items);let qi=0,turn=0,lock=false,t=0,last=0,stealFrom=-1;
 function board(){return `<div class="teams">${teams.map((tm,i)=>`<div class="tm ${i===turn?'turn':''}"><span>${esc(tm.name)}</span><b>${tm.score}</b></div>`).join('')}</div>`}
 function show(){stopTimers();if(qi>=total)return finish();
  const it=Q[qi%Q.length];const opts=shuffle(it[2].map((o,i)=>({o,ok:i===0})));t=p.team;lock=false;last=performance.now();stealFrom=-1;
  $('#stage').innerHTML=`${board()}<div class="hud"><div class="clock" id="clk">${t}</div><div class="grow"><p class="tag" style="margin:0">Question ${qi+1} of ${total} · ${esc(it[0])}</p><b id="who">${esc(teams[turn].name)}, it’s your turn</b></div></div><div class="bar"><i id="bar"></i></div><p class="q">${esc(it[1])}</p><div class="opts ${opts.length===4?'two':''}" id="op"></div><div id="fb"></div>`;
  const box=$('#op');opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<kbd>${i+1}</kbd><span></span>`;b.lastChild.textContent=DISP(o.o);b.onclick=()=>pick(i);box.appendChild(b)});
  keyFn=e=>{const k=+e.key;if(k>=1&&k<=opts.length)pick(k-1)};
  function pick(i){if(lock)return;const bs=[...box.children];const o=i>=0?opts[i]:null;
   if(o&&o.ok){lock=true;bs.forEach(b=>b.disabled=true);bs[i].classList.add('ok');beep(true);const pts=stealFrom<0?100+Math.round(Math.max(0,t)/p.team*50):50;teams[turn].score+=pts;
    $('#fb').innerHTML=`<div class="feedback"><b>Correct! +${pts} to ${esc(teams[turn].name)}.</b> ${esc(it[3])}</div><div class="actions"><button class="primary" id="nx">Next question</button></div>`;nextBtn(stealFrom<0?turn:stealFrom);return}
   if(o){bs[i].disabled=true;bs[i].classList.add('bad');beep(false)}
   if(stealFrom<0&&teams.length>1){stealFrom=turn;turn=(turn+1)%teams.length;t=Math.ceil(p.team/2);last=performance.now();$('#who').textContent=`${teams[turn].name}, steal it for 50 points!`;document.querySelector('.teams').outerHTML=board();return}
   lock=true;bs.forEach(b=>b.disabled=true);bs[opts.findIndex(x=>x.ok)].classList.add('ok');
   $('#fb').innerHTML=`<div class="feedback">No points this time. The answer is <b>${esc(DISP(it[2][0]))}</b>. ${esc(it[3])}</div><div class="actions"><button class="primary" id="nx">Next question</button></div>`;nextBtn(stealFrom<0?turn:stealFrom)}
  function nextBtn(owner){stopTimers();document.querySelector('.teams').outerHTML=board();$('#nx').onclick=()=>{qi++;turn=(owner+1)%teams.length;show()};$('#nx').focus()}
  timers.push(setInterval(()=>{const now=performance.now();if(!NOTE_OPEN)t-=(now-last)/1000;last=now;if(lock||NOTE_OPEN)return;if(t<=0){t=0;pick(-1)}const c=$('#clk');if(c){c.textContent=Math.ceil(t);c.classList.toggle('low',t<=5);$('#bar').style.width=Math.min(100,t/p.team*100)+'%'}},100));
 }
 function stopTimers(){timers.forEach(clearInterval);timers=[]}
 function finish(){stopAll();const s=teams.slice().sort((a,b)=>b.score-a.score);const tie=s.length>1&&s[0].score===s[1].score;
  $('#stage').innerHTML=`<p class="label">Battle over · ${L}</p><div class="big" style="font-size:clamp(40px,9vw,68px)">${tie?'It’s a draw!':esc(s[0].name)+' win!'}</div><div class="teams" style="margin-top:16px">${s.map((tm,i)=>`<div class="tm ${i===0&&!tie?'turn':''}"><span>${i+1}. ${esc(tm.name)}</span><b>${tm.score}</b></div>`).join('')}</div><div class="actions"><button class="primary" id="ag">Play again</button><button class="secondary" id="ot">Choose another game</button></div>`;
  $('#ag').onclick=gTeam;$('#ot').onclick=level}
 show();
}

/* ---------------- LEVEL TEST ---------------- */
function placement(){stopAll();
 const Q=[];ORDER.forEach(lv=>shuffle(LV[lv].m).slice(0,5).forEach(it=>Q.push({lv,it})));
 const sc={A1:0,A2:0,B1:0,B2:0,C1:0};let qi=0;
 app.innerHTML=`<button class="crumb" id="back">← All levels</button><div class="stage" id="stage" style="margin-top:12px"></div>`;$('#back').onclick=hub;
 function show(){if(qi>=Q.length)return done();const {lv,it}=Q[qi];const opts=shuffle(it[2].map((o,i)=>({o,ok:i===0})));
  const dots=Q.map((_,i)=>`<i class="${i<qi?'done':i===qi?'now':''}"></i>`).join('');
  $('#stage').innerHTML=`<p class="label">Level test · question ${qi+1} of ${Q.length}</p><div class="dots">${dots}</div><p class="q">${esc(it[1])}</p><div class="opts ${opts.length===4?'two':''}" id="op"></div><p class="muted small" style="margin-top:14px">The questions get harder as you go. Choose “I don’t know” rather than guessing.</p><div class="actions"><button class="secondary" id="dk">I don’t know</button></div>`;
  const box=$('#op');opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<kbd>${i+1}</kbd><span></span>`;b.lastChild.textContent=DISP(o.o);b.onclick=()=>{if(o.ok)sc[lv]++;qi++;show()};box.appendChild(b)});
  $('#dk').onclick=()=>{qi++;show()};
  keyFn=e=>{const k=+e.key;if(k>=1&&k<=opts.length)box.children[k-1].click()}}
 function done(){keyFn=null;let rec='A1';for(const lv of ORDER){if(sc[lv]>=3)rec=lv;else break}
  SAVE.placed=rec;persist();
  $('#stage').innerHTML=`<p class="label">Your result</p><div class="row" style="gap:18px"><div class="badge" style="${badgeStyle(rec)}">${rec}</div><div><h2 style="font-size:32px">${LV[rec].name}</h2><p class="muted" style="margin:4px 0 0">Start here. When you master the games at ${rec}, move up a step.</p></div></div>
   <div class="plbars">${ORDER.map(lv=>`<div class="plbar"><b>${lv}</b><div class="track"><i style="width:${sc[lv]/5*100}%"></i></div><span>${sc[lv]} / 5</span></div>`).join('')}</div>
   <p class="muted small">A level counts as passed with 3 or more correct out of 5, and every level below it must be passed too.</p>
   <div class="actions"><button class="primary" id="play">Play at ${rec}</button><button class="secondary" id="hb">Back to all levels</button></div>`;
  $('#play').onclick=()=>{L=rec;T='all';level()};$('#hb').onclick=hub}
 show();
}
hub();
initCaps();
</script>
