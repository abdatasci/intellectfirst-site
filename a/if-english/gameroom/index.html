const TOPIC={food:'Food & drink',travel:'Travel & holidays',tech:'Technology',society:'Society & issues',home:'Home',work:'Work & jobs',school:'School & study',health:'Health & body',sport:'Sport & free time',shopping:'Shopping & money',nature:'Nature & weather',people:'People & feelings',city:'Town & city',culture:'Culture & media'};
const LV={A:'A1–A2',B:'B1–B2',C:'C1'};
const BOOK=Object.fromEntries(BOOKS.map(b=>[b.id,b]));
const WORDCOUNT=Object.values(DECKS).reduce((s,d)=>s+d.length,0)+BOOKS.reduce((s,b)=>s+b.units.reduce((t,u)=>t+u[2].length,0),0);
const SRC=[['gen','General English · levels & topics'],['ef','English File A1–C1'],['ex','Young learners, teens & exams']];
let VS=gs.get('vs2',{src:'gen',lv:['A'],tp:['food','home','people'],book:{ef:'B1',ex:'Flyers'},un:['B1|1A','B1|1B']});
function pool(){
  const r=[];
  if(VS.src==='gen'){VS.tp.forEach(tp=>(DECKS[tp]||[]).forEach(x=>{if(VS.lv.includes(x.lv))r.push({w:x.w,t:x.t,def:'',ru:'',tag:TOPIC[tp]+' · '+LV[x.lv]})}));return r}
  VS.un.forEach(key=>{const [b,c]=key.split('|');const bk=BOOK[b];if(!bk||bk.grp!==VS.src)return;const u=bk.units.find(u=>u[0]===c);if(!u)return;
    u[2].forEach(w=>r.push({w:w[0],def:w[1],ru:w[2],t:w[3]&&w[3].length?w[3]:[],tag:bk.name+' · '+c+' '+u[1]}))});
  return r;
}
const clueOf=x=>x.def||x.t.join(' · ');
function vocabPanel(title){
  const p=pool();let body;
  if(VS.src==='gen'){
    const tcount=tp=>(DECKS[tp]||[]).filter(x=>VS.lv.includes(x.lv)).length;
    body=`<div><div class="sublab">Level</div><div class="chips">${Object.keys(LV).map(k=>`<button class="chipbtn ${VS.lv.includes(k)?'on':''}" data-vlv="${k}" aria-pressed="${VS.lv.includes(k)}">${LV[k]}</button>`).join('')}</div></div>
    <div><div class="sublab">Topics <button class="lnk" data-vall="1">all 14</button> · <button class="lnk" data-vnone="1">none</button></div><div class="chips">${Object.keys(TOPIC).map(k=>`<button class="chipbtn ${VS.tp.includes(k)?'on':''}" data-vtp="${k}" aria-pressed="${VS.tp.includes(k)}">${TOPIC[k]}<i>${tcount(k)}</i></button>`).join('')}</div></div>`;
  }else{
    const books=BOOKS.filter(b=>b.grp===VS.src);const cur=BOOK[VS.book[VS.src]]||books[0];
    const sel=k=>VS.un.includes(cur.id+'|'+k);
    const other=VS.un.filter(k=>!k.startsWith(cur.id+'|')&&BOOK[k.split('|')[0]]?.grp===VS.src).length;
    body=`<div><div class="sublab">${VS.src==='ef'?'Level':'Course'}</div><div class="chips">${books.map(b=>{const n=VS.un.filter(k=>k.startsWith(b.id+'|')).length;return `<button class="chipbtn ${b.id===cur.id?'on':''}" data-vbook="${b.id}">${b.name.split(' · ').slice(VS.src==='ef'?1:0).join(' · ')}${n?`<i>${n} sel.</i>`:''}</button>`}).join('')}</div></div>
    <div><div class="sublab">${esc(cur.name)} · units <button class="lnk" data-vall="1">all ${cur.units.length}</button> · <button class="lnk" data-vnone="1">none</button>${other?` · <button class="lnk" data-vclear="1">clear ${other} from other ${VS.src==='ef'?'levels':'courses'}</button>`:''}</div>
    <div class="chips">${cur.units.map(u=>`<button class="chipbtn ${sel(u[0])?'on':''}" data-vun="${cur.id}|${u[0]}" aria-pressed="${sel(u[0])}">${u[0]} ${esc(u[1])}<i>${u[2].length}</i></button>`).join('')}</div></div>`;
  }
  return `<section class="panel"><div class="row sp"><div class="lab">${title||'Words'}</div><span class="count ${p.length<5?'warn':''}">${p.length} word${p.length===1?'':'s'}${p.length<5?' · choose more':''}</span></div>
   <div class="seg" role="group" aria-label="Word source">${SRC.map(([k,l])=>`<button class="${VS.src===k?'on':''}" data-vsrc="${k}">${l}</button>`).join('')}</div>
   ${body}</section>`;
}
function vClick(b){
  const d=b.dataset;const cur=VS.src==='gen'?null:(BOOK[VS.book[VS.src]]||BOOKS.find(x=>x.grp===VS.src));
  if(d.vsrc){VS.src=d.vsrc}
  else if(d.vlv){VS.lv=VS.lv.includes(d.vlv)?VS.lv.filter(x=>x!==d.vlv):[...VS.lv,d.vlv]}
  else if(d.vtp){VS.tp=VS.tp.includes(d.vtp)?VS.tp.filter(x=>x!==d.vtp):[...VS.tp,d.vtp]}
  else if(d.vbook){VS.book[VS.src]=d.vbook}
  else if(d.vun){VS.un=VS.un.includes(d.vun)?VS.un.filter(x=>x!==d.vun):[...VS.un,d.vun]}
  else if(d.vall){if(cur)VS.un=[...new Set([...VS.un,...cur.units.map(u=>cur.id+'|'+u[0])])];else VS.tp=Object.keys(TOPIC)}
  else if(d.vnone){if(cur)VS.un=VS.un.filter(k=>!k.startsWith(cur.id+'|'));else VS.tp=[]}
  else if(d.vclear){VS.un=VS.un.filter(k=>k.startsWith(cur.id+'|')||BOOK[k.split('|')[0]]?.grp!==VS.src)}
  else return false;
  gs.set('vs2',VS);return true;
}

function rerender(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function teamsPanel(st,save){
  return `<section class="panel"><div class="row sp"><div class="lab">Teams</div><div class="row"><button class="btn" data-tm="-" ${st.teams.length<=2?'disabled':''}>− Team</button><button class="btn" data-tm="+" ${st.teams.length>=4?'disabled':''}>+ Team</button></div></div>
  <div class="teamin">${st.teams.map((t,i)=>`<label class="tin">${dot(i)}<input id="tn${i}" value="${esc(t)}" maxlength="24" aria-label="Team ${i+1} name"></label>`).join('')}</div></section>`;
}
function readTeams(st){st.teams=st.teams.map((t,i)=>{const el=document.getElementById('tn'+i);return (el&&el.value.trim())||t})}
function teamClick(b,st){if(b.dataset.tm==='+'&&st.teams.length<4){st.teams.push(TEAMN[st.teams.length]);return true}if(b.dataset.tm==='-'&&st.teams.length>2){st.teams.pop();return true}return false}
function scoreRow(names,scores,cur){return `<div class="scores">${names.map((t,i)=>`<div class="sc ${i===cur?'cur':''}"><span>${dot(i)}${esc(t)}</span><strong>${scores[i]}</strong></div>`).join('')}</div>`}

/* =================== WORD GAMES (Alias / Taboo / Hot Seat) =================== */
const WMODES=[
 {id:'alias',name:'Alias',desc:'One player holds the device and explains words to their team.',how:'One player explains, the team guesses. Don’t say the word, part of it, or translate it.'},
 {id:'taboo',name:'Taboo',desc:'Explain the word without saying the taboo words under it.',how:'One player explains, the team guesses. Don’t say the word or the taboo words. The other team listens: if you say a taboo word, they shout “Taboo!” (−1 point).'},
 {id:'hotseat',name:'Hot Seat',desc:'One student sits with their back to the board. The team sees the word and explains.',how:'One player sits facing the class with their back to the board. Their team explains the word on the board without saying it. The teacher presses Got it or Pass.'}
];
let WC=gs.get('wc',{mode:'alias',teams:['Team Gold','Team Blue'],time:60,target:30,penalty:true,lastWord:true,ru:false});
let WG=null,wtick=null,actx=null;
function wgSave(){gs.set('wc',WC)}
function wgStop(){if(wtick){clearInterval(wtick);wtick=null}}
function beep(f=880,d=.12){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const wopt=(k,l)=>`<button class="btn ${WC[k]?'on':''}" data-wopt="${k}" aria-pressed="${!!WC[k]}">${WC[k]?'✓ ':''}${l}</button>`;
function wgSetup(){
  wgStop();WG=null;const n=pool().length;
  app.innerHTML=`<div><h2>Alias · Taboo · Hot Seat</h2><p class="lead">Team word games. Choose the game, the words and the teams, then play rounds against the clock.</p></div>
  <section class="panel"><div class="lab">Game</div><div class="grid">${WMODES.map(m=>`<button class="tile ${WC.mode===m.id?'on':''}" data-wmode="${m.id}" aria-pressed="${WC.mode===m.id}"><strong class="gt">${m.name}</strong><span>${m.desc}</span></button>`).join('')}</div></section>
  ${vocabPanel('Words')}
  ${teamsPanel(WC)}
  <section class="panel"><div class="lab">Rules</div>
   <div class="row"><span class="sublab w">Round time</span>${[30,60,90].map(t=>`<button class="btn ${WC.time==t?'on':''}" data-wtime="${t}">${t} sec</button>`).join('')}</div>
   <div class="row"><span class="sublab w">Points to win</span>${[20,30,50].map(t=>`<button class="btn ${WC.target==t?'on':''}" data-wtarget="${t}">${t}</button>`).join('')}</div>
   <div class="row">${wopt('penalty','Skip = −1 point')}${wopt('lastWord','Last word open to all teams')}${wopt('ru','Show Russian hint')}</div>
  </section>
  <div class="row end"><button class="btn gold big" id="wgo" ${n<5?'disabled':''}>Start game</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;readTeams(WC);
    if(vClick(b)||teamClick(b,WC)){wgSave();return rerender(wgSetup)}
    if(b.dataset.wmode)WC.mode=b.dataset.wmode;
    if(b.dataset.wtime)WC.time=+b.dataset.wtime;
    if(b.dataset.wtarget)WC.target=+b.dataset.wtarget;
    if(b.dataset.wopt)WC[b.dataset.wopt]=!WC[b.dataset.wopt];
    wgSave();
    if(b.id==='wgo')return wgNew();
    rerender(wgSetup)};
}
function wgNew(){WG={scores:WC.teams.map(()=>0),team:0,round:1,deck:shuffle(pool()),pos:0};wgReady()}
function wgDraw(){if(WG.pos>=WG.deck.length){WG.deck=shuffle(WG.deck);WG.pos=0}return WG.deck[WG.pos++]}
function wgReady(){
  wgStop();const m=WMODES.find(x=>x.id===WC.mode);
  app.innerHTML=`${scoreRow(WC.teams,WG.scores,WG.team)}
  <section class="panel center"><div class="lab">${m.name} · Round ${WG.round} · ${WC.time} seconds</div>
  <div class="who" style="color:${COLORS[WG.team]}">${esc(WC.teams[WG.team])}</div>
  <p class="lead">${m.how}</p>
  <div class="row center"><button class="btn gold big" id="begin">Start round</button><button class="btn" id="wback">Change game</button></div>
  <span class="muted small">Keyboard: → got it · ← skip${WC.mode==='taboo'?' · ↓ taboo word':''}</span></section>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='begin')wgPlay();if(b.id==='wback')wgSetup()};
}
function wgPlay(){
  WG.log=[];WG.left=WC.time;WG.cur=wgDraw();
  app.innerHTML=`${scoreRow(WC.teams,WG.scores,WG.team)}
  <div class="prog"><i id="wbar" style="width:100%"></i></div>
  <div class="card wcard"><div class="row sp"><span class="wtag" id="wtag"></span><span class="timer wt" id="wtm"></span></div>
   <div class="wword" id="wword"></div><div class="wtab" id="wtab"></div><div class="wru" id="wru"></div></div>
  <div class="acts ${WC.mode==='taboo'?'three':''}"><button class="act no" id="wskip">✕ ${WC.mode==='hotseat'?'Pass':'Skip'}</button>${WC.mode==='taboo'?'<button class="act tb" id="wtb">⚠ Taboo!</button>':''}<button class="act ok" id="wgot">✓ Got it</button></div>
  <p class="muted center" id="wtally"></p>`;
  wgShow();
  app.onclick=e=>{const id=e.target.closest('button')?.id;if(id==='wgot')wgMark(true);if(id==='wskip')wgMark(false);if(id==='wtb')wgMark('taboo')};
  const t0=Date.now();
  wtick=setInterval(()=>{const l=Math.max(0,WC.time-Math.floor((Date.now()-t0)/1000));if(l!==WG.left){WG.left=l;if(l<=5&&l>0)beep(660,.08)}wgUpd(1-(Date.now()-t0)/(WC.time*1000));if(l<=0){wgStop();beep(330,.5);wgTimeUp()}},200);
}
function wgShow(){
  const c=WG.cur,w=$('#wword');w.textContent=c.w;w.classList.remove('pop');void w.offsetWidth;w.classList.add('pop');
  $('#wtag').textContent=c.tag;
  $('#wtab').innerHTML=WC.mode==='taboo'?(c.t.length?c.t.map(x=>`<span>${esc(x)}</span>`).join(''):`<em class="wru">${esc(c.def||'')}</em>`):'';
  $('#wru').textContent=WC.ru&&c.ru?c.ru:'';
  const g=WG.log.filter(x=>x.ok===true).length,t=WG.log.filter(x=>x.ok==='taboo').length,s=WG.log.length-g-t;
  $('#wtally').textContent=`✓ ${g}   ✕ ${s}`+(WC.mode==='taboo'?`   ⚠ ${t}`:'');wgUpd();
}
function wgUpd(f){const t=$('#wtm');if(!t)return;t.textContent=WG.left;t.classList.toggle('low',WG.left<=10);if(f!=null)$('#wbar').style.width=Math.max(0,f*100)+'%'}
function wgMark(ok){if(!wtick)return;WG.log.push({...WG.cur,ok});WG.cur=wgDraw();wgShow()}
function wgTimeUp(){
  if(WC.lastWord){
    app.innerHTML=`${scoreRow(WC.teams,WG.scores,WG.team)}<section class="panel center"><div class="lab">Time! Last word — any team may guess</div>
    <div class="card wcard"><div class="wword">${esc(WG.cur.w)}</div></div>
    <div class="row center">${WC.teams.map((t,i)=>`<button class="btn" data-lw="${i}" style="border-color:${COLORS[i]}">${esc(t)} guessed</button>`).join('')}<button class="btn" data-lw="-1">Nobody</button></div></section>`;
    app.onclick=e=>{const b=e.target.closest('[data-lw]');if(!b)return;WG.last={w:WG.cur.w,team:+b.dataset.lw};wgReview()};
  }else{WG.last=null;wgReview()}
}
function wgPts(){return WG.log.reduce((s,x)=>s+(x.ok===true?1:x.ok==='taboo'?-1:(WC.penalty?-1:0)),0)}
const WLBL={true:['ok','✓ Guessed'],false:['no','✕ Skipped'],taboo:['tb','⚠ Taboo']};
const fmt=n=>(n>0?'+':'')+n;
function wgReview(){
  const lw=WG.last&&WG.last.team>=0?`<p class="muted">Last word “${esc(WG.last.w)}”: +1 for ${esc(WC.teams[WG.last.team])}</p>`:'';
  app.innerHTML=`${scoreRow(WC.teams,WG.scores,WG.team)}<section class="panel"><div class="row sp"><h3>Check the round · ${esc(WC.teams[WG.team])}</h3><span class="muted small">Tap a label to correct it</span></div>
  ${WG.log.length?WG.log.map((x,i)=>`<div class="vote"><span>${esc(x.w)}</span><button class="tg ${WLBL[x.ok][0]}" data-i="${i}">${WLBL[x.ok][1]}</button></div>`).join(''):'<p class="muted">No words this round.</p>'}
  <div class="total" id="wtot">${fmt(wgPts())} points</div>${lw}
  <div class="row end"><button class="btn gold big" id="wconfirm">Add points</button></div></section>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.i!=null){const x=WG.log[+b.dataset.i];const seq=WC.mode==='taboo'?[true,false,'taboo']:[true,false];x.ok=seq[(seq.indexOf(x.ok)+1)%seq.length];b.className='tg '+WLBL[x.ok][0];b.textContent=WLBL[x.ok][1];$('#wtot').textContent=fmt(wgPts())+' points'}
    if(b.id==='wconfirm')wgNext()};
}
function wgNext(){
  WG.scores[WG.team]+=wgPts();if(WG.last&&WG.last.team>=0)WG.scores[WG.last.team]+=1;
  WG.team++;
  if(WG.team>=WC.teams.length){WG.team=0;const max=Math.max(...WG.scores);
    if(max>=WC.target&&WG.scores.filter(s=>s===max).length===1)return wgFinish();WG.round++}
  wgReady();
}
function wgFinish(){
  const order=WC.teams.map((t,i)=>({t,s:WG.scores[i]})).sort((a,b)=>b.s-a.s);
  app.innerHTML=`<section class="panel center"><div class="lab">After ${WG.round} rounds</div><div class="win">${esc(order[0].t)} wins!</div>
  <div class="narrow">${order.map((o,k)=>`<div class="vote"><span>${k+1}. ${esc(o.t)}</span><strong class="n">${o.s}</strong></div>`).join('')}</div>
  <div class="row center"><button class="btn gold big" id="again">Play again</button><button class="btn big" id="wback">Change words</button></div></section>`;
  app.onclick=e=>{const id=e.target.closest('button')?.id;if(id==='again')wgNew();if(id==='wback')wgSetup()};
}
document.addEventListener('keydown',e=>{if(!wtick)return;if(e.key==='ArrowRight'){e.preventDefault();wgMark(true)}if(e.key==='ArrowLeft'){e.preventDefault();wgMark(false)}if(e.key==='ArrowDown'&&WC.mode==='taboo'){e.preventDefault();wgMark('taboo')}});

/* =================== BOARD RACE =================== */
const RTASK={
 explain:{n:'Explain',how:'One player explains the word. The team guesses. Don’t say the word or translate it.'},
 draw:{n:'Draw',how:'One player draws the word on the board. No letters or numbers. The team guesses.'},
 mime:{n:'Mime',how:'One player acts out the word without speaking. The team guesses.'},
 sentence:{n:'Sentence',how:'The team says one correct sentence with this word. The teacher decides if it is correct.'},
 taboo:{n:'Taboo',how:'Explain the word without the taboo words. The team guesses.'}
};
const RCYCLE=['explain','sentence','draw','taboo','mime','explain','sentence','taboo','draw','mime'];
const RJUMP={4:9,13:18,19:25,17:10,24:16,28:21};
const RSTAR=[7,22];
const RLEN=30;
function rKind(n){if(n===RLEN)return'end';if(RJUMP[n])return RJUMP[n]>n?'up':'down';if(RSTAR.includes(n))return'star';return RCYCLE[(n-1)%RCYCLE.length]}
let RC=gs.get('rc',{teams:['Team Gold','Team Blue'],secs:45});
let RG=null;
function raceSetup(){
  RG=null;const n=pool().length;
  app.innerHTML=`<div><h2>Board Race</h2><p class="lead">Teams take turns to roll the dice and move along a 30-square board. Every square has a task with a word: explain, draw, mime, make a sentence or taboo. Do the task in time to stay on the square; fail it and go back. Green squares are ladders, red squares are snakes, gold squares give an extra roll. First team to square 30 wins.</p></div>
  ${vocabPanel('Words on the squares')}
  ${teamsPanel(RC)}
  <section class="panel"><div class="lab">Time for each task</div><div class="row">${[30,45,60].map(t=>`<button class="btn ${RC.secs==t?'on':''}" data-rs="${t}">${t} sec</button>`).join('')}</div></section>
  <div class="row end"><button class="btn gold big" id="rgo" ${n<5?'disabled':''}>Start the race</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;readTeams(RC);
    if(vClick(b)||teamClick(b,RC)){gs.set('rc',RC);return rerender(raceSetup)}
    if(b.dataset.rs)RC.secs=+b.dataset.rs;gs.set('rc',RC);
    if(b.id==='rgo'){RG={pos:RC.teams.map(()=>0),team:0,deck:shuffle(pool()),di:0,stage:'roll',die:null,from:0,msg:'',word:null,show:false,winner:null};return raceDraw()}
    rerender(raceSetup)};
}
function rWord(){if(RG.di>=RG.deck.length){RG.deck=shuffle(RG.deck);RG.di=0}return RG.deck[RG.di++]}
function raceBoard(){
  const cells=[];
  for(let n=1;n<=RLEN;n++){
    const r=Math.floor((n-1)/6);let c=(n-1)%6;if(r%2)c=5-c;
    const k=rKind(n);
    const lab=k==='up'?'▲ to '+RJUMP[n]:k==='down'?'▼ to '+RJUMP[n]:k==='star'?'★ Roll again':k==='end'?'Finish':RTASK[k].n;
    const toks=RG.pos.map((p,i)=>p===n?`<span class="tok" style="background:${COLORS[i]}" title="${esc(RC.teams[i])}"></span>`:'').join('');
    cells.push(`<div class="sq ${['up','down','star','end'].includes(k)?k:''}" style="grid-row:${5-r};grid-column:${c+1}"><span class="n">${n}</span><span class="k">${lab}</span><span class="toks">${toks}</span></div>`);
  }
  const start=RG.pos.map((p,i)=>p===0?`<span class="tok" style="background:${COLORS[i]}"></span>`:'').join('');
  return `<div class="rstart"><span class="lab">Start</span><span class="toks">${start}</span></div><div class="rboard" aria-label="Race board">${cells.join('')}</div>`;
}
function raceDraw(){
  const t=RG.team,col=COLORS[t],name=esc(RC.teams[t]);
  let side='';
  if(RG.winner!=null){
    side=`<div class="win" style="color:${COLORS[RG.winner]}">${esc(RC.teams[RG.winner])} wins!</div><div class="row"><button class="btn gold big" id="ragain">Play again</button><button class="btn" id="rback">Change words</button></div>`;
  }else if(RG.stage==='roll'){
    side=`<div class="who" style="color:${col}">${name}</div>${RG.msg?`<p class="note">${RG.msg}</p>`:''}<div class="row"><div class="die" id="die">${RG.die||'?'}</div><button class="btn gold big" id="roll">Roll the dice</button></div>`;
  }else{
    const k=RG.task;const tk=RTASK[k];
    side=`<div class="who" style="color:${col}">${name} · square ${RG.pos[t]}</div>${RG.msg?`<p class="note">${RG.msg}</p>`:''}
    <div class="lab">${tk.n}</div><p>${tk.how}</p>
    <div class="card wcard sm">${RG.show?`<div class="wword">${esc(RG.word.w)}</div>${k==='taboo'?`<div class="wtab">${RG.word.t.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}<span class="wtag">${esc(RG.word.tag)}</span>`:`<p class="center" style="color:#5A5446;margin:0">${k==='sentence'?'Show the word to the whole team.':'Guessers look away. Only the player who does the task looks.'}</p>`}</div>
    <div class="row"><button class="btn ${RG.show?'':'gold'}" id="rshow">${RG.show?'Hide word':'Show word'}</button><span class="timer" id="rtm">${RC.secs}</span><button class="btn" id="rtime">Start ${RC.secs} sec</button></div>
    <div class="acts"><button class="act no" id="rno">✕ Not done · back to ${RG.from}</button><button class="act ok" id="rok">✓ Done · stay</button></div>`;
  }
  app.innerHTML=`<div class="rwrap"><div class="panel rb">${raceBoard()}</div><div class="panel">${side}
  <div class="rlegend">${RC.teams.map((n,i)=>`<span>${dot(i)}${esc(n)}: ${RG.pos[i]}</span>`).join('')}</div>
  <div><button class="lnk" id="rquit">End game and change settings</button></div></div></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='roll')return raceRoll();
    if(b.id==='rshow'){RG.show=!RG.show;return raceDraw()}
    if(b.id==='rtime'){timer('rtm',RC.secs,()=>beep(330,.5));return}
    if(b.id==='rok'){stopTimer();RG.msg=`${esc(RC.teams[RG.team])} stays on square ${RG.pos[RG.team]}.`;return raceNext()}
    if(b.id==='rno'){stopTimer();RG.pos[RG.team]=RG.from;RG.msg=`${esc(RC.teams[RG.team])} goes back to square ${RG.from}.`;return raceNext()}
    if(b.id==='ragain'){RG={pos:RC.teams.map(()=>0),team:0,deck:shuffle(pool()),di:0,stage:'roll',die:null,from:0,msg:'',word:null,show:false,winner:null};return raceDraw()}
    if(b.id==='rback'||b.id==='rquit')return raceSetup();
  };
}
function raceNext(){RG.team=(RG.team+1)%RC.teams.length;RG.stage='roll';RG.show=false;RG.die=null;raceDraw()}
function raceRoll(){
  const btn=$('#roll');if(btn)btn.disabled=true;let k=0;
  const spin=setInterval(()=>{const d=$('#die');if(d)d.textContent=1+(Math.random()*6|0);if(++k>=8){clearInterval(spin);raceMove(1+(Math.random()*6|0))}},70);
}
function raceMove(d){
  const t=RG.team;RG.die=d;RG.from=RG.pos[t];let p=Math.min(RLEN,RG.pos[t]+d);let msg=`Rolled ${d}.`;
  if(RJUMP[p]){const to=RJUMP[p];msg+=to>p?` Ladder! Up from ${p} to ${to}.`:` Snake! Down from ${p} to ${to}.`;p=to}
  RG.pos[t]=p;RG.msg=msg;
  if(p>=RLEN){RG.winner=t;beep(988,.3);return raceDraw()}
  if(RSTAR.includes(p)){RG.msg=msg+' Gold square: roll again!';RG.stage='roll';return raceDraw()}
  RG.task=rKind(p);
  RG.word=rWord();RG.show=false;RG.stage='task';raceDraw();
}

function bingoBank(){

}

function snowDraw(){
  const w=SN.cur.w,letters=[...w];
  const solved=SN.full||letters.every(ch=>!/[a-z]/i.test(ch)||SN.got.has(ch.toLowerCase()));
  const lost=SN.melt>=SNPARTS;SN.done=solved||lost;
  const disp=letters.map(ch=>/[a-z]/i.test(ch)?`<span class="lt">${SN.got.has(ch.toLowerCase())||SN.done?esc(ch):''}</span>`:`<span class="lt sp">${ch===' '?'&nbsp;':esc(ch)}</span>`).join('');
  app.innerHTML=`${scoreRow(SNC.teams,SN.scores,SN.team)}
  <div class="snow"><div class="panel center">${snowMan(SN.melt)}<p class="muted">${SNPARTS-SN.melt} of ${SNPARTS} parts left</p></div>
  <div class="panel">${SN.done?`<div class="lab">${solved?'Solved!':'The snowman melted'}</div>`:`<div class="who" style="color:${COLORS[SN.team]}">${esc(SNC.teams[SN.team])}</div>`}
   <div class="letters">${disp}</div>
   ${SN.hint||SN.done?`<div class="card wcard sm">${clueBlock(SN.cur,'def')}<span class="wtag">${esc(SN.cur.tag)}</span></div>`:`<div><button class="btn" id="shint">Show a clue</button></div>`}
   ${SN.done?`<div class="row"><button class="btn gold big" id="snext">Next word</button></div>`:`<div class="kb">${'abcdefghijklmnopqrstuvwxyz'.split('').map(c=>`<button class="key ${SN.got.has(c)?'hit':SN.miss.has(c)?'miss':''}" data-k="${c}" ${SN.got.has(c)||SN.miss.has(c)?'disabled':''}>${c}</button>`).join('')}</div>
   <div class="row"><span class="muted">Guess the whole word:</span><button class="btn" id="sright">✓ Right (+5)</button><button class="btn" id="swrong">✕ Wrong (melts 2)</button></div>`}
   <div><button class="lnk" id="send">End game and change words</button></div></div></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    const nt=()=>{SN.team=(SN.team+1)%SNC.teams.length};
    if(b.dataset.k){const c=b.dataset.k;const n=[...w.toLowerCase()].filter(x=>x===c).length;if(n){SN.got.add(c);SN.scores[SN.team]+=n}else{SN.miss.add(c);SN.melt++}nt();return snowDraw()}
    if(b.id==='shint'){SN.hint=true;return snowDraw()}
    if(b.id==='sright'){SN.scores[SN.team]+=5;SN.full=true;return snowDraw()}
    if(b.id==='swrong'){SN.melt=Math.min(SNPARTS,SN.melt+2);nt();return snowDraw()}
    if(b.id==='snext')return snowWord();
    if(b.id==='send')return snowSetup()};
}

let XC=gs.get('xc',{teams:['Team X','Team O'],task:'mix'});let XG=null;

function xoNew(){const ts=Object.keys(XTASK);XG.cells=[...Array(9)].map((_,i)=>{if(XG.di>=XG.deck.length){XG.deck=shuffle(XG.deck);XG.di=0}return {x:XG.deck[XG.di++],o:null,task:XC.task==='mix'?ts[i%3]:XC.task}});XG.turn=XG.turn==null?0:XG.turn;XG.sel=null;XG.win=null;xoDraw()}
const XL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function xoDraw(){

  s?`<div class="who" style="color:${XG.turn?'#5B9BE0':'#D4AE5A'}">${esc(XC.teams[XG.turn])}</div><div class="lab">${{explain:'Explain',sentence:'Sentence',define:'Meaning'}[s.task]}</div><p>${XTASK[s.task]}</p>

  <div><button class="lnk" id="xend">End and change words</button></div></div></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;

/* =================== BATTLESHIPS =================== */
let SHC=gs.get('shc',{teams:['Team Gold','Team Blue']});let SH=null;
const SHN=6,FLEET=[3,2,2,1];
function fleet(){
  for(let tries=0;tries<500;tries++){const occ=new Set(),ships=[];let ok=true;
    for(const L of FLEET){let placed=false;
      for(let t=0;t<100&&!placed;t++){const h=Math.random()<.5,r=Math.random()*(h?SHN:SHN-L+1)|0,c=Math.random()*(h?SHN-L+1:SHN)|0;
        const cells=[...Array(L)].map((_,k)=>h?r*SHN+c+k:(r+k)*SHN+c);
        if(cells.every(x=>!occ.has(x))){cells.forEach(x=>occ.add(x));ships.push(cells);placed=true}}
      if(!placed){ok=false;break}}
    if(ok)return ships}
}
function shipSetup(){
  SH=null;
  app.innerHTML=`<div><h2>Battleships</h2><p class="lead">Each team has a hidden fleet: one ship of 3 squares, two of 2 and one of 1. Make a correct sentence with the word to earn a shot.</p></div>
  ${vocabPanel('Words')}<section class="panel"><div class="lab">Teams</div><div class="teamin">${SHC.teams.map((t,i)=>`<label class="tin">${dot(i)}<input id="tn${i}" value="${esc(t)}" maxlength="24"></label>`).join('')}</div></section>
  <div class="row end">${needWords(10)}<button class="btn gold big" id="shgo" ${pool().length<10?'disabled':''}>Start</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;readTeams(SHC);gs.set('shc',SHC);
    if(vClick(b))return rerender(shipSetup);
    if(b.id==='shgo'){SH={ships:[fleet(),fleet()],shots:[new Set(),new Set()],turn:0,aim:null,stage:'aim',deck:uniqPool(),di:0,msg:'',win:null};shipDraw()}};
}
const colL=i=>'ABCDEF'[i%SHN],rowN=i=>Math.floor(i/SHN)+1;
function shipCellState(team,i){const enemy=1-team;const hit=SH.ships[enemy].some(s=>s.includes(i));return SH.shots[team].has(i)?(hit?'hit':'miss'):''}
function sunk(team,ship){return ship.every(i=>SH.shots[team].has(i))}
function seaHTML(team,active){
  const enemy=1-team;
  let h=`<div class="sea"><span></span>${[...Array(SHN)].map((_,c)=>`<span class="sl">${'ABCDEF'[c]}</span>`).join('')}`;
  for(let r=0;r<SHN;r++){h+=`<span class="sl">${r+1}</span>`;for(let c=0;c<SHN;c++){const i=r*SHN+c,st=shipCellState(team,i);const sk=st==='hit'&&SH.ships[enemy].some(s=>s.includes(i)&&sunk(team,s));
    h+=`<button class="cell ${st} ${sk?'sunk':''} ${SH.aim===i&&active?'aim':''}" data-cell="${i}" ${!active||st||SH.stage!=='aim'?'disabled':''} aria-label="${colL(i)}${rowN(i)}">${st==='hit'?'✹':st==='miss'?'•':''}</button>`}}
  return h+'</div>';
}
function shipDraw(){
  const t=SH.turn,e=1-t;
  if(SH.win==null&&SH.ships[e].every(s=>sunk(t,s))){SH.win=t}
  const left=team=>SH.ships[1-team].filter(s=>!sunk(team,s)).length;
  let side;
  if(SH.win!=null)side=`<div class="win" style="color:${COLORS[SH.win]}">${esc(SHC.teams[SH.win])} wins!</div><p>Every ship is sunk.</p><button class="btn gold big" id="shagain">Play again</button>`;
  else if(SH.stage==='aim')side=`<div class="who" style="color:${COLORS[t]}">${esc(SHC.teams[t])}</div>${SH.msg?`<p class="note">${SH.msg}</p>`:''}<p class="lead">Choose a square on ${esc(SHC.teams[e])}’s sea.</p>`;
  else{const x=SH.word;side=`<div class="who" style="color:${COLORS[t]}">${esc(SHC.teams[t])} · aiming at ${colL(SH.aim)}${rowN(SH.aim)}</div>
   <p>Make a correct sentence with this word to fire.</p><div class="card wcard sm"><div class="wword">${esc(x.w)}</div>${x.ru||x.def?`<details class="ans"><summary>Teacher: meaning</summary>${esc(x.def||'')} ${x.ru?'· '+esc(x.ru):''}</details>`:''}</div>
   <div class="row"><span class="timer" id="shtm">0:30</span><button class="btn" id="sht">Start 30 sec</button></div>
   <div class="acts"><button class="act no" id="shno">✕ Wrong · no shot</button><button class="act ok" id="shok">✓ Correct · fire!</button></div>`}
  app.innerHTML=`<div class="seas">${[0,1].map(team=>`<div class="panel ${team===t&&SH.win==null?'act-sea':''}"><div class="row sp"><strong>${dot(1-team)}${esc(SHC.teams[1-team])}’s sea</strong><span class="muted small">${esc(SHC.teams[team])} fires here · ${left(team)} ship${left(team)===1?'':'s'} left</span></div>${seaHTML(team,team===t&&SH.win==null)}</div>`).join('')}</div>
  <div class="panel">${side}<div><button class="lnk" id="shend">End and change words</button></div></div>`;
  app.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
    if(b.dataset.cell!=null){SH.aim=+b.dataset.cell;if(SH.di>=SH.deck.length){SH.deck=shuffle(SH.deck);SH.di=0}SH.word=SH.deck[SH.di++];SH.stage='task';return shipDraw()}
    if(b.id==='sht')return timer('shtm',30,()=>beep(330,.5));
    if(b.id==='shok'){stopTimer();SH.shots[t].add(SH.aim);const ship=SH.ships[e].find(s=>s.includes(SH.aim));
      SH.msg=`${esc(SHC.teams[t])} fired at ${colL(SH.aim)}${rowN(SH.aim)}: ${ship?(sunk(t,ship)?'HIT — ship sunk!':'HIT!'):'miss.'}`;beep(ship?988:440,.2);SH.stage='aim';SH.aim=null;SH.turn=e;return shipDraw()}
    if(b.id==='shno'){stopTimer();SH.msg=`${esc(SHC.teams[t])}: no shot this time.`;SH.stage='aim';SH.aim=null;SH.turn=e;return shipDraw()}
    if(b.id==='shagain')return shipSetup();
    if(b.id==='shend')return shipSetup()};
}

let MC=gs.get('mc',{teams:['Team Gold','Team Blue'],pairs:8,clue:'def'});let MM=null,mto=null;
function memStop(){if(mto){clearTimeout(mto);mto=null}}
function memSetup(){
  MM=null;memStop();
  app.innerHTML=`<div><h2>Memory Pairs</h2><p class="lead">Match each English word with its pair card. Teams take turns to turn over two cards.</p></div>
  ${vocabPanel('Words')}${teamsPanel(MC)}
  <section class="panel"><div class="lab">Cards</div><div class="row"><span class="sublab w">Pairs</span>${[6,8,10,12].map(n=>`<button class="btn ${MC.pairs===n?'on':''}" data-mp="${n}">${n}</button>`).join('')}</div>${clueModeRow(MC,'clue')}</section>
  <div class="row end">${needWords(MC.pairs)}<button class="btn gold big" id="mgo" ${pool().length<MC.pairs?'disabled':''}>Deal the cards</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;readTeams(MC);
    if(vClick(b)||teamClick(b,MC)){gs.set('mc',MC);return rerender(memSetup)}
    if(b.dataset.mp)MC.pairs=+b.dataset.mp;if(b.dataset.clue)MC.clue=b.dataset.clue;gs.set('mc',MC);
    if(b.id==='mgo')return memDeal();rerender(memSetup)};
}
function pairText(x,mode){if(mode==='ru'&&x.ru)return x.ru;if(mode!=='words'&&x.def)return x.def;if(x.t&&x.t.length)return x.t.slice(0,3).join(' · ');return x.def||x.ru||'?'}
function memDeal(){
  const ws=uniqPool().slice(0,MC.pairs);
  const cards=shuffle(ws.flatMap((x,i)=>[{p:i,word:true,txt:x.w},{p:i,word:false,txt:pairText(x,MC.clue)}]));
  MM={cards,open:[],got:{},team:0,scores:MC.teams.map(()=>0),lock:false};memDraw();
}
function memDraw(){
  const done=Object.keys(MM.got).length===MM.cards.length/2;
  app.innerHTML=`${scoreRow(MC.teams,MM.scores,done?-1:MM.team)}
  ${done?`<section class="panel center"><div class="win">${(()=>{const m=Math.max(...MM.scores);const w=MM.scores.filter(s=>s===m).length>1;return w?'A draw!':esc(MC.teams[MM.scores.indexOf(m)])+' wins!'})()}</div><div class="row center"><button class="btn gold big" id="magain">Deal again</button><button class="btn" id="mback">Change words</button></div></section>`:''}
  <div class="mgrid">${MM.cards.map((c,i)=>{const up=MM.open.includes(i)||MM.got[c.p]!=null;return `<button class="mcard ${up?'up':''} ${c.word?'w':'d'} ${MM.got[c.p]!=null?'got':''}" data-m="${i}" ${up?'disabled':''} ${MM.got[c.p]!=null?`style="--tc:${COLORS[MM.got[c.p]]}"`:''}>${up?`<span>${esc(c.txt)}</span>`:'<span class="back">IF</span>'}</button>`}).join('')}</div>
  <div><button class="lnk" id="mback">End and change words</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='magain')return memDeal();if(b.id==='mback')return memSetup();
    if(b.dataset.m==null||MM.lock)return;
    MM.open.push(+b.dataset.m);
    if(MM.open.length===2){const [a,c]=MM.open.map(i=>MM.cards[i]);
      if(a.p===c.p&&a.word!==c.word){MM.got[a.p]=MM.team;MM.scores[MM.team]++;MM.open=[];beep(988,.15);return memDraw()}
      MM.lock=true;memDraw();mto=setTimeout(()=>{MM.open=[];MM.lock=false;MM.team=(MM.team+1)%MC.teams.length;mto=null;memDraw()},1600);return}
    memDraw()};
}

  app.innerHTML=`<div><h2>Word Snap</h2><p class="lead">A word card and a meaning card flip at the same time. If they match, shout “Snap!”. The teacher taps the team that shouted first.</p></div>
  ${vocabPanel('Words')}${teamsPanel(SPC)}
  <section class="panel"><div class="lab">Cards</div>${clueModeRow(SPC,'clue')}<div class="row"><span class="sublab w">Points to win</span>${[5,10,15].map(n=>`<button class="btn ${SPC.target===n?'on':''}" data-st="${n}">${n}</button>`).join('')}</div></section>
  <div class="row end">${needWords(6)}<button class="btn gold big" id="spgo" ${pool().length<6?'disabled':''}>Start</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;readTeams(SPC);
    if(vClick(b)||teamClick(b,SPC)){gs.set('spc',SPC);return rerender(snapSetup)}
    if(b.dataset.clue)SPC.clue=b.dataset.clue;if(b.dataset.st)SPC.target=+b.dataset.st;gs.set('spc',SPC);
    if(b.id==='spgo'){SP={deck:uniqPool(),scores:SPC.teams.map(()=>0),msg:'',n:0};return snapFlip()}
    rerender(snapSetup)};
}
function snapFlip(){
  const d=SP.deck;const a=d[Math.random()*d.length|0];
  const match=Math.random()<0.4;let b=a;if(!match){do{b=d[Math.random()*d.length|0]}while(b===a&&d.length>1)}
  SP.a=a;SP.b=b;SP.match=a===b;SP.n++;snapDraw();
}
function snapDraw(){
  const max=Math.max(...SP.scores),won=max>=SPC.target?SP.scores.indexOf(max):-1;
  app.innerHTML=`${scoreRow(SPC.teams,SP.scores,-1)}
  ${won>=0?`<section class="panel center"><div class="win">${esc(SPC.teams[won])} wins!</div><div class="row center"><button class="btn gold big" id="spagain">Play again</button><button class="btn" id="spback">Change words</button></div></section>`:`
  <div class="snapcards"><div class="card scard"><span class="wtag">Word</span><div class="wword">${esc(SP.a.w)}</div></div><div class="card scard"><span class="wtag">Meaning</span><div class="wdef">${esc(pairText(SP.b,SPC.clue))}</div></div></div>
  ${SP.msg?`<p class="note">${SP.msg}</p>`:''}
  <div class="lab center">Who shouted “Snap!” first?</div>
  <div class="row center">${SPC.teams.map((t,i)=>`<button class="btn big" data-sn="${i}" style="border-color:${COLORS[i]}">${dot(i)}${esc(t)}</button>`).join('')}</div>
  <div class="row center"><button class="btn gold big" id="spnext">Next cards</button></div>`}
  <div><button class="lnk" id="spback">End and change words</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.sn!=null){const i=+b.dataset.sn;if(SP.match){SP.scores[i]++;SP.msg=`Snap! +1 for ${esc(SPC.teams[i])}. “${esc(SP.a.w)}” means: ${esc(pairText(SP.a,SPC.clue))}`;beep(988,.15)}else{SP.scores[i]--;SP.msg=`Not a pair. −1 for ${esc(SPC.teams[i])}. “${esc(SP.a.w)}” means: ${esc(pairText(SP.a,SPC.clue))}`;beep(220,.25)}return snapFlip()}
    if(b.id==='spnext'){SP.msg=SP.match?`That was a pair! “${esc(SP.a.w)}” — nobody snapped.`:'';return snapFlip()}
    if(b.id==='spagain'){SP={deck:uniqPool(),scores:SPC.teams.map(()=>0),msg:'',n:0};return snapFlip()}
    if(b.id==='spback')return snapSetup()};
}

/* ---- Alibi wrapper: crime alibi or couple interview ---- */
let ALM='crime',CP={marks:{}};
function alibi(){
  if(ALM==='couple'){
    const same=Object.values(CP.marks).filter(v=>v==='s').length;
    app.innerHTML=`${alibiToggle()}<div><h2>Couple interview</h2><p class="lead">The TV show “Do You Really Know Each Other?” Two students are a couple. They have 5 minutes outside to agree their answers. The presenter interviews them one at a time. 1 point for every answer that matches. 7 or more and they win the holiday!</p><p class="lead" lang="ru">Шоу «Вы действительно знаете друг друга?». Два ученика — пара. У них 5 минут за дверью, чтобы договориться об ответах. Ведущий задаёт вопросы каждому по отдельности. 1 очко за каждый совпавший ответ. 7 и больше — пара выигрывает путешествие!</p></div>
    <section class="panel"><div class="lab">Step 1 · The couple prepares (5 min outside)</div><div class="row"><span class="timer" id="tm">5:00</span><button class="btn" id="t5">Start 5 min</button></div></section>
    <section class="panel"><div class="lab">Step 2 · Interview partner 1, then partner 2. Mark each answer.</div>
     ${COUPLE_Q.map((q,i)=>`<div class="vote"><span>${esc(q)}</span><button class="btn ${CP.marks[i]==='s'?'on':''}" data-cs="${i}">Same</button><button class="btn ${CP.marks[i]==='d'?'on':''}" data-cd="${i}">Different</button></div>`).join('')}</section>
    <div class="solution">${same>=7?`${same} / 10 answers match. They really know each other — they win the holiday!`:`${same} / 10 answers match so far. 7 or more wins.`}</div>
    <div class="row"><button class="btn" id="cpreset">New couple</button></div>`;
    app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.alm){ALM=b.dataset.alm;return alibi()}
      if(b.id==='t5'){timer('tm',300);return}
      if(b.dataset.cs)CP.marks[b.dataset.cs]='s';if(b.dataset.cd)CP.marks[b.dataset.cd]='d';if(b.id==='cpreset')CP={marks:{}};
      rerender(alibi)};
    return;
  }
  alibiBase();
  app.insertAdjacentHTML('afterbegin',alibiToggle());
  const orig=app.onclick;app.onclick=e=>{const b=e.target.closest('[data-alm]');if(b){ALM=b.dataset.alm;return alibi()}orig&&orig(e)};
}
function alibiToggle(){return `<div class="seg" role="group" aria-label="Alibi version"><button class="${ALM==='crime'?'on':''}" data-alm="crime">Crime alibi · ${DATA.alibi.crimes.length} crimes</button><button class="${ALM==='couple'?'on':''}" data-alm="couple">Couple interview</button></div>`}

const EASY_RIDDLES=[['What has hands but can’t clap?','A clock (часы)'],['What gets wetter the more it dries?','A towel (полотенце)'],['What must you break before you can use it?','An egg (яйцо)'],['What has lots of teeth but can’t bite?','A comb (расчёска)'],['What goes up but never comes down?','Your age (возраст)'],['What can you catch but not throw?','A cold (простуда)'],['What has a neck but no head?','A bottle (бутылка)'],['What is full of holes but still holds water?','A sponge (губка)'],['What has one eye but can’t see?','A needle (иголка)'],['What runs but never walks?','A river (река)'],['What travels around the world but stays in a corner?','A stamp (марка)'],['What has four legs but can’t walk?','A table (стол)']].map(([q,a])=>({q,a}));

function riddles(){

}

/* ---- Secret Agents (code-word team game) ---- */
let SAC=gs.get('agc',{teams:['Team Gold','Team Blue']});let SA=null;
const AGCOL={gold:'#D4AE5A',blue:'#5B9BE0',by:'#E9E2CF',trap:'#0B0F19'};
function agentsSetup(){
  SA=null;const n=uniqPool().filter(x=>x.w.length<=16).length;
  app.innerHTML=`<div><h2>Secret Agents</h2><p class="lead">Two teams, 25 words. Each team’s spymaster gives one-word clues to help their team find their words. Don’t touch the trap!</p></div>
  ${vocabPanel('Words')}
  <section class="panel"><div class="lab">Teams</div><div class="teamin">${SAC.teams.map((t,i)=>`<label class="tin">${dot(i)}<input id="tn${i}" value="${esc(t)}" maxlength="24"></label>`).join('')}</div></section>
  <div class="row end">${n<25?'<span class="count warn">Choose at least 25 words</span>':''}<button class="btn gold big" id="ago" ${n<25?'disabled':''}>Deal 25 words</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;readTeams(SAC);gs.set('agc',SAC);
    if(vClick(b))return rerender(agentsSetup);
    if(b.id==='ago')agentsNew()};
}
function agentsNew(){
  const words=uniqPool().filter(x=>x.w.length<=16).slice(0,25);
  const first=Math.random()<.5?'gold':'blue',second=first==='gold'?'blue':'gold';
  const key=shuffle([...Array(9).fill(first),...Array(8).fill(second),...Array(7).fill('by'),'trap']);
  SA={words,key,open:{},turn:first,showKey:false,clue:'',win:null,msg:`${first==='gold'?esc(SAC.teams[0]):esc(SAC.teams[1])} starts (9 words).`};agentsDraw();
}
function agLeft(t){return SA.key.filter((k,i)=>k===t&&!SA.open[i]).length}
function agName(t){return esc(SAC.teams[t==='gold'?0:1])}
function agentsDraw(){
  const tcol=AGCOL[SA.turn];
  app.innerHTML=`<div class="scores"><div class="sc ${SA.turn==='gold'&&!SA.win?'cur':''}"><span>${dot(0)}${agName('gold')}</span><strong>${agLeft('gold')}</strong></div><div class="sc ${SA.turn==='blue'&&!SA.win?'cur':''}"><span>${dot(1)}${agName('blue')}</span><strong>${agLeft('blue')}</strong></div></div>
  ${SA.win?`<section class="panel center"><div class="win" style="color:${AGCOL[SA.win]}">${agName(SA.win)} wins!</div><p>${SA.msg}</p><div class="row center"><button class="btn gold big" id="agnew">New game</button><button class="btn" id="agback">Change words</button></div></section>`:
  `<section class="panel"><div class="row sp"><div class="who" style="color:${tcol}">${agName(SA.turn)}’s turn</div><button class="btn ${SA.showKey?'on':''}" id="agkey">${SA.showKey?'Hide the key':'Spymaster key'}</button></div>
   ${SA.showKey?'<p class="note">Spymasters only! Everyone else, look away.</p>':''}
   <div class="row"><label class="f grow">Spymaster’s clue<input type="text" id="agclue" value="${esc(SA.clue)}" placeholder="One word and a number, e.g. Kitchen 3"></label><button class="btn" id="agset">Show clue</button><button class="btn" id="agend">End turn</button></div>
   ${SA.msg?`<p class="note">${SA.msg}</p>`:''}</section>`}
  <div class="aggrid">${SA.words.map((w,i)=>{const k=SA.key[i],op=SA.open[i];const reveal=op||SA.showKey||SA.win;return `<button class="agc ${op?'op':''} ${reveal?'k-'+k:''}" data-ag="${i}" ${op||SA.win?'disabled':''}><span>${esc(w.w)}</span>${op&&k==='trap'?'<b>TRAP</b>':''}</button>`}).join('')}</div>
  <div><button class="lnk" id="agback">End and change words</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='agkey'){SA.showKey=!SA.showKey;return agentsDraw()}
    if(b.id==='agset'){SA.clue=$('#agclue').value.trim();SA.msg=SA.clue?`Clue for ${agName(SA.turn)}: <b>${esc(SA.clue)}</b>`:'';return agentsDraw()}
    if(b.id==='agend'){SA.turn=SA.turn==='gold'?'blue':'gold';SA.clue='';SA.msg=`${agName(SA.turn)}’s turn.`;return agentsDraw()}
    if(b.id==='agnew')return agentsNew();if(b.id==='agback')return agentsSetup();
    if(b.dataset.ag!=null){const i=+b.dataset.ag,k=SA.key[i];SA.open[i]=1;SA.showKey=false;const other=SA.turn==='gold'?'blue':'gold';
      if(k==='trap'){SA.win=other;SA.msg=`${agName(SA.turn)} touched the trap: “${esc(SA.words[i].w)}”.`;beep(220,.5)}
      else if(k===SA.turn){SA.msg=`Correct: “${esc(SA.words[i].w)}”. Keep guessing or end the turn.`;beep(988,.12)}
      else{SA.msg=`“${esc(SA.words[i].w)}” is ${k==='by'?'a bystander':'the other team’s word'}. ${agName(other)}’s turn.`;SA.turn=other;SA.clue='';beep(440,.15)}
      if(!SA.win){if(!agLeft('gold'))SA.win='gold';else if(!agLeft('blue'))SA.win='blue';if(SA.win)SA.msg=`${agName(SA.win)} found all its words.`}
      agentsDraw()}};
}

/* ---- Detective Clues (logic puzzle, running dictation) ---- */
const LOGIC=[{id:'A2',level:'A2',title:'Who is who?',names:['Aigerim','Bolat','Dana','Erlan','Madina'],ages:[9,24,31,45,70],
  who:['woman with an umbrella','man with a guitar','girl with a dog','old man with a stick','woman with a bike'],
  clues:['Dana is 9 years old.','The girl with the dog is the youngest.','Bolat is to the right of Dana.','The oldest person walks with a stick.','The man with the guitar is called Erlan.','Aigerim rides a bike.','The woman with the umbrella is older than Erlan.','Aigerim is older than the woman with the umbrella.'],
  sol:[['Madina',31],['Erlan',24],['Dana',9],['Bolat',70],['Aigerim',45]]},
 {id:'B1',level:'B1',title:'The hotel breakfast',names:['Arman','Kamila','Nurlan','Ruslan','Sofia'],ages:[13,27,38,44,52],
  who:['man with a camera','woman with a laptop','man in a chef’s hat','woman with a medical bag','boy with a ball'],
  clues:['The person who is holding a ball is the youngest of the group.','Nurlan isn’t old enough to drive: he is 13.','The woman who works with computers is the youngest adult.','Ruslan, who is a chef, is the oldest.','Sofia is sitting between the man with the camera and the chef.','Kamila is a doctor.','Kamila is older than Arman.','Arman is 11 years older than Sofia.'],
  sol:[['Arman',38],['Sofia',27],['Ruslan',52],['Kamila',44],['Nurlan',13]]}];
let LG={p:0,flip:{},ans:{},checked:false};
function cluesGame(){
  const L=LOGIC[LG.p];
  const right=LG.checked?L.sol.map((s,i)=>LG.ans['n'+i]===s[0]&&+LG.ans['a'+i]===s[1]):[];
  const nRight=right.filter(Boolean).length;
  app.innerHTML=`<div class="seg" role="group" aria-label="Puzzle">${LOGIC.map((x,i)=>`<button class="${LG.p===i?'on':''}" data-lp="${i}">${x.level} · ${x.title}</button>`).join('')}</div>
  <div><h2>${L.title}</h2><p class="lead">Turn over the clue cards one at a time, or stick the printed cards on the walls and play it as a running dictation. Then match every person with a name and an age.</p></div>
  <section class="panel"><img class="figs" src="${FIGS[L.id]}" alt="Five people from left to right: ${L.who.join(', ')}">
   <div class="lgrid">${L.who.map((w,i)=>`<div class="lslot ${LG.checked?(right[i]?'ok':'bad'):''}"><span class="muted small">${i+1}. ${esc(w)}</span>
    <select id="n${i}" data-ln="${i}" aria-label="Name of person ${i+1}"><option value="">Name…</option>${L.names.map(n=>`<option ${LG.ans['n'+i]===n?'selected':''}>${n}</option>`).join('')}</select>
    <select id="a${i}" data-la="${i}" aria-label="Age of person ${i+1}"><option value="">Age…</option>${L.ages.map(a=>`<option ${+LG.ans['a'+i]===a?'selected':''}>${a}</option>`).join('')}</select></div>`).join('')}</div>
   <div class="row"><button class="btn gold big" id="lcheck">Check our answer</button><span class="timer" id="tm">15:00</span><button class="btn" id="lt">15-min timer</button><button class="btn" id="lreset">Start again</button></div>
   ${LG.checked?`<div class="solution">${nRight===5?'Case solved! Every name and age is correct.':`${nRight} of 5 people are correct. Keep thinking!`}</div>`:''}</section>
  <section class="panel"><div class="row sp"><div class="lab">Clue cards</div><button class="btn" id="lall">Show all clues</button></div>
   <div class="cgrid">${L.clues.map((c,i)=>`<button class="ccard ${LG.flip[i]?'up':''}" data-lc="${i}">${LG.flip[i]?`<span class="wtag">Clue ${i+1}</span><span>${esc(c)}</span>`:`<span class="back">Clue ${i+1}</span>`}</button>`).join('')}</div></section>`;
  app.onchange=e=>{const t=e.target;if(t.dataset.ln!=null)LG.ans['n'+t.dataset.ln]=t.value;if(t.dataset.la!=null)LG.ans['a'+t.dataset.la]=t.value;LG.checked=false};
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.lp){LG={p:+b.dataset.lp,flip:{},ans:{},checked:false};stopTimer();return cluesGame()}
    if(b.dataset.lc){LG.flip[b.dataset.lc]=!LG.flip[b.dataset.lc];return rerender(cluesGame)}
    if(b.id==='lall'){L.clues.forEach((_,i)=>LG.flip[i]=true);return rerender(cluesGame)}
    if(b.id==='lt'){timer('tm',900,()=>beep(330,.6));return}
    if(b.id==='lcheck'){LG.checked=true;if(L.sol.every((s,i)=>LG.ans['n'+i]===s[0]&&+LG.ans['a'+i]===s[1]))beep(988,.3);return rerender(cluesGame)}
    if(b.id==='lreset'){LG={p:LG.p,flip:{},ans:{},checked:false};stopTimer();return cluesGame()}};
}

route();
</script>
</body></html>
