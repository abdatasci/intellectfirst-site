<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IF English · Game Room</title><link rel="stylesheet" href="../shared/reset.css"><link rel="stylesheet" href="../shared/fonts.css"><script src="../shared/capacitor.js"></script><script src="../config.js"></script><script>window.IFEN_ROOT="../";window.IFEN_NS="GR";</script><script src="/if-lock.js"></script><script src="../shared/ifen.js"></script></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one dark "case room" — navy night, gold lamp light. Tabs across the top, one game at a time, big type for the classroom board */
:root{
  --night:#0B1428; --desk:#121E3A; --file:#1A2A4E; --line:#2C3E68; --text:#EEF1F7; --dim:#A9B6CE;
  --gold:#D4AE5A; --gold-ink:#1A1405; --red:#D2654F; --green:#4FB386;
  --serif:'Fraunces',Cambria,Caladea,Georgia,serif; --sans:'Source Sans 3',Calibri,Carlito,'Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--text);font:17px/1.5 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
header{border-bottom:1px solid var(--line);background:radial-gradient(120% 140% at 15% 0%,#1C2D57 0%,var(--night) 60%)}
header .wrap{display:flex;align-items:center;gap:14px;padding-block:16px 12px;flex-wrap:wrap}
header img{width:44px;height:auto}
header h1{font:700 clamp(1.5rem,4vw,2.1rem)/1 var(--serif);margin:0;letter-spacing:.01em}
header small{display:block;font:700 .72rem var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--dim);font-weight:700;padding:8px 16px;border-radius:999px;border:1px solid var(--line)}
nav a.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
main .wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
h2{font:700 1.6rem/1.15 var(--serif);margin:0;text-wrap:balance}
h3{font:700 1.2rem/1.2 var(--serif);margin:0}
p{margin:0}
.lead{color:var(--dim);max-width:65ch}
.panel{background:var(--desk);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--file);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.btn.big{padding:14px 24px;font-size:1.1rem}
.btn.on{background:var(--text);color:var(--night);border-color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lab{font:700 .72rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.tile{text-align:left;background:var(--file);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--gold)}
.tile .meta{color:var(--dim);font-size:.9rem}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--line);color:var(--text)}
.chip.red{background:var(--red);color:#fff}
.big-text{font:500 clamp(1.15rem,2.4vw,1.5rem)/1.5 var(--serif);max-width:60ch}
.muted{color:var(--dim)}
.timer{font:700 2.4rem/1 var(--serif);font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
/* role reveal */
.reveal{min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;border-radius:16px;border:1px solid var(--line);background:var(--file);padding:28px 18px}
.reveal .role{font:700 clamp(2.4rem,9vw,4.2rem)/1 var(--serif);letter-spacing:.04em}
.reveal.mafia{background:#3A1712;border-color:var(--red)}
.reveal.mafia .role{color:#FFB4A4}
.reveal.town .role{color:var(--gold)}
.reveal p{max-width:46ch}
.pl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.pp{display:flex;align-items:center;gap:8px;background:var(--file);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;min-width:0}
.pp span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp.out{opacity:.45;text-decoration:line-through}
.pp.m{border-color:var(--red)}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--file);border:1px solid var(--line)}
.step.cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.step b{font:700 1.1rem var(--serif);color:var(--gold);min-width:1.4em}
.phr{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.phr div{background:var(--file);border-radius:10px;padding:12px;border:1px solid var(--line)}
.phr ul{margin:6px 0 0;padding-left:18px;font-size:.95rem}
.card{background:#F4EEDF;color:#1B1A17;border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card h3{color:#14213D;font-size:1.6rem}
.card .lab{color:#8A6A1E}
.card .lie{color:#9E2A1A;font-weight:700}
.card .sec{color:#5A5446;font-style:italic}
.clue{background:#F4EEDF;color:#1B1A17;border-radius:8px;padding:14px 16px;border-left:6px solid var(--gold);font:500 1.15rem/1.45 var(--serif)}
.vote{display:flex;align-items:center;gap:10px;background:var(--file);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.vote span{flex:1;min-width:0}
.vote .n{font:700 1.4rem var(--serif);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex-basis:100%}
.bar i{display:block;height:100%;background:var(--gold)}
.solution{background:var(--gold);color:var(--gold-ink);border-radius:12px;padding:18px;font:500 1.15rem/1.5 var(--serif)}
.notes{overflow-x:auto}
.notes table{border-collapse:collapse;width:100%;min-width:640px}
.notes th,.notes td{border:1px solid var(--line);padding:4px;text-align:left;vertical-align:top}
.notes th{font-size:.85rem;color:var(--gold);padding:8px}
.notes td:first-child{font-weight:700;padding:8px;white-space:nowrap}
.notes input{width:100%;background:transparent;border:0;padding:6px;font-size:.95rem}
.opt{display:block;width:100%;text-align:left;background:var(--file);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:1.05rem}
.opt.right{background:var(--green);border-color:var(--green);color:#06210F}
.opt.wrong{background:var(--red);border-color:var(--red);color:#fff}
.score{font:700 1.2rem var(--serif);color:var(--gold)}
input[type=number],input[type=text],textarea{background:var(--file);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:90px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem}
.rq{font:500 clamp(1.4rem,3.4vw,2.2rem)/1.4 var(--serif);text-align:center;max-width:36ch;margin:0 auto;text-wrap:balance}
.ra{background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:16px;text-align:center;font:600 1.3rem/1.4 var(--serif)}
.teams{display:flex;flex-wrap:wrap;gap:8px}
.teams .t{display:flex;align-items:center;gap:8px;background:var(--file);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.teams .t strong{font:700 1.3rem var(--serif);min-width:2ch;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Game Room additions */
a.tile{color:var(--text);text-decoration:none}
.tile.on{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.hero{display:flex;flex-direction:column;gap:10px;padding-block:6px 4px}
.h-big{font:700 clamp(1.9rem,5vw,2.9rem)/1.08 var(--serif);max-width:20ch}
.gsec{display:flex;flex-direction:column;gap:10px}
.gh{font:700 .78rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border-top:1px solid var(--line);padding-top:14px}
.gt{font:700 1.25rem/1.2 var(--serif);flex:1;min-width:0}
.gl .row{flex-wrap:nowrap;align-items:flex-start}
.row.sp{justify-content:space-between}
.row.end{justify-content:flex-end}
.row.center,.center{justify-content:center;text-align:center;align-items:center}
.panel.center{align-items:center}
.small{font-size:.88rem}
.count{font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.count.warn{color:var(--red)}
.sublab{font:700 .72rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.sublab.w{margin:0;min-width:7.5em}
.lnk{background:none;border:0;padding:0;color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:3px;letter-spacing:0;text-transform:none;font-size:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{background:var(--file);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:600;text-align:left}
.chipbtn:hover{border-color:var(--gold)}
.chipbtn.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chipbtn i{font-style:normal;opacity:.7;font-size:.85em;margin-left:6px;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start;max-width:100%}
.seg button{background:transparent;border:0;padding:9px 14px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--text);color:var(--night)}
.efgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.ef{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.efn{font:700 .95rem var(--serif);color:var(--gold);min-width:3.6em}
.teamin{display:flex;flex-wrap:wrap;gap:8px}
.tin{display:flex;align-items:center;gap:4px;background:var(--file);border:1px solid var(--line);border-radius:8px;padding:4px 10px;flex:1 1 180px;min-width:0}
.tin input{border:0;background:transparent;padding:6px 2px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle;flex:none}
.scores{display:flex;flex-wrap:wrap;gap:8px}
.sc{flex:1 1 150px;background:var(--desk);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.sc.cur{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.sc strong{font:700 1.7rem var(--serif);font-variant-numeric:tabular-nums}
.who{font:700 clamp(1.8rem,5vw,2.6rem)/1.1 var(--serif)}
.win{font:700 clamp(2.2rem,7vw,3.6rem)/1.05 var(--serif);color:var(--gold);text-wrap:balance}
.narrow{width:100%;max-width:440px;display:flex;flex-direction:column;gap:6px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transition:width .2s linear}
.wcard{align-items:stretch;min-height:240px;justify-content:center;gap:16px}
.wcard.sm{min-height:150px}
.wtag{font:700 .72rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#8A6A1E}
.wt{color:#14213D}
.wt.low{color:#B4371F}
.wword{font:700 clamp(2.2rem,8vw,4.4rem)/1.05 var(--serif);color:#14213D;text-align:center;overflow-wrap:anywhere}
.wword.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
.wtab{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wtab span{background:#EAD9B5;color:#8E2A18;border-radius:4px;padding:4px 12px;font-weight:700;font-size:1.05rem}
.clue3 span{font-size:clamp(1.2rem,3.4vw,1.8rem);padding:8px 16px;background:#E9E2CF;color:#14213D}
.wru{color:#5A5446;text-align:center;font:italic 500 1.2rem var(--serif)}
.wru.big{font-size:clamp(1.6rem,5vw,2.6rem);color:#14213D;font-style:normal}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts.three{grid-template-columns:1fr 1fr 1fr}
.act{padding:18px 10px;border-radius:12px;font:700 1.15rem var(--sans);border:1px solid transparent}
.act.no{background:var(--file);border-color:var(--line)}
.act.ok{background:var(--green);color:#06210F}
.act.tb{background:var(--red);color:#fff}
.tg{border-radius:999px;padding:5px 12px;font-weight:700;border:1px solid var(--line);background:var(--file)}
.tg.ok{background:var(--green);color:#06210F;border-color:var(--green)}
.tg.tb{background:var(--red);color:#fff;border-color:var(--red)}
.total{font:700 1.8rem var(--serif);color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.note{background:var(--file);border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px}
/* board race */
.rwrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.rstart{display:flex;align-items:center;gap:10px}
.rboard{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,auto);gap:6px}
.sq{background:var(--file);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:72px}
.sq .n{font:700 1rem var(--serif);color:var(--dim)}
.sq .k{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq.up{background:#143629;border-color:var(--green)}.sq.up .k{color:#8FE0B9}
.sq.down{background:#3A1712;border-color:var(--red)}.sq.down .k{color:#FFB4A4}
.sq.star{background:#2E2710;border-color:var(--gold)}
.sq.end{background:var(--gold);border-color:var(--gold)}.sq.end .n,.sq.end .k{color:var(--gold-ink)}
.toks{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto;min-height:18px}
.tok{width:18px;height:18px;border-radius:50%;border:2px solid #F4EEDF;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.die{width:76px;height:76px;border-radius:14px;background:#F4EEDF;color:#14213D;font:700 2.6rem var(--serif);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.rlegend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--dim);font-size:.95rem;border-top:1px solid var(--line);padding-top:10px}
/* bingo */
.bank{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.bw{background:var(--desk);border:1px solid var(--line);border-radius:8px;padding:12px 8px;font:600 clamp(1rem,2.2vw,1.25rem) var(--serif);text-align:center;overflow-wrap:anywhere}
.bw.called{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
/* spyfall + bank */
.ql{margin:0;padding-left:20px;display:grid;gap:4px;font-size:1.05rem}
.grow{flex:1 1 260px;min-width:0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:620px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font:700 .72rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
@media (max-width:820px){.rwrap{grid-template-columns:1fr}.sq{min-height:58px;padding:4px}.sq .k{font-size:.6rem;letter-spacing:0}.acts.three{grid-template-columns:1fr}}
/* v2: categories nav, guides, art, new games */
nav .wrap{flex-direction:column;gap:6px}
.navrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.navrow.sub a{padding:6px 13px;font-size:.92rem}
nav a.half{border-color:var(--gold);color:var(--gold)}
#guide{padding-block:18px 0}
#guide:empty{display:none}
.guide{background:var(--desk);border:1px solid var(--line);border-radius:12px}
.guide summary{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary strong{display:block;font:700 1.15rem var(--serif)}
.guide summary::after{content:"＋";margin-left:auto;color:var(--gold);font-weight:700}
.guide[open] summary::after{content:"−"}
.gart{display:block;width:56px;height:56px;flex:none}
.gart svg{width:100%;height:100%;display:block}
.gcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 24px;padding:0 16px 16px}
.gcols ol{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.45}
.gcols [lang=ru] li{color:var(--dim)}
.gl{position:relative}
.gl .gart{width:64px;height:64px}
.gt small{display:block;font:600 .85rem var(--sans);color:var(--dim);margin-top:2px}
.ghn{color:var(--dim);font-weight:600}
.roleart{width:min(150px,40vw);height:auto;display:block}
.roleart svg,.rolemini svg{width:100%;height:100%;display:block}
.rolemini{width:54px;height:54px;flex:none}
.tile .rhead{display:flex;align-items:center;gap:12px}
.wdef{font:500 clamp(1.15rem,3vw,1.7rem)/1.4 var(--serif);color:#14213D;text-align:center;max-width:40ch;margin:0 auto}
details.ans{color:#5A5446;font-size:.95rem;text-align:center}
details.ans summary{cursor:pointer;color:#8A6A1E;font-weight:700}
.snow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.snowsvg{width:min(220px,100%);height:auto}
.letters{display:flex;flex-wrap:wrap;gap:6px}
.lt{min-width:1.6em;border-bottom:3px solid var(--gold);text-align:center;font:700 clamp(1.6rem,4vw,2.4rem)/1.2 var(--serif);text-transform:uppercase}
.lt.sp{border-color:transparent}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.key{padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--file);font:700 1.1rem var(--sans);text-transform:uppercase}
.key.hit{background:var(--green);color:#06210F;opacity:1}
.key.miss{background:#3A1712;color:#FFB4A4;opacity:1}
.xog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;aspect-ratio:1;max-width:100%}
.xoc{border-radius:12px;border:1px solid var(--line);background:var(--desk);font:700 clamp(1rem,2.6vw,1.35rem)/1.2 var(--serif);padding:6px;overflow-wrap:anywhere;min-width:0}
.xoc:disabled{opacity:1;cursor:default}
.xoc.sel{border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--gold)}
.xoc.x,.xoc.o{font-size:clamp(2.6rem,9vw,4.6rem)}
.xoc.x{color:var(--gold)}.xoc.o{color:#5B9BE0}
.xoc.wl{background:#2E2710}
.xo-m{font:700 1.2rem var(--serif);color:var(--gold)}.xo-m.o{color:#5B9BE0}
.seas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.act-sea{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.sea{display:grid;grid-template-columns:22px repeat(6,minmax(0,1fr));gap:4px}
.sl{display:grid;place-items:center;font:700 .85rem var(--sans);color:var(--dim)}
.cell{aspect-ratio:1;border-radius:6px;border:1px solid #2B4C7E;background:#123160;font-size:1.2rem;padding:0;min-width:0}
.cell:disabled{opacity:1}
.cell.aim{background:var(--gold)}
.cell.miss{background:#0E2246;color:#8FB3E8}
.cell.hit{background:var(--red);color:#fff}
.cell.sunk{background:#7A2414}
.qwrap{overflow-x:auto}
.qboard{display:grid;gap:6px;min-width:min(100%,560px)}
.qh{background:var(--desk);border:1px solid var(--line);border-radius:8px;padding:10px 8px;font:700 .95rem/1.25 var(--serif);text-align:center;display:grid;place-items:center}
.qv{background:#123160;border:1px solid #2B4C7E;border-radius:8px;padding:16px 0;font:700 clamp(1.2rem,3vw,1.8rem) var(--serif);color:var(--gold)}
.qv:disabled{background:var(--night);border-color:var(--line);opacity:.5}
.mgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(46%,150px),1fr))}
.mcard{aspect-ratio:4/3;border-radius:10px;border:1px solid var(--line);background:linear-gradient(135deg,#1A2A4E,#123160);display:grid;place-items:center;padding:8px;min-width:0;transition:transform .15s}
.mcard .back{font:700 1.8rem var(--serif);color:var(--gold);opacity:.8}
.mcard.up{background:#F4EEDF;color:#14213D;opacity:1}
.mcard.up.w span{font:700 clamp(1.05rem,2.4vw,1.4rem)/1.2 var(--serif)}
.mcard.up.d span{font-size:.9rem;line-height:1.3}
.mcard.got{box-shadow:inset 0 0 0 4px var(--tc,var(--gold));opacity:.75}
.snapcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.scard{min-height:200px;justify-content:center;align-items:center;text-align:center}
.lab.center{text-align:center}
@media (max-width:820px){.snow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.mcard{transition:none}}

.aggrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.agc{min-height:74px;border-radius:10px;border:1px solid var(--line);background:#F4EEDF;color:#14213D;font:700 clamp(.8rem,2.2vw,1.2rem)/1.15 var(--serif);padding:6px 4px;overflow-wrap:anywhere;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.agc:disabled{cursor:default;opacity:1}
.agc.k-gold{background:#D4AE5A;color:#1A1405}.agc.k-blue{background:#5B9BE0;color:#06142B}.agc.k-by{background:#C9C2AE;color:#14213D}.agc.k-trap{background:#0B0F19;color:#FFB4A4}
.agc:not(.op).k-gold,.agc:not(.op).k-blue,.agc:not(.op).k-by,.agc:not(.op).k-trap{outline:3px dashed #F4EEDF;outline-offset:-6px}
.agc.op{opacity:.92;text-decoration:line-through;text-decoration-thickness:2px}
.agc b{font:700 .7rem var(--sans);letter-spacing:.1em}
.figs{width:100%;height:auto;background:#fff;border-radius:10px;display:block}
.lgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lslot{display:flex;flex-direction:column;gap:4px;min-width:0;padding:6px;border-radius:8px;border:1px solid var(--line)}
.lslot.ok{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}.lslot.bad{border-color:var(--red)}
.lslot select{width:100%;background:var(--file);border:1px solid var(--line);border-radius:6px;padding:6px 4px;min-width:0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.ccard{min-height:96px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(135deg,#1A2A4E,#123160);padding:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center}
.ccard .back{font:700 1.1rem var(--serif);color:var(--gold)}
.ccard.up{background:#F4EEDF;color:#14213D;font:500 1.05rem/1.35 var(--serif)}
@media (max-width:620px){.lgrid{grid-template-columns:1fr 1fr}.aggrid{gap:4px}.agc{min-height:60px}}

<script>
const DATA={"mafia": {"roles": [{"id": "mafia", "name": "Mafia", "team": "mafia", "night": "Every night", "short": "Wake up with the other Mafia. Together, choose one player to remove.", "goal": "Win when the Mafia are equal to or more than the town."}, {"id": "doctor", "name": "Doctor", "team": "town", "night": "Every night", "short": "Choose one player to save tonight. You can save yourself once. You can’t save the same person two nights in a row.", "goal": "Help the town find all the Mafia."}, {"id": "sheriff", "name": "Sheriff", "team": "town", "night": "Every night", "short": "Point at one player. The narrator shows thumbs up (Mafia) or thumbs down (not Mafia).", "goal": "Find the Mafia, but be careful: if they learn who you are, you are next."}, {"id": "cupid", "name": "Cupid", "team": "town", "night": "First night only", "short": "Choose two players to fall in love. If one lover leaves the game, the other one leaves too, from a broken heart.", "goal": "Help the town find all the Mafia."}, {"id": "grandma", "name": "Grandma", "team": "town", "night": "Never wakes up", "short": "Grandma is tougher than she looks. If the Mafia choose you at night, you survive and one Mafia player leaves instead.", "goal": "Help the town find all the Mafia."}, {"id": "vigilante", "name": "Vigilante", "team": "town", "night": "Once per game", "short": "Once in the game, you can remove one player at night. Choose carefully: if you remove a town player, you are wrong in front of everyone.", "goal": "Help the town find all the Mafia."}, {"id": "magician", "name": "Magician", "team": "town", "night": "Once per game", "short": "Once in the game, you can bring back one player who left the game the night before.", "goal": "Help the town find all the Mafia."}, {"id": "informant", "name": "Informant", "team": "mafia", "night": "First night only", "short": "You secretly work for the Mafia. On the first night you open your eyes with them, so you know who they are. You don’t choose victims. The Sheriff sees you as ‘not Mafia’.", "goal": "Protect the Mafia. Win when they win."}, {"id": "busdriver", "name": "Bus Driver", "team": "town", "night": "Every night", "short": "Choose two players to swap seats on your bus. Anything that happens to one of them tonight happens to the other instead.", "goal": "Help the town find all the Mafia."}, {"id": "civilian", "name": "Civilian", "team": "town", "night": "Never wakes up", "short": "You have no special power, but you have the most important weapon: your voice. Listen, ask questions and vote.", "goal": "Help the town find all the Mafia."}], "phrases": {"Accusing": ["I think it was you, because…", "You were very quiet yesterday. Why?", "Why did you vote for her so quickly?", "Your story doesn’t make sense.", "I’m sure you’re hiding something."], "Defending": ["It can’t be me. I’m a civilian!", "Why would I do that?", "That’s not true. Let me explain.", "If I were Mafia, I wouldn’t…", "Look at him, not me!"], "Guessing": ["She must be the Mafia, because…", "He might be the Doctor.", "It can’t have been Ali. He was the first to…", "They could be working together.", "I’m not sure, but maybe…"], "Voting": ["I vote for… because…", "I agree with Dana.", "I’m changing my vote.", "Let’s give him one more chance.", "I’m not voting for anyone yet."]}}, "cases": [{"id": "necklace", "title": "The Missing Necklace", "place": "Hotel Aurora", "level": "B1", "time": "45–60 min", "players": "8–12", "grammar": "Past continuous: What were you doing at 7:00?", "intro": "It is Saturday evening at the Hotel Aurora. Dana Volkova, a famous pianist, is staying in room 214. At 6:55 p.m. she left her room for dinner with friends in town. She forgot to lock the door. When she came back at 7:45 p.m., her grandmother’s gold necklace was not on the table. The hotel manager has asked everyone in the hotel to stay in the meeting room. One of you is the thief. The police will arrive in 45 minutes. Find the thief before they do!", "questions": ["What’s your name and what do you do?", "Why are you staying at the hotel?", "What were you doing at 7:00 p.m.? Who were you with?", "What were you doing at 7:30 p.m.? Who were you with?", "Did you see anything strange?"], "times": ["7:00 p.m.", "7:30 p.m."], "chars": [{"name": "Arman Seitkali", "role": "Photographer", "why": "You are on holiday with your wife, Leila. You aren’t very happy together at the moment.", "t1": "You were arguing with your wife, Leila, in your room (312).", "t2": "You were phoning your brother in the hotel lobby. You were speaking very loudly.", "extra": "Tell people you were in the lobby. A woman was waiting there for a taxi."}, {"name": "Leila Seitkali", "role": "Teacher", "why": "You are on holiday with your husband, Arman.", "t1": "You were arguing with your husband, Arman, in your room (312).", "t2": "You were crying in the hotel bar. A friendly woman (Nina) sat with you and talked to you.", "extra": "You don’t want people to know about the argument, but you must tell the truth."}, {"name": "Nina Park", "role": "Dana’s best friend", "why": "You are travelling with Dana. You didn’t go to dinner because you were tired.", "t1": "You were doing a yoga class in the hotel gym. The trainer was Tom Reed.", "t2": "You were in the hotel bar. A woman (Leila) was crying, so you sat with her.", "extra": "You know Dana always leaves the necklace on the table because it is too heavy to wear at dinner."}, {"name": "Tom Reed", "role": "Personal trainer at the hotel gym", "why": "You work at the hotel.", "t1": "You were teaching a yoga class in the gym. Only one person came: Nina Park.", "t2": "You were fixing a broken running machine in the gym with Ivan, the hotel engineer.", "extra": "You are a big fan of Dana’s music and you have all her albums."}, {"name": "Ivan Lee", "role": "Hotel engineer", "why": "You work at the hotel.", "t1": "You were repairing the lift on the 2nd floor, at the end of the corridor. Oleg, the security guard, was holding your ladder. You couldn’t see room 214 from there.", "t2": "You were fixing a running machine in the gym with Tom Reed.", "extra": "At 7:00 you saw a cleaning trolley outside room 210, next to room 214."}, {"name": "Oleg Brandt", "role": "Security guard", "why": "You work at the hotel.", "t1": "You were holding a ladder for Ivan, the engineer. He was repairing the lift on the 2nd floor.", "t2": "You were watching the security cameras in your office. Maria from reception brought you a cup of tea.", "extra": "The camera on the 2nd floor has been broken since Friday. You told the manager, but nobody fixed it."}, {"name": "Maria Gomez", "role": "Receptionist", "why": "You work at the hotel.", "t1": "You were checking in a new guest, a journalist called Daniel Brooks.", "t2": "You were taking a cup of tea to Oleg in the security office.", "extra": "At 6:50 a man in a grey suit asked you which room Dana Volkova was in. You didn’t tell him, but he saw her name on your computer screen."}, {"name": "Daniel Brooks", "role": "Journalist", "why": "You came to interview Dana Volkova for a music magazine tomorrow.", "t1": "You were checking in at reception. The receptionist was Maria.", "t2": "You were having coffee in the restaurant with Sofia Lind, a singer. There was nobody else in the restaurant.", "extra": "Sofia told you she doesn’t like Dana very much."}, {"name": "Sofia Lind", "role": "Singer", "why": "You sing in the hotel restaurant every Saturday. You and Dana went to music school together, but you are not friends.", "t1": "You were singing in the hotel restaurant. There were only a few people listening.", "t2": "You were having coffee with a journalist, Daniel Brooks, in the restaurant. Only you two were there.", "extra": "You think Dana is arrogant, but you would never steal from her."}, {"name": "Emma Clarke", "role": "Doctor", "why": "You are on holiday alone.", "t1": "You were swimming in the hotel pool. You were alone. Nobody else was in the pool.", "t2": "You were waiting in the lobby for a taxi. A man was speaking very loudly on the phone.", "extra": "At 7:40 you saw a man in a grey suit near the lift. His hair was completely dry."}, {"name": "Aliya Nurlan", "role": "Hotel cleaner", "why": "You work at the hotel.", "t1": "You were cleaning room 210 on the 2nd floor. You were alone.", "t2": "You were on a video call with your daughter in the staff room.", "extra": "You were near room 214, so people might think it was you. Stay calm and tell the truth."}, {"name": "Victor Hale", "role": "Antiques dealer", "why": "You buy and sell old jewellery. You are wearing a grey suit.", "t1": "THE TRUTH: you were in room 214 stealing the necklace. YOU MUST SAY: “I was swimming in the pool with a woman.”", "t2": "THE TRUTH: you were hiding the necklace in your room (118). YOU MUST SAY: “I was having dinner in the restaurant.”", "extra": "You are the thief! Don’t tell anyone. Lie about where you were. Try to make people suspect the cleaner or the singer.", "culprit": true}], "clues": ["The camera on the 2nd floor wasn’t working on Saturday.", "The door of room 214 was not damaged. The thief walked in.", "A business card was found on the floor of room 214. Only the letters ‘…TIQUES’ can be read.", "The thief knew which room was Dana’s."], "solution": "Victor Hale took the necklace. He said he was swimming with a woman at 7:00, but Emma was alone in the pool, and at 7:40 she saw him with dry hair. He said he was having dinner in the restaurant at 7:30, but Daniel and Sofia were the only people there. Maria saw a man in a grey suit asking for Dana’s room, and the business card in room 214 was from an ANTIQUES dealer. The necklace is in room 118."}, {"id": "reunion", "title": "Murder at the Reunion", "place": "Riverside Music School", "level": "B1–B2", "time": "60–90 min", "players": "7–11", "grammar": "Past continuous + past simple; modals of deduction (must / might / can’t have)", "intro": "Tonight is the 20-year reunion party at Riverside Music School. Old students and teachers are in the main hall. At 9:15 p.m. all the lights in the school went out. Two minutes later they came back on, and then everyone heard a scream. Mr Robert Harlow, the old head teacher, was found dead in the piano room. Somebody hit him on the head with a heavy metronome. The doors of the school were locked, so the murderer is still here. Who killed Mr Harlow?", "questions": ["What’s your name? Who are you?", "What did you think of Mr Harlow?", "When did you last see him? What was he doing?", "What were you doing at 9:15, when the lights went out?", "Who do you think did it, and why?"], "times": ["Last time you saw Mr Harlow", "At 9:15 (lights out)"], "chars": [{"name": "Kate Moore", "role": "Ex-student, now a famous violinist", "why": "Mr Harlow was very strict. He made you practise for six hours a day. You hated it then, but now you are grateful.", "t1": "At 8:40 you gave him a signed copy of your new CD. He smiled and said he was proud of you.", "t2": "You were talking to Peter Owen, another ex-student, in the main hall.", "extra": "You noticed that Mr Harlow was holding a blue folder all evening. He never put it down."}, {"name": "Peter Owen", "role": "Ex-student, now works in a bank", "why": "You failed your music exams. Mr Harlow told your parents you had no talent. You still feel angry about it.", "t1": "At 8:50 you saw him arguing with the head teacher, Mr Grant, near the office. Mr Grant looked very angry.", "t2": "You were talking to Kate Moore in the main hall. You were bored, but she was talking about her CD.", "extra": "You have a good reason to hate Mr Harlow, so people will suspect you. Tell the truth."}, {"name": "David Grant", "role": "Head teacher of the school now", "why": "Mr Harlow was the head teacher before you. You are always polite about him, but you didn’t like him.", "t1": "THE TRUTH: at 8:50 you argued with him near your office. He knew you took money from the school charity fund. He wanted to tell everyone at the party. YOU MUST SAY: “I didn’t see him at all this evening.”", "t2": "THE TRUTH: you turned off the main light switch next to your office, walked to the piano room and hit him. YOU MUST SAY: “I was in my office, working on the computer.”", "extra": "You are the murderer! Don’t tell anyone. The blue folder with the bank papers is hidden in your office.", "culprit": true}, {"name": "Anna Webb", "role": "Music teacher", "why": "You worked with Mr Harlow for ten years. He was a good teacher, but he didn’t have many friends.", "t1": "At 9:05 you saw him walking to the piano room. He looked worried. He was holding a blue folder.", "t2": "You were serving drinks to the guests in the main hall with two other teachers.", "extra": "Mr Harlow told you last week: “I have found something terrible about this school.”"}, {"name": "Sam Ortiz", "role": "Caretaker", "why": "Mr Harlow was always kind to you. You are very sad.", "t1": "At 8:50 you heard him arguing with Mr Grant near the office. Mr Harlow shouted: “Tonight, everyone will know the truth!”", "t2": "You were in the kitchen. When the lights went out, you ran to the main light switch. It is next to Mr Grant’s office. Someone turned it off by hand. It wasn’t a problem with the electricity.", "extra": "You saw Mr Grant come out of the piano room corridor at 9:18. He was breathing very fast."}, {"name": "Ruth Kim", "role": "Ex-student, now a nurse", "why": "Mr Harlow wasn’t friendly, but he helped you get a place at a good university.", "t1": "At 9:00 he asked you for something for a headache. You gave him some tablets.", "t2": "You were in the toilets. You were alone.", "extra": "You were alone at 9:15, so people may suspect you. Stay calm."}, {"name": "Mark Ellis", "role": "Ex-student, now a journalist", "why": "You are writing a book about scandals in music schools.", "t1": "At 9:00 Mr Harlow said to you: “Meet me in the piano room at 9:30. I have a big story for you.”", "t2": "You were outside in the car park, talking on the phone to your editor. You can show the call on your phone.", "extra": "You think the ‘big story’ was in the blue folder. Where is the folder now?"}], "extras": [{"name": "Olga Fox", "role": "Ex-student", "why": "You didn’t really know Mr Harlow.", "t1": "You didn’t see him this evening.", "t2": "You were dancing in the main hall with Tim Brooks.", "extra": "No important information."}, {"name": "Tim Brooks", "role": "Ex-student, now a DJ", "why": "You thought he was boring.", "t1": "You saw him eating cake at 8:30.", "t2": "You were dancing in the main hall with Olga Fox.", "extra": "No important information."}, {"name": "Leo Park", "role": "Teacher", "why": "You only started at the school this year.", "t1": "You said hello to him at 8:00.", "t2": "You were serving drinks in the main hall with Anna Webb.", "extra": "No important information."}, {"name": "Jane Hall", "role": "School receptionist", "why": "He was always polite to you.", "t1": "You saw him arrive at 7:30.", "t2": "You were washing glasses in the kitchen with Sam, the caretaker. Sam ran out when the lights went off.", "extra": "No important information."}], "clues": ["Someone turned off the main light switch by hand. The switch is next to the head teacher’s office.", "Mr Harlow’s blue folder is missing. It wasn’t in the piano room.", "A blue folder was found in the head teacher’s office. Inside were bank papers: money is missing from the school charity fund.", "The metronome was wiped clean. The murderer was careful."], "solution": "David Grant killed Mr Harlow. He said he didn’t see Mr Harlow all evening, but Peter and Sam both saw them arguing at 8:50. Mr Harlow knew Grant took money from the charity fund and wanted to tell everyone. The light switch was turned off by hand, next to Grant’s office. Sam saw Grant leaving the piano room corridor at 9:18, and the blue folder was found in his office."}, {"id": "cake", "title": "Who Took the Birthday Cake?", "place": "Aunt Saule’s house", "level": "A2–B1", "time": "30–45 min", "players": "6–8", "grammar": "Past simple and past continuous; questions with ‘Who…?’ and ‘What were you doing…?’", "intro": "It’s Aunt Saule’s 50th birthday party. At 3:00 p.m. there was a beautiful chocolate cake on the kitchen table. At 4:00 p.m. the cake was gone! There are only a few crumbs on the table. The party starts at 5:00. Somebody in the house took the cake. Who was it, and where is it now?", "questions": ["Who are you?", "What were you doing between 3:00 and 4:00?", "Who were you with?", "Did you see or hear anything strange?"], "times": ["3:00–3:30", "3:30–4:00"], "chars": [{"name": "Aunt Saule", "role": "The birthday woman", "why": "You are 50 today!", "t1": "You were at the hairdresser’s in town.", "t2": "You were still at the hairdresser’s. You came home at 4:10. The hairdresser can tell everyone.", "extra": "You can ask the hairdresser to phone and confirm your story."}, {"name": "Uncle Ruslan", "role": "Saule’s brother", "why": "You are helping with the party.", "t1": "THE TRUTH: you picked up the cake to move it, but you dropped it on the floor! YOU MUST SAY: “I was watching football on TV in the living room.”", "t2": "THE TRUTH: you put the broken cake in the garage and drove to the cake shop to buy a new one. It will arrive at 4:30. YOU MUST SAY: “I was still watching football.”", "extra": "You took the cake! Don’t tell anyone. You are embarrassed.", "culprit": true}, {"name": "Dima", "role": "Saule’s nephew, 10 years old", "why": "You love chocolate.", "t1": "You were eating chocolates from a box in your bedroom. Your face is still brown with chocolate!", "t2": "You were making a funny video in the garden with your cousin Zara.", "extra": "Everyone thinks it was you because of your face. It wasn’t!"}, {"name": "Grandpa Bolat", "role": "Saule’s father", "why": "You are 80 and you love quiet afternoons.", "t1": "You were sleeping on the sofa in the living room. The TV was OFF. You can’t sleep with the TV on.", "t2": "You were still sleeping on the sofa. Nobody else was in the living room.", "extra": "At about 3:30 the kitchen made a loud noise, like something falling. It woke you for a second."}, {"name": "Zara", "role": "Saule’s niece, a teenager", "why": "You love making videos for social media.", "t1": "You were blowing up balloons in the garden with Aunt Aliya.", "t2": "You were making a funny video in the garden with Dima.", "extra": "In the corner of your video, at 3:36, Uncle Ruslan’s car is driving away from the house."}, {"name": "Aunt Aliya", "role": "Ruslan’s wife", "why": "You are decorating the house for the party.", "t1": "You were blowing up balloons in the garden with Zara.", "t2": "You were putting balloons on the front door.", "extra": "You noticed chocolate on Ruslan’s shoe at 4:05. He said it was mud."}, {"name": "Mrs Petrova", "role": "The neighbour", "why": "You were invited to the party.", "t1": "You were working in your garden next door.", "t2": "You saw Ruslan’s car leave the house at 3:35 and come back at 4:05. He was driving fast.", "extra": "You know everything that happens on this street!"}, {"name": "Kostya", "role": "The party photographer", "why": "You came early to take photos of the house.", "t1": "You weren’t there. You arrived at 3:45.", "t2": "At 3:50 you took a photo of the kitchen. The table is empty and the garage door is open.", "extra": "Your photos show the time they were taken."}], "clues": ["There is chocolate cake on the garage floor.", "A receipt from ‘Sweet Dreams Cake Shop’ was found in a jacket. Time: 3:52 p.m.", "Grandpa says the TV was off all afternoon."], "solution": "Uncle Ruslan took the cake. He said he was watching football, but Grandpa was asleep in the living room and the TV was off. Grandpa heard a crash in the kitchen at 3:30. Zara’s video and Mrs Petrova show Ruslan’s car leaving at 3:35 and coming back at 4:05. The broken cake is in the garage, and the receipt shows he bought a new cake at 3:52. It’s arriving at 4:30!"}], "puzzles": [{"title": "The Phone Message", "story": "Mr Bekov’s office was robbed. Before the robber hit him, he typed three numbers on his old mobile phone: 3 2 6. The three suspects are Amy, Ben and Dan.", "q": "Who robbed Mr Bekov?", "opts": ["Amy", "Ben", "Dan"], "a": 2, "hint": "Look at the letters on an old phone keypad.", "why": "On a phone keypad, 3 = D, 2 = A, 6 = N. The message spells DAN."}, {"title": "The Frosty Window", "story": "It was −25°C in Kostanay. A jewellery shop was robbed at night. The night guard said: “I was in the warm guard room. I looked through the window and saw a tall man run out of the shop.” The detective said: “You’re lying.”", "q": "How did the detective know?", "opts": ["Guards can’t see in the dark", "The window was covered in ice on the inside", "Guards are never tall"], "a": 1, "hint": "Think about a warm room on a very cold night.", "why": "In a warm room at −25°C, ice covers the inside of the window. Nobody could see through it."}, {"title": "The Mirror Note", "story": "A famous painting was stolen from a gallery. On the bathroom mirror, someone wrote with lipstick: NOMIS. The suspects are Simon, Mona and Sami.", "q": "Who stole the painting?", "opts": ["Simon", "Mona", "Sami"], "a": 0, "hint": "What happens to writing in a mirror?", "why": "Read NOMIS backwards: SIMON."}, {"title": "The Hot Engine", "story": "At 11 p.m. a shop window was broken across town. At midnight the police visited Mr Lee. He was wearing pyjamas. “I’ve been at home all evening,” he said. A detective put her hand on his car in the cold street.", "q": "Why did she arrest him?", "opts": ["The car was dirty", "The car engine was still warm", "The car had no petrol"], "a": 1, "hint": "Cars get hot when you drive them.", "why": "The engine was still warm, so the car was driven recently. Mr Lee wasn’t at home all evening."}, {"title": "The New Candle", "story": "There was no electricity in the village all evening. A man said: “I was at home readi const store={get(k,d){try{const v=localStorage.getItem('ifmys.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ifmys.'+k,JSON.stringify(v))}catch(e){}}};


let timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function timer(id,secs,onEnd){stopTimer();const t0=Date.now();const f=()=>{const el=document.getElementById(id);if(!el)return;const l=Math.max(0,secs-Math.floor((Date.now()-t0)/1000));el.textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0');el.classList.toggle('low',l<=15);if(l<=0){stopTimer();onEnd&&onEnd()}};f();timerId=setInterval(f,250)}
/* =================== MAFIA =================== */
const R=Object.fromEntries(DATA.mafia.roles.map(r=>[r.id,r]));
const SPECIAL=['doctor','sheriff','cupid','grandma','vigilante','magician','busdriver','informant'];
function suggest(n){
  if(n<=9)return{m:2,s:['doctor','sheriff']};
  if(n<=12)return{m:3,s:['doctor','sheriff','cupid','grandma']};
  if(n<=16)return{m:3,s:['doctor','sheriff','cupid','grandma','vigilante','informant']};
  return{m:4,s:['doctor','sheriff','cupid','grandma','vigilante','magician','busdriver','informant']};
}
let MF=store.get('mafia',null);
let ms={n:10,names:'',mafia:3,specials:suggest(10).s};
function mafiaSetup(){
  if(MF&&MF.players)return mafiaGame();
  const town=ms.n-ms.mafia-ms.specials.length;
  app.innerHTML=`
  <div><h2>Mafia</h2><p class="lead">The narrator deals secret roles on this screen. Each student taps to see their role, then hides it and passes the device (or the teacher shows roles one by one on a phone). Then the narrator runs the nights and days from here.</p></div>
  <section class="panel">
    <div class="lab">1 · Players</div>
    <div class="row"><button class="btn" id="n-">−</button><span class="timer" style="font-size:2rem">${ms.n}</span><button class="btn" id="n+">+</button><span class="muted">players (6–20), not counting the narrator</span></div>
    <label class="f">Student names (optional, one per line)<textarea id="names" placeholder="Aida&#10;Bekzat&#10;Dana…">${esc(ms.names)}</textarea></label>
  </section>
  <section class="panel">
    <div class="lab">2 · Roles</div>
    <div class="row"><span>Mafia:</span><button class="btn" id="m-">−</button><strong style="font:700 1.4rem var(--serif)">${ms.mafia}</strong><button class="btn" id="m+">+</button><button class="btn" id="sug">Use suggested roles</button></div>
    <div class="row">${SPECIAL.map(id=>`<button class="btn ${ms.specials.includes(id)?'on':''}" data-sp="${id}" aria-pressed="${ms.specials.includes(id)}">${R[id].name}</button>`).join('')}</div>
    <p class="muted">${town>=0?`${town} civilian${town===1?'':'s'}.`:'<span style="color:var(--red)">Too many roles for this many players.</span>'}</p>
  </section>
  <section class="panel"><div class="lab">Role guide</div>
    <div class="grid">${DATA.mafia.roles.map(r=>`<div class="tile"><div class="rhead"><span class="rolemini">${ART[r.id]||''}</span><div class="row" style="flex:1"><h3>${r.name}</h3><span class="chip ${r.team==='mafia'?'red':''}">${r.team==='mafia'?'Mafia team':'Town'}</span></div></div><p>${esc(r.short)}</p><p class="meta">Wakes: ${r.night}</p></div>`).join('')}</div>
  </section>
  <div class="row" style="justify-content:flex-end"><button class="btn gold big" id="deal" ${town<0?'disabled':''}>Deal roles</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;ms.names=$('#names').value;
    if(b.id==='n-'&&ms.n>6){ms.n--;}
    if(b.id==='n+'&&ms.n<20){ms.n++;}
    if(b.id==='m-'&&ms.mafia>1)ms.mafia--;
    if(b.id==='m+'&&ms.mafia<5)ms.mafia++;
    if(b.id==='sug'){const s=suggest(ms.n);ms.mafia=s.m;ms.specials=s.s}
    if(b.dataset.sp){const id=b.dataset.sp;ms.specials=ms.specials.includes(id)?ms.specials.filter(x=>x!==id):[...ms.specials,id]}
    if(b.id==='deal')return deal();
    mafiaSetup()};
}
function deal(){
  const names=ms.names.split('\n').map(s=>s.trim()).filter(Boolean);
  const roles=shuffle([...Array(ms.mafia).fill('mafia'),...ms.specials,...Array(ms.n-ms.mafia-ms.specials.length).fill('civilian')]);
  MF={players:roles.map((r,i)=>({name:names[i]||'Player '+(i+1),role:r,out:false})),idx:0,phase:'deal',night:1,step:0,used:{}};
  save();mafiaGame();
}
function save(){store.set('mafia',MF)}
function mafiaGame(){
  if(MF.phase==='deal')return dealView();
  return narrator();
}
function dealView(){
  const p=MF.players[MF.idx];
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Deal the roles</h2><span class="muted">${MF.idx+1} of ${MF.players.length}</span></div>
  <div class="reveal" id="rv"><p class="lab">Pass to</p><div class="role" style="color:var(--text)">${esc(p.name)}</div><p class="muted">Only ${esc(p.name)} looks at the screen now.</p><button class="btn gold big" id="show">Show my role</button></div>
  <div class="row" style="justify-content:space-between"><button class="btn" id="reset">Start again</button><button class="btn" id="skip">Skip to narrator</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='show'){const r=R[p.role];const mates=r.team==='mafia'&&p.role!=='informant'?MF.players.filter((q,i)=>q.role==='mafia'&&q!==p).map(q=>q.name):[];
      $('#rv').className='reveal '+r.team;
      $('#rv').innerHTML=`<p class="lab">${esc(p.name)}, you are</p><span class="roleart">${ART[p.role]||''}</span><div class="role">${r.name.toUpperCase()}</div><p>${esc(r.short)}</p><p class="muted">${esc(r.goal)}</p>${mates.length?`<p><strong>Your Mafia partners:</strong> ${mates.map(esc).join(', ')}</p>`:''}<button class="btn big" id="hide">Hide and pass on</button>`}
    if(b.id==='hide'){MF.idx++;if(MF.idx>=MF.players.length){MF.phase='night';MF.step=0}save();mafiaGame()}
    if(b.id==='skip'){MF.phase='night';MF.step=0;save();mafiaGame()}
    if(b.id==='reset'){MF=null;store.set('mafia',null);mafiaSetup()}};
}
function nightSteps(){
  const has=id=>MF.players.some(p=>p.role===id&&!p.out);
  const s=[['Everyone','“Everyone, close your eyes. Night is falling on the town…”']];
  if(MF.night===1&&has('cupid'))s.push(['Cupid','“Cupid, open your eyes. Choose two people to fall in love.” Touch their heads, then: “Cupid, close your eyes.”']);
  if(MF.night===1&&(has('informant')))s.push(['Mafia + Informant','“Mafia and Informant, open your eyes. Look at each other. Close your eyes.”']);
  if(has('busdriver'))s.push(['Bus Driver','“Bus Driver, open your eyes. Choose two people to swap.” …“Close your eyes.”']);
  s.push(['Mafia','“Mafia, open your eyes. Choose one person to remove.” …“Mafia, close your eyes.”']);
  if(has('doctor'))s.push(['Doctor','“Doctor, open your eyes. Who do you want to save tonight?” …“Close your eyes.”']);
  if(has('sheriff'))s.push(['Sheriff','“Sheriff, open your eyes. Point at someone.” Thumbs up = Mafia, thumbs down = not Mafia. “Close your eyes.”']);
  if(has('vigilante')&&!MF.used.vigilante)s.push(['Vigilante','“Vigilante, open your eyes. Do you want to use your one shot tonight?”']);
  if(has('magician')&&!MF.used.magician&&MF.players.some(p=>p.out))s.push(['Magician','“Magician, open your eyes. Do you want to bring someone back?”']);
  s.push(['Morning','“Everyone, open your eyes!” Tell the story of the night. Tap below on anyone who is out.']);
  s.push(['Day',`Discussion time. Students accuse and defend, then vote by pointing. Tap the player who is voted out.`]);
  return s;
}
function narrator(){
  const steps=nightSteps();if(MF.step>=steps.length)MF.step=steps.length-1;
  const alive=MF.players.filter(p=>!p.out);const ma=alive.filter(p=>R[p.role].team==='mafia').length,town=alive.length-ma;
  const realM=alive.filter(p=>p.role==='mafia').length;
  const win=realM===0?'The town wins! Every Mafia player is out.':ma>=town?'The Mafia win! They are equal to the town.':'';
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Night ${MF.night} · Narrator</h2><div class="row"><span class="chip">${alive.length} in game</span><span class="chip red">${ma} Mafia team</span></div></div>
  ${win?`<div class="solution">${win}</div>`:''}
  <section class="panel"><div class="lab">Script</div>
   ${steps.map((s,i)=>`<div class="step ${i===MF.step?'cur':''}"><b>${i+1}</b><div><strong>${s[0]}</strong><p>${s[1]}</p></div></div>`).join('')}
   <div class="row"><button class="btn" id="prev" ${MF.step===0?'disabled':''}>Back</button>${MF.step<steps.length-1?`<button class="btn gold" id="next">Next step</button>`:`<button class="btn gold" id="newnight">Start night ${MF.night+1}</button>`}
   ${steps[MF.step][0]==='Day'?`<span class="timer" id="tm">3:00</span><button class="btn" id="go3">Start 3-min discussion</button>`:''}</div>
  </section>
  <section class="panel"><div class="row" style="justify-content:space-between"><div class="lab">Players · tap to mark out / back in</div><button class="btn" id="peek">${MF.peek?'Hide roles':'Show roles (narrator only)'}</button></div>
   <div class="pl">${MF.players.map((p,i)=>`<button class="pp ${p.out?'out':''} ${MF.peek&&R[p.role].team==='mafia'?'m':''}" data-p="${i}"><span>${esc(p.name)}</span>${MF.peek?`<small class="muted">${R[p.role].name}</small>`:''}</button>`).join('')}</div>
   <div class="row"><label class="row"><input type="checkbox" id="uv" ${MF.used.vigilante?'checked':''}> Vigilante shot used</label><label class="row"><input type="checkbox" id="um" ${MF.used.magician?'checked':''}> Magician power used</label></div>
  </section>
  <section class="panel"><div class="lab">Language for the day</div><div class="phr">${Object.entries(DATA.mafia.phrases).map(([k,v])=>`<div><strong>${k}</strong><ul>${v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></section>
  <div class="row" style="justify-content:space-between"><button class="btn" id="redeal">Same players, new roles</button><button class="btn" id="end">New game setup</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='next'){MF.step++;}
    if(b.id==='prev'){MF.step--;}
    if(b.id==='newnight'){MF.night++;MF.step=0;}
    if(b.id==='peek'){MF.peek=!MF.peek;}
    if(b.dataset.p){const p=MF.players[+b.dataset.p];p.out=!p.out;}
    if(b.id==='go3'){timer('tm',180);return}
    if(b.id==='redeal'){ms.n=MF.players.length;ms.names=MF.players.map(p=>p.name).join('\n');MF=null;return deal()}
    if(b.id==='end'){MF=null;store.set('mafia',null);return mafiaSetup()}
    save();narrator()};
  app.onchange=e=>{if(e.target.id==='uv')MF.used.vigilante=e.target.checked;if(e.target.id==='um')MF.used.magician=e.target.checked;save()};
}

    ${c.clues.slice(0,CS.clue).map((x,i)=>`<div class="clue"><strong>Clue ${i+1}.</strong> ${esc(x)}</div>`).join('')}
    ${CS.clue<c.clues.length?`<div class="row"><button class="btn gold big" id="nextclue">Reveal clue ${CS.clue+1}</button></div>`:'<p class="muted">All clues are out. Time to vote!</p>'}</section>`;
  if(CS.view==='vote'){const tot=Object.values(CS.votes).reduce((a,b)=>a+b,0);body=`<section class="panel"><div class="lab">Who did it? Each group or student votes. ${tot} vote${tot===1?'':'s'}</div>
    ${c.chars.map((ch,i)=>{const v=CS.votes[i]||0;return `<div class="vote"><span>${esc(ch.name)}</span><button class="btn" data-dv="${i}" aria-label="Remove vote">−</button><span class="n">${v}</span><button class="btn" data-v="${i}" aria-label="Add vote">+</button><div class="bar"><i style="width:${tot?v/tot*100:0}%"></i></div></div>`}).join('')}</section>`}
  if(CS.view==='solve')body=CS.sure?`<div class="solution"><strong>${esc(c.chars.find(x=>x.culprit).name)} did it.</strong><br>${esc(c.solution)}</div>`:
    `<section class="panel"><p class="big-text">Has every group voted?</p><div class="row"><button class="btn gold big" id="sure">Yes, show the solution</button><button class="btn" data-view="vote">Not yet</button></div></section>`;
  app.innerHTML=`<div class="row" style="justify-content:space-between"><div><span class="lab">${esc(c.place)} · ${c.level}</span><h2>${esc(c.title)}</h2></div><button class="btn" id="back">All mysteries</button></div>
  <div class="row">${tabs.map(([k,l])=>`<button class="btn ${CS.view===k?'on':''}" data-view="${k}">${l}</button>`).join('')}</div>${body}`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='back')return casesHome();
    if(b.dataset.view){CS.view=b.dataset.view;CS.card=null;if(b.dataset.view!=='clues')stopTimer()}
    if(b.dataset.card)CS.card=+b.dataset.card;
    if(b.id==='closecard')CS.card=null;
    if(b.id==='nextclue')CS.clue++;
    if(b.id==='t10'){timer('tm',600);return}
    if(b.dataset.v){CS.votes[b.dataset.v]=(CS.votes[b.dataset.v]||0)+1}
    if(b.dataset.dv){CS.votes[b.dataset.dv]=Math.max(0,(CS.votes[b.dataset.dv]||0)-1)}
    if(b.id==='sure')CS.sure=true;
    if(b.id==='clrnotes'){store.set('notes.'+c.id,{})}
    caseView()};
  app.oninput=e=>{if(e.target.dataset.n){const N=store.get('notes.'+c.id,{});N[e.target.dataset.n]=e.target.value;store.set('notes.'+c.id,N)}};
}

let PZ={ans:{},hint:{}};
function puzzles(){
  const right=Object.entries(PZ.ans).filter(([i,a])=>DATA.puzzles[i].a===a).length;
  app.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>Detective puzzles</h2><p class="lead">Read each case, talk in pairs, then choose an answer. One try per case!</p></div><span class="score">Solved: ${right} / ${DATA.puzzles.length}</span></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))">${DATA.puzzles.map((p,i)=>{const a=PZ.ans[i];return `<section class="panel"><div class="row"><span class="chip">Case ${i+1}</span><h3>${esc(p.title)}</h3></div>
   <p>${esc(p.story)}</p><p><strong>${esc(p.q)}</strong></p>
   ${p.opts.map((o,j)=>`<button class="opt ${a!=null?(j===p.a?'right':(j===a?'wrong':'')):''}" data-i="${i}" data-j="${j}" ${a!=null?'disabled':''}>${'ABC'[j]}. ${esc(o)}</button>`).join('')}
   ${a!=null?`<p><strong>${a===p.a?'Correct!':'Not quite.'}</strong> ${esc(p.why)}</p>`:(PZ.hint[i]?`<p class="muted">Hint: ${esc(p.hint)}</p>`:`<div><button class="btn" data-h="${i}">Show a hint</button></div>`)}
  </section>`}).join('')}</div>
  <div class="row"><button class="btn" id="resetpz">Start again</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.j!=null&&b.dataset.i!=null){PZ.ans[b.dataset.i]=+b.dataset.j}
    if(b.dataset.h)PZ.hint[b.dataset.h]=1;
    if(b.id==='resetpz')PZ={ans:{},hint:{}};
    const y=window.scrollY;puzzles();window.scrollTo(0,y)};
}

let RD={order:null,i:0,show:false,teams:['Team A','Team B'],pts:[0,0]};
function riddlesBase(){
  if(!RD.order)RD.order=shuffle(RDATA().map((_,i)=>i));
  const r=RDATA()[RD.order[RD.i]];
  app.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>${RSET==='easy'?'Easy riddles':'Tricky riddles'}</h2><p class="lead">Read the riddle. Teams may only ask yes/no questions. The teacher answers “yes”, “no” or “not important”.</p></div><span class="muted">Riddle ${RD.i+1} of ${RD.order.length}</span></div>
  <section class="panel" style="padding:32px 18px;gap:20px"><p class="rq">${esc(r.q)}</p>
   ${RD.show?`<div class="ra">${esc(r.a)}</div>`:''}
   <div class="row" style="justify-content:center"><span class="timer" id="tm">2:00</span><button class="btn" id="t2">2-min timer</button>${RD.show?'':`<button class="btn gold" id="ans">Show answer</button>`}</div></section>
  <section class="panel"><div class="lab">Points</div><div class="teams">${RD.teams.map((t,i)=>`<div class="t"><span>${esc(t)}</span><button class="btn" data-m="${i}" aria-label="Minus">−</button><strong>${RD.pts[i]}</strong><button class="btn" data-p="${i}" aria-label="Plus">+</button></div>`).join('')}
   <button class="btn" id="addt" ${RD.teams.length>=4?'disabled':''}>+ Team</button></div></section>
  <div class="row" style="justify-content:space-between"><button class="btn" id="prev" ${RD.i===0?'disabled':''}>Previous</button><button class="btn gold big" id="next" ${RD.i>=RD.order.length-1?'disabled':''}>Next riddle</button></div>`;

let AL={crime:0,stage:0,marks:{}};
function alibiBase(){

  const diff=Object.values(AL.marks).filter(v=>v==='d').length;
  app.innerHTML=`<div><h2>Alibi</h2><p class="lead">Two students are suspects. They say they were together all evening. They prepare their story outside, then the class questions them one at a time. If their answers are different, they are guilty!</p></div>
  <section class="panel"><div class="lab">The crime</div><p class="big-text">${esc(crime)}</p><div><button class="btn" id="newcrime">Another crime</button></div></section>
  <section class="panel"><div class="lab">Step 1 · Suspects prepare (5 min outside)</div><p>The class writes questions at the same time.</p><div class="row"><span class="timer" id="tm">5:00</span><button class="btn" id="t5">Start 5 min</button></div></section>
  <section class="panel"><div class="lab">Step 2 · Interview suspect 1, then suspect 2. Mark each answer.</div>
   ${a.questions.map((q,i)=>`<div class="vote"><span>${esc(q)}</span><button class="btn ${AL.marks[i]==='s'?'on':''}" data-s="${i}">Same</button><button class="btn ${AL.marks[i]==='d'?'on':''}" data-d="${i}">Different</button></div>`).join('')}
  </section>
  <div class="solution">${diff>=3?`${diff} different answers. GUILTY! The suspects are going to prison.`:`${diff} different answer${diff===1?'':'s'} so far. 3 or more = guilty.`}</div>
  <div class="row"><button class="btn" id="resetal">New round</button></div>`;
  app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='t5'){timer('tm',300);return}
    if(b.id==='newcrime')AL.crime=(AL.crime+1)%a.crimes.length;
    if(b.dataset.s)AL.marks[b.dataset.s]='s';
    if(b.dataset.d)AL.marks[b.dataset.d]='d';
    if(b.id==='resetal')AL={crime:(AL.crime+1)%a.crimes.length,stage:0,marks:{}};
    const y=window.scrollY;alibi();window.scrollTo(0,y)};
}

function home(cat){
  const list=cat?CATS.filter(c=>c[0]===cat):CATS;
  const n=GAMES.length-1;
  app.innerHTML=`${cat?'':`<div class="hero"><p class="lab">IF Academy · ${n} classroom games</p><h2 class="h-big">Pick a game for today’s class</h2>
  <p class="lead">Speaking, mystery, word, board and card games. The word, board and card games share one bank of ${WORDCOUNT.toLocaleString('en')} words: General English by level and topic, English File A1–C1, Cambridge Young Learners and exams, English for Teenagers and IELTS. Every game has rules in English and Russian.</p></div>`}
  ${list.map(([c,en,ru])=>{const gs_=GAMES.filter(g=>g[1]===c);return `<section class="gsec"><h3 class="gh">${en} · <span lang="ru">${ru}</span> <span class="ghn">${gs_.length}</span></h3><div class="grid">${gs_.map(([k,,t,tr,d,l,p,m])=>`<a class="tile gl" href="#${k}"><span class="gart">${ART[k]||''}</span><span class="row"><strong class="gt">${t}<small lang="ru">${tr}</small></strong><span class="chip">${l}</span></span><span>${d}</span><span class="meta">${p} · ${m}</span></a>`).join('')}</div></section>`}).join('')}`;
  app.onclick=null;
}
