:root[data-theme="dark"]{
  --navy:#0B1731; --navy2:#22386B; --ice:#18284A; --ice2:#243A66;
  --gold:#D2AE52; --gold2:#5E4C1E; --paper:#13213F; --bg:#0D1830;
  --ink:#E6ECF6; --muted:#A3B0C8; --line:#2A3C63;
  --ok:#6FD39F; --okbg:#133A2A; --no:#F08A80; --nobg:#40191A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}

/* masthead */
.mast{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.mast-in{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.mast svg{width:44px;height:52px;flex:none}
.mast .school{font-family:var(--serif);font-size:1.25rem;letter-spacing:.01em}
.mast .sub{color:#C9D6EA;font-size:.95rem}
.mast .grow{flex:1}
.mast select{background:transparent;border:1px solid #3A5285;border-radius:6px;padding:6px 8px;color:#fff}
.mast select option{color:#000}

/* layout */
.wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:24px;padding:22px 20px 60px}
nav.tests h2{font-size:1rem;color:var(--muted);font-family:var(--sans);font-weight:700;margin:4px 0 8px}
nav.tests ul{list-style:none;margin:0 0 18px;padding:0}
nav.tests li button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 10px;border-radius:0 6px 6px 0;display:flex;justify-content:space-between;gap:8px}
nav.tests li button:hover{background:var(--ice)}
nav.tests li button[aria-current="true"]{border-left-color:var(--gold);background:var(--paper);font-weight:700}
nav.tests li button .mini{color:var(--muted);font-size:.85rem;font-weight:400}
nav.tests .soon{color:var(--muted);font-size:.92rem;padding:5px 13px}
.mobile-pick{display:none}

main{min-width:0}
.head{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.head h1{font-size:2rem;color:var(--ink)}
.head .focus{color:var(--muted);margin:4px 0 14px}
.who{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.who label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.who input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:180px}
.mode{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.mode button{border:0;background:var(--paper);padding:8px 14px;font-size:.92rem}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}
.modehint{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:0}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 12px 9px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs .badge{font-weight:400;font-size:.82rem;margin-left:5px;color:var(--muted)}

.sec h2{font-size:1.5rem;margin-bottom:4px}
.part{font-family:var(--serif);font-size:1.08rem;margin:26px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.part:first-of-type{border-top:0;padding-top:0;margin-top:10px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:32px 1fr;gap:4px 8px}
.q .n{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:1.05rem;padding-top:1px}
.q .stem{margin-bottom:8px}
.q .spk{display:inline-block;font-weight:700;width:1.4em;color:var(--muted)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--muted);margin:0 3px;line-height:1.1}
.blank.filled{border-bottom-color:var(--gold);font-weight:700;padding:0 3px;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 12px;display:flex;gap:8px;align-items:baseline;text-align:left;min-height:40px}
.opt:hover:not(:disabled){border-color:var(--navy2)}
.opt .l{font-weight:700;color:var(--muted);font-size:.85rem}
.opt.sel{border-color:var(--navy2);background:var(--ice)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg);text-decoration:line-through;text-decoration-thickness:1px}
.opt.key{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt b.snd{color:var(--gold);font-weight:700}
.opt u.str{text-decoration:underline 2px;text-underline-offset:3px;font-weight:700}
.q .verdict{grid-column:2;font-size:.88rem;margin-top:6px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}

.reading{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.text{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 22px;font-family:var(--serif);line-height:1.65;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.text h3{font-size:1.25rem;margin-bottom:10px}
.text p{margin:0 0 12px}

.player{background:var(--navy);color:#fff;border-radius:10px;padding:16px 18px;margin:12px 0 18px}
.player .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.player button{border:1px solid #4A6399;background:#1C3161;color:#fff;border-radius:6px;padding:8px 14px;font-weight:700}
.player button.primary{background:var(--gold);border-color:var(--gold);color:#1a1405}
.player button:disabled{opacity:.45;cursor:not-allowed}
.player label{font-size:.85rem;color:#C9D6EA;display:flex;gap:6px;align-items:center}
.player select{background:#0B1731;color:#fff;border:1px solid #4A6399;border-radius:6px;padding:5px 6px;max-width:220px}
.player .status{font-size:.9rem;color:#C9D6EA;margin-top:10px}
.player .plays{margin-left:auto;font-size:.9rem}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;font-size:.88rem}
.script{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:16px}
.script p{margin:0 0 6px}
.script p.now{background:var(--gold2);border-radius:4px}
.script b{font-family:var(--serif)}

.bands{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:.92rem;margin:10px 0 18px}
.bands table{border-collapse:collapse;width:100%}
.bands td{padding:3px 8px 3px 0;vertical-align:top}
.bands td:first-child{font-weight:700;white-space:nowrap;color:var(--gold)}
.task{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.task h3{font-size:1.15rem}
.task .meta{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.task ul{margin:0 0 12px;padding-left:1.2em}
.task li{margin-bottom:4px}
.task .card{border-left:3px solid var(--gold);padding:6px 12px;background:var(--ice);border-radius:0 6px 6px 0;margin-bottom:10px;font-family:var(--serif)}
.timer{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.timer .clock{font-family:var(--serif);font-size:1.4rem;min-width:3.2em}
.timer button,.ghost{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px}
.rate{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rate .lab{font-size:.88rem;color:var(--muted);margin-right:4px}
.rate button{width:36px;height:36px;border:1.5px solid var(--line);background:var(--bg);border-radius:6px;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

.pager{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.pager button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;font-weight:700}

/* ledger */
aside.ledger{position:sticky;top:14px;align-self:start}
.card-l{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px}
.card-l .t{font-family:var(--serif);font-size:1.1rem}
.card-l .st{color:var(--muted);font-size:.88rem;margin-bottom:12px;min-height:1.3em}
.big{display:flex;align-items:baseline;gap:6px;font-family:var(--serif);margin:4px 0 2px}
.big .num{font-size:3.4rem;line-height:1;color:var(--ink)}
.big .of{font-size:1.2rem;color:var(--muted)}
.pct{font-size:.95rem;color:var(--muted);margin-bottom:14px}
.pct b{color:var(--ink)}
.rowl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.93rem;margin-bottom:9px}
.rowl .bar{grid-column:1/3;height:5px;background:var(--ice);border-radius:3px;overflow:hidden}
.rowl .bar i{display:block;height:100%;background:var(--navy2);transition:width .25s}
.rowl .v{font-variant-numeric:tabular-nums}
.ledger .actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ledger .actions button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:700}
.ledger .actions button.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.src{font-size:.78rem;color:var(--muted);margin-top:14px;line-height:1.4}
.mobile-total{display:none}

@media (max-width:1100px){
  .wrap{grid-template-columns:200px minmax(0,1fr)}
  aside.ledger{grid-column:1/3;position:static}
}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{grid-template-columns:minmax(0,1fr);padding:14px 12px 110px;gap:14px}
  nav.tests{display:none}
  .mobile-pick{display:block;margin-bottom:12px}
  .mobile-pick select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
  aside.ledger{grid-column:auto}
  .reading{grid-template-columns:minmax(0,1fr)}
  .text{position:static;max-height:none}
  .mode{margin-left:0}
  .head h1{font-size:1.6rem}
  .mobile-total{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;border-top:3px solid var(--gold);z-index:10}
  .mobile-total b{font-family:var(--serif);font-size:1.3rem}
  .mobile-total button{background:none;border:1px solid #4A6399;color:#fff;border-radius:6px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mast img.crest{width:47px;height:60px;flex:none;display:block}
/*CLASS-START*//* v2 additions */
.tview{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.tview button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tview button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tview .mini{font-weight:400;font-size:.85rem;opacity:.85}
nav.tests li.pair{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 4px 13px}
nav.tests li.pair .pname{font-size:.97rem}
nav.tests li.pair .pbtns{display:flex;gap:4px}
nav.tests li.pair .pbtns button{width:auto;min-width:38px;justify-content:center;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--paper);font-weight:700}
nav.tests li.pair .pbtns button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.syncnote{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:2px 0 0;padding:6px 10px;border-left:3px solid var(--gold);background:var(--ice);border-radius:0 6px 6px 0}
.syncnote.ok{border-left-color:var(--ok)}
.hint{color:var(--muted);font-size:.92em}
input.gap.wide{min-width:min(100%,24em)}
.task.prompt p{margin:0 0 8px}
.task.prompt p:last-child{margin:0}
.muted{color:var(--muted);font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:8px}
.filters label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:160px}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.rtable{width:100%;border-collapse:collapse;font-size:.93rem}
.rtable th{text-align:left;font-weight:700;color:var(--muted);font-size:.82rem;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
.rtable td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.rtable td.num,.rtable th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtable tbody tr{cursor:pointer}
.rtable tbody tr:hover{background:var(--ice)}
.rtable tbody tr.on{background:var(--ice);box-shadow:inset 3px 0 0 var(--gold)}
.rtable td.empty{color:var(--muted);text-align:center;padding:22px;cursor:default}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-left:6px;color:var(--muted);vertical-align:middle}
.tag.warn{border-color:var(--gold);color:var(--gold)}
.detail{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dhead h2{font-size:1.4rem}
.secscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 4px}
.secscores div{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;font-size:.9rem}
.wrview{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.6;max-height:320px;overflow:auto;margin-bottom:6px}
details.ans{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
details.ans summary{padding:10px 12px;cursor:pointer}
.atable{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--paper)}
.atable th{text-align:left;color:var(--muted);font-size:.78rem;padding:6px 10px;border-bottom:1px solid var(--line)}
.atable td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.atable tr.no td:nth-child(3){color:var(--no)}
.atable tr.ok td:nth-child(4){color:var(--ok)}
.codebox{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.codebox p{margin:0 0 8px;font-size:.9rem}
.codebox textarea,textarea.imp{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);word-break:break-all}
.codebox button{margin-top:8px}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-weight:700}
.go{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:8px;padding:9px 14px;font-weight:700}
.go:disabled{opacity:.6;cursor:default}
@media print{.mast,nav.tests,.mobile-pick,.who,.tabs,.pager,.mobile-total,.ledger .actions,.player,.linkbtn{display:none!important}.wrap{display:block}aside.ledger{position:static;margin-top:20px}body{background:#fff}}

.vswitch{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.vswitch button{flex:1;border:0;background:transparent;padding:11px 12px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.vswitch button+button{border-left:1px solid var(--line)}
.vswitch button[aria-pressed="true"]{background:var(--navy);color:#fff}
.vswitch .vsub{font-weight:400;font-size:.8rem;opacity:.8}
.share ol.steps{margin:6px 0 8px;padding-left:20px}.share ol.steps li{margin:4px 0}
@media (min-width:901px){nav.tests .tview{display:none}}
@media print{.vswitch{display:none!important}}
/*CLASS-END*/

<script>
/* IF Academy – "Send result to teacher" (result code IFR1) */
(function(){
"use strict";
var DASH="/me/";
function b64url(str){var bytes=new TextEncoder().encode(str),bin="";for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function newId(){var a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789",s="";var r=new Uint8Array(14);(window.crypto||{}).getRandomValues?crypto.getRandomValues(r):r.forEach(function(_,i){r[i]=Math.random()*256});for(var i=0;i<14;i++)s+=a[r[i]%a.length];return s}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var CSS=".ifr{margin-top:18px;border:2px solid var(--gold,#C29B40);border-radius:6px;padding:14px 16px;background:var(--gold-soft,#F3E7C9)}.ifr h3{margin:0 0 4px;font-size:20px}.ifr p{margin:0 0 10px;font-size:15px}.ifr textarea{width:100%;min-height:118px;font:inherit;font-size:14px;border:1px solid var(--line,#CBD6E4);border-radius:4px;padding:8px 10px;background:var(--paper,#fff);color:var(--ink,#15213A)}.ifr .ifr-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}.ifr button{border:0;border-radius:4px;padding:9px 16px;font:inherit;font-weight:700;background:var(--navy,#0F1E3D);color:#fff;cursor:pointer}.ifr button.l{background:transparent;color:var(--ink,#15213A);border:1px solid var(--navy2,#1B2F5A);font-weight:400}.ifr .ifr-m{font-size:14px}.ifr .ifr-w{color:var(--bad,#B23A3A);font-size:14px;margin-bottom:8px}@media print{.ifr{display:none}}";
function ensureCss(){if(document.getElementById("ifr-css"))return;var st=document.createElement("style");st.id="ifr-css";st.textContent=CSS;document.head.appendChild(st)}
/* p = {id, c, lv, t, v, n, cl, s:[[label,score|null,max]...], w:[texts]} */
function message(p){
  var tot=0,max=0,pend=[];p.s.forEach(function(x){max+=x[2];tot+=x[1]||0;if(x[1]==null)pend.push(x[0])});
  var o={id:p.id,c:p.c,lv:p.lv,t:p.t,v:p.v||"",n:p.n||"",cl:p.cl||"",d:new Date().toISOString(),s:p.s,w:(p.w||[]).filter(function(x){return x&&String(x).trim()})};
  var code="IFR1."+b64url(JSON.stringify(o));
  return "IF Academy test result\nStudent: "+(p.n||"(no name)")+(p.cl?" · "+p.cl:"")+"\nTest: "+p.lv+" · "+p.t+(p.v?" "+p.v:"")+"\nScore: "+tot+" / "+max+(pend.length?" ("+pend.join(" and ")+" not marked yet)":"")+"\n"+code+(p.x?"\n"+p.x:"");
}
function box(container,p){
  ensureCss();var old=container.querySelector(".ifr");if(old)old.remove();
  var msg=message(p);var d=document.createElement("div");d.className="ifr";
  d.innerHTML="<h3>Send this result to your teacher</h3>"+(p.n?"":"<div class='ifr-w'>Write your name at the top of the test first, so your teacher knows it’s you.</div>")+
    "<p>Tap <b>Share</b> and send it on WhatsApp or Telegram, or copy the message and paste it into a chat with your teacher.</p>"+
    "<textarea readonly aria-label='Result message'>"+esc(msg)+"</textarea><div class='ifr-row'>"+(navigator.share?"<button type='button' data-a='share'>Share</button>":"")+"<button type='button' class='"+(navigator.share?"l":"")+"' data-a='copy'>Copy message</button><span class='ifr-m' aria-live='polite'></span></div>";
  container.appendChild(d);

    if(b.dataset.a==="share"){navigator.share({title:"IF Academy test result",text:msg}).catch(function(){})}
    else{var ok=function(){m.textContent="Copied. Paste it into a chat with your teacher."};
      var fb=function(){ta.focus();ta.select();try{document.execCommand("copy");ok()}catch(e){m.textContent="Select the message and copy it."}};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(msg).then(ok,fb);else fb()}
  }});
}
window.IFR={box:box,newId:newId,message:message,DASH:DASH};
})();

</script>

TESTS.push({"id": "place", "kind": "place", "lv": "YLE", "title": "Placement Test", "focus": "Which level? Starters, Movers and Flyers grammar and words, from easy to harder. Use it to place a new child.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACACCACAAA", "q": [["This is my sister. _____ name is Aruzhan.", "Her", "His", "She"], ["I _____ got a red bike.", "am", "has", "have"], ["There _____ three cats in the garden.", "are", "is", "be"], ["Look! The boy _____ a kite.", "flying", "flies", "is flying"], ["My brother _____ swim. He is only two.", "isn't", "doesn't", "can't"], ["We _____ to the park yesterday.", "went", "goes", "go"], ["An elephant is _____ than a horse.", "biggest", "big", "bigger"], ["You _____ eat sweets every day. They are bad for your teeth.", "shouldn't", "don't", "aren't"], ["I have _____ been to London.", "never", "ever", "yet"], ["This is the girl _____ won the race.", "who", "which", "where"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CABBCCABAA", "q": [["A cow says \"moo\". It lives on a _____.", "beach", "shop", "farm"], ["You wear these on your feet.", "shoes", "gloves", "hats"], ["We eat soup with a _____.", "knife", "spoon", "plate"], ["I can see with my _____.", "ears", "eyes", "nose"], ["When you are ill, you go to the _____.", "farmer", "driver", "doctor"], ["It is very cold. Put on your _____.", "shorts", "sandals", "coat"], ["You can read books here.", "library", "kitchen", "garage"], ["A person who flies a plane is a _____.", "nurse", "pilot", "cook"], ["The Earth goes round the _____.", "sun", "moon", "star"], ["Glass, wood and plastic are _____.", "materials", "subjects", "jobs"]]}, "r": {"title": "A day at the zoo", "k": "BBBAC", "text": ["Hi! My name is Timur and I'm nine years old. Last Saturday I went to the zoo with my grandpa.", "First we saw the monkeys. They were funny and one monkey took my grandpa's hat! Then we watched the penguins. They swim very fast but they can't fly.", "We had lunch next to the lake. I had a cheese sandwich and an apple. After lunch it started to rain, so we went inside to see the snakes and the crocodiles.", "I bought a small toy lion at the shop. It was the best day of the holidays!"], "q": [["How old is Timur?", "seven", "nine", "ten"], ["What did the monkey take?", "a sandwich", "Grandpa's hat", "Timur's apple"], ["What can penguins do?", "fly", "swim fast", "climb trees"], ["Why did they go inside?", "It started to rain.", "It was lunchtime.", "They were cold."], ["What did Timur buy?", "a toy monkey", "a hat", "a toy lion"]]}, "l": {"setting": "You will hear Mrs Brown asking a girl, Dana, about her family and her week.", "k": "BBCCA", "script": [["Mrs Brown", "Hello, Dana. Tell me about your family."], ["Dana", "I have got one brother and two sisters. My brother is called Aslan. He is twelve."], ["Mrs Brown", "And what do you like doing after school?"], ["Dana", "I like playing badminton. I play it on Tuesdays and Thursdays."], ["Mrs Brown", "What did you do last weekend?"], ["Dana", "On Saturday I visited my aunt. She lives in a village near a big river."], ["Mrs Brown", "And what do you want to be in the future?"], ["Dana", "I want to be a vet, because I love animals."]], "q": [["How many sisters has Dana got?", "one", "two", "three"], ["How old is Aslan?", "ten", "twelve", "eleven"], ["When does Dana play badminton?", "Saturdays", "Mondays and Fridays", "Tuesdays and Thursdays"], ["Where does her aunt live?", "by the sea", "in a big city", "in a village"], ["What job does Dana want?", "vet", "doctor", "teacher"]]}, "s": {"focus": "Place the child: Starters questions first, then Movers, then Flyers. Stop when it becomes too hard.", "tasks": [{"name": "Starters questions", "mins": 2, "lead": "Ask simple questions. The child can answer with one word or a short phrase.", "prompts": ["What's your name? How old are you?", "What colour is your bag?", "Have you got a pet?", "Point to something blue in the room."]}, {"name": "Movers and Flyers questions", "mins": 3, "lead": "Ask for longer answers with reasons.", "prompts": ["What did you do last weekend?", "Tell me about your best friend.", "Which is better, summer or winter? Why?", "What will you do in the next holidays?"]}]}, "rw": 1});
TESTS.push({"id": "st1", "kind": "st", "lv": "Pre A1 Starters", "title": "Starters Test 1: Me and my family", "focus": "Numbers 1–20, colours, family, the body; be, have got, my / your / his / her, how many.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CCBBACCCCC", "q": [["I _____ seven.", "are", "is", "am"], ["She _____ my mum.", "am", "are", "is"], ["They _____ my brothers.", "am", "are", "is"], ["I _____ got a sister.", "is", "have", "has"], ["He _____ got a dog.", "has", "have", "is"], ["This is my dad. _____ name is Bolat.", "Her", "He", "His"], ["_____ old are you?", "What", "Who", "How"], ["How many _____ have you got?", "cousin", "cousin's", "cousins"], ["_____ is your favourite colour?", "Who", "How", "What"], ["A: Is she your grandma?\nB: Yes, she _____.", "are", "am", "is"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BABACCBBBB", "q": [["three + four = _____", "six", "seven", "eight"], ["ten + ten = _____", "twenty", "twelve", "eleven"], ["Your mum and dad are your _____.", "friends", "parents", "cousins"], ["Your dad's mum is your _____.", "grandmother", "aunt", "sister"], ["The sky is _____.", "pink", "brown", "blue"], ["Bananas are _____.", "purple", "black", "yellow"], ["You hear with your _____.", "hands", "ears", "eyes"], ["You have got ten _____ on your hands.", "feet", "fingers", "arms"], ["You eat with your _____.", "nose", "mouth", "hair"], ["A baby boy in your family is your little _____.", "mum", "brother", "sister"]]}, "r": {"title": "My family", "k": "BBBBB", "text": ["Hello! I'm Mira. I'm eight. I live in a small house with my mum, my dad and my baby brother, Ali.", "My grandma lives with us too. She has got long white hair and blue eyes. She is very kind.", "I have got a cat. Her name is Snow and she is white and grey. Ali loves Snow!"], "q": [["How old is Mira?", "seven", "eight", "nine"], ["Who is Ali?", "her cat", "her brother", "her dad"], ["What colour is grandma's hair?", "grey", "white", "brown"], ["What colour are grandma's eyes?", "brown", "blue", "green"], ["What is the cat's name?", "Ali", "Snow", "Mira"]]}, "l": {"setting": "You will hear a boy, Sam, talking to his teacher about a family photo.", "k": "ABACA", "script": [["Teacher", "Who is this in your photo, Sam?"], ["Sam", "That is my sister, Lucy. She is ten."], ["Teacher", "And who is the man with the big hat?"], ["Sam", "That's my grandpa. He's very funny."], ["Teacher", "Is this your dog?"], ["Sam", "Yes! His name is Max. He is brown and he has got a long tail."], ["Teacher", "How many people are in your family?"], ["Sam", "Five. My mum, my dad, Lucy, the baby and me."]], "q": [["How old is Lucy?", "ten", "eight", "twelve"], ["Who has got a big hat?", "dad", "grandpa", "Sam"], ["What colour is Max?", "brown", "white", "black"], ["What is the dog's name?", "Sam", "Lucy", "Max"], ["How many people are in Sam's family?", "five", "four", "six"]]}, "s": {"focus": "Numbers, colours, family and the body.", "tasks": [{"name": "About me", "mins": 2, "lead": "Ask the questions. One word or short answers are fine.", "prompts": ["What's your name? How do you spell it?", "How old are you?", "Have you got a brother or a sister?", "What's your favourite colour?"]}, {"name": "Point and say", "mins": 2, "lead": "Use a picture of a family or of the classroom.", "prompts": ["Point to the mum. What colour is her dress?", "How many people can you see?", "Point to your eyes / nose / hands.", "Count to twenty."]}]}, "rw": 1});
TESTS.push({"id": "st2", "kind": "st", "lv": "Pre A1 Starters", "title": "Starters Test 2: Animals", "focus": "Animals, the body and face; can / can't, this / these, plurals, there is / there are.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "AACCACCCAB", "q": [["A fish _____ swim.", "can", "cans", "can to"], ["A snake _____ walk. It hasn't got legs.", "can't", "isn't", "hasn't"], ["_____ a duck fly?  Yes, it can.", "Does", "Is", "Can"], ["_____ is a giraffe.", "Those", "These", "This"], ["_____ are my mice.", "These", "It", "This"], ["I can see three _____.", "a sheep", "sheeps", "sheep"], ["There _____ a horse on the farm.", "are", "am", "is"], ["There _____ two cows.", "is", "be", "are"], ["The bird is _____ the tree.", "in", "of", "at"], ["Look at the monkey! It _____ eating a banana.", "are", "is", "can"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CCBCACACBC", "q": [["This animal is very big and grey. It has got a long nose.", "frog", "mouse", "elephant"], ["This animal says \"woof\".", "cow", "cat", "dog"], ["This animal lives in water and can swim.", "goat", "fish", "horse"], ["This animal has got a very long neck.", "lizard", "spider", "giraffe"], ["This animal is green and can jump.", "frog", "bear", "sheep"], ["Birds have got two _____.", "arms", "tails", "wings"], ["A crocodile has got a big _____ with lots of teeth.", "mouth", "nose", "ear"], ["Ducks, chickens and parrots are _____.", "fish", "snakes", "birds"], ["You can ride this animal.", "mouse", "horse", "chicken"], ["This small animal likes cheese.", "hippo", "tiger", "mouse"]]}, "r": {"title": "At the farm", "k": "BAABA", "text": ["Today Ben is at his uncle's farm. There are lots of animals here.", "There are four cows and ten sheep. There is one big brown horse. Its name is Star.", "Ben likes the ducks. They are swimming in the water. He doesn't like the goat. It eats Ben's hat!"], "q": [["Where is Ben?", "at school", "at his uncle's farm", "at the zoo"], ["How many cows are there?", "four", "ten", "one"], ["What is the horse's name?", "Star", "Brown", "Ben"], ["What are the ducks doing?", "eating", "swimming", "sleeping"], ["What does the goat eat?", "Ben's hat", "grass", "a banana"]]}, "l": {"setting": "You will hear Kate and her dad at the zoo.", "k": "CBBAB", "script": [["Kate", "Dad, look at the monkeys! They are so funny."], ["Dad", "Yes. How many monkeys can you see?"], ["Kate", "One, two, three... six monkeys! And there is a baby monkey."], ["Dad", "Can you see the hippo?"], ["Kate", "Yes, it's in the water. Hippos can't swim very well, can they?"], ["Dad", "No, they walk under the water. Now, what animal do you want to see next?"], ["Kate", "The tigers! I love tigers. They are orange and black."], ["Dad", "OK. And then let's have an ice cream."]], "q": [["How many monkeys can Kate see?", "three", "two", "six"], ["Where is the hippo?", "under a tree", "in the water", "in a house"], ["Which animal does Kate love?", "hippos", "tigers", "monkeys"], ["What colour are the tigers?", "orange and black", "brown and white", "grey"], ["What will they have after the tigers?", "some juice", "an ice cream", "a sandwich"]]}, "s": {"focus": "Animals and can / can't.", "tasks": [{"name": "Animal questions", "mins": 2, "lead": "Ask the questions. Accept short answers.", "prompts": ["What's your favourite animal?", "Have you got a pet? What is it?", "Can a fish fly?", "What can a monkey do?"]}, {"name": "Picture talk", "mins": 2, "lead": "Use a picture of a zoo or farm.", "prompts": ["Point to the elephant.", "How many birds can you see?", "What colour is the snake?", "What is the horse doing?"]}]}, "rw": 1});
TESTS.push({"id": "st3", "kind": "st", "lv": "Pre A1 Starters", "title": "Starters Test 3: My home and school", "focus": "Rooms, furniture, the classroom, toys; prepositions in / on / under / next to, where, whose, imperatives.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ABBCCACABB", "q": [["The ball is _____ the bed.", "under", "from", "at"], ["_____ is my pencil?  It's on the desk.", "What", "Where", "Who"], ["_____ bag is this?  It's Tom's.", "Where", "Whose", "Who"], ["This is _____ book.", "Annas", "Anna", "Anna's"], ["_____ the door, please.", "Opening", "Opens", "Open"], ["Please _____ talk in the library.", "don't", "doesn't", "not"], ["There are two _____ in my bedroom.", "window's", "window", "windows"], ["The cat is sitting _____ to the sofa.", "next", "between", "near of"], ["I _____ like spiders.", "not", "don't", "doesn't"], ["_____ you like your new school?  Yes, I do.", "Is", "Do", "Are"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "ACABBABBBB", "q": [["You sleep in this room.", "bedroom", "bathroom", "kitchen"], ["You cook in this room.", "garden", "bedroom", "kitchen"], ["You sit on this.", "chair", "clock", "wall"], ["You can look at yourself in this.", "cupboard", "mirror", "mat"], ["You write with this.", "ruler", "pen", "rubber"], ["You draw a straight line with this.", "ruler", "crayon", "eraser"], ["The teacher writes on the _____.", "door", "board", "floor"], ["You put your books in your _____.", "cup", "bag", "shoe"], ["This toy has two wheels. You ride it.", "doll", "bike", "kite"], ["You play football with a _____.", "robot", "ball", "balloon"]]}, "r": {"title": "Lily's bedroom", "k": "BACBC", "text": ["Lily's bedroom is small but she loves it. There is a bed, a desk and a big cupboard.", "Her computer is on the desk. Her toys are in a box under the bed. She has got a robot, a doll and lots of balls.", "On the wall there is a picture of a beach. Lily painted it at school!"], "q": [["Is Lily's bedroom big?", "Yes, it's big.", "No, it's small.", "It's very big."], ["Where is the computer?", "on the desk", "under the bed", "in the cupboard"], ["Where are her toys?", "on the desk", "in the kitchen", "in a box under the bed"], ["What is in the picture?", "a robot", "a beach", "a school"], ["Who painted the picture?", "Lily's mum", "her teacher", "Lily"]]}, "l": {"setting": "You will hear a teacher and a boy, Nick, in the classroom.", "k": "AAACB", "script": [["Teacher", "Nick, where is your pencil case?"], ["Nick", "It's in my bag, Miss. Oh no, it isn't there!"], ["Teacher", "Look under your chair."], ["Nick", "Yes! It's here. Thank you."], ["Teacher", "Now take out a red crayon and a ruler."], ["Nick", "I haven't got a red crayon. Can I use a pink one?"], ["Teacher", "Yes, that's fine. Now draw a big house with three windows."], ["Nick", "Can I draw a tree next to the house?"], ["Teacher", "Yes, good idea."]], "q": [["Where is the pencil case?", "under the chair", "on the desk", "in his bag"], ["What colour crayon does Nick use?", "pink", "blue", "red"], ["What does Nick draw?", "a house", "a car", "a cat"], ["How many windows does the house have?", "two", "four", "three"], ["What does Nick want to draw next to the house?", "a car", "a tree", "a dog"]]}, "s": {"focus": "Home, classroom and where things are.", "tasks": [{"name": "Where is it?", "mins": 2, "lead": "Use a picture of a bedroom or classroom.", "prompts": ["Where's the cat?", "What's on the table?", "How many chairs can you see?", "What's under the bed?"]}, {"name": "About your home", "mins": 2, "lead": "Ask the questions. Short answers are fine.", "prompts": ["How many rooms are in your home?", "What's in your bedroom?", "What's your favourite toy?", "What's your teacher's name?"]}]}, "rw": 1});
TESTS.push({"id": "st4", "kind": "st", "lv": "Pre A1 Starters", "title": "Starters Test 4: Food, clothes and fun", "focus": "Food and drink, clothes, sports and actions; like / don't like, present continuous, some, let's.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "AACACCCCAA", "q": [["I _____ apples. They are my favourite!", "like", "likes", "liking"], ["My brother _____ like fish.", "doesn't", "don't", "isn't"], ["_____ you like carrots?", "Are", "Does", "Do"], ["She _____ wearing a red dress.", "is", "are", "has"], ["What _____ they doing?  They are playing tennis.", "do", "is", "are"], ["Can I have _____ water, please?", "a", "an", "some"], ["I'd like _____ egg, please.", "a", "some", "an"], ["_____ play football!  Yes, OK!", "Let", "Lets", "Let's"], ["The children are _____ in the park.", "running", "run", "runs"], ["A: Are you hungry?\nB: No, I'm _____.", "not", "no", "don't"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "ACBCCBBABA", "q": [["A drink that comes from cows.", "milk", "lemonade", "juice"], ["This fruit is long and yellow.", "grape", "orange", "banana"], ["You eat this for breakfast with milk.", "chips", "cereal", "burger"], ["Orange vegetable. Rabbits like it.", "potato", "tomato", "carrot"], ["You wear this on your head.", "sock", "skirt", "hat"], ["You wear these on your legs.", "shirts", "trousers", "gloves"], ["In winter you wear a warm _____.", "T-shirt", "jacket", "shorts"], ["You play this sport with a racket and a ball.", "tennis", "football", "swimming"], ["You do this in the water.", "climb", "swim", "kick"], ["You do this with a ball and your foot.", "kick", "catch", "throw"]]}, "r": {"title": "A picnic in the park", "k": "BAAAA", "text": ["It's Sunday. Emma and her family are having a picnic in the park.", "Mum has got sandwiches, apples and some lemonade. Emma doesn't like lemonade, so she has orange juice.", "After lunch, Emma and her dad play badminton. Her little brother is flying a kite. It's a yellow kite with a long tail.", "Emma is wearing her new blue T-shirt and white shoes."], "q": [["What day is it?", "Saturday", "Sunday", "Friday"], ["What does Emma drink?", "orange juice", "milk", "lemonade"], ["What does Emma play?", "badminton", "football", "tennis"], ["What colour is the kite?", "yellow", "blue", "white"], ["What colour is Emma's T-shirt?", "blue", "yellow", "white"]]}, "l": {"setting": "You will hear a boy, Leo, talking to a waiter in a café.", "k": "CBCBC", "script": [["Waiter", "Hello! What would you like?"], ["Leo", "I'd like a burger and some chips, please."], ["Waiter", "And to drink?"], ["Leo", "Some apple juice, please. No, wait. Some milk, please."], ["Waiter", "Would you like an ice cream too?"], ["Leo", "Yes, please. A chocolate ice cream."], ["Waiter", "Here you are. That's eight pounds."], ["Leo", "Thank you. Oh, I like your hat!"]], "q": [["What food does Leo want?", "a sandwich", "fish and rice", "a burger and chips"], ["What does Leo drink?", "apple juice", "milk", "water"], ["What ice cream does Leo want?", "lemon", "banana", "chocolate"], ["How much is it?", "six pounds", "eight pounds", "nine pounds"], ["What does Leo like?", "the café", "the waiter's shoes", "the waiter's hat"]]}, "s": {"focus": "Food, clothes and what people are doing.", "tasks": [{"name": "Picture talk", "mins": 2, "lead": "Use a picture of a park or a party.", "prompts": ["What is the girl wearing?", "What is the boy doing?", "What food can you see?", "How many children are playing?"]}, {"name": "About you", "mins": 2, "lead": "Ask the questions. Short answers are fine.", "prompts": ["What's your favourite food?", "What don't you like eating?", "What are you wearing today?", "What sport can you play?"]}]}, "rw": 1});
TESTS.push({"id": "stx", "kind": "st", "lv": "Pre A1 Starters", "title": "Starters Practice Exam", "focus": "All Starters topics: family, animals, home, school, food, clothes, toys, sport and actions.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CBCCBBCACB", "q": [["My friends _____ nine years old.", "is", "am", "are"], ["_____ your cat got a long tail?", "Is", "Has", "Have"], ["He can _____ a bike.", "rides", "riding", "ride"], ["There _____ some books on the table.", "is", "am", "are"], ["_____ is your teacher?  Mr Smith.", "What", "Who", "Where"], ["_____ shoes are these?  They're Sara's.", "What", "Whose", "Who"], ["Look! The baby _____ sleeping.", "are", "am", "is"], ["I like _____ to music.", "listening", "listen", "listens"], ["These are my new _____.", "glass", "glass's", "glasses"], ["Please _____ down and open your books.", "sits", "sit", "sitting"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BBCACAAACA", "q": [["You sleep in this.", "bath", "bed", "bookcase"], ["Your mum's sister is your _____.", "cousin", "aunt", "grandma"], ["This animal is black and white and lives in cold places. It can swim.", "zebra", "cow", "penguin"], ["You wear these on your hands when it's cold.", "gloves", "socks", "boots"], ["It's round and red. You can eat it.", "onion", "potato", "tomato"], ["A person who teaches children.", "teacher", "pilot", "doctor"], ["You can put flowers in the _____.", "garden", "computer", "car"], ["This toy can fly in the sky when it's windy.", "kite", "robot", "train"], ["You can see stars at _____.", "lunchtime", "breakfast", "night"], ["Ice cream is very _____.", "cold", "hot", "old"]]}, "r": {"title": "My best friend", "k": "CBBAC", "text": ["My best friend is called Zara. She is in my class at school. She has got black hair and big brown eyes.", "Zara is very good at drawing. She draws animals: horses, cats and birds. Her drawings are beautiful!", "After school we often play in the park. We play hide and seek and we ride our bikes. On Saturdays we go swimming.", "Zara has got a little brother. His name is Omar and he is four. He likes playing with cars."], "q": [["Where does Zara go to school?", "at home", "in a different town", "in the same class"], ["What is Zara good at?", "singing", "drawing", "swimming"], ["Where do they play after school?", "at Zara's home", "in the park", "at the beach"], ["When do they go swimming?", "on Saturdays", "on Sundays", "after school"], ["How old is Omar?", "six", "five", "four"]]}, "l": {"setting": "You will hear a girl, Hana, and her grandpa in the living room.", "k": "ACCBA", "script": [["Grandpa", "Hana, can you find my glasses? I can't read my book."], ["Hana", "Are they on the table, Grandpa?"], ["Grandpa", "No, they aren't."], ["Hana", "Look! They're under the newspaper on the sofa."], ["Grandpa", "Thank you! Now, what are you doing?"], ["Hana", "I'm doing my homework. It's about animals."], ["Grandpa", "What's your favourite animal?"], ["Hana", "The polar bear. It's white and it lives in very cold places."], ["Grandpa", "Shall we have some tea and cake?"], ["Hana", "Yes, please! Lemon cake!"]], "q": [["What is Grandpa looking for?", "his glasses", "the newspaper", "his book"], ["Where are they?", "in the kitchen", "on the table", "under the newspaper"], ["What is Hana's homework about?", "food", "family", "animals"], ["What is Hana's favourite animal?", "the cat", "the polar bear", "the penguin"], ["What cake do they have?", "lemon cake", "banana cake", "chocolate cake"]]}, "s": {"focus": "Starters speaking: picture, objects and personal questions.", "tasks": [{"name": "Find the difference", "mins": 2, "lead": "Show a scene picture. Ask the child to point and answer.", "prompts": ["Where's the dog?", "What colour is the car?", "How many ducks are there?", "What is the man doing?"]}, {"name": "Personal questions", "mins": 2, "lead": "Ask the questions. Short answers are fine.", "prompts": ["How old are you?", "Who is TESTS.push({"id": "mv1", "kind": "mv", "lv": "A1 Movers", "title": "Movers Test 1: Daily life and family", "focus": "Daily routines, family, days and times; present simple, adverbs of frequency, telling the time, comparatives.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACBBCACBAC", "q": [["My sister _____ to school by bus.", "goes", "go", "going"], ["I _____ get up at seven o'clock.", "never always", "am always", "always"], ["He is _____ late for school.", "don't", "never", "not never"], ["What time _____ you have lunch?", "are", "do", "does"], ["My cousin is _____ than me.", "tallest", "more tall", "taller"], ["Our flat is _____ than your house.", "smaller", "more small", "small"], ["_____ often do you play football?", "What", "When", "How"], ["My dad _____ coffee in the morning.", "drink", "drinks", "drinking"], ["We have English _____ Monday.", "on", "at", "in"], ["I go to bed _____ nine o'clock.", "in", "on", "at"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BACCABBBCC", "q": [["Your aunt's son is your _____.", "grandson", "cousin", "uncle"], ["Your mum's dad is your _____.", "grandfather", "nephew", "uncle"], ["The day after Wednesday is _____.", "Tuesday", "Friday", "Thursday"], ["You do this with a toothbrush.", "wash your hair", "get dressed", "brush your teeth"], ["Saturday and Sunday are the _____.", "weekend", "morning", "week"], ["The first meal of the day is _____.", "dinner", "breakfast", "lunch"], ["60 minutes = one _____.", "day", "hour", "week"], ["The opposite of \"early\" is _____.", "slow", "late", "quiet"], ["People who live next to you are your _____.", "parents", "teachers", "neighbours"], ["You go here to buy food.", "library", "hospital", "supermarket"]]}, "r": {"title": "Peter's day", "k": "ACAAC", "text": ["Peter is ten and he lives in a flat in the city centre. He usually gets up at half past seven.", "He has breakfast with his dad. They always eat eggs and toast. Then Peter walks to school with his friend, Charlie.", "School finishes at three o'clock. On Mondays and Wednesdays Peter has guitar lessons. On Fridays he plays basketball. He is taller than all his friends, so he is very good at it!", "In the evening he does his homework and sometimes watches a film with his sister. He goes to bed at nine."], "q": [["What time does Peter get up?", "half past seven", "half past eight", "seven o'clock"], ["How does Peter go to school?", "by bus", "by car", "He walks."], ["When does Peter have guitar lessons?", "Mondays and Wednesdays", "Fridays", "every day"], ["Why is Peter good at basketball?", "He is tall.", "He practises every day.", "His dad is a teacher."], ["Who does Peter sometimes watch films with?", "Charlie", "his dad", "his sister"]]}, "l": {"setting": "You will hear a girl, Vicky, talking to her friend, Jack, about her week.", "k": "AABAA", "script": [["Jack", "Vicky, do you want to come to the cinema on Tuesday?"], ["Vicky", "Sorry, I can't. I have a swimming lesson on Tuesdays."], ["Jack", "What about Wednesday?"], ["Vicky", "On Wednesday I visit my grandma. She lives near the river. I always help her in the garden."], ["Jack", "Thursday, then?"], ["Vicky", "Thursday is good! What time does the film start?"], ["Jack", "At a quarter past five."], ["Vicky", "Great. My brother can come too. He's older than me, he's fourteen."]], "q": [["When does Vicky have swimming lessons?", "Tuesdays", "Thursdays", "Wednesdays"], ["Where does Vicky's grandma live?", "near the river", "in the city", "next to the school"], ["What does Vicky do at her grandma's?", "cooks dinner", "helps in the garden", "reads books"], ["What time does the film start?", "quarter past five", "five o'clock", "half past five"], ["How old is Vicky's brother?", "fourteen", "thirteen", "twelve"]]}, "s": {"focus": "Daily routines, family and times.", "tasks": [{"name": "Tell me about your day", "mins": 2, "lead": "The child answers in sentences.", "prompts": ["What time do you get up?", "How do you go to school?", "What do you do after school?", "What do you do at the weekend?"]}, {"name": "Picture story", "mins": 3, "lead": "Show 4 pictures of a child's day. The child tells the story.", "prompts": ["Look at the first picture. What time is it? What is the boy doing?", "What happens next?", "And then?", "What does he do in the evening?"]}]}, "rw": 1});
TESTS.push({"id": "mv2", "kind": "mv", "lv": "A1 Movers", "title": "Movers Test 2: Health and weather", "focus": "Health and the body, weather; past simple of be, must / have to, should, what's the matter.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CCBCCACBBC", "q": [["Yesterday I _____ ill.", "were", "am", "was"], ["The children _____ at school last Friday.", "didn't", "wasn't", "weren't"], ["What's the _____ ? I've got a headache.", "problem of", "matter", "wrong"], ["You _____ go to the doctor.", "must to", "musts", "must"], ["I _____ to take this medicine every day.", "has", "must", "have"], ["_____ it sunny yesterday?", "Was", "Did", "Were"], ["It _____ a lot last night.", "rains", "rain", "rained"], ["You _____ eat lots of sweets.", "don't must", "mustn't", "not must"], ["She has got a _____ . She can't talk.", "throat sore", "sore throat", "sore throats"], ["It's _____ today than yesterday.", "more cold", "cold", "colder"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "ABBBCCBCCA", "q": [["When you have a high temperature, you feel _____.", "hot", "hungry", "happy"], ["Your tooth hurts. You have got _____.", "a cough", "toothache", "a cold"], ["This person works in a hospital and helps the doctor.", "clown", "nurse", "farmer"], ["Water that falls from the sky.", "cloud", "rain", "wind"], ["White and cold. You can make a snowman with it.", "rainbow", "sun", "snow"], ["After the rain you can sometimes see a _____ in the sky.", "star", "moon", "rainbow"], ["It's _____ today. Hold your hat!", "sunny", "windy", "hot"], ["Your _____ is between your head and your body.", "back", "knee", "neck"], ["You can have a cold and a _____.", "cup", "cook", "cough"], ["A word for \"very bad weather with lots of wind and rain\".", "storm", "sky", "weather"]]}, "r": {"title": "A bad week", "k": "CAABB", "text": ["Last Monday Jane woke up and her head was very hot. Her mum said, \"You've got a temperature. You must stay in bed.\"", "The doctor came at ten o'clock. \"You've got a bad cold,\" he said. \"Drink lots of water and take this medicine.\"", "On Wednesday Jane felt better, but she was very bored. Outside it was windy and cloudy, so she read three books.", "On Friday the sun was out and Jane went back to school. Her friends were very happy to see her."], "q": [["Why did Jane's mum say she must stay in bed?", "It was Sunday.", "It was raining.", "She had a temperature."], ["What time did the doctor come?", "ten o'clock", "eleven o'clock", "nine o'clock"], ["What did the doctor say Jane should drink?", "water", "juice", "milk"], ["What was the weather like on Wednesday?", "snowy", "windy and cloudy", "sunny"], ["When did Jane go back to school?", "on Wednesday", "on Friday", "on Thursday"]]}, "l": {"setting": "You will hear a boy, Tom, talking to the school nurse.", "k": "ACABA", "script": [["Nurse", "Hello, Tom. What's the matter?"], ["Tom", "My leg hurts. I fell over in the playground."], ["Nurse", "Let me see. Oh, it's your knee. What were you doing?"], ["Tom", "I was playing football with my friends. It was very wet after the rain."], ["Nurse", "OK. You must sit down for ten minutes. Do you want some water?"], ["Tom", "Yes, please. Can I play again after lunch?"], ["Nurse", "No, you mustn't play today. You can play tomorrow."], ["Tom", "OK. Can I phone my mum?"]], "q": [["What's the matter with Tom?", "His knee hurts.", "He has a cold.", "He has a headache."], ["Where did Tom fall over?", "at home", "in the classroom", "in the playground"], ["Why did he fall?", "It was wet.", "It was windy.", "It was dark."], ["How long must Tom sit down?", "five minutes", "ten minutes", "an hour"], ["When can Tom play football again?", "tomorrow", "next week", "after lunch"]]}, "s": {"focus": "Health, weather and the past of be.", "tasks": [{"name": "Questions", "mins": 2, "lead": "The child answers in short sentences.", "prompts": ["What's the weather like today?", "What was the weather like yesterday?", "What do you do when you have a cold?", "What's your favourite season? Why?"]}, {"name": "Picture story", "mins": 3, "lead": "Show 4 pictures: a child gets wet, catches a cold, sees a doctor, feels better.", "prompts": ["What was the weather like in the first picture?", "What's the matter with the boy?", "Who came to help?", "How does he feel now?"]}]}, "rw": 1});
TESTS.push({"id": "mv3", "kind": "mv", "lv": "A1 Movers", "title": "Movers Test 3: Town and transport", "focus": "Places in town, transport, directions; past simple regular and irregular, prepositions of place, there was / were.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BCCBBCBCAA", "q": [["We _____ to the market last Saturday.", "go", "went", "goed"], ["I _____ a new bike yesterday.", "buyed", "buy", "bought"], ["_____ you see the film last night?", "Were", "Do", "Did"], ["She _____ like the museum. It was boring.", "doesn't", "didn't", "wasn't"], ["There _____ a lot of people at the bus station.", "are", "were", "was"], ["The bank is _____ the café and the cinema.", "behind of", "next", "between"], ["Turn left and go _____ the bridge.", "on", "over", "at"], ["The car park is _____ the supermarket.", "behind to", "back", "behind"], ["We _____ dinner at a restaurant on Friday.", "had", "have", "haved"], ["How did you get here?  We came _____ train.", "by", "on", "with"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BCABBBABCB", "q": [["You go here when you are very ill.", "market", "hospital", "park"], ["You can see old and interesting things here.", "airport", "swimming pool", "museum"], ["You go here to catch a plane.", "airport", "bus station", "library"], ["You can buy fruit and vegetables outside here.", "cinema", "market", "bank"], ["It has two wheels and an engine.", "bus", "motorbike", "ship"], ["You go under the city in this train.", "helicopter", "underground", "taxi"], ["A big boat.", "ship", "lorry", "tram"], ["You cross the river on this.", "road sign", "bridge", "roof"], ["The person who drives a bus.", "pilot", "waiter", "driver"], ["The opposite of \"left\" is _____.", "straight", "right", "wrong"]]}, "r": {"title": "A trip to the city", "k": "CABBB", "text": ["Last Sunday Daniel and his family went to the city. They took the train because it was faster than the car.", "First they visited the museum. Daniel loved the dinosaur room. There was a very big skeleton of a dinosaur!", "At one o'clock they had lunch in a café next to the river. Daniel had pasta and his sister had a pizza.", "After lunch they went to the big park and took a boat on the lake. They went home by taxi because they were very tired."], "q": [["How did they go to the city?", "by car", "by bus", "by train"], ["What did Daniel like in the museum?", "the dinosaur room", "the shop", "the paintings"], ["Where was the café?", "in the museum", "next to the river", "in the park"], ["What did they do in the park?", "played football", "took a boat on the lake", "had a picnic"], ["Why did they go home by taxi?", "There were no trains.", "They were tired.", "It was raining."]]}, "l": {"setting": "You will hear a girl, Sophie, asking a man for directions.", "k": "BBAAA", "script": [["Sophie", "Excuse me. Where is the library, please?"], ["Man", "Go straight on and turn right at the bank."], ["Sophie", "Right at the bank. OK."], ["Man", "Then go past the swimming pool. The library is opposite the bus station."], ["Sophie", "Is it far?"], ["Man", "No, it's about five minutes. Are you going there by bike?"], ["Sophie", "No, I'm walking. I want to get a book about pirates for my brother."], ["Man", "Good idea. The library closes at six o'clock today."]], "q": [["Where does Sophie want to go?", "the bank", "the library", "the bus station"], ["Where must she turn right?", "at the swimming pool", "at the bank", "at the café"], ["What is opposite the library?", "the bus station", "the bank", "the park"], ["How is Sophie going there?", "She is walking.", "by bike", "by bus"], ["What time does the library close?", "six o'clock", "seven o'clock", "five o'clock"]]}, "s": {"focus": "Town, transport and past simple.", "tasks": [{"name": "Questions", "mins": 2, "lead": "The child answers in sentences.", "prompts": ["How do you come to school?", "Where did you go last weekend?", "What is there in your town?", "Which is better, a bus or a bike? Why?"]}, {"name": "Picture differences", "mins": 3, "lead": "Show two similar town pictures. The child finds differences.", "prompts": ["In my picture there is a bus. What is in your picture?", "Where is the man in your picture?", "How many cars are there?", "What is next to the bank?"]}]}, "rw": 1});
TESTS.push({"id": "mv4", "kind": "mv", "lv": "A1 Movers", "title": "Movers Test 4: Animals, sports and free time", "focus": "Wild animals, sports and hobbies; superlatives, like / love + -ing, want to, could, adverbs.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BCCBCCBCCB", "q": [["The cheetah is the _____ animal in the world.", "faster", "fastest", "most fast"], ["This is the _____ book in the library.", "goodest", "better", "best"], ["I love _____ in the sea.", "swim", "swims", "swimming"], ["I want _____ a vet.", "being", "to be", "be"], ["When I was five, I _____ ride a bike.", "can", "coulded", "could"], ["My brother _____ swim when he was three.", "can't", "didn't could", "couldn't"], ["She sings very _____.", "nice", "well", "good"], ["He runs very _____.", "quick", "quicker", "quickly"], ["The whale is the _____ animal in the sea.", "most big", "bigest", "biggest"], ["What do you like doing at the weekend?  I like _____ my friends.", "visit", "visiting", "to visiting"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CACACACBBA", "q": [["This animal lives in the jungle and has a very long tail. It loves bananas.", "whale", "bat", "monkey"], ["This big animal lives in the sea. It isn't a fish.", "whale", "shark", "dolphin"], ["This animal sleeps in the day and flies at night.", "lion", "parrot", "bat"], ["A big cat with orange and black lines.", "tiger", "lion", "panda"], ["You need skates for this sport.", "sailing", "climbing", "skating"], ["You do this sport on a horse.", "riding", "skiing", "running"], ["You need a boat and wind for this.", "surfing", "fishing", "sailing"], ["You can take photos with a _____.", "kite", "camera", "map"], ["A hobby: you look after plants.", "dancing", "gardening", "shopping"], ["A team sport with a big orange ball and a basket.", "basketball", "golf", "hockey"]]}, "r": {"title": "The best weekend", "k": "CCBAC", "text": ["Last weekend was the best weekend of the year for Sam. On Saturday he went to the zoo with his class.", "They saw lots of animals. The kangaroos were the funniest. They jumped very high! Sam's favourite animal was the panda. It was eating bamboo and it looked very happy.", "On Sunday Sam played in a football match. His team won three–one and Sam scored the second goal.", "In the evening he was very tired, but he wanted to draw a picture of the panda before he went to bed."], "q": [["Who did Sam go to the zoo with?", "his football team", "his family", "his class"], ["Which animals were the funniest?", "the pandas", "the monkeys", "the kangaroos"], ["What was the panda doing?", "jumping", "eating bamboo", "sleeping"], ["What did Sam do on Sunday?", "played in a football match", "went to the zoo", "drew pictures all day"], ["Which goal did Sam score?", "the first goal", "the third goal", "the second goal"]]}, "l": {"setting": "You will hear two friends, Mia and Ben, talking about hobbies.", "k": "CACAB", "script": [["Mia", "Ben, what do you do on Saturday mornings?"], ["Ben", "I go to a skateboarding club. It's the best thing in my week!"], ["Mia", "Wow. Is it difficult?"], ["Ben", "At first, yes. I fell a lot. But now I can do some tricks. What about you?"], ["Mia", "I love painting. I'm in an art club at school on Thursdays."], ["Ben", "What do you paint?"], ["Mia", "Animals, mostly. Last week I painted a parrot. It was green, red and blue."], ["Ben", "Cool! Can you paint my dog? His name is Rocky."], ["Mia", "Sure. Bring a photo of him on Monday."]], "q": [["What does Ben do on Saturday mornings?", "swimming", "football", "skateboarding"], ["When is the art club?", "on Thursdays", "on Mondays", "on Saturdays"], ["What did Mia paint last week?", "a horse", "a dog", "a parrot"], ["What is the dog's name?", "Rocky", "Mia", "Ben"], ["What must Ben bring?", "his skateboard", "a photo of his dog", "some paint"]]}, "s": {"focus": "Animals, sports and hobbies.", "tasks": [{"name": "Questions", "mins": 2, "lead": "The child answers in sentences.", "prompts": ["What sports do you like?", "What could you do when you were five?", "What is the best animal? Why?", "What do you want to do in the holidays?"]}, {"name": "Odd one out", "mins": 3, "lead": "Show 4 pictures in a set (e.g. tiger, lion, cat, fish). The child says which is different and why.", "prompts": ["Which one is different? Why?", "Now these sports: which one is different?", "Which one do you like best?", "Which is the most dangerous animal?"]}]}, "rw": 1});
TESTS.push({"id": "mvx", "kind": "mv", "lv": "A1 Movers", "title": "Movers Practice Exam", "focus": "All Movers topics: daily life, family, health, weather, town, transport, animals, sports and hobbies.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BCCACABACB", "q": [["My grandpa _____ in a village.", "living", "lives", "live"], ["We _____ at the beach last summer.", "are", "was", "were"], ["She _____ a cake for my birthday.", "maked", "make", "made"], ["You _____ wear a helmet when you ride a bike.", "must", "mustn't", "can't"], ["Mount Everest is the _____ mountain in the world.", "most high", "higher", "highest"], ["I like this jacket, but that one is _____.", "better", "best", "gooder"], ["_____ did you go on holiday?  To Turkey.", "What", "Where", "Who"], ["He doesn't _____ to school on Saturdays.", "go", "going", "goes"], ["I want _____ my homework now.", "finishing", "finish", "to finish"], ["She talks very _____ . I can't hear her.", "quiet", "quietly", "quieter"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BBBBAABBAB", "q": [["You put this on your bed when it's cold.", "towel", "blanket", "ticket"], ["You need this to go on a bus or train.", "map", "ticket", "present"], ["Your brother's daughter is your _____.", "aunt", "niece", "cousin"], ["A tall plant with a hard brown body and green leaves.", "flower", "tree", "grass"], ["It's a big hole in a mountain. Bats live there.", "cave", "lake", "island"], ["A small river.", "stream", "waterfall", "sea"], ["You wear these to see better.", "gloves", "glasses", "scarves"], ["The meal you have in the evening.", "breakfast", "dinner", "snack"], ["A doctor for animals.", "vet", "dentist", "nurse"], ["It's a very big town.", "village", "city", "farm"]]}, "r": {"title": "Camping by the lake", "k": "BCBCB", "text": ["Last summer Holly went camping with her mum, her dad and her cousin, Jim. They stayed by a beautiful lake near the mountains.", "On the first day it was hot and sunny. Holly and Jim swam in the lake and went fishing with Dad. Jim caught the biggest fish!", "On the second night there was a terrible storm. The wind was very strong and the rain came into the tent. Nobody could sleep.", "In the morning everything was wet, so they put their clothes on the trees in the sun. Mum laughed and said, \"This is the best holiday ever!\""], "q": [["Who went camping with Holly?", "her grandparents", "her parents and her cousin", "her friends"], ["What was the weather like on the first day?", "windy", "cloudy", "hot and sunny"], ["Who caught the biggest fish?", "Dad", "Jim", "Holly"], ["What happened on the second night?", "They saw a bear.", "They went home.", "There was a storm."], ["Why did they put their clothes on the trees?", "It was windy.", "They were wet.", "They were dirty."]]}, "l": {"setting": "You will hear a girl, Grace, telling her teacher about her holiday.", "k": "CBCBA", "script": [["Teacher", "Did you have a good holiday, Grace?"], ["Grace", "Yes! We went to my uncle's house in the countryside."], ["Teacher", "How did you get there?"], ["Grace", "We drove. It took four hours. My little brother was sick in the car!"], ["Teacher", "Oh dear. What did you do there?"], ["Grace", "My uncle has got a farm. I fed the chickens every morning and I rode a horse."], ["Teacher", "Was it difficult?"], ["Grace", "A bit. The horse was called Lightning but it was the slowest horse on the farm!"], ["Teacher", "Ha! Did you take any photos?"], ["Grace", "Yes, I took about a hundred. I can bring some tomorrow."]], "q": [["Where did Grace go?", "the beach", "a big city", "her uncle's house"], ["How long was the journey?", "two hours", "four hours", "six hours"], ["What did Grace do every morning?", "rode a horse", "went swimming", "fed the chickens"], ["What was the horse like?", "very big", "very slow", "very fast"], ["What will Grace bring tomorrow?", "some photos", "a present", "some eggs"]]}, "s": {"focus": "Movers speaking: differences, story, odd one out, personal questions.", "tasks": [{"name": "Picture story", "mins": 3, "lead": "Show a 4-picture story. The child tells it in the past or present.", "prompts": ["Look at the pictures. What happened first?", "And then?", "What happened next?", "How did it end?"]}, {"name": "Personal questions", "mins": 2, "lead": "The child answers in sentences.", "prompts": ["Tell me about your family.", "What did you do last weekend?", "What's your favourite sport? Why?", "What do you want to be in the future?"]}]}, "rw": 1});
TESTS.push({"id": "fl1", "kind": "fl", "lv": "A2 Flyers", "title": "Flyers Test 1: School, work and time", "focus": "School subjects, jobs, dates and time; present perfect (ever / never / just / already / yet), going to, will.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BCCAABCBAB", "q": [["Have you _____ been to Japan?", "never", "ever", "yet"], ["I have _____ eaten sushi. I don't want to try it.", "yet", "ever", "never"], ["She has _____ finished her homework. She's free now.", "ever", "yet", "just"], ["Have you done the project _____?", "yet", "already", "just"], ["We _____ to visit the science museum next week.", "are going", "will going", "going"], ["I think it _____ be sunny tomorrow.", "going", "will", "is"], ["He _____ a scientist when he grows up.", "wants being", "want be", "wants to be"], ["I have lived here _____ 2020.", "for", "since", "from"], ["My mum has worked at the bank _____ ten years.", "for", "since", "during"], ["My birthday is _____ the 3rd of May.", "in", "on", "at"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CACACBABAA", "q": [["In this subject you learn about countries, mountains and rivers.", "maths", "history", "geography"], ["In this subject you learn about the past.", "history", "art", "science"], ["This person writes news for a newspaper.", "businessman", "mechanic", "journalist"], ["This person repairs cars.", "mechanic", "firefighter", "dentist"], ["This person looks after your teeth.", "police officer", "engineer", "dentist"], ["The month after September is _____.", "August", "October", "November"], ["Two weeks = one _____.", "fortnight", "month", "century"], ["Your teacher gives you this to do at home.", "timetable", "homework", "dictionary"], ["You look up new words in a _____.", "dictionary", "diary", "calendar"], ["100 years = one _____.", "century", "week", "decade"]]}, "r": {"title": "A visit to the newspaper", "k": "CABCB", "text": ["Last month Katy's class went to visit the , "her timetable", "her lunch"], ["What is the competition prize?", "a trip to a museum", "a book", "a new paint set"]]}, "s": {"focus": "School, jobs, plans and experiences.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The child answers in full sentences with reasons.", "prompts": ["Which school subject do you like best? Why?", "What are you going to do this weekend?", "Have you ever been on a plane?", "What job would you like to do? Why?"]}, {"name": "Information exchange", "mins": 3, "lead": "Teacher has information about a person; the child asks questions to find it.", "prompts": ["Ask me about my friend: What's her name?", "Ask: What's her job?", "Ask: Where does she work?", "Ask: What does she like doing?"]}]}, "rw": 1});

, "map"]]}, "r": {"title": "An island adventure", "k": "ACBAB", "text": ["When Robert was ten, his family used to spend every summer on a small island. There were no cars there – only bikes and boats.", "One morning Robert and his sister, Jess, found an old map in a cave. It showed a path to the other side of the island, where there was a big X.", "They followed the map for three hours. When they got to the X, they started digging. They found a metal box which had an old diary inside.", "The diary belonged to a girl who lived on the island a hundred years ago. Today it is in the island museum, and Robert and Jess's names are next to it!"], "q": [["What could you NOT find on the island?", "cars", "boats", "bikes"], ["Where did they find the map?", "in the museum", "on the beach", "in a cave"], ["How long did they walk?", "one hour", "three hours", "all day"], ["What was in the box?", "an old diary", "another map", "gold"], ["Where is the diary now?", "in Robert's house", "in the island museum", "in the cave"]]}, "l": {"setting": "You will hear a girl, Alice, talking to a travel agent.", "k": "AABCB", "script": [["Agent", "Good morning. Where would you like to go?"], ["Alice", "My family wants to go somewhere warm in February, where we can see wild animals."], ["Agent", "How about Kenya? You can go on a safari and see lions and elephants."], ["Alice", "That sounds amazing. How long is the flight?"], ["Agent", "About eight hours. You'll need a passport and a visa, won't you?"], ["Alice", "My mum has already got our passports. Is the hotel near the beach?"], ["Agent", "Yes, the hotel which I recommend is next to the beach, and it has a pool too."], ["Alice", "Great. Can I take these leaflets home to show my parents?"], ["Agent", "Of course."]], "q": [["When does the family want to travel?", "in February", "in December", "in July"], ["Which country does the agent suggest?", "Kenya", "Spain", "Egypt"], ["How long is the flight?", "about twelve hours", "about eight hours", "about five hours"], ["Who has got the passports?", "Alice", "the agent", "Alice's mum"], ["What will Alice take home?", "a map", "some leaflets", "the tickets"]]}, "s": {"focus": "Travel, the environment and telling stories.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The child answers in full sentences with reasons.", "prompts": ["Where did you use to go on holiday when you were little?", "Where would you like to travel? Why?", "What can children do to help the environment?", "What's the most exciting place you've ever been to?"]}, {"name": "Story", "mins": 3, "lead": "Show a 5-picture adventure story. The child tells the whole story using past tenses.", "prompts": ["Who are the people in the story?", "What were they doing at the start?", "What did they find?", "How does the story end?"]}]}, "rw": 1});

<script>
(function(){
const L=['A','B','C'];
const ALLSECS=[
 {k:'g',name:'Grammar',max:20},{k:'v',name:'Vocabulary',max:20},{k:'p',name:'Pronunciation',max:10},
 {k:'r',name:'Reading',max:10},{k:'l',name:'Listening',max:10},{k:'s',name:'Speaking',max:30}];
function secsFor(t){return ALLSECS.filter(s=>t[s.k]).map(s=>Object.assign({},s,{max:(s.k==='g'||s.k==='v'||s.k==='p')?t[s.k].q.length:(s.k==='r'||s.k==='l')?t[s.k].q.length*(t.rw||2):s.k==='s'?t.s.tasks.length*10:s.max}))}
const COLLECTIONS=[
 {name:'Placement test',ids:TESTS.filter(t=>t.kind==='place').map(t=>t.id)},
 {name:'Pre A1 Starters',ids:TESTS.filter(t=>t.kind==='st').map(t=>t.id)},
 {name:'A1 Movers',ids:TESTS.filter(t=>t.kind==='mv').map(t=>t.id)},
 {name:'A2 Flyers',ids:TESTS.filter(t=>t.kind==='fl').map(t=>t.id)}];
const KEY='ifa-yle-testcentre-v1';
let state;
try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}
if(!state||typeof state!=='object')state={mode:'practice',name:'',cls:'',cur:TESTS[0].id,sec:'g',tests:{},theme:''};
if(!TESTS.find(t=>t.id===state.cur))state.cur=TESTS[0].id;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const T=()=>TESTS.find(t=>t.id===state.cur);
function ts(id){if(!state.tests[id])state.tests[id]={a:{g:{},v:{},p:{},r:{},l:{}},s:{},marked:false,plays:0};return state.tests[id]}

/* theme */
const themeSel=$('#theme');
function applyTheme(){if(state.theme)document.documentElement.setAttribute('data-theme',state.theme);else document.documentElement.removeAttribute('data-theme');themeSel.value=state.theme||''}
themeSel.onchange=()=>{state.theme=themeSel.value;applyTheme();save()};
applyTheme();

/* scoring */
function secData(t,k){if(k==='r')return{q:t.r.q,k:t.r.k,w:t.rw||2};if(k==='l')return{q:t.l.q,k:t.l.k,w:t.rw||2};return{q:t[k].q,k:t[k].k,w:1}}
function secScore(t,k){const st=ts(t.id);if(k==='s')return Object.values(st.s).reduce((a,b)=>a+b,0);const d=secData(t,k);let c=0;for(const i in st.a[k]){if(L[st.a[k][i]]===d.k[i])c+=d.w}return c}
function secDone(t,k){const st=ts(t.id);if(k==='s')return Object.keys(st.s).length;return Object.keys(st.a[k]).length}
function secCount(t,k){if(k==='s')return t.s.tasks.length;return secData(t,k).q.length}
const reveal=t=>state.mode==='practice'||ts(t.id).marked;
function band(p){if(p>=90)return'Excellent';if(p>=75)return'Good';if(p>=60)return'Satisfactory';if(p>=40)return'Needs revision';return'Needs a lot of revision'}

/* text formatting */
function fmtPron(s){return esc(s).replace(/\*(.+?)\*/g,'<b class="snd">$1</b>').replace(/_(.+?)_/g,'<u class="str">$1</u>')}
function fmtStem(s,filled){
  return s.split('\n').map(line=>{
    let m=line.match(/^([AB]):\s*(.*)$/);let pre='';
    if(m){pre='<span class="spk">'+m[1]+'</span>';line=m[2]}
    const parts=line.split(/_{3,}/);
    return pre+parts.map(esc).join(filled!=null?'<span class="blank filled">'+esc(filled)+'</span>':'<span class="blank" aria-label="gap"></span>')
  }).join('<br>');
}

/* nav */
function renderNav(){
  let h='';
  for(const c of COLLECTIONS){
    h+='<h2>'+esc(c.name)+'</h2>';
    if(!c.ids.length){h+=c.link?'<p class="soon"><a href="'+c.link+'" target="_blank" rel="noopener" style="color:inherit">'+esc(c.linkText)+'</a></p>':'<p class="soon">Not added yet</p>';continue}
    h+='<ul>';
    for(const id of c.ids){const t=TESTS.find(x=>x.id===id);const tot=secsFor(t).reduce((a,s)=>a+secScore(t,s.k),0);const any=secsFor(t).some(s=>secDone(t,s.k)>0);
      h+='<li><button data-test="'+id+'" aria-current="'+(id===state.cur)+'"><span>'+esc(t.title)+'</span><span class="mini">'+(any&&reveal(t)?tot:'')+'</span></button></li>'}
    h+='</ul>';
  }
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>goTest(b.dataset.test));
}
function goTest(id){stopAudio();stopTimer();state.cur=id;state.sec='g';save();renderAll();window.scrollTo(0,0)}

/* main */
function renderMain(){

function qBlock(t,k,i,item,isPron){

function speakScript(t,rate){
  synth.cancel();
  const speakers=[...new Set(t.l.script.map(l=>l[0]))];
  const base=chosenVoice?voices.find(v=>v.name===chosenVoice):voices[0];
  const pool=chosenVoice?[base]:voices.slice(0,4);
  const pitches=[1,1.18,0.88,1.08];
  const q=[];
  t.l.script.forEach((ln,li)=>{
    const si=speakers.indexOf(ln[0]);
    const v=pool.length?pool[si%pool.length]:null;
    const pitch=(pool.length>si)?1:pitches[si%pitches.length];
    (ln[1].match(/[^.!?…]+[.!?…]*[”"’']?\s*/g)||[ln[1]]).forEach(s=>{s=s.trim();if(!s)return;
      const u=new SpeechSynthesisUtterance(s);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
      u.rate=rate;u.pitch=pitch;u.ifVoice=si%2?"female":"male";u.onstart=()=>markLine(li);q.push(u)});

  q[q.length-1].onend=()=>{playing=false;paused=false;const s=$('#lstatus');if(s)s.textContent='Finished. Answer the questions below.';markLine(-1)};
  q.forEach(u=>{u.onerror=()=>{playing=false}});
  q.forEach(u=>synth.speak(u));

function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

  return JSON.parse(new TextDecoder().decode(bytes))}

function normCls(s){

  let m=x.match(/^b1([abcd])$/);if(m)return 'B1 '+m[1].toUpperCase();
  if(/starter/.test(x))return 'Starters';if(/flyer/.test(x))return 'Flyers';if(/mover/.test(x))return 'Movers';

function wordsIn(o){let n=0;const skip={items:1,q:1,o:1,a:1,ins:1,instr:1,k:1,id:1,name:1,setting:1,title:1,ex:1,sents:1,list:1,bankHtml:1,opts:1};

function timePlan(t){
  const out=[];
  AD.secInfo(t).forEach(s=>{
    if(s.k==='s')return;
    if(s.k==='w'){const wm=AD.writeMins(t);out.push({k:'w',name:s.name,prep:5,what:'to plan before you write',mins:5+wm});return}
    if(s.k==='r'){const prep=Math.max(2,Math.ceil(s.words/130));out.push({k:'r',name:s.name,prep,what:'to read the text before you answer',mins:prep+Math.ceil(s.items*AD.rRate(t))});return}
    if(s.k==='l'){const play=Math.ceil(2*s.words/140+0.5);out.push({k:'l',name:s.name,prep:1,what:'to read the questions before the recording',mins:1+play+1});return}
    out.push({k:s.k,name:s.name,mins:Math.max(2,Math.ceil(s.items*AD.rate(t)))});
  });
  const sum=out.reduce((a,x)=>a+x.mins,0);
  return {secs:out,total:Math.max(5,Math.ceil(sum/5)*5),speak:AD.secInfo(t).some(s=>s.k==='s')};
}

function tmPlay(on){document.querySelectorAll('#lplay,[data-lplay]').forEach(b=>{b.disabled=!on;b.title=on?'':'Read the questions first'})}
setInterval(()=>{
  if(state.view==='teacher'&&RT.owner)return;const t=T();if(!t)return;const st=ts(t.id);
  if(!st.t0||tmDone(st)||st.tpz)return;
  const left=tmLeft(t),el=$('#tmleft'),bar=$('#tmbar');
  if(el)el.textContent=tmFmt(left);if(bar){bar.classList.toggle('warn',left>0&&left<5*60000);bar.classList.toggle('over',left<=0)}
  const pr=$('#tmprep');if(pr){const pl=tmPrepLeft(t,state.sec);if(pl>0){const c=$('#tmpl');if(c)c.textContent=tmFmt(pl)}else{pr.remove();if(state.sec==='l')tmPlay(true)}}
  if(left<=0)tmTimeUp(t);
},1000);
