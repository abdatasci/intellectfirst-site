<meta charset="utf-8">
<title>PET Word Party</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap">
<style>
/* Party night in IF Academy colours: a navy stage, gold spotlight on the word card. Single dark look by design. */
:root{
  --bg:#0E1832; --stage:#14213D; --panel:#1C2C52; --panel2:#24386A; --line:#33497E;
  --gold:#D4AE3A; --gold2:#F0D27A; --ink:#F3F6FC; --muted:#A9B7D3; --ok:#4CC38A; --bad:#F07D6E; --card:#FFFFFF; --cardink:#14213D;
  --f-head:"Caladea", Cambria, Georgia, serif; --f-body:"Carlito", Calibri, "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%, #22356A 0%, var(--bg) 60%) fixed, var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--stage);z-index:30}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.15;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(20,33,61,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--gold)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:auto}
.brand b{font-family:var(--f-head);font-size:20px}
.brand small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
.modes{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.modes button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:700}
.modes button[aria-pressed="true"]{background:var(--gold);color:var(--cardink)}
main{padding-block:18px 50px}
.units{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.units span{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px}
.units .cur{flex-basis:100%;font-family:Georgia,Cambria,serif;font-size:18px;margin-top:6px}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--cardink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:11px 18px;border-radius:12px;font-weight:700;font-size:17px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--cardink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06281A}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.big{font-size:22px;padding:16px 26px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
input.t{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
.teamrow{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.score div{background:var(--panel2);border-radius:12px;padding:10px 14px;border:2px solid transparent}
.score div.now{border-color:var(--gold)}
.score b{display:block;font-family:var(--f-head);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stagebox{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.word{background:var(--card);color:var(--cardink);border-radius:22px;width:100%;max-width:620px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.45), 0 0 0 6px rgba(212,174,58,.35)}
.word .w{font-family:var(--f-head);font-size:clamp(34px,7vw,58px);font-weight:700;line-height:1.05}
.word .ru{font-size:18px;color:#56627A;margin-top:10px}
.word .tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8A6A08;font-weight:700;margin-bottom:8px}
.bar{width:100%;max-width:620px;height:12px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.bar.low i{background:var(--bad)}
.clock{font-family:var(--f-head);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.review{display:grid;gap:6px;max-width:620px;width:100%}
.review button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;text-align:left}
.review button[data-ok="1"] .m{color:var(--ok)} .review button[data-ok="0"] .m{color:var(--bad)}
.flip{perspective:1200px;width:100%;max-width:560px;height:260px;display:block;background:none;border:0;padding:0;color:inherit}
.flip .in{display:block}
.flip .f .w,.flip .f .h{display:block}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:var(--card);color:var(--cardink);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.flip .f.b{transform:rotateY(180deg);background:#FFF7DD}
.flip .f .w{font-family:var(--f-head);font-size:clamp(30px,6vw,48px);font-weight:700;text-align:center}
.flip .f .h{font-size:13px;color:#56627A;margin-top:12px}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}
.prog{display:flex;gap:16px;justify-content:center;font-weight:700}
.prog .k{color:var(--ok)} .prog .l{color:var(--gold2)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{min-height:88px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);padding:10px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word}
.tile.en{background:var(--card);color:var(--cardink);border-color:#fff}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,174,58,.4)}
.tile.wrong{animation:sh .35s;border-color:var(--bad)}
.tile.gone{visibility:hidden}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.tile.wrong{animation:none}}
.pop{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-head);font-size:46px;font-weight:700;color:var(--gold2);pointer-events:none;animation:pp .8s ease-out forwards;z-index:40}
@keyframes pp{0%{opacity:0;transform:translate(-50%,20px)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
.win h2{font-size:clamp(34px,6vw,54px);color:var(--gold2)}
footer{color:var(--muted);font-size:13px;padding-block:20px;text-align:center}
</style>

  let cur = next();
  const draw = () => {
    $("#view").innerHTML = `${scoreHTML()}<div class="stagebox" style="margin-top:18px">
      <div class="row" style="gap:18px"><span class="clock" id="clk">${left}</span><span class="muted small">${S.kind === "alias" ? "Explain – don't say it!" : "Act – no talking!"}</span></div>
      <div class="bar" id="bar"><i style="width:${left / S.secs * 100}%"></i></div>
      <div class="word"><span class="tag">Unit ${cur.u} · ${esc(DATA[cur.u].t)}</span><span class="w">${esc(cur.en)}</span>${cur.ru ? `<span class="ru">${esc(cur.ru)}</span>` : ""}</div>
      <div class="row" style="justify-content:center"><button class="btn bad big" id="skip">Skip −1</button><button class="btn ok big" id="yes">✓ Got it +1</button></div></div>`;
    $("#yes").onclick = () => { got.push([cur, 1]); beep(990); pop("+1"); cur = next(); draw(); };
    $("#skip").onclick = () => { got.push([cur, 0]); beep(260); cur = next(); draw(); };
  };
  draw();
  S.timer = setInterval(() => { left--; const c = $("#clk"), b = $("#bar"); if (c) c.textContent = left; if (b) { b.firstElementChild.style.width = Math.max(0, left / S.secs * 100) + "%"; b.classList.toggle("low", left <= 10); } if (left <= 5 && left > 0) beep(660, .05); if (left <= 0) { stop(); beep(330, .4); review(got); } }, 1000);
}
function review(got) {
  const v = $("#view"), t = S.teams[S.turn];
  const total = () => got.reduce((a, g) => a + (g[1] ? 1 : -1), 0);
  v.innerHTML = `${scoreHTML()}<div class="stagebox" style="margin-top:18px"><span class="eyebrow">Time's up!</span><h2 style="font-size:36px">${esc(t.n)}: <span id="tot">${total() >= 0 ? "+" : ""}${total()}</span></h2>
    <p class="muted small" style="margin:0">Tap a word to change ✓ / ✗ if the team disagrees.</p>
    <div class="review">${got.length ? got.map((g, i) => `<button data-i="${i}" data-ok="${g[1]}"><span>${esc(g[0].en)}</span><span class="m">${g[1] ? "✓ +1" : "✗ −1"}</span></button>`).join("") : `<p class="muted">No words this round!</p>`}</div>
    <button class="btn gold big" id="ok">Add points</button></div>`;
  $$(".review button").forEach(b => b.onclick = () => { const g = got[+b.dataset.i]; g[1] = g[1] ? 0 : 1; b.dataset.ok = g[1]; $(".m", b).textContent = g[1] ? "✓ +1" : "✗ −1"; $("#tot").textContent = (total() >= 0 ? "+" : "") + total(); });
  $("#ok").onclick = () => { t.s = Math.max(0, t.s + total()); const last = S.turn === S.teams.length - 1; S.turn = (S.turn + 1) % S.teams.length;
    const best = Math.max(...S.teams.map(x => x.s)); if (last && best >= S.target) return win(); ready(); };
}
function win() {
  const best = Math.max(...S.teams.map(x => x.s)), ws = S.teams.filter(x => x.s === best);
  $("#view").innerHTML = `<div class="stagebox win" style="margin-top:30px"><span class="eyebrow">And the winner is…</span><h2>${ws.map(w => esc(w.n)).join(" & ")}!</h2><p class="muted" style="margin:0">${best} points</p>${scoreHTML()}<div class="row"><button class="btn gold big" id="again">Play again</button></div></div>`;
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .15), i * 140));
  $("#again").onclick = () => setup(S.kind);
}

/* ---------- Flashcards ---------- */
function cards() {
  let deck = shuffle(words()), i = 0, know = 0, learn = [], ruFirst = store.get("ruFirst", false);
  const draw = () => {
    if (i >= deck.length) return done();
    const c = deck[i], front = ruFirst ? c.ru : c.en, back = ruFirst ? c.en : c.ru;
    $("#view").innerHTML = `<div class="stagebox"><div class="prog"><span>${i + 1} / ${deck.length}</span><span class="k">Know it: ${know}</span><span class="l">Still learning: ${learn.length}</span></div>
      <button class="flip" id="fl" aria-label="Flip card"><span class="in"><span class="f"><span class="w">${esc(front)}</span><span class="h">Tap or press Space to flip</span></span><span class="f b"><span class="w">${esc(back)}</span><span class="h">Unit ${c.u} · ${esc(DATA[c.u].t)}</span></span></span></button>
      <div class="row" style="justify-content:center"><button class="btn bad big" id="l">Still learning</button><button class="btn ok big" id="k">Know it</button></div>
      <div class="row" style="justify-content:center"><button class="btn" id="dir">${ruFirst ? "Show English first" : "Show Russian first"}</button><button class="btn" id="sh">Shuffle</button></div></div>`;
    $("#fl").onclick = () => $("#fl").classList.toggle("on");
    $("#k").onclick = () => { know++; i++; beep(990); draw(); };
    $("#l").onclick = () => { learn.push(c); i++; draw(); };
    $("#dir").onclick = () => { ruFirst = !ruFirst; store.set("ruFirst", ruFirst); draw(); };
    $("#sh").onclick = () => { deck = shuffle(deck); i = 0; know = 0; learn = []; draw(); };
  };
  const done = () => {
    $("#view").innerHTML = `<div class="stagebox win" style="margin-top:20px"><span class="eyebrow">Deck finished</span><h2>${know} / ${deck.length} known</h2>
      ${learn.length ? `<p class="muted" style="margin:0">Still learning: ${learn.map(c => esc(c.en)).join(", ")}</p><button class="btn gold big" id="re">Practise the ${learn.length} tricky words</button>` : `<p class="muted" style="margin:0">Perfect! Try another unit or play Match.</p>`}
      <button class="btn" id="all">Start again</button></div>`;
    if ($("#re")) $("#re").onclick = () => { deck = shuffle(learn); i = 0; know = 0; learn = []; draw(); };
    $("#all").onclick = cards;
  };
  draw();
}
document.addEventListener("keydown", e => { if (S.mode === "cards" && e.code === "Space" && $("#fl")) { e.preventDefault(); $("#fl").classList.toggle("on"); } });

/* ---------- Match ---------- */
function match() {
  const key = "best:" + S.unit, best = store.get(key, null);
  $("#view").innerHTML = `<div class="stagebox"><span class="eyebrow">Match</span><h2 style="font-size:30px">Match English and Russian – fast!</h2>
    <p class="muted" style="margin:0">Six pairs. Tap an English word, then its Russian partner. Wrong match = +2 seconds.</p>
    <p style="margin:0">Best time${S.unit === "all" ? " (all units)" : " for Unit " + S.unit}: <b>${best ? best.toFixed(1) + " s" : "–"}</b></p>
    <button class="btn gold big" id="go">Start</button></div>`;
  $("#go").onclick = () => {
    const pairs = shuffle(words()).slice(0, 6), tiles = shuffle(pairs.flatMap((p, i) => [{ t: p.en, i, en: 1 }, { t: p.ru, i, en: 0 }]));
    let sel = null, left = 6, pen = 0; const t0 = performance.now();
    $("#view").innerHTML = `<div class="stagebox"><span class="clock" id="clk">0.0</span><div class="tiles">${tiles.map((t, k) => `<button class="tile ${t.en ? "en" : ""}" data-k="${k}">${esc(t.t)}</button>`).join("")}</div></div>`;
    S.timer = setInterval(() => { const c = $("#clk"); if (c) c.textContent = ((performance.now() - t0) / 1000 + pen).toFixed(1); }, 100);
    $$(".tile").forEach(b => b.onclick = () => {
      const t = tiles[+b.dataset.k]; if (b.classList.contains("gone")) return;
      if (!sel) { sel = b; b.classList.add("sel"); return; }
      if (sel === b) { b.classList.remove("sel"); sel = null; return; }
      const s = tiles[+sel.dataset.k];
      if (s.i === t.i && s.en !== t.en) { beep(990); sel.classList.add("gone"); b.classList.add("gone"); sel = null; left--;
        if (!left) { stop(); const tm = (performance.now() - t0) / 1000 + pen; const nb = !best || tm < best; if (nb) store.set(key, tm);
          setTimeout(() => { $("#view").innerHTML = `<div class="stagebox win" style="margin-top:20px"><span class="eyebrow">${nb ? "New record!" : "Finished"}</span><h2>${tm.toFixed(1)} seconds</h2><p class="muted" style="margin:0">${pairs.map(p => esc(p.en) + " – " + esc(p.ru)).join(" · ")}</p><button class="btn gold big" id="again">Play again</button></div>`; $("#again").onclick = match; }, 250); } }
      else { beep(220); pen += 2; [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("wrong"); setTimeout(() => x.classList.remove("wrong"), 400); }); sel = null; pop("+2 s"); }
    });
  };
}
drawUnits(); go("alias");
})();
</script>
