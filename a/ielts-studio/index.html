experience were being rehearsed, a phenomenon now referred to as replay. In humans, attention has focused on sleep spindles, short bursts of rhythmic activity that occur mainly in lighter NREM sleep. Spindles appear to be coordinated with slow oscillations and with fast hippocampal events, and several studies have found that people who produce more spindles show greater overnight improvement in memory."},{"label":"D","text":"It has also been proposed that different stages of sleep favour different kinds of memory. Declarative memories, those for facts and events, have most often been associated with slow-wave sleep. Procedural skills, such as learning to type a sequence of keys quickly, have been linked to lighter NREM sleep, particularly in the later part of the night, while REM sleep has been associated with the processing of emotional memories and, more speculatively, with the discovery of hidden patterns in information. Researchers caution, however, that this division is far from tidy. Findings from different laboratories frequently conflict, and the associations are best understood as tendencies rather than strict rules."},{"label":"E","text":"Some of the most persuasive evidence for an active role of sleep comes from experiments that attempt to influence memory processing directly. In a well-known study published in 2007, Björn Rasch and colleagues asked participants to learn the locations of pairs of cards while the scent of roses was present in the room. When the same odour was presented again during slow-wave sleep, participants later recalled the card locations more accurately; presenting it during REM sleep or while participants were awake produced no such benefit. A rather different perspective is offered by the synaptic homeostasis hypothesis, developed by Giulio Tononi and Chiara Cirelli. They argue that learning during the day strengthens connections between neurons, and that sleep serves to weaken these connections overall, eliminating the weakest while preserving the strongest and thereby restoring the brain's capacity to learn on the following day. Many researchers now regard active replay and this general downscaling as complementary rather than competing accounts."},{"label":"F","text":"Sleep matters not only after learning but before it. Studies in which volunteers are deprived of a night's sleep have found that their ability to form new memories the following day is impaired. Even daytime naps can make a difference: short sleeps that include some slow-wave sleep have been shown to improve the retention of recently learned material. These findings have particular relevance for adolescents. During puberty, the body's internal clock typically shifts later, so that many teenagers find it genuinely difficult to fall asleep early in the evening. When this biological shift is combined with early school start times, the result can be a chronic shortage of sleep."},{"label":"G","text":"For students, the practical implications are fairly clear. An all-night study session before an examination is likely to be counterproductive, since it sacrifices both the consolidation of what has just been studied and the capacity to absorb new information the next day. A more effective approach is to distribute study across several days, allowing sleep to intervene between sessions, and to maintain a regular sleep schedule. It is worth adding a note of caution, however. Sleep is not a form of magic: it cannot consolidate material that was never properly learned in the first place, and the improvements measured in laboratories, while reliable, are often modest and vary considerably between individuals."}],"groups":[{"type":"matching_info","instructions":"Questions 14–19\nReading Passage 2 has seven paragraphs, A–G.\nWhich paragraph contains the following information?\nWrite the correct letter, A–G, in boxes 14–19 on your answer sheet.\nNB You may use any letter more than once.","options":["A","B","C","D","E","F","G"],"questions":[{"n":14,"text":"a description of an experiment in which a smell was used during sleep","answer":["E"],"explain":"Paragraph E describes the study in which the scent of roses was presented during slow-wave sleep."},{"n":15,"text":"an explanation of why many teenagers struggle to go to sleep early","answer":["F"],"explain":"Paragraph F says the body's internal clock shifts later during puberty."},{"n":16,"text":"a reference to how the balance between types of sleep changes during the night","answer":["B"],"explain":"Paragraph B says slow-wave sleep dominates early cycles while REM becomes more prominent towards morning."},{"n":17,"text":"a warning that links between sleep stages and types of memory are not clear-cut","answer":["D"],"explain":"Paragraph D says the division is far from tidy and best understood as tendencies rather than strict rules."},{"n":18,"text":"an early explanation of why sleeping after learning reduces forgetting","answer":["A"],"explain":"Paragraph A says Jenkins and Dallenbach attributed the effect to reduced interference."},{"n":19,"text":"a reminder that sleep cannot strengthen information that was poorly learned","answer":["G"],"explain":"Paragraph G says sleep cannot consolidate material that was never properly learned."}]},{"type":"summary_completion","instructions":"Questions 20–23\nComplete the summary using the list of words, A–G, below.\nWrite the correct letter, A–G, in boxes 20–23 on your answer sheet.","options":["A hippocampus","B amygdala","C sequences","D locations","E coordinated","F improvement","G fatigue"],"summary":"How memories are consolidated\n\nAccording to the leading model, new experiences are initially recorded by the {{20}}, although these early traces are easily lost. Gradually, the information is integrated into the neocortex for long-term storage. Support for this idea comes from research on rats: groups of neurons that fired together during exploration did so again during later sleep, suggesting that the experience was being rehearsed in the same {{21}}. In humans, brief bursts of activity called spindles seem to be {{22}} with slow oscillations, and individuals who produce more of them tend to show greater overnight {{23}} in memory.","questions":[{"n":20,"text":"Gap 20","answer":["A"],"explain":"Paragraph C states that the hippocampus rapidly records new experiences."},{"n":21,"text":"Gap 21","answer":["C"],"explain":"Paragraph C says cells that fired together during exploration fired together again during sleep, i.e. in the same patterns or sequences, termed replay."},{"n":22,"text":"Gap 22","answer":["E"],"explain":"Paragraph C says spindles appear to be coordinated with slow oscillations."},{"n":23,"text":"Gap 23","answer":["F"],"explain":"Paragraph C says people with more spindles show greater overnight improvement in memory."}]},{"type":"matching_features","instructions":"Questions 24–26\nLook at the following findings (Questions 24–26) and the list of researchers below.\nMatch each finding with the correct researcher(s), A–E.\nWrite the correct letter, A–E, in boxes 24–26 on your answer sheet.","options":["A Hermann Ebbinghaus","B Jenkins and Dallenbach","C Wilson and McNaughton","D Rasch and colleagues","E Tononi and Cirelli"],"questions":[{"n":24,"text":"Sleep may reduce the overall strength of connections between brain cells.","answer":["E"],"explain":"Paragraph E says Tononi and Cirelli argue that sleep weakens connections between neurons overall."},{"n":25,"text":"Memory can be enhanced by re-presenting a learning-related cue during a particular stage of sleep.","answer":["D"],"explain":"Paragraph E describes how Rasch and colleagues improved recall by presenting a rose odour during slow-wave sleep."},{"n":26,"text":"Less is forgotten when a period of sleep follows learning.","answer":["B"],"explain":"Paragraph A reports that Jenkins and Dallenbach found participants who slept after learning forgot less."}]}]},{"title":"Nudging Citizens: The Promise and Limits of Behavioural Policy","intro":"You should spend about 20 minutes on Questions 27–40, which are based on Reading Passage 3 below.","paragraphs":[{"label":"A","text":"In 2008 the economist Richard Thaler and the legal scholar Cass Sunstein published Nudge. Its central claim was that the way in which choices are presented, which the authors termed 'choice architecture', shapes decisions in predictable ways, and that governments could exploit this fact to steer citizens towards better outcomes without restricting their freedom. A nudge, in their definition, alters behaviour without forbidding any option or significantly changing economic incentives. They described their philosophy as libertarian paternalism: paternalistic because it aims to make people better off by their own standards, libertarian because people remain free to choose otherwise. Within a few years, governments had established dedicated behavioural units, the best known being the Behavioural Insights Team set up in the United Kingdom in 2010. The promise of the approach is real; my argument here, however, is that it has frequently been oversold."},{"label":"B","text":"The case that first made nudging famous concerns retirement saving. In many countries, employees have traditionally had to take active steps to join a workplace pension scheme, and large numbers never did so, not because they had decided against saving but because of inertia and a tendency to postpone decisions that offer no immediate reward. When some American firms changed the default so that new employees were enrolled automatically unless they chose to leave, participation rose dramatically; in one widely cited case it increased from under half of new staff to well over four-fifths. The United Kingdom subsequently introduced automatic enrolment on a national scale, phased in from 2012, and membership of workplace schemes among eligible employees rose substantially. Defaults appear to work for several reasons at once: accepting them requires no effort, they may be interpreted as an implicit recommendation, and they establish a reference point against which alternatives are judged."},{"label":"C","text":"Defaults are only one item in a broad repertoire. Behavioural units have experimented with letters informing taxpayers that most people in their area pay on time, an appeal to social norms that has been found to increase prompt payment. Others have tested text-message reminders and the simplification of official forms. What unites these interventions, and what largely explains their appeal to governments operating under tight budgets, is that they are inexpensive. Rewriting a letter costs a fraction of what it would cost to introduce a new subsidy or to employ additional enforcement officers, and the effects can be tested rapidly through randomised trials."},{"label":"D","text":"Not everyone has welcomed this development. A persistent objection is that nudges are a form of manipulation: they work, critics contend, by exploiting predictable flaws in human reasoning, and they may be most effective precisely when the people being nudged do not notice them. On this view, nudging bypasses rather than engages citizens' capacity for deliberation. Defenders respond that there is no such thing as neutral design. A pension scheme must have some default, and a form must list its options in some order; the only question is whether these features are chosen thoughtfully or carelessly. I find this reply partly persuasive. Nonetheless, I believe a reasonable safeguard is transparency: a nudge that would continue to work if it were openly disclosed is far easier to justify than one that depends on concealment, and there is some evidence that many defaults remain effective even when people are told about them."},{"label":"E","text":"A more recent challenge concerns the strength of the evidence itself. The early literature on nudging reported many impressive effects, but behavioural science, like psychology more generally, has since been affected by concerns about publication bias, the tendency for striking positive results to be published while null findings remain unseen. A large analysis published in 2022 compared trials conducted by government nudge units with those reported in academic journals and found that the average effect in the former was only a fraction of that in the latter. This does not mean that nudges are worthless. An intervention that raises compliance by a single percentage point may still be highly cost-effective if it costs almost nothing and is applied to millions of people. It does mean, however, that expectations formed by the early headline results were unrealistically high."},{"label":"F","text":"There is a further danger, which I regard as the most serious of all: that nudges become a substitute for more demanding policy rather than a complement to it. It is politically easier to encourage healthier eating through better labelling than to regulate the composition of food, and easier to nudge people into pensions than to address the reasons why many cannot afford to save. Even the celebrated pension example illustrates the problem, since a default contribution rate set too low may anchor savers at a level insufficient for a comfortable retirement. Thaler himself has drawn attention to the reverse of nudging, which he calls sludge: unnecessary friction, such as complex application procedures, that makes beneficial actions harder to take. Removing sludge from benefit systems may often accomplish more than adding new nudges."},{"label":"G","text":"None of this implies that the behavioural approach should be abandoned, and it would be a mistake for governments to dismantle the units they have built. Properly used, nudges are valuable tools: cheap, testable and respectful of individual choice. My contention is simply that they should be evaluated rigorously, deployed transparently, and treated as one component of policy alongside regulation, taxation and public investment rather than as an alternative to them. Viewed in this light, nudging is neither the revolution its early enthusiasts proclaimed nor the sinister form of control its fiercest critics fear, but a modest and useful addition to the instruments available to the state."}],"groups":[{"type":"headings","instructions":"Questions 27–30\nReading Passage 3 has seven paragraphs, A–G.\nChoose the correct heading for paragraphs B–E from the list of headings below.\nWrite the correct number, i–vii, in boxes 27–30 on your answer sheet.","options":["i The power of the pre-selected option","ii A low-cost toolkit with wide appeal","iii Influence that may bypass reasoning","iv Effects that shrink under closer scrutiny","v The roots of behavioural economics in psychology","vi Why financial rewards outperform nudges","vii The risk of displacing tougher measures"],"questions":[{"n":27,"text":"Paragraph B","answer":["i"],"explain":"Paragraph B explains how changing the default for pension enrolment greatly raised participation."},{"n":28,"text":"Paragraph C","answer":["ii"],"explain":"Paragraph C lists a range of interventions and says their low cost explains their appeal to governments."},{"n":29,"text":"Paragraph D","answer":["iii"],"explain":"Paragraph D presents the objection that nudges manipulate people and bypass their capacity for deliberation."},{"n":30,"text":"Paragraph E","answer":["iv"],"explain":"Paragraph E reports that nudge-unit trials showed only a fraction of the effects reported in academic journals."}]},{"type":"ynng","instructions":"Questions 31–35\nDo the following statements agree with the claims of the writer in Reading Passage 3?\nIn boxes 31–35 on your answer sheet, write\nYES if the statement agrees with the claims of the writer\nNO if the statement contradicts the claims of the writer\nNOT GIVEN if it is impossible to say what the writer thinks about this","questions":[{"n":31,"text":"The benefits of nudging have often been exaggerated.","answer":["yes"],"explain":"In paragraph A the writer argues that the approach has frequently been oversold."},{"n":32,"text":"It is possible to design choices in a way that has no influence on decisions.","answer":["no"],"explain":"In paragraph D the writer finds partly persuasive the view that there is no such thing as neutral design."},{"n":33,"text":"Nudges have generally been more successful in the United Kingdom than in the United States.","answer":["not given"],"explain":"Paragraph B describes pension defaults in both countries but the writer never compares their overall success."},{"n":34,"text":"An intervention with a very small effect may still be worth introducing.","answer":["yes"],"explain":"Paragraph E says a one-point rise in compliance may still be highly cost-effective if cheap and widely applied."},{"n":35,"text":"Governments should close down their behavioural units.","answer":["no"],"explain":"Paragraph G says it would be a mistake for governments to dismantle the units they have built."}]},{"type":"sentence_completion","instructions":"Questions 36–40\nComplete the sentences below.\nChoose NO MORE THAN TWO WORDS from the passage for each answer.\nWrite your answers in boxes 36–40 on your answer sheet.","questions":[{"n":36,"text":"Thaler and Sunstein referred to their approach as libertarian ______.","answer":["paternalism"],"explain":"Paragraph A says they described their philosophy as libertarian paternalism."},{"n":37,"text":"Many employees failed to join pension schemes because of ______ and a habit of delaying decisions.","answer":["inertia"],"explain":"Paragraph B attributes non-enrolment to inertia and a tendency to postpone decisions."},{"n":38,"text":"Letters telling taxpayers that most local people pay on time rely on ______.","answer":["social norms"],"explain":"Paragraph C calls these letters an appeal to social norms."},{"n":39,"text":"The effectiveness of low-cost interventions can be checked quickly using ______.","answer":["randomised trials","randomized trials"],"explain":"Paragraph C says the effects can be tested rapidly through randomised trials."},{"n":40,"text":"Unnecessary obstacles that make beneficial actions harder to take are known as ______.","answer":["sludge"],"explain":"Paragraph F says Thaler calls such unnecessary friction sludge."}]}]}]},{"id":"T6","title":"Academic Reading Test 6","passages":[{"title":"A Leaf That Changed the World: The Story of Tea","intro":"You should spend about 20 minutes on Questions 1–13, which are based on Reading Passage 1 below.","paragraphs":[{"label":"A","text":"Few commodities have shaped human history as quietly or as thoroughly as the dried leaf of Camellia sinensis, an evergreen shrub native to the borderlands of south-western China, northern Myanmar and north-eastern India. Chinese tradition credits its discovery to the mythical emperor Shennong, who is said to have tasted tea when leaves drifted into a pot of boiling water nearly five thousand years ago. The story cannot be verified, but archaeological evidence confirms that tea was being consumed in China more than two thousand years ago: remains of tea leaves have been identified in the tomb of a Han dynasty emperor who died in 141 BCE. In its earliest phase, tea appears to have been valued chiefly as a medicine rather than as an everyday drink."},{"label":"B","text":"It was during the Tang dynasty (618–907 CE) that tea became firmly established as a national beverage. Around 760 CE the scholar Lu Yu completed The Classic of Tea, the first known book devoted entirely to the subject, which described methods of cultivation, processing and preparation. At that time, leaves were usually steamed, pounded and pressed into compact cakes, which were later roasted and ground before being boiled. Under the subsequent Song dynasty, fashion shifted towards a fine powder whisked into a froth, a style that Buddhist monks carried to Japan and which survives in the Japanese tea ceremony. Loose-leaf tea, steeped rather than boiled, only became dominant during the Ming dynasty, after an imperial decree of 1391 ended the production of compressed cakes as tribute to the court."},{"label":"C","text":"Compressed tea nevertheless remained important for long-distance trade, because bricks were durable, easy to stack and resistant to damage. For centuries, Chinese merchants exchanged such bricks for horses from Tibet along mountain trails later known as the Tea Horse Road. Tea also travelled west along the network of overland routes now called the Silk Road, reaching the oasis cities of Central Asia and, eventually, Persia and the Ottoman lands. Unlike silk, however, tea did not remain a luxury reserved for distant elites. Along these routes it was particularly prized by nomadic peoples, perhaps because it added variety to diets dominated by meat and dairy products."},{"label":"D","text":"Russia's encounter with tea came comparatively late. Diplomatic gifts of tea reached the Russian court in the seventeenth century, but regular commerce began only after the Treaty of Kyakhta in 1727, which fixed the border between the Russian and Qing empires and designated the frontier town of Kyakhta, south-east of Lake Baikal, as a trading post. From there, camel caravans carried chests of tea across Mongolia, and the goods then moved by sledge, cart and river boat across Siberia towards Moscow. The full journey could take well over a year, and the tea that survived it was expensive. It is sometimes claimed that the smoky flavour of the blend still sold as 'Russian Caravan' derives from the campfires of the route, although the modern blend is usually produced by adding smoked leaves. The overland trade declined rapidly once the Trans-Siberian Railway, completed in the early twentieth century, reduced the journey to a matter of weeks; the opening of the Suez Canal in 1869 had already made sea transport more competitive."},{"label":"E","text":"Tea arrived in western Europe by sea. Dutch traders brought the first consignments to Amsterdam in the early 1600s, and by the middle of the century tea was being sold in London coffee houses. Its popularity in England is often linked to Catherine of Braganza, the Portuguese princess who married Charles II in 1662 and who brought a taste for the drink to the royal court. The English East India Company soon secured a monopoly on imports, yet for much of the eighteenth century high taxes made legally imported tea so costly that smuggling flourished. When the Commutation Act of 1784 cut the duty from 119 per cent to 12.5 per cent, smuggling became unprofitable almost overnight and legal consumption rose dramatically."},{"label":"F","text":"Britain's dependence on Chinese supplies created serious difficulties, since China accepted mainly silver in payment. The East India Company's response, which was to export Indian opium to China to balance the trade, led eventually to the Opium Wars. At the same time, Britain sought to grow its own tea. A native variety of the plant had been identified in Assam in the 1820s, and in 1848 the botanist Robert Fortune was sent into China to obtain plants and seeds secretly, together with knowledge of processing techniques. By the late 1880s Britain was importing more tea from India than from China, and plantations in Ceylon soon added to the supply. By the end of the century tea had become an affordable everyday drink for British workers as well as for the aristocracy."},{"label":"G","text":"In Central Asia, meanwhile, tea developed a rich culture of its own. Across Uzbekistan and Tajikistan, the teahouse, or chaikhana, has long served as a meeting place where people gather to exchange news and conduct business, and green tea is the customary choice. In Kazakhstan, where Russian influence was stronger, black tea is more commonly drunk, often with milk, and is traditionally served from a samovar. Throughout the region, tea is poured into a small handleless bowl called a piala, and hospitality is expressed through the manner of serving. A host typically fills the bowl only partly, so that the guest must keep returning for more. This is seen not as meanness but as a sign of attention, since it ensures that the tea is always drunk hot and keeps the conversation flowing. A bowl filled to the brim, by contrast, may traditionally be read as a hint that it is time for the visitor to leave."}],"groups":[{"type":"tfng","instructions":"Questions 1–6\nDo the following statements agree with the information given in Reading Passage 1?\nIn boxes 1–6 on your answer sheet, write\nTRUE if the statement agrees with the information\nFALSE if the statement contradicts the information\nNOT GIVEN if there is no information on this","questions":[{"n":1,"text":"Archaeological evidence supports the story of Shennong's discovery of tea.","answer":["false"],"explain":"Paragraph A states that the Shennong story 'cannot be verified'; archaeology only confirms tea drinking over two thousand years ago."},{"n":2,"text":"Tea was originally consumed mainly for its supposed health benefits.","answer":["true"],"explain":"Paragraph A says early tea was 'valued chiefly as a medicine' rather than as an everyday drink."},{"n":3,"text":"Lu Yu wrote The Classic of Tea at the request of the Tang emperor.","answer":["not given"],"explain":"Paragraph B names Lu Yu and his book but says nothing about why or for whom it was written."},{"n":4,"text":"The custom of whisking powdered tea was taken to Japan by religious figures.","answer":["true"],"explain":"Paragraph B states that Buddhist monks carried the powdered, whisked style to Japan."},{"n":5,"text":"No tea reached Russia before the Treaty of Kyakhta was signed.","answer":["false"],"explain":"Paragraph D says diplomatic gifts of tea reached the Russian court in the seventeenth century, before the 1727 treaty."},{"n":6,"text":"The East India Company opposed the reduction of tea duty in 1784.","answer":["not given"],"explain":"Paragraph E describes the Commutation Act and its effects but gives no information about the Company's attitude to it."}]},{"type":"summary_completion","instructions":"Questions 7–13\nComplete the summary below.\nChoose ONE WORD ONLY from the passage for each answer.\nWrite your answers in boxes 7–13 on your answer sheet.","summary":"Tea beyond China\n\nRegular tea commerce with Russia began after a treaty made Kyakhta a {{7}} post. Camels carried the tea across Mongolia, and the overland trade declined only when the Trans-Siberian {{8}} cut the journey to a few weeks. In England, tea became fashionable at the royal {{9}} after 1662, but for much of the following century high taxes encouraged {{10}}. To reduce its reliance on China, Britain sent a botanist to obtain plants and {{11}} secretly. In Central Asia, green tea is the usual choice in Uzbek teahouses, whereas in Kazakhstan black tea is often drunk with {{12}}. Hosts pour only a little tea into each bowl, a practice regarded as a sign of {{13}} rather than meanness.","questions":[{"n":7,"text":"Kyakhta was made a ______ post.","answer":["trading"],"explain":"Paragraph D says the treaty designated Kyakhta 'as a trading post'."},{"n":8,"text":"The Trans-Siberian ______ shortened the journey.","answer":["railway"],"explain":"Paragraph D states the trade declined once the Trans-Siberian Railway reduced the journey to weeks."},{"n":9,"text":"Tea became fashionable at the royal ______.","answer":["court"],"explain":"Paragraph E says Catherine of Braganza brought a taste for tea 'to the royal court'."},{"n":10,"text":"High taxes encouraged ______.","answer":["smuggling"],"explain":"Paragraph E notes that high taxes made legal tea so costly 'that smuggling flourished'."},{"n":11,"text":"A botanist was sent to obtain plants and ______.","answer":["seeds"],"explain":"Paragraph F says Robert Fortune was sent 'to obtain plants and seeds secretly'."},{"n":12,"text":"In Kazakhstan black tea is often drunk with ______.","answer":["milk"],"explain":"Paragraph G states that in Kazakhstan black tea is drunk 'often with milk'."},{"n":13,"text":"Partly filled bowls are a sign of ______.","answer":["attention"],"explain":"Paragraph G says filling the bowl only partly 'is seen not as meanness but as a sign of attention'."}]}]},{"title":"Drinking the Sea","intro":"You should spend about 20 minutes on Questions 14–26, which are based on Reading Passage 2 below.","paragraphs":[{"label":"A","text":"Roughly 97 per cent of the water on Earth is held in the oceans, far too salty to drink or to irrigate most crops. As populations grow and droughts become more frequent, an increasing number of countries are turning to desalination: the removal of dissolved salts from seawater or brackish groundwater to produce fresh water. Although the principle has been understood for centuries, desalination on an industrial scale is a product of the second half of the twentieth century. Today there are estimated to be around 16,000 operational plants worldwide, with a combined capacity of roughly 95 million cubic metres of fresh water per day. Nearly half of that capacity is located in the Middle East and North Africa, where countries such as Saudi Arabia, the United Arab Emirates and Israel depend heavily on the technology."},{"label":"B","text":"The earliest large plants relied on thermal distillation, which imitates the natural water cycle. Seawater is heated until it evaporates, leaving the salt behind, and the vapour is then condensed into fresh water. The most widespread design, multi-stage flash distillation, passes heated seawater through a series of chambers kept at progressively lower pressures. Because the boiling point of water falls as pressure decreases, a portion of the water 'flashes' into steam in each chamber. Thermal plants are robust and can cope with highly saline or polluted feed water, which partly explains their popularity around the Persian Gulf. Their great drawback is a voracious appetite for energy, since a large quantity of heat is required to turn water into vapour. For this reason they are often built alongside power stations, where waste heat from electricity generation can be put to use."},{"label":"C","text":"Since the 1990s, however, the dominant technology has been reverse osmosis. In natural osmosis, water moves across a semi-permeable membrane from a dilute solution towards a more concentrated one. Reverse osmosis turns this process on its head: high-pressure pumps force seawater against a membrane whose microscopic structure allows water molecules to pass but holds back most dissolved salts. Because the natural osmotic pressure of seawater is about 27 bar, operating pressures in seawater plants typically range from 55 to 80 bar, dozens of times the pressure in a car tyre. Before reaching the membranes, the water must be carefully treated to remove sand, algae and organic matter, which would otherwise accumulate on the membrane surface and block it, a problem engineers call fouling. Reverse osmosis now produces around 70 per cent of the world's desalinated water."},{"label":"D","text":"The rise of reverse osmosis owes much to dramatic improvements in energy efficiency. Some early plants built in the 1970s consumed more than 15 kilowatt-hours of electricity to produce a single cubic metre of fresh water; the most efficient modern facilities need only around 3. A key innovation has been the energy recovery device, which captures the pressure still held by the concentrated brine leaving the membranes and transfers it to the incoming seawater, so that the pumps need to do less work. Yet physics imposes a floor. Separating salt from water requires a minimum amount of energy, which for typical seawater is close to 1 kilowatt-hour per cubic metre, and practical plants can never reach this ideal. Since the best facilities are already within a few multiples of that limit, further large savings are unlikely to come from the membrane process itself."},{"label":"E","text":"Energy is usually the largest single operating expense, often accounting for between a third and a half of the running costs of a plant. Large modern facilities can produce water for roughly US$0.50 to US$1.00 per cubic metre, a figure that still exceeds the cost of conventional supplies wherever rivers or aquifers are available. Moreover, the price at the plant gate is only part of the story: pumping water inland, and especially uphill, can add substantially to the final bill. Capital costs present a further risk. During Australia's prolonged 'Millennium Drought', several states commissioned large plants, but by the time some were completed the rains had returned, and expensive facilities were placed on standby for years while their construction costs continued to be repaid."},{"label":"F","text":"The most serious environmental objection concerns brine, the concentrated salt solution left behind once fresh water has been extracted. A widely cited global assessment estimated that, on average, about 1.5 litres of brine are produced for every litre of fresh water. Because brine is denser than seawater, it tends to sink and spread across the seabed, where it can reduce oxygen levels and harm seagrass meadows and bottom-dwelling organisms. It may also contain residues of the chemicals used in pretreatment, such as chlorine and anti-scaling agents, and brine from thermal plants is discharged warm. Engineers attempt to limit the damage by fitting outfall pipes with diffusers that mix the brine rapidly with surrounding water, by siting outlets where strong currents aid dispersal, and in some cases by diluting the brine with treated wastewater before release."},{"label":"G","text":"Researchers are pursuing several promising directions. Coupling plants with solar and wind power could reduce the carbon footprint of desalination, although the intermittent nature of renewable energy complicates the continuous operation that membranes prefer. New membrane materials, including some based on graphene, may allow water to pass more readily, and alternative processes such as forward osmosis are being tested. There is growing interest, too, in treating brine as a resource rather than a waste, by extracting valuable minerals such as magnesium and lithium. Nonetheless, most specialists caution that desalination is unlikely to resolve water scarcity on its own. Reducing leakage, conserving water and recycling wastewater are frequently cheaper options, and the technology is best regarded as one component of a broader water strategy rather than a cure-all."}],"groups":[{"type":"headings","instructions":"Questions 14–20\nReading Passage 2 has seven paragraphs, A–G.\nChoose the correct heading for each paragraph from the list of headings below.\nWrite the correct number, i–x, in boxes 14–20 on your answer sheet.","options":["i Ancient techniques revived for modern use","ii A process that mimics the natural water cycle","iii The heavy burden of a waste product","iv How much fresh water the world now manufactures","v Public resistance to new coastal plants","vi Reversing a natural process under pressure","vii Efficiency gains and their limits","viii The health risks of drinking desalinated water","ix Counting the cost of desalinated water","x Promising developments, but no single solution"],"questions":[{"n":14,"text":"Paragraph A","answer":["iv"],"explain":"Paragraph A focuses on the global scale of desalination: about 16,000 plants producing roughly 95 million cubic metres a day."},{"n":15,"text":"Paragraph B","answer":["ii"],"explain":"Paragraph B explains that thermal distillation 'imitates the natural water cycle' by evaporating and condensing water."},{"n":16,"text":"Paragraph C","answer":["vi"],"explain":"Paragraph C describes reverse osmosis, which 'turns this process on its head' using high pressure."},{"n":17,"text":"Paragraph D","answer":["vii"],"explain":"Paragraph D traces the fall in energy use and explains that 'physics imposes a floor' on further savings."},{"n":18,"text":"Paragraph E","answer":["ix"],"explain":"Paragraph E discusses operating costs, prices per cubic metre, distribution costs and capital risk."},{"n":19,"text":"Paragraph F","answer":["iii"],"explain":"Paragraph F is about brine, the main waste product, and its environmental damage."},{"n":20,"text":"Paragraph G","answer":["x"],"explain":"Paragraph G outlines new technologies but concludes that desalination is 'unlikely to resolve water scarcity on its own'."}]},{"type":"sentence_completion","instructions":"Questions 21–24\nComplete the sentences below.\nChoose NO MORE THAN TWO WORDS from the passage for each answer.\nWrite your answers in boxes 21–24 on your answer sheet.","questions":[{"n":21,"text":"In multi-stage flash distillation, water turns to steam in each chamber because its ______ is lowered as the pressure drops.","answer":["boiling point"],"explain":"Paragraph B states that 'the boiling point of water falls as pressure decreases'."},{"n":22,"text":"The build-up of sand, algae and organic matter on a membrane is known as ______.","answer":["fouling"],"explain":"Paragraph C says this accumulation is 'a problem engineers call fouling'."},{"n":23,"text":"Energy recovery devices use pressure remaining in the ______ to help pressurise incoming seawater.","answer":["concentrated brine","brine"],"explain":"Paragraph D explains that the device captures the pressure 'still held by the concentrated brine'."},{"n":24,"text":"When the drought in Australia ended, some new plants were placed on ______.","answer":["standby"],"explain":"Paragraph E says expensive facilities 'were placed on standby for years' once the rains returned."}]},{"type":"mcq","instructions":"Questions 25–26\nChoose the correct letter, A, B, C or D.\nWrite the correct letter in boxes 25 and 26 on your answer sheet.","questions":[{"n":25,"text":"What does the writer suggest about future reductions in the energy used by reverse osmosis?","choices":["A They will depend mainly on the development of more powerful pumps.","B They are likely to be limited because plants are already near a physical minimum.","C They will make desalination cheaper than conventional water supplies.","D They will require operating pressures higher than 80 bar."],"answer":["B"],"explain":"Paragraph D notes that the best plants are 'within a few multiples' of the theoretical limit, so 'further large savings are unlikely'."},{"n":26,"text":"Which of the following is mentioned as a possible use of brine?","choices":["A irrigating salt-tolerant crops","B cooling nearby power stations","C extracting valuable minerals","D diluting treated wastewater"],"answer":["C"],"explain":"Paragraph G mentions treating brine as a resource 'by extracting valuable minerals such as magnesium and lithium'."}]}]},{"title":"Do Museums Still Matter?","intro":"You should spend about 20 minutes on Questions 27–40, which are based on Reading Passage 3 below.","paragraphs":[{"label":"A","text":"Every few years, a confident prediction circulates that the museum is finished. The argument runs roughly as follows: when almost any painting, fossil or manuscript can be summoned onto a screen in seconds why would anyone queue, pay and shuffle through crowded galleries to glimpse the original over a stranger's shoulder? The question deserves a serious answer, not least because many institutions have spent the past two decades behaving as though they half-believed it themselves. Yet the evidence of recent years suggests that the prophecy has things almost exactly backwards."},{"label":"B","text":"Consider digitisation first. Major collections have photographed and catalogued millions of objects, and several have taken the once-radical step of releasing high-resolution images free of copyright restrictions. The Rijksmuseum in Amsterdam, which began making hundreds of thousands of images freely downloadable in the early 2010s, is perhaps the best-known example. Advocates of open access argue that such images belong to the public whose taxes and donations paid for the preservation of the originals, and that they enable scholarship, education and creative reuse. They are surely right about that. What they sometimes imply, however, is that the digital copy can stand in for the object, and that is far more questionable. A photograph flattens texture, disguises scale and detaches the object from the physical space that lends it meaning. To stand beneath a whale skeleton or beside a canvas several metres wide is a bodily experience, not merely a visual one, and no quantity of pixels will reproduce it."},{"label":"C","text":"The closures of 2020, when the Covid-19 pandemic shut museums across the world for months, offered something close to a natural experiment. Institutions rushed their collections online, and virtual tours attracted large audiences in the first weeks. But interest in many of these offerings faded quickly, while attendance at reopened museums steadily returned. Whatever else the episode demonstrated, it hardly suggests that the public regarded screens as an adequate substitute for the real thing."},{"label":"D","text":"The more difficult challenge to the museum comes not from technology but from history. Many of the great European and North American collections were assembled during periods of colonial expansion, and a significant number of objects were acquired through conquest. The Benin Bronzes, thousands of plaques and sculptures seized by British forces from the Kingdom of Benin, in present-day Nigeria, in 1897, have become the emblematic case. In 2022 Germany transferred ownership of more than a thousand such objects to Nigeria, and several British universities and smaller museums have made comparable returns. Representatives of source communities argue that these objects are not simply works of art but carriers of history and collective identity, and that their continued display abroad prolongs the injustice of their removal."},{"label":"E","text":"Defenders of the so-called universal museum respond that great encyclopaedic collections allow visitors to compare cultures side by side, and that dispersing them would impoverish understanding everywhere. Some also point to legal constraints: national museums in Britain, for instance, are largely prohibited by statute from removing items from their collections. I find the first argument more persuasive than the second. A law is a choice made by a legislature and can be amended by one; it explains a museum's position but cannot justify it. The comparative argument has genuine force, yet it is weakened when the communities whose heritage is being compared are given no say in the matter. My own view is that claims should be judged individually, on the evidence of how each object was acquired, rather than settled by a blanket policy in either direction, and that where an object was plainly looted, the presumption should favour return. Long-term loans, shared custody and joint research can then preserve much of what the universal museum claims to offer."},{"label":"F","text":"A third set of questions concerns what visitors actually do. Researchers who have observed behaviour in galleries have repeatedly found that people spend remarkably little time in front of individual works; one frequently cited study at a major American art museum found that visitors looked at each painting for less than half a minute on average. Some commentators treat such figures as proof that museums have become places of distracted consumption. Specialists in visitor studies tend to be more cautious. They note that people combine many brief glances with occasional long engagements, and that a visit is shaped as much by companions, fatigue and the layout of rooms as by the exhibits themselves."},{"label":"G","text":"Here, in my view, museums have sometimes responded poorly. Chasing attendance figures, some have filled their halls with immersive projections and photogenic installations designed primarily to be shared online. There is nothing inherently wrong with spectacle, and such exhibitions undoubtedly draw in new audiences. But an institution that competes with entertainment venues on their own terms is likely to lose, and in doing so it neglects the one thing it can offer that nothing else can: the authentic object, encountered slowly. More seating, fewer works on display, quieter hours and labels that pose questions rather than merely supply facts would do more to deepen engagement than yet another interactive screen."},{"label":"H","text":"So do museums still matter? They matter precisely because so much else has become reproducible. In an age of infinite copies, the original acquires a new kind of value: as evidence, as witness, and as the focus of a shared physical encounter. But that value rests on trust, and trust depends on candour about how collections were formed. The museums that will flourish are not those that simply digitise most energetically, but those that combine open access with a willingness to return what was taken and a renewed confidence in the slow, irreplaceable act of looking."}],"groups":[{"type":"ynng","instructions":"Questions 27–31\nDo the following statements agree with the claims of the writer in Reading Passage 3?\nIn boxes 27–31 on your answer sheet, write\nYES if the statement agrees with the claims of the writer\nNO if the statement contradicts the claims of the writer\nNOT GIVEN if it is impossible to say what the writer thinks about this","questions":[{"n":27,"text":"Some museums have acted as if they partly accepted that they might become obsolete.","answer":["yes"],"explain":"Paragraph A says many institutions have behaved 'as though they half-believed' the prediction of their decline."},{"n":28,"text":"Releasing free online images has reduced the number of people visiting the Rijksmuseum.","answer":["not given"],"explain":"Paragraph B mentions the Rijksmuseum's image release but gives no information about its effect on visitor numbers."},{"n":29,"text":"A high-quality photograph can convey the scale of an object as effectively as the original.","answer":["no"],"explain":"Paragraph B states that a photograph 'disguises scale' and cannot reproduce the bodily experience of the object."},{"n":30,"text":"Legal restrictions provide museums with a valid justification for refusing to return objects.","answer":["no"],"explain":"Paragraph E argues that a law 'explains a museum's position but cannot justify it'."},{"n":31,"text":"Museums could improve visitors' engagement by displaying fewer works.","answer":["yes"],"explain":"Paragraph G recommends 'fewer works on display' among measures that would deepen engagement."}]},{"type":"mcq","instructions":"Questions 32–35\nChoose the correct letter, A, B, C or D.\nWrite the correct letter in boxes 32–35 on your answer sheet.","questions":[{"n":32,"text":"What does the writer conclude from the museum closures of 2020?","choices":["A Virtual tours permanently enlarged museum audiences.","B Museums had been too slow to put their collections online.","C The public did not regard online access as a replacement for visiting.","D Museums should stop offering virtual tours."],"answer":["C"],"explain":"Paragraph C concludes that the episode 'hardly suggests that the public regarded screens as an adequate substitute'."},{"n":33,"text":"Why does the writer refer to the Benin Bronzes?","choices":["A to illustrate objects that were legally purchased by collectors","B as the most prominent example of objects taken by force","C to show that Britain's national museums have returned their collections","D to argue that only governments should make repatriation claims"],"answer":["B"],"explain":"Paragraph D calls the Bronzes, 'seized by British forces', 'the emblematic case' of objects acquired through conquest."},{"n":34,"text":"What is the writer's position on the return of objects?","choices":["A All objects acquired during colonial periods should be returned.","B Universal museums should reject claims in order to keep collections whole.","C Each claim should be assessed on its own evidence, with return favoured for looted items.","D Objects should be shared only through temporary loans."],"answer":["C"],"explain":"Paragraph E states that claims 'should be judged individually' and that for plainly looted objects 'the presumption should favour return'."},{"n":35,"text":"In paragraph G, the writer criticises some museums for","choices":["A trying to compete with entertainment venues.","B refusing to stage large-scale exhibitions.","C removing seating from their galleries.","D discouraging visitors from taking photographs."],"answer":["A"],"explain":"Paragraph G warns that an institution 'that competes with entertainment venues on their own terms is likely to lose'."}]},{"type":"matching_features","instructions":"Questions 36–40\nLook at the following statements (Questions 36–40) and the list of groups below.\nMatch each statement with the correct group, A–D.\nWrite the correct letter, A–D, in boxes 36–40 on your answer sheet.\nNB You may use any letter more than once.","options":["A advocates of open access","B representatives of source communities","C defenders of the universal museum","D specialists in visitor studies"],"questions":[{"n":36,"text":"Certain objects are closely bound up with a people's sense of who they are.","answer":["B"],"explain":"Paragraph D reports that representatives of source communities see the objects as 'carriers of history and collective identity'."},{"n":37,"text":"Bringing together objects from many cultures helps people to make comparisons.","answer":["C"],"explain":"Paragraph E says defenders of the universal museum argue that collections 'allow visitors to compare cultures side by side'."},{"n":38,"text":"Factors unrelated to the exhibits influence how people experience a visit.","answer":["D"],"explain":"Paragraph F notes visitor studies specialists' view that a visit is shaped by 'companions, fatigue and the layout of rooms'."},{"n":39,"text":"The public has a right to images of objects whose care it has funded.","answer":["A"],"explain":"Paragraph B says advocates of open access argue such images 'belong to the public whose taxes and donations paid for' preservation."},{"n":40,"text":"Keeping certain objects on display in another country extends an earlier wrong.","answer":["B"],"explain":"Paragraph D reports the source communities' view that continued display abroad 'prolongs the injustice of their removal'."}]}]}]}];
const W1=[{"id":"W1-1","type":"bar","title":"Leisure Time by Age Group","prompt":"The bar chart below shows the average number of hours per week that people in five age groups spent on four leisure activities in one country.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Average weekly hours spent on leisure activities, by age group","unit":"hours per week","categories":["16–24","25–34","35–49","50–64","65+"],"series":[{"name":"Watching TV","values":[9,10,12,15,21]},{"name":"Using social media","values":[18,13,8,5,2]},{"name":"Sport and exercise","values":[6,5,4,3,3]},{"name":"Reading","values":[2,2,3,5,7]}]},"features":["TV and reading increased with age, while social media and sport decreased.","Social media was the main pastime of the two youngest groups; TV was the main pastime from age 35 upwards.","Over-65s watched 21 hours of TV a week, compared with 9 hours for 16–24-year-olds.","Social media fell from 18 hours (16–24) to just 2 hours (65+).","Sport stayed low throughout (6 to 3 hours), while reading rose from 2 to 7 hours."],"model":"The bar chart compares how many hours per week people in five age groups spent on four leisure pursuits: watching television, using social media, doing sport and reading.\n\nOverall, television viewing and reading rose steadily with age, whereas social media use and physical activity declined. Social media was the most time-consuming pastime for the two youngest groups, whereas television dominated among people aged 35 and over.\n\nLooking first at the activities favoured by older people, those aged 65 and over watched television for 21 hours a week, more than double the 9 hours recorded for 16-to-24-year-olds. Figures for the intermediate groups climbed gradually from 10 to 15 hours. Reading followed a similar, though far smaller, upward pattern, increasing from just 2 hours among the two youngest groups to 7 hours among the oldest.\n\nBy contrast, social media accounted for 18 hours a week for the youngest respondents and 13 hours for those aged 25 to 34, exceeding television in both groups, but this figure fell sharply with each successive group, reaching a mere 2 hours for the over-65s. Time devoted to sport and exercise was modest throughout, edging down from 6 hours to 3 hours, with the two oldest groups level at this lower figure.","overview":["TV and reading increased with age, while social media and sport decreased.","Social media was the main pastime of the two youngest groups; TV was the main pastime from age 35 upwards."],"details":["Over-65s watched 21 hours of TV a week, compared with 9 hours for 16–24-year-olds.","Social media fell from 18 hours (16–24) to just 2 hours (65+).","Sport stayed low throughout (6 to 3 hours), while reading rose from 2 to 7 hours."]},{"id":"W1-2","type":"line","title":"Visitors to City Attractions","prompt":"The graph below shows the number of visitors to four tourist attractions in a European city between 2000 and 2020.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Annual visitors to four city attractions, 2000–2020","unit":"visitors (thousands)","categories":["2000","2004","2008","2012","2016","2020"],"series":[{"name":"Science museum","values":[420,460,510,580,650,310]},{"name":"Art gallery","values":[600,560,520,540,610,280]},{"name":"Castle","values":[350,380,400,380,370,150]},{"name":"Aquarium","values":[120,180,300,450,700,340]}]},"features":["The aquarium and the science museum grew strongly until 2016, while the art gallery and the castle stayed fairly stable.","All four attractions fell sharply between 2016 and 2020, and the aquarium ended as the most visited.","Aquarium: 120,000 (2000) → 700,000 at its peak (2016) → 340,000 (2020).","Science museum: 420,000 → 650,000, then down to 310,000.","The art gallery led in 2000 with 600,000; the castle ended lowest at 150,000."],"model":"The line graph illustrates changes in the number of people visiting four attractions in a European city between 2000 and 2020.\n\nOverall, the science museum and especially the aquarium grew considerably in popularity over the first sixteen years, while visits to the art gallery and the castle remained relatively stable. However, attendance at all four attractions fell by around half or more in the final four years, and by 2020 the aquarium had become the most visited.\n\nThe aquarium recorded the most dramatic growth, its visitor numbers rising almost sixfold from 120,000 in 2000 to a peak of 700,000 in 2016, overtaking every other attraction. The science museum also expanded steadily, from 420,000 to 650,000 over the same period. In 2020, however, these figures dropped to 340,000 and 310,000 respectively.\n\nThe art gallery began as the leading attraction with 600,000 visitors, but this fell to 520,000 by 2008 before recovering to 610,000 in 2016. Attendance at the castle fluctuated narrowly between 350,000 and 400,000. Both then experienced steep falls in 2020, to 280,000 and just 150,000 respectively.","overview":["The aquarium and the science museum grew strongly until 2016, while the art gallery and the castle stayed fairly stable.","All four attractions fell sharply between 2016 and 2020, and the aquarium ended as the most visited."],"details":["Aquarium: 120,000 (2000) → 700,000 at its peak (2016) → 340,000 (2020).","Science museum: 420,000 → 650,000, then down to 310,000.","The art gallery led in 2000 with 600,000; the castle ended lowest at 150,000."]},{"id":"W1-3","type":"pie","title":"Household Energy Use","prompt":"The pie charts below show how energy was used in homes in one country in 2000 and 2020.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"pies":[{"title":"2000","slices":[{"label":"Space heating","value":50},{"label":"Water heating","value":20},{"label":"Lighting","value":10},{"label":"Cooking","value":8},{"label":"Appliances and electronics","value":10},{"label":"Cooling","value":2}]},{"title":"2020","slices":[{"label":"Space heating","value":40},{"label":"Water heating","value":18},{"label":"Lighting","value":4},{"label":"Cooking","value":6},{"label":"Appliances and electronics","value":25},{"label":"Cooling","value":7}]}],"title":"Household energy use by purpose, 2000 and 2020 (%)"},"features":["Space heating was the largest use in both years, although its share fell.","Appliances and electronics grew the most, while lighting shrank the most.","Space heating: 50% → 40%.","Appliances and electronics: 10% → 25%, becoming the second-largest use.","Lighting: 10% → 4%; cooling: 2% → 7%."],"model":"The two pie charts compare how household energy was used in a particular country in 2000 and 2020, broken down into six categories.\n\nOverall, space heating remained the largest single use of domestic energy in both years, although its share declined noticeably. The most striking change was the growth in energy consumed by appliances and electronics, while lighting accounted for a considerably smaller proportion by the end of the period.\n\nIn 2000, half of all household energy went on space heating, but this had dropped to 40% two decades later. Water heating was the second-largest category in 2000 at 20%, and it changed little, slipping to 18%. Similarly, the share used for cooking fell only slightly, from 8% to 6%.\n\nBy contrast, the proportion used by appliances and electronics increased two and a half times, from 10% to 25%, making it the second most significant category in 2020. Cooling also became more prominent, rising from a negligible 2% to 7%. Meanwhile, lighting was the only category whose share fell by more than half, decreasing from 10% to just 4%, perhaps reflecting the spread of more efficient bulbs.","overview":["Space heating was the largest use in both years, although its share fell.","Appliances and electronics grew the most, while lighting shrank the most."],"details":["Space heating: 50% → 40%.","Appliances and electronics: 10% → 25%, becoming the second-largest use.","Lighting: 10% → 4%; cooling: 2% → 7%."]},{"id":"W1-4","type":"table","title":"Cycling to Work","prompt":"The table below shows the percentage of adults in six countries who cycled to work at least once a week in 2010 and 2020.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Adults cycling to work at least once a week, 2010 and 2020","unit":"%","columns":["Country","2010","2020"],"rows":[["Netherlands",36,41],["Denmark",32,38],["Germany",11,15],["United Kingdom",4,5],["Spain",2,6],["USA",1,1]]},"features":["The Netherlands and Denmark had far higher cycling rates than the other four countries.","Rates rose or stayed the same in every country; none fell.","The Netherlands was highest: 36% → 41%.","Denmark had the biggest rise: 32% → 38%.","Spain tripled (2% → 6%), while the USA stayed at 1%."],"model":"The table shows the proportion of adults in six countries who cycled to work at least once a week in 2010 and 2020.\n\nOverall, cycling to work was far more common in the Netherlands and Denmark than elsewhere, and the figure either rose or held steady in every country over the decade. Spain recorded the most notable relative growth, whereas the level in the USA remained static.\n\nThe Netherlands had the highest rate in both years, increasing from 36% to 41%. Denmark followed closely, with its share climbing from 32% to 38%, the largest absolute rise of any country. Germany occupied a middle position, although at 11% in 2010 and 15% in 2020 its figures were still well under half those of the two leaders.\n\nCommuting by bicycle was much less widespread in the remaining three countries. In the UK, just 4% of adults cycled to work in 2010, edging up to only 5% ten years later. Spain began from an even lower base of 2%, but this tripled to 6%, overtaking the UK. In the USA, by contrast, the proportion stood at a mere 1% in both years.","overview":["The Netherlands and Denmark had far higher cycling rates than the other four countries.","Rates rose or stayed the same in every country; none fell."],"details":["The Netherlands was highest: 36% → 41%.","Denmark had the biggest rise: 32% → 38%.","Spain tripled (2% → 6%), while the USA stayed at 1%."]},{"id":"W1-5","type":"process","title":"Composting Food Waste","prompt":"The diagram below shows how household food waste is turned into compost.\n\nSummarise the information by selecting and reporting the main features.\n\nWrite at least 150 words.","chart":{"title":"Producing compost from household food waste","steps":["Food waste placed in kitchen caddies","Collected and taken to composting facility","Plastic and metal removed","Waste shredded","Mixed with garden waste","Heated in tunnels (60°C, 2 weeks)","Turned and matured outdoors (8 weeks)","Screened to remove large particles","Bagged and sold to farmers and gardeners"]},"features":["The process is linear, from household food waste to compost sold to farmers and gardeners.","It has three main phases: collection and preparation, decomposition, and final processing for sale.","Plastic and metal are removed before the waste is shredded and mixed with garden waste.","Decomposition: 2 weeks in heated tunnels at 60°C, then 8 weeks maturing outdoors.","Large particles are screened out before the compost is bagged and sold."],"model":"The diagram illustrates the stages by which household food waste is converted into compost suitable for agricultural and garden use.\n\nOverall, this is a linear process that begins with the collection of food scraps from homes and ends with the sale of finished compost. It can be divided into three main phases: collection and preparation, a lengthy period of decomposition, and final processing for sale.\n\nInitially, residents place their food waste in small kitchen caddies, which are collected and transported to a composting facility. On arrival, any plastic or metal items are removed, after which the remaining material is shredded into smaller pieces. This shredded waste is then combined with garden waste.\n\nAt the next stage, the mixture is piled into heated tunnels, where it is kept at approximately 60°C for two weeks in order to accelerate decomposition. It is subsequently moved outdoors, turned regularly and left to mature for a further eight weeks. Finally, the compost is screened to remove any large particles before being bagged and sold to farmers and gardeners.","overview":["The process is linear, from household food waste to compost sold to farmers and gardeners.","It has three main phases: collection and preparation, decomposition, and final processing for sale."],"details":["Plastic and metal are removed before the waste is shredded and mixed with garden waste.","Decomposition: 2 weeks in heated tunnels at 60°C, then 8 weeks maturing outdoors.","Large particles are screened out before the compost is bagged and sold."]},{"id":"W1-6","type":"bar","title":"Café Hot Drink Sales","prompt":"The chart below shows the average number of hot drinks of five types sold each week by a café chain in winter, spring and summer.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Average weekly hot drink sales by season","unit":"cups sold per week (thousands)","categories":["Filter coffee","Latte","Cappuccino","Tea","Hot chocolate"],"series":[{"name":"Winter","values":[14,22,16,12,18]},{"name":"Spring","values":[12,19,14,10,8]},{"name":"Summer","values":[9,15,11,7,3]}]},"features":["Sales of every drink were highest in winter and lowest in summer.","Latte was the best seller in every season, and hot chocolate changed the most.","Latte: 22,000 cups a week in winter → 15,000 in summer.","Hot chocolate: 18,000 → 8,000 → 3,000 cups.","Tea was the lowest in winter (12,000) and fell to 7,000 in summer."],"model":"The bar chart compares the average number of cups of five hot drinks sold each week by a café chain in winter, spring and summer.\n\nOverall, sales of every drink were highest in winter and lowest in summer, with lattes the best-selling option in all three seasons. Hot chocolate showed by far the greatest seasonal variation, while the decline for the other drinks was much more gradual.\n\nLatte was clearly the most popular drink, with weekly sales of 22,000 cups in winter, falling to 19,000 in spring and 15,000 in summer. Cappuccino and filter coffee followed a similar downward pattern but at lower levels, with cappuccino dropping from 16,000 to 11,000 cups and filter coffee from 14,000 to 9,000. Tea sales were modest throughout, declining from 12,000 to 7,000 cups, and in winter it was the least popular choice.\n\nHot chocolate, however, was highly seasonal. It was the second best-selling drink in winter at 18,000 cups per week, but this more than halved to 8,000 in spring before plummeting to just 3,000 in summer, the lowest figure for any drink in any season.","overview":["Sales of every drink were highest in winter and lowest in summer.","Latte was the best seller in every season, and hot chocolate changed the most."],"details":["Latte: 22,000 cups a week in winter → 15,000 in summer.","Hot chocolate: 18,000 → 8,000 → 3,000 cups.","Tea was the lowest in winter (12,000) and fell to 7,000 in summer."]},{"id":"W1-7","type":"line","title":"Electricity Generation Sources","prompt":"The graph below shows the proportion of electricity generated from four sources in one country between 2000 and 2024.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Share of electricity generation by source, 2000–2024","unit":"%","categories":["2000","2004","2008","2012","2016","2020","2024"],"series":[{"name":"Coal","values":[55,52,46,38,24,14,6]},{"name":"Gas","values":[30,33,37,40,42,38,32]},{"name":"Renewables","values":[5,6,9,14,24,36,48]},{"name":"Nuclear","values":[10,9,8,8,10,12,14]}]},"features":["Coal and renewables moved in opposite directions: coal fell from the largest source to the smallest, and renewables rose to become the largest.","Gas rose and then fell, while nuclear stayed small and fairly stable.","Coal: 55% (2000) → 6% (2024).","Renewables: 5% → 48%, drawing level with coal at 24% in 2016.","Gas peaked at 42% in 2016; nuclear stayed between 8% and 14%."],"model":"The line graph shows how the share of electricity generated from four sources in one country changed between 2000 and 2024.\n\nOverall, coal and renewables followed opposite trajectories, with coal falling from the leading source to the least significant, while renewables rose to become dominant. Gas grew and then declined, whereas nuclear power contributed a relatively small and stable proportion throughout.\n\nIn 2000, coal produced more than half of the country's electricity, at 55%. This figure declined gradually to 46% by 2008 before falling much more steeply, reaching just 6% in 2024. Renewables, by contrast, accounted for only 5% at the start of the period, but their share accelerated after 2008, drawing level with coal at 24% in 2016 and climbing to 48% by the final year.\n\nGas was the second-largest source in 2000 at 30%, and it rose steadily to a peak of 42% in 2016, having become the main source of electricity in 2012. It retained this position until 2020 before falling back to 32% in 2024. Nuclear generation remained between 8% and 14% over the entire period, ending at its highest level.","overview":["Coal and renewables moved in opposite directions: coal fell from the largest source to the smallest, and renewables rose to become the largest.","Gas rose and then fell, while nuclear stayed small and fairly stable."],"details":["Coal: 55% (2000) → 6% (2024).","Renewables: 5% → 48%, drawing level with coal at 24% in 2016.","Gas peaked at 42% in 2016; nuclear stayed between 8% and 14%."]},{"id":"W1-8","type":"bar","title":"Kazakhstan Wheat Exports","prompt":"The chart below shows the quantity of wheat exported by Kazakhstan to six countries in 2015, 2019 and 2023.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Kazakhstan's wheat exports by destination, 2015, 2019 and 2023","unit":"million tonnes","categories":["Uzbekistan","Afghanistan","Tajikistan","China","Iran","Turkey"],"series":[{"name":"2015","values":[2.1,1.9,0.8,0.2,0.6,0.4]},{"name":"2019","values":[2.6,1.4,0.9,0.5,0.3,0.6]},{"name":"2023","values":[3.4,1.6,1.1,1.3,0.9,0.3]}]},"features":["Uzbekistan was the largest market in every year, and its lead grew.","Exports to China grew the fastest, while Turkey was a small and shrinking market.","Uzbekistan: 2.1 → 2.6 → 3.4 million tonnes.","China: 0.2 → 1.3 million tonnes, overtaking Tajikistan (1.1) by 2023.","Afghanistan stayed second (1.9 → 1.4 → 1.6); Turkey ended lowest at 0.3."],"model":"The bar chart compares the quantity of wheat that Kazakhstan exported to six countries in 2015, 2019 and 2023, measured in millions of tonnes.\n\nOverall, Uzbekistan was by far the largest buyer of Kazakh wheat in all three years, and its lead widened over time. Exports to China showed the most rapid growth, whereas shipments to Turkey were small and had declined by the end of the period.\n\nUzbekistan imported 2.1 million tonnes in 2015, and this figure rose steadily to 2.6 million in 2019 and 3.4 million in 2023. Afghanistan was the second most important market, although its purchases dipped from 1.9 million tonnes to 1.4 million before partially recovering to 1.6 million. Tajikistan's imports increased modestly but consistently, from 0.8 to 1.1 million tonnes.\n\nAmong the remaining destinations, China stood out: exports there rose more than sixfold, from just 0.2 million tonnes in 2015 to 1.3 million in 2023, overtaking Tajikistan. Iran's figures fluctuated, halving to 0.3 million tonnes in 2019 before tripling to 0.9 million. Turkey, by contrast, received between 0.3 and 0.6 million tonnes each year, ending as the smallest destination.","overview":["Uzbekistan was the largest market in every year, and its lead grew.","Exports to China grew the fastest, while Turkey was a small and shrinking market."],"details":["Uzbekistan: 2.1 → 2.6 → 3.4 million tonnes.","China: 0.2 → 1.3 million tonnes, overtaking Tajikistan (1.1) by 2023.","Afghanistan stayed second (1.9 → 1.4 → 1.6); Turkey ended lowest at 0.3."]},{"id":"W1-9","type":"bar","title":"Electric vehicle charging points in five countries","prompt":"The bar chart below shows the number of public charging points for electric vehicles in five countries in 2016, 2020 and 2024.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Public EV charging points, 2016, 2020 and 2024","unit":"charging points (thousands)","categories":["Denmark","Spain","Canada","Japan","Poland"],"series":[{"name":"2016","values":[3,5,6,21,1]},{"name":"2020","values":[9,12,14,29,3]},{"name":"2024","values":[24,38,30,33,15]}]},"features":["The number of charging points rose in all five countries.","Japan started far ahead but grew slowly, Spain had the most by 2024, and Poland always had the fewest.","Japan: 21,000 (2016) → 33,000 (2024).","Spain: 5,000 → 38,000, with the fastest growth after 2020.","Poland: 1,000 → 15,000, still the lowest."],"model":"The bar chart compares the number of public charging points for electric vehicles in five countries in 2016, 2020 and 2024, measured in thousands.\n\nOverall, provision expanded in every country over the eight-year period. Japan began with by far the largest network, but its growth was modest, and by 2024 it had been overtaken by Spain, which ended the period with the most charging points. Poland consistently had the fewest.\n\nIn 2016, Japan had 21,000 charging points, more than three times as many as any other country. Canada and Spain followed with 6,000 and 5,000 respectively, while Denmark had just 3,000 and Poland only 1,000. By 2020, Japan's figure had risen to 29,000, whereas the other four nations still had between 3,000 and 14,000.\n\nThe most dramatic changes occurred between 2020 and 2024. Spain's network more than tripled to 38,000, and Denmark's rose from 9,000 to 24,000. Canada also roughly doubled its total, reaching 30,000. Poland's figure increased fivefold to 15,000, a fifteen-fold rise over the whole period, although it remained the lowest. By contrast, Japan added only 4,000 points, reaching 33,000 and slipping to second place.","overview":["The number of charging points rose in all five countries.","Japan started far ahead but grew slowly, Spain had the most by 2024, and Poland always had the fewest."],"details":["Japan: 21,000 (2016) → 33,000 (2024).","Spain: 5,000 → 38,000, with the fastest growth after 2020.","Poland: 1,000 → 15,000, still the lowest."]},{"id":"W1-10","type":"bar","title":"Household water use by purpose","prompt":"The bar chart below shows the average amount of water used per person per day for different purposes in a European city in 2000 and 2025.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Daily water use per person by purpose, 2000 and 2025","unit":"litres","categories":["Toilet flushing","Showering and bathing","Laundry","Dishwashing","Garden watering","Drinking and cooking"],"series":[{"name":"2000","values":[48,40,30,15,20,12]},{"name":"2025","values":[28,46,18,10,9,13]}]},"features":["Water use fell for almost every purpose between 2000 and 2025.","Showering and bathing rose and replaced toilet flushing as the largest use.","Toilet flushing: 48 → 28 litres.","Showering and bathing: 40 → 46 litres.","Garden watering more than halved (20 → 9 litres); drinking and cooking barely changed (12 → 13)."],"model":"The bar chart illustrates how much water an average resident of a European city used each day for six different purposes in 2000 and 2025.\n\nOverall, the amount of water used fell for almost every purpose over the period. The notable exception was showering and bathing, which rose to replace toilet flushing as the single largest use of water.\n\nIn 2000, toilet flushing accounted for the greatest amount, at 48 litres, followed by showering and bathing at 40 litres and laundry at 30 litres. By 2025, however, the figure for toilets had dropped sharply to 28 litres, and laundry had fallen to 18 litres. Meanwhile, showering and bathing increased by six litres to 46 litres, overtaking toilet flushing by a wide margin.\n\nAmong the smaller categories, garden watering saw the most dramatic decline, falling by more than half from 20 to nine litres. Dishwashing also decreased, from 15 to ten litres. In contrast, the amount used for drinking and cooking was virtually stable, edging up from 12 to 13 litres.","overview":["Water use fell for almost every purpose between 2000 and 2025.","Showering and bathing rose and replaced toilet flushing as the largest use."],"details":["Toilet flushing: 48 → 28 litres.","Showering and bathing: 40 → 46 litres.","Garden watering more than halved (20 → 9 litres); drinking and cooking barely changed (12 → 13)."]},{"id":"W1-11","type":"line","title":"Passenger numbers at three regional airports","prompt":"The line graph below shows the number of passengers using three regional airports in one country between 2000 and 2025.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Annual passengers at three regional airports, 2000–2025","unit":"millions","categories":["2000","2005","2010","2015","2020","2025"],"series":[{"name":"Northgate","values":[4.2,5.8,7.5,9.6,3.1,10.4]},{"name":"Eastport","values":[8.5,8.9,8.1,7.4,2.6,6.8]},{"name":"Lakeside","values":[0.5,1.2,3.4,6.2,2,8.9]}]},"features":["Northgate and Lakeside grew strongly, while Eastport slowly declined.","All three airports dropped sharply in 2020 and recovered by 2025, when Northgate was the busiest and Eastport the quietest.","Eastport was the busiest in 2000 (8.5 million) but had only 6.8 million in 2025.","Northgate overtook Eastport between 2010 and 2015 and reached 10.4 million in 2025.","Lakeside rose from 0.5 to 8.9 million; in 2020 all three fell to between 2.0 and 3.1 million."],"model":"The line graph shows changes in the annual number of passengers, in millions, at three regional airports in a particular country over a 25-year period from 2000.\n\nOverall, Northgate and Lakeside saw substantial growth, whereas Eastport became gradually less busy. All three airports suffered a dramatic drop in 2020, but traffic had largely recovered by 2025, when Northgate was the busiest airport and Eastport the quietest.\n\nIn 2000, Eastport was the most heavily used airport, handling 8.5 million passengers, roughly double Northgate's 4.2 million, while Lakeside served only half a million. Eastport's figure peaked at 8.9 million in 2005 and then declined slowly to 7.4 million by 2015. Northgate, by contrast, grew steadily, from 7.5 million in 2010 to 9.6 million in 2015, overtaking Eastport between these two years.\n\nLakeside expanded more rapidly than either competitor, rising more than twelve-fold to 6.2 million by 2015. In 2020, however, passenger numbers collapsed at all three airports, falling to between 2.0 and 3.1 million. By 2025, Northgate had recovered to a new high of 10.4 million and Lakeside had climbed to 8.9 million, w
