<!doctype html><html><head><script src="../../if-runtime.js"></script><link rel="manifest" href="../../manifest.webmanifest"><link rel="apple-touch-icon" href="../../brand/apple-touch-icon.png"><meta name="theme-color" content="#0B2545"><style>select{max-width:100%}</style><link rel="icon" href="../../brand/favicon-64.png"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IF IELTS Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: sticky midnight-navy masthead with crest and skill tabs; each skill is a working studio below — rail + workspace on desktop, stacked on phones. */
:root{
  --navy:#0B2250; --band:#0B2250; --band-fg:#FFFFFF; --band-muted:#B9C6E2;
  --gold:#B8862E; --gold-hi:#D9A94A; --gold-soft:#F7EDD8;
  --ice:#E8EFF8; --bg:#F5F7FB; --surface:#FFFFFF; --fg:#13203A; --muted:#56627D; --line:#D8E0EC;
  --ok:#1D7A4C; --ok-soft:#DFF2E7; --bad:#B0372F; --bad-soft:#F9E2DF;
  --c1:#0B2250; --c2:#C9983A; --c3:#4D88C7; --c4:#8E9AB3; --c5:#2F7D6E; --c6:#B3546A; --c7:#7A5C99; --c8:#A6A35A;
  --m-ground:#F3F1E8; --m-edge:#8A93A8; --m-bldg:#2B3F6B; --m-bldg-t:#FFFFFF; --m-park:#BFDDB0; --m-trees:#8DBF7E; --m-tree-dot:#4E8A46; --m-water:#A9CDEB; --m-beach:#F1DFA8; --m-field:#DCE8B9; --m-car:#D9DCE3; --m-road:#FFFFFF; --m-road-edge:#9AA3B5; --m-road-t:#3A4560; --m-path:#9A6B2F; --m-text:#1E2A44;
  --f-head:Cambria,"Caladea",Georgia,"Times New Roman",serif;
  --f-body:Calibri,"Carlito","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:Consolas,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --band:#071736; --gold:#E0B25A; --gold-hi:#E8BF6C; --gold-soft:#3A2E17;
  --ice:#16264A; --bg:#09122A; --surface:#101C38; --fg:#E7ECF6; --muted:#9EAAC5; --line:#25365E;
  --ok:#62C993; --ok-soft:#163A29; --bad:#F08A7E; --bad-soft:#3E1E1C;
  --c1:#8FB3FF; --c2:#E0B25A; --c3:#6FD1C2; --c4:#C9A2F0; --c5:#F29A73; --c6:#B9C3D9; --c7:#E58FB5; --c8:#C9C46A; --m-ground:#1A2647; --m-edge:#5C6A8E; --m-bldg:#C9D6F2; --m-bldg-t:#0B1530; --m-park:#2F5A3A; --m-trees:#2E6B3C; --m-tree-dot:#7CC27F; --m-water:#1F4E7A; --m-beach:#6B5A2C; --m-field:#3D4A2A; --m-car:#3A4566; --m-road:#5A6585; --m-road-edge:#8793B3; --m-road-t:#F0F3FA; --m-path:#E0B25A; --m-text:#EEF2FA; color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#071736; --gold:#E0B25A; --gold-hi:#E8BF6C; --gold-soft:#3A2E17;
  --ice:#16264A; --bg:#09122A; --surface:#101C38; --fg:#E7ECF6; --muted:#9EAAC5; --line:#25365E;
  --ok:#62C993; --ok-soft:#163A29; --bad:#F08A7E; --bad-soft:#3E1E1C;
  --c1:#8FB3FF; --c2:#E0B25A; --c3:#6FD1C2; --c4:#C9A2F0; --c5:#F29A73; --c6:#B9C3D9; --c7:#E58FB5; --c8:#C9C46A; --m-ground:#1A2647; --m-edge:#5C6A8E; --m-bldg:#C9D6F2; --m-bldg-t:#0B1530; --m-park:#2F5A3A; --m-trees:#2E6B3C; --m-tree-dot:#7CC27F; --m-water:#1F4E7A; --m-beach:#6B5A2C; --m-field:#3D4A2A; --m-car:#3A4566; --m-road:#5A6585; --m-road-edge:#8793B3; --m-road-t:#F0F3FA; --m-path:#E0B25A; --m-text:#EEF2FA; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,select,input,textarea{font:inherit;color:inherit}input,textarea{caret-color:var(--fg)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
body:not(.ai) .ai-only{display:none!important}
body.ai .off-only{display:none!important}

/* Masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-fg);border-bottom:3px solid var(--gold)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;text-align:left}
.brand img{height:46px;width:auto;display:block}
.brand b{display:block;font-family:var(--f-head);font-size:20px;letter-spacing:.01em}
.brand small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--band-muted)}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%;scrollbar-width:none}
.nav button{background:none;border:0;color:var(--band-muted);padding:9px 14px;border-radius:8px;font-weight:700;font-size:15px;white-space:nowrap}
.nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.1);box-shadow:inset 0 -2px 0 var(--gold-hi)}
@media (max-width:720px){.nav{margin-left:0;width:100%}.brand img{height:38px}}
main{padding-block:26px 64px}

/* Shared */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 15px;border-radius:8px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--c3)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--gold);border-color:var(--gold);color:#0B1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);border-color:var(--gold);color:#0B1530}}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
:root[data-theme="dark"] .btn.gold{color:#0B1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.gold{color:#0B1530}}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0}
@media (max-width:520px){.panel{padding:16px}}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.chip{font-family:var(--f-body);display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:999px;background:var(--ice);color:var(--muted)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.view-head h1{font-size:clamp(28px,4vw,38px)}
.view-head p{margin:6px 0 0;color:var(--muted);max-width:64ch}
.grid2{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.rail{display:grid;gap:4px}
@media (max-width:860px){.rail{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.rail button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid transparent;background:none;padding:9px 12px;border-radius:8px}
.rail button:hover{background:var(--surface);border-color:var(--line)}
.rail button[aria-pressed="true"]{background:var(--surface);border-color:var(--navy);box-shadow:inset 3px 0 0 var(--gold)}
:root[data-theme="dark"] .rail button[aria-pressed="true"]{border-color:var(--c1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rail button[aria-pressed="true"]{border-color:var(--c1)}}
.rail small{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
button.card:hover{border-color:var(--gold)}
.card h3{font-size:20px}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.timer{font-family:var(--f-num);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:8px;background:var(--ice)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.prose p{margin:0 0 12px;max-width:70ch}
.note{background:var(--gold-soft);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14.5px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scroll-x{overflow-x:auto}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--navy),var(--gold))}
.hero h1{font-size:clamp(32px,5vw,50px)}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--muted);max-width:60ch;margin:10px 0 16px}
.hero img{width:120px;height:auto}
@media (max-width:620px){.hero{grid-template-columns:1fr}.hero img{display:none}}
.skillcard .big{font-family:var(--f-head);font-size:34px;line-height:1;color:var(--fg)}
.skillcard .big small{font-size:15px;color:var(--muted);font-family:var(--f-body)}
.skillcard .go{margin-top:auto;font-weight:700;color:var(--gold)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.home-low{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-top:22px}
@media (max-width:860px){.home-low{grid-template-columns:1fr}}

/* Vocabulary */
.flash{perspective:1200px;border:0;background:none;padding:0;width:100%;display:block;text-align:left}
.flash-in{min-height:260px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative}
.flash-in::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.flash .word{font-family:var(--f-head);font-size:clamp(32px,5vw,46px);line-height:1.1}
.flash .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flash .def{font-size:19px}
.flash .ru{font-size:17px;color:var(--gold)}
.flash .ex{color:var(--muted);font-style:italic}
.flash .ex b{color:var(--fg);font-style:normal}
.hint{font-size:13px;color:var(--muted)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:560px){.qopts{grid-template-columns:1fr}}
.qopt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;font-size:16px}
.qopt:hover:not(:disabled){border-color:var(--gold)}
.qopt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qopt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qopt:disabled{cursor:default}
.qstem{font-size:20px;font-family:var(--f-head)}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--gold)}

/* Reading */
.rd-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:10;background:var(--bg);padding-block:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:16px}
@media (max-width:720px){.top{position:relative;top:0}.rd-bar{top:env(safe-area-inset-top,0px)}}
.ptabs{display:flex;gap:4px;flex-wrap:wrap}
.ptabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px}
.ptabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .ptabs button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#0B1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ptabs button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#0B1530}}
.rd-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:960px){.rd-grid{grid-template-columns:1fr}}
.rd-col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0}
@media (min-width:961px){.rd-col{max-height:calc(100vh - 170px);overflow:auto}}
.article h2{font-size:26px;margin-bottom:6px}
.article .standfirst{font-style:italic;color:var(--muted);margin:0 0 14px}
.para{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;margin-bottom:12px}
.para b{font-family:var(--f-head);color:var(--gold)}
.para p{margin:0;line-height:1.7}
.qgroup{margin-bottom:24px}
.qgroup .instr{white-space:pre-line;font-size:14.5px;background:var(--ice);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.qgroup .instr::first-line{font-weight:700}
.optbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14.5px}
.optbox div{padding:2px 0}
.q{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:9px 8px;border-radius:8px;margin-bottom:4px}
.q .n{font-family:var(--f-num);font-weight:700;color:var(--muted);padding-top:2px}
.q.ok{background:var(--ok-soft)}
.q.bad{background:var(--bad-soft)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pills label{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13.5px;font-weight:700;cursor:pointer}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills label:has(input:checked){background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .pills label:has(input:checked){background:var(--gold);border-color:var(--gold);color:#0B1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pills label:has(input:checked){background:var(--gold);border-color:var(--gold);color:#0B1530}}
.pills label:has(input:focus-visible){outline:2px solid var(--gold)}
.choices{display:grid;gap:5px;margin-top:6px}
.choices label{display:flex;gap:8px;align-items:flex-start;font-size:15px;cursor:pointer}
.choices input{margin-top:5px}
.gap{border:0;border-bottom:2px solid var(--line);background:var(--ice);border-radius:4px 4px 0 0;padding:2px 6px;width:150px;max-width:100%}
.gap:focus{border-bottom-color:var(--gold);outline:none}
select.gap{width:auto}
.fb{grid-column:2;font-size:13.5px;margin-top:4px}
.fb b{color:var(--ok)}
.q.bad .fb b{color:var(--bad)}
.summary{line-height:2.1}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin-bottom:18px}
@media (max-width:620px){.result{grid-template-columns:1fr}}
.bandbig{font-family:var(--f-head);font-size:64px;line-height:1;color:var(--gold)}
.bandbig small{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body);font-weight:700}

/* Writing */
.wr-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:960px){.wr-grid{grid-template-columns:1fr}}
.promptbox{white-space:pre-line;font-size:15.5px;border:2px solid var(--fg);border-radius:4px;padding:16px 18px;margin-bottom:14px}
.chart{margin:10px 0 6px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.pies{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pies figure{margin:0;text-align:center;flex:0 1 225px;width:225px;max-width:100%}
.pies figcaption{font-weight:700;margin-bottom:4px}
.steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center;counter-reset:s}
.steps div{border:1px solid var(--line);background:var(--ice);border-radius:8px;padding:8px 10px;font-size:14px;max-width:180px;counter-increment:s}
.steps div::before{content:counter(s) ". ";font-weight:700;color:var(--gold)}
.steps em{color:var(--gold);font-style:normal;font-weight:700}
textarea.essay{width:100%;min-height:380px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;line-height:1.7;font-size:16px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:8px 0 12px}
.stats b{color:var(--fg)}
.checks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:15px}
.checks li::before{font-weight:700}
.checks li.ok::before{content:"✓";color:var(--ok)}
.checks li.warn::before{content:"!";color:var(--bad)}
.slider{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 40px;gap:10px;align-items:center;margin-bottom:4px;font-size:14.5px}
@media (max-width:460px){.slider{grid-template-columns:minmax(0,1fr) 40px}.slider label{grid-column:1/-1}}
.slider input{width:100%;accent-color:var(--gold)}
.desc{font-size:13px;color:var(--muted);margin:0 0 10px}
.fbk{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.crit b.num{font-size:20px;color:var(--gold);text-align:right}
.crit p{grid-column:1/-1;margin:0;font-size:14.5px;color:var(--muted)}
.corr td:first-child{color:var(--bad);text-decoration:line-through;text-decoration-color:rgba(176,55,47,.5)}
.corr td:nth-child(2){color:var(--ok)}
details.more{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:var(--surface)}
details.more summary{cursor:pointer;font-weight:700}
details.more[open] summary{margin-bottom:8px}

/* Speaking */
.topicchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.topicchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:700}
.topicchips button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.sp-grid{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:22px;align-items:start}
@media (max-width:700px){.sp-grid{grid-template-columns:1fr}}
.spq{font-family:var(--f-head);font-size:clamp(22px,3vw,30px);line-height:1.25;margin:6px 0 12px}
.cue{border:2px solid var(--fg);border-radius:4px;padding:16px 18px;margin-bottom:12px}
.cue ul{margin:6px 0;padding-left:20px}
.clock{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--ice);border-radius:12px;padding:18px}
.clock .num{font-size:40px;font-weight:700}
.clock .bar{width:100%}
.sample{background:var(--ice);border-radius:10px;padding:14px 16px;margin-top:12px}
.sample p{margin:0 0 10px;max-width:70ch}
.sample p:last-child{margin:0}
.banklist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:700px){.banklist{grid-template-columns:1fr}}
.banklist button{width:100%;height:100%;display:grid;grid-template-columns:28px minmax(0,1fr) 14px;gap:8px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14.5px}
.banklist button.on{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold);background:var(--surface)}
.banklist .n{font-family:var(--f-num);font-size:12px;color:var(--muted);padding-top:2px}
.banklist .t{color:var(--ok);font-weight:700}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px}
.sharebox textarea{margin-top:8px}
.search{width:100%;margin-bottom:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.railhead{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;padding:12px 12px 4px;grid-column:1/-1}
.up{background:var(--gold-soft);border-radius:8px;padding:8px 10px;font-size:15px}
.linkbtn{border:0;background:none;color:var(--gold);text-decoration:underline;padding:0;text-align:left;font-size:14px}
.bookimg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.rail{max-height:none}
@media (min-width:861px){#vRail{max-height:calc(100vh - 220px);overflow:auto}}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:420px;margin-inline:auto}
.flow li{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);background:var(--ice);border-radius:8px;padding:8px 12px;font-size:14.5px}
.flow li b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px}
:root[data-theme="dark"] .flow li b{background:var(--gold);color:#0B1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flow li b{background:var(--gold);color:#0B1530}}
.flow li.arr{display:block;width:auto;border:0;background:none;padding:0;color:var(--gold);font-weight:700;text-align:center;line-height:1}
.flow li.side{display:block;width:88%;margin-left:12%;background:var(--gold-soft);border-style:dashed;font-size:14px}
.sidetag{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.langnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.langnav a{font-size:13.5px;font-weight:700;color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px}
.langnav a:hover{border-color:var(--gold)}
.langgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:16px;align-items:start}
.langgrid .langsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;scroll-margin-top:90px}
.langsec h3{font-size:19px}
details .langsec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
details .langsec h3{font-size:16px}
table.lang td{padding:6px 8px;font-size:14.5px}
table.lang td:first-child{font-weight:700}
.langex{background:var(--gold-soft);border-radius:8px;padding:8px 12px;margin-top:10px}
.langex p{margin:4px 0;font-size:14.5px}
.langex .label{color:var(--gold);margin-right:4px}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.mapfig{margin:0}
.mapfig figcaption{font-weight:700;text-align:center;margin-bottom:4px}
.mapfig svg{width:100%;height:auto;display:block}
.foot{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const READING=[{"id":"T1","title":"Academic Reading Test 1","passages":[{"title":"The Aral Sea: Collapse and Partial Recovery","intro":"How one of the world's largest lakes was lost to irrigation, and how part of it was brought back","paragraphs":[{"label":"A","text":"For most of recorded history, the Aral Sea, which straddles the border between what is now Kazakhstan and Uzbekistan, was among the largest bodies of inland water on Earth. Covering roughly 68,000 square kilometres in the mid-twentieth century, it ranked fourth in the world by area, behind only the Caspian Sea, Lake Superior and Lake Victoria. Despite its name, the Aral was a terminal lake: it had no outlet to the ocean, and its level was maintained by a delicate balance between the water delivered by two great rivers, the Amu Darya from the south and the Syr Darya from the east, and the water lost through evaporation under the fierce Central Asian sun. Its waters were only mildly salty, and they supported a substantial fishing industry. At its peak, the port of Aralsk on the northern shore and the town of Muynak in the south processed tens of thousands of tonnes of fish each year."},{"label":"B","text":"The sea's decline began with a deliberate economic choice. From the 1950s onwards, Soviet planners set out to turn the arid lands of Central Asia into a major producer of cotton, a crop valued for export and sometimes described as 'white gold'. Vast networks of canals were dug to divert water from both rivers into the desert, the largest of them, the Karakum Canal, carrying water hundreds of kilometres westward across Turkmenistan. Much of this infrastructure was poorly constructed. Many canals were unlined, allowing a large share of the water to seep into the sand or evaporate before it ever reached the fields. The planners were not unaware of what this would mean for the sea. Some regarded its loss as an acceptable price for agricultural expansion, while others argued that a lake which simply evaporated into the desert air was a waste of valuable water."},{"label":"C","text":"The effects became visible during the 1960s, as the inflow from the rivers fell sharply. By the late 1980s, the shoreline had retreated so far that the sea divided into two separate bodies: a smaller northern lake, fed by the Syr Darya and lying almost entirely within Kazakhstan, and a much larger southern lake shared with Uzbekistan. As the water shrank, its salt concentration rose steadily, eventually exceeding that of the open ocean and killing off most of the native fish species. The commercial fishery had collapsed by the early 1980s. Ships were left stranded on the sand, and Aralsk, once a busy harbour, found itself many kilometres from the water's edge. In time the southern lake itself broke apart into eastern and western basins, and in 2014 satellite images showed that the eastern basin had dried out almost completely for the first time in modern history."},{"label":"D","text":"The human and environmental costs went far beyond the loss of fish. The exposed seabed, now often called the Aralkum Desert, became a source of dust storms that carried salt, together with residues of the pesticides and fertilisers that had washed down from the cotton fields, across the surrounding region. Local communities reported high rates of respiratory illness and other health problems, although separating the influence of the dust from that of poverty and poor drinking water has proved difficult for researchers. The local climate also changed. Without the moderating influence of a large body of water, summers in the area became hotter and winters colder, and the growing season grew shorter."},{"label":"E","text":"For decades the disaster seemed irreversible, but the northern lake offered a glimmer of hope. Because it was fed by the Syr Darya alone, it was relatively small, and its water could be retained if it were prevented from flowing south into the larger basin, where it would simply evaporate. In the early 1990s local people built an earthen dyke across the channel that separated the two lakes. The level of the northern lake began to rise, but the makeshift barrier was repeatedly damaged, and in 1999 it collapsed during a storm. The principle, however, had been demonstrated."},{"label":"F","text":"The government of Kazakhstan, with loan support from the World Bank, then undertook a more ambitious project. The Kok-Aral Dam, a structure approximately 13 kilometres long fitted with sluice gates to release surplus water southward, was completed in 2005. At the same time, engineers improved the channel of the Syr Darya so that more of the river's flow would reach the sea. The response was faster than anyone had predicted. The lake reached the dam's design level within a matter of months rather than the years that had been forecast, and its surface area expanded considerably. Salinity fell, and native fish such as pike-perch and carp, which had survived in the river and its delta, returned to the lake. Commercial fishing resumed, and processing plants in Aralsk reopened to handle catches that were soon being sold both within Kazakhstan and abroad."},{"label":"G","text":"The recovery, nevertheless, is only partial. The restored northern lake represents a small fraction of the sea's original area, and the water's edge still lies some distance from Aralsk. The southern basins, which depend on the heavily used Amu Darya, have continued to decline, and there is little prospect of restoring them while demand for irrigation in the region remains high. Proposals for a second phase on the northern side, such as raising the dam to bring water closer to the old port, have been discussed for years. Meanwhile, both Kazakhstan and Uzbekistan have planted salt-tolerant shrubs such as saxaul on the dry seabed in an attempt to stabilise the soil and reduce dust. The Aral Sea is unlikely ever to return to its former size, but its northern remnant has shown that, in the right circumstances, even severe environmental damage can be partly reversed."}],"groups":[{"type":"tfng","instructions":"Questions 1–6\nDo the following statements agree with the information given in Reading Passage 1?\nIn boxes 1–6 on your answer sheet, write\nTRUE if the statement agrees with the information\nFALSE if the statement contradicts the information\nNOT GIVEN if there is no information on this","questions":[{"n":1,"text":"Before its decline, the Aral Sea was connected to the ocean.","answer":["FALSE"],"explain":"Paragraph A states that the Aral was a terminal lake with no outlet to the ocean."},{"n":2,"text":"The Karakum Canal was completed ahead of schedule.","answer":["NOT GIVEN"],"explain":"Paragraph B describes the Karakum Canal's size and route but says nothing about when it was completed relative to its schedule."},{"n":3,"text":"Soviet planners did not realise that irrigation would damage the Aral Sea.","answer":["FALSE"],"explain":"Paragraph B says the planners were not unaware of the consequences, and some saw the loss as an acceptable price."},{"n":4,"text":"At one stage the sea became saltier than the open ocean.","answer":["TRUE"],"explain":"Paragraph C states that the salt concentration eventually exceeded that of the open ocean."},{"n":5,"text":"Summers in the region became hotter as the sea shrank.","answer":["TRUE"],"explain":"Paragraph D says that without the large body of water, summers became hotter and winters colder."},{"n":6,"text":"The dyke built in the early 1990s was constructed without permission from the national government.","answer":["NOT GIVEN"],"explain":"Paragraph E says local people built the dyke but gives no information about government permission."}]},{"type":"sentence_completion","instructions":"Questions 7–13\nComplete the sentences below.\nChoose ONE WORD ONLY from the passage for each answer.\nWrite your answers in boxes 7–13 on your answer sheet.","questions":[{"n":7,"text":"Because of its export value, cotton was sometimes called 'white ______'.","answer":["gold"],"explain":"Paragraph B describes cotton as a crop sometimes described as 'white gold'."},{"n":8,"text":"A great deal of water was lost from canals that were ______.","answer":["unlined"],"explain":"Paragraph B states that many canals were unlined, so water seeped into the sand or evaporated."},{"n":9,"text":"The dry seabed, which is now known as the Aralkum ______, produces dust storms.","answer":["desert"],"explain":"Paragraph D refers to the exposed seabed as the Aralkum Desert, a source of dust storms."},{"n":10,"text":"The first barrier between the two lakes was destroyed by a ______ in 1999.","answer":["storm"],"explain":"Paragraph E says the dyke collapsed during a storm in 1999."},{"n":11,"text":"The Kok-Aral Dam includes sluice ______ so that surplus water can flow south.","answer":["gates"],"explain":"Paragraph F says the dam is fitted with sluice gates to release surplus water southward."},{"n":12,"text":"Native fish returned to the lake from the Syr Darya and its ______.","answer":["delta"],"explain":"Paragraph F says pike-perch and carp had survived in the river and its delta."},{"n":13,"text":"Plants such as ______ have been grown on the dry seabed to hold the soil in place.","answer":["saxaul"],"explain":"Paragraph G mentions salt-tolerant shrubs such as saxaul planted to stabilise the soil."}]}]},{"title":"Cities That Overheat","intro":"Why urban areas are warmer than the countryside, who pays the price, and what can be done","paragraphs":[{"label":"A","text":"On a still summer evening, a cyclist riding from the centre of a large city to its outskirts may notice the air growing distinctly cooler within a few kilometres. The difference is not imagined. Urban areas are routinely warmer than the countryside around them, a phenomenon known as the urban heat island. The effect was first documented in the early nineteenth century by the amateur meteorologist Luke Howard, whose records showed that central London was consistently warmer than the surrounding rural areas. Today, with more than half of the world's population living in cities and average global temperatures rising, the phenomenon has moved from a meteorological curiosity to a pressing concern for public health and urban planning."},{"label":"B","text":"The size of the heat island varies considerably with the time of day, the season and the weather. Somewhat counter-intuitively, the difference between city and countryside is usually smallest around midday and greatest a few hours after sunset. During the day, both urban and rural surfaces absorb large amounts of solar energy. At night, however, open fields release their heat rapidly into a clear sky, while the materials of the city surrender theirs only slowly. Under calm, cloudless conditions, measurements in large cities have recorded night-time differences of several degrees Celsius, and in extreme cases of more than ten. Wind and cloud cover tend to weaken the effect, the former by mixing the air and the latter by limiting the escape of heat from rural and urban areas alike."},{"label":"C","text":"The most fundamental cause lies in the materials from which cities are built. Asphalt, concrete, brick and stone generally have a low albedo, meaning that they reflect only a small proportion of incoming sunlight and absorb the rest. A fresh asphalt road, for instance, may reflect as little as five per cent of the sunlight that falls on it. These materials also possess a high thermal mass: they can store a large quantity of heat during the day and release it gradually through the night. The geometry of the city compounds the problem. In narrow streets lined with tall buildings, the so-called urban canyons, heat radiated from one surface is often absorbed by another rather than escaping to the sky, and the buildings themselves slow the winds that might otherwise carry warm air away."},{"label":"D","text":"A second cause is the scarcity of vegetation and exposed soil. In the countryside, a significant share of the sun's energy is used not to warm the air but to evaporate water from the soil and from the leaves of plants, a process known as evapotranspiration. In effect, this acts as a natural air-conditioning system. In cities, by contrast, rainwater is rapidly channelled into drains, and sealed surfaces leave little moisture available to evaporate. Consequently, more of the incoming energy goes into heating surfaces and the air directly. Trees provide a further benefit by casting shade, which can make the surface of a pavement many degrees cooler than an unshaded stretch nearby."},{"label":"E","text":"Finally, cities generate heat of their own. Vehicles, industrial processes and the heating and cooling of buildings all release waste heat into the urban atmosphere. Air conditioning is a particularly troubling example. While it protects people indoors, every unit expels heat outside, warming the streets and increasing the demand for yet more cooling. This self-reinforcing cycle also raises electricity consumption and, where power is generated from fossil fuels, greenhouse gas emissions. In some dense commercial districts, this so-called anthropogenic heat may, during winter, approach or even exceed the energy received from the sun."},{"label":"F","text":"The consequences for human health are serious. Heat is among the deadliest of natural hazards: the European heatwave of 2003 is estimated to have caused tens of thousands of excess deaths, many of them among elderly people living alone in cities. The burden, moreover, is not shared equally. Studies in several countries have found that lower-income neighbourhoods tend to have fewer trees and more paved surfaces than wealthier ones, and may be noticeably hotter on the same summer afternoon. Their residents are also less likely to own air conditioners, or to be able to afford to run them. The urban heat island, in other words, tends to magnify existing social inequalities."},{"label":"G","text":"A range of strategies has been proposed to cool cities down. Cool roofs, coated with highly reflective paint or membranes, can substantially reduce the temperature of a building's upper floors and of the air above it. Green roofs, planted with vegetation, offer both insulation and evaporative cooling, although they are heavier and more expensive to install. Planting street trees is widely regarded as one of the most effective measures, but trees need space, water and many years to mature. Reflective pavements have produced mixed results: some studies suggest that, while the surface itself stays cooler, the sunlight bounced upwards can make pedestrians feel hotter. Researchers increasingly argue that no single measure is sufficient, and that the best results come from combining several approaches suited to the local climate and the form of the city."}],"groups":[{"type":"headings","instructions":"Questions 14–19\nReading Passage 2 has seven paragraphs, A–G.\nChoose the correct heading for paragraphs B–G from the list of headings below.\nWrite the correct number, i–ix, in boxes 14–19 on your answer sheet.","options":["i The role of moisture and plants","ii A difference that peaks after dark","iii Early observations of a city's warmth","iv How cities produce their own heat","v Combining measures to cool urban areas","vi Rules limiting the height of new buildings","vii Who suffers most when temperatures rise","viii Why rural temperatures are rising faster","ix Surfaces and shapes that capture heat"],"questions":[{"n":14,"text":"Paragraph B","answer":["ii"],"explain":"Paragraph B explains that the city–countryside difference is greatest a few hours after sunset."},{"n":15,"text":"Paragraph C","answer":["ix"],"explain":"Paragraph C covers low-albedo materials, thermal mass and the geometry of urban canyons."},{"n":16,"text":"Paragraph D","answer":["i"],"explain":"Paragraph D describes how the lack of vegetation and moisture removes the cooling effect of evapotranspiration."},{"n":17,"text":"Paragraph E","answer":["iv"],"explain":"Paragraph E deals with waste heat from vehicles, industry and air conditioning."},{"n":18,"text":"Paragraph F","answer":["vii"],"explain":"Paragraph F explains that elderly people and lower-income neighbourhoods bear the greatest burden."},{"n":19,"text":"Paragraph G","answer":["v"],"explain":"Paragraph G reviews cooling strategies and concludes that several should be combined."}]},{"type":"mcq","instructions":"Questions 20–23\nChoose the correct letter, A, B, C or D.\nWrite the correct letter in boxes 20–23 on your answer sheet.","questions":[{"n":20,"text":"According to the writer, the temperature difference between a city and the surrounding countryside is usually greatest","choices":["A around midday.","B in the early afternoon.","C a few hours after sunset.","D on windy, cloudy nights."],"answer":["C"],"explain":"Paragraph B states that the difference is greatest a few hours after sunset, while wind and cloud weaken it."},{"n":21,"text":"What does the writer say about a fresh asphalt road?","choices":["A It reflects more sunlight than older roads.","B It absorbs most of the sunlight that reaches it.","C It loses heat more quickly than concrete at night.","D It causes winds to slow down in narrow streets."],"answer":["B"],"explain":"Paragraph C says fresh asphalt may reflect as little as five per cent of sunlight, absorbing the rest."},{"n":22,"text":"Why does the writer describe air conditioning as 'a particularly troubling example'?","choices":["A It is too expensive for most households to run.","B It relieves heat indoors while adding to heat outdoors.","C It is the largest single source of waste heat in cities.","D It stops working effectively in very hot weather."],"answer":["B"],"explain":"Paragraph E explains that air conditioning protects people indoors but expels heat outside, warming the streets."},{"n":23,"text":"What is the writer's main conclusion about ways of cooling cities?","choices":["A Reflective pavements are the most reliable option.","B Green roofs are the cheapest measure to install.","C Tree planting takes too long to be worthwhile.","D Several measures should be used together."],"answer":["D"],"explain":"Paragraph G concludes that no single measure is sufficient and that approaches should be combined."}]},{"type":"summary_completion","instructions":"Questions 24–26\nComplete the summary using the list of words, A–H, below.\nWrite the correct letter, A–H, in boxes 24–26 on your answer sheet.","options":["A evaporate","B drains","C trees","D roofs","E absorb","F canals","G air conditioners","H winds"],"summary":"In the countryside, a large part of the sun's energy is used to {{24}} water from the soil and from leaves, which helps to keep the air cool. In cities, however, rainwater is quickly carried away into {{25}}, so there is little moisture left. Studies have also shown that lower-income neighbourhoods tend to have fewer {{26}} and more paved surfaces than wealthier districts, and as a result they may be hotter.","questions":[{"n":24,"text":"","answer":["A"],"explain":"Paragraph D says the sun's energy is used to evaporate water from soil and leaves."},{"n":25,"text":"","answer":["B"],"explain":"Paragraph D states that in cities rainwater is rapidly channelled into drains."},{"n":26,"text":"","answer":["C"],"explain":"Paragraph F says lower-income neighbourhoods tend to have fewer trees and more paved surfaces."}]}]},{"title":"Is Decision Fatigue Real?","intro":"A popular idea about willpower has run into trouble in the laboratory. What, if anything, survives?","paragraphs":[{"label":"A","text":"Few ideas from psychology have travelled as far beyond the laboratory as decision fatigue. The notion is intuitively appealing: each choice we make draws on a limited mental reserve, and as that reserve runs low, our judgement deteriorates. Business leaders are said to wear identical clothes to spare themselves trivial decisions, and productivity guides advise readers to schedule their most important choices for the morning. Yet the scientific foundations of the idea have proved far less secure than its popularity would suggest, and it is worth asking what, if anything, remains once the evidence is examined closely."},{"label":"B","text":"The concept grew out of a broader theory known as ego depletion. In a series of experiments published from the late 1990s onwards, a group of social psychologists proposed that self-control operates rather like a muscle: it is powered by a finite resource that is consumed by use and becomes fatigued. In one well-known design, hungry participants who had been told to resist a plate of freshly baked cookies and eat raw radishes instead subsequently gave up sooner on an unsolvable puzzle than those who had been allowed to indulge. Hundreds of later studies appeared to confirm the pattern, and the theory's proponents extended it to choice itself, arguing that making decisions draws on the same reserve as resisting temptation. For a time, they also proposed a physiological basis for the effect: the resource, they suggested, might be glucose, and a sugary drink could restore flagging willpower."},{"label":"C","text":"The glucose hypothesis was the first part of the edifice to crack. Critics pointed out that the brain's overall energy consumption barely changes during demanding mental tasks, and that the quantities of sugar involved in the experiments were far too small to make a measurable difference. Some later studies found that merely rinsing the mouth with a sugary solution, without swallowing it, produced comparable effects, suggesting that whatever was happening had more to do with motivation and reward than with fuel."},{"label":"D","text":"A far more serious challenge came in the mid-2010s, when psychology confronted what became known as the replication crisis. In 2016, a large collaborative project involving more than twenty laboratories and over two thousand participants attempted to reproduce a standard ego-depletion effect using a protocol agreed in advance. The organisers had deliberately chosen procedures that the theory's supporters considered appropriate, and the analysis plan was registered in advance. The result was an effect so small that it could not be distinguished from zero. Defenders of the theory responded that the tasks selected had not been demanding enough to produce depletion. A later multi-site study, designed with input from those defenders, reported at best a very small effect, a fraction of the size that the early literature had implied."},{"label":"E","text":"Then there is the most celebrated real-world illustration of decision fatigue: an analysis of parole hearings in Israel, which found that judges granted parole to a high proportion of prisoners at the start of each session, with the rate falling steeply towards zero before each food break and recovering afterwards. The finding was widely reported as evidence that tired, hungry decision-makers fall back on the safe default of refusal. Other researchers, however, noted that the order in which cases were heard was not random. Prisoners without legal representation, whose applications were less likely to succeed, tended to be heard at the end of sessions, and the panels may have taken breaks when they anticipated that the next case would be a long one. Simulations suggested that factors of this kind could, on their own, produce a pattern resembling the one observed, without any fatigue at all."},{"label":"F","text":"A further twist came from studies of what people believe about willpower. Researchers found that participants who had been led to see self-control as a limited resource showed the classic depletion pattern, whereas those who believed that mental effort could be energising did not; in some samples, they even performed better after a demanding task. Cross-cultural work has added to the picture, with depletion effects reported to be weaker, or even reversed, in populations whose cultural traditions associate mental exertion with renewed energy."},{"label":"G","text":"In my view, the strong version of the theory, which holds that every choice drains a single physical store of energy, should be abandoned. The evidence for it is simply too weak, and continuing to present it as settled science does the public a disservice. But it would be a mistake to conclude that people never experience anything resembling decision fatigue. Anyone who has spent a day making difficult choices knows the sensation of mental weariness, and that sensation is genuine even if its cause has been misidentified. A more plausible account, I believe, is that prolonged effort shifts our priorities. After hours of demanding work, we become less willing to invest effort in a task whose rewards seem distant, and more drawn to whatever is immediately pleasant or easy. This is less a failure of fuel than a change in motivation, and motivation can be influenced by rest, interest and the meaning we attach to our work."},{"label":"H","text":"The practical advice that has grown up around decision fatigue is therefore not entirely worthless, but it rests on the wrong foundations. Reducing trivial choices may well help, not because it conserves a scarce resource, but because it frees attention for the things that matter. The story of decision fatigue also offers a broader lesson. An attractive idea, supported by many small studies and an appealing metaphor, can become part of everyday wisdom long before it has been rigorously tested. The value of the replication movement lies not in debunking for its own sake, but in reminding us that intuitions, however compelling, must still earn their place in science."}],"groups":[{"type":"ynng","instructions":"Questions 27–31\nDo the following statements agree with the claims of the writer in Reading Passage 3?\nIn boxes 27–31 on your answer sheet, write\nYES if the statement agrees with the claims of the writer\nNO if the statement contradicts the claims of the writer\nNOT GIVEN if it is impossible to say what the writer thinks about this","questions":[{"n":27,"text":"The popularity of the idea of decision fatigue is greater than the strength of the evidence supporting it.","answer":["YES"],"explain":"In paragraph A the writer says the scientific foundations are far less secure than the idea's popularity would suggest."},{"n":28,"text":"Most people who follow the advice of productivity guides are aware of the research on ego depletion.","answer":["NOT GIVEN"],"explain":"Paragraph A mentions productivity guides, but the writer says nothing about whether their readers know the research."},{"n":29,"text":"The theory that each decision uses up a physical store of energy should no longer be accepted.","answer":["YES"],"explain":"In paragraph G the writer states that the strong version of the theory should be abandoned."},{"n":30,"text":"People who feel mentally tired after a day of difficult choices are mistaken about what they are experiencing.","answer":["NO"],"explain":"In paragraph G the writer says the sensation of mental weariness is genuine, even if its cause has been misidentified."},{"n":31,"text":"The main value of the replication movement is that it exposes weak research.","answer":["NO"],"explain":"In paragraph H the writer says the movement's value lies not in debunking for its own sake but in testing intuitions."}]},{"type":"matching_features","instructions":"Questions 32–36\nLook at the following statements (Questions 32–36) and the list of groups below.\nMatch each statement with the correct group, A, B, C or D.\nWrite the correct letter, A, B, C or D, in boxes 32–36 on your answer sheet.\nNB You may use any letter more than once.","options":["A the original proponents of ego-depletion theory","B the organisers of the 2016 replication project","C researchers who questioned the parole study","D researchers who examined beliefs about willpower"],"questions":[{"n":32,"text":"suggested that a substance in the body might explain self-control","answer":["A"],"explain":"Paragraph B says the theory's proponents proposed that the resource might be glucose."},{"n":33,"text":"used methods that supporters of the theory regarded as suitable","answer":["B"],"explain":"Paragraph D says the organisers deliberately chose procedures the theory's supporters considered appropriate."},{"n":34,"text":"found that the effect depended on how people viewed mental effort","answer":["D"],"explain":"Paragraph F reports that only participants who saw self-control as limited showed depletion."},{"n":35,"text":"pointed out that cases were not heard in a random order","answer":["C"],"explain":"Paragraph E says other researchers noted that the order in which cases were heard was not random."},{"n":36,"text":"claimed that making choices draws on the same resource as resisting temptation","answer":["A"],"explain":"Paragraph B says the proponents extended the theory, arguing decisions draw on the same reserve as resisting temptation."}]},{"type":"summary_completion","instructions":"Questions 37–40\nComplete the summary below.\nChoose NO MORE THAN TWO WORDS from the passage for each answer.\nWrite your answers in boxes 37–40 on your answer sheet.","summary":"Ego-depletion theory compared self-control to a {{37}} that becomes tired with use. Its supporters once suggested that the resource involved was {{38}}, but critics argued that the brain's energy use hardly changes during difficult mental tasks. In some studies, simply rinsing the mouth with a sugary solution produced similar results, which implied that {{39}} and reward mattered more than fuel. Later, a large project carried out in 2016 found an effect that could not be distinguished from {{40}}.","questions":[{"n":37,"text":"","answer":["muscle"],"explain":"Paragraph B says self-control was proposed to operate rather like a muscle."},{"n":38,"text":"","answer":["glucose"],"explain":"Paragraph B states that the resource, they suggested, might be glucose."},{"n":39,"text":"","answer":["motivation"],"explain":"Paragraph C says the effects had more to do with motivation and reward than with fuel."},{"n":40,"text":"","answer":["zero"],"explain":"Paragraph D says the 2016 result could not be distinguished from zero."}]}]}]},{"id":"T2","title":"Academic Reading Test 2","passages":[{"title":"Paper on the Silk Road","intro":"How a Chinese invention travelled across Asia and the Islamic world to transform European learning.","paragraphs":[{"label":"A","text":"Few inventions have travelled as far, or as slowly, as paper. Chinese historical records traditionally credit its invention to Cai Lun, an official at the imperial court, who in the year 105 CE is said to have presented the emperor with a new writing material made from tree bark, hemp, old rags and worn-out fishing nets. Archaeology, however, has complicated this neat story. Fragments of paper recovered from tombs and watchtowers in north-western China have been dated to as much as two centuries before Cai Lun's time. Most historians now believe that he did not invent paper so much as refine and standardise a process that had been developing gradually, and that his position at court helped ensure that his version of the technique was recorded and widely adopted."},{"label":"B","text":"The earliest paper does not seem to have been intended for writing at all. Some of the oldest surviving fragments were used for wrapping medicines, padding delicate objects or even as a form of clothing. For writing, the Chinese had long relied on two other materials: strips of bamboo, which were cheap but heavy and awkward to store, and silk, which was light and smooth but far too costly for everyday use. Paper offered the advantages of both with the disadvantages of neither, and by the third and fourth centuries it had largely replaced its rivals in Chinese offices and libraries. From China, knowledge of the craft passed east to Korea and Japan, while finished sheets were carried west by merchants travelling the caravan routes that later came to be called the Silk Road. Paper documents written in several languages have been found in the oasis towns of the Tarim Basin, showing that the material was in use far beyond China's borders long before the technique of making it had spread."},{"label":"C","text":"The next stage of the journey is usually linked to Samarkand, a wealthy trading city in what is now Uzbekistan. According to a story repeated in many histories, Arab forces defeated a Chinese army near the Talas River in 751, and among the prisoners taken were skilled papermakers, who were brought to Samarkand and obliged to teach their craft. The account is memorable, but scholars have grown increasingly sceptical of it. The earliest written versions date from long after the battle, and there are indications that paper was already being produced in Central Asia before 751, perhaps learned from Chinese craftsmen through ordinary commercial contact. Whatever the truth, Samarkand quickly became famous for its paper. The city had plentiful supplies of hemp and flax, and a network of irrigation canals provided the clean, flowing water that the process demands."},{"label":"D","text":"From Samarkand the technique moved to the heart of the Islamic world. A paper mill was operating in Baghdad by the 790s, and government departments there soon came to prefer paper to parchment, the prepared animal skin that had been the standard surface for official records. Paper was considerably cheaper, but there was a further, administrative reason for the change: ink soaked into its fibres, so any attempt to alter a document left visible damage, whereas text on parchment could be scraped away and rewritten without obvious trace. Cheap, reliable paper fuelled an extraordinary growth in book production. One ninth-century writer described a district of Baghdad containing over 100 booksellers' shops, and scholars in the city translated large numbers of Greek, Persian and Indian works into Arabic."},{"label":"E","text":"Papermakers in the Islamic world did not simply copy Chinese methods; they adapted them to local conditions. The paper mulberry, whose inner bark had been a key ingredient in China, did not grow in the region, so craftsmen turned instead to linen rags, which were widely available and produced a strong, flexible sheet. They also began using water-powered hammers to beat the rags into pulp, a task previously done by hand, and they coated finished sheets with starch, giving them the hard, smooth surface needed for writing with reed pens. Over the following centuries mills appeared in Damascus, Cairo and eventually Fez in Morocco, from which the craft was well placed to cross into Europe."},{"label":"F","text":"It arrived by way of Muslim Spain. By the middle of the twelfth century the town of Xàtiva, near Valencia, was producing paper in quantity, and it is generally regarded as the site of the earliest European paper mill on record. Christian Europe was not immediately enthusiastic. Paper was associated with Islamic culture, and many officials doubted that it would last as long as parchment; in 1231 the Holy Roman Emperor went so far as to forbid its use for public documents. Attitudes changed after Italian makers, particularly in the town of Fabriano, introduced a series of improvements in the late thirteenth century. They used metal-tipped hammers to produce a finer pulp, replaced starch with gelatin made from animal hides, which made the paper more resistant to damp and insects, and pressed wire designs into their moulds to create watermarks that identified each workshop."},{"label":"G","text":"These improvements came at a decisive moment. When printing with movable type developed in Germany in the mid-fifteenth century, it depended on a supply of cheap, uniform paper. Some early printed Bibles were produced on vellum, a fine parchment, but a single vellum copy of a large book could require the skins of well over a hundred calves, and most copies were printed on paper instead. More than thirteen centuries after the first fragments appeared in China, paper had become the material on which the knowledge of the modern world would be recorded and shared."}],"groups":[{"type":"matching_info","instructions":"Questions 1–5\nReading Passage 1 has seven paragraphs, A–G.\nWhich paragraph contains the following information?\nWrite the correct letter, A–G.\nNB You may use any letter more than once.","options":["A","B","C","D","E","F","G"],"questions":[{"n":1,"text":"an explanation of why officials preferred paper to a material that could be altered","answer":["D"],"explain":"Paragraph D says text on parchment could be scraped away, while changes to paper left visible damage."},{"n":2,"text":"a reference to a ban on using paper for certain purposes","answer":["F"],"explain":"Paragraph F states that in 1231 the Holy Roman Emperor forbade paper for public documents."},{"n":3,"text":"doubts about a popular account of how a skill was passed on","answer":["C"],"explain":"Paragraph C says scholars are sceptical of the story of papermakers captured at Talas."},{"n":4,"text":"a material adopted because a plant used elsewhere was not locally available","answer":["E"],"explain":"Paragraph E says the paper mulberry did not grow in the region, so linen rags were used."},{"n":5,"text":"evidence that paper existed earlier than the traditionally accepted date","answer":["A"],"explain":"Paragraph A says fragments have been dated to two centuries before Cai Lun."}]},{"type":"tfng","instructions":"Questions 6–9\nDo the following statements agree with the information given in Reading Passage 1?\nWrite\nTRUE if the statement agrees with the information\nFALSE if the statement contradicts the information\nNOT GIVEN if there is no information on this","options":["TRUE","FALSE","NOT GIVEN"],"questions":[{"n":6,"text":"In China, paper was originally used mainly for writing.","answer":["FALSE"],"explain":"Paragraph B says the earliest paper was used for wrapping, padding and clothing rather than writing."},{"n":7,"text":"The papermakers captured near the Talas River were later allowed to return to China.","answer":["NOT GIVEN"],"explain":"Paragraph C describes the prisoners being taken to Samarkand but says nothing about their return."},{"n":8,"text":"Papermakers in the Islamic world used water power to help prepare pulp.","answer":["TRUE"],"explain":"Paragraph E mentions water-powered hammers used to beat rags into pulp."},{"n":9,"text":"The first recorded paper mill in Europe was in Italy.","answer":["FALSE"],"explain":"Paragraph F says Xàtiva in Spain is the site of the earliest European paper mill on record."}]},{"type":"short_answer","instructions":"Questions 10–13\nAnswer the questions below.\nChoose NO MORE THAN TWO WORDS AND/OR A NUMBER from the passage for each answer.","questions":[{"n":10,"text":"In which year is Cai Lun said to have presented paper to the emperor?","answer":["105","105 ce"],"explain":"Paragraph A gives the year 105 CE."},{"n":11,"text":"What type of writing tool was the smooth Islamic paper designed for?","answer":["reed pens","reed pen"],"explain":"Paragraph E says starch gave paper the surface needed for writing with reed pens."},{"n":12,"text":"What substance did Fabriano's papermakers use in place of starch?","answer":["gelatin","gelatine"],"explain":"Paragraph F says they replaced starch with gelatin made from animal hides."},{"n":13,"text":"The skins of which animals were needed to make a vellum copy of a large book?","answer":["calves"],"explain":"Paragraph G says a vellum copy could require the skins of over a hundred calves."}]}]},{"title":"Farming Upwards","intro":"Vertical farms promise fresh food grown in the heart of cities, but can they overcome their economic and energy problems?","paragraphs":[{"label":"A","text":"The idea of growing food inside tall buildings is older than many people assume. Architects sketched farm towers as early as the first half of the twentieth century, and science-fiction writers imagined cities fed entirely by indoor crops. For decades, however, the concept remained a curiosity. What has changed is a combination of pressures and possibilities. By the middle of this century, around two-thirds of the world's population is expected to live in cities, while climate change is making harvests in many traditional farming regions less predictable. At the same time, advances in lighting and computing have made it technically possible to grow plants in stacked layers, entirely indoors, without soil or sunlight. Since the late 2000s, commercial vertical farms have opened in North America, Europe and Asia, often in converted warehouses, and their supporters describe them as a fundamental rethinking of agriculture."},{"label":"B","text":"A modern vertical farm is a tightly controlled environment. Plants grow on shelves stacked many levels high, beneath rows of light-emitting diodes (LEDs) that can be tuned to deliver precisely the wavelengths plants use most efficiently. Most farms rely on hydroponics, in which roots sit in a solution of water and dissolved nutrients; some use aeroponics, where the roots hang in the air and are sprayed at intervals with a nutrient mist. Sensors monitor temperature, humidity, carbon dioxide and nutrient levels, and software adjusts conditions continuously. Because water is captured and recirculated, operators claim that they use up to 95 per cent less water than conventional fields, and because the growing rooms are sealed, pests are rare and pesticides are generally unnecessary. Plant scientists working with these farms have discovered that particular crops respond to specific combinations of red and blue light, which can alter not only growth rates but also flavour and colour."},{"label":"C","text":"Yet the range of crops that can be grown profitably in this way is narrow. Leafy greens, herbs and microgreens dominate, because they grow quickly, are compact, and are almost entirely edible, so very little of the energy invested in them is wasted. Staple crops are another matter. Wheat, rice and maize need months to mature, take up considerable space, and much of the plant – stalks, leaves and husks – is not eaten. Agricultural economists who have modelled indoor wheat production have concluded that, even with optimistic assumptions, a loaf of bread made from vertically farmed grain would cost many times more than one made from field-grown wheat. Since the bulk of the calories humans consume come from such staples, vertical farms are unlikely to make a significant contribution to basic food supply for the foreseeable future."},{"label":"D","text":"The most persistent difficulty is energy. Field crops receive their light free of charge from the sun; vertical farms must generate every photon from electricity. Lighting typically accounts for the largest share of a farm's operating costs, and climate control – removing the heat produced by the lights and the moisture released by the plants – adds substantially to the bill. Energy analysts have pointed out that the environmental case for vertical farming therefore depends heavily on where the electricity comes from. A farm powered largely by coal may have a larger carbon footprint per kilogram of lettuce than a field farm hundreds of kilometres away, even after the emissions from transporting the field-grown produce are included. Supporters reply that LED efficiency continues to improve, but the basic physics cannot be avoided: replacing the sun is expensive."},{"label":"E","text":"These realities have caught up with the industry. During the late 2010s, investors poured large sums into vertical farming start-ups, attracted by the promise of rapid growth. Building a large facility can cost tens of millions of dollars before a single crop is sold, and companies often expanded quickly in the hope of achieving economies of scale. When energy prices rose sharply in 2022 and interest rates increased, several prominent firms found themselves unable to cover their costs or raise new capital. A number closed facilities, and some went bankrupt altogether. Commentators who had predicted a revolution began to speak of a bubble."},{"label":"F","text":"It would be a mistake, however, to judge vertical farming purely on the price of its produce. Its strongest advocates are often found in places where conventional agriculture is difficult. In wealthy states with little arable land or harsh climates, such as Singapore and several countries in the Persian Gulf, food-security officials value the ability to produce fresh vegetables locally, reducing dependence on imports that can be disrupted by conflict, pandemics or trade disputes. In cities with long, dark winters, indoor farms can supply salad crops all year round. Urban planners, meanwhile, see opportunities to bring empty industrial buildings back into use and to create local jobs. None of these benefits appears on a supermarket price label, but they may justify public support."},{"label":"G","text":"What, then, is the likely future of the sector? Many specialists now expect a more modest and varied role than early enthusiasts envisaged. One promising direction is the hybrid greenhouse, which combines natural sunlight with supplemental LED lighting used only when daylight is insufficient, cutting energy demand considerably. Cheaper renewable electricity, more efficient lighting and greater automation may also improve the economics of fully indoor farms. Rather than replacing fields, vertical farms seem destined to occupy a niche: supplying high-value, perishable crops close to the consumers who eat them, and providing a degree of resilience in an uncertain climate."}],"groups":[{"type":"headings","instructions":"Questions 14–20\nReading Passage 2 has seven paragraphs, A–G.\nChoose the correct heading for each paragraph from the list of headings below.\nWrite the correct number, i–x.","options":["i Why staple crops remain out of reach","ii A technology that replaces sun and soil","iii The hidden cost of artificial daylight","iv An old dream given new urgency","v Investors lose patience","vi Benefits that prices do not show","vii A niche rather than a revolution","viii Governments restrict traditional farming","ix The decline of the conventional greenhouse","x Shoppers reject indoor-grown food"],"questions":[{"n":14,"text":"Paragraph A","answer":["iv"],"explain":"Paragraph A traces the old idea of farm towers and the new pressures that have revived it."},{"n":15,"text":"Paragraph B","answer":["ii"],"explain":"Paragraph B describes LEDs, hydroponics and aeroponics growing plants without sunlight or soil."},{"n":16,"text":"Paragraph C","answer":["i"],"explain":"Paragraph C explains why wheat, rice and maize cannot be grown profitably indoors."},{"n":17,"text":"Paragraph D","answer":["iii"],"explain":"Paragraph D focuses on the electricity costs and emissions of artificial lighting."},{"n":18,"text":"Paragraph E","answer":["v"],"explain":"Paragraph E describes firms failing to raise new capital after 2022."},{"n":19,"text":"Paragraph F","answer":["vi"],"explain":"Paragraph F lists benefits that do not appear on a supermarket price label."},{"n":20,"text":"Paragraph G","answer":["vii"],"explain":"Paragraph G predicts vertical farms will occupy a niche rather than replace fields."}]},{"type":"matching_features","instructions":"Questions 21–23\nLook at the following statements (Questions 21–23) and the list of groups below.\nMatch each statement with the correct group, A–E.\nNB You may use any letter more than once.","options":["A plant scientists","B energy analysts","C agricultural economists","D urban planners","E food-security officials"],"questions":[{"n":21,"text":"Certain colours of light can change how a crop tastes and looks.","answer":["A"],"explain":"Paragraph B says plant scientists found red and blue light can alter flavour and colour."},{"n":22,"text":"The environmental value of vertical farms depends on how their power is generated.","answer":["B"],"explain":"Paragraph D says energy analysts linked the environmental case to the source of electricity."},{"n":23,"text":"Bread from indoor-grown wheat would be far more expensive than ordinary bread.","answer":["C"],"explain":"Paragraph C says agricultural economists modelled indoor wheat and found bread would cost many times more."}]},{"type":"sentence_completion","instructions":"Questions 24–26\nComplete the sentences below.\nChoose NO MORE THAN TWO WORDS from the passage for each answer.","questions":[{"n":24,"text":"According to operators, recirculation allows vertical farms to reduce their consumption of ______ by as much as 95 per cent.","answer":["water"],"explain":"Paragraph B says operators claim they use up to 95 per cent less water."},{"n":25,"text":"In aeroponic systems, roots hanging in the air are sprayed at intervals with a ______.","answer":["nutrient mist","mist"],"explain":"Paragraph B says aeroponic roots are sprayed with a nutrient mist."},{"n":26,"text":"Hybrid greenhouses use ______ lighting only when there is not enough daylight.","answer":["supplemental led","supplemental"],"explain":"Paragraph G describes hybrid greenhouses using supplemental LED lighting when daylight is insufficient."}]}]},{"title":"Saving Disappearing Languages","intro":"Thousands of the world's languages are at risk. What can be done to keep them alive, and who should decide?","paragraphs":[{"label":"A","text":"Of the roughly 7,000 languages spoken in the world today, a strikingly small number account for the overwhelming majority of speakers: fewer than a hundred languages are the mother tongues of most of humanity. Commonly cited estimates suggest that around 40 per cent of all languages are now endangered. Such figures should be approached with some care. Counting languages is notoriously difficult, partly because the boundary between a language and a dialect is as much political as linguistic, and partly because reliable census data are unavailable for many regions. Nonetheless, the overall trend is not seriously disputed: languages are falling silent faster than at any point in recorded history."},{"label":"B","text":"Languages rarely disappear because their speakers do. Far more often, a community undergoes what linguists call language shift, gradually abandoning its ancestral language in favour of one that is more widely spoken. The decisive moment is the breakdown of intergenerational transmission – when parents stop speaking the language to their children. Parents who make this choice are seldom acting carelessly; on the contrary, they are typically responding sensibly to circumstances in which the dominant language offers access to education, employment and social respect, while the ancestral language may carry a stigma. The tragedy of language shift is precisely that it can result from a series of individually reasonable decisions."},{"label":"C","text":"Against this background, the revival of Hebrew is often cited as proof that the process can be reversed. For centuries Hebrew had been a language of religion and scholarship, but nobody's mother tongue. In the late nineteenth and early twentieth centuries, Jewish settlers in Palestine set about turning it into an everyday spoken language, establishing Hebrew-medium kindergartens and schools in which children acquired it natively. Today it is spoken by millions. Yet the case is less easily generalised than its fame suggests. The revivalists were driven by a powerful national ideology, and immigrants arriving from many different countries needed a common language, which gave Hebrew a practical function that few endangered languages can claim. Hebrew is best understood not as a template but as an exceptional outcome of exceptional conditions."},{"label":"D","text":"Welsh offers a more typical example. Welsh never ceased to be spoken, but over the twentieth century the proportion of the population of Wales able to speak it fell steeply as English dominated public life. From the 1960s onwards, campaigners pressed for change, and a series of measures followed: a Welsh-language television channel began broadcasting in 1982, legislation gave the language equal status with English in the public sector, and Welsh-medium schools expanded. The Welsh government has set the goal of a million speakers by 2050. Progress, however, has not been steady. The most recent census recorded a slight fall in the proportion of Welsh speakers, a reminder that institutional support does not automatically translate into everyday use."},{"label":"E","text":"In New Zealand, the Māori language had declined so sharply by the 1970s that relatively few children were growing up as fluent speakers. The response came largely from within Māori communities themselves. In 1982 the first kōhanga reo, or 'language nests', opened: preschool centres in which young children were cared for entirely in Māori, often by grandparents and other elders who had grown up speaking it. Māori was made an official language in 1987. The language-nest model has since been adopted by communities in Hawaii and elsewhere. Even so, the number of highly fluent speakers remains modest, and revitalisation workers stress that schools alone cannot replace the home as the setting in which a language is passed on."},{"label":"F","text":"Technology is frequently presented as a new ally. Smartphone apps, online dictionaries, digital keyboards for unusual scripts and social media groups allow scattered speakers to communicate and learners to practise. There are limits, though. The machine translation and speech recognition tools that serve major languages are built from enormous collections of text and audio, and most endangered languages simply lack material on that scale. Critics also warn that documentation can produce a kind of museum language – carefully archived but no longer spoken. This criticism is fair up to a point, but a well-made archive is far from worthless: in North America, at least one language that had had no native speakers for more than a century has been brought back into home use with the help of written records."},{"label":"G","text":"Among linguists themselves, the appropriate response remains contested. Some argue that, given limited time and funding, the discipline's first obligation is documentation: producing grammars, dictionaries and recordings so that the knowledge contained in a language is not lost to science. Others contend that this approach treats communities as sources of data, and that the priorities of speakers – who may care more about teaching their grandchildren than about academic publications – should come first. Ethical questions about the ownership of recordings made decades ago, many of them removed to distant universities, have added to the tension. A minority of scholars go further, suggesting that language loss is a natural process and that outsiders have no business interfering in the choices communities make. This position, in my view, overlooks how rarely language shift is freely chosen; it typically takes place under conditions of marked inequality. Equally, though, it would be wrong to conclude that outside experts should withdraw altogether. Their skills can be invaluable, provided that the community, rather than the researcher, sets the agenda."},{"label":"H","text":"If the cases of Hebrew, Welsh and Māori share a lesson, it is that no single formula guarantees success. Laws, schools and broadcasting can create space for a language, but only speakers can fill it. Where a community is determined to keep its language alive and is given practical support to do so, decline can be slowed and sometimes reversed."}],"groups":[{"type":"mcq","instructions":"Questions 27–31\nChoose the correct letter, A, B, C or D.","questions":[{"n":27,"text":"Accor
