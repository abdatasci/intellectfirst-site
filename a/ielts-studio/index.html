evelopment depends on striking a balance between challenge and support. Failure is an invaluable teacher, but only when people have the encouragement and reassurance needed to learn from it rather than be defeated by it."}];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const paras=t=>String(t||"").split(/\n\s*\n/).map(p=>`<p>${esc(p.trim())}</p>`).join("");
const wordsOf=t=>(String(t).match(/[A-Za-z0-9'’-]+/g)||[]);
let P={};
try{P=JSON.parse(localStorage.getItem("if-ielts-studio")||"{}")||{};}catch(e){P={};}
function fixP(){const O=x=>x&&typeof x==="object"&&!Array.isArray(x);if(!O(P))P={};["vocab","reading","writing","speaking"].forEach(k=>{if(!O(P[k]))P[k]={};});if(!O(P.writing.drafts))P.writing.drafts={};if(!O(P.writing.done))P.writing.done={};if(!O(P.speaking.done))P.speaking.done={};P.target=[5.5,6,6.5,7,7.5,8,8.5].includes(+P.target)?+P.target:7;Object.keys(P.reading).forEach(k=>{const r=P.reading[k];if(!O(r)||typeof r.score!=="number")delete P.reading[k];});}
fixP();
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem("if-ielts-studio",JSON.stringify(P));}catch(e){}},200);}
const canSpeak=(()=>{try{return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";}catch(e){return false;}})();
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;speechSynthesis.speak(u);}catch(e){}}

/* ---------- AI (only inside Claude) ---------- */
const VIEWS=["home","lessons","listening","reading","writing","speaking","vocabulary"];
let cur="home";
let AI=null;
$("#modeNote").textContent="Offline mode · self-marking with checklists";
(async()=>{
  await Promise.resolve();

/* ---------- lessons: the IF App IELTS course, self-paced or in class (Teach mode for teachers) ---------- */
function renderLessons(){
  const el=$("#v-lessons"); if(el.dataset.on)return; el.dataset.on="1";
  el.innerHTML='<div class="panel" style="padding:0;overflow:hidden"><iframe src="/app/?embed=1#/course/ielts" title="IELTS lessons" style="width:100%;height:calc(100vh - 150px);min-height:620px;border:0;display:block" allow="autoplay"></iframe></div><p class="note">Lessons first, then practise the same part here in the Studio. Teachers: open a lesson and press <b>Teach mode</b> for the projector.</p>';
}
/* ---------- router ---------- */
function go(v){
  if(!VIEWS.includes(v))v="home";cur=v;
  VIEWS.forEach(x=>$("#v-"+x).hidden=x!==v);
  $$(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));
  try{history.replaceState(null,"","#"+v);}catch(e){}
  const R={home:renderHome,lessons:renderLessons,listening:renderListening,vocabulary:renderVocab,reading:renderReading,writing:renderWriting,speaking:renderSpeaking}[v];
  try{R();}catch(err){
    // progress saved by an older version of the Studio can break a page: keep a backup, start fresh, and draw again
    console.error("IELTS Studio",err);
    if(!go.reset){go.reset=true;try{localStorage.setItem("if-ielts-studio.backup",localStorage.getItem("if-ielts-studio")||"");}catch(e){}
      const t=P.target;P={target:t};fixP();P.custom={reading:[],writing:[]};save();try{R();}catch(e2){$("#v-"+v).innerHTML='<div class="panel"><h3>Sorry, this page could not open.</h3><p>Please reload. If it keeps happening, tell your teacher.</p></div>';}
      const n=document.createElement("p");n.className="note";n.textContent="Your saved Studio progress on this device was from an older version and could not be read, so the Studio started fresh.";$("#v-"+v).prepend(n);}
  }
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){e.preventDefault();go(b.dataset.go);}});
$$(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));

/* ---------- band conversion ---------- */
function readingBand(s){const t=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[2,2],[1,1]];for(const [m,b] of t)if(s>=m)return b;return 0;}
const bandFmt=b=>Number(b).toFixed(1);

const optKey=o=>String(o).trim().split(/\s+/)[0].replace(/[.)]$/,"");

function isRight(q){const a=R.ans[q.n];if(a==null||a==="")return false;return q.answer.some(x=>norm(x)===norm(a));}

function updCount(){const T=READING[R.test];const n=allQs(T).filter(x=>R.ans[x.q.n]!=null&&R.ans[x.q.n]!=="").length;const el=$("#rCount");if(el)el.textContent=n+"/40 answered";}
function confirmSubmit(){
  const T=READING[R.test];const left=40-allQs(T).filter(x=>R.ans[x.q.n]).length;
  if(left>0&&!$("#rConfirm")){$("#rResult").innerHTML=`<div class="note" id="rConfirm" style="margin-bottom:14px">You have ${left} unanswered question${left>1?"s":""}. Unanswered questions score zero. <button class="btn sm gold" id="rYes">Submit anyway</button> <button class="btn sm" id="rNo">Keep working</button></div>`;$("#rYes").onclick=()=>submitTest();$("#rNo").onclick=()=>$("#rResult").innerHTML="";return;}
  submitTest();
}
function submitTest(auto){
  clearInterval(R.tid);R.submitted=true;
  const T=READING[R.test];allQs(T).forEach(x=>R.marked[x.q.n]=true);
  const score=allQs(T).filter(x=>isRight(x.q)).length,band=readingBand(score);
  const prev=P.reading[T.id];if(!prev||score>prev.score){P.reading[T.id]={score,band,date:new Date().toISOString().slice(0,10)};save();}
  R.autoEnded=!!auto;readingTest();window.scrollTo(0,0);
}
const TYPE_NAMES={tfng:"True / False / Not Given",ynng:"Yes / No / Not Given",mcq:"Multiple choice",headings:"Matching headings",matching_info:"Matching information",matching_features:"Matching features",sentence_completion:"Sentence completion",summary_completion:"Summary completion",short_answer:"Short answer"};
function showResult(){
  const T=READING[R.test],qs=allQs(T),score=qs.filter(x=>isRight(x.q)).length,band=readingBand(score);
  const byP=T.passages.map((p,i)=>{const a=qs.filter(x=>x.pi===i);return [a.filter(x=>isRight(x.q)).length,a.length];});
  const types={};qs.forEach(x=>{const k=x.g.type;types[k]=types[k]||[0,0];types[k][1]++;if(isRight(x.q))types[k][0]++;});
  $("#rResult").innerHTML=`<div class="panel" style="margin-bottom:18px"><div class="result">
    <div class="bandbig">${bandFmt(band)}<small>Reading band · ${score}/40</small></div>
    <div>${R.autoEnded?`<p class="note" style="margin:0 0 10px">Time is up. Your answers were submitted automatically.</p>`:""}
      <div class="row" style="gap:18px;margin-bottom:10px">${byP.map((x,i)=>`<span><span class="label">Passage ${i+1}</span> <b class="num">${x[0]}/${x[1]}</b></span>`).join("")}</div>

      <p class="hint" style="margin:10px 0 0">Every question below now shows the correct answer and why. Green means correct, red means incorrect.</p>
    </div></div></div>`;
}
function fbHTML(q){if(!R.marked[q.n])return "";const ok=isRight(q);return `<div class="fb"><b>${ok?"Correct":"Answer: "+esc(q.answer[0])}</b>${R.ans[q.n]&&!ok?` <span class="muted">(you wrote ${esc(R.ans[q.n])})</span>`:""} · ${esc(q.explain||"")}</div>`;}
function qCls(q){return R.marked[q.n]?(isRight(q)?" ok":" bad"):"";}
function renderGroup(g){
  const dis=R.submitted?" disabled":"";
  let h=`<div class="qgroup"><div class="instr">${esc(g.instructions)}</div>`;
  if(g.options&&["headings","matching_features"].includes(g.type))h+=`<div class="optbox">${g.type==="headings"?'<div class="label">List of headings</div>':""}${g.options.map(o=>`<div>${esc(o)}</div>`).join("")}</div>`;
  const sel=(q,opts)=>`<select class="gap" data-n="${q.n}" aria-label="Question ${q.n}"${dis}><option value=""></option>${opts.map(o=>{const k=optKey(o);return `<option value="${esc(k)}"${R.ans[q.n]===k?" selected":""}>${esc(k)}</option>`;}).join("")}</select>`;
  const inp=q=>`<input class="gap" type="text" autocomplete="off" spellcheck="false" data-n="${q.n}" aria-label="Question ${q.n}" value="${esc(R.ans[q.n]||"")}"${dis}>`;
  if(g.type==="summary_completion"){
    const qmap={};g.questions.forEach(q=>qmap[q.n]=q);
    if(g.options)h+=`<div class="optbox">${g.options.map(o=>`<div>${esc(o)}</div>`).join("")}</div>`;
    h+=`<div class="summary">${esc(g.summary||"").replace(/\{\{(\d+)\}\}/g,(m,n)=>{const q=qmap[n];if(!q)return m;return `<b class="num">${n}</b> ${g.options?sel(q,g.options):inp(q)}`;})}</div>`;
    h+=g.questions.filter(q=>R.marked[q.n]).map(q=>`<div class="q${qCls(q)}"><span class="n">${q.n}</span><span></span>${fbHTML(q)}</div>`).join("");
    return h+"</div>";
  }
  g.questions.forEach(q=>{
    let body="";
    if(g.type==="tfng"||g.type==="ynng"){const vals=g.type==="tfng"?["TRUE","FALSE","NOT GIVEN"]:["YES","NO","NOT GIVEN"];body=`${esc(q.text)}<div class="pills">${vals.map(v=>`<label><input type="radio" name="q${q.n}" value="${v}" data-n="${q.n}"${R.ans[q.n]===v?" checked":""}${dis}>${v}</label>`).join("")}</div>`;}
    else if(g.type==="mcq"){body=`${esc(q.text)}<div class="choices">${(q.choices||[]).map(c=>{const k=optKey(c);return `<label><input type="radio" name="q${q.n}" value="${esc(k)}" data-n="${q.n}"${R.ans[q.n]===k?" checked":""}${dis}><span>${esc(c)}</span></label>`;}).join("")}</div>`;}
    else if(["headings","matching_info","matching_features"].includes(g.type)){const opts=g.options||[];body=`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span>${esc(q.text)}</span>${sel(q,opts)}</div>`;}
    else{const t=esc(q.text||"");body=/_{3,}/.test(t)?t.replace(/_{3,}/,inp(q)):`${t} ${inp(q)}`;}
    h+=`<div class="q${qCls(q)}"><span class="n">${q.n}</span><div>${body}</div>${fbHTML(q)}</div>`;
  });
  return h+"</div>";
}

function analyse(t,task){

  return{c,n,min};
}

async function aiMark(w,text){
  if(!AI||WR.busy)return;
  if(wordsOf(text).length<40){WR.ai={err:"Write at least 40 words before asking the examiner to mark your answer."};renderFb(w);return;}
  WR.busy=true;WR.ai=null;WR.fb=null;WR.ctl=new AbortController();renderFb(w);$("#wAI").disabled=true;
  const t1=WR.task===1;
  const prompt=`You are an experienced, strict IELTS Academic Writing examiner. Mark this Task ${WR.task} answer using the official public band descriptors.\n\nTASK PROMPT:\n${w.prompt}\n${t1&&w.chart?"\nCHART DATA (JSON):\n"+JSON.stringify(w.chart)+"\n":t1?"\n(The chart is not available to you. Judge structure, overview, comparisons and language; do not penalise figures you cannot check.)\n":""}\nCANDIDATE ANSWER (${wordsOf(text).length} words):\n"""${text}"""\n\nReturn ONLY a JSON object, with no other text, in this shape:\n{"overall": number (nearest 0.5),\n "criteria": [{"name":"${t1?"Task Achievement":"Task Response"}","band":number,"comment":"2 sentences"},{"name":"Coherence and Cohesion","band":number,"comment":"..."},{"name":"Lexical Resource","band":number,"comment":"..."},{"name":"Grammatical Range and Accuracy","band":number,"comment":"..."}],\n "strengths":["...","..."],\n "improvements":["specific, actionable point","...","..."],\n "corrections":[{"original":"exact short phrase copied from the answer","better":"corrected version","why":"brief reason"}]}\nCriterion bands are whole numbers. Give up to 6 corrections of real errors. Penalise answers under ${t1?150:250} words.${t1?" Check the figures against the chart data.":""} Write comments directly to the student in simple English.`;
  try{
    const res=await AI.json(prompt,{signal:WR.ctl.signal,cache:false});
    WR.ai={res};P.writing.done[w.id]={band:res.overall,by:"ai"};save();
  }catch(e){
    WR.ai={err:e&&e.code==="aborted"?"Marking stopped.":e&&e.code==="not_granted"?"AI marking was not allowed. Use “Check my writing” instead.":e&&e.code==="rate_limited"?"Too many requests just now. Try again in a minute.":"The examiner could not mark this answer. Try again, or use “Check my writing”."};
    if(e&&e.code==="not_granted"){AI=null;document.body.classList.remove("ai");}
  }
  WR.busy=false;const b=$("#wAI");if(b)b.disabled=false;renderFb(w);
}

function langSection(sec){return `<div class="langsec" id="L-${sec.id}"><h3>${esc(sec.title)}</h3>${sec.note?`<p class="hint" style="margin:4px 0 10px">${esc(sec.note)}</p>`:""}<div class="scroll-x"><table class="t lang">${sec.rows.map(r=>`<tr><td>${esc(r[0])}</td>${r[1]!==undefined?`<td class="muted">${esc(r[1])}</td>`:""}</tr>`).join("")}</table></div>${sec.ex.length?`<div class="langex">${sec.ex.map(e=>`<p><span class="label">Example</span> ${esc(e)}</p>`).join("")}</div>`:""}</div>`;}
function langForTask(w){
  if(WR.task===2)return LANG.t2.filter(s=>["t2intro","t2body","t2concede","t2concl"].includes(s.id));
  const ids=LANG_FOR[w.type]||LANG_FOR.bar;return ids.map(id=>LANG.t1.find(s=>s.id===id)).filter(Boolean);
}
function languageBank(){
  const which=WR.lang||"t1";
  $("#wBody").innerHTML=`<div class="row" style="margin-bottom:14px"><div class="ptabs">${[["t1","Task 1 language"],["t2","Task 2 language"]].map(([k,l])=>`<button aria-selected="${which===k}" data-lk="${k}">${l}</button>`).join("")}</div>
  <a class="btn sm" id="lVocab" target="_top">Practise these words in the course</a><button class="btn sm gold" data-pdf="ielts-writing-language-bank">⬇ Download PDF</button></div><p class="hint" id="pdfMsg" style="margin:-6px 0 12px"></p>
  <p class="note" style="margin:0 0 12px">🧩 <b>Grammar for IELTS</b>: 12 topics (tenses for data, passives for processes, linking, hedging and more) with rule sheets, quizzes and team games are in the <a href="/a/if-english/courses/IELTS/index.html" target="_top"><b>IELTS Grammar &amp; Games</b></a> page.</p>
  <nav class="langnav">${LANG[which].map(s=>`<a href="#L-${s.id}" data-jump-l="${s.id}">${esc(({intro:"Introduction",overview:"Overview",up:"Going up",down:"Going down",stable:"No change",degree:"How much",structures:"Sentence patterns",prep:"Prepositions",compare:"Comparing",approx:"Proportions",process:"Process",map:"Maps",t1errors:"Mistakes",t2intro:"Introduction",t2body:"Body paragraphs",t2concede:"Balancing",t2concl:"Conclusion",t2formal:"Formal words",t2errors:"Mistakes"})[s.id]||s.title)}</a>`).join("")}</nav>
  <div class="langgrid">${LANG[which].map(langSection).join("")}</div>`;
  $$("#wBody [data-lk]").forEach(b=>b.onclick=()=>{WR.lang=b.dataset.lk;languageBank();});
  $$("#wBody [data-jump-l]").forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById("L-"+a.dataset.jumpL);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});
  $("#lVocab").href="/app/ielts/#/course/cvi-ielts";
}

/* ---------- PDF downloads (signed-in IF Academy students and teachers) ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-pdf]");if(!b)return;
  const msg=$("#pdfMsg"),say=t=>{if(msg)msg.innerHTML=t;};
  b.disabled=true;const was=b.textContent;b.textContent="Preparing…";say("");
  try{
    // Telegram mini-app: the page can't save files there, so Telegram downloads it (or opens it in the phone's browser)
    const TG=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData?Telegram.WebApp:null;
    if(TG){const r=await fetch("/api/school/download/"+b.dataset.pdf+"?link=1",{credentials:"same-origin"});
      if(r.ok){const d=await r.json();
        if(TG.downloadFile&&TG.isVersionAtLeast&&TG.isVersionAtLeast("8.0")){TG.downloadFile({url:d.url,file_name:d.name});say("Telegram is downloading the PDF. Tap <b>Download</b> if it asks, then open it from the Files app or your Downloads.");}
        else{TG.openLink(d.url);say("The PDF opened in your phone’s browser. Use Share → Save to Files to keep it.");}
        b.disabled=false;b.textContent=was;return;}
    }
    const r=await fetch("/api/school/download/"+b.dataset.pdf,{credentials:"same-origin"});
    if(r.ok){const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=u;a.download=(b.dataset.pdf==="ielts-vocabulary-bank"?"IF Academy - IELTS Vocabulary Bank":"IF Academy - IELTS Writing Language Bank")+".pdf";
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);say("Downloaded. Look in your Downloads folder (on iPhone: the Files app).");}
    else{let d={};try{d=await r.json();}catch(x){}
      if(r.status===401||d.error==="signin"||d.error==="login"||d.error==="activate")say('PDFs are for IF Academy students and teachers. <a href="/me/#/login" target="_top">Sign in</a> or <a href="/me/#/register" target="_top">create an account</a>, then come back.');
      else if(d.error==="members")say('PDFs are part of full access for IF Academy students. <a href="/me/" target="_top">See your account</a>.');
      else say("Could not download right now. Please try again.");}
  }catch(x){say("Could not download right now. Check your internet and try again.");}
  b.disabled=false;b.textContent=was;
});
