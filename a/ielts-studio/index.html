ding to paragraph B, a language is most seriously threatened when","choices":["A its speakers die in large numbers.","B children no longer acquire it at home.","C it is no longer taught in schools.","D it loses its official status."],"answer":["B"],"explain":"Paragraph B calls the breakdown of transmission from parents to children the decisive moment."},{"n":28,"text":"The writer's main point about the revival of Hebrew is that it","choices":["A shows that any language can be revived.","B depended on unusual circumstances.","C was achieved mainly through religious institutions.","D took place without formal education."],"answer":["B"],"explain":"Paragraph C calls it an exceptional outcome of exceptional conditions such as ideology and immigrants' need for a common language."},{"n":29,"text":"What does the writer say about the most recent census figures for Welsh?","choices":["A They suggest the 2050 target will be reached early.","B They show that official support does not guarantee everyday use.","C They are less reliable than earlier figures.","D They show that most speakers are now elderly."],"answer":["B"],"explain":"Paragraph D says the slight fall shows institutional support does not automatically lead to everyday use."},{"n":30,"text":"The first Māori 'language nests'","choices":["A were set up by the national government.","B involved older fluent speakers caring for young children.","C were designed mainly for adult learners.","D were based on a model developed in Hawaii."],"answer":["B"],"explain":"Paragraph E says children were cared for in Māori, often by grandparents and other elders."},{"n":31,"text":"Why are machine translation tools of limited use for most endangered languages?","choices":["A Not enough written and spoken material exists.","B Speakers refuse to use digital devices.","C The equipment needed is too expensive.","D Their scripts cannot be typed on keyboards."],"answer":["A"],"explain":"Paragraph F says such tools need enormous collections of text and audio that endangered languages lack."}]},{"type":"ynng","instructions":"Questions 32–36\nDo the following statements agree with the claims of the writer in Reading Passage 3?\nWrite\nYES if the statement agrees with the claims of the writer\nNO if the statement contradicts the claims of the writer\nNOT GIVEN if it is impossible to say what the writer thinks about this","options":["YES","NO","NOT GIVEN"],"questions":[{"n":32,"text":"Statistics on the number of endangered languages should be treated with caution.","answer":["YES"],"explain":"Paragraph A says such figures should be approached with some care."},{"n":33,"text":"Parents who stop speaking their ancestral language to their children are usually acting irresponsibly.","answer":["NO"],"explain":"Paragraph B says such parents are seldom acting carelessly and are responding sensibly."},{"n":34,"text":"Welsh-language television has done more to support Welsh than Welsh-medium schools have.","answer":["NOT GIVEN"],"explain":"Paragraph D mentions both measures but never compares their effectiveness."},{"n":35,"text":"Archives of recordings can be useful even after a language has stopped being spoken.","answer":["YES"],"explain":"Paragraph F says a well-made archive is far from worthless and has helped bring a language back."},{"n":36,"text":"Linguists from outside a community should not be involved in language revitalisation.","answer":["NO"],"explain":"Paragraph G says it would be wrong for outside experts to withdraw altogether."}]},{"type":"summary_completion","instructions":"Questions 37–40\nComplete the summary using the list of words, A–H, below.\nWrite the correct letter, A–H.","options":["A documentation","B priorities","C ownership","D natural","E funding","F inequality","G translation","H publications"],"summary":"Linguists disagree about how best to respond to language endangerment. One group believes the discipline should give first place to {{37}}, so that grammars, dictionaries and recordings preserve a language for science. Their opponents argue that the {{38}} of speakers matter more. Disputes about the {{39}} of old recordings, many now held far from the communities that made them, have increased this tension. A small number of scholars regard language loss as {{40}} and believe outsiders should not interfere.","questions":[{"n":37,"text":"","answer":["A"],"explain":"Paragraph G says some see the discipline's first obligation as documentation."},{"n":38,"text":"","answer":["B"],"explain":"Paragraph G says others believe the priorities of speakers should come first."},{"n":39,"text":"","answer":["C"],"explain":"Paragraph G mentions ethical questions about the ownership of recordings."},{"n":40,"text":"","answer":["D"],"explain":"Paragraph G says a minority regard language loss as a natural process."}]}]}]},{"id":"T3","title":"Academic Reading Test 3","passages":[{"title":"The First Riders: Horses on the Kazakh Steppe","intro":"You should spend about 20 minutes on Questions 1–13, which are based on Reading Passage 1 below.","paragraphs":[{"label":"A","text":"Few questions in prehistory have proved as stubborn as when, and where, people first began to manage and ride horses. For much of the twentieth century, scholars assumed that the answer lay somewhere on the vast grasslands that stretch from Ukraine to Mongolia, but direct evidence was frustratingly scarce. Horses leave few distinctive traces when they are tamed. Unlike cattle or sheep, early domestic horses did not shrink markedly in size, and their skeletons look much like those of their wild relatives. As a result, archaeologists have had to rely on indirect clues, and the site that has supplied more of these clues than any other lies in the north of present-day Kazakhstan."},{"label":"B","text":"The Botai culture, named after its best-known settlement on the Iman-Burluk river in what is now the North Kazakhstan Region, flourished from roughly 3700 to 3100 BCE. Excavations that began in the 1980s revealed a village of more than 150 semi-subterranean pit houses, together with an extraordinary quantity of animal bone. Of the several hundred thousand bone fragments recovered, the overwhelming majority, by most estimates well over 90 per cent, belong to horses. Few, if any, other sites of the Copper Age show such a heavy dependence on a single species, and this concentration prompted early investigators to propose that the Botai people were not simply hunters but among the world's first horse keepers."},{"label":"C","text":"Sceptics objected that a community of skilled hunters could equally have produced such a heap of bones. Wild horses roamed the steppe in large herds and might have been driven into natural traps or ambushed at watering places, and the near absence of other domestic animals at Botai seemed, to some, to argue against any form of herding. If the Botai people had been pastoralists, these critics asked, why did they keep no cattle, sheep or goats? The debate therefore turned on a narrower question: did the bones show signs of human management, or merely of human consumption?"},{"label":"D","text":"Some of the most widely discussed evidence came from a study published in 2009 by an international team of archaeologists. Examining horse teeth from Botai and the neighbouring site of Krasnyi Yar, the researchers identified wear on the front edges of the lower premolars of a kind often associated with a bit, a mouthpiece usually attached to reins that allows a rider or driver to control the animal. Because metal was not in use at Botai, any bit would have been made of rope, leather or sinew, materials that rarely survive in the ground; damage to the teeth was therefore the only trace such equipment could have left. The same team also measured the lower leg bones of the Botai horses and reported that they were more slender than those of wild horses from earlier periods, resembling instead the proportions of later domestic animals."},{"label":"E","text":"A second line of evidence was chemical. Fatty residues that had soaked into the walls of Botai pottery were extracted and analysed. Fats from milk can be told apart from those of meat by subtle differences in their hydrogen isotopes, and on this basis the analysts concluded that several vessels had once held mare's milk. If correct, the finding was significant, since a wild mare will not tolerate being milked. Regular milking implies animals that accept close human contact over long periods, which is widely regarded as a hallmark of domestication. Fermented mare's milk, known as kymyz, remains a valued drink across Kazakhstan today, although it would be rash to assume an unbroken tradition stretching back more than five thousand years."},{"label":"F","text":"In 2018, however, a genetic study complicated the picture considerably. Researchers sequenced ancient genomes from Botai horses and compared them with those of modern breeds and of Przewalski's horse, a stocky, upright-maned animal long regarded as the last truly wild horse on Earth. The results were unexpected. The Botai horses turned out to be the ancestors not of today's domestic horses but of Przewalski's horses, while modern domestic horses carried only a very small fraction of Botai ancestry. Two conclusions followed. First, Przewalski's horses may not be wild at all but feral: the descendants of animals once managed by people that later returned to a free-living existence. Second, the horses ridden across the world today must have been domesticated elsewhere; a subsequent study pointed to the western steppe, near the lower reaches of the Volga and Don rivers, at around 2200 BCE."},{"label":"G","text":"The genetic results do not, by themselves, settle whether the Botai people rode or milked their horses. Indeed, some specialists have since questioned the bit-wear evidence, arguing that similar damage can arise naturally in wild animals, while others maintain that the combined archaeological and chemical evidence still points to some form of management. What seems clear is that the history of the horse is less linear than once believed. Rather than a single moment of domestication from which all later horses descend, the steppe may have witnessed several experiments in living alongside horses, not all of which left lasting descendants. In this view, Botai represents an early chapter whose line was later overtaken, but whose horses survive in an unexpected form, in the herds of Przewalski's horses now being reintroduced to the grasslands of Mongolia and, more recently, of Kazakhstan itself."}],"groups":[{"type":"matching_info","instructions":"Questions 1–5\nReading Passage 1 has seven paragraphs, A–G.\nWhich paragraph contains the following information?\nWrite the correct letter, A–G, in boxes 1–5 on your answer sheet.\nNB You may use any letter more than once.","options":["A","B","C","D","E","F","G"],"questions":[{"n":1,"text":"a reason why skeletal remains may not reveal whether horses were domesticated","answer":["A"],"explain":"Paragraph A states that early domestic horses did not shrink and their skeletons look much like those of wild relatives."},{"n":2,"text":"an explanation of why a piece of equipment has left no direct trace","answer":["D"],"explain":"Paragraph D explains that a bit made of rope, leather or sinew would rarely survive, so tooth damage is the only trace."},{"n":3,"text":"a reference to a present-day custom","answer":["E"],"explain":"Paragraph E notes that fermented mare's milk, kymyz, remains a valued drink in Kazakhstan today."},{"n":4,"text":"a suggestion that an animal commonly considered wild may not be","answer":["F"],"explain":"Paragraph F says Przewalski's horses may not be wild at all but feral."},{"n":5,"text":"an alternative explanation for the large number of horse bones found at a site","answer":["C"],"explain":"Paragraph C argues that skilled hunters could equally have produced the heap of bones."}]},{"type":"tfng","instructions":"Questions 6–9\nDo the following statements agree with the information given in Reading Passage 1?\nIn boxes 6–9 on your answer sheet, write\nTRUE if the statement agrees with the information\nFALSE if the statement contradicts the information\nNOT GIVEN if there is no information on this","questions":[{"n":6,"text":"The Botai settlement contained over 150 dwellings.","answer":["true"],"explain":"Paragraph B describes a village of more than 150 semi-subterranean pit houses."},{"n":7,"text":"The 2009 study found that the leg bones of Botai horses were thicker than those of earlier wild horses.","answer":["false"],"explain":"Paragraph D reports that the Botai leg bones were more slender than those of earlier wild horses."},{"n":8,"text":"Some Botai pottery was decorated with images of horses.","answer":["not given"],"explain":"Paragraph E discusses residues inside the pottery but says nothing about how it was decorated."},{"n":9,"text":"Cattle and sheep bones were common at the Botai site.","answer":["false"],"explain":"Paragraph C refers to the near absence of other domestic animals and asks why the Botai kept no cattle, sheep or goats."}]},{"type":"sentence_completion","instructions":"Questions 10–13\nComplete the sentences below.\nChoose NO MORE THAN TWO WORDS AND/OR A NUMBER from the passage for each answer.\nWrite your answers in boxes 10–13 on your answer sheet.","questions":[{"n":10,"text":"The Botai culture is believed to have lasted until approximately ______ BCE.","answer":["3100"],"explain":"Paragraph B dates the Botai culture from roughly 3700 to 3100 BCE."},{"n":11,"text":"A bit is normally connected to ______, enabling a person to control a horse.","answer":["reins"],"explain":"Paragraph D defines a bit as a mouthpiece usually attached to reins."},{"n":12,"text":"Scientists can distinguish milk fats from meat fats by examining their ______.","answer":["hydrogen isotopes","isotopes"],"explain":"Paragraph E says milk and meat fats differ in their hydrogen isotopes."},{"n":13,"text":"Descendants of the Botai horses are now being ______ to grasslands in Mongolia and Kazakhstan.","answer":["reintroduced"],"explain":"Paragraph G mentions Przewalski's horses now being reintroduced to the grasslands of Mongolia and Kazakhstan."}]}]},{"title":"The Plastic Beneath the Waves","intro":"You should spend about 20 minutes on Questions 14–26, which are based on Reading Passage 2 below.","paragraphs":[{"label":"A","text":"When images of ocean pollution circulate, they usually show the obvious: bottles washed up on beaches, turtles entangled in fishing nets, rafts of bags drifting on the swell. Yet much of the plastic in the sea is almost invisible. Scientists use the term microplastics for fragments smaller than five millimetres across, and since the concept gained currency in the early 2000s, such particles have been recorded in virtually every marine environment that has been examined. They have been found in Arctic sea ice, on remote island beaches thousands of kilometres from any city, and in sediment taken from the floor of the deepest ocean trenches. Few pollutants have proved so thoroughly global."},{"label":"B","text":"Researchers generally divide microplastics into two categories according to their origin. Primary microplastics are manufactured at a small size. They include the tiny pellets, sometimes called nurdles, that serve as the raw material for the plastics industry and are frequently spilled during transport, as well as the microbeads once widely added to toothpastes and facial scrubs. Less obviously, synthetic clothing sheds fibres every time it is washed, and the friction of tyres on roads produces a fine dust that is carried into drains by rain. Secondary microplastics, by contrast, are created unintentionally when larger items such as bags, ropes and packaging break down. Exposed to sunlight, ultraviolet radiation makes plastic brittle, and the mechanical action of waves then grinds it into ever smaller pieces. Because a single bottle can yield countless fragments, secondary sources are thought to account for a large share of the particles at sea."},{"label":"C","text":"Once in the water, microplastics are transported by rivers, winds and currents. Much of the floating material is gathered by the great rotating current systems known as subtropical gyres, where it concentrates in zones popularly called garbage patches. The name is misleading: these are not solid islands of rubbish but vast areas in which the density of small particles is unusually high, often too dispersed to be seen from a ship. More puzzling to oceanographers is how little plastic they find. Surface surveys account for only a small proportion of the plastic estimated to enter the oceans each year, which has led to an intensive search for the so-called missing plastic."},{"label":"D","text":"Part of the answer appears to lie in the depths. Within weeks of entering the sea, a particle is colonised by bacteria, algae and other organisms, a process known as biofouling. This living coating adds weight, and particles that once floated may begin to sink. On the way down they become caught up in marine snow, the slow fall of dead organisms and organic debris that continuously descends through the water column, or are packaged into the faecal pellets of tiny animals. Deep-sea sediments may therefore be the final destination for much of the ocean's plastic, a conclusion supported by the discovery of plastic fibres in the guts of crustaceans living in the deepest trenches."},{"label":"E","text":"Because microplastics are similar in size to plankton, they are readily consumed by marine organisms at every level of the food web. Zooplankton swallow them; filter-feeding animals such as mussels and oysters strain them from the water; fish, seabirds and even whales ingest them directly or by eating contaminated prey. The effects can be physical, as when particles block the digestive tract or create a false sense of fullness that discourages feeding. They may also be chemical. Plastics contain additives used during manufacture, and their surfaces attract certain pollutants already present in seawater, so a particle can act as a carrier for toxic substances. It should be noted, however, that many laboratory experiments have used concentrations far higher than those typically found in the open sea, and the extent of harm under natural conditions remains debated."},{"label":"F","text":"Humans are not exempt. People who eat shellfish consume the entire animal, digestive system included, and are therefore likely to ingest any particles it contains. Microplastics have also been detected in sea salt. Interestingly, several studies suggest that seafood may be a relatively minor route of exposure compared with drinking water and the air inside homes, where fibres from carpets and clothing are abundant. What these particles do once inside the human body is still poorly understood, and researchers caution against drawing firm conclusions about health risks before more evidence is available."},{"label":"G","text":"Given the scale of the problem, removing microplastics from the open ocean is widely considered impractical: any net fine enough to catch them would also capture plankton and other marine life. The emphasis has therefore shifted to preventing particles from reaching the sea in the first place. The United States banned rinse-off cosmetics containing microbeads in 2015, and the United Kingdom followed in 2018. France has gone further, legislating that new washing machines sold from 2025 must be fitted with filters to capture synthetic fibres. Modern wastewater treatment plants already remove most microplastics, but the captured particles end up in sewage sludge, which in many countries is spread on farmland as fertiliser, from where some may eventually wash back into rivers. Meanwhile, negotiations on a global treaty to address plastic pollution, which began in 2022, have proved slow and contentious. Most experts agree that, without a substantial reduction in the amount of plastic produced, such measures can only limit, rather than solve, the problem."}],"groups":[{"type":"headings","instructions":"Questions 14–20\nReading Passage 2 has seven paragraphs, A–G.\nChoose the correct heading for each paragraph from the list of headings below.\nWrite the correct number, i–x, in boxes 14–20 on your answer sheet.","options":["i A hidden journey to the ocean floor","ii Origins both deliberate and accidental","iii The economic cost to the fishing industry","iv A pollutant found in every corner of the sea","v Uncertain consequences for human consumers","vi Difficulties in measuring particles in the laboratory","vii Where floating particles gather, and a mystery of quantity","viii Risks spread throughout marine life","ix A new generation of biodegradable materials","x Stopping pollution before it starts"],"questions":[{"n":14,"text":"Paragraph A","answer":["iv"],"explain":"Paragraph A stresses that microplastics have been found in virtually every marine environment examined."},{"n":15,"text":"Paragraph B","answer":["ii"],"explain":"Paragraph B contrasts primary microplastics, made small on purpose, with secondary ones created unintentionally."},{"n":16,"text":"Paragraph C","answer":["vii"],"explain":"Paragraph C describes particles concentrating in gyres and the puzzle of the missing plastic."},{"n":17,"text":"Paragraph D","answer":["i"],"explain":"Paragraph D explains how biofouling and marine snow carry particles down to deep-sea sediments."},{"n":18,"text":"Paragraph E","answer":["viii"],"explain":"Paragraph E describes physical and chemical harm to organisms at every level of the food web."},{"n":19,"text":"Paragraph F","answer":["v"],"explain":"Paragraph F says the effect of microplastics inside the human body is still poorly understood."},{"n":20,"text":"Paragraph G","answer":["x"],"explain":"Paragraph G says the emphasis has shifted to preventing particles from reaching the sea in the first place."}]},{"type":"mcq","instructions":"Questions 21–24\nChoose the correct letter, A, B, C or D.\nWrite the correct letter in boxes 21–24 on your answer sheet.","questions":[{"n":21,"text":"According to the writer, secondary microplastics are formed when","choices":["A plastic pellets are spilled during transport.","B larger plastic objects gradually fragment.","C synthetic clothes are washed.","D tyres wear down on road surfaces."],"answer":["B"],"explain":"Paragraph B says secondary microplastics are created when larger items such as bags, ropes and packaging break down."},{"n":22,"text":"What does the writer say about the so-called garbage patches?","choices":["A They are easy to identify from passing ships.","B They contain most of the plastic entering the ocean.","C Their popular name gives a false impression.","D They are located close to major river mouths."],"answer":["C"],"explain":"Paragraph C states that the name is misleading because they are not solid islands of rubbish."},{"n":23,"text":"What is the main effect of biofouling on a plastic particle?","choices":["A It causes the particle to break into smaller pieces.","B It makes the particle heavy enough to sink.","C It releases toxic chemicals into the water.","D It makes the particle more attractive to fish."],"answer":["B"],"explain":"Paragraph D explains that the living coating adds weight, so particles that once floated may begin to sink."},{"n":24,"text":"What point does the writer make about wastewater treatment plants?","choices":["A They are unable to capture synthetic fibres.","B They are too expensive for most countries to build.","C The particles they remove may re-enter the environment.","D They will be made unnecessary by washing-machine filters."],"answer":["C"],"explain":"Paragraph G notes that captured particles end up in sludge spread on farmland, from where some may wash back into rivers."}]},{"type":"short_answer","instructions":"Questions 25–26\nAnswer the questions below.\nChoose NO MORE THAN THREE WORDS from the passage for each answer.\nWrite your answers in boxes 25–26 on your answer sheet.","questions":[{"n":25,"text":"What name is given to the continuous fall of dead organisms and organic debris through the ocean?","answer":["marine snow"],"explain":"Paragraph D refers to marine snow, the slow fall of dead organisms and organic debris through the water column."},{"n":26,"text":"In France, what must be equipped with filters from 2025?","answer":["new washing machines","washing machines"],"explain":"Paragraph G says new washing machines sold in France from 2025 must be fitted with filters."}]}]},{"title":"The Curious Power of the Placebo","intro":"You should spend about 20 minutes on Questions 27–40, which are based on Reading Passage 3 below.","paragraphs":[{"label":"A","text":"For most of the twentieth century, the placebo was regarded by medical researchers as little more than a nuisance. In a well-designed clinical trial, a new drug is compared not with nothing but with an inert substitute, so that any improvement caused purely by the act of treatment can be subtracted from the result. The placebo response, in this view, was background noise to be filtered out. I believe this view was mistaken, or at least seriously incomplete. The placebo effect is a genuine and measurable phenomenon that tells us something important about how the mind and body interact. But it is also a phenomenon that is easily exaggerated, and those who now celebrate it as a hidden cure-all are making an error of their own."},{"label":"B","text":"The word itself, Latin for \"I shall please\", hints at the condescension with which the idea was long treated. Physicians of earlier centuries routinely dispensed bread pills and coloured water to patients whom they considered more troublesome than ill, and the practice was seen as a harmless kindness, or a convenient way to end a consultation. Only with the rise of the controlled trial in the mid-twentieth century did placebos acquire scientific respectability, and even then their value was purely methodological."},{"label":"C","text":"What changed this perception was evidence that placebo responses have a physical basis. In a frequently cited experiment from 1978, patients recovering from dental surgery who had received a placebo painkiller were then given naloxone, a drug that blocks the body's opioid receptors. Their pain relief diminished, suggesting that the dummy treatment had prompted the release of endorphins, the body's own pain-relieving chemicals. Later brain-imaging studies have shown that expecting relief can alter activity in regions of the brain involved in processing pain. The placebo effect, in other words, is not simply a matter of patients telling researchers what they want to hear."},{"label":"D","text":"Equally striking is how sensitive the response is to context. Research into the appearance of medication has found that capsules often outperform tablets, that two dummy pills tend to work better than one, and that branded packaging produces a stronger response than a plain label. In one experiment, volunteers given a placebo described as expensive reported greater pain relief than those told the identical pill had been discounted. Injections generally produce larger effects than pills, and a practitioner's warmth and attentiveness appear to amplify the response further. None of this involves any active ingredient; all of it involves meaning."},{"label":"E","text":"The same mechanism has a darker twin. When patients expect harm, they frequently experience it, a phenomenon known as the nocebo effect. Participants in drug trials who receive dummy pills commonly report the very side effects listed on their consent forms. A recent trial involving cholesterol-lowering statins found that most of the symptoms patients attributed to the drug appeared almost as often when they were taking tablets that contained nothing at all. The implication is uncomfortable: by warning patients of possible side effects, doctors may unwittingly help to produce them."},{"label":"F","text":"If placebos can help, why not prescribe them? The traditional objection is ethical. A placebo has generally been thought to work only if the patient believes it is a real medicine, and deceiving patients is incompatible with the principle of informed consent on which modern medicine rests. Yet surveys of physicians in several countries indicate that a substantial proportion already use what are termed impure placebos: treatments such as vitamins, or antibiotics for viral infections, which have no specific effect on the patient's condition. To my mind, this is the worst of both worlds. It retains the deception while adding real costs; the unnecessary use of antibiotics, in particular, contributes to the spread of drug-resistant bacteria."},{"label":"G","text":"A possible way out of this dilemma emerged in 2010, when a study of patients with irritable bowel syndrome tested so-called open-label placebos. Participants were told plainly that their pills contained no active ingredient, yet they reported significantly greater improvement than a comparison group that received no treatment. Similar results have since been reported for chronic back pain and cancer-related fatigue. These findings are intriguing, but I would urge caution. The trials have mostly been small; the outcomes measured are largely self-reported; and it is impossible to conceal from participants which group they are in. Moreover, the benefits concern subjective symptoms such as pain and tiredness. There is no credible evidence that a placebo, open or otherwise, can shrink a tumour or cure an infection."},{"label":"H","text":"This last point matters because placebo research is increasingly invoked by promoters of alternative remedies, who argue that if a treatment makes people feel better, it hardly matters how. I find this reasoning dangerous. A remedy that offers only a placebo effect may lead patients to delay treatments that actually work. The genuine lesson of placebo research, I would argue, lies not in the pill but in the encounter that surrounds it. Patients respond to attention, reassurance and a credible explanation of their condition. Rather than prescribing sugar pills, health systems should give doctors enough time to listen and to communicate honestly, harnessing expectation without deceit. A placebo can be a valuable complement to care, but it must never become a substitute for treatment that has been shown to be effective."}],"groups":[{"type":"ynng","instructions":"Questions 27–32\nDo the following statements agree with the claims of the writer in Reading Passage 3?\nIn boxes 27–32 on your answer sheet, write\nYES if the statement agrees with the claims of the writer\nNO if the statement contradicts the claims of the writer\nNOT GIVEN if it is impossible to say what the writer thinks about this","questions":[{"n":27,"text":"Researchers were wrong to treat the placebo response simply as something to be removed from trial results.","answer":["yes"],"explain":"In paragraph A the writer says the view of the placebo as background noise was mistaken, or at least seriously incomplete."},{"n":28,"text":"Placebos may be capable of reducing the size of some tumours.","answer":["no"],"explain":"Paragraph G states there is no credible evidence that a placebo can shrink a tumour."},{"n":29,"text":"The use of impure placebos can have harmful consequences beyond the individual patient.","answer":["yes"],"explain":"In paragraph F the writer argues that unnecessary antibiotics contribute to the spread of drug-resistant bacteria."},{"n":30,"text":"The findings of open-label placebo trials should be interpreted with care.","answer":["yes"],"explain":"In paragraph G the writer says the findings are intriguing but urges caution because of small samples and self-reported outcomes."},{"n":31,"text":"Most doctors who give impure placebos do so because patients demand them.","answer":["not given"],"explain":"Paragraph F reports that many physicians use impure placebos but gives no reason why they do so."},{"n":32,"text":"Supporters of alternative remedies are justified in using placebo research to defend their products.","answer":["no"],"explain":"In paragraph H the writer calls this reasoning dangerous."}]},{"type":"matching_features","instructions":"Questions 33–36\nLook at the following findings (Questions 33–36) and the list of studies below.\nMatch each finding with the correct study, A–E.\nWrite the correct letter, A–E, in boxes 33–36 on your answer sheet.\nNB You may use any letter more than once.","options":["A the 1978 dental surgery experiment","B research into the appearance and pricing of medication","C the trial involving cholesterol-lowering drugs","D surveys of physicians","E the 2010 irritable bowel syndrome study"],"questions":[{"n":33,"text":"A placebo can produce benefits even when patients are aware that it is inactive.","answer":["E"],"explain":"Paragraph G says IBS patients told their pills contained no active ingredient still improved more than an untreated group."},{"n":34,"text":"Placebo responses may involve the body's natural pain-relieving substances.","answer":["A"],"explain":"Paragraph C explains that naloxone reduced placebo pain relief, suggesting endorphins were involved."},{"n":35,"text":"Many unwanted symptoms blamed on a medicine may arise from patients' expectations.","answer":["C"],"explain":"Paragraph E reports that most symptoms attributed to statins appeared almost as often with dummy tablets."},{"n":36,"text":"A dummy treatment believed to be costly can be more effective than one believed to be cheap.","answer":["B"],"explain":"Paragraph D describes volunteers reporting greater relief from a placebo described as expensive."}]},{"type":"summary_completion","instructions":"Questions 37–40\nComplete the summary using the list of words, A–H, below.\nWrite the correct letter, A–H, in boxes 37–40 on your answer sheet.","options":["A pill","B time","C self-reported","D substitute","E deception","F objective","G money","H ritual"],"summary":"The writer concludes that the real value of placebo research lies not in the {{37}} itself but in the clinical encounter surrounding it. Instead of offering sugar pills, health systems should ensure that doctors have sufficient {{38}} to listen to patients and communicate honestly. Although open-label placebos appear promising, the supporting evidence is limited because trials are small and their results are mostly {{39}}. Above all, a placebo should complement care and never serve as a {{40}} for proven treatment.","questions":[{"n":37,"text":"","answer":["A"],"explain":"Paragraph H says the lesson lies not in the pill but in the encounter that surrounds it."},{"n":38,"text":"","answer":["B"],"explain":"Paragraph H says health systems should give doctors enough time to listen and communicate honestly."},{"n":39,"text":"","answer":["C"],"explain":"Paragraph G notes that the outcomes measured are largely self-reported."},{"n":40,"text":"","answer":["D"],"explain":"Paragraph H states a placebo must never become a substitute for effective treatment."}]}]}]},{"id":"T4","title":"Academic Reading Test 4","passages":[{"title":"Two Wheels: A Short History of the Bicycle","intro":"You should spend about 20 minutes on Questions 1–13, which are based on Reading Passage 1 below.","paragraphs":[{"label":"A","text":"The bicycle is now so familiar that it is easy to forget that its basic form took most of the nineteenth century to emerge, through a series of designs that were each, in their own way, experiments in balance, comfort and speed. The history of these experiments reveals not only how engineering problems were solved but also how a single invention could alter social habits far beyond the world of transport."},{"label":"B","text":"The story usually begins in 1817 in Mannheim, in what is now Germany, where a civil servant named Karl Drais demonstrated a two-wheeled wooden machine that he called the Laufmaschine, or 'running machine'. It soon became known as the draisine. The device had no pedals: the rider sat astride a wooden frame and moved forward by pushing his feet against the ground. On its first recorded outing, Drais travelled roughly 13 kilometres in about an hour, a respectable pace given the poor roads of the time. Some historians have suggested that he was searching for an alternative to the horse after failed harvests, following a volcanic eruption in Indonesia in 1815, had made animal feed scarce, though this connection remains a matter of interpretation rather than documented fact."},{"label":"C","text":"The draisine enjoyed a brief period of fashion. In Britain, where copies were sold as 'hobby horses' or 'dandy horses', young men of means rode them in parks and along city streets. The craze was short-lived, however. The machines were heavy and tiring on any incline, and because riders often used the smoother pavements rather than the rutted roads, they alarmed pedestrians. Several cities, on both sides of the Atlantic, responded by banning them from footpaths, and by the 1820s interest had largely faded."},{"label":"D","text":"The next significant step came in France in the 1860s, when cranks and pedals were attached directly to the front wheel of a two-wheeled machine, creating the velocipede. Exactly who deserves the credit is still disputed. The Paris workshop of the Michaux family produced and popularised the design, but a mechanic named Pierre Lallement, who had worked in Paris before emigrating, was granted an American patent for a similar machine in 1866, and other claims have also been made. What is not in doubt is the experience of riding it. With a heavy iron frame and wooden wheels rimmed with iron, the velocipede transmitted every jolt of the cobbled streets to its rider, earning it the English nickname 'boneshaker'."},{"label":"E","text":"Because the pedals turned the front wheel directly, each revolution of the cranks moved the machine forward only by the circumference of that wheel. Designers in the 1870s found a simple, if extreme, solution: enlarge the front wheel. The result was the high-wheeler, later nicknamed the penny-farthing after the contrast between a large British penny and a much smaller farthing coin. Front wheels grew to around 1.5 metres in diameter, so that a single turn of the pedals covered a far greater distance, and solid rubber tyres made the ride less punishing than before. Yet the design had a serious flaw. The rider sat almost directly above the front wheel, and a sudden obstacle could throw him forward over the handlebars, an accident known as a 'header'. Unsurprisingly, the machine attracted mainly athletic young men, many of whom joined the cycling clubs that sprang up in this period."},{"label":"F","text":"The solution to this danger gave the 'safety bicycle' its name. In 1885 the English engineer John Kemp Starley produced the Rover in Coventry, England. It had two wheels of similar size and, crucially, a chain that carried power from the pedals to the rear wheel. Because gearing could now be achieved through the chain rather than through the size of the wheel, the rider could sit lower, between the wheels, with feet able to reach the ground. In 1888 the Scottish-born veterinary surgeon John Boyd Dunlop, working in Belfast, developed a practical pneumatic tyre, initially for his young son's tricycle. Air-filled tyres absorbed shocks far better than solid rubber, and within a few years the combination of chain drive, equal wheels and pneumatic tyres had established the basic pattern that most bicycles still follow."},{"label":"G","text":"The 1890s brought a cycling boom in Europe and North America, and its social effects were considerable. As factories adopted mass production, prices fell and the bicycle came within reach of clerks and skilled workers, who could now travel to work or into the countryside without depending on horses or trains. For women in particular, the bicycle offered an unprecedented degree of independence: a woman could travel alone, at her own pace, without a chaperone. Campaigners for women's rights welcomed it, and the practical demands of riding encouraged changes in clothing, as long, heavy skirts gave way to shorter skirts and the loose trousers known as 'bloomers'."},{"label":"H","text":"The bicycle's influence extended into infrastructure and industry as well. Organised cyclists were among the first groups to lobby governments for smoother roads; in the United States, the 'Good Roads Movement' of the 1880s and 1890s was driven largely by cycling associations. Ironically, those improved roads would soon serve the motor car. Bicycle manufacturers had also refined techniques such as the use of ball bearings, lightweight steel tubing and precision-made components, many of which were later adopted by the automobile industry. Perhaps the best-known example of this transfer of skills is that of Wilbur and Orville Wright, who built and repaired bicycles in Ohio before turning their attention to powered flight. In this sense, the humble bicycle helped to prepare the ground for the machines that would eventually overshadow it."}],"groups":[{"type":"tfng","instructions":"Questions 1–7\nDo the following statements agree with the information given in Reading Passage 1?\nIn boxes 1–7 on your answer sheet, write\nTRUE if the statement agrees with the information\nFALSE if the statement contradicts the information\nNOT GIVEN if there is no information on this","questions":[{"n":1,"text":"The draisine was designed so that riders did not need to touch the ground with their feet.","answer":["FALSE"],"explain":"Paragraph B states that the rider moved forward by pushing his feet against the ground."},{"n":2,"text":"Some cities prohibited draisine riders from using footpaths.","answer":["TRUE"],"explain":"Paragraph C says several cities responded by banning the machines from footpaths."},{"n":3,"text":"Drais earned a considerable income from sales of his machine.","answer":["NOT GIVEN"],"explain":"Paragraphs B and C describe the machine and its brief fashion but say nothing about Drais's income."},{"n":4,"text":"The velocipede's English nickname reflected how uncomfortable it was to ride.","answer":["TRUE"],"explain":"Paragraph D explains that every jolt was transmitted to the rider, earning it the name 'boneshaker'."},{"n":5,"text":"Historians generally agree about who invented the velocipede.","answer":["FALSE"],"explain":"Paragraph D says that exactly who deserves the credit is still disputed."},{"n":6,"text":"Enlarging the front wheel allowed riders to travel further with each turn of the pedals.","answer":["TRUE"],"explain":"Paragraph E says that with the larger wheel a single turn of the pedals covered a far greater distance."},{"n":7,"text":"Most 'header' accidents on the penny-farthing caused serious injuries.","answer":["NOT GIVEN"],"explain":"Paragraph E describes how a 'header' happened but gives no information about how serious the resulting injuries were."}]},{"type":"summary_completion","instructions":"Questions 8–13\nComplete the summary below.\nChoose ONE WORD ONLY from the passage for each answer.\nWrite your answers in boxes 8–13 on your answer sheet.","summary":"The safety bicycle\nThe Rover of 1885 solved the main danger of the high-wheeler. Power was carried to the rear wheel by a {{8}}, which allowed the rider to sit lower, between two wheels of similar size. In 1888 Dunlop's {{9}} tyre made riding far more comfortable by absorbing shocks. During the boom of the 1890s, falling prices put bicycles within reach of many workers, while women gained a new level of {{10}}, which in turn encouraged changes in {{11}}. Cyclists' associations campaigned for smoother {{12}}, and manufacturing methods refined by bicycle makers were later taken up by the {{13}} industry.","questions":[{"n":8,"text":"Power was carried to the rear wheel by a ______.","answer":["chain"],"explain":"Paragraph F says the Rover had a chain that carried power from the pedals to the rear wheel."},{"n":9,"text":"Dunlop's ______ tyre","answer":["pneumatic"],"explain":"Paragraph F says Dunlop developed a practical pneumatic tyre in 1888."},{"n":10,"text":"women gained a new level of ______","answer":["independence"],"explain":"Paragraph G says the bicycle offered women an unprecedented degree of independence."},{"n":11,"text":"encouraged changes in ______","answer":["clothing"],"explain":"Paragraph G says the demands of riding encouraged changes in clothing."},{"n":12,"text":"campaigned for smoother ______","answer":["roads"],"explain":"Paragraph H says organised cyclists lobbied governments for smoother roads."},{"n":13,"text":"later taken up by the ______ industry","answer":["automobile"],"explain":"Paragraph H says many bicycle-making techniques were later adopted by the automobile industry."}]}]},{"title":"Rebuilding the Reef","intro":"You should spend about 20 minutes on Questions 14–26, which are based on Reading Passage 2 below.","paragraphs":[{"label":"A","text":"Coral reefs occupy less than one per cent of the ocean floor, yet they are thought to support roughly a quarter of all known marine species, as well as the fisheries, coastal protection and tourism on which hundreds of millions of people depend. Over recent decades, however, they have declined at an alarming rate. Overfishing, coastal development and agricultural run-off have all played a part, but the most serious threat is rising sea temperature. When water stays unusually warm for several weeks, corals expel the symbiotic algae that live in their tissues and supply most of their energy. Deprived of these partners, the corals turn white, a process known as bleaching, and if the heat persists many of them starve and die. Mass bleaching events, once rare, have become frequent: the Great Barrier Reef alone experienced severe episodes in 2016, 2017, 2020, 2022 and 2024, leaving little time for recovery between them."},{"label":"B","text":"Faced with this decline, scientists and conservation groups have turned to active restoration. The most widely practised method is coral gardening. Small fragments are cut from healthy colonies and grown in underwater nurseries, often suspended from tree-like frames or ropes where they are protected from sediment and predators. Once they have reached a suitable size, usually after six to twelve months, they are fixed onto degraded areas of reef. The technique exploits the natural ability of many corals to regrow from broken pieces, a form of asexual reproduction that also occurs after storms. A refinement known as micro-fragmentation, in which certain slow-growing, boulder-shaped corals are cut into pieces only a centimetre or two across, was found to accelerate their growth considerably, allowing colonies that might take decades to develop naturally to be produced within a few years."},{"label":"C","text":"Coral gardening is relatively simple, and it has the advantage of involving local communities and volunteer divers, who can be trained to tend nurseries. Its limitations, however, are considerable. Planting even a single hectare can require tens of thousands of fragments, and the labour involved makes the method expensive. When set against the total area of the world's reefs, estimated at several hundred thousand square kilometres, the areas restored so far are tiny. There is also a genetic problem. Because each fragment is a clone of its parent colony, a restored patch may consist of only a handful of genetic individuals. Such a population has limited capacity to adapt, and a single disease or heatwave can affect all its members in the same way."},{"label":"D","text":"A second approach attempts to work at a larger scale by harnessing sexual reproduction. On many reefs, corals reproduce in synchronised mass spawning events, releasing enormous quantities of eggs and sperm into the water on just a few nights each year, with the timing linked to water temperature and the lunar cycle. In larval seeding, researchers collect this spawn, either directly from the sea surface or from colonies kept in tanks, and rear the resulting larvae for several days until they are ready to settle. The larvae are then released onto damaged sections of reef, sometimes inside mesh enclosures that keep them in place while they attach to the surface. Because the larvae arise from many different parents, the resulting corals are genetically diverse. Survival, however, is a persistent obstacle: the great majority of settled larvae die within their first year, eaten by fish or smothered by algae, so very large numbers are needed to produce a modest number of adult colonies."},{"label":"E","text":"The most ambitious strategy aims not simply to replace lost corals but to prepare reefs for the conditions to come. Under the broad label of 'assisted evolution', researchers are exploring ways to increase corals' tolerance of heat. One method is selective breeding: colonies that survived a bleaching event, or that come from naturally warmer reefs, are crossed to produce offspring that may inherit their resilience. Other methods involve exposing young corals to gradually higher temperatures in the laboratory, or pairing them with strains of algae that cope better with heat. Early results suggest that tolerance can be raised, but perhaps only by between a fraction of a degree and about one degree Celsius. There are also concerns about trade-offs: some heat-tolerant corals appear to grow more slowly, and the long-term ecological consequences of introducing selectively bred corals onto wild reefs are not yet understood."},{"label":"F","text":"None of these techniques can, on its own, reverse the decline of the world's reefs. Restoration projects typically operate on the scale of hectares, whereas bleaching affects entire regions in a single summer, and a restored patch is just as vulnerable as the surrounding reef to the next marine heatwave. Most researchers in the field therefore stress that restoration cannot replace the reduction of greenhouse gas emissions, which remains the only way to address the underlying cause. Seen in this light, restoration is best understood as a means of buying time: preserving genetic diversity, sustaining local reefs and the communities that rely on them, and developing methods that may be needed on a far larger scale if warming is eventually brought under control."}],"groups":[{"type":"headings","instructions":"Questions 14–19\nReading Passage 2 has six paragraphs, A–F.\nChoose the correct heading for each paragraph from the list of headings below.\nWrite the correct number, i–viii, in boxes 14–19 on your answer sheet.","options":["i A method that makes use of corals' natural breeding events","ii The scale and main cause of a crisis","iii Why repair work cannot be the whole answer","iv Raising replacement coral in protected conditions","v Attempting to equip corals for a warmer future","vi The practical and genetic drawbacks of a popular technique","vii The economic value of reef tourism","viii How the cause of bleaching was first discovered"],"questions":[{"n":14,"text":"Paragraph A","answer":["ii"],"explain":"Paragraph A describes the scale of reef decline and identifies rising sea temperature as the most serious threat."},{"n":15,"text":"Paragraph B","answer":["iv"],"explain":"Paragraph B explains how fragments are grown in nurseries protected from sediment and predators before being planted out."},{"n":16,"text":"Paragraph C","answer":["vi"],"explain":"Paragraph C sets out the cost, scale and clonal genetic problems of coral gardening."},{"n":17,"text":"Paragraph D","answer":["i"],"explain":"Paragraph D describes larval seeding, which collects spawn released during mass spawning events."},{"n":18,"text":"Paragraph E","answer":["v"],"explain":"Paragraph E discusses 'assisted evolution' aimed at preparing reefs for the conditions to come."},{"n":19,"text":"Paragraph F","answer":["iii"],"explain":"Paragraph F argues that restoration cannot replace emission reductions and only buys time."}]},{"type":"matching_features","instructions":"Questions 20–22\nLook at the following statements (Questions 20–22) and the list of restoration methods below.\nMatch each statement with the correct method, A, B or C.\nWrite the correct letter, A, B or C, in boxes 20–22 on your answer sheet.\nNB You may use any letter more than once.","options":["A coral gardening","B larval seeding","C assisted evolution"],"questions":[{"n":20,"text":"It depends on gathering material during a brief natural event.","answer":["B"],"explain":"Paragraph D says larval seeding collects spawn released on just a few nights each year."},{"n":21,"text":"It may produce corals that grow at a slower rate.","answer":["C"],"explain":"Paragraph E notes that some heat-tolerant corals appear to grow more slowly."},{"n":22,"text":"It can create populations with very little genetic variety.","answer":["A"],"explain":"Paragraph C explains that gardened fragments are clones, so a restored patch may contain only a handful of genetic individuals."}]},{"type":"sentence_completion","instructions":"Questions 23–26\nComplete the sentences below.\nChoose NO MORE THAN TWO WORDS from the passage for each answer.\nWrite your answers in boxes 23–26 on your answer sheet.","questions":[{"n":23,"text":"During bleaching, corals lose the ______ that provide most of their energy.","answer":["symbiotic algae","algae"],"explain":"Paragraph A says corals expel the symbiotic algae that live in their tissues and supply most of their energy."},{"n":24,"text":"A technique called ______ has greatly speeded up the growth of some boulder-shaped corals.","answer":["micro-fragmentation","microfragmentation"],"explain":"Paragraph B says micro-fragmentation was found to accelerate the growth of certain slow-growing, boulder-shaped corals."},{"n":25,"text":"In larval seeding, larvae may be held in place on the reef by ______ while they attach.","answer":["mesh enclosures","enclosures"],"explain":"Paragraph D says larvae are sometimes released inside mesh enclosures that keep them in place."},{"n":26,"text":"The writer suggests that restoration is best regarded as a way of buying ______.","answer":["time"],"explain":"Paragraph F describes restoration as a means of buying time."}]}]},{"title":"Two Languages, One Brain?","intro":"You should spend about 20 minutes on Questions 27–40, which are based on Reading Passage 3 below.","paragraphs":[{"label":"A","text":"For much of the early twentieth century, bilingualism was widely regarded as a burden on the developing mind. A number of studies, many conducted in Britain and the United States, reported that children who spoke two languages scored lower on intelligence tests than their monolingual peers, and some educators concluded that a second language confused children and slowed their intellectual growth. With hindsight, these studies were deeply flawed. Many tested immigrant children in a language they had not yet mastered, and few took account of the poverty and disrupted schooling that such children often experienced. What was measured, in other words, was frequently disadvantage rather than bilingualism."},{"label":"B","text":"The pendulum began to swing in 1962, when a study of ten-year-old children in Montreal, Canada, found that bilingual children outperformed monolinguals on a range of verbal and non-verbal tests. Unlike many earlier investigations, it attempted to match the two groups for socioeconomic background. The result helped to overturn the assumption that bilingualism was inherently harmful, and over the following decades a more ambitious claim took shape: that managing two languages might actually strengthen the mind."},{"label":"C","text":"The proposed mechanism is intuitively appealing. Psycholinguistic research indicates that both of a bilingual person's languages remain active even when only one is being used, so that speakers must constantly suppress the language they do not need. This continual practice, the argument runs, should strengthen 'executive function', the set of mental processes that govern attention, inhibition and switching between tasks. Laboratory studies in the 1990s and 2000s appeared to confirm the idea. In tasks such as the 'flanker' test, in which participants must respond to a central arrow while ignoring arrows on either side that may point in a conflicting direction, bilinguals often responded more quickly than monolinguals. Most strikingly, a 2007 study of patients at a Toronto memory clinic reported that bilinguals had developed symptoms of dementia roughly four years later, on average, than monolinguals. The notion of a 'bilingual advantage' spread rapidly from academic journals into newspapers, parenting guides and the marketing of language courses."},{"label":"D","text":"Yet as the research expanded, the picture became less clear. Several large studies, some involving thousands of participants, found no reliable difference between bilinguals and monolinguals on executive function tasks. Critics pointed out that many of the original positive findings had come from relatively small samples, in which chance variation can easily produce results that appear statistically significant. In 2015 a team of researchers examined abstracts presented at scientific conferences and traced which of them went on to be published in journals. Studies reporting a bilingual advantage were considerably more likely to reach publication than those reporting mixed or null results, suggesting that the published literature presented a distorted picture. This form of publication bias is not unique to bilingualism research, but it was particularly damaging in a field where the claimed effects were small."},{"label":"E","text":"A further difficulty concerns what researchers are actually comparing. Bilinguals and monolinguals frequently differ in more than language: they may come from different countries, cultures, educational systems or economic circumstances, any of which could influence performance on cognitive tests. Immigration itself is selective, since those who migrate are not a random sample of the population they leave. The dementia findings illustrate the problem. Later studies in other populations produced inconsistent results, and it has proved difficult to rule out the possibility that factors associated with bilingualism, rather than bilingualism itself, account for the delay that some studies reported. Moreover, 'bilingual' is not a single category. A child raised with two languages from birth, an adult who learned a second language at university and an interpreter who switches between languages all day have very different linguistic lives, yet many studies have grouped such people together."},{"label":"F","text":"Where, then, does this leave the debate? In my view, the evidence does not support the strong claim that bilingualism produces a general, measurable boost to cognitive control. If such an effect exists in healthy young adults, it is too small or too inconsistent to be detected reliably, and the weight of evidence from large, carefully designed studies should count for more than a collection of small studies, however striking their results. It does not follow, however, that the question is closed. The findings on ageing, while uncertain, remain intriguing and deserve rigorous investigation rather than dismissal, and it is quite possible that particular kinds of bilingual experience, such as frequent switching between languages in daily life, have effects that broad comparisons conceal. The productive path for research is to stop asking whether bilinguals are 'better' and to ask instead which specific aspects of bilingual experience, if any, influence which specific abilities."},{"label":"G","text":"There is also a broader lesson. The enthusiasm with which the bilingual advantage was embraced reflects a tendency to justify valuable activities by their supposed side effects. Yet the case for learning languages has never depended on faster reactions in a laboratory task. A second language opens access to other people, other literatures and other ways of seeing the world, and allows families to maintain ties to their heritage. These benefits are real regardless of what reaction-time experiments eventually show. If the debate over the bilingual advantage has taught researchers to be more cautious about small samples and attractive conclusions, it will have been worthwhile; but it should not persuade anyone that learning a language is pointless."}],"groups":[{"type":"mcq","instructions":"Questions 27–31\nChoose the correct letter, A, B, C or D.\nWrite the correct letter in boxes 27–31 on your answer sheet.","questions":[{"n":27,"text":"What does the writer say about studies of bilingual children in the early twentieth century?","choices":["A They were mostly carried out by teachers rather than researchers.","B They often reflected the effects of social disadvantage.","C They tested children in both of their languages.","D They found no difference between bilingual and monolingual children."],"answer":["B"],"explain":"Paragraph A concludes that what these studies measured was frequently disadvantage rather than bilingualism."},{"n":28,"text":"The 1962 Montreal study differed from many earlier studies because it","choices":["A included adults as well as children.","B relied only on non-verbal tests.","C tried to ensure the groups had similar social backgrounds.","D was the first to claim that bilingualism harmed intelligence."],"answer":["C"],"explain":"Paragraph B says that, unlike many earlier investigations, it attempted to match the groups for socioeconomic background."},{"n":29,"text":"According to paragraph C, bilingualism was thought to strengthen executive function because bilingual speakers","choices":["A must keep holding back the language that is not required.","B tend to switch between languages within a single sentence.","C react more quickly to visual information from birth.","D use only one language at any one time."],"answer":["A"],"explain":"Paragraph C says speakers must constantly suppress the language they do not need, and this practice should strengthen executive function."},{"n":30,"text":"What did the 2015 study of conference abstracts suggest?","choices":["A Most conference presentations had reported a bilingual advantage.","B Large studies were less likely to be presented at conferences.","C Researchers had deliberately exaggerated their findings.","D Positive findings had a better chance of being published."],"answer":["D"],"explain":"Paragraph D reports that studies showing an advantage were considerably more likely to be published than those with mixed or null results."},{"n":31,"text":"The writer mentions an interpreter in paragraph E in order to illustrate","choices":["A the most demanding form of language use.","B the range of experiences covered by the term 'bilingual'.","C the benefits of using two languages at work.","D a group that has been excluded from most studies."],"answer":["B"],"explain":"Paragraph E uses the child, the university learner and the interpreter to show that 'bilingual' is not a single category."}]},{"type":"ynng","instructions":"Questions 32–36\nDo the following statements agree with the claims of the writer in Reading Passage 3?\nIn boxes 32–36 on your answer sheet, write\nYES if the statement agrees with the claims of the writer\nNO if the statement contradicts the claims of the writer\nNOT GIVEN if it is impossible to say what the writer thinks about this","questions":[{"n":32,"text":"Many early studies that reported disadvantages tested children in a language they had not fully learned.","answer":["YES"],"explain":"In paragraph A the writer says many of these studies tested immigrant children in a language they had not yet mastered."},{"n":33,"text":"The research linking bilingualism to later dementia should be disregarded.","answer":["NO"],"explain":"In paragraph F the writer says the findings on ageing deserve rigorous investigation rather than dismissal."},{"n":34,"text":"Results from large, well-designed studies deserve more weight than those from small studies.","answer":["YES"],"explain":"In paragraph F the writer says evidence from large, carefully designed studies should count for more than a collection of small studies."},{"n":35,"text":"Children should begin learning a second language before they start school.","answer":["NOT GIVEN"],"explain":"The writer mentions children raised with two languages in paragraph E but never says when children should begin learning a second language."},{"n":36,"text":"The value of learning a language depends on whether it improves mental control.","answer":["NO"],"explain":"In paragraph G the writer says the case for learning languages has never depended on laboratory results and its benefits are real regardless."}]},{"type":"matching_features","instructions":"Questions 37–40\nComplete each sentence with the correct ending, A–F, below.\nWrite the correct letter, A–F, in boxes 37–40 on your answer sheet.","options":["A may hide important differences in how and when people use their languages.","B can make chance results appear statistically significant.","C risks attributing to language some effects that have other causes.","D is to investigate which specific aspects of bilingual experience affect which abilities.","E has shown conclusively that bilingualism offers no cognitive benefit.","F proves that speaking two languages protects against cognitive decline."],"questions":[{"n":37,"text":"Comparing bilinguals and monolinguals who differ in nationality, culture or income","answer":["C"],"explain":"Paragraph E says such groups differ in more than language, and other factors could influence test performance."},{"n":38,"text":"Relying on studies with small numbers of participants","answer":["B"],"explain":"Paragraph D says that in small samples chance variation can easily produce results that appear statistically significant."},{"n":39,"text":"Placing all speakers of two languages in a single category","answer":["A"],"explain":"Paragraph E says people with very different linguistic lives have been grouped together, which conceals those differences."},{"n":40,"text":"In the writer's view, the most useful direction for future research","answer":["D"],"explain":"Paragraph F says research should ask which specific aspects of bilingual experience influence which specific abilities."}]}]}]},{"id":"T5","title":"Academic Reading Test 5","passages":[{"title":"Baikonur: Launchpad on the Steppe","intro":"You should spend about 20 minutes on Questions 1–13, which are based on Reading Passage 1 below.","paragraphs":[{"label":"A","text":"On the flat, semi-arid steppe of southern Kazakhstan, close to the northern bank of the Syr Darya river, lies one of the most historically significant pieces of ground of the twentieth century. The Baikonur Cosmodrome, the oldest space-launch facility in the world and for several decades the largest, occupies a sparsely populated expanse where summers are fiercely hot and winters bitterly cold. It was from this unpromising landscape that the first artificial satellite and the first human being were sent into orbit, and, more than seventy years after work on the site began, rockets still rise from it on a regular basis."},{"label":"B","text":"The cosmodrome owes its existence not to space exploration but to the strategic rivalry of the early Cold War. In 1955 the Soviet government approved the construction of a test range for the R-7, a rocket being developed by the design bureau of Sergei Korolev as the world's first intercontinental ballistic missile. The planners' requirements were demanding. They needed a vast, almost empty area beneath the rocket's flight path, so that discarded stages could fall to the ground without endangering towns. They wanted a location as far south as practicable, because launching closer to the equator allows a rocket to gain extra speed from the Earth's rotation. Finally, the site had to be reachable by rail, since heavy components, fuel and building materials would have to be transported in enormous quantities. An area near the small railway junction of Tyuratam met all three conditions."},{"label":"C","text":"Construction began in 1955, and 2 June of that year is now regarded as the facility's official founding date. Conditions for the military construction crews were extremely harsh: in the early months, many of them lived in tents and dugouts while they laid roads, built a railway spur and excavated the enormous pit over which the first launch pad would stand. A settlement for personnel grew up beside the river and was later named Leninsk. For many years its very existence was treated as a state secret. In public announcements, the launch site was referred to as Baikonur, a name borrowed from a mining settlement located several hundred kilometres to the north-east. This choice is widely interpreted as a deliberate attempt to conceal the true position of the range from foreign observers. In 1995, after Kazakhstan had become independent, Leninsk itself was renamed Baikonur, so that the name finally matched the place."},{"label":"D","text":"The R-7 was soon put to a use that its military sponsors had not prioritised. On 4 October 1957, a modified version of the rocket lifted off from Baikonur carrying Sputnik 1, a polished metal sphere fitted with four long antennas. As it circled the Earth, the satellite transmitted a simple radio signal that was picked up by amateur radio enthusiasts in many countries. Less than a month later, Sputnik 2 carried a dog named Laika into orbit. The impact in the West, and particularly in the United States, was considerable. The launches provoked anxiety about Soviet technological capability and contributed to the creation of NASA in 1958, marking the start of what became known as the space race."},{"label":"E","text":"The cosmodrome's most celebrated moment came on 12 April 1961, when Yuri Gagarin was launched aboard the spacecraft Vostok 1. He completed a single orbit of the Earth in a flight lasting approximately 108 minutes and, in accordance with the mission plan, ejected from the capsule during its descent and landed separately by parachute. Two years later, Valentina Tereshkova, also launched from Baikonur, became the first woman to fly in space. The pad used for Gagarin's flight, which became known as 'Gagarin's Start', continued to serve crewed missions for nearly six decades, a remarkable record of continuity for any piece of engineering infrastructure."},{"label":"F","text":"The collapse of the Soviet Union in 1991 created an unusual legal problem: Russia's principal launch site now stood on the territory of an independent Kazakhstan. The two countries resolved the matter through an agreement signed in 1994, under which Kazakhstan leased the cosmodrome and the town of Baikonur to Russia for an annual rent of 115 million US dollars. The lease was later extended, and it is now scheduled to run until 2050. Under this arrangement the town has an unusual status, administered largely according to Russian rules although it lies within Kazakh borders. Nevertheless, Russia has sought to reduce its dependence on a facility located abroad, and has built the Vostochny Cosmodrome in its own Far East, from which the first launch took place in 2016."},{"label":"G","text":"Baikonur's significance did not diminish after the Soviet era. When the United States retired its Space Shuttle fleet in 2011, Soyuz rockets launched from the Kazakh steppe became the only means of carrying astronauts of any nationality to the International Space Station, a situation that lasted until American commercial spacecraft began crewed flights in 2020. The site continues to launch crews, cargo and satellites. Its operations have not been without controversy, however. The Proton rocket, long a workhorse of the cosmodrome, uses a highly toxic propellant, and launch failures have caused contamination of the surrounding land. Spent stages also fall on the steppe, and Kazakhstan has pressed for cleaner technology. At the same time, Kazakhstan has pursued its own space ambitions, including a joint project with Russia known as Baiterek, intended to give the country a greater role in launch operations. For a site conceived as a secret weapons range, Baikonur has had a long and surprisingly public afterlife."}],"groups":[{"type":"mcq","instructions":"Questions 1–4\nChoose the correct letter, A, B, C or D.\nWrite the correct letter in boxes 1–4 on your answer sheet.","questions":[{"n":1,"text":"Why was the area near Tyuratam chosen for the test range?","choices":["A It was already home to a large military workforce.","B It combined a vast empty area, a southerly position and a rail link.","C It was the closest suitable site to the equator within the Soviet Union.","D It had a mild climate that suited year-round construction."],"answer":["B"],"explain":"Paragraph B lists the three requirements (empty land under the flight path, a southerly location and rail access) and says Tyuratam met all three."},{"n":2,"text":"According to the writer, the name \"Baikonur\" was originally used in public announcements","choices":["A because it was the name of the river beside the site.","B to honour the workers who founded the settlement.","C probably to disguise where the launch site really was.","D because Leninsk had not yet been built."],"answer":["C"],"explain":"Paragraph C says the choice is widely interpreted as a deliberate attempt to conceal the true position of the range."},{"n":3,"text":"What does the writer say about Sputnik 1?","choices":["A Its launch was kept secret from the public for several weeks.","B It carried a dog into orbit.","C It used a rocket originally intended for a different purpose.","D It was launched less than a month after NASA was created."],"answer":["C"],"explain":"Paragraph D explains that a modified R-7, a rocket built as a missile for military sponsors, launched Sputnik 1."},{"n":4,"text":"What was the purpose of building the Vostochny Cosmodrome?","choices":["A to replace Baikonur completely by 2016","B to make Russia less reliant on a launch site in another country","C to provide Kazakhstan with its own launch facility","D to launch heavier rockets than Baikonur could handle"],"answer":["B"],"explain":"Paragraph F states that Russia built Vostochny to reduce its dependence on a facility located abroad."}]},{"type":"tfng","instructions":"Questions 5–9\nDo the following statements agree with the information given in Reading Passage 1?\nIn boxes 5–9 on your answer sheet, write\nTRUE if the statement agrees with the information\nFALSE if the statement contradicts the information\nNOT GIVEN if there is no information on this","questions":[{"n":5,"text":"Some of the first construction workers at the site lived in temporary shelters.","answer":["true"],"explain":"Paragraph C says many crews lived in tents and dugouts in the early months."},{"n":6,"text":"Sergei Korolev personally selected the location of the test range.","answer":["not given"],"explain":"Paragraph B mentions that Korolev's bureau designed the R-7 but does not say who selected the site."},{"n":7,"text":"Gagarin's flight lasted for more than two hours.","answer":["false"],"explain":"Paragraph E states the flight lasted approximately 108 minutes, which is under two hours."},{"n":8,"text":"The 1994 agreement allowed Russia to use the cosmodrome free of charge.","answer":["false"],"explain":"Paragraph F says Russia pays an annual rent of 115 million US dollars."},{"n":9,"text":"The town of Leninsk received its current name after Kazakhstan became independent.","answer":["true"],"explain":"Paragraph C says Leninsk was renamed Baikonur in 1995, after Kazakhstan had become independent."}]},{"type":"short_answer","instructions":"Questions 10–13\nAnswer the questions below.\nChoose NO MORE THAN TWO WORDS AND/OR A NUMBER from the passage for each answer.\nWrite your answers in boxes 10–13 on your answer sheet.","questions":[{"n":10,"text":"Which rocket was the test range originally built to test?","answer":["r-7","the r-7","r7"],"explain":"Paragraph B says the range was approved for testing the R-7."},{"n":11,"text":"Which river flows near the cosmodrome?","answer":["syr darya","the syr darya"],"explain":"Paragraph A places the cosmodrome close to the northern bank of the Syr Darya river."},{"n":12,"text":"Until which year is the current lease scheduled to run?","answer":["2050"],"explain":"Paragraph F says the lease is scheduled to run until 2050."},{"n":13,"text":"Which rocket used at Baikonur relies on a highly toxic propellant?","answer":["proton","the proton","proton rocket","the proton rocket"],"explain":"Paragraph G says the Proton rocket uses a highly toxic propellant."}]}]},{"title":"What Sleep Does for Memory","intro":"You should spend about 20 minutes on Questions 14–26, which are based on Reading Passage 2 below.","paragraphs":[{"label":"A","text":"Human beings spend roughly a third of their lives asleep, and for much of history this time was regarded as a period of mental inactivity. Over the past century, however, researchers have assembled a substantial body of evidence suggesting that the sleeping brain is far from idle, and that one of its most important tasks is the processing of memories. The first systematic hints came from studies of forgetting. In the 1880s the German psychologist Hermann Ebbinghaus measured how quickly he forgot lists of meaningless syllables, plotting what became known as the forgetting curve. In 1924 the American psychologists John Jenkins and Karl Dallenbach reported that participants who slept after learning such syllables forgot less than those who remained awake for the same period. At the time, they attributed the effect to reduced interference: a sleeping person, they reasoned, is simply not exposed to new information that might disrupt what has just been learned."},{"label":"B","text":"To understand why sleep might do more than shelter memories from interference, it is necessary to consider its structure. Sleep is not a uniform state but a sequence of distinct stages. Non-rapid eye movement (NREM) sleep is conventionally divided into three stages of increasing depth, the deepest of which, often called slow-wave sleep, is characterised by large, slow electrical oscillations across the cortex. NREM sleep alternates with rapid eye movement (REM) sleep, during which brain activity resembles that of wakefulness, dreams tend to be vivid, and most skeletal muscles are temporarily paralysed. The two types of sleep alternate in cycles lasting roughly 90 minutes, with four to six cycles in a typical night. Their proportions, however, change as the night progresses: slow-wave sleep dominates the early cycles, whereas REM sleep becomes increasingly prominent towards morning."},{"label":"C","text":"The dominant explanation of how memories are stabilised, known as consolidation, involves two brain systems. According to this model, a structure called the hippocampus rapidly records new experiences, but these initial traces are fragile. Over time, information is gradually integrated into the neocortex, where it can be stored for the long term. Sleep appears to provide a privileged opportunity for this transfer. In an influential 1994 study, Matthew Wilson and Bruce McNaughton recorded the activity of 'place cells' in the hippocampus of rats; these neurons fire when an animal occupies a particular location. Cells that had fired together while the rats explored their environment fired together again during subsequent sleep, as though the
