const W2=[{"id":"W2-1","type":"opinion","topic":"Education","prompt":"Some people believe that schools should replace traditional examinations with continuous assessment based on projects and coursework.\n\nTo what extent do you agree or disagree? Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase the question; partly disagree – a blend of exams and coursework is best","Body 1: Continuous assessment reduces exam stress and rewards sustained effort and practical skills","Body 2: Exams remain essential for authenticity, fairness and high-stakes decisions","Conclusion: Restate that a blended system is the most reliable approach"],"ideas":["Exam anxiety can produce grades that do not reflect real ability","Coursework develops research, time-management and teamwork skills","Home-based work can be done with help from parents, tutors or AI","Supervised exams ensure every candidate faces the same conditions","Revising for exams trains students to recall knowledge under pressure"],"phrases":["high-stakes examinations","continuous assessment","a level playing field","sustained effort","under supervised conditions","a blended system of assessment"],"model":"For decades, end-of-year examinations have been the principal means of measuring what pupils have learnt. Some argue that these should be abolished in favour of continuous assessment through projects and coursework. While I accept that ongoing evaluation offers important benefits, I disagree that it should entirely replace examinations, since a balanced combination of the two is far more reliable.\n\nAdmittedly, continuous assessment reflects learning more accurately than a single high-pressure test. A student who suffers from anxiety or is unwell on the day of an exam may receive a grade that bears little relation to their actual ability. By contrast, assignments completed over a term reward sustained effort and allow teachers to identify weaknesses early. Moreover, project work develops skills that employers value, such as research, time management and collaboration, which a timed paper rarely measures.\n\nNevertheless, relying solely on coursework would create serious problems. The most obvious is authenticity: work completed at home can be produced with considerable help from parents, private tutors or, increasingly, artificial intelligence tools, making it difficult to know whose ability is being assessed. Examinations, held under supervised conditions, guarantee that every candidate is judged on the same tasks within the same time limit. This fairness is particularly important for high-stakes decisions such as university admission, where a level playing field matters greatly. Furthermore, preparing for exams teaches pupils to consolidate and recall knowledge under pressure, an ability they will need in many professions.\n\nIn conclusion, although continuous assessment provides a fuller and less stressful picture of a learner's progress, abandoning examinations altogether would undermine both reliability and fairness. The most sensible approach, in my view, is a blended system in which coursework and supervised tests each contribute to a student's final grade."},{"id":"W2-2","type":"discussion","topic":"Technology","prompt":"Some people think that the growing use of artificial intelligence in daily life will make people less capable of thinking for themselves. Others believe it will free people to focus on more creative and meaningful tasks. Discuss both these views and give your own opinion. Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase both views; opinion – the outcome depends on how AI is used","Body 1: Unused skills decline and AI answers may be accepted uncritically","Body 2: Like calculators, AI shifts human effort towards higher-level work","Conclusion: Favour the optimistic view, provided education teaches critical use"],"ideas":["Over-reliance on satellite navigation as an analogy for skill loss","Students may let chatbots summarise texts instead of analysing them","AI output can contain errors and bias","Calculators did not end mathematics but enabled harder problems","Doctors using AI screening gain more time for patients","Schools should teach students to check and build on AI output"],"phrases":["outsource reasoning","accept answers uncritically","repetitive tasks","amplify human creativity","intellectually lazy","a starting point rather than a final authority"],"model":"Artificial intelligence is now embedded in everything from search engines to writing assistants. Some fear that this dependence will erode our capacity for independent thought, whereas others maintain that it will liberate us to concentrate on creative and worthwhile work. Although both views have merit, I believe the outcome depends largely on how deliberately people choose to use these tools.\n\nThose who are pessimistic point out that skills which are not practised tend to decline. Just as many drivers can no longer navigate without satellite navigation, students who ask a chatbot to summarise every text may never learn to analyse an argument themselves. There is also a risk that people will accept machine-generated answers uncritically, even when they contain errors or bias. If reasoning is routinely outsourced, the ability to question, evaluate and form original judgements could gradually weaken.\n\nOn the other hand, supporters argue that every major technology has shifted, rather than destroyed, human capability. Calculators did not end mathematics; they allowed engineers to tackle more complex problems. Similarly, AI can handle repetitive tasks such as drafting routine emails or sorting data, leaving professionals more time for strategy, design and human interaction. A doctor who uses software to screen scans, for instance, can devote more attention to discussing treatment options with patients.\n\nIn my opinion, the second view is more convincing, but only if education adapts accordingly. Schools should teach learners to use AI as a starting point rather than a final authority, checking its output carefully and building on it. Used passively, artificial intelligence may indeed make us intellectually lazy; used critically, however, it has the potential to amplify human creativity rather than replace it."},{"id":"W2-3","type":"problem_solution","topic":"Environment","prompt":"In many countries, large amounts of food are wasted by households, shops and restaurants.\n\nWhat are the causes of this problem, and what measures could be taken to reduce it? Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Food waste squanders resources; essay will give causes and solutions","Body 1: Causes – cosmetic standards, multi-buy offers, confusing date labels, large portions","Body 2: Solutions – legislation, selling imperfect produce, clearer labels, public education","Conclusion: A combination of law, retail reform and consumer education is needed"],"ideas":["Supermarkets reject misshapen but edible produce","'Buy one, get one free' offers encourage overbuying","Confusion between 'best before' and 'use by' dates","France bans supermarkets from destroying unsold food","Meal planning, correct storage and freezing leftovers","Smaller restaurant portions and take-away containers"],"phrases":["throughout the supply chain","cosmetic standards","multi-buy promotions","donate surplus food","public awareness campaigns","end up in landfill"],"model":"A substantial proportion of the food produced worldwide is thrown away before it is eaten, squandering water, land and energy and generating methane in landfill sites. This essay will examine the main reasons for this waste and suggest how governments, businesses and individuals could tackle it.\n\nThe causes lie at every stage of the supply chain. Supermarkets frequently reject fruit and vegetables that are misshapen or discoloured, even though they are perfectly edible, because they assume customers want flawless produce. Promotions such as 'buy one, get one free' then encourage shoppers to purchase more than they need. At home, confusion between 'best before' and 'use by' dates leads many families to discard items that are still safe. Restaurants contribute too, often serving oversized portions which diners cannot finish.\n\nSeveral measures could significantly reduce this waste. Firstly, governments could legislate, as France has done, to prohibit large supermarkets from destroying unsold food and require them to donate it to charities instead. Secondly, retailers should be encouraged to sell 'imperfect' produce at a discount and to replace multi-buy offers with reductions on single items. Clearer labelling is also essential; removing unnecessary 'best before' dates from products such as vegetables would prevent a great deal of needless disposal. Finally, public awareness campaigns can teach consumers practical habits, such as planning meals, storing food correctly and freezing leftovers, while restaurants could offer smaller portion sizes or take-away containers as standard.\n\nIn conclusion, food waste stems from cosmetic standards, aggressive marketing, confusing labels and careless consumption. Although no single solution will eliminate it, a combination of legislation, responsible retail practices and consumer education could dramatically reduce the amount of food that ends up in the bin."},{"id":"W2-4","type":"advantages","topic":"Health","prompt":"In some countries, governments are introducing taxes on sugary drinks and unhealthy foods in order to improve public health.\n\nDo the advantages of this policy outweigh the disadvantages? Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase; position – advantages clearly outweigh disadvantages","Body 1: Disadvantages – regressive impact on the poor, state interference, product switching","Body 2: Advantages – price changes behaviour, reformulation, revenue for health, lower healthcare costs","Conclusion: Drawbacks can be mitigated; benefits are greater"],"ideas":["Taxes hit low-income families hardest","Some see the policy as a 'nanny state' measure","Higher prices reduce consumption, especially among young people","UK soft drinks levy led manufacturers to cut sugar","Revenue can fund school sport and nutrition education","Healthier population reduces pressure on health services"],"phrases":["diet-related illnesses","a regressive tax","reformulate products","state interference","offset the burden","the scale of the obesity crisis"],"model":"Rising rates of obesity and type 2 diabetes have prompted several governments to impose taxes on sugary drinks and processed foods. While this policy has certain drawbacks, I am convinced that its benefits for public health are considerably greater.\n\nCritics of such taxes raise two main objections. The first is that such taxes are regressive: because lower-income households spend a larger share of their budgets on food, they bear a disproportionate burden. The second is that the policy may be seen as excessive state interference in personal choices, treating adults as if they were unable to decide what to eat and drink. Some also argue that consumers will simply switch to other unhealthy products that are not taxed.\n\nHowever, these disadvantages are outweighed by the advantages. Most importantly, price is a powerful influence on behaviour, particularly among young people. When the United Kingdom introduced its soft drinks levy, many manufacturers reformulated their products to reduce sugar content in order to avoid the charge, which meant that consumers benefited even without changing their habits. In addition, the revenue raised can be invested in health initiatives, such as school sports programmes or free nutrition education, partly offsetting the burden on poorer families. Over time, a healthier population also reduces the enormous costs that diet-related illnesses impose on national health services, freeing resources for other treatment.\n\nIn conclusion, although taxes on unhealthy food can place pressure on low-income consumers and limit individual freedom, these concerns can be mitigated through careful use of the revenue. Given the scale of the health crisis linked to poor diet, I believe the advantages of this policy clearly outweigh its disadvantages."},{"id":"W2-5","type":"two_part","topic":"Work","prompt":"More and more employees are now working from home for some or all of the week.\n\nWhy is this happening? Is this a positive or negative development? Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase; answer both questions – largely positive if managed well","Body 1: Reasons – technology and the COVID-19 pandemic; lower office costs","Body 2: Positive – no commute, work-life balance, less congestion, wider recruitment; risks addressed by hybrid models","Conclusion: Summarise causes and positive overall evaluation"],"ideas":["Cloud storage and video calls make remote work possible","The pandemic proved productivity could remain stable","Companies save money on office rent","No daily commute saves time and reduces stress","Fewer cars at rush hour cut emissions","Isolation and weaker mentoring can be solved with hybrid working"],"phrases":["remote working","a daily commute","work-life balance","hybrid working model","recruit from a wider talent pool","reduce overheads"],"model":"In recent years, a growing number of employees have begun working remotely for at least part of the week. This essay will explain the main reasons for this shift and argue that, on balance, it is a positive development, provided that it is managed carefully.\n\nTwo factors largely account for this trend. The first is technological: high-speed internet, cloud storage and video-conferencing platforms now allow many office tasks to be completed from almost anywhere. The second is the experience of the COVID-19 pandemic, which forced organisations to adopt remote work overnight. Having discovered that productivity often remained stable, many employers decided to retain flexible arrangements, partly because they also reduced the cost of renting large offices.\n\nIn my view, this development is largely beneficial. For employees, eliminating a daily commute can save several hours each week, reducing stress and leaving more time for family, exercise or study. Parents of young children, in particular, find it easier to balance professional and domestic responsibilities. Society also gains, as fewer cars on the road during rush hour means less congestion and lower carbon emissions. Furthermore, companies can recruit talented staff from a much wider geographical area rather than only those living near the head office.\n\nAdmittedly, remote work is not without risks. Some employees feel isolated, and junior staff may miss opportunities to learn by observing experienced colleagues. Nevertheless, these problems can be addressed through hybrid models, in which teams meet in person on fixed days.\n\nIn conclusion, the rise of home working has been driven by technological progress and the lessons of the pandemic. Although it presents challenges, its benefits for wellbeing, the environment and recruitment make it a largely positive change."},{"id":"W2-6","type":"opinion","topic":"Cities","prompt":"Some people believe that private cars should be banned from city centres and replaced by public transport, cycling and walking.\n\nTo what extent do you agree or disagree? Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase; largely agree, with necessary exceptions","Body 1: Cleaner air, better health and more public space (Copenhagen, Ljubljana)","Body 2: Economic gains for local shops; but exemptions and good public transport are essential","Conclusion: Agree in principle, with exemptions and investment"],"ideas":["Vehicle exhausts worsen asthma and heart disease","Pedestrianised centres become attractive public spaces","Pedestrians and cyclists often spend more in local shops","Disabled people, deliveries and emergency services need access","Ban only works if public transport is frequent and affordable"],"phrases":["traffic congestion","pedestrianised zones","air quality","revitalise the city centre","reliable and affordable public transport","reasonable exemptions"],"model":"Many city centres suffer from traffic jams, air pollution and noise, prompting calls for private cars to be banned from these areas altogether. I largely agree with this proposal, although I believe certain exceptions are necessary for it to work fairly.\n\nThe strongest argument for a ban concerns health and the environment. Vehicle exhausts are a major source of nitrogen dioxide and fine particles, which aggravate asthma and heart disease, especially among children and elderly residents. Removing cars from central streets would therefore lead to cleaner air almost immediately. Cities that have pedestrianised their centres, such as Copenhagen and Ljubljana, also demonstrate that space previously used for traffic and parking can be transformed into squares, cycle lanes and green areas where people genuinely want to spend time.\n\nA second benefit is economic. Contrary to the fears of some shopkeepers, research from several European cities suggests that pedestrians and cyclists visit local shops more frequently than drivers and spend more money overall. A calmer, more attractive centre also draws tourists and encourages cafés and markets to flourish.\n\nNevertheless, a complete ban without exceptions would be unfair. People with disabilities, delivery vehicles and emergency services clearly need access, and residents who live within the restricted zone must be able to reach their homes. Moreover, such a policy can only succeed if public transport is frequent, affordable and reliable; otherwise, it would simply penalise those with no realistic alternative.\n\nIn conclusion, I agree that private cars should, in principle, be removed from city centres, as this would improve public health and revitalise urban life. However, the policy should include reasonable exemptions and be accompanied by substantial investment in public transport."},{"id":"W2-7","type":"discussion","topic":"Media","prompt":"Some people think that news organisations should only report facts and avoid expressing opinions. Others believe that commentary and analysis are an essential part of journalism. Discuss both these views and give your own opinion. Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase both views; opinion – both matter if clearly separated","Body 1: Facts-only view – avoids bias, reduces polarisation, restores trust","Body 2: Analysis view – context, explanation and holding power to account","Conclusion: Transparency and clear labelling matter more than removing opinion"],"ideas":["Mixing fact and opinion confuses audiences","Partisan outlets on social media fuel polarisation","Raw statistics need context to be understood","Investigative journalism exposes corruption","Separate news pages from editorial and comment sections"],"phrases":["objective reporting","partisan outlets","a polarised public","place events in context","hold institutions to account","clearly labelled opinion pieces"],"model":"The role of journalism in society is frequently debated. While some argue that the news media should confine themselves to reporting facts, others contend that interpretation and comment are integral to good journalism. In my view, both are valuable, provided that the distinction between them is made absolutely clear.\n\nThose who favour purely factual reporting are concerned about bias. When journalists blend facts with personal views, audiences may struggle to separate what has happened from what a writer thinks about it. This problem has become more serious in the age of social media, where partisan outlets present opinion as news and contribute to a polarised public that no longer agrees even on basic information. A strictly factual approach, it is argued, would restore trust and allow citizens to reach their own conclusions.\n\nOn the other hand, facts alone rarely tell the whole story. A report that unemployment has risen by two per cent is accurate, yet without analysis readers may not understand its causes or likely consequences. Expert commentary places events in context, explains complex issues such as economic policy or climate science, and holds powerful institutions to account by questioning official statements. Indeed, many landmark investigations which exposed corruption began with journalists interpreting evidence rather than simply recording it.\n\nPersonally, I believe that opinion and analysis are essential, but they must be clearly labelled. Reputable newspapers achieve this by separating news pages from editorial and comment sections, so that readers always know which they are reading.\n\nIn conclusion, although objective reporting forms the foundation of trustworthy news, thoughtful commentary adds depth and accountability. The real priority, therefore, should be transparency rather than the elimination of opinion."},{"id":"W2-8","type":"advantages","topic":"Culture","prompt":"As a result of globalisation, young people around the world increasingly watch the same films, listen to the same music and wear similar clothes.\n\nDo the advantages of this trend outweigh the disadvantages? Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase; position – disadvantages are more significant","Body 1: Advantages – easier international connection, tolerance, motivation to learn languages","Body 2: Disadvantages – dominance of a few companies, loss of traditions and minority languages, less diversity","Conclusion: Disadvantages outweigh; support national arts and languages"],"ideas":["Shared culture helps students abroad and online gamers connect","Foreign music motivates language learning (e.g. K-pop and Korean)","Global media dominated by a few wealthy companies","Local artists cannot compete with big budgets","Traditions and minority languages may disappear","Schools can promote national arts alongside global culture"],"phrases":["cultural homogenisation","broaden young people's horizons","local traditions","minority languages","fall out of use","national identity"],"model":"Thanks to streaming platforms and social media, a teenager in Almaty may now follow the same musicians, series and fashion brands as one in London or Seoul. Although this shared global culture brings some genuine benefits, I believe that its disadvantages, particularly the threat to local traditions, are more significant.\n\nThere are undeniable advantages to this trend. A common cultural vocabulary makes it easier for young people from different countries to connect, whether they are studying abroad, playing online games or collaborating on international projects. Exposure to foreign films and music can also broaden horizons, encourage tolerance and motivate learners to study other languages; many students, for example, begin learning Korean or English because of the music they enjoy.\n\nHowever, these benefits come at a considerable cost. The global entertainment market is dominated by a small number of powerful companies, mostly based in a handful of wealthy countries, and their products can easily overshadow local artists who lack comparable budgets. As a result, traditional music, crafts and storytelling may come to be regarded by the young as old-fashioned, and some minority languages risk falling out of use altogether. Once such traditions disappear, they are extremely difficult to revive. Moreover, cultural uniformity reduces the very diversity that makes travel and international exchange rewarding in the first place.\n\nIn conclusion, while a shared youth culture undoubtedly facilitates communication and openness among young people, it also threatens the survival of local identities. On balance, I consider the disadvantages to be greater, and I believe governments and schools should actively support national arts and languages so that young people can enjoy global culture without losing their own."},{"id":"W2-9","type":"two_part","topic":"Travel","prompt":"Nowadays, many tourists prefer to plan their own trips rather than book package holidays organised by travel agents.\n\nWhy do you think this is the case? Is this a positive or negative development? Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase; give reasons and argue it is largely positive","Body 1: Reasons – booking websites and apps, low-cost airlines, desire for authentic experiences","Body 2: Positive – personalised itineraries, money stays in local economies; risks manageable","Conclusion: Summarise causes; positive development overall"],"ideas":["Online reviews and price comparison remove the need for agents","Budget airlines offer cheap direct flights","Younger travellers want authentic, flexible experiences","Family-run guesthouses and local guides benefit","Rural regions gain more from tourism","Travel insurance reduces risks of independent travel"],"phrases":["independent travel","package holidays","tailor an itinerary","authentic experiences","the local economy","comprehensive travel insurance"],"model":"In the past, most holidaymakers relied on travel agents to arrange their flights, hotels and excursions. Today, however, a growing number of tourists prefer to plan their own trips. This essay will discuss the reasons for this change and argue that it is a largely positive trend.\n\nThe main explanation is the internet. Booking websites and mobile applications now allow travellers to compare prices, read reviews and reserve accommodation within minutes, removing the need for an intermediary. Low-cost airlines have further simplified the process by offering cheap direct flights to a wide range of destinations. In addition, many people, particularly younger travellers, now seek authentic experiences rather than standardised resort holidays, and they feel that organised tours restrict their freedom to explore at their own pace.\n\nIn my view, this development is beneficial for both tourists and host communities. Independent travellers can tailor their itineraries to their own interests, whether that means hiking in remote mountains or exploring local food markets. Furthermore, they tend to stay in family-run guesthouses, eat in small restaurants and hire local guides, so a larger share of their spending remains in the local economy rather than flowing to international hotel chains. This can make a significant difference to rural regions which have historically benefited little from tourism.\n\nAdmittedly, independent travel carries some risks, as tourists may lack support if flights are cancelled or emergencies occur. Nevertheless, comprehensive travel insurance and readily available online information largely address these concerns.\n\nIn conclusion, the shift towards independent travel has been driven by technology, cheaper flights and a desire for authenticity. Despite certain risks, it offers greater flexibility and spreads the economic benefits of tourism more widely, making it a positive development."},{"id":"W2-10","type":"discussion","topic":"Crime & Law","prompt":"Some people argue that young offenders should receive the same punishments as adults who commit similar crimes. Others believe that young people should be treated differently, with a focus on education and rehabilitation. Discuss both these views and give your own opinion. Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase both views; firmly support rehabilitation","Body 1: Equal punishment – justice for victims, deterrence, gangs exploiting minors","Body 2: Different treatment – brain development, prisons create criminals, rehabilitation works (Norway)","Conclusion: Accountability plus rehabilitation serves society best"],"ideas":["Victims suffer the same harm regardless of offender's age","Harsh sentences may deter some teenagers","Gangs recruit minors because penalties are lighter","Teenage brains are still developing impulse control","Adult prisons can turn minor offenders into hardened criminals","Norway's rehabilitation model has low reoffending rates"],"phrases":["young offenders","act as a deterrent","hardened criminals","vocational training","reoffending rates","law-abiding lives"],"model":"How society should respond to crimes committed by teenagers is a sensitive issue. Some argue that young offenders should face the same penalties as adults, while others insist that they require a different approach centred on rehabilitation. Although I understand the first position, I firmly support the second.\n\nThose in favour of equal punishment emphasise justice for victims. A serious assault or burglary causes the same harm regardless of the offender's age, and victims may feel that lenient treatment trivialises their suffering. Supporters also claim that harsh sentences act as a deterrent: if teenagers know they will be treated as adults, they may think twice before committing an offence. Furthermore, some criminal gangs deliberately recruit minors precisely because they are likely to receive lighter punishments.\n\nNevertheless, there are compelling reasons to treat young people differently. Research in neuroscience indicates that the part of the brain responsible for controlling impulses and assessing risk is not fully developed until the mid-twenties, which means teenagers are more likely to act recklessly but are also more capable of change. Placing them in adult prisons, where they are surrounded by experienced criminals, often turns minor offenders into hardened ones. By contrast, programmes that combine supervision with education, vocational training and counselling give them a realistic chance of building law-abiding lives. Norway's emphasis on rehabilitation, for instance, has contributed to one of the lowest reoffending rates in the world.\n\nIn conclusion, while the desire for equal treatment is understandable, punishing teenagers as adults is likely to increase rather than reduce crime in the long term. A system that holds young offenders accountable while focusing on their rehabilitation better serves both them and society."},{"id":"W2-11","type":"problem_solution","topic":"Family","prompt":"In many countries, parents now spend less time with their children than in the past.\n\nWhat problems can this cause, and what can be done to address them? Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase; problems are serious but solvable by families, employers and governments","Body 1: Problems – emotional insecurity, screens as substitutes, weaker academic support","Body 2: Solutions – flexible work, parental leave and childcare, screen-free family routines","Conclusion: Summarise problems and combined solutions"],"ideas":["Children may struggle to express feelings or feel secure","Some seek approval from negative peer groups","Tablets used as babysitters affect sleep and fitness","Parents less able to monitor homework","Flexible hours and home working for parents","Screen-free meals and bedtime reading rebuild bonds"],"phrases":["emotional development","quality time","parental leave","affordable childcare","screen-free family meals","close family bonds"],"model":"In many societies, long working hours and the pressures of modern life mean that parents spend considerably less time with their children than previous generations did. This trend can have serious consequences, but there are practical steps that families, employers and governments can take to reverse it.\n\nThe most significant problem concerns children's emotional development. Young people who rarely enjoy meaningful conversations with their parents may struggle to express their feelings or feel secure, and some seek attention and approval elsewhere, occasionally from negative peer groups. A further problem is the growing reliance on screens as a substitute for parental attention. When busy parents hand children a tablet to keep them occupied, the children may spend hours watching videos, which can affect their sleep, concentration and physical fitness. Academic performance may also suffer, since parents who are rarely at home are less able to monitor homework or notice early signs of difficulty at school.\n\nFortunately, these problems can be addressed. Employers can play a central role by offering flexible working hours or the option to work from home, enabling parents to be present when children return from school. Governments, meanwhile, could extend paid parental leave and subsidise affordable childcare close to workplaces. Within the family itself, small changes can make a considerable difference: establishing screen-free family meals, reading together before bedtime or setting aside one day each weekend for shared activities helps to rebuild close relationships, even when time is limited.\n\nIn conclusion, a lack of parental time can harm children's emotional wellbeing, health and education. However, through supportive workplace policies, government assistance and conscious changes in family routines, parents can ensure that their children receive the attention they need."},{"id":"W2-12","type":"opinion","topic":"Economy","prompt":"Some people think that governments should pay every adult citizen a basic income, regardless of whether they work or not.\n\nTo what extent do you agree or disagree? Give reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Define universal basic income; largely disagree due to cost and motivation","Body 1: Arguments for – safety net against automation, simpler than welfare, freedom to retrain (Finland pilot)","Body 2: Arguments against – huge cost, poorly targeted, reduced incentive to work; targeted benefits and retraining are better","Conclusion: Impractical; targeted support is a wiser use of public funds"],"ideas":["Automation may eliminate many jobs","Simpler to administer than complex welfare systems","Finland's pilot improved participants' wellbeing","Requires major tax rises or cuts to public services","Money also goes to people who do not need it","Retraining programmes help displaced workers"],"phrases":["universal basic income","a safety net","targeted benefits","the incentive to work","public funds","workers displaced by automation"],"model":"The idea of a universal basic income, a regular payment made to every adult whether or not they are employed, has attracted growing attention as automation threatens many jobs. Although the proposal has some appealing features, I largely disagree that governments should introduce it, mainly because of its cost and its possible effect on motivation.\n\nAdmittedly, there are persuasive arguments in its favour. A guaranteed income would provide a safety net for those who lose their jobs to technological change, and it would be simpler to administer than complex welfare systems, which often leave eligible people without support because of bureaucracy. It could also give individuals the freedom to retrain, care for relatives or start a business without fear of destitution. A pilot scheme in Finland, for example, reported improvements in participants' wellbeing.\n\nHowever, the financial implications are enormous. Paying a meaningful sum to every adult would require either dramatic tax increases or deep cuts to public services such as healthcare and education. Moreover, because the payment would go to the wealthy as well as the poor, much of the money would be spent on people who do not need it, rather than being targeted at the most vulnerable. There is also a legitimate concern that some recipients might lose the incentive to work, reducing productivity and tax revenue at the very moment the scheme required funding. In my opinion, a more effective approach would be to strengthen existing targeted benefits and invest heavily in retraining programmes, so that workers displaced by automation can move into new industries.\n\nIn conclusion, while a universal basic income offers security and simplicity, its cost and potential impact on employment make it impractical. Targeted support and education represent a far wiser use of public funds."},{"id":"W2-13","type":"opinion","topic":"Space Exploration","prompt":"Some argue that space exploration should now be left entirely to private companies rather than being funded by national governments.\n\nTo what extent do you agree or disagree?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase the claim; state a clear position — private firms add efficiency, but exploration should not be handed over entirely.","Body 1: Concede the case for private involvement — reusable rockets have cut launch costs; public money could be redirected to domestic needs.","Body 2: Main argument — pure science has no profit motive and long time horizons; space debris, resources and military use need democratic accountability and treaties.","Conclusion: Restate the position and recommend a partnership in which states set the agenda and firms deliver it."],"ideas":["Competition has driven down the cost of reaching orbit through reusable rockets","Governments can act as customers rather than operators, freeing public funds","Deep-space science and climate monitoring offer little short-term financial return","Shareholders demand profits within years, not decades","Orbital congestion, debris and resource extraction require international regulation","A public-private partnership combines efficiency with accountability"],"phrases":["a symbol of national prestige","slash the cost of reaching orbit","a sensible division of labour","no foreseeable financial return","answerable to shareholders","an increasingly congested frontier"],"model":"Over the past decade, private firms have transformed space travel from a symbol of national prestige into a commercial enterprise, prompting some to argue that governments should withdraw from the field altogether. While I accept that private companies have brought welcome efficiency to the sector, I strongly disagree that space exploration should be surrendered to them entirely.\n\nAdmittedly, there is a persuasive case for greater private involvement. Commercial operators, driven by competition and the need to turn a profit, have slashed the cost of reaching orbit by developing reusable rockets, an innovation that state agencies had failed to deliver for decades. Furthermore, if satellite launches and supply missions can be handled by the market, public funds could be redirected towards pressing domestic needs such as healthcare and education. From this perspective, governments acting as customers rather than operators appears a sensible division of labour.\n\nNevertheless, handing the entire enterprise to corporations would be short-sighted. Much of the most valuable exploration offers no foreseeable financial return; missions to study distant planets or to monitor the climate from orbit are undertaken to expand human knowledge, not to satisfy shareholders. A company answerable to investors would have little incentive to fund a telescope that may take twenty years to yield results. Moreover, space is increasingly congested and strategically sensitive, so decisions about debris, resource extraction and military use require democratic accountability and international treaties, which only governments can negotiate.\n\nIn conclusion, although private enterprise has made space more accessible and affordable, it cannot replace the public sector's role in pursuing long-term science and regulating an increasingly congested frontier. The most effective model, in my view, is a partnership in which states set the agenda and businesses compete to deliver it."},{"id":"W2-14","type":"discussion","topic":"Globalisation","prompt":"Some people think that globalisation has made the world's cultures increasingly alike and that this represents a loss for humanity. Others believe it has given ordinary people access to a richer variety of cultural experiences than ever before.\n\nDiscuss both these views and give your own opinion.\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Introduce the debate over cultural homogenisation versus enrichment; state that globalisation broadens horizons more than it narrows them.","Body 1: View 1 — identical high streets, dominance of Hollywood and English-language media, loss of local crafts, dialects and traditions.","Body 2: View 2 — culture now flows in many directions (K-dramas, Afrobeats); streaming and travel build curiosity; global interest can revive local traditions.","Conclusion: Agree with view 2, while stressing that local heritage needs active support to thrive alongside global influences."],"ideas":["Global chains make city centres look the same worldwide","Hollywood and English-language pop dominate screens and airwaves","Young people may abandon local traditions for lifestyles seen online","Non-Western culture such as Korean drama and Afrobeats now reaches global audiences","Exposure to other cultures can foster tolerance and curiosity","Tourism and online interest create new markets for traditional artisans"],"phrases":["the homogenisation of everyday life","a tide of mass-produced culture","a two-way cultural exchange","broaden cultural horizons","foster curiosity and tolerance","be eclipsed by global influences"],"model":"As trade, travel and digital media have bound nations ever more tightly together, a debate has emerged over whether this process is erasing cultural diversity or enriching it. This essay will examine both positions before arguing that, on balance, globalisation broadens cultural horizons more than it narrows them.\n\nThose who lament globalisation point to the visible homogenisation of everyday life. High streets from Lisbon to Almaty are now lined with the same coffee chains and fashion retailers, while Hollywood films and English-language pop music dominate screens and airwaves worldwide. Critics argue that this tide of mass-produced culture crowds out local crafts, dialects and traditions, particularly among young people who aspire to the lifestyles they see on social media. When a minority language or folk art disappears, they contend, a unique way of understanding the world is lost for ever.\n\nOn the other hand, supporters maintain that globalisation has made culture a two-way exchange rather than a one-way imposition. Korean television dramas, Nigerian Afrobeats and Japanese cuisine have all found enthusiastic global audiences, something unthinkable a generation ago. Streaming platforms and affordable flights allow an ordinary person to sample music, food and literature from dozens of countries, and this exposure often fosters curiosity and tolerance. In addition, international interest can actually revive endangered traditions, as tourists and online followers create new markets for local artisans.\n\nIn my opinion, the second view is more convincing. Although the spread of global brands has undeniably made some surface features of life more uniform, the deeper effect has been to multiply the cultural choices available to individuals. The real challenge for governments and communities is to ensure that local heritage is actively supported, so that it can thrive alongside global influences rather than be eclipsed by them."},{"id":"W2-15","type":"problem_solution","topic":"Language","prompt":"In many countries, young people who move to cities are losing the ability to speak the traditional language of their family or region.\n\nWhat problems does this cause, and what measures could be taken to address it?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Describe the shift away from family and regional languages caused by urbanisation; preview problems and solutions.","Body 1: Problems — erosion of cultural heritage (oral history, songs, local knowledge); a communication gap between generations and weaker identity.","Body 2: Solutions — bilingual schooling that gives regional languages prestige (Welsh example); funding for films, podcasts and apps in minority languages.","Conclusion: Summarise the threats and argue that institutional and media support can keep these languages alive."],"ideas":["Languages carry oral history, proverbs and local ecological knowledge","Grandparents and grandchildren may lose the ability to communicate meaningfully","Young people may experience a weaker sense of cultural identity","Bilingual education can raise the status of regional languages","Welsh-medium schooling has increased the number of young speakers","Digital content shows that heritage languages belong in modern life"],"phrases":["the erosion of cultural heritage","a heritage language","sever a link with the past","a widening gap between generations","give a language institutional support","a subject of prestige rather than a relic of the past"],"model":"Rapid urbanisation has drawn millions of young people away from their home regions, and in the process many are abandoning the language spoken by their parents and grandparents in favour of a dominant national or global tongue. This trend creates significant cultural and social problems, but a combination of educational and community initiatives could help to reverse it.\n\nThe most serious consequence is the erosion of cultural heritage. A language is far more than a means of communication; it carries oral history, songs, proverbs and specialised knowledge of local landscapes that often cannot be translated. When a generation stops using it, this inheritance is effectively severed. A second problem is the widening gap between generations. Grandparents who are not fluent in the urban language may find themselves unable to hold meaningful conversations with their grandchildren, leading to isolation for the elderly and a weaker sense of identity among the young.\n\nTo tackle this issue, governments should first ensure that regional languages have a secure place in the school curriculum, ideally through bilingual programmes that treat them as subjects of prestige rather than relics of the past. Wales offers an instructive example: after decades of decline, Welsh-medium education has helped to increase the number of young speakers. Beyond the classroom, the language must also be visible in modern life. Funding for films, podcasts and mobile apps in minority languages would show young people that their heritage tongue is relevant to the digital world they inhabit.\n\nIn conclusion, the loss of family languages among young city dwellers threatens both cultural continuity and family cohesion. However, if regional languages are given institutional support in schools and a vibrant presence in the media, there is every reason to believe they can survive the pressures of urban life."},{"id":"W2-16","type":"advantages","topic":"Sport","prompt":"Increasingly, children are being encouraged to specialise in a single sport from a very young age in the hope that they will become professional athletes.\n\nDo the advantages of this trend outweigh the disadvantages?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Describe the trend of early specialisation; state that the disadvantages for health and well-being outweigh the benefits.","Body 1: Advantages — earlier accumulation of practice hours, technique refined while the body is adaptable, access to elite academies, discipline.","Body 2: Disadvantages — overuse injuries, psychological pressure and burnout, very few turn professional, loss of all-round coordination and enjoyment.","Conclusion: Restate the view and recommend sampling several sports before specialising in the mid-teens."],"ideas":["Expertise requires thousands of hours of deliberate practice","In early-peaking sports such as figure skating, a late start is a serious handicap","Specialisation can instil discipline and a strong work ethic","Repetitive training causes overuse injuries in growing bodies","Intense pressure leads to burnout and dropout in adolescence","Multi-sport participation builds coordination and a lifelong love of exercise"],"phrases":["nurture a future champion","deliberate practice","place excessive strain on growing joints","overuse injuries","prone to burnout","a dream that never materialises"],"model":"It is becoming common for parents and coaches to steer children towards one sport, sometimes before the age of eight, with the aim of nurturing a future champion. Although early specialisation can accelerate skill development, I would argue that its drawbacks for children's health and well-being are considerably more significant.\n\nThe case for early specialisation rests largely on the idea that expertise requires thousands of hours of deliberate practice. A child who focuses exclusively on gymnastics or tennis from an early age will accumulate this training sooner, refine technique while the body is still highly adaptable and gain access to elite academies and competitions. In sports such as figure skating, where athletes often peak in their teens, a late start can make reaching the top level almost impossible. Specialisation may also instil discipline and a strong work ethic.\n\nHowever, these gains come at a considerable cost. Repeating the same movements year after year places excessive strain on growing bones and joints, and sports medicine specialists report a rise in overuse injuries among young athletes. Psychological pressure is an equally serious concern; children whose identity and family expectations revolve around a single goal are prone to burnout and frequently abandon sport altogether in adolescence. Moreover, only a tiny fraction will ever turn professional, meaning that most sacrifice a broad, enjoyable childhood for a dream that never materialises. Playing a range of sports, by contrast, develops all-round coordination and a lifelong love of physical activity.\n\nIn conclusion, while early specialisation may produce a handful of elite performers, the risks of injury, burnout and a lost childhood outweigh these benefits for the majority. Children should instead be encouraged to sample several sports before committing to one in their mid-teens."},{"id":"W2-17","type":"two_part","topic":"Advertising","prompt":"Companies now pay social media influencers to promote products to their followers, often without making it clear that the content is an advertisement.\n\nWhy has this form of marketing become so popular? Should it be more strictly regulated?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Note the shift of marketing budgets towards influencers; outline that the essay explains its popularity and argues for firmer regulation.","Body 1 (Question 1): Popularity — followers trust influencers as peers, perceived authenticity drives sales among sceptical young people, precise audience targeting.","Body 2 (Question 2): Regulation — undisclosed sponsorship is deceptive, children are especially vulnerable, existing labelling rules are poorly enforced; fines needed.","Conclusion: Summarise both answers — credibility plus targeting explain its success, so transparent, enforced disclosure is essential."],"ideas":["Followers see influencers as friends rather than salespeople","Young consumers are sceptical of traditional advertising","Brands can match influencers to their ideal customer profile","Hidden sponsorship prevents viewers from judging endorsements critically","Children struggle to recognise commercial intent","Clear 'paid partnership' labels should be backed by meaningful fines"],"phrases":["blur the line between advertising and opinion","perceived authenticity","a highly targeted audience","a return on investment","recognise commercial intent","rigorously enforced disclosure rules"],"model":"In recent years, brands have shifted large portions of their marketing budgets away from television and print towards social media personalities who endorse products in their everyday posts. This essay will explain why such influencer marketing has flourished and argue that it requires firmer regulation to protect consumers.\n\nThe popularity of this approach stems mainly from trust and precision. Followers tend to regard influencers as friends or peers rather than salespeople, so a recommendation embedded in a casual video feels far more authentic than a conventional commercial. This perceived authenticity translates directly into sales, particularly among teenagers and young adults, who are increasingly sceptical of traditional advertising. In addition, social media platforms allow companies to reach highly specific audiences; a skincare brand, for instance, can partner with a beauty vlogger whose followers match its ideal customer profile, achieving a return on investment that billboards cannot rival.\n\nHowever, it is precisely this blurring of the line between advertising and personal opinion that makes stricter oversight necessary. When viewers are unaware that a post has been paid for, they cannot judge the endorsement critically, which amounts to a form of deception. The problem is especially acute for children, who are less able to recognise commercial intent and may be persuaded to buy unhealthy snacks or expensive gadgets. Some countries have already introduced rules requiring clear labels such as 'paid partnership', but enforcement remains patchy. Regulators should therefore impose meaningful fines on both brands and influencers who fail to disclose sponsorship.\n\nIn conclusion, influencer marketing thrives because it combines the credibility of personal recommendation with precise audience targeting. Yet these same qualities can easily mislead consumers, so transparent disclosure rules, rigorously enforced, are essential."},{"id":"W2-18","type":"problem_solution","topic":"Housing","prompt":"In many major cities, young adults are unable to afford a home of their own and are forced to live with their parents well into their thirties.\n\nWhat are the causes of this situation, and what can be done to solve it?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Describe the affordability crisis facing young urban professionals; preview causes and solutions.","Body 1: Causes — supply failing to meet demand due to planning restrictions and land shortages; housing treated as an investment asset; stagnant wages and large deposits.","Body 2: Solutions — relax zoning for higher density and build social rental housing (Vienna); tax vacant and second homes; shared ownership and deposit schemes.","Conclusion: Summarise the three causes and the combined policy response."],"ideas":["Jobs concentrate in big cities, driving continuous migration","Restrictive planning laws limit new construction","Investors buy properties to rent out or leave empty","Wages for young workers have not kept pace with house prices","Vienna's large stock of public rental housing keeps rents affordable","Taxes on vacant homes and deposit-support schemes help first-time buyers"],"phrases":["a chronic imbalance between supply and demand","restrictive planning regulations","housing as an investment asset","get onto the property ladder","higher-density housing","first-time buyers"],"model":"Across many of the world's largest cities, a growing number of young professionals find that, despite holding steady jobs, owning or even renting a home of their own remains out of reach. This essay will outline the principal causes of this housing crisis and propose several measures that governments could take to ease it.\n\nThe root of the problem is a chronic imbalance between supply and demand. As employment opportunities concentrate in major urban centres, people continue to migrate there, yet construction has failed to keep pace because of restrictive planning regulations and a shortage of available land. A second cause is the treatment of housing as an investment asset. Wealthy individuals and corporations purchase properties to rent out or simply leave empty in anticipation of rising prices, which inflates values far beyond what local salaries can support. Meanwhile, wages for young workers have stagnated, so the deposit required for a mortgage may now exceed several years of income.\n\nTackling this crisis requires action on several fronts. Firstly, local authorities should relax zoning laws to permit higher-density housing near transport links, and invest directly in affordable homes for rent, as Vienna has done successfully for decades. Secondly, governments could discourage speculation by taxing second homes and vacant properties more heavily, thereby returning more dwellings to the market. Finally, schemes such as shared ownership or government-backed deposits would help first-time buyers to get onto the property ladder without waiting until middle age.\n\nIn conclusion, the inability of young adults to secure independent housing results from inadequate supply, speculative investment and stagnant wages. A combination of planning reform, targeted taxation and support for first-time buyers offers the most realistic path towards making urban homes affordable once again."},{"id":"W2-19","type":"discussion","topic":"Science","prompt":"Some people believe that scientific research should focus on solving practical problems that affect people's lives today. Others argue that scientists should be free to pursue research purely out of curiosity, even if it has no obvious application.\n\nDiscuss both these views and give your own opinion.\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Frame the funding debate between applied and curiosity-driven research; state that curiosity-driven research must be protected.","Body 1: View 1 — limited resources should target urgent needs (vaccines, crops, renewable energy); taxpayers expect tangible returns.","Body 2: View 2 — major breakthroughs came from basic research (electromagnetism, gene editing from bacterial immunity); usefulness cannot be predicted.","Conclusion: Fund both, but shield fundamental research from short-term political pressure."],"ideas":["Vaccines, drought-resistant crops and cheap renewables have direct impact","Taxpayers expect measurable returns on public research spending","Studying distant galaxies may seem hard to justify amid poverty","Nineteenth-century electromagnetism research led to electricity and the internet","Gene editing grew out of basic research into bacterial immune systems","The applications of a discovery are often impossible to predict"],"phrases":["curiosity-driven research","a tangible return on investment","transformative breakthroughs","fundamental research","short-term political pressures","have a direct and measurable impact"],"model":"With research budgets under constant pressure, there is ongoing debate about whether funding should be directed towards science with immediate practical benefits or towards open-ended inquiry driven by curiosity. While both approaches have merit, I believe that a healthy scientific culture must protect curiosity-driven research.\n\nAdvocates of applied research argue that, when resources are limited, priority should go to the most urgent human needs. Developing vaccines, improving crop yields in drought-prone regions and designing cheaper renewable energy all have a direct and measurable impact on millions of lives. Taxpayers, who ultimately fund much public research, understandably expect to see a tangible return on their investment. From this standpoint, spending large sums studying, for example, the behaviour of distant galaxies may seem difficult to justify while many people still lack clean water or adequate healthcare.\n\nOn the other hand, history shows that many of the most transformative breakthroughs emerged from research with no practical aim. The study of electromagnetism in the nineteenth century was pursued purely to understand nature, yet it eventually made possible everything from electric lighting to the internet. Similarly, the gene-editing technology now revolutionising medicine originated in basic research into how bacteria defend themselves against viruses. Because it is impossible to predict which discoveries will prove useful, restricting science to known problems risks cutting off the very innovations that could solve tomorrow's challenges.\n\nIn my view, the most sensible approach is to fund both, but to guard curiosity-driven research against short-term political pressures. Applied science addresses the problems we already recognise, whereas fundamental research equips us for those we cannot yet foresee. A society that funds only the former may solve today's problems efficiently, but it will find itself unprepared for the challenges of the future."},{"id":"W2-20","type":"advantages","topic":"Ageing Population","prompt":"In many countries, governments are raising the retirement age, so that people are now expected to continue working until they are seventy or older.\n\nDo the advantages of this development outweigh the disadvantages?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Explain why retirement ages are rising; state that the benefits for society and individuals are more substantial.","Body 1: Disadvantages — strain on workers in physically demanding jobs, fewer promotion opportunities for the young, sense of a broken promise.","Body 2: Advantages — sustainable pension finances as life expectancy rises, retention of expertise and mentoring, health benefits of staying active.","Conclusion: Acknowledge difficulties, propose flexible and early-exit options, and confirm that advantages outweigh disadvantages."],"ideas":["Manual workers and nurses may be physically unable to work safely into their late sixties","Older staff staying in senior roles may block younger colleagues' promotion","A shrinking workforce cannot fund decades-long pensions","Experienced employees preserve institutional knowledge and mentor others","Work keeps older people socially engaged and mentally active","Flexible and part-time roles make longer careers more manageable"],"phrases":["mounting pension costs","extend working lives","ease the pressure on public finances","a shrinking workforce","preserve valuable expertise","protect against cognitive decline"],"model":"Faced with ageing populations and mounting pension costs, numerous governments have begun raising the official retirement age, meaning that many citizens will work well into their late sixties or beyond. Although this policy carries certain drawbacks, I believe its benefits, for both society and individuals, are more substantial.\n\nAdmittedly, extending working lives is not without problems. Employees in physically demanding occupations, such as construction workers or nurses, may struggle to perform their duties safely in their late sixties, and forcing them to continue could damage their health. There is also a concern that older workers who remain in senior positions for longer may limit promotion opportunities for younger colleagues. Furthermore, people who have looked forward to retirement as a time for family and leisure may feel that the state has broken an implicit promise.\n\nNevertheless, the advantages are compelling. Most obviously, a later retirement age eases the pressure on public finances: as life expectancy rises, a shrinking workforce cannot otherwise fund pensions for retirees who may live for three decades after leaving work. Keeping experienced employees in the labour market also preserves valuable expertise and allows them to mentor less experienced staff. Perhaps less obviously, research suggests that remaining active and socially engaged through work can protect against loneliness and cognitive decline. Many older people, in fact, welcome the chance to stay productive, particularly if they can move into flexible or part-time roles.\n\nIn conclusion, while a higher retirement age poses genuine difficulties for those in strenuous jobs, these can be addressed through flexible arrangements and early-exit options for manual workers. Overall, the financial sustainability and personal benefits of longer working lives outweigh the disadvantages."},{"id":"W2-21","type":"two_part","topic":"Tourism","prompt":"Some popular tourist destinations are now limiting the number of visitors they accept or charging tourists a fee simply to enter.\n\nWhy are these places introducing such measures? Do you think this is a positive or negative development?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Note the spread of visitor caps and entry fees; outline that the essay explains the reasons and judges the trend positive if well designed.","Body 1 (Question 1): Reasons — overtourism driven by cheap flights, cruises and social media; environmental erosion; rising rents and loss of local life (Venice); revenue for conservation.","Body 2 (Question 2): Positive — better visitor experience, protection for future generations (Bhutan); counter the fairness concern with discounts for students, locals and off-season travellers.","Conclusion: Restate reasons and the positive verdict, conditional on fair pricing."],"ideas":["Cheap flights, cruise ships and social media concentrate crowds at famous sites","Reefs, trails and monuments suffer physical erosion","Residents face soaring rents and the loss of local shops","Fees generate revenue for conservation and infrastructure","Bhutan's daily fee has protected its landscapes and culture","Discounts can prevent travel becoming a privilege of the wealthy"],"phrases":["the strain of overtourism","irreparably damaged","reinvested in conservation","funnel enormous crowds into","the preserve of the wealthy","sustainable tourism"],"model":"From historic city centres to fragile natural landmarks, a growing number of destinations have begun to cap visitor numbers or impose daily entry fees. This essay will examine the reasons behind these restrictions and argue that, provided they are carefully designed, they represent a positive step.\n\nThe primary motivation is the damage caused by mass tourism, often called overtourism. Cheap flights, cruise ships and social media have funnelled enormous crowds into a small number of famous sites, with consequences that are both environmental and social. Coral reefs, mountain trails and ancient monuments suffer physical erosion, while residents of cities such as Venice complain of soaring rents, overcrowded streets and the replacement of local shops with souvenir stalls. Entry charges and quotas therefore aim to reduce congestion and to generate revenue that can be reinvested in conservation and infrastructure.\n\nIn my view, such measures are largely beneficial. Limiting numbers improves the experience for visitors themselves, who can appreciate a site without battling through crowds, and it helps to safeguard places that might otherwise be irreparably damaged for future generations. Bhutan, which has long charged a substantial daily fee, has preserved both its landscapes and its culture while still earning significant income from tourism. Admittedly, fees risk making travel the preserve of the wealthy, but this concern can be mitigated by offering discounts to students, local residents or off-season travellers.\n\nIn conclusion, destinations are restricting access in response to the environmental and social strain of overtourism. As long as pricing remains fair, these policies are a sensible way to protect treasured places while ensuring that tourism remains sustainable for both visitors and the communities who host them."},{"id":"W2-22","type":"opinion","topic":"Government Spending","prompt":"Some people believe that governments should fund the arts, such as museums, theatres and orchestras, only if these institutions are able to attract large audiences.\n\nTo what extent do you agree or disagree?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Paraphrase the proposal; state partial disagreement — audience size is a poor measure of cultural value.","Body 1: Concession — subsidies come from taxation and should benefit many; popular museums clearly serve the public; linking grants to attendance could improve accessibility.","Body 2: Main argument — many masterpieces were initially unpopular; minority traditions cannot compete commercially; funding by ticket sales would favour safe productions; popular venues need help least.","Conclusion: Institutions should seek wide audiences, but attendance must not be the only criterion for public support."],"ideas":["Public subsidies come from general taxation and should serve many citizens","Attendance-based funding could push institutions to lower prices","Many acclaimed works were ridiculed when first produced","Folk music and classical forms cannot compete with mainstream entertainment","Market-led funding would reduce artistic diversity","The most popular venues are often the least dependent on state support"],"phrases":["public funding for the arts","a poor measure of cultural value","tie grants to audience figures","preserve minority traditions","safe, commercial productions","the cultural landscape"],"model":"Public funding for the arts is frequently questioned, and some argue that subsidies should be reserved for institutions that prove their popularity by attracting large audiences. Although public money must be spent responsibly, I largely disagree with this view, as audience size is a poor measure of cultural value.\n\nThere is, admittedly, some logic to linking funding with attendance. Arts subsidies are drawn from general taxation, so it seems reasonable that they should benefit as many taxpayers as possible. A museum that draws millions of visitors each year clearly serves the public, whereas a niche experimental theatre that plays to half-empty houses may appear to be an indulgence for a small elite. Tying grants to audience figures could also encourage institutions to become more accessible, for example by lowering ticket prices.\n\nHowever, judging the arts by popularity alone would be deeply damaging. Many works now considered masterpieces were initially ignored or even ridiculed; had their creators depended on immediate public approval, they might never have been produced. Furthermore, the institutions most in need of support are often those preserving minority traditions, such as regional folk music or classical forms that require years of training and cannot compete commercially with mainstream entertainment. If funding followed ticket sales alone, the cultural landscape would become dominated by safe, commercial productions, and the very diversity that public subsidy is meant to protect would disappear. Popular venues, moreover, are often those best able to survive without state help.\n\nIn conclusion, while publicly funded arts organisations should strive to reach wide audiences, attendance figures should not be the sole criterion for support. Governments have a responsibility to sustain the artistic quality, innovation and heritage that the market alone would neglect."},{"id":"W2-23","type":"opinion","topic":"Food","prompt":"Some people think that cooking should be a compulsory subject in all secondary schools, with the same status as mathematics and languages.\n\nTo what extent do you agree or disagree?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Note that many school leavers cannot cook; state broad agreement, with the condition that the subject is carefully designed.","Body 1: Arguments for — rising obesity and reliance on processed food; a lifelong daily skill; reinforces numeracy and cultural awareness.","Body 2: Counter-arguments and rebuttal — crowded timetable and exam pressure; 'learn at home' argument; one weekly lesson is enough and many families no longer cook.","Conclusion: Restate support — promotes health and independence without undermining academic achievement."],"ideas":["Ready meals and delivery apps have reduced home cooking","Childhood obesity and diet-related illness are rising","Cooking is a practical skill used every day for life","Measuring ingredients develops numeracy; learning about dishes builds cultural awareness","The timetable is already crowded and focused on exams","Many busy families no longer cook, so home learning is unreliable"],"phrases":["diet-related illness","processed food high in salt, sugar and fat","nutritious meals from fresh ingredients","an overcrowded timetable","practical independence","at the expense of academic achievement"],"model":"As ready meals and food delivery apps become ever more convenient, many young people leave school without the ability to prepare even a simple dish. For this reason, some argue that cooking deserves the same compulsory status as core academic subjects. I largely agree with this proposal, although the subject would need to be designed carefully.\n\nThe strongest argument in favour concerns health. Rates of childhood obesity and diet-related illness have risen sharply in many countries, partly because families rely on processed food high in salt, sugar and fat. Teaching teenagers to cook nutritious meals from fresh ingredients would equip them with a practical skill they will use every day for the rest of their lives, arguably more often than some topics in advanced mathematics. In addition, cookery lessons can reinforce other subjects in a hands-on way: measuring ingredients develops numeracy, while learning about the origins of dishes broadens cultural awareness.\n\nCritics may object that the school timetable is already overcrowded and that teachers face pressure to raise examination results in academic subjects. They might also argue that cooking is a skill best taught at home. These concerns are valid, yet they are not insurmountable. Cooking need not occupy as many hours as mathematics; a single weekly lesson in the first three years of secondary school would be sufficient to establish the basics. Moreover, relying on parents to pass on these skills is unrealistic when many busy families no longer cook regularly themselves, which is precisely why the problem has emerged.\n\nIn conclusion, I believe that cooking should be a compulsory subject, as it promotes lifelong health and practical independence. Provided it is given a modest and well-structured place in the curriculum, it need not come at the expense of academic achievement."},{"id":"W2-24","type":"discussion","topic":"Personal Development","prompt":"Some people believe that individuals grow mainly by facing failure and hardship. Others think that people develop best in a supportive environment where they experience success.\n\nDiscuss both these views and give your own opinion.\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.","plan":["Introduction: Present the two views on how people grow; state that both are needed, but setbacks are most valuable within a supportive environment.","Body 1: View 1 — failure forces reflection, responsibility and resilience (failed exam, entrepreneurs' early collapses); shielding people prevents perseverance.","Body 2: View 2 — repeated unsupported failure erodes confidence; people learn best when secure enough to take risks; success builds motivation and self-belief.","Conclusion: Development depends on a balance of challenge and support; failure teaches only when people are equipped to learn from it."],"ideas":["Failing an exam can prompt reflection on study habits and responsibility","Entrepreneurs often cite early failures as turning points","Overprotection may leave people unprepared for adversity","Repeated failure without guidance can erode self-confidence","Psychological safety encourages people to take risks","Success reinforces motivation and belief in one's abilities"],"phrases":["character is forged through adversity","build resilience","a turning point in one's life","erode self-confidence","feel secure enough to take risks","strike a balance between challenge and support"],"model":"The question of how people grow as individuals has long divided opinion. Some maintain that character is forged through failure and adversity, while others contend that encouragement and success provide the firmest foundation for development. In my view, both are necessary, but setbacks are most valuable when they occur within a supportive environment.\n\nThose who emphasise hardship argue that difficulty teaches lessons that comfort cannot. A student who fails an important examination, for example, is forced to reflect on their study habits, take responsibility and build resilience, qualities that will serve them throughout their career. Many successful entrepreneurs describe early business collapses as the turning points that taught them humility and sharper judgement. From this perspective, shielding people from failure deprives them of the opportunity to develop the perseverance needed to cope with an unpredictable world.\n\nOn the other hand, proponents of a supportive approach point out that repeated failure without guidance can be deeply damaging. Rather than building resilience, it may erode self-confidence and lead people to avoid challenges altogether. Psychological research suggests that individuals learn most effectively when they feel secure enough to take risks, and that experiences of success reinforce motivation and a belief in their own abilities. A child who receives consistent encouragement from parents and teachers is therefore more likely to attempt difficult tasks in the first place, and to persist when those tasks prove harder than expected.\n\nIn conclusion, I believe that personal d
