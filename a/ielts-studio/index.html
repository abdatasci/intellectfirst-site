hereas Eastport reached just 6.8 million, still below its 2000 level.","overview":["Northgate and Lakeside grew strongly, while Eastport slowly declined.","All three airports dropped sharply in 2020 and recovered by 2025, when Northgate was the busiest and Eastport the quietest."],"details":["Eastport was the busiest in 2000 (8.5 million) but had only 6.8 million in 2025.","Northgate overtook Eastport between 2010 and 2015 and reached 10.4 million in 2025.","Lakeside rose from 0.5 to 8.9 million; in 2020 all three fell to between 2.0 and 3.1 million."]},{"id":"W1-12","type":"line","title":"Population aged 65 and over in Japan, Sweden and the USA","prompt":"The line graph below shows the proportion of the population aged 65 and over in Japan, Sweden and the USA between 1940 and 2040. Figures for 2030 and 2040 are projections.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Proportion of the population aged 65 and over, 1940–2040 (2030–2040 projected)","unit":"%","categories":["1940","1950","1960","1970","1980","1990","2000","2010","2020","2030","2040"],"series":[{"name":"Japan","values":[4.8,4.9,5.7,7.1,9.1,12.1,18.6,23,28.6,33.2,37.4]},{"name":"Sweden","values":[8.6,10.2,12,13.7,16.3,17.8,17.3,17.4,19.6,22.3,24.1]},{"name":"USA","values":[6.9,8.1,9.2,9.8,11.3,12.5,12.4,12.9,13.3,16.2,20.4]}]},"overview":["The proportion of older people increased in all three countries over the period and is projected to keep rising until 2040.","Japan began with the lowest proportion but saw by far the most dramatic growth, overtaking both Sweden and the USA in 2000 to take a clear lead."],"details":["In 1940, Sweden had the highest proportion of people aged 65 and over (8.6%), ahead of the USA (6.9%) and Japan (4.8%).","Japan's figure rose from 12.1% in 1990 to 18.6% in 2000, overtaking Sweden (17.3%) and the USA (12.4%), and reached 28.6% in 2020.","By 2040, the proportion is projected to reach 37.4% in Japan, compared with 24.1% in Sweden and 20.4% in the USA."],"features":["The proportion of older people increased in all three countries over the period and is projected to keep rising until 2040.","Japan began with the lowest proportion but saw by far the most dramatic growth, overtaking both Sweden and the USA in 2000 to take a clear lead.","In 1940, Sweden had the highest proportion of people aged 65 and over (8.6%), ahead of the USA (6.9%) and Japan (4.8%).","Japan's figure rose from 12.1% in 1990 to 18.6% in 2000, overtaking Sweden (17.3%) and the USA (12.4%), and reached 28.6% in 2020.","By 2040, the proportion is projected to reach 37.4% in Japan, compared with 24.1% in Sweden and 20.4% in the USA."],"model":"The line graph illustrates the percentage of people aged 65 or older in Japan, Sweden and the USA from 1940 to 2040, with the figures for 2030 and 2040 being projections.\n\nOverall, the share of elderly people grew in all three nations and is expected to continue rising. The most striking change was in Japan, which had the smallest proportion in 1940 but overtook both other countries in 2000 and is forecast to remain far ahead by 2040.\n\nIn 1940, Sweden had the highest proportion of over-65s, at 8.6%, compared with 6.9% in the USA and 4.8% in Japan. Sweden's figure climbed steadily to 17.8% in 1990 and then levelled off, standing at 17.4% in 2010. The American figure followed a similar but lower path, rising to 12.5% in 1990 and remaining almost unchanged until 2010.\n\nJapan, by contrast, saw only slow growth until 1970, when the figure was 7.1%, after which it rose sharply, reaching 18.6% in 2000 and 28.6% in 2020. It is projected to hit 37.4% by 2040, well above the forecasts of 24.1% for Sweden and 20.4% for the USA."},{"id":"W1-13","type":"pie","title":"Household spending in 1995 and 2025","prompt":"The pie charts below show how the average household in one country divided its spending between seven categories in 1995 and 2025.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"pies":[{"title":"1995","slices":[{"label":"Food","value":31},{"label":"Housing","value":22},{"label":"Transport","value":14},{"label":"Clothing","value":11},{"label":"Leisure","value":8},{"label":"Health","value":5},{"label":"Other","value":9}]},{"title":"2025","slices":[{"label":"Food","value":17},{"label":"Housing","value":34},{"label":"Transport","value":15},{"label":"Clothing","value":5},{"label":"Leisure","value":12},{"label":"Health","value":9},{"label":"Other","value":8}]}],"title":"Household spending by category, 1995 and 2025 (%)"},"features":["Food and housing swapped places: food was the largest expense in 1995, housing in 2025.","Leisure and health grew, clothing shrank, and transport and other spending hardly changed.","Food: 31% → 17%; housing: 22% → 34%.","Clothing: 11% → 5%.","Leisure: 8% → 12%; health: 5% → 9%."],"model":"The two pie charts compare the proportion of household expenditure devoted to seven categories in one country in 1995 and 2025.\n\nOverall, the most striking change was the reversal in the positions of food and housing: food was the largest expense in 1995, but by 2025 housing had become dominant. Spending on leisure and health also grew, whereas clothing became a much smaller item.\n\nIn 1995, food accounted for almost a third of household budgets (31%), followed by housing at 22%. Thirty years later, the share spent on food had almost halved to 17%, while housing costs had risen sharply to 34%, more than one third of all spending. Clothing also declined considerably, from 11% to only 5%.\n\nMeanwhile, households allocated a greater share of their income to leisure, which rose from 8% to 12%, and to health, which almost doubled from 5% to 9%. By contrast, the remaining categories changed very little. Transport represented 14% of spending in 1995 and 15% in 2025, and the proportion classified as other expenses edged down slightly from 9% to 8%, making these the most stable elements of household spending.","overview":["Food and housing swapped places: food was the largest expense in 1995, housing in 2025.","Leisure and health grew, clothing shrank, and transport and other spending hardly changed."],"details":["Food: 31% → 17%; housing: 22% → 34%.","Clothing: 11% → 5%.","Leisure: 8% → 12%; health: 5% → 9%."]},{"id":"W1-14","type":"table","title":"Cinema admissions in five countries","prompt":"The table below shows the number of cinema admissions in five countries in 2005, 2015 and 2025.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Cinema admissions, 2005–2025","unit":"millions","columns":["Country","2005","2015","2025"],"rows":[["Mexico",165,285,240],["South Korea",143,217,125],["Germany",127,139,88],["Australia",82,90,61],["Turkey",35,60,52]]},"features":["In all five countries, admissions rose from 2005 to 2015 and then fell by 2025.","Mexico had the most admissions and Turkey the fewest in every year.","Mexico: 165 → 285 → 240 million.","South Korea had the biggest fall, from 217 to 125 million, ending below its 2005 level.","Only Mexico and Turkey (35 → 52 million) ended above their 2005 figures."],"model":"The table presents data on the number of cinema tickets sold, in millions, in five countries in 2005, 2015 and 2025.\n\nOverall, all five countries followed the same pattern, with admissions rising during the first decade and then falling during the second. Mexico had the largest cinema audience throughout, while Turkey had the smallest. By 2025, only Mexico and Turkey remained above their original levels.\n\nBetween 2005 and 2015, Mexico's admissions grew considerably from 165 million to 285 million, and South Korea experienced a similar rise, from 143 million to 217 million. Turkey's figure also increased markedly, from 35 million to 60 million. Growth in Germany and Australia was more modest, at 12 million and eight million respectively.\n\nThe following decade saw declines everywhere. South Korea suffered the steepest fall, with admissions dropping to 125 million, lower than in 2005. Germany and Australia also ended below their starting points, at 88 million and 61 million. Mexico's figure fell to 240 million, yet this was still well above its 2005 total, and Turkey's decline was relatively slight, leaving admissions at 52 million, almost 50% higher than twenty years earlier.","overview":["In all five countries, admissions rose from 2005 to 2015 and then fell by 2025.","Mexico had the most admissions and Turkey the fewest in every year."],"details":["Mexico: 165 → 285 → 240 million.","South Korea had the biggest fall, from 217 to 125 million, ending below its 2005 level.","Only Mexico and Turkey (35 → 52 million) ended above their 2005 figures."]},{"id":"W1-15","type":"table","title":"Five national parks compared","prompt":"The table below gives information about five national parks in one country, including their size, number of visitors, length of hiking trails and forest cover.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Key facts about five national parks","unit":"","columns":["Park","Area (km²)","Visitors per year (thousands)","Hiking trails (km)","Forest cover (%)"],"rows":[["Highmoor",1240,860,410,35],["Silver Lakes",620,1950,280,58],["Redcliff Coast",310,2400,95,12],["Pinewood Valley",2050,540,620,81],["Granite Peaks",1780,1120,530,22]]},"features":["Smaller parks generally attracted more visitors than larger ones.","Larger parks generally had longer trails.","Redcliff Coast was the smallest park (310 km²) but the most visited (2.4 million).","Pinewood Valley was the largest (2,050 km²), the most forested (81%) and the least visited (540,000).","Trails ranged from 95 km (Redcliff Coast) to 620 km (Pinewood Valley)."],"model":"The table compares five national parks in one country in terms of their area, annual visitor numbers, total length of hiking trails and the percentage of land covered by forest.\n\nOverall, there appears to be an inverse relationship between size and popularity, with the smaller parks attracting more visitors. Pinewood Valley stands out as the largest and most heavily forested park, yet it was the least visited, whereas the opposite was true of Redcliff Coast.\n\nRedcliff Coast covered only 310 square kilometres, but it received 2.4 million visitors annually, more than any other park. Silver Lakes, at 620 square kilometres, was the second most popular, with 1.95 million visitors. By contrast, Pinewood Valley, the largest park at 2,050 square kilometres, attracted just 540,000 people, while Highmoor and Granite Peaks received 860,000 and 1.12 million respectively.\n\nTrail length broadly reflected park size. Pinewood Valley offered the most extensive network, at 620 kilometres, followed by Granite Peaks (530 km), whereas Redcliff Coast had only 95 kilometres. Forest cover varied widely, from a high of 81% in Pinewood Valley and 58% in Silver Lakes to just 22% in rocky Granite Peaks and a mere 12% in Redcliff Coast.","overview":["Smaller parks generally attracted more visitors than larger ones.","Larger parks generally had longer trails."],"details":["Redcliff Coast was the smallest park (310 km²) but the most visited (2.4 million).","Pinewood Valley was the largest (2,050 km²), the most forested (81%) and the least visited (540,000).","Trails ranged from 95 km (Redcliff Coast) to 620 km (Pinewood Valley)."]},{"id":"W1-16","type":"process","title":"How olive oil is produced","prompt":"The diagram below shows the stages in the production of olive oil.\n\nSummarise the information by selecting and reporting the main features.\n\nWrite at least 150 words.","chart":{"title":"The production of olive oil","steps":["Olives are harvested in autumn by shaking the trees so the fruit falls onto nets","The olives are transported to the mill within 24 hours","Leaves and twigs are removed and the olives are washed","The whole olives, including stones, are crushed into a paste","The paste is slowly mixed for 30–45 minutes","A centrifuge separates the oil from water and solid waste (pomace)",{"t":"The pomace (solid waste) is collected for use as fuel or fertiliser","side":true},"The oil is left to settle in steel tanks for several weeks","The oil is filtered and bottled in dark glass","The bottles are labelled and distributed to shops"]},"features":["The process is linear, from harvesting the olives to distributing the bottled oil.","It has three main stages: preparing the olives, extracting the oil, and storing, bottling and distributing it. One by-product is reused.","Olives are harvested in autumn and reach the mill within 24 hours.","They are crushed whole into a paste, mixed for 30–45 minutes and separated in a centrifuge.","The pomace becomes fuel or fertiliser; the oil settles for several weeks before filtering and bottling."],"model":"The diagram illustrates the various stages involved in producing olive oil, from the harvesting of the fruit to the delivery of the finished product to shops.\n\nOverall, the process is linear and can be grouped into three main phases: the collection and preparation of the olives, the extraction of the oil, and finally its storage, bottling and distribution. A by-product is also generated and reused.\n\nThe process begins in autumn, when the olives are harvested by shaking the trees so that the fruit drops onto nets. Within 24 hours, the olives are taken to a mill, where leaves and twigs are removed and the fruit is washed. The whole olives, including their stones, are then crushed into a paste, which is slowly mixed for between 30 and 45 minutes.\n\nNext, the paste is placed in a centrifuge, which separates the oil from water and solid waste known as pomace. This pomace is collected and used as fuel or fertiliser. Meanwhile, the oil is left to settle in steel tanks for several weeks before being filtered and bottled in dark glass. Finally, the bottles are labelled and distributed to shops.","overview":["The process is linear, from harvesting the olives to distributing the bottled oil, with nine main stages.","It has three main stages: preparing the olives, extracting the oil, and storing, bottling and distributing it. One by-product is reused."],"details":["Olives are harvested in autumn and reach the mill within 24 hours.","They are crushed whole into a paste, mixed for 30–45 minutes and separated in a centrifuge.","The pomace becomes fuel or fertiliser; the oil settles for several weeks before filtering and bottling."]},{"id":"W1-17","type":"line","title":"Household ownership of electronic devices, 1995–2015","prompt":"The line graph below shows the percentage of households in one country that owned a desktop computer, a laptop, a tablet and a smartphone between 1995 and 2015.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Households owning electronic devices, 1995–2015","unit":"% of households","categories":["1995","2000","2005","2010","2015"],"series":[{"name":"Desktop computer","values":[28,47,61,55,39]},{"name":"Laptop","values":[3,9,26,52,64]},{"name":"Tablet","values":[0,0,0,14,48]},{"name":"Smartphone","values":[0,0,7,46,81]}]},"overview":["Ownership of laptops, tablets and smartphones grew rapidly, whereas desktop computers became more popular at first but then declined.","By 2015, smartphones had become the most widely owned device and desktop computers had fallen to last place."],"details":["Desktop ownership rose from 28% in 1995 to a peak of 61% in 2005, then fell to 39% in 2015.","Laptop ownership grew in every period, from 3% in 1995 to 64% in 2015, overtaking desktops (39%) in the final year.","Smartphone ownership rose from 7% in 2005 to 81% in 2015, while tablet ownership went from 14% in 2010 to 48% in 2015."],"features":["Ownership of laptops, tablets and smartphones grew rapidly, whereas desktop computers became more popular at first but then declined.","By 2015, smartphones had become the most widely owned device and desktop computers had fallen to last place.","Desktop ownership rose from 28% in 1995 to a peak of 61% in 2005, then fell to 39% in 2015.","Laptop ownership grew in every period, from 3% in 1995 to 64% in 2015, overtaking desktops (39%) in the final year.","Smartphone ownership rose from 7% in 2005 to 81% in 2015, while tablet ownership went from 14% in 2010 to 48% in 2015."],"model":"The line graph illustrates the proportion of households in one country that owned a desktop computer, a laptop, a tablet or a smartphone over the twenty years from 1995 to 2015.\n\nOverall, ownership of the three portable devices grew rapidly, while desktop computers rose in popularity before declining. By 2015, smartphones had become the most widely owned device, and desktops had dropped to last place.\n\nIn 1995, desktops were by far the most common device, owned by 28% of households, compared with only 3% for laptops. Desktop ownership rose to a peak of 61% in 2005 but then fell to 55% in 2010 and 39% in 2015. Laptops, meanwhile, increased steadily throughout the period, overtaking desktops in 2015 with a figure of 64%.\n\nNeither smartphones nor tablets were owned by any households in 1995 or 2000. Smartphones were first recorded in 2005 at 7%, after which ownership surged to 46% in 2010 and 81% in 2015. Tablets first appeared in 2010, owned by 14% of households, and this figure more than tripled to 48% five years later."},{"id":"W1-18","type":"bar","title":"Frequency of eating at fast-food restaurants in the USA","prompt":"The bar chart below shows how often people in the USA ate at fast-food restaurants in 2003, 2008 and 2013.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"How often people in the USA ate at fast-food restaurants","unit":"% of people","categories":["Every day","Several times a week","Once a week","Once or twice a month","Every few months","Never"],"series":[{"name":"2003","values":[3,16,21,32,18,10]},{"name":"2008","values":[2,13,22,33,19,11]},{"name":"2013","values":[1,11,26,30,20,12]}]},"overview":["Eating at fast-food restaurants once or twice a month was the most common pattern in all three years, while eating there every day was the least common.","Over the period, the proportion eating fast food several times a week declined, whereas the shares eating it once a week and never eating it both increased."],"details":["Once or twice a month was the most common frequency in each year: 32% in 2003, 33% in 2008 and 30% in 2013.","Eating fast food once a week rose from 21% in 2003 to 22% in 2008 and 26% in 2013, while several times a week fell from 16% to 13% and then 11%.","Daily consumption was the least common, falling from 3% to 2% and then 1%, while the share who never ate fast food rose from 10% to 11% and 12%."],"features":["Eating at fast-food restaurants once or twice a month was the most common pattern in all three years, while eating there every day was the least common.","Over the period, the proportion eating fast food several times a week declined, whereas the shares eating it once a week and never eating it both increased.","Once or twice a month was the most common frequency in each year: 32% in 2003, 33% in 2008 and 30% in 2013.","Eating fast food once a week rose from 21% in 2003 to 22% in 2008 and 26% in 2013, while several times a week fell from 16% to 13% and then 11%.","Daily consumption was the least common, falling from 3% to 2% and then 1%, while the share who never ate fast food rose from 10% to 11% and 12%."],"model":"The bar chart compares how frequently people in the USA ate at fast-food restaurants in 2003, 2008 and 2013.\n\nOverall, visiting fast-food restaurants once or twice a month was the most common habit in all three years, while eating there daily was the least common. Over the decade, the share of people eating fast food several times a week declined, whereas weekly visits and the proportion who never ate fast food both increased.\n\nEating fast food once or twice a month accounted for 32% of people in 2003, rising slightly to 33% in 2008 before falling to 30% in 2013. The second most common answer in each year was once a week, which grew from 21% to 22% and then to 26%. By contrast, the proportion eating fast food several times a week fell from 16% to 13% and then to 11%.\n\nDaily consumption was rare, at just 3% in 2003 and only 1% by 2013. Meanwhile, the proportion of people who ate fast food every few months rose gradually from 18% to 20%, and the share who never did so increased from 10% to 12%."},{"id":"W1-19","type":"line","title":"Crime in a city centre, 2003–2012","prompt":"The line graph below shows the number of cases of three types of crime (burglary, car theft and robbery) in a city centre between 2003 and 2012.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Recorded crimes in a city centre, 2003–2012","unit":"Number of cases","categories":["2003","2004","2005","2006","2007","2008","2009","2010","2011","2012"],"series":[{"name":"Burglary","values":[3200,3450,3600,3380,3100,2850,2700,2520,2480,2300]},{"name":"Car theft","values":[2100,2350,2600,2900,3250,3500,3410,3150,2800,2650]},{"name":"Robbery","values":[450,520,610,700,820,960,1150,1300,1420,1560]}]},"overview":["Burglary and car theft were far more common than robbery throughout the period, but both rose and then fell, with car theft overtaking burglary in 2007.","Robbery, in contrast, increased every year, although it remained the least common of the three crimes."],"details":["Burglary rose from 3,200 cases in 2003 to a peak of 3,600 in 2005, then fell every year to 2,300 in 2012.","Car theft increased from 2,100 cases in 2003 to a peak of 3,500 in 2008, having overtaken burglary in 2007 (3,250 against 3,100), before dropping to 2,650 in 2012.","Robbery increased every year, from 450 cases in 2003 to 1,560 in 2012, but remained the least common crime throughout."],"features":["Burglary and car theft were far more common than robbery throughout the period, but both rose and then fell, with car theft overtaking burglary in 2007.","Robbery, in contrast, increased every year, although it remained the least common of the three crimes.","Burglary rose from 3,200 cases in 2003 to a peak of 3,600 in 2005, then fell every year to 2,300 in 2012.","Car theft increased from 2,100 cases in 2003 to a peak of 3,500 in 2008, having overtaken burglary in 2007 (3,250 against 3,100), before dropping to 2,650 in 2012.","Robbery increased every year, from 450 cases in 2003 to 1,560 in 2012, but remained the least common crime throughout."],"model":"The line graph shows the number of burglaries, car thefts and robberies recorded in a city centre each year between 2003 and 2012.\n\nOverall, burglary and car theft were far more common than robbery throughout the period, but both rose and then declined, with car theft overtaking burglary in 2007. Robbery, in contrast, increased every year.\n\nBurglary was the most frequent offence at the start of the period, with 3,200 cases in 2003, and it peaked at 3,600 in 2005. After that, the figure fell every year, reaching 2,300 in 2012. Car theft, which stood at 2,100 cases in 2003, rose steadily to a high of 3,500 in 2008, having overtaken burglary in 2007, when there were 3,250 car thefts compared with 3,100 burglaries. It then fell back to 2,650 by the end of the period.\n\nRobbery was much less common, with only 450 cases in 2003. However, the number grew every year, more than tripling to 1,560 by 2012. Despite this rise, robbery remained the least frequent of the three crimes in every year."},{"id":"W1-20","type":"process","title":"How instant noodles are manufactured","prompt":"The diagram below shows how instant noodles are manufactured.\n\nSummarise the information by selecting and reporting the main features.\n\nWrite at least 150 words.","chart":{"title":"The manufacture of instant noodles","steps":["Wheat flour is delivered and stored in silos","Flour is mixed with water and oil to make dough","Dough is rolled into thin sheets","Sheets are cut into strips of noodles","Noodles are steamed","Noodles are moulded into round blocks","Blocks are fried in oil","Blocks are cooled and dried","Cups are filled with noodles, flavourings and dried vegetables","Cups are sealed, labelled and packed"]},"overview":["The manufacture of instant noodles is a linear process of ten stages, beginning with the storage of wheat flour and ending with the sealing, labelling and packing of cups.","The noodles are cooked twice, first by steaming and then by frying, before they are cooled, dried and packaged."],"details":["At the start, wheat flour is delivered and stored in silos, and is then mixed with water and oil to make dough.","The dough is rolled into thin sheets and cut into strips, and the noodles are steamed, moulded into round blocks and fried in oil.","Finally, the blocks are cooled and dried, placed in cups with flavourings and dried vegetables, and the cups are sealed, labelled and packed."],"features":["The manufacture of instant noodles is a linear process of ten stages, beginning with the storage of wheat flour and ending with the sealing, labelling and packing of cups.","The noodles are cooked twice, first by steaming and then by frying, before they are cooled, dried and packaged.","At the start, wheat flour is delivered and stored in silos, and is then mixed with water and oil to make dough.","The dough is rolled into thin sheets and cut into strips, and the noodles are steamed, moulded into round blocks and fried in oil.","Finally, the blocks are cooled and dried, placed in cups with flavourings and dried vegetables, and the cups are sealed, labelled and packed."],"model":"The diagram illustrates the sequence of stages by which instant noodles are manufactured and packaged.\n\nOverall, the process is linear and consists of ten stages, beginning with the storage of wheat flour and ending with sealed, labelled cups ready to be packed. The noodles are cooked twice, first by steaming and then by frying, before being packaged.\n\nIn the first stage, wheat flour is delivered and stored in silos. The flour is then mixed with water and oil to make dough, which is rolled into thin sheets. These sheets are subsequently cut into strips to form noodles. At the next stage, the noodles are steamed, and once this has been completed, they are moulded into round blocks.\n\nOnce moulded, the blocks of noodles are fried in oil, after which they are cooled and dried. In the penultimate stage, cups are filled with the noodle blocks, and flavourings and dried vegetables are also placed inside them. Finally, the cups are sealed and labelled, and the finished products are packed, completing the manufacturing process."},{"id":"W1-21","type":"bar","title":"Holiday accommodation chosen by British holidaymakers, 2013","prompt":"The bar chart below shows the types of holiday accommodation chosen by British holidaymakers of different age groups in 2013.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Holiday accommodation chosen by British holidaymakers by age group, 2013","unit":"% of age group","categories":["Hotel","Self-catering","Camping/caravan","Staying with friends/family","Hostel"],"series":[{"name":"16–34","values":[30,18,18,22,12]},{"name":"35–54","values":[38,27,17,14,4]},{"name":"55 and over","values":[46,21,9,22,2]}]},"overview":["Hotels were the most popular type of accommodation in every age group, and their popularity increased with age.","Hostels were the least popular option in every age group, and their share fell as age increased."],"details":["Hotels were chosen by 30% of 16–34-year-olds, 38% of the 35–54 group and 46% of those aged 55 and over.","Hostels were the least popular choice in every group, falling from 12% among 16–34-year-olds to 4% for the 35–54 group and 2% for those aged 55 and over.","Staying with friends or family was chosen by 22% of both the youngest and oldest groups but only 14% of the 35–54 group, while camping or caravanning accounted for 18%, 17% and 9% respectively."],"features":["Hotels were the most popular type of accommodation in every age group, and their popularity increased with age.","Hostels were the least popular option in every age group, and their share fell as age increased.","Hotels were chosen by 30% of 16–34-year-olds, 38% of the 35–54 group and 46% of those aged 55 and over.","Hostels were the least popular choice in every group, falling from 12% among 16–34-year-olds to 4% for the 35–54 group and 2% for those aged 55 and over.","Staying with friends or family was chosen by 22% of both the youngest and oldest groups but only 14% of the 35–54 group, while camping or caravanning accounted for 18%, 17% and 9% respectively."],"model":"The bar chart compares the types of holiday accommodation chosen by British holidaymakers in three different age groups in 2013.\n\nOverall, hotels were the most popular choice for all age groups, and their popularity rose with age. Hostels, by contrast, were the least popular option in every group, and their share declined as age increased.\n\nHotels accounted for 30% of holidaymakers aged 16–34, rising to 38% for the 35–54 group and 46% for people aged 55 and over. Self-catering accommodation was most common among the middle age group, at 27%, compared with 18% of the youngest group and 21% of the oldest.\n\nStaying with friends or family was equally popular among the youngest and oldest groups, at 22% each, but only 14% of 35–54-year-olds chose this option. Camping and caravanning attracted 18% of young holidaymakers and 17% of the middle group, but just 9% of those aged 55 and over. Hostels were chosen by 12% of the youngest group, but this fell to 4% and 2% for the two older groups."},{"id":"W1-22","type":"pie","title":"Household expenditure in Japan and Malaysia, 2010","prompt":"The pie charts below show average household expenditure in Japan and Malaysia in the year 2010.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Average household expenditure, 2010 (%)","pies":[{"title":"Japan","slices":[{"label":"Housing","value":26},{"label":"Food","value":24},{"label":"Transport","value":13},{"label":"Healthcare","value":5},{"label":"Other goods and services","value":32}]},{"title":"Malaysia","slices":[{"label":"Housing","value":22},{"label":"Food","value":35},{"label":"Transport","value":15},{"label":"Healthcare","value":3},{"label":"Other goods and services","value":25}]}]},"overview":["Japanese households spent the largest share of their budget on other goods and services, whereas food was the biggest expense in Malaysia.","In both countries, healthcare accounted for the smallest proportion of spending."],"details":["In Japan, other goods and services took the largest share (32%), followed by housing (26%), food (24%), transport (13%) and healthcare (5%).","In Malaysia, food was the largest category at 35%, ahead of other goods and services (25%), housing (22%), transport (15%) and healthcare (3%).","Food accounted for 35% of spending in Malaysia compared with 24% in Japan, while healthcare took 5% in Japan and only 3% in Malaysia."],"features":["Japanese households spent the largest share of their budget on other goods and services, whereas food was the biggest expense in Malaysia.","In both countries, healthcare accounted for the smallest proportion of spending.","In Japan, other goods and services took the largest share (32%), followed by housing (26%), food (24%), transport (13%) and healthcare (5%).","In Malaysia, food was the largest category at 35%, ahead of other goods and services (25%), housing (22%), transport (15%) and healthcare (3%).","Food accounted for 35% of spending in Malaysia compared with 24% in Japan, while healthcare took 5% in Japan and only 3% in Malaysia."],"model":"The pie charts compare how the average household budget was divided among five categories of spending in Japan and Malaysia in 2010, with each chart showing the percentage allocated to each category.\n\nOverall, Japanese households spent the largest share of their budget on other goods and services, whereas food was the biggest expense in Malaysia. In both countries, healthcare accounted for the smallest proportion of spending.\n\nIn Japan, other goods and services made up 32% of household expenditure, followed by housing at 26% and food at 24%. Japanese households therefore devoted a slightly larger share to housing than to food. Transport represented 13% of the total, while healthcare accounted for just 5%.\n\nIn Malaysia, food was the dominant category at 35%, considerably more than the 24% recorded in Japan. Other goods and services took 25% of spending and housing 22%, both lower than the corresponding Japanese figures. Malaysian households spent slightly more on transport than their Japanese counterparts, at 15%, but only 3% of their budget went on healthcare, making it the smallest category in Malaysia as well as in Japan."},{"id":"W1-23","type":"table","title":"Europeans living in other European countries, 2011","prompt":"The table below shows the number of people (in thousands) from five European countries who were living in each of the other four countries in 2011.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Nationals of five European countries living in each of the others, 2011 (thousands)","unit":"thousands","columns":["Nationality","in the UK","in France","in Germany","in Spain","in Italy"],"rows":[["British","—",172,115,381,64],["French",136,"—",88,74,39],["German",118,95,"—",142,53],["Spanish",82,61,104,"—",27],["Italian",145,210,186,49,"—"]]},"overview":["British people living in Spain formed by far the largest group shown in the table.","Italy attracted fewer residents from each of the other four nationalities than any other destination."],"details":["381,000 British people lived in Spain, compared with 172,000 in France, 115,000 in Germany and 64,000 in Italy.","Italians abroad numbered 210,000 in France, 186,000 in Germany and 145,000 in the UK, but only 49,000 in Spain.","The UK was home to 136,000 French people, Spain to 142,000 Germans and Germany to 104,000 Spaniards, while the smallest figure was 27,000 Spaniards in Italy."],"features":["British people living in Spain formed by far the largest group shown in the table.","Italy attracted fewer residents from each of the other four nationalities than any other destination.","381,000 British people lived in Spain, compared with 172,000 in France, 115,000 in Germany and 64,000 in Italy.","Italians abroad numbered 210,000 in France, 186,000 in Germany and 145,000 in the UK, but only 49,000 in Spain.","The UK was home to 136,000 French people, Spain to 142,000 Germans and Germany to 104,000 Spaniards, while the smallest figure was 27,000 Spaniards in Italy."],"model":"The table compares the number of people, in thousands, from five European countries (the UK, France, Germany, Spain and Italy) who were living in each of the other four countries in 2011.\n\nOverall, British people living in Spain made up by far the largest group shown in the table. It is also clear that Italy attracted fewer residents from each of the other four nationalities than any other destination.\n\nLooking first at British nationals, 381,000 lived in Spain, more than twice the figure for France, at 172,000. By contrast, 115,000 Britons resided in Germany and just 64,000 in Italy. Italians also had large communities abroad, with 210,000 living in France, 186,000 in Germany and 145,000 in the UK, although only 49,000 had settled in Spain.\n\nAs for the remaining nationalities, the UK was the most popular destination for the French, with 136,000 residents, while Spain was home to the largest number of Germans, at 142,000. Spanish citizens most commonly lived in Germany, which hosted 104,000 of them, whereas the smallest figure in the table was the 27,000 Spaniards living in Italy."},{"id":"W1-24","type":"process","title":"Recycling plastic bottles","prompt":"The diagram below shows the process of recycling plastic bottles.\n\nSummarise the information by selecting and reporting the main features.\n\nWrite at least 150 words.","chart":{"title":"The plastic bottle recycling process","steps":["Consumers buy drinks in plastic bottles","Empty bottles are placed in recycling bins","Bottles are collected by lorry and taken to a recycling plant","Bottles are sorted by type and colour","Bottles are washed to remove labels and dirt","Bottles are shredded into small flakes","Flakes are melted and formed into pellets","Pellets are transported to manufacturers","Pellets are made into new products such as bottles, clothing and garden furniture","New products are sold in shops and bought by consumers"],"cycle":true},"overview":["The process is a continuous cycle, beginning with the purchase of drinks in plastic bottles and ending with new plastic products being bought by consumers.","It can be divided into a collection and sorting phase, followed by industrial processing and the manufacture of new goods."],"details":["After use, empty bottles are placed in recycling bins, collected by lorry and taken to a recycling plant, where they are sorted by type and colour.","The bottles are washed to remove labels and dirt, shredded into small flakes, and the flakes are then melted and formed into pellets.","The pellets are transported to manufacturers and made into new products such as bottles, clothing and garden furniture, which are sold in shops and bought by consumers."],"features":["The process is a continuous cycle, beginning with the purchase of drinks in plastic bottles and ending with new plastic products being bought by consumers.","It can be divided into a collection and sorting phase, followed by industrial processing and the manufacture of new goods.","After use, empty bottles are placed in recycling bins, collected by lorry and taken to a recycling plant, where they are sorted by type and colour.","The bottles are washed to remove labels and dirt, shredded into small flakes, and the flakes are then melted and formed into pellets.","The pellets are transported to manufacturers and made into new products such as bottles, clothing and garden furniture, which are sold in shops and bought by consumers."],"model":"The diagram illustrates how plastic bottles are recycled and turned into new products, which are then bought by consumers again.\n\nOverall, the process is cyclical and consists of ten stages, beginning with the purchase of drinks in plastic bottles and ending with the sale of new plastic goods. It can be divided into a collection and sorting phase, followed by industrial processing and manufacturing.\n\nAt the start of the cycle, consumers buy drinks in plastic bottles and, once these have been used, place the empty containers in recycling bins. The bottles are then collected by lorry and taken to a recycling plant, where they are sorted according to type and colour. Next, they are washed to remove labels and dirt.\n\nFollowing this, the clean bottles are shredded into small flakes, which are melted down and formed into pellets. These pellets are transported to manufacturers and used to make a range of new products, such as bottles, clothing and garden furniture. Finally, these goods are sold in shops and purchased by consumers, at which point the cycle begins again."},{"id":"W1-25","type":"line","title":"Smoking rates in Someland, 1960–2000","prompt":"The graph below shows the percentage of men and women who smoked in Someland between 1960 and 2000.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Smoking rates among men and women in Someland, 1960–2000 (%)","unit":"%","categories":["1960","1965","1970","1975","1980","1985","1990","1995","2000"],"series":[{"name":"Men","values":[60,58,55,50,44,38,32,27,24]},{"name":"Women","values":[8,12,17,22,26,29,28,25,23]}]},"overview":["The proportion of male smokers fell steadily throughout the period, whereas the rate among women rose until 1985 and then declined.","Men smoked at a higher rate than women in every year shown, but the gap between the sexes had almost disappeared by 2000."],"details":["In 1960, 60% of men smoked, compared with just 8% of women.","The male rate fell to 55% in 1970, 38% in 1985 and 24% in 2000.","The female rate rose from 8% in 1960 to a peak of 29% in 1985, before falling to 25% in 1995 and 23% in 2000."],"features":["The proportion of male smokers fell steadily throughout the period, whereas the rate among women rose until 1985 and then declined.","Men smoked at a higher rate than women in every year shown, but the gap between the sexes had almost disappeared by 2000.","In 1960, 60% of men smoked, compared with just 8% of women.","The male rate fell to 55% in 1970, 38% in 1985 and 24% in 2000.","The female rate rose from 8% in 1960 to a peak of 29% in 1985, before falling to 25% in 1995 and 23% in 2000."],"model":"The line graph shows the percentage of men and women who smoked in Someland between 1960 and 2000, at five-year intervals.\n\nOverall, the proportion of male smokers fell steadily throughout the period, whereas the rate among women rose until 1985 before declining. Although men smoked more than women in every year shown, the gap between the sexes had almost disappeared by 2000.\n\nIn 1960, 60% of men in Someland were smokers, compared with just 8% of women. The male figure dropped gradually to 55% in 1970, after which the decline accelerated, with the rate falling to 38% in 1985. By 2000, only 24% of men smoked, less than half the 1960 level.\n\nFemale smoking, by contrast, followed a very different pattern. The rate rose consistently from 8% in 1960 to 22% in 1975 and reached a peak of 29% in 1985. After this, it began to decrease, falling to 25% in 1995 and 23% in 2000. As a result, the difference between the sexes narrowed from 52 percentage points at the start of the period to just one point at the end."},{"id":"W1-26","type":"table","title":"Internet use by purpose and age group","prompt":"The table below shows the percentage of internet users in six age groups who used the internet for six different purposes.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Percentage of internet users in each age group using the internet for six purposes","unit":"%","columns":["Age group","Email","Social media","Online banking","Online shopping","News","Video streaming"],"rows":[["16–24",78,94,41,63,48,91],["25–34",86,88,72,79,61,84],["35–44",89,76,74,75,66,70],["45–54",90,62,68,66,69,55],["55–64",88,49,59,54,71,38],["65+",84,33,42,37,73,21]]},"overview":["Social media and video streaming were far more popular among younger users, while reading the news online became more common with age.","Email was widely used by every age group and was the most common purpose for all except the two youngest groups."],"details":["Social media use fell from 94% of 16–24-year-olds to 33% of those aged 65+, and video streaming fell from 91% to 21%.","The percentage reading the news online rose from 48% of the youngest group to 73% of the oldest.","Email use peaked at 90% among 45–54-year-olds, online shopping peaked at 79% among 25–34-year-olds, and online banking peaked at 74% among 35–44-year-olds."],"features":["Social media and video streaming were far more popular among younger users, while reading the news online became more common with age.","Email was widely used by every age group and was the most common purpose for all except the two youngest groups.","Social media use fell from 94% of 16–24-year-olds to 33% of those aged 65+, and video streaming fell from 91% to 21%.","The percentage reading the news online rose from 48% of the youngest group to 73% of the oldest.","Email use peaked at 90% among 45–54-year-olds, online shopping peaked at 79% among 25–34-year-olds, and online banking peaked at 74% among 35–44-year-olds."],"model":"The table shows the proportion of internet users in six age groups who went online for six different purposes, ranging from email and social media to news and video streaming.\n\nOverall, social media and video streaming were far more popular among younger users, while reading the news online became more common with age. Email, meanwhile, was widely used by every age group and was the most common activity for all but the two youngest groups.\n\nSocial media use was highest among 16–24-year-olds, at 94%, and fell in each successive age group to just 33% of those aged 65 and over. Video streaming followed the same pattern, dropping from 91% to 21%. By contrast, the percentage of people who read the news online rose steadily with age, from 48% of the youngest users to 73% of the oldest.\n\nEmail was used by at least 78% of every group, peaking at 90% among 45–54-year-olds. Online shopping was most popular with those aged 25–34, at 79%, while online banking peaked slightly later, at 74% among 35–44-year-olds. Banking was least common at both ends of the age range, used by only 41% of 16–24-year-olds and 42% of those aged 65 and over."},{"id":"W1-27","type":"bar","title":"Museum visitors by type, 1997–2012","prompt":"The chart below shows the number of three types of visitor to a museum in 1997, 2002, 2007 and 2012.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Visitors to a museum by type, 1997–2012 (thousands)","unit":"thousands","categories":["1997","2002","2007","2012"],"series":[{"name":"Local residents","values":[120,115,105,95]},{"name":"Domestic tourists","values":[85,110,140,160]},{"name":"International tourists","values":[40,55,90,175]}]},"overview":["The number of international tourists rose dramatically, making them the largest group by 2012, while the number of local residents visiting declined steadily.","Domestic tourist numbers increased in every period, and this group overtook local residents in 2007."],"details":["In 1997, there were 120,000 local residents, 85,000 domestic tourists and 40,000 international tourists.","Local resident numbers fell to 115,000 in 2002, 105,000 in 2007 and 95,000 in 2012, while domestic tourists rose to 110,000, 140,000 and 160,000 over the same years.","International tourists increased to 55,000 in 2002 and 90,000 in 2007, before reaching 175,000 in 2012."],"features":["The number of international tourists rose dramatically, making them the largest group by 2012, while the number of local residents visiting declined steadily.","Domestic tourist numbers increased in every period, and this group overtook local residents in 2007.","In 1997, there were 120,000 local residents, 85,000 domestic tourists and 40,000 international tourists.","Local resident numbers fell to 115,000 in 2002, 105,000 in 2007 and 95,000 in 2012, while domestic tourists rose to 110,000, 140,000 and 160,000 over the same years.","International tourists increased to 55,000 in 2002 and 90,000 in 2007, before reaching 175,000 in 2012."],"model":"The bar chart compares the number of local residents, domestic tourists and international tourists who visited a museum in 1997, 2002, 2007 and 2012.\n\nOverall, the number of international tourists increased dramatically, making them the largest group by 2012, while local visitor numbers declined steadily. Domestic tourists also rose in every period, overtaking local residents in 2007.\n\nIn 1997, local residents were the main visitors to the museum, numbering 120,000, compared with 85,000 domestic tourists and only 40,000 international visitors. Over the following fifteen years, however, the number of local visitors fell steadily, to 115,000 in 2002 and 105,000 in 2007, before reaching a low of 95,000 in 2012.\n\nMeanwhile, domestic tourist numbers grew consistently, reaching 110,000 in 2002 and overtaking local residents in 2007, when they stood at 140,000. They then rose further to 160,000 by the end of the period. The most striking change, however, was in international tourism. Having risen modestly to 55,000 in 2002, the figure climbed to 90,000 in 2007 and then almost doubled to 175,000 in 2012, overtaking both other groups."},{"id":"W1-28","type":"bar","title":"Young people in higher education, 2000–2010","prompt":"The chart below shows the percentage of young people in higher education in four countries in 2000, 2005 and 2010.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Percentage of young people in higher education, 2000–2010","unit":"%","categories":["2000","2005","2010"],"series":[{"name":"Canada","values":[52,56,61]},{"name":"Japan","values":[45,50,57]},{"name":"Germany","values":[30,34,40]},{"name":"Brazil","values":[14,22,31]}]},"overview":["The proportion of young people in higher education increased in all four countries between 2000 and 2010.","Canada had the highest rate in every year shown, while Brazil had the lowest throughout despite recording the greatest growth."],"details":["In Canada, the rate rose from 52% in 2000 to 56% in 2005 and 61% in 2010, while in Japan it grew from 45% to 50% and then 57%.","The German figure increased from 30% in 2000 to 34% in 2005 and 40% in 2010.","Brazil's rate rose from 14% in 2000 to 22% in 2005 and 31% in 2010."],"features":["The proportion of young people in higher education increased in all four countries between 2000 and 2010.","Canada had the highest rate in every year shown, while Brazil had the lowest throughout despite recording the greatest growth.","In Canada, the rate rose from 52% in 2000 to 56% in 2005 and 61% in 2010, while in Japan it grew from 45% to 50% and then 57%.","The German figure increased from 30% in 2000 to 34% in 2005 and 40% in 2010.","Brazil's rate rose from 14% in 2000 to 22% in 2005 and 31% in 2010."],"model":"The bar chart illustrates the percentage of young people who were enrolled in higher education in Canada, Japan, Germany and Brazil in 2000, 2005 and 2010.\n\nOverall, participation in higher education increased in all four countries over the decade. Canada had the highest rate in every year shown, while Brazil had the lowest throughout, despite recording the greatest growth.\n\nIn 2000, 52% of young Canadians were in higher education, the highest proportion of the four countries, followed by Japan at 45%. These figures increased steadily, reaching 61% and 57% respectively in 2010. As a result, Japan narrowed the gap with Canada from seven percentage points to four.\n\nGermany and Brazil started from much lower bases. The German figure rose from 30% in 2000 to 34% in 2005 and 40% in 2010. Brazil had the lowest participation rate at the start of the period, at only 14%, but this rose to 22% in 2005 and more than doubled over the decade to reach 31% in 2010, an increase of 17 percentage points."},{"id":"W1-29","type":"pie","title":"Hazardous waste disposal in three countries","prompt":"The pie charts below show how hazardous waste is dealt with in three countries.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Methods of dealing with hazardous waste in three countries (%)","pies":[{"title":"Republic of Korea","slices":[{"label":"Recycled","value":33},{"label":"Incinerated","value":12},{"label":"Landfill","value":44},{"label":"Dumped at sea","value":11}]},{"title":"Sweden","slices":[{"label":"Recycled","value":61},{"label":"Incinerated","value":29},{"label":"Landfill","value":8},{"label":"Dumped at sea","value":2}]},{"title":"United Kingdom","slices":[{"label":"Recycled","value":18},{"label":"Incinerated","value":9},{"label":"Landfill","value":64},{"label":"Dumped at sea","value":9}]}]},"overview":["Landfill was the main method of dealing with hazardous waste in the Republic of Korea and the UK, whereas Sweden recycled the majority of its hazardous waste.","Dumping at sea accounted for only a small share of hazardous waste in all three countries."],"details":["In the UK, 64% of hazardous waste went to landfill and 18% was recycled, while incineration and dumping at sea each accounted for 9%.","In the Republic of Korea, 44% went to landfill and 33% was recycled, with 12% incinerated and 11% dumped at sea.","In Sweden, 61% was recycled and 29% incinerated, while only 8% went to landfill and 2% was dumped at sea."],"features":["Landfill was the main method of dealing with hazardous waste in the Republic of Korea and the UK, whereas Sweden recycled the majority of its hazardous waste.","Dumping at sea accounted for only a small share of hazardous waste in all three countries.","In the UK, 64% of hazardous waste went to landfill and 18% was recycled, while incineration and dumping at sea each accounted for 9%.","In the Republic of Korea, 44% went to landfill and 33% was recycled, with 12% incinerated and 11% dumped at sea.","In Sweden, 61% was recycled and 29% incinerated, while only 8% went to landfill and 2% was dumped at sea."],"model":"The pie charts compare how hazardous waste is dealt with in the Republic of Korea, Sweden and the United Kingdom, in terms of four methods: recycling, incineration, landfill and dumping at sea.\n\nOverall, landfill was the main method of disposal in both the Republic of Korea and the UK, whereas Sweden recycled the majority of its hazardous waste. Dumping at sea accounted for only a small share of waste in all three countries.\n\nIn the UK, landfill accounted for 64% of hazardous waste, almost two thirds of the total. Only 18% was recycled, while incineration and dumping at sea each made up 9%. The Republic of Korea also relied heavily on landfill, at 44%, although it recycled a larger proportion, at 33%. The remaining waste was divided almost equally between incineration, at 12%, and dumping at sea, at 11%.\n\nSweden presented a very different picture. Recycling was by far the most common method, at 61%, and a further 29% of waste was incinerated, the highest figure for this method among the three countries. By contrast, just 8% went to landfill, and a mere 2% was dumped at sea."},{"id":"W1-30","type":"map","title":"Norbiton industrial area: now and future plans","prompt":"The maps below show an industrial area in the town of Norbiton, and planned future development of the site.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Norbiton industrial area: present and planned","maps":[{"title":"Now","items":[{"kind":"water","label":"River","x":0,"y":0,"w":100,"h":8},{"kind":"road","label":"Main Road","points":[[0,40],[100,40]]},{"kind":"road","label":"Hindon Lane","points":[[50,8],[50,70]]},{"kind":"carpark","label":"Car park","x":6,"y":46,"w":22,"h":14},{"kind":"building","label":"Factories","x":5,"y":12,"w":38,"h":22},{"kind":"building","label":"Warehouse","x":56,"y":12,"w":20,"h":14},{"kind":"field","label":"Grassland","x":80,"y":10,"w":18,"h":26},{"kind":"building","label":"Workshop","x":31,"y":46,"w":14,"h":12},{"kind":"field","label":"Farmland","x":56,"y":45,"w":40,"h":22}]},{"title":"Future plans","items":[{"kind":"water","label":"River","x":0,"y":0,"w":100,"h":8},{"kind":"road","label":"Main Road","points":[[0,40],[100,40]]},{"kind":"road","label":"Hindon Lane","points":[[50,8],[50,70]]},{"kind":"carpark","label":"Car park","x":6,"y":46,"w":22,"h":14},{"kind":"path","label":"Footpath","points":[[0,9],[100,9]]},{"kind":"building","label":"Housing","x":5,"y":12,"w":38,"h":22},{"kind":"building","label":"School","x":56,"y":12,"w":20,"h":14},{"kind":"park","label":"Park","x":80,"y":10,"w":18,"h":26},{"kind":"building","label":"Shops","x":31,"y":46,"w":14,"h":12},{"kind":"building","label":"Medical centre","x":56,"y":48,"w":14,"h":10},{"kind":"field","label":"Farmland","x":72,"y":45,"w":24,"h":22}]}]},"overview":["The site will change from an industrial zone into a mainly residential and community area.","Almost all of the industrial buildings will be replaced, while the roads and the car park will stay the same."],"details":["The factories in the north-west, just south of the river, will be demolished to make way for housing.","East of Hindon Lane, the warehouse will be replaced by a school, and the grassland in the north-east corner will become a park.","In the south-east, a new medical centre will take over part of the farmland, while the workshop beside the car park will become shops."],"features":["The site will change from an industrial zone into a mainly residential and community area.","Almost all of the industrial buildings will be replaced, while the roads and the car park will stay the same.","The factories in the north-west, just south of the river, will be demolished to make way for housing.","East of Hindon Lane, the warehouse will be replaced by a school, and the grassland in the north-east corner will become a park.","In the south-east, a new medical centre will take over part of the farmland, while the workshop beside the car park will become shops."],"model":"The two maps illustrate an industrial area in the town of Norbiton as it is at present and how the site is planned to be redeveloped in the future.\n\nOverall, the area is set to change from an industrial zone into a largely residential and community space. Almost all of the industrial buildings will be replaced, although the road network and the car park will remain the same.\n\nAt present, the factories occupy most of the north-west of the site, just south of the river. Under the plans, they will be demolished to make way for housing. To the east of Hindon Lane, the warehouse is due to be replaced by a school, while the grassland in the north-east corner will become a park. A new footpath will also be built along the southern edge of the river.\n\nSouth of Main Road, the car park in the south-west will remain unchanged, but the workshop beside it is to be converted into shops. In the south-east, part of the farmland will be lost to a new medical centre, which will stand next to the remaining farmland. Hindon Lane and Main Road will continue to provide access to the whole site."},{"id":"W1-31","type":"map","title":"An island before and after tourism","prompt":"The two maps below show an island, before and after the construction of some tourist facilities.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"An island before and after tourist development","maps":[{"title":"Before","items":[{"kind":"water","label":"Sea","x":0,"y":0,"w":100,"h":70},{"kind":"park","label":"Island","x":12,"y":8,"w":76,"h":56},{"kind":"beach","label":"Beach","x":20,"y":52,"w":40,"h":10},{"kind":"trees","label":"Palm trees","x":16,"y":12,"w":30,"h":20},{"kind":"trees","label":"Trees","x":55,"y":12,"w":28,"h":22}]},{"title":"After","items":[{"kind":"water","label":"Sea","x":0,"y":0,"w":100,"h":70},{"kind":"park","label":"Island","x":12,"y":8,"w":76,"h":56},{"kind":"beach","label":"Beach","x":20,"y":52,"w":40,"h":10},{"kind":"trees","label":"Palm trees","x":16,"y":12,"w":30,"h":20},{"kind":"trees","label":"Trees","x":77,"y":12,"w":9,"h":22},{"kind":"building","label":"Restaurant","x":56,"y":14,"w":18,"h":10},{"kind":"building","label":"Reception","x":62,"y":36,"w":16,"h":8},{"kind":"building","label":"Huts","x":16,"y":36,"w":22,"h":10},{"kind":"building","label":"Pier","x":44,"y":62,"w":7,"h":7},{"kind":"path","label":"Footpath","points":[[38,41],[62,40]]},{"kind":"path","label":"Footpath","points":[[70,36],[66,24]]},{"kind":"path","label":"Footpath","points":[[27,46],[27,52]]},{"kind":"road","label":"Vehicle track","points":[[70,44],[70,63],[51,63]]}]}]},"overview":["The island was turned from a largely natural area into a small tourist resort.","Several buildings and transport links were added, but the beach and the palm trees were preserved."],"details":["The palm trees in the north-west corner remained unchanged, while the trees in the north-east were partly cleared for a new restaurant.","Huts were built in the west of the island, and a reception was constructed to the south of the restaurant.","A pier was built to the south of the beach, and a vehicle track now links it to the reception."],"features":["The island was turned from a largely natural area into a small tourist resort.","Several buildings and transport links were added, but the beach and the palm trees were preserved.","The palm trees in the north-west corner remained unchanged, while the trees in the north-east were partly cleared for a new restaurant.","Huts were built in the west of the island, and a reception was constructed to the south of the restaurant.","A pier was built to the south of the beach, and a vehicle track now links it to the reception."],"model":"The maps compare an island before and after it was developed for tourism, showing the facilities that were added for visitors.\n\nOverall, the island was transformed from an almost untouched natural area into a small tourist resort. A range of buildings and transport links was added, but the beach and the palm trees were preserved.\n\nBefore the development, the island had only a beach on its south coast and two wooded areas in the north. The palm trees in the north-west corner remained unchanged, but the trees in the north-east were partly cleared to make way for a restaurant. Huts for visitors were built in the west of the island, and a reception building was constructed to the south of the restaurant, roughly in the middle of the eastern half.\n\nIn terms of access, a pier was built extending south from the beach into the sea, so that visitors can now arrive by boat, and a vehicle track links the pier to the reception. Footpaths were also laid to connect the huts with the reception, the restaurant and the beach, which itself remained unchanged."},{"id":"W1-32","type":"map","title":"A town centre in 1995 and today","prompt":"The maps below show the centre of a town in 1995 and today.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Town centre, 1995 and today","maps":[{"title":"1995","items":[{"kind":"road","label":"High Street","points":[[0,35],[100,35]]},{"kind":"road","label":"Station Road","points":[[70,0],[70,35]]},{"kind":"building","label":"Station","x":72,"y":8,"w":18,"h":12},{"kind":"building","label":"Bank","x":40,"y":14,"w":14,"h":10},{"kind":"building","label":"Shops","x":46,"y":44,"w":20,"h":12},{"kind":"building","label":"Houses","x":8,"y":8,"w":26,"h":20},{"kind":"park","label":"Park","x":8,"y":42,"w":30,"h":22},{"kind":"building","label":"Cinema","x":74,"y":44,"w":20,"h":14}]},{"title":"Today","items":[{"kind":"path","label":"High Street","points":[[0,35],[100,35]]},{"kind":"road","label":"Station Road","points":[[70,0],[70,35]]},{"kind":"building","label":"Station","x":72,"y":8,"w":18,"h":12},{"kind":"building","label":"Bank","x":40,"y":14,"w":14,"h":10},{"kind":"building","label":"Shops","x":46,"y":44,"w":20,"h":12},{"kind":"building","label":"Shopping centre","x":8,"y":8,"w":26,"h":20},{"kind":"carpark","label":"Car park","x":8,"y":42,"w":30,"h":10},{"kind":"park","label":"Park","x":8,"y":54,"w":30,"h":10},{"kind":"building","label":"Apartments","x":74,"y":44,"w":20,"h":14},{"kind":"road","label":"Ring Road","points":[[0,67],[100,67]]},{"kind":"road","label":"Access road","points":[[42,67],[42,47],[38,47]]}]}]},"overview":["The town centre has become more commercial and more pedestrian-friendly.","High Street is now closed to traffic and new facilities have been added, while several buildings have survived."],"details":["The houses in the north-west corner were demolished to make way for a shopping centre.","The northern part of the park was turned into a car park, reached by a new access road from the Ring Road.","The cinema in the south-east corner was replaced by apartments, while the shops to its west remained unchanged."],"features":["The town centre has become more commercial and more pedestrian-friendly.","High Street is now closed to traffic and new facilities have been added, while several buildings have survived.","The houses in the north-west corner were demolished to make way for a shopping centre.","The northern part of the park was turned into a car park, reached by a new access road from the Ring Road.","The cinema in the south-east corner was replaced by apartments, while the shops to its west remained unchanged."],"model":"The maps illustrate how the centre of a town changed between 1995 and the present day.\n\nOverall, the town centre has become more commercial and more pedestrian-friendly. The main street is now closed to traffic and new facilities for shoppers and drivers have been added, while several key buildings have survived.\n\nIn 1995, High Street ran through the middle of the town, carrying traffic, but it has since been pedestrianised. To the north of it, the houses in the north-west corner were demolished to make way for a shopping centre, which now stands to the west of the bank. The bank and the station, located in the north-east corner beside Station Road, remained unchanged.\n\nSouth of High Street, the park has been reduced in size, as its northern section was turned into a car park, which is reached by a new access road from the Ring Road along the southern edge of the map. Further east, the shops remained unchanged, whereas the cinema in the south-east corner was demolished and replaced by apartments, adding homes to the town centre."},{"id":"W1-33","type":"map","title":"A public library: then and now","prompt":"The plans below show the ground floor of a public library twenty years ago and now.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Library ground floor, 20 years ago and now","maps":[{"title":"20 years ago","items":[{"kind":"building","label":"Entrance","x":44,"y":62,"w":13,"h":7},{"kind":"building","label":"Office","x":4,"y":36,"w":20,"h":14},{"kind":"building","label":"Study desks","x":30,"y":36,"w":30,"h":16},{"kind":"building","label":"Toilets","x":68,"y":40,"w":14,"h":10},{"kind":"building","label":"Enquiry desk","x":62,"y":56,"w":20,"h":8},{"kind":"building","label":"Reading room","x":4,"y":4,"w":30,"h":26},{"kind":"building","label":"Bookshelves","x":40,"y":4,"w":56,"h":26},{"kind":"building","label":"Storage","x":4,"y":56,"w":20,"h":10}]},{"title":"Now","items":[{"kind":"building","label":"Entrance","x":44,"y":62,"w":13,"h":7},{"kind":"building","label":"Office","x":4,"y":36,"w":20,"h":14},{"kind":"building","label":"Study desks","x":30,"y":36,"w":30,"h":16},{"kind":"building","label":"Toilets","x":68,"y":40,"w":14,"h":10},{"kind":"building","label":"Enquiry desk","x":62,"y":56,"w":20,"h":8},{"kind":"building","label":"Children's section","x":4,"y":4,"w":30,"h":26},{"kind":"building","label":"Computer area","x":40,"y":4,"w":22,"h":26},{"kind":"building","label":"Bookshelves","x":65,"y":4,"w":31,"h":26},{"kind":"building","label":"Café","x":4,"y":56,"w":20,"h":10}]}]},"overview":["The library has been modernised, with more space for technology, children and refreshments and less for books.","The entrance and several rooms, including the office and the toilets, have kept their original positions."],"details":["The reading room in the north-west corner has been replaced by a children's section.","The bookshelves have been reduced to the north-east corner, with a new computer area next to them.","The storage room in the south-west corner has made way for a café, while the enquiry desk to the east of the entrance remained unchanged."],"features":["The library has been modernised, with more space for technology, children and refreshments and less for books.","The entrance and several rooms, including the office and the toilets, have kept their original positions.","The reading room in the north-west corner has been replaced by a children's section.","The bookshelves have been reduced to the north-east corner, with a new computer area next to them.","The storage room in the south-west corner has made way for a café, while the enquiry desk to the east of the entrance remained unchanged."],"model":"The floor plans compare the ground floor of a public library twenty years ago with its layout today.\n\nOverall, the library has been modernised, with more space now devoted to technology, children and refreshments, and less given to books. However, the entrance and several rooms have kept their original positions.\n\nThe most noticeable changes have taken place in the north of the building. The reading room in the north-west corner has been replaced by a children's section, while the bookshelves, which once stretched across most of the northern side, have been reduced and now occupy only the north-east corner. The space freed up between them has been converted into a computer area, which sits next to the bookshelves.\n\nElsewhere, the storage room in the south-west corner has made way for a café, offering visitors somewhere to relax. By contrast, the rest of the ground floor is much as it was. The office on the western side, the study desks in the centre and the toilets to their east all remained unchanged, as did the enquiry desk to the east of the entrance on the southern side."},{"id":"W1-34","type":"map","title":"West Park Secondary School, 1950-2010","prompt":"The maps below show the site of West Park Secondary School in 1950, 1980 and 2010.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"West Park Secondary School site, 1950, 1980 and 2010","maps":[{"title":"1950","items":[{"kind":"road","label":"West Park Road","points":[[0,64],[100,64]]},{"kind":"trees","label":"Trees","x":8,"y":6,"w":24,"h":20},{"kind":"building","label":"School","x":8,"y":40,"w":24,"h":18},{"kind":"field","label":"Playing fields","x":40,"y":6,"w":56,"h":50}]},{"title":"1980","items":[{"kind":"road","label":"West Park Road","points":[[0,64],[100,64]]},{"kind":"trees","label":"Trees","x":8,"y":6,"w":24,"h":20},{"kind":"building","label":"School","x":8,"y":34,"w":34,"h":24},{"kind":"building","label":"Sports hall","x":48,"y":42,"w":20,"h":16},{"kind":"field","label":"Playing fields","x":48,"y":6,"w":48,"h":30}]},{"title":"2010","items":[{"kind":"road","label":"West Park Road","points":[[0,64],[100,64]]},{"kind":"trees","label":"Trees","x":8,"y":6,"w":24,"h":20},{"kind":"building","label":"School","x":8,"y":34,"w":34,"h":24},{"kind":"building","label":"Sports hall","x":48,"y":42,"w":20,"h":16},{"kind":"field","label":"Playing fields","x":74,"y":6,"w":22,"h":30},{"kind":"building","label":"Science block","x":48,"y":6,"w":22,"h":24},{"kind":"carpark","label":"Car park","x":74,"y":42,"w":22,"h":16},{"kind":"road","label":"Access road","points":[[85,64],[85,58]]}]}]},"overview":["The school buildings expanded steadily, mainly at the expense of the playing fields, which shrank considerably.","A car park was added by 2010, while the trees and West Park Road remained unchanged."],"details":["In 1950, the school stood in the south-west corner, with playing fields covering most of the eastern half of the site.","By 1980, the school had been extended to the north and east, and a sports hall had been built to its east.","By 2010, a science block had been built to the north of the sports hall, and a car park occupied the south-east corner."],"features":["The school buildings expanded steadily, mainly at the expense of the playing fields, which shrank considerably.","A car park was added by 2010, while the trees and West Park Road remained unchanged.","In 1950, the school stood in the south-west corner, with playing fields covering most of the eastern half of the site.","By 1980, the school had been extended to the north and east, and a sports hall had been built to its east.","By 2010, a science block had been built to the north of the sports hall, and a car park occupied the south-east corner."],"model":"The maps show how the site of West Park Secondary School developed over a sixty-year period, in 1950, 1980 and 2010.\n\nOverall, the school buildings expanded steadily over the period, mainly at the expense of the playing fields, which shrank considerably. A car park was also introduced by 2010, while the trees and West Park Road remained unchanged.\n\nIn 1950, the school was a single building in the south-west corner of the site, with trees to its north and large playing fields occupying most of the eastern half. By 1980, the school had been extended to the north and east, and a sports hall had been built to its east, on land previously used as playing fields. As a result, the playing fields were reduced to the north-east of the site.\n\nBetween 1980 and 2010, a science block was constructed on the western part of the remaining playing fields, to the north of the sports hall, leaving the fields only in the north-east corner. Meanwhile, a car park was laid out in the south-east corner, linked to West Park Road by a short access road. The trees in the north-west and the main school building remained unchanged after 1980."},{"id":"W1-35","type":"map","title":"A coastal village in 2000 and 2020","prompt":"The maps below show a coastal village in 2000 and 2020.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.","chart":{"title":"Coastal village, 2000 and 2020","maps":[{"title":"2000","items":[{"kind":"water","label":"Sea","x":0,"y":54,"w":100,"h":16},{"kind":"beach","label":"Beach","x":50,"y":48,"w":46,"h":6},{"kind":"building","label":"Houses","x":30,"y":36,"w":22,"h":10},{"kind":"building","label":"Shop","x":60,"y":36,"w":12,"h":8},{"kind":"building","label":"Church","x":8,"y":36,"w":14,"h":10},{"kind":"road","label":"Main Road","points":[[0,20],[25,30],[50,18],[75,30],[100,20]]},{"kind":"field","label":"Farmland","x":4,"y":2,"w":92,"h":12}]},{"title":"2020","items":[{"kind":"water","label":"Sea","x":0,"y":54,"w":100,"h":16},{"kind":"beach","label":"Beach","x":50,"y":48,"w":46,"h":6},{"kind":"building","label":"Houses","x":30,"y":36,"w":22,"h":10},{"kind":"building","label":"Shop","x":60,"y":36,"w":12,"h":8},{"kind":"building","label":"Church","x":8,"y":36,"w":14,"h":10},{"kind":"road","label":"Main Road","points":[[0,24],[100,24]]},{"kind":"field","label":"Farmland","x":50,"y":2,"w":46,"h":12},{"kind":"building","label":"Hotel","x":6,"y":2,"w":27,"h":14},{"kind":"carpark","label":"Car park","x":36,"y":2,"w":13,"h":12},{"kind":"building","label":"Marina","x":14,"y":56,"w":24,"h":10},{"kind":"road","label":"New road","points":[[25,24],[25,56]]}]}]},"overview":["The village was developed for tourism and leisure, while the area of farmland decreased.","Main Road was straightened, but the older buildings, such as the church and the houses, were retained."],"details":["Main Road, which wound through the village in 2000, had been straightened by 2020.","A hotel and a car park were built on the western part of the farmland, leaving farmland only in the north-east.","A marina was built in the sea in the south-west corner, reached by a new road running south past the church."],"features":["The village was developed for tourism and leisure, while the area of farmland decreased.","Main Road was straightened, but the older buildings, such as the church and the houses, were retained.","Main Road, which wound through the village in 2000, had been straightened by 2020.","A hotel and a car park were built on the western part of the farmland, leaving farmland only in the north-east.","A marina was built in the sea in the south-west corner, reached by a new road running south past the church."],"model":"The maps illustrate the changes that took place in a coastal village between 2000 and 2020.\n\nOverall, the village was developed for tourism and leisure, with a new marina and hotel, while the area of farmland decreased. The road through the village was also straightened, but the older buildings were retained.\n\nIn 2000, Main Road wound through the middle of the village, but by 2020 it had been replaced by a straight road. To the north of the road, a large area of farmland stretched across the north of the village. Much of its western section has since been converted into a hotel in the north-west corner, with a new car park next to it, so the farmland now lies only in the north-east.\n\nAlong the coast, the beach remained unchanged, but a marina was built out into the sea in the south-west corner, reached by a new road running south from Main Road past the church. This means that boats can now be moored close to the village centre. The houses, the church and the shop, all of which stand between the road and the sea, remained unchanged."}];
