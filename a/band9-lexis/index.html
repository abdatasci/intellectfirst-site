<style>
:root{
  --bg:#F3F7FC; --surface:#FFFFFF; --ink:#0E1F3D; --muted:#56657E; --line:#D6E0EC; --ice:#E3ECF7;
  --gold:#A9822D; --gold-soft:#F5ECD6; --navy:#0E1F3D; --navy-2:#1B3260;
  --ok:#1D7348; --okbg:#E2F2E9; --bad:#A3392A; --badbg:#F8E5E1;
  --serif: Cambria, Caladea, Georgia, "Times New Roman", serif;
  --sans: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111F; --surface:#0F1C33; --ink:#E7EDF6; --muted:#9AA9C0; --line:#23365A; --ice:#16284A;
    --gold:#D6B266; --gold-soft:#2A2618; --navy:#0B1830; --navy-2:#1B3260;
    --ok:#6FCB98; --okbg:#10301F; --bad:#F09383; --badbg:#3A1813;
  }
}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1C33; --ink:#E7EDF6; --muted:#9AA9C0; --line:#23365A; --ice:#16284A;
  --gold:#D6B266; --gold-soft:#2A2618; --navy:#0B1830; --navy-2:#1B3260;
  --ok:#6FCB98; --okbg:#10301F; --bad:#F09383; --badbg:#3A1813;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 64px}

/* Header */
.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:18px;padding-bottom:18px}
.crest{flex:none;width:40px;height:46px}
.brand h1{font-family:var(--serif);font-weight:700;font-size:1.45rem;letter-spacing:.01em;margin:0;line-height:1.1}
.brand p{margin:2px 0 0;font-size:.9rem;color:#C9D6EA}
.streak{margin-left:auto;text-align:right;line-height:1.1}
.streak b{display:block;font-family:var(--serif);font-size:1.7rem;color:#E4C57E}
.streak span{font-size:.8rem;color:#C9D6EA}

.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;padding-top:8px;padding-bottom:0}
.tab{border:0;background:none;padding:10px 14px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}

h2{font-family:var(--serif);font-size:1.5rem;margin:26px 0 6px;line-height:1.2}
h3{font-family:var(--serif);font-size:1.15rem;margin:22px 0 8px}
.lede{color:var(--muted);margin:0 0 18px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* Step rail */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 20px}
.rail button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px 9px;text-align:left;min-width:0}
.rail .n{display:block;font-family:var(--serif);font-size:.85rem;color:var(--muted)}
.rail .l{display:block;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail button[aria-current="step"]{border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.rail button.done .n{color:var(--ok)}
.rail button.done .n::after{content:" ✓"}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.count{font-size:.9rem;color:var(--muted);margin:0 0 10px}
.def{font-family:var(--serif);font-size:1.25rem;line-height:1.45;margin:0 0 14px}
.gap{font-size:1.05rem;margin:0 0 16px}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--gold);height:1.05em;vertical-align:baseline}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;font-size:1.05rem}
textarea.field{min-height:92px;resize:vertical;line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.btn{border:1px solid var(--navy-2);background:var(--navy-2);color:#fff;border-radius:10px;padding:10px 18px;font-weight:700}
:root[data-theme="dark"] .btn{background:var(--gold);border-color:var(--gold);color:#0B1830}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:var(--gold);border-color:var(--gold);color:#0B1830}}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--gold-soft);color:var(--ink);border-color:var(--gold)}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.fb{margin-top:14px;border-radius:10px;padding:12px 14px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.ai{background:var(--ice);color:var(--ink);white-space:pre-wrap}
.fb b{font-weight:700}

/* Word card: the one bold element */
.word{font-family:var(--serif);font-size:clamp(2.2rem,8vw,3.2rem);font-weight:700;line-height:1;margin:4px 0 6px;letter-spacing:-.01em}
.pos{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:1.05rem}
.rule{height:2px;width:64px;background:var(--gold);margin:14px 0 16px;border:0}
.facts{display:grid;grid-template-columns:8.5em 1fr;gap:8px 14px;margin:0}
.facts dt{color:var(--muted);font-size:.9rem;padding-top:2px}
.facts dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--ice);border-radius:6px;padding:2px 9px;font-size:.95rem}
.pron{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px}
.ipa{font-family:"Doulos SIL","Charis SIL","Lucida Sans Unicode","Segoe UI",Arial,sans-serif;font-size:1.05rem}
.stress{color:var(--muted);font-size:.95rem;letter-spacing:.02em}
.say-btns{display:inline-flex;gap:6px}
.btn.sm{padding:5px 11px;font-size:.88rem;border-radius:8px}
.example{font-family:var(--serif);font-style:italic;border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:16px 0}
@media (max-width:480px){.facts{grid-template-columns:1fr}.facts dt{padding-top:6px}}

/* Reading */
.passage{font-family:var(--serif);font-size:1.06rem;line-height:1.7}
.passage p{margin:0 0 14px;display:grid;grid-template-columns:1.6em 1fr;gap:6px}
.passage .pl{font-weight:700;color:var(--gold)}
.hl{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted var(--gold);text-decoration-thickness:2px;text-underline-offset:4px}
.headlist{list-style:none;padding:0;margin:0 0 14px}
.headlist li{display:grid;grid-template-columns:2.6em 1fr;padding:5px 0;border-bottom:1px solid var(--line)}
.headlist .rn{font-family:var(--serif);font-style:italic;color:var(--gold)}
.q{display:grid;grid-template-columns:2em 1fr;gap:8px;align-items:start;margin:10px 0}
.q .qn{font-weight:700;color:var(--muted);padding-top:8px}
select.field{padding:9px 10px;font-size:1rem}
.tf{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tf button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:.9rem;font-weight:700}
.tf button[aria-pressed="true"]{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.sumtext{line-height:2.2}
.sumtext select{display:inline-block;width:auto;padding:4px 6px;font-size:.95rem;border-radius:8px;border:1px solid var(--gold);background:var(--bg)}
.box{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mark{font-size:.9rem;margin-top:4px}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
.score{font-family:var(--serif);font-size:1.4rem;margin:0}

/* Words tab */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--serif);font-size:1.6rem;line-height:1}
.stat span{font-size:.85rem;color:var(--muted)}
.wlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wlist > li{border-bottom:1px solid var(--line)}
.wlist > li:last-child{border-bottom:0}
.wrow{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:12px 16px;text-align:left}
.wrow .ww{font-family:var(--serif);font-weight:700;font-size:1.08rem}
.wrow .wp{font-style:italic;color:var(--muted);font-size:.9rem}
.dots{margin-left:auto;display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.wbody{padding:0 16px 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--navy-2);color:#fff}
.plist{display:grid;gap:8px;margin:12px 0 18px}
.pbtn{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left}
.pbtn[aria-current="true"]{border-color:var(--gold)}
.pbtn span{color:var(--muted);font-size:.9rem;white-space:nowrap}

/* Sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:3px solid var(--gold);box-shadow:0 -12px 32px rgba(8,17,31,.25);padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto}
.sheet .inner{max-width:720px;margin:0 auto}
.done-hero{text-align:center;padding:30px 10px}
.done-hero .big{font-family:var(--serif);font-size:3.4rem;color:var(--gold);line-height:1}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>

<script>
/* ---------- Content: Band 9 academic word bank ---------- */
const RAW = [
["ubiquitous","adj","present or found everywhere",["become ubiquitous","a ubiquitous presence","near-ubiquitous"],"ubiquity (n), ubiquitously (adv)","omnipresent, pervasive","Within a decade, smartphones had become ___ in secondary schools.","ubiquitous","You can find plastic packaging almost everywhere now.","Plastic packaging has become near-ubiquitous in modern life."],
["exacerbate","v","to make a problem or bad situation worse",["exacerbate tensions","exacerbate inequality","be exacerbated by"],"exacerbation (n)","aggravate, compound","Cuts to rural bus services have ___ isolation among elderly residents.","exacerbated","Rising rents have made the housing problem worse for young people.","Rising rents have exacerbated the housing crisis facing young people."],
["mitigate","v","to make something harmful less severe",["mitigate the risk","mitigate the effects of","mitigating factors"],"mitigation (n)","alleviate, cushion","Planting trees along streets can help ___ the effects of urban heat.","mitigate","Governments can reduce the damage caused by floods by building barriers.","Flood barriers can substantially mitigate the damage caused by extreme weather."],
["unprecedented","adj","never having happened or existed before",["on an unprecedented scale","unprecedented levels","an unprecedented rise"],"precedent (n)","without parallel, record-breaking","The pandemic forced universities to move online on an ___ scale.","unprecedented","Never before have so many people moved to cities so quickly.","Urbanisation is now occurring at an unprecedented pace."],
["proliferation","n","a rapid increase in number or spread",["the proliferation of","nuclear proliferation","a proliferation of options"],"proliferate (v)","rapid spread, surge","The ___ of fast-food outlets near schools worries health officials.","proliferation","The number of online courses has grown very quickly.","Recent years have seen a proliferation of online courses."],
["detrimental","adj","causing harm or damage",["detrimental to health","a detrimental effect","detrimental impact on"],"detriment (n); to the detriment of","harmful, deleterious","Long periods of screen time may be ___ to children's sleep.","detrimental","Working very long hours is bad for employees' health.","Excessive working hours can be detrimental to employees' long-term health."],
["corroborate","v","to confirm something with further evidence",["corroborate findings","corroborate a claim","corroborating evidence"],"corroboration (n)","substantiate, bear out","Later studies ___ the link between diet and memory.","corroborated","Other scientists' research supports what the first study found.","Subsequent research has corroborated the original study's findings."],
["inextricably","adv","in a way that cannot be separated",["inextricably linked","inextricably bound up with","inextricably intertwined"],"inextricable (adj)","intrinsically, inseparably","Economic growth is ___ linked to access to education.","inextricably","Poverty and poor health are closely connected and hard to separate.","Poverty and poor health are inextricably linked."],
["burgeoning","adj","growing or developing quickly",["a burgeoning industry","burgeoning demand","a burgeoning population"],"burgeon (v)","flourishing, booming","The city's ___ tech sector has attracted young graduates.","burgeoning","The number of people buying electric cars is growing fast.","There is burgeoning demand for electric vehicles."],
["erode","v","to weaken or destroy something gradually",["erode trust","erode confidence","steadily eroded"],"erosion (n)","undermine, wear away","Repeated scandals have ___ public trust in the media.","eroded","Over time, fake news makes people trust newspapers less.","Misinformation has gradually eroded public trust in the press."],

["disparity","n","a large and often unfair difference",["a widening disparity","disparity between X and Y","regional disparities"],"disparate (adj)","gap, imbalance","There is a growing ___ between urban and rural incomes.","disparity","Rich and poor students do not get the same quality of education.","Marked disparities persist in the quality of education available to affluent and low-income students."],
["curtail","v","to reduce or limit something",["curtail spending","curtail freedoms","severely curtailed"],"curtailment (n)","rein in, restrict","The new law will ___ the use of private cars in the city centre.","curtail","The government is cutting the money it spends on the arts.","The government has curtailed arts funding."],
["pervasive","adj","spreading widely through an area or group",["a pervasive influence","a pervasive sense of","all-pervasive"],"pervade (v), pervasiveness (n)","widespread, prevalent","Advertising has a ___ influence on teenagers' self-image.","pervasive","Stress is common in almost every part of modern workplaces.","Stress is pervasive in the modern workplace."],
["hitherto","adv","until now, or until a particular time",["hitherto unknown","hitherto unexplored","hitherto neglected"],"—","previously, until then","The excavation revealed a ___ unknown settlement.","hitherto","The telescope showed galaxies that nobody had seen before.","The telescope revealed hitherto unobserved galaxies."],
["salient","adj","most noticeable or most important",["salient features","the salient point","highly salient"],"salience (n)","prominent, key","The report summarises the ___ features of the proposal.","salient","The most important point of the argument is that costs will rise.","The salient point of the argument is that costs will rise."],
["entrenched","adj","firmly established and difficult to change",["deeply entrenched","entrenched attitudes","entrenched interests"],"entrench (v), entrenchment (n)","ingrained, deep-rooted","Gender stereotypes remain deeply ___ in some industries.","entrenched","Old-fashioned ideas about work are hard to change in some companies.","Outdated attitudes to work remain deeply entrenched in some firms."],
["catalyst","n","something that causes important change",["act as a catalyst for","a catalyst for change","the main catalyst"],"catalyse (v)","trigger, spur","The protests acted as a ___ for political reform.","catalyst","The internet caused big changes in how people shop.","The internet acted as a catalyst for a transformation in consumer behaviour."],
["ambivalent","adj","having mixed or contradictory feelings",["ambivalent about","ambivalent towards","deeply ambivalent"],"ambivalence (n)","conflicted, equivocal","Many residents feel ___ about the new airport: it brings jobs but also noise.","ambivalent","Many parents have mixed feelings about giving children phones.","Many parents are ambivalent about giving children smartphones."],
["scrutiny","n","careful and detailed examination",["come under scrutiny","close scrutiny","withstand scrutiny"],"scrutinise (v)","examination, inspection","The company's labour practices have come under intense ___.","scrutiny","People are now looking very carefully at how banks behave.","Banks' conduct has come under increasing public scrutiny."],
["commensurate","adj","in proportion to; matching in size or degree",["commensurate with experience","a commensurate increase","commensurate reward"],"commensurately (adv)","proportionate, in line with","Salary will be ___ with qualifications and experience.","commensurate","Teachers' pay has not risen as much as their workload.","Teachers' pay has not risen commensurately with their workload."],
["undermine","v","to weaken something gradually",["undermine confidence","undermine efforts","seriously undermine"],"—","weaken, sabotage","Constant criticism can ___ a student's confidence.","undermine","Corruption makes it harder for the government to do its work.","Corruption undermines the government's efforts to deliver public services."],
["tenuous","adj","very weak or slight",["a tenuous link","a tenuous connection","a tenuous grasp of"],"tenuously (adv)","flimsy, slight","The evidence linking the two events is ___ at best.","tenuous","The connection between video games and violence is weak.","The link between video games and violence is tenuous."],

["alleviate","v","to make suffering or a problem less severe",["alleviate poverty","alleviate pressure","alleviate symptoms"],"alleviation (n)","ease, relieve","New housing could ___ pressure on the rental market.","alleviate","Building more hospitals would reduce waiting times.","Additional hospitals would alleviate pressure on waiting lists."],

["ramifications","n","complex, often unintended consequences",["far-reaching ramifications","the ramifications of","political ramifications"],"ramify (v, rare)","consequences, repercussions","The decision will have far-reaching ___ for the economy.","ramifications","Leaving the trade agreement will have many serious effects.","Withdrawing from the trade agreement will have far-reaching ramifications."],
["nuanced","adj","showing subtle differences",["a nuanced understanding","a nuanced view","a more nuanced approach"],"nuance (n)","subtle, sophisticated","The issue requires a more ___ approach than simply banning phones.","nuanced","Good essays look at both sides carefully rather than simply.","Strong essays offer a nuanced treatment of both sides of the argument."],

/* ---------- Helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
function todayStr(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(s,n){ const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return todayStr(d); }
function dayNum(s){ return Math.round(new Date(s+"T12:00:00").getTime()/864e5); }
function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z]/g,"").replace(/iz/g,"is"); }
function shuffle(a,seed){ a=a.slice(); let x = seed ?? Math.floor(Math.random()*1e9); for(let i=a.length-1;i>0;i--){ x=(x*9301+49297)%233280; const j=Math.floor(x/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const ROMAN = ["i","ii","iii","iv","v","vi","vii","viii","ix","x"];
const LETTERS = "ABCDEFGH";
const INTERVALS = [0,1,3,7,14,30,60];
const STAGE = b => b>=5 ? "Mastered" : b>=3 ? "Familiar" : "Learning";

/* ---------- State ---------- */
const KEY = "if-band9-lexis-v1";
function blank(){ return {v:1,updated:0,words:{},custom:[],passages:[],streak:0,lastDone:null,newPerDay:5,sentences:{},today:null}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v===1) return Object.assign(blank(), s); }catch(e){} return blank(); }
let state = load();
let dbRef = null, dbChain = Promise.resolve(), dbTimer = null, sampleFn = null;

function save(){
  state.updated = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  if(dbRef){ clearTimeout(dbTimer); dbTimer = setTimeout(()=>{ const snap = JSON.parse(JSON.stringify(state)); dbChain = dbChain.then(()=>dbRef.set(snap)).catch(()=>{}); }, 1200); }
}
const allWords = () => BANK.concat(state.custom || []);
function word(id){ return allWords().find(w => w.w === id); }
const allPassages = () => PASSAGES.concat(state.passages || []);

function ensureToday(){
  const t = todayStr();
  if(state.today && state.today.date === t) return;
  const due = Object.entries(state.words).filter(([,s]) => s.due <= t).sort((a,b)=>a[1].due.localeCompare(b[1].due)).slice(0,15).map(x=>x[0]).filter(word);
  const fresh = allWords().filter(w => !state.words[w.w]).slice(0, state.newPerDay).map(w=>w.w);
  let para = [...fresh.slice(0,2), ...shuffle(due).slice(0,1)];
  for(const id of fresh.concat(due)){ if(para.length>=3) break; if(!para.includes(id)) para.push(id); }
  const ps = allPassages();
  state.today = {date:t, review:shuffle(due), learn:fresh, para:para.slice(0,3),
    passage: ps[((dayNum(t) % ps.length) + ps.length) % ps.length].id,
    steps:{review:due.length===0, learn:fresh.length===0, para:para.length===0, read:false}};
  save();
}
function currentStreak(){ const t = todayStr(); if(!state.lastDone) return 0; if(state.lastDone===t || state.lastDone===addDays(t,-1)) return state.streak; return 0; }
function completeStep(k){
  state.today.steps[k] = true;
  const s = state.today.steps, t = todayStr();
  if(s.review && s.learn && s.para && s.read && state.lastDone !== t){
    state.streak = state.lastDone === addDays(t,-1) ? state.streak + 1 : 1;
    state.lastDone = t;
  }
  save();
  ui.step = nextStep();
}
function nextStep(){ const s = state.today.steps; return ["review","learn","para","read"].find(k=>!s[k]) || "done"; }
function grade(id, ok){
  const t = todayStr(); const s = state.words[id] || {box:0,right:0,wrong:0};
  if(ok){ s.box = Math.min(6, s.box+1); s.right++; } else { s.box = 1; s.wrong++; }
  s.due = addDays(t, INTERVALS[s.box]); state.words[id] = s;
}

/* ---------- Highlighting of bank words inside passages ---------- */
function stems(){ return allWords().filter(w=>/^[a-z]+$/i.test(w.w)).map(w=>({w:w.w, s:w.w.toLowerCase().slice(0, Math.max(5, w.w.length-2))})).sort((a,b)=>b.s.length-a.s.length); }
function highlight(text){
  const st = stems(); const re = new RegExp("\\b(" + st.map(x=>x.s).join("|") + ")[a-z]*", "gi");
  return esc(text).replace(re, m => { const hit = st.find(x => m.toLowerCase().startsWith(x.s)); return hit ? `<button class="hl" data-act="peek" data-w="${esc(hit.w)}">${m}</button>` : m; });
}

/* ---------- Views ---------- */
function render(){

}

function viewToday(){
  ensureToday();
  if(!ui.step) ui.step = nextStep();
  const T = state.today, s = T.steps;
  const d = new Date(T.date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  const steps = [["review","Recall",T.review.length],["learn","Learn",T.learn.length],["para","Paraphrase",T.para.length],["read","Read",1]];
  let h = `<h2>${esc(d)}</h2><p class="lede">${T.review.length} words to recall, ${T.learn.length} new words, ${T.para.length} paraphrases and one reading passage.</p>

  if(ui.step==="review") h += viewRecall();

function viewPassage(pid, isToday){
  const p = allPassages().find(x=>x.id===pid) || allPassages()[0];
  const r = ui.read[p.id] || (ui.read[p.id] = {h:{}, t:{}, s:{}, checked:false});
  const order = shuffle(p.heads.map((_,i)=>i), p.id.split("").reduce((a,c)=>a+c.charCodeAt(0),7));
  const romanOf = i => ROMAN[order.indexOf(i)];
  const c = r.checked;
  let score = 0, total = p.paras.length + p.tfng.length + p.sum.ans.length;
  p.paras.forEach((_,i)=>{ if(+r.h[i]===p.ans[i]) score++; });
  p.tfng.forEach((q,i)=>{ if(r.t[i]===q[1]) score++; });
  p.sum.ans.forEach((a,i)=>{ if(r.s[i]===a) score++; });
  let qn = 0;
  let h = `<div class="panel"><h2 style="margin-top:0">${esc(p.title)}</h2><p class="muted small">Tap an underlined word to see its meaning and collocations.</p>
  <div class="passage">${p.paras.map((t,i)=>`<p><span class="pl">${LETTERS[i]}</span><span>${highlight(t)}</span></p>`).join("")}</div></div>`;
  h += `<h3>Questions ${1}–${p.paras.length}: Matching headings</h3><p class="muted small">Choose the correct heading for each paragraph. There are more headings than paragraphs.</p>
  <ol class="headlist">${order.map((hi,k)=>`<li><span class="rn">${ROMAN[k]}</span><span>${esc(p.heads[hi])}</span></li>`).join("")}</ol>`;
  p.paras.forEach((_,i)=>{ qn++;
    const sel = r.h[i]; const ok = +sel===p.ans[i];
    h += `<div class="q"><span class="qn">${qn}</span><div><label>Paragraph ${LETTERS[i]}<select class="field" data-sel="h" data-pid="${p.id}" data-i="${i}" ${c?"disabled":""}><option value="">Choose a heading</option>${order.map((hi,k)=>`<option value="${hi}" ${String(sel)===String(hi)?"selected":""}>${ROMAN[k]}. ${esc(p.heads[hi])}</option>`).join("")}</select></label>
    ${c?`<div class="mark ${ok?"ok":"bad"}">${ok?"Correct.":"Answer: "+romanOf(p.ans[i])+"."} ${esc(p.why[i])}</div>`:""}</div></div>`;
  });
  h += `<h3>Questions ${qn+1}–${qn+p.tfng.length}: True, False or Not Given</h3><p class="muted small">Not Given means the passage does not say. Do not use outside knowledge.</p>`;
  p.tfng.forEach((q,i)=>{ qn++;
    h += `<div class="q"><span class="qn">${qn}</span><div>${esc(q[0])}<div class="tf">${["TRUE","FALSE","NOT GIVEN"].map(o=>`<button data-act="tf" data-pid="${p.id}" data-i="${i}" data-v="${o}" aria-pressed="${r.t[i]===o}" ${c?"disabled":""}>${o}</button>`).join("")}</div>
    ${c?`<div class="mark ${r.t[i]===q[1]?"ok":"bad"}">${r.t[i]===q[1]?"Correct.":"Answer: "+q[1]+"."}</div>`:""}</div></div>`;
  });
  const box = p.sum.box.slice().sort();
  const start = qn+1;
  let text = esc(p.sum.text).replace(/\[(\d)\]/g,(m,n)=>{ const i=+n-1; qn++;
    const sel = r.s[i]; const ok = sel===p.sum.ans[i];
    return `<b>${start+i}</b> <select data-sel="s" data-pid="${p.id}" data-i="${i}" aria-label="Gap ${start+i}" ${c?"disabled":""}><option value="">…</option>${box.map(o=>`<option ${sel===o?"selected":""}>${esc(o)}</option>`).join("")}</select>${c?` <span class="mark ${ok?"ok":"bad"}">${ok?"✓":"("+esc(p.sum.ans[i])+")"}</span>`:""}`; });
  h += `<h3>Questions ${start}–${qn}: Summary completion</h3><p class="muted small">Choose one option from the box for each gap.</p><div class="box">${box.map(o=>`<span class="chip">${esc(o)}</span>`).join("")}</div><p class="sumtext">${text}</p>`;
  if(c){
    const band = score>=total ? "Band 9 accuracy" : score>=total-2 ? "Band 8 range" : score>=total-4 ? "Band 7 range" : "Below Band 7 — reread the explanations";
    h += `<div class="panel pop" style="margin-top:18px"><p class="score">${score} of ${total} correct</p><p class="muted">${band}. For every wrong answer, find the exact words in the passage that the question paraphrases.</p>
    <div class="row">${isToday && !state.today.steps.read ? `<button class="btn" data-act="finish" data-v="read">Finish today's session</button>`:""}<button class="btn ghost" data-act="retry" data-pid="${p.id}">Try this passage again</button></div></div>`;
  } else {
    h += `<div class="row" style="margin-top:18px"><button class="btn" data-act="check" data-pid="${p.id}">Check answers</button></div>`;
  }
  return h;
}

function viewDone(){
  const t = todayStr(); const tomorrow = addDays(t,1);
  const dueTomorrow = Object.values(state.words).filter(s=>s.due<=tomorrow).length;
  return `<div class="panel done-hero pop"><div class="big">${currentStreak()}</div><p class="muted">day streak</p>
  <p class="def">Today's session is complete.</p><p class="muted">${dueTomorrow} word${dueTomorrow===1?"":"s"} will be due for recall tomorrow.</p>
  <div class="row" style="justify-content:center"><button class="btn ghost" data-act="tab" data-v="reading">Extra reading practice</button><button class="btn ghost" data-act="tab" data-v="words">Review my words</button></div></div>`;
}

function viewReadingTab(){
  ensureToday();
  const ps = allPassages(); const sel = ui.readSel || state.today.passage;
  let h = `<h2>Reading practice</h2><p class="lede">Academic passages with matching headings, True/False/Not Given and summary completion.</p>
  <div class="plist">${ps.map(p=>`<button class="pbtn" data-act="pick" data-pid="${p.id}" aria-current="${p.id===sel}"><b>${esc(p.title)}</b><span>${p.id===state.today.passage?"Today":p.gen?"Generated":""}</span></button>`).join("")}</div>`;
  if(sampleFn){
    h += `<div class="panel" style="margin-bottom:18px"><p style="margin:0 0 8px"><b>Generate a new passage</b></p><p class="muted small" style="margin:0">Claude writes a fresh Band 8–9 passage on a new topic, with a full question set and five new words added to your bank. It takes up to a minute.</p>
    ${ui.gen.err?`<div class="fb bad">${esc(ui.gen.err)}</div>`:""}
    <div class="row"><button class="btn gold" data-act="gen" ${ui.gen.busy?"disabled":""}>${ui.gen.busy?"Writing the passage…":"Generate a new passage"}</button></div></div>`;
  }
  return h + viewPassage(sel, sel===state.today.passage);
}

function viewWords(){
  const t = todayStr();
  const list = allWords();
  const counts = {n:0,l:0,f:0,m:0};
  list.forEach(w=>{ const s=state.words[w.w]; if(!s) counts.n++; else if(s.box>=5) counts.m++; else if(s.box>=3) counts.f++; else counts.l++; });
  const q = ui.q.toLowerCase();
  const shown = list.filter(w=>!q || w.w.includes(q) || w.def.toLowerCase().includes(q));
  let h = `<h2>My words</h2><p class="lede">Each word climbs five stages as you recall it on spaced days. A miss sends it back to the start.</p>
  <div class="stats"><div class="stat"><b>${counts.n}</b><span>Not started</span></div><div class="stat"><b>${counts.l}</b><span>Learning</span></div><div class="stat"><b>${counts.f}</b><span>Familiar</span></div><div class="stat"><b>${counts.m}</b><span>Mastered</span></div></div>
  <input class="field" data-in="q" value="${esc(ui.q)}" placeholder="Search words or meanings" aria-label="Search words" style="margin-bottom:12px">
  <ul class="wlist">${shown.map(w=>{ const s=state.words[w.w]; const box=s?s.box:0; const open=ui.open===w.w;
    return `<li><button class="wrow" data-act="open" data-w="${esc(w.w)}" aria-expanded="${open}"><span class="ww">${esc(w.w)}</span><span class="wp">${esc(w.pos)}</span><span class="dots" aria-label="${s?STAGE(box):"Not started"}">${[1,2,3,4,5].map(i=>`<i class="${box>=i?"on":""}"></i>`).join("")}</span></button>
    ${open?`<div class="wbody">${wordCard(w, `${state.sentences[w.w]?`<p><span class="muted small">Your sentence</span><br>${esc(state.sentences[w.w])}</p>`:""}<p class="muted small">${s?`${STAGE(box)}. Next recall ${s.due<=t?"today":s.due}. Recalled ${s.right}, missed ${s.wrong}.`:"Not started yet."}</p>`)}</div>`:""}</li>`; }).join("")}</ul>
  <h3>Settings</h3><p class="muted small" style="margin:0 0 8px">New words per day</p>
  <div class="seg">${[3,5,8].map(n=>`<button data-act="npd" data-v="${n}" aria-pressed="${state.newPerDay===n}">${n}</button>`).join("")}</div>
  <p class="muted small">Changes apply from tomorrow's session.</p>
  <div class="row">${ui.confirmReset?`<span>Erase all progress?</span><button class="btn" data-act="reset">Erase progress</button><button class="btn ghost" data-act="noreset">Keep it</button>`:`<button class="btn ghost" data-act="askreset">Reset progress</button>`}</div>`;
  return h;
}

function renderSheet(){
  const el = document.getElementById("sheet");
  if(!ui.peek){ el.innerHTML = ""; return; }
  const w = word(ui.peek);
  el.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(w.w)}"><div class="inner">${wordCard(w)}<div class="row"><button class="btn" data-act="closepeek">Close</button></div></div></div>`;
}

/* ---------- Claude-powered feedback and generation ---------- */
async function askClaude(key, prompt){
  if(!sampleFn) return;
  if(ui.fb[key] && ui.fb[key].busy) return;
  ui.fb[key] = {text:"", busy:true}; render();
  try{
    const res = await sampleFn(prompt, {modelTier:"default", cache:false, onText:({text})=>{ ui.fb[key].text = text; const b = document.getElementById("fb-"+CSS.escape(key)); if(b) b.textContent = text; }});
    ui.fb[key] = {text: (res && res.text) || ui.fb[key].text || "No feedback came back. Tap the button again."};
  }catch(e){
    const code = e && e.code;
    ui.fb[key] = code==="not_granted" ? {err:"Feedback needs permission to use Claude. Tap the button again and choose Allow, or compare with the model answer."}
      : code==="rate_limited" ? {err:"Too many requests right now. Wait a minute and tap the button again."}
      : (e && e.text) ? {text:e.text}
      : {err:"Feedback didn't load" + (code ? " ("+code+")" : "") + ". Your sentence is kept, so tap the button to try again."};
  }
  render();
}
function examinerPrompt(w, original, text, mode){
  return `You are a strict but encouraging IELTS examiner coaching a candidate aiming for Band 9 Lexical Resource.
${mode==="para" ? `Original sentence: "${original}"\nTask: paraphrase it formally using the target word.` : "Task: write one original sentence using the target word."}
Target word: "${w.w}" (${w.pos}: ${w.def}). Typical collocations: ${w.cols.join("; ")}.
Candidate's sentence: "${text}"
Reply in plain text, no markdown, under 90 words: say whether ${mode==="para"?"the meaning is preserved and ":""}the target word is used accurately with a natural collocation, point out any grammar or register problem, then give one improved Band 9 version on a new line starting "Band 9 version:".`;
}
async function generatePassage(){
  ui.gen = {busy:true, err:""}; render();
  const avoid = allWords().map(w=>w.w).join(", ");
  const titles = allPassages().map(p=>p.title).join("; ");
  const prompt = `Create an original IELTS Academic reading practice set at Band 8-9 difficulty on a fresh academic topic (science, society, history, environment, psychology, economics or technology). Do not repeat these topics: ${titles}.
Reply with only JSON in exactly this shape:
{"title":"short title","paras":["exactly 5 paragraphs, 90-120 words each, formal academic register, containing the 5 target words below"],"heads":["exactly 7 headings: one correct heading for each paragraph that paraphrases its main idea without copying its key words, plus 2 plausible distractors"],"ans":[5 integers: index into heads of the correct heading for paragraphs A-E],"why":["5 short explanations naming the paraphrase clue for each paragraph"],"tfng":[["statement","TRUE"],["statement","FALSE"],["statement","NOT GIVEN"],["statement","TRUE or FALSE"]],"sum":{"text":"3-4 sentence summary of part of the passage with exactly four gaps written [1] [2] [3] [4]","box":["8 single words or short phrases: the 4 answers and 4 grammatically plausible distractors"],"ans":["the 4 correct options in gap order, copied exactly from box"]},"words":[exactly 5 objects {"w":"a C2 academic word used in the passage, base form, lowercase","pos":"adj|n|v|adv","ipa":"British English IPA in slashes","say":"respelling with the stressed syllable in capitals, e.g. kuh-ROB-uh-rayt","def":"clear learner definition","cols":["3 natural collocations"],"fam":"related word forms","syn":"2 paraphrase alternatives","gap":"a new academic sentence with ___ where the word goes","ans":"the exact form of the word that fits the gap","plain":"a plain, simple sentence expressing an idea the word can paraphrase","model":"a Band 9 paraphrase of that plain sentence using the word"}]}
Do not use any of these words as target words: ${avoid}.`;
  try{
    const d = await sampleFn.json(prompt, {modelTier:"default"});
    const okShape = d && typeof d.title==="string" && Array.isArray(d.paras) && d.paras.length===5 && Array.isArray(d.heads) && d.heads.length>=6 && Array.isArray(d.ans) && d.ans.length===5 && d.ans.every(a=>Number.isInteger(a)&&a>=0&&a<d.heads.length) && Array.isArray(d.tfng) && d.tfng.length>=3 && d.sum && typeof d.sum.text==="string" && Array.isArray(d.sum.box) && Array.isArray(d.sum.ans) && d.sum.ans.length===4 && d.sum.ans.every(a=>d.sum.box.includes(a));
    if(!okShape) throw {code:"shape"};
    const id = "g"+Date.now();
    const why = Array.isArray(d.why) ? d.why.slice(0,5).map(String) : ["","","","",""];
    const tfng = d.tfng.filter(q=>Array.isArray(q)&&["TRUE","FALSE","NOT GIVEN"].includes(String(q[1]).toUpperCase())).map(q=>[String(q[0]),String(q[1]).toUpperCase()]);
    state.passages.push({id, gen:true, title:d.title, paras:d.paras.map(String), heads:d.heads.map(String), ans:d.ans, why, tfng, sum:{text:d.sum.text, box:d.sum.box.map(String), ans:d.sum.ans.map(String)}});
    const have = new Set(allWords().map(w=>w.w));
    (Array.isArray(d.words)?d.words:[]).forEach(x=>{
      if(!x || typeof x.w!=="string" || have.has(x.w.toLowerCase()) || !String(x.gap||"").includes("___")) return;
      state.custom.push({w:x.w.toLowerCase(), pos:String(x.pos||""), ipa:String(x.ipa||""), say:String(x.say||""), def:String(x.def||""), cols:(Array.isArray(x.cols)?x.cols:[]).map(String).slice(0,3), fam:String(x.fam||"—"), syn:String(x.syn||""), gap:String(x.gap), ans:String(x.ans||x.w), plain:String(x.plain||""), model:String(x.model||"")});
      have.add(x.w.toLowerCase());
    });
    save(); ui.readSel = id; ui.gen = {busy:false, err:""};
  }catch(e){
    ui.gen = {busy:false, err: e.code==="not_granted" ? "Generating needs permission to use Claude. The built-in passages are still available." : e.code==="rate_limited" ? "Too many requests right now. Try again in a minute." : "The passage didn't come back in a usable form. Try generating again."};
  }
  render();
}

/* ---------- Events ---------- */
document.addEventListener("click", safe(e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, v = el.dataset.v, T = state.today;
  switch(a){
    case "tab": ui.tab = v; ui.peek = null; window.scrollTo(0,0); break;
    case "step": ui.step = v; break;
    case "finish": completeStep(v); window.scrollTo(0,0); break;
    case "rcheck": { const w = word(T.review[ui.ri]); if(!ui.rv.val.trim()) return; const ok = norm(ui.rv.val)===norm(w.ans); ui.rv.res = ok?"ok":"bad"; grade(w.w, ok && !ui.rv.hint ? true : ok); if(!ok) {} save(); break; }
    case "rhint": ui.rv.hint = true; break;
    case "rgive": { const w = word(T.review[ui.ri]); ui.rv.res="bad"; grade(w.w,false); save(); break; }
    case "rnext": ui.ri++; ui.rv = {val:"",res:null,hint:false}; if(ui.ri>=T.review.length){ completeStep("review"); ui.ri=0; } break;
    case "lnext": { const id = T.learn[ui.li]; const s = (ui.sent[id] ?? "").trim(); if(s) state.sentences[id] = s;
      if(!state.words[id]) state.words[id] = {box:1, due:addDays(todayStr(),1), right:0, wrong:0};
      save(); if(ui.li < T.learn.length-1){ ui.li++; } else { ui.li = 0; completeStep("learn"); } window.scrollTo(0,0); break; }
    case "aisent": { const id = el.dataset.id; const s = (ui.sent[id]||"").trim(); if(!s){ ui.fb["l:"+id] = {err:"Write a sentence first."}; break; } askClaude("l:"+id, examinerPrompt(word(id), "", s, "sent")); return; }
    case "pshow": ui.pv.shown = true; break;
    case "aipara": { const w = word(T.para[ui.pi]); askClaude("p:"+w.w, examinerPrompt(w, w.plain, ui.pv.val, "para")); return; }
    case "pgrade": { const id = T.para[ui.pi]; if(v==="0" && state.words[id]){ state.words[id].box = 1; state.words[id].due = addDays(todayStr(),1); save(); }
      ui.pi++; ui.pv = {val:"",shown:false}; if(ui.pi>=T.para.length){ ui.pi=0; completeStep("para"); } window.scrollTo(0,0); break; }
    case "tf": { const r = ui.read[el.dataset.pid]; r.t[el.dataset.i] = v; break; }
    case "check": ui.read[el.dataset.pid].checked = true; break;
    case "retry": ui.read[el.dataset.pid] = {h:{},t:{},s:{},checked:false}; window.scrollTo(0,0); break;
    case "pick": ui.readSel = el.dataset.pid; break;
    case "gen": generatePassage(); return;
    case "say": play(el.dataset.w, el.dataset.k, el.dataset.t); return;
    case "peek": ui.peek = el.dataset.w; break;
    case "closepeek": ui.peek = null; break;
    case "open": ui.open = ui.open===el.dataset.w ? null : el.dataset.w; break;
    case "npd": state.newPerDay = +v; save(); break;
    case "askreset": ui.confirmReset = true; break;
    case "noreset": ui.confirmReset = false; break;
    case "reset": { const keep = {custom:state.custom, passages:state.passages}; state = Object.assign(blank(), keep); ui.confirmReset=false; ui.step=null; ui.ri=ui.li=ui.pi=0; save(); break; }
  }
  render();
}));
document.addEventListener("input", safe(e => {
  const k = e.target.dataset.in; if(!k) return;
  if(k==="rv") ui.rv.val = e.target.value;
  else if(k==="pv") ui.pv.val = e.target.value;
  else if(k==="sent") ui.sent[e.target.dataset.id] = e.target.value;
  else if(k==="q"){ ui.q = e.target.value; const pos = e.target.selectionStart; render(); const f = document.querySelector('[data-in="q"]'); f.focus(); f.setSelectionRange(pos,pos); }
}));
document.addEventListener("change", safe(e => {
  const t = e.target; if(!t.dataset.sel) return;
  const r = ui.read[t.dataset.pid]; if(t.dataset.sel==="h") r.h[t.dataset.i] = t.value; else r.s[t.dataset.i] = t.value;
}));
document.addEventListener("keydown", safe(e => {
  if(e.key==="Enter" && e.target.id==="rin"){ e.preventDefault(); document.querySelector('[data-act="rcheck"]')?.click(); }
  if(e.key==="Escape" && ui.peek){ ui.peek=null; render(); }
}));
document.addEventListener("visibilitychange", () => { if(!document.hidden && state.today && state.today.date !== todayStr()){ ui.step=null; ui.ri=ui.li=ui.pi=0; render(); } });

function safe(fn){ return function(e){ try{ fn(e); }catch(err){ showErr(err); } }; }
function showErr(err){ const el = document.getElementById("errbar"); if(el){ el.textContent = "Something went wrong (" + (err && err.message || err) + "). Your progress is saved. Tap here to reload this step."; el.hidden = false; } console.error(err); }
window.addEventListener("error", ev => showErr(ev.error || ev.message));
window.addEventListener("unhandledrejection", ev => showErr(ev.reason));
render();

/* ---------- Runtime capabilities: sync across devices, Claude feedback ---------- */
(async () => {
  if(!window.claude || !window.claude.use) return;
  claude.use("sample").then(s => { if(s){ sampleFn = s; const a = document.activeElement; if(!(a && (a.tagName==="TEXTAREA"||a.tagName==="INPUT"))) render(); } }).catch(()=>{});
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    if(snap.exists){ const r = snap.data(); if(r && r.v===1 && (r.updated||0) > (state.updated||0)){ state = Object.assign(blank(), JSON.parse(JSON.stringify(r))); try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} const busy = ui.pv.val || ui.rv.val || Object.keys(ui.sent).length; if(!busy){ ui.step=null; render(); } } }
    dbRef = ref;
    if(!snap.exists) save();
  }catch(e){}
})();
</script>
