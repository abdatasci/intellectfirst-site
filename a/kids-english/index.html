<style>
/* Kids layout: big rounded play cards on a soft paper ground; one task per screen; mascot gives feedback. */
:root {
  --bg: #F6F8FB; --card: #FFFFFF; --ink: #1B2B45; --soft: #5A6B84; --line: #DCE3EE;
  --navy: #0B2545; --gold: #E2A93B; --sun: #FFD35C; --ok: #2E9E6A; --ok-bg: #E4F6EC; --bad: #D9534F; --bad-bg: #FCE9E8;
  --lv: #2F8F6B; --lv-bg: #E5F4EE;
  --title: 'Baloo 2', 'Nunito', 'Trebuchet MS', sans-serif; --body: 'Nunito', 'Trebuchet MS', -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0D1A2E; --card: #15263F; --ink: #EEF3FA; --soft: #A8B8CE; --line: #27405F; --ok-bg: #133A2A; --bad-bg: #3E1E22; --lv-bg: #17352B; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0D1A2E; --card: #15263F; --ink: #EEF3FA; --soft: #A8B8CE; --line: #27405F; --ok-bg: #133A2A; --bad-bg: #3E1E22; --lv-bg: #17352B; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--title); margin: 0; line-height: 1.1; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.top h1 { font-size: 22px; }
.top h1 small { display: block; font-family: var(--body); font-size: 12px; color: var(--soft); font-weight: 700; }
.stars { margin-left: auto; display: flex; align-items: center; gap: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 8px; font-weight: 800; font-variant-numeric: tabular-nums; cursor: pointer; }
.stars span { font-size: 20px; }
main { padding-block: 18px 90px; display: flex; flex-direction: column; gap: 18px; }
.hello { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: center; }
.hello h2 { font-size: 30px; }
.ru { color: var(--soft); font-weight: 600; font-size: .92em; }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.lvb { border: 3px solid var(--line); background: var(--card); border-radius: 18px; padding: 12px 8px; cursor: pointer; text-align: center; }
.lvb b { display: block; font-family: var(--title); font-size: 21px; }
.lvb[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--card)); }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .acts { grid-template-columns: 1fr; } .hello { grid-template-columns: 80px minmax(0, 1fr); } }
.act { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 14px; cursor: pointer; }
.act:hover { border-color: var(--lv); }
.act .ic { font-size: 40px; width: 64px; height: 64px; display: grid; place-items: center; background: var(--lv-bg); border-radius: 16px; }
.act h3 { font-size: 21px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.sec-h h2 { font-size: 24px; }

/* play */
.play { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.prog { display: flex; gap: 5px; }
.prog i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.prog i.done { background: var(--ok); } .prog i.miss { background: var(--bad); } .prog i.now { background: var(--gold); }
.ask { font-family: var(--title); font-size: clamp(24px, 4vw, 32px); font-weight: 700; }
.ask .ru { display: block; font-family: var(--body); font-size: 16px; }
.pic { font-size: clamp(84px, 18vw, 130px); text-align: center; line-height: 1.1; padding: 6px 0; user-select: none; }
.pic.small { font-size: clamp(54px, 11vw, 80px); letter-spacing: 4px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.choice { border: 3px solid var(--line); background: var(--bg); border-radius: 18px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 64px; justify-content: center; font-weight: 800; font-size: 21px; }
.choice .e { font-size: 58px; line-height: 1.1; }
.choice.right { border-color: var(--ok); background: var(--ok-bg); } .choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf .choice { font-size: 38px; }
.slots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.slot { width: 44px; height: 52px; border-bottom: 4px solid var(--line); display: grid; place-items: center; font-family: var(--title); font-size: 30px; font-weight: 800; text-transform: lowercase; }
.slot.right { border-color: var(--ok); color: var(--ok); }
.letters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.letter { width: 50px; height: 50px; border-radius: 14px; border: 3px solid var(--line); background: var(--bg); font-family: var(--title); font-size: 26px; font-weight: 800; cursor: pointer; }
.letter.used { opacity: .25; }
.scene { position: relative; height: 210px; max-width: 320px; margin: 0 auto; width: 100%; }
.scene .b, .scene .a { position: absolute; line-height: 1; }
.scene .b { font-size: 120px; left: 50%; bottom: 20px; transform: translateX(-50%); }
.scene .a { font-size: 56px; }
.scene.in .a { left: 50%; bottom: 52px; transform: translateX(-50%); font-size: 46px; z-index: 0; }
.scene.in .b { z-index: 1; clip-path: inset(38% 0 0 0); }
.scene.on .a { left: 50%; bottom: 136px; transform: translateX(-50%); }
.scene.under .b { bottom: 70px; } .scene.under .a { left: 50%; bottom: 4px; transform: translateX(-50%); }
.scene.next .a { left: calc(50% + 66px); bottom: 22px; }
.mascot-line { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 72px; }
.bubble { background: var(--bg); border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px; font-weight: 700; }
.bubble .ru { display: block; font-weight: 600; }
.bubble.ok { border-color: var(--ok); } .bubble.no { border-color: var(--bad); }
.say { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 800; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
.big { border: 0; background: var(--navy); color: #fff; border-radius: 999px; padding: 12px 26px; font-weight: 800; font-size: 19px; cursor: pointer; }
.big.alt { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
.result { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.result .got { font-size: 46px; letter-spacing: 6px; }
.new-sticker { font-size: 96px; animation: pop .6s ease-out; }
@keyframes pop { 0% { transform: scale(.2) rotate(-20deg); } 70% { transform: scale(1.15) rotate(6deg); } 100% { transform: none; } }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.stk { aspect-ratio: 1; border-radius: 18px; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 44px; background: var(--card); }
.stk.locked { font-size: 22px; color: var(--soft); font-weight: 800; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.wcard { border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 10px; text-align: center; cursor: pointer; }
.wcard .e { font-size: 54px; line-height: 1.15; }
.wcard b { display: block; font-size: 19px; }
.topic-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 700; white-space: nowrap; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--lv); border-color: var(--lv); color: #fff; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.shake { animation: shake .3s; }
@media (prefers-reduced-motion: reduce) { .shake, .new-sticker { animation: none; } }
</style>
</head>

          var need = word[filled.length];
          if (ch === need) { b.classList.add('used'); slots.children[filled.length].textContent = ch; filled.push(ch); if (filled.length === word.length) { Array.prototype.forEach.call(slots.children, function (s) { s.classList.add('right'); }); say(word); answer(true, 'Yes! ' + word + '!', 'Да! ' + q.w[1] + '!'); } }
          else { b.classList.add('shake'); setTimeout(function () { b.classList.remove('shake'); }, 300); tries++; if (tries >= 3) { word.split('').forEach(function (c, j) { slots.children[j].textContent = c; }); say(word); answer(false, 'The word is ' + word + '.', 'Это слово ' + word + ' — ' + q.w[1] + '.'); } }
        }; lets.appendChild(b); });
        var tries = 0; box.appendChild(lets);
      } else if (q.type === 'yesno') {
        var a3 = el('div', 'ask'); a3.appendChild(document.createTextNode('This is a ' + q.w[0] + '.')); a3.appendChild(el('span', 'ru', 'Это ' + q.w[1] + '? Да или нет?')); box.appendChild(a3);
        box.appendChild(el('div', 'pic', q.shown[2]));
        var tf = el('div', 'tf'); [['✅', 'Yes · Да'], ['❌', 'No · Нет']].forEach(function (x, k) { var c = el('button', 'choice'); c.type = 'button'; c.setAttribute('aria-label', x[1]); c.appendChild(el('span', '', x[0])); c.appendChild(el('span', 'ru', x[1])); c.onclick = function () { if (locked) return; var ok = k === q.a; c.classList.add(ok ? 'right' : 'wrong'); say(q.shown[0]); answer(ok, q.a === 0 ? 'Yes, it’s a ' + q.w[0] + '.' : 'No, it’s a ' + q.shown[0] + '.', q.a === 0 ? 'Да, это ' + q.w[1] + '.' : 'Нет, это ' + q.shown[1] + '.'); }; tf.appendChild(c); });
        box.appendChild(tf);
      } else if (q.type === 'grammar') {
        var G = q.g;
        var a4 = el('div', 'ask'); a4.appendChild(document.createTextNode(G.s.replace('___', '____'))); box.appendChild(a4);
        if (G.scene) box.appendChild(sceneEl(G.scene)); else box.appendChild(el('div', 'pic small', G.pic));
        var g2 = el('div', 'grid'); G.o.forEach(function (o, k) { var c = el('button', 'choice', o); c.type = 'button'; c.onclick = function () { if (locked) return; var ok = k === G.a; c.classList.add(ok ? 'right' : 'wrong'); if (!ok) g2.children[G.a].classList.add('right'); var full = G.s.replace('___', G.o[G.a]); a4.textContent = full; say(full); answer(ok, (ok ? 'Yes! ' : 'Not this time. ') + full, G.ru + ' ' + G.rule); }; g2.appendChild(c); });
        box.appendChild(g2);
      }
      box.appendChild(feedback);
    }
    next();
  }

  function cards() {
    var hd = el('div', 'sec-h'); hd.appendChild(el('h2', '', 'Picture dictionary · ' + K.levels[lvl].name)); main.appendChild(hd);
    main.appendChild(el('div', 'ru', 'Нажми на карточку, чтобы услышать слово.'));
    var topics = []; K.words[lvl].forEach(function (w) { if (topics.indexOf(w[3]) < 0) topics.push(w[3]); });
    var cur = 'all'; var chips = el('div', 'topic-chips'); var grid = el('div', 'cards');
    function draw() {
      chips.textContent = ''; ['all'].concat(topics).forEach(function (t) { var c = el('button', 'chip', t === 'all' ? 'All · Все' : t + ' · ' + (K.topics[t] || '')); c.type = 'button'; c.setAttribute('aria-pressed', String(cur === t)); c.onclick = function () { cur = t; draw(); }; chips.appendChild(c); });
      grid.textContent = ''; K.words[lvl].filter(function (w) { return cur === 'all' || w[3] === cur; }).forEach(function (w) { var c = el('button', 'wcard'); c.type = 'button'; c.appendChild(el('div', 'e', w[2])); c.appendChild(el('b', '', w[0])); c.appendChild(el('span', 'ru', w[1])); c.onclick = function () { say(w[0]); }; grid.appendChild(c); });
    }
    draw(); main.appendChild(chips); main.appendChild(grid);
  }
  function stickerBook() {
    var s = ls('stickers') || [], st = stars();
    var h = el('section', 'hello'); var o = el('div'); o.innerHTML = owl('happy', 100); h.appendChild(o);
    var t = el('div'); t.appendChild(el('h2', '', 'My sticker book')); t.appendChild(el('div', 'ru', 'Мои наклейки')); t.appendChild(el('p', '', 'You have ' + st + ' ⭐ and ' + s.length + ' of ' + K.stickers.length + ' stickers.')); t.appendChild(el('div', 'ru', 'У тебя ' + st + ' звёзд и ' + s.length + ' наклеек. Следующая — через ' + (10 - st % 10) + ' ⭐.')); h.appendChild(t); main.appendChild(h);
    var book = el('div', 'book'); K.stickers.forEach(function (x) { var c = el('div', 'stk' + (s.indexOf(x) >= 0 ? '' : ' locked'), s.indexOf(x) >= 0 ? x : '?'); book.appendChild(c); }); main.appendChild(book);
    var log = ls('log') || []; if (log.length) { main.appendChild(el('p', 'ru', 'Игр сыграно: ' + log.length + ' · Games played: ' + log.length)); }
  }

  function route() {
    if (window.speechSynthesis) speechSynthesis.cancel();
    main.textContent = ''; setLevelColor(); drawStars();
    var h = location.hash.slice(1) || 'home';
    if (['look', 'listen', 'spell', 'yesno', 'grammar', 'where'].indexOf(h) >= 0) {
      var act = ACTS.filter(function (x) { return x.id === h; })[0];
      var hd = el('div', 'sec-h'); hd.appendChild(el('h2', '', act.en + ' · ' + K.levels[lvl].name)); var back = el('a', 'say', '← Menu · Меню'); back.href = '#home'; back.style.textDecoration = 'none'; hd.appendChild(back); main.appendChild(hd);
      main.appendChild(el('div', 'ru', act.ru));
      return round(h);
    }
    if (h === 'cards') return cards();
    if (h === 'stickers') return stickerBook();
    home();
  }
  window.addEventListener('hashchange', function () { route(); scrollTo(0, 0); });
  route();
})();
</script>
