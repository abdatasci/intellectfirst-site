y the 1990s, Marvel was in financial strife. In a bid to make money, it sold film rights to characters like Spider-Man, the X-Men and the Fantastic Four. It received fees or royalties, but often very little: from the film Blade, which made $70 million, Marvel reportedly earned just $25,000."], ["", "In 1996 Marvel was forced to declare bankruptcy. It emerged in 1998 under the control of toy billionaire Isaac Perlmutter."], ["", "Marvel realised the real money would only come if it made its own films. As collateral for a huge loan, it put up the rights to ten characters, including Iron Man and Black Panther. If the films failed, it would forfeit them."], ["", "The gamble paid off. Iron Man (2008) began the Marvel Cinematic Universe, whose cumulative gross is now enormous."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why did Marvel sell film rights?", "o": ["It disliked the characters.", "It needed money.", "An employee made a mistake."], "a": 1}, {"t": "mc", "q": "How much did Marvel earn from Blade?", "o": ["$1 million", "$70 million", "$25,000"], "a": 2}, {"t": "mc", "q": "When did Marvel declare bankruptcy?", "o": ["1998", "1996", "2008"], "a": 1}, {"t": "mc", "q": "What did Marvel use as collateral?", "o": ["its offices", "the rights to ten characters", "its comics"], "a": 1}, {"t": "mc", "q": "Which film began the MCU?", "o": ["Iron Man", "Black Panther", "Blade"], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a student, Dana, telling a friend about a conversation.", "script": [["Marat", "What did your cousin say about the new Fantastic Four film?"], ["Dana", "She said she had already seen the trailer three times."], ["Marat", "And did she like it?"], ["Dana", "She told me it was the best Marvel trailer she had ever seen. She said she would book tickets the following week."], ["Marat", "Is she going with you?"], ["Dana", "She asked if I wanted to come, but I said I was busy that we ["Schools gave them turntables.", "They couldn’t afford instruments.", "They disliked guitars."], "a": 1}, {"t": "mc", "q": "What did DJ Kool Herc do?", "o": ["write ‘The Message’", "invent beatboxing", "extend the drum breaks with two turntables"], "a": 2}, {"t": "mc", "q": "What were MCs later called?", "o": ["DJs", "b-boys", "rappers"], "a": 2}, {"t": "mc", "q": "‘The Message’ was about ___.", "o": ["dancing", "social issues", "love"], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a podcast about hip-hop words.", "script": [["Host", "Hip-hop has given English lots of new words. Rap and hip-hop aren’t exactly the same, by the way: rap is a style of vocal delivery, while hip-hop is a whole culture – DJing, MCing, breakdancing and graffiti."], ["Host", "Some rap words have become mainstream. In 2003, the word ‘bling’, meaning flashy jewellery, was added to the Oxford English Dictionary."], ["Host", "Linguists have studied how rap uses rhyme. Early rap used simple couplets, but modern rappers create complex internal rhymes inside lines."], ["Host", "Hip-hop is now the most popular music genre in the United States, and there are thriving scenes everywhere, including Kazakhstan."]]}, "parts": [{"items": [{"t": "mc", "q": "What is the difference between rap and hip-hop?", "o": ["They are exactly the same.", "Rap is a vocal style; hip-hop is a culture.", "Hip-hop is older than rap."], "a": 1}, {"t": "mc", "q": "Which word was added to the dictionary in 2003?", "o": ["flow", "bling", "homie"], "a": 1}, {"t": "mc", "q": "What does ‘bling’ mean?", "o": ["a loud song", "a dance move", "flashy jewellery"], "a": 2}, {"t": "mc", "q": "How has rap rhyme changed?", "o": ["It has stopped rhyming.", "It uses only couplets.", "It has become more complex."], "a": 2}, {"t": "mc", "q": "Where is hip-hop the most popular genre?", "o": ["Kazakhstan", "the UK", "the United States"], "a": 2}]}]}, {"k": "s", "name": "Spea ked"], "a": 0}, {"t": "mc", "q": "The cat ___ at the dog.", "o": ["munched", "hissed", "bubbled"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Start from a place: ___.", "o": ["exaggerate", "originate", "spit"], "a": 1}, {"t": "mc", "q": "A feeling of tiny sharp points on your skin: ___.", "o": ["gluttony", "tingling", "swelling"], "a": 1}, {"t": "mc", "q": "Make something seem bigger than it is: ___.", "o": ["alleviate", "exaggerate", "originate"], "a": 1}, {"t": "mc", "q": "In one continuous period: in one ___.", "o": ["go", "bite", "sitting"], "a": 2}, {"t": "mc", "q": "Force food out of your mouth: ___.", "o": ["spit", "slurp", "munch"], "a": 0}, {"t": "mc", "q": "Eating and drinking far too much: ___.", "o": ["nuance", "altruism", "gluttony"], "a": 2}, {"t": "mc", "q": "Be sceptical: take it with a pinch of ___.", "o": ["pepper", "sugar", "salt"], "a": 2}, {"t": "mc", "q": "Consuming a huge amount of food quickly: binge ___.", "o": ["eating", "drinking", "watching"], "a": 0}, {"t": "mc", "q": "Online videos of people eating lots of food: ___.", "o": ["vlog", "mukbang", "ASMR"], "a": 1}, {"t": "mc", "q": "Calm sounds that give a pleasant tingle: ___.", "o": ["MC", "ASMR", "FOMO"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "The videos are <b>s</b>{} relaxing, but many people find them gross.", "a": [["upposedly"]], "pre": ["s"]}, {"t": "gap", "q": "Young viewers may be <b>s</b>{} to unhealthy eating habits.", "a": [["usceptible"]], "pre": ["s"]}, {"t": "gap", "q": "I love to <b>m</b>{} on crisps while watching films.", "a": [["unch"]], "pre": ["m"]}, {"t": "gap", "q": "The <b>c</b>{} of the cabbage was very loud.", "a": [["runch"]], "pre": ["c"]}, {"t": "gap", "q": "Listen to the meat <b>s</b>{} in the pan.", "a": [["izzle"]], "pre": ["s"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Mukbang: great or gross?", "paras": [["", "Mukbang originated in South Korea around 2010. The word combines the Korean for ‘eating’ and ‘broadcast’. It started when people who lived alone wanted company at mealtimes and began watching others eat online."], ["", "Today, mukbangers film themselves eating huge amounts of food in one sitting, often with microphones that capture every crunch and slurp. Many viewers say the sounds give them an ASMR-like tingling feeling."], ["", "Top mukbangers can earn a lot of money from views and sponsors. But the trend has critics. Doctors warn that it can promote gluttony and binge eating, and some creators have been accused of spitting out food or exaggerating how much they eat."], ["", "So is mukbang great or gross? Many experts suggest we take its claims with a pinch of salt."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Where did mukbang originate?", "o": ["Japan", "the USA", "South Korea"], "a": 2}, {"t": "mc", "q": "Why did it start?", "o": ["Restaurants wanted adverts.", "People who lived alone wanted company while eating.", "Doctors recommended it."], "a": 1}, {"t": "mc", "q": "Why do mukbangers use special microphones?", "o": ["to talk to fans", "to record music", "to capture eating sounds"], "a": 2}, {"t": "mc", "q": "What do doctors warn about?", "o": ["unhealthy eating habits", "noise levels", "too much exercise"], "a": 0}, {"t": "mc", "q": "What have some creators been accused of?", "o": ["not using microphones", "eating too slowly", "spitting out food"], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a radio interview about mukbang.", "script": [["Host", "How long has mukbang been around?"], ["Expert", "It started in South Korea about fifteen years ago. At first, viewers just wanted company while they ate dinner."], ["Host", "Do mukbangers make much money?"], ["Expert", "The top ones earn thousands of dollars a month from advertising and donations."], ["Host", "Have there been scandals?"], ["Expert", "Yes. One famous mukbanger was criticised for spitting food out off camera, and another was fined for false advertising."], ["Host", "What are the general criticisms?"], ["Expert", "Mainly that it normalises gluttony and could be harmful for viewers who are susceptible to eating disorders. On the other hand, some people simply enjoy the sounds."]]}, "parts": [{"items": [{"t": "mc", "q": "How long ago did mukbang start?", "o": ["about fifteen years ago", "about five years ago", "about fifty years ago"], "a": 0}, {"t": "mc", "q": "Why did people first watch mukbang?", "o": ["to learn cooking", "to lose weight", "for company while eating"], "a": 2}, {"t": "mc", "q": "How do top mukbangers earn money?", "o": ["TV contracts", "advertising and donations", "selling food"], "a": 1}, {"t": "mc", "q": "Why was one mukbanger fined?", "o": ["spitting food", "false advertising", "being too loud"], "a": 1}, {"t": "mc", "q": "Who might mukbang harm?", "o": ["viewers susceptible to eating disorders", "the sponsors", "the restaurants"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "onomatopoeia (sizzle, crunch, slurp, fizz); originate, exaggerate, gluttony, take it with a pinch of salt.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Have you ever watched a mukbang or ASMR video?", "Describe your favourite meal using onomatopoeia.", "Which eating sounds annoy you?", "Would you watch someone eat for an hour?"]}, {"name": "Debate", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["‘Mukbang should be banned.’ Agree or disagree?", "Is mukbang harmful for young viewers?", "Why do people enjoy watching others eat?"]}]}}]}, {"id": "u1a rained. (might / go)", "a": [["might have gone", "might've gone"]]}, {"t": "gap", "q": "If you {} me, I {} you. (ask; help)", "a": [["had asked", "'d asked"], ["would have helped", "'d have helped", "would've helped"]]}], "ex": "If I had studied, I would have passed. (study)"}, {"instr": "Complete each sentence with a word formed from the word in brackets, using the prefix mis-.", "items": [{"t": "gap", "q": "I’m sorry – I think I {} the question. Can you repeat it? (understand)", "a": [["misunderstood"]]}, {"t": "gap", "q": "The judge stopped the case and declared a {}. (trial)", "a": [["mistrial"]]}, {"t": "gap", "q": "The politician was accused of {} the public with false numbers. (lead)", "a": [["misleading"]]}, {"t": "gap", "q": "She had the {} to lose her passport on the first day of the holiday. (fortune)", "a": [["misfortune"]]}, {"t": "gap", "q": "I always {} my glasses. Have you seen them? (place)", "a": [["misplace"]]}], "ex": "There was a misunderstanding about the time. (understanding)"}]}, {"k": "v", "name": "Vocabulary", "max": 20, "w": 1, "parts": [{"instr": "Complete the words in the sentences.", "items": [{"t": "gap", "q": "Teenagers often care more about what their <b>p</b>{} think than what their parents think.", "a": [["eers"]], "pre": ["p"]}, {"t": "gap", "q": "He refused to <b>c</b>{} to the school rules and wore trainers every day.", "a": [["onform"]], "pre": ["c"]}, {"t": "gap", "q": "My little sister is so <b>g</b>{} in the mornings – she’s in a terrible mood until lunchtime.", "a": [["rumpy"]], "pre": ["g"]}, {"t": "gap", "q": "She’s a <b>r</b>{} scientist – famous all over the world.", "a": [["enowned"]], "pre": ["r"]}, {"t": "gap", "q": "Before an exam I have a little <b>r</b>{}: I always eat a banana and listen to the same song.", "a": [["itual"]], "pre": ["r"]}, {"t": "gap", "q": "The new law aims to <b>c</b>{} smoking among young people.", "a": [["urb"]], "pre": ["c"]}], "ex": "Erikson <b>c</b>oined the phrase ‘identity crisis’."}, {"instr": "Underline the correct word.", "items": [{"t": "pick", "q": "My brother is so [immature|conscientious] – he still throws food at dinner.", "a": "immature"}, {"t": "pick", "q": "He’s very [spontaneous|disorganised]: yesterday he suddenly decided to fly to Istanbul for the weekend!", "a": "spontaneous"}, {"t": "pick", "q": "Her bedroom is always [ignorant|messy] – there are clothes everywhere.", "a": "messy"}, {"t": "pick", "q": "It was really [reckless|thoughtful] of you to remember my exam date.", "a": "thoughtful"}, {"t": "pick", "q": "The 1950s brought an [well-off|outlandish] new style of clothing for young people.", "a": "outlandish"}, {"t": "pick", "q": "Young workers often get [a far cry|a raw deal] – they do the same job for less money.", "a": "a raw deal"}, {"t": "pick", "q": "A recent [poll|puberty] found that most parents worry about screen time.", "a": "poll"}, {"t": "pick", "q": "Threatening to leave someone out of the group is a [conversely|coercive] way to control them.", "a": "coercive"}], "ex": "Erikson’s theory says teens face an identity <b>crisis</b> / ritual."}, {"instr": "Complete the sentences with a word from the box. There are some words you do not need.", "items": [{"t": "gap", "q": "Many parents worry that the internet is a {} that cannot be closed once it is opened.", "a": [["Pandora's box", "Pandora’s box"]]}, {"t": "gap", "q": "The {} is still out on whether video games make people violent.", "a": [["jury"]]}, {"t": "gap", "q": "Industrialisation caused big social changes, which {} across Europe.", "a": [["rippled"]]}, {"t": "gap", "q": "He’s an {} teacher who uses games and drama in every lesson.", "a": [["innovative"]]}, {"t": "gap", "q": "You need permission from a parent or {} to go on the school trip.", "a": [["guardian"]]}, {"t": "gap", "q": "During {}, the body changes a lot and teenagers need more sleep.", "a": [["puberty"]]}], "ex": "Rabbits can <b>reproduce</b> very quickly.", "bankHtml": ["guardian", "hypocrisy", "innovative", "jury", "Pandora’s box", "puberty", "regardless", "rippled", "stagnation"]}]}, {"k": "p", "name": "Pronunciation", "max": 10, "w": 1, "parts": [{"instr": "Which word has a different sound?", "items": [{"t": "pron", "o": ["p*ee*rs", "n*ea*r", "b*ea*r"], "a": 2}, {"t": "pron", "o": ["*g*rumpy", "*g*ym", "*g*uilt"], "a": 1}, {"t": "pron", "o": ["w*or*d", "conf*or*m", "sp*or*t"], "a": 0}, {"t": "pron", "o": ["w*ai*t", "s*ai*d", "sed*a*te"], "a": 1}, {"t": "pron", "o": ["w*e*ll", "t*ee*nager", "p*ie*ce"], "a": 0}]}, {"instr": "Which is the correctly stressed syllable?", "items": [{"t": "pron", "o": ["in_te_grity", "_in_tegrity", "inte_gri_ty"], "a": 0}, {"t": "pron", "o": ["ex_ploi_tation", "_ex_ploitation", "exploi_ta_tion"], "a": 2}, {"t": "pron", "o": ["con_ver_sely", "conver_se_ly", "_con_versely"], "a": 0}, {"t": "pron", "o": ["guar_di_an", "_guar_dian", "guardi_an_"], "a": 1}, {"t": "pron", "o": ["_ma_turity", "matu_ri_ty", "ma_tu_rity"], "a": 2}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 1, "intro": "Read the article and answer the questions. One mark for each answer.", "passage": {"title": "The invention of the teenager", "paras": [["A", "Humans have always been thirteen, fifteen and nineteen, but the idea of a ‘teenager’ as a separate stage of life is surprisingly new. For most of history, young people simply moved from childhood to adult work. In the 1500s, a seven-year-old might already be helping on a farm, and by fourteen many were working full days alongside their parents."], ["B", "Industrialisation changed the type of work but not the age. In the 1800s, factories employed thousands of children, and in some families young people earned a third of the household income. There was no universal schooling, and nobody thought that adolescents needed time to ‘find themselves’."], ["C", "Everything started to change in the early twentieth century. As living standards rose, families could afford to keep their children at home – and in school – for longer. When education until fifteen became compulsory in Britain in the late 1940s, a whole generation suddenly spent its days with people of the same age instead of with adults. Young people began to create their own music, fashion and slang."], ["D", "Businesses noticed. By the 1950s, advertisers realised that teenagers had free time and pocket money, and they started to market products directly to them. Some critics complained that the ‘teenager’ had been invented by companies who wanted to cash in. Others, like the aristocrat Lady Lewisham, defended young people and said they got a raw deal from the press."], ["E", "Today, researchers say teenagers are growing up more slowly than twenty years ago: fewer have part-time jobs or driving licences at seventeen. But archaeologists remind us that, in some ways, teens haven’t changed at all. Thousands of years ago, young people were also the most innovative members of their communities – the first to try new tools and to travel to meet new groups."]]}, "parts": [{"instr": "Choose A, B, or C.", "items": [{"t": "mc", "q": "What is the main point of paragraph A?", "o": ["Children used to work less than adults.", "Farm work was the most common job for teenagers.", "The teenager is a fairly modern idea."], "a": 2}, {"t": "mc", "q": "In the 1800s, many young people ___.", "o": ["went to school until fourteen", "worked only on farms", "contributed a large part of their family’s money"], "a": 2}, {"t": "mc", "q": "Why did young people develop their own culture in the 20th century?", "o": ["Their parents encouraged them to be different.", "They earned more money in factories.", "They spent more time with people of their own age."], "a": 2}, {"t": "mc", "q": "What did some critics say in the 1950s?", "o": ["Teenagers were treated unfairly by companies.", "Companies had created the idea of the teenager.", "Young people had too little pocket money."], "a": 1}, {"t": "mc", "q": "What does Lady Lewisham’s opinion show?", "o": ["Most adults agreed with the press.", "Not everyone criticised teenagers.", "Rich people disliked teen fashion."], "a": 1}, {"t": "mc", "q": "According to paragraph E, today’s teenagers ___.", "o": ["are taking longer to do some adult things", "work more than teenagers twenty years ago", "are less creative than in the past"], "a": 0}]}, {"instr": "Which paragraph (A–E) mentions the following?", "items": [{"t": "match", "q": "a law that kept young people in education", "a": "C"}, {"t": "match", "q": "young people being the first to use new inventions", "a": "E"}, {"t": "match", "q": "children doing adult work at a very young age", "a": "A"}, {"t": "match", "q": "the use of teenagers as customers", "a": "D"}], "opts": ["A", "B", "C", "D", "E"]}]}, {"k": "w", "name": "Writing", "max": 10, "writing": {"tasks": ["Write an essay (about 250 words) with the title ‘The age of majority should be lowered to 16.’ Give arguments for and against and your own opinion.", "Write a comment for a video about youngism (about 250 words). Say whether you agree that young people are treated unfairly, with examples from your own life.", "Write an article for a school magazine (about 250 words) comparing what it was like to be a teenager in your parents’ time with being a teenager today."], "crit": [["Task completion", 4], ["Grammar", 3], ["Vocabulary", 3]]}}, {"k": "l", "name": "Listening", "max": 10, "w": 1, "parts": [{"instr": "Listen to five young people talking about the moment they first felt like an adult. Match the speakers (1–5) to the experiences (A–H).", "legend": ["travelling abroad without family", "getting a first pay cheque", "looking after a younger relative", "taking part in a traditional ceremony", "making a big mistake and fixing it", "voting for the first time", "moving into their own flat", "being asked for advice by an adult"], "opts": ["A", "B", "C", "D", "E", "F", "G", "H"], "items": [{"t": "match", "q": "Speaker 1", "a": "B"}, {"t": "match", "q": "Speaker 2", "a": "D"}, {"t": "match", "q": "Speaker 3", "a": "E"}, {"t": "match", "q": "Speaker 4", "a": "C"}, {"t": "match", "q": "Speaker 5", "a": "H"}], "audio": {"script": [["Narrator", "Speaker one."], ["Speaker 1", "For me it was my summer job at a café. When I got my first wages, I stood in the street staring at my banking app. I’d earned that money myself. I bought my mum flowers and paid for my own bus pass for the first time."], ["Narrator", "Speaker two."], ["Speaker 2", "In my family, when you turn sixteen there’s a big celebration with the whole village. The elders say a blessing and you get a special gift. I thought it would be boring, but standing there with everyone looking at me, I honestly felt like I’d crossed a line."], ["Narrator", "Speaker three."], ["Speaker 3", "I borrowed my dad’s camera without asking and dropped it. I could have hidden it, but I told him and then worked every weekend for two months to pay for the repair. When I handed him the money, he shook my hand. That was the moment."], ["Narrator", "Speaker four."], ["Speaker 4", "My parents had to go to hospital with my grandmother, so I was in charge of my two little cousins for a whole week. Cooking, school runs, homework – everything. I was exhausted, but I realised I could actually cope."], ["Narrator", "Speaker five."], ["Speaker 5", "My aunt was choosing a new laptop and she phoned me to ask which one she should buy. She actually listened to me and bought the one I recommended. It sounds small, but an adult taking my opinion seriously made me feel grown-up."]]}}, {"instr": "Listen to an interview with a youth researcher about youngism. Choose A, B, or C.", "items": [{"t": "mc", "q": "According to the researcher, youngism means ___.", "o": ["a new type of youth movement", "treating people unfairly because they are young", "young people being unkind to older people"], "a": 1}, {"t": "mc", "q": "What example does she give from the workplace?", "o": ["Young people are never offered permanent jobs.", "Managers prefer to hire older people.", "Young workers can be paid less for the same job."], "a": 2}, {"t": "mc", "q": "What does she say about schools?", "o": ["Schools give too much practical advice.", "Students have little say in what they learn.", "Teachers do not take exams seriously."], "a": 1}, {"t": "mc", "q": "Why does she think young people should be heard?", "o": ["They are more honest than older people.", "They know more about technology than adults.", "They will have to deal with the biggest future problems."], "a": 2}, {"t": "mc", "q": "What does she suggest teenagers do?", "o": ["vote at sixteen", "stop using social media", "join school or local councils"], "a": 2}], "audio": {"script": [["Host", "Today I’m talking to Dr Sara Bekova, who studies youth and society. Sara, what exactly is youngism?"], ["Expert", "It’s the mirror image of ageism. Ageism is unfair treatment of older people; youngism is when people are treated unfairly or not taken seriously just because they’re young."], ["Host", "Can you give us an example?"], ["Expert", "The clearest one is pay. In many countries the minimum wage for an eighteen-year-old is lower than for a twenty-five-year-old, even if they’re doing exactly the same job."], ["Host", "And what about at school?"], ["Expert", "School is supposed to prepare you for adult life, but students usually get no real say over the curriculum. Decisions about what they learn are made entirely without them."], ["Host", "Some people say teenagers aren’t mature enough to make those decisions."], ["Expert", "I understand that, but think about it: the young people in classrooms today are the ones who’ll have to solve problems like climate change. It makes sense to start listening to them now."], ["Host", "So what can teenagers do?"], ["Expert", "My advice is to get involved. Many schools and cities have youth councils. Join one. When adults see young people making thoughtful, well-prepared arguments, stereotypes start to break down."]]}}]},  is {} – it’s full every day.", "a": [["thriving"]]}, {"t": "gap", "q": "Video games are a {} from the board games my grandparents played.", "a": [["far cry"]]}, {"t": "gap", "q": "A good {} of the class showed that most students sleep less than seven hours.", "a": [["poll"]]}, {"t": "gap", "q": "The {} is a person who is no longer a child but not yet an adult.", "a": [["adolescent"]]}, {"t": "gap", "q": "The country changed quickly from farming to {}.", "a": [["industrialisation", "industrialization"]]}], "ex": "We worked <b>alongside</b> each other all summer.", "bankHtml": ["adolescent", "alongside", "coercive", "far cry", "industrialisation", "poll", "splendid", "thriving", "trendsetters"]}]}, {"k": "p", "name": "Pronunciation", "max": 10, "w": 1, "parts": [{"instr": "Which word has a different sound?", "items": [{"t": "pron", "o": ["w*or*m", "f*or*m", "w*ar*m"], "a": 0}, {"t": "pron", "o": ["mor*al*", "ritu*al*", "*al*so"], "a": 2}, {"t": "pron", "o": ["*th*ough", "*th*riving", "*th*eory"], "a": 0}, {"t": "pron", "o": ["m*u*sic", "p*u*berty", "r*u*sh"], "a": 2}, {"t": "pron", "o": ["r*e*cord", "r*e*nowned", "r*e*gardless"], "a": 0}]}, {"instr": "Which is the correctly stressed syllable?", "items": [{"t": "pron", "o": ["co_er_cive", "_co_ercive", "coer_cive_"], "a": 0}, {"t": "pron", "o": ["re_pro_duce", "repro_duce_", "_re_produce"], "a": 1}, {"t": "pron", "o": ["initia_tive_", "i_ni_tiative", "_i_nitiative"], "a": 1}, {"t": "pron", "o": ["regard_less_", "re_gard_less", "_re_gardless"], "a": 1}, {"t": "pron", "o": ["stere_o_type", "ste_re_otype", "_ste_reotype"], "a": 2}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 1, "intro": "Read the article and answer the questions. One mark for each answer.", "passage": {"title": "Should your phone stay in your bag?", "paras": [["A", "More than ninety per cent of eleven-year-olds in the UK now own a smartphone, and in the US around ninety-five per cent of teenagers have access to one. For many families, the question is no longer whether a child should have a phone, but how it should be used."], ["B", "Some research is worrying. A study of 17,000 young people found that girls who used social media heavily between eleven and thirteen were less satisfied with their lives a year later. For boys, the risky age was fourteen to fifteen. Researchers think this may be because girls usually go through puberty earlier."], ["C", "Other experts warn against panic. Professor Candice Odgers looked at six large reviews and found no consistent link between screen time and poor mental health. ‘There is a disconnect between what people believe and what the evidence actually says,’ she argues. Some studies even show that phones help teenagers keep friendships going."], ["D", "Many specialists agree on one thing: parents should look at their own behaviour. Young people dislike hypocrisy. If adults scroll through their phones at dinner, rules for teenagers will feel unfair and are unlikely to work."], ["E", "So what is the right age? The jury is still out. Instead of a magic number, most experts suggest looking at the individual child: their maturity, their needs and how well they can switch off. A basic phone can be a sensible first step."]]}, "parts": [{"instr": "Choose A, B, or C.", "items": [{"t": "mc", "q": "Paragraph A suggests that the main question for parents today is ___.", "o": ["whether to buy a phone at all", "which phone to buy", "how phones are used"], "a": 2}, {"t": "mc", "q": "The study in paragraph B found that ___.", "o": ["heavy social media use was linked to lower life satisfaction", "all screen time is harmful", "boys were affected more than girls"], "a": 0}, {"t": "mc", "q": "Why might the risky age be different for boys and girls?", "o": ["Boys use phones less.", "Girls get phones at a younger age.", "Girls usually reach puberty sooner."], "a": 2}, {"t": "mc", "q": "Professor Odgers believes that ___.", "o": ["the reviews she studied were wrong", "phones always improve mental health", "people’s fears are not fully supported by research"], "a": 2}, {"t": "mc", "q": "According to paragraph D, family rules about phones work better when ___.", "o": ["adults follow them too", "they are written down", "teenagers make them"], "a": 0}, {"t": "mc", "q": "What is the writer’s conclusion?", "o": ["The decision should depend on the child.", "Children should wait until sixteen.", "Basic phones are useless."], "a": 0}]}, {"instr": "Which paragraph (A–E) mentions the following?", "items": [{"t": "match", "q": "a possible benefit of phones for friendship", "a": "C"}, {"t": "match", "q": "statistics about phone ownership", "a": "A"}, {"t": "match", "q": "a suggestion for a first phone", "a": "E"}, {"t": "match", "q": "the importance of setting a good example", "a": "D"}], "opts": ["A", "B", "C", "D", "E"]}]}, {"k": "w", "name": "Writing", "max": 10, "writing": {"tasks": ["Write a blog post (about 250 words) giving advice to parents about the right age to give a child a smartphone.", "Write a story (about 250 words) that ends with the sentence: ‘If I had listened to my grandmother, none of this would have happened.’", "Write an essay (about 250 words): ‘Coming-of-age ceremonies are still important today.’ Do you agree?"], "crit": [["Task completion", 4], ["Grammar", 3], ["Vocabulary", 3]]}}, {"k": "l", "name": "Listening", "max": 10, "w": 1, "parts": [{"instr": "Listen to five people talking about stereotypes of young and old people. Match the speakers (1–5) to what they say (A–H).", "legend": ["Older people are often better with technology than we think.", "A stranger assumed I was a troublemaker.", "My grandmother is more adventurous than I am.", "Teenagers are often more hard-working than adults believe.", "I made an unfair assumption about someone.", "Young people should be paid the same as adults.", "My parents treat me like a child.", "Films create stereotypes about teenagers."], "opts": ["A", "B", "C", "D", "E", "F", "G", "H"], "items": [{"t": "match", "q": "Speaker 1", "a": "B"}, {"t": "match", "q": "Speaker 2", "a": "C"}, {"t": "match", "q": "Speaker 3", "a": "E"}, {"t": "match", "q": "Speaker 4", "a": "D"}, {"t": "match", "q": "Speaker 5", "a": "H"}], "audio": {"script": [["Narrator", "Speaker one."], ["Speaker 1", "I walked into a shop with my hood up because it was raining, and the security guard followed me round the whole time. I’m an honours student! It was humiliating to be judged like that just because I was sixteen."], ["Narrator", "Speaker two."], ["Speaker 2", "Everyone thinks old people sit at home knitting. My granny is seventy-five and she’s just come back from hiking in Nepal. I get tired walking to school, so honestly she puts me to shame."], ["Narrator", "Speaker three."], ["Speaker 3", "I was on the bus and an old man sat next to me eating biscuits. I was sure he was eating mine from my bag and I was furious. Then I found my packet still in my bag. I felt terrible – I’d been so quick to judge him."], ["Narrator", "Speaker four."], ["Speaker 4", "People say teenagers are lazy, but look at my friends. Most of them study, do sport and have part-time jobs at the weekend. We work harder than a lot of adults I know."], ["Narrator", "Speaker five."], ["Speaker 5", "Every teen movie has the same characters: the rebel, the popular girl, the nerd. Real school isn’t like that, but I think those films make adults see us in a certain way."]]}}, {"instr": "Listen to a podcast about coming-of-age ceremonies. Choose A, B, or C.", "items": [{"t": "mc", "q": "The presenters say that a Sweet Sixteen in the USA ___.", "o": ["is a religious ceremony", "always includes the gift of a car", "is a large birthday party"], "a": 2}, {"t": "mc", "q": "A quinceañera is celebrated by girls who are ___.", "o": ["fifteen", "eighteen", "sixteen"], "a": 0}, {"t": "mc", "q": "During a Bar Mitzvah, a boy ___.", "o": ["promises to follow the rules of his faith", "runs across the backs of bulls", "receives a sting from an ant"], "a": 0}, {"t": "mc", "q": "In the bullet ant ceremony, the boys ___.", "o": ["wear the gloves only once", "are sedated before it starts", "have to repeat the experience many times"], "a": 2}, {"t": "mc", "q": "What does the Hamer bull-jumping ceremony allow a young man to do?", "o": ["become a warrior", "leave his village", "get married"], "a": 2}], "audio": {"script": [["Host", "Welcome back to Around the World in Five Minutes. Today: coming-of-age ceremonies. Let’s start in the United States."], ["Guest", "Sure. Many American girls have a Sweet Sixteen – basically a big birthday party. You see stories online about girls getting a car, but that’s definitely not typical."], ["Host", "And in Latin America?"], ["Guest", "There’s the quinceañera, for girls turning fifteen. It often starts with a church service and ends with a huge family party and dancing."], ["Host", "What about Jewish communities?"], ["Guest", "At thirteen, boys have a Bar Mitzvah. They read from the holy book in public and commit to following the commandments of their faith."], ["Host", "Now, I’ve heard there’s a ceremony involving ants…"], ["Guest", "Yes, the Sateré-Mawé people in Brazil. Boys put their hands into gloves full of bullet ants, which have one of the most painful stings in the world. The ants are sedated to put them in the gloves, but they wake up quickly. And the boys must do it around twenty times before the initiation is complete."], ["Host", "Ouch. And finally, Ethiopia?"], ["Guest", "The Hamer tribe has bull jumping. A young man must run across the backs of a line of bulls. If he succeeds, he’s allowed to marry."]]}}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"ask": ["What age do you think is the right age to get a smartphone? Why?", "Describe an older person who doesn’t fit the usual stereotypes.", "What will you be doing when you are twenty-five?", "Are you more organised or disorganised? Give an example.", "What is something you regret? What would have happene r", "counsel_lor_"], "a": 1}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 1, "intro": "Read the article and answer the questions. One mark for each answer.", "passage": {"title": "Can you trust your eyes?", "paras": [["A", "In March 2023, photos of the Pope in a white puffy jacket went viral. Millions of people believed they were real. In fact, they had been created in seconds using an AI tool."], ["B", "Experiments show that people are surprisingly bad at spotting fake images. In one test, participants identified AI-generated faces correctly only about half the time – no better than chance. Even after training, their accuracy improved by just 10%."], ["C", "Fake photos are not new. For over a century, people have edited images to mislead. What is new is how easy it has become: anyone can now create a convincing fake by typing a few words."], ["D", "Real photos can also mislead when they are presented with false information. In one study, fewer than 20% of high school students questioned a photo of strangely shaped flowers that was falsely linked to a nuclear accident."], ["E", "So what can we do? Experts suggest doing a reverse image search, checking fact-checking websites and thinking carefully about the source before sharing anything. As one put it, ‘If a photo makes you very angry, that is exactly when you should slow down.’"]]}, "parts": [{"instr": "Choose A, B, or C.", "items": [{"t": "mc", "q": "What happened to the Pope photos?", "o": ["They spread quickly online.", "The Pope shared them.", "They were deleted."], "a": 0}, {"t": "mc", "q": "How good were people at identifying AI faces?", "o": ["about as good as guessing", "very accurate", "completely wrong"], "a": 0}, {"t": "mc", "q": "According to paragraph C, what is new about fake photos?", "o": ["They are much easier to make.", "They are always obvious.", "They did not exist before."], "a": 0}, {"t": "mc", "q": "What does the flower example show?", "o": ["Nuclear accidents change flowers.", "Real ph ow?", "o": ["Some groups hardly see the illusion.", "Only children see it.", "Everyone sees it the same way."], "a": 0}, {"t": "mc", "q": "What are researchers now trying to do?", "o": ["only study students", "include more diverse participants", "stop psychology studies"], "a": 1}], "audio": {"script": [["Host", "Most psychology research is done on people from WEIRD societies – that’s Western, Educated, Industrialised, Rich and Democratic."], ["Guest", "Right. And it’s even narrower than that. About two-thirds of participants in American studies are university undergraduates."], ["Host", "Why is that a problem?"], ["Guest", "Because researchers then say ‘humans do this’ or ‘humans think that’, when really they’ve only studied one small group."], ["Host", "Can you give an example?"], ["Guest", "There’s a famous illusion where two lines of the same length look different. Americans see it strongly, but some groups in southern Africa hardly see it at all."], ["Host", "So what’s changing?"], ["Guest", "Researchers are now making a real effort to include more diverse participants from around the world."]]}}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"ask": ["Describe a time when you were there for a friend.", "What makes you feel confident?", "What is something you wish were different? Use ‘If only…’.", "Have you ever made a wrong first impression?", "Describe something annoying and something exciting that happened this week."], "talk": ["‘You can’t be friends with someone you’ve only met online.’", "‘Being kind is more important than being successful.’", "‘First impressions are usually right.’"], "mode": "crit", "crit": [["Interactive communication", 10], ["Grammar and vocabulary", 5], ["Pronunciation", 5]]}}]}, {"id": "u5b", "kind": "file", "group": "u5", "ver": "B", "title": "Part 5 Test B", "focus": "5.1 Friendship and theory of mind, 5.2 Weird or normal?, 5.3 Making assumptions, 5.4 Power up your confidence, 5.5 Why it’s cool to be kind: idioms, homony estions. One mark for each answer.", "passage": {"title": "Why first impressions can be wrong", "paras": [["A", "Within a few seconds of meeting someone, our brains have already formed an opinion. We judge whether they are friendly, intelligent or trustworthy based on their face, clothes and voice."], ["B", "This ability probably helped our ancestors survive: quickly deciding whether a stranger was a threat could be a matter of life or death. Today, however, it often leads us to jump to conclusions."], ["C", "In one video experiment, teenagers chatted through a curtain and then described what they thought their partner looked like. Most of their guesses were wrong. A boy who sounded ‘sporty’ was actually an artist; a girl who sounded ‘serious’ played video games all weekend."], ["D", "Our assumptions are often based on stereotypes we have learned from films and social media. Unfortunately, these can turn into prejudice if we never question them."], ["E", "The good news is that being aware of the problem helps. Asking questions, listening carefully and giving people time can change our first impressions completely."]]}, "parts": [{"instr": "Choose A, B, or C.", "items": [{"t": "mc", "q": "How quickly do we form first impressions?", "o": ["within a few seconds", "after several meetings", "after a few days"], "a": 0}, {"t": "mc", "q": "Why did fast judgements help our ancestors?", "o": ["They helped them recognise danger.", "They helped them choose clothes.", "They helped them find food."], "a": 0}, {"t": "mc", "q": "What happened in the curtain experiment?", "o": ["Most guesses were correct.", "Most guesses about partners were wrong.", "The teens refused to guess."], "a": 1}, {"t": "mc", "q": "Where do many stereotypes come from?", "o": ["school textbooks", "our ancestors", "films and social media"], "a": 2}, {"t": "mc", "q": "What does the writer recommend?", "o": ["trusting your first impression", "avoiding new people", "asking questions and listening"], "a": 2}, {" function secCount(t,s){if(s.writing)return s.writing.crit.length;if(s.speaking){const S=s.speaking;return S.mode==='crit'?S.crit.length:S.mode==='overall'?1:S.tasks.length}return s.items.length}
function secAttempted(t,s){if(s.writing||s.speaking)return secDone(t,s)?s.max:0;return s.items.filter(it=>final(t,it)).length*s.w}
function band(p){if(p>=90)return'Excellent';if(p>=75)return'Good';if(p>=60)return'Satisfactory';if(p>=40)return'Needs revision';return'Needs a lot of revision'}

/* ---------- formatting ---------- */
function fmtPron(s){return esc(s).replace(/\*(.+?)\*/g,'<b class="snd">$1</b>').replace(/_(.+?)_/g,'<u class="str">$1</u>')}
function safeHtml(s){return esc(s).replace(/&lt;(\/?)(b|i|em|u|br|p)&gt;/g,'<$1$2>').replace(/&lt;span class=&quot;hint&quot;&gt;/g,'<span class="hint">').replace(/&lt;\/span&gt;/g,'</span>')}
function fmtStem(s,fill){
  return String(s).split('\n').map(line=>{let m=line.match(/^([AB]):\s*(.*)$/);let pre='';if(m){pre='<span class="spk">'+m[1]+'</span>';line=m[2]}
    const parts=line.split(/_{3,}/);
    return pre+parts.map(safeHtml).join(fill!=null?'<span class="blank filled">'+esc(fill)+'</span>':'<span class="blank" aria-label="gap"></span>')}).join('<br>')}

/* ---------- nav ---------- */
function shortTitle(t){return t.kind==='file'||t.kind==='progress'?('Test '+t.ver):t.title}
function groupTitle(g){const t=g[0];if(t.kind==='file')return t.title.replace(/ Test [AB]$/,'');if(t.kind==='progress')return t.title.replace(/^Progress Test /,'').replace(/ [AB]$/,'');return t.title}
function testTotal(t){return recScore(t,localRec(t)).tot}
function renderNav(){
  let h='';
  if(RT.owner)h+='<div class="tview"><button data-view="teacher" aria-pressed="'+(state.view==='teacher')+'">Teacher dashboard'+(RT.all.length?'<span class="mini">'+RT.all.length+'</span>':'')+'</button><button data-view="tests" aria-pressed="'+(state.view!=='teacher')+'">Tests</button></div>';
  for(const c of COLLECTIONS){if(!c.items.length)continue;h+='<h2>'+esc(c.name)+'</h2><ul>';
    for(const g of c.items){
      if(g.length===1){const t=g[0];const any=t.secs.some(s=>secDone(t,s)>0);
        h+='<li><button data-test="'+t.id+'" aria-current="'+(t.id===state.cur&&state.view!=='teacher')+'"><span>'+esc(t.title)+'</span><span class="mini">'+(any&&reveal(t)?testTotal(t):'')+'</span></button></li>'}
      else{h+='<li class="pair"><span class="pname">'+esc(groupTitle(g))+'</span><span class="pbtns">'+g.map(t=>'<button data-test="'+t.id+'" aria-current="'+(t.id===state.cur&&state.view!=='teacher')+'" aria-label="'+esc(t.title)+'">'+esc(t.ver)+'</button>').join('')+'</span></li>'}}
    h+='</ul>'}
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>goTest(b.dataset.test));
  $('#nav').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;save();renderAll();window.scrollTo(0,0)});
}
function viewSwitch(){if(!RT.owner)return '';const tv=state.view==='teacher';
  return '<div class="vswitch" role="group" aria-label="Switch view"><button data-v="tests" aria-pressed="'+(!tv)+'">Tests <span class="vsub">student view</span></button><button data-v="teacher" aria-pressed="'+tv+'">Teacher dashboard'+(RT.all.length?' <span class="vsub">'+RT.all.length+' result'+(RT.all.length===1?'':'s')+'</span>':'')+'</button></div>'}
function bindSwitch(){document.querySelectorAll('.vswitch [data-v]').forEach(b=>b.onclick=()=>{if(b.dataset.v==='tests'&&!TESTS.find(t=>t.id===state.cur))state.cur=TESTS[0].id;state.view=b.dataset.v;save();renderAll();window.scrollTo(0,0)})}
function goTest(id){stopAudio();stopTimer();state.view='tests';state.cur=id;state.sec=TESTS.find(t=>t.id===id).secs[0].k;save();renderAll();window.scrollTo(0,0)}

function syncNote(){
  if(!RT.ready)return '';
  if(RT.owner)return '<p class="syncnote">Teacher view. Results typed on this device are saved to the class record under the student name and class above.</p>';
  if(RT.sync==='live')return '<p class="syncnote ok">Your answers are saved to your teacher’s record as you go.</p>';
  if(RT.sync==='code')return '<p class="syncnote">When you finish, press “Send results to teacher” to get a result code for your teacher.</p>';
  return '';
}
function badge(t,s){return reveal(t)?secScore(t,s)+'/'+s.max:secDone(t,s)+'/'+secCount(t,s)}

/* ---------- question blocks ---------- */
function qBlock(t,it,n){
  const st=ts(t.id),v=st.a[it.id],fin=final(t,it),rv=reveal(t)&&fin,locked=fin||(st.handed&&!RT.owner);
  let h='<div class="q" id="q-'+it.id+'"><div class="n">'+n+'</div><div>';
  const ok=correct(it,v,st.a);
  if(it.t==='mc'||it.t==='pron'){
    if(it.t==='mc'&&it.q)h+='<div class="stem">'+fmtStem(it.q,(v!=null&&String(it.q).indexOf('___')>-1)?strip(it.o[v]):null)+'</div>';
    h+='<div class="opts">';
    it.o.forEach((o,j)=>{let c='opt';if(v===j)c+=' sel';if(rv&&(v!=null||st.marked)){if(j===v)c+=(j===it.a?' ok':' no');else if(j===it.a)c+=' key'}
      h+='<button class="'+c+'" data-id="'+it.id+'" data-j="'+j+'"'+(locked?' disabled':'')+' aria-pressed="'+(v===j)+'"><span class="l">'+L[j]+'</span><span>'+(it.t==='pron'?fmtPron(o):safeHtml(o))+'</span></button>'});
    h+='</div>';
  }else if(it.t==='gap'){
    const vals=Array.isArray(v)?v:[];const parts=String(it.q).split('{}');
    h+='<div class="stem" style="margin:0">';
    parts.forEach((p,i)=>{h+=safeHtml(p);
      if(i<parts.length-1){const cls=rv?(ok?' ok':' no'):'';const w=it.wide?' wide':'';
        h+='<input class="gap'+cls+w+'" data-gid="'+it.id+'" data-gi="'+i+'" value="'+esc(vals[i]||'')+'" size="'+(it.wide?36:Math.max(8,(vals[i]||'').length+2))+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer '+n+(parts.length>2?' gap '+(i+1):'')+'"'+(locked?' disabled':'')+'>'}});
    if(state.mode==='practice'&&!locked)h+='<button class="chk" data-chk="'+it.id+'">Check</button>';
    h+='</div>';
  }else if(it.t==='pick'){
    const okset=Array.isArray(it.a)?it.a:[it.a];
    h+='<div class="stem" style="margin:0">'+String(it.q).split(/(\[[^\]]+\])/).map(seg=>{
      if(!seg.startsWith('['))return safeHtml(seg);
      return'<span class="pk" role="group">'+seg.slice(1,-1).split('|').map(o=>{let c=v===o?'sel':'';if(rv){if(o===v)c=(okset.includes(o)?'ok':'no');else if(okset.includes(o))c='key'}
        return'<button class="'+c+'" data-pid="'+it.id+'" data-o="'+esc(o)+'"'+(locked?' disabled':'')+' aria-pressed="'+(v===o)+'">'+esc(o)+'</button>'}).join('')+'</span>'}).join('')+'</div>';
  }else if(it.t==='match'){
    const cls=rv?(ok?' ok':' no'):'';
    h+='<div class="mrow"><span class="mq">'+(it.qh?safeHtml(it.qh):safeHtml(it.q))+'</span><select data-mid="'+it.id+'" class="'+cls.trim()+'"'+(locked?' disabled':'')+' aria-label="Answer for '+esc(strip(it.q))+'"><option value="">Choose…</option>'+(it.part.opts||[]).map(o=>'<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>';
  }else if(it.t==='stress'){
    h+='<div class="syl" role="group" aria-label="'+esc(it.w.join(''))+'">'+it.w.map((s,j)=>{let c=v===j?'sel':'';if(rv){if(j===v)c=(j===it.a?'ok':'no');else if(j===it.a)c='key'}
      return'<button class="'+c+'" data-sid="'+it.id+'" data-j="'+j+'"'+(locked?' disabled':'')+' aria-pressed="'+(v===j)+'">'+esc(s)+'</button>'}).join('')+'</div>';
  }
  if(rv&&(filled(it,v)||st.marked))h+='<div class="verdict '+(ok?'ok">Correct':'no">Answer: '+esc(keyText(it)))+'</div>';
  return h+'</div></div>';
}
function partsBlock(t,s,withAudio){
  let h='',n=0;
  (s.parts||[]).forEach((p,pi)=>{
    if(p.title||(s.parts.length>1&&p.instr)){h+='<h3 class="part">'+(s.parts.length>1?'Exercise '+(pi+1)+(p.title?': '+esc(p.title):''):esc(p.title||''))+'</h3>';n=0}
    if(p.instr)h+='<p class="ex-note">'+esc(p.instr)+'</p>';
    if(withAudio&&p.audio)h+=playerHtml(t,pi);
    if(p.ex)h+='<p class="ex-note">Example: '+safeHtml(p.ex)+'</p>';
    if(p.legend)h+='<div class="legend">'+p.legend.map((l,i)=>'<span><b>'+L[i]+'</b>'+esc(l)+'</span>').join('')+'</div>';
    if(p.bankHtml)h+='<div class="bankbox">'+p.bankHtml.map(b=>'<span>'+safeHtml(b)+'</span>').join('')+'</div>';
    if(withAudio&&p.audio&&teacherUI()&&ts(t.id).script&&ts(t.id).script[pi])h+='<div class="script" id="lscript'+pi+'">'+p.audio.script.map((ln,i)=>'<p data-line="'+i+'"><b>'+esc(ln[0])+':</b> '+esc(ln[1])+'</p>').join('')+'</div>';
    p.items.forEach(it=>{n++;h+=qBlock(t,it,n)});
  });
  return h;
}
function renderSec(t,s){
  let h='<h2>'+esc(s.name)+'</h2>';
  if(s.passage){
    h+='<p class="focus" style="color:var(--muted)">'+esc(s.intro||'')+'</p><div class="reading"><article class="text"><h3>'+esc(s.passage.title)+'</h3>'+s.passage.paras.map(([l,p])=>'<p>'+(l?'<b class="lab">'+esc(l)+'</b>':'')+esc(p)+'</p>').join('')+'</article><div>'+partsBlock(t,s)+'</div></div>';
    return h;
  }
  if((s.listen||(s.k==='l'&&(s.parts||[]).some(p=>p.audio))))return h+renderListening(t,s);
  if(s.writing)return h+renderWriting(t,s);
  if(s.speaking)return h+renderSpeaking(t,s);
  return h+partsBlock(t,s);
}
function afterAnswer(t,it){refreshQ(t,it);renderTabs();renderLedger();renderNav();queueSync()}
function bindSec(t,s){
  const st=ts(t.id),root=$('#sec');
  const item=id=>s.items.find(x=>x.id===id);
  const lockedAll=()=>st.handed&&!RT.owner;
  root.onclick=e=>{
    const b=e.target.closest('button');if(!b||b.disabled||lockedAll())return;
    if(b.dataset.id!=null||b.dataset.sid!=null){const it=item(b.dataset.id||b.dataset.sid);if(final(t,it))return;st.a[it.id]=+b.dataset.j;save();afterAnswer(t,it);return}
    if(b.dataset.pid!=null){const it=item(b.dataset.pid);if(final(t,it))return;st.a[it.id]=b.dataset.o;save();afterAnswer(t,it);return}
    if(b.dataset.chk!=null){const it=item(b.dataset.chk);if(!filled(it,st.a[it.id])){const inp=root.querySelector('[data-gid="'+it.id+'"]');if(inp)inp.focus();return}st.chk[it.id]=true;save();afterAnswer(t,it);return}
  };
  root.oninput=e=>{const el=e.target;if(el.dataset.gid==null||lockedAll())return;const it=item(el.dataset.gid);const arr=Array.isArray(st.a[it.id])?st.a[it.id].slice():[];arr[+el.dataset.gi]=el.value;st.a[it.id]=arr;if(!it.wide)el.size=Math.max(8,el.value.length+2);save();queueSync();if(state.mode==='exam'){renderTabs();renderLedger()}};
  root.onkeydown=e=>{const el=e.target;if(e.key!=='Enter'||el.dataset.gid==null||state.mode!=='practice')return;const it=item(el.dataset.gid);if(filled(it,st.a[it.id])){st.chk[it.id]=true;save();afterAnswer(t,it)}};
  root.onchange=e=>{const el=e.target;if(el.dataset.mid==null||lockedAll())return;const it=item(el.dataset.mid);if(final(t,it))return;if(el.value)st.a[it.id]=el.value;else delete st.a[it.id];save();afterAnswer(t,it)};
  if((s.listen||(s.k==='l'&&(s.parts||[]).some(p=>p.audio))))bindListening(t,s);
  if(s.writing)bindWriting(t,s);
  if(s.speaking)bindSpeaking(t,s);
}
function refreshQ(t,it){const el=document.getElementById('q-'+it.id);if(!el)return;const n=el.querySelector('.n').textContent;el.outerHTML=qBlock(t,it,n);
  (it.part.items||[]).forEach(x=>{if(x!==it&&x.grp&&x.grp===it.grp){const e2=document.getElementById('q-'+x.id);if(e2){const n2=e2.querySelector('.n').textContent;e2.outerHTML=qBlock(t,x,n2)}}})}
function renderTabs(){const t=T();if(state.view==='teacher')return;document.querySelectorAll('.tabs [data-sec]').forEach(b=>{const s=secOf(t,b.dataset.sec);b.querySelector('.badge').textContent=badge(t,s)})}

/* ---------- result codes ---------- */
function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function pack(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if('CompressionStream' in window){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return 'IFA1.'+b64u(buf)}catch(e){}}
  return 'IFA0.'+b64u(raw)}
async function unpack(code){code=String(code).trim().replace(/\s+/g,'');const m=code.match(/^IFA([01])\.(.+)$/);if(!m)throw new Error('This doesn’t look like an IF Academy result code.');
  let bytes=unb64u(m[2]);if(m[1]==='1'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(bytes))}

/* ---------- database sync ---------- */
const slug=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x';
function recordFor(t){const st=ts(t.id);return {aj:JSON.stringify(st.a||{}),wt:st.wt==null?null:st.wt,wr:st.wr||'',wai:st.ai?JSON.stringify(st.ai):'',marked:!!st.marked,handed:!!st.handed,plays:st.plays||{},upd:new Date().toISOString(),mode:state.mode}}
let syncing=false,syncAgain=false,docExists={};
function queueSync(now){if(!RT.db||(RT.sync!=='live'&&!RT.owner))return;clearTimeout(saveTimer);saveTimer=setTimeout(doSync,now?50:2500)}
function currentKey(){if(RT.owner){if(!state.name.trim())return null;return 'dev-'+slug(state.name)+'--'+slug(state.cls)}return RT.uid}
async function doSync(){
  if(syncing){syncAgain=true;return}
  const key=currentKey();if(!key||!RT.db)return;const t=T();if(!t)return;
  syncing=true;
  try{
    const ref=RT.db.doc('results/'+key);
    const rec=recordFor(t);
    if(RT.owner){const st=ts(t.id);rec.tmj=JSON.stringify({w:st.w||{},s:st.s||{}})}
    const head={name:state.name||'',cls:state.cls||'',updated:new Date().toISOString(),src:RT.owner?'device':'student'};
    if(!docExists[key]){const g=await ref.get();docExists[key]=g.exists;
      if(!g.exists){await ref.set(Object.assign({},head,{tests:{[t.id]:rec}}));docExists[key]=true;syncing=false;if(syncAgain){syncAgain=false;doSync()}return}}
    await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}));
    RT.writeErr=null;
  }catch(e){
    if(!RT.owner&&e&&e.code==='invalid_argument'){RT.sync='code';RT.writeErr=null;renderAll()}
    else if(e&&e.code==='quota_exceeded'){RT.writeErr='The class record is full. Ask your teacher to remove old results.';renderLedger()}
    else if(e&&e.code==='unavailable'){setTimeout(queueSync,4000)}

async function initRuntime(){

  if(user){try{RT.owner=await user.isOwner();RT.uid=await user.id();RT.canWrite=await user.can('data.write')}catch(e){}}
  if(RT.owner&&db){RT.sync='owner';subscribeAll()}
  else if(db&&user&&RT.uid&&RT.canWrite!==false){RT.sync='live';subscribeMine()}

  if(!list.length)h+='<tr><td colspan="7" class="empty">'+(all.length?'No results match these filters.':'No results yet. They appear here when students work on a test or when you import a result code.')+'</td></tr>';
  list.forEach((r,i)=>{const key=r.doc+'|'+r.id;const status=r.r.handed?'Handed in':r.r.marked?'Marked':'In progress';
    h+='<tr class="'+(TV.sel===key?'on':'')+'" data-row="'+esc(key)+'" tabindex="0"><td>'+esc(r.name)+(r.src==='import'?' <span class="tag">code</span>':r.src==='device'?' <span class="tag">device</span>':'')+'</td><td>'+esc(r.cls)+'</td><td>'+esc(r.t.title)+'</td><td>'+status+(r.sc.pending?'<span class="tag warn">to mark</span>':'')+'</td><td class="num">'+r.sc.auto+' / '+r.sc.autoMax+'</td><td class="num"><b>'+r.sc.tot+'</b> / '+r.sc.max+'</td><td>'+esc(fmtTime(r.upd))+'</td></tr>'});
  h+='</tbody></table></div>';
  h+='<div id="detail">'+(TV.sel?detailHtml(all.find(r=>r.doc+'|'+r.id===TV.sel)):'')+'</div>';
  h+='<section class="task share"><h3>Sending a test to students</h3><ol class="steps"><li>Open the <b>Share</b> menu at the top of this page and copy the link. Every student uses the same link.</li><li>Tell the class which test to open, for example “Part 2, Test A”. On a phone they choose it from the <b>Test</b> list at the top; on a computer, from the list on the left.</li><li>Students type their name and class on the test. If they’re signed in to your organization with Contributor access, their results appear here as they work. Anyone else presses <b>Send results to teacher</b> and sends you the code to paste below.</li></ol><p class="meta">To see a test exactly as students see it, press <b>Tests</b> at the top. Answers you type there are saved under the name and class you enter, so leave those blank, or use your own name, when you’re only checking a test.</p></section>';
  h+='<section class="task"><h3>Import a result code</h3><p class="meta">Paste the code a student sent you. It’s rescored from their answers and added to the class record.</p><textarea id="impta" class="imp" placeholder="IFA1.…"></textarea><div class="row" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="go" id="impbtn"'+(RT.db?'':' disabled')+'>Import</button><span id="impmsg" class="meta">'+esc(TV.msg)+'</span></div></section>';
  const m=$('#main');const y=window.scrollY;m.innerHTML=h;if(keepScroll)window.scrollTo(0,y);
  $('#ftest').onchange=e=>{TV.test=e.target.value;renderTeacher(true)};
  $('#fcls').onchange=e=>{TV.cls=e.target.value;renderTeacher(true)};
  $('#fq').oninput=e=>{TV.q=e.target.value;const p=e.target.selectionStart;renderTeacher(true);const f=$('#fq');f.focus();f.setSelectionRange(p,p)};
  m.querySelectorAll('[data-row]').forEach(tr=>{const go=()=>{TV.sel=TV.sel===tr.dataset.row?null:tr.dataset.row;renderTeacher(true);const d=$('#detail');if(d&&TV.sel)d.scrollIntoView({behavior:'smooth',block:'start'})};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  const cb=$('#csvbtn');if(cb)cb.onclick=()=>downloadCsv(list);
  $('#impbtn').onclick=importCode;bindSwitch();
  bindDetail(all);
}
function detailHtml(r){
  if(!r)return '';const t=r.t,rec={a:recA(r.r)},tm=recTM(r.r)||{s:{},w:{}};
  let h='<section class="detail"><div class="dhead"><div><h2>'+esc(r.name)+(r.cls?' <span class="muted">'+esc(r.cls)+'</span>':'')+'</h2><p class="meta">'+esc(t.title)+'. '+r.answered+' of '+r.items+' questions answered. Updated '+esc(fmtTime(r.upd))+'.</p></div><div class="big"><span class="num">'+r.sc.tot+'</span><span class="of">/ '+r.sc.max+'</span></div></div>';
  if(r.r.dm)h+='<p class="syncnote">The writing and speaking marks below were entered on the student’s device. Check them and change any that aren’t yours.</p>';h+='<div class="secscores">'+t.secs.map(s=>'<div><span>'+s.name+'</span><b>'+r.sc.secs[s.k]+' / '+s.max+'</b></div>').join('')+'</div>';
  t.secs.forEach(s=>{
    if(s.writing){const W=s.writing;
      h+='<h3 class="part">Writing</h3>'+(r.r.wt!=null&&W.tasks?'<p class="meta">Task chosen: '+(r.r.wt+1)+'</p>':'')+'<div class="wrview">'+(r.r.wr?esc(r.r.wr).replace(/\n/g,'<br>'):'<span class="muted">No writing yet.</span>')+'</div><p class="meta">'+wc(r.r.wr)+' words</p>';
      h+=W.crit.map((c,i)=>rateRow('data-tw',i,c[1],(tm.w||{})[i],c[0]+' (0–'+c[1]+')')).join('<div style="height:6px"></div>')+'<div class="aiw-slot"></div>';return}
    if(s.speaking){const S=s.speaking;h+='<h3 class="part">Speaking</h3><p class="meta">Mark after listening to the student in class.</p>';
      if(S.mode==='crit')h+=S.crit.map((c,i)=>rateRow('data-ts',i,c[1],(tm.s||{})[i],c[0]+' (0–'+c[1]+')')).join('<div style="height:6px"></div>');
      else if(S.mode==='overall')h+=rateRow('data-ts',0,S.max,(tm.s||{})[0],'Mark (0–'+S.max+')');
      else h+=speakTasks(S).map((tk,i)=>rateRow('data-ts',i,10,(tm.s||{})[i],'Task '+(i+1))).join('<div style="height:6px"></div>');
      return}
    const wrong=s.items.filter(it=>!correct(it,rec.a[it.id],rec.a)).length;
    h+='<details class="ans"><summary><b>'+s.name+'</b> '+r.sc.secs[s.k]+' / '+s.max+(wrong?' <span class="muted">('+wrong+' wrong or blank)</span>':'')+'</summary><table class="atable"><thead><tr><th>#</th><th>Question</th><th>Answer</th><th>Key</th></tr></thead><tbody>';
    let n=0;(s.parts||[]).forEach(p=>{p.items.forEach(it=>{n++;const v=rec.a[it.id];const ok=correct(it,v,rec.a);
      const q=strip(it.t==='stress'?it.w.join(''):it.t==='mc'&&!it.q?(it.o||[]).join(' / '):it.qh||it.q||'').replace(/\{\}/g,'___').replace(/\[([^\]]*)\]/g,(m,x)=>'['+x.replace(/\|/g,' / ')+']');
      h+='<tr class="'+(ok?'ok':'no')+'"><td>'+n+'</td><td>'+esc(q.length>110?q.slice(0,108)+'…':q)+'</td><td>'+esc(ansText(it,v))+'</td><td>'+(ok?'✓':esc(keyText(it)))+'</td></tr>'})});
    h+='</tbody></table></details>';
  });
  h+='<div class="row" style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="ghost" id="delrec">Remove this result</button></div></section>';
  return h;
}
function bindDetail(all){
  if(!TV.sel)return;const r=all.find(x=>x.doc+'|'+x.id===TV.sel);if(!r)return;
  const setMark=async(kind,i,n)=>{const tm=JSON.parse(JSON.stringify(recTM(r.r)||{s:{},w:{}}));tm[kind]=tm[kind]||{};if(tm[kind][i]===n)delete tm[kind][i];else tm[kind][i]=n;
    r.r.tmj=JSON.stringify(tm);renderTeacher(true);
    try{await RT.db.doc('results/'+r.doc).update({tests:{[r.id]:{tmj:JSON.stringify(tm)}}})}catch(e){TV.msg='Couldn’t save the mark. Try again.';renderTeacher(true)}};
  document.querySelectorAll('[data-tw]').forEach(b=>b.onclick=()=>setMark('w',+b.dataset.tw,+b.dataset.n));
  const aslot=document.querySelector('.aiw-slot'),wsec=r.t.secs.find(x=>x.writing);if(aslot&&wsec&&window.IFAIW){const txt=r.r.wr||'';let sv=null;try{sv=r.r.wai?JSON.parse(r.r.wai):null}catch(e){}
    IFAIW.panel(aslot,Object.assign(aiwCfg(r.t,wsec,r.r.wt),{key:'t:'+TV.sel+':'+IFAIW.hash(txt),mode:'teacher',getText:()=>txt,stored:sv&&sv.h===IFAIW.hash(txt)?sv:null,
      apply:async res=>{const tm=JSON.parse(JSON.stringify(recTM(r.r)||{s:{},w:{}}));tm.w={};res.s.forEach((v,i)=>tm.w[i]=v);r.r.tmj=JSON.stringify(tm);renderTeacher(true);
        try{await RT.db.doc('results/'+r.doc).update({tests:{[r.id]:{tmj:JSON.stringify(tm)}}})}catch(e){TV.msg='Couldn’t save the mark. Try again.';renderTeacher(true)}}}))}
  document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>setMark('s',+b.dataset.ts,+b.dataset.n));
  const del=$('#delrec');if(del)del.onclick=async()=>{if(!await uiConfirm('Remove '+r.name+'’s result for '+r.t.title+'? This can’t be undone.'))return;
    try{const ref=RT.db.doc('results/'+r.doc);const g=await ref.get();if(g.exists){const d=JSON.parse(JSON.stringify(g.data()));delete (d.tests||{})[r.id];
      if(Object.keys(d.tests||{}).length)await ref.set(d);else await ref.delete()}TV.sel=null}catch(e){TV.msg='Couldn’t remove that result.'}renderTeacher(true)};
}
async function importCode(){
  const raw=$('#impta').value;if(!raw.trim())return;
  try{const o=await unpack(raw);const t=TESTS.find(x=>x.id===o.id);if(!t)throw new Error('That code is for a test this page doesn’t have.');
    if(!o.n)throw new Error('The code has no student name.');
    const key='imp-'+slug(o.n)+'--'+slug(o.c);const ref=RT.db.doc('results/'+key);const g=await ref.get();
    const rec={aj:JSON.stringify(o.a||{}),wt:o.wt==null?null:o.wt,wr:o.wr||'',marked:true,handed:true,plays:o.pl||{},upd:o.at||new Date().toISOString(),mode:'code'};
    const prev=g.exists&&g.data().tests&&recTM(g.data().tests[o.id]);const dm=o.m&&(Object.keys(o.m.s||{}).length||Object.keys(o.m.w||{}).length);if(prev&&(Object.keys(prev.s||{}).length||Object.keys(prev.w||{}).length))rec.tmj=JSON.stringify(prev);else if(dm){rec.tmj=JSON.stringify({s:o.m.s||{},w:o.m.w||{}});rec.dm=true}
    if(g.exists)await ref.update({name:o.n,cls:o.c||'',updated:new Date().toISOString(),src:'import',tests:{[o.id]:rec}});
    else await ref.set({name:o.n,cls:o.c||'',updated:new Date().toISOString(),src:'import',tests:{[o.id]:rec}});
    const sc=recScore(t,{a:o.a||{},s:{},w:{}});
    TV.msg='Imported '+o.n+(o.c?' ('+o.c+')':'')+', '+t.title+': '+sc.auto+' / '+sc.autoMax+' on the automatically marked sections.';TV.sel=key+'|'+o.id;$('#impta').value='';
  }catch(e){TV.msg=(e&&e.message)||'That code couldn’t be read. Check it was copied in full.'}
  renderTeacher(true);
}
async function downloadCsv(list){
  const head=['Student','Class','Test','Status','Updated'].concat(['Grammar','Vocabulary','Pronunciation','Reading','Writing','Listening','Speaking'],['Total','Max','Percent']);
  const keyOf={Grammar:'g',Vocabulary:'v',Pronunciation:'p',Reading:'r',Writing:'w',Listening:'l',Speaking:'s'};
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')].concat(list.map(r=>[r.name,r.cls,r.t.title,r.r.handed?'Handed in':r.r.marked?'Marked':'In progress',r.upd].concat(['Grammar','Vocabulary','Pronunciation','Reading','Writing','Listening','Speaking'].map(n=>{const s=secOf(r.t,keyOf[n]);return s?r.sc.secs[s.k]:''}),[r.sc.tot,r.sc.max,Math.round(r.sc.tot/r.sc.max*100)]).map(q).join(',')));
  try{await RT.downloads.save({filename:'if-academy-c1-results.csv',data:new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'})})}catch(e){}
}
function renderTeacherLedger(){
  const all=rows();const students=new Set(all.map(r=>r.doc));const toMark=all.filter(r=>r.sc.pending&&(r.r.marked||r.r.handed)).length;
  let h='<div class="card-l"><div class="t">Class record</div><div class="st">'+(RT.db?'Live':'Not available in this view')+'</div>'+
    '<div class="big"><span class="num">'+all.length+'</span><span class="of">results</span></div><div class="pct">'+students.size+' student'+(students.size===1?'':'s')+(toMark?'<br><b>'+toMark+'</b> handed in and waiting for writing or speaking marks':'')+'</div>'+
    '<p class="src">Students who are members of your organization with Contributor access save automatically. Students outside it use “Send results to teacher” and send you the code. Results typed on your own device are saved under the name and class entered on the test.</p></div>';
  $('#ledger').innerHTML=h;
  $('#mtotal').innerHTML='<span>Teacher dashboard</span><b>'+all.length+'</b><button id="mjump">Summary</button>';
  $('#mjump').onclick=()=>$('#ledger').scrollIntoView({behavior:'smooth'});
}

function renderAll(){renderNav();renderMain();renderLedger()}
renderAll();
initRuntime();
})();
