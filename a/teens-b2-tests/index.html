re": ["f"]}, {"t": "gap", "q": "So, to <b>r</b>{}: sleep well and read questions twice.", "a": [["ecap"]], "pre": ["r"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Whoops, I forgot to study!", "paras": [["", "If you completely blanked on tomorrow’s exam, it’s time to cram. Find past papers, study the model answers and read chapter summaries. But don’t pull an all-nighter – sleep helps memory."], ["", "On exam day, write down key facts in the first five minutes, then skim the paper. Try a hard question early: if you can’t answer it, move on – your brain will keep working on it."], ["", "One study found that ‘true’ answers are more common than ‘false’ (56% vs 44%), and the next answer is different from the previous one 63% of the time. On four-choice tests, B was correct about 28% of the time."], ["", "Finally, go with your gut: correct answers often feel familiar."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "What should you NOT do when cramming?", "o": ["use past papers", "stay up all night", "read summaries"], "a": 1}, {"t": "mc", "q": "What should you do in the first five minutes?", "o": ["write down key facts", "answer the easiest question", "read the last page"], "a": 0}, {"t": "mc", "q": "Why try a hard question early?", "o": ["It gives more marks.", "Your brain keeps working on it.", "Teachers check it first."], "a": 1}, {"t": "mc", "q": "Which answer is more common in true/false tests?", "o": ["true", "false", "both equally"], "a": 0}, {"t": "mc", "q": "How often was B correct on four-choice tests?", "o": ["about 28%", "56%", "25%"], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear four students talking about how they study.", "script": [["Narrator", "Speaker one."], ["Speaker 1", "I can’t stand silence when I study, so I always have music on. And I write questions for myself on the topic and try to answer them."], ["Narrator", "Speaker two."], ["Speaker 2", "I explain everything out loud to my dog. He’s a great listener! If I can explain it simply, I know I understand it."], ["Narrator", "Speaker three."], ["Speaker 3", "I use a flashcard app on the bus every morning. It’s only twenty minutes, but it adds up."], ["Narrator", "Speaker four."], ["Speaker 4", "To be honest, I procrastinate a lot. I put the TV on ‘for background’ and then I end up watching it."]]}, "parts": [{"items": [{"t": "mc", "q": "What does Speaker 1 do?", "o": ["writes questions for herself", "studies with a dog", "uses an app"], "a": 0}, {"t": "mc", "q": "Who does Speaker 2 explain things to?", "o": ["her dog", "her teacher", "her sister"], "a": 0}, {"t": "mc", "q": "Where does Speaker 3 use flashcards?", "o": ["on the bus", "in the library", "in bed"], "a": 0}, {"t": "mc", "q": "How long is Speaker 3’s journey?", "o": ["five minutes", "an hour", "twenty minutes"], "a": 2}, {"t": "mc", "q": "What does Speaker 4 admit?", "o": ["procrastinating", "sleeping in class", "cheating"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "command words (define, explain, compare and contrast, argue); cram, skim, blank on, recap, go with your gut.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["How do you prepare for exams?", "Have you ever blanked on something in an exam?", "Do you ever go with your gut on multiple-choice questions?", "Which command word do you find hardest?"]}, {"name": "Task", "mins": 3, "lead": "The teacher gives a command word; the student answers using it correctly.", "prompts": ["Define ‘procrastination’.", "Compare and contrast cramming and spaced repetition.", "Argue for or against: ‘Exams are the best way to test students.’"]}]}}]}, {"id": "t41", "kind": "quick", "group": "t4.1", "title": "Unit 4.1 Test", "focus": "4.1 The distraction dilemma: informal language: reductions (dunno, gonna), ellipsis, slang (sus, whatevs, innit, FOMO), idioms; distraction vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "‘Dunno’ means ___.", "o": ["I do know", "Don’t go", "I don’t know"], "a": 2}, {"t": "mc", "q": "‘You gonna?’ is an example of ___.", "o": ["ellipsis", "a simile", "a metaphor"], "a": 0}, {"t": "mc", "q": "In ‘You gonna?’, the missing word is ___.", "o": ["are", "do", "will"], "a": 0}, {"t": "mc", "q": "‘That guy looks a bit sus’ means he looks ___.", "o": ["suspicious", "successful", "sad"], "a": 0}, {"t": "mc", "q": "‘Whatevs’ shows that you ___.", "o": ["are surprised", "don’t care", "agree strongly"], "a": 1}, {"t": "mc", "q": "‘It’s cold, innit?’ – ‘innit’ means ___.", "o": ["in it", "I know it", "isn’t it"], "a": 2}, {"t": "mc", "q": "FOMO stands for ___.", "o": ["full of mobile obsession", "fear of missing out", "fun of meeting others"], "a": 1}, {"t": "mc", "q": "‘I’m pulling your leg’ means I’m ___.", "o": ["joking", "helping you", "hurting you"], "a": 0}, {"t": "mc", "q": "‘He’s my mate’ means he’s my ___.", "o": ["enemy", "teacher", "friend"], "a": 2}, {"t": "mc", "q": "Informal language like this is appropriate ___.", "o": ["in an exam essay", "in a job interview", "with friends and family"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "The stopping of something is ___.", "o": ["cessation", "determinant", "crest"], "a": 0}, {"t": "mc", "q": "Changing from one activity to another is ___.", "o": ["transitioning", "rehabilitating", "hijacking"], "a": 0}, {"t": "mc", "q": "A factor that decides what happens is a ___.", "o": ["trigger", "cessation", "determinant"], "a": 2}, {"t": "mc", "q": "Taking control of something is ___.", "o": ["cresting", "hijacking", "transitioning"], "a": 1}, {"t": "mc", "q": "A moment between two activities is ___.", "o": ["external", "liminal", "addicting"], "a": 1}, {"t": "mc", "q": "Notification sounds are ___ and dings.", "o": ["bells", "rings", "pings"], "a": 2}, {"t": "mc", "q": "Helping someone recover is ___.", "o": ["rehabilitation", "cessation", "determinant"], "a": 0}, {"t": "mc", "q": "Feelings like boredom that lead to distraction are ___ triggers.", "o": ["external", "liminal", "internal"], "a": 2}, {"t": "mc", "q": "Phone notifications are ___ triggers.", "o": ["liminal", "external", "internal"], "a": 1}, {"t": "mc", "q": "Let the urge ___ like a wave, then pass.", "o": ["transition", "hijack", "crest"], "a": 2}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Some apps are designed to be <b>a</b>{} – also called addictive.", "a": [["ddicting"]], "pre": ["a"]}, {"t": "gap", "q": "It can take over twenty minutes to <b>r</b>{} after an interruption.", "a": [["efocus"]], "pre": ["r"]}, {"t": "gap", "q": "Nir Eyal studies <b>d</b>{} and how to avoid it.", "a": [["istraction"]], "pre": ["d"]}, {"t": "gap", "q": "Plan your day: <b>t</b>{} time for email and social media.", "a": [["imebox"]], "pre": ["t"]}, {"t": "gap", "q": "Notice the <b>u</b>{} to check your phone, but don’t act on it.", "a": [["rge"]], "pre": ["u"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Five ways to beat distraction", "paras": [["", "Writer Nir Eyal first tried to beat distraction by buying a basic flip phone and an old laptop without internet. It didn’t work: he found new distractions, like reading books he didn’t need to read. He realised he had focused only on external triggers, the pings and dings, and ignored internal triggers such as boredom and loneliness."], ["", "His first tip is to ‘surf the urge’: notice the uncomfortable feeling, let it crest like a wave and then pass. In one study, smokers taught to do this were much more likely to stop smoking."], ["", "Second, plan time for email and social media instead of checking them all day. Third, be careful of liminal moments – the moments when we are transitioning between tasks."], ["", "Finally, don’t believe that technology is ‘hijacking’ your brain. If we think we are powerless, we are less likely to change."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why didn’t the flip phone solve Eyal’s problem?", "o": ["He found other distractions.", "He needed the internet for work.", "It broke quickly."], "a": 0}, {"t": "mc", "q": "What had Eyal ignored?", "o": ["notifications", "internal triggers", "external triggers"], "a": 1}, {"t": "mc", "q": "‘Surf the urge’ means ___.", "o": ["notice the feeling and let it pass", "go to the beach", "do what you want immediately"], "a": 0}, {"t": "mc", "q": "Liminal moments are moments when we ___.", "o": ["move from one task to another", "are asleep", "feel very happy"], "a": 0}, {"t": "mc", "q": "Why is it bad to believe technology is hijacking your brain?", "o": ["It makes you use technology more.", "You feel powerless to change.", "It is not true at all."], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two siblings, Sam and Mia, talking at home.", "script": [["Sam", "Oi, you gonna get off your phone at some point?"], ["Mia", "Dunno. I’m just checking something."], ["Sam", "You’ve been ‘just checking something’ for an hour, mate."], ["Mia", "Whatevs. Everyone’s talking about the party on Saturday. I’ve got proper FOMO."], ["Sam", "You’re not even invited, are you?"], ["Mia", "That’s not the point! Anyway, you were on your laptop all afternoon."], ["Sam", "That was homework."], ["Mia", "Homework? Sounds a bit sus. I saw you playing that football game."], ["Sam", "OK, fair. Half homework. Let’s both put our phones in the kitchen till dinner, yeah?"], ["Mia", "Fine. But I’m pulling your leg about the party – I am invited."]]}, "parts": [{"items": [{"t": "mc", "q": "How long has Mia been on her phone?", "o": ["an hour", "ten minutes", "all afternoon"], "a": 0}, {"t": "mc", "q": "Why does Mia have FOMO?", "o": ["Sam is ignoring her.", "Everyone is talking about a party.", "She lost her phone."], "a": 1}, {"t": "mc", "q": "What does Mia think Sam was really doing?", "o": ["sleeping", "playing a game", "doing homework"], "a": 1}, {"t": "mc", "q": "What do they agree to do?", "o": ["put their phones in the kitchen", "go to the party together", "turn off the internet"], "a": 0}, {"t": "mc", "q": "At the end, Mia admits that ___.", "o": ["she was joking about not being invited", "she isn’t invited", "she hates parties"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "informal register (dunno, gonna, sus, FOMO, pull someone’s leg); triggers, liminal, transitioning, cessation.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What distracts you most when you study?", "Have you ever tried a trick to use your phone less?", "What do you do when you feel bored?", "Which English slang words do you know?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Is technology really to blame for distraction?", "When is informal language appropriate and when is it not?", "How long could you go without social media?"]}]}}]}, {"id": "t42", "kind": "quick", "group": "t4.2", "title": "Unit 4.2 Test", "focus": "4.2 Cyberbullying: talking about statistics (half, a quarter, 1 in 2, just over, nearly, most); cyberbullying vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "50% is the same as ___.", "o": ["half", "a quarter", "a third"], "a": 0}, {"t": "mc", "q": "25% is the same as ___.", "o": ["a fifth", "half", "a quarter"], "a": 2}, {"t": "mc", "q": "‘1 in 2 men’ means ___.", "o": ["two men", "half of all men", "most men"], "a": 1}, {"t": "mc", "q": "47% is ___ half.", "o": ["almost", "more than", "just over"], "a": 0}, {"t": "mc", "q": "51% is ___ half.", "o": ["just under", "just over", "nearly"], "a": 1}, {"t": "mc", "q": "Decreased by 10% means ___ by 10%.", "o": ["grew", "fell", "rose"], "a": 1}, {"t": "mc", "q": "‘By a fifth’ means by ___.", "o": ["50%", "5%", "20%"], "a": 2}, {"t": "mc", "q": "In common use, ‘most’ usually means about ___.", "o": ["exactly 50%", "10–20%", "60–90%"], "a": 2}, {"t": "mc", "q": "‘Around 30%’ means ___ 30%.", "o": ["exactly", "approximately", "more than"], "a": 1}, {"t": "mc", "q": "‘Less than’ has a similar meaning to ___.", "o": ["over", "under", "above"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Very damaging and shocking is ___.", "o": ["resolved", "resilient", "devastating"], "a": 2}, {"t": "mc", "q": "A problem that has been fixed is ___.", "o": ["resolved", "devastating", "embarrassed"], "a": 0}, {"t": "mc", "q": "A method used to achieve a goal is a ___.", "o": ["bystander", "tactic", "counsellor"], "a": 1}, {"t": "mc", "q": "A person trained to help with personal problems is a ___.", "o": ["adolescent", "counsellor", "bystander"], "a": 1}, {"t": "mc", "q": "Make someone feel awkward is ___.", "o": ["resolve", "endorse", "embarrass"], "a": 2}, {"t": "mc", "q": "Publicly support something is ___.", "o": ["endorse", "report", "embarrass"], "a": 0}, {"t": "mc", "q": "Able to recover after something bad is ___.", "o": ["vulnerable", "resilient", "devastating"], "a": 1}, {"t": "mc", "q": "Someone who sees bullying but does nothing is a ___.", "o": ["bystander", "victim", "counsellor"], "a": 0}, {"t": "mc", "q": "Using the internet to hurt someone is ___.", "o": ["censorship", "cyberbullying", "harassment"], "a": 1}, {"t": "mc", "q": "Stop someone from contacting you online: ___ them.", "o": ["flag", "block", "endorse"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Always <b>r</b>{} bullying to a teacher or the platform.", "a": [["eport"]], "pre": ["r"]}, {"t": "gap", "q": "Repeated threatening messages are a form of <b>h</b>{}.", "a": [["arassment"]], "pre": ["h"]}, {"t": "gap", "q": "The <b>m</b>{} of teens – more than half – have experienced online bullying.", "a": [["ajority"]], "pre": ["m"]}, {"t": "gap", "q": "Most teens are <b>r</b>{} and recover well with support.", "a": [["esilient"]], "pre": ["r"]}, {"t": "gap", "q": "Online bullying affects many <b>a</b>{} aged 12 to 17.", "a": [["dolescents"]], "pre": ["a"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Are you okay?", "paras": [["", "Cyberbullying is more common than many adults think. In one survey, just over half of teenagers said they had been bullied online, and nearly a quarter admitted they had bullied someone else."], ["", "The effects can be devastating. Victims may feel embarrassed and isolated, and some stop going to school. But psychologists stress that most teens are resilient, especially when they have support."], ["", "Experts recommend a few simple tactics: don’t reply to the bully, take screenshots as evidence, block the person and report them to the platform. Talking to a trusted adult or a school counsellor also helps."], ["", "Bystanders have power too. Simply sending a message to the victim – ‘Are you okay?’ – can make a huge difference."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "How many teenagers said they had been bullied online?", "o": ["just over half", "almost all", "a quarter"], "a": 0}, {"t": "mc", "q": "How many admitted bullying someone?", "o": ["nearly a quarter", "half", "most"], "a": 0}, {"t": "mc", "q": "What do psychologists say about most teens?", "o": ["They are always bystanders.", "They never tell adults.", "They are resilient."], "a": 2}, {"t": "mc", "q": "Which tactic is NOT recommended?", "o": ["taking screenshots", "blocking the person", "replying to the bully"], "a": 2}, {"t": "mc", "q": "What can a bystander do?", "o": ["check if the victim is okay", "ignore the situation", "post a funny comment"], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a radio interview with a psychologist about cyberbullying.", "script": [["Host", "Dr Kim, how common is cyberbullying?"], ["Expert", "Very common. Research shows that over half of adolescents have been bullied online, and less than a quarter say they have done it themselves."], ["Host", "What should a teenager do if it happens to them?"], ["Expert", "Firstly, don’t respond. Bullies want a reaction. Save the evidence, block them and report them."], ["Host", "Should they tell their parents?"], ["Expert", "Yes. Many teens worry their parents will take their phone away, so parents need to stay calm and listen."], ["Host", "Is there any good news?"], ["Expert", "Definitely. Most teens are resilient. With support, the vast majority recover and the problem is resolved."]]}, "parts": [{"items": [{"t": "mc", "q": "How many adolescents have been bullied online?", "o": ["over half", "a half exactly", "less than a quarter"], "a": 0}, {"t": "mc", "q": "How many say they have bullied others?", "o": ["most", "over half", "less than a quarter"], "a": 2}, {"t": "mc", "q": "Why shouldn’t victims respond?", "o": ["Parents will be angry.", "Bullies want a reaction.", "It is illegal."], "a": 1}, {"t": "mc", "q": "Why don’t some teens tell their parents?", "o": ["Their parents don’t use phones.", "They fear losing their phone.", "They think it is funny."], "a": 1}, {"t": "mc", "q": "What is the good news?", "o": ["Most teens are resilient.", "Cyberbullying is decreasing.", "Bullies always get punished."], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "statistics (just over half, nearly a quarter, 1 in 3); resilient, bystander, counsellor, report, block.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What would you do if a friend was bullied online?", "Do you know how to report someone on social media?", "Who would you talk to if you had a problem?", "Have you ever been a bystander?"]}, {"name": "Statistics task", "mins": 3, "lead": "The student describes these class survey results using statistical language.", "prompts": ["52% use social media for more than 3 hours a day", "24% have received an unkind message", "9 in 10 have blocked someone", "What do these results tell us?"]}]}}]}, {"id": "t43", "kind": "quick", "group": "t4.3", "title": "Unit 4.3 Test", "focus": "4.3 Cosplay and the wing-maker: gerunds as subject complements (My favourite thing is reading); gerund vs continuous; cosplay vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "My favourite hobby is ___ costumes.", "o": ["making", "make", "made"], "a": 0}, {"t": "mc", "q": "In ‘Eating is great’, ‘eating’ is a ___.", "o": ["past participle", "continuous verb", "gerund"], "a": 2}, {"t": "mc", "q": "In ‘I am eating’, ‘eating’ is a ___.", "o": ["continuous verb", "noun", "gerund"], "a": 0}, {"t": "mc", "q": "‘A productive day for me is getting all my emails ___.’", "o": ["answered", "answer", "answering"], "a": 0}, {"t": "mc", "q": "Something I hate doing is ___ in line.", "o": ["to waited", "waiting", "wait"], "a": 1}, {"t": "mc", "q": "My least favourite chore is ___ the toilet.", "o": ["cleaning", "cleaned", "clean"], "a": 0}, {"t": "mc", "q": "Which sentence uses a gerund as subject complement?", "o": ["She is designing wings.", "Her job is designing wings.", "She designed wings yesterday."], "a": 1}, {"t": "mc", "q": "A gerund is the ___ form of a verb.", "o": ["past", "noun", "adjective"], "a": 1}, {"t": "mc", "q": "To check if -ing is a gerund, try replacing it with ___.", "o": ["an adjective", "a noun", "a verb"], "a": 1}, {"t": "mc", "q": "‘They were dancing all night’ uses ___.", "o": ["a noun", "the continuous", "a gerund"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Dressing up as a character is ___.", "o": ["disguise", "garb", "cosplay"], "a": 2}, {"t": "mc", "q": "A long sleeveless coat over the shoulders is a ___.", "o": ["hood", "cape", "wand"], "a": 1}, {"t": "mc", "q": "Clothes that hide who you are are a ___.", "o": ["prop", "mascot", "disguise"], "a": 2}, {"t": "mc", "q": "Metal clothing worn by knights is ___.", "o": ["garb", "armour", "cape"], "a": 1}, {"t": "mc", "q": "A magician uses a ___.", "o": ["wand", "horn", "club"], "a": 0}, {"t": "mc", "q": "A team’s character, like a big bear, is a ___.", "o": ["mascot", "elf", "nymph"], "a": 0}, {"t": "mc", "q": "A large event where fans meet is a ___.", "o": ["prop", "craft", "convention"], "a": 2}, {"t": "mc", "q": "An object used in a costume, like a sword, is a ___.", "o": ["prop", "hood", "garb"], "a": 0}, {"t": "mc", "q": "Skill in making things by hand is ___.", "o": ["armour", "cosplay", "craftsmanship"], "a": 2}, {"t": "mc", "q": "A soldier of high rank in the Middle Ages was a ___.", "o": ["nymph", "knight", "pirate"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "The costume was a strange <b>c</b>{} with horns and wings.", "a": [["reature"]], "pre": ["c"]}, {"t": "gap", "q": "Pull up your <b>h</b>{} – it’s raining.", "a": [["ood"]], "pre": ["h"]}, {"t": "gap", "q": "I had a very <b>p</b>{} day – I finished three wings.", "a": [["roductive"]], "pre": ["p"]}, {"t": "gap", "q": "She wore medieval <b>g</b>{} to the festival.", "a": [["arb"]], "pre": ["g"]}, {"t": "gap", "q": "He dressed as an <b>e</b>{} with pointed ears.", "a": [["lf"]], "pre": ["e"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "The wing-maker", "paras": [["", "Alexis is a professional wing-maker. She builds huge, realistic wings for cosplayers, photographers and theatre companies. Some of her wings move when the wearer pulls a cord."], ["", "She started cosplaying as a teenager, making simple costumes from cardboard. Her parents didn’t really understand her hobby, but she kept going. ‘My favourite part is seeing someone put on the wings for the first time,’ she says."], ["", "Each pair can take weeks. ‘A productive day for me is getting all my emails answered,’ she laughs, ‘which has never actually happened.’"], ["", "For Alexis, cosplay is about craftsmanship and community. At conventions, she meets people who share her passion and who ask her to teach them."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Who buys Alexis’s wings?", "o": ["cosplayers, photographers and theatres", "schools", "airlines"], "a": 0}, {"t": "mc", "q": "What did she use for her first costumes?", "o": ["metal", "cardboard", "feathers"], "a": 1}, {"t": "mc", "q": "What does she enjoy most?", "o": ["seeing someone wear the wings for the first time", "answering emails", "selling wings"], "a": 0}, {"t": "mc", "q": "What does she joke about?", "o": ["her costumes breaking", "never finishing her emails", "her parents"], "a": 1}, {"t": "mc", "q": "What does cosplay mean to Alexis?", "o": ["escaping from reality", "money and fame", "craftsmanship and community"], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends, Aliya and Leo, talking about a comic convention.", "script": [["Aliya", "Are you going to the comic convention in Almaty next month?"], ["Leo", "Definitely. I’m going as a knight. I’ve been making the armour from foam for weeks."], ["Aliya", "That sounds amazing. I’m going as a fairy – I need wings!"], ["Leo", "You should watch that wing-maker video. Her wings even move."], ["Aliya", "I saw it! Making wings like that is my dream. But mine will probably be cardboard."], ["Leo", "Ha! What’s the best thing about conventions for you?"], ["Aliya", "Meeting people who love the same things. At school people think it’s weird."], ["Leo", "Same. My dad still thinks it’s just dressing up for children."]]}, "parts": [{"items": [{"t": "mc", "q": "Where is the convention?", "o": ["Almaty", "Kostanay", "Astana"], "a": 0}, {"t": "mc", "q": "What is Leo’s costume?", "o": ["a pirate", "a fairy", "a knight"], "a": 2}, {"t": "mc", "q": "What is Leo’s armour made from?", "o": ["cardboard", "foam", "metal"], "a": 1}, {"t": "mc", "q": "What is Aliya’s favourite thing about conventions?", "o": ["buying comics", "meeting people with the same interests", "winning prizes"], "a": 1}, {"t": "mc", "q": "What does Leo’s dad think?", "o": ["Cosplay is for children.", "Leo should be a knight.", "Cosplay is expensive."], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "gerund as subject complement (My favourite thing is…); cosplay nouns (cape, armour, disguise, prop, mascot).", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Complete: ‘One of life’s pleasures is…’, ‘Something I hate is…’, ‘My favourite thing to do is…’", "Is there a hobby you have that your parents don’t understand?", "Which character would you cosplay?", "Would you like a pair of wings? What would you do?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Is cosplay art or just dressing up?", "Is there something you would like to learn to make?", "What makes a hobby worth spending money on?"]}]}}]}, {"id": "t44", "kind": "quick", "group": "t4.4", "title": "Unit 4.4 Test", "focus": "4.4 Why algospeak?: dependent (subordinating) conjunctions: because, since, as, unless, in case, even though, whereas.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "He was fired ___ he arrived late too often.", "o": ["unless", "because", "whereas"], "a": 1}, {"t": "mc", "q": "I haven’t seen her ___ she left the company.", "o": ["until", "since", "in case"], "a": 1}, {"t": "mc", "q": "___ it was raining, we cancelled the picnic.", "o": ["Whereas", "As", "Unless"], "a": 1}, {"t": "mc", "q": "We can’t start ___ the boss arrives.", "o": ["until", "since", "whereas"], "a": 0}, {"t": "mc", "q": "I won’t go to the party ___ you come with me.", "o": ["since", "unless", "because"], "a": 1}, {"t": "mc", "q": "Take an umbrella ___ it rains.", "o": ["whereas", "in case", "unless"], "a": 1}, {"t": "mc", "q": "___ he was tired, he continued reading.", "o": ["In case", "Because", "Even though"], "a": 2}, {"t": "mc", "q": "I prefer tea, ___ my sister prefers coffee.", "o": ["whereas", "because", "unless"], "a": 0}, {"t": "mc", "q": "I want a job ___ I can work from home.", "o": ["when", "where", "unless"], "a": 1}, {"t": "mc", "q": "When a sentence starts with a dependent clause, we need ___ after it.", "o": ["a semi-colon", "no punctuation", "a comma"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Certain to happen is ___.", "o": ["inevitable", "grumpy", "articulate"], "a": 0}, {"t": "mc", "q": "Able to express ideas clearly is ___.", "o": ["quirky", "inevitable", "articulate"], "a": 2}, {"t": "mc", "q": "The appearance of something new is its ___.", "o": ["violation", "emergence", "vernacular"], "a": 1}, {"t": "mc", "q": "Mark content as harmful: ___ it.", "o": ["flag", "insinuate", "coin"], "a": 0}, {"t": "mc", "q": "Breaking a rule is a ___.", "o": ["emergence", "quirk", "violation"], "a": 2}, {"t": "mc", "q": "Everyday spoken language is the ___.", "o": ["algorithm", "violation", "vernacular"], "a": 2}, {"t": "mc", "q": "Small unusual habits are ___.", "o": ["quirks", "vernaculars", "flags"], "a": 0}, {"t": "mc", "q": "Suggest something bad indirectly: ___.", "o": ["articulate", "flag", "insinuate"], "a": 2}, {"t": "mc", "q": "Code words used online to avoid algorithms are ___.", "o": ["algospeak", "slang", "jargon"], "a": 0}, {"t": "mc", "q": "Removing harmful posts is content ___.", "o": ["censorship", "creation", "moderation"], "a": 2}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "The <b>a</b>{} decides which videos appear on your feed.", "a": [["lgorithm"]], "pre": ["a"]}, {"t": "gap", "q": "Some creators complain about <b>c</b>{} of their content.", "a": [["ensorship"]], "pre": ["c"]}, {"t": "gap", "q": "Creators say ‘<b>u</b>{}’ instead of ‘kill’ to avoid being flagged.", "a": [["nalive"]], "pre": ["u"]}, {"t": "gap", "q": "My grandad gets <b>g</b>{} when he can’t understand teen slang.", "a": [["rumpy"]], "pre": ["g"]}, {"t": "gap", "q": "Language change is <b>i</b>{} – it always happens.", "a": [["nevitable"]], "pre": ["i"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Why algospeak?", "paras": [["", "On TikTok and YouTube, algorithms flag videos that might contain harmful content. Because this can reduce a video’s views, creators have developed ‘algospeak’: code words that the algorithm doesn’t recognise."], ["", "For example, people say ‘unalive’ instead of ‘kill’ or ‘seggs’ instead of ‘sex’, and use emojis in place of sensitive words. Even though the topics are often serious, such as mental health, creators fear their videos will be hidden."], ["", "Linguists find algospeak fascinating, as it shows how quickly the vernacular changes. Some terms, like ‘unalive’, are now used by teenagers in everyday speech, whereas older people often find them confusing."], ["", "Language change is inevitable, but some experts worry: if we can’t use clear words for serious topics, important conversations may become harder."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why did algospeak appear?", "o": ["to make videos funnier", "because of a new law", "to avoid content being flagged"], "a": 2}, {"t": "mc", "q": "‘Unalive’ replaces ___.", "o": ["sad", "kill", "sick"], "a": 1}, {"t": "mc", "q": "Why do creators use algospeak for serious topics?", "o": ["They fear their videos will be hidden.", "It is shorter.", "They don’t care about the topics."], "a": 0}, {"t": "mc", "q": "Why do linguists find algospeak interesting?", "o": ["It is only used by adults.", "It is very old.", "It shows language changing fast."], "a": 2}, {"t": "mc", "q": "What do some experts worry about?", "o": ["Serious conversations may become harder.", "Teenagers will stop talking.", "Algorithms will disappear."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear an interview with a linguist about a new use of ‘because’.", "script": [["Host", "Professor, people now say things like ‘I’m tired because internet’. Is that wrong?"], ["Expert", "It’s non-standard, but it’s a real change. Traditionally ‘because’ is followed by a clause or by ‘of’. Online, people started using it with just a noun, as a quick, playful way of giving a reason."], ["Host", "Where did it come from?"], ["Expert", "It emerged in internet speech around 2012, and in 2013 the American Dialect Society even chose it as their Word of the Year."], ["Host", "Should students use it in exams?"], ["Expert", "Definitely not! It’s very informal. In an essay, write ‘because of the internet’."], ["Host", "Language is always changing, isn’t it?"], ["Expert", "Absolutely. Every generation has its own quirks, and older people have always been grumpy about it."]]}, "parts": [{"items": [{"t": "mc", "q": "What is new about ‘because internet’?", "o": ["it is a very old form", "‘because’ is followed by just a noun", "it is used in exams"], "a": 1}, {"t": "mc", "q": "When did this use emerge?", "o": ["in the 1990s", "around 2012", "in 2020"], "a": 1}, {"t": "mc", "q": "What did the American Dialect Society do in 2013?", "o": ["banned it", "added it to a test", "chose it as Word of the Year"], "a": 2}, {"t": "mc", "q": "What should students write in an essay?", "o": ["because internet", "because of the internet", "cos internet"], "a": 1}, {"t": "mc", "q": "What does the expert say about older people?", "o": ["They use ‘because’ in the same way.", "They invented algospeak.", "They have always complained about new language."], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "dependent conjunctions (because, since, unless, in case, whereas, even though); algorithm, flag, vernacular, inevitable.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Which algospeak or internet slang do you know?", "Complete: ‘I’ll go out tonight unless…’, ‘I always take my phone in case…’", "Do your parents understand your slang?", "Is language change a good thing?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Should social media platforms flag content automatically?", "Is algospeak creative or dangerous?", "Compare how you and your grandparents speak (use whereas)."]}]}}]}, {"id": "t45", "kind": "quick", "group": "t4.5", "title": "Unit 4.5 Test", "focus": "4.5 Fake photos: dummy subjects ‘it’ and ‘there’ (It’s raining; There is a problem) vs real ‘it’ and adverb ‘there’.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "___ is raining.", "o": ["There", "It", "This"], "a": 1}, {"t": "mc", "q": "___ are a lot of fake photos online.", "o": ["It", "They", "There"], "a": 2}, {"t": "mc", "q": "___ is 8 o’clock.", "o": ["That", "There", "It"], "a": 2}, {"t": "mc", "q": "I’m afraid ___ a problem with the image.", "o": ["there’s", "it’s", "its"], "a": 0}, {"t": "mc", "q": "In ‘Look at that dog. It is big.’, ‘it’ is ___.", "o": ["an adverb", "a real subject", "a dummy subject"], "a": 1}, {"t": "mc", "q": "In ‘The dog is over there’, ‘there’ is ___.", "o": ["an adverb of place", "a dummy subject", "a pronoun"], "a": 0}, {"t": "mc", "q": "___ is often said that the camera never lies.", "o": ["There", "It", "That"], "a": 1}, {"t": "mc", "q": "You can tell it’s fake. ___ eight fingers on one hand!", "o": ["It is", "It has", "There are"], "a": 2}, {"t": "mc", "q": "We use ‘there’ as a dummy subject to say something ___.", "o": ["is your opinion", "is late", "exists"], "a": 2}, {"t": "mc", "q": "___ hard to believe that space is infinite.", "o": ["It’s", "Its", "There’s"], "a": 0}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "The quality of being true is ___.", "o": ["veracity", "watermark", "hoax"], "a": 0}, {"t": "mc", "q": "A desire to cause harm is ill ___.", "o": ["feeling", "intent", "will"], "a": 1}, {"t": "mc", "q": "A faint mark showing where an image came from is a ___.", "o": ["deepfake", "hoax", "watermark"], "a": 2}, {"t": "mc", "q": "Genuine and real is ___.", "o": ["authentic", "rendered", "viral"], "a": 0}, {"t": "mc", "q": "A trick to make people believe something false is a ___.", "o": ["veracity", "watermark", "hoax"], "a": 2}, {"t": "mc", "q": "Too much to deal with: ___.", "o": ["render", "overwhelm", "regulate"], "a": 1}, {"t": "mc", "q": "Created by a computer artistically is ___.", "o": ["authentic", "rendered", "ironic"], "a": 1}, {"t": "mc", "q": "Opposite of what you’d expect: ___.", "o": ["authentically", "supposedly", "ironically"], "a": 2}, {"t": "mc", "q": "Spread very quickly online: go ___.", "o": ["global", "viral", "fake"], "a": 1}, {"t": "mc", "q": "Check whether information is true: ___.", "o": ["deepfake", "watermark", "fact-check"], "a": 2}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "A <b>d</b>{} is a fake video made with AI.", "a": [["eepfake"]], "pre": ["d"]}, {"t": "gap", "q": "Governments may need to <b>r</b>{} AI images.", "a": [["egulate"]], "pre": ["r"]}, {"t": "gap", "q": "False information spread online is <b>m</b>{}.", "a": [["isinformation"]], "pre": ["m"]}, {"t": "gap", "q": "The flowers were <b>s</b>{} affected by radiation.", "a": [["upposedly"]], "pre": ["s"]}, {"t": "gap", "q": "The fake Pope photo caused a lot of <b>c</b>{}.", "a": [["ontroversy"]], "pre": ["c"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Fake pictures", "paras": [["", "In March 2023, pictures of the Pope wearing a white puffy coat went viral. They had been created by the AI tool Midjourney. The creator had no ill intent – he just thought it was funny – but the controversy made him realise the power of AI images."], ["", "People are bad at spotting fakes. In a 2021 experiment, participants who tried to tell real faces from AI faces did no better than chance. Even after tips, such as looking for badly rendered hands, their accuracy improved by only about 10%."], ["", "Ironically, our best defence may be another AI trained to detect artificial images. Watermarks could also show where an image came from."], ["", "Fake photos are not new, and real photos can mislead too. In one study, fewer than 20% of 170 students questioned a photo of ‘nuclear flowers’ that were actually affected by a natural process."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why did the creator make the Pope image?", "o": ["He was paid to.", "He wanted to protest.", "He thought it was funny."], "a": 2}, {"t": "mc", "q": "How good were people at spotting AI faces?", "o": ["perfect after tips", "about as good as guessing", "very good"], "a": 1}, {"t": "mc", "q": "How much did tips improve accuracy?", "o": ["by about 50%", "not at all", "by about 10%"], "a": 2}, {"t": "mc", "q": "What is ‘ironic’ about the best defence?", "o": ["It is free.", "It is also AI.", "It is very old."], "a": 1}, {"t": "mc", "q": "What did the ‘nuclear flowers’ study show?", "o": ["The flowers were fake.", "Most students didn’t question the photo.", "Students spotted the trick easily."], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a teacher giving tips for checking photos.", "script": [["Teacher", "Before you share a photo, ask yourself: is it authentic?"], ["Teacher", "First, do a reverse image search on a site like TinEye or Google Images. It may already have been revealed as a fake."], ["Teacher", "Second, check fact-checking websites such as Snopes."], ["Teacher", "Third, look closely at the details. AI often has problems with hands, teeth and earrings. If there are six fingers, it’s probably fake."], ["Teacher", "And finally, think about the source. Who posted it, and why? If a photo makes you very angry or very excited, be extra careful – that’s exactly what makes things go viral."]]}, "parts": [{"items": [{"t": "mc", "q": "What is the first tip?", "o": ["ask a friend", "delete the photo", "do a reverse image search"], "a": 2}, {"t": "mc", "q": "Snopes is an example of ___.", "o": ["a fact-checking website", "a social network", "an AI tool"], "a": 0}, {"t": "mc", "q": "Which details does AI often get wrong?", "o": ["skies and trees", "hands, teeth and earrings", "colours"], "a": 1}, {"t": "mc", "q": "What should you think about in the last step?", "o": ["the source", "the colour", "the size"], "a": 0}, {"t": "mc", "q": "Why be careful with photos that make you angry?", "o": ["Strong emotions make things go viral.", "They are illegal.", "They are always fake."], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "dummy subjects it/there; veracity, hoax, authentic, deepfake, misinformation, go viral, fact-check.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Have you ever been fooled by a fake photo?", "How do you check if news is true?", "Describe a photo using ‘There is…/It looks…’.", "Do you edit your photos before posting?"]}, {"name": "Role play / Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Should AI images be regulated by law?", "Should all AI images have a watermark?", "What are the dangers of deepfakes?"]}]}}]}, {"id": "t51", "kind": "quick", "group": "t5.1", "title": "Unit 5.1 Test", "focus": "5.1 Friendship and theory of mind: friendship idioms (be on the same page, attached at the hip, read each other’s minds…).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "They do everything together – they’re attached at the ___.", "o": ["heart", "hip", "arm"], "a": 1}, {"t": "mc", "q": "We always agree – we’re on the same ___.", "o": ["book", "page", "line"], "a": 1}, {"t": "mc", "q": "She knows what I’m thinking. We can read each other’s ___.", "o": ["books", "faces", "minds"], "a": 2}, {"t": "mc", "q": "My old phone pales in ___ to my new one.", "o": ["comparison", "contrast", "colour"], "a": 0}, {"t": "mc", "q": "When I was sad, she was there ___ me.", "o": ["to", "with", "for"], "a": 2}, {"t": "mc", "q": "After the breakup, it felt like the whole world was ___ down.", "o": ["falling over", "breaking", "crashing"], "a": 2}, {"t": "mc", "q": "Let’s ___ into the science of friendship.", "o": ["dive", "swim", "jump"], "a": 0}, {"t": "mc", "q": "Friends often walk in step ___ each other without noticing.", "o": ["to", "by", "with"], "a": 2}, {"t": "mc", "q": "‘Be there for someone’ means ___.", "o": ["be ready to listen and help", "visit their house", "agree with everything"], "a": 0}, {"t": "mc", "q": "‘Pale in comparison’ means ___.", "o": ["become white", "be much less good", "look similar"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Be told by your partner that the relationship is over: get ___.", "o": ["dropped", "dumped", "dived"], "a": 1}, {"t": "mc", "q": "Grow and develop in a healthy way: ___.", "o": ["stroll", "flourish", "babble"], "a": 1}, {"t": "mc", "q": "Babies up to about a year old are ___.", "o": ["pals", "adolescents", "infants"], "a": 2}, {"t": "mc", "q": "I was a ___ after the breakup – I cried for days.", "o": ["stroll", "wreck", "pal"], "a": 1}, {"t": "mc", "q": "Babies ___ before they can talk.", "o": ["stroll", "manifest", "babble"], "a": 2}, {"t": "mc", "q": "With awareness, on purpose: ___.", "o": ["metaphysically", "consciously", "intimately"], "a": 1}, {"t": "mc", "q": "Depend completely on: ___.", "o": ["hinge on", "stroll", "dive into"], "a": 0}, {"t": "mc", "q": "Friends: ___.", "o": ["pals", "kin", "infants"], "a": 0}, {"t": "mc", "q": "Happen at the same time: ___.", "o": ["synchronise", "flourish", "manifest"], "a": 0}, {"t": "mc", "q": "Walk slowly in a relaxed way: ___.", "o": ["babble", "stroll", "march"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Teenage friendships are often very <b>i</b>{} – close and warm.", "a": [["ntimate"]], "pre": ["i"]}, {"t": "gap", "q": "Our closeness can <b>m</b>{} itself in the way we walk together.", "a": [["anifest"]], "pre": ["m"]}, {"t": "gap", "q": "Strong <b>a</b>{} friendships help teenagers develop their identity.", "a": [["dolescent"]], "pre": ["a"]}, {"t": "gap", "q": "Interpersonal <b>s</b>{} is when friends’ actions match without planning.", "a": [["ynchrony"]], "pre": ["s"]}, {"t": "gap", "q": "Theory of <b>m</b>{} is understanding that others have their own thoughts.", "a": [["ind"]], "pre": ["m"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "The science of friendship", "paras": [["", "Friendships in adolescence are especially intense. Teenagers spend more time with friends than with family, and these intimate relationships help them work out who they are."], ["", "One reason friendships work is ‘theory of mind’: the ability to understand that other people have their own thoughts, feelings and beliefs. It begins to develop in early childhood, around the age of four, and keeps improving through the teenage years."], ["", "Close friends also show ‘interpersonal synchrony’. Without consciously planning it, they walk in step, laugh at the same moments and even synchronise their breathing. Brain scans show that friends’ brains respond in similar ways to the same video."], ["", "So if you and your best friend seem to read each other’s minds, there may be a scientific reason."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why are teenage friendships important?", "o": ["They help teens develop their identity.", "They last forever.", "They replace school."], "a": 0}, {"t": "mc", "q": "What is theory of mind?", "o": ["understanding that others have their own thoughts", "remembering your friends’ birthdays", "a type of exam"], "a": 0}, {"t": "mc", "q": "When does theory of mind begin to develop?", "o": ["at birth", "at age fifteen", "around age four"], "a": 2}, {"t": "mc", "q": "Interpersonal synchrony happens ___.", "o": ["without conscious planning", "only when friends talk", "only in families"], "a": 0}, {"t": "mc", "q": "What did brain scans show?", "o": ["Friends think the opposite.", "Friends’ brains respond similarly.", "Friends’ brains are the same size."], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a teenager, Zarina, talking about her best friend.", "script": [["Zarina", "My best friend is Priya. We met in Year 5, and we’ve been attached at the hip ever since."], ["Zarina", "She’s always there for me. Last year, when I got dumped, I felt like the whole world was crashing down. As soon as I told Priya, she was at my door with chocolate."], ["Zarina", "I was a wreck, but she just sat and listened. We’re always on the same page – it’s like we can read each other’s minds."], ["Zarina", "And we can talk for hours. My mum says she has the phone bills to prove it."], ["Zarina", "Other friendships pale in comparison."]]}, "parts": [{"items": [{"t": "mc", "q": "When did Zarina meet Priya?", "o": ["last year", "in Year 9", "in Year 5"], "a": 2}, {"t": "mc", "q": "What happened last year?", "o": ["Priya moved away.", "They had an argument.", "Zarina got dumped."], "a": 2}, {"t": "mc", "q": "What did Priya bring?", "o": ["flowers", "chocolate", "a film"], "a": 1}, {"t": "mc", "q": "What does Zarina’s mum say?", "o": ["The phone bills show how much they talk.", "Priya is a bad influence.", "They should study more."], "a": 0}, {"t": "mc", "q": "How does Zarina compare other friendships?", "o": ["They are better.", "They are the same.", "They are not as good."], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "friendship i >{} of ‘there’.", "a": [["omophone"]], "pre": ["h"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Are we all WEIRD?", "paras": [["", "Most psychology research has been done on people from WEIRD societies: Western, Educated, Industrialised, Rich and Democratic. Around two-thirds of study participants in the US are university students."], ["", "This is a problem, because researchers have often assumed that results apply to all of humanity. In fact, WEIRD people are outliers in many ways."], ["", "For example, in the famous Müller-Lyer illusion, two lines of equal length look different. Americans are very susceptible to it, while some groups in southern Africa hardly see the illusion at all."], ["", "WEIRD people also tend to see themselves as individuals, whereas many other cultures think of themselves mainly as part of a group. Scientists are now trying to include more diverse participants in their studies."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "What does the ‘R’ in WEIRD stand for?", "o": ["Real", "Religious", "Rich"], "a": 2}, {"t": "mc", "q": "Who are many US study participants?", "o": ["university students", "older people", "children"], "a": 0}, {"t": "mc", "q": "Why is this a problem?", "o": ["Students lie in studies.", "It is too expensive.", "Results may not apply to everyone."], "a": 2}, {"t": "mc", "q": "What does the illusion example show?", "o": ["Americans have bad eyesight.", "People from different cultures see things differently.", "Everyone sees the same thing."], "a": 1}, {"t": "mc", "q": "How do WEIRD people tend to see themselves?", "o": ["as individuals", "as outliers", "as part of a group"], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends talking about a podcast.", "script": [["Erlan", "Did you know most psychology studies are done on weirdos?"], ["Aigerim", "Weirdos? That’s a bit mean!"], ["Erlan", "No, W-E-I-R-D. Western, Educated, Industrialised, Rich and Democratic."], ["Aigerim", "Oh! So what’s the problem?"], ["Erlan", "About sixty-seven percent of participants in American studies are undergraduates. Then researchers say ‘humans behave like this’."], ["Aigerim", "But other people might behave differently."], ["Erlan", "Exactly. Like with fairness games – WEIRD people tend to share money more equally than people in some small communities, but in other places people are even more generous."], ["Aigerim", "So the results are pretty flawed."], ["Erlan", "Pretty flawed, yeah. ‘Pretty’ meaning ‘quite’, not ‘beautiful’!"]]}, "parts": [{"items": [{"t": "mc", "q": "Why does Aigerim think Erlan is being mean?", "o": ["He laughs at the podcast.", "She misunderstands ‘weirdos’.", "He insults her."], "a": 1}, {"t": "mc", "q": "What percentage of participants are undergraduates?", "o": ["about 50%", "about 17%", "about 67%"], "a": 2}, {"t": "mc", "q": "What do researchers wrongly do?", "o": ["generalise results to all humans", "use too many countries", "pay participants too much"], "a": 0}, {"t": "mc", "q": "What do the fairness games show?", "o": ["People in different places behave differently.", "WEIRD people never share.", "Everyone shares equally."], "a": 0}, {"t": "mc", "q": "What does ‘pretty’ mean at the end?", "o": ["small", "quite", "beautiful"], "a": 1}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "homonyms and homophones; nuance, flawed, susceptible, influential, deem, the norm.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What is considered ‘normal’ in your family that others might find weird?", "Have you ever taken part in a survey or study?", "Who is an influential person you admire?", "Explain the two meanings of ‘mean’ and ‘match’."]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Why have studies focused on such a narrow group of people?", "Is anyone really ‘normal’?", "How can scientists make their research fairer?"]}]}}]}, {"id": "t53", "kind": "quick", "group": "t5.3", "title": "Unit 5.3 Test", "focus": "5.3 Making assumptions: discourse markers (well, so, anyway, I mean, I guess, on the other hand, right).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "Discourse markers are like ___ in a conversation.", "o": ["questions", "signposts", "full stops"], "a": 1}, {"t": "mc", "q": "‘___, let’s get back to the main point.’", "o": ["Anyway", "Woah", "Oh no"], "a": 0}, {"t": "mc", "q": "‘I guess…’ is used to show ___.", "o": ["surprise", "uncertainty", "alarm"], "a": 1}, {"t": "mc", "q": "‘Oh my gosh’ shows ___.", "o": ["surprise", "agreement", "uncertainty"], "a": 0}, {"t": "mc", "q": "‘Oh no’ shows ___.", "o": ["agreement", "concern or alarm", "happiness"], "a": 1}, {"t": "mc", "q": "We often start an answer to a question with ‘___’.", "o": ["Right", "Well", "Woah"], "a": 1}, {"t": "mc", "q": "‘___, to sum up, we were completely wrong.’", "o": ["Like", "Oh no", "So"], "a": 2}, {"t": "mc", "q": "‘Yeah’ and ‘right’ show that you are ___.", "o": ["angry", "confused", "listening or agreeing"], "a": 2}, {"t": "mc", "q": "‘I mean’ is used to ___.", "o": ["explain or correct what you said", "end a conversation", "show surprise"], "a": 0}, {"t": "mc", "q": "Overusing ‘like’ and ‘you know’ can make your speech sound ___.", "o": ["formal", "repetitive", "clear"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "A situation that keeps getting worse: a downward ___.", "o": ["slope", "circle", "spiral"], "a": 2}, {"t": "mc", "q": "Not completely: ___.", "o any assumptions were wrong. One girl imagined a sporty boy with a dartboard in his room; he turned out to be a quiet artist who loved velvet jackets. Another boy assumed his partner was Caucasian because of her accent, but she was Korean-American."], ["", "When the curtain was finally pulled back, most of the teens laughed. ‘Well, I guess I jumped to conclusions,’ said one. ‘I mean, I didn’t know anything about her!’"], ["", "The experiment shows how quickly our brains fill in gaps with stereotypes – and how often those first impressions are wrong."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "How did the teenagers talk?", "o": ["through a curtain", "by text", "by phone"], "a": 0}, {"t": "mc", "q": "What did they describe afterwards?", "o": ["the room", "their own hobbies", "how they imagined their partner"], "a": 2}, {"t": "mc", "q": "What was the ‘sporty boy’ really like?", "o": ["a quiet artist", "a dart player", "a footballer"], "a": 0}, {"t": "mc", "q": "Why did one boy make a wrong assumption?", "o": ["because of the girl’s accent", "because of her name", "because of her clothes"], "a": 0}, {"t": "mc", "q": "What does the experiment show?", "o": ["Voices tell us everything.", "First impressions are often wrong.", "Teenagers are good at guessing."], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two people meeting for the first time.", "script": [["Kai", "So, um, what do you do in your free time?"], ["Mia", "Well, I play a lot of video games, actually."], ["Kai", "Oh my gosh, really? I wouldn’t have guessed that."], ["Mia", "Why not?"], ["Kai", "I mean, you sound quite… serious. I guess I imagined you reading books."], ["Mia", "Right. Anyway, I do read too! What about you?"], ["Kai", "So, I do ballet. Six days a week."], ["Mia", "Woah! I thought you were going to say football."], ["Kai", "Yeah, everyone thinks that. On the other hand, I am really bad at football!"]]}, "parts": [{"it ould", "will", "had"], "a": 0}, {"t": "mc", "q": "If only I ___ speak French.", "o": ["would", "can", "could"], "a": 2}, {"t": "mc", "q": "‘If only it ___ that simple.’", "o": ["is", "were", "will be"], "a": 1}, {"t": "mc", "q": "If only she ___ her room! (She’s messy.)", "o": ["would clean", "cleans", "had cleaned"], "a": 0}, {"t": "mc", "q": "I’m so hungry. If only I ___ some food with me.", "o": ["bring", "had brought", "brought"], "a": 1}, {"t": "mc", "q": "Which is NOT correct?", "o": ["If only I could swim.", "If only I were taller.", "If only I would clean my room."], "a": 2}, {"t": "mc", "q": "___ the exam tomorrow. (hope for the future)", "o": ["If only I passed", "I hope I pass", "If only I pass"], "a": 1}, {"t": "mc", "q": "‘If only’ is like ‘I wish’ but ___.", "o": ["weaker", "more formal", "stronger"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Belief in your own value: ___.", "o": ["optimism", "setback", "self-esteem"], "a": 2}, {"t": "mc", "q": "Exist without being obvious: ___.", "o": ["lurk", "cultivate", "persevere"], "a": 0}, {"t": "mc", "q": "Problems that delay progress: ___.", "o": ["setbacks", "neurochemicals", "pep talks"], "a": 0}, {"t": "mc", "q": "Feeling in control of your life: ___.", "o": ["constructive", "empowered", "courageous"], "a": 1}, {"t": "mc", "q": "Bravely: ___.", "o": ["consciously", "courageously", "constructively"], "a": 1}, {"t": "mc", "q": "Seeing the positive side: ___.", "o": ["insecurity", "self-esteem", "optimism"], "a": 2}, {"t": "mc", "q": "Work to develop something: ___.", "o": ["cultivate", "untangle", "lurk"], "a": 0}, {"t": "mc", "q": "Make something complicated easier to understand: ___.", "o": ["persevere", "cultivate", "untangle"], "a": 2}, {"t": "mc", "q": "Keep trying despite difficulty: ___.", "o": ["give in", "lurk", "persevere"], "a": 2}, {"t": "mc", "q": "Helpful and useful (criticism): ___.", "o": ["constructive", "empowered", "destructive"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Our genes affect the balance of <b>n</b>{} in the brain.", "a": [["eurochemicals"]], "pre": ["n"]}, {"t": "gap", "q": "With a growth <b>m</b>{}, you believe you can improve with effort.", "a": [["indset"]], "pre": ["m"]}, {"t": "gap", "q": "Give yourself a <b>p</b>{} talk before the presentation.", "a": [["ep"]], "pre": ["p"]}, {"t": "gap", "q": "The study of the brain and nervous system is called <b>n</b>{}.", "a": [["euroscience"]], "pre": ["n"]}, {"t": "gap", "q": "Your level of <b>c</b>{} depends on genes, experience and choices.", "a": [["onfidence"]], "pre": ["c"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Where does confidence come from?", "paras": [["", "Confidence is a mix of self-esteem – believing you are valuable – and the optimism that comes when you are sure of your abilities. Empowered by these, you can act courageously and face challenges head-on."], ["", "Three factors influence confidence. The first is what you are born with, such as your genes, which affect the balance of neurochemicals in your brain. The second is how you are treated by others. The third is the part you control: the risks you take and how you respond to setbacks."], ["", "It isn’t possible to completely untangle these factors, but our choices play a major role. Neuroscience shows that practising a skill builds confidence in it."], ["", "So try a growth mindset: believe you can improve. Ask for constructive feedback, persevere after failure, and give yourself a pep talk when you need it."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Confidence combines self-esteem and ___.", "o": ["optimism", "intelligence", "popularity"], "a": 0}, {"t": "mc", "q": "Which factor do you have most control over?", "o": ["your genes", "your choices and responses", "how others treat you"], "a": 1}, {"t": "mc", "q": "What do genes affect?", "o": ["your choices", "neurochemicals in the brain", "how others treat you"], "a": 1}, {"t": "mc", "q": "What does neuroscience show?", "o": ["Practice builds confidence.", "Confidence cannot change.", "Genes decide everything."], "a": 0}, {"t": "mc", "q": "What is a growth mindset?", "o": ["never asking for feedback", "believing you can improve", "avoiding failure"], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a student, Nurlan, talking about a speech competition.", "script": [["Teacher", "How did the speech competition go, Nurlan?"], ["Nurlan", "Not great. I forgot half my speech. If only I had practised more!"], ["Teacher", "How did you feel?"], ["Nurlan", "Terrible. My hands were shaking. If only I were more confident, like Dana."], ["Teacher", "Dana was nervous at her first competition too. She came last."], ["Nurlan", "Really? I didn’t know that."], ["Teacher", "She kept going and asked for feedback every time. That’s a growth mindset."], ["Nurlan", "OK. If only my brother would stop laughing at me, though."], ["Teacher", "Ha! Let’s start practising for the next one on Thursday."]]}, "parts": [{"items": [{"t": "mc", "q": "What went wrong for Nurlan?", "o": ["He was late.", "He lost his notes.", "He forgot half his speech."], "a": 2}, {"t": "mc", "q": "What does Nurlan wish about the past?", "o": ["that Dana had helped", "that he had practised more", "that he hadn’t entered"], "a": 1}, {"t": "mc", "q": "What happened at Dana’s first competition?", "o": ["She won.", "She didn’t go.", "She came last."], "a": 2}, {"t": "mc", "q": "What does Nurlan wish his brother would do?", "o": ["come to the next competition", "stop laughing at him", "help him practise"], "a": 1}, {"t": "mc", "q": "When will they start practising?", "o": ["tomorrow", "Thursday", "next month"], "a": 1}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "if only + past / past perfect / would; self-esteem, setbacks, persevere, cultivate, growth mindset.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Make three sentences with ‘If only…’ about your life now, the past and another person.", "When do you feel most confident?", "How do you deal with setbacks?", "Who helps you feel confident?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Can confidence be learned?", "Is overconfidence dangerous?", "What advice would you give a shy new student?"]}]}}]}, {"id": "t55", "kind": "quick", "group": "t5.5", "title": "Unit 5.5 Test", "focus": "5.5 Why it’s cool to be kind: adjectives ending in -ed (feelings) and -ing (things that cause feelings).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "The film was so ___ that I fell asleep.", "o": ["bored", "bore", "boring"], "a": 2}, {"t": "mc", "q": "I was ___ when the hairdresser showed me the result.", "o": ["surprising", "surprised", "surprise"], "a": 1}, {"t": "mc", "q": "The instructions were really ___.", "o": ["confusing", "confused", "confuse"], "a": 0}, {"t": "mc", "q": "I’m so ___ about the trip!", "o": ["exciting", "excited", "excite"], "a": 1}, {"t": "mc", "q": "His loud music is ___.", "o": ["annoying", "annoy", "annoyed"], "a": 0}, {"t": "mc", "q": "Tom is ___ at school – he isn’t interested in anything.", "o": ["bore", "boring", "bored"], "a": 2}, {"t": "mc", "q": "Tom is ___ – nobody wants to listen to his stories.", "o": ["bored", "boring", "bores"], "a": 1}, {"t": "mc", "q": "Helping others is very ___.", "o": ["satisfying", "satisfied", "satisfy"], "a": 0}, {"t": "mc", "q": "She felt ___ when she couldn’t solve the problem.", "o": ["frustrate", "frustrated", "frustrating"], "a": 1}, {"t": "mc", "q": "-ed adjectives usually describe ___.", "o": ["how people feel", "things and situations", "the weather"], "a": 0}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Deliberately developing something: ___.", "o": ["cultivation", "discernment", "alleviation"], "a": 0}, {"t": "mc", "q": "Not caring about others’ feelings: ___.", "o": ["inherent", "blunt", "insensitive"], "a": 2}, {"t": "mc", "q": "Very direct, not polite: ___.", "o": ["contagious", "blunt", "tender"], "a": 1}, {"t": "mc", "q": "Part of the basic nature of something: ___.", "o": ["blunt", "inherent", "contagious"], "a": 1}, {"t": "mc", "q": "Make pain less severe: ___.", "o": ["cultivate", "alleviate", "deem"], "a": 1}, {"t": "mc", "q": "Caring about others without expecting anything back: ___.", "o": ["altruism", "discernment", "empathy"], "a": 0}, {"t": "mc", "q": "Able to spread to others: ___.", "o": ["inherent", "contagious", "insensitive"], "a": 1}, {"t": "mc", "q": "The ability to judge well: ___.", "o": ["cultivation", "altruism", "discernment"], "a": 2}, {"t": "mc", "q": "An act of kindness: a good ___.", "o": ["act", "deed", "work"], "a": 1}, {"t": "mc", "q": "Understanding and sharing others’ feelings: ___.", "o": ["empathy", "apathy", "sympathy card"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "A <b>r</b>{} act of kindness is a small kind action for a stranger.", "a": [["andom"]], "pre": ["r"]}, {"t": "gap", "q": "Kindness can create a <b>r</b>{} effect – it spreads.", "a": [["ipple"]], "pre": ["r"]}, {"t": "gap", "q": "Pay it <b>f</b>{}: be kind to someone else.", "a": [["orward"]], "pre": ["f"]}, {"t": "gap", "q": "Showing <b>c</b>{} to yourself makes it easier to be kind to others.", "a": [["ompassion"]], "pre": ["c"]}, {"t": "gap", "q": "The child was <b>f</b>{} of the dark.", "a": [["rightened"]], "pre": ["f"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "The surprising power of kindness", "paras": [["", "Kindness seems inherent in humans: as social animals, we need others’ kindness to survive. But it isn’t always simple. Houston Kraft, who teaches social and emotional skills, says kindness does have a cost – usually our comfort."], ["", "Kindness starts with being kind to yourself. Psychologist Dr James Kirby says the same brain regions light up when we are kind to ourselves as when we receive kindness from others."], ["", "Kindness is also contagious. In a 2018 study at a Spanish company, employees who received acts of kindness became happier and passed the kindness on – but the givers benefited even more."], ["", "When we are kind, our brains release oxytocin and serotonin, which can lower blood pressure and give us a ‘feel-good rush’."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why is kindness inherent in humans?", "o": ["We need others to survive.", "It is taught at school.", "It costs nothing."], "a": 0}, {"t": "mc", "q": "According to Kraft, what does kindness usually cost?", "o": ["time only", "money", "comfort"], "a": 2}, {"t": "mc", "q": "What does Dr Kirby say about self-kindness?", "o": ["It is selfish.", "It activates the same brain regions.", "It is less important."], "a": 1}, {"t": "mc", "q": "In the Spanish study, who benefited most?", "o": ["the givers", "the managers", "the receivers"], "a": 0}, {"t": "mc", "q": "What does oxytocin do?", "o": ["It can lower blood pressure.", "It causes stress.", "It makes us tired."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends talking about a kindness challenge.", "script": [["Aliya", "Our class is doing a kindness challenge this week. One random act of kindness every day."], ["Timur", "Sounds a bit boring. What have you done?"], ["Aliya", "It’s not boring at all! On Monday I paid for an old lady’s bus ticket. She was so surprised."], ["Timur", "Nice. What else?"], ["Aliya", "Yesterday I helped a new student who was confused about the timetable. Today I’m writing a thank-you note to the cleaner."], ["Timur", "Does it actually make you feel good?"], ["Aliya", "Honestly, it’s really satisfying. And it’s contagious – my sister started doing it too."], ["Timur", "OK, I’m convinced. I’ll start by not being annoying to my brother."]]}, "parts": [{"items": [{"t": "mc", "q": "How often should they do an act of kindness?", "o": ["once", "once a week", "every day"], "a": 2}, {"t": "mc", "q": "What did Aliya do on Monday?", "o": ["helped a new student", "paid for a bus ticket", "wrote a note"], "a": 1}, {"t": "mc", "q": "Why was the new student confused?", "o": ["about the bus", "about the timetable", "about homework"], "a": 1}, {"t": "mc", "q": "How does Aliya feel about the challenge?", "o": ["It’s frustrating.", "It’s boring.", "It’s satisfying."], "a": 2}, {"t": "mc", "q": "What will Timur do?", "o": ["stop annoying his brother", "write a note", "pay for a bus ticket"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "-ed / -ing adjectives; altruism, contagious, inherent, empathy, pay it forward.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Describe a kind act someone did for you. How did you feel?", "What do you find annoying, boring and exciting?", "Is it hard to be kind to yourself?", "Have you ever paid a kindness forward?"]}, {"name": "Role play / Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Is kindness always good? Can it be harmful?", "Should schools teach kindness?", "Plan a kindness challenge for your class."]}]}}]}, {"id": "t61", "kind": "quick", "group": "t6.1", "title": "Unit 6.1 Test", "focus": "6.1 The repetition recipe for a hit: anaphora (repeating words at the start of phrases: ‘I have a dream…’, ‘Go big or go home’).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "Anaphora is the repetition of a word or phrase at the ___ of clauses or sentences.", "o": ["end", "beginning", "middle"], "a": 1}, {"t": "mc", "q": "Go big or go ___.", "o": ["away", "home", "out"], "a": 1}, {"t": "mc", "q": "Give me liberty or give me ___.", "o": ["death", "life", "freedom"], "a": 0}, {"t": "mc", "q": "___ if you do and damned if you don’t.", "o": ["Blamed", "Saved", "Damned"], "a": 2}, {"t": "mc", "q": "So many places, so ___ time.", "o": ["little", "few", "much"], "a": 0}, {"t": "mc", "q": "Fool me once, shame on you. Fool me twice, shame on ___.", "o": ["me", "you", "them"], "a": 0}, {"t": "mc", "q": "Monkey see, monkey ___.", "o": ["do", "eat", "say"], "a": 0}, {"t": "mc", "q": "Open heart, open ___.", "o": ["eyes", "mind", "door"], "a": 1}, {"t": "mc", "q": "Great haste makes great ___.", "o": ["success", "waste", "taste"], "a": 1}, {"t": "mc", "q": "Martin Luther King repeated ‘I have a ___’.", "o": ["hope", "dream", "plan"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "A catchy song that stays in your head: an ___.", "o": ["earworm", "anthem", "echo"], "a": 0}, {"t": "mc", "q": "Holding your attention: ___.", "o": ["compelling", "sluggish", "brute-force"], "a": 0}, {"t": "mc", "q": "Too strong to resist: ___.", "o": ["irresistibly", "aesthetically", "unconsciously"], "a": 0}, {"t": "mc", "q": "Without awareness: ___.", "o": ["unconsciously", "consciously", "irresistibly"], "a": 0}, {"t": "mc", "q": "Sing with your mouth closed: ___.", "o": ["slurp", "chant", "hum"], "a": 2}, {"t": "mc", "q": "Repeated until boring: ad ___.", "o": ["nauseam", "hoc", "infinitum"], "a": 0}, {"t": "mc", "q": "In a beautiful way: ___.", "o": ["aesthetically", "compellingly", "brutally"], "a": 0}, {"t": "mc", "q": "How easily someone is affected: ___.", "o": ["anaphora", "repetition", "susceptibility"], "a": 2}, {"t": "mc", "q": "The repeated part of a song after each verse: the ___.", "o": ["chorus", "verse", "bridge"], "a": 0}, {"t": "mc", "q": "Liking something more the more often we hear it: the mere-___ effect.", "o": ["repeat", "listening", "exposure"], "a": 2}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "The song is so <b>c</b>{} – everyone was singing it after one listen.", "a": [["atchy"]], "pre": ["c"]}, {"t": "gap", "q": "The <b>h</b>{} is the short part of the song that grabs you.", "a": [["ook"]], "pre": ["h"]}, {"t": "gap", "q": "Almost all music uses <b>r</b>{} – the same parts again and again.", "a": [["epetition"]], "pre": ["r"]}, {"t": "gap", "q": "Some producers use a <b>b</b>{} approach, copying and pasting the same part.", "a": [["rute-force"]], "pre": ["b"]}, {"t": "gap", "q": "Brain scans can help <b>p</b>{} which songs will become hits.", "a": [["redict"]], "pre": ["p"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "How to create a hit", "paras": [["", "Researchers at Emory University put teenagers aged 12 to 17 into MRI machines and played them songs by unknown artists. Afterwards, the teens said how much they liked each song."], ["", "Surprisingly, their answers were not very useful. But activity in the brain’s reward centre, the ventral striatum, predicted which songs would later become hits – even when the teens said they didn’t like them."], ["", "Repetition seems to be a key ingredient. Psychologists call it the ‘mere-exposure effect’: we tend to like things more the more often we hear them. In one study, people preferred music by respected composers after it had been edited to be more repetitive."], ["", "Repetition also makes songs irresistibly easy to hum and move to – which is why the best earworms are so hard to get out of your head."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "How old were the teenagers in the study?", "o": ["12 to 17", "8 to 12", "18 to 25"], "a": 0}, {"t": "mc", "q": "What predicted a song’s success best?", "o": ["the artist’s fame", "activity in the brain’s reward centre", "the teens’ answers"], "a": 1}, {"t": "mc", "q": "What is the mere-exposure effect?", "o": ["hearing songs in the background", "liking things more the more we hear them", "disliking new songs"], "a": 1}, {"t": "mc", "q": "In one study, people preferred music that ___.", "o": ["had no chorus", "was completely original", "had been made more repetitive"], "a": 2}, {"t": "mc", "q": "Why are earworms hard to forget?", "o": ["They have complex lyrics.", "They are repetitive and easy to hum.", "They are very long."], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends arguing about a song.", "script": [["Leo", "Have you heard the new song by Mira? It’s been in my head all day."], ["Faith", "Ugh, yes. It’s so repetitive. She says ‘tonight’ about forty times!"], ["Leo", "That’s why it’s catchy. Repetition is the recipe for a hit."], ["Faith", "Maybe, but after the tenth time I wanted to scream. It’s repeated ad nauseam."], ["Leo", "But you were humming it in the canteen!"], ["Faith", "That was unconscious! It’s an earworm. I can’t help it."], ["Leo", "Exactly. Monkey see, monkey do. Or should I say monkey hear, monkey hum?"], ["Faith", "Very funny. Next time, let’s listen to something with real lyrics."]]}, "parts": [{"items": [{"t": "mc", "q": "How long has the song been in Leo’s head?", "o": ["an hour", "all week", "all day"], "a": 2}, {"t": "mc", "q": "What word does the singer repeat?", "o": ["dance", "tonight", "forever"], "a": 1}, {"t": "mc", "q": "How many times, according to Faith?", "o": ["about forty", "about four", "about ten"], "a": 0}, {"t": "mc", "q": "Where was Faith humming the song?", "o": ["in class", "on the bus", "in the canteen"], "a": 2}, {"t": "mc", "q": "What does Faith want next time?", "o": ["no music", "a song with real lyrics", "a repetitive song"], "a": 1}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "anaphora and repetition; catchy, earworm, compelling, hum, ad nauseam, mere-exposure effect.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Which song is your current earworm?", "Are there songs you never get sick of?", "Can you explain exactly why you like your favourite song?", "Make your own anaphora slogan for a school campaign."]}, {"name": "Debate", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["‘Science is ruining music.’ Agree or disagree?", "Can scientists predict hit songs?", "Is repetitive music lazy or clever?"]}]}}]}, {"id": "t62", "kind": "quick", "group": "t6.2", "title": "Unit 6.2 Test", "focus": "6.2 The world of Fortnite: features of the Australian accent (dropped r, softened t, rising tone, long vowels).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "In an Australian accent, ‘teacher’ sounds like ___.", "o": ["tea-cher-ah", "teacha", "teacheR"], "a": 1}, {"t": "mc", "q": "‘Riding’ often sounds like ___.", "o": ["rideeng", "ridin", "riting"], "a": 1}, {"t": "mc", "q": "‘Water’ often sounds like ___.", "o": ["watter", "wahter", "wadda"], "a": 2}, {"t": "mc", "q": "‘Nice’ often sounds like ___.", "o": ["nace", "noice", "nees"], "a": 1}, {"t": "mc", "q ames? Which ones?", "Would you pay real money for a skin? Why/why not?", "Which English accents can you recognise?", "Try reading a sentence with an Australian accent."]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Why is Fortnite so popular?", "Are in-game purchases fair to young players?", "Is gaming a real career?"]}]}}]}, {"id": "t63", "kind": "quick", "group": "t6.3", "title": "Unit 6.3 Test", "focus": "6.3 Marvel powers: reported speech (backshift: is → was, has done → had done, will → would; here → there, tomorrow → the next day).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "‘My name is Ben.’ → He told me his name ___ Ben.", "o": ["is being", "was", "had"], "a": 1}, {"t": "mc", "q": "‘I am taking a break.’ → She said she ___ a break.", "o": ["is taking", "was taking", "takes"], "a": 1}, {"t": "mc", "q": "‘We have clobbered some villains.’ → They said they ___ some villains.", "o": ["have clobbered", "had clobbered", "clobber"], "a": 1}, {"t": "mc", "q": "‘I will do it tomorrow.’ → He said he ___ do it the next day.", "o": ["would", "will", "had"], "a": 0}, {"t": "mc", "q": "‘It was right here.’ → She said it was right ___.", "o": ["here", "there", "then"], "a": 1}, {"t": "mc", "q": "‘I had been asked.’ → He said he ___ been asked.", "o": ["would", "has", "had"], "a": 2}, {"t": "mc", "q": "‘I don’t like peanuts.’ → He said he ___ peanuts.", "o": ["didn’t like", "doesn’t liked", "hadn’t like"], "a": 0}, {"t": "mc", "q": "‘I’m with my friend.’ → She said she was with ___ friend.", "o": ["your", "my", "her"], "a": 2}, {"t": "mc", "q": "‘tomorrow’ usually becomes ___ in reported speech.", "o": ["yesterday", "today", "the following day"], "a": 2}, {"t": "mc", "q": "We don’t always change the tense when the information is ___.", "o": ["still true", "in the past", "a questio
