the right age for a smartphone?", "paras": [["", "In the UK, 44% of children own a smartphone at nine, rising to 91% by eleven. In the US, about 95% of teenagers have access to one. But is this a Pandora’s box?"], ["", "Psychologist Amy Orben analysed data from over 17,000 young people. Girls who used social media heavily at 11 to 13, and boys at 14 to 15, reported lower life satisfaction a year later. Conversely, lower use predicted higher satisfaction."], ["", "However, Professor Candice Odgers reviewed six large studies and found no consistent link between digital technology and mental health problems. She talks about a ‘disconnect’ between what people believe and what the evidence says."], ["", "Experts agree on one thing: parents should look at their own phone habits. ‘Children hate hypocrisy,’ says Professor Sonia Livingstone."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "What percentage of UK nine-year-olds own a smartphone?", "o": ["95%", "91%", "44%"], "a": 2}, {"t": "mc", "q": "What did Amy Orben find?", "o": ["Boys are affected earlier than girls.", "All screen time is harmful.", "Heavy social media use at certain ages predicted lower life satisfaction."], "a": 2}, {"t": "mc", "q": "What did Candice Odgers find?", "o": ["Girls suffer most.", "There was no consistent link.", "Phones always cause anxiety."], "a": 1}, {"t": "mc", "q": "What does ‘disconnect’ mean here?", "o": ["stopping using a phone", "losing internet access", "a difference between beliefs and evidence"], "a": 2}, {"t": "mc", "q": "What do experts agree on?", "o": ["Phones improve friendships.", "Parents should think about their own phone use.", "Children should not have phones."], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear part of a video about taking better photos with your phone.", "script": [["Presenter", "Hi everyone! Today let’s talk about four simple tricks for better phone photos."], ["Presenter", "First, let’s look at the rule of thirds. Turn on the grid on your camera and put your subject on one of the lines, not right in the middle."], ["Presenter", "Next, leading lines. Roads, fences or rivers can lead the viewer’s eye straight to your subject."], ["Presenter", "Number three is symmetry. Find a building or a reflection in water where both sides match. Here, it’s fine to put your subject in the centre."], ["Presenter", "Finally, framing within your frame. Shoot through a window, a doorway or between branches to create a natural frame."], ["Presenter", "So, let’s go outside and practise. Take one photo with each trick and compare them with a friend."]]}, "parts": [{"items": [{"t": "mc", "q": "For the rule of thirds, you should ___.", "o": ["put the subject on a grid line", "zoom in a lot", "always use the centre"], "a": 0}, {"t": "mc", "q": "Which is an example of a leading line?", "o": ["a cloud", "a face", "a road"], "a": 2}, {"t": "mc", "q": "When is it OK to put the subject in the centre?", "o": ["with the rule of thirds", "with leading lines", "with symmetry"], "a": 2}, {"t": "mc", "q": "‘Framing within your frame’ means shooting ___.", "o": ["from very far away", "through a window or doorway", "in black and white"], "a": 1}, {"t": "mc", "q": "What does the presenter suggest at the end?", "o": ["buying a new phone", "watching another video", "going outside to practise"], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "let’s + infinitive; Pandora’s box, the jury is out, hypocrisy, coercive, conversely, maturity.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["How old were you when you got your first smartphone?", "What do you use your phone for most?", "Have you noticed phone hypocrisy in adults?", "Could you live without your phone for a week?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["What is the right age to get a smartphone? Why?", "Should parents track their children’s phones?", "Give three photo tips starting with ‘Let’s…’."]}]}}]}, {"id": "t21", "kind": "quick", "group": "t2.1", "title": "Unit 2.1 Test", "focus": "2.1 All about poo: euphemisms (toilet euphemisms, ‘between jobs’); animal and dung-beetle vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "A euphemism is a word used to make something sound ___.", "o": ["less direct and more pleasant", "more serious", "more scientific"], "a": 0}, {"t": "mc", "q": "‘Between jobs’ is a euphemism for ___.", "o": ["retired", "busy", "unemployed"], "a": 2}, {"t": "mc", "q": "‘Excuse me, I need to ___ my nose.’ (= go to the toilet)", "o": ["powder", "blow", "wash"], "a": 0}, {"t": "mc", "q": "Which phrase is a euphemism for ‘toilet’?", "o": ["the waiting room", "the smallest room", "the living room"], "a": 1}, {"t": "mc", "q": "‘Nature ___’ means you need the toilet.", "o": ["shouts", "calls", "rings"], "a": 1}, {"t": "mc", "q": "In American English, a public toilet is often called a ___.", "o": ["bathtub", "rest house", "restroom"], "a": 2}, {"t": "mc", "q": "‘Do a number ___’ is a childish euphemism for urinating.", "o": ["one", "two", "three"], "a": 0}, {"t": "mc", "q": "‘I need to see a man about a ___’ means you’re going to the toilet.", "o": ["dog", "cat", "horse"], "a": 0}, {"t": "mc", "q": "Which is a euphemism for ‘short’ used humorously?", "o": ["vertically challenged", "horizontally tall", "height-free"], "a": 0}, {"t": "mc", "q": "In British English, ‘the ___’ is an informal word for toilet.", "o": ["loo", "lounge", "lobby"], "a": 0}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Slow-moving and without energy is ___.", "o": ["sluggish", "furry", "baffling"], "a": 0}, {"t": "mc", "q": "Covered in soft thick hair is ___.", "o": ["furry", "potent", "vulnerable"], "a": 0}, {"t": "mc", "q": "Very confusing and hard to understand is ___.", "o": ["baffling", "sluggish", "supposedly"], "a": 0}, {"t": "mc", "q": "Bat guano was used to make ___.", "o": ["coffee", "explosives", "medicine"], "a": 1}, {"t": "mc", "q": "Coming down from the tree makes sloths ___ to predators.", "o": ["potent", "furry", "vulnerable"], "a": 2}, {"t": "mc", "q": "___ , civet-cat coffee tastes exceptional – but is it true?", "o": ["Conversely", "Inadvertently", "Supposedly"], "a": 2}, {"t": "mc", "q": "Over the years, guano ___ in the cave.", "o": ["defecated", "germinated", "accumulated"], "a": 2}, {"t": "mc", "q": "Farm animals such as cows are called ___.", "o": ["offspring", "livestock", "larvae"], "a": 1}, {"t": "mc", "q": "Dung beetles help seeds ___ – start to grow.", "o": ["inflict", "accumulate", "germinate"], "a": 2}, {"t": "mc", "q": "The babies of an animal are its ___.", "o": ["dung", "offspring", "livestock"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Sloths suffer from <b>c</b>{} – they go to the toilet only once a week.", "a": [["onstipation"]], "pre": ["c"]}, {"t": "gap", "q": "Some beetles roll a ball of <b>d</b>{} away from competitors.", "a": [["ung"]], "pre": ["d"]}, {"t": "gap", "q": "Animals <b>i</b>{} spread seeds when they eat fruit.", "a": [["nadvertently"]], "pre": ["i"]}, {"t": "gap", "q": "Burying dung reduces the <b>l</b>{} of flies spreading disease.", "a": [["ikelihood"]], "pre": ["l"]}, {"t": "gap", "q": "Elephant dung has a very <b>p</b>{} smell.", "a": [["otent"]], "pre": ["p"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Surprising pooping habits", "paras": [["", "Sloths are famously sleepy, and so is their digestion. They go to the toilet only once a week, which is the only reason they climb down from the trees, even though it makes them vulnerable to predators. Before and after, they do a little ‘poo dance’."], ["", "Wombats, furry marsupials from Australia, produce cube-shaped poo – nearly a hundred cubes a day. Scientists were baffled until they discovered that the animals’ elastic intestines shape it. Square poo does not roll, so wombats can use it to mark their territory on rocks."], ["", "Pandas eat bamboo for up to sixteen hours a day, so it is no surprise that they poo about forty times a day – even while they are sleeping."], ["", "Finally, bat poo, or guano, contains potassium nitrate and has been used to make explosives. In Texas, a cave full of accumulated guano was once hit by lightning – with explosive results."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why do sloths come down from trees?", "o": ["to escape predators", "to go to the toilet", "to find food"], "a": 1}, {"t": "mc", "q": "Why is wombat poo square?", "o": ["They eat square food.", "Their intestines shape it.", "Their bottoms are square."], "a": 1}, {"t": "mc", "q": "Why is square poo useful for wombats?", "o": ["It helps plants grow.", "It is easier to bury.", "It stays in place to mark territory."], "a": 2}, {"t": "mc", "q": "How often do pandas poo?", "o": ["once a week", "sixteen times a day", "about forty times a day"], "a": 2}, {"t": "mc", "q": "What happened in the Texas cave?", "o": ["Lightning made the guano explode.", "Bats left the cave.", "Scientists collected coffee beans."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear part of a nature documentary about dung beetles.", "script": [["Narrator", "Every day, the world’s animals produce an enormous amount of waste. Luckily, there are around seven thousand species of dung beetle to deal with it."], ["Narrator", "A single dung beetle can bury two hundred and fifty times its body weight in one night. Its first task is to find the dung, which it does using its excellent sense of smell."], ["Narrator", "There are three main types. Rollers sculpt a ball of dung and quickly roll it away from competitors. Tunnellers dig underneath and drag the dung down into the soil. Dwellers simply lay their eggs inside the dung pat."], ["Narrator", "Dung beetles are not just cleaners. By burying dung, they bring nutrients to plant roots and help seeds germinate. They even reduce greenhouse gas emissions from livestock farms."], ["Narrator", "A pile of elephant dung can attract up to four thousand beetles in fifteen minutes."]]}, "parts": [{"items": [{"t": "mc", "q": "How many species of dung beetle are there?", "o": ["around 7,000", "around 6,000", "around 8,000"], "a": 0}, {"t": "mc", "q": "How much can a beetle bury in a night?", "o": ["250 times its body weight", "350 times its body weight", "450 times its body weight"], "a": 0}, {"t": "mc", "q": "How do beetles find dung?", "o": ["by sound", "by sight", "by smell"], "a": 2}, {"t": "mc", "q": "Which type lays eggs directly in the dung pat?", "o": ["rollers", "dwellers", "tunnellers"], "a": 1}, {"t": "mc", "q": "How many beetles can a pile of elephant dung attract?", "o": ["up to 2,000", "up to 3,000", "up to 4,000"], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "euphemisms; sluggish, vulnerable, baffling, accumulate, supposedly, offspring.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Which animal fact from this unit surprised you most?", "Which euphemisms do you use in your language for the toilet?", "Why do people use euphemisms?", "Which underappreciated animal deserves more attention?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["What would happen if dung beetles disappeared?", "Would you drink £500 civet-cat coffee?", "Are euphemisms polite or dishonest?"]}]}}]}, {"id": "t22", "kind": "quick", "group": "t2.2", "title": "Unit 2.2 Test", "focus": "2.2 Dolphins have pee names: plurals and possessives with names (the Joneses, Thomas’s / Thomas’); family and animal vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "There are three ___ in my class.", "o": ["Lizes", "Liz’s", "Lizs"], "a": 0}, {"t": "mc", "q": "Mr and Mrs Smith are ___.", "o": ["the Smith’s", "the Smithes", "the Smiths"], "a": 2}, {"t": "mc", "q": "The Cruz family are ___.", "o": ["the Cruzs", "the Cruzes", "the Cruz’s"], "a": 1}, {"t": "mc", "q": "This is ___ book. (belongs to Chris)", "o": ["Chrises", "Chris’s", "Chris’"], "a": 1}, {"t": "mc", "q": "That’s ___ dog. (belongs to the Smith family)", "o": ["the Smiths’s", "the Smiths’", "the Smith’s"], "a": 1}, {"t": "mc", "q": "I can’t find ___ coat. (belongs to Sarah)", "o": ["Sarahs", "Sarahs’", "Sarah’s"], "a": 2}, {"t": "mc", "q": "There are four ___ at work. (people called Edward)", "o": ["Edward’s", "Edwards", "Edwardes"], "a": 1}, {"t": "mc", "q": "That’s ___ cat. (belongs to the Joneses)", "o": ["the Joneses’", "the Joneses’s", "the Jones’s"], "a": 0}, {"t": "mc", "q": "When we say ‘Thomas’s friend’, the ’s is ___.", "o": ["pronounced as an extra syllable", "silent", "pronounced like ‘z’ only"], "a": 0}, {"t": "mc", "q": "I’m having dinner with Tim and Sarah Clarence – ___.", "o": ["the Clarencees", "the Clarence’s", "the Clarences"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "A child whose parents have died is an ___.", "o": ["kin", "ally", "orphan"], "a": 2}, {"t": "mc", "q": "Your family members are your ___.", "o": ["kin", "alliance", "pod"], "a": 0}, {"t": "mc", "q": "Confused and not sure where you are is ___.", "o": ["paternal", "tight-knit", "disoriented"], "a": 2}, {"t": "mc", "q": "A brother with only one parent in common is a ___.", "o": ["half-sibling", "step-parent", "cousin"], "a": 0}, {"t": "mc", "q": "My father’s parents are my ___ grandparents.", "o": ["paternal", "maternal", "half"], "a": 0}, {"t": "mc", "q": "The cuckoo is a brood ___ – other birds raise its chicks.", "o": ["alliance", "orphan", "parasite"], "a": 2}, {"t": "mc", "q": "Producing young with close relatives is ___.", "o": ["inbreeding", "hatching", "suckling"], "a": 0}, {"t": "mc", "q": "Dolphins travel in groups called ___.", "o": ["flocks", "herds", "pods"], "a": 2}, {"t": "mc", "q": "A female sheep is a ___.", "o": ["ram", "lamb", "ewe"], "a": 2}, {"t": "mc", "q": "Chicks ___ from eggs.", "o": ["hatch", "bleat", "suckle"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "The two male dolphins formed an <b>a</b>{} to protect each other.", "a": [["lliance"]], "pre": ["a"]}, {"t": "gap", "q": "Each dolphin has a signature <b>w</b>{} that works like a name.", "a": [["histle"]], "pre": ["w"]}, {"t": "gap", "q": "Scientists are studying the <b>c</b>{} abilities of dolphins – how they think and remember.", "a": [["ognitive"]], "pre": ["c"]}, {"t": "gap", "q": "Lambs <b>b</b>{} to call their mothers.", "a": [["leat"]], "pre": ["b"]}, {"t": "gap", "q": "They are a very <b>t</b>{} group who support each other.", "a": [["ight-knit"]], "pre": ["t"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "How animals recognise their family", "paras": [["", "Bottlenose dolphins give themselves names. Each one develops a unique signature whistle, and other dolphins remember it for more than twenty years. Researchers have also found that dolphins can identify friends by tasting their urine – a ‘pee name’."], ["", "Other animals have different strategies. A mother sheep recognises her lamb by its smell and its bleat, which is important when hundreds of lambs look exactly alike."], ["", "Some birds are less careful. The common cuckoo is a brood parasite: it lays its eggs in the nests of other birds, such as reed warblers. The warblers then feed the cuckoo chick as if it were their own, even when it grows much bigger than them."], ["", "Recognising kin is not only about care. It also helps animals avoid inbreeding, which can cause health problems in their offspring."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "How long do dolphins remember signature whistles?", "o": ["more than twenty years", "one year", "ten years"], "a": 0}, {"t": "mc", "q": "How else can dolphins identify friends?", "o": ["by tasting their urine", "by their smell in the air", "by their colour"], "a": 0}, {"t": "mc", "q": "A mother sheep recognises her lamb by ___.", "o": ["smell and sound", "its colour", "its size"], "a": 0}, {"t": "mc", "q": "What does a cuckoo do?", "o": ["It lays eggs in other birds’ nests.", "It raises other birds’ chicks.", "It eats reed warblers."], "a": 0}, {"t": "mc", "q": "Why is recognising kin important, according to the last paragraph?", "o": ["to find food", "to avoid inbreeding", "to form pods"], "a": 1}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear an interview with a biologist about how animals recognise each other.", "script": [["Interviewer", "How do humans recognise family?"], ["Expert", "Mostly by faces and voices. But we also recognise smell more than we realise – babies can identify their mother’s smell within days."], ["Interviewer", "What about sheep?"], ["Expert", "A ewe learns her lamb’s smell in the first hours after birth. If a farmer shears the sheep, the lambs can become disoriented because the mothers smell and look different."], ["Interviewer", "And birds?"], ["Expert", "Grey-headed albatrosses recognise their partner’s call among thousands of birds. They mate for life."], ["Interviewer", "Do insects recognise kin?"], ["Expert", "Bees do. They use smell from their gut microbia, so guard bees can tell if a bee belongs to their hive."]]}, "parts": [{"items": [{"t": "mc", "q": "How quickly can babies identify their mother’s smell?", "o": ["within days", "after a year", "within hours"], "a": 0}, {"t": "mc", "q": "When does a ewe learn her lamb’s smell?", "o": ["after a week", "in the first hours after birth", "when it is sheared"], "a": 1}, {"t": "mc", "q": "Why can lambs become disoriented after shearing?", "o": ["Their mothers look and smell different.", "The farmer moves them.", "They are cold."], "a": 0}, {"t": "mc", "q": "What does the expert say about albatrosses?", "o": ["They live alone.", "They are brood parasites.", "They mate for life."], "a": 2}, {"t": "mc", "q": "How do guard bees recognise hive members?", "o": ["by smell", "by colour", "by sound"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "plurals and possessives with names (the Smiths’ house, James’s phone); kin, orphan, half-sibling, paternal, pod.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Are there any famous families in your country? Use plurals: ‘the …s’.", "Do you have any half-siblings or cousins you are close to?", "Do you have a nickname? Where does it come from?", "Is your name common or unusual?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Why is it important to study animal behaviour?", "Would you like to be a dolphin? Why/why not?", "Do animals have something like names?"]}]}}]}, {"id": "t23", "kind": "quick", "group": "t2.3", "title": "Unit 2.3 Test", "focus": "2.3 The most painful insect bites: similes (like, as … as, as if) and metaphors; pain and insect vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "A simile uses ___ to compare things.", "o": ["is or are", "like or as", "and or but"], "a": 1}, {"t": "mc", "q": "‘She sings like a bird’ is a ___.", "o": ["metaphor", "simile", "euphemism"], "a": 1}, {"t": "mc", "q": "‘The singer is a bird’ is a ___.", "o": ["simile", "idiom", "metaphor"], "a": 2}, {"t": "mc", "q": "‘Life is like a box of chocolates’ is a ___.", "o": ["metaphor", "simile", "anaphora"], "a": 1}, {"t": "mc", "q": "‘You are chained in the flow of an active volcano’ is a ___.", "o": ["euphemism", "simile", "metaphor"], "a": 2}, {"t": "mc", "q": "She sings ___ beautifully as a bird.", "o": ["as", "like", "than"], "a": 0}, {"t": "mc", "q": "He ran ___ he were being chased by a bear.", "o": ["as like", "like as", "as if"], "a": 2}, {"t": "mc", "q": "‘Like walking over flaming charcoal’ describes the pain as a ___.", "o": ["simile", "metaphor", "fact"], "a": 0}, {"t": "mc", "q": "‘The night is black as coffee’ is a ___.", "o": ["simile", "metaphor", "neither"], "a": 0}, {"t": "mc", "q": "‘Baby, you’re a firework’ is a ___.", "o": ["metaphor", "neither", "simile"], "a": 0}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Run away from danger is ___.", "o": ["inflict", "vomit", "flee"], "a": 2}, {"t": "mc", "q": "Actions taken to avoid harm are ___.", "o": ["precautions", "predators", "colonies"], "a": 0}, {"t": "mc", "q": "Bees live together in a ___.", "o": ["colony", "herd", "pod"], "a": 0}, {"t": "mc", "q": "So painful that it makes you weak is ___.", "o": ["debilitating", "squeamish", "venomous"], "a": 0}, {"t": "mc", "q": "Peterson says he is not a ___ – he doesn’t enjoy pain.", "o": ["predator", "colony", "masochist"], "a": 2}, {"t": "mc", "q": "He does it for ___ – to educate people.", "o": ["precaution", "swelling", "edification"], "a": 2}, {"t": "mc", "q": "A snake that can inject poison is ___.", "o": ["squeamish", "debilitating", "venomous"], "a": 2}, {"t": "mc", "q": "If blood makes you feel sick, you are ___.", "o": ["squeamish", "venomous", "furry"], "a": 0}, {"t": "mc", "q": "Animals that hunt others are ___.", "o": ["creepy-crawlies", "colonies", "predators"], "a": 2}, {"t": "mc", "q": "The feeling that you are going to be sick is ___.", "o": ["swelling", "nausea", "vein"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "The tarantula hawk wasp can <b>i</b>{} terrible pain for two or three minutes.", "a": [["nflict"]], "pre": ["i"]}, {"t": "gap", "q": "After the bite there was a lot of <b>s</b>{} on his arm.", "a": [["welling"]], "pre": ["s"]}, {"t": "gap", "q": "The pain was so bad that he started to <b>v</b>{}.", "a": [["omit"]], "pre": ["v"]}, {"t": "gap", "q": "He said it felt like acid in his <b>v</b>{}.", "a": [["eins"]], "pre": ["v"]}, {"t": "gap", "q": "The bullet ant sting is <b>e</b>{} – the worst pain imaginable.", "a": [["xcruciating"]], "pre": ["e"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Meet the suckers for pain", "paras": [["", "Entomologist Justin O. Schmidt has been stung countless times while studying ants and wasps. He created the Schmidt Sting Pain Index, which ranks 83 stings on a scale from 1 to 4."], ["", "Schmidt found that the level of pain is linked to the insect’s need for defence. Bees in colonies cannot easily flee, so their stings can seriously harm predators: four honeybee stings can kill a mouse."], ["", "The tarantula hawk wasp causes the most intense immediate pain, but it disappears after two or three minutes. Schmidt’s advice? Lie down and scream, because ‘screaming is satisfying’."], ["", "YouTuber Coyote Peterson also lets insects sting him, but says he is no masochist: ‘I don’t enjoy pain, I enjoy educating people.’ He always has medical professionals on standby."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "How many stings are on Schmidt’s index?", "o": ["100", "83", "40"], "a": 1}, {"t": "mc", "q": "Why are bee stings so powerful?", "o": ["Bees in colonies can’t easily escape.", "Bees want to hunt mice.", "Bees are very big."], "a": 0}, {"t": "mc", "q": "What is special about the tarantula hawk wasp sting?", "o": ["It is not painful.", "It lasts for days.", "It is very intense but short."], "a": 2}, {"t": "mc", "q": "What does Schmidt advise after a tarantula hawk sting?", "o": ["lie down and scream", "run to hospital", "put ice on it"], "a": 0}, {"t": "mc", "q": "Why does Coyote Peterson get stung?", "o": ["to educate people", "because he enjoys pain", "to win money"], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two friends, Leo and Faith, talking about a TV show.", "script": [["Leo", "Did you watch Kings of Pain last night?"], ["Faith", "No way. I’m far too squeamish for that."], ["Leo", "Adam got bitten by a Mexican beaded lizard. He gave it twenty-six and a half out of thirty!"], ["Faith", "Thirty? How does the scoring work?"], ["Leo", "They score three things from one to ten: the first pain, how long it lasts, and the damage afterwards. They compare everything to a honeybee sting."], ["Faith", "What happened to him?"], ["Leo", "He started vomiting. He said it was like acid in his veins. His arm swelled up too."], ["Faith", "Why do they do it?"], ["Leo", "To give people information in case they’re bitten. And they take precautions – there’s a medical team and even a helicopter on standby."]]}, "parts": [{"items": [{"t": "mc", "q": "Why didn’t Faith watch the show?", "o": ["She is squeamish.", "She was busy.", "She doesn’t like Adam."], "a": 0}, {"t": "mc", "q": "What score did Adam give the lizard bite?", "o": ["26.5 out of 30", "10 out of 30", "30 out of 30"], "a": 0}, {"t": "mc", "q": "What do they compare every bite to?", "o": ["a snake bite", "a lizard bite", "a honeybee sting"], "a": 2}, {"t": "mc", "q": "How did Adam describe the pain?", "o": ["like acid in his veins", "like fire on his skin", "like a paper cut"], "a": 0}, {"t": "mc", "q": "Which precaution does Leo mention?", "o": ["a vet", "a police officer", "a helicopter on standby"], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "similes and metaphors; flee, inflict, venomous, debilitating, squeamish, precautions.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What is the most painful thing that has happened to you? Describe it with a simile.", "Are you squeamish? What makes you feel uncomfortable?", "Which creepy-crawlies do you hate?", "Would you watch Kings of Pain?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Is it right for people to get stung on purpose for YouTube?", "Create a metaphor and a simile for a bad exam.", "What precautions should people take in nature?"]}]}}]}, {"id": "t24", "kind": "quick", "group": "t2.4", "title": "Unit 2.4 Test", "focus": "2.4 The science of cuteness: diminutives (-y/-ie), repetition and ‘parentese’; cuteness vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "The diminutive of ‘dog’ is ___.", "o": ["doglet", "doggy", "dogling"], "a": 1}, {"t": "mc", "q": "A child might call their stomach a ___.", "o": ["yummy", "mummy", "tummy"], "a": 2}, {"t": "mc", "q": "‘Delicious’ in parentese is ___.", "o": ["deliciousy", "yummy", "tasty-wasty"], "a": 1}, {"t": "mc", "q": "Adults are called ___ by children.", "o": ["big-ups", "adultie", "grown-ups"], "a": 2}, {"t": "mc", "q": "A train in baby language is a ___.", "o": ["rail-rail", "toot-train", "choo-choo"], "a": 2}, {"t": "mc", "q": "‘Be quiet’ in parentese is ___.", "o": ["night-night", "whoops", "shush"], "a": 2}, {"t": "mc", "q": "When a child falls over, adults say ‘___!’", "o": ["whoops-a-daisy", "goo-goo", "choo-choo"], "a": 0}, {"t": "mc", "q": "The diminutive of ‘aunt’ is ___.", "o": ["aunty-wanty", "auntling", "auntie"], "a": 2}, {"t": "mc", "q": "‘Parentese’ is usually spoken ___.", "o": ["slowly in a sing-song voice", "in a formal style", "quickly and quietly"], "a": 0}, {"t": "mc", "q": "‘Look at the birdie!’ in normal adult language is ___.", "o": ["Look at the birds’!", "Look at the birdy-wordy!", "Look at the bird!"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Easily affected or harmed by something is ___.", "o": ["tender", "susceptible", "appealing"], "a": 1}, {"t": "mc", "q": "Pleasant and attractive is ___.", "o": ["appealing", "relentless", "spinal"], "a": 0}, {"t": "mc", "q": "Frogs are ___.", "o": ["reptiles", "mammals", "amphibians"], "a": 2}, {"t": "mc", "q": "Natural, unlearned ways of behaving are ___.", "o": ["urges", "breeds", "instincts"], "a": 2}, {"t": "mc", "q": "Babies have round, ___ cheeks.", "o": ["spinal", "chubby", "tender"], "a": 1}, {"t": "mc", "q": "Dachshunds often have ___ problems because of their long backs.", "o": ["chubby", "nurturing", "spinal"], "a": 2}, {"t": "mc", "q": "The Ugly Animal Preservation Society was founded as a ___ joke.", "o": ["relentless", "tender", "tongue-in-cheek"], "a": 2}, {"t": "mc", "q": "Parents do the ___ work of caring for babies – it never stops.", "o": ["relentless", "appealing", "susceptible"], "a": 0}, {"t": "mc", "q": "A strong sudden desire is an ___.", "o": ["instinct", "urge", "breed"], "a": 1}, {"t": "mc", "q": "Gentle and loving is ___.", "o": ["tender", "spinal", "aggressive"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Some people <b>b</b>{} dogs for cute faces, which can harm their health.", "a": [["reed"]], "pre": ["b"]}, {"t": "gap", "q": "Cute faces trigger our <b>c</b>{} instincts.", "a": [["aregiving"]], "pre": ["c"]}, {"t": "gap", "q": "Mothers are often described as <b>n</b>{} – caring and protective.", "a": [["urturing"]], "pre": ["n"]}, {"t": "gap", "q": "‘Cute <b>a</b>{}’ is the urge to squeeze something adorable.", "a": [["ggression"]], "pre": ["a"]}, {"t": "gap", "q": "People who feel cute aggression want to <b>s</b>{} the cute thing.", "a": [["queeze"]], "pre": ["s"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "The science of cuteness", "paras": [["", "Seeing something cute takes over our brain. It triggers our caregiving instincts, which Professor Morten Kringelbach says are essential for our survival: human babies need a lot of care, so they must be appealing enough to receive it."], ["", "In 1943, Konrad Lorenz described the ‘baby schema’: a large head, chubby cheeks, a high forehead, a small nose and mouth, and a round body. These features activate the reward system in our brains."], ["", "Breeding for cuteness has a dark side. Flat-faced breeds such as pugs often struggle to breathe, and up to one in four dachshunds suffers from a painful spinal condition."], ["", "Cuteness also affects science. Cute animals are much more likely to be studied, with 500 times more published studies on mammals than on amphibians. As the tongue-in-cheek Ugly Animal Preservation Society says: ‘We can’t all be pandas.’"]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Why does Kringelbach say cuteness is essential?", "o": ["Human babies need a lot of care.", "It helps us choose pets.", "It makes animals easier to breed."], "a": 0}, {"t": "mc", "q": "Which is part of the ‘baby schema’?", "o": ["long legs", "a high forehead", "a large nose"], "a": 1}, {"t": "mc", "q": "What problem do pugs often have?", "o": ["poor eyesight", "breathing difficulties", "spinal problems only"], "a": 1}, {"t": "mc", "q": "How many dachshunds can have spinal problems?", "o": ["up to one in four", "half", "almost all"], "a": 0}, {"t": "mc", "q": "What is the point of the Ugly Animal Preservation Society?", "o": ["to draw attention to less attractive animals", "to study pandas", "to stop people keeping pets"], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a scientist talking about cute aggression.", "script": [["Host", "Dr Aragón, what is cute aggression?"], ["Expert", "It’s when people see something extremely cute, like a puppy, and say things like ‘I want to squeeze it!’ or ‘I could eat you up!’"], ["Host", "Do they actually want to hurt it?"], ["Expert", "Not at all. In our studies, people who felt cute aggression were actually more careful with babies, not less."], ["Host", "So why does it happen?"], ["Expert", "We think it’s a way of balancing very strong emotions. When we feel overwhelmed by positive feelings, a small aggressive reaction helps us calm down so we can do the relentless work of caring."], ["Host", "Do cats and dogs know they’re cute?"], ["Expert", "Not consciously, but dogs have evolved muscles for ‘puppy dog eyes’, and cats meow at a frequency similar to a baby’s cry."]]}, "parts": [{"items": [{"t": "mc", "q": "What is an example of cute aggression?", "o": ["ignoring a baby", "wanting to squeeze a puppy", "hitting a puppy"], "a": 1}, {"t": "mc", "q": "People who feel cute aggression ___.", "o": ["are more careful with babies", "are dangerous to animals", "dislike babies"], "a": 0}, {"t": "mc", "q": "Why does cute aggression happen, according to Dr Aragón?", "o": ["because babies cry", "because people are tired", "to balance very strong positive emotions"], "a": 2}, {"t": "mc", "q": "What have dogs evolved?", "o": ["a baby-like cry", "shorter legs", "muscles for puppy dog eyes"], "a": 2}, {"t": "mc", "q": "How do cats sound like babies?", "o": ["Their meow has a similar frequency.", "They purr like babies.", "They cry at night."], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "diminutives and parentese (doggy, tummy, choo-choo); appealing, chubby, instincts, relentless, tender.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What is the cutest animal in your opinion? Why?", "Do you use diminutives in your language when talking to children?", "Do you ever feel ‘cute aggression’?", "Should we protect ugly animals as much as cute ones?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Is it wrong to breed dogs for cute faces?", "Rewrite this in parentese: ‘Why don’t you give the cat a hug?’", "Why do companies use cute characters in adverts?"]}]}}]}, {"id": "t25", "kind": "quick", "group": "t2.5", "title": "Unit 2.5 Test", "focus": "2.5 The first teen astronaut: filler words (like, you know, basically) and reductions (wanna, gonna, prolly); space vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "Which is a filler word?", "o": ["astronaut", "feasible", "basically"], "a": 2}, {"t": "mc", "q": "‘I was like, “Why?”’ – here ‘like’ is used to ___.", "o": ["show you enjoy something", "report what someone said", "compare two things"], "a": 1}, {"t": "mc", "q": "In more formal speech, replace reporting ‘like’ with ___.", "o": ["said", "wanna", "kind of"], "a": 0}, {"t": "mc", "q": "‘Wanna’ is a reduction of ___.", "o": ["wanting", "want a", "want to"], "a": 2}, {"t": "mc", "q": "‘Prolly’ is a reduction of ___.", "o": ["pretty", "probably", "properly"], "a": 1}, {"t": "mc", "q": "‘Gonna’ means ___.", "o": ["got to", "go on", "going to"], "a": 2}, {"t": "mc", "q": "‘Tryin’’ is ___ with the g sound dropped.", "o": ["tried", "trying", "try in"], "a": 1}, {"t": "mc", "q": "‘Kinda’ means ___.", "o": ["kind a", "kind of", "kinder"], "a": 1}, {"t": "mc", "q": "‘You’re outta luck’ means ___.", "o": ["You’re out a luck.", "You’re outside luck.", "You’re out of luck."], "a": 2}, {"t": "mc", "q": "Filler words are used mainly in ___.", "o": ["exam essays", "speaking", "formal writing"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "The ability to do something is ___.", "o": ["saviour", "capability", "radiation"], "a": 1}, {"t": "mc", "q": "Possible and able to be done is ___.", "o": ["feasible", "mind-blowing", "projected"], "a": 0}, {"t": "mc", "q": "Astronauts are exposed to dangerous ___ in space.", "o": ["radiation", "microgravity", "orbit"], "a": 0}, {"t": "mc", "q": "A state of almost no gravity is ___.", "o": ["capability", "radiation", "microgravity"], "a": 2}, {"t": "mc", "q": "The ___ date for the first Mars mission is the 2030s.", "o": ["feasible", "projected", "simulated"], "a": 1}, {"t": "mc", "q": "Training centres ___ the conditions of space.", "o": ["blow up", "simulate", "launch"], "a": 1}, {"t": "mc", "q": "Her first microgravity training was ___ – amazing!", "o": ["feasible", "sluggish", "mind-blowing"], "a": 2}, {"t": "mc", "q": "Her curiosity ___ after watching a cartoon.", "o": ["levelled up", "gave in", "blew up"], "a": 2}, {"t": "mc", "q": "Some people see Mars as a ___ for humanity, but she disagrees.", "o": ["mission", "saviour", "capability"], "a": 1}, {"t": "mc", "q": "Someone hoping to become an astronaut is an ___ astronaut.", "o": ["aspiring", "projected", "orbital"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "The rocket <b>l</b>{} is planned for next spring.", "a": [["aunch"]], "pre": ["l"]}, {"t": "gap", "q": "The station travels in <b>o</b>{} around the Earth.", "a": [["rbit"]], "pre": ["o"]}, {"t": "gap", "q": "An astronaut needs a <b>s</b>{} to survive outside the station.", "a": [["pacesuit"]], "pre": ["s"]}, {"t": "gap", "q": "The <b>m</b>{} to Mars could take two or three years.", "a": [["ission"]], "pre": ["m"]}, {"t": "gap", "q": "Mars is the closest planet where exploration is technologically <b>f</b>{}.", "a": [["easible"]], "pre": ["f"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Alyssa Carson: training for Mars", "paras": [["", "Alyssa Carson first got interested in space when she was about three, after watching a cartoon called The Backyardigans. She asked her dad, ‘Are there people on Mars?’ and her curiosity just blew up from there."], ["", "At fifteen, she joined Project PoSSUM, a group of citizen scientists who study clouds in the upper atmosphere. Her training included microgravity flights, which she described as mind-blowing – although her stomach soon felt uncomfortable."], ["", "Alyssa believes Mars is worth exploring because it is the closest planet we can actually reach, so it is technologically feasible. But she warns that Mars is not a saviour: we cannot rely on it as a backup plan for humanity and must look after Earth."], ["", "When she finally gets there, she says, the first thing she will do is ‘just run around and take everything in’."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "What first made Alyssa interested in space?", "o": ["a school trip", "a book", "a cartoon"], "a": 2}, {"t": "mc", "q": "What does Project PoSSUM study?", "o": ["clouds in the upper atmosphere", "space radiation", "Mars rocks"], "a": 0}, {"t": "mc", "q": "How did she feel about microgravity training?", "o": ["frightened", "bored", "amazed, though her stomach felt uncomfortable"], "a": 2}, {"t": "mc", "q": "Why does she think we should explore Mars?", "o": ["People can live there easily.", "It has water and plants.", "It is the closest planet we can reach."], "a": 2}, {"t": "mc", "q": "What does she say about Mars and Earth?", "o": ["Mars is not a backup plan for Earth.", "Earth cannot be saved.", "Everyone should move to Mars."], "a": 0}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two teenagers chatting about a space camp. Listen for informal language.", "script": [["Kai", "So, like, are you gonna apply for the space camp?"], ["Mia", "I dunno. I wanna go, but it’s prolly really expensive."], ["Kai", "There’s a scholarship, you know. You just have to write an essay about why you wanna be an astronaut."], ["Mia", "Seriously? I’d totally do that. When’s the deadline?"], ["Kai", "End of the month. They kinda want people who’ve done science projects."], ["Mia", "I did that robot thing last year. That counts, right?"], ["Kai", "Definitely. And they do microgravity simulations and stuff."], ["Mia", "That sounds mind-blowing. OK, I’m gonna start writing tonight."]]}, "parts": [{"items": [{"t": "mc", "q": "What is Mia worried about?", "o": ["her parents", "the cost", "the essay"], "a": 1}, {"t": "mc", "q": "What do you need to do for the scholarship?", "o": ["pass a science test", "write an essay", "build a robot"], "a": 1}, {"t": "mc", "q": "When is the deadline?", "o": ["next year", "tonight", "the end of the month"], "a": 2}, {"t": "mc", "q": "What project did Mia do last year?", "o": ["a rocket", "a robot", "a cloud study"], "a": 1}, {"t": "mc", "q": "Which reduction does Mia use?", "o": ["outta", "gonna", "shoulda"], "a": 1}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "filler words and reductions (in informal speech only); feasible, capability, simulate, mind-blowing, projected.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Would you like to go to Mars? Why/why not?", "What did you want to be when you were small?", "Which filler words do you use in your own language?", "What is the most mind-blowing thing you have seen?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Should governments spend money on space exploration or on Earth’s problems?", "Is it feasible for humans to live on Mars?", "When is it OK to use reductions like ‘gonna’ and ‘wanna’?"]}]}}]}, {"id": "t31", "kind": "quick", "group": "t3.1", "title": "Unit 3.1 Test", "focus": "3.1 Study tips and tricks: giving and responding to advice (If I were you, I’d + infinitive; How about / Why don’t you try + -ing).", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "If I were you, I’d ___ to bed earlier.", "o": ["going", "to go", "go"], "a": 2}, {"t": "mc", "q": "How about ___ a study group?", "o": ["to join", "joining", "join"], "a": 1}, {"t": "mc", "q": "Why don’t you try ___ flashcards?", "o": ["using", "use", "to use"], "a": 0}, {"t": "mc", "q": "Perhaps you could try ___ in the library.", "o": ["study", "studying", "studied"], "a": 1}, {"t": "mc", "q": "I think you should ___ a break every 25 minutes.", "o": ["take", "to take", "taking"], "a": 0}, {"t": "mc", "q": "You could ___ the Pomodoro technique.", "o": ["trying", "try", "to try"], "a": 1}, {"t": "mc", "q": "‘If I ___ you, I’d turn off my phone.’", "o": ["am", "would be", "were"], "a": 2}, {"t": "mc", "q": "Which is a polite way to reject advice?", "o": ["That’s a great idea!", "I’m not sure that’s a good idea.", "I could try that."], "a": 1}, {"t": "mc", "q": "‘Hmm, maybe you’re ___.’", "o": ["right", "correct of", "true"], "a": 0}, {"t": "mc", "q": "Which phrase is followed by an -ing form?", "o": ["How about…", "You could…", "I think you should…"], "a": 0}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Put off doing something is ___.", "o": ["procrastinate", "scribble", "retain"], "a": 0}, {"t": "mc", "q": "The ability to remember information is ___.", "o": ["ratio", "retention", "willpower"], "a": 1}, {"t": "mc", "q": "A ___ of 70:30 means 70 parts to 30 parts.", "o": ["ratio", "sip", "synapse"], "a": 0}, {"t": "mc", "q": "Something that takes your attention away is a ___.", "o": ["neuron", "retention", "distraction"], "a": 2}, {"t": "mc", "q": "Quick untidy notes or drawings are ___.", "o": ["synapses", "sips", "scribbles"], "a": 2}, {"t": "mc", "q": "The strength to make yourself do difficult things is ___.", "o": ["retention", "willpower", "distraction"], "a": 1}, {"t": "mc", "q": "The amount of information the brain can store is ___.", "o": ["staggering", "sluggish", "handy"], "a": 0}, {"t": "mc", "q": "Brain cells that send messages are ___.", "o": ["synapses", "neurons", "petabytes"], "a": 1}, {"t": "mc", "q": "A small mouthful of water is a ___.", "o": ["scribble", "sip", "ratio"], "a": 1}, {"t": "mc", "q": "Reviewing at increasing gaps is spaced ___.", "o": ["distraction", "repetition", "willpower"], "a": 1}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Messages pass between neurons at points called <b>s</b>{}.", "a": [["ynapses"]], "pre": ["s"]}, {"t": "gap", "q": "A <b>n</b>{} studies the brain and nervous system.", "a": [["euroscientist"]], "pre": ["n"]}, {"t": "gap", "q": "Turn off your phone so you can <b>c</b>{}.", "a": [["oncentrate"]], "pre": ["c"]}, {"t": "gap", "q": "I need to <b>r</b>{} chapters 3 and 4 before the exam.", "a": [["evise"]], "pre": ["r"]}, {"t": "gap", "q": "Most people can’t <b>m</b>{} well – they just switch quickly between tasks.", "a": [["ultitask"]], "pre": ["m"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Study smarter, not harder", "paras": [["", "Your brain grows new connections mainly while you sleep. In one experiment, students who studied in the evening and slept before a morning test remembered much more than students who studied in the morning for an evening test."], ["", "Willpower is like a muscle that gets tired, and most people have the most in the morning. So do your most difficult tasks first. The Pomodoro technique can help: work for 25 minutes, take a 5-minute break, and repeat."], ["", "Changing your environment also helps. A group who studied in two different rooms remembered 40 per cent more than a group who studied in one room."], ["", "Finally, test yourself. When learning a poem, spend about 30 per cent of the time reading it and 70 per cent reciting it from memory. Short self-tests can increase retention significantly."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "When does the brain grow most connections?", "o": ["in the morning", "after exercise", "during sleep"], "a": 2}, {"t": "mc", "q": "When do most people have the strongest willpower?", "o": ["at night", "in the morning", "in the evening"], "a": 1}, {"t": "mc", "q": "In the Pomodoro technique, you work for ___.", "o": ["25 minutes", "5 minutes", "an hour"], "a": 0}, {"t": "mc", "q": "Students who studied in two rooms ___.", "o": ["remembered more", "remembered less", "got more distracted"], "a": 0}, {"t": "mc", "q": "When learning a poem, you should spend most time ___.", "o": ["reading it", "copying it", "reciting it"], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear two students, Aigerim and Erlan, talking about exam stress.", "script": [["Erlan", "I’ve got my history exam on Friday and I can’t concentrate at all."], ["Aigerim", "What’s the problem?"], ["Erlan", "I keep checking my phone. I sit down to study, and an hour later I’m still watching videos."], ["Aigerim", "If I were you, I’d leave your phone in another room."], ["Erlan", "I’m not sure that’s a good idea. I use it for my flashcard app."], ["Aigerim", "Then why don’t you try a timer app that blocks everything else for twenty-five minutes?"], ["Erlan", "Hmm, maybe you’re right. I could try that."], ["Aigerim", "And how about studying with me on Wednesday? We can test each other."], ["Erlan", "That’s a great idea. Library at four?"], ["Aigerim", "Perfect."]]}, "parts": [{"items": [{"t": "mc", "q": "When is Erlan’s exam?", "o": ["Friday", "Wednesday", "Monday"], "a": 0}, {"t": "mc", "q": "What is distracting Erlan?", "o": ["his family", "music", "his phone"], "a": 2}, {"t": "mc", "q": "Why doesn’t Erlan want to leave his phone in another room?", "o": ["He needs it for music.", "He is waiting for a call.", "He uses a flashcard app."], "a": 2}, {"t": "mc", "q": "What does Aigerim suggest next?", "o": ["an app that blocks other apps", "studying at night", "a new phone"], "a": 0}, {"t": "mc", "q": "Where will they meet?", "o": ["at school", "at a café", "in the library"], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "If I were you, I’d…; Why don’t you try…?; How about…?; procrastinate, retention, willpower, distraction.", "tasks": [{"name": "Role play", "mins": 3, "lead": "The student gives advice to the teacher, who plays a stressed student. Use different advice phrases.", "prompts": ["I’m tired all the time.", "I can’t stop checking my phone when I study.", "I forget new words after a day.", "I always leave my homework until the last minute."]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["What are your best study tips?", "Do you study better with music or in silence?", "Which tip from this unit will you try?"]}]}}]}, {"id": "t32", "kind": "quick", "group": "t3.2", "title": "Unit 3.2 Test", "focus": "3.2 Taking notes: common idioms (more than one way to skin a cat, at the end of the day…); note-taking vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "‘There’s more than one way to skin a cat’ means ___.", "o": ["cats are difficult to look after", "you should try one method only", "there are many ways to get the same result"], "a": 2}, {"t": "mc", "q": "‘If it ain’t broke, don’t fix it’ means ___.", "o": ["don’t change something that works", "break old habits", "repair things immediately"], "a": 0}, {"t": "mc", "q": "‘I can’t make heads or tails of it’ means ___.", "o": ["I can’t see it", "I can’t understand it at all", "I can’t decide"], "a": 1}, {"t": "mc", "q": "‘Go out of your comfort zone’ means ___.", "o": ["try something new and uncomfortable", "leave your house", "relax more"], "a": 0}, {"t": "mc", "q": "‘At the end of the day’ means ___.", "o": ["after considering everything", "at the last minute", "late in the evening"], "a": 0}, {"t": "mc", "q": "‘Stick with it’ means ___.", "o": ["stop doing it", "glue it", "keep doing it"], "a": 2}, {"t": "mc", "q": "‘It’s raining cats and ___.’", "o": ["birds", "dogs", "mice"], "a": 1}, {"t": "mc", "q": "An idiom has a ___ meaning.", "o": ["figurative", "literal", "scientific"], "a": 0}, {"t": "mc", "q": "My notes are a mess – I can’t make heads or ___ of them.", "o": ["ends", "feet", "tails"], "a": 2}, {"t": "mc", "q": "This method works for me, so I’ll ___ with it.", "o": ["stick", "skin", "fix"], "a": 0}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Ordinary handwriting is ___.", "o": ["formula", "sketch", "longhand"], "a": 2}, {"t": "mc", "q": "Read quickly to get the main idea is ___.", "o": ["cram", "skim", "sketch"], "a": 1}, {"t": "mc", "q": "Study a lot just before an exam is ___.", "o": ["cram", "skim", "sketch"], "a": 0}, {"t": "mc", "q": "Draw quickly without detail is ___.", "o": ["skim", "cram", "sketch"], "a": 2}, {"t": "mc", "q": "Useful and easy to reach is ___.", "o": ["longhand", "spaced", "handy"], "a": 2}, {"t": "mc", "q": "Pictures, charts and videos are ___.", "o": ["formulas", "visuals", "intervals"], "a": 1}, {"t": "mc", "q": "A fixed method for doing something is a ___.", "o": ["formula", "visual", "sketch"], "a": 0}, {"t": "mc", "q": "A diagram of ideas around a central topic is a ___.", "o": ["formula", "mind map", "bullet point"], "a": 1}, {"t": "mc", "q": "The ___ method divides the page into cues, notes and a summary.", "o": ["Cornell", "Pomodoro", "Oxford"], "a": 0}, {"t": "mc", "q": "A short list item with a dot in front is a ___.", "o": ["mind map", "formula", "bullet point"], "a": 2}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "‘Info’ is an <b>a</b>{} of ‘information’.", "a": [["bbreviation"]], "pre": ["a"]}, {"t": "gap", "q": "Review your notes at spaced <b>i</b>{}.", "a": [["ntervals"]], "pre": ["i"]}, {"t": "gap", "q": "In <b>s</b>{}, you combine simple drawings and words.", "a": [["ketchnoting"]], "pre": ["s"]}, {"t": "gap", "q": "The <b>o</b>{} method uses headings and indented points.", "a": [["utline"]], "pre": ["o"]}, {"t": "gap", "q": "At the bottom of a Cornell page, write a short <b>s</b>{}.", "a": [["ummary"]], "pre": ["s"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Note-taking methods", "paras": [["", "If you can’t make heads or tails of your notes, you might want to try a new approach. After all, there’s more than one way to skin a cat."], ["", "The outlining method organises information into main headings and indented sub-points. The Cornell method divides the page into three parts: a narrow column for key questions, a wide column for notes, and a summary at the bottom."], ["", "Visual learners often prefer mind-mapping, where ideas branch out from a central topic, or sketchnoting, which mixes simple drawings with words. In reverse note-taking, you start with a blank page and write down everything you remember before checking the source."], ["", "At the end of the day, notes are just a tool. Go out of your comfort zone and experiment, but if your current method works, stick with it: if it ain’t broke, don’t fix it."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "Which method uses headings and indented points?", "o": ["outlining", "sketchnoting", "mind-mapping"], "a": 0}, {"t": "mc", "q": "How many parts does a Cornell page have?", "o": ["three", "four", "two"], "a": 0}, {"t": "mc", "q": "Sketchnoting combines ___.", "o": ["slides and audio", "colours and numbers", "drawings and words"], "a": 2}, {"t": "mc", "q": "In reverse note-taking, you first ___.", "o": ["write what you remember", "draw a mind map", "read the textbook"], "a": 0}, {"t": "mc", "q": "What is the writer’s final advice?", "o": ["Always use the Cornell method.", "Never take notes by hand.", "Experiment, but keep a method that works."], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear part of a lecture about taking notes.", "script": [["Lecturer", "Good morning. Today I want to give you a few recommendations for taking notes."], ["Lecturer", "First, don’t try to write everything down. You’ll end up with a wall of text. Listen for key ideas and use abbreviations."], ["Lecturer", "Second, create contrast. Use headings, colours and white space so your eyes can find information quickly."], ["Lecturer", "Third, research suggests that taking notes longhand helps you remember more than typing, because you have to summarise as you write."], ["Lecturer", "Finally, review your notes within twenty-four hours, and then again at spaced intervals. Notes you never look at again are almost useless."]]}, "parts": [{"items": [{"t": "mc", "q": "What does the lecturer say about writing everything down?", "o": ["It is the best method.", "Don’t do it.", "Do it only in exams."], "a": 1}, {"t": "mc", "q": "What is a ‘wall of text’?", "o": ["a page full of words with no structure", "a long essay", "a poster on the wall"], "a": 0}, {"t": "mc", "q": "How can you create contrast?", "o": ["with headings, colours and space", "by writing faster", "by typing"], "a": 0}, {"t": "mc", "q": "Why does longhand help memory?", "o": ["You have to summarise as you write.", "It is slower to read.", "It looks nicer."], "a": 0}, {"t": "mc", "q": "When should you first review your notes?", "o": ["before the exam", "after a week", "within 24 hours"], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "idioms (at the end of the day, stick with it, go out of your comfort zone); skim, cram, longhand, handy, sketch.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Do you take notes by hand or on a device?", "When did you last go out of your comfort zone?", "Is there anything you can’t make heads or tails of?", "At the end of the day, what is most important in life?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Explain one note-taking method to the teacher.", "Is cramming ever a good idea?", "Which idioms in your language are similar?"]}]}}]}, {"id": "t33", "kind": "quick", "group": "t3.3", "title": "Unit 3.3 Test", "focus": "3.3 Memory tricks: punctuation for lists: commas, the Oxford comma, colons and semi-colons; memory vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "Use ___ to separate items in a simple list.", "o": ["semi-colons", "colons", "commas"], "a": 2}, {"t": "mc", "q": "The Oxford comma comes ___.", "o": ["after the first item", "before the final ‘and’", "at the end of the list"], "a": 1}, {"t": "mc", "q": "In British English, the Oxford comma is ___.", "o": ["always required", "never used", "optional"], "a": 2}, {"t": "mc", "q": "Use semi-colons in a list when the items ___.", "o": ["are very short", "are long or contain commas", "are numbers"], "a": 1}, {"t": "mc", "q": "Which sentence is correctly punctuated?", "o": ["I invited Sean; Moira; and Tom.", "I invited Sean, my friend from work; Moira, Sarah’s sister; and Tom.", "I invited: Sean my friend from work, Moira Sarah’s sister, and Tom."], "a": 1}, {"t": "mc", "q": "A ___ often introduces a list: ‘You need three things: …’", "o": ["hyphen", "colon", "semi-colon"], "a": 1}, {"t": "mc", "q": "‘I like milk, bread, pineapple, and pizza.’ The last comma is ___.", "o": ["a semi-colon", "an Oxford comma", "a mistake"], "a": 1}, {"t": "mc", "q": "Why use an Oxford comma?", "o": ["to avoid ambiguity", "to show possession", "to make lists longer"], "a": 0}, {"t": "mc", "q": "The symbol ; is a ___.", "o": ["comma", "colon", "semi-colon"], "a": 2}, {"t": "mc", "q": "In American English, the Oxford comma is generally ___.", "o": ["rare", "forbidden", "expected"], "a": 2}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "A word made from first letters, like NASA, is an ___.", "o": ["interval", "peg", "acronym"], "a": 2}, {"t": "mc", "q": "A memory trick or rhyme is a ___.", "o": ["repetition", "mnemonic", "retrieval"], "a": 1}, {"t": "mc", "q": "Getting information back from memory is ___.", "o": ["interval", "retrieval", "repetition"], "a": 1}, {"t": "mc", "q": "A period of time between events is an ___.", "o": ["peg", "interval", "acronym"], "a": 1}, {"t": "mc", "q": "Make something stronger and more fixed is ___.", "o": ["solidify", "reread", "recall"], "a": 0}, {"t": "mc", "q": "‘My Very Educated Mother…’ helps you remember the ___.", "o": ["lakes", "months", "planets"], "a": 2}, {"t": "mc", "q": "HOMES helps you remember the Great ___ of North America.", "o": ["Rivers", "Mountains", "Lakes"], "a": 2}, {"t": "mc", "q": "Imagining rooms in your house to store facts is a memory ___.", "o": ["acronym", "palace", "peg"], "a": 1}, {"t": "mc", "q": "Ebbinghaus described how quickly we forget: the forgetting ___.", "o": ["line", "curve", "circle"], "a": 1}, {"t": "mc", "q": "Doing something again and again is ___.", "o": ["repetition", "ambiguity", "retrieval"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "I <b>r</b>{} the chapter three times but still couldn’t remember it.", "a": [["eread"]], "pre": ["r"]}, {"t": "gap", "q": "In the <b>p</b>{} system, each number is linked to an image.", "a": [["eg"]], "pre": ["p"]}, {"t": "gap", "q": "Learning in <b>s</b>{} intervals is more effective than cramming.", "a": [["paced"]], "pre": ["s"]}, {"t": "gap", "q": "Actors have to <b>m</b>{} hundreds of lines.", "a": [["emorise"]], "pre": ["m"]}, {"t": "gap", "q": "An Oxford comma can remove <b>a</b>{} from a sentence.", "a": [["mbiguity"]], "pre": ["a"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Memory methods", "paras": [["", "Mnemonics help you remember information. An acronym uses first letters: HOMES gives you the Great Lakes (Huron, Ontario, Michigan, Erie, Superior). An acrostic is a sentence, such as ‘My Very Educated Mother Just Served Us Noodles’ for the planets."], ["", "In the 1880s, Hermann Ebbinghaus memorised nonsense syllables and tracked how fast he forgot them. He discovered that reviewing information at spaced intervals greatly improves memory."], ["", "Testing yourself is also powerful, because practising retrieval solidifies memories. For new words, memory athlete Nelson Dellis recommends creating bizarre, over-the-top images."], ["", "Finally, try a memory palace: imagine a place you know well, such as your home, and ‘put’ each item you need to remember in a different room."]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "What is HOMES an example of?", "o": ["an acrostic", "a memory palace", "an acronym"], "a": 2}, {"t": "mc", "q": "What did Ebbinghaus memorise?", "o": ["lists of planets", "nonsense syllables", "poems"], "a": 1}, {"t": "mc", "q": "What did Ebbinghaus discover?", "o": ["Cramming works best.", "We never forget nonsense words.", "Spaced reviews improve memory."], "a": 2}, {"t": "mc", "q": "What kind of images does Dellis recommend?", "o": ["simple and realistic", "strange and exaggerated", "colourful photos"], "a": 1}, {"t": "mc", "q": "A memory palace uses ___.", "o": ["a list of acronyms", "a real palace", "a familiar place"], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a memory champion giving a tip.", "script": [["Speaker", "Let me show you the peg system. First, you learn a ‘peg’ for each number. One is a bun, two is a shoe, three is a tree – they rhyme."], ["Speaker", "Now say you need to buy milk, eggs and bread. Imagine a bun soaked in milk – it’s dripping everywhere. Then imagine a shoe full of broken eggs. Disgusting, right? Finally, imagine a tree growing loaves of bread instead of leaves."], ["Speaker", "The stranger the picture, the better you’ll remember it. Now, without looking, what was item number two?"], ["Speaker", "Eggs! Exactly. It works because your brain remembers images much better than words."]]}, "parts": [{"items": [{"t": "mc", "q": "What is the peg for number one?", "o": ["a shoe", "a bun", "a tree"], "a": 1}, {"t": "mc", "q": "How are the pegs chosen?", "o": ["They are foods.", "They are random.", "They rhyme with the numbers."], "a": 2}, {"t": "mc", "q": "What is in the shoe?", "o": ["milk", "bread", "broken eggs"], "a": 2}, {"t": "mc", "q": "What does the tree grow?", "o": ["bread", "buns", "eggs"], "a": 0}, {"t": "mc", "q": "Why does the system work?", "o": ["You repeat them often.", "The words are short.", "The brain remembers images well."], "a": 2}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "commas, Oxford comma, semi-colons in lists; mnemonic, acronym, retrieval, interval, solidify.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What memory tricks do you use for exams?", "Do you know any acronyms in Russian or Kazakh?", "What is your earliest memory?", "Are you good at remembering names?"]}, {"name": "Task", "mins": 3, "lead": "The student creates a memory palace or acrostic for a list given by the teacher, then explains it.", "prompts": ["Make an acrostic for five things in your bag.", "Describe your memory palace for a shopping list of six items.", "Which method do you think works best and why?"]}]}}]}, {"id": "t34", "kind": "quick", "group": "t3.4", "title": "Unit 3.4 Test", "focus": "3.4 The pain of procrastination: reflexive pronouns (myself, themselves), self as a noun, self- compounds; procrastination vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "Tom cut ___ while cooking.", "o": ["hisself", "him", "himself"], "a": 2}, {"t": "mc", "q": "We introduced ___ to the new neighbours.", "o": ["ourself", "ourselves", "us"], "a": 1}, {"t": "mc", "q": "They looked at ___ in the mirror and laughed.", "o": ["theirselves", "them", "themselves"], "a": 2}, {"t": "mc", "q": "Did you bake that cake all by ___, Anna?", "o": ["you", "yourself", "yourselves"], "a": 1}, {"t": "mc", "q": "She locked ___ out of the car.", "o": ["sheself", "her", "herself"], "a": 2}, {"t": "mc", "q": "Plural subjects use ___.", "o": ["-self", "-selves", "-selfs"], "a": 1}, {"t": "mc", "q": "In ‘He doesn’t seem like his old self’, the word ‘self’ is a ___.", "o": ["verb", "pronoun", "noun"], "a": 2}, {"t": "mc", "q": "Which compound is written correctly?", "o": ["self-compassion", "selfcompassion", "self compassion"], "a": 0}, {"t": "mc", "q": "In ‘self-confident’, the main stress is on ___.", "o": ["confident", "self", "both equally"], "a": 0}, {"t": "mc", "q": "The musical wasn’t good, but the set design ___ was spectacular.", "o": ["its", "itself", "it"], "a": 1}]}]}, {"k": "v", "name": "Vocabulary", "max": 15, "w": 1, "parts": [{"instr": "Choose the correct word or phrase.", "items": [{"t": "mc", "q": "Lasting a long time or happening often is ___.", "o": ["chronic", "theoretical", "irrational"], "a": 0}, {"t": "mc", "q": "Sympathy for someone who is suffering is ___.", "o": ["avoidance", "insecurity", "compassion"], "a": 2}, {"t": "mc", "q": "Not feeling confident is ___.", "o": ["insecurity", "mechanism", "compassion"], "a": 0}, {"t": "mc", "q": "Not based on logic is ___.", "o": ["destructive", "chronic", "irrational"], "a": 2}, {"t": "mc", "q": "Praise for a job well done is a ___.", "o": ["vicious circle", "pat on the back", "ritual"], "a": 1}, {"t": "mc", "q": "One problem causes another that makes the first worse: a ___.", "o": ["coping mechanism", "pat on the back", "vicious circle"], "a": 2}, {"t": "mc", "q": "Wanting to do something you shouldn’t: you are ___.", "o": ["tempted", "chastised", "stray"], "a": 0}, {"t": "mc", "q": "Procrastination is a coping ___ for difficult emotions.", "o": ["theory", "mechanism", "avoidance"], "a": 1}, {"t": "mc", "q": "Criticise yourself too much: beat yourself ___.", "o": ["up", "out", "down"], "a": 0}, {"t": "mc", "q": "Stop resisting: give ___.", "o": ["in", "through", "up"], "a": 0}]}, {"instr": "Complete the words in the sentences. The first letter is given.", "items": [{"t": "gap", "q": "Chronic procrastination has <b>d</b>{} effects on health.", "a": [["estructive"]], "pre": ["d"]}, {"t": "gap", "q": "Checking your phone instead of working is <b>a</b>{} behaviour.", "a": [["voidance"]], "pre": ["a"]}, {"t": "gap", "q": "Don’t <b>s</b>{} from the task after the first minute.", "a": [["tray"]], "pre": ["s"]}, {"t": "gap", "q": "Try to <b>p</b>{} through until the timer goes off.", "a": [["ush"]], "pre": ["p"]}, {"t": "gap", "q": "Think of the next action as a <b>t</b>{} idea at first.", "a": [["heoretical"]], "pre": ["t"]}]}]}, {"k": "r", "name": "Reading", "max": 10, "w": 2, "intro": "Read the text and choose A, B, or C. Two marks for each answer.", "passage": {"title": "Why do we procrastinate?", "paras": [["", "People don’t procrastinate just because they are lazy. According to psychology professor Tim Pychyl, ‘procrastination is an emotion regulation problem, not a time management problem.’ We put off tasks that make us feel bored, anxious or insecure."], ["", "When we avoid a task, we feel a moment of relief, which rewards the behaviour. This creates a vicious circle. Around 15–25% of adults procrastinate frequently, but among students the figure is much higher: about 50% procrastinate chronically."], ["", "Research also shows that we see our ‘future selves’ almost as strangers, so we leave them the difficult tasks."], ["", "The solution? Be kind to yourself rather than beating yourself up, focus only on the next action, and just get started: ‘Motivation follows action.’"]]}, "parts": [{"instr": "", "items": [{"t": "mc", "q": "According to Pychyl, procrastination is mainly about ___.", "o": ["emotions", "time management", "laziness"], "a": 0}, {"t": "mc", "q": "Why does procrastination become a habit?", "o": ["Tasks get easier.", "Teachers don’t notice.", "Avoiding the task feels good for a moment."], "a": 2}, {"t": "mc", "q": "What percentage of students procrastinate chronically?", "o": ["95%", "about 50%", "15–25%"], "a": 1}, {"t": "mc", "q": "How do we see our ‘future selves’?", "o": ["as our best friends", "almost as strangers", "as more lazy"], "a": 1}, {"t": "mc", "q": "What does ‘Motivation follows action’ mean?", "o": ["Reward yourself before starting.", "Wait until you feel motivated.", "Start first and motivation will come."], "a": 2}]}]}, {"k": "l", "name": "Listening", "max": 10, "w": 2, "listen": {"mode": "tts", "setting": "You will hear a student, Timur, talking to a school counsellor.", "script": [["Counsellor", "So, Timur, what seems to be the problem?"], ["Timur", "I’ve got an essay due on Monday and I haven’t even started. Every time I sit down, I end up tidying my room or watching videos."], ["Counsellor", "How do you feel when you think about the essay?"], ["Timur", "Honestly? Stupid. I worry it won’t be good enough, so I just avoid it. Then I beat myself up about it."], ["Counsellor", "That’s very common. Try a bit of self-compassion. Tell yourself it’s normal to find it hard."], ["Timur", "OK… and then?"], ["Counsellor", "Set a timer for just seven minutes and write anything – even the title and your name. Most people keep going after the timer."], ["Timur", "Seven minutes sounds possible. I’ll try it tonight."]]}, "parts": [{"items": [{"t": "mc", "q": "When is Timur’s essay due?", "o": ["Monday", "next week", "tonight"], "a": 0}, {"t": "mc", "q": "What does Timur do instead of writing?", "o": ["plays football", "sleeps", "tidies his room"], "a": 2}, {"t": "mc", "q": "Why does Timur avoid the essay?", "o": ["He finds the topic boring.", "He has no time.", "He worries it won’t be good enough."], "a": 2}, {"t": "mc", "q": "What does the counsellor recommend first?", "o": ["being kind to himself", "working all night", "asking for more time"], "a": 0}, {"t": "mc", "q": "How long should the timer be?", "o": ["seven minutes", "twenty-five minutes", "one hour"], "a": 0}]}]}, {"k": "s", "name": "Speaking", "max": 20, "speaking": {"mode": "task", "focus": "reflexive pronouns, self- compounds (self-compassion, self-confident); vicious circle, chronic, tempted, put off, give in, beat yourself up.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What do you usually put off doing?", "Do you beat yourself up when you make mistakes?", "What tempts you away from your work?", "Describe something you taught yourself."]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student gives reasons and examples.", "prompts": ["Is procrastination really about emotions, not laziness?", "What advice would you give your younger self?", "How can schools help chronic procrastinators?"]}]}}]}, {"id": "t35", "kind": "quick", "group": "t3.5", "title": "Unit 3.5 Test", "focus": "3.5 Hacking exams: exam command words (argue, compare and contrast, define, explain, state, label…); exam vocabulary.", "secs": [{"k": "g", "name": "Language", "max": 10, "w": 1, "parts": [{"instr": "Choose A, B, or C to complete the sentences.", "items": [{"t": "mc", "q": "‘Give the meaning of a word’ = ___.", "o": ["define", "label", "argue"], "a": 0}, {"t": "mc", "q": "‘Use figures to find the answer’ = ___.", "o": ["state", "calculate", "list"], "a": 1}, {"t": "mc", "q": "‘Show similarities and differences’ = ___.", "o": ["compare and contrast", "label", "explain"], "a": 0}, {"t": "mc", "q": "‘Make something clear and understandable’ = ___.", "o": ["list", "calculate", "explain"], "a": 2}, {"t": "mc", "q": "‘Give your point of view with reasons’ = ___.", "o": ["define", "argue", "label"], "a": 1}, {"t": "mc", "q": "‘Add names to a diagram’ = ___.", "o": ["state", "explain", "label"], "a": 2}, {"t": "mc", "q": "‘Write a number of items’ = ___.", "o": ["argue", "define", "list"], "a": 2}, {"t": "mc", "q": "‘Express clearly in words’ = ___.", "o":
