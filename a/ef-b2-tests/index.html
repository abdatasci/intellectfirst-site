ts of climate change. Rail Minister Theresa Villiers explained that although the UK government needs to manage money very carefully, it is committed to spending considerable sums on our transport through vital projects such as the Thameslink upgrade, Crossrail, the proposed High Speed rail network, and more electrification of the rail network.","The new Blackfriars Railway station in London is being fitted with technology including sun pipes, rainwater harvesting systems, insulation and solar panels to make it less reliant on water and electricity networks. Perhaps this station will lead the way for others all over the country to become more environmentally friendly."],"sents":["The study gives details of what action needs to be taken by the owners of transport networks, for example.","And now government ministers in the UK have warned that the internet could be badly affected due to climate change.","Over the next five years, it intends to spend around £200 billion on UK transport and power supplies.","According to Ms Spelman, they could develop new technologies to help our current systems better deal with climate change.","She was sure that it was essential for the work to be done immediately.","This is why the issue must be dealt with."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":2,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":3,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"You have been asked to write a report on how your town or city is helping the environment for the school's Eco-Club. Write 140–180 words.","bullets":["say what your town / city is already doing to help the environment","make some suggestions for more things your town / city could do","explain why these things would make a difference"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about road safety. Choose from the list (A–F) what each speaker says about road safety. There is one extra letter you do not need to use.","list":["make sure you are dressed properly for the time of day","get ready in advance for your journey","check your engine before a long journey","pay attention to how fast you are travelling","take note of what's happening outside","forget about using your phone while you are driving"],"script":[["Speaker 1","Before every journey, I look at the weather and the state of the roads. If it's icy or foggy, I slow right down and leave much more space between me and the car in front. You have to drive for the conditions you're in."],["Speaker 2","My rule is simple: when I'm driving, my mobile goes in the glove compartment. I don't make calls, I don't answer them, and I certainly don't read messages. Whatever it is, it can wait until I stop."],["Speaker 3","I cycle home from work, and in winter it's dark by five. So I always wear a bright yellow jacket with reflective strips, and I've got lights on my bike. If drivers can't see you, you're in real danger."],["Speaker 4","Before a long trip, I plan my route and where I'm going to stop for a rest. I pack water and snacks, check the traffic news, and make sure I've had a good night's sleep. Getting ready properly makes the whole journey safer."],["Speaker 5","I glance at the speedometer every few minutes. It's so easy to creep up over the limit without noticing, especially on a quiet road. Knowing exactly how fast you're going is the most important thing."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":1,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":3,"gap":1}]},{"ins":"Listen to a radio interviewer talking to a young person who does voluntary work for an environmental agency. Choose the correct answer.","script":[["Interviewer","Rick, you've just come back from a volunteer project on the coast of Mozambique. How long were you there?"],["Rick","Nine months in total. I'd planned to stay for six, but I loved it so much that I extended it."],["Interviewer","And what did you actually do?"],["Rick","My main job was looking at the fish that local fishermen had caught – measuring them and recording the species. A small group of other volunteers worked on a seahorse project, finding out which types live in the area, and others did beach clean-ups."],["Interviewer","Did you get any time off?"],["Rick","Usually two days a week. We'd often go to the nearby town or just explore the coast."],["Interviewer","What were the living conditions like?"],["Rick","Basic! We each had a small bedroom, but all the volunteers shared a kitchen, and that's where we spent most evenings – cooking together and chatting."],["Interviewer","Did you learn any new skills?"],["Rick","Yes. Everyone is taught how to recognize the plants along the coast in the first week. Diving wasn't part of it – you had to be qualified already. And some people had the chance to learn about construction work, because we were building a new research centre."]],"items":[{"t":"mc","s":"Rick worked for the environmental agency for ___.","o":["a full year","most of the year","half a year"],"a":1},{"t":"mc","s":"A small group of people on the project worked with ___.","o":["seahorses","fish","beaches"],"a":0},{"t":"mc","s":"Rick was free for ___ days each week.","o":["one","two","three"],"a":1},{"t":"mc","s":"Volunteers often spent their evenings ___.","o":["sitting on the beach","chatting in the kitchen","relaxing in the equipment room"],"a":1},{"t":"mc","s":"All volunteers are taught ___.","o":["how to dive","how to recognize plants","how to build"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["How worried / people your country / climate change? Why?","What / environmental stories / in news recently?","What / favourite type of weather? Why?","What / the weather / like / your country / winter?","you / do any dangerous sports? Why? / Why not?"]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'People do extreme sports because modern life is too safe and boring.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about the environment. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
TESTS.push({"id":"f5a","kind":"file","title":"File 5 Test A","focus":"Unreal conditionals, structures after wish; feelings, -ed / -ing adjectives.","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Complete the sentences with the correct form of the verbs in brackets.","items":[{"t":"tx","s":"I'd never have got to the airport on time if I ___ (take) the bus.","a":["had taken"]},{"t":"tx","s":"We could have finished much earlier if we ___ (have) fewer breaks.","a":["had had"]},{"t":"tx","s":"You ___ (not crash) the car if you hadn't been using your phone.","a":["wouldn't have crashed"]},{"t":"tx","s":"I wouldn't eat there if I ___ (be) you. The service is awful.","a":["were","was"]},{"t":"tx","s":"Trevor ___ (not go) on the trip if he'd known how much it was going to cost.","a":["wouldn't have gone"]},{"t":"tx","s":"If you ___ (spend) less on clothes, you might be able to rent a nicer apartment.","a":["spent"]}]},{"ins":"Choose the correct verb forms.","items":[{"t":"mc","s":"You'd know what to do if you ___ to her instructions properly.","o":["were listening","'d listened"],"a":1},{"t":"mc","s":"I ___ to his leaving party even if he'd asked me.","o":["wouldn't go","wouldn't have gone"],"a":1},{"t":"mc","s":"I'd help you fix your bike if I ___ how to do it.","o":["'d known","knew"],"a":1},{"t":"mc","s":"You'd be able to enjoy the sun today if you ___ your work yesterday.","o":["'d done","'d have done"],"a":0},{"t":"mc","s":"We ___ the house if you'd told us you were coming today.","o":["'d have cleaned","'d clean"],"a":0},{"t":"mc","s":"You wouldn't be so hungry now if you ___ a good breakfast.","o":["'d eaten","'d have eaten"],"a":0}]},{"ins":"Complete the sentences with the correct form of a verb from the box: be, live, come, buy, stop, not start, not have, not be, play.","items":[{"t":"tx","s":"I wish you ___ so tall – I can't find clothes to fit you.","a":["weren't","wasn't"]},{"t":"tx","s":"I bet you sometimes wish we ___ in a bigger house.","a":["lived"]},{"t":"tx","s":"I'm so thirsty. I wish we ___ some water when we were in that shop.","a":["had bought"]},{"t":"tx","s":"I wish you ___ singing that tune – it's starting to drive me mad!","a":["would stop"]},{"t":"tx","s":"My girlfriend has always wished she ___ a musical instrument.","a":["could play","played"]},{"t":"tx","s":"My History of Art course isn't very good. I wish I ___ it.","a":["hadn't started"]},{"t":"tx","s":"I wish that taxi ___ soon! They said they would send one straight away.","a":["would come"]},{"t":"tx","s":"Do you ever wish you ___ to spend time with your family?","a":["didn't have"]}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"Mark had been unemployed for three months and was d___ to find a job.","a":["esperate","desperate"],"show":"desperate"},{"t":"tx","s":"I was s___ when I heard that he'd died. He was so young!","a":["hocked","shocked","tunned","stunned"],"show":"shocked"},{"t":"tx","s":"I was very o___ when Mary said she couldn't understand my accent.","a":["ffended","offended"],"show":"offended"},{"t":"tx","s":"We were so g___ when Barry offered to help us clear up the mess.","a":["rateful","grateful"],"show":"grateful"},{"t":"tx","s":"I get really n___ before giving a presentation, but I'm OK once I've started.","a":["ervous","nervous"],"show":"nervous"},{"t":"tx","s":"They must have been d___ when their house was flooded a second time.","a":["evastated","devastated","esperate","desperate"],"show":"devastated"},{"t":"tx","s":"I was so o___ with emotion I burst into tears.","a":["verwhelmed","overwhelmed"],"show":"overwhelmed"},{"t":"tx","s":"I've been digging this garden for hours. I'm completely sh___!","a":["attered","shattered"],"show":"shattered"}]},{"ins":"Choose the correct adjective.","items":[{"t":"mc","s":"The facts in that article are absolutely ___!","o":["astonished","astonishing"],"a":1},{"t":"mc","s":"I find dealing with large groups of children very ___.","o":["stressing","stressful"],"a":1},{"t":"mc","s":"I felt ___ to paint a picture after going to that exhibition.","o":["inspired","inspiring"],"a":0},{"t":"mc","s":"We were ___ by the rude staff at the customer service desk.","o":["infuriating","infuriated"],"a":1},{"t":"mc","s":"I think the instructions for this camera are a bit ___.","o":["confused","confusing"],"a":1},{"t":"mc","s":"We were so ___ when we realized we hadn't left a tip for the waiters.","o":["embarrassed","embarrassing"],"a":0}]},{"ins":"Complete the sentences with the correct form of the word (frustrate, terrify).","items":[{"t":"tx","s":"Isn't it ___ when you can't open the plastic packaging on something? (frustrate)","a":["frustrating"]},{"t":"tx","s":"You must have felt very ___ when they didn't believe you. (frustrate)","a":["frustrated"]},{"t":"tx","s":"These questionnaires really ___ me because none of the answers are right for me. (frustrate)","a":["frustrate"]},{"t":"tx","s":"The thunder was so loud it ___ the children. (terrify)","a":["terrified"]},{"t":"tx","s":"Speaking in public is ___ for some people. (terrify)","a":["terrifying"]},{"t":"tx","s":"Dan looked completely ___ when you asked him to hold your baby! (terrify)","a":["terrified"]}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Match the words with the same sound. (Example: ashamed → amazed)","items":[{"t":"mc","s":"g*u*tted","o":["pr*ou*d","devast*a*ted","aston*i*shed","ref*u*se","st*u*nned"],"a":4,"pr":1},{"t":"mc","s":"conf*u*sing","o":["pr*ou*d","devast*a*ted","aston*i*shed","ref*u*se","st*u*nned"],"a":3,"pr":1},{"t":"mc","s":"d*ow*n","o":["pr*ou*d","devast*a*ted","aston*i*shed","ref*u*se","st*u*nned"],"a":0,"pr":1},{"t":"mc","s":"d*e*lighted","o":["pr*ou*d","devast*a*ted","aston*i*shed","ref*u*se","st*u*nned"],"a":2,"pr":1},{"t":"mc","s":"gr*a*teful","o":["pr*ou*d","devast*a*ted","aston*i*shed","ref*u*se","st*u*nned"],"a":1,"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["de","vas","ta","ted"],"a":0},{"t":"syl","s":"","o":["dis","a","ppoin","ting"],"a":2},{"t":"syl","s":"","o":["des","pe","rate"],"a":0},{"t":"syl","s":"","o":["o","ver","whelmed"],"a":2},{"t":"syl","s":"","o":["ho","rri","fy","ing"],"a":0}]}]},{"k":"r","name":"Reading","title":"Survival Stories","text":["We’ve all heard amazing stories in which people struggle heroically to survive against all the odds. [1] The truth, though, is that not all survivors are quite so heroic. As these two stories show, the will to survive isn’t always so strong.","As an experienced sailor, Lynn Walker knows nothing is ever certain on the high seas. However, when she took on the job of sailing a luxury yacht from Tahiti to San Diego, she must have believed that it would be one of the less complicated trips she had done. Little did she know that after a week of calm sailing, the weather would change dramatically, bringing a tropical depression from Central America to blast the yacht with 20-metre-high waves. Lynn found herself battling against Hurricane Raymond. [2]","Lynn was unconscious for a long time. When she did finally come round, she realized that the boat had miraculously righted itself, and that she had been saved by the lifeline connecting her to the boat. [3] Tragically, she could see Simon, her boyfriend, lying dead in the water.","There was plenty of food on the boat, and the weather was calm again, but Lynn could only feel an overwhelming sense of hopelessness. She found that she couldn’t eat, and simply sat on the soaking wet deck. It was as if she had given up, and was waiting to die. Then, all of a sudden, a voice in her head told her to survive. She managed to put up a makeshift sail, and, consulting the surviving charts on the boat, somehow sailed to Hawaii.","Another story is set in the thrilling, yet terrifying, Marathon des Sables, arguably the world’s toughest foot race.","Competitors attempt a six-day 250-km run across the Sahara desert in temperatures of over 45 degrees. Just imagine getting lost. That, however, is exactly what happened to an Italian policeman called Marco Contadino, a regular competitor, when he took part in the race in 1996. [4] Marco should have stopped and waited for the storm to calm down, but he kept on, desperate to stay in seventh place in the race, only to find that when the wind dropped he could no longer see the course. He reached for his water bottle and found there were only a few drops left in the bottom of it.","For three whole days Marco tried to find his way back to the course, with barely any water and no idea what direction he was heading in. He started to visualize the agonizing death he would soon have to face. A friend had once told him that dying of thirst was the worst of all possible deaths. Fearing such a long and painful death, he decided to cut his wrists with a knife. But, short of water, his blood was thick and would not flow. [5] Five more days passed until, miraculously, a group of Tuareg nomads found him and took him to a village. Marco discovered he was in Algeria, 130 miles away from the race course."],"sents":["She had tied it to herself moments before the boat had first gone under the waves.","A sandstorm developed as he was running, which covered the marks of the course he was following with sand.","In desperation, he headed out into the desert one more time, expecting to die.","Something went wrong, and soon disaster struck.","It was an unequal battle, and the boat soon turned over.","We wonder what we would have done in similar impossible situations, and find it hard to imagine how these people found the strength to stay alive."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":2,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write an article for your school magazine about the following topic: 'An exciting trip'. Write 140–180 words.","bullets":["say when and where the trip took place","describe what happened","explain how you felt after this experience"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about what they would do if they found a wallet. Choose from the list (A–F) what each speaker says. There is one extra letter you do not need to use.","list":["I would take it and use the money.","I would leave it in a local shop.","I would leave it on the ground.","I would put it back on the ground after looking at it.","I would leave a note about the wallet near where I found it.","I would give it to the police."],"script":[["Speaker 1","If I found a wallet in the street, I'd take it straight to the nearest police station. That's what they're there for, and the owner will probably go there first to ask if anyone has handed it in."],["Speaker 2","Honestly? I'd leave it where it was. I wouldn't want anyone to think I'd stolen it. The owner will probably come back the way they came and find it."],["Speaker 3","I'd take it home with me, but I'd stick a note on the lamp post next to where I found it, with my phone number, saying 'Found: wallet'. Then the owner can call me."],["Speaker 4","If there was a lot of cash in it, to be honest, I'd probably keep the money and spend it. I know it's wrong, but money is money. I'd post the cards back to the bank, though."],["Speaker 5","I'd open it and look for an ID card or a phone number. If there wasn't anything useful, I'd put it back exactly where I found it – the owner will probably come back for it."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":3,"gap":1}]},{"ins":"Listen to a man talking about an explorer and his achievements. Choose the correct answer.","script":[["Speaker","Sir Ranulph Fiennes is often called the world's greatest living explorer, but climbing Everest wasn't easy for him. On his first attempt, in 2005, he had a serious heart problem near the top and had to turn back."],["Speaker","His second attempt, in 2008, also failed – this time because of exhaustion – and he finally reached the summit on his third attempt, in 2009, at the age of sixty-five."],["Speaker","What many people don't know is that he has always been afraid of heights, ever since he was a child. Cold weather and getting lost never worried him – he'd spent years in the Arctic and Antarctic – but looking down from a great height terrified him."],["Speaker","He said that standing on the summit, he felt he could almost touch the stars. But he didn't feel proud or happy at the time. In fact, he felt absolutely terrible – he was exhausted and could hardly breathe."],["Speaker","He had carried a flag from the charity he was raising money for, and before starting the climb down, he took a photo of the flag on the summit."]],"items":[{"t":"mc","s":"Sir Ranulph Fiennes had a medical problem the ___ time he tried to climb Everest.","o":["first","second","third"],"a":0},{"t":"mc","s":"The thing that Sir Ranulph was most afraid of while climbing Everest was ___.","o":["getting lost","being up very high","feeling too cold"],"a":1},{"t":"mc","s":"From the top of Everest, Sir Ranulph felt he could almost touch the ___.","o":["moon","stars","clouds"],"a":1},{"t":"mc","s":"When he reached the top of Everest, Sir Ranulph felt ___.","o":["proud","terrible","worried"],"a":1},{"t":"mc","s":"At the top of the mountain, Sir Ranulph took photos of ___.","o":["the other people there","a flag","the view"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["When / last feel / homesick?","What / do / if / get lost in the jungle?","What things / find annoying?","What / make / feel really fed up?","Have / made / a mistake / learned lesson from? What?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about dangerous activities. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'People shouldn't be allowed to do dangerous activities for fun.'"]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
TESTS.push({"id":"f5b","kind":"file","title":"File 5 Test B","focus":"Unreal conditionals, structures after wish; feelings, -ed / -ing adjectives.","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Choose the correct verb forms.","items":[{"t":"mc","s":"You could come to the beach now if you ___ the cleaning earlier.","o":["'d done","'d have done"],"a":0},{"t":"mc","s":"I ___ your car if I'd known you wanted it back today.","o":["'d have cleaned","'d clean"],"a":0},{"t":"mc","s":"They wouldn't be so desperate for lunch if they ___ breakfast.","o":["'d eaten","'d have eaten"],"a":0},{"t":"mc","s":"I ___ to that college if I'd known the teaching was poor.","o":["wouldn't go","wouldn't have gone"],"a":1},{"t":"mc","s":"I'd be happy to give you a hand if I ___ anything about gardening.","o":["'d known","knew"],"a":1},{"t":"mc","s":"If they ___ to what I told them then they wouldn't be confused.","o":["were listening","'d listened"],"a":1}]},{"ins":"Complete the sentences with the correct form of a verb from the box: be, can, live, not have, come, buy, stop, not start, not be.","items":[{"t":"tx","s":"I do wish you ___ playing that song over and over again – it's driving me mad!","a":["would stop"]},{"t":"tx","s":"I wish I ___ smoking. It's so hard to give up.","a":["hadn't started"]},{"t":"tx","s":"I wish the bus ___ soon! I've been waiting here for twenty minutes.","a":["would come"]},{"t":"tx","s":"Don't you wish you ___ in a quieter part of town?","a":["lived"]},{"t":"tx","s":"I wish you ___ so busy – I'd love to come and visit you.","a":["weren't","wasn't"]},{"t":"tx","s":"Do you think Ela sometimes wishes she ___ curly hair?","a":["didn't have"]},{"t":"tx","s":"My mum has always wished she ___ ride a horse.","a":["could"]},{"t":"tx","s":"I'm hungry. I wish I ___ something to eat when we were in that shop.","a":["had bought"]}]},{"ins":"Complete the sentences with the correct form of the verbs in brackets.","items":[{"t":"tx","s":"Zoe ___ (not go) to Iceland if she'd known how expensive it was going to be.","a":["wouldn't have gone"]},{"t":"tx","s":"I wouldn't order the fish risotto if I ___ (be) you.","a":["were","was"]},{"t":"tx","s":"You wouldn't get to the coast by lunchtime unless you ___ (set) off very early.","a":["set"]},{"t":"tx","s":"If he ___ (spend) less on video games, he might be able to buy nicer clothes.","a":["spent"]},{"t":"tx","s":"We could have painted the whole house by now if we ___ (have) shorter breaks.","a":["had had"]},{"t":"tx","s":"Celia ___ (not crash) her car if she hadn't been talking to me.","a":["wouldn't have crashed"]}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Choose the correct adjective.","items":[{"t":"mc","s":"We found the instructions for the hard disk recorder very ___.","o":["confused","confusing"],"a":1},{"t":"mc","s":"That supermarket's good, but the long queues leave me feeling ___.","o":["infuriating","infuriated"],"a":1},{"t":"mc","s":"That newspaper story is simply ___!","o":["astonished","astonishing"],"a":1},{"t":"mc","s":"Robert was so ___ when he got your name wrong.","o":["embarrassed","embarrassing"],"a":0},{"t":"mc","s":"My job can be rather ___ at times.","o":["stressing","stressful"],"a":1},{"t":"mc","s":"We both felt ___ to do some sport after watching the Olympics.","o":["inspired","inspiring"],"a":0}]},{"ins":"Complete the sentences with the correct form of the word (terrify, frustrate).","items":[{"t":"tx","s":"Jan seemed ___ when your dog came into the garden. (terrify)","a":["terrified"]},{"t":"tx","s":"Giving a speech can be ___ if you haven't spoken in public before. (terrify)","a":["terrifying"]},{"t":"tx","s":"That horror film was so realistic it ___ me. (terrify)","a":["terrified"]},{"t":"tx","s":"I was feeling very ___ when they couldn't find my luggage. (frustrate)","a":["frustrated"]},{"t":"tx","s":"Isn't it ___ when your internet connection is really slow? (frustrate)","a":["frustrating"]},{"t":"tx","s":"These surveys always ___ me because I find the questions a bit stupid. (frustrate)","a":["frustrate"]}]},{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"It's normal to feel n___ before giving a speech – don't worry, it'll be fine.","a":["ervous","nervous"],"show":"nervous"},{"t":"tx","s":"We were both o___ with emotion when we heard the news, and cried.","a":["verwhelmed","overwhelmed"],"show":"overwhelmed"},{"t":"tx","s":"Sally was d___ when she heard that her house had been destroyed in the fire.","a":["evastated","devastated"],"show":"devastated"},{"t":"tx","s":"You must be sh___! You've been carrying heavy boxes all day.","a":["attered","shattered"],"show":"shattered"},{"t":"tx","s":"Please come and stay! I'm so lonely here and I'm d___ to see someone!","a":["esperate","desperate"],"show":"desperate"},{"t":"tx","s":"I hope you weren't o___ when I said that your cake was a bit heavy.","a":["ffended","offended"],"show":"offended"},{"t":"tx","s":"We were s___ when we heard that Jack was in hospital. He seemed so healthy!","a":["hocked","shocked","tunned","stunned"],"show":"shocked"},{"t":"tx","s":"I'd be extremely g___ if you could help me to clean up all this mess.","a":["rateful","grateful"],"show":"grateful"}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["des","pe","rate"],"a":0},{"t":"syl","s":"","o":["o","ver","whelmed"],"a":2},{"t":"syl","s":"","o":["ho","rri","fy","ing"],"a":0},{"t":"syl","s":"","o":["de","vas","ta","ted"],"a":0},{"t":"syl","s":"","o":["dis","a","ppoin","ting"],"a":2}]},{"ins":"Match the words with the same sound. (Example: ashamed → amazed)","items":[{"t":"mc","s":"d*e*lighted","o":["pr*ou*d","devast*a*ted","aston*i*shed","inf*u*riated","st*u*nned"],"a":2,"pr":1},{"t":"mc","s":"g*u*tted","o":["pr*ou*d","devast*a*ted","aston*i*shed","inf*u*riated","st*u*nned"],"a":4,"pr":1},{"t":"mc","s":"conf*u*sing","o":["pr*ou*d","devast*a*ted","aston*i*shed","inf*u*riated","st*u*nned"],"a":3,"pr":1},{"t":"mc","s":"gr*a*teful","o":["pr*ou*d","devast*a*ted","aston*i*shed","inf*u*riated","st*u*nned"],"a":1,"pr":1},{"t":"mc","s":"d*ow*n","o":["pr*ou*d","devast*a*ted","aston*i*shed","inf*u*riated","st*u*nned"],"a":0,"pr":1}]}]},{"k":"r","name":"Reading","title":"Survival Stories","text":["We’ve all heard amazing stories in which people struggle heroically to survive against all the odds. [1] The truth, though, is that not all survivors are quite so heroic. As these two stories show, the will to survive isn’t always so strong.","As an experienced sailor, Lynn Walker knows nothing is ever certain on the high seas. However, when she took on the job of sailing a luxury yacht from Tahiti to San Diego, she must have believed that it would be one of the less complicated trips she had done. Little did she know that after a week of calm sailing, the weather would change dramatically, bringing a tropical depression from Central America to blast the yacht with 20-metre-high waves. Lynn found herself battling against Hurricane Raymond. [2]","Lynn was unconscious for a long time. When she did finally come round, she realized that the boat had miraculously righted itself, and that she had been saved by the lifeline connecting her to the boat. [3] Tragically, she could see Simon, her boyfriend, lying dead in the water.","There was plenty of food on the boat, and the weather was calm again, but Lynn could only feel an overwhelming sense of hopelessness. She found that she couldn’t eat, and simply sat on the soaking wet deck. It was as if she had given up, and was waiting to die. Then, all of a sudden, a voice in her head told her to survive. She managed to put up a makeshift sail, and, consulting the surviving charts on the boat, somehow sailed to Hawaii.","Another story is set in the thrilling, yet terrifying, Marathon des Sables, arguably the world’s toughest foot race.","Competitors attempt a six-day 250-km run across the Sahara desert in temperatures of over 45 degrees. Just imagine getting lost. That, however, is exactly what happened to an Italian policeman called Marco Contadino, a regular competitor, when he took part in the race in 1996. [4] Marco should have stopped and waited for the storm to calm down, but he kept on, desperate to stay in seventh place in the race, only to find that when the wind dropped he could no longer see the course. He reached for his water bottle and found there were only a few drops left in the bottom of it.","For three whole days Marco tried to find his way back to the course, with barely any water and no idea what direction he was heading in. He started to visualize the agonizing death he would soon have to face. A friend had once told him that dying of thirst was the worst of all possible deaths. Fearing such a long and painful death, he decided to cut his wrists with a knife. But, short of water, his blood was thick and would not flow. [5] Five more days passed until, miraculously, a group of Tuareg nomads found him and took him to a village. Marco discovered he was in Algeria, 130 miles away from the race course."],"sents":["She had tied it to herself moments before the boat had first gone under the waves.","A sandstorm developed as he was running, which covered the marks of the course he was following with sand.","In desperation, he headed out into the desert one more time, expecting to die.","Something went wrong, and soon disaster struck.","It was an unequal battle, and the boat soon turned over.","We wonder what we would have done in similar impossible situations, and find it hard to imagine how these people found the strength to stay alive."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":2,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write an article for your school magazine about the following topic: 'An exciting trip'. Write 140–180 words.","bullets":["say when and where the trip took place","describe what happened","explain how you felt after this experience"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about what they would do if they found a wallet. Choose from the list (A–F) what each speaker says. There is one extra letter you do not need to use.","list":["I would leave a note about the wallet somewhere nearby.","I would not pick it up.","I would take it and spend the money.","I would phone the police.","I would look for contact details in the wallet.","I would want some money for being honest."],"script":[["Speaker 1","If I found a wallet in the street, I'd take it straight to the nearest police station. That's what they're there for, and the owner will probably go there first to ask if anyone has handed it in."],["Speaker 2","Honestly? I'd leave it where it was. I wouldn't want anyone to think I'd stolen it. The owner will probably come back the way they came and find it."],["Speaker 3","I'd take it home with me, but I'd stick a note on the lamp post next to where I found it, with my phone number, saying 'Found: wallet'. Then the owner can call me."],["Speaker 4","If there was a lot of cash in it, to be honest, I'd probably keep the money and spend it. I know it's wrong, but money is money. I'd post the cards back to the bank, though."],["Speaker 5","I'd open it and look for an ID card or a phone number. If there wasn't anything useful, I'd put it back exactly where I found it – the owner will probably come back for it."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":1,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":4,"gap":1}]},{"ins":"Listen to a man talking about an explorer and his achievements. Choose the correct answer.","script":[["Speaker","Sir Ranulph Fiennes is often called the world's greatest living explorer, but climbing Everest wasn't easy for him. On his first attempt, in 2005, he had a serious heart problem near the top and had to turn back."],["Speaker","His second attempt, in 2008, also failed – this time because of exhaustion – and he finally reached the summit on his third attempt, in 2009, at the age of sixty-five."],["Speaker","What many people don't know is that he has always been afraid of heights, ever since he was a child. Cold weather and getting lost never worried him – he'd spent years in the Arctic and Antarctic – but looking down from a great height terrified him."],["Speaker","He said that standing on the summit, he felt he could almost touch the stars. But he didn't feel proud or happy at the time. In fact, he felt absolutely terrible – he was exhausted and could hardly breathe."],["Speaker","He had carried a flag from the charity he was raising money for, and before starting the climb down, he took a photo of the flag on the summit."]],"items":[{"t":"mc","s":"Sir Ranulph Fiennes was successful on his ___ attempt to climb Everest.","o":["first","second","third"],"a":2},{"t":"mc","s":"Since he was a child, Sir Ranulph has disliked the thought of ___.","o":["heights","cold weather","getting lost"],"a":0},{"t":"mc","s":"At the top of the mountain, Sir Ranulph thought the ___ were nearly close enough to reach.","o":["moon","clouds","stars"],"a":2},{"t":"mc","s":"When he reached the top of Everest, he didn't feel particularly ___.","o":["proud","happy","well"],"a":2},{"t":"mc","s":"Sir Ranulph carried a ___ from a charity in England with him.","o":["radio","camera","flag"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["When / last feel / homesick?","What / do / if / get lost in the jungle?","What things / find annoying?","What / make / feel really fed up?","Have / made / a mistake / learned lesson from? What?"]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'People shouldn't be allowed to do dangerous activities for fun.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about dangerous activities. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
TESTS.push({"id":"f6a","kind":"file","title":"File 6 Test A","focus":"Gerunds and infinitives, used to, be used to, get used to; music, sleep.","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Complete the sentences with the gerund or infinitive form of the verbs in brackets.","items":[{"t":"tx","s":"Do you fancy ___ (go) for a walk in the park?","a":["going"]},{"t":"tx","s":"You should practise ___ (speak) English whenever you get the opportunity.","a":["speaking"]},{"t":"tx","s":"The shop assistant refused ___ (give) me a refund.","a":["to give"]},{"t":"tx","s":"I can't remember ___ (have) a doll when I was a little girl.","a":["having"]},{"t":"tx","s":"You'd better ___ (ring) Darren and tell him we'll be late.","a":["ring"]},{"t":"tx","s":"Have you tried ___ (sleep) on the other side of the bed?","a":["sleeping"]},{"t":"tx","s":"We can't wait ___ (see) your new house.","a":["to see"]},{"t":"tx","s":"My boss makes me ___ (work) at the weekend sometimes.","a":["work"]},{"t":"tx","s":"No one forgets ___ (see) Venice for the first time.","a":["seeing"]},{"t":"tx","s":"Could you let me ___ (speak), please!","a":["speak"]}]},{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"Did you ___ do much sport at school?","o":["use to","used to"],"a":0},{"t":"mc","s":"Driving on the left was weird at first, but I ___ it now.","o":["use to","'m used to"],"a":1},{"t":"mc","s":"We ___ be very good children most of the time.","o":["would","used to"],"a":1},{"t":"mc","s":"I ___ eat fish at all, but I have it occasionally now.","o":["wasn't used to","didn't use to"],"a":1},{"t":"mc","s":"Sam ___ goes to work by bus, but he decided to walk today.","o":["usually","use to"],"a":0},{"t":"mc","s":"Clara and Tom used to ___ a couple, but they've split up now.","o":["be","being"],"a":0},{"t":"mc","s":"I ___ speaking so much English – it's tiring!","o":["'m not used to","didn't use to"],"a":0},{"t":"mc","s":"I can't ___ this new operating system. I prefer the old one.","o":["get used to","be used to"],"a":0},{"t":"mc","s":"On a free afternoon, I ___ drive to the coast and do some surfing.","o":["often","'m used to"],"a":0},{"t":"mc","s":"My mother ___ always bake cakes on Saturdays when I was young – I loved it!","o":["would","use to"],"a":0}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"An e___ is an extra piece performed when the audience calls the performer back.","a":["ncore","encore"],"show":"encore"},{"t":"tx","s":"A f___ is a long thin metal instrument that you blow into.","a":["lute","flute"],"show":"flute"},{"t":"tx","s":"A s___ is a female singer who sings very high.","a":["oprano","soprano"],"show":"soprano"},{"t":"tx","s":"Jazz and soul are examples of two different musical g___.","a":["enres","genres"],"show":"genres"},{"t":"tx","s":"The person who directs an orchestra is called a c___.","a":["onductor","conductor"],"show":"conductor"},{"t":"tx","s":"A c___ looks like a very big violin.","a":["ello","cello"],"show":"cello"}]},{"ins":"Complete the sentences with the correct word(s).","items":[{"t":"mc","s":"Why are you ___? Are you tired or just bored?","o":["snoring","napping","yawning"],"a":2},{"t":"mc","s":"I didn't hear you get back last night, I was ___ asleep.","o":["fast","deep","fallen"],"a":0},{"t":"mc","s":"I use a special ___ that gives my long neck enough support.","o":["duvet","blanket","pillow"],"a":2},{"t":"mc","s":"I used to suffer from ___. I would lie awake for hours every night.","o":["insomnia","jet-lag","nightmares"],"a":0},{"t":"mc","s":"When it's really hot in summer, I just sleep under a ___.","o":["pillow","sheet","duvet"],"a":1},{"t":"mc","s":"If you eat too much late at night, it will ___ you awake.","o":["stay","keep","make"],"a":1},{"t":"mc","s":"My uncle gets up very early but he sometimes has a ___ in the afternoons.","o":["dream","yawn","nap"],"a":2},{"t":"mc","s":"You don't need to worry about ___ – that alarm clock's incredibly loud.","o":["oversleeping","having a siesta","keeping awake"],"a":0}]},{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"I love the ___ in Rome – there are so many beautiful buildings.","o":["architecture","graffiti"],"a":0},{"t":"mc","s":"My aunt once visited a ___ to try and contact my dead uncle.","o":["psychic","psychologist"],"a":0},{"t":"mc","s":"___ make your coffee in a coffee shop.","o":["Baristas","Macchiatos"],"a":0},{"t":"mc","s":"Carlo is one of the best ___ around – his restaurant is always booked up.","o":["chauffeurs","chefs"],"a":1},{"t":"mc","s":"Hélène Grimaud is performing Brahms Piano ___ no.1 tonight.","o":["Concerto","Symphony"],"a":0},{"t":"mc","s":"I've sent Janet some flowers – a lovely ___ of roses.","o":["bouquet","croissant"],"a":0}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Match the words with the same sound. (Example: orchestra → yawn)","items":[{"t":"mc","s":"ph*o*tograph","o":["b*a*ss guitar","s*a*xophone","l*o*g","al*ar*m","pill*ow*"],"a":4,"pr":1},{"t":"mc","s":"aw*a*ke","o":["b*a*ss guitar","s*a*xophone","l*o*g","al*ar*m","pill*ow*"],"a":0,"pr":1},{"t":"mc","s":"c*a*cophony","o":["b*a*ss guitar","s*a*xophone","l*o*g","al*ar*m","pill*ow*"],"a":1,"pr":1},{"t":"mc","s":"*en*core","o":["b*a*ss guitar","s*a*xophone","l*o*g","al*ar*m","pill*ow*"],"a":2,"pr":1},{"t":"mc","s":"guit*ar*","o":["b*a*ss guitar","s*a*xophone","l*o*g","al*ar*m","pill*ow*"],"a":3,"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["ar","chi","tec","ture"],"a":0},{"t":"syl","s":"","o":["phi","lo","so","phy"],"a":1},{"t":"syl","s":"","o":["or","che","stra"],"a":0},{"t":"syl","s":"","o":["in","som","ni","a"],"a":1},{"t":"syl","s":"","o":["hy","po","chon","dri","ac"],"a":2}]}]},{"k":"r","name":"Reading","title":"Music and Mood","text":["The helpful effects of music on mental health have been known for thousands of years. Ancient philosophers from Plato to Confucius sang the praises of music and used it to help deal with stress. [1] Military bands use music to build confidence and courage. Sporting events provide music to build up enthusiasm. Modern research carried out by several psychologists supports what most people believe about music benefiting mood and confidence.","Because of our unique experiences, we develop varied musical tastes and preferences. [2] Babies, for example, love lullabies. Maternal singing is particularly calming, even if a mother has no formal musical talents. Certain kinds of music make almost everyone feel worse – even when they say they enjoy it. A study of 144 adults and teenagers who listened to four different kinds of music showed that their emotions changed according to the music. Grunge music, which has a lot of guitar and drums, for example, led to significant increases in negative emotions such as sadness, tension, and fatigue across the entire group – even in the teenagers who said they liked it. In another study, college students reported the opposite when they listened to pop, rock, classical music, and oldies – songs from more than 15 years ago. They said it helped them feel happier and more optimistic, friendly, relaxed, and calm.","Everyone who has learned the alphabet knows that it is easier to memorize a list if it is set to music. Scientific research supports what many people believe – that pairing music with a musical rhythm improves learning and helps people to remember things. [3] First of all, it can be used as a reward when someone behaves in the required way. For example, for paying attention to homework for ten minutes, a child can be given the opportunity to listen to music for five minutes. Second, it can be used to help increase attention to ‘boring’ academic tasks such as memorization, using songs, rhythms, and dance or movement to enhance the interest of the lists to be memorized. Instrumental music is great for improving attention and reasoning, and for students, playing background music is not distracting. Lastly, music can be used to help organize activities – one kind of music for one activity (studying), another for a different activity (eating), and a third kind for going to bed.","Many people find familiar music comforting and calming. In fact, music is so effective in reducing anxiety, it is often used by dentists or by doctors just before performing an operation to help patients cope with their concerns.","[4] Any kind of relaxing, calming music can contribute to calmer moods. It is often combined with cognitive therapy to lower anxiety. Some studies suggest that specially designed music, which includes certain tones, can help improve symptoms in anxious patients even more than music without these tones; listening to this music without other distractions (not while driving, cooking, talking, or reading) promotes the best benefits. Since ancient times, it has been known that certain kinds of music can help soothe away stress. Calming background music can help patients in hospital feel less bad-tempered. It can also help elderly patients in nursing homes who are very ill feel calmer. Music, wisely chosen, lowers stress hormone levels. [5] Knowing that certain kinds of music can reduce stress is one thing. Being attentive in choosing what kind of music to listen to is another. So, choose your music as carefully as you choose your food and friends."],"sents":["Music helps decrease worries in the elderly, new mothers, and children too.","And in modern times, shopping malls play music to attract customers and keep them in the store.","This can be used to help children and teenagers with attention problems in several ways.","However, it’s difficult to explain how exactly it works.","On the other hand, parents of teenagers know that certain kinds of music, particularly at high volumes, can cause stress.","Despite these differences, however, there are some common responses to music."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":2,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"You recently attended a concert in your town. Write an email to your friend telling him / her about the concert. Write 140–180 words.","bullets":["tell him / her what kind of music was played at the concert","explain why you like that kind of music","say whether the concert was as good as you had hoped it would be"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about the music they enjoy listening to. Choose from the list (A–F) what each speaker says. There is one extra letter you do not need to use.","list":["I like classical music because it has no words.","Hip-hop music is great fun.","For me, jazz music is comforting.","If I'm alone, I listen to pop music.","Rock music makes me feel more lively.","I've become quite interested in folk music."],"script":[["Speaker 1","After a long day at work, I put on some jazz – a bit of saxophone, a slow piano. It's like a warm blanket. Whatever has happened during the day, it makes me feel safe and comfortable."],["Speaker 2","When I'm tired or a bit down, I put on something loud with electric guitars – old rock bands mostly. Within five minutes I'm full of energy and dancing round the kitchen."],["Speaker 3","I'm a translator, so because of my work I need music with no words – otherwise the lyrics get mixed up with what I'm writing. That's why it's almost always classical music for me, Bach or Chopin."],["Speaker 4","Recently I've got really into folk music – songs from my own country, played on traditional instruments like the dombra. My grandparents used to listen to it, and now I understand why."],["Speaker 5","Hip-hop all the way! The rhythms, the clever lyrics – it's just great fun. My friends and I go to hip-hop nights at a club in town, and we always have a brilliant time."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":1,"gap":1}]},{"ins":"Listen to a student giving a presentation about a musician and performer. Choose the correct answer.","script":[["Student","My presentation today is about Beyoncé – not just as a singer, but as a businesswoman. Her first big business deal outside music was with perfumes, and since then she's done deals with games companies and, most recently, a soft drinks company."],["Student","She also has a fashion company, which she started with her mother. It's named after her grandmother, who was a clothes designer – she made costumes for Beyoncé's grandfather's band, and for Beyoncé's family."],["Student","At first, the clothes were only sold in the US, but since 2010 you can also buy them in Brazil."],["Student","After Hurricane Katrina hit her hometown area in 2005, Beyoncé and Kelly Rowland set up a charity which helped to provide houses for people who had lost their homes."],["Student","More recently, she started a campaign called 'Chime for Change', for girls' and women's rights. She asked other famous people to help her, and to raise money she appeared in a big concert in London."]],"items":[{"t":"mc","s":"Beyoncé's latest business deals with ___.","o":["perfumes","games","drinks"],"a":2},{"t":"mc","s":"Beyoncé's fashion company is named after ___.","o":["her mother","a clothes designer","a computer company"],"a":1},{"t":"mc","s":"Initially, clothes by Beyoncé's company could be bought in ___.","o":["the US","the US and Canada","the US, Canada and Brazil"],"a":0},{"t":"mc","s":"The charity Beyoncé and Kelly Rowland set up dealt with ___ for people who suffered in the hurricane.","o":["food","clothing","houses"],"a":2},{"t":"mc","s":"To raise money for her latest campaign, Beyoncé ___.","o":["released a new song","produced an album with other celebrities","appeared in a concert"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["Which / musical instrument / like / learn / play? Why?","Would / rather / listen / live music / recorded music? Why?","What sort of music / listen to and why?","What / usually do before / go to bed?","How much sleep / usually get each night?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about a person's personality – someone you know well. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'A day without listening to music is an empty day.'"]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
TESTS.push({"id":"f6b","kind":"file","title":"File 6 Test B","focus":"Gerunds and infinitives, used to, be used to, get used to; music, sleep.","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"Denise ___ comes to college by bus, but she cycled today.","o":["usually","use to"],"a":0},{"t":"mc","s":"Peter and Jo used to ___ married, but they got divorced last year.","o":["be","being"],"a":0},{"t":"mc","s":"I ___ driving on the left – it feels very strange!","o":["'m not used to","didn't use to"],"a":0},{"t":"mc","s":"My brother ___ live in a caravan when he was in his twenties.","o":["would","used to"],"a":1},{"t":"mc","s":"My dad ___ always make pizzas when we were little – they were great!","o":["would","use to"],"a":0},{"t":"mc","s":"We can't ___ the new office layout – we still find it confusing.","o":["get used to","be used to"],"a":0},{"t":"mc","s":"When I have a day off, I ___ cycle to the beach and go swimming.","o":["often","'m used to"],"a":0},{"t":"mc","s":"Did your children ___ fight a lot when they were little?","o":["use to","used to"],"a":0},{"t":"mc","s":"I found it strange at first to never leave a tip in Japan, but I ___ it now.","o":["use to","'m used to"],"a":1},{"t":"mc","s":"I ___ like rice much, but I love it now.","o":["wasn't used to","didn't use to"],"a":1}]},{"ins":"Complete the sentences with the gerund or infinitive form of the verbs in brackets.","items":[{"t":"tx","s":"We'd better ___ (ring) the airline company and check the flight isn't cancelled.","a":["ring"]},{"t":"tx","s":"Why don't you try ___ (sleep) on a firmer mattress to see if it helps?","a":["sleeping"]},{"t":"tx","s":"I can't wait ___ (see) Rhona's new scooter – it's a Vespa.","a":["to see"]},{"t":"tx","s":"The company have refused ___ (give) me my money back.","a":["to give"]},{"t":"tx","s":"Would you please let someone else ___ (speak), please!","a":["speak"]},{"t":"tx","s":"Does your company ever make you ___ (work) at weekends?","a":["work"]},{"t":"tx","s":"I'll never forget ___ (see) the Grand Canyon at sunset – it was incredible!","a":["seeing"]},{"t":"tx","s":"Does anyone fancy ___ (go) to the cinema this evening?","a":["going"]},{"t":"tx","s":"Try to practise ___ (speak) English with your host family in Oxford.","a":["speaking"]},{"t":"tx","s":"Do you remember ___ (have) a teddy bear when you were very small?","a":["having"]}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"The ___ in Bath is very interesting, both Roman and Georgian.","o":["architecture","graffiti"],"a":0},{"t":"mc","s":"I once visited a ___ and she told me things about my dead auntie.","o":["psychic","psychologist"],"a":0},{"t":"mc","s":"___ have to do training to learn how to make really good coffee.","o":["Baristas","Macchiatos"],"a":0},{"t":"mc","s":"I know two ___ – they work in the same restaurant.","o":["chauffeurs","chefs"],"a":1},{"t":"mc","s":"I love that Mozart Piano ___ – who's playing the piano?","o":["Concerto","Symphony"],"a":0},{"t":"mc","s":"I got a big ___ of flowers from Anne to say thank you.","o":["bouquet","croissant"],"a":0}]},{"ins":"Complete the sentences with the correct word(s).","items":[{"t":"mc","s":"I'm worried about ___ in the morning – is your alarm clock pretty loud?","o":["oversleeping","having a siesta","keeping awake"],"a":0},{"t":"mc","s":"The noise from the party next door might ___ you awake tonight.","o":["stay","keep","make"],"a":1},{"t":"mc","s":"I don't mind getting up very early if I can have a ___ during the day.","o":["dream","yawn","nap"],"a":2},{"t":"mc","s":"You're too late to read the children a bedtime story – they're ___ asleep.","o":["fast","deep","fallen"],"a":0},{"t":"mc","s":"My dad suffers from ___. He listens to the radio during the night.","o":["insomnia","jet-lag","nightmares"],"a":0},{"t":"mc","s":"I sometimes fall asleep as soon as my head hits the ___.","o":["duvet","blanket","pillow"],"a":2},{"t":"mc","s":"Sorry I keep ___. I'm not tired, just a bit bored with this film.","o":["snoring","napping","yawning"],"a":2},{"t":"mc","s":"It's too hot to have much on the bed tonight, a ___ will be enough.","o":["pillow","sheet","duvet"],"a":1}]},{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"The person who directs an orchestra is called a c___.","a":["onductor","conductor"],"show":"conductor"},{"t":"tx","s":"Jazz and soul are examples of two different musical g___.","a":["enres","genres"],"show":"genres"},{"t":"tx","s":"An e___ is an extra piece performed when the audience calls the performer back.","a":["ncore","encore"],"show":"encore"},{"t":"tx","s":"A c___ looks like a very big violin.","a":["ello","cello"],"show":"cello"},{"t":"tx","s":"A f___ is a long thin metal instrument that you blow into.","a":["lute","flute"],"show":"flute"},{"t":"tx","s":"A s___ is a female singer who sings very high.","a":["oprano","soprano"],"show":"soprano"}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["or","che","stra"],"a":0},{"t":"syl","s":"","o":["in","som","ni","a"],"a":1},{"t":"syl","s":"","o":["hy","po","chon","dri","ac"],"a":2},{"t":"syl","s":"","o":["ar","chi","tec","ture"],"a":0},{"t":"syl","s":"","o":["phi","lo","so","phy"],"a":1}]},{"ins":"Match the words with the same sound. (Example: orchestra → chorus)","items":[{"t":"mc","s":"*en*core","o":["c*on*certo","bouqu*et*","b*a*llet","sopr*a*no","ch*au*ffeur"],"a":0,"pr":1},{"t":"mc","s":"guit*ar*","o":["c*on*certo","bouqu*et*","b*a*llet","sopr*a*no","ch*au*ffeur"],"a":3,"pr":1},{"t":"mc","s":"ph*o*tograph","o":["c*on*certo","bouqu*et*","b*a*llet","sopr*a*no","ch*au*ffeur"],"a":4,"pr":1},{"t":"mc","s":"aw*a*ke","o":["c*on*certo","bouqu*et*","b*a*llet","sopr*a*no","ch*au*ffeur"],"a":1,"pr":1},{"t":"mc","s":"cr*oi*ssant","o":["c*on*certo","bouqu*et*","b*a*llet","sopr*a*no","ch*au*ffeur"],"a":2,"pr":1}]}]},{"k":"r","name":"Reading","title":"Musical Benefits","text":["The helpful effects of music on mental health have been known for thousands of years. Ancient philosophers from Plato to Confucius sang the praises of music and used it to help deal with stress. [1] Military bands use music to build confidence and courage. Sporting events provide music to build up enthusiasm. Modern research carried out by several psychologists supports what most people believe about music benefiting mood and confidence.","Because of our unique experiences, we develop varied musical tastes and preferences. Despite these differences, however, there are some common responses to music.","Babies, for example, love lullabies. Maternal singing is particularly calming, even if a mother has no formal musical talents. Certain kinds of music make almost everyone feel worse – even when they say they enjoy it. A study of 144 adults and teenagers who listened to four different kinds of music showed that their emotions changed according to the music. Grunge music, which has a lot of guitar and drums, for example, led to significant increases in negative emotions such as sadness, tension, and fatigue across the entire group – even in the teenagers who said they liked it. [2] They said it helped them feel happier and more optimistic, friendly, relaxed, and calm.","Everyone who has learned the alphabet knows that it is easier to memorize a list if it is set to music. Scientific research supports what many people believe – that pairing music with a musical rhythm improves learning and helps people to remember things. Music helps children and teenagers with attention problems in several ways.","[3] For example, for paying attention to homework for 10 minutes, a child can be given the opportunity to listen to music for 5 minutes. It can also be used to help increase attention to ‘boring’ academic tasks such as memorization, using songs, rhythms, and dance or movement to enhance the interest of the lists to be memorized. Instrumental music is great for improving attention and reasoning, and for students, playing background music is not distracting. Lastly, music can be used to help organize activities – one kind of music for one activity (studying), another for a different activity (eating), and a third kind for going to bed.","Many people find familiar music comforting and calming. In fact, music is so effective in reducing anxiety, it is often used by dentists or by doctors just before performing an operation to help patients cope with their concerns.","[4] Any kind of relaxing, calming music can contribute to calmer moods. It is, therefore, often combined with cognitive therapy to lower anxiety. Some studies suggest that specially designed music, which includes certain tones, can help improve symptoms in anxious patients even more than music without these tones; listening to this music without other distractions (not while driving, cooking, talking, or reading) promotes the best benefits.","Since ancient times, it has been known that certain kinds of music can help soothe away stress. Calming background music can help patients in hospital feel less bad-tempered. It can also help elderly patients in nursing homes who are very ill feel more calm. Music, wisely chosen, lowers stress hormone levels. On the other hand, parents of teenagers know that certain kinds of music, particularly at high volumes, can cause stress. Knowing that certain kinds of music can reduce stress is one thing. [5] So, choose your music as carefully as you choose your food and friends."],"sents":["Music is found to decrease worries among the elderly, new mothers, and ill children also.","And nowadays, music is used by shopping malls to attract customers and keep them in the store.","It can be used as a reward for required behaviour.","However, it’s difficult to explain how exactly it works.","Being attentive in choosing what kind of music to listen to is another.","In another study, college students reported the opposite when they listened to pop, rock, classical music, and oldies – songs from more than 15 years ago."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":2,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"You recently attended a concert in your town. Write an email to your friend telling him / her about the concert. Write 140–180 words.","bullets":["tell him / her what kind of music was played at the concert","explain why you like that kind of music","say whether the concert was as good as you had hoped it would be"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about the music they enjoy listening to. Choose from the list (A–F) what each speaker says. There is one extra letter you do not need to use.","list":["Hip-hop music is great fun.","I listen to recent pop music.","I enjoy listening to my national musical instruments.","Because of my work, I prefer listening to classical music.","Jazz music makes me feel calm.","I mainly listen to rock music."],"script":[["Speaker 1","After a long day at work, I put on some jazz – a bit of saxophone, a slow piano. It's like a warm blanket. Whatever has happened during the day, it makes me feel safe and comfortable."],["Speaker 2","When I'm tired or a bit down, I put on something loud with electric guitars – old rock bands mostly. Within five minutes I'm full of energy and dancing round the kitchen."],["Speaker 3","I'm a translator, so because of my work I need music with no words – otherwise the lyrics get mixed up with what I'm writing. That's why it's almost always classical music for me, Bach or Chopin."],["Speaker 4","Recently I've got really into folk music – songs from my own country, played on traditional instruments like the dombra. My grandparents used to listen to it, and now I understand why."],["Speaker 5","Hip-hop all the way! The rhythms, the clever lyrics – it's just great fun. My friends and I go to hip-hop nights at a club in town, and we always have a brilliant time."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":0,"gap":1}]},{"ins":"Listen to a student giving a presentation about a musician and performer. Choose the correct answer.","script":[["Student","My presentation today is about Beyoncé – not just as a singer, but as a businesswoman. Her first big business deal outside music was with perfumes, and since then she's done deals with games companies and, most recently, a soft drinks company."],["Student","She also has a fashion company, which she started with her mother. It's named after her grandmother, who was a clothes designer – she made costumes for Beyoncé's grandfather's band, and for Beyoncé's family."],["Student","At first, the clothes were only sold in the US, but since 2010 you can also buy them in Brazil."],["Student","After Hurricane Katrina hit her hometown area in 2005, Beyoncé and Kelly Rowland set up a charity which helped to provide houses for people who had lost their homes."],["Student","More recently, she started a campaign called 'Chime for Change', for girls' and women's rights. She asked other famous people to help her, and to raise money she appeared in a big concert in London."]],"items":[{"t":"mc","s":"The first business Beyoncé was involved with was ___.","o":["perfumes","games","drinks"],"a":0},{"t":"mc","s":"The name for Beyoncé's clothing business came from her ___ connections with making clothes.","o":["mother's","great grandmother's","grandmother's"],"a":2},{"t":"mc","s":"Since 2010, Beyoncé's fashions can also be bought in ___.","o":["the US","Brazil","Canada"],"a":1},{"t":"mc","s":"Beyoncé and Kelly Rowland set up a charity after the hurricane in her hometown in ___.","o":["2005","2008","2011"],"a":0},{"t":"mc","s":"In her 'Chime for Change' campaign, Beyoncé asked ___ to help her.","o":["young mothers","older women","other famous people"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["What / usually dream about?","What / do if / can't sleep?","What / first concert / went to?","How / listen to music?","What music / listen to if / wanted to feel happier? Why?"]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'Someone's musical tastes say a lot about a person's personality.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about personality – your own or someone you know. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
TESTS.push({"id":"f7a","kind":"file","title":"File 7 Test A","focus":"Past modals (must have, might have, should have…), would rather, verbs of the senses; the body, verbs often confused.","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"They ___ gone to bed early – there are no lights on in the house.","o":["must have","should have"],"a":0},{"t":"mc","s":"I suppose I ___ dropped my wallet, but I think it's been stolen.","o":["could have","must have"],"a":0},{"t":"mc","s":"You look exhausted. You ___ for a shorter run.","o":["should have gone","should go"],"a":0},{"t":"mc","s":"I ___ met her at a conference, but I can't remember if I did.","o":["may have","must have"],"a":0},{"t":"mc","s":"Diana ___ got engaged – she's only known him six weeks!","o":["can't have","mustn't have"],"a":0},{"t":"mc","s":"You ___ looked at my emails, it was very wrong of you.","o":["shouldn't have","might not have"],"a":0},{"t":"mc","s":"They ___ finished their walk by now. It's too dark to see anything.","o":["might have","must have"],"a":1}]},{"ins":"Complete the sentences with the correct form of the verbs in brackets.","items":[{"t":"tx","s":"Would you rather ___ (eat) out tonight, or stay in?","a":["eat"]},{"t":"tx","s":"I'd rather you ___ (not meet) me for lunch today, I've got a lot of work to do.","a":["didn't meet"]},{"t":"tx","s":"Chris says he'd rather you ___ (pick) him up at 8.00, not 7.00.","a":["picked"]},{"t":"tx","s":"Danielle admitted that she'd rather ___ (not go) to the barbecue.","a":["not go"]},{"t":"tx","s":"Wouldn't you rather John ___ (do) the repairs in the bathroom this week?","a":["did"]}]},{"ins":"Complete the sentences with the correct word(s).","items":[{"t":"mc","s":"Beth told me you ___ like going to a club. Where would you like to go?","o":["sound","feel","look"],"a":1},{"t":"mc","s":"It's so empty here today. It feels ___ we've got the café to ourselves.","o":["as if","if","that"],"a":0},{"t":"mc","s":"I don't know what this fruit is but it tastes like ___!","o":["great","pineapple","horrible"],"a":1},{"t":"mc","s":"Mmm, that ___ really good! Are you making a cake?","o":["smells","tastes","feels"],"a":0},{"t":"mc","s":"This shirt ___ a bit tight. Do you have it in a larger size?","o":["feels as if","feels","feels like"],"a":1},{"t":"mc","s":"Robert looks more ___ his mother than his father.","o":["as","like","as if"],"a":1},{"t":"mc","s":"Eve looks as ___ she hasn't slept for a week!","o":["though","like","when"],"a":0},{"t":"mc","s":"This music ___ something I've heard before. What's the name of the band?","o":["sounds like","feels like","sounds"],"a":0}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"Please ___ me to set my alarm clock for 7.00 instead of 8.00.","o":["remember","remind"],"a":1},{"t":"mc","s":"Have you ___ that new pizza place on the High Street?","o":["noticed","realized"],"a":0},{"t":"mc","s":"We couldn't ___ her from buying that car.","o":["avoid","prevent"],"a":1},{"t":"mc","s":"We really don't ___ Alice staying another night – she's welcome.","o":["matter","mind"],"a":1},{"t":"mc","s":"I can remember when Manchester United ___ Arsenal 8–2.","o":["beat","won"],"a":0},{"t":"mc","s":"The trouble with Jeff is that he ___ to accept that anything is wrong.","o":["denies","refuses"],"a":1},{"t":"mc","s":"Unemployment has ___ again this month.","o":["risen","raised"],"a":0},{"t":"mc","s":"We ___ the blanket on the ground and had a picnic by the river.","o":["laid","lay"],"a":0},{"t":"mc","s":"That's the jeweller's that was ___ last week.","o":["stolen","robbed"],"a":1},{"t":"mc","s":"I ___ you to look for another job – you really don't seem happy in this one.","o":["advise","warn"],"a":0}]},{"ins":"Complete the sentences with one word.","items":[{"t":"tx","s":"You don't look old! You haven't got any ___ on your face!","a":["wrinkles","lines"]},{"t":"tx","s":"You look as if you've just got out of bed! You should ___ your hair!","a":["brush","comb"]},{"t":"tx","s":"It's very rude to ___ your finger at people.","a":["point"]},{"t":"tx","s":"I knew you wouldn't agree because you raised your ___ when I suggested it.","a":["eyebrows","eyebrow"]},{"t":"tx","s":"Business people often ___ hands when they make a deal.","a":["shake"]},{"t":"tx","s":"Did you use to suck your ___ when you were little?","a":["thumb"]},{"t":"tx","s":"Can you give me a tissue? I need to blow my ___.","a":["nose"]},{"t":"tx","s":"Eric shrugged his ___ and said he had no idea where the path went.","a":["shoulders"]},{"t":"tx","s":"There's a cold wind today. Put this scarf round your ___.","a":["neck"]},{"t":"tx","s":"I could tell as soon as I saw your fingers that you bite your ___.","a":["nails"]}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Choose the silent letter in each word.","items":[{"t":"syl","s":"","o":["m","u","s","c","l","e"],"a":3,"silent":1},{"t":"syl","s":"","o":["c","o","m","b"],"a":3,"silent":1},{"t":"syl","s":"","o":["k","n","ee"],"a":0,"silent":1},{"t":"syl","s":"","o":["w","r","i","s","t"],"a":0,"silent":1},{"t":"syl","s":"","o":["th","i","gh"],"a":2,"silent":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["eye","lash","es"],"a":0},{"t":"syl","s":"","o":["ad","vise"],"a":1},{"t":"syl","s":"","o":["in","ves","ti","gate"],"a":1},{"t":"syl","s":"","o":["ar","gu","ment"],"a":0},{"t":"syl","s":"","o":["ex","pre","ssion"],"a":1}]}]},{"k":"r","name":"Reading","title":"Great Britain – Or Is It?","text":["If someone asked you how happy the people in your country are, what would you say? The British government recently asked the Office for National Statistics (ONS) to carry out a survey to find out if people in the country are, in general, happy or not. Most Britons report being satisfied with life, with concerns over work and finances overtaken by happiness gained from children, relationships, and where people live.","The government survey was released just days after economists made one of the most depressing forecasts of recent times about long-term economic growth. [1] Not only that, but it would leave the public worse off than they were ten years ago. Despite this, the survey paints a picture of the country largely emotionally unaffected by the crisis.","The survey of 4,200 adults is part of the British Prime Minister’s £2 million drive to get a better idea of how the country is doing, rather than just focusing on budgets and figures. People were asked various questions about their lives and were asked to give marks out of ten about how they felt about these areas. The ONS’s work showed that on average people rated their life satisfaction at 7.4 out of 10. When asked whether things they did in life were worthwhile, people on average gave a score of 7.6.","[2] Happiness with people’s financial situation had the lowest average score of 6.2 out of 10, followed by work situation, with 6.7 out of 10. When asked specifically about satisfaction with the balance between time spent on work and on other areas of life, low scores were also given, with an average of 6.4 out of 10.","The answer to the question, ‘Overall, how anxious did you feel yesterday?’ caused some worry. More than a quarter rated this 5 out of 10 – where 10 was feeling ‘completely anxious’. [3] These areas of life had the highest average scores, with both scoring at 8.3 out of 10.","Lord Richard Layard, professor at the London School of Economics, said it was likely that life satisfaction would fall as the situation gets worse. [4] And when things are going badly and times are hard, people start to feel less happy with their lives.","The professor, who founded the Action for Happiness group to promote well-being, said policymakers – the people who make important financial decisions – could use the data to lessen the pain of recession. But they would need to first identify how to measure happiness, then work out what makes people ‘miserable or happy’. Lastly, they ought to assess how much happiness one can create by spending taxpayers’ cash. [5]","Paul Allen of the ONS said another big factor in happiness was health. He said they saw that people who responded when their health was bad, reported anxiety. He added that they were trying to build up a picture of how people rate happiness. ‘One of the most revealing aspects of the emerging science around happiness is about language.","Britons associated happiness with being ‘calm, relaxed, and peaceful’ rather than ‘energized and excited’. So, perhaps it pays in more ways than one to follow the great British belief that it’s best to keep calm and carry on!"],"sents":["However, there were also signs of stress in British society.","This could be used on supporting childcare, parenting, or help for mental health.","He added that we know from other European countries that this is sensitive to how businesses reach highs and sink to lows.","However, a lot of young people think that wealth and celebrity will make you happy.","The experts predicted that the financial decline would be deep and long.","People were happiest, however, with their personal relationships and mental wellbeing."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":2,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write a description for your school blog with the following title: 'My perfect day'. Write 140–180 words.","bullets":["say what a perfect day for you would be and who you would spend it with","explain why you would choose to do those things","say why you think the day would be enjoyable"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five women talking about their relationships. Choose from the list (A–F) what each speaker says about her partner. There is one extra letter you do not need to use.","list":["He's reliable.","He's thoughtful.","He's patient.","He's easygoing.","He's romantic.","He's sociable."],"script":[["Speaker 1","What I love about Tom is that he notices the little things. If I mention I'm stressed about work, the next day there'll be a cup of tea and my favourite chocolate waiting for me. He always thinks about how I'm feeling."],["Speaker 2","My husband's not exciting, but I know I can always count on him. If he says he'll be home at six, he's home at six. If he promises to fix something, it gets fixed. After twenty years, that matters more than anything."],["Speaker 3","Sam is so passionate. He still writes me love letters, brings me flowers for no reason, and once he booked a surprise weekend in Paris just because it was a Tuesday! He's a real romantic."],["Speaker 4","My boyfriend loves being with people. Every weekend our flat is full of his friends, and at parties he talks to absolutely everyone. He's so friendly – sometimes I'd like a quiet night in!"],["Speaker 5","Nothing worries Dan. If we miss a train, he just says 'There'll be another one.' If the plans change, he's happy to go along with it. He's so calm and relaxed that it's hard to have an argument with him."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":1,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":3,"gap":1}]},{"ins":"Listen to a health and lifestyle expert talking about ways people can make themselves happy. Choose the cor
