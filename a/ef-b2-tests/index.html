rect answer.","script":[["Chris","A lot of people think happiness just happens to them, but there's a lot we can do ourselves. First of all, watch out for your own negative thoughts. They affect our decisions far more than other people's opinions do. Try to replace them with positive thoughts."],["Chris","Second, sleep. It's not just how many hours you get – it's the quality of the sleep that really counts. Make sure you're relaxed before bedtime: no phones, no work emails."],["Chris","Third, if you're having a bad day, learn to laugh at yourself. Or put on a comedy – watching something funny really does change your mood."],["Chris","Fourth, get back to basics. The simple things in life satisfy us – telling the family a story at bedtime, cooking a meal together, a walk in the park."],["Chris","And finally, remember that the ability to love is something all people have. It's part of being human. Developing a positive attitude also means getting rid of your fears – once you let go of them, there's much more room for happiness."]],"items":[{"t":"mc","s":"Chris says that our decisions can be affected by ___.","o":["our own negative thoughts","other people's negative opinions","our previous negative experiences"],"a":0},{"t":"mc","s":"According to Chris, the ___ of sleep we get is important.","o":["amount","location","quality"],"a":2},{"t":"mc","s":"Chris recommends ___ if we're having a bad day.","o":["spending time with kids","having a more relaxed attitude","laughing at ourselves"],"a":2},{"t":"mc","s":"Chris mentions ___ as an example of 'getting back to basics'.","o":["getting a pet","telling family members a story","meeting new people"],"a":1},{"t":"mc","s":"Chris says that the ability to love is ___.","o":["missing among people in society nowadays","a characteristic of all people","essential in establishing relationships with people"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["What / make / feel happy?","Is / money / necessary / happiness? Why / Why not?","What / spend / most money / each week? Why?","Is / important / save / money / each month? Why / Why not?","Is / important / teach / young people / value / money? Why / Why not?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about money. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'Some things in life are more important than money.'"]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});

do those things","say why you think the day would be enjoyable"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five women talking about their relationships. Choose from the list (A–F) what each speaker says about her partner. There is one extra letter you do not need to use.","list":["He's passionate.","He's handsome.","He's friendly.","He's caring.","He's dependable.","He's calm."],"script":[["Speaker 1","What I love about Tom is that he notices the little things. If I mention I'm stressed about work, the next day there'll be a cup of tea and my favourite chocolate waiting for me. He always thinks about how I'm feeling."],["Speaker 2","My husband's not exciting, but I know I can always count on him. If he says he'll be home at six, he's home at six. If he promises to fix something, it gets fixed. After twenty years, that matters more than anything."],["Speaker 3","Sam is so passionate. He still writes me love letters, brings me flowers for no reason, and once he booked a surprise weekend in Paris just because it was a Tuesday! He's a real romantic."],["Speaker 4","My boyfriend loves being with people. Every weekend our flat is full of his friends, and at parties he talks to absolutely everyone. He's so friendly – sometimes I'd like a quiet night in!"],["Speaker 5","Nothing worries Dan. If we miss a train, he just says 'There'll be another one.' If the plans change, he's happy to go along with it. He's so calm and relaxed that it's hard to have an argument with him."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":5,"gap":1}]},{"ins":"Listen to a health and lifestyle expert talking about ways people can make themselves happy. Choose the correct answer.","script":[["Chris","A lot of people think happiness just happens to them, but there's a lot we can do ourselves. First of all, watch out for your own negative thoughts. They affect our decisions far more than other people's opinions do. Try to replace them with positive thoughts."],["Chris","Second, sleep. It's not just how many hours you get – it's the quality of the sleep that really counts. Make sure you're relaxed before bedtime: no phones, no work emails."],["Chris","Third, if you're having a bad day, learn to laugh at yourself. Or put on a comedy – watching something funny really does change your mood."],["Chris","Fourth, get back to basics. The simple things in life satisfy us – telling the family a story at bedtime, cooking a meal together, a walk in the park."],["Chris","And finally, remember that the ability to love is something all people have. It's part of being human. Developing a positive attitude also means getting rid of your fears – once you let go of them, there's much more room for happiness."]],"items":[{"t":"mc","s":"Chris says that if we want to feel better, we should ___.","o":["be around happy people","think positive thoughts","be very self-confident"],"a":1},{"t":"mc","s":"According to Chris, people need to ___.","o":["sleep only in one place","be relaxed before bedtime","make sure they get enough sleep"],"a":1},{"t":"mc","s":"Chris recommends that people ___ when they're having a bad day.","o":["spend some time with children","watch something funny","tell jokes"],"a":1},{"t":"mc","s":"Chris says that the simple things in life ___.","o":["satisfy us","are easy for us to do","take up less of our time"],"a":0},{"t":"mc","s":"Chris mentions ___ as a way of developing a positive attitude.","o":["dealing with anger","getting rid of fears","making an effort to get on with others"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["What / make / feel happy?","Is / money / necessary / happiness? Why / Why not?","What / favourite food? / What / taste like?","Think of a favourite relative. What / he / she look like?","When / last argue / someone?"]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'The best way to win an argument is not to start one.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about money. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});

"],"a":["We decided to get the painting valued by an expert."]},{"t":"ord","s":"","wd":["my","going","out","tooth","have","I'm","bad","to","tomorrow","taken"],"a":["I'm going to have my bad tooth taken out tomorrow.","Tomorrow I'm going to have my bad tooth taken out."]},{"t":"ord","s":"","wd":["it","my","checked","I","fully","sold","had","car","I","before"],"a":["I had my car fully checked before I sold it.","Before I sold it, I had my car fully checked."]},{"t":"ord","s":"","wd":["house","you","same","exactly","your","will","painted","have","colour","the","?"],"a":["Will you have your house painted exactly the same colour?"]},{"t":"ord","s":"","wd":["bigger","anyone","get","why","lips","to","made","would","want","their","?"],"a":["Why would anyone want to get their lips made bigger?"]},{"t":"ord","s":"","wd":["our","installed","heating","two","we're","new","system","weeks","having","in"],"a":["We're having our new heating system installed in two weeks.","In two weeks we're having our new heating system installed."]}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"The v___ of the jury was that Mr Anderson was guilty of all charges.","a":["erdict","verdict"],"show":"verdict"},{"t":"tx","s":"The man was charged with s___ after following Miss Stevens everywhere.","a":["talking","stalking"],"show":"stalking"},{"t":"tx","s":"Cigarettes are often s___ into the UK because the tax is so high on them there.","a":["muggled","smuggled"],"show":"smuggled"},{"t":"tx","s":"Two w___ described seeing the attack from their bedroom windows.","a":["itnesses","witnesses"],"show":"witnesses"},{"t":"tx","s":"After being q___ by police for several hours, the woman confessed to the crime.","a":["uestioned","questioned"],"show":"questioned"},{"t":"tx","s":"Both men were s___ to three years in prison.","a":["entenced","sentenced"],"show":"sentenced"},{"t":"tx","s":"The j___ gave the woman a shorter sentence because she had pleaded guilty.","a":["udge","judge"],"show":"judge"},{"t":"tx","s":"The k___ demanded £50,000 for the safe return of the director's wife.","a":["idnappers","kidnappers","idnapper","kidnapper"],"show":"kidnappers"},{"t":"tx","s":"Both women were a___ because of a lack of reliable evidence.","a":["cquitted","acquitted"],"show":"acquitted"},{"t":"tx","s":"The politician was b___ by a friend who knew some of his guilty secrets.","a":["lackmailed","blackmailed"],"show":"blackmailed"}]},{"ins":"Complete the sentences with the correct word from the box.","items":[{"t":"mc","s":"That news report isn't at all objective – it's very ___.","o":["freelance","sensationalist","reviews","vows","commentator","biased","newsreader","gossip","reporter","censored"],"a":5},{"t":"mc","s":"Critics have given the new show very favourable ___.","o":["freelance","sensationalist","reviews","vows","commentator","biased","newsreader","gossip","reporter","censored"],"a":2},{"t":"mc","s":"The internet isn't ___ so you can read stories there that aren't in the newspapers.","o":["freelance","sensationalist","reviews","vows","commentator","biased","newsreader","gossip","reporter","censored"],"a":9},{"t":"mc","s":"Bill doesn't work for one single newspaper, he's a ___ journalist.","o":["freelance","sensationalist","reviews","vows","commentator","biased","newsreader","gossip","reporter","censored"],"a":0},{"t":"mc","s":"Ellen was a war ___ until she had children. She writes about local politics now.","o":["freelance","sensationalist","reviews","vows","commentator","biased","newsreader","gossip","reporter","censored"],"a":8},{"t":"mc","s":"The ___ on the tennis final screamed with joy when Andy Murray won.","o":["freelance","sensationalist","reviews","vows","commentator","biased","newsreader","gossip","reporter","censored"],"a":4},{"t":"mc","s":"I read that magazine for all the celebrity ___ – it's fun but I know it's not all true.","o":["freelance","sensationalist","reviews","vows","commentator","biased","newsreader","gossip","reporter","censored"],"a":7},{"t":"mc","s":"They use such strong language in their news stories – it's too ___ for me.","o":["freelance","sensationalist","reviews","vows","commentator","biased","newsreader","gossip","reporter","censored"],"a":1},{"t":"mc","s":"I loved it when that very serious ___ couldn't stop laughing as he read one story.","o":["freelance","sensationalist","reviews","vows","commentator","biased","newsreader","gossip","reporter","censored"],"a":6},{"t":"mc","s":"Government ___ to reduce taxes before next election.","o":["freelance","sensationalist","reviews","vows","commentator","biased","newsreader","gossip","reporter","censored"],"a":3}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Match the words with the same sound. (Example: fraud → manslaughter)","items":[{"t":"mc","s":"b*ur*glar","o":["acc*u*se","c*au*ght","dr*u*gs","m*ur*derer","j*ur*y"],"a":3,"pr":1},{"t":"mc","s":"j*u*dge","o":["acc*u*se","c*au*ght","dr*u*gs","m*ur*derer","j*ur*y"],"a":2,"pr":1},{"t":"mc","s":"c*our*t","o":["acc*u*se","c*au*ght","dr*u*gs","m*ur*derer","j*ur*y"],"a":1,"pr":1},{"t":"mc","s":"comm*u*nity","o":["acc*u*se","c*au*ght","dr*u*gs","m*ur*derer","j*ur*y"],"a":0,"pr":1},{"t":"mc","s":"t*our*ists","o":["acc*u*se","c*au*ght","dr*u*gs","m*ur*derer","j*ur*y"],"a":4,"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["co","mmen","ta","tor"],"a":0},{"t":"syl","s":"","o":["pre","sen","ter"],"a":1},{"t":"syl","s":"","o":["pa","pa","ra","zzi"],"a":2},{"t":"syl","s":"","o":["man","slaugh","ter"],"a":0},{"t":"syl","s":"","o":["kid","napp","ing"],"a":0}]}]},{"k":"r","name":"Reading","title":"A Writer's Life","text":["My biggest dream has always been to become an author. As an enthusiastic reader since I was a toddler, books have been a steady influence, a friend, and an escape.","[1] To me, reading is second only to breathing. From cereal boxes to fiction, I devour anything and everything I can get hold of. I read from morning, while eating breakfast, to night, before going to sleep. Some of my favourite genres include contemporary women’s novels and thrillers.","I guess this love of books is what drove me to become a writer. The fact that I am always talking, thinking, and plotting helped me with my ambition. I have a need to create and to put into words feelings, thoughts, and desires. To me, books should present a welcome break from the stresses of every day, a way to relax and unwind. There are horrors all around us. [2] Novels can carry people away to another place, and allow them to forget, for a short time at least, all the awful things in life. Any type of reading inspires the brain, and gives a change of pace.","Children require fantasy and play, and adults also need a break from reality.","Exciting as it is to be able to inspire others, an author’s career is lonely and often dull. Writing requires self-control and determination, and writers, as well as having knowledge of the difficulty of getting published, need to be able to deal with criticism. For every potential writer that there is out there, many give up or fail. I kept trying with the burning desire to do well. [3] I needed to try to see if I could do it.","My first writing experience was as a reporter for a small newspaper, almost twenty years ago. I submitted two articles for each of the three months the paper was published. The first month, I was given a bridal show to cover and I had to write an article on how to prepare an elegant, yet inexpensive, wedding. Two local newspapers gave me assignments for various topics, and I realized this is an excellent way to learn the basics as a writer.","[4]","My goal was to write fiction. Whether creating short stories or ‘the great American novel’, I enjoy fantasy and making up fictitious people and tales about their lives. Although I prefer genres suited to adults, I decided to try writing a children’s book. I first started working on this in 1995, and after reading the extremely rough draft, I recognized the text was a mix of information just thrown together and which was too much for children to understand. I broke up the ideas, planning to turn them into four books.","Unfortunately, life took over and I had to put the book on hold for a while. After my husband and I moved, I returned to reporting, receiving several assignments for a local magazine and two national and international food-trade magazines.","[5] The desire to complete and submit the book for publication was as strong as ever. Fortunately, I became a member of a wonderful group that offered support, as well as excellent suggestions. My book, a children’s book intended for ages 8 – 12, was accepted by a publisher and released three years ago. The sequel is almost completed for submission, and to this, I hope to add two or three more to the series, though all of the books work equally well on their own.","Between writing, reading, reviewing, and being with family I enjoy a busy and happy life. I may never become well-known, but my dream has been satisfied. I encourage anyone who wants to write to ‘just do it.’"],"sents":["I could not go through life wondering if I would be successful or not.","Nevertheless, I kept returning to the children’s novel I had in my head.","After all, we just have to pick up a newspaper or turn on the news to realize how much crime there is in society.","Meanwhile, four unfinished adult contemporary novels are calling to me, and I plan to get to them one day.","Although I found reporting enjoyable, I recognized this was not the type of writing I wanted to do.","I cannot imagine living without the written word."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":2,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write an essay on the following topic: 'Nowadays there is too much news about celebrities'. Write 140–180 words.","bullets":["explain if there is a lot of news about celebrities in your country","give your opinion on this","say why you think this situation exists"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about catching up with friends. Choose from the list (A–F) what each speaker says about keeping in touch. There is one extra letter you do not need to use.","list":["Writing emails takes up far too much time.","Using social networking sites keeps everyone up-to-date.","Texting is really practical at times.","Nothing is better than chatting face-to-face.","Spending a weekend away together is better than meeting for a coffee.","Texting is not as good as chatting on the phone."],"script":[["Speaker 1","Messages and calls are fine, but honestly, nothing beats sitting down with a friend and talking face-to-face. You can see how they really are, and you laugh so much more."],["Speaker 2","I've got friends all over the world, and social networking sites are brilliant for keeping up with everyone's news. I can see who's got a new job, who's had a baby – it keeps everyone up-to-date."],["Speaker 3","I know everyone texts these days, but I'd much rather pick up the phone. A text can't tell you if someone's upset. Hearing someone's voice is much better."],["Speaker 4","My best friend and I used to meet for a quick coffee every few weeks, but we never had time to really talk. Now we go away together for a weekend twice a year, and it's so much better."],["Speaker 5","Texting is really practical sometimes. If I'm running late or I need to tell someone where to meet, a quick text is perfect. I wouldn't use it for a proper conversation, though."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":1,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":2,"gap":1}]},{"ins":"Listen to an internet security expert talking about ways to protect yourself while using the internet. Choose the correct answer.","script":[["Alison","These days, many people use social networking sites instead of the phone and email to keep in touch. The danger comes from the sheer number of users these sites attract – hundreds of millions of people, and you can't know who all of them are."],["Alison","Be very careful about what you post about your friends. If you mention a friend's travel arrangements – that they're going to be away for two weeks, for example – you could be telling burglars that their house is empty."],["Alison","Never open attachments in messages from people you don't know. And if someone sends you photos that could embarrass you or other people, delete them straight away."],["Alison","Think about your online profile. It's a good idea to limit how much people can see. And think twice before you let the people you work with join your network."],["Alison","Every year, people get into trouble at work because of an inappropriate comment or photo. I know someone who lost her job because her boss saw a photo she'd posted from a party on a day she'd said she was ill."]],"items":[{"t":"mc","s":"According to Alison, people nowadays tend to use social networking sites ___.","o":["as well as the phone and email","more than the phone and email","instead of the phone and email"],"a":2},{"t":"mc","s":"Friends who accidentally reveal information about others' ___ are actually putting them at risk.","o":["travel plans","future social events","new purchases"],"a":0},{"t":"mc","s":"Alison advises against ___ certain attachments in messages.","o":["opening","saving","deleting"],"a":0},{"t":"mc","s":"In terms of your online profile, it's a good idea to ___.","o":["give your family access to it","limit how much people can see","allow all your friends to see it"],"a":1},{"t":"mc","s":"Alison suggests that people may get in trouble ___ because of an inappropriate comment.","o":["at home","with friends","at work"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["Why / people / use / social networking sites?","Is / important / limit / time / children / spend online? Why / Why not?","Do / you / prefer / shopping online / or / visit / shops? Why?","What / level / crime / your country?","Should / criminals / commit / serious crimes / sent / prison? Why / Why not?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about crime in your country. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'Criminals in my country should receive more severe punishments.'"]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});

how":"blackmailed"},{"t":"tx","s":"The minister's wife has been taken by k___ demanding £100,000 for her release.","a":["idnappers","kidnappers"],"show":"kidnappers"},{"t":"tx","s":"Both of the accused were a___ because the witness was considered unreliable.","a":["cquitted","acquitted"],"show":"acquitted"},{"t":"tx","s":"The jury's v___ was that Mrs Brown was not guilty.","a":["erdict","verdict"],"show":"verdict"},{"t":"tx","s":"The teenager was arrested for s___, after following the girl for months.","a":["talking","stalking"],"show":"stalking"},{"t":"tx","s":"There were many w___ to the crime who all described seeing a tall dark-haired man.","a":["itnesses","witnesses"],"show":"witnesses"}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["pa","pa","ra","zzi"],"a":2},{"t":"syl","s":"","o":["man","slaugh","ter"],"a":0},{"t":"syl","s":"","o":["kid","napp","ing"],"a":0},{"t":"syl","s":"","o":["co","mmen","ta","tor"],"a":0},{"t":"syl","s":"","o":["pre","sen","ter"],"a":1}]},{"ins":"Match the words with the same sound. (Example: fraud → manslaughter)","items":[{"t":"mc","s":"comm*u*nity","o":["acc*u*se","c*au*ght","dr*u*gs","m*ur*derer","j*ur*y"],"a":0,"pr":1},{"t":"mc","s":"t*our*ists","o":["acc*u*se","c*au*ght","dr*u*gs","m*ur*derer","j*ur*y"],"a":4,"pr":1},{"t":"mc","s":"b*ur*glar","o":["acc*u*se","c*au*ght","dr*u*gs","m*ur*derer","j*ur*y"],"a":3,"pr":1},{"t":"mc","s":"j*u*dge","o":["acc*u*se","c*au*ght","dr*u*gs","m*ur*derer","j*ur*y"],"a":2,"pr":1},{"t":"mc","s":"c*our*t","o":["acc*u*se","c*au*ght","dr*u*gs","m*ur*derer","j*ur*y"],"a":1,"pr":1}]}]},{"k":"r","name":"Reading","title":"How to be an author","text":["My biggest dream has always been to become an author.","An enthusiastic reader since I was a toddler, books have been a steady influence, a friend, and an escape. I cannot imagine living without the written word. To me, reading is second only to breathing. From cereal boxes to fiction, I devour anything and everything I can get hold of.","[1] Some of my favourite genres include contemporary women’s novels and thrillers.","I guess this love of books is what drove me to become a writer. The fact that I am always talking, thinking, and plotting helped me with my ambition. I have a need to create and to put into words feelings, thoughts, and desires. To me, books should present a welcome break from the stresses of every day, a way to relax and unwind. There are horrors all around us. After all, we just have to pick up a newspaper or turn on the news to realize how much crime there is in society. [2] Any type of reading inspires the brain and gives a change of pace. Children require fantasy and play, and adults also need a break from reality. Exciting as it is to be able to inspire others, an author’s career is lonely and often dull. Writing requires self-control and determination, and writers, as well as having knowledge of the difficulty of getting published, need to be able to deal with criticism. For every potential writer that there is out there, many give up or fail. I kept trying with the burning desire to do well. I could not go through life wondering if I would be successful or not. [3] My first writing experience was as a reporter for a small newspaper, almost twenty years ago. I submitted two articles for each of the three months the paper was published. The first month, I was given a bridal show to cover and I had to write an article on how to prepare an elegant, yet inexpensive, wedding. Two local newspapers gave me assignments for various topics, and I realized this is an excellent way to learn the basics as a writer. Although I found reporting enjoyable, I recognized this was not the type of writing I wanted to do.","My goal was to write fiction. Whether creating short stories or ‘the great American novel’, I enjoy fantasy and making up fictitious people and tales about their lives. [4] I first started working on this in 1995, and after reading the extremely rough draft, I recognized the text was a mix of information just thrown together and which was too much for children to understand. I broke up the ideas, planning to turn them into four books.","Unfortunately, life took over and I had to put the book on hold for a while. After my husband and I moved, I returned to reporting, receiving several assignments for a local magazine and two national and international food-trade magazines.","Nevertheless, I kept returning to the children’s novel I had in my head. The desire to complete and submit the book for publication was as strong as ever. Fortunately, I became a member of a wonderful group that offered support, as well as excellent suggestions. My first book, a children’s book intended for ages 8 – 12, was accepted by a publisher and released three years ago. The sequel is almost completed for submission, and to this, I hope to add two or three more to the series, though all of the books work equally well on their own.","Between writing, reading, reviewing, and being with family, I enjoy a busy and happy life. [5] Therefore, I encourage anyone who wants to write to ‘just do it.’"],"sents":["I may never become well-known, but my dream has been satisfied.","Although I prefer genres suited to adults, I decided to try writing a children’s book.","Meanwhile, four unfinished adult contemporary novels are calling to me, and I plan to get to them one day.","I read from morning, while eating breakfast, to night, before going to sleep.","I needed to try to see if I could do it.","Novels can carry people away to another place, and allow them to forget, for a short time at least, all the awful things in life."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":3,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write an essay on the following topic: 'Nowadays there is too much news about celebrities'. Write 140–180 words.","bullets":["explain if there is a lot of news about celebrities in your country","give your opinion on this","say why you think this situation exists"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about keeping in touch with their friends. Choose from the list (A–F) what each speaker says. There is one extra letter you do not need to use.","list":["Social media allows all of us to catch up on the others' news.","Writing emails takes up far too much time.","Talking in person is the best way to communicate.","Having a coffee together is not as good as going away together occasionally.","Speaking on the phone is better than texting.","Sometimes sending a text message is convenient."],"script":[["Speaker 1","Messages and calls are fine, but honestly, nothing beats sitting down with a friend and talking face-to-face. You can see how they really are, and you laugh so much more."],["Speaker 2","I've got friends all over the world, and social networking sites are brilliant for keeping up with everyone's news. I can see who's got a new job, who's had a baby – it keeps everyone up-to-date."],["Speaker 3","I know everyone texts these days, but I'd much rather pick up the phone. A text can't tell you if someone's upset. Hearing someone's voice is much better."],["Speaker 4","My best friend and I used to meet for a quick coffee every few weeks, but we never had time to really talk. Now we go away together for a weekend twice a year, and it's so much better."],["Speaker 5","Texting is really practical sometimes. If I'm running late or I need to tell someone where to meet, a quick text is perfect. I wouldn't use it for a proper conversation, though."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":5,"gap":1}]},{"ins":"Listen to an internet security expert talking about ways to protect yourself while using the internet. Choose the correct answer.","script":[["Alison","These days, many people use social networking sites instead of the phone and email to keep in touch. The danger comes from the sheer number of users these sites attract – hundreds of millions of people, and you can't know who all of them are."],["Alison","Be very careful about what you post about your friends. If you mention a friend's travel arrangements – that they're going to be away for two weeks, for example – you could be telling burglars that their house is empty."],["Alison","Never open attachments in messages from people you don't know. And if someone sends you photos that could embarrass you or other people, delete them straight away."],["Alison","Think about your online profile. It's a good idea to limit how much people can see. And think twice before you let the people you work with join your network."],["Alison","Every year, people get into trouble at work because of an inappropriate comment or photo. I know someone who lost her job because her boss saw a photo she'd posted from a party on a day she'd said she was ill."]],"items":[{"t":"mc","s":"Alison says that spending time on social networking sites is dangerous due to ___.","o":["the number of strangers using them","the actual number of users they attract","the number of sites there are"],"a":1},{"t":"mc","s":"If you mention a friend's ___, you could be putting them in a dangerous situation.","o":["new purchase","travel arrangements","future social plans"],"a":1},{"t":"mc","s":"Alison recommends that people should ___ certain photographs they are sent.","o":["save","delete","open"],"a":1},{"t":"mc","s":"It may be unwise to let ___ join your network.","o":["friends of friends","people you work with","relatives"],"a":1},{"t":"mc","s":"Alison gives the example of an inappropriate photo leading to ___.","o":["a disagreement with a friend","embarrassment for a family","the loss of a job"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["Why / people / use / social networking sites?","Is / important / limit / time / children / spend online? Why / Why not?","Do / you / prefer / shopping online / or / visit / shops? Why?","What / level / crime / your country?","Should / criminals / commit / serious crimes / sent / prison? Why / Why not?"]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'Criminals in my country should receive more severe punishments.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about crime in your country. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
TESTS.push({"id":"f9a","kind":"file","title":"File 9 Test A","focus":"Clauses of contrast and purpose, whatever / whenever…, uncountable and plural nouns; advertising, business, word building (prefixes and suffixes).","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"Book early in order ___ get tickets at the lowest prices.","o":["to","for"],"a":0},{"t":"mc","s":"___ the cost, I'm really glad we flew first class.","o":["In spite of","Although"],"a":0},{"t":"mc","s":"I phoned the hotel ___ they would know we'd be arriving late.","o":["so as","so that"],"a":1},{"t":"mc","s":"We enjoy playing tennis, ___ we're not very good at it.","o":["even though","despite"],"a":0},{"t":"mc","s":"You should take the exam, ___ you'll need to study hard for it.","o":["though","in spite of"],"a":0},{"t":"mc","s":"I ignored her mistake ___ embarrass her.","o":["so as not to","to not"],"a":0}]},{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"Politics ___ a stressful occupation.","o":["is","are"],"a":0},{"t":"mc","s":"The Shard is a famous London building made mostly of ___.","o":["the glass","glass"],"a":1},{"t":"mc","s":"Bring two ___ in case you need to change.","o":["trousers","pairs of trousers"],"a":1},{"t":"mc","s":"Would you like ___ toast with that coffee?","o":["a piece of","a"],"a":0},{"t":"mc","s":"Do you have any ___ about travelling in Mexico?","o":["advices","advice"],"a":1},{"t":"mc","s":"I live ___ of Los Angeles.","o":["on the outskirts","on an outskirt"],"a":0},{"t":"mc","s":"Do you have ___ shorts I could borrow if it's hot tomorrow?","o":["a pair of","a"],"a":0},{"t":"mc","s":"All the staff in the travel agency ___ very helpful.","o":["was","were"],"a":1}]},{"ins":"Complete the sentences with the correct word from the box.","items":[{"t":"mc","s":"Order ___ you want to eat – I'm paying!","o":["whatever","whichever","whenever","however","wherever","whoever"],"a":0},{"t":"mc","s":"___ we travel, by train, bus, or car, it's not going to be cheap.","o":["whatever","whichever","whenever","however","wherever","whoever"],"a":3},{"t":"mc","s":"___ I ask, they all say the same thing – we're going in the wrong direction.","o":["whatever","whichever","whenever","however","wherever","whoever"],"a":5},{"t":"mc","s":"I'm a freelance journalist so I can work for ___ newspaper I want to.","o":["whatever","whichever","whenever","however","wherever","whoever"],"a":1},{"t":"mc","s":"You'll find friendly people ___ you go in the world.","o":["whatever","whichever","whenever","however","wherever","whoever"],"a":4},{"t":"mc","s":"I don't have children in school now so I can go on holiday ___ I want to.","o":["whatever","whichever","whenever","however","wherever","whoever"],"a":2}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"It's a huge chain with over a thousand b___ across the country.","a":["ranches","branches"],"show":"branches"},{"t":"tx","s":"We've kept the business small but it's time now to e___ into bigger markets.","a":["xpand","expand"],"show":"expand"},{"t":"tx","s":"The annual board meeting is held in the h___ office in London.","a":["ead","head","head office"],"show":"head office"},{"t":"tx","s":"I had to close the shop because it wasn't making a p___.","a":["rofit","profit"],"show":"profit"},{"t":"tx","s":"What's the name of that actor? He's in that TV c___ for coffee.","a":["ommercial","commercial"],"show":"commercial"},{"t":"tx","s":"We do b___ with companies all over the world.","a":["usiness","business"],"show":"business"},{"t":"tx","s":"If we don't act soon we'll be taken o___ by a multinational company.","a":["ver","over","taken over"],"show":"taken over"},{"t":"tx","s":"If a sportsperson e___ a product, it can go wrong if they start to perform badly.","a":["ndorses","endorses"],"show":"endorses"},{"t":"tx","s":"Don't believe those adverts, they're totally m___.","a":["isleading","misleading"],"show":"misleading"},{"t":"tx","s":"We should m___ the two companies. It will cost less to run one big company.","a":["erge","merge"],"show":"merge"}]},{"ins":"Write the words in brackets with the correct prefix or suffix.","items":[{"t":"tx","s":"a main character in a book or film who isn't heroic (hero) = ___","a":["anti-hero","antihero"]},{"t":"tx","s":"the area around where you live (neighbour) = ___","a":["neighbourhood","neighborhood"]},{"t":"tx","s":"not getting a high enough salary (paid) = ___","a":["underpaid"]},{"t":"tx","s":"somebody that doesn't smoke anymore (smoker) = ___","a":["ex-smoker","exsmoker"]},{"t":"tx","s":"to sleep longer than you intended to (sleep) = ___","a":["oversleep"]},{"t":"tx","s":"something that's paid for before you use it (paid) = ___","a":["prepaid","pre-paid"]},{"t":"tx","s":"to say a word wrongly (pronounce) = ___","a":["mispronounce"]},{"t":"tx","s":"food that is still a bit raw (cook) = ___","a":["undercooked"]},{"t":"tx","s":"the economic system run for private profit (capital) = ___","a":["capitalism"]},{"t":"tx","s":"the result of making something better (improve) = ___","a":["improvement"]}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Match the words with the same sound. (Example: promote → slogan)","items":[{"t":"mc","s":"dec*i*sion","o":["di*g*ital","b*u*siness","c*o*mpany","f*a*lse","imp*or*t"],"a":1,"pr":1},{"t":"mc","s":"l*au*nch","o":["di*g*ital","b*u*siness","c*o*mpany","f*a*lse","imp*or*t"],"a":4,"pr":1},{"t":"mc","s":"pr*o*fit","o":["di*g*ital","b*u*siness","c*o*mpany","f*a*lse","imp*or*t"],"a":3,"pr":1},{"t":"mc","s":"m*u*ltinational","o":["di*g*ital","b*u*siness","c*o*mpany","f*a*lse","imp*or*t"],"a":2,"pr":1},{"t":"mc","s":"mer*g*e","o":["di*g*ital","b*u*siness","c*o*mpany","f*a*lse","imp*or*t"],"a":0,"pr":1}]},{"ins":"Choose the stressed syllable in the words in bold.","items":[{"t":"syl","s":"This area has some wonderful local produce – you must try the cheese.","o":["pro","duce"],"a":0},{"t":"syl","s":"The airline company agreed to refund my booking fee.","o":["re","fund"],"a":1},{"t":"syl","s":"There has been a huge increase in the number of takeovers this year.","o":["in","crease"],"a":0},{"t":"syl","s":"We're importing too much of our energy at the moment.","o":["im","por","ting"],"a":1},{"t":"syl","s":"This is a very multicultural area of the city.","o":["mul","ti","cul","tu","ral"],"a":2}]}]},{"k":"r","name":"Reading","title":"A Brief History of Television Advertising","text":["Every day the average person sees 20 minutes of adverts on television or on their computer. But how did this come about? Commercial broadcasting was originally developed as a means for companies to sell radios, where radio-manufacturing companies also owned the radio stations. But once they realized that many households were listening to their radios a significant amount of time every day, other organizations started to explore this medium as a way to get their message across to the public. If one has to choose a single event that began the era of radio broadcasting, it would probably be the radio programme broadcast by station WEAF in New York City on 28 August 1922. [1] By Christmas of that year, several other major New York department stores were also running advertisements for their stores.","By the late 20s, radio advertising had advanced in a dramatic way. It was now dominated by advertising agencies who took control of the schedules by buying the available air time – those valuable minutes and hours during which they could reach the public – and selling it to their customers. They also handled the creative aspects of the commercials and programmes. [2] These efforts paved the way for the birth of television advertising that took place in later decades.","Television advertising didn’t really take hold until the late 1940s. Television was totally new – offering both sound and moving pictures – and the advertising industry moved into this area cautiously because they were not sure what methods would work best to promote their clients’ products on television. [3] Or perhaps it was a case of taking an entirely new approach to reach the television audiences in a meaningful and effective manner.","After many surveys, the advertising agencies determined that the most effective way to reach consumers with a strong message would be by creating shows that featured a single product or a line of products from a single company. From this idea came the typical television shows of the 1950s, including such titles as Kraft Television Theater and Colgate Comedy Hour. As with radio, these television programmes were produced by advertising agencies for their clients, rather than the studios as is normal practice today.","This practice worked really well for the clients for a while. But as television gained more popularity and there were more people watching it, the television networks were raising the costs of doing business. This pressure, connected with the cost of delivering a production through television, forced a massive change in the relationship of all the parties involved. [4]","NBC executive Sylvester L. ‘Pat’ Weaver came up with a solution that would work and would also be very favourable to the networks. He introduced the ‘magazine concept’ of television advertising. In this arrangement, the sponsors would purchase blocks of time (typically one to two minutes) in a show rather than be a sponsor for an entire show. This idea would allow a variety of sponsors – up to four was the number imagined – for a show. Like a magazine, the networks would now control the content as no one advertiser would ‘own’ a particular show.","By 1960, the magazine concept dominated television advertising, as it has ever since. Instead of relying on audience identification with a specific show, sponsors now spread their messages across the schedule in an effort to reach as many consumers as possible. Being able to reach a broader segment of the population proved to be very effective for the sponsors.","More than 30 years later, online advertising came onto the scene. [5] Another is the efficiency of the advertiser’s investment. Online advertising allows for the customization of advertisements, including content and posted websites.","Many people find advertisements annoying, complaining that they interrupt their enjoyment of a television programme, for example. But perhaps we should appreciate the long way they have come since the 1920s."],"sents":["One major benefit of this type of advertising is the immediate publishing of information and content that is not limited by geography or time.","A solution had to be found if this very powerful advertising medium was to continue to be financially possible for the sponsors.","This idea was originally resisted, but after a bit of experimentation, they found that this method would work well for packaged-goods.","This was a ten-minute advertisement for suburban apartment housing.","Should it still be treated as radio advertising but with pictures thrown in?","In fact, they even created entire series that were designed to sell one product or another."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":3,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write a report on the following topic: 'The role of television in modern life'. Write 140–180 words.","bullets":["say what you think the role of television in modern life is","discuss how you think the role of television has changed in recent years","explain what you think the advantages of television are"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about their favourite adverts. Choose from the list (A–F) what each person says about the advert. There is one extra letter you do not need to use.","list":["Some people know this feeling.","It's a situation all girls have been in to a lesser extent.","It may encourage people to get involved in something.","The advert is actually a warning.","It's effective because it just focuses on what the product does.","It's memorable because it's so silly."],"script":[["Speaker 1","My favourite advert is the one with the dancing cat in a shower cap singing about shampoo. It's completely ridiculous – it makes no sense at all – but that's why I'll never forget it."],["Speaker 2","I like the washing powder advert where they just show a really dirty football shirt going into the machine and coming out perfectly clean. No celebrities, no story – just what the product does."],["Speaker 3","There's a road safety advert showing a driver reading a text, and then… well, you can guess. It's not really selling anything. It's a warning – the message is: don't use your phone when you drive."],["Speaker 4","My favourite is an advert from the council showing neighbours painting an old playground together. At the end it says 'Your street needs you'. It might encourage people to get involved in their local area."],["Speaker 5","There's a coffee advert where a man is late for work, can't find his keys, spills everything… and then he has his first coffee and everything's fine. Lots of people know that feeling – I certainly do!"]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":0,"gap":1}]},{"ins":"Listen to a marketing expert talking about advertising. Choose the correct answer.","script":[["Ryan","Why do companies spend so much on advertising? Quite simply, because it helps them make more money. People can't buy a product they've never heard of."],["Ryan","People often ask me if selling a bank account is different from selling a car, or a music festival, or a television. The answer is no – the basic principles of advertising are exactly the same, whatever you're selling."],["Ryan","Is advertising an art? In a way, yes, because it requires imaginative thinking and original ideas. But it's also a profession, because there are specific rules that you have to stick to."],["Ryan","And what makes an advert successful? It has to be simple. Funny adverts and unusual ones can work, but the ones that really sell are straightforward – one clear message."],["Ryan","Finally, we talk a lot about 'targeting'. That simply means communicating with a certain type of person – getting your message across to the specific customers who are most likely to buy."]],"items":[{"t":"mc","s":"Advertising a product is important for a company because it ___.","o":["helps tell them what the public think","helps them to make more money","helps increase interest in the company's other products"],"a":1},{"t":"mc","s":"According to Ryan, advertising a banking service is ___ advertising a car.","o":["completely different from","a little similar to","exactly the same as"],"a":2},{"t":"mc","s":"Ryan says that advertising may be described as art because ___.","o":["it is mainly done by artists","it is seen by the public","it requires imaginative thinking and ideas"],"a":2},{"t":"mc","s":"The most successful adverts are ___.","o":["simple","original","humorous"],"a":0},{"t":"mc","s":"'Targeting' in advertising means ___.","o":["communicating with a certain type of person","reaching a certain level of creativity","achieving a certain number of sales"],"a":0}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["If / choose / any job / what / ideal job / be? Why?","Is / being happy / job / more important / earning / lots of money? Why / Why not?","Should / women / go out / work / stay at home / look after / family? Why?","Do / think / too many / multinational / companies / your country? Why / Why not?","What / the best advert on TV at the moment? Why?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about work. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'People should work to live not live to work. They should work to earn enough money to survive and not spend too much time on their careers.'"]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});

},{"t":"mc","s":"___ I go to when I need help, they're always busy.","o":["whatever","whichever","whenever","however","wherever","whoever"],"a":5}]},{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"I wanted to study medicine, ___ I knew it would be difficult.","o":["even though","despite"],"a":0},{"t":"mc","s":"You'd love Greenland, ___ you might find the cold temperature difficult to manage.","o":["though","in spite of"],"a":0},{"t":"mc","s":"I didn't comment on her mistake ___ make her feel uncomfortable.","o":["so as not to","to not"],"a":0},{"t":"mc","s":"___ the delay, we didn't miss any of the concert.","o":["In spite of","Although"],"a":0},{"t":"mc","s":"I sent Ginny a text ___ she knew we were going to be late.","o":["so as","so that"],"a":1},{"t":"mc","s":"Come as early as possible in order ___ get a seat near the front.","o":["to","for"],"a":0}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Write the words in brackets with the correct prefix or suffix.","items":[{"t":"tx","s":"something that's paid for before you use it (paid) = ___","a":["prepaid","pre-paid"]},{"t":"tx","s":"a main character in a book or film who isn't heroic (hero) = ___","a":["anti-hero","antihero"]},{"t":"tx","s":"to say a word incorrectly (pronounce) = ___","a":["mispronounce"]},{"t":"tx","s":"not getting a high enough salary (paid) = ___","a":["underpaid"]},{"t":"tx","s":"the result of making something better (improve) = ___","a":["improvement"]},{"t":"tx","s":"food that is still a bit raw (cook) = ___","a":["undercooked"]},{"t":"tx","s":"the economic system run for private profit (capital) = ___","a":["capitalism"]},{"t":"tx","s":"to sleep longer than you intended to (sleep) = ___","a":["oversleep"]},{"t":"tx","s":"the area around where you live (neighbour) = ___","a":["neighbourhood","neighborhood"]},{"t":"tx","s":"somebody that doesn't smoke any more (smoker) = ___","a":["ex-smoker","exsmoker"]}]},{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"I recognize that actor. He's in a TV c___ for car insurance.","a":["ommercial","commercial"],"show":"commercial"},{"t":"tx","s":"I do b___ with many different companies, here and abroad.","a":["usiness","business"],"show":"business"},{"t":"tx","s":"Small companies always risk being taken o___ by much bigger ones.","a":["ver","over","taken over"],"show":"taken over"},{"t":"tx","s":"If he isn't travelling, the CEO will be at the h___ office in Berlin.","a":["ead","head","head office"],"show":"head office"},{"t":"tx","s":"If you m___ two companies, the one big company will need fewer staff.","a":["erge","merge"],"show":"merge"},{"t":"tx","s":"My favourite footballer e___ this shampoo, so I can't resist buying it.","a":["ndorses","endorses"],"show":"endorses"},{"t":"tx","s":"That advert doesn't show the truth – it's very m___.","a":["isleading","misleading"],"show":"misleading"},{"t":"tx","s":"This store is only one of many b___ owned by that chain.","a":["ranches","branches"],"show":"branches"},{"t":"tx","s":"We need to e___ and move into bigger markets if we want to make more money.","a":["xpand","expand"],"show":"expand"},{"t":"tx","s":"It's simple – if we can't make a p___, then we'll have to shut the shop.","a":["rofit","profit"],"show":"profit"}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Choose the stressed syllable in the words in bold.","items":[{"t":"syl","s":"We're importing too much of our energy at the moment.","o":["im","por","ting"],"a":1},{"t":"syl","s":"This is a very multicultural area of the city.","o":["mul","ti","cul","tu","ral"],"a":2},{"t":"syl","s":"This area has some wonderful local produce – you must try the cheese.","o":["pro","duce"],"a":0},{"t":"syl","s":"The airline company agreed to refund my booking fee.","o":["re","fund"],"a":1},{"t":"syl","s":"There has been a huge increase in the number of takeovers this year.","o":["in","crease"],"a":0}]},{"ins":"Match the words with the same sound. (Example: promote → slogan)","items":[{"t":"mc","s":"pr*o*fit","o":["di*g*ital","b*u*siness","c*o*mpany","f*a*lse","imp*or*t"],"a":3,"pr":1},{"t":"mc","s":"m*u*ltinational","o":["di*g*ital","b*u*siness","c*o*mpany","f*a*lse","imp*or*t"],"a":2,"pr":1},{"t":"mc","s":"mer*g*e","o":["di*g*ital","b*u*siness","c*o*mpany","f*a*lse","imp*or*t"],"a":0,"pr":1},{"t":"mc","s":"dec*i*sion","o":["di*g*ital","b*u*siness","c*o*mpany","f*a*lse","imp*or*t"],"a":1,"pr":1},{"t":"mc","s":"l*au*nch","o":["di*g*ital","b*u*siness","c*o*mpany","f*a*lse","imp*or*t"],"a":4,"pr":1}]}]},{"k":"r","name":"Reading","title":"How Television Advertising Started","text":["Every day the average person sees 20 minutes of adverts on television or on their computer. But how did this come about? Broadcasting was originally developed as a means for companies to sell radios. But once they realized that many households were listening to their radios a significant amount of time every day, organizations started to explore this medium as a way to get their message across to the public. If one has to choose a single event that began the era of radio broadcasting, it would probably be the radio program broadcast by station WEAF in New York City on 28 August 1922. This was a ten-minute advertisement for suburban apartment housing. By Christmas of that year, several other major New York department stores were also running advertisements for their stores.","By the late 20s radio advertising had advanced in a dramatic way. It was now dominated by advertising agencies who took control of the schedules by buying the available air time – those valuable minutes and hours during which they could reach the public – and selling it to their customers. [1] In fact, they even created entire series that were designed to sell one product or another. These efforts paved the way for the birth of television advertising that took place in later decades.","Television advertising didn’t really take hold until the late 1940s. Television was totally new – offering both sound and moving pictures – and the advertising industry moved into this area cautiously because they were not sure what methods would work best to promote their clients’ products on television. Should it still be treated as radio advertising but with pictures thrown in? Or perhaps it was a case of taking an entirely new approach to reach the television audiences in a meaningful and effective manner. After many surveys, the advertising agencies determined that the most effective way to reach consumers with a strong message would be by creating shows that featured a single product or a line of products from a single company. From this idea came the typical television shows of the 1950s, including such titles as Kraft Television Theater and Colgate Comedy Hour. [2]","This practice worked really well for the clients for a while. [3] This pressure, connected with the cost of delivering a production through television, forced a massive change in the relationship of all the parties involved. A solution had to be found if this very powerful advertising medium was to continue to be financially possible for the sponsors.","NBC executive Sylvester L. ‘Pat’ Weaver came up with a solution that would work and would also be very favorable to the networks. He introduced the ‘magazine concept’ of television advertising. In this arrangement, the sponsors would purchase blocks of time (typically one to two minutes) in a show rather than be a sponsor for an entire show. [4] Like a magazine, the networks would now control the content as no one advertiser would ‘own’ a particular show.","By 1960, the magazine concept dominated television advertising, as it has ever since. Instead of relying on audience identification with a specific show, sponsors now spread their messages across the schedule in an effort to reach as many consumers as possible. [5]","More than 30 years later, online advertising came onto the scene. One major benefit of this type of advertising is the immediate publishing of information and content that is not limited by geography or time. Another is the efficiency of the advertiser’s investment. Online advertising allows for the customization of advertisements, including content and posted websites.","Many people find advertisements annoying, complaining that they interrupt their enjoyment of a television programme, for example. But perhaps we should appreciate the long way they have come since the 1920s."],"sents":["Being able to reach a broader segment of the population proved to be very effective for the sponsors.","This idea would allow a variety of sponsors – up to four was the number imagined – for a show.","This idea was originally resisted, but after a bit of experimentation, they found that this method would work well for packaged-goods.","They also handled the creative aspects of the commercials and programs.","But as television gained more popularity and there were more people watching it, the television networks were raising the costs of doing business.","As with radio, these television programs were produced by advertising agencies for their clients, rather than the studios as is common practice currently."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":3,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write a report on the following topic: 'The role of television in modern life'. Write 140–180 words.","bullets":["say what you think the role of television in modern life is","discuss how you think the role of television has changed in recent years","explain what you think the advantages of television are"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about their favourite adverts. Choose from the list (A–F) what each person says about the advert. There is one extra letter you do not need to use.","list":["It's unforgettable because it's ridiculous.","It's like real life, but made funnier for television.","Some people can identify with this situation.","It could inspire people to help out in their local area.","It works because the emphasis is simply on the role of the product.","The main message in the advert is advice."],"script":[["Speaker 1","My favourite advert is the one with the dancing cat in a shower cap singing about shampoo. It's completely ridiculous – it makes no sense at all – but that's why I'll never forget it."],["Speaker 2","I like the washing powder advert where they just show a really dirty football shirt going into the machine and coming out perfectly clean. No celebrities, no story – just what the product does."],["Speaker 3","There's a road safety advert showing a driver reading a text, and then… well, you can guess. It's not really selling anything. It's a warning – the message is: don't use your phone when you drive."],["Speaker 4","My favourite is an advert from the council showing neighbours painting an old playground together. At the end it says 'Your street needs you'. It might encourage people to get involved in their local area."],["Speaker 5","There's a coffee advert where a man is late for work, can't find his keys, spills everything… and then he has his first coffee and everything's fine. Lots of people know that feeling – I certainly do!"]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":2,"gap":1}]},{"ins":"Listen to a marketing expert talking about advertising. Choose the correct answer.","script":[["Ryan","Why do companies spend so much on advertising? Quite simply, because it helps them make more money. People can't buy a product they've never heard of."],["Ryan","People often ask me if selling a bank account is different from selling a car, or a music festival, or a television. The answer is no – the basic principles of advertising are exactly the same, whatever you're selling."],["Ryan","Is advertising an art? In a way, yes, because it requires imaginative thinking and original ideas. But it's also a profession, because there are specific rules that you have to stick to."],["Ryan","And what makes an advert successful? It has to be simple. Funny adverts and unusual ones can work, but the ones that really sell are straightforward – one clear message."],["Ryan","Finally, we talk a lot about 'targeting'. That simply means communicating with a certain type of person – getting your message across to the specific customers who are most likely to buy."]],"items":[{"t":"mc","s":"According to Ryan, advertising can help a company ___.","o":["establish their place in the market","make more money","become well known"],"a":1},{"t":"mc","s":"Ryan says that advertising a music festival is ___ advertising a television.","o":["no different from","a little different from","completely different from"],"a":0},{"t":"mc","s":"Ryan describes advertising as a profession because it ___.","o":["can be done by any individual","sticks to specific rules","requires a course of study"],"a":1},{"t":"mc","s":"For an advert to be a success, it should be ___.","o":["funny","straightforward","unique"],"a":1},{"t":"mc","s":"In advertising, 'targeting' means ___.","o":["achieving a high level of creativity","getting a message across to specific customers","reaching a certain level of sales"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["What / like to do when / visit a new town or city?","What / the best restaurant to visit in the place where you live and why?","What / you think shouldn't be advertised? Why?","What / your perfect job be and why?","you / influenced by advertising? In what ways?"]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'Big cities are the best places for young people to live.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about work. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});

 I came across a g___ who was studying the rocks on the south coast.","a":["eologist","geologist"],"show":"geologist"},{"t":"tx","s":"'Eureka!' is a word that's still associated with major scientific d___.","a":["iscoveries","discoveries","iscovery","discovery"],"show":"discoveries"}]},{"ins":"Choose two words and put them together in the correct order with and or or to make phrases.","items":[{"t":"tx","s":"pieces / things / bits → ___","a":["bits and pieces"]},{"t":"tx","s":"sick / exhausted / tired → ___","a":["sick and tired"]},{"t":"tx","s":"lightning / thunder / rain → ___","a":["thunder and lightning"]},{"t":"tx","s":"law / rules / order → ___","a":["law and order"]},{"t":"tx","s":"all / less / nothing → ___","a":["all or nothing"]}]},{"ins":"Order the words to make sentences.","items":[{"t":"ord","s":"","wd":["answers","them","didn't","or","I","the","I","guessed","so","know","less","more"],"a":["I didn't know the answers so I more or less guessed them."]},{"t":"ord","s":"","wd":["later","to","you're","you'll","sooner","that","or","have","admit","wrong"],"a":["Sooner or later you'll have to admit that you're wrong.","You'll have to admit that you're wrong sooner or later."]},{"t":"ord","s":"","wd":["so","result","wait","see","have","uncertain","the","we'll","is","and","to"],"a":["The result is uncertain so we'll have to wait and see."]},{"t":"ord","s":"","wd":["of","were","missing","safe","fortunately","the","children","and","sound","both","discovered"],"a":["Fortunately both of the missing children were discovered safe and sound.","Both of the missing children were fortunately discovered safe and sound.","Both of the missing children were discovered safe and sound fortunately."]},{"t":"ord","s":"","wd":["a","successful","take","give","are","all","question","relationships","and","of"],"a":["All successful relationships are a question of give and take."]}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Match the words with the same sound. (Example: discover → drug)","items":[{"t":"mc","s":"p*ea*ce","o":["exp*o*sed","poi*s*oning","l*e*thal","s*al*t","geneti*c*ist"],"a":2,"pr":1},{"t":"mc","s":"do*s*e","o":["exp*o*sed","poi*s*oning","l*e*thal","s*al*t","geneti*c*ist"],"a":4,"pr":1},{"t":"mc","s":"phy*s*icist","o":["exp*o*sed","poi*s*oning","l*e*thal","s*al*t","geneti*c*ist"],"a":1,"pr":1},{"t":"mc","s":"d*o*nor","o":["exp*o*sed","poi*s*oning","l*e*thal","s*al*t","geneti*c*ist"],"a":0,"pr":1},{"t":"mc","s":"v*o*lunteer","o":["exp*o*sed","poi*s*oning","l*e*thal","s*al*t","geneti*c*ist"],"a":3,"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["ge","o","gra","phic"],"a":2},{"t":"syl","s":"","o":["phy","si","cist"],"a":0},{"t":"syl","s":"","o":["bi","o","lo","gy"],"a":1},{"t":"syl","s":"","o":["vo","lun","teer"],"a":2},{"t":"syl","s":"","o":["ad","di","tive"],"a":0}]}]},{"k":"r","name":"Reading","title":"Isambard Kingdom Brunel","text":["In surveys to find out who the most important Britons of all time are, Isambard Kingdom Brunel often comes out on top. This famous engineer was noted for the creation of the Great Western Railway and a series of famous steamships. The son of noted engineer Sir Marc Isambard Brunel, Isambard K. Brunel was born in Portsmouth, England on April 9, 1806. His father was working there on the block-making machinery of the Portsmouth Block Mills. The young Brunel was sent to France to be educated at the College of Caen in Normandy and the Lycée Henri-Quatre in Paris. He rose to prominence when, aged 20, he was appointed as the resident engineer of the Thames Tunnel, his father’s greatest achievement. The first of its kind ever built, Isambard spent nearly two years trying to drive the horizontal shaft from one end of it to the other. [1] In the meantime, Brunel moved on. In 1833, he was appointed engineer of the Great Western Railway, one of the wonders of Victorian Britain. Running from London to Bristol (and a few years later, to Exeter), the Great Western contained a series of impressive achievements, such as viaducts, stations, and tunnels, that ignited the imagination of the technically-minded Britons of the age. Brunel soon became one of the most famous men in Britain. [2] He used his prestige to convince his railway company employers to build the Great Western, at the time by far the largest steamship in the world. It first sailed in 1837. The Great Britain followed in 1843, and was the first of its kind to cross the Atlantic Ocean.","Building on these successes, Brunel turned to a third ship in 1852, even larger than both of its predecessors. The Great Eastern was cutting-edge technology for its time — it was the largest ship ever built until the RMS Lusitania launched in 1906 — and it soon ran over budget and schedule in the face of a series of difficult technical problems. The ship is widely perceived as a waste of money. [3]","Besides the railway and steamships, he was also involved in the construction of several lengthy bridges, including the Royal Albert Bridge near Plymouth, and an unusual telescopic bridge in Bridgwater. He also designed the Clifton Suspension Bridge in Bristol, but did not live to see it constructed. [4] Work started in 1862, and was complete by 1864, five years after Brunel’s death.","In 1843, while performing a conjuring trick for the amusement of his children, he accidentally swallowed a coin which became lodged in his throat. [5]","Eventually, at the suggestion of his father, Sir Marc, Isambard was strapped to a board, turned upside-down, and the coin was jerked free.","Brunel suffered a stroke in 1859, just before the Great Eastern made its first voyage to New York. He died ten days later and is buried, like his father, at Kensal Green Cemetery in London. His son, Henri Marc Brunel, also enjoyed some success as a civil engineer."],"sents":["His colleagues and admirers felt the bridge would be a fitting memorial, and started to raise new funds and to amend the design.","Though a failure at its original purpose for passenger travel, it eventually found a role as an engineering ship.","The initial group of engines ordered by Brunel to his own specifications proved unsatisfactory.","Two severe incidents of flooding injured the younger Brunel and ended work on the tunnel for several years, though it was eventually completed.","A special medical tool failed to remove it, as did a machine to shake it loose created by Brunel himself.","Even before the Great Western Railway was opened, Brunel was moving on to his next project to build ships which could sail across the Atlantic."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":3,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write an article about the following topic: 'An important invention'. Write 140–180 words.","bullets":["say what the invention is and how it works","explain why you think it is so important","describe the impact this invention has had on the world"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about an embarrassing situation they've found themselves in. Choose from the list (A–F) which situation each person mentions. There is one extra letter you do not need to use.","list":["It happened when they were in a hurry.","It happened while they were working on something.","It happened while they were complaining about something.","It happened while they were working out at the gym.","It happened when they were out for the evening.","It happened while they were relaxing."],"script":[["Speaker 1"," oon became one of the most famous men in Britain due to this.","Even before the Great Western Railway was opened, Brunel was moving on to his next project to build ships which could sail across the Atlantic. [3] It first sailed in 1837. The Great Britain followed in 1843, and was the first of its kind to cross the Atlantic Ocean.","Building on these successes, Brunel turned to a third ship in 1852, even larger than both of its predecessors. The Great Eastern was cutting-edge technology for its time — it was the largest ship ever built until the RMS Lusitania launched in 1906 — and it soon ran over budget and schedule in the face of a series of difficult technical problems. [4] Though a failure at its original purpose for passenger travel, it eventually found a role as an engineering ship.","Besides the railway and steamships, he was also involved in the construction of several lengthy bridges, including the Royal Albert Bridge near Plymouth, and an unusual telescopic bridge in Bridgwater. He also designed the Clifton Suspension Bridge in Bristol, but did not live to see it constructed. His colleagues and admirers felt the bridge would be a fitting memorial, and started to raise new funds and to amend the design. [5]","In 1843, while performing a conjuring trick for the amusement of his children, he accidentally swallowed a coin which became lodged in his throat. A special medical tool failed to remove it, as did a machine to shake it loose created by Brunel himself. Eventually, at the suggestion of his father, Sir Marc, Isambard was strapped to a board, turned upside-down, and the coin was jerked free.","Brunel suffered a stroke in 1859, just before the Great Eastern made its first voyage to New York. He died ten days later and is buried, like his father, at Kensal Green Cemetery in London. His son, Henri Marc Brunel, also enjoyed some success as a civil engineer."],"sents":["In the meantime, Brunel moved on.","Work started in 1862, and was complete by 1864, five years after Brunel’s death","The initial group of engines ordered by Brunel to his own specifications proved unsatisfactory.","The ship is widely perceived as a waste of money.","The first of its kind ever built, Isambard spent nearly two years trying to drive the horizontal shaft from one end of it to the other.","He used his prestige to convince his railway company employers to build the Great Western, at the time by far the largest steamship in the world."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":3,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write an article about the following topic: 'An important invention'. Write 140–180 words.","bullets":["say what the invention is and how it works","explain why you think it is so important","describe the impact this invention has had on the world"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about an embarrassing situation they've found themselves in. Choose from the list (A–F) which situation each person mentions. There is one extra letter you do not need to use.","list":["It happened while they were working out at the gym.","It happened while they were criticizing someone.","It happened while they were relaxing.","It happened while they were having fun with friends.","It happened while they were rushing to do something.","It happened while they were doing a job at home."],"script":[["Speaker 1","I was on the running machine at the gym, trying to look cool, when my headphones fell off. I bent down to pick them up me clear that he had a problem with his muscles. He was diagnosed with motor neurone disease and was told he had only two years to live."],["Speaker","In 1985, he caught pneumonia while visiting Geneva and was put on a life support machine. The doctors even suggested switching it off, but his wife refused, so he can thank her for his survival. Back in Cambridge, an operation saved his life but took away his ability to speak, and from then on he used an artificial voice."]],"items":[{"t":"mc","s":"Stephen attended the same ___ as one of his parents.","o":["primary school","high school","university"],"a":2},{"t":"mc","s":"Stephen's father wanted him to study ___ at university.","o":["medicine","physics","maths"],"a":0},{"t":"mc","s":"When Stephen first left Oxford, he went to Cambridge to ___.","o":["study some more","start work","plan what he would do next"],"a":0},{"t":"mc","s":"In the early 1960s, Stephen observed that he was becoming more and more ___.","o":["hungry","inactive","clumsy"],"a":2},{"t":"mc","s":"As a result of an operation in a Cambridge hospital, Stephen now has an artificial ___.","o":["limb","voice","lung"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["How / feel when / have to talk in public?","What / like to do when / visit a new town or city?","What / the best restaurant to visit in the place where you live and why?","What invention or discovery / like scientists to make in the next few years?","you / think students study enough science at school? Why? / Why not?"]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'Big cities are the best places for young people to live.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about science. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
