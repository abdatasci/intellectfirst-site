y ___ your top.","o":["suits","matches","fits"],"a":1},{"t":"mc","s":"You should wear a shirt and ___ for the awards ceremony – it's a formal event.","o":["collar","bow","tie"],"a":2}]},{"ins":"Choose the odd word out.","items":[{"t":"mc","s":"","o":["gradually","eventually","in the end","basically"],"a":3},{"t":"mc","s":"","o":["homesick","fed up","delighted","devastated"],"a":2},{"t":"mc","s":"","o":["operation","blister","x-ray","injection"],"a":1},{"t":"mc","s":"","o":["fit","match","suit","undress"],"a":3},{"t":"mc","s":"","o":["freezing","chilly","boiling","cool"],"a":2},{"t":"mc","s":"","o":["suede","velvet","lace","hooded"],"a":3},{"t":"mc","s":"","o":["relieved","offended","desperate","bewildered"],"a":0},{"t":"mc","s":"","o":["checked","loose","plain","striped"],"a":1},{"t":"mc","s":"","o":["ulcer","tumour","rash","pulse"],"a":3},{"t":"mc","s":"","o":["direct","turbulence","connecting","long-haul"],"a":1}]},{"ins":"Choose the correct word.","items":[{"t":"mc","s":"I don't need to check anything in, I've only got hand ___.","o":["baggage","luggage"],"a":[0,1]},{"t":"mc","s":"___ we'd like to find a cottage not too far from the sea.","o":["Apparently","Ideally"],"a":1},{"t":"mc","s":"This phone is ___ designed for older people.","o":["specially","especially"],"a":0},{"t":"mc","s":"We've been working very ___ recently. I hope things will get easier soon.","o":["hardly","hard"],"a":1},{"t":"mc","s":"That pizzeria's been open nearly a year and we ___ haven't tried it.","o":["still","yet"],"a":0},{"t":"mc","s":"I hate having to eat in a rush. I prefer to take my ___.","o":["time","easy"],"a":0},{"t":"mc","s":"Dan's going to take ___ Tai Chi. There's a course starting in April.","o":["part","up"],"a":1},{"t":"mc","s":"We usually go on a trip ___ the end of the school year.","o":["at","in"],"a":0},{"t":"mc","s":"It's just an informal evening so there's no need to ___.","o":["dress up","get dressed"],"a":0},{"t":"mc","s":"I'm going to take ___ of the dry weather and cut the grass.","o":["notice","advantage"],"a":1}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Match the words with the same sound. (Example: funny → blood)","items":[{"t":"mc","s":"sh*ow*er","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":5,"pr":1},{"t":"mc","s":"b*oar*ding","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":3,"pr":1},{"t":"mc","s":"l*oo*se","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":4,"pr":1},{"t":"mc","s":"aller*g*ic","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":8,"pr":1},{"t":"mc","s":"heada*ch*e","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":0,"pr":1},{"t":"mc","s":"pre*ss*ure","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":1,"pr":1},{"t":"mc","s":"cou*gh*","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":7,"pr":1},{"t":"mc","s":"str*i*ped","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":9,"pr":1},{"t":"mc","s":"h*ear*t","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":2,"pr":1},{"t":"mc","s":"br*ea*the","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":6,"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["poi","son","ing"],"a":0},{"t":"syl","s":"","o":["tem","pera","ture"],"a":0},{"t":"syl","s":"","o":["lone","li","ness"],"a":0},{"t":"syl","s":"","o":["fa","shio","na","ble"],"a":0},{"t":"syl","s":"","o":["a","li","e","na","tion"],"a":3},{"t":"syl","s":"","o":["e","spe","cia","lly"],"a":1},{"t":"syl","s":"","o":["change","a","ble"],"a":0},{"t":"syl","s":"","o":["de","vas","ta","ted"],"a":1},{"t":"syl","s":"","o":["sun","burn"],"a":0},{"t":"syl","s":"","o":["a","cco","mmo","da","tion"],"a":3}]}]},{"k":"r","name":"Reading","title":"Mudlarking in London","text":["Few hobbies combine collecting Roman artefacts, finding medieval coins, and discovering bodies. But the very British hobby of mudlarking is making a comeback.","Mudlarking is a pastime that has become more popular in the last few years in London. It involves going to the River Thames at low tide and digging in the mud for valuable objects. A person who goes mudlarking is called a mudlark. Mudlarking has its origins in 18th-century London. But in those days, it wasn’t a hobby at all. It was actually a way for many children – and those too old to be employed – to survive. This was at a time when there were hardly any bridges crossing the river, so most people caught boats across. Getting on and off the boats, people dropped things. These things were then found by mudlarks, the poorest level of society, who sold them to earn money, which would hopefully be just enough for a meal.","Steve Brooker is a modern-day mudlark and he’s had this unusual hobby for 30 years. He’s found everything from glass bottles and clay pots, to coins dating from Roman times right up to the present day. He says he has found many extraordinary things, but finding a human skeleton was particularly terrifying. He later found out the bones were 300 years old, but even so, it’s an experience he is happy he hasn’t repeated.","Steve often goes to the river near where he lives, but on the day I met him, he accompanied me in my boat to the east of the city. Steve was excited because he hadn’t had a boat for a few years, and this meant he could reach an area where he hadn’t been for some time. ‘Getting caught out by the tide is a real danger,’ Steve explains. He advises us, as he does with anyone he guides on the river, to watch for the water level and always have an escape route. We appear to be okay and our boat is our way on and off the Blackwall foreshore.","Apart from a permit, the only tools required for mudlarking are a bucket and something to dig with. At 25°C, we are lucky with the weather, but even on rainy days, keen mudlarks can be found by the water’s edge. ‘Every day, as the water level rises and falls it moves objects in the mud,’ explains Steve. ‘So it’s possible to find really good things any time of the year.’ Steve quickly fills his bucket with coins, Victorian pipes, old keys, and even a jar that he says came from an old food factory that used to be nearby. He knows exactly where to look and hardly digs down at all. After an hour, his top object is a metal toy from the 1800s. Much of what he finds goes to local museums. ‘That’s what anyone who goes mudlarking usually does,’ says Steve.","Steve explains why the river mud holds such treasure. ‘It is anaerobic, which means it doesn’t hold air. Therefore, anything in it stays in great condition,’ he says. ‘Once they are opened up to the air, however, their condition starts to break down, so mudlarking is all about keeping things that would otherwise fall to pieces’."],"hl":["artefacts","valuable","skeleton","caught out","escape route","fall to pieces"],"parts":[{"ins":"Read the article. For questions 1–5, choose the correct answer (A, B, C, or D). Two marks each.","items":[{"t":"mc","s":"In 18th-century London, mudlarking …","o":["was mainly done by the elderly.","was a popular hobby for boat owners.","was often practised by restaurant staff.","was a way for some young people to stay alive."],"a":3,"w":2,"abcd":1},{"t":"mc","s":"What does the author say about Steve Brooker?","o":["He has uncovered coins used in different periods of history.","He has discovered an animal's bones while mudlarking.","He hopes to continue this hobby for many more years.","He hopes he will find more bones soon."],"a":0,"w":2,"abcd":1},{"t":"mc","s":"What advice does Steve offer other mudlarks?","o":["They should buy a boat.","They should have a plan in case of an emergency.","They should travel up the river whenever they want to.","They should practise their hobby on all parts of the river."],"a":1,"w":2,"abcd":1},{"t":"mc","s":"Steve says that for mudlarks, finding the best objects depends on …","o":["the tools.","the location.","the river.","the time of day."],"a":1,"w":2,"abcd":1},{"t":"mc","s":"Most modern mudlarks …","o":["hold on to what they find.","clean what they find and then sell it.","hand over what they find to someone else.","keep what they find for ages and sell it at a later stage."],"a":2,"w":2,"abcd":1}]},{"ins":"Match five of the highlighted words / phrases to the definitions. (Example: the structure of bones in a person = skeleton)","items":[{"t":"tx","s":"to be surprised by something = ___","a":["caught out","get caught out","be caught out","getting caught out"]},{"t":"tx","s":"break easily = ___","a":["fall to pieces"]},{"t":"tx","s":"very useful or important = ___","a":["valuable"]},{"t":"tx","s":"a way out in case of emergency = ___","a":["escape route"]},{"t":"tx","s":"objects of historical interest = ___","a":["artefacts","artifacts"]}]}]},{"k":"w","name":"Writing","task":"Write an article on one of the questions. Write 140–180 words.","bullets":["What advice would you give to someone who wanted a healthier lifestyle?","In your country, what is in fashion for men and women at the moment?","What do you like to do in your spare time?"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about athletics. Choose from the list (A–H) what each person says they like most about their hobby. There are three phrases you do not need to use.","list":["way of keeping fit","chance to visit various places","meeting famous athletes","working with good trainers","the variety of activities","opportunity to compete","chance to achieve a personal best","meeting new people"],"script":[["Speaker 1","What I love is beating my own time. Last month I ran the 400 metres in 58 seconds – my best ever. I'm not really interested in beating other people, just myself."],["Speaker 2","Athletics has taken me all over the country – and abroad, to Spain and Portugal for training camps. I'd never have seen those places otherwise."],["Speaker 3","I moved to the city two years ago and didn't know anyone. Joining the club meant I met loads of people – most of my friends now are from athletics."],["Speaker 4","I do the heptathlon, so one day it's hurdles, the next it's high jump or javelin. I never get bored, because there's always something different to do."],["Speaker 5","For me, it's simply the best way to stay in shape. I've got a desk job, so three evenings a week at the track keeps me fit and healthy."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F","G","H"],"a":6,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F","G","H"],"a":1,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F","G","H"],"a":7,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F","G","H"],"a":4,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F","G","H"],"a":0,"gap":1}]},{"ins":"Listen to two friends talking about a class they are going to join. Choose the correct answer.","script":[["Emma","Have you seen this list of evening classes, Jack?"],["Jack","Yes, I'm thinking of doing the photography one. I'm not a beginner – I've done a bit – but I'm not advanced either. Somewhere in the middle, I'd say."],["Emma","I've only got a basic knowledge of photography – I just use my phone. What about cooking? I'm quite comfortable cooking simple dishes already."],["Jack","Me too, but I'd like to learn how to make more foreign dishes – Thai food, Indian, that kind of thing."],["Emma","There's a salsa class too."],["Jack","I'd find that really challenging. I've got two left feet!"],["Emma","To be honest, I'd rather not take a dance class. What about the art class?"],["Jack","It says here you learn to paint objects – bowls of fruit, vases, that kind of thing."],["Emma","Hmm. I think I'd prefer painting people. Portraits are much more interesting."],["Jack","Well, let's think about it. I'll send you the information about all the classes tonight."],["Emma","Great. And if we choose the same one, let's meet just before the course starts and go in together."]],"items":[{"t":"mc","s":"Jack feels his photography skills are ___ level.","o":["beginner","intermediate","advanced"],"a":1},{"t":"mc","s":"Emma says she is ___ cooking simple dishes.","o":["comfortable with","unsure about","interested in"],"a":0},{"t":"mc","s":"Emma says that ___.","o":["she's not good at dancing","she'd prefer to go to a dance class with friends","she'd rather not take a dance class"],"a":2},{"t":"mc","s":"Emma thinks she would prefer painting ___.","o":["places","objects","people"],"a":2},{"t":"mc","s":"Jack offers to ___.","o":["lend Emma money for the class","send Emma information about the class","take Emma to the class"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":5,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["What / like doing / free time?","What / the trendiest item of clothing / ever had?","What / do / help the environment?","anything / annoys you / people do?","What / do if you have a headache?","What / know about first aid?","What kind of weather / think / good for sightseeing?","How / think / the climate / changed / in 50 years?","you / afraid / of flying? Why / Why not?","enjoy / taking risks? Why / Why not?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute on a topic from Files 1–5 that the teacher chooses. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Choose one of the statements. Say if you agree or disagree and give reasons.","prompts":["'We should always listen to what older people tell us.'","'People waste too much time on their smartphones.'","'A life without risk is a boring life.'"]}],"crit":["Grammar and vocabulary","Pronunciation","Fluency and interaction"]}],"kind2":"progress"});

reezing","hi*j*ack","n*y*lon"],"a":8,"pr":1},{"t":"mc","s":"sh*ow*er","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":5,"pr":1},{"t":"mc","s":"pre*ss*ure","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":1,"pr":1},{"t":"mc","s":"str*i*ped","o":["homesi*ck*","espe*ci*ally","c*al*m","c*augh*t","cr*ew*","dr*ou*ght","reli*e*ved","*f*reezing","hi*j*ack","n*y*lon"],"a":9,"pr":1}]}]},{"k":"r","name":"Reading","title":"Finding the past","text":["Few hobbies combine collecting Roman artefacts, finding medieval coins, and discovering bodies. But the very British hobby of mudlarking is making a comeback.","Mudlarking is a pastime that has become more popular in the last few years in London. It involves going to the River Thames at low tide and digging in the mud for valuable objects. A person who goes mudlarking is called a mudlark. Mudlarking has its origins in 18th-century London. But in those days, it wasn’t a hobby at all. It was actually a way for many children – and those too old to be employed – to survive. This was at a time when there were hardly any bridges crossing the river, so most people caught boats across. Getting on and off the boats, people dropped things. These things were then found by mudlarks, the poorest level of society, who sold them to earn money, which would hopefully be just enough for a meal.","Steve Brooker is a modern-day mudlark and he’s had this unusual hobby for 30 years. He’s found everything from glass bottles and clay pots, to coins dating from Roman times right up to the present day. He says he has found many extraordinary things, but finding a human skeleton was particularly terrifying. He later found out the bones were 300 years old, but even so, it’s an experience he is happy he hasn’t repeated.","Steve often goes to the river near where he lives, but on the day I met him, he accompanied me in my boat to the east of the city. Steve was excited because he hadn’t had a boat for a few years, and this meant he could reach an area where he hadn’t been for some time. ‘Getting caught out by the tide is a real danger,’ Steve explains. He advises us, as he does with anyone he guides on the river, to watch for the water level and always have an escape route. We appear to be okay and our boat is our way on and off the Blackwall foreshore.","Apart from a permit, the only tools required for mudlarking are a bucket and something to dig with. At 25°C, we are lucky with the weather, but even on rainy days, keen mudlarks can be found by the water’s edge. ‘Every day, as the water level rises and falls it moves objects in the mud,’ explains Steve. ‘So it’s possible to find really good things any time of the year.’ Steve quickly fills his bucket with coins, Victorian pipes, old keys, and even a jar that he says came from an old food factory that used to be nearby. He knows exactly where to look and hardly digs down at all. After an hour, his top object is a metal toy from the 1800s. Much of what he finds goes to local museums. ‘That’s what anyone who goes mudlarking usually does,’ says Steve.","Steve explains why the river mud holds such treasure. ‘It is anaerobic, which means it doesn’t hold air. Therefore, anything in it stays in great condition,’ he says. ‘Once they are opened up to the air, however, their condition starts to break down, so mudlarking is all about keeping things that would otherwise fall to pieces’."],"hl":["artefacts","making a comeback","valuable","clay","extraordinary","skeleton","caught out","escape route","break down","fall to pieces"],"parts":[{"ins":"Read the article. For questions 1–5, choose the correct answer (A, B, C, or D). Two marks each.","items":[{"t":"mc","s":"In 18th-century London, mudlarking …","o":["was popular with restaurant staff.","was normally done by boat owners.","was a common hobby for young people.","was a way for some elderly people to get money."],"a":3,"w":2,"abcd":1},{"t":"mc","s":"What does the author say about Steve Brooker?","o":["He plans to give up this hobby soon.","He hopes he will find more coins soon.","He found coins used in only one period of history.","He discovered a person's bones while mudlarking."],"a":3,"w":2,"abcd":1},{"t":"mc","s":"What advice does Steve offer other mudlarks?","o":["It's a good idea to get a boat.","It's best to go mudlarking on all parts of the river.","They need to have a plan for when things go wrong.","They should travel up the river at different times of day."],"a":2,"w":2,"abcd":1},{"t":"mc","s":"Steve says that success at mudlarking is linked to …","o":["the length of time you spend doing it.","the weather on the day you do it.","the tools you use to do it.","the location you do it in."],"a":3,"w":2,"abcd":1},{"t":"mc","s":"Most modern mudlarks …","o":["keep what they find.","wash what they find and then sell it.","give what they find to somebody else.","hold on to what they find for some time and sell it later on."],"a":2,"w":2,"abcd":1}]},{"ins":"Match five of the highlighted words / phrases to the definitions. (Example: the structure of bones in a person = skeleton)","items":[{"t":"tx","s":"to be in a very bad condition = ___","a":["fall to pieces","break down"]},{"t":"tx","s":"returning to popularity = ___","a":["making a comeback","make a comeback"]},{"t":"tx","s":"a type of earth that becomes heavy when it is baked and used to make things = ___","a":["clay"]},{"t":"tx","s":"worth a lot of money = ___","a":["valuable"]},{"t":"tx","s":"unexpected or strange = ___","a":["extraordinary"]}]}]},{"k":"w","name":"Writing","task":"Write an article on one of the questions. Write 140–180 words.","bullets":["What advice would you give to someone who wanted a healthier lifestyle?","In your country, what is in fashion for men and women at the moment?","What do you like to do in your spare time?"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about athletics. Choose from the list (A–H) what each person says they like most about their hobby. There are three phrases you do not need to use.","list":["staying fit","going to different places","meeting well-known sports people","working with good coaches","can try different things","chance to take part in competitions","doing the best you can do","meeting new people"],"script":[["Speaker 1","What I love is beating my own time. Last month I ran the 400 metres in 58 seconds – my best ever. I'm not really interested in beating other people, just myself."],["Speaker 2","Athletics has taken me all over the country – and abroad, to Spain and Portugal for training camps. I'd never have seen those places otherwise."],["Speaker 3","I moved to the city two years ago and didn't know anyone. Joining the club meant I met loads of people – most of my friends now are from athletics."],["Speaker 4","I do the heptathlon, so one day it's hurdles, the next it's high jump or javelin. I never get bored, because there's always something different to do."],["Speaker 5","For me, it's simply the best way to stay in shape. I've got a desk job, so three evenings a week at the track keeps me fit and healthy."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F","G","H"],"a":6,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F","G","H"],"a":1,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F","G","H"],"a":7,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F","G","H"],"a":4,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F","G","H"],"a":0,"gap":1}]},{"ins":"Listen to two friends talking about a class they are going to join. Choose the correct answer.","script":[["Emma","Have you seen this list of evening classes, Jack?"],["Jack","Yes, I'm thinking of doing the photography one. I'm not a beginner – I've done a bit – but I'm not advanced either. Somewhere in the middle, I'd say."],["Emma","I've only got a basic knowledge of photography – I just use my phone. What about cooking? I'm quite comfortable cooking simple dishes already."],["Jack","Me too, but I'd like to learn how to make more foreign dishes – Thai food, Indian, that kind of thing."],["Emma","There's a salsa class too."],["Jack","I'd find that really challenging. I've got two left feet!"],["Emma","To be honest, I'd rather not take a dance class. What about the art class?"],["Jack","It says here you learn to paint objects – bowls of fruit, vases, that kind of thing."],["Emma","Hmm. I think I'd prefer painting people. Portraits are much more interesting."],["Jack","Well, let's think about it. I'll send you the information about all the classes tonight."],["Emma","Great. And if we choose the same one, let's meet just before the course starts and go in together."]],"items":[{"t":"mc","s":"Emma says that she ___ photography.","o":["doesn't know anything about","has only basic knowledge of","is at a good level in"],"a":1},{"t":"mc","s":"Jack would like to learn how to ___.","o":["cook more simple dishes","make more foreign dishes","do more desserts"],"a":1},{"t":"mc","s":"Jack thinks he would find dancing classes ___.","o":["challenging","enjoyable","strange"],"a":0},{"t":"mc","s":"Jack says that in art classes you can learn to paint ___.","o":["people","places","objects"],"a":2},{"t":"mc","s":"Emma and Jack arrange to ___.","o":["fill in an application for the course","pay for the course together","meet just before the course starts"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":5,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["you believe / people can predict the future?","How important / clothes to you? Why?","What / do if / have a nosebleed?","How / deal with stress?","What / do if / lost in a forest?","What / last story you read?","What / do / this time next year?","What kind of weather / think / good for walking in the mountains?","What / most extreme weather conditions / ever experience?","When / last time you flew?"]},{"name":"Discussion","mins":3,"lead":"Choose one of the statements. Say if you agree or disagree and give reasons.","prompts":["'Young people shouldn't be allowed to drive until they are 21.'","'Children are at greater risk when playing outside than they were in the past.'","'People are under pressure to spend money on how they look.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute on a topic from Files 1–5 that the teacher chooses. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar and vocabulary","Pronunciation","Fluency and interaction"]}],"kind2":"progress"});

,"expands","export"],"a":0},{"t":"mc","s":"Two men have been ___ with bribery.","o":["charged","arrested","questioned"],"a":0},{"t":"mc","s":"My neighbours won't ___ if you park your car in front of their house.","o":["notice","mind","matter"],"a":1}]},{"ins":"Choose the correct word.","items":[{"t":"mc","s":"The drug was withdrawn because of its harmful side ___.","o":["results","effects"],"a":1},{"t":"mc","s":"We're looking for ___ to work in the charity shop on Saturdays.","o":["volunteers","donors"],"a":0},{"t":"mc","s":"We'll have to cut carbon emissions ___.","o":["sooner or later","now or never"],"a":0},{"t":"mc","s":"Did you ___ whether the supermarket was open when we drove past?","o":["notice","realize"],"a":0},{"t":"mc","s":"___ me to buy some stamps when we're in the newsagent's.","o":["Remember","Remind"],"a":1},{"t":"mc","s":"My wallet was ___ from out of my jacket when I went to the toilet.","o":["stolen","robbed"],"a":0},{"t":"mc","s":"I ___ Helen will come on Saturday. It would be a shame not to see her.","o":["hope","expect"],"a":0},{"t":"mc","s":"It was a long and difficult journey, but we arrived ___.","o":["safe and sound","sound and safe"],"a":0},{"t":"mc","s":"This branch ___ the biggest profit last year.","o":["did","made"],"a":1},{"t":"mc","s":"It's hard to find ___ journalism that isn't obviously left- or right-wing.","o":["biased","objective"],"a":1},{"t":"mc","s":"I've had plenty of ___ in my 20-year career.","o":["downs and outs","ups and downs"],"a":1},{"t":"mc","s":"Prices have ___ by over 10% during the last year.","o":["raised","risen"],"a":1}]},{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"You're such a h___ – you're always imagining that you're ill!","a":["ypochondriac","hypochondriac"],"show":"hypochondriac"},{"t":"tx","s":"I've sent Jenny a lovely b___ of flowers for her birthday.","a":["ouquet","bouquet"],"show":"bouquet"},{"t":"tx","s":"I l___ on the sofa all afternoon yesterday watching TV.","a":["ay","lay"],"show":"lay"},{"t":"tx","s":"I'm so tired, I can't stop y___.","a":["awning","yawning"],"show":"yawning"},{"t":"tx","s":"The audience clapped so long that the singer gave another e___.","a":["ncore","encore"],"show":"encore"},{"t":"tx","s":"I'd hate to suffer from i___ because I love sleeping!","a":["nsomnia","insomnia"],"show":"insomnia"},{"t":"tx","s":"The traffic going past the hotel kept me a___ all night.","a":["wake","awake"],"show":"awake"},{"t":"tx","s":"This hard drive is so small you can hold it in the p___ of your hand.","a":["alm","palm"],"show":"palm"},{"t":"tx","s":"The men were tried, but a___ because of a lack of evidence.","a":["cquitted","acquitted"],"show":"acquitted"},{"t":"tx","s":"I always enjoy his reviews – I think he's the best film c___ around.","a":["ritic","critic"],"show":"critic"}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["co","mmen","ta","tor"],"a":0},{"t":"syl","s":"","o":["lone","li","ness"],"a":0},{"t":"syl","s":"","o":["black","mail"],"a":0},{"t":"syl","s":"","o":["me","ga","ci","ty"],"a":0},{"t":"syl","s":"","o":["or","ches","tra"],"a":0},{"t":"syl","s":"","o":["com","pa","ny"],"a":0},{"t":"syl","s":"","o":["sci","en","tist"],"a":0},{"t":"syl","s":"","o":["con","vince"],"a":1},{"t":"syl","s":"","o":["a","sto","nished"],"a":1},{"t":"syl","s":"","o":["eye","brows"],"a":0}]},{"ins":"Match the words with the same sound. (Example: axe → branch)","items":[{"t":"mc","s":"g*ui*lty","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":7,"pr":1},{"t":"mc","s":"den*y*","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":8,"pr":1},{"t":"mc","s":"ju*dg*e","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":4,"pr":1},{"t":"mc","s":"m*ar*ket","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":1,"pr":1},{"t":"mc","s":"*jour*nalist","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":0,"pr":1},{"t":"mc","s":"c*o*mb","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":9,"pr":1},{"t":"mc","s":"l*aw*","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":3,"pr":1},{"t":"mc","s":"rev*iew*","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":2,"pr":1},{"t":"mc","s":"l*u*ngs","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":6,"pr":1},{"t":"mc","s":"volunt*eer*","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":5,"pr":1}]}]},{"k":"r","name":"Reading","title":"Beach heroes","text":["There is no more welcome sight on beaches all over the world than a lifeguard.","You can spot the lifeguards a mile off – which is, of course, half the point. Not only do they wear highly conspicuous red-and-yellow uniforms, but somehow they manage to look better than the rest of us too.","‘Last year, we only had to make five rescues,’ says head lifeguard Rod Terry, 22. ‘Another year, we helped 29 people in the space of three hours. You never know what you’re going to be called upon to do, which is why you need lifeguards who can cope with any situation.’ You’d think, of course, they’d all be keen to perform some public heroics, but Rod is quick to rebuff any such suggestions.","‘As far as we’re concerned, we’d far rather stop someone getting into trouble than have to get them out of it.’ One of the lifeguards in Rod’s team is 24-year-old Rebecca Surridge. She says, ‘One minute you can find yourself dealing with minor cuts and grazes, and the next with a situation where one group of people on the beach is annoying another group. You have to handle things sensitively too.’ Even if they do talk tough, the lifeguards have no legal authority with which to back up their words. ‘We can only advise,’ adds Rod. ‘If someone wants to ignore a red flag, they’re free to do so.’ A red flag is what the lifeguards put out when the sea’s too rough for swimming. Exactly when that moment is reached is something that Rod alone decides. A lifeguard since the age of 14, first as a volunteer, he’s now a paid member of the town council’s leisure services department. ‘You take into account a variety of things: you listen to the weather reports and forecasts, and you assess the strength of the wind.’ Other factors to be considered, depending on location, of course, are the dangers that may be lurking in the water.","The vast majority of swimmers take notice of a red flag, but there are always those who don’t, and long before they start really getting into trouble, lifeguards will be on their way out to them, dragging with them a ‘torpedo’ buoy, which is a long sausage-shaped inflatable on the end of a rope. This can help them bring in swimmers suffering from cramp brought on by swimming too soon after a meal, or fatigue caused by swimming out too far. ‘Then you get the silly ones who jump off the harbour wall,’ sighs Rod. ‘Mostly, though, swimmers stick within our exclusion zone.’","This is a 100 m x 100 m patch of sea. The prime rule of the exclusion zone is that boats are forbidden to enter it – and humans forbidden to leave it. Even a rubber ring is pursued and retrieved. If found floating out at sea, it could set off a coastal-wide emergency search.","At any one time, there are eight lifeguards on duty, either scanning the waves or patrolling the beach (lifebelts need checking, telephones need to be kept working in case of emergency calls). The team works five days a week, and constantly has to rotate tasks as this facilitates maximum degrees of attention. The other thing that keeps the lifeguards alert is the fact that they all get on well together. ‘It’s not as if we’re all sitting there in silence,’ says Lisa. ‘We’re always talking to each other, either in person or down the two-way radio.’","In fact, each summer season is something of an old friend’s reunion; this is the seventh year Pete has worked here, while it’s the fifth for Rebecca. Come winter time, they go off round the world – Pete’s been surfing in Mexico and Rebecca’s just back from Bali, Hawaii, and New Zealand. It’s a case of not yet wanting to give up their seasonal , sunlit round of beaches. ‘There’s plenty of time for a proper job later,’ says Rebecca."],"hl":["conspicuous","rebuff","cramp","fatigue","prime","retrieved"],"parts":[{"ins":"Read the article. For questions 1–5, choose the correct answer (A, B, C, or D). Two marks each.","items":[{"t":"mc","s":"According to Rod Terry, lifeguards need to be …","o":["athletic.","flexible.","attentive.","hardworking."],"a":1,"w":2,"abcd":1},{"t":"mc","s":"Rebecca Surridge says that lifeguards …","o":["operate in limited areas.","have limited powers over people.","are trained to deal with limited injuries.","watch over a limited number of people."],"a":1,"w":2,"abcd":1},{"t":"mc","s":"According to the text, which factor affects a lifeguard's decision to put up a red flag?","o":["the presence of something dangerous in the sea","the quality of the water in the sea","the environmental conditions","the number of swimmers"],"a":[0,2],"w":2,"abcd":1},{"t":"mc","s":"In order to maintain their concentration levels, lifeguards …","o":["sometimes ask their colleagues for feedback.","regularly change the duties they perform.","usually take several days off each week.","often take long breaks during the day."],"a":1,"w":2,"abcd":1},{"t":"mc","s":"It's common for a group of lifeguards …","o":["to have another job at the same time.","to meet up when they're not working.","to work together in the same location.","to go travelling together when the summer is over."],"a":2,"w":2,"abcd":1}]},{"ins":"Match five of the highlighted words / phrases to the definitions. (Example: to bring or get something back = retrieve)","items":[{"t":"tx","s":"easily seen = ___","a":["conspicuous"]},{"t":"tx","s":"an unkind refusal of an offer or suggestion = ___","a":["rebuff"]},{"t":"tx","s":"a sudden pain in your body when your muscles contract = ___","a":["cramp"]},{"t":"tx","s":"feeling of being extremely tired because of hard work or exercise = ___","a":["fatigue"]},{"t":"tx","s":"the main or most important thing = ___","a":["prime"]}]}]},{"k":"w","name":"Writing","task":"Write an article on one of the questions. Write 140–180 words.","bullets":["Describe a piece of music that you like and explain why you like it.","How do you prefer to get the news and why?","What do you like and dislike about the place where you live?"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talk about things they collect as a hobby. Choose from the list (A–H) what each person enjoys most about their collection. There are three extra letters you do not need to use.","list":["being reminded of visits I've made","using it for creative purposes","something they collect with friends","having something attractive to look at","showing it to other people","learning about the past","knowing it will increase in value","feeling proud of the achievement"],"script":[["Speaker 1","I collect fridge magnets from every country I visit. Every morning when I open the fridge, I'm reminded of a trip – the market in Marrakesh, the snow in Oslo."],["Speaker 2","I collect old coins. What fascinates me is the history – who used this coin, and what could you buy with it two hundred years ago?"],["Speaker 3","I collect old buttons – thousands of them. I use them to make pictures and jewellery, so for me it's really about being creative."],["Speaker 4","I collect stamps, and I'll be honest – the best part is knowing they'll be worth more one day. A rare stamp can sell for thousands."],["Speaker 5","I've got about sixty teapots on shelves in my kitchen. They're just beautiful to look at – all different colours and shapes."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F","G","H"],"a":0,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F","G","H"],"a":5,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F","G","H"],"a":1,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F","G","H"],"a":6,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F","G","H"],"a":3,"gap":1}]},{"ins":"Listen to an interview with a snowboarder. Choose the correct answer.","script":[["Interviewer","Helen, how did you first get into snowboarding?"],["Helen","My parents and my two older brothers all snowboarded, and I didn't want to be left behind – I just wanted to keep up with them. I wasn't trying to be a champion, and there wasn't even a team where I live."],["Interviewer","How do you learn new tricks?"],["Helen","Lots of people watch video clips online or pay an expert, but I think the best way is to take a move you already know and change it slightly – make variations."],["Interviewer","What do you enjoy most?"],["Helen","That moment when you finally get a new move just right, after weeks of trying. Perfecting it is the best feeling. The hard physical work, honestly, I could live without!"],["Interviewer","You've just done an instructors' course, haven't you?"],["Helen","Yes. Last winter I had a holiday job at a resort nearby, and they offered me a place on the course while I was working there."],["Interviewer","And what's next?"],["Helen","For now, I'm going to keep up my snowboarding by teaching others at the resort. Maybe one day I'll compete internationally, but not yet – and I'm not going to university this year either."]],"items":[{"t":"mc","s":"Helen started snowboarding because she wanted to ___.","o":["join a local team","keep up with other family members","have an opportunity to excel in a sport"],"a":1},{"t":"mc","s":"To learn new snowboarding tricks, Helen recommends ___.","o":["consulting an expert","watching video clips on the internet","making variations to moves you already know"],"a":2},{"t":"mc","s":"The aspect of snowboarding Helen particularly likes is ___.","o":["perfecting a new move","putting in the physical effort required","pushing herself to a higher level"],"a":0},{"t":"mc","s":"What does Helen say about the course she went on?","o":["She did it as part of a special local project.","She was offered it while doing a holiday job at a nearby resort.","She was promised a job assisting the instructors if she completed it."],"a":1},{"t":"mc","s":"In the immediate future, Helen plans to ___.","o":["pursue both academic study and professional snowboarding","focus on snowboarding at an international level","keep up her snowboarding by instructing others"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":5,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["Which city / most like to visit and why?","What / do / if / president of your country?","you / rather / work indoors or outdoors? Why?","Which famous person / you like to look like? Why?","Which musical instrument / most like to learn how to play?","How / science helped us most in the last 100 years?","crime / last hear about?","If / could work on a newspaper, which job / like to do?","What social problems / your capital city have?","What / last advert you saw?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute on a topic from Files 6–10 that the teacher chooses. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Choose one of the statements. Say if you agree h*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":2,"pr":1},{"t":"mc","s":"l*u*ngs","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":6,"pr":1},{"t":"mc","s":"g*ui*lty","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":7,"pr":1},{"t":"mc","s":"den*y*","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":8,"pr":1},{"t":"mc","s":"m*ar*ket","o":["adv*er*tisement","h*ear*t","ref*u*se","c*our*t","*j*ury","th*eo*ry","t*o*ngue","ant*i*social","v*i*olin","gr*ow*"],"a":1,"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["sci","en","tist"],"a":0},{"t":"syl","s":"","o":["eye","brows"],"a":0},{"t":"syl","s":"","o":["con","vince"],"a":1},{"t":"syl","s":"","o":["a","sto","nished"],"a":1},{"t":"syl","s":"","o":["co","mmen","ta","tor"],"a":0},{"t":"syl","s":"","o":["lone","li","ness"],"a":0},{"t":"syl","s":"","o":["me","ga","ci","ty"],"a":0},{"t":"syl","s":"","o":["or","ches","tra"],"a":0},{"t":"syl","s":"","o":["com","pa","ny"],"a":0},{"t":"syl","s":"","o":["black","mail"],"a":0}]}]},{"k":"r","name":"Reading","title":"The life of lifeguards","text":["There is no more welcome sight on beaches all over the world than a lifeguard.","You can spot the lifeguards a mile off – which is, of course, half the point. Not only do they wear highly conspicuous red-and-yellow uniforms, but somehow they manage to look better than the rest of us too.","‘Last year, we only had to make five rescues,’ says head lifeguard Rod Terry, 22. ‘Another year, we helped 29 people in the space of three hours. You never know what you’re going to be called upon to do, which is why you need lifeguards who can cope with any situation.’ You’d think, of course, they’d all be keen to perform some public heroics, but Rod is quick to rebuff any such suggestions.","‘As far as we’re concerned, we’d far rather stop someone getting into trouble than have to get them out of it.’ One of the lifeguards in Rod’s team is 24-year-old Rebecca Surridge. She says, ‘One minute you can find yourself dealing with minor cuts and grazes, and the next with a situation where one group of people on the beach is annoying another group. You have to handle things sensitively too.’ Even if they do talk tough, the lifeguards have no legal authority with which to back up their words. ‘We can only advise,’ adds Rod. ‘If someone wants to ignore a red flag, they’re free to do so.’ A red flag is what the lifeguards put out when the sea’s too rough for swimming. Exactly when that moment is reached is something that Rod alone decides. A lifeguard since the age of 14, first as a volunteer, he’s now a paid member of the town council’s leisure services department. ‘You take into account a variety of things: you listen to the weather reports and forecasts, and you assess the strength of the wind.’ Other factors to be considered, depending on location, of course, are the dangers that may be lurking in the water.","The vast majority of swimmers take notice of a red flag, but there are always those who don’t, and long before they start really getting into trouble, lifeguards will be on their way out to them, dragging with them a ‘torpedo’ buoy, which is a long sausage-shaped inflatable on the end of a rope. This can help them bring in swimmers suffering from cramp brought on by swimming too soon after a meal, or fatigue caused by swimming out too far. ‘Then you get the silly ones who jump off the harbour wall,’ sighs Rod. ‘Mostly, though, swimmers stick within our exclusion zone.’","This is a 100 m x 100 m patch of sea. The prime rule of the exclusion zone is that boats are forbidden to enter it – and humans forbidden to leave it. Even a rubber ring is pursued and retrieved. If found floating out at sea, it could set off a coastal-wide emergency search.","At any one time, there are eight lifeguards on duty, either scanning the waves or patrolling the beach (lifebelts need checking, telephones need to be kept working in case of emergency calls). The team works five days a week, and constantly has to rotate tasks as this facilitates maximum degrees of attention. The other thing that keeps the lifeguards alert is the fact that they all get on well together. ‘It’s not as if we’re all sitting there in silence,’ says Lisa. ‘We’re always talking to each other, either in person or down the two-way radio.’","In fact, each summer season is something of an old friend’s reunion; this is the seventh year Pete has worked here, while it’s the fifth for Rebecca. Come winter time, they go off round the world – Pete’s been surfing in Mexico and Rebecca’s just back from Bali, Hawaii, and New Zealand. It’s a case of not yet wanting to give up their seasonal , sunlit round of beaches. ‘There’s plenty of time for a proper job later,’ says Rebecca."],"hl":["scanning","rebuff","back up","grazes","take into account","alert","retrieved"],"parts":[{"ins":"Read the article. For questions 1–5, choose the correct answer (A, B, C, or D). Two marks each.","items":[{"t":"mc","s":"Rod Terry says that lifeguards need to be able to …","o":["do all sorts of athletic moves.","pay attention to detail.","work very hard.","adapt easily."],"a":3,"w":2,"abcd":1},{"t":"mc","s":"According to Rebecca Surridge, lifeguards …","o":["have restricted control over people.","work in a restricted number of areas.","are qualified to treat restricted injuries.","look after a restricted number of people."],"a":0,"w":2,"abcd":1},{"t":"mc","s":"The … influences a lifeguard's decision to put up a red flag.","o":["quality of the sea water","weather condition","presence of a threat in the sea","number of people on the beach"],"a":[1,2],"w":2,"abcd":1},{"t":"mc","s":"How do lifeguards maintain their levels of concentration?","o":["They take a long break each day.","They work no more than four days a week.","They ask other lifeguards' opinions on their work.","They switch among the duties involved in their job."],"a":3,"w":2,"abcd":1},{"t":"mc","s":"Lifeguards typically …","o":["take holidays together during the quieter months.","do a few different jobs simultaneously.","get employment in the same place.","socialize together in their free time."],"a":2,"w":2,"abcd":1}]},{"ins":"Match five of the highlighted words / phrases to the definitions. (Example: to bring or get something back = retrieve)","items":[{"t":"tx","s":"to look at every part of something carefully = ___","a":["scan","scanning"]},{"t":"tx","s":"to be able to think quickly = ___","a":["alert","be alert"]},{"t":"tx","s":"to support what you say is true = ___","a":["back up"]},{"t":"tx","s":"small injuries on your skin = ___","a":["grazes","cuts and grazes"]},{"t":"tx","s":"to consider particular facts when making a decision about something = ___","a":["take into account"]}]}]},{"k":"w","name":"Writing","task":"Write an article on one of the questions. Write 140–180 words.","bullets":["Describe a piece of music that you like and explain why you like it.","How do you prefer to get the news and why?","What do you like and dislike about the place where you live?"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talk about things they collect as a hobby. Choose from the list (A–H) what each person enjoys most about their collection. There are three extra letters you do not need to use.","list":["collecting with friends","knowing people will pay more for it","finding out about history","having something that looks nice","thinking about places I've been to","using it for artistic reasons","showing it to others","feeling proud of what I've collected"],"script":[["Speaker 1","I collect fridge magnets from every country I visit. Every morning when I open the fridge, I'm reminded of a trip – the market in Marrakesh, the snow in Oslo."],["Speaker 2","I collect old coins. What fascinates me is the history – who used this coin, and what could you buy with it two hundred years ago?"],["Speaker 3","I collect old buttons – thousands of them. I use them to make pictures and jewellery, so for me it's really about being creative."],["Speaker 4","I collect stamps, and I'll be honest – the best part is knowing they'll be worth more one day. A rare stamp can sell for thousands."],["Speaker 5","I've got about sixty teapots on shelves in my kitchen. They're just beautiful to look at – all different colours and shapes."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F","G","H"],"a":4,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F","G","H"],"a":2,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F","G","H"],"a":5,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F","G","H"],"a":1,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F","G","H"],"a":3,"gap":1}]},{"ins":"Listen to an interview with a snowboarder. Choose the correct answer.","script":[["Interviewer","Helen, how did you first get into snowboarding?"],["Helen","My parents and my two older brothers all snowboarded, and I didn't want to be left behind – I just wanted to keep up with them. I wasn't trying to be a champion, and there wasn't even a team where I live."],["Interviewer","How do you learn new tricks?"],["Helen","Lots of people watch video clips online or pay an expert, but I think the best way is to take a move you already know and change it slightly – make variations."],["Interviewer","What do you enjoy most?"],["Helen","That moment when you finally get a new move just right, after weeks of trying. Perfecting it is the best feeling. The hard physical work, honestly, I could live without!"],["Interviewer","You've just done an instructors' course, haven't you?"],["Helen","Yes. Last winter I had a holiday job at a resort nearby, and they offered me a place on the course while I was working there."],["Interviewer","And what's next?"],["Helen","For now, I'm going to keep up my snowboarding by teaching others at the resort. Maybe one day I'll compete internationally, but not yet – and I'm not going to university this year either."]],"items":[{"t":"mc","s":"Helen became involved in snowboarding because she ___.","o":["was looking for a sport she could do really well at","was interested in joining the team in her hometown","didn't want to be left out by her family"],"a":2},{"t":"mc","s":"Helen says the best way to learn new snowboarding tricks is to ___.","o":["check out video clips online","get advice from a professional","try altering moves you've already learned"],"a":2},{"t":"mc","s":"While snowboarding, Helen especially enjoys ___.","o":["forcing herself to do better","using up the physical energy needed","getting a new move just right"],"a":2},{"t":"mc","s":"What does Helen say about the course she went on?","o":["She was asked to do it while working at a nearby resort.","She started it when she became involved in a particular local project.","She was offered employment with a team of local instructors if she finished it."],"a":0},{"t":"mc","s":"Helen's plans for the immediate future involve ___.","o":["snowboarding competitively at an international level","studying at university while snowboarding professionally","maintaining her snowboarding knowledge by teaching others"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":5,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["you / think / regret studying English? Why / Why not?","What / do to make sure you sleep well?","you / like to manage a company?","you / rather live abroad or live in your own country? Why?","Which member of your family / look like?","When / listen to music?","How / classical music / make you feel?","How often / watch the news on TV?","Which science / most important in the modern world? Why?","What news stories / find / most depressing?"]},{"name":"Discussion","mins":3,"lead":"Choose one of the statements. Say if you agree or disagree and give reasons.","prompts":["'In the future, people will get all of their news from the internet rather than from TV or newspapers.'","'Advertising should be banned from schools.'","'Science is the most important subject at school.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute on a topic from Files 6–10 that the teacher chooses. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar and vocabulary","Pronunciation","Fluency and interaction"]}],"kind2":"progress"});
TESTS.push({"id":"enda","kind":"file","title":"End-of-course Test A","focus":"Grammar, vocabulary and pronunciation from the whole of English File Upper-intermediate (Files 1–10).","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Complete the sentences. Use the correct form of the verb in brackets.","items":[{"t":"tx","s":"I think you'd have got the job if you ___ (not ask) that stupid question.","a":["hadn't asked"]},{"t":"tx","s":"Call an ambulance! Mrs Jones ___ (run over) by a car!","a":["has been run over","has just been run over"]},{"t":"tx","s":"I immediately regretted ___ (send) the email.","a":["sending","having sent"]},{"t":"tx","s":"I ___ (writing) my essay for an hour when my computer crashed and lost it all.","a":["had been writing"]},{"t":"tx","s":"I'm sure you wish you ___ (not buy) that car. It's been nothing but trouble.","a":["hadn't bought"]},{"t":"tx","s":"We ___ (practise) this dance for nearly two months, so it should go well tonight.","a":["have been practising","have been practicing"]},{"t":"tx","s":"I think I ___ (learn) enough Chinese by the time I go to China.","a":["will have learnt","will have learned"]},{"t":"tx","s":"I'll let you know the test results as soon as I ___ (discuss) them with your doctor.","a":["have discussed","discuss"]},{"t":"tx","s":"I wanted to meet Anna, but she ___ (already leave) when I got to the party.","a":["had already left"]},{"t":"tx","s":"We couldn't go inside the church because it ___ (redecorate).","a":["was being redecorated"]},{"t":"tx","s":"You ___ (not sit) here now if I hadn't managed to get us the invitation.","a":["wouldn't be sitting"]},{"t":"tx","s":"One of the greatest 20th century paintings ___ (report) to have been stolen.","a":["is reported","has been reported"]},{"t":"tx","s":"I'll bring something to eat in case we ___ (get) hungry.","a":["get"]},{"t":"tx","s":"I ___ (still work) at 7.00. I don't finish until 8.00 on Thursdays.","a":["will still be working"]},{"t":"tx","s":"You shouldn't ___ (spend) so long in the sun yesterday – you've got sunburn.","a":["have spent"]}]},{"ins":"Complete the sentences with one word.","items":[{"t":"tx","s":"I wish you ___ keep leaving the door open when you leave the room.","a":["wouldn't"]},{"t":"tx","s":"Don't ___ me for your problems – they're your responsibility.","a":["blame"]},{"t":"tx","s":"I don't really feel ___ going out tonight – let's stay in.","a":["like"]},{"t":"tx","s":"I don't speak French, but my sister ___.","a":["does"]},{"t":"tx","s":"Do you have any idea ___ Marc is coming to football practice this week?","a":["if","whether"]},{"t":"tx","s":"Robert sang that song really well, ___ he?","a":["didn't"]},{"t":"tx","s":"It sounds as ___ the neighbours are arguing again.","a":["if","though"]},{"t":"tx","s":"Neither Roger ___ Belinda are interested in joining the reading group.","a":["nor"]},{"t":"tx","s":"We didn't ___ to do much sport, but we're really into volleyball now.","a":["use"]},{"t":"tx","s":"It was ___ a shock when Gabby walked into the room!","a":["such"]},{"t":"tx","s":"We're ___ the roof fixed next week – the rain is starting to come through it.","a":["having","getting"]},{"t":"tx","s":"There's ___ milk in the fridge. Can you go and get some from the corner shop?","a":["no"]},{"t":"tx","s":"We ___ have been crazy to buy this house! There's so much wrong with it.","a":["must"]},{"t":"tx","s":"I can't ___ used to this computer mouse – it's really different from my old one.","a":["get"]},{"t":"tx","s":"If you still feel unwell, you'd ___ go home and go to bed.","a":["better"]}]},{"ins":"Complete the sentences with the correct word(s).","items":[{"t":"mc","s":"I ___ when I'm cleaning my apartment.","o":["play often music","play music often","often play music"],"a":2},{"t":"mc","s":"___ are becoming an increasingly large proportion of many societies.","o":["Unemployed","The unemployed","The unemployed people"],"a":1},{"t":"mc","s":"We played the music quietly ___ wake the children.","o":["to not","not to","so as not to"],"a":2},{"t":"mc","s":"___ the very steep climb up the last hill, I really enjoyed the walk.","o":["Although","In spite","Despite"],"a":2},{"t":"mc","s":"Our eldest daughter is at ___ university. She's studying Physics.","o":["the","a","(–)"],"a":2},{"t":"mc","s":"That's a ___ table – where did you buy it?","o":["lovely little wooden","little lovely wooden","lovely wooden little"],"a":0},{"t":"mc","s":"I like the dogs that my neighbour has, but generally I prefer ___ cats.","o":["(–)","some","the"],"a":0},{"t":"mc","s":"___ of our team played well today – that's why we lost.","o":["Neither","None","Some"],"a":1},{"t":"mc","s":"I love ___ in that shop.","o":["a furniture","the furnitures","the furniture"],"a":2},{"t":"mc","s":"Does anyone know where ___?","o":["lives Petra","does Petra live","Petra lives"],"a":2}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Write the words after the definitions. (Example: very angry = furious)","items":[{"t":"tx","s":"the thing which planes take off from and land on = ___","a":["runway"]},{"t":"tx","s":"the person who controls how an orchestra plays = ___","a":["conductor"]},{"t":"tx","s":"unsure how to react to something because your emotions are so strong = ___","a":["overwhelmed"]},{"t":"tx","s":"someone who tries to avoid spending money = tight-___","a":["fisted","tight-fisted"],"show":"tight-fisted"},{"t":"tx","s":"another word for luggage = ___","a":["baggage"]},{"t":"tx","s":"you put your head on this when you sleep = ___","a":["pillow"]},{"t":"tx","s":"a group of people who sing together = ___","a":["choir","chorus"]},{"t":"tx","s":"when you open your mouth very wide because you are tired = ___","a":["yawn","yawning"]},{"t":"tx","s":"the opposite of tight (trousers) = ___","a":["loose"]},{"t":"tx","s":"you use these to breathe = ___","a":["lungs"]},{"t":"tx","s":"a person who sees a crime = ___","a":["witness"]},{"t":"tx","s":"a person who works with you in a company = ___","a":["colleague"]},{"t":"tx","s":"a snow storm with very strong winds = ___","a":["blizzard"]},{"t":"tx","s":"the person in charge of a newspaper who decides what will go in it = ___","a":["editor"]},{"t":"tx","s":"not allowing water to go through it = ___","a":["waterproof"]}]},{"ins":"Complete the sentences with the correct word.","items":[{"t":"mc","s":"You have to take Diana's age into ___ when you judge her work.","o":["place","care","account"],"a":2},{"t":"mc","s":"I'm ___ and tired of listening to all your problems – do something about them!","o":["fed up","sick","bored"],"a":1},{"t":"mc","s":"I think Jerry was very tired – he's ___ asleep on the sofa.","o":["full","fast","deep"],"a":1},{"t":"mc","s":"The audience loved it all and the band came back twice to give ___.","o":["encores","choruses","performances"],"a":0},{"t":"mc","s":"I find it ___ when apps keep updating themselves all the time.","o":["confused","confusion","confusing"],"a":2},{"t":"mc","s":"I walked for six hours, and now I've got ___ on my feet.","o":["bruises","blisters","rashes"],"a":1},{"t":"mc","s":"It's difficult to get the truth from newspapers in this country – they're all ___.","o":["objective","censored","accurate"],"a":1},{"t":"mc","s":"That dress really ___ you. It goes really well with your hair colour.","o":["fits","matches","suits"],"a":2},{"t":"mc","s":"Geologists working in Australia have ___ an important discovery.","o":["done","carried out","made"],"a":2},{"t":"mc","s":"Have you ___ finished that book?","o":["yet","nearly","still"],"a":1},{"t":"mc","s":"The two men were both charged ___ blackmail and theft.","o":["of","with","for"],"a":1},{"t":"mc","s":"This restaurant is part of a ___ – I went to one in London last week.","o":["chain","branch","company"],"a":0},{"t":"mc","s":"I was trying hard not to ___ my voice, but I was getting angrier and angrier.","o":["rise","raise","put up"],"a":1},{"t":"mc","s":"We were ___ when we heard that John's ankle wasn't broken, only sprained.","o":["disappointed","relieved","bewildered"],"a":1},{"t":"mc","s":"I'll have to keep reminding Sheila about the meeting – she's very ___-minded.","o":["narrow","open","absent"],"a":2}]},{"ins":"Complete the sentences with one word made from the word in brackets.","items":[{"t":"tx","s":"These cups are ___, even if you drop them on a hard floor. (break)","a":["unbreakable"]},{"t":"tx","s":"___ is a big problem in this area. (vandal)","a":["Vandalism"]},{"t":"tx","s":"The weather here is so ___, it could be very different later. (change)","a":["changeable"]},{"t":"tx","s":"I like green vegetables, ___ spinach. (special)","a":["especially"]},{"t":"tx","s":"Housing costs are high in the capital, so there are a lot of ___ people. (home)","a":["homeless"]},{"t":"tx","s":"I don't suffer from ___ – I enjoy being on my own. (lonely)","a":["loneliness"]},{"t":"tx","s":"She behaves like a little girl sometimes – she's so ___. (mature)","a":["immature"]},{"t":"tx","s":"I felt very ___ when I couldn't remember her name. (embarrass)","a":["embarrassed"]},{"t":"tx","s":"I'm ___ to peanuts, but I can eat any other kinds of nuts. (allergy)","a":["allergic"]},{"t":"tx","s":"It was a huge storm, and several trees were hit by ___. (light)","a":["lightning"]}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Choose the word with a different sound.","items":[{"t":"mc","s":"Which word has a different sound from tree?","o":["relieved","colleague","leather","illegal"],"a":2},{"t":"mc","s":"Which word has a different sound from fish?","o":["guilty","bilingual","business","presenter"],"a":1},{"t":"mc","s":"Which word has a different sound from shower?","o":["specialist","infection","choke","rash"],"a":2},{"t":"mc","s":"Which word has a different sound from up?","o":["multicultural","flood","hooded","luggage"],"a":2},{"t":"mc","s":"Which word has a different sound from bike?","o":["linen","height","biased","mild"],"a":0},{"t":"mc","s":"Which word has a different sound from bird?","o":["merge","firm","journalist","heart"],"a":3},{"t":"mc","s":"Which word has a different sound from horse?","o":["launch","drought","stalk","yawn"],"a":1},{"t":"mc","s":"Which word has a different sound from train?","o":["baggage","faint","lay","ache"],"a":0},{"t":"mc","s":"Which word has a different sound from chess?","o":["scratch","machine","cello","chilly"],"a":1},{"t":"mc","s":"Which word has a different sound from boot?","o":["loose","blood","chew","lose"],"a":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["neigh","bour","hood"],"a":0},{"t":"syl","s":"","o":["ob","jec","tive"],"a":1},{"t":"syl","s":"","o":["co","mmen","ta","tor"],"a":0},{"t":"syl","s":"","o":["eye","brow"],"a":0},{"t":"syl","s":"","o":["vi","o","li","nist"],"a":2},{"t":"syl","s":"","o":["ex","port (verb)"],"a":1},{"t":"syl","s":"","o":["tur","bu","lence"],"a":0},{"t":"syl","s":"","o":["mul","ti","na","tio","nal"],"a":2},{"t":"syl","s":"","o":["au","to","ma","ted"],"a":0},{"t":"syl","s":"","o":["un","con","scious"],"a":1}]}]},{"k":"r","name":"Reading","title":"A Step In The Right Direction","text":["It was once famously said that some things in life – like paying taxes and death – are inevitable. And leaving education trying to find employment is something that young people everywhere have to face. But despite the large amount of research that has been undertaken on young people in the job market, relatively little is known about what happens once young people start their first job. A team of researchers from Leeds Metropolitan University looked into this aspect. The survey focused on 30 people and 39 employers, and addressed a range of issues in relation to recruitment, employment, and particularly young people entering into the workplace.","It is clear from the interviews with young people that, for the vast majority, the idea of a ‘job for life’ no longer exists. While some had clear career ambitions, the majority appeared to be unclear on what they wanted to do. One consequence of this is that many young people saw their early work experiences as temporary – a ‘stop gap’ until their ideas on what they wanted to do had developed, or simply a way of earning money to pursue other ambitions such as travel.","This tendency has also been noted by many employers, and is particularly disappointing to smaller businesses looking for long-term loyalty in their staff. However, some employers – for example in areas such as financial services and call centres – had adjusted to the new situation, and appeared to accept that they cannot expect young people to be loyal and see a long-term future with one employer. Like a number of other studies, the findings confirm that employers tend to focus on ‘softer’ skills and behavioural qualities in the recruitment process, with a less prominent role played by formal qualifications. The opinions of this sample of young people were remarkably consistent with those of the employers. Most of the young people seemed to have understood the message that formal qualifications are often a necessary, but not sufficient, condition for obtaining the types of jobs which they hope to do in the future. They recognized that skills like communication, team-working, organization, and customer service are all important. There was evidence that many young people had clearly worked on developing such skills.","Where there does appear to be a significant difference of opinion between the views of young people and employers related to the extent to which young people actually possess the necessary ‘employability’ skills. By and large, the young people interviewed were confident in their ability to demonstrate these skills and qualities. Employers, on the whole, were much less positive about this, often feeling that educational institutions were focusing too strongly on academic skills and qualifications, at the expense of employability.","Another area where employers’ and young peoples’ views differed was in relation to Information Technology (IT) skills. When asked about the things they value most about young recruits, many employers mentioned their ability with computers. On the other hand, few young people mentioned this explicitly. The probable explanation is that young people simply take their IT skills for granted, often not realizing how valuable they might be to some employers. Encouraging young people to be more positive about this aspect might help some to improve the way they are viewed by potential employers.","In terms of the inductions provided for their young recruits, the results of this study confirmed both expectations and the findings of earlier research – that employers vary widely in the nature of the training they provide.","Differences included the length of time the inductions ran, how formal the training was, and how often training occurred. The reaction of most young people to the induction they had experienced was positive, or at least neutral. There is clearly a tension between the need for new recruits to become good at their jobs, and their understandable desire to get involved as quickly as possible.","From the point of view of the employer, much depended upon the nature of the job, the type of employer (particularly size and sector), and the frequency with which they recruit young people. In general, the more regularly young people were recruited and the larger the employer, the more formal the induction process.","In uncertain economic times, it seems that young people more than ever are having to do all they can to find employment."],"hl":[],"parts":[{"ins":"Read the article. For questions 1–5, choose the correct answer (A, B, C, or D). Two marks each.","items":[{"t":"mc","s":"The survey revealed that, in general, young people …","o":["do not value the early work experience they gain in any way.","are unconvinced they will do the same job until they retire.","would prefer to have a gap year before starting higher education.","are unsure about which jobs they want to do when they leave school."],"a":1,"w":2,"abcd":1},{"t":"mc","s":"What do employers think about formal qualifications?","o":["They are less important than behavioural qualities.","They are more important than behavioural qualities.","They are equally as important as behavioural qualities.","They are more important than behavioural qualities for certain jobs only."],"a":0,"w":2,"abcd":1},{"t":"mc","s":"What can we learn from the survey about young people and IT skills?","o":["Employers do not assume that all young employees have good IT skills.","Young people need to perfect their IT skills before starting work for an employer.","Young people should promote their IT skills to employers more than they do currently.","Employers do not enjoy feeling inadequate as young people's IT skills are often superior to theirs."],"a":2,"w":2,"abcd":1},{"t":"mc","s":"The survey suggests that young people themselves value skills such as being able to …","o":["get the job done faster than others.","get new business for the company.","get better results than colleagues.","get on with other people in the workplace."],"a":3,"w":2,"abcd":1},{"t":"mc","s":"Induction processes vary in terms of …","o":["where they are carried out.","who they are reviewed by.","when they take place.","what they focus on."],"a":2,"w":2,"abcd":1}]}]},{"k":"w","name":"Writing","task":"Write a report on the following topic: 'Workplaces of the future'. Write 140–180 words.","bullets":["say what you think the workplaces of the future will be like","say why you think changes in the workplace will take place","discuss how the changes will affect employees' lives"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five teenagers talk about trips they have made with their families. Choose from the list (A–F) what each speaker says they have learned as a result of going on the trip. There is one extra letter you do not need to use.","list":["You can learn things from family members.","It's good to have a positive attitude.","Be realistic about how much time you need for things before you go.","Things need to be carefully organized beforehand.","Travel can make you appreciate home more.","You can benefit from unusual experiences."],"script":[["Speaker 1","We went camping in Scotland, and Dad had planned everything – maps, food, where we'd stay each night. When the weather turned bad, we still knew exactly where to go. I learned that careful planning really pays off."],["Speaker 2","We visited my grandparents' village in Greece. My grandmother taught me to cook, and my grandfather told me stories about his life. I learned so much from them."],["Speaker 3","We spent a month travelling round India by train. It was amazing, but when I got home I couldn't believe how much I'd missed my own bed and a hot shower!"],["Speaker 4","My parents took us to Mongolia, and we stayed with a nomad family in their tent. It was so different from anything I knew – I think unusual experiences like that are really good for you."],["Speaker 5","Our flight was cancelled and we had to spend the night at the airport. My mum just laughed and turned it into an adventure. I learned that staying positive and cheerful makes everything easier."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":1,"gap":1}]},{"ins":"Listen to a talk by a young dancer who is doing a course at the Youth Ballet School. Choose the correct answer.","script":[["Sophie","Hi, I'm Sophie, and I'm sixteen. I'm in my first year at the Youth Ballet School. People think you have to be a top dancer to get in, but that's not really true. What the teachers look for is whether you can cope with the demands of the course – the long hours and the hard training. Some people apply several times, but I got in on my first try."],["Sophie","The audition had two rounds. In the first round I was really nervous, because the judges were sitting so close to us – just a metre away – and I could see them writing notes. I didn't feel confident at all. There were about forty other dancers, but I didn't really notice them."],["Sophie","The letter arrived three weeks later. It said I'd been offered a place, and that they'd thought very carefully about each dancer's audition. I was really pleased about that – it meant I'd earned it. It didn't mention any particular role, but that didn't matter to me."],["Sophie","Now we rehearse every day for our winter show. I didn't expect it to be so tiring – I'm exhausted every evening! And rehearsing on stage isn't any easier than in the studio."],["Sophie","As for the future, I know only a few dancers reach the very top, so I'm not saying I'll be a star. I'm also studying for my exams, just in case. But I really hope I'll be able to earn a living from dancing."]],"items":[{"t":"mc","s":"According to Sophie, young people accepted onto the course ___.","o":["must have achieved a high level in ballet","need to show that they are able to meet its demands","have usually applied for a place more than once"],"a":1},{"t":"mc","s":"During the first round of her successful audition, Sophie ___.","o":["felt confident in her ability to do well","worried about being too close to the judges","was put off by the number of people taking part"],"a":1},{"t":"mc","s":"When she heard that she'd got a place at the School, Sophie was ___.","o":["angry because her letter had been delayed","worried that no particular role was mentioned","satisfied that the school had made a careful choice"],"a":2},{"t":"mc","s":"Sophie admits that rehearsing is ___.","o":["surprisingly tiring","easier to do on stage","improving her dancing"],"a":0},{"t":"mc","s":"Sophie says that in the future ___.","o":["she won't consider alternatives to dancing","she hopes she'll be able to make a living by dancing","she's determined to become a top professional dancer"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["Which living person / most admire?","What / change about your life so far?","What / make / a great city?","Is / important / be / happy / your job? Why / Why not?","When / last feel disappointed?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute on a topic the teacher chooses from the course. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Choose one of the statements. Say if you agree or disagree and give reasons.","prompts":["'It would be better for family life if people worked four days a week instead of five.'","'If you don't have a healthy lifestyle, you shouldn't be allowed free medical care.'","'People who don't recycle or who use too much energy at home should have to pay a fine.'"]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}],"kind2":"end"});
TESTS.push({"id":"endb","kind":"file","title":"End-of-course Test B","focus":"Grammar, vocabulary and pronunciation from the whole of English File Upper-intermediate (Files 1–10).","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Complete the sentences with one word.","items":[{"t":"tx","s":"Andy scored a really good goal, ___ he?","a":["didn't"]},{"t":"tx","s":"I wish you ___ tap your pen on the table all the time, it's very annoying.","a":["wouldn't"]},{"t":"tx","s":"Can you hear the people next door? It sounds as ___ they're fighting again.","a":["if","though"]},{"t":"tx","s":"Do you feel ___ listening to some music?","a":["like"]},{"t":"tx","s":"It was ___ a surprise when Pete told us we were going to the coast!","a":["such"]},{"t":"tx","s":"Neither Sara ___ Michael wanted to join the choir.","a":["nor"]},{"t":"tx","s":"I didn't ___ to like olives but I really love them now.","a":["use"]},{"t":"tx","s":"Does anyone know ___ this seat is taken?","a":["if","whether"]},{"t":"tx","s":"You can't ___ other people for your problems – you have to take responsibility yourself.","a":["blame"]},{"t":"tx","s":"I don't go to the theatre very often, but my brother ___.","a":["does"]},{"t":"tx","s":"We're ___ the fence repaired next week – it got blown over in the storm.","a":["having","getting"]},{"t":"tx","s":"There's ___ food in the house! We need to go to the supermarket.","a":["no"]},{"t":"tx","s":"I ___ have been stupid to buy that car for £4,000! It's worth much less.","a":["must"]},{"t":"tx","s":"I can't ___ used to your new hairstyle – it's so different!","a":["get"]},{"t":"tx","s":"You'd ___ call a doctor if your temperature is still high.","a":["better"]}]},{"ins":"Complete the sentences with the correct word(s).","items":[{"t":"mc","s":"___ the long train journey, it was a good holiday.","o":["Although","In spite","Despite"],"a":2},{"t":"mc","s":"I quite like the dogs my brother has, but on the whole I prefer ___ cats.","o":["(–)","some","the"],"a":0},{"t":"mc","
