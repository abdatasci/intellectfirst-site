TESTS.push({"id":"f1a","kind":"file","title":"File 1 Test A","focus":"Question formation, auxiliary verbs, the… the + comparatives; personality adjectives, job interviews.","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Order the words to make questions and sentences.","items":[{"t":"ord","s":"","wd":["cinema","night","the","go","last","you","did","to","?"],"a":["Did you go to the cinema last night?"]},{"t":"ord","s":"","wd":["seen","film","the","you've","isn't","this","ever","best","?"],"a":["Isn't this the best film you've ever seen?"]},{"t":"ord","s":"","wd":["higher","up","heating","colder","the","it",",","the","the","I","gets","turn"],"a":["The colder it gets, the higher I turn the heating up.","The colder it gets, the higher I turn up the heating."]},{"t":"ord","s":"","wd":["do","to","how","for","people","need","cook","we","many","?"],"a":["How many people do we need to cook for?"]},{"t":"ord","s":"","wd":["nationalities","class","the","what","your","students","in","are","?"],"a":["What nationalities are the students in your class?"]},{"t":"ord","s":"","wd":["to","aren't","you","home","glad","didn't","you","go","that","decide","?"],"a":["Aren't you glad that you didn't decide to go home?"]},{"t":"ord","s":"","wd":["speak","you","be","better","practise",",","to","more","the","you","will","the","able"],"a":["The more you practise, the better you will be able to speak."]},{"t":"ord","s":"","wd":["eating","chocolate","should","be","much","you","that","?"],"a":["Should you be eating that much chocolate?"]}]},{"ins":"Complete the sentences with an auxiliary verb.","items":[{"t":"tx","s":"You've been to Greece before, ___ you?","a":["haven't","have not"]},{"t":"tx","s":"A: Will Rhona be coming to the meeting?\nB: No, she ___. She's in Berlin.","a":["won't","will not"]},{"t":"tx","s":"We both like skiing, but none of our children ___.","a":["do"]},{"t":"tx","s":"A: I'd love to be an actor.\nB: ___ you? I think I'd find it too stressful.","a":["Would"]},{"t":"tx","s":"A: I don't think Sam wants to come on holiday with us this year.\nB: He ___ want to! He told me yesterday.","a":["does"]},{"t":"tx","s":"A: We're having a Chinese takeaway tonight.\nB: So ___ we!","a":["are"]}]},{"ins":"Complete the indirect questions.","items":[{"t":"tx","s":"Why did she leave without saying goodbye?\nI wonder ___?","a":["why she left without saying goodbye"]},{"t":"tx","s":"When does college end for the summer?\nI'm not sure ___.","a":["when college ends for the summer"]},{"t":"tx","s":"Can we bring guests to the party?\nDo you have any idea ___?","a":["if we can bring guests to the party","whether we can bring guests to the party","whether or not we can bring guests to the party"]},{"t":"tx","s":"What type of batteries does this need?\nDo you know ___?","a":["what type of batteries this needs"]},{"t":"tx","s":"Where are the toilets?\nCan you tell me ___?","a":["where the toilets are"]},{"t":"tx","s":"How many people have you invited?\nI can't remember ___?","a":["how many people you have invited","how many people you invited"]}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"It's difficult to get Henry to spend money – he's rather tight-f___.","a":["isted","fisted","tight-fisted"],"show":"tight-fisted"},{"t":"tx","s":"Jason will be relaxed about you borrowing his bike – he's very l___-back.","a":["aid","laid","laid-back"],"show":"laid-back"},{"t":"tx","s":"I've forgotten my PIN number again – I'm getting quite a___-minded these days.","a":["bsent","absent","absent-minded"],"show":"absent-minded"},{"t":"tx","s":"Why did you say that to Jane when you told me the opposite? You're so two-f___.","a":["aced","faced","two-faced"],"show":"two-faced"},{"t":"tx","s":"You should think about other people more – you're too s___-centred.","a":["elf","self","self-centred"],"show":"self-centred"},{"t":"tx","s":"You're not a difficult and moody person – you're very well-b___ on the whole.","a":["alanced","balanced","well-balanced"],"show":"well-balanced"},{"t":"tx","s":"Don't say anything that might make Jack angry – he's very bad-t___.","a":["empered","tempered","bad-tempered"],"show":"bad-tempered"},{"t":"tx","s":"If Alan wants something he fights until he gets it – he's extremely strong-w___.","a":["illed","willed","strong-willed"],"show":"strong-willed"},{"t":"tx","s":"Gina will be happy to go wherever you want to – she's pretty easy-g___.","a":["oing","going","easy-going"],"show":"easy-going"},{"t":"tx","s":"Fred is always ready to try new ways of doing things – he's o___-minded.","a":["pen","open","open-minded"],"show":"open-minded"}]},{"ins":"Choose the correct word.","items":[{"t":"mc","s":"My dad is a bit ___.","o":["open-minded","narrow-minded","good-tempered"],"a":1},{"t":"mc","s":"This food is extremely ___.","o":["OK","alright","delicious"],"a":2},{"t":"mc","s":"I like working with Jake, but he is rather ___.","o":["open-minded","hard-working","slow"],"a":2},{"t":"mc","s":"I think you're being a bit ___.","o":["self-confident","self-centred","good-tempered"],"a":1}]},{"ins":"Choose the correct words for the definitions.","items":[{"t":"mc","s":"destroy someone's confidence","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":0},{"t":"mc","s":"person looking for employment","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":2},{"t":"mc","s":"person who has applied for a job","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":3},{"t":"mc","s":"popular way of doing something","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":1},{"t":"mc","s":"the first to do something in a new and different way","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":4},{"t":"mc","s":"very strange and unusual","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":5}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Match the words with the same sound. (Example: change → approach)","items":[{"t":"ms","s":"per*s*uade","o":["flu*s*tered","a*g*ency","fini*sh*","two-fa*c*ed","cru*sh*"],"a":[0,3],"pr":1},{"t":"mc","s":"*j*ob-seeker","o":["flu*s*tered","a*g*ency","fini*sh*","two-fa*c*ed","cru*sh*"],"a":1,"pr":1},{"t":"ms","s":"*s*ure","o":["flu*s*tered","a*g*ency","fini*sh*","two-fa*c*ed","cru*sh*"],"a":[2,4],"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["de","man","ding"],"a":1},{"t":"syl","s":"","o":["re","cruit","ment"],"a":1},{"t":"syl","s":"","o":["bi","zarre"],"a":1},{"t":"syl","s":"","o":["fla","pping"],"a":0},{"t":"syl","s":"","o":["di","rec","tor"],"a":1}]}]},{"k":"r","name":"Reading","title":"Personality Tests: Can They Identify The Real You?","text":["The next time you apply for a job, you might be asked to take a personality test. Even though the companies that make the tests are not keen on them actually being used to select staff during the interview process, the business of personality is big and growing. But do the tests work?","A few years back, my niece was looking for a summer job. [1] But before the interview, she had to fill out an online application including a psychometric test – a test which would reveal a lot about her personality. She explained that there was a whole section on ethics and how you'd react in a particular situation, like dealing with a difficult customer, for example. And apparently the message was pretty clear – if you're easily annoyed, don't be a waitress.","[2] Personality tests are now appearing in all types of industry. In a global recession, many firms want to be sure they are employing the most suitable person for the job. They cannot afford to pick the wrong one.","Smaller profits also mean staff are working under more stress. Therefore, companies want to make sure their employees get on with each other. Disagreements are costly and inefficient.","In the US alone, there are about 2,500 personality tests on the market. One of the most popular is called the Myers-Briggs Type Indicator, or MBTI. [3] It has also been adopted by governments and military agencies around the world.","'Myers-Briggs is the most successful psychometric test out there and deservedly so,' says Rachel Robinson of the consultancy firm YSC in central London. 'It has been a fantastic vehicle for people to think about themselves and how others are different.'","Perhaps its attraction lies in its simplicity – according to the MBTI, we all match one of 16 character types. But it's the fact that it is so straightforward that makes some people suspicious.","Like many personality tests, MBTI is based on the work of Carl Jung, the Swiss psychiatrist who, together with Sigmund Freud, helped lay the foundations of modern psychology. Jung developed the idea of opposite pairs of characteristics. This refers to qualities such as being friendly or unfriendly, or lazy or hard-working, which are present in all of us. [4]","The MBTI was invented thanks to an awkward relationship between a woman and her future son-in-law. Katherine Briggs, a wealthy housewife from Washington DC, realized Clarence Myers was a good match for her daughter, Isabel, when she brought him home from college. He seemed like a nice young man, but his way of thinking was so strange to her that she turned to books for help.","Jung's Psychological Types fascinated her, and soon Isabel was infected by her mother's enthusiasm. [5] Jung only identified eight personality types, but Isabel Briggs Myers doubled that number. According to the MBTI, everybody can be described by four letters chosen out of a total of eight, for example ISFJ or ENTP. The various combinations of letters make up the sixteen personality types.","Apparently the overwhelming majority of the 2.5 million Americans who take the MBTI assessment each year feel their results do fit their personalities. However, the Myers-Briggs Foundation itself discourages the use of the test for hiring and firing. Instead, they see it as a means of getting employees to think about how they interact with colleagues and work as a team. So, if you are asked to do a personality test in the future, think carefully about the reason behind it. It may not be for the reason you thought!"],"sents":["Used by 89 of the top 100 companies, it has been translated into 24 languages.","She heard the tips were good in a restaurant in Chicago, and decided to apply.","Over the next two decades, the pair became very interested in how people behave.","On the other hand, according to one author, as many as 75% of test takers achieve a different personality type when tested for a second time.","He suggested that in terms of each pair of qualities, we tend to be one or the other.","Andrea was surprised, but was faced with a similar test when she applied to work in a bookshop."],"parts":[{"ins":"Read the article about personality tests. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":2,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write an email to your friend telling him / her about something unusual that happened to you recently. Write 140–180 words.","bullets":["say what happened to you","explain where you were when it happened","describe how you acted in this situation"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about which characteristics in a person annoy them. Choose from the list (A–F) which characteristic each person mentions. There is one extra letter you do not need to use.","list":["behaving carelessly","being untidy","behaving selfishly","behaving rudely","showing unreliability","being impatient"],"script":[["Speaker 1","My flatmate is lovely, but she leaves her clothes everywhere – on the sofa, in the bathroom, even in the kitchen. And she never washes a cup until there are none left. I'm not a perfectionist, but I'd like to be able to see the floor!"],["Speaker 2","What really gets to me is when people say they'll do something and then don't. My brother promised to pick me up from the airport last month and just didn't turn up. He's always like that – you simply can't count on him."],["Speaker 3","I can't stand it when people don't say please or thank you. In the shop where I work, some customers throw their money on the counter without even looking at me. It only takes a second to be polite."],["Speaker 4","My colleague always takes the best parking space, eats the last biscuit, and books his holidays first so nobody else can have August off. He only ever thinks about what he wants."],["Speaker 5","My son borrowed my car last week and brought it back with a long scratch down one side. He hadn't even noticed! He drops his phone, loses his keys… he just doesn't pay attention to what he's doing."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":1,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":0,"gap":1}]},{"ins":"Listen to a young businessman talking about job interviews. Choose the correct answer.","script":[["Graeme","I had my first proper job interview last month, for a marketing company in Leeds. I'd spent days preparing, so I felt ready, and I kept my answers short and to the point, because my tutor always told me that interviewers get bored by long speeches."],["Graeme","The hardest part was when they asked me to give examples of my successes – times I'd achieved something at university or at work. My mind just went blank, and looking back, I don't think I gave them enough examples."],["Graeme","The two people interviewing me were quite serious – there wasn't much smiling – but they were very helpful. When I didn't understand a question, they explained it in a different way."],["Graeme","I'd had a rough idea of what they'd ask, from reading about the company, and I think I answered most of the questions well, apart from that one."],["Graeme","I felt confident about my qualifications – I've got a good degree – but when I left, I was sure they'd choose someone with more experience. In fact, they offered me the job a week later!"],["Graeme","My advice? Of course, be on time and look smart, but the most important thing on the day is to be yourself. Act the way you normally do. They want to see the real you."]],"items":[{"t":"mc","s":"For Graeme the hardest thing about the interview was finding ___.","o":["examples of his successes","ways to keep his answers short","time to get ready"],"a":0},{"t":"mc","s":"Graeme says the people who interviewed him were ___.","o":["serious","friendly","clever"],"a":0},{"t":"mc","s":"Graeme thinks he answered ___ of the questions well.","o":["a few","most","all"],"a":1},{"t":"mc","s":"After the interview, Graeme thought someone with ___ would be chosen.","o":["a different background","different qualifications","more experience"],"a":2},{"t":"mc","s":"According to Graeme, on the day of the interview the most important thing is to be ___.","o":["on time","as you usually are","well-dressed"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["How long / learn English?","How / relax?","What / enjoy / doing / when / have / some free time?","Do / spend / much time / use / the internet? Why / Why not?","What / earliest memory?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about friendship: what makes a good friend, and how friendships change over time. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'It is important for friends to be interested in the same things.'"]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
TESTS.push({"id":"f1b","kind":"file","title":"File 1 Test B","focus":"Question formation, auxiliary verbs, the… the + comparatives; personality adjectives, job interviews.","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Order the words to make questions and sentences.","items":[{"t":"ord","s":"","wd":["do","to","how","for","guests","need","cook","we","many","?"],"a":["How many guests do we need to cook for?"]},{"t":"ord","s":"","wd":["to","aren't","you","home","pleased","didn't","you","go","that","decide","?"],"a":["Aren't you pleased that you didn't decide to go home?"]},{"t":"ord","s":"","wd":["speak","you","be","better","practise",",","to","more","the","you","will","the","able"],"a":["The more you practise, the better you will be able to speak."]},{"t":"ord","s":"","wd":["seen","film","the","you've","isn't","this","ever","best","horror","?"],"a":["Isn't this the best horror film you've ever seen?"]},{"t":"ord","s":"","wd":["theatre","night","the","go","last","you","did","to","?"],"a":["Did you go to the theatre last night?"]},{"t":"ord","s":"","wd":["eating","really","sugar","should","be","much","you","that","?"],"a":["Should you really be eating that much sugar?","Should you be eating that much sugar really?","Really, should you be eating that much sugar?"]},{"t":"ord","s":"","wd":["nationalities","class","the","what","your","people","in","are","?"],"a":["What nationalities are the people in your class?"]},{"t":"ord","s":"","wd":["higher","up","heating","colder","the","it",",","the","the","I","gets","turn"],"a":["The colder it gets, the higher I turn the heating up.","The colder it gets, the higher I turn up the heating."]}]},{"ins":"Complete the sentences with an auxiliary verb.","items":[{"t":"tx","s":"We both like sailing, but none of our friends ___.","a":["do"]},{"t":"tx","s":"A: We're having an Indian meal this evening.\nB: So ___ we!","a":["are"]},{"t":"tx","s":"You'd been to the States before, ___ you?","a":["hadn't","had not"]},{"t":"tx","s":"A: I'd love to be a doctor.\nB: ___ you? I think I'd find it too demanding.","a":["Would"]},{"t":"tx","s":"A: Will Anna be coming to the conference?\nB: No, she ___. She's in Paris.","a":["won't","will not"]},{"t":"tx","s":"A: I don't think Belinda wants to come to the beach this afternoon.\nB: She ___ want to! She told me this morning.","a":["does"]}]},{"ins":"Complete the indirect questions.","items":[{"t":"tx","s":"Where are the exits?\nCan you tell me ___?","a":["where the exits are"]},{"t":"tx","s":"What type of fuel does this need?\nDo you know ___?","a":["what type of fuel this needs"]},{"t":"tx","s":"How many colleagues have you asked to come?\nI can't remember ___?","a":["how many colleagues you have asked to come","how many colleagues you asked to come"]},{"t":"tx","s":"Why did she go out without taking her coat?\nI wonder ___?","a":["why she went out without taking her coat"]},{"t":"tx","s":"Can we take friends to the show?\nDo you have any idea ___?","a":["if we can take friends to the show","whether we can take friends to the show","whether or not we can take friends to the show"]},{"t":"tx","s":"When does the office close for Easter?\nI'm not sure ___.","a":["when the office closes for Easter"]}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"Kevin gets angry really easily – he's extremely bad-t___.","a":["empered","tempered","bad-tempered"],"show":"bad-tempered"},{"t":"tx","s":"I'm always happy to try something new and different – I'm pretty o___-minded.","a":["pen","open","open-minded"],"show":"open-minded"},{"t":"tx","s":"If I really want something I'll do anything to get it – I'm very strong-w___.","a":["illed","willed","strong-willed"],"show":"strong-willed"},{"t":"tx","s":"Jackie will go along with whatever you want to do – she's pretty easy-g___.","a":["oing","going","easy-going"],"show":"easy-going"},{"t":"tx","s":"Brian hardly ever spends any money – he's very tight-f___.","a":["isted","fisted","tight-fisted"],"show":"tight-fisted"},{"t":"tx","s":"Jason won't mind you using his computer – he's very l___-back.","a":["aid","laid","laid-back"],"show":"laid-back"},{"t":"tx","s":"Why did you tell Paula that and tell me something different? You're so two-f___.","a":["aced","faced","two-faced"],"show":"two-faced"},{"t":"tx","s":"You ought to consider other people's needs sometimes – you're too s___-centred.","a":["elf","self","self-centred"],"show":"self-centred"},{"t":"tx","s":"I don't think she's a difficult character – she seems very well-b___ on the whole.","a":["alanced","balanced","well-balanced"],"show":"well-balanced"},{"t":"tx","s":"I've forgotten my password again – I'm becoming more a___-minded these days.","a":["bsent","absent","absent-minded"],"show":"absent-minded"}]},{"ins":"Choose the correct word.","items":[{"t":"mc","s":"We enjoy working with Chris but she is rather ___.","o":["open-minded","hard-working","slow"],"a":2},{"t":"mc","s":"I'm a bit ___ sometimes.","o":["self-confident","self-centred","good-tempered"],"a":1},{"t":"mc","s":"This salad is extremely ___.","o":["OK","alright","delicious"],"a":2},{"t":"mc","s":"I think your parents are a bit ___.","o":["open-minded","narrow-minded","good-tempered"],"a":1}]},{"ins":"Choose the correct words for the definitions.","items":[{"t":"mc","s":"popular way of doing something","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":1},{"t":"mc","s":"the first to do something in a new and different way","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":4},{"t":"mc","s":"very strange and unusual","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":5},{"t":"mc","s":"person looking for employment","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":2},{"t":"mc","s":"person who applies for a job","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":3},{"t":"mc","s":"destroy someone's confidence","o":["crush somebody","trend","job-seeker","candidate","pioneer","bizarre"],"a":0}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Match the words with the same sound. (Example: agency → bandage)","items":[{"t":"ms","s":"bi*z*arre","o":["deci*s*ion","terra*c*ed","noi*s*e","flu*s*tered","ja*zz*"],"a":[2,4],"pr":1},{"t":"ms","s":"per*s*uade","o":["deci*s*ion","terra*c*ed","noi*s*e","flu*s*tered","ja*zz*"],"a":[1,3],"pr":1},{"t":"mc","s":"unu*s*ual","o":["deci*s*ion","terra*c*ed","noi*s*e","flu*s*tered","ja*zz*"],"a":0,"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["job","-see","ker"],"a":0},{"t":"syl","s":"","o":["head","hun","ter"],"a":0},{"t":"syl","s":"","o":["fa","sci","nate"],"a":0},{"t":"syl","s":"","o":["di","rec","tor"],"a":1},{"t":"syl","s":"","o":["news","pa","per"],"a":0}]}]},{"k":"r","name":"Reading","title":"The Myers-Briggs Type Indicator","text":["The business of personality tests is big and growing. As more people are looking for work, the competition for jobs gets greater and greater, and companies are looking to new ways to find the best person for the job. So the next time you apply for a job, you might be asked to take a personality test. How effective are these tests, though?","Several years ago, Andrea was looking for a summer job to pay her way through college. She heard the tips were good in a restaurant in Chicago, and decided to apply. But before the interview, she had to fill out an online application including a psychometric test – a test which would reveal a lot about her personality. She explained that there was a whole section on ethics and how you'd react in a given situation, like dealing with a difficult customer, for example. [1]","Andrea was surprised, but was faced with a similar test when she applied to work in a bookshop. Personality tests are now appearing in all types of industry. In a global recession, many firms want to be sure they are employing the most suitable person for the job. They cannot afford to pick the wrong one. Smaller profits also mean staff are working under more stress. [2] Disagreements are costly and inefficient.","In the US alone, there are about 2,500 personality tests on the market. [3] Used by 89 of the top 100 companies, it has been translated into 24 languages. It has also been adopted by governments and military agencies around the world. 'Myers-Briggs is the most successful psychometric test out there and deservedly so,' says Rachel Robinson of the consultancy firm YSC in central London. 'It has been a fantastic vehicle for people to think about themselves and how others are different.'","Perhaps its attraction lies in its simplicity – according to the MBTI, we all match one of 16 character types. But it's the fact that it is so straightforward that makes some people suspicious.","Like many personality tests, MBTI is based on the work of Carl Jung, the Swiss psychiatrist who, together with Sigmund Freud, helped lay the foundations of modern psychology. Jung developed the idea of opposed pairs of characteristics. [4] He suggested that in terms of each pair of qualities, we tend to be one or the other.","The MBTI was invented thanks to an awkward relationship between a woman and her future son-in-law. Katherine Briggs, a wealthy housewife from Washington DC, realized Clarence Myers was a good match for her daughter, Isabel, when she brought him home from college. [5]","Jung's Psychological Types fascinated her and soon Isabel was infected by her mother's enthusiasm. Over the next two decades, the pair became very interested in how people behave. Jung only identified eight personality types, but Isabel Briggs Myers eventually doubled that number. According to the MBTI, everybody can be described by four letters chosen out of a total of eight, for example ISFJ or ENTP. The various combinations of letters make up the sixteen personality types.","Apparently the overwhelming majority of the 2.5 million Americans who take the MBTI assessment each year feel their results do fit their personalities. However, the Myers-Briggs Foundation itself discourages the use of the test for hiring and firing. Instead, they see it mainly as a means of getting employees to think about how they interact with colleagues and work as a team. So, if you are asked to do a personality test at some point in the future, think carefully about the reason behind it. It may not be for the reason you thought!"],"sents":["Therefore, companies want to make sure their employees get on with each other.","He seemed like a nice young man, but his way of thinking was so strange to her that she turned to books for help.","On the other hand, according to one author, as many as 75% of test takers achieve a different personality type when tested for a second time.","And apparently the message was pretty clear – if you're easily annoyed, don't be a waitress.","This refers to qualities such as being friendly or unfriendly, or lazy or hard-working, which are present in all of us.","One of the most popular is called the Myers-Briggs Type Indicator, or MBTI."],"parts":[{"ins":"Read the article about personality tests. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":3,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write an email to your friend telling him / her about something unusual that happened to you recently. Write 140–180 words.","bullets":["say what happened to you","explain where you were when it happened","describe how you acted in this situation"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about which characteristics in a person annoy them. Choose from the list (A–F) which characteristic each person mentions. There is one extra letter you do not need to use.","list":["being messy","showing impoliteness","not being reliable","being jealous","not considering other people","not being careful"],"script":[["Speaker 1","My flatmate is lovely, but she leaves her clothes everywhere – on the sofa, in the bathroom, even in the kitchen. And she never washes a cup until there are none left. I'm not a perfectionist, but I'd like to be able to see the floor!"],["Speaker 2","What really gets to me is when people say they'll do something and then don't. My brother promised to pick me up from the airport last month and just didn't turn up. He's always like that – you simply can't count on him."],["Speaker 3","I can't stand it when people don't say please or thank you. In the shop where I work, some customers throw their money on the counter without even looking at me. It only takes a second to be polite."],["Speaker 4","My colleague always takes the best parking space, eats the last biscuit, and books his holidays first so nobody else can have August off. He only ever thinks about what he wants."],["Speaker 5","My son borrowed my car last week and brought it back with a long scratch down one side. He hadn't even noticed! He drops his phone, loses his keys… he just doesn't pay attention to what he's doing."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":1,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":5,"gap":1}]},{"ins":"Listen to a young businessman talking about job interviews. Choose the correct answer.","script":[["Graeme","I had my first proper job interview last month, for a marketing company in Leeds. I'd spent days preparing, so I felt ready, and I kept my answers short and to the point, because my tutor always told me that interviewers get bored by long speeches."],["Graeme","The hardest part was when they asked me to give examples of my successes – times I'd achieved something at university or at work. My mind just went blank, and looking back, I don't think I gave them enough examples."],["Graeme","The two people interviewing me were quite serious – there wasn't much smiling – but they were very helpful. When I didn't understand a question, they explained it in a different way."],["Graeme","I'd had a rough idea of what they'd ask, from reading about the company, and I think I answered most of the questions well, apart from that one."],["Graeme","I felt confident about my qualifications – I've got a good degree – but when I left, I was sure they'd choose someone with more experience. In fact, they offered me the job a week later!"],["Graeme","My advice? Of course, be on time and look smart, but the most important thing on the day is to be yourself. Act the way you normally do. They want to see the real you."]],"items":[{"t":"mc","s":"Graeme feels that ___.","o":["he didn't give enough examples","his answers weren't always short enough","he didn't spend enough time getting ready"],"a":0},{"t":"mc","s":"Graeme thinks his interviewers are ___ people.","o":["successful","helpful","cheerful"],"a":1},{"t":"mc","s":"Graeme says he ___ what the questions in the interview would be.","o":["had a rough idea","had no idea","predicted in advance"],"a":0},{"t":"mc","s":"Graeme felt confident about his ___.","o":["experience","abilities","qualifications"],"a":2},{"t":"mc","s":"Graeme advises people to ___ during the interview.","o":["try to be confident","ask questions about the company","behave as normal"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["How long / learn English?","How / relax?","What / enjoy / doing / when / have / some free time?","Do / spend / much time / use / the internet? Why / Why not?","What / earliest memory?"]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'It's important for friends to be interested in the same things.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about friendship: what makes a good friend, and how friendships change over time. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
TESTS.push({"id":"f2a","kind":"file","title":"File 2 Test A","focus":"Present perfect simple and continuous, using adjectives as nouns, adjective order; illnesses and injuries, clothes and fashion.","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Complete the sentences with the present perfect simple or continuous form of the verbs in brackets.","items":[{"t":"tx","s":"Karen ___ (not post) much on Facebook recently.","a":["hasn't posted","hasn't been posting"]},{"t":"tx","s":"I ___ (never / see) you wearing a tie!","a":["have never seen"]},{"t":"tx","s":"We're exhausted because we ___ (garden) all day.","a":["have been gardening"]},{"t":"tx","s":"How many years ___ (your parents / have) this house?","a":["have your parents had"]},{"t":"tx","s":"How long ___ (you / learn) to drive?","a":["have you been learning"]},{"t":"tx","s":"This is the first time I ___ (hear) Lara sing. She's brilliant!","a":["have heard"]},{"t":"tx","s":"We ___ (know) Ed since we first came to Liverpool.","a":["have known"]},{"t":"tx","s":"My internet connection ___ (go) on and off a lot today.","a":["has been going"]}]},{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"___ are buying more and more cars.","o":["The Chinese","The Chineses"],"a":0},{"t":"mc","s":"We need to do more as a society to take care of ___.","o":["elderly","the elderly"],"a":1},{"t":"mc","s":"___ take a long time preparing their meals.","o":["The French","French"],"a":0},{"t":"mc","s":"___ seem to be suffering the most from government cuts.","o":["Poor","The poor"],"a":1},{"t":"mc","s":"The ___ have a reputation for stylish design.","o":["Italian","Italians"],"a":1},{"t":"mc","s":"Traffic lights often make sounds to help ___ cross the road.","o":["the blinds","the blind"],"a":1}]},{"ins":"Order the words to make sentences.","items":[{"t":"ord","s":"","wd":["brand","has","sports","orange","a","Jack","new","got","car","Italian"],"a":["Jack has got a brand new orange Italian sports car."]},{"t":"ord","s":"","wd":["yesterday","horrible","hat","red","wearing","a","big","what","was","Celia","!"],"a":["What a horrible big red hat Celia was wearing yesterday!"]},{"t":"ord","s":"","wd":["brother","gorgeous","had","linen","my","on","a","jacket","younger","new"],"a":["My younger brother had a gorgeous new linen jacket on.","My younger brother had on a gorgeous new linen jacket."]},{"t":"ord","s":"","wd":["little","found","stay","hotel","lovely","we","French","a","in","to"],"a":["We found a lovely little French hotel to stay in."]},{"t":"ord","s":"","wd":["the","some","black","I","scarves","market","nice","at","bought","silk","very"],"a":["I bought some very nice black silk scarves at the market.","At the market I bought some very nice black silk scarves."]},{"t":"ord","s":"","wd":["little","was","on","wooden","hill","beautiful","there","old","a","the","house"],"a":["There was a beautiful little old wooden house on the hill.","On the hill there was a beautiful little old wooden house."]}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Complete the words in the sentences.","items":[{"t":"tx","s":"I keep dropping things – I seem to be very c___ today.","a":["lumsy","clumsy"],"show":"clumsy"},{"t":"tx","s":"Becky can change from happy to upset for no particular reason – she's very m___.","a":["oody","moody"],"show":"moody"},{"t":"tx","s":"Don't you want to do this walk? You seem very un___.","a":["enthusiastic","unenthusiastic","willing","unwilling"],"show":"unenthusiastic"},{"t":"tx","s":"I don't feel safe going out on my own. I feel very v___.","a":["ulnerable","vulnerable"],"show":"vulnerable"},{"t":"tx","s":"Barry is so s___. He won't change his mind, even when he's obviously wrong.","a":["tubborn","stubborn"],"show":"stubborn"},{"t":"tx","s":"Sam seems very w___. He obviously knows a lot about life.","a":["ise","wise"],"show":"wise"}]},{"ins":"Choose the odd word out.","items":[{"t":"mc","s":"","o":["sneeze","cough","headache","sunburn"],"a":3},{"t":"mc","s":"","o":["bacteria","blister","virus","infection"],"a":1},{"t":"mc","s":"","o":["earache","dizzy","faint","pass out"],"a":0},{"t":"mc","s":"","o":["flu","a cold","injection","asthma"],"a":2},{"t":"mc","s":"","o":["painkillers","drugs","medicine","symptom"],"a":3},{"t":"mc","s":"","o":["bleed","wound","diarrhoea","bandage"],"a":2}]},{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"I like that ___ jumper with the green and blue squares.","o":["checked","striped"],"a":0},{"t":"mc","s":"I need this shirt in a bigger size – it's too ___.","o":["loose","tight"],"a":1},{"t":"mc","s":"That jacket is the perfect colour – it ___ those trousers.","o":["suits","matches"],"a":1},{"t":"mc","s":"You need some ___ shorts if you want to do some serious cycling.","o":["lycra","velvet"],"a":0},{"t":"mc","s":"If it's really hot tomorrow evening I'll wear my new ___ dress.","o":["long-sleeved","sleeveless"],"a":1},{"t":"mc","s":"We're going shopping in 15 minutes, so ___!","o":["get dressed","dress up"],"a":0},{"t":"mc","s":"Lisa prefers ___ clothes without any pattern.","o":["checked","plain"],"a":1},{"t":"mc","s":"Those shoes really ___ your jeans.","o":["go with","fit"],"a":0}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Match the words with the same sound. (Example: clothes → choking)","items":[{"t":"mc","s":"in*j*ection","o":["h*oo*ded","aller*g*y","c*ough*","l*oo*se","diarr*hoea*"],"a":1,"pr":1},{"t":"mc","s":"*ear*","o":["h*oo*ded","aller*g*y","c*ough*","l*oo*se","diarr*hoea*"],"a":4,"pr":1},{"t":"mc","s":"*o*ff","o":["h*oo*ded","aller*g*y","c*ough*","l*oo*se","diarr*hoea*"],"a":2,"pr":1},{"t":"mc","s":"b*oo*ts","o":["h*oo*ded","aller*g*y","c*ough*","l*oo*se","diarr*hoea*"],"a":3,"pr":1},{"t":"mc","s":"w*oo*llen","o":["h*oo*ded","aller*g*y","c*ough*","l*oo*se","diarr*hoea*"],"a":0,"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["poi","son","ing"],"a":0},{"t":"syl","s":"","o":["head","ache"],"a":0},{"t":"syl","s":"","o":["fa","shio","na","ble"],"a":0},{"t":"syl","s":"","o":["car","di","gan"],"a":0},{"t":"syl","s":"","o":["un","con","scious"],"a":1}]}]},{"k":"r","name":"Reading","title":"Stone-age Mini Skirt Discovered","text":["For more than 40 years, fashion experts have argued over the origins of the mini skirt. Some say British designer Mary Quant came up with the design in the 1960s. [1] And some experts even believe it made its first appearance in Hollywood ten years earlier.","But now archaeologists say the true origins of the mini skirt go back to the very beginning of civilization. They have uncovered evidence that Stone Age women were, in fact, wearing mini skirts more than 7,500 years ago. [2]","A series of stone statues wearing the prehistoric fashions were found at one of Europe's oldest known villages. [3] The findings in this ancient village push back the origins of fashion and art in Europe by hundreds of years, to a time when our ancestors were actually just learning about farming. 'According to the statues we found, young women were beautifully dressed, like today's girls,' said archaeologist Julka Kuzmanović-Cvetković.","The unnamed tribe of people lived between 5,400 and 4,700 BC in the 120-hectare site at what is now Pločnik in Serbia. Various things found at the site show us that they knew about trade, art, and how to sew. They celebrated beauty and produced 60 different forms of wonderful pottery and statues. [4] Women, it seems, have always paid attention to their appearance.","Little is known about the life of the people – known as the Vinča – who made the statues. The Vinča culture developed quickly between 5,500 and 4,000 BC in Bosnia, Serbia, Romania, and Macedonia. It got its name from the present-day village of Vinča on the Danube River near Belgrade where eight villages have been found.","The latest discoveries suggest these early farmers were more advanced than we think. The dead were buried in a tidy cemetery, houses had stoves, and there were special holes for rubbish. People slept on rugs and fur, made clothes of wool and leather, and kept animals. [5] This is clear because some of the things found include toys, such as animals and rattles of clay, and small, badly crafted pots apparently made by children at playtime. One of the most exciting finds for archaeologists was the discovery of a sophisticated metal workshop.","'This might prove that the Copper Age started in Europe at least 500 years earlier than we thought,' Dr Kuzmanović said.","The Copper Age represents the first use of tools by humans. It is thought to have started around 4,000 BC in south-east Europe, and earlier in the Middle East. The discovery of Europe's oldest underground mine at the nearby Mlava river suggested at the time that Vinča could be the first place in Europe to use metal, a theory which seems to be supported by the Pločnik site."],"sents":["The trend at the time was to wear them with short tops and bracelets.","This community was situated between rivers, mountains, and forests in what is now southern Siberia.","It was first discovered in 1927.","It also seems that they were especially fond of children.","However, others point to Frenchman André Courrèges.","According to Dr Kuzmanović, these not only represent the things they respected, but also things they got enjoyment from."],"parts":[{"ins":"Read the article about a historical discovery about fashion. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":2,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":3,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"Write an email to your friend telling him / her about a historic place of interest in your country. Write 140–180 words.","bullets":["say how old the place is","describe the place","explain why you like / don't like the place"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five young people talking about following fashion. Choose from the list (A–F) which problem each person mentions. There is one extra letter you do not need to use.","list":["the cost of clothes","the range of fashions available","the time it takes for delivery","the lack of sizes available","clothes which are badly made","the colours available"],"script":[["Speaker 1","I love following fashion, but honestly, I can't keep up. A pair of jeans that everyone's wearing costs more than I earn in a week. By the time I've saved up, they're out of fashion anyway."],["Speaker 2","I'm quite tall, and the shops near me only seem to stock small and medium. If I see something I like online, it's sold out in my size within a day. It's really frustrating."],["Speaker 3","Clothes just don't last any more. I bought a jumper last month and after two washes it had holes in it. And the seams on my new trousers came apart the first time I wore them."],["Speaker 4","I do all my shopping online, and the worst part is waiting. Last time I ordered a dress for a party, it took three weeks to arrive – the party was long over by then."],["Speaker 5","Every shop sells exactly the same things. You walk into one store and then the next, and it's the same few styles everywhere. There's no real choice any more."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":1,"gap":1}]},{"ins":"Listen to someone talking about a young woman who set up a fashion company. Choose the correct answer.","script":[["Presenter","Anna Morris started her online fashion business five years ago, when she was just twenty-three. She'd noticed that it was really hard to find stylish, affordable clothes for children – most of what was available was either very expensive or very boring – so she decided to design her own."],["Presenter","Her parents offered to lend her some money, but Anna wanted to do it alone, so she used the money she had saved from her first job."],["Presenter","Her dad also offered her the garage as a workspace, but it was too cold, so in the early days she ran everything from her bedroom, with boxes piled up to the ceiling! Today the company has twelve employees and Anna works from a proper office in the city centre."],["Presenter","People often assume she must have had contacts in the fashion industry, but she didn't know anyone. Her success is really down to the long hours she put in – for the first two years she worked seven days a week."],["Presenter","Her best advice for anyone who wants to start a business? 'Do your research first. Find out everything you can about your customers and your competitors before you spend a penny.'"]],"items":[{"t":"mc","s":"Anna decided to set up an online fashion company selling ___ clothes.","o":["children's","women's","men's"],"a":0},{"t":"mc","s":"Anna used ___ to set up her business.","o":["money borrowed from her family","her own money","money borrowed from a friend"],"a":1},{"t":"mc","s":"Nowadays, Anna runs the company from ___.","o":["her bedroom","the garage","an office"],"a":2},{"t":"mc","s":"The speaker says the main reason for Anna's success is ___.","o":["the people she knows in the fashion industry","the support she had from her family","the long hours she spent working"],"a":2},{"t":"mc","s":"Anna's best piece of advice for someone who wants to go into business is to ___.","o":["get some experience","get a qualification","do some research"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["What kind / clothes / wear?","Is / important / well dressed? Why?","Where / buy / most / your clothes? Why?","What do / think / prices famous designers / charge / their clothes?","Do / recycle / old clothes? Why / Why not?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about health: what you do to stay healthy, and what you could do better. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'We give too much importance to other people's appearance – personality is more important.'"]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
TESTS.push({"id":"f2b","kind":"file","title":"File 2 Test B","focus":"Present perfect simple and continuous, using adjectives as nouns, adjective order; illnesses and injuries, clothes and fashion.","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"The ___ really enjoy their food.","o":["Italian","Italians"],"a":1},{"t":"mc","s":"___ are getting poorer it seems to me.","o":["Poor","The poor"],"a":1},{"t":"mc","s":"The ___ are travelling as tourists more and more.","o":["Chinese","Chineses"],"a":0},{"t":"mc","s":"An ___ walked into a bar and looked at the barman.","o":["Irish","Irishman"],"a":1},{"t":"mc","s":"If life expectancy increases, ___ will become a majority.","o":["elderly","the elderly"],"a":1},{"t":"mc","s":"___ are very enthusiastic about their films.","o":["The French","French"],"a":0}]},{"ins":"Order the words to make sentences.","items":[{"t":"ord","s":"","wd":["little","found","stay","hotel","lovely","we","French","a","in","to"],"a":["We found a lovely little French hotel to stay in."]},{"t":"ord","s":"","wd":["the","some","black","I","scarves","market","nice","at","bought","silk","very"],"a":["I bought some very nice black silk scarves at the market.","At the market I bought some very nice black silk scarves."]},{"t":"ord","s":"","wd":["little","was","on","wooden","hill","beautiful","there","old","a","the","house"],"a":["There was a beautiful little old wooden house on the hill.","On the hill there was a beautiful little old wooden house."]},{"t":"ord","s":"","wd":["yesterday","horrible","hat","what","was","red","wearing","a","big","Celia","!"],"a":["What a horrible big red hat Celia was wearing yesterday!"]},{"t":"ord","s":"","wd":["brother","gorgeous","had","linen","my","on","a","jacket","younger","new"],"a":["My younger brother had a gorgeous new linen jacket on.","My younger brother had on a gorgeous new linen jacket."]},{"t":"ord","s":"","wd":["brand","has","sports","orange","a","Jack","new", ced than we think. The dead were buried in a tidy cemetery, houses had stoves, and there were special holes for rubbish. [5] It seems that they were especially fond of children. This is clear because some of the things found include toys, such as animals and rattles of clay, and small, badly crafted pots apparently made by children at playtime. One of the most exciting finds for archaeologists was the discovery of a sophisticated metal workshop.","'This might prove that the Copper Age started in Europe at least 500 years earlier than we thought,' Dr Kuzmanović said. The Copper Age represents the first use of tools by humans. It is thought to have started around 4,000 BC in south-east Europe, and earlier in the Middle East. The discovery of Europe's oldest underground mine at the nearby Mlava river suggested at the time that Vinča could be the first place in Europe to use metal, a theory which seems to be supported by the Pločnik site."],"sents":["A series of stone statues wearing the prehistoric fashions were found at one of Europe's oldest known villages.","Some say British designer Mary Quant came up with the design in the 1960s.","It was first discovered in 1927.","People slept on rugs and fur, made clothes of wool and leather, and kept animals.","They celebrated beauty and produced 60 different forms of wonderful pottery and statues.","They have uncovered evidence that Stone Age women were, in fact, wearing them more than 7,500 years ago."],"parts":[{"ins":"Read the article about a historical discovery about fashion. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":1,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 5"," ssuing them in 2004.","The pass was designed mostly for business use, but Jack Vroom decided to use it all the time. [3] He would fly across the USA to watch his son play American football at university, or to pick up his father-in-law from Washington DC so he could babysit his children. He told friends it was cheaper than paying for a local babysitter. He would also go abroad too, often just for a few hours. He flew to Milan to pick up some parts for a motorbike, and to Guadalajara, Mexico, just to buy some belts. [4] All the crew at his local airport knew him by name, and he didn’t even have to show his pass to anyone.","His adventure came to an end, though, in 2009 on a flight back from London. He had used his companion pass to fly his daughter’s friend back to the US, but when they arrived at Heathrow airport, Mr Vroom was taken to the VIP lounge and was given a letter saying that he could never use the ticket again. [5] When they checked who he was flying with, they noticed he booked trips with people he had never flown with before. They also noticed he would fly to far-away destinations in Europe and Asia, but only stay for a few hours. They accused him of selling his companion ticket, which was against the rules. His frequent flying was also costing the airline millions of dollars a year.","Mr Vroom disagrees with the decision, and believes there was nothing written anywhere which said he wasn’t allowed to gain compensation from his companion ticket. He believes that any money made was for his business services, or simply because friends wanted to pay him for the flight.","These days, Mr Vroom stays on the ground, working as a teacher and giving lectures in his house in the city of Dallas in the United States."],"sents":["Mr Vroom flew so often that he knew the planes better than most of the cabin crews.","In a period of 20 years, he estimates that he flew a staggering 38 million miles.","Although he believes he hadn’t done anything wrong, American Airlines d atch his son play American football at university, or to pick up his father-in-law from Washington DC so he could babysit his children. [3] He would also go abroad too, often just for a few hours. He flew to Milan to pick up some parts for a motorbike, and to Guadalajara, Mexico, just to buy some belts. Mr Vroom flew so often that he knew the planes better than most of the cabin crews. All the crew at his local airport knew him by name, and he didn’t even have to show his pass to anyone.","His adventure came to an end, though, in 2009 on a flight back from London. He had used his companion pass to fly his daughter’s friend back to the US, but when they arrived at Heathrow airport, Mr Vroom was taken to the VIP lounge and was given a letter saying that he could never use the ticket again. Although he believes he hadn’t done anything wrong, American Airlines disagreed. When they checked who he was flying with, they noticed he booked trips with people he had never flown with before. They also noticed he would fly to far-away destinations in Europe and Asia, but only stay for a few hours. [4] His frequent flying was also costing the airline millions of dollars a year. Mr Vroom disagrees with the decision, and believes there was nothing written anywhere which said he wasn’t allowed to gain compensation from his companion ticket.","[5]","These days, Mr Vroom stays on the ground, working as a teacher and giving lectures in his house in the city of Dallas in the United States."],"sents":["He told friends it was cheaper than paying for a local babysitter.","Even more amazingly, he did this without paying for any of the flights.","They accused him of selling his companion ticket, which was against the rules.","The pass was sold to wealthy passengers only.","American Airlines were selling an unlimited, life-long first-class travel pass called the AAirpass.","He believes that any money made was for his business services, or simply because friends wanted to pay him for the fligh ces may be very slippery this morning. Please take extra care when walking along the platforms and use the handrails on the stairs."],["Speaker 5","Because of essential engineering work, platforms 7, 8 and 9 are out of use today. All services normally departing from these platforms will leave from platforms 3 and 4."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":1,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":4,"gap":1}]},{"ins":"Listen to a woman talking about an adventure holiday she has been on. Choose the correct answer.","script":[["Kim","Every summer I used to go on a beach holiday with my friends – lying in the sun all day. To be honest, I don't really enjoy spending hours in the sun. I burn easily and I get bored."],["Kim","So last year I decided I wanted to do something different and learn some new activities. I went with my best friend, Sarah, on an adventure holiday."],["Kim","I'd really wanted to go to Canada, but it was far too expensive, so in the end we chose Ireland, which was much cheaper – and the weather was fine, actually!"],["Kim","We spent the first part of the holiday on the west coast, having surfing and sailing lessons. Surfing was exhausting, and sailing was fun, but my favourite activity was the horse riding, when we moved inland for a few days. I loved it."],["Kim","The holiday ended with a day exploring some amazing caves. The organizers put people into groups according to their abilities, so complete beginners like me weren't with people who'd been doing it for years."]],"items":[{"t":"mc","s":"Kim doesn't enjoy ___.","o":["trying new things","spending too much time in the sun","meeting new people"],"a":1},{"t":"mc","s":"The ___ stopped Kim from choosing the holiday she really wanted.","o":["weather","distance","price"],"a":2},{"t":"mc","s":"Kim's favourite activity on her holiday was ___.","o":["sailing","horse riding","surfing"],"a":1},{"t":"mc","s":"The first part of Kim's holiday was spent ___.","o":["at some caves","in the mountains","on the coast"],"a":2},{"t":"mc","s":"People who ___ were put together in groups.","o":["had the same interests","were the same age","had similar abilities"],"a":2}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["Where / spend / last holiday?","What / the most frightening experience / ever have when / travel?","Is / better / go / on holiday / own country / abroad? Why?","Which / prefer: travelling by train or plane? Why?","What / the best short story / ever read? / What / it about?"]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'People should fly less because it causes pollution.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about air travel: what you like and dislike about it. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});
TESTS.push({"id":"f4a","kind":"file","title":"File 4 Test A","focus":"Future perfect and future continuous, zero and first conditionals, future time clauses; weather, the environment, expressions with take.","secs":[{"k":"g","name":"Grammar","parts":[{"ins":"Choose the correct verb forms.","items":[{"t":"mc","s":"This time tomorrow, you ___ your driving test.","o":["'re taking","'ll be taking"],"a":1},{"t":"mc","s":"Good luck with the interview! I ___ of you.","o":["'ll be thinking","'ll have thought"],"a":0},{"t":"mc","s":"I ___ into town more next week – that's when my course starts.","o":["'ll have gone","'ll be going"],"a":1},{"t":"mc","s":"The meeting should be a quick one so we ___ by 3.00.","o":["'ll have finished","'ll be finishing"],"a":0},{"t":"mc","s":"I'm sure we ___ all our energy problems by 2050.","o":["'ll have solved","'ll be solving"],"a":0},{"t":"mc","s":"We usually start our lunch at 1.30, but tomorrow we ___ it at 2.15 as there's a lot of work to do in the morning.","o":["'ll have started","'ll be starting"],"a":1}]},{"ins":"Complete the sentences with the correct word(s).","items":[{"t":"mc","s":"If you're cooking a meal tonight, I ___ anything this afternoon.","o":["'m not eating","won't have eaten","won't eat"],"a":2},{"t":"mc","s":"We'll have the party outdoors on Saturday unless it ___.","o":["will rain","'s raining","will have rained"],"a":1},{"t":"mc","s":"If you eat fresh, healthy food, you ___ to take vitamin supplements.","o":["don't need","aren't needing","will need"],"a":0},{"t":"mc","s":"If you're feeling hungry, you probably ___ enough to eat.","o":["won't have had","haven't had","aren't going to have"],"a":1},{"t":"mc","s":"Unless you ___ like you need a break, we'll carry on walking.","o":["'ve felt","'re feeling","aren't feeling"],"a":1},{"t":"mc","s":"If you make bread, you ___ a warm place to put it while it rises.","o":["need","'re needing","'ve needed"],"a":0}]},{"ins":"Complete the sentences with the correct word(s) from th ","cool"],"a":0},{"t":"mc","s":"If there's ___ fog the traffic will be very slow.","o":["thick","strong"],"a":0},{"t":"mc","s":"You'll need your sunglasses – it's incredibly ___ outside.","o":["clear","bright"],"a":1},{"t":"mc","s":"There's not much rain today, but it's still quite ___.","o":["damp","drizzling"],"a":0}]},{"ins":"Complete the sentences with one word.","items":[{"t":"tx","s":"Investing money in the stock market is never safe – you're taking a ___.","a":["risk"]},{"t":"tx","s":"You don't need to rush – take ___ time and enjoy your meal.","a":["your"]},{"t":"tx","s":"Don't expect so much from Jane – you must take into ___ that she's still young.","a":["account"]},{"t":"tx","s":"You should take more care ___ yourself. You don't eat properly.","a":["of"]},{"t":"tx","s":"I've always wanted to take ___ in a charity event.","a":["part"]},{"t":"tx","s":"The wedding will take ___ at the church on 12th July.","a":["place"]},{"t":"tx","s":"Do you think you take ___ your mother or your father in character?","a":["after"]},{"t":"tx","s":"You should take ___ of the low exchange rates and get some dollars now.","a":["advantage"]}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Are the sounds the same (S) or different (D)?","items":[{"t":"mc","s":"p*ou*ring, dr*ou*ght","o":["S (same)","D (different)"],"a":1,"pr":1},{"t":"mc","s":"h*ea*vy, s*e*ttled","o":["S (same)","D (different)"],"a":0,"pr":1},{"t":"mc","s":"bel*ow* zero, c*o*ld","o":["S (same)","D (different)"],"a":0,"pr":1},{"t":"mc","s":"*i*cy, m*i*ld","o":["S (same)","D (different)"],"a":0,"pr":1},{"t":"mc","s":"fl*oo*d, th*u*nder","o":["S (same)","D (different)"],"a":0,"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["tor","na","do"],"a":1},{"t":"syl","s":"","o":["change","a","ble"],"a":0},{"t":"syl","s":"","o":["ad","van","tage"],"a":1},{"t":"syl","s":"","o":["bli","zzard"],"a":0},{"t":"syl","s":"","o":["hu","rri","cane"],"a":0}]}]},{"k":"r","name":"Reading","title":"The Effects of Climate Change in the UK","text":["Climate change is a long-term change in weather patterns over periods of time that range from decades to millions of years. It is one of the greatest environmental issues of our time.","The effect of changes in our climate has been a hot topic for many years. And now government ministers in the UK have warned that the internet could be badly affected due to climate change. [1]","Scientists say that higher temperatures and rainstorms could affect wi-fi communications. In addition, wetter winters and drier summers might lead to subsidence – the sinking of the ground – damaging underground cables.","[2] If climate change affects the quality of the signal, or there is no signal due to extreme changes in temperature, people will clearly be disadvantaged. It would be very serious if communication systems were not working in the height of an emergency. This is why the issue must be dealt with.","The Environment Secretary, Caroline Spelman, recently explained the government’s plans to take action.","[3] However, if these facilities cannot deal with the increase in floods and storms likely to accompany rising temperatures, the money will have been wasted, she warned. Speaking at Blackfriars Railway Station in London, which a UK rail company says is being redeveloped with the long-term effects of climate change in mind, Ms Spelman said the UK economy would not be able to grow if infrastructure – transport and communications networks and reliable energy and water supplies – failed.","Ms Spelman explained that our economy is built on this infrastructure. But it could not grow if there are repeated power failures, or if goods cannot be transported because roads are flooded and railways have been damaged, or if heavy rainfall or high temperatures negatively affect wi-fi signals. [4] According to Ms Spelman, they could come forward and develop new technologies and processes to help our current systems better deal with climate change.","A government report published recently outlines how planning and design of new systems needs to consider the effect of climate change. This is especially important as many projects will still be there in 50 to 100 years from now. The study gives details of what action needs to be taken by the owners of transport networks, for example. [5]","Rail Minister Theresa Villiers explained that although the UK government needs to manage money very carefully, it is committed to spending considerable sums on transport through vital projects such as the Thameslink upgrade, Crossrail, the proposed High Speed rail network, and more electrification of the rail network.","The new Blackfriars Railway station in London is being fitted with technology including sun pipes, rainwater harvesting systems, insulation and solar panels to make it less reliant on water and electricity networks. Perhaps this station will lead the way for others all over the country to become more environmentally friendly."],"sents":["It also highlights the role of the government in protecting the UK from the effects of climate change.","So, how long has it been damaged for?","This involves spending around £200 billion on UK transport and power supplies over the next five years.","As well as getting money from the government, she also asked for help from British businesses.","So, what does that mean for people who need to use these communications?","Roads, railways, and power and water supplies also need to be protected as weather patterns become more serious."],"parts":[{"ins":"Read the article. Five sentences have been removed. Which sentence (A–F) fits each gap (1–5)? There is one extra sentence you do not need to use.","items":[{"t":"mc","s":"Gap 1","o":["A","B","C","D","E","F"],"a":5,"w":2,"gap":1},{"t":"mc","s":"Gap 2","o":["A","B","C","D","E","F"],"a":4,"w":2,"gap":1},{"t":"mc","s":"Gap 3","o":["A","B","C","D","E","F"],"a":2,"w":2,"gap":1},{"t":"mc","s":"Gap 4","o":["A","B","C","D","E","F"],"a":3,"w":2,"gap":1},{"t":"mc","s":"Gap 5","o":["A","B","C","D","E","F"],"a":0,"w":2,"gap":1}]}]},{"k":"w","name":"Writing","task":"You have been asked to write a report on how your town or city is helping the environment for the school's Eco-Club. Write 140–180 words.","bullets":["say what your town / city is already doing to help the environment","make some suggestions for more things your town / city could do","explain why these things would make a difference"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five people talking about road safety. Choose from the list (A–F) what each speaker says about road safety. There is one extra letter you do not need to use.","list":["don't speak on the phone while driving","make sure you always wear your seatbelt","pay attention to the conditions","be prepared for your journey","check how fast you are driving","wear the correct clothes at night"],"script":[["Speaker 1","Before every journey, I look at the weather and the state of the roads. If it's icy or foggy, I slow right down and leave much more space between me and the car in front. You have to drive for the conditions you're in."],["Speaker 2","My rule is simple: when I'm driving, my mobile goes in the glove compartment. I don't make calls, I don't answer them, and I certainly don't read messages. Whatever it is, it can wait until I stop."],["Speaker 3","I cycle home from work, and in winter it's dark by five. So I always wear a bright yellow jacket with reflective strips, and I've got lights on my bike. If drivers can't see you, you're in real danger."],["Speaker 4","Before a long trip, I plan my route and where I'm going to stop for a rest. I pack water and snacks, check the traffic news, and make sure I've had a good night's sleep. Getting ready properly makes the whole journey safer."],["Speaker 5","I glance at the speedometer every few minutes. It's so easy to creep up over the limit without noticing, especially on a quiet road. Knowing exactly how fast you're going is the most important thing."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":0,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":5,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":4,"gap":1}]},{"ins":"Listen to a radio interviewer talking to a young person who does voluntary work for an environmental agency. Choose the correct answer.","script":[["Interviewer","Rick, you've just come back from a volunteer project on the coast of Mozambique. How long were you there?"],["Rick","Nine months in total. I'd planned to stay for six, but I loved it so much that I extended it."],["Interviewer","And what did you actually do?"],["Rick","My main job was looking at the fish that local fishermen had caught – measuring them and recording the species. A small group of other volunteers worked on a seahorse project, finding out which types live in the area, and others did beach clean-ups."],["Interviewer","Did you get any time off?"],["Rick","Usually two days a week. We'd often go to the nearby town or just explore the coast."],["Interviewer","What were the living conditions like?"],["Rick","Basic! We each had a small bedroom, but all the volunteers shared a kitchen, and that's where we spent most evenings – cooking together and chatting."],["Interviewer","Did you learn any new skills?"],["Rick","Yes. Everyone is taught how to recognize the plants along the coast in the first week. Diving wasn't part of it – you had to be qualified already. And some people had the chance to learn about construction work, because we were building a new research centre."]],"items":[{"t":"mc","s":"Rick spent ___ working as a volunteer.","o":["6 months","9 months","12 months"],"a":1},{"t":"mc","s":"Rick's role included ___.","o":["looking at the fish that were caught","finding types of seahorses in the ocean","tidying up beaches"],"a":0},{"t":"mc","s":"Volunteers usually had ___ days off each week.","o":["one","two","three"],"a":1},{"t":"mc","s":"All volunteers shared a ___.","o":["kitchen","bathroom","bedroom"],"a":0},{"t":"mc","s":"Some people on the project had the chance to ___.","o":["learn to dive","learn about construction work","learn how to teach"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Make questions from the prompts and ask the teacher. Then answer the same questions.","prompts":["What / do / prevent climate change in your daily life?","How / people live / 50 years' time?","What / least favourite / type of weather? Why?","What / weather usually like in your country in summer?","What / the riskiest thing / ever do?"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute about climate change. The teacher then asks if you agree with a different view.","prompts":[]},{"name":"Discussion","mins":3,"lead":"Say if you agree or disagree with the statement. Give reasons.","prompts":["'We can't do anything to stop climate change, so we should enjoy life now.'"]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}]});

"s":"I'm not going to do the work unless she ___ (pay) me well for it.","a":["pays"]}]},{"ins":"Choose the correct verb forms.","items":[{"t":"mc","s":"Do you think we ___ how to make clean energy by 2040?","o":["'ll have solved","'ll be solving"],"a":0},{"t":"mc","s":"The interview won't take long – I'm sure I ___ by 4.30.","o":["'ll have finished","'ll be finishing"],"a":0},{"t":"mc","s":"This time on Tuesday, you ___ your last exam!","o":["'re taking","'ll be taking"],"a":1},{"t":"mc","s":"I ___ my English lesson at 7.30. It starts at 7.00.","o":["'ll have","'ll be having"],"a":1},{"t":"mc","s":"I hope your driving test goes well! I ___ of you.","o":["'ll be thinking","'ll have thought"],"a":0},{"t":"mc","s":"I ___ out more often when we've found a new babysitter.","o":["'ll have gone","'ll be going"],"a":1}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Choose the correct word(s).","items":[{"t":"mc","s":"In very ___ fog the planes can still land automatically.","o":["thick","strong"],"a":0},{"t":"mc","s":"This winter the weather has been surprisingly ___.","o":["mild","cool"],"a":0},{"t":"mc","s":"When the night sky is ___ you can see an incredible number of stars here.","o":["clear","bright"],"a":0},{"t":"mc","s":"It was so ___ on the ski slope it was difficult to see anything.","o":["clear","bright"],"a":1},{"t":"mc","s":"It's difficult to know what the weather will be like – it's so ___.","o":["settled","changeable"],"a":1},{"t":"mc","s":"You need a ___ wind if you want to go sailing.","o":["strong","heavy"],"a":0},{"t":"mc","s":"They say it will be wet and ___ for the next week.","o":["chilly","sunny"],"a":0}]},{"ins":"Complete the sentences with one word.","items":[{"t":"tx","s":"We're hoping to take ___ in the next London Marathon.","a":["part"]},{"t":"tx","s":"I don't think I take ___ my father – I'm nothing like him!","a":["after"]},{"t":"tx","s":"The garden party takes ___ in July every year, in the palace gardens.","a":["place"]},{"t":"tx","s":"Take ___ of the low prices and buy things in the January sales.","a":["advantage"]},{"t":"tx","s":"If you invest in gold, you're still taking a ___ because the price could go down.","a":["risk"]},{"t":"tx","s":"Do take into ___ that Billy is only 15 – you can't treat him like an adult.","a":["account"]},{"t":"tx","s":"Take ___ time eating breakfast, there's no need to hurry.","a":["your"]},{"t":"tx","s":"I think I take care ___ myself – I certainly eat well and exercise a lot.","a":["of"]}]},{"ins":"Choose the odd word out.","items":[{"t":"mc","s":"","o":["hot","scorching","boiling","freezing"],"a":3},{"t":"mc","s":"","o":["settled","changeable","hail","bright"],"a":2},{"t":"mc","s":"","o":["flood","breeze","hurricane","tornado"],"a":1},{"t":"mc","s":"","o":["damp","drizzling","bright","pouring"],"a":2},{"t":"mc","s":"","o":["monsoon","shower","hurricane","blizzard"],"a":1}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Are the sounds the same (S) or different (D)?","items":[{"t":"mc","s":"*i*cy, m*i*ld","o":["S (same)","D (different)"],"a":0,"pr":1},{"t":"mc","s":"fl*oo*d, th*u*nder","o":["S (same)","D (different)"],"a":0,"pr":1},{"t":"mc","s":"p*ou*ring, dr*ou*ght","o":["S (same)","D (different)"],"a":1,"pr":1},{"t":"mc","s":"h*ea*vy, s*e*ttled","o":["S (same)","D (different)"],"a":0,"pr":1},{"t":"mc","s":"bel*ow* zero, c*o*ld","o":["S (same)","D (different)"],"a":0,"pr":1}]},{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["ad","van","tage"],"a":1},{"t":"syl","s":"","o":["bli","zzard"],"a":0},{"t":"syl","s":"","o":["par","ti","ci","pate"],"a":1},{"t":"syl","s":"","o":["tor","na","do"],"a":1},{"t":"syl","s":"","o":["change","a","ble"],"a":0}]}]},{"k":"r","name":"Reading","title":"Unexpected challenges from environmental change","text":["Climate change is a long-term change in weather patterns over periods of time that range from decades to millions of years. It is one of the greatest environmental issues of our time.","The effect of changes in our climate has been a hot topic for many years. [1] As weather patterns become more serious, railways, roads, and power and water supplies also need to be protected.","Scientists say that higher temperatures and rainstorms could affect wi-fi communications. In addition, wetter winters and drier summers might lead to subsidence – the sinking of the ground – damaging underground cables. So, what does that mean for people who need to use these communications? If climate change affects the quality of the signal, or there is no signal due to extreme changes in temperature, people will clearly be disadvantaged. It would be very serious if communication systems were not working in the height of an emergency. [2]","The Environment Secretary, Caroline Spelman, recently explained the government’s plans to take action.","[3] However, if facilities cannot deal with the increase in floods and storms likely to accompany rising temperatures, the money will have been wasted, she warned. Speaking at Blackfriars Railway Station in London, which a UK rail company says is being redeveloped with the long-term effects of climate change in mind, Ms Spelman said the UK economy would not be able to grow if infrastructure – transport and communications networks and reliable energy and water supplies – failed.","Ms Spelman explained that our economy is built on this infrastructure. But it could not grow if there are repeated power failures, or if goods cannot be transported because roads are flooded and railways have been damaged, or if heavy rainfall or high temperatures negatively affect wi-fi signals. She also asked for help from British businesses. [4]","A government report published recently outlines how planning and design of new systems needs to take into consideration the effect of climate change, and this is especially important as many projects will still be there in 50 to 100 years from now. [5] It also highlights the role of the government in protecting the UK from the effec
