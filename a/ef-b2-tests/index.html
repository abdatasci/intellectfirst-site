:root[data-theme="dark"]{
  --navy:#0B1731; --navy2:#22386B; --ice:#18284A; --ice2:#243A66;
  --gold:#D2AE52; --gold2:#5E4C1E; --paper:#13213F; --bg:#0D1830;
  --ink:#E6ECF6; --muted:#A3B0C8; --line:#2A3C63;
  --ok:#6FD39F; --okbg:#133A2A; --no:#F08A80; --nobg:#40191A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}

/* masthead */
.mast{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.mast-in{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.mast svg{width:44px;height:52px;flex:none}
.mast .school{font-family:var(--serif);font-size:1.25rem;letter-spacing:.01em}
.mast .sub{color:#C9D6EA;font-size:.95rem}
.mast .grow{flex:1}
.mast select{background:transparent;border:1px solid #3A5285;border-radius:6px;padding:6px 8px;color:#fff}
.mast select option{color:#000}

/* layout */
.wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:24px;padding:22px 20px 60px}
nav.tests h2{font-size:1rem;color:var(--muted);font-family:var(--sans);font-weight:700;margin:4px 0 8px}
nav.tests ul{list-style:none;margin:0 0 18px;padding:0}
nav.tests li button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 10px;border-radius:0 6px 6px 0;display:flex;justify-content:space-between;gap:8px}
nav.tests li button:hover{background:var(--ice)}
nav.tests li button[aria-current="true"]{border-left-color:var(--gold);background:var(--paper);font-weight:700}
nav.tests li button .mini{color:var(--muted);font-size:.85rem;font-weight:400}
nav.tests .soon{color:var(--muted);font-size:.92rem;padding:5px 13px}
.mobile-pick{display:none}

main{min-width:0}
.head{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.head h1{font-size:2rem;color:var(--ink)}
.head .focus{color:var(--muted);margin:4px 0 14px}
.who{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.who label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.who input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:180px}
.mode{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.mode button{border:0;background:var(--paper);padding:8px 14px;font-size:.92rem}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}
.modehint{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:0}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 12px 9px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs .badge{font-weight:400;font-size:.82rem;margin-left:5px;color:var(--muted)}

.sec h2{font-size:1.5rem;margin-bottom:4px}
.part{font-family:var(--serif);font-size:1.08rem;margin:26px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.part:first-of-type{border-top:0;padding-top:0;margin-top:10px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:32px 1fr;gap:4px 8px}
.q .n{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:1.05rem;padding-top:1px}
.q .stem{margin-bottom:8px}
.q .spk{display:inline-block;font-weight:700;width:1.4em;color:var(--muted)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--muted);margin:0 3px;line-height:1.1}
.blank.filled{border-bottom-color:var(--gold);font-weight:700;padding:0 3px;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 12px;display:flex;gap:8px;align-items:baseline;text-align:left;min-height:40px}
.opt:hover:not(:disabled){border-color:var(--navy2)}
.opt .l{font-weight:700;color:var(--muted);font-size:.85rem}
.opt.sel{border-color:var(--navy2);background:var(--ice)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg);text-decoration:line-through;text-decoration-thickness:1px}
.opt.key{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt b.snd{color:var(--gold);font-weight:700}
.opt u.str{text-decoration:underline 2px;text-underline-offset:3px;font-weight:700}
.q .verdict{grid-column:2;font-size:.88rem;margin-top:6px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}

.reading{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.text{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 22px;font-family:var(--serif);line-height:1.65;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.text h3{font-size:1.25rem;margin-bottom:10px}
.text p{margin:0 0 12px}

.player{background:var(--navy);color:#fff;border-radius:10px;padding:16px 18px;margin:12px 0 18px}
.player .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.player button{border:1px solid #4A6399;background:#1C3161;color:#fff;border-radius:6px;padding:8px 14px;font-weight:700}
.player button.primary{background:var(--gold);border-color:var(--gold);color:#1a1405}
.player button:disabled{opacity:.45;cursor:not-allowed}
.player label{font-size:.85rem;color:#C9D6EA;display:flex;gap:6px;align-items:center}
.player select{background:#0B1731;color:#fff;border:1px solid #4A6399;border-radius:6px;padding:5px 6px;max-width:220px}
.player .status{font-size:.9rem;color:#C9D6EA;margin-top:10px}
.player .plays{margin-left:auto;font-size:.9rem}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;font-size:.88rem}
.script{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:16px}
.script p{margin:0 0 6px}
.script p.now{background:var(--gold2);border-radius:4px}
.script b{font-family:var(--serif)}

.bands{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:.92rem;margin:10px 0 18px}
.bands table{border-collapse:collapse;width:100%}
.bands td{padding:3px 8px 3px 0;vertical-align:top}
.bands td:first-child{font-weight:700;white-space:nowrap;color:var(--gold)}
.task{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.task h3{font-size:1.15rem}
.task .meta{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.task ul{margin:0 0 12px;padding-left:1.2em}
.task li{margin-bottom:4px}
.task .card{border-left:3px solid var(--gold);padding:6px 12px;background:var(--ice);border-radius:0 6px 6px 0;margin-bottom:10px;font-family:var(--serif)}
.timer{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.timer .clock{font-family:var(--serif);font-size:1.4rem;min-width:3.2em}
.timer button,.ghost{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px}
.rate{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rate .lab{font-size:.88rem;color:var(--muted);margin-right:4px}
.rate button{width:36px;height:36px;border:1.5px solid var(--line);background:var(--bg);border-radius:6px;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

.pager{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.pager button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;font-weight:700}

/* ledger */
aside.ledger{position:sticky;top:14px;align-self:start}
.card-l{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px}
.card-l .t{font-family:var(--serif);font-size:1.1rem}
.card-l .st{color:var(--muted);font-size:.88rem;margin-bottom:12px;min-height:1.3em}
.big{display:flex;align-items:baseline;gap:6px;font-family:var(--serif);margin:4px 0 2px}
.big .num{font-size:3.4rem;line-height:1;color:var(--ink)}
.big .of{font-size:1.2rem;color:var(--muted)}
.pct{font-size:.95rem;color:var(--muted);margin-bottom:14px}
.pct b{color:var(--ink)}
.rowl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.93rem;margin-bottom:9px}
.rowl .bar{grid-column:1/3;height:5px;background:var(--ice);border-radius:3px;overflow:hidden}
.rowl .bar i{display:block;height:100%;background:var(--navy2);transition:width .25s}
.rowl .v{font-variant-numeric:tabular-nums}
.ledger .actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ledger .actions button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:700}
.ledger .actions button.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.src{font-size:.78rem;color:var(--muted);margin-top:14px;line-height:1.4}
.mobile-total{display:none}

@media (max-width:1100px){
  .wrap{grid-template-columns:200px minmax(0,1fr)}
  aside.ledger{grid-column:1/3;position:static}
}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{grid-template-columns:minmax(0,1fr);padding:14px 12px 110px;gap:14px}
  nav.tests{display:none}
  .mobile-pick{display:block;margin-bottom:12px}
  .mobile-pick select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
  aside.ledger{grid-column:auto}
  .reading{grid-template-columns:minmax(0,1fr)}
  .text{position:static;max-height:none}
  .mode{margin-left:0}
  .head h1{font-size:1.6rem}
  .mobile-total{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;border-top:3px solid var(--gold);z-index:10}
  .mobile-total b{font-family:var(--serif);font-size:1.3rem}
  .mobile-total button{background:none;border:1px solid #4A6399;color:#fff;border-radius:6px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

textarea#wtext{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:12px;font-family:var(--serif);font-size:1.02rem;line-height:1.6;resize:vertical;color:var(--ink)}

@media (max-width:760px){.rate.crit .lab{min-width:100%}}

function newId(){var a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789",s="";var r=new Uint8Array(14);(window.crypto||{}).getRandomValues?crypto.getRandomValues(r):r.forEach(function(_,i){r[i]=Math.random()*256});for(var i=0;i<14;i++)s+=a[r[i]%a.length];return s}

/* p = {id, c, lv, t, v, n, cl, s:[[label,score|null,max]...], w:[texts]} */
function message(p){
  var tot=0,max=0,pend=[];p.s.forEach(function(x){max+=x[2];tot+=x[1]||0;if(x[1]==null)pend.push(x[0])});
  var o={id:p.id,c:p.c,lv:p.lv,t:p.t,v:p.v||"",n:p.n||"",cl:p.cl||"",d:new Date().toISOString(),s:p.s,w:(p.w||[]).filter(function(x){return x&&String(x).trim()})};
  var code="IFR1."+b64url(JSON.stringify(o));
  return "IF Academy test result\nStudent: "+(p.n||"(no name)")+(p.cl?" · "+p.cl:"")+"\nTest: "+p.lv+" · "+p.t+(p.v?" "+p.v:"")+"\nScore: "+tot+" / "+max+(pend.length?" ("+pend.join(" and ")+" not marked yet)":"")+"\n"+code+(p.x?"\n"+p.x:"");
}
function box(container,p){

  var msg=message(p);var d=document.createElement("div");d.className="ifr";
  d.innerHTML="<h3>Send this result to your teacher</h3>"+(p.n?"":"<div class='ifr-w'>Write your name at the top of the test first, so your teacher knows it’s you.</div>")+
    "<p>Tap <b>Share</b> and send it on WhatsApp or Telegram, or copy the message and paste it into a chat with your teacher.</p>"+
    "<textarea readonly aria-label='Result message'>"+esc(msg)+"</textarea><div class='ifr-row'>"+(navigator.share?"<button type='button' data-a='share'>Share</button>":"")+"<button type='button' class='"+(navigator.share?"l":"")+"' data-a='copy'>Copy message</button><span class='ifr-m' aria-live='polite'></span></div>";
  container.appendChild(d);
  var ta=d.querySelector("textarea"),m=d.querySelector(".ifr-m");
  d.querySelectorAll("button").forEach(function(b){b.onclick=function(){
    if(b.dataset.a==="share"){navigator.share({title:"IF Academy test result",text:msg}).catch(function(){})}
    else{var ok=function(){m.textContent="Copied. Paste it into a chat with your teacher."};
      var fb=function(){ta.focus();ta.select();try{document.execCommand("copy");ok()}catch(e){m.textContent="Select the message and copy it."}};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(msg).then(ok,fb);else fb()}
  }});

<script>
/* ---------- IF AI writing examiner (shared module) ---------- */
window.IFAIW=(function(){
  var S=null,ready=null,css=false;
  function sample(){if(!ready)ready=((window.claude&&window.claude.use)?window.claude.use("sample").catch(function(){return null}):Promise.resolve(null)).then(function(s){S=s;return s});return ready}
  function h(s){var x=5381;s=String(s||"");for(var i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return (x>>>0).toString(36)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function words(s){return (String(s||"").trim().match(/\S+/g)||[]).length}
  function lsGet(k){try{var v=localStorage.getItem("ifaiw:"+k);return v?JSON.parse(v):null}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem("ifaiw:"+k,JSON.stringify(v))}catch(e){}}
  function addCss(){if(css)return;css=true;var st=document.createElement("style");st.textContent=
   ".aiw{margin:14px 0;border:1px solid var(--line,#CBD6E4);border-left:4px solid var(--gold,#A9843A);border-radius:8px;padding:14px 16px;background:var(--paper,#fff);color:var(--ink,#15213A);font-size:15px;line-height:1.5}"+
   ".aiw h4{margin:0 0 4px;font-size:16px;font-family:var(--serif,Cambria,Georgia,serif)}.aiw .aiw-m{color:var(--muted,#5A6781);font-size:13.5px;margin:0 0 10px}"+
   ".aiw button{border:1px solid var(--navy,#13223F);background:var(--navy,#13223F);color:#fff;border-radius:7px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;margin:0 8px 6px 0}"+
   ".aiw button.l{background:transparent;color:var(--ink,#15213A)}.aiw button:disabled{opacity:.55;cursor:default}"+
   ".aiw .aiw-big{font-family:var(--serif,Cambria,Georgia,serif);font-size:30px;line-height:1;margin:4px 0 8px}.aiw .aiw-big small{font-size:15px;color:var(--muted,#5A6781)}"+
   ".aiw table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14.5px}.aiw td{padding:6px 4px;border-top:1px solid var(--line,#CBD6E4);vertical-align:top}.aiw td.n{text-align:right;white-space:nowrap;font-weight:700;width:60px}"+
   ".aiw ul{margin:4px 0 8px;padding-left:20px}.aiw li{margin:3px 0}.aiw .aiw-x{text-decoration:line-through;opacity:.75}.aiw .aiw-ok{font-weight:700}.aiw .aiw-w{display:inline-block;width:16px;height:16px;border:2px solid var(--line,#CBD6E4);border-top-color:var(--gold,#A9843A);border-radius:50%;animation:aiwsp .9s linear infinite;vertical-align:-3px;margin-right:8px}"+
   "@keyframes aiwsp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.aiw .aiw-w{animation:none}}";
   document.head.appendChild(st)}
  function prompt(c,text){
    var crit=c.crit.map(function(x,i){return (i+1)+". "+x[0]+" (0–"+x[1]+")"+(x[2]?": "+x[2]:"")}).join("\n");
    var max=c.crit.reduce(function(a,x){return a+x[1]},0);
    return "You are an experienced, fair English examiner marking the writing part of "+c.exam+". The writer is "+(c.who||"a learner of English")+". Mark with the criteria below, exactly as a careful teacher would: reward what is there, do not inflate, and keep the level of the test in mind.\n\n"+
     "TASK:\n"+(typeof c.task==="function"?c.task():c.task)+(c.words?"\nLength asked for: "+c.words+".":"")+"\n\nCRITERIA (total "+max+"):\n"+crit+(c.bands?"\n\nMARK SCHEME:\n"+c.bands:"")+
     "\n\nANSWER ("+words(text)+" words), between the markers:\n<<<\n"+String(text).slice(0,6000)+"\n>>>\n\nIf the answer is blank, off-task, copied from the task or not in English, give 0 for every criterion.\n"+
     "Reply with JSON only: {\"scores\":["+c.crit.map(function(){return 0}).join(",")+"],\"comments\":["+c.crit.map(function(){return '"one short sentence"'}).join(",")+"],\"feedback\":\"2–3 encouraging, specific sentences for the learner in simple English\",\"corrections\":[{\"wrong\":\"exact words from the answer\",\"right\":\"corrected version\",\"why\":\"very short reason\"}],\"cefr\":\"A1|A2|B1|B2|C1|C2\"}  Give up to 6 corrections of the most important errors.";
  }
  function mark(c,text){
    return sample().then(function(s){if(!s)throw{code:"unavailable"};return s.json(prompt(c,text),{modelTier:"default",cache:false})}).then(function(j){
      var sc=c.crit.map(function(x,i){var v=Math.round(Number(j&&j.scores&&j.scores[i]));return isFinite(v)?Math.max(0,Math.min(x[1],v)):0});
      var cm=c.crit.map(function(x,i){return String(j&&j.comments&&j.comments[i]||"")});
      var corr=(j&&Array.isArray(j.corrections)?j.corrections:[]).slice(0,6).map(function(x){return{w:String(x&&x.wrong||""),r:String(x&&x.right||""),y:String(x&&x.why||"")}}).filter(function(x){return x.w||x.r});
      return{s:sc,c:cm,total:sc.reduce(function(a,b){return a+b},0),max:c.crit.reduce(function(a,x){return a+x[1]},0),fb:String(j&&j.feedback||""),corr:corr,cefr:String(j&&j.cefr||""),h:h(text),at:new Date().toISOString(),n:c.crit.map(function(x){return x[0]}),m:c.crit.map(function(x){return x[1]})};
    });
  }
  function resHtml(r,c,stale){
    var hdr=c.mode==="teacher"?"AI examiner’s suggestion":"AI examiner’s mark";
    var t='<div class="aiw-big">'+r.total+'<small> / '+r.max+(r.cefr?' · about '+esc(r.cefr):'')+'</small></div>';
    if(r.s.length>1||r.c[0])t+='<table>'+r.s.map(function(v,i){return '<tr><td><b>'+esc(r.n[i])+'</b>'+(r.c[i]?'<br><span class="aiw-m" style="margin:0">'+esc(r.c[i])+'</span>':'')+'</td><td class="n">'+v+' / '+r.m[i]+'</td></tr>'}).join('')+'</table>';
    if(r.fb)t+='<p style="margin:0 0 8px">'+esc(r.fb)+'</p>';
    if(r.corr&&r.corr.length)t+='<b>Corrections</b><ul>'+r.corr.map(function(x){return '<li><span class="aiw-x">'+esc(x.w)+'</span> → <span class="aiw-ok">'+esc(x.r)+'</span>'+(x.y?' <span class="aiw-m">('+esc(x.y)+')</span>':'')+'</li>'}).join('')+'</ul>';
    return '<h4>'+hdr+'</h4>'+(stale?'<p class="aiw-m">You have changed your writing since this mark. Mark it again to update it.</p>':'')+t+
      '<p class="aiw-m">'+(c.mode==="teacher"?"Check it, then use it or change it. The final mark is yours.":"An AI estimate, marked on the same criteria as your teacher uses. Your teacher can change it.")+'</p>';
  }
  function panel(host,c){
    if(!host)return null;addCss();
    var box=document.createElement("div");box.className="aiw";box.hidden=true;
    if(c.before)host.parentNode.insertBefore(box,host);else host.parentNode.insertBefore(box,host.nextSibling);
    var ls0=lsGet(c.key),res=c.stored||(ls0&&ls0.h===h(c.getText()||"")?ls0:null),busy=false,err="";
    function draw(){
      var text=c.getText()||"",n=words(text),stale=res&&res.h&&res.h!==h(text);
      var min=c.min||25;
      var b='';
      if(res)b+=resHtml(res,c,stale&&c.mode!=="teacher");
      else b+='<h4>AI examiner</h4><p class="aiw-m">'+(c.mode==="teacher"?"Get a suggested mark for this writing on the test’s criteria, with corrections.":"When you have finished, the AI examiner marks your writing on the test’s criteria and shows your mistakes.")+'</p>';
      if(err)b+='<p class="aiw-m" style="color:var(--bad,#A23B3B)">'+esc(err)+'</p>';
      if(busy)b+='<p class="aiw-m"><span class="aiw-w"></span>The examiner is reading the writing. This usually takes 20–60 seconds.</p>';
      else{
        var lab=c.mode==="teacher"?(res?"Mark again with AI":"Mark with AI"):(res?"Mark again":"Mark my writing with AI");
        b+='<div>'+(c.locked&&c.mode!=="teacher"&&res?'':'<button type="button" data-aiw="go"'+(n<min?' disabled':'')+'>'+lab+'</button>')+
          (c.mode==="teacher"&&res&&c.apply?'<button type="button" class="l" data-aiw="use">Use this mark</button>':'')+
          (n<min?'<span class="aiw-m">Write at least '+min+' words first.</span>':'')+'</div>';
      }
      box.innerHTML=b;
      var g=box.querySelector('[data-aiw="go"]');if(g)g.onclick=go;
      var u=box.querySelector('[data-aiw="use"]');if(u)u.onclick=function(){c.apply(res);u.textContent="Mark entered ✓";u.disabled=true};
    }
    function go(){
      var text=c.getText()||"";if(words(text)<(c.min||25))return;
      busy=true;err="";draw();
      mark(c,text).then(function(r){res=r;lsSet(c.key,r);busy=false;draw();if(c.onResult)try{c.onResult(r)}catch(e){}})
      .catch(function(e){busy=false;err=e&&e.code==="rate_limited"?"Too many requests just now. Try again in a minute.":e&&(e.code==="not_granted"||e.code==="unavailable")?"AI marking isn’t allowed on this device. Your teacher will mark your writing.":"The examiner couldn’t mark this just now. Try again.";
        if(e&&(e.code==="not_granted"||e.code==="unavailable")&&c.mode!=="teacher"&&!res){box.hidden=false}draw()});
    }
    sample().then(function(s){if(!s&&!res){box.remove();return}box.hidden=false;draw()});
    if(c.watch){[].concat(c.watch).forEach(function(w){w.addEventListener("input",function(){if(!busy&&!box.hidden)draw()})})}
    return box;
  }
  return {panel:panel,mark:mark,sample:sample,hash:h,words:words};
})();

function aiwCfg(t,sec){return {exam:'an English File Upper-intermediate (B2) progress test ('+t.title+')',who:'a teenage or adult learner studying at B2 level',
 task:sec.task+'\nInclude the following information:\n- '+sec.bullets.join('\n- '),words:'140–180 words',crit:[['Writing',10,'']],min:40,
 bands:'9–10: all three points covered in 140–180 words; clear paragraphs and linking; good range of grammar and vocabulary from the file; very few errors.\n7–8: all points covered; organised; some errors that don\'t affect meaning.\n5–6: most points covered; simple language; errors sometimes affect meaning, or the length is well outside the limit.\n3–4: points missing; little organisation; frequent errors.\n0–2: very little relevant writing.'}}
</script>

r:{title:"Why interviewers ask strange questions",k:"BBABC",text:[
"When Dana Keller applied for a marketing job at a large travel company, she expected questions about her experience. Instead, the first thing the interviewer asked was: “If you were an animal, what would you be?” Dana laughed nervously, thought on her feet, and answered, “An owl. I work best late at night and I notice details other people miss.”",
"She got the job. Two years later, Dana is the one doing the interviews, and she admits she asks bizarre questions too. “Most candidates arrive with perfect answers to ‘What are your strengths?’” she explains. “They've practised them a hundred times. An unexpected question shows me how someone reacts under pressure, and whether they can stay well-balanced when they don't know what's coming.”",
"However, not everyone agrees. Recruitment consultant Marcus Obi thinks such questions can be unfair. “Some brilliant applicants are simply shy,” he says. “They freeze, and the interviewer decides they aren't self-confident enough. That's a mistake.”",
"Even so, Marcus advises job-seekers to prepare for the unexpected. “Don't try to be funny. Be honest, and explain your answer. Interviewers aren't looking for the right answer – they want to see how you think.”"],
q:[["Why was Dana surprised in her interview?","She was asked about her experience.","The first question was unusual.","The interviewer laughed at her."],
["Why did Dana choose an owl?","It's her favourite animal.","It described the way she works.","The interviewer suggested it."],
["According to Dana, unexpected questions show…","how candidates react under pressure.","how much candidates have practised.","whether candidates are funny."],
["Marcus Obi believes strange questions…","are always fair.","can be a disadvantage for shy people.","should never be answered honestly."],
["Marcus's main advice to job-seekers is to…","memorize perfect answers.","make the interviewer laugh.","give an honest answer and explain it."]]},
l:{setting:"You will hear a careers adviser talking to a student about a job interview.",k:"BACBB",script:[
["Ruth","So, Tom, your interview's on Thursday. How are you feeling?"],
["Tom","Honestly, a bit nervous. It's my first interview for a full-time job."],
["Ruth","That's completely normal. What do you know about the company?"],
["Tom","Not much yet. They make software for hospitals, I think."],
["Ruth","Well, you need to find out more. Look at their website and read any recent news about them. Interviewers always notice when a candidate hasn't done their homework."],
["Tom","OK. And what about questions? Should I ask them anything?"],
["Ruth","Definitely. Prepare two or three. But don't ask about the salary in a first interview. Ask about training, or what a typical day looks like."],
["Tom","And what should I wear? It's a tech company, so maybe jeans?"],
["Ruth","I'd dress a bit smarter than you think you need to. You can always take your jacket off."],
["Tom","Good point. Anything else?"],
["Ruth","Yes. Arrive ten minutes early, not thirty. If you arrive too early, it can put pressure on the interviewer."]],
q:[["How does Tom feel about the interview?","confident","nervous","bored"],
["What does the company make?","software for hospitals","hospital equipment","websites"],
["Ruth says Tom should NOT ask about…","training.","a typical day.","the salary."],
["What does Ruth recommend about clothes?","Wear jeans.","Dress smarter than seems necessary.","Don't wear a jacket."],
["How early should Tom arrive?","thirty minutes","ten minutes","five minutes"]]},

r:{title:"Dressed for recovery",k:"ABBCB",text:[
"Five years ago, Amira Haddad twisted her ankle so badly that she needed an operation. She spent three weeks in hospital in a thin cotton gown that was too loose, opened at the back and, as she puts it, “made everyone look like a ghost”. “I've always loved fashion,” she says, “and I remember thinking: the elderly and the sick deserve to feel stylish too.”",
"Since leaving hospital, Amira has been designing clothes for patients. Her garments look like ordinary pyjamas and cardigans, but they have hidden zips so that doctors and nurses can check a wound or give an injection without the patient having to get undressed. So far she has sold more than 12,000 pieces, mostly to hospitals in Britain and Canada.",
"Nurses say the clothes make a real difference. “Patients who feel scruffy often feel worse,” explains Jo Patel, who has worked on a children's ward for fifteen years. “When they look good, they're more likely to get up, walk around, and get over their illness faster.”",
"Amira hasn't finished yet. For the past year she has been working on a range for people in wheelchairs, which she hopes to launch next spring."],

r:{title:"The island that runs on the wind",k:"BBACB",text:[
"On the small Danish island of Samsø, almost nobody worries about their electricity bill. A generation ago, the island depended almost completely on oil and coal brought in by boat. Today, wind turbines on the island and out at sea produce more electricity than the island's 3,700 people need, and the extra is sold to the mainland.",
"The change didn't happen overnight. When the project started, many farmers were against it. “People thought the turbines would be ugly and noisy,” remembers Søren Hermansen, a local teacher who led the project. “So instead of letting a big company build them, we asked islanders to buy shares. If you own part of a turbine, you don't complain about the noise – you listen to it and hear money.”",
"Samsø now attracts thousands of visitors who come to learn how a community can take control of its own energy. But the island hasn't finished yet. In the next few years, it hopes it will have replaced its petrol cars and diesel ferries with electric or biogas ones.",
"“Climate change is likely to get worse,” says Hermansen, “but we won't solve it by waiting for governments. Small places can act fast.”"],
q:[["Where did Samsø's energy come from in the past?","wind turbines","oil and coal","the mainland"],
["What happens to the extra electricity?","It is stored in batteries.","It is sold.","It is given free to farmers."],
["Why did local people accept the turbines?","They could own part of them.","The turbines were very quiet.","A big company paid them."],
["In the next few years, Samsø hopes to…","build more turbines at sea.","stop tourists visiting.","replace transport that uses petrol and diesel."],

r:{title:"What people really regret",k:"ABBBA",text:[
"For twelve years, nurse Helen Morris looked after people in the last weeks of their lives. When she asked them what they wished they had done differently, the same answers came up again and again.",
"The most common regret was about work. “Almost every man I cared for wished he hadn't worked so hard,” Helen says. “They had missed their children growing up, and by the time they realized, it was too late.” Many also wished they had stayed in touch with old friends. “People get busy, friendships fade, and then they feel lonely at the end.”",
"Another frequent regret was not expressing feelings. “Lots of patients told me they had kept quiet for years to avoid arguments. When they finally said what they thought, they were so relieved – but they wished they had done it much earlier.”",
"Surprisingly, very few people mentioned money. “Nobody ever said, ‘I wish I'd bought a bigger house,’” Helen remembers. “What they wanted was to have been braver and happier. If I could give one piece of advice, it would be this: don't wait for the right moment. It might never come.”"],
q:[["What was Helen's job?","a nurse caring for people who were dying","a psychologist","a researcher"],
["What did most men regret?","not earning more","working too much","not travelling"],

["How did patients feel when they finally expressed their feelings?","embarrassed","relieved","furious"],
["What surprised Helen?","how few people had regrets about money","how brave her patients were","how many wanted bigger houses"]]},

r:{title:"Music to sleep by",k:"BBABA",text:[
"Jana Novak used to lie awake for hours every night. “I tried everything – counting sheep, sleeping tablets, reading boring books – but nothing worked,” she says. Then a friend suggested listening to slow piano music before going to bed.",
"Three years later, Jana composes “sleep music” herself. Her pieces are long and simple, with no sudden changes and a steady rhythm of about sixty beats per minute – similar to a resting heart. “If the music surprises you, your brain wakes up,” she explains. “So I avoid anything dramatic. No drums, no singers, and definitely no trumpets.”",
"Sleep scientists are cautiously positive. In several studies, adults who listened to relaxing music for about forty-five minutes before bed fell asleep faster and woke up less often during the night. However, researchers warn that the effect only lasts if people keep doing it. “Your body needs time to get used to a new routine,” says sleep researcher Dr Paul Evans. “One night won't change much.”",
"Jana herself now falls asleep within twenty minutes. “The only problem,” she laughs, “is that I can't listen to my own music at work. I start yawning immediately.”"],
q:[["What was Jana's problem?","She overslept.","She couldn't fall asleep.","She had nightmares."],
["Jana's music is designed to…","be exciting.","follow a steady, slow rhythm.","include famous singers."],
["Why does Jana avoid dramatic music?","It makes the brain alert.","It's difficult to compose.","Listeners find it boring."],
["According to Dr Evans, the music works best if people…","listen only once.","listen regularly.","play it loudly."],
["What is the problem with Jana's music at work?","It makes her sleepy.","Her colleagues don't like it.","It is too loud."]]},
l:{setting:"You will hear a radio interview with Leo, a professional cellist.",k:"BBCBB",script:[
["Host","Leo, you play the cello in a professional orchestra. When did you start?"],
["Leo","When I was seven. My parents used to make me practise for an hour every day before I could play with my friends. I hated it at the time!"],
["Host","And now?"],
["Leo","Now I practise for about four hours a day. I'm used to it. It's just part of my routine, like brushing my teeth."],
["Host","What about touring? You travel a lot."],
["Leo","That was the hardest thing to get used to. The first year, I was always jet-lagged, and I couldn't sleep in hotels. Now I always take my own pillow."],
["Host","Really?"],
["Leo","Seriously! It sounds crazy, but it works."],
["Host","What kind of music do you listen to when you're not working?"],
["Leo","Not classical, funnily enough. I love jazz, especially the saxophone. I'd rather listen to something completely different."]],

r:{title:"Can you really spot a liar?",k:"BABBB",text:[
"Most of us believe we can tell when someone is lying. Liars, we think, avoid eye contact, touch their face or fold their arms. However, research suggests we are wrong far more often than we realize. In a typical experiment, volunteers watch videos of people telling true and invented stories. On average, they identify the liars only about 54% of the time – hardly better than tossing a coin.",
"Part of the problem is that nervous honest people and nervous liars look exactly the same. Someone who bites their nails or keeps scratching their head might simply be shy, tired or uncomfortable. Experienced liars, on the other hand, often seem relaxed and confident, because they have practised their story.",
"So what actually works? Some investigators now focus on what people say rather than how they look. True stories tend to contain small, unimportant details – a smell, a sound, a strange comment – while invented stories are often smooth and simple. Another technique is to ask someone to tell their story backwards. It sounds easy, but it is surprisingly difficult if the events never happened.",
"So the next time a friend's explanation seems a bit too perfect, don't look at their hands. Listen carefully instead."],
q:[["In the experiments, people identified liars…","almost always.","only slightly more than half the time.","less than a quarter of the time."],
["Why are nervous gestures unreliable?","Honest people may also be nervous.","Liars never feel nervous.","They are difficult to notice."],
["Experienced liars often seem…","shy.","calm and confident.","uncomfortable."],
["True stories often include…","very simple events.","small details that don't seem important.","lots of arguments."],
["Telling a story backwards is useful because…","it relaxes the speaker.","it's hard to do with an invented story.","it makes stories shorter."]]},

"When software company Brightline announced that it would give every member of staff an extra €2,000 a year – on condition that they spent it on a holiday – many people thought it was just an advertising trick. Despite the doubts, the scheme has now been running for six years, and managing director Sofia Lind says it is the best business decision the company has ever made.",
"The idea came after Lind noticed that several of her colleagues hadn't taken a single day off in over a year. “People were exhausted, and although they were working long hours, they weren't producing better work,” she says. “I wanted to change that so that staff would come back with new energy.”",
"There are some rules. Employees must switch off their work phones and are not allowed to check emails while they are away. “Whoever breaks the rule has to pay the money back,” Lind jokes, “though nobody ever has.”",
"The results have been impressive. Since the scheme was launched, the number of staff leaving the company has fallen by half, and profits have risen every year. Other firms have copied the idea, but Lind isn't worried. “Good ideas should be shared,” she says. “Happy staff make happy clients.”"],

r:{title:"The doctor who was his own guinea pig",k:"BBABC",text:[
"For most of the 20th century, doctors were certain that stomach ulcers were caused by stress, spicy food and too much acid. Millions of patients took medicine every day for years, and some needed operations. So when two Australian scientists, Robin Warren and Barry Marshall, suggested that the real cause was a type of bacteria, almost nobody believed them.",
"Warren, a pathologist, had noticed the tiny bacteria in samples taken from patients' stomachs. Marshall, a young doctor, tried to prove that they caused the illness, but his experiments on animals failed. Other experts refused to take the idea seriously.",
"In 1984, Marshall decided there was only one guinea pig left: himself. He drank a liquid full of the bacteria. Within days he was vomiting and had stomach pain, and tests showed that his stomach was badly inflamed. He then treated himself with antibiotics – and recovered.",
"It still took years for the medical world to change its mind. But in 2005, Warren and Marshall were awarded the Nobel Prize in Physiology or Medicine. Today, most ulcers can be cured with a short course of antibiotics – something that would have seemed impossible to doctors a few decades earlier."],
q:[["What did most doctors believe caused ulcers?","bacteria","stress and diet","antibiotics"],
["How did other experts first react to Warren and Marshall's idea?","They were enthusiastic.","They didn't take it seriously.","They repeated the experiments."],

["What happened after he drank the liquid?","Nothing happened.","He became ill.","He needed an operation."],
["Today, most ulcers are treated with…","operations.","daily medicine for many years.","a short course of antibiotics."]]},

r:{title:"Starting again at forty",k:"BAABC",text:[
"Two years ago, Marta Silva was working as an accountant in Lisbon. She had a good salary and a flat in the city centre, but she spent nearly two hours a day travelling to work. “I'd been doing the same job for fifteen years,” she says. “I wasn't unhappy, but I was bored.”",
"So she did something that surprised everyone. She quit her job, rented out her flat and moved to a small town in the north of Portugal to open a bakery. “My friends thought I'd gone mad. I had never baked professionally – I used to make cakes for birthdays, and that's all.”",
"The first year was hard. She had to get up at four o'clock every morning, and at first she made very little money. “There were days when I sold only ten loaves. If my sister hadn't lent me some money, I would have closed.”",
"Now the bakery has six employees and a queue outside every Saturday morning. Marta works longer hours than she did as an accountant, but she says she has never been happier. “I'm tired, but it's a good tired. And I don't miss spreadsheets at all.”"],

["Ella","Just on Saturdays now. I need time to study. Our exams are in January."],
