) this house. The neighbours are so noisy.","a":["hadn't bought"]},{"t":"tx","s":"Quick! Someone phone an ambulance! That man's ___ (run over) by a car!","a":["been run over","just been run over"]},{"t":"tx","s":"I ___ (writing) the report for an hour when Jo told me it wasn't needed any more.","a":["had been writing"]},{"t":"tx","s":"We ___ (not sit) on this beach now if we hadn't entered that competition.","a":["wouldn't be sitting"]},{"t":"tx","s":"A priceless painting ___ (report) to have been taken by the thieves.","a":["is reported","has been reported"]},{"t":"tx","s":"Take some warm clothes in case you ___ (get) cold later.","a":["get"]},{"t":"tx","s":"We ___ (still work) on this project at 5.00. It won't be finished till 8.00 or 9.00.","a":["will still be working"]},{"t":"tx","s":"We shouldn't ___ (spend) so much time shopping – we're going to be home late.","a":["have spent"]}]}]},{"k":"v","name":"Vocabulary","parts":[{"ins":"Complete the sentences with one word made from the word in brackets.","items":[{"t":"tx","s":"There are too many ___ people on the streets of our big cities. (home)","a":["homeless"]},{"t":"tx","s":"Do you really never suffer from ___? You spend so much time alone. (lonely)","a":["loneliness"]},{"t":"tx","s":"Stop being so ___ – you're too old to be acting like a child. (mature)","a":["immature"]},{"t":"tx","s":"The weather in this country is so ___ – you never know what to wear! (change)","a":["changeable"]},{"t":"tx","s":"The ___ during the storm was amazing – it lit up the countryside. (light)","a":["lightning"]},{"t":"tx","s":"Were you ___ when Dan said he'd heard you singing in the shower? (embarrass)","a":["embarrassed"]},{"t":"tx","s":"If you're ___ to milk, I can make your coffee with rice milk. (allergy)","a":["allergic"]},{"t":"tx","s":"I think these glasses are ___ – I dropped one on the floor and it was fine. (break)","a":["unbreakable"]},{"t":"tx","s":"___ is a problem in many big cities, especially graffiti. (vandal)","a":["Vandalism"]},{"t":"tx","s":"We love watching TV dramas, ___ murder mysteries. (special)","a":["especially"]}]},{"ins":"Complete the sentences with the correct word.","items":[{"t":"mc","s":"Have you ___ finished reading that newspaper? Can I have it when you have?","o":["yet","nearly","still"],"a":1},{"t":"mc","s":"Newspapers in my country don't tell you the real situation – they're all ___.","o":["objective","censored","accurate"],"a":1},{"t":"mc","s":"I was so ___ when the doctor told me I wouldn't need an operation.","o":["disappointed","relieved","bewildered"],"a":1},{"t":"mc","s":"Both of the teenagers have been charged ___ shoplifting.","o":["of","with","for"],"a":1},{"t":"mc","s":"You'll need to remind Simon to lock the door – he's very ___-minded.","o":["narrow","open","absent"],"a":2},{"t":"mc","s":"This café is part of a ___ – I often go to the one in my home town.","o":["chain","branch","company"],"a":0},{"t":"mc","s":"Scientists studying climate change have ___ an important discovery.","o":["done","carried out","made"],"a":2},{"t":"mc","s":"Please don't ___ your voice, there's no need to get angry.","o":["rise","raise","put up"],"a":1},{"t":"mc","s":"We're ___ and tired of hearing the same song on the radio.","o":["fed up","sick","bored"],"a":1},{"t":"mc","s":"We must take into ___ that Robin was very ill before the exam.","o":["place","care","account"],"a":2},{"t":"mc","s":"The choir came back and gave two ___ before the audience were ready to leave.","o":["encores","choruses","performances"],"a":0},{"t":"mc","s":"I've still got ___ on my feet from all that walking we did last week.","o":["bruises","blisters","rashes"],"a":1},{"t":"mc","s":"I think this jumper really ___ me. It goes well with my hair.","o":["fits","matches","suits"],"a":2},{"t":"mc","s":"I don't think Anna slept well last night – she's ___ asleep on the sofa now.","o":["full","fast","deep"],"a":1},{"t":"mc","s":"Don't you find it ___ when Americans say the date differently?","o":["confused","confusion","confusing"],"a":2}]},{"ins":"Write the words after the definitions. (Example: very angry = furious)","items":[{"t":"tx","s":"another word for luggage = ___","a":["baggage"]},{"t":"tx","s":"you put your head on this when you sleep = ___","a":["pillow"]},{"t":"tx","s":"a group of people who sing together = ___","a":["choir","chorus"]},{"t":"tx","s":"unsure how to react to something because your emotions are so strong = ___","a":["overwhelmed"]},{"t":"tx","s":"you use these to breathe = ___","a":["lungs"]},{"t":"tx","s":"when you open your mouth very wide because you are tired = ___","a":["yawn","yawning"]},{"t":"tx","s":"the opposite of tight (trousers) = ___","a":["loose"]},{"t":"tx","s":"the thing which planes take off from and land on = ___","a":["runway"]},{"t":"tx","s":"the person who controls how an orchestra plays = ___","a":["conductor"]},{"t":"tx","s":"someone who tries to avoid spending money = tight-___","a":["fisted","tight-fisted"],"show":"tight-fisted"},{"t":"tx","s":"the person in charge of a newspaper who decides what will go in it = ___","a":["editor"]},{"t":"tx","s":"not allowing water to go through it = ___","a":["waterproof"]},{"t":"tx","s":"a person who sees a crime = ___","a":["witness"]},{"t":"tx","s":"a person who works with you in a company = ___","a":["colleague"]},{"t":"tx","s":"a snow storm with very strong winds = ___","a":["blizzard"]}]}]},{"k":"p","name":"Pronunciation","parts":[{"ins":"Choose the stressed syllable.","items":[{"t":"syl","s":"","o":["vi","o","li","nist"],"a":2},{"t":"syl","s":"","o":["ex","port (verb)"],"a":1},{"t":"syl","s":"","o":["tur","bu","lence"],"a":0},{"t":"syl","s":"","o":["co","mmen","ta","tor"],"a":0},{"t":"syl","s":"","o":["un","con","scious"],"a":1},{"t":"syl","s":"","o":["mul","ti","na","tio","nal"],"a":2},{"t":"syl","s":"","o":["au","to","ma","ted"],"a":0},{"t":"syl","s":"","o":["neigh","bour","hood"],"a":0},{"t":"syl","s":"","o":["ob","jec","tive"],"a":1},{"t":"syl","s":"","o":["eye","brow"],"a":0}]},{"ins":"Choose the word with a different sound.","items":[{"t":"mc","s":"Which word has a different sound from bird?","o":["merge","firm","journalist","heart"],"a":3},{"t":"mc","s":"Which word has a different sound from tree?","o":["relieved","colleague","leather","illegal"],"a":2},{"t":"mc","s":"Which word has a different sound from horse?","o":["launch","drought","stalk","yawn"],"a":1},{"t":"mc","s":"Which word has a different sound from shower?","o":["specialist","infection","choke","rash"],"a":2},{"t":"mc","s":"Which word has a different sound from boot?","o":["loose","blood","chew","lose"],"a":1},{"t":"mc","s":"Which word has a different sound from train?","o":["baggage","faint","lay","ache"],"a":0},{"t":"mc","s":"Which word has a different sound from chess?","o":["scratch","machine","cello","chilly"],"a":1},{"t":"mc","s":"Which word has a different sound from bike?","o":["linen","height","biased","mild"],"a":0},{"t":"mc","s":"Which word has a different sound from fish?","o":["guilty","bilingual","business","presenter"],"a":1},{"t":"mc","s":"Which word has a different sound from up?","o":["multicultural","flood","hooded","luggage"],"a":2}]}]},{"k":"r","name":"Reading","title":"A Step In The Right Direction","text":["It was once famously said that some things in life – like paying taxes and death – are inevitable. And leaving education trying to find employment is something that young people everywhere have to face. But despite the large amount of research that has been undertaken on young people in the job market, relatively little is known about what happens once young people start their first job. A team of researchers from Leeds Metropolitan University looked into this aspect. The survey focused on 30 people and 39 employers, and addressed a range of issues in relation to recruitment, employment, and particularly young people entering into the workplace.","It is clear from the interviews with young people that, for the vast majority, the idea of a ‘job for life’ no longer exists. While some had clear career ambitions, the majority appeared to be unclear on what they wanted to do. One consequence of this is that many young people saw their early work experiences as temporary – a ‘stop gap’ until their ideas on what they wanted to do had developed, or simply a way of earning money to pursue other ambitions such as travel.","This tendency has also been noted by many employers, and is particularly disappointing to smaller businesses looking for long-term loyalty in their staff. However, some employers – for example in areas such as financial services and call centres – had adjusted to the new situation, and appeared to accept that they cannot expect young people to be loyal and see a long-term future with one employer. Like a number of other studies, the findings confirm that employers tend to focus on ‘softer’ skills and behavioural qualities in the recruitment process, with a less prominent role played by formal qualifications. The opinions of this sample of young people were remarkably consistent with those of the employers. Most of the young people seemed to have understood the message that formal qualifications are often a necessary, but not sufficient, condition for obtaining the types of jobs which they hope to do in the future. They recognized that skills like communication, team-working, organization, and customer service are all important. There was evidence that many young people had clearly worked on developing such skills.","Where there does appear to be a significant difference of opinion between the views of young people and employers related to the extent to which young people actually possess the necessary ‘employability’ skills. By and large, the young people interviewed were confident in their ability to demonstrate these skills and qualities. Employers, on the whole, were much less positive about this, often feeling that educational institutions were focusing too strongly on academic skills and qualifications, at the expense of employability.","Another area where employers’ and young peoples’ views differed was in relation to Information Technology (IT) skills. When asked about the things they value most about young recruits, many employers mentioned their ability with computers. On the other hand, few young people mentioned this explicitly. The probable explanation is that young people simply take their IT skills for granted, often not realizing how valuable they might be to some employers. Encouraging young people to be more positive about this aspect might help some to improve the way they are viewed by potential employers.","In terms of the inductions provided for their young recruits, the results of this study confirmed both expectations and the findings of earlier research – that employers vary widely in the nature of the training they provide.","Differences included the length of time the inductions ran, how formal the training was, and how often training occurred. The reaction of most young people to the induction they had experienced was positive, or at least neutral. There is clearly a tension between the need for new recruits to become good at their jobs, and their understandable desire to get involved as quickly as possible.","From the point of view of the employer, much depended upon the nature of the job, the type of employer (particularly size and sector), and the frequency with which they recruit young people. In general, the more regularly young people were recruited and the larger the employer, the more formal the induction process.","In uncertain economic times, it seems that young people more than ever are having to do all they can to find employment."],"hl":[],"parts":[{"ins":"Read the article. For questions 1–5, choose the correct answer (A, B, C, or D). Two marks each.","items":[{"t":"mc","s":"The survey revealed that, in general, young people …","o":["place little value on their early work experience.","would rather take a year off before going to university.","feel they will change jobs throughout their working lives.","are unclear about what they want to do when they finish their education."],"a":2,"w":2,"abcd":1},{"t":"mc","s":"What do employers think about behavioural qualities?","o":["They are less important than formal qualifications.","They are more important than formal qualifications.","They are just as important as formal qualifications.","They are not important at all when recruiting employees."],"a":1,"w":2,"abcd":1},{"t":"mc","s":"What can we learn from the survey about young people and IT skills?","o":["Young people need to let employers know that they have these skills.","Employers feel their own skills are inferior to those of young people they employ.","They are something that young people need to work on before starting a job.","Not all employers assume that young people have adequate knowledge in this area."],"a":0,"w":2,"abcd":1},{"t":"mc","s":"The survey suggests that young people themselves value skills such as …","o":["being able to fit in easily at work.","being able to set higher standards than others.","being able to work more quickly than colleagues.","being able to bring in more customers for the business."],"a":0,"w":2,"abcd":1},{"t":"mc","s":"Induction processes vary in terms of …","o":["why they are implemented.","who they are managed by.","when they are carried out.","how they are evaluated."],"a":2,"w":2,"abcd":1}]}]},{"k":"w","name":"Writing","task":"Write a report on the following topic: 'Workplaces of the future'. Write 140–180 words.","bullets":["say what you think the workplaces of the future will be like","say why you think changes in the workplace will take place","discuss how the changes will affect employees' lives"]},{"k":"l","name":"Listening","parts":[{"ins":"Listen to five teenagers talk about trips they have made with their families. Choose from the list (A–F) what each speaker says they have learned as a result of going on the trip. There is one extra letter you do not need to use.","list":["Be reasonable about how long it takes to get ready before you go.","Visiting countries which are dissimilar to your own is good for you.","Being well prepared in advance pays off.","You can learn things from family members.","You realize the benefits of the comforts of home more when you travel.","It's nice to have a cheerful, optimistic approach."],"script":[["Speaker 1","We went camping in Scotland, and Dad had planned everything – maps, food, where we'd stay each night. When the weather turned bad, we still knew exactly where to go. I learned that careful planning really pays off."],["Speaker 2","We visited my grandparents' village in Greece. My grandmother taught me to cook, and my grandfather told me stories about his life. I learned so much from them."],["Speaker 3","We spent a month travelling round India by train. It was amazing, but when I got home I couldn't believe how much I'd missed my own bed and a hot shower!"],["Speaker 4","My parents took us to Mongolia, and we stayed with a nomad family in their tent. It was so different from anything I knew – I think unusual experiences like that are really good for you."],["Speaker 5","Our flight was cancelled and we had to spend the night at the airport. My mum just laughed and turned it into an adventure. I learned that staying positive and cheerful makes everything easier."]],"items":[{"t":"mc","s":"Speaker 1","o":["A","B","C","D","E","F"],"a":2,"gap":1},{"t":"mc","s":"Speaker 2","o":["A","B","C","D","E","F"],"a":3,"gap":1},{"t":"mc","s":"Speaker 3","o":["A","B","C","D","E","F"],"a":4,"gap":1},{"t":"mc","s":"Speaker 4","o":["A","B","C","D","E","F"],"a":1,"gap":1},{"t":"mc","s":"Speaker 5","o":["A","B","C","D","E","F"],"a":5,"gap":1}]},{"ins":"Listen to a talk by a young dancer who is doing a course at the Youth Ballet School. Choose the correct answer.","script":[["Sophie","Hi, I'm Sophie, and I'm sixteen. I'm in my first year at the Youth Ballet School. People think you have to be a top dancer to get in, but that's not really true. What the teachers look for is whether you can cope with the demands of the course – the long hours and the hard training. Some people apply several times, but I got in on my first try."],["Sophie","The audition had two rounds. In the first round I was really nervous, because the judges were sitting so close to us – just a metre away – and I could see them writing notes. I didn't feel confident at all. There were about forty other dancers, but I didn't really notice them."],["Sophie","The letter arrived three weeks later. It said I'd been offered a place, and that they'd thought very carefully about each dancer's audition. I was really pleased about that – it meant I'd earned it. It didn't mention any particular role, but that didn't matter to me."],["Sophie","Now we rehearse every day for our winter show. I didn't expect it to be so tiring – I'm exhausted every evening! And rehearsing on stage isn't any easier than in the studio."],["Sophie","As for the future, I know only a few dancers reach the very top, so I'm not saying I'll be a star. I'm also studying for my exams, just in case. But I really hope I'll be able to earn a living from dancing."]],"items":[{"t":"mc","s":"Sophie says that students who are admitted to the course ___.","o":["have probably applied several times for a place","should have achieved top marks in ballet","must prove they're up to the challenge of the course"],"a":2},{"t":"mc","s":"Throughout the first part of her audition, Sophie ___.","o":["felt anxious that she wasn't far enough from the judges","had a lot of belief in herself","was distracted by the other dancers"],"a":0},{"t":"mc","s":"When she heard that she'd got a place at the School, Sophie was ___.","o":["concerned that she hadn't been told about a specific role","annoyed because the letter arrived so late","pleased that the School had considered her audition carefully"],"a":2},{"t":"mc","s":"According to Sophie, rehearsing is ___.","o":["developing her dancing","unexpectedly demanding","less difficult on stage"],"a":1},{"t":"mc","s":"Regarding her future, Sophie ___.","o":["is determined to make it to the top of her career","hopes she can earn her living from dancing","is not planning any other career"],"a":1}]}]},{"k":"s","name":"Speaking","tasks":[{"name":"Ask and answer","mins":4,"lead":"Answer the teacher's questions. Then make questions from the prompts and ask the teacher.","prompts":["Who / most interesting person / ever met?","What / hope will happen to you in the future?","In the future, which city / like to live in?","How / get to sleep at night?","What / most amusing thing which / happen to you recently?"]},{"name":"Discussion","mins":3,"lead":"Choose one of the statements. Say if you agree or disagree and give reasons.","prompts":["'Anti-social crimes, such as vandalism or drunken behaviour, should be more severely punished.'","'The cost of air travel should increase to stop people from flying as much and to prevent climate change.'","'The more sleep you get, the longer you are likely to live.'"]},{"name":"Short talk","mins":2,"lead":"Talk for about a minute on a topic the teacher chooses from the course. The teacher then asks if you agree with a different view.","prompts":[]}],"crit":["Grammar","Vocabulary","Pronunciation","Fluency and interaction"]}],"kind2":"end"});

/* theme */

/* scoring */
function secData(t,k){if(k==='r')return{q:t.r.q,k:t.r.k,w:2};if(k==='l')return{q:t.l.q,k:t.l.k,w:2};return{q:t[k].q,k:t[k].k,w:1}}
function secScore(t,k){if(FK(t))return fScore(t,k);const st=ts(t.id);if(k==='s')return Object.values(st.s).reduce((a,b)=>a+b,0);const d=secData(t,k);let c=0;for(const i in st.a[k]){if(L[st.a[k][i]]===d.k[i])c+=d.w}return c}
function secDone(t,k){if(FK(t))return fDone(t,k);const st=ts(t.id);if(k==='s')return Object.keys(st.s).length;return Object.keys(st.a[k]).length}
function secCount(t,k){if(FK(t))return fCount(t,k);if(k==='s')return t.s.tasks.length;return secData(t,k).q.length}
const reveal=t=>state.mode==='practice'||ts(t.id).marked;
function band(p){if(p>=90)return'Excellent';if(p>=75)return'Good';if(p>=60)return'Satisfactory';if(p>=40)return'Needs revision';return'Needs a lot of revision'}

/* text formatting */
function fmtPron(s){return esc(s).replace(/\*(.+?)\*/g,'<b class="snd">$1</b>').replace(/_(.+?)_/g,'<u class="str">$1</u>')}
function fmtStem(s,filled){
  return s.split('\n').map(line=>{
    let m=line.match(/^([AB]):\s*(.*)$/);let pre='';
    if(m){pre='<span class="spk">'+m[1]+'</span>';line=m[2]}
    const parts=line.split(/_{3,}/);
    return pre+parts.map(esc).join(filled!=null?'<span class="blank filled">'+esc(filled)+'</span>':'<span class="blank" aria-label="gap"></span>')
  }).join('<br>');
}

/* nav */
function renderNav(){
  let h='';
  for(const c of COLLECTIONS){
    h+='<h2>'+esc(c.name)+'</h2>';
    if(!c.ids.length){h+='<p class="soon">Not added yet</p>';continue}
    if(c.grid){h+='<div class="fgrid">';for(let i=0;i<c.ids.length;i+=2){const n=TESTS.find(x=>x.id===c.ids[i]).title.match(/\d+/)[0];h+='<span class="fn">File '+n+'</span>'+c.ids.slice(i,i+2).map(id=>{const t=TESTS.find(x=>x.id===id);const tot=secsFor(t).reduce((a,s)=>a+secScore(t,s.k),0);const any=secsFor(t).some(s=>secDone(t,s.k)>0);return'<button data-test="'+id+'" aria-current="'+(id===state.cur)+'" title="'+esc(t.title)+'">'+id.slice(-1).toUpperCase()+(any&&reveal(t)?'<small>'+tot+'</small>':'')+'</button>'}).join('')}h+='</div>';continue}
    h+='<ul>';
    for(const id of c.ids){const t=TESTS.find(x=>x.id===id);const tot=secsFor(t).reduce((a,s)=>a+secScore(t,s.k),0);const any=secsFor(t).some(s=>secDone(t,s.k)>0);
      h+='<li><button data-test="'+id+'" aria-current="'+(id===state.cur)+'"><span>'+esc(t.title)+'</span><span class="mini">'+(any&&reveal(t)?tot:'')+'</span></button></li>'}

  }

function qBlock(t,k,i,item,isPron){
  const st=ts(t.id),d=secData(t,k),ch=st.a[k][i],rv=reveal(t),right=L.indexOf(d.k[i]);
  const stem=isPron?null:item[0],opts=isPron?item:item.slice(1);
  const locked=(state.mode==='practice'&&ch!=null)||st.marked;
  let h='<div class="q" id="q-'+k+'-'+i+'"><div class="n">'+(i+1)+'</div><div>';
  if(stem!=null)h+='<div class="stem">'+fmtStem(stem,(ch!=null&&stem.indexOf('___')>-1)?opts[ch]:null)+'</div>';
  h+='<div class="opts">';
  opts.forEach((o,j)=>{let c='opt';
    if(ch===j)c+=' sel';
    if(rv&&ch!=null){if(j===ch)c+=(j===right?' ok':' no');else if(j===right)c+=' key'}
    h+='<button class="'+c+'" data-k="'+k+'" data-i="'+i+'" data-j="'+j+'"'+(locked?' disabled':'')+' aria-pressed="'+(ch===j)+'"><span class="l">'+L[j]+'</span><span>'+(isPron?fmtPron(o):esc(o))+'</span></button>'});
  h+='</div>';
  if(rv&&ch!=null)h+='<div class="verdict '+(ch===right?'ok">Correct':'no">Answer: '+L[right]+'  '+(isPron?opts[right].replace(/[*_]/g,''):esc(opts[right])))+'</div>';
  return h+'</div></div>';
}
function listBlock(t,k,obj,isPron){
  let h='',pi=0;
  obj.q.forEach((item,i)=>{
    if(obj.parts&&pi<obj.parts.length&&obj.parts[pi][0]===i){h+='<h3 class="part">'+esc(obj.parts[pi][1])+'</h3>';pi++}
    h+=qBlock(t,k,i,item,isPron)});
  return h;
}

function renderSec(t,k){
  if(FK(t))return fRenderSec(t,k);
  if(k==='g')return'<h2>Grammar</h2>'+listBlock(t,'g',t.g,false);
  if(k==='v')return'<h2>Vocabulary</h2>'+listBlock(t,'v',t.v,false);
  if(k==='p')return'<h2>Pronunciation</h2>'+listBlock(t,'p',t.p,true);
  if(k==='r'){
    return'<h2>Reading</h2><p class="focus" style="color:var(--muted)">Read the text and choose A, B, or C. Two marks for each answer.</p><div class="reading"><article class="text"><h3>'+esc(t.r.title)+'</h3>'+t.r.text.map(p=>'<p>'+esc(p)+'</p>').join('')+'</article><div>'+t.r.q.map((q,i)=>qBlock(t,'r',i,q,false)).join('')+'</div></div>';
  }
  if(k==='l')return renderListening(t);
  if(k==='s')return renderSpeaking(t);
}
function bindSec(t){
  if(FK(t))return fBind(t);
  document.querySelectorAll('#sec .opt').forEach(b=>b.onclick=()=>{
    const st=ts(t.id),k=b.dataset.k,i=+b.dataset.i,j=+b.dataset.j;
    if(st.marked)return;
    if(state.mode==='practice'&&st.a[k][i]!=null)return;
    st.a[k][i]=j;save();refreshQ(t,k,i);renderTabs();renderLedger();renderNav();
  });
  if(state.sec==='l')bindListening(t);
  if(state.sec==='s')bindSpeaking(t);
}
function refreshQ(t,k,i){
  const el=document.getElementById('q-'+k+'-'+i);if(!el)return;
  const src=k==='r'?t.r.q[i]:k==='l'?t.l.q[i]:t[k].q[i];
  el.outerHTML=qBlock(t,k,i,src,k==='p');
  const nel=document.getElementById('q-'+k+'-'+i);
  nel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const st=ts(t.id),j=+b.dataset.j;if(st.marked)return;if(state.mode==='practice'&&st.a[k][i]!=null)return;
    st.a[k][i]=j;save();refreshQ(t,k,i);renderTabs();renderLedger();renderNav()});
}
function renderTabs(){const t=T(),SECS=secsFor(t);document.querySelectorAll('.tabs [data-sec]').forEach(b=>{const s=SECS.find(x=>x.k===b.dataset.sec);b.querySelector('.badge').textContent=reveal(t)?secScore(t,s.k)+'/'+s.max:secDone(t,s.k)+'/'+secCount(t,s.k)})}

/* listening */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let voices=[],playing=false,paused=false,chosenVoice='';
function loadVoices(){if(!synth)return;const all=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang)||v.lang==='en');
  const rank=v=>(/en[-_]GB/i.test(v.lang)?3:/en[-_](IE|AU|NZ)/i.test(v.lang)?2:/en[-_]US/i.test(v.lang)?1:0)+(v.localService?0.5:0);
  voices=all.sort((a,b)=>rank(b)-rank(a));
  const sel=document.getElementById('voice');if(sel)fillVoices(sel)}
function fillVoices(sel){sel.innerHTML='<option value="">Automatic (British first)</option>'+voices.map(v=>'<option value="'+esc(v.name)+'"'+(v.name===chosenVoice?' selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('')}
if(synth){loadVoices();if(synth.addEventListener)synth.addEventListener('voiceschanged',loadVoices);else synth.onvoiceschanged=loadVoices}
function stopAudio(){if(synth){synth.cancel()}playing=false;paused=false;curPart=-1}
function renderListening(t){
  const st=ts(t.id);const lim=2;
  let h='<h2>Listening</h2><p style="color:var(--muted);margin:0">'+esc(t.l.setting)+' Choose A, B, or C. Two marks for each answer.</p>';
  h+='<div class="player">';
  if(!synth){h+='<p style="margin:0">Audio playback isn\'t available in this browser. The teacher can reveal the script and read it aloud.</p>'}
  else{
    h+='<div class="row"><button class="primary" id="lplay">'+(paused?'Resume':'Play recording')+'</button><button id="lpause">Pause</button><button id="lstop">Stop</button><span class="plays" id="lplays">Plays used: '+st.plays+' of '+lim+'</span></div>';
    h+='<div class="row" style="margin-top:10px"><label>Voice <select id="voice"></select></label><label>Speed <select id="rate"><option value="0.85">Slower</option><option value="0.95" selected>Normal</option><option value="1.05">Faster</option></select></label></div>';
    h+='<div class="status" id="lstatus">'+(st.plays>=lim?'Both plays used. The teacher can allow another play.':'Press play when the class is ready.')+'</div>';
    h+='<div class="row" style="margin-top:6px"><button class="linkbtn" id="lreset" style="color:#E7D6A2">Teacher: allow another play</button></div>';
  }
  h+='</div>';
  h+='<p><button class="linkbtn" id="ltoggle">'+(st.showScript?'Hide script':'Show script (teacher)')+'</button></p>';
  if(st.showScript)h+='<div class="script" id="lscript">'+t.l.script.map((ln,i)=>'<p data-line="'+i+'"><b>'+esc(ln[0])+':</b> '+esc(ln[1])+'</p>').join('')+'</div>';
  h+=t.l.q.map((q,i)=>qBlock(t,'l',i,q,false)).join('');
  return h;
}
function bindListening(t){
  const st=ts(t.id),lim=2;
  const tg=$('#ltoggle');if(tg)tg.onclick=()=>{st.showScript=!st.showScript;save();$('#sec').innerHTML=renderSec(t,'l');bindSec(t)};
  if(!synth)return;
  const vs=$('#voice');fillVoices(vs);vs.onchange=()=>{chosenVoice=vs.value};
  $('#lreset').onclick=()=>{st.plays=Math.max(0,st.plays-1);save();$('#lplays').textContent='Plays used: '+st.plays+' of '+lim;$('#lstatus').textContent='One more play allowed.'};
  $('#lpause').onclick=()=>{if(playing&&!paused){synth.pause();paused=true;$('#lplay').textContent='Resume';$('#lstatus').textContent='Paused.'}};
  $('#lstop').onclick=()=>{stopAudio();$('#lplay').textContent='Play recording';$('#lstatus').textContent='Stopped.';markLine(-1)};
  $('#lplay').onclick=()=>{
    if(paused){synth.resume();paused=false;$('#lplay').textContent='Play recording';$('#lstatus').textContent='Playing…';return}
    if(playing)return;
    if(st.plays>=lim){$('#lstatus').textContent='Both plays used. The teacher can allow another play.';return}
    st.plays++;save();$('#lplays').textContent='Plays used: '+st.plays+' of '+lim;
    speakScript(t,+$('#rate').value);
  };
}
function markLine(i){document.querySelectorAll('#lscript p').forEach(p=>p.classList.toggle('now',+p.dataset.line===i))}
function speakScript(t,rate){
  synth.cancel();
  const speakers=[...new Set(t.l.script.map(l=>l[0]))];
  const base=chosenVoice?voices.find(v=>v.name===chosenVoice):voices[0];
  const pool=chosenVoice?[base]:voices.slice(0,4);
  const pitches=[1,1.18,0.88,1.08];
  const q=[];
  t.l.script.forEach((ln,li)=>{
    const si=speakers.indexOf(ln[0]);
    const v=pool.length?pool[si%pool.length]:null;
    const pitch=(pool.length>si)?1:pitches[si%pitches.length];
    (ln[1].match(/[^.!?…]+[.!?…]*[”"’']?\s*/g)||[ln[1]]).forEach(s=>{s=s.trim();if(!s)return;
      const u=new SpeechSynthesisUtterance(s);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
      u.rate=rate;u.pitch=pitch;u.ifVoice=si%2?"female":"male";u.onstart=()=>markLine(li);q.push(u)});
  });
  if(!q.length)return;
  playing=true;paused=false;$('#lstatus').textContent='Playing…';
  q[q.length-1].onend=()=>{playing=false;paused=false;const s=$('#lstatus');if(s)s.textContent='Finished. Answer the questions below.';markLine(-1)};
  q.forEach(u=>{u.onerror=()=>{playing=false}});
  q.forEach(u=>synth.speak(u));
}

let timer=null,timerLeft=0,timerTask=-1;
function stopTimer(){if(timer)clearInterval(timer);timer=null;timerTask=-1}
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function renderSpeaking(t){
  const st=ts(t.id);
  let h='<h2>Speaking</h2><p style="color:var(--muted);margin:0">The teacher gives each task a mark from 0 to 10 using the guide below. Useful language this file: '+esc(t.s.focus)+'</p>';
  h+='<div class="bands"><table><tr><td>9–10</td><td>Fluent and relaxed, wide range of grammar and vocabulary from the file, very few errors, clear pronunciation.</td></tr><tr><td>7–8</td><td>Mostly fluent, good range, some errors that don\'t block understanding.</td></tr><tr><td>5–6</td><td>Completes the task with pauses; limited range; errors sometimes affect meaning.</td></tr><tr><td>3–4</td><td>Short answers, frequent errors, needs help from the teacher.</td></tr><tr><td>0–2</td><td>Very little language produced.</td></tr></table></div>';
  t.s.tasks.forEach((tk,i)=>{
    h+='<div class="task"><h3>Task '+(i+1)+': '+esc(tk.name)+'</h3><div class="meta">About '+tk.mins+' minute'+(tk.mins>1?'s':'')+'. '+esc(tk.lead)+'</div>';

    h+='<ul>'+tk.prompts.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>';

    h+='<div class="timer"><span class="clock" id="clock'+i+'">'+mmss(left)+'</span><button data-tstart="'+i+'">'+(timerTask===i&&timer?'Pause':'Start timer')+'</button><button data-treset="'+i+'">Reset</button></div>';
    h+='<div class="rate" role="group" aria-label="Mark for task '+(i+1)+'"><span class="lab">Mark</span>';
    for(let n=0;n<=10;n++)h+='<button data-task="'+i+'" data-n="'+n+'" aria-pressed="'+(st.s[i]===n)+'">'+n+'</button>';
    h+='</div></div>';
  });
  return h;

function bindSpeaking(t){
  const st=ts(t.id);
  document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const i=+b.dataset.task,n=+b.dataset.n;
    if(st.s[i]===n)delete st.s[i];else st.s[i]=n;save();
    b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(st.s[i]===+x.dataset.n)));
    renderTabs();renderLedger();renderNav()});
  document.querySelectorAll('[data-tstart]').forEach(b=>b.onclick=()=>{const i=+b.dataset.tstart;
    if(timerTask===i&&timer){clearInterval(timer);timer=null;b.textContent='Resume';return}
    if(timerTask!==i){stopTimer();document.querySelectorAll('[data-tstart]').forEach(x=>x.textContent='Start timer');timerTask=i;timerLeft=t.s.tasks[i].mins*60}
    b.textContent='Pause';
    timer=setInterval(()=>{timerLeft--;const c=document.getElementById('clock'+i);if(c)c.textContent=mmss(Math.max(0,timerLeft));
      if(timerLeft<=0){clearInterval(timer);timer=null;if(c)c.textContent='Time';b.textContent='Start timer';timerTask=-1}},1000)});

    const c=document.getElementById('clock'+i);if(c)c.textContent=mmss(t.s.tasks[i].mins*60);const s=document.querySelector('[data-tstart="'+i+'"]');if(s)s.textContent='Start timer'});
}

/* ===== File / progress / end-of-course test engine ===== */
const FK=t=>t&&t.kind==='file';
const fsec=(t,k)=>t.secs.find(s=>s.k===k);
function fitems(sec){const out=[];(sec.parts||[]).forEach((p,pi)=>(p.items||[]).forEach((it,ii)=>out.push({id:pi+'-'+ii,it,p,pi,ii})));return out}
const iw=it=>it.w||(it.t==='ms'?it.a.length:1);
function fmax(sec){if(sec.k==='w')return 10;if(sec.k==='s')return sec.crit.length*5;return fitems(sec).reduce((a,x)=>a+iw(x.it),0)}
function fans(t,k){const st=ts(t.id);if(!st.a[k])st.a[k]={};return st.a[k]}
function fw(t){const st=ts(t.id);if(!st.w)st.w={text:'',mark:null};return st.w}

function variants(s){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"]/g,'').replace(/[–—-]/g,' ').replace(/[.,!?;:()]/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bshan't\b/g,'shall not')
     .replace(/n't\b/g,' not').replace(/'ve\b/g,' have').replace(/'re\b/g,' are').replace(/'ll\b/g,' will').replace(/'m\b/g,' am');
  const out=new Set();
  for(const d of ['had','would'])for(const z of ['is','has',"'s"])
    out.add(s.replace(/'d\b/g,' '+d).replace(/'s\b/g,z==="'s"?"'s":' '+z).replace(/\s+/g,' ').trim());
  return out;
}
function match(v,ans){if(!v||!String(v).trim())return false;const V=variants(v);return ans.some(a=>{for(const x of variants(a))if(V.has(x))return true;return false})}

function iscore(it,v){
  if(v==null)return 0;
  if(it.t==='mc'||it.t==='syl')return(Array.isArray(it.a)?it.a.includes(v):v===it.a)?iw(it):0;
  if(it.t==='ms')return v.filter(x=>it.a.includes(x)).length;
  if(it.t==='tx'||it.t==='ord')return(v.c&&match(v.v,it.a))?iw(it):0;
  return 0;
}
function idone(it,v){if(v==null)return false;if(it.t==='ms')return v.length>=it.a.length;if(it.t==='tx'||it.t==='ord')return!!v.c;return true}
function fScore(t,k){const st=ts(t.id),sec=fsec(t,k);
  if(k==='w')return fw(t).mark||0;
  if(k==='s')return Object.values(st.s).reduce((a,b)=>a+b,0);
  const A=fans(t,k);return fitems(sec).reduce((a,x)=>a+iscore(x.it,A[x.id]),0)}
function fDone(t,k){const st=ts(t.id),sec=fsec(t,k);
  if(k==='w')return fw(t).mark!=null?1:0;
  if(k==='s')return Object.keys(st.s).length;
  const A=fans(t,k);return fitems(sec).filter(x=>idone(x.it,A[x.id])).length}
function fCount(t,k){const sec=fsec(t,k);if(k==='w')return 1;if(k==='s')return sec.crit.length;return fitems(sec).length}
function fAttempted(t,k){const st=ts(t.id),sec=fsec(t,k);
  if(k==='w')return fw(t).mark!=null?10:0;
  if(k==='s')return Object.keys(st.s).length*5;
  const A=fans(t,k);return fitems(sec).filter(x=>idone(x.it,A[x.id])).reduce((a,x)=>a+iw(x.it),0)}

function fStemWith(s,inner){
  return s.split('\n').map(line=>{
    let m=line.match(/^([AB]):\s*(.*)$/);let pre='';
    if(m){pre='<span class="spk">'+m[1]+'</span>';line=m[2]}
    if(line.indexOf('___')<0)return pre+esc(line);
    const parts=line.split(/_{3,}/);
    return pre+esc(parts[0])+inner+esc(parts.slice(1).join(''));
  }).join('<br>');
}
function joinWords(ws){let s=ws.join(' ').replace(/\s+([,?!.])/g,'$1');return s?s.charAt(0).toUpperCase()+s.slice(1):s}

function fItem(t,k,x){
  const st=ts(t.id),A=fans(t,k),v=A[x.id],it=x.it,rv=reveal(t);
  const done=idone(it,v);

function fParts(t,k,sec){

let curPart=-1;
function fMarkLine(pi,i){document.querySelectorAll('#lscript'+pi+' p').forEach(p=>p.classList.toggle('now',+p.dataset.line===i))}
function fSpeak(t,pi,rate){
  synth.cancel();
  const lines=fsec(t,'l').parts[pi].script;
  const speakers=[...new Set(lines.map(l=>l[0]))];
  const base=chosenVoice?voices.find(v=>v.name===chosenVoice):voices[0];
  const pool=chosenVoice?[base]:voices.slice(0,4);
  const pitches=[1,1.15,0.9,1.08,0.95];
  const q=[];let prev=null;
  lines.forEach((ln,li)=>{
    const si=speakers.indexOf(ln[0]);
    const v=pool.length?pool[si%pool.length]:null;
    const pitch=pool.length>si?1:pitches[si%pitches.length];
    if(/^Speaker \d/.test(ln[0])&&ln[0]!==prev){const a=new SpeechSynthesisUtterance(ln[0]+'.');if(base){a.voice=base;a.lang=base.lang}else a.lang='en-GB';a.rate=rate;a.onstart=()=>fMarkLine(pi,li);q.push(a)}
    prev=ln[0];
    (ln[1].match(/[^.!?…]+[.!?…]*['’”"]?\s*/g)||[ln[1]]).forEach(s=>{s=s.trim();if(!s)return;
      const u=new SpeechSynthesisUtterance(s);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
      u.rate=rate;u.pitch=pitch;u.onstart=()=>fMarkLine(pi,li);q.push(u)});
  });
  if(!q.length)return;
  playing=true;paused=false;curPart=pi;const s=document.getElementById('lstatus'+pi);if(s)s.textContent='Playing…';
  q[q.length-1].onend=()=>{playing=false;paused=false;curPart=-1;const s=document.getElementById('lstatus'+pi);if(s)s.textContent='Finished. Answer the questions below.';fMarkLine(pi,-1)};
  q.forEach(u=>{u.onerror=()=>{playing=false}});
  q.forEach(u=>synth.speak(u));
}

/* binding */
function fRerender(t){

  $('#sec').innerHTML=fRenderSec(t,state.sec);fBind(t);
  const tx2=document.getElementById('rtext');if(tx2)tx2.scrollTop=sTop;window.scrollTo(0,y);
  renderTabs();renderLedger();renderNav();

function fBind(t){
  const st=ts(t.id),k=state.sec,sec=fsec(t,k);
  const get=id=>fitems(sec).find(x=>x.id===id);
  const blocked=it=>{const v=fans(t,k)[it.id];return st.marked||(state.mode==='practice'&&idone(it.it,v))};
  document.querySelectorAll('#sec .opt[data-id]').forEach(b=>b.onclick=()=>{
    const x=get(b.dataset.id);if(!x||blocked(x))return;const A=fans(t,k),j=+b.dataset.j;
    if(x.it.t==='ms'){let cur=A[x.id]||[];cur=cur.includes(j)?cur.filter(z=>z!==j):cur.concat(j);if(cur.length>x.it.a.length)cur=cur.slice(1);A[x.id]=cur}
    else A[x.id]=j;
    save();fRerender(t)});
  const commit=(inp,focusNext)=>{const x=get(inp.dataset.id);if(!x||blocked(x))return;const A=fans(t,k);
    if(!inp.value.trim()){delete A[x.id];save();return}
    A[x.id]={v:inp.value,c:true};save();
    const all=[...document.querySelectorAll('#sec input.tx')];const idx=all.indexOf(inp);
    fRerender(t);
    if(focusNext){const nx=[...document.querySelectorAll('#sec input.tx:not([disabled])')];const n=nx.find(e=>all.findIndex(a=>a.dataset.id===e.dataset.id)>idx);if(n)n.focus()}};
  document.querySelectorAll('#sec input.tx').forEach(inp=>{
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit(inp,true)}};
    if(state.mode==='practice')inp.onchange=()=>commit(inp,false);
    inp.oninput=()=>{const x=get(inp.dataset.id);const A=fans(t,k);if(state.mode==='exam'&&!st.marked){A[x.id]={v:inp.value,c:!!inp.value.trim()};save();renderTabs();renderLedger()}};
  });
  document.querySelectorAll('#sec [data-check]').forEach(b=>b.onclick=()=>{const inp=document.querySelector('#sec input.tx[data-id="'+b.dataset.id+'"]');if(inp)commit(inp,false)});
  document.querySelectorAll('#sec [data-pick]').forEach(b=>b.onclick=()=>{const x=get(b.dataset.id);if(!x||blocked(x))return;const A=fans(t,k);
    const p=((A[x.id]&&A[x.id].p)||[]).concat(+b.dataset.pick);const full=p.length===x.it.wd.length;
    A[x.id]={p,v:joinWords(p.map(i=>x.it.wd[i])),c:full};save();fRerender(t)});
  document.querySelectorAll('#sec [data-un]').forEach(b=>b.onclick=()=>{const x=get(b.dataset.id);if(!x||blocked(x))return;const A=fans(t,k);
    const p=A[x.id].p.slice();p.splice(+b.dataset.un,1);A[x.id]={p,v:joinWords(p.map(i=>x.it.wd[i])),c:false};if(!p.length)delete A[x.id];save();fRerender(t)});
  document.querySelectorAll('#sec [data-clear]').forEach(b=>b.onclick=()=>{const x=get(b.dataset.id);if(!x||blocked(x))return;delete fans(t,k)[x.id];save();fRerender(t)});
  if(k==='w'){const W=fw(t),ta=$('#wtext');
    ta.oninput=()=>{W.text=ta.value;$('#wcount').textContent=wcLabel(ta.value);save()};
    document.querySelectorAll('[data-wmark]').forEach(b=>b.onclick=()=>{const n=+b.dataset.wmark;W.mark=W.mark===n?null:n;save();
      document.querySelectorAll('[data-wmark]').forEach(x=>x.setAttribute('aria-pressed',String(W.mark===+x.dataset.wmark)));renderTabs();renderLedger();renderNav()});
    if(window.IFAIW){const setM=n=>{W.mark=n;save();document.querySelectorAll('[data-wmark]').forEach(x=>x.setAttribute('aria-pressed',String(W.mark===+x.dataset.wmark)));renderTabs();renderLedger();renderNav();if(typeof queueSync==='function')queueSync()};
      IFAIW.panel($('#wcount'),Object.assign(aiwCfg(t,sec),{key:'w:'+t.id,mode:RT.owner?'teacher':'student',getText:()=>ta.value,watch:ta,stored:W.ai||null,
        onResult:r=>{W.ai=r;if(!RT.owner)setM(r.total);else save()},apply:r=>setM(r.total)}))}}
  if(k==='s'){
    document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const i=+b.dataset.task,n=+b.dataset.n;
      if(st.s[i]===n)delete st.s[i];else st.s[i]=n;save();
      b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(st.s[i]===+x.dataset.n)));renderTabs();renderLedger();renderNav()});
    document.querySelectorAll('[data-tstart]').forEach(b=>b.onclick=()=>{const i=+b.dataset.tstart;
      if(timerTask===i&&timer){clearInterval(timer);timer=null;b.textContent='Resume';return}
      if(timerTask!==i){stopTimer();document.querySelectorAll('[data-tstart]').forEach(x=>x.textContent='Start timer');timerTask=i;timerLeft=sec.tasks[i].mins*60}
      b.textContent='Pause';

        if(timerLeft<=0){clearInterval(timer);timer=null;if(c)c.textContent='Time';b.textContent='Start timer';timerTask=-1}},1000)});
    document.querySelectorAll('[data-treset]').forEach(b=>b.onclick=()=>{const i=+b.dataset.treset;if(timerTask===i)stopTimer();
      const c=document.getElementById('clock'+i);if(c)c.textContent=mmss(sec.tasks[i].mins*60);const s=document.querySelector('[data-tstart="'+i+'"]');if(s)s.textContent='Start timer'});
  }

    if(!st.lp)st.lp={};if(!st.scr)st.scr={};
    document.querySelectorAll('[data-lscript]').forEach(b=>b.onclick=()=>{const pi=+b.dataset.lscript;st.scr[pi]=!st.scr[pi];save();fRerender(t)});
    if(!synth)return;

    const rateEl=$('#rate');
    document.querySelectorAll('[data-lmore]').forEach(b=>b.onclick=()=>{const pi=+b.dataset.lmore;st.lp[pi]=Math.max(0,(st.lp[pi]||0)-1);save();
      $('#lplays'+pi).textContent='Plays used: '+st.lp[pi]+' of 2';$('#lstatus'+pi).textContent='One more play allowed.'});
    document.querySelectorAll('[data-lpause]').forEach(b=>b.onclick=()=>{const pi=+b.dataset.lpause;if(playing&&!paused&&curPart===pi){synth.pause();paused=true;$('#lstatus'+pi).textContent='Paused. Press play to resume.'}});
    document.querySelectorAll('[data-lstop]').forEach(b=>b.onclick=()=>{const pi=+b.dataset.lstop;if(curPart===pi){stopAudio();curPart=-1;$('#lstatus'+pi).textContent='Stopped.';fMarkLine(pi,-1)}});
    document.querySelectorAll('[data-lplay]').forEach(b=>b.onclick=()=>{const pi=+b.dataset.lplay;
      if(paused&&curPart===pi){synth.resume();paused=false;$('#lstatus'+pi).textContent='Playing…';return}
      if(playing)return;
      if((st.lp[pi]||0)>=2){$('#lstatus'+pi).textContent='Both plays used. The teacher can allow another play.';return}
      st.lp[pi]=(st.lp[pi]||0)+1;save();$('#lplays'+pi).textContent='Plays used: '+st.lp[pi]+' of 2';
      fSpeak(t,pi,+(rateEl?rateEl.value:0.95))});
  }
}

/* ledger */
let confirmReset=false;
function renderLedger(){
  const t=T(),st=ts(t.id),rv=reveal(t),SECS=secsFor(t),maxT=SECS.reduce((a,s)=>a+s.max,0);
  const tot=SECS.reduce((a,s)=>a+secScore(t,s.k),0);
  const answered=SECS.reduce((a,s)=>a+secDone(t,s.k),0),count=SECS.reduce((a,s)=>a+secCount(t,s.k),0);

/* ---------- result codes ---------- */
function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

  return 'IFA0.'+b64u(raw)}

  let bytes=unb64u(m[2]);if(m[1]==='1'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(bytes))}

/* ---------- saving to the class record ---------- */
let saveTimer=null,syncing=false,syncAgain=false,lastSent={};const docExists={};
function recordFor(t){const st=ts(t.id);const r={aj:JSON.stringify(st.a||{}),wt:isF(t)?(fw(t).text||''):'',wai:isF(t)&&fw(t).ai?JSON.stringify(fw(t).ai):'',marked:!!st.marked,handed:!!st.handed,mode:state.mode};
  if(RT.owner)r.tmj=JSON.stringify({s:st.s||{},w:isF(t)?(fw(t).mark==null?null:fw(t).mark):null});return r}
function currentKey(){if(RT.owner){if(!state.name.trim())return null;return 'dev-'+slug(state.name)+'--'+slug(state.cls)}return RT.uid}
function queueSync(now){if(!RT.db||(RT.sync!=='live'&&!RT.owner))return;clearTimeout(saveTimer);saveTimer=setTimeout(doSync,now?50:2500)}
async function doSync(){
  if(syncing){syncAgain=true;return}
  const key=currentKey();if(!key||!RT.db)return;const t=T();if(!t)return;
  const rec=recordFor(t);const sig=key+'|'+t.id+'|'+state.name+'|'+state.cls+'|'+JSON.stringify(rec);if(lastSent[key+'|'+t.id]===sig)return;
  syncing=true;
  try{
    rec.upd=new Date().toISOString();
    const ref=RT.db.doc('results/'+key);
    const head={name:state.name||'',cls:state.cls||'',updated:rec.upd,src:RT.owner?'device':'student'};
    if(!docExists[key]){const g=await ref.get();docExists[key]=g.exists;
      if(!g.exists){await ref.set(Object.assign({},head,{tests:{[t.id]:rec}}));docExists[key]=true}
      else await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}))}
    else await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}));
    lastSent[key+'|'+t.id]=sig;RT.writeErr=null;
  }catch(e){
    if(!RT.owner&&e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='permission_denied')){RT.sync='code';RT.writeErr=null;renderAll()}
    else if(e&&e.code==='quota_exceeded'){RT.writeErr='The class record is full. Ask your teacher to remove old results.';renderLedger()}
    else if(e&&e.code==='unavailable'){setTimeout(()=>queueSync(),4000)}
  }

}
function applyTeacherMarks(){
  if(!studentLocked()||!RT.remote||!RT.remote.tests)return false;let changed=false;
  for(const id in RT.remote.tests){const t=TESTS.find(x=>x.id===id);if(!t)continue;const tm=recTM(RT.remote.tests[id]);if(!tm)continue;
    const st=ts(id);const s=tm.s||{};if(JSON.stringify(st.s||{})!==JSON.stringify(s)){st.s=Object.assign({},s);changed=true}
    if(isF(t)){const W=fw(t),wm=tm.w==null?null:tm.w;if(W.mark!==wm){W.mark=wm;changed=true}}}
  return changed;
}

/* ---------- timing ---------- */
function wordsIn(o){let n=0;const skip={items:1,q:1,o:1,a:1,ins:1,instr:1,k:1,id:1,name:1,setting:1,title:1,ex:1,sents:1,list:1,bankHtml:1,opts:1};
  (function w(x){if(x==null)return;if(typeof x==='string'){n+=(x.replace(/<[^>]+>/g,' ').match(/[A-Za-z’'-]+/g)||[]).length;return}
    if(Array.isArray(x)){x.forEach(w);return}if(typeof x==='object')for(const k in x){if(!skip[k])w(x[k])}})(o);return n}
function timePlan(t){
  const out=[];
  AD.secInfo(t).forEach(s=>{
    if(s.k==='s')return;
    if(s.k==='w'){const wm=AD.writeMins(t);out.push({k:'w',name:s.name,prep:5,what:'to plan before you write',mins:5+wm});return}
    if(s.k==='r'){const prep=Math.max(2,Math.ceil(s.words/130));out.push({k:'r',name:s.name,prep,what:'to read the text before you answer',mins:prep+Math.ceil(s.items*AD.rRate(t))});return}
    if(s.k==='l'){const play=Math.ceil(2*s.words/140+0.5);out.push({k:'l',name:s.name,prep:1,what:'to read the questions before the recording',mins:1+play+1});return}
    out.push({k:s.k,name:s.name,mins:Math.max(2,Math.ceil(s.items*AD.rate(t)))});
  });
  const sum=out.reduce((a,x)=>a+x.mins,0);
  return {secs:out,total:Math.max(5,Math.ceil(sum/5)*5),speak:AD.secInfo(t).some(s=>s.k==='s')};
}
const tmFmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function tmLimit(t){const st=ts(t.id);return (timePlan(t).total+(st.tadd||0)+(st.txs||0))*60000}
function tmUsed(st){if(!st.t0)return 0;const now=st.tend||Date.now();return now-st.t0-(st.tpd||0)-(st.tpz?now-st.tpz:0)}
function tmLeft(t){return tmLimit(t)-tmUsed(ts(t.id))}
const tmDone=st=>!!(st.marked||st.handed);
function tmStart(t){const st=ts(t.id);if(st.t0)return;st.t0=Date.now();st.pp={};save();queueSync(true);renderAll()}
async function tmTimeUp(t){
  const st=ts(t.id);if(tmDone(st))return;
  st.tout=true;st.marked=true;if(RT.sync==='live'&&!RT.owner)st.handed=true;
  stopAudio();stopTimer();save();renderAll();queueSync(true);ifSendNow(t);
  await uiAlert('Time is up. Your test has been marked.'+(!RT.owner&&RT.sync!=='live'?' Press “Send results to teacher” and send the code to your teacher.':''));
}
function tmPrepLeft(t,k){const st=ts(t.id),p=timePlan(t).secs.find(x=>x.k===k);if(!p||!p.prep||!st.t0||tmDone(st))return 0;
  st.pp=st.pp||{};if(!st.pp[k]){st.pp[k]=Date.now();rtLocal()}return st.pp[k]+p.prep*60000-Date.now()}
function tmBar(t){
  const st=ts(t.id),P=timePlan(t),lim=tmLimit(t);
  const plan='Time allowed: <b>'+Math.round(lim/60000)+' min</b> · '+P.secs.map(x=>esc(x.name)+' '+x.mins).join(' · ')+(P.speak?' · Speaking with your teacher':'');
  let clock,btns='';
  if(tmDone(st))clock=st.t0?'<span class="lab">Time used</span><b class="tml">'+tmFmt(Math.min(tmUsed(st),lim))+'</b>':'<span class="lab">Time</span><b class="tml">—</b>';
  else if(!st.t0){clock='<span class="lab">Time</span><b class="tml">'+tmFmt(lim)+'</b>';btns='<button class="go" id="tmgo2">Start '+(rtFree()?'timer':'test')+'</button>'}
  else{clock='<span class="lab">'+(st.tpz?'Paused':'Time left')+'</span><b class="tml" id="tmleft">'+tmFmt(tmLeft(t))+'</b>';
    if(rtFree())btns='<button id="tmpause">'+(st.tpz?'Resume':'Pause')+'</button><button id="tmadd">+5 min</button>'}
  const left=st.t0&&!tmDone(st)?tmLeft(t):1e9;
  return '<div class="tmbar'+(left<=0?' over':left<5*60000?' warn':'')+'" id="tmbar"><div class="tmclock">'+clock+'</div><div class="tmplan">'+plan+'</div>'+btns+'</div>';
}
function tmGate(t){const st=ts(t.id),P=timePlan(t);
  return '<div class="tmstart"><h2>'+esc(t.title)+'</h2><p>You have <b>'+P.total+' minutes</b> for this test. The clock starts when you press <b>Start test</b> and keeps running even if you close the page. When time is up, the test is marked.</p><table>'+
    P.secs.map(x=>'<tr><td>'+esc(x.name)+(x.prep?' <span class="meta">(includes '+x.prep+' min '+x.what+')</span>':'')+'</td><td class="n">'+x.mins+' min</td></tr>').join('')+'</table>'+
    (P.speak?'<p class="meta">Speaking is done separately with your teacher and is not part of this time.</p>':'')+
    (tAtt(st)>1?'<p class="meta">This is attempt '+tAtt(st)+'.</p>':'')+
    (!state.name.trim()?'<p class="meta">Type your name and class at the top first.</p>':'')+'<button class="go" id="tmgo">Start test</button></div>'}
function tmDecorate(){
  const t=T();if(!t)return;const st=ts(t.id);
  if(!st.t0&&!tmDone(st)&&AD.anyAnswered(t)){st.t0=Date.now();st.pp={};rtLocal()}
  if(tmDone(st)&&st.t0&&!st.tend){st.tend=Date.now();rtLocal()}
  const head=document.querySelector('#main .head');if(!head)return;
  head.insertAdjacentHTML('afterend',tmBar(t));
  const sec=$('#sec');
  if(!rtFree()&&!st.t0&&!tmDone(st)&&sec){sec.innerHTML=tmGate(t);const pg=document.querySelector('#main .pager');if(pg)pg.style.display='none'}
  else if(sec&&st.t0&&!tmDone(st)&&!st.tpz){const pl=tmPrepLeft(t,state.sec);
    if(pl>0){const p=timePlan(t).secs.find(x=>x.k===state.sec);
      sec.insertAdjacentHTML('afterbegin','<div class="tmprep" id="tmprep"><b>'+(state.sec==='r'?'Reading time':state.sec==='l'?'Preparation time':'Planning time')+'</b> — you have '+p.prep+' min '+p.what+'. <b class="c" id="tmpl">'+tmFmt(pl)+'</b></div>');
      if(state.sec==='l'&&!rtFree())tmPlay(false)}}
  if(st.tout&&!rtFree())document.querySelectorAll('#wtext').forEach(x=>x.disabled=true);
  const go=()=>{if(!state.name.trim()){uiAlert('Please type your name and class at the top of the test first.').then(()=>{const f=$('#sname');if(f)f.focus()});return}tmStart(t)};
  const g1=$('#tmgo');if(g1)g1.onclick=go;const g2=$('#tmgo2');if(g2)g2.onclick=go;
  const pz=$('#tmpause');if(pz)pz.onclick=()=>{if(st.tpz){st.tpd=(st.tpd||0)+Date.now()-st.tpz;delete st.tpz}else st.tpz=Date.now();save();renderAll()};
  const ad=$('#tmadd');if(ad)ad.onclick=()=>{st.tadd=(st.tadd||0)+5;save();renderAll()};
}
function tmPlay(on){document.querySelectorAll('#lplay,[data-lplay]').forEach(b=>{b.disabled=!on;b.title=on?'':'Read the questions first'})}
setInterval(()=>{
  if(state.view==='teacher'&&RT.owner)return;const t=T();if(!t)return;const st=ts(t.id);
  if(!st.t0||tmDone(st)||st.tpz)return;
  const left=tmLeft(t),el=$('#tmleft'),bar=$('#tmbar');
  if(el)el.textContent=tmFmt(left);if(bar){bar.classList.toggle('warn',left>0&&left<5*60000);bar.classList.toggle('over',left<=0)}
  const pr=$('#tmprep');if(pr){const pl=tmPrepLeft(t,state.sec);if(pl>0){const c=$('#tmpl');if(c)c.textContent=tmFmt(pl)}else{pr.remove();if(state.sec==='l')tmPlay(true)}}
  if(left<=0)tmTimeUp(t);
},1000);
const _tmMain=renderMain;
renderMain=function(){_tmMain();if(state.view==='teacher'&&RT.owner)return;clsBind();tmDecorate()};

/* ---------- student / teacher-device ledger ---------- */
const _rtLedger=renderLedger;
renderLedger=function(){
  _rtLedger();
  if(state.view==='teacher'&&RT.owner)return;
  const t=T();if(!t)return;const st=ts(t.id);const att=tAtt(st);
  if(!rtFree()&&!st.seen&&reveal(t)&&AD.anyAnswered(t)){st.seen=true;rtLocal();queueSync()}
  const acts=document.querySelector('#ledger .actions');if(!acts)return;
  const hist=st.hist||[];
  acts.insertAdjacentHTML('beforebegin','<p class="rtinfo"><b>Attempt '+att+'</b>'+(st.tout?' · time ran out':'')+(hist.length?' · earlier: '+hist.map(x=>'attempt '+x.n+' <b>'+x.tot+' / '+x.max+'</b> ('+rtPct(x)+'%)').join(', '):'')+'</p>');
  if(rtFree()){
    if(st.marked||st.handed||AD.anyAnswered(t)){acts.insertAdjacentHTML('beforeend','<button id="rtstart" title="Clears the answers and starts attempt '+(att+1)+'. The score so far is kept as an earlier attempt.">Start a retake</button>');
      $('#rtstart').onclick=async()=>{if(!await uiConfirm('Start a retake of '+t.title+(state.name?' for '+state.name:'')+'? The answers are cleared and this score is kept as attempt '+att+'.','Start retake'))return;startRetake(t)}}
    return;
  }
  if(!rtLocked(t))return;
  const rb=$('#resetbtn');if(rb)rb.remove();
  if(rtApproved(t)){
    acts.insertAdjacentHTML('beforeend','<button class="go" id="rtstart">Start your retake</button>');
    acts.insertAdjacentHTML('afterend','<p class="rtmsg">Your teacher has approved a retake. Your score so far is kept as attempt '+att+'.</p>');
    $('#rtstart').onclick=async()=>{if(!await uiConfirm('Start your retake now? Your answers are cleared and this score is kept as attempt '+att+'.','Start retake'))return;startRetake(t)};
    return;
  }
  acts.insertAdjacentHTML('beforeend','<button id="rtask">'+(RTK.open===t.id?'Hide retake':'Retake this test')+'</button>');
  $('#rtask').onclick=()=>{RTK.open=RTK.open===t.id?null:t.id;RTK.msg='';renderLedger()};
  if(RTK.open!==t.id)return;
  const live=RT.sync==='live',asked=st.rq===att;
  let h='<div class="codebox rtbox"><p><b>Retake this test</b></p>';
  if(live)h+=asked?'<p>Request sent. When your teacher approves it, a <b>Start your retake</b> button appears here.</p>':'<p>Your teacher needs to approve a retake.</p><p><button class="go" id="rtreq">Send request to teacher</button></p>';
  h+='<p class="meta" style="font-size:.9rem;color:var(--muted)">'+(live?'Or type':'Type')+' your retake code from your teacher. It’s the same code every time, so keep it.</p>';
  h+='<div class="rtrow"><input id="rtin" placeholder="ABC-123" autocomplete="off" aria-label="Retake code"><button id="rtgo">Unlock</button></div>';
  h+='<p class="rtmsg'+(RTK.msg&&RTK.msg[0]==='!'?' no':'')+'" id="rtmsg">'+esc(RTK.msg.replace(/^!/,''))+'</p></div>';
  acts.insertAdjacentHTML('afterend',h);
  const rq=$('#rtreq');if(rq)rq.onclick=()=>{if(!state.name.trim()){RTK.msg='!Type your name at the top of the test first.';renderLedger();return}
    st.rq=att;save();queueSync(true);RTK.msg='';renderLedger()};
  const go=async()=>{const v=rtNorm($('#rtin').value);if(!v)return;
    if(!state.name.trim()){RTK.msg='!Type your name at the top of the test first.';renderLedger();return}
    if(v!==rtNorm(rtCode(state.name))){RTK.msg='!That code doesn’t match. Check the code, and that your name is typed exactly as your teacher has it.';renderLedger();return}
    if(!await uiConfirm('Code accepted. Start your retake now? Your answers are cleared and this score is kept as attempt '+att+'.','Start retake'))return;
    startRetake(t)};
  $('#rtgo').onclick=go;$('#rtin').onkeydown=e=>{if(e.key==='Enter')go()};
};

/* ---------- what goes to the class record ---------- */
const _rtRecordFor=recordFor;
recordFor=function(t){const r=_rtRecordFor(t);const st=ts(t.id);r.att=tAtt(st);r.hj=JSON.stringify(st.hist||[]);
  r.rq=st.rq||0;r.seen=!!st.seen;r.t0=st.t0||0;r.tout=!!st.tout;if(st.clearTM&&!RT.owner){r.tmj='';r.tx=0}return r};
const _rtPack=pack;
pack=function(o){if(o&&o.id){const st=ts(o.id);o.att=tAtt(st);o.hj=JSON.stringify(st.hist||[]);o.tout=!!st.tout}return _rtPack(o)};

/* students who save live: approvals, extra time, and a test this device lost */
function rtOnRemote(){
  if(RT.owner||!RT.remote||!RT.remote.tests)return false;let ch=false;
  const sig=JSON.stringify(Object.keys(RT.remote.tests).map(id=>{const R=RT.remote.tests[id]||{};return [id,R.att||1,R.ok||0,R.rq||0,R.tx||0]}));
  if(sig!==RTK.sig){RTK.sig=sig;ch=true}
  for(const id in RT.remote.tests){const t=TESTS.find(x=>x.id===id);const R=RT.remote.tests[id];if(!t||!R)continue;
    const cur=state.tests[id],ratt=R.att||1,latt=tAtt(cur);
    if(cur&&cur.clearTM&&ratt>=latt){cur.clearTM=false;ch=true}
    if(ratt>latt||(ratt===latt&&(((R.marked||R.handed)&&!(cur&&(cur.marked||cur.handed)))||(R.t0>0&&!(cur&&cur.t0))))){AD.restore(t,R);const n=state.tests[id];n.t0=R.t0||null;n.tout=!!R.tout;ch=true}
    const st=state.tests[id];
    if(st&&ratt===tAtt(st)&&(R.tx||0)!==(st.txs||0)){st.txs=R.tx||0;ch=true;
      if(st.tout){delete st.tend;if(tmLeft(t)>0){st.tout=false;st.marked=false;st.handed=false}else st.tend=Date.now()}}}
  if(ch)rtLocal();
  return ch;
}

/* ---------- teacher dashboard ---------- */
const _rtDetail=detailHtml;
detailHtml=function(r){let h=_rtDetail(r);if(!r)return h;
  const R=r.r,att=R.att||1,hist=rtHist(R.hj),live=r.src==='student';
  let p='<div class="rtpanel"><h3 class="part">Attempts and retakes</h3><p class="meta"><b>Attempt '+att+'</b>'+(R.tout?' (time ran out)':'')+'. '+(hist.length?'Earlier: '+hist.map(x=>'attempt '+x.n+', '+x.tot+' / '+x.max+' ('+rtPct(x)+'%), '+esc(fmtTime(x.at))).join('; ')+'.':'No earlier attempts.')+'</p>';
  if(live){
    if(R.ok===att)p+='<div class="rtact"><b>Retake approved.</b> <span class="meta">The student can start it now.</span><button class="ghost" id="rtcancel">Cancel approval</button></div>';
    else p+='<div class="rtact">'+(R.rq===att?'<b>The student has asked for a retake.</b>':'')+'<button class="go" id="rtok">Approve a retake</button></div>';
    p+='<div class="rtact"><span class="meta">Extra time: '+(R.tx||0)+' min</span><button class="ghost" id="rtx">Give 5 more minutes</button></div>';
  }
  p+='<p class="meta">'+esc(r.name)+'’s retake code: <span class="rtcode">'+rtCode(r.name)+'</span><br>The same code works for every test and every retake, so you only give it once. The student types it into the retake box; each retake updates this record with the new attempt.</p></div>';
  const i=h.lastIndexOf('</section>');return i>-1?h.slice(0,i)+p+h.slice(i):h+p};
const _rtBind=bindDetail;
bindDetail=function(all){_rtBind(all);if(!TV.sel)return;const r=all.find(x=>x.doc+'|'+x.id===TV.sel);if(!r)return;const att=r.r.att||1;
  const put=async(o,msg)=>{Object.assign(r.r,o);try{await RT.db.doc('results/'+r.doc).update({tests:{[r.id]:o}});TV.msg=''}catch(e){TV.msg=msg}renderTeacher(true)};
  const ok=$('#rtok');if(ok)ok.onclick=()=>put({ok:att},'Couldn’t save the approval. Try again.');
  const cn=$('#rtcancel');if(cn)cn.onclick=()=>put({ok:0},'Couldn’t save that. Try again.');
  const tx=$('#rtx');if(tx)tx.onclick=()=>put({tx:(r.r.tx||0)+5},'Couldn’t save the extra time. Try again.')};
function rtFiltered(){return rows().filter(r=>(!TV.test||r.id===TV.test)&&(!TV.cls||r.cls===TV.cls)&&(!TV.q||r.name.toLowerCase().includes(TV.q.toLowerCase())))}
async function rtCsv(list){
  const names=[],keys=[];TESTS.forEach(t=>AD.secInfo(t).forEach(s=>{if(!keys.includes(s.k)){keys.push(s.k);names.push(s.name)}}));
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const head=['Student','Class','Test','Status','Attempt','Earlier attempts','Time ran out','Updated'].concat(names,['Total','Max','Percent']);
  const lines=[head.map(q).join(',')].concat(list.map(r=>{const R=r.r;const h=rtHist(R.hj);
    return [r.name,r.cls,r.t.title,R.handed?'Handed in':R.marked?'Marked':'In progress',R.att||1,h.map(x=>x.n+': '+x.tot+'/'+x.max).join('; '),R.tout?'yes':'',r.upd]
      .concat(keys.map(k=>{const v=r.sc.secs[k];return v==null?'':v}),[r.sc.tot,r.sc.max,r.sc.max?Math.round(r.sc.tot/r.sc.max*100):''])
      .map(q).join(',')}));
  const dl=RT.dl||RT.downloads;
  try{await dl.save({filename:document.title.replace(/[^\w\- ]+/g,'').trim().slice(0,50)+' results.csv',data:new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'})})}catch(e){}
}
const _rtTeacher=renderTeacher;
renderTeacher=function(keep){
  const y=window.scrollY;_rtTeacher(keep);
  const all=rows();
  const hr=document.querySelector('#main .rtable thead tr');if(hr&&hr.children[3])hr.children[3].insertAdjacentHTML('afterend','<th class="num">Attempts</th>');
  document.querySelectorAll('#main .rtable td.empty').forEach(td=>td.colSpan=(+td.colSpan||7)+1);
  document.querySelectorAll('#main tr[data-row]').forEach(tr=>{const r=all.find(x=>x.doc+'|'+x.id===tr.dataset.row);if(!r)return;const R=r.r,att=R.att||1;const td=tr.children[3];if(!td)return;
    let tg='';if(R.tout)tg+='<span class="tag">time ran out</span>';
    if(R.ok===att)tg+='<span class="tag">retake approved</span>';else if(R.rq===att)tg+='<span class="tag warn">retake requested</span>';
    if(tg)td.insertAdjacentHTML('beforeend',' '+tg);
    td.insertAdjacentHTML('afterend','<td class="num"><b>'+att+'</b></td>')});
  const cb=$('#csvbtn');if(cb)cb.onclick=()=>rtCsv(rtFiltered());
  const imp=document.getElementById('impta');const sec=imp&&imp.closest('section');
  const g='<section class="task" id="rtgen"><h3>Retake codes</h3><p class="meta">Each student has one personal retake code for this page. It works for every test and every retake, so they only need it once. Type the name exactly as the student types it on their tests.</p><div class="rtgen"><label>Student name<input id="rtgn" value="'+esc(RTK.gn||'')+'" autocomplete="off"></label></div><div class="rtout meta" id="rtgo2"></div></section>';
  if(sec)sec.insertAdjacentHTML('afterend',g);else{const m=$('#main');if(m)m.insertAdjacentHTML('beforeend',g)}
  const upd=()=>{RTK.gn=$('#rtgn').value;$('#rtgo2').innerHTML=RTK.gn.trim()?'Retake code: <span class="rtcode">'+rtCode(RTK.gn)+'</span>':'Type a name to see the code.'};
  const gn=$('#rtgn');if(gn){gn.oninput=upd;upd()}
  if(keep)window.scrollTo(0,y);
};
const _rtImport=importCode;
importCode=async function(){
  let o=null,prevAtt=0,key='';
  try{o=await unpack($('#impta').value);key='imp-'+slug(o.n)+'--'+slug(o.c);
    if(RT.db){const g=await RT.db.doc('results/'+key).get();const P=g.exists&&g.data().tests&&g.data().tests[o.id];prevAtt=P?(P.att||1):0}}catch(e){o=null}
  await _rtImport();
  if(o&&o.id&&RT.db&&/^Imported/.test(TV.msg||'')){const att=o.att||1;const up={att,hj:o.hj||'[]',tout:!!o.tout};
    if(prevAtt&&att>prevAtt){const m=o.m||{};const has=Object.keys(m.s||{}).length||(m.w&&(typeof m.w==='object'?Object.keys(m.w).length:m.w!=null));up.tmj=has?JSON.stringify({s:m.s||{},w:m.w==null?null:m.w}):'';if(has)up.dm=true}
    try{await RT.db.doc('results/'+key).update({tests:{[o.id]:up}})}catch(e){}
    TV.msg+=' Attempt '+att+(prevAtt&&att>prevAtt?' (updated from attempt '+prevAtt+')':'')+'.';renderTeacher(true)}
};

/* adapter: English File A1/A2/B1/B2 engine */
const AD={
 sum(t){const S=secsFor(t);return {tot:S.reduce((a,s)=>a+secScore(t,s.k),0),max:S.reduce((a,s)=>a+s.max,0)}},
 firstSec(t){return secsFor(t)[0].k},
 anyAnswered(t){return secsFor(t).some(s=>!teacherSec(s.k)&&secDone(t,s.k)>0)},
 restore(t,R){delete state.tests[t.id];const ns=ts(t.id);const a=recA(R);if(!isF(t))['g','v','p','r','l'].forEach(k=>{if(!a[k])a[k]={}});
   ns.a=a;ns.marked=!!R.marked;ns.handed=!!R.handed;ns.seen=!!(R.seen||R.marked||R.handed);ns.att=R.att||1;ns.hist=rtHist(R.hj);if(isF(t)&&R.wt)fw(t).text=R.wt;if(isF(t)&&R.wai){try{fw(t).ai=JSON.parse(R.wai)}catch(e){}}},
 secInfo(t){return secsFor(t).map(s=>{let items=0,words=0;
   if(isF(t)){const sec=fsec(t,s.k);if(s.k!=='w'&&s.k!=='s')items=fitems(sec).length;words=wordsIn(sec)}
   else if(s.k!=='s'){const o=t[s.k];items=o.q.length;words=s.k==='r'?wordsIn(o.text):s.k==='l'?wordsIn(o.script):0}
   return {k:s.k,name:s.name,items,words}})},
 rate(t){return isF(t)?0.6:0.5},rRate(t){return 1},writeMins(t){return 20}
};
const _rtATM=applyTeacherMarks;
applyTeacherMarks=function(){let c=false;try{c=rtOnRemote()}catch(e){}return _rtATM()||c};

renderAll();
initRuntime();
})();
