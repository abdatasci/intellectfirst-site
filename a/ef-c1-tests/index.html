:root[data-theme="dark"]{
  --navy:#0B1731; --navy2:#22386B; --ice:#18284A; --ice2:#243A66;
  --gold:#D2AE52; --gold2:#5E4C1E; --paper:#13213F; --bg:#0D1830;
  --ink:#E6ECF6; --muted:#A3B0C8; --line:#2A3C63;
  --ok:#6FD39F; --okbg:#133A2A; --no:#F08A80; --nobg:#40191A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}

/* masthead */
.mast{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.mast-in{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.mast svg{width:44px;height:52px;flex:none}
.mast img.crest{width:47px;height:60px;flex:none;display:block}
.mast .school{font-family:var(--serif);font-size:1.25rem;letter-spacing:.01em}
.mast .sub{color:#C9D6EA;font-size:.95rem}
.mast .grow{flex:1}
.mast select{background:transparent;border:1px solid #3A5285;border-radius:6px;padding:6px 8px;color:#fff}
.mast select option{color:#000}

/* layout */
.wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:24px;padding:22px 20px 60px}
nav.tests h2{font-size:1rem;color:var(--muted);font-family:var(--sans);font-weight:700;margin:4px 0 8px}
nav.tests ul{list-style:none;margin:0 0 18px;padding:0}
nav.tests li button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 10px;border-radius:0 6px 6px 0;display:flex;justify-content:space-between;gap:8px}
nav.tests li button:hover{background:var(--ice)}
nav.tests li button[aria-current="true"]{border-left-color:var(--gold);background:var(--paper);font-weight:700}
nav.tests li button .mini{color:var(--muted);font-size:.85rem;font-weight:400}
nav.tests .soon{color:var(--muted);font-size:.92rem;padding:5px 13px}
.mobile-pick{display:none}

main{min-width:0}
.head{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.head h1{font-size:2rem;color:var(--ink)}
.head .focus{color:var(--muted);margin:4px 0 14px}
.who{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.who label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.who input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:180px}
.mode{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.mode button{border:0;background:var(--paper);padding:8px 14px;font-size:.92rem}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}
.modehint{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:0}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 12px 9px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs .badge{font-weight:400;font-size:.82rem;margin-left:5px;color:var(--muted)}

.sec h2{font-size:1.5rem;margin-bottom:4px}
.part{font-family:var(--serif);font-size:1.08rem;margin:26px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.part:first-of-type{border-top:0;padding-top:0;margin-top:10px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:32px 1fr;gap:4px 8px}
.q .n{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:1.05rem;padding-top:1px}
.q .stem{margin-bottom:8px}
.q .spk{display:inline-block;font-weight:700;width:1.4em;color:var(--muted)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--muted);margin:0 3px;line-height:1.1}
.blank.filled{border-bottom-color:var(--gold);font-weight:700;padding:0 3px;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 12px;display:flex;gap:8px;align-items:baseline;text-align:left;min-height:40px}
.opt:hover:not(:disabled){border-color:var(--navy2)}
.opt .l{font-weight:700;color:var(--muted);font-size:.85rem}
.opt.sel{border-color:var(--navy2);background:var(--ice)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg);text-decoration:line-through;text-decoration-thickness:1px}
.opt.key{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt b.snd{color:var(--gold);font-weight:700}
.opt u.str{text-decoration:underline 2px;text-underline-offset:3px;font-weight:700}
.q .verdict{grid-column:2;font-size:.88rem;margin-top:6px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}

.reading{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.text{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 22px;font-family:var(--serif);line-height:1.65;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.text h3{font-size:1.25rem;margin-bottom:10px}
.text p{margin:0 0 12px}

.player{background:var(--navy);color:#fff;border-radius:10px;padding:16px 18px;margin:12px 0 18px}
.player .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.player button{border:1px solid #4A6399;background:#1C3161;color:#fff;border-radius:6px;padding:8px 14px;font-weight:700}
.player button.primary{background:var(--gold);border-color:var(--gold);color:#1a1405}
.player button:disabled{opacity:.45;cursor:not-allowed}
.player label{font-size:.85rem;color:#C9D6EA;display:flex;gap:6px;align-items:center}
.player select{background:#0B1731;color:#fff;border:1px solid #4A6399;border-radius:6px;padding:5px 6px;max-width:220px}
.player .status{font-size:.9rem;color:#C9D6EA;margin-top:10px}
.player .plays{margin-left:auto;font-size:.9rem}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;font-size:.88rem}
.script{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:16px}
.script p{margin:0 0 6px}
.script p.now{background:var(--gold2);border-radius:4px}
.script b{font-family:var(--serif)}

.bands{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:.92rem;margin:10px 0 18px}
.bands table{border-collapse:collapse;width:100%}
.bands td{padding:3px 8px 3px 0;vertical-align:top}
.bands td:first-child{font-weight:700;white-space:nowrap;color:var(--gold)}
.task{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.task h3{font-size:1.15rem}
.task .meta{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.task ul{margin:0 0 12px;padding-left:1.2em}
.task li{margin-bottom:4px}
.task .card{border-left:3px solid var(--gold);padding:6px 12px;background:var(--ice);border-radius:0 6px 6px 0;margin-bottom:10px;font-family:var(--serif)}
.timer{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.timer .clock{font-family:var(--serif);font-size:1.4rem;min-width:3.2em}
.timer button,.ghost{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px}
.rate{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rate .lab{font-size:.88rem;color:var(--muted);margin-right:4px}
.rate button{width:36px;height:36px;border:1.5px solid var(--line);background:var(--bg);border-radius:6px;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

.pager{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.pager button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;font-weight:700}

/* ledger */
aside.ledger{position:sticky;top:14px;align-self:start}
.card-l{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px}
.card-l .t{font-family:var(--serif);font-size:1.1rem}
.card-l .st{color:var(--muted);font-size:.88rem;margin-bottom:12px;min-height:1.3em}
.big{display:flex;align-items:baseline;gap:6px;font-family:var(--serif);margin:4px 0 2px}
.big .num{font-size:3.4rem;line-height:1;color:var(--ink)}
.big .of{font-size:1.2rem;color:var(--muted)}
.pct{font-size:.95rem;color:var(--muted);margin-bottom:14px}
.pct b{color:var(--ink)}
.rowl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.93rem;margin-bottom:9px}
.rowl .bar{grid-column:1/3;height:5px;background:var(--ice);border-radius:3px;overflow:hidden}
.rowl .bar i{display:block;height:100%;background:var(--navy2);transition:width .25s}
.rowl .v{font-variant-numeric:tabular-nums}
.ledger .actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ledger .actions button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:700}
.ledger .actions button.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.src{font-size:.78rem;color:var(--muted);margin-top:14px;line-height:1.4}
.mobile-total{display:none}

@media (max-width:1100px){
  .wrap{grid-template-columns:200px minmax(0,1fr)}
  aside.ledger{grid-column:1/3;position:static}
}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{grid-template-columns:minmax(0,1fr);padding:14px 12px 110px;gap:14px}
  nav.tests{display:none}
  .mobile-pick{display:block;margin-bottom:12px}
  .mobile-pick select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
  aside.ledger{grid-column:auto}
  .reading{grid-template-columns:minmax(0,1fr)}
  .text{position:static;max-height:none}
  .mode{margin-left:0}
  .head h1{font-size:1.6rem}
  .mobile-total{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;border-top:3px solid var(--gold);z-index:10}
  .mobile-total b{font-family:var(--serif);font-size:1.3rem}
  .mobile-total button{background:none;border:1px solid #4A6399;color:#fff;border-radius:6px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* C1 additions */
.ex-note{color:var(--muted);font-size:.92rem;margin:-4px 0 10px}
.ex-note b{color:var(--ink)}
.legend{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 16px;font-size:.95rem}
.legend b{color:var(--gold);font-family:var(--serif);margin-right:6px}
.bankbox{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 12px}
.bankbox span{border:1px dashed var(--line);background:var(--paper);border-radius:6px;padding:3px 10px;font-family:var(--serif)}
.bankbox b,.mq b{color:var(--gold)}
input.gap{display:inline-block;border:0;border-bottom:2px solid var(--muted);background:transparent;padding:1px 4px;margin:0 3px;font-weight:700;color:var(--ink);border-radius:0;min-width:5em}
input.gap:focus{outline:none;border-bottom-color:var(--gold);background:var(--ice)}
input.gap.ok{border-bottom-color:var(--ok);color:var(--ok)}
input.gap.no{border-bottom-color:var(--no);color:var(--no)}
.chk{margin-left:8px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 10px;font-size:.88rem;font-weight:700}
.pk{display:inline-flex;border:1.5px solid var(--line);border-radius:7px;overflow:hidden;vertical-align:baseline;margin:2px 3px}
.pk button{border:0;background:var(--bg);padding:2px 10px}
.pk button+button{border-left:1.5px solid var(--line)}
.pk button.sel{background:var(--ice);font-weight:700}
.pk button.ok{background:var(--okbg);color:var(--ok);font-weight:700}
.pk button.no{background:var(--nobg);color:var(--no);text-decoration:line-through}
.pk button.key{box-shadow:inset 0 0 0 2px var(--ok)}
.pk button:disabled{cursor:default}
.mrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.mq{font-family:var(--serif);font-size:1.05rem}
.mrow select{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 10px;min-width:130px}
.mrow select.ok{border-color:var(--ok);background:var(--okbg)}
.mrow select.no{border-color:var(--no);background:var(--nobg)}
.syl{display:flex;gap:5px;flex-wrap:wrap}
.syl button{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 12px;font-family:var(--serif);font-size:1.15rem;min-width:44px}
.syl button.sel{border-color:var(--navy2);background:var(--ice);text-decoration:underline;text-underline-offset:4px}
.syl button.ok{border-color:var(--ok);background:var(--okbg);text-decoration:underline;text-underline-offset:4px}
.syl button.no{border-color:var(--no);background:var(--nobg)}
.syl button.key{border-color:var(--ok);border-style:dashed}
.syl button:disabled{cursor:default}
.text p b.lab{color:var(--gold);margin-right:8px}
.wtasks label{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.wtasks label:first-child{border-top:0}
.wtasks em{color:var(--muted)}
textarea.wr{width:100%;min-height:300px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:14px 16px;line-height:1.65;resize:vertical;font:inherit;color:inherit}
.wc{text-align:right;color:var(--muted);font-size:.9rem;margin:4px 0 14px}
.rate.wide button{width:40px}
.papers{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:.88rem;color:var(--muted)}
.papers div{display:flex;justify-content:space-between;gap:10px}
.papers b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
nav.tests h2 .cnt{font-weight:400}



/*EXTRA-START*//* v2 additions */
.tview{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.tview button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tview button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tview .mini{font-weight:400;font-size:.85rem;opacity:.85}
nav.tests li.pair{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 4px 13px}

nav.tests li.pair .pbtns button{width:auto;min-width:38px;justify-content:center;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--paper);font-weight:700}
nav.tests li.pair .pbtns button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.syncnote{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:2px 0 0;padding:6px 10px;border-left:3px solid var(--gold);background:var(--ice);border-radius:0 6px 6px 0}
.syncnote.ok{border-left-color:var(--ok)}
.hint{color:var(--muted);font-size:.92em}
input.gap.wide{min-width:min(100%,24em)}
.task.prompt p{margin:0 0 8px}
.task.prompt p:last-child{margin:0}
.muted{color:var(--muted);font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:8px}
.filters label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:160px}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.rtable{width:100%;border-collapse:collapse;font-size:.93rem}
.rtable th{text-align:left;font-weight:700;color:var(--muted);font-size:.82rem;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}

.tag.warn{border-color:var(--gold);color:var(--gold)}
.detail{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dhead h2{font-size:1.4rem}
.secscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 4px}
.secscores div{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;font-size:.9rem}
.wrview{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.6;max-height:320px;overflow:auto;margin-bottom:6px}
details.ans{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
details.ans summary{padding:10px 12px;cursor:pointer}
.atable{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--paper)}
.atable th{text-align:left;color:var(--muted);font-size:.78rem;padding:6px 10px;border-bottom:1px solid var(--line)}
.atable td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.atable tr.no td:nth-child(3){color:var(--no)}
.atable tr.ok td:nth-child(4){color:var(--ok)}
.codebox{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.codebox p{margin:0 0 8px;font-size:.9rem}
.codebox textarea,textarea.imp{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);word-break:break-all}
.codebox button{margin-top:8px}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-weight:700}
.go{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:8px;padding:9px 14px;font-weight:700}
.go:disabled{opacity:.6;cursor:default}
@media print{.mast,nav.tests,.mobile-pick,.who,.tabs,.pager,.mobile-total,.ledger .actions,.player,.linkbtn{display:none!important}.wrap{display:block}aside.ledger{position:static;margin-top:20px}body{background:#fff}}

.vswitch{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.vswitch button{flex:1;border:0;background:transparent;padding:11px 12px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.vswitch button+button{border-left:1px solid var(--line)}

.vswitch .vsub{font-weight:400;font-size:.8rem;opacity:.8}

function message(p){

  var o={id:p.id,c:p.c,lv:p.lv,t:p.t,v:p.v||"",n:p.n||"",cl:p.cl||"",d:new Date().toISOString(),s:p.s,w:(p.w||[]).filter(function(x){return x&&String(x).trim()})};
  var code="IFR1."+b64url(JSON.stringify(o));
  return "IF Academy test result\nStudent: "+(p.n||"(no name)")+(p.cl?" · "+p.cl:"")+"\nTest: "+p.lv+" · "+p.t+(p.v?" "+p.v:"")+"\nScore: "+tot+" / "+max+(pend.length?" ("+pend.join(" and ")+" not marked yet)":"")+"\n"+code+(p.x?"\n"+p.x:"");
}

<script>
/* ---------- IF AI writing examiner (shared module) ---------- */
window.IFAIW=(function(){
  var S=null,ready=null,css=false;
  function sample(){if(!ready)ready=((window.claude&&window.claude.use)?window.claude.use("sample").catch(function(){return null}):Promise.resolve(null)).then(function(s){S=s;return s});return ready}
  function h(s){var x=5381;s=String(s||"");for(var i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return (x>>>0).toString(36)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function words(s){return (String(s||"").trim().match(/\S+/g)||[]).length}
  function lsGet(k){try{var v=localStorage.getItem("ifaiw:"+k);return v?JSON.parse(v):null}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem("ifaiw:"+k,JSON.stringify(v))}catch(e){}}
  function addCss(){if(css)return;css=true;var st=document.createElement("style");st.textContent=
   ".aiw{margin:14px 0;border:1px solid var(--line,#CBD6E4);border-left:4px solid var(--gold,#A9843A);border-radius:8px;padding:14px 16px;background:var(--paper,#fff);color:var(--ink,#15213A);font-size:15px;line-height:1.5}"+
   ".aiw h4{margin:0 0 4px;font-size:16px;font-family:var(--serif,Cambria,Georgia,serif)}.aiw .aiw-m{color:var(--muted,#5A6781);font-size:13.5px;margin:0 0 10px}"+
   ".aiw button{border:1px solid var(--navy,#13223F);background:var(--navy,#13223F);color:#fff;border-radius:7px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;margin:0 8px 6px 0}"+
   ".aiw button.l{background:transparent;color:var(--ink,#15213A)}.aiw button:disabled{opacity:.55;cursor:default}"+
   ".aiw .aiw-big{font-family:var(--serif,Cambria,Georgia,serif);font-size:30px;line-height:1;margin:4px 0 8px}.aiw .aiw-big small{font-size:15px;color:var(--muted,#5A6781)}"+
   ".aiw table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14.5px}.aiw td{padding:6px 4px;border-top:1px solid var(--line,#CBD6E4);vertical-align:top}.aiw td.n{text-align:right;white-space:nowrap;font-weight:700;width:60px}"+
   ".aiw ul{margin:4px 0 8px;padding-left:20px}.aiw li{margin:3px 0}.aiw .aiw-x{text-decoration:line-through;opacity:.75}.aiw .aiw-ok{font-weight:700}.aiw .aiw-w{display:inline-block;width:16px;height:16px;border:2px solid var(--line,#CBD6E4);border-top-color:var(--gold,#A9843A);border-radius:50%;animation:aiwsp .9s linear infinite;vertical-align:-3px;margin-right:8px}"+
   "@keyframes aiwsp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.aiw .aiw-w{animation:none}}";
   document.head.appendChild(st)}
  function prompt(c,text){
    var crit=c.crit.map(function(x,i){return (i+1)+". "+x[0]+" (0–"+x[1]+")"+(x[2]?": "+x[2]:"")}).join("\n");
    var max=c.crit.reduce(function(a,x){return a+x[1]},0);
    return "You are an experienced, fair English examiner marking the writing part of "+c.exam+". The writer is "+(c.who||"a learner of English")+". Mark with the criteria below, exactly as a careful teacher would: reward what is there, do not inflate, and keep the level of the test in mind.\n\n"+
     "TASK:\n"+(typeof c.task==="function"?c.task():c.task)+(c.words?"\nLength asked for: "+c.words+".":"")+"\n\nCRITERIA (total "+max+"):\n"+crit+(c.bands?"\n\nMARK SCHEME:\n"+c.bands:"")+
     "\n\nANSWER ("+words(text)+" words), between the markers:\n<<<\n"+String(text).slice(0,6000)+"\n>>>\n\nIf the answer is blank, off-task, copied from the task or not in English, give 0 for every criterion.\n"+
     "Reply with JSON only: {\"scores\":["+c.crit.map(function(){return 0}).join(",")+"],\"comments\":["+c.crit.map(function(){return '"one short sentence"'}).join(",")+"],\"feedback\":\"2–3 encouraging, specific sentences for the learner in simple English\",\"corrections\":[{\"wrong\":\"exact words from the answer\",\"right\":\"corrected version\",\"why\":\"very short reason\"}],\"cefr\":\"A1|A2|B1|B2|C1|C2\"}  Give up to 6 corrections of the most important errors.";
  }
  function srv(c,text){
    var body={exam:c.exam,who:c.who||"",task:typeof c.task==="function"?c.task():c.task,words:c.words||"",bands:c.bands||"",crit:c.crit,text:String(text).slice(0,6000)};
    var post=function(){return fetch("/api/tests/writemark",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){return{ok:r.ok,st:r.status,d:d}})})};
    return post().then(function(x){return x.ok||x.st===401||x.st===400||x.st===429?x:post()}).then(function(x){
      if(x.ok&&x.d&&x.d.scores)return x.d;throw{code:x.st===401?"login":x.st===429?"rate_limited":"ai"}});
  }
  function mark(c,text){
    return sample().then(function(s){return s?s.json(prompt(c,text),{modelTier:"default",cache:false}):srv(c,text)}).then(function(j){
      var sc=c.crit.map(function(x,i){var v=Math.round(Number(j&&j.scores&&j.scores[i]));return isFinite(v)?Math.max(0,Math.min(x[1],v)):0});
      var cm=c.crit.map(function(x,i){return String(j&&j.comments&&j.comments[i]||"")});
      var corr=(j&&Array.isArray(j.corrections)?j.corrections:[]).slice(0,6).map(function(x){return{w:String(x&&x.wrong||""),r:String(x&&x.right||""),y:String(x&&x.why||"")}}).filter(function(x){return x.w||x.r});
      return{s:sc,c:cm,total:sc.reduce(function(a,b){return a+b},0),max:c.crit.reduce(function(a,x){return a+x[1]},0),fb:String(j&&j.feedback||""),corr:corr,cefr:String(j&&j.cefr||""),h:h(text),at:new Date().toISOString(),n:c.crit.map(function(x){return x[0]}),m:c.crit.map(function(x){return x[1]})};
    });
  }
  function resHtml(r,c,stale){
    var hdr=c.mode==="teacher"?"AI examiner’s suggestion":"AI examiner’s mark";
    var t='<div class="aiw-big">'+r.total+'<small> / '+r.max+(r.cefr?' · about '+esc(r.cefr):'')+'</small></div>';
    if(r.s.length>1||r.c[0])t+='<table>'+r.s.map(function(v,i){return '<tr><td><b>'+esc(r.n[i])+'</b>'+(r.c[i]?'<br><span class="aiw-m" style="margin:0">'+esc(r.c[i])+'</span>':'')+'</td><td class="n">'+v+' / '+r.m[i]+'</td></tr>'}).join('')+'</table>';
    if(r.fb)t+='<p style="margin:0 0 8px">'+esc(r.fb)+'</p>';
    if(r.corr&&r.corr.length)t+='<b>Corrections</b><ul>'+r.corr.map(function(x){return '<li><span class="aiw-x">'+esc(x.w)+'</span> → <span class="aiw-ok">'+esc(x.r)+'</span>'+(x.y?' <span class="aiw-m">('+esc(x.y)+')</span>':'')+'</li>'}).join('')+'</ul>';
    return '<h4>'+hdr+'</h4>'+(stale?'<p class="aiw-m">You have changed your writing since this mark. Mark it again to update it.</p>':'')+t+
      '<p class="aiw-m">'+(c.mode==="teacher"?"Check it, then use it or change it. The final mark is yours.":"An AI estimate, marked on the same criteria as your teacher uses. Your teacher can change it.")+'</p>';
  }
  function panel(host,c){
    if(!host)return null;addCss();
    var box=document.createElement("div");box.className="aiw";box.hidden=true;
    if(c.before)host.parentNode.insertBefore(box,host);else host.parentNode.insertBefore(box,host.nextSibling);
    var ls0=lsGet(c.key),res=c.stored||(ls0&&ls0.h===h(c.getText()||"")?ls0:null),busy=false,err="";
    function draw(){
      var text=c.getText()||"",n=words(text),stale=res&&res.h&&res.h!==h(text);
      var min=c.min||25;
      var b='';
      if(res)b+=resHtml(res,c,stale&&c.mode!=="teacher");
      else b+='<h4>AI examiner</h4><p class="aiw-m">'+(c.mode==="teacher"?"Get a suggested mark for this writing on the test’s criteria, with corrections.":"When you have finished, the AI examiner marks your writing on the test’s criteria and shows your mistakes.")+'</p>';
      if(err)b+='<p class="aiw-m" style="color:var(--bad,#A23B3B)">'+esc(err)+'</p>';
      if(busy)b+='<p class="aiw-m"><span class="aiw-w"></span>The examiner is reading the writing. This usually takes 20–60 seconds.</p>';
      else{
        var lab=c.mode==="teacher"?(res?"Mark again with AI":"Mark with AI"):(res?"Mark again":"Mark my writing with AI");
        b+='<div>'+(c.locked&&c.mode!=="teacher"&&res?'':'<button type="button" data-aiw="go"'+(n<min?' disabled':'')+'>'+lab+'</button>')+
          (c.mode==="teacher"&&res&&c.apply?'<button type="button" class="l" data-aiw="use">Use this mark</button>':'')+
          (n<min?'<span class="aiw-m">Write at least '+min+' words first.</span>':'')+'</div>';
      }
      box.innerHTML=b;
      var g=box.querySelector('[data-aiw="go"]');if(g)g.onclick=go;
      var u=box.querySelector('[data-aiw="use"]');if(u)u.onclick=function(){c.apply(res);u.textContent="Mark entered ✓";u.disabled=true};
    }
    function go(){
      var text=c.getText()||"";if(words(text)<(c.min||25))return;
      busy=true;err="";draw();
      mark(c,text).then(function(r){res=r;lsSet(c.key,r);busy=false;draw();if(c.onResult)try{c.onResult(r)}catch(e){}})
      .catch(function(e){busy=false;err=e&&e.code==="login"?"Sign in to the IF App to get an AI mark, then try again. Your teacher can also mark it.":e&&e.code==="rate_limited"?"Too many requests just now. Try again in a minute.":e&&(e.code==="not_granted"||e.code==="unavailable")?"AI marking isn’t allowed on this device. Your teacher will mark your writing.":"The examiner couldn’t mark this just now. Try again.";
        if(e&&(e.code==="not_granted"||e.code==="unavailable")&&c.mode!=="teacher"&&!res){box.hidden=false}draw()});
    }
    sample().then(function(){box.hidden=false;draw()});
    if(c.watch){[].concat(c.watch).forEach(function(w){w.addEventListener("input",function(){if(!busy&&!box.hidden)draw()})})}
    return box;
  }
  return {panel:panel,mark:mark,sample:sample,hash:h,words:words};
})();

function aiwStrip(x){const d=document.createElement('div');d.innerHTML=String(x||'');return d.textContent.replace(/\s+\n/g,'\n').trim()}
function aiwCfg(t,s,wt){const W=s.writing;let task=(W.html||[]).map(aiwStrip).join('\n');
 if(W.tasks){task+=(task?'\n':'')+(wt!=null&&W.tasks[wt]!=null?'The learner chose this task: '+aiwStrip(W.tasks[wt]):'The learner chose ONE of these tasks (work out which from the answer):\n- '+W.tasks.map(aiwStrip).join('\n- '))}
 return {exam:'an English File Advanced (C1) test ('+t.title+')',who:'an adult or older teenage learner studying at C1 level',words:'about 250 words',task:task,min:40,crit:W.crit.map(c=>[c[0],c[1],c[0]==='Task completion'?'task fully completed, all points covered, appropriate register, easy to understand':c[0]==='Grammar'?'a range of structures appropriate to the level; minor errors do not obscure meaning':c[0]==='Vocabulary'?'a sufficient and precise range of vocabulary to communicate clearly':''])}}
</script>

ts' bakery chain. Her grandfather had started it with one small shop in 1994, and by the time Aliya was twenty there were eleven branches across the region."],["","“Business was what we talked about at dinner,” she says. “I took after my mother – I was good with numbers and I loved the energy of the shops. But I wanted to prove I could succeed on my own first.” So instead, she took a job with an international marketing firm in Almaty."],["","The job was well paid and challenging, and she stayed for four years. Nevertheless, she found herself thinking about the bakeries more and more. “I'd see a café doing something clever and think: we could do that at home.”"],["","In the end, she returned – but on her own terms. She insisted on a proper contract and a clear role, rather than simply being ‘the owner's daughter’. Her parents agreed, and she now runs the company's online orders. Her advice to others? “Get experience somewhere else first. People respect you more, and so do you.”"]]},"parts":[{"items":[{"t":"mc","q":"Why did people expect Aliya to join the bakery business?","o":["It was a family company and she was expected to continue it.","She had studied baking at university.","Her grandfather asked her to manage it."],"a":0},{"t":"mc","q":"Why did Aliya go to work in Almaty?","o":["She wanted to show she could succeed independently.","She disliked working with numbers.","Her parents' business was in difficulty."],"a":0},{"t":"mc","q":"What happened while she was working for the marketing firm?","o":["She became bored and left after a year.","She kept thinking of ideas for the family business.","She was promoted several times."],"a":1},{"t":"mc","q":"What did Aliya insist on when she returned?","o":["A formal agreement about her job","Working only in the shops","A share of the company"],"a":0},{"t":"mc","q":"What is Aliya's main advice?","o":["Work for another company before joining the family business.","Start your own company as soon as possible.","Never work for {"t":"pron","o":["imagi_na_tion","i_ma_gination","_i_magination"],"a":0},{"t":"pron","o":["_a_chievement","achieve_ment_","a_chieve_ment"],"a":2},{"t":"pron","o":["neighbour_hood_","neigh_bour_hood","_neigh_bourhood"],"a":2}]}]},{"k":"r","name":"Reading","max":10,"w":2,"intro":"Read the text and choose A, B, or C. Two marks for each answer.","passage":{"title":"How reliable are our first memories?","paras":[["","Ask a group of adults about their earliest memory and most will describe something that happened when they were about three. Very few people can remember anything before the age of two, a phenomenon psychologists call ‘childhood amnesia’."],["","One explanation is that very young children have not yet developed language. Without words to organize an experience, the brain may store it in a way that becomes impossible to retrieve later. Another is that the part of the brain responsible for long-term memory is still developing."],["","Surprisingly, many first memories may not be real at all. Researchers have found that people often build ‘memories’ from family photographs or stories they heard repeatedly as children. The famous psychologist Jean Piaget was certain he remembered someone trying to kidnap him from his pram. Years later, his nurse admitted she had invented the whole story."],["","So does this mean we should stop trusting our childhood memories? Not exactly. Even if the details are wrong, they still tell us what mattered to us – and the feelings they carry are usually genuine."]]},"parts":[{"items":[{"t":"mc","q":"According to the text, most adults' first memories are from…","o":["around the age of three.","their first day at school.","before the age of two."],"a":0},{"t":"mc","q":"One explanation for ‘childhood amnesia’ is that young children…","o":["forget things on purpose.","don't have words to organize experiences.","are not interested in what happens to them."],"a":1},{"t":"mc","q":"Some first memories may come from…","o":["dreams.","books we ot."],"a":2},{"t":"mc","q":"What is true about Gulnara now?","o":["She still lives with her grandmother.","She keeps chickens.","She avoids pigeons."],"a":1}]}]},{"k":"s","name":"Speaking","max":30,"speaking":{"mode":"task","focus":"used to, would, narrative tenses (had been doing), I remember / I'll never forget + -ing, pronouns (each other, themselves), abstract nouns.","tasks":[{"name":"Interview","mins":2,"lead":"The teacher asks; the student answers in two or three sentences each.","prompts":["What did you use to do at weekends when you were a child?","Is there anything you used to like that you don't like now?","How do you and your friends keep in touch with each other?","Which English words do you find hardest to spell or pronounce?"]},{"name":"Long turn","mins":2,"lead":"The student talks alone. The teacher only listens.","card":"Describe a childhood memory that you'll never forget.","prompts":["how old you were and where you were","what you had been doing before","what happened","how you felt then and how you feel about it now"]},{"name":"Discussion","mins":3,"lead":"Teacher and student discuss; the student should give reasons and examples.","prompts":["Was childhood better 30 years ago than it is today?","Should English spelling be simplified?","Is it important to speak a foreign language without an accent?"]}]}}],"group":"q2"},{"id":"q3","kind":"quick","title":"Quick Test 3","focus":"File 3: get, suggest, discourse markers (2), relationships, conflict and warfare.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Choose A, B, or C to complete the sentences.","items":[{"t":"mc","q":"It's ___ dark. Let's go home.","o":["got","getting","get"],"a":1},{"t":"mc","q":"I'm going to ___ my car serviced tomorrow.","o":["get","do","make"],"a":0},{"t":"mc","q":"Can you ___ your brother to help us?","o":["let","make","get"],"a":2},{"t":"mc","q":"He ___ caught cheating in the exam.","o":["got","had","made"],"a":0},{"t":"mc","q":"I suggest ___ a taxi. inly through films.","prefer documentaries to dramas."],"a":1},{"t":"mc","q":"Why do screenwriters change some details?","o":["because historians ask them to","to make films cheaper","to fit real events into a film"],"a":2},{"t":"mc","q":"What is the writer's point about the Underground scene?","o":["It is a good example of accurate history.","Historians enjoyed it.","It was completely invented, but people may believe it."],"a":2},{"t":"mc","q":"Experts think dramatic licence is most problematic when…","o":["the actors are famous.","the film is very long.","the events happened recently."],"a":2},{"t":"mc","q":"What do experts want film-makers to do?","o":["stop making historical films","only use real conversations","admit what they have invented"],"a":2}]}]},{"k":"l","name":"Listening","max":10,"w":2,"listen":{"mode":"tts","setting":"You will hear two flatmates, Aisha and Ben, talking about a problem.","script":[["Aisha","Ben, can I talk to you about something? It's been getting on my nerves for a while."],["Ben","Uh-oh. What have I done?"],["Aisha","It's the washing-up. You leave it for days. In fact, there's a pan in the sink from Sunday."],["Ben","Ah. Sorry. I've been working late all week, and I just haven't got round to it."],["Aisha","I know you're busy. But I'm busy too. I suggest we make a rota – one week each."],["Ben","That's fair. Actually, why don't we get a dishwasher? My parents are getting rid of theirs – it's only two years old."],["Aisha","Really? That would be amazing. But where would we put it?"],["Ben","Next to the fridge. We'd have to get a plumber to install it, though."],["Aisha","I'll pay for the plumber, then. And until it arrives, the rota."],["Ben","Deal. I'll do the pan tonight – I promise."]]},"parts":[{"items":[{"t":"mc","q":"What is Aisha's complaint?","o":["Ben doesn't wash the dishes.","Ben is too noisy.","Ben works too late."],"a":0},{"t":"mc","q":"Why does Ben say he hasn't done it?","o":["He has been working long hours.","He thought Aisha would do it.","He forgot it was his turn."],"a":0},{"t":"mc","q":"What does Aisha suggest?","o":["taking turns each week","eating out more","buying a dishwasher"],"a":0},{"t":"mc","q":"Where would the dishwasher come from?","o":["a shop","a neighbour","Ben's parents"],"a":2},{"t":"mc","q":"What will Aisha pay for?","o":["a new pan","the plumber","the dishwasher"],"a":1}]}]},{"k":"s","name":"Speaking","max":30,"speaking":{"mode":"task","focus":"get (get used to, get sb to do, get sth done), suggest + -ing / that, discourse markers (after all, at least, in fact, by the way), conflict vocabulary.","tasks":[{"name":"Interview","mins":2,"lead":"The teacher asks; the student answers in two or three sentences each.","prompts":["What kind of things get on your nerves?","Have you ever got away with something you shouldn't have done?","What do you usually get other people to do for you?","Which historical film or series have you enjoyed? Was it accurate?"]},{"name":"Long turn","mins":2,"lead":"The student talks alone. The teacher only listens.","card":"Talk about an important event in the history of your country.","prompts":["when and where it happened","the people involved","what happened as a result","why people still talk about it today"]},{"name":"Discussion","mins":3,"lead":"Teacher and student discuss; the student should give reasons and examples.","prompts":["Do people who dislike the same things make better friends?","Should historical films always be accurate?","Is it better to meet people online or in real life?"]}]}}],"group":"q3"},{"id":"q4","kind":"quick","title":"Quick Test 4","focus":"File 4: adding emphasis (1): inversion, speculation and deduction, books and films, foreign words, sounds and the human voice.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Choose A, B, or C to complete the sentences.","items":[{"t":"mc","q":"Never ___ such a beautiful sunset.","o":["have I seen","I saw","I have seen"],"a":0},{"t":"mc","q":"Not only  out to be more relaxing than listening to calm music."],["","Not everyone finds silence comfortable, though. Many people switch on the TV or put in their earphones the moment they are alone. Experts suggest starting small: a five-minute walk without a phone may be all it takes to notice what we have been missing."]]},"parts":[{"items":[{"t":"mc","q":"According to the text, silence today is…","o":["rare and valuable.","more common than in the past.","bad for our health."],"a":0},{"t":"mc","q":"What can happen even when we think we are used to a noise?","o":["Our body may still react to it.","We stop hearing it completely.","We begin to enjoy it."],"a":0},{"t":"mc","q":"Why were the results of the experiment surprising?","o":["Silence had a stronger effect than music.","The music made people anxious.","People couldn't stay silent for two minutes."],"a":0},{"t":"mc","q":"What do many people do when they are alone?","o":["try to sleep","fill the silence with sound","go for a walk"],"a":1},{"t":"mc","q":"What do experts recommend?","o":["beginning with short periods of quiet","never using earphones","moving to the countryside"],"a":0}]}]},{"k":"l","name":"Listening","max":10,"w":2,"listen":{"mode":"tts","setting":"You will hear two people, Kate and Ruslan, talking about a book club.","script":[["Kate","Did you finish the book for Thursday's book club?"],["Ruslan","I did. Honestly, I couldn't put it down. I read the last hundred pages in one night."],["Kate","Really? I found the first half really slow. Nothing happens until the brother disappears."],["Ruslan","That's true, but once it gets going, it's gripping. And I never saw the twist coming."],["Kate","Oh, I guessed it. The neighbour must have known something – she kept appearing at the window."],["Ruslan","Hmm, you might be right. Anyway, have you heard they're making it into a film?"],["Kate","No! Who's in it?"],["Ruslan","I'm not sure, but apparently it's going to be set in Scotland instead of Canada."],["Kate","That's strange. Then again, the book's descriptions of the forest were the best part. They'll probably look amazing on screen."],["Ruslan","Let's see it together when it comes out. I bet it won't be as good as the book."]]},"parts":[{"items":[{"t":"mc","q":"How did Ruslan feel about the book?","o":["He thought it was too long.","He didn't finish it.","He found it hard to stop reading."],"a":2},{"t":"mc","q":"What did Kate dislike?","o":["the characters","the beginning","the ending"],"a":1},{"t":"mc","q":"What does Kate say about the twist?","o":["It surprised her.","It was badly written.","She had worked it out."],"a":2},{"t":"mc","q":"What change is being made in the film?","o":["the setting","the ending","the title"],"a":0},{"t":"mc","q":"What does Ruslan predict about the film?","o":["It won't be as good as the book.","Kate won't want to see it.","It will win prizes."],"a":0}]}]},{"k":"s","name":"Speaking","max":30,"speaking":{"mode":"task","focus":"inversion (Never have I…, Not only… but also…), speculation (must have, can't be, bound to, likely to), book and film adjectives, sound verbs.","tasks":[{"name":"Interview","mins":2,"lead":"The teacher asks; the student answers in two or three sentences each.","prompts":["What's the most gripping book or series you've ever come across?","Do you prefer reading the book or watching the film? Why?","What sounds do you love and what sounds do you hate?","Where do you go when you want some peace and quiet?"]},{"name":"Long turn","mins":2,"lead":"The student talks alone. The teacher only listens.","card":"Review a book or film you have recently read or seen.","prompts":["what it's about and where it's set","the main characters","what was good and what wasn't","who you would recommend it to"]},{"name":"Discussion","mins":3,"lead":"Teacher and student discuss; the student should give reasons and examples.","prompts":["Do spoilers make stories better or worse?","Is noise pollution a serious problem where you live?","Will people ve many short gaps, which we fill with messages and social media."],["","Another reason is money. When people earn more, every hour seems more valuable – and wasting it feels more painful. Paradoxically, the wealthier we become, the more pressed for time we feel."],["","Some experts suggest a simple solution: put free time in your diary, just like a meeting. If it's written down, you are far less likely to give it away."]]},"parts":[{"items":[{"t":"mc","q":"According to the text, saying you are busy can make you seem…","o":["less friendly.","more stressed.","more important."],"a":2},{"t":"mc","q":"What do official studies suggest about leisure time today?","o":["It is the same as fifty years ago.","Most people have more than their grandparents had.","It has fallen sharply."],"a":1},{"t":"mc","q":"What does ‘fragmented’ mean in this context?","o":["divided into many small pieces","wasted completely","spent with other people"],"a":0},{"t":"mc","q":"What is the paradox mentioned in paragraph 3?","o":["Richer people feel they have less time.","Money makes people relax more.","Poorer people work fewer hours."],"a":0},{"t":"mc","q":"What do experts recommend?","o":["working fewer hours","planning free time in advance","avoiding social media completely"],"a":1}]}]},{"k":"l","name":"Listening","max":10,"w":2,"listen":{"mode":"tts","setting":"You will hear a radio presenter talking to a listener, Daniyar, about money.","script":[["Presenter","Our next caller is Daniyar. Daniyar, you've got a money question?"],["Daniyar","Yes. I've just started my first full-time job, and I'm always broke by the end of the month. I wish I knew where it all goes."],["Presenter","You're not alone! First step: write down everything you spend for one month. Every coffee, every taxi."],["Daniyar","Everything? That sounds a bit tedious."],["Presenter","It is, but it works. Most people are amazed. Small things add up to a fortune."],["Daniyar","OK. And then what?"],["Presenter","Then set up a separate savings account and pay ten per cent of your salary into it on payday – before you spend anything."],["Daniyar","Ten per cent? I'd rather start with five."],["Presenter","Five is fine to start with. The important thing is that it happens automatically."],["Daniyar","That makes sense. It's time I got organized. Thanks!"]]},"parts":[{"items":[{"t":"mc","q":"What is Daniyar's problem?","o":["He has no money left at the end of the month.","He can't find a job.","He has a large debt."],"a":0},{"t":"mc","q":"What does the presenter suggest first?","o":["asking his parents for advice","cancelling his bank card","recording all his spending"],"a":2},{"t":"mc","q":"How does Daniyar feel about the first suggestion?","o":["It seems boring.","It seems exciting.","It seems impossible."],"a":0},{"t":"mc","q":"When should money go into the savings account?","o":["on the day he is paid","at the end of the month","whenever he has extra"],"a":0},{"t":"mc","q":"What does Daniyar decide?","o":["to save ten per cent","not to save anything yet","to start by saving five per cent"],"a":2}]}]},{"k":"s","name":"Speaking","max":30,"speaking":{"mode":"task","focus":"distancing (It seems that…, apparently, is said to), wish / if only / would rather / it's time, expressions with time, money idioms.","tasks":[{"name":"Interview","mins":2,"lead":"The teacher asks; the student answers in two or three sentences each.","prompts":["Do you usually feel that you have enough time? Why (not)?","What do you wish you had more time for?","Are you better at saving money or spending it?","What's the best bargain you've ever found?"]},{"name":"Long turn","mins":2,"lead":"The student talks alone. The teacher only listens.","card":"Talk about something you wish you had done differently.","prompts":["what happened","what you did","what you wish you had done","what you learned from it"]},{"name":"Discussion","mins":3,"lead":"Teacher and student discuss; the student should give reasons and examples.","prompts":["I ck anything. My hand just did it automatically.’ By the third day, he had started carrying a small notebook to write down things he would normally have searched for online."],["","The biggest surprise was sleep. Without a screen in bed, Timur was falling asleep almost an hour earlier. He also found that he got through his homework much faster, provided he left the laptop in another room."],["","Not everything was positive. He missed several invitations because his friends only used group chats, and he felt left out. ‘If I did it again, I'd tell everyone first,’ he says. Will he give up his phone for good? ‘No way. But I've turned off almost all my notifications, and that's made a huge difference.’"]]},"parts":[{"items":[{"t":"mc","q":"How did Timur feel about the experiment before it started?","o":["He was very worried about it.","He expected it to be easy.","He didn't want to do it."],"a":1},{"t":"mc","q":"What does Timur say about checking his phone on the first day?","o":["He wanted to see his messages.","He did it to annoy his teacher.","He did it without thinking."],"a":2},{"t":"mc","q":"What was the most unexpected result?","o":["He read more books.","He made new friends.","He slept earlier."],"a":2},{"t":"mc","q":"What was the main disadvantage?","o":["He missed social plans.","He lost his notebook.","He fell behind with homework."],"a":0},{"t":"mc","q":"What has Timur done since the experiment?","o":["He has given up his phone completely.","He has reduced his notifications.","He has bought a new phone."],"a":1}]}]},{"k":"l","name":"Listening","max":10,"w":2,"listen":{"mode":"tts","setting":"You will hear a mother and her son, Arman, discussing house rules.","script":[["Mum","Arman, we need to talk about phones at dinner."],["Arman","Oh no. Not again."],["Mum","Your father and I have decided: no phones at the table. Not just for you – for all of us."],["Arman","Even Dad? He's always reading the news."],["Mum","Even Dad. And we'd like you to leave your phone d ork, by Italian artist Maurizio Cattelan, made headlines around the world – which, some critics argue, was exactly the point."],["","The debate is not new. More than a hundred years ago, Marcel Duchamp signed his name on an ordinary object, gave it a title and sent it to an exhibition. The organizers refused to show it. Today it is considered one of the most influential works of the twentieth century."],["","Supporters of conceptual art say that the idea matters more than the skill. A painting of a landscape shows talent, they say, but a work that makes thousands of people argue about what art is shows something more important."],["","Critics disagree. They say that if anything can be art, then the word means nothing. And they point out that it is usually rich collectors, not ordinary visitors, who decide what is worth millions."]]},"parts":[{"items":[{"t":"mc","q":"Why does the writer mention the banana?","o":["to show that fruit is popular in galleries","to introduce an argument about what art is","to criticize Italian artists"],"a":1},{"t":"mc","q":"What happened to Duchamp's work at first?","o":["It was stolen.","It was rejected.","It was sold for a fortune."],"a":1},{"t":"mc","q":"According to supporters, conceptual art is valuable because…","o":["it requires great technical skill.","it makes people think and argue.","it is cheap to produce."],"a":1},{"t":"mc","q":"What do critics fear?","o":["The word ‘art’ will lose its meaning.","Artists will stop painting landscapes.","Galleries will close."],"a":0},{"t":"mc","q":"Who, according to critics, decides what art is worth?","o":["wealthy collectors","ordinary visitors","the artists themselves"],"a":0}]}]},{"k":"l","name":"Listening","max":10,"w":2,"listen":{"mode":"tts","setting":"You will hear a museum guide giving some rules to a group of students.","script":[["Guide","Good morning, everyone, and welcome to the City Art Museum. Before we start, a few rules."],["Guide","You're allowed to take photos in most room alth problems are made worse by loneliness and inactivity."],["","Patients are referred to a ‘link worker’, who helps them find local activities that suit them. One patient, a retired builder who had been visiting his doctor almost every week, was encouraged to join a walking group. Six months later, his visits had dropped to once every two months."],["","Supporters say the approach saves money and improves lives. However, some doctors are cautious. They point out that a hobby cannot cure a serious illness, and they worry that patients who really need medicine might not receive it."],["","Most agree, though, that social prescribing works best as an addition to traditional treatment rather than a replacement. As one doctor put it, ‘It's not either–or. It's both.’"]]},"parts":[{"items":[{"t":"mc","q":"What is ‘social prescribing’?","o":["giving medicine to groups of patients","a new type of antibiotic","recommending activities to improve health"],"a":2},{"t":"mc","q":"What does a link worker do?","o":["prescribes medicine","runs a walking group","helps patients find suitable activities"],"a":2},{"t":"mc","q":"What happened to the retired builder?","o":["He needed to see his doctor much less often.","He became a gardener.","He stopped walking."],"a":0},{"t":"mc","q":"What concern do some doctors have?","o":["Hobbies are too expensive.","Link workers are badly trained.","Patients might miss treatment they need."],"a":2},{"t":"mc","q":"What do most people agree on?","o":["It should be used together with normal treatment.","It should replace medicine completely.","It doesn't work at all."],"a":0}]}]},{"k":"l","name":"Listening","max":10,"w":2,"listen":{"mode":"tts","setting":"You will hear two friends, Lena and Sanzhar, planning a trip.","script":[["Lena","So, are we still on for the trip to Burabay next month?"],["Sanzhar","Definitely. My cousin is getting married in Astana on the 12th, so I'll already be in the north."],["Lena","Perfect. My train is due to arrive in Astana on the 14th at about eight in the morning."],["Sanzhar","Great, I'll meet you at the station, and we can drive from there. It's about three hours."],["Lena","Where are we staying?"],["Sanzhar","I was about to book a hotel by the lake, but they were really expensive. I found a small guesthouse in the forest instead."],["Lena","Sounds lovely. Is it very touristy there in summer?"],["Sanzhar","Around the main lake, yes – it gets really overcrowded at weekends. But there are some quieter lakes that are completely unspoilt."],["Lena","Let's go to those, then. I want to get off the beaten track."],["Sanzhar","Agreed. And bring proper walking boots – there are some great hikes."]]},"parts":[{"items":[{"t":"mc","q":"Why will Sanzhar already be in the north?","o":["He lives in Astana.","He's going to a wedding.","He's working there."],"a":1},{"t":"mc","q":"How is Lena travelling to Astana?","o":["by car","by plane","by train"],"a":2},{"t":"mc","q":"Why didn't Sanzhar book the hotel?","o":["It was fully booked.","It was too expensive.","It was too far from the lake."],"a":1},{"t":"mc","q":"What does Sanzhar say about the main lake?","o":["It's completely unspoilt.","It's very crowded at weekends.","It's closed in summer."],"a":1},{"t":"mc","q":"What should Lena bring?","o":["a tent","a swimming costume","walking boots"],"a":2}]}]},{"k":"s","name":"Speaking","max":30,"speaking":{"mode":"task","focus":"being told / having done / to have seen, it's no use -ing, due to / about to / on the point of, health vocabulary, similes, travel adjectives.","tasks":[{"name":"Interview","mins":2,"lead":"The teacher asks; the student answers in two or three sentences each.","prompts":["What do you do when you feel ill? Do you go to the doctor straight away?","What's something you hate being asked to do?","What are you planning to do next weekend?","What's the most beautiful place you've ever visited?"]},{"name":"Long turn","mins":2,"lead":"The student talks alone. The teacher only listens. ound her injured knee, working with a coach whose patience she still praises today. When she returned, she was not only fitter but mentally tougher."],["","Two years later she won her first international medal. Four years after that, at an age when many athletes have retired, she won another. ‘What kept me going,’ she says, ‘was not the medals. It was the feeling that I hadn't finished yet.’"]]},"parts":[{"items":[{"t":"mc","q":"What was the turning point in Aigerim's career?","o":["changing to a different event","winning her first competition","moving to another country"],"a":0},{"t":"mc","q":"What did doctors once tell her?","o":["She should change her coach.","She needed to lose weight.","She might never compete again."],"a":2},{"t":"mc","q":"According to Aigerim, what did she gain from her injuries?","o":["more free time","a new coach","a better understanding of herself"],"a":2},{"t":"mc","q":"What does she say about her coach?","o":["He was also a champion.","He was very patient.","He was very strict."],"a":1},{"t":"mc","q":"What, according to Aigerim, motivated her most?","o":["making her family proud","winning medals","feeling she still had more to achieve"],"a":2}]}]},{"k":"l","name":"Listening","max":10,"w":2,"listen":{"mode":"tts","setting":"You will hear a man, Alex, talking about moving abroad.","script":[["Interviewer","Alex, you moved from Manchester to Kostanay three years ago. Why?"],["Alex","My wife is from here. We met when she was studying in England, and when her father got ill, we decided to come back to be near her family."],["Interviewer","What was the hardest thing at first?"],["Alex","The language, definitely. What I hadn't expected was how hard it would be to do simple things – paying bills, going to the doctor. I felt like a complete outsider."],["Interviewer","And now?"],["Alex","My Russian is much better. I teach English at a school here, which means I'm speaking to people all day."],["Interviewer","What do you miss about England?"],["Alex","Honestly, it's not the food – people always ask that. It's the sea. Kostanay is about as far from the sea as you can get!"],["Interviewer","Do you think you'll ever go back?"],["Alex","Maybe one day. But right now, this is home."]]},"parts":[{"items":[{"t":"mc","q":"Why did Alex and his wife move to Kostanay?","o":["for Alex's job","to be near her family","because they wanted an adventure"],"a":1},{"t":"mc","q":"What did Alex find hardest at first?","o":["making friends","doing everyday tasks","the cold weather"],"a":1},{"t":"mc","q":"How did Alex feel at the beginning?","o":["very excited","homesick for his family","like an outsider"],"a":2},{"t":"mc","q":"What does Alex miss most about England?","o":["the sea","his friends","the food"],"a":0},{"t":"mc","q":"How does Alex feel about the future?","o":["He will never go back.","He might return one day, but he's happy now.","He wants to leave soon."],"a":1}]}]},{"k":"s","name":"Speaking","max":30,"speaking":{"mode":"task","focus":"relative clauses (whose, which, neither of whom), cleft sentences (What I love is…, It was… that…), word building, sport and travel words.","tasks":[{"name":"Interview","mins":2,"lead":"The teacher asks; the student answers in two or three sentences each.","prompts":["What sport or kind of exercise do you enjoy? Why?","Who is a sportsperson you admire, and why?","What I like most about my town is… – finish the sentence and explain.","Would you like to live abroad one day? Where?"]},{"name":"Long turn","mins":2,"lead":"The student talks alone. The teacher only listens.","card":"Describe a person you know who has achieved something difficult.","prompts":["who the person is","what they achieved","what problems they had to overcome","what you have learned from them"]},{"name":"Discussion","mins":3,"lead":"Teacher and student discuss; the student should give reasons and examples.","prompts":["Are professional athletes paid too much?","Is it easier to be a foreigner today than 50 years ago?", ,"a":[["sarcastic"]]}],"ex":"Karen’s so bossy – I’m sick of her telling us what to do!","bankHtml":["affectionate","bossy","bright","conscientious","gentle","moody","reliable","sarcastic","spontaneous","thorough"]}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"n<b>e</b>phew <span class=\"hint\">(1 of 2)</span>","a":["relatives","terrible"],"grp":"snd7-1","slot":0},{"t":"match","q":"n<b>e</b>phew <span class=\"hint\">(2 of 2)</span>","a":["relatives","terrible"],"grp":"snd7-1","slot":1},{"t":"match","q":"r<b>e</b>spect <span class=\"hint\">(1 of 2)</span>","a":["employee","tedious"],"grp":"snd7-2","slot":0},{"t":"match","q":"r<b>e</b>spect <span class=\"hint\">(2 of 2)</span>","a":["employee","tedious"],"grp":"snd7-2","slot":1},{"t":"match","q":"w<b>or</b>k","a":"turnover","grp":null,"slot":0}],"ex":"r<b>ea</b>dy → steady","bankHtml":["employ<b>ee</b>","r<b>e</b>latives","st<b>ea</b>dy","t<b>e</b>dious","t<b>e</b>rrible","t<b>ur</b>nover"],"opts":["employee","relatives","steady","tedious","terrible","turnover"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["in","tro","vert"],"a":0,"word":"introvert"},{"t":"stress","w":["a","sser","tive"],"a":1,"word":"assertive"},{"t":"stress","w":["sen","si","tive"],"a":0,"word":"sensitive"},{"t":"stress","w":["com","pe","ti","tive"],"a":1,"word":"competitive"},{"t":"stress","w":["re","bel","lious"],"a":1,"word":"rebellious"}],"ex":"time|ta|ble"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Creating Your Own Job Satisfaction","paras":[["","A lot of people think that job satisfaction is only for other people. They look with envy on people who love their jobs and who don’t think of them as work. The idea of earning a living from something you really like doing only applies to a few very lucky people, they think. But this isn’t so. It’s not only people in the so-called ‘glamour professions’, for example, who can get genuine job satisfaction. You don’t have to be in the arts or a sports person to get enjoyment from what you do for a living. Even if you’re in a boring job, it’s quite possible to get some satisfaction from it."],["","The key to this is your attitude. You may think it’s unlikely that you can derive much satisfaction from a dull job that doesn’t require much thought and that involves a lot of routine procedures. But if you approach it with the right attitude, and put some effort in, you may be surprised at how enjoyable you can make it. Of course, if you just sit there telling yourself how boring your job is, you’ll never get anything out of it. But if you set out to find ways of making it enjoyable, there’s a good chance you’ll manage to."],["","One thing you can do is to set yourself challenges. Think about what you can do for yourself to make your work a little bit more interesting. If you’ve got a repetitive job, set yourself some targets to meet and try to beat your previous records. Or use your initiative in other ways. Think about ways you could develop your career into more interesting areas – see how you could improve your skills by doing a course, for example, or look into new skills you could get that would stand you in good stead for the future. For some people, it’s not boredom that’s the problem, it’s the fact that their jobs involve a significant amount of unpleasantness. But if you keep telling yourself your job is horrible and there’s nothing you can do about it, you’ll get stuck in a rut and you’ll never get out of it. Focus on developing a positive attitude and try to keep any negative thoughts about your job out of your mind. Keep a sense of perspective – if something’s gone wrong on a particular day, decide whether it really matters or not. If it isn’t actually all that important, don’t dwell on it – let it go. Learn from it, and take an upbeat view of what’s happened – you’ll know how to avoid the problem in the future, or what to do about it if it happens again."],["","Of course, you may reach the point where you feel totally trapped in a job. If this mindset starts to overwhelm you, check out the options you may have in the place where you work. Map out a plan for improving your situation there. Are there other roles in the organization you could apply for?"],["","Could you ask to be given different tasks? Could you get a different kind of assignment or go to another department where your skills are required? Finding out there are other options will give you a sense of control over your own working life. Even if you have no job satisfaction right now, you’ll feel better if you know that there is a realistic prospect of work that gives you a degree of it."],["","Expectations are another key ingredient in job satisfaction. Take a long hard look at what you really are capable of. Sometimes it’s important to accept that you couldn’t really do the much more interesting or high-powered job you aspire to. Try to be aware of your own strengths and weaknesses. Focus on the things you really are good at, rather than on things that, if you’re really honest with yourself, you couldn’t actually do. Make the most of your situation and feel good about what you can do, rather than feeling bad about what you can’t do."],["","Work is a very important part of most people’s lives and it’s important to get at least some satisfaction from it. If you really dislike your time at work, the rest of your life is affected too, and you can easily get a negative outlook on life in general. It’s in your own hands to avoid this. Even if you can’t get the job of your dreams, you can take steps to create your own job satisfaction."]]},"parts":[{"items":[{"t":"mc","q":"The writer’s aim in the first paragraph is to ___.","o":["distinguish between different kinds of work","correct a false belief","define the term ‘job satisfaction’"],"a":1},{"t":"mc","q":"In the second paragraph, the writer ___.","o":["warns readers against a certain attitude","advises readers not to have unrealistic ideas about work","suggests to readers that most jobs are dull"],"a":0},{"t":"mc","q":"In the third paragraph, the writer emphasizes ___.","o":["how easy it can be to progress in a career","a particular route to job satisfaction","the need for people to motivate themselves"],"a":2},{"t":"mc","q":"The writer uses the phrase ‘stuck in a rut’ to refer to ___.","o":["a situation that won’t improve","the bad behaviour of others","the danger of being too sensitive"],"a":0},{"t":"mc","q":"What is the writer’s advice if something goes wrong?","o":["Pretend that it didn’t happen.","Use the experience to your advantage.","Don’t think about it until later."],"a":1},{"t":"mc","q":"The writer says that people who feel ‘trapped’ in a job should consider ___.","o":["discussing their unhappiness with managers","moving to a different company or organization","changing the kind of work they do"],"a":2},{"t":"mc","q":"The writer says that you will feel better about your working life if you ___.","o":["think that some job satisfaction is possible in the future","choose a particular career option for the future","stop aiming for job satisfaction for a while"],"a":0},{"t":"mc","q":"What does the writer say about expectations of work?","o":["Too many people have unrealistic ones.","They should be based on real ability.","They may change as time passes."],"a":1},{"t":"mc","q":"In the final paragraph, the writer says that ___.","o":["lack of job satisfaction has serious consequences for people","a negative attitude to life leads to a negative attitude to work","there is more to life than job satisfaction"],"a":0},{"t":"mc","q":"Which of the following best sums up the writer’s view in the text as a whole?","o":["Some people find it easier to get job satisfaction than others.","Everyone can get a certain amount of job satisfaction.","Job satisfaction is the most important issue in the workplace today."],"a":1}]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>You have decided to apply for the position advertised below. Write approximately 250 words in a covering letter or email.</p>","<p><b>Is this for you?</b></p>","<p>We are looking for responsible, experienced people (individuals or couples) of any age to ‘work’ as house-sitters in different European countries for varying lengths of time. All you need to do is take care of someone’s house, pets, and garden whilst they are away on business or on holiday. You won’t earn any money, but your accommodation is free. The minimum length of stay is one week so you can move from place to place. Interested? Send an email or letter and CV to Bruce Matthews at housesit@talknet.com or post it to…</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about the disadvantages of various jobs. Match the speakers (1–5) to the disadvantages of the job that they mention (A–H).","legend":["lack of job security","the possibility of making a serious mistake","having to work at inconvenient times","bad treatment from employers","having to work in unpleasant physical conditions","other people’s low opinion of the job","having to be dishonest","the need to cooperate with colleagues"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"G"},{"t":"match","q":"Speaker 2","a":"F"},{"t":"match","q":"Speaker 3","a":"A"},{"t":"match","q":"Speaker 4","a":"C"},{"t":"match","q":"Speaker 5","a":"D"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I sell cars, and on the whole I enjoy it. The money's decent and I like meeting people. What I really struggle with, though, is that the job sometimes means bending the truth. My manager expects me to tell customers that a price is the lowest we can go when it isn't, or that someone else is interested in a car when nobody is. I'm not comfortable with that, and it's the part of the job I'd happily lose."],["Narrator","Speaker two."],["Speaker 2","I'm a traffic warden. The hours are fine and I work with a good bunch of people. The hard part is how people see you. Nobody ever says, 'Thanks for keeping the roads clear.' They treat you as if you're the lowest of the low, as if the job itself is something to be ashamed of. Friends at parties go quiet when I tell them what I do. That wears you down after a while."],["Narrator","Speaker three."],["Speaker 3","I work in television production, which sounds glamorous, and the work itself is great fun. But nobody in this industry has a permanent post. You're hired for one series, and when it ends you've got no idea whether there'll be anything next month. I've been doing it for eight years and I still can't plan more than a few weeks ahead. Getting a mortgage is almost impossible."],["Narrator","Speaker four."],["Speaker 4","I'm a baker, and I love making bread. The physical side doesn't bother me and the bakery's warm and cosy. What does get to me is the hours. I start at three in the morning, so I'm in bed by eight at night while all my friends are going out. At weekends it's even worse, because that's when we're busiest. My social life has more or less disappeared."],["Narrator","Speaker five."],["Speaker 5","I'm a junior lawyer at a big firm. The work's interesting and colleagues are supportive, which helps. The real problem is the partners at the top. They think nothing of shouting at you in front of clients, they take credit for your work and they expect you to cancel your holidays at a moment's notice. In my opinion, the way the firm treats its junior staff is simply unacceptable."]]}},{"instr":"Listen to two friends discussing an article about personality types. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"The two speakers agree that ___.","o":["the man does not react well to pressure","other people like the man’s attitude and behaviour","the man should not consider himself a ‘go-getter’"],"a":2},{"t":"mc","q":"The man doesn’t agree that he ___.","o":["is good at organizing other people","makes too little effort","annoys other people"],"a":1},{"t":"mc","q":"What do the two speakers agree on the subject of discussions?","o":["The man often changes his view during them.","The man always wants to make other people agree with him.","The man likes it when people disagree with him."],"a":2},{"t":"mc","q":"The woman agrees that she ___.","o":["is regarded as unreliable by many people","has a relaxed attitude to life","frequently changes her plans"],"a":1},{"t":"mc","q":"The man says that one characteristic of ‘performers’ is that they ___.","o":["think too much about criticism","expect too much of other people","are too loyal to other people"],"a":0}],"audio":{"script":[["Woman","Have you seen this article about personality types? It says almost everyone falls into one of four groups. Let's see where you fit."],["Man","Go on, then. I bet I'm a 'go-getter'. That's the ambitious one, isn't it? Always aiming for the top."],["Woman","Hmm. It says go-getters want to be the boss and run their own company one day. Last week you told me you'd hate to run a business."],["Man","Did I? Well, yes, that's true. I'd hate all that responsibility. So I suppose I'm not really a go-getter, am I?"],["Woman","No, I don't think that's you. What about the 'organizer'? It says organizers like taking charge of a group and telling everyone what to do."],["Man","Well, I am quite good at that, to be honest. I organized the whole office trip last year."],["Woman","You did. Although the article also says organizers can be lazy about their own work and expect others to do it."],["Man","No, that's not me at all. I'd say I work harder than anyone in that office. I never leave anything half done."],["Woman","OK, I'll give you that. Now this bit, about discussions. It says some people enjoy an argument and actually prefer it when others don't share their opinion."],["Man","That's definitely true. A conversation where everyone agrees is boring. I like it when someone challenges me."],["Woman","I know! You're the only person I know who's pleased when someone contradicts them. And you hardly ever change your mind, even when you're losing."],["Man","Right, your turn. What are you?"],["Woman","Probably what they call a 'free spirit'. It says free spirits are easy-going and don't worry much about what might happen."],["Man","That's you exactly. You never get stressed about anything."],["Woman","True, I'm pretty laid-back. But it also says free spirits are unreliable and are always changing their plans. I don't think that's fair. When I say I'll do something, I do it."],["Man","Mostly. And what's the last type?"],["Woman","The 'performer'. They love being the centre of attention."],["Man","The thing about performers is that they're very sensitive. If someone says one negative thing about them, they keep going over it for days. My sister's like that. She can't let a single bad comment go."],["Woman","So, an organizer who loves an argument. That sounds about right!"]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["Which person has inspired you the most?","What kind of work would give you job satisfaction?","Which three adjectives best describe your personality?","When you argue with friends or family, what do you argue about?","Why is it important for you to be good at English?"],"talk":["‘It is not possible to be both successful and happy.’","‘Most people’s personalities do not change as they get older.’","‘You can easily tell someone’s personality type just by looking at their social media profiles.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft01b","kind":"file","group":"ft01","ver":"B","title":"File 1 Test B","focus":"1A Mood, personality and family, 1B Work: have, discourse markers (linkers), perso
