taneous","thorough"]},{"instr":"Underline the correct word(s).","items":[{"t":"pick","q":"I enjoy my job because the work is [monotonous|rewarding].","a":"rewarding"},{"t":"pick","q":"My salary isn’t high, but the [career|benefits] are really good.","a":"benefits"},{"t":"pick","q":"What are you doing after you’ve [clocked|laid] off? Fancy going for a pint?","a":"clocked"},{"t":"pick","q":"I recently had some [qualifications|training], which will help me do my work more effectively.","a":"training"},{"t":"pick","q":"I had to [hire|quit] my job after just five months for health reasons.","a":"quit"},{"t":"pick","q":"Leo is a great boss because he’s good at [motivating|demanding] people and making them want to work hard.","a":"motivating"},{"t":"pick","q":"[Colleague|Staff] turnover is high because the pay is too low.","a":"Staff"},{"t":"pick","q":"I would prefer a regular job to fixed-term [contracts|leave].","a":"contracts"}],"ex":"I’d like to get a job / profession abroad."},{"instr":"Complete the words in the sentences.","items":[{"t":"gap","q":"My kids know very well that I’m a bit of a soft <b>t</b>{} and they make sure to take advantage of it!","a":[["touch"]],"pre":["t"]},{"t":"gap","q":"We always thought Danielle felt happy here, but deep <b>d</b>{} she was really homesick.","a":[["down"]],"pre":["d"]},{"t":"gap","q":"Ingrid says her new boss is a cold <b>f</b>{}. Apparently he gives nothing away and rarely smiles.","a":[["fish"]],"pre":["f"]},{"t":"gap","q":"Steve won’t change his <b>m</b>{} – once he makes a decision, there’s no going back.","a":[["mind"]],"pre":["m"]},{"t":"gap","q":"Lara’s got a heart of <b>g</b>{}; she never says no when she’s asked for help.","a":[["gold"]],"pre":["g"]},{"t":"gap","q":"My fiancé’s parents are actually very down to <b>e</b>{} and they agree with us that we shouldn’t spend a fortune on our wedding.","a":[["earth"]],"pre":["e"]}],"ex":"I <b>t</b>end to keep quiet when my mum starts complaining about my room."}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"r<b>e</b>spect <span class=\"hint\">(1 of 2)</span>","a":["tedious","employee"],"grp":"snd7-1","slot":0},{"t":"match","q":"r<b>e</b>spect <span class=\"hint\">(2 of 2)</span>","a":["tedious","employee"],"grp":"snd7-1","slot":1},{"t":"match","q":"w<b>or</b>k","a":"turnover","grp":null,"slot":0},{"t":"match","q":"n<b>e</b>phew <span class=\"hint\">(1 of 2)</span>","a":["terrible","relatives"],"grp":"snd7-3","slot":0},{"t":"match","q":"n<b>e</b>phew <span class=\"hint\">(2 of 2)</span>","a":["terrible","relatives"],"grp":"snd7-3","slot":1}],"ex":"r<b>ea</b>dy → steady","bankHtml":["employ<b>ee</b>","r<b>e</b>latives","st<b>ea</b>dy","t<b>e</b>dious","t<b>e</b>rrible","t<b>ur</b>nover"],"opts":["employee","relatives","steady","tedious","terrible","turnover"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["com","pe","ti","tive"],"a":1,"word":"competitive"},{"t":"stress","w":["in","tro","vert"],"a":0,"word":"introvert"},{"t":"stress","w":["re","bel","lious"],"a":1,"word":"rebellious"},{"t":"stress","w":["a","sser","tive"],"a":1,"word":"assertive"},{"t":"stress","w":["sen","si","tive"],"a":0,"word":"sensitive"}],"ex":"time|ta|ble"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Creating Your Own Job Satisfaction","paras":[["","A lot of people think that job satisfaction is only for other people. They look with envy on people who love their jobs and who don’t think of them as work. The idea of earning a living from something you really like doing only applies to a few very lucky people, they think. But this isn’t so. It’s not only people in the so-called ‘glamour professions’, for example, who can get genuine job satisfaction. You don’t have to be in the arts or a sports person to get enjoyment from what you do for a living. Even if you’re in a boring job, it’s quite possible to get some satisfaction from it."],["","The key to this is your attitude. You may think it’s unlikely that you can derive much satisfaction from a dull job that doesn’t require much thought and that involves a lot of routine procedures. But if you approach it with the right attitude, and put some effort in, you may be surprised at how enjoyable you can make it. Of course, if you just sit there telling yourself how boring your job is, you’ll never get anything out of it. But if you set out to find ways of making it enjoyable, there’s a good chance you’ll manage to."],["","One thing you can do is to set yourself challenges. Think about what you can do for yourself to make your work a little bit more interesting. If you’ve got a repetitive job, set yourself some targets to meet and try to beat your previous records. Or use your initiative in other ways. Think about ways you could develop your career into more interesting areas – see how you could improve your skills by doing a course, for example, or look into new skills you could get that would stand you in good stead for the future. For some people, it’s not boredom that’s the problem, it’s the fact that their jobs involve a significant amount of unpleasantness. But if you keep telling yourself your job is horrible and there’s nothing you can do about it, you’ll get stuck in a rut and you’ll never get out of it. Focus on developing a positive attitude and try to keep any negative thoughts about your job out of your mind. Keep a sense of perspective – if something’s gone wrong on a particular day, decide whether it really matters or not. If it isn’t actually all that important, don’t dwell on it – let it go. Learn from it, and take an upbeat view of what’s happened – you’ll know how to avoid the problem in the future, or what to do about it if it happens again."],["","Of course, you may reach the point where you feel totally trapped in a job. If this mindset starts to overwhelm you, check out the options you may have in the place where you work. Map out a plan for improving your situation there. Are there other roles in the organization you could apply for?"],["","Could you ask to be given different tasks? Could you get a different kind of assignment or go to another department where your skills are required? Finding out there are other options will give you a sense of control over your own working life. Even if you have no job satisfaction right now, you’ll feel better if you know that there is a realistic prospect of work that gives you a degree of it."],["","Expectations are another key ingredient in job satisfaction. Take a long hard look at what you really are capable of. Sometimes it’s important to accept that you couldn’t really do the much more interesting or high-powered job you aspire to. Try to be aware of your own strengths and weaknesses. Focus on the things you really are good at, rather than on things that, if you’re really honest with yourself, you couldn’t actually do. Make the most of your situation and feel good about what you can do, rather than feeling bad about what you can’t do."],["","Work is a very important part of most people’s lives and it’s important to get at least some satisfaction from it. If you really dislike your time at work, the rest of your life is affected too, and you can easily get a negative outlook on life in general. It’s in your own hands to avoid this. Even if you can’t get the job of your dreams, you can take steps to create your own job satisfaction."]]},"parts":[{"items":[{"t":"mc","q":"The writer’s aim in the first paragraph is to ___.","o":["distinguish between different kinds of work","correct a false belief","define the term ‘job satisfaction’"],"a":1},{"t":"mc","q":"In the second paragraph, the writer ___.","o":["warns readers against a certain attitude","advises readers not to have unrealistic ideas about work","suggests to readers that most jobs are dull"],"a":0},{"t":"mc","q":"In the third paragraph, the writer emphasizes ___.","o":["how easy it can be to progress in a career","a particular route to job satisfaction","the need for people to motivate themselves"],"a":2},{"t":"mc","q":"The writer uses the phrase ‘stuck in a rut’ to refer to ___.","o":["a situation that won’t improve","the bad behaviour of others","the danger of being too sensitive"],"a":0},{"t":"mc","q":"What is the writer’s advice if something goes wrong?","o":["Pretend that it didn’t happen.","Use the experience to your advantage.","Don’t think about it until later."],"a":1},{"t":"mc","q":"The writer says that people who feel ‘trapped’ in a job should consider ___.","o":["discussing their unhappiness with managers","moving to a different company or organization","changing the kind of work they do"],"a":2},{"t":"mc","q":"The writer says that you will feel better about your working life if you ___.","o":["think that some job satisfaction is possible in the future","choose a particular career option for the future","stop aiming for job satisfaction for a while"],"a":0},{"t":"mc","q":"What does the writer say about expectations of work?","o":["Too many people have unrealistic ones.","They should be based on real ability.","They may change as time passes."],"a":1},{"t":"mc","q":"In the final paragraph, the writer says that ___.","o":["lack of job satisfaction has serious consequences for people","a negative attitude to life leads to a negative attitude to work","there is more to life than job satisfaction"],"a":0},{"t":"mc","q":"Which of the following best sums up the writer’s view in the text as a whole?","o":["Some people find it easier to get job satisfaction than others.","Everyone can get a certain amount of job satisfaction.","Job satisfaction is the most important issue in the workplace today."],"a":1}]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>You have decided to apply for the position advertised below. Write approximately 250 words in a covering letter or email.</p>","<p><b>Is this for you?</b></p>","<p>We are looking for responsible, experienced people (individuals or couples) of any age to ‘work’ as house-sitters in different European countries for varying lengths of time. All you need to do is take care of someone’s house, pets, and garden whilst they are away on business or on holiday. You won’t earn any money, but your accommodation is free. The minimum length of stay is one week so you can move from place to place. Interested? Send an email or letter and CV to Bruce Matthews at housesit@talknet.com or post it to…</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about the disadvantages of various jobs. Match the speakers (1–5) to the disadvantages of the job that they mention (A–H).","legend":["the possibility of making a serious mistake","having to be dishonest","bad treatment from employers","having to work at inconvenient times","having to work in unpleasant physical conditions","the need to cooperate with colleagues","other people’s low opinion of the job","lack of job security"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"B"},{"t":"match","q":"Speaker 2","a":"G"},{"t":"match","q":"Speaker 3","a":"H"},{"t":"match","q":"Speaker 4","a":"D"},{"t":"match","q":"Speaker 5","a":"C"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I sell cars, and on the whole I enjoy it. The money's decent and I like meeting people. What I really struggle with, though, is that the job sometimes means bending the truth. My manager expects me to tell customers that a price is the lowest we can go when it isn't, or that someone else is interested in a car when nobody is. I'm not comfortable with that, and it's the part of the job I'd happily lose."],["Narrator","Speaker two."],["Speaker 2","I'm a traffic warden. The hours are fine and I work with a good bunch of people. The hard part is how people see you. Nobody ever says, 'Thanks for keeping the roads clear.' They treat you as if you're the lowest of the low, as if the job itself is something to be ashamed of. Friends at parties go quiet when I tell them what I do. That wears you down after a while."],["Narrator","Speaker three."],["Speaker 3","I work in television production, which sounds glamorous, and the work itself is great fun. But nobody in this industry has a permanent post. You're hired for one series, and when it ends you've got no idea whether there'll be anything next month. I've been doing it for eight years and I still can't plan more than a few weeks ahead. Getting a mortgage is almost impossible."],["Narrator","Speaker four."],["Speaker 4","I'm a baker, and I love making bread. The physical side doesn't bother me and the bakery's warm and cosy. What does get to me is the hours. I start at three in the morning, so I'm in bed by eight at night while all my friends are going out. At weekends it's even worse, because that's when we're busiest. My social life has more or less disappeared."],["Narrator","Speaker five."],["Speaker 5","I'm a junior lawyer at a big firm. The work's interesting and colleagues are supportive, which helps. The real problem is the partners at the top. They think nothing of shouting at you in front of clients, they take credit for your work and they expect you to cancel your holidays at a moment's notice. In my opinion, the way the firm treats its junior staff is simply unacceptable."]]}},{"instr":"Listen to two friends discussing an article about personality types. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"The two speakers agree that ___.","o":["the man does not react well to pressure","other people like the man’s attitude and behaviour","the man should not consider himself a ‘go-getter’"],"a":2},{"t":"mc","q":"The man doesn’t agree that he ___.","o":["is good at organizing other people","makes too little effort","annoys other people"],"a":1},{"t":"mc","q":"What do the two speakers agree on the subject of discussions?","o":["The man often changes his view during them.","The man always wants to make other people agree with him.","The man likes it when people disagree with him."],"a":2},{"t":"mc","q":"The woman agrees that she ___.","o":["is regarded as unreliable by many people","has a relaxed attitude to life","frequently changes her plans"],"a":1},{"t":"mc","q":"The man says that one characteristic of ‘performers’ is that they ___.","o":["think too much about criticism","expect too much of other people","are too loyal to other people"],"a":0}],"audio":{"script":[["Woman","Have you seen this article about personality types? It says almost everyone falls into one of four groups. Let's see where you fit."],["Man","Go on, then. I bet I'm a 'go-getter'. That's the ambitious one, isn't it? Always aiming for the top."],["Woman","Hmm. It says go-getters want to be the boss and run their own company one day. Last week you told me you'd hate to run a business."],["Man","Did I? Well, yes, that's true. I'd hate all that responsibility. So I suppose I'm not really a go-getter, am I?"],["Woman","No, I don't think that's you. What about the 'organizer'? It says organizers like taking charge of a group and telling everyone what to do."],["Man","Well, I am quite good at that, to be honest. I organized the whole office trip last year."],["Woman","You did. Although the article also says organizers can be lazy about their own work and expect others to do it."],["Man","No, that's not me at all. I'd say I work harder than anyone in that office. I never leave anything half done."],["Woman","OK, I'll give you that. Now this bit, about discussions. It says some people enjoy an argument and actually prefer it when others don't share their opinion."],["Man","That's definitely true. A conversation where everyone agrees is boring. I like it when someone challenges me."],["Woman","I know! You're the only person I know who's pleased when someone contradicts them. And you hardly ever change your mind, even when you're losing."],["Man","Right, your turn. What are you?"],["Woman","Probably what they call a 'free spirit'. It says free spirits are easy-going and don't worry much about what might happen."],["Man","That's you exactly. You never get stressed about anything."],["Woman","True, I'm pretty laid-back. But it also says free spirits are unreliable and are always changing their plans. I don't think that's fair. When I say I'll do something, I do it."],["Man","Mostly. And what's the last type?"],["Woman","The 'performer'. They love being the centre of attention."],["Man","The thing about performers is that they're very sensitive. If someone says one negative thing about them, they keep going over it for days. My sister's like that. She can't let a single bad comment go."],["Woman","So, an organizer who loves an argument. That sounds about right!"]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["What is your main ambition?","Which three adjectives describe personalities that you particularly dislike?","Which personal characteristics have you inherited from your parents?","What do you think would be a motivating career for you?","What job would you never do in your life even if they paid you well?"],"talk":["‘Most people are unhappy in their jobs.’","‘It is not possible for people to be nice to each other all the time.’","‘Extrovert people are very difficult to work with in a team.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft02a","kind":"file","group":"ft02","ver":"A","title":"File 2 Test A","focus":"2A Childhood memories, 2B Language: pronouns, the past (habitual events and specific incidents), abstract nouns.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Complete the sentences with the correct word(s).","items":[{"t":"mc","q":"___ can use the internet for research when you write your term paper.","o":["One","You","Each other"],"a":1},{"t":"mc","q":"___ say it’s harder to learn languages after you’re 12.","o":["They","They’re","Their"],"a":0},{"t":"mc","q":"___ need to remember that we’re very lucky to have good food on the table for each meal.","o":["One","Ourselves","We"],"a":2},{"t":"mc","q":"Alex talks to ___ when he’s writing. It’s pretty annoying!","o":["myself","each other","himself"],"a":2},{"t":"mc","q":"Bruce and I built the shed in the garden ___.","o":["ourselves","by one another","by myself"],"a":0},{"t":"mc","q":"Do you and your parents talk to ___ every weekend?","o":["yourselves","each other","another"],"a":1},{"t":"mc","q":"___ was a pleasure to meet your fiancée at the party last night.","o":["There","It","One"],"a":1},{"t":"mc","q":"The meeting didn’t go too well; the managers kept interrupting ___.","o":["themselves","oneself","one another"],"a":2}],"ex":"You need to take care of yourself when you’re ill. one  yourself  you"},{"instr":"Complete the sentences with the correct form of the verb in brackets.","items":[{"t":"gap","q":"While my dad {} (drive) home from work, a cat ran in front of his car.","a":[["was driving"]]},{"t":"gap","q":"I {} (work) in the café for four months when I finally received my salary.","a":[["'d been working","had been working"]]},{"t":"gap","q":"I was having dinner when I {} (decide) to call Ellen.","a":[["decided"]]},{"t":"gap","q":"The weather {} (expect) to be stormy next weekend.","a":[["is expected"]]},{"t":"gap","q":"It {} (say) that taking a nap after lunch is very healthy.","a":[["is said"]]},{"t":"gap","q":"There is thought {} (be) undiscovered oil beneath the Antarctic.","a":[["to be"]]}],"ex":"I’d like to tell you about something that happened (happen) when I was 12."},{"instr":"Underline the correct word(s).","items":[{"t":"pick","q":"We [used|would] to make ice cream every summer.","a":"used"},{"t":"pick","q":"When I was at school, my friends and I were always [gone|going] for long bike rides in the afternoon.","a":"going"},{"t":"pick","q":"My dad would never [complain|to complain] even when we made a lot of noise.","a":"complain"},{"t":"pick","q":"When I was small, my cousins and I [would|used] to run around the neighbourhood.","a":"used"},{"t":"pick","q":"I [was always getting|always used get] into trouble for bothering my brother.","a":"was always getting"},{"t":"pick","q":"His grandparents used [to give|giving] him presents when he was little.","a":"to give"}],"ex":"It’s been announced / announced that our pay will increase next year."}]},{"k":"v","name":"Vocabulary","max":20,"w":1,"parts":[{"instr":"Complete the words in the sentences.","items":[{"t":"gap","q":"These days there’s no longer a <b>s</b>{} attached to having mental health problems.","a":[["stigma"]],"pre":["s"]},{"t":"gap","q":"When it comes to hotels, the Ritz is the <b>u</b>{} in luxury as far as I’m concerned.","a":[["ultimate"]],"pre":["u"]},{"t":"gap","q":"We were completely <b>b</b>{} by his account of events. It just didn’t make any sense whatsoever.","a":[["bewildered"]],"pre":["b"]},{"t":"gap","q":"I’ll choose a <b>r</b>{} letter of the alphabet and I want you to give me five nouns that start with that letter.","a":[["random"]],"pre":["r"]},{"t":"gap","q":"The teacher returned the students’ work and asked them to correct any <b>e</b>{} before re-submitting it.","a":[["errors"]],"pre":["e"]},{"t":"gap","q":"My boyfriend’s parents gave me a gorgeous tablet computer for my birthday. I was amazed at their <b>g</b>{}!","a":[["generosity"]],"pre":["g"]}],"ex":"They tackled the DIY with such <b>g</b>usto that I had high hopes for the end result."},{"instr":"Complete the sentences with one word.","items":[{"t":"gap","q":"Contrary to popular {}, multilingual children are not always good at learning languages.","a":[["belief"]]},{"t":"gap","q":"After finishing university, he took a job in a recording studio instead of working as a doctor, which was a huge {} for his parents.","a":[["disappointment"]]},{"t":"gap","q":"People who come up with conspiracy theories about the government have very vivid {}, but no facts to back their stories up.","a":[["imaginations"]]},{"t":"gap","q":"Leo has closed three new deals in the last month so there’s a strong {} that he’ll get a big bonus at the end of the year.","a":[["possibility"]]},{"t":"gap","q":"To her complete {}, she got an invitation from the Prime Minister’s office for a charity dinner.","a":[["amazement"]]},{"t":"gap","q":"I think Mark and Jenny are in a serious {}; I saw a shiny new ring on Jenny’s ring finger.","a":[["relationship"]]}],"ex":"The death of Arthur Miller was a terrible loss to the theatre world."},{"instr":"Make abstract nouns from the words below.","items":[{"t":"gap","q":"adult  {}","a":[["adulthood"]]},{"t":"gap","q":"imagine  {}","a":[["imagination"]]},{"t":"gap","q":"lose  {}","a":[["loss"]]},{"t":"gap","q":"neighbour {}","a":[["neighbourhood"]]},{"t":"gap","q":"bored  {}","a":[["boredom"]]},{"t":"gap","q":"frustrate  {}","a":[["frustration"]]},{"t":"gap","q":"wise  {}","a":[["wisdom"]]},{"t":"gap","q":"hate  {}","a":[["hatred"]]}],"ex":"friend  friendship"}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"<b>aw</b>ful","a":"drawback","grp":null,"slot":0},{"t":"match","q":"<b>j</b>ealous <span class=\"hint\">(1 of 2)</span>","a":["enjoy","gorgeous"],"grp":"snd7-2","slot":0},{"t":"match","q":"<b>j</b>ealous <span class=\"hint\">(2 of 2)</span>","a":["enjoy","gorgeous"],"grp":"snd7-2","slot":1},{"t":"match","q":"<b>h</b>urt","a":"adhere","grp":null,"slot":0},{"t":"match","q":"c<b>or</b>ner","a":"ignore","grp":null,"slot":0}],"ex":"<b>wh</b>enever → where","bankHtml":["ad<b>h</b>ere","dr<b>aw</b>back","en<b>j</b>oy","gor<b>g</b>eous","ign<b>ore</b>","<b>wh</b>ere"],"opts":["adhere","drawback","enjoy","gorgeous","ignore","where"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["part","ner","ship"],"a":0,"word":"partnership"},{"t":"stress","w":["a","fraid"],"a":1,"word":"afraid"},{"t":"stress","w":["a","shamed"],"a":1,"word":"ashamed"},{"t":"stress","w":["com","pe","ti","tion"],"a":2,"word":"competition"},{"t":"stress","w":["con","se","quent","ly"],"a":0,"word":"consequently"}],"ex":"cheer|ful"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article about endangered languages and choose A, B, C, or D.","passage":{"title":"Global experts discuss threatened languages Some of the world’s most endangered languages are the focus of an international conference being held in Wales for the first time. A Dr Hywel Lewis","paras":[["","Many languages are on the verge of extinction. Their fate can be compared to that of many animals facing extinction, but they probably receive less global attention than the fate of many animals. As a foundation, we are very concerned with highlighting the part language plays in cultural variety and diversification. It’s also important to consider the economic repercussions of promoting different languages; they can play a massive part in the identity and profile of various parts of the globe and they can be powerful economic factors. But it’s not all doom and gloom as there are languages in Russia which are making a comeback after years of oppression."],["B","Conchur O’Giollagain Many threatened languages find themselves in a complex situation. Gaeilge, the Irish language, spoken in the Irish-speaking region of Ireland (the Gaeltacht) provides a good example of this. It is spoken by just under half the population of the Gaeltacht. The number of people learning the language is growing and great progress is also being made in terms of educational provision. But the number of learners does not necessarily help the number of native speakers; for a language to succeed you have to have a high population of active language speakers concentrated in a given geographical area. Based on existing trends, there is a strong threat to the communal use of Irish and, if these trends continue, Irish will not exist as a language in 20 years’ time."],["C","Nicholas Ostler Different languages have their quirks which tell us something about being human, and when languages are lost, most of the knowledge that went with them gets lost. People do care about identity as they want to be different. Nowadays, we want access to everything but we don’t want to be thought of as no more than people on the other side of the world. Apart from English, the United Kingdom has a number of other languages; half a million people speak Welsh, several thousand Scots are fluent in Gaelic, the Scottish language, about 400 people speak Cornish while the number of Manx speakers – the language of the Isle of Man – is perhaps as small as 100. And I do think it’s a"],["","good thing for a child on the Isle of Man to learn Manx."],["","I value continuity in a community."],["D","Kenan Malik It is irrational to try to preserve all the world’s languages. Earlier this year, the Bo language died out when an 85-year-old member of the Bo tribe in the India-owned Andaman Islands died. While it may seem sad that the language expired, cultural change is driving the process. In one sense you could call it a cultural loss. But that makes no sense because cultural forms are lost all the time. To say every cultural form should exist forever is ridiculous, and when governments try to prop languages up it shows a desire to cling to the past rather than move forwards. To have a public policy that a certain culture or language should be preserved shows a fundamental misunderstanding. I don’t see why it’s in the public good to preserve Manx or Cornish or any other language for that matter. In the end, whether or not a language is viable is very simple; if a language is one that people don’t participate in, it’s not a language anymore."]]},"parts":[{"instr":"Which expert holds the view that:","items":[{"t":"match","q":"for the teaching of one particular language, improvements have been made in terms of the curriculum.","a":"B"},{"t":"match","q":"the revival of languages in a particular geographical area is a positive thing.","a":"A"},{"t":"match","q":"support for endangered languages impedes forward thinking.","a":"D"},{"t":"match","q":"the distinctiveness of languages holds some revelations about civilization.","a":"C"},{"t":"match","q":"the protection of the globe’s endangered languages, in general, is unfeasible.","a":"D"},{"t":"match","q":"the plight of some endangered languages is less than straightforward.","a":"B"},{"t":"match","q":"there are merits to having linguistic stability in society.","a":"C"},{"t":"match","q":"one endangered language may become extinct within two decades.","a":"B"},{"t":"match","q":"the plight of some endangered languages can be likened to the loss of certain species.","a":"A"},{"t":"match","q":"there is a particular reason for the death of one particular language.","a":"D"}],"opts":["A","B","C","D"]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Write an article of approximately 250 words for the opinion section of a newspaper on why people should learn a second language.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about childhood memories. Match the speakers (1–5) to what they remember (A–H).","legend":["a critical comment made by someone else","being punished for something","wanting to keep a feeling under control","forcing someone else to do something","feeling in danger","finding something boring","defending your views","planning something for someone else"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"G"},{"t":"match","q":"Speaker 2","a":"A"},{"t":"match","q":"Speaker 3","a":"C"},{"t":"match","q":"Speaker 4","a":"E"},{"t":"match","q":"Speaker 5","a":"H"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","When I was about ten, our class had a debate about whether zoos should exist. Everyone else said zoos were cruel, and I was the only one who thought they did important work. The other kids laughed, but I stood up and argued my case for twenty minutes. The teacher said I'd done brilliantly, even though nobody agreed with me. I still remember feeling proud that I hadn't backed down."],["Narrator","Speaker two."],["Speaker 2","I loved drawing as a child, and I once spent a whole weekend on a picture of our house. I showed it to my uncle, expecting him to be impressed, and he just said, 'The windows are all wrong.' That was all. It's silly, but it really stayed with me. I didn't draw anything for months afterwards, and I can still hear him saying it."],["Narrator","Speaker three."],["Speaker 3","At my grandfather's funeral I was about eight. I was desperately sad, but I'd decided that I wasn't going to cry in front of all those people. I kept staring at my shoes and biting my lip, trying so hard to hold it all in. My mum squeezed my hand the whole time. I managed it until we got home, and then I cried for hours."],["Narrator","Speaker four."],["Speaker 4","We were on holiday by the sea and I'd swum out further than I should have. Suddenly I realized the current was pulling me away from the beach and I couldn't get back. I remember the water closing over my head and thinking, 'This is it.' A man on a surfboard saw me and pulled me out. I've been a careful swimmer ever since."],["Narrator","Speaker five."],["Speaker 5","When I was eleven, I decided to organize a surprise party for my mum's fortieth birthday. For weeks I secretly phoned her friends, saved my pocket money for decorations and arranged with my dad to get her out of the house. When she walked in and everyone shouted 'Surprise!', her face was worth all the effort. It's one of my happiest memories."]]}},{"instr":"Listen to two friends talking about learning languages. Then tick (✓) A, B, or C.","items":[{"t":"mc","q":"Anthony says that a lot of people using English …","o":["lack confidence in their ability to use the language.","are not aware of errors they make.","speak a form of it that is not standard."],"a":2},{"t":"mc","q":"Anthony says that communication problems in English …","o":["are more important in some circumstances than in others.","are being discussed by a small number of experts.","result from a lack of effort when using the language."],"a":0},{"t":"mc","q":"Anthony says that little attention is paid to problems with using English because …","o":["people usually do not notice these problems.","people prefer to focus only on the positive aspects.","these problems affect only a small number of people."],"a":1},{"t":"mc","q":"Anthony says that people’s level of English …","o":["often depends on what level they are required to reach.","is often lower than they think it is.","depends mostly on how well they are taught."],"a":0},{"t":"mc","q":"Anthony says that misunderstandings caused by inaccurate English …","o":["are getting more and more serious.","are a problem that cannot be avoided.","are not the same for native speakers as for foreign speakers."],"a":1}],"audio":{"script":[["Woman","Anthony, you've been working on English as a global language. What have you found?"],["Anthony","Well, the first thing is that the vast majority of people using English today aren't native speakers. And a lot of them speak a variety that's quite different from any standard form. They've developed their own grammar and vocabulary, which works for them but isn't what you'd find in a textbook."],["Woman","Does that cause problems?"],["Anthony","Sometimes, but it depends on the situation. If two engineers are chatting over coffee, small misunderstandings don't matter. If they're writing a safety manual or negotiating a contract, the same misunderstandings can be very serious. So the importance of the problem really varies with the context."],["Woman","Why don't we hear more about it?"],["Anthony","Partly because everyone likes the success story. English connects people all over the world, business is done in English, and that's what gets talked about. People would rather celebrate that than look at the difficulties. It's not that the problems are rare. People simply prefer to concentrate on the good news."],["Woman","What about the standard people reach? Is it generally low?"],["Anthony","Not necessarily. What I've noticed is that people tend to reach the level that's demanded of them. If their job only requires basic emails, that's where they stop. If they're expected to give presentations, they get to that level. Teaching matters, of course, but the requirement seems to be the main driver."],["Woman","And the misunderstandings themselves. Are they getting worse?"],["Anthony","I wouldn't say that. My view is that when millions of people are using a language in so many different ways, some misunderstandings are inevitable. You can reduce them, but you'll never get rid of them completely. And by the way, native speakers cause just as many. They often speak too fast and use idioms nobody else understands."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["What’s your favourite memory of your childhood?","What can you remember about the teachers you had when you were a child?","Why is it important to let children enjoy being children?","Why do you think Americans often don’t learn new languages?","Why is it important for you to be good at English?"],"talk":["‘Children today have too much freedom.’","‘I remember many stories from my childhood.’","‘The English language will not be as important in the future as it is now.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft02b","kind":"file","group":"ft02","ver":"B","title":"File 2 Test B","focus":"2A Childhood memories, 2B Language: pronouns, the past (habi els, the Ritz is the <b>u</b>{} in luxury as far as I’m concerned.","a":[["ultimate"]],"pre":["u"]},{"t":"gap","q":"My boyfriend’s parents gave me a gorgeous tablet computer for my birthday. I was amazed at their <b>g</b>{}!","a":[["generosity"]],"pre":["g"]},{"t":"gap","q":"We were completely <b>b</b>{} by his account of events. It just didn’t make any sense whatsoever.","a":[["bewildered"]],"pre":["b"]},{"t":"gap","q":"These days there’s no longer a <b>s</b>{} attached to having mental health problems.","a":[["stigma"]],"pre":["s"]},{"t":"gap","q":"I’ll choose a <b>r</b>{} letter of the alphabet and I want you to give me five nouns that start with that letter.","a":[["random"]],"pre":["r"]},{"t":"gap","q":"The teacher returned the students’ work and asked them to correct any <b>e</b>{} before re-submitting it.","a":[["errors"]],"pre":["e"]}],"ex":"They tackled the DIY with such <b>g</b>usto that I had high hopes for the end result."},{"instr":"Make abstract nouns from the words below.","items":[{"t":"gap","q":"wise  {}","a":[["wisdom"]]},{"t":"gap","q":"imagine  {}","a":[["imagination"]]},{"t":"gap","q":"bored  {}","a":[["boredom"]]},{"t":"gap","q":"hate  {}","a":[["hatred"]]},{"t":"gap","q":"neighbour {}","a":[["neighbourhood"]]},{"t":"gap","q":"frustrate  {}","a":[["frustration"]]},{"t":"gap","q":"adult  {}","a":[["adulthood"]]},{"t":"gap","q":"lose  {}","a":[["loss"]]}],"ex":"friend  friendship"}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"<b>h</b>urt","a":"adhere","grp":null,"slot":0},{"t":"match","q":"<b>j</b>ealous <span class=\"hint\">(1 of 2)</span>","a":["gorgeous","enjoy"],"grp":"snd7-2","slot":0},{"t":"match","q":"<b>j</b>ealous <span class=\"hint\">(2 of 2)</span>","a":["gorgeous","enjoy"],"grp":"snd7-2","slot":1},{"t":"match","q":"<b>aw</b>ful","a":"drawback","grp":null,"slot":0},{"t":"match","q":"c<b>or</b>ner","a":"ignore","grp":null,"slot":0}],"ex":"<b>wh</b>enever → where","bankHtml":["<b>wh</b>ere","gor<b>g</b>eous","ign<b>ore</b>","ad<b>h</b>ere","dr<b>aw</b>back","en<b>j</b>oy"],"opts":["where","gorgeous","ignore","adhere","drawback","enjoy"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["a","shamed"],"a":1,"word":"ashamed"},{"t":"stress","w":["a","fraid"],"a":1,"word":"afraid"},{"t":"stress","w":["part","ner","ship"],"a":0,"word":"partnership"},{"t":"stress","w":["con","se","quent","ly"],"a":0,"word":"consequently"},{"t":"stress","w":["com","pe","ti","tion"],"a":2,"word":"competition"}],"ex":"cheer|ful"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article about endangered languages and choose A, B, C, or D.","passage":{"title":"Global experts discuss threatened languages Some of the world’s most endangered languages are the focus of an international conference being held in Wales for the first time. A Dr Hywel Lewis","paras":[["","Many languages are on the verge of extinction. Their fate can be compared to that of many animals facing extinction, but they probably receive less global attention than the fate of many animals. As a foundation, we are very concerned with highlighting the part language plays in cultural variety and diversification. It’s also important to consider the economic repercussions of promoting different languages; they can play a massive part in the identity and profile of various parts of the globe and they can be powerful economic factors. But it’s not all doom and gloom as there are languages in Russia which are making a comeback after years of oppression."],["B","Conchur O’Giollagain Many threatened languages find themselves in a complex situation. Gaeilge, the Irish language, spoken in the Irish-speaking region of Ireland (the Gaeltacht) provides a good example of this. It is spoken by just under half the population of the Gaeltacht. The number of people learning the language is growing and great progress is also being made in terms of educational provision. But the number of learners does not necessarily help the number of native speakers; for a language to succeed you have to have a high population of active language speakers concentrated in a given geographical area. Based on existing trends, there is a strong threat to the communal use of Irish and, if these trends continue, Irish will not exist as a language in 20 years’ time."],["C","Nicholas Ostler Different languages have their quirks which tell us something about being human, and when languages are lost, most of the knowledge that went with them gets lost. People do care about identity as they want to be different. Nowadays, we want access to everything but we don’t want to be thought of as no more than people on the other side of the world. Apart from English, the United Kingdom has a number of other languages; half a million people speak Welsh, several thousand Scots are fluent in Gaelic, the Scottish language, about 400 people speak Cornish while the number of Manx speakers – the language of the Isle of Man – is perhaps as small as 100. And I do think it’s a"],["","good thing for a child on the Isle of Man to learn Manx."],["","I value continuity in a community."],["D","Kenan Malik It is irrational to try to preserve all the world’s languages. Earlier this year, the Bo language died out when an 85-year-old member of the Bo tribe in the India-owned Andaman Islands died. While it may seem sad that the language expired, cultural change is driving the process. In one sense you could call it a cultural loss. But that makes no sense because cultural forms are lost all the time. To say every cultural form should exist forever is ridiculous, and when governments try to prop languages up it shows a desire to cling to the past rather than move forwards. To have a public policy that a certain culture or language should be preserved shows a fundamental misunderstanding. I don’t see why it’s in the public good to preserve Manx or Cornish or any other language for that matter. In the end, whether or not a language is viable is very simple; if a language is one that people don’t participate in, it’s not a language anymore."]]},"parts":[{"instr":"Which expert holds the view that:","items":[{"t":"match","q":"for the teaching of one particular language, improvements have been made in terms of the curriculum.","a":"B"},{"t":"match","q":"the revival of languages in a particular geographical area is a positive thing.","a":"A"},{"t":"match","q":"support for endangered languages impedes forward thinking.","a":"D"},{"t":"match","q":"the distinctiveness of languages holds some revelations about civilization.","a":"C"},{"t":"match","q":"the protection of the globe’s endangered languages, in general, is unfeasible.","a":"D"},{"t":"match","q":"the plight of some endangered languages is less than straightforward.","a":"B"},{"t":"match","q":"there are merits to having linguistic stability in society.","a":"C"},{"t":"match","q":"one endangered language may become extinct within two decades.","a":"B"},{"t":"match","q":"the plight of some endangered languages can be likened to the loss of certain species.","a":"A"},{"t":"match","q":"there is a particular reason for the death of one particular language.","a":"D"}],"opts":["A","B","C","D"]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Write an article of approximately 250 words for the opinion section of a newspaper on why people should learn a second language.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about childhood memories. Match the speakers (1–5) to what they remember (A–H).","legend":["finding something boring","forcing someone else to do something","defending your views","a critical comment made by someone else","wanting to keep a feeling under control","planning something for someone else","feeling in danger","being punished for something"],"opts":["A"," eers are chatting over coffee, small misunderstandings don't matter. If they're writing a safety manual or negotiating a contract, the same misunderstandings can be very serious. So the importance of the problem really varies with the context."],["Woman","Why don't we hear more about it?"],["Anthony","Partly because everyone likes the success story. English connects people all over the world, business is done in English, and that's what gets talked about. People would rather celebrate that than look at the difficulties. It's not that the problems are rare. People simply prefer to concentrate on the good news."],["Woman","What about the standard people reach? Is it generally low?"],["Anthony","Not necessarily. What I've noticed is that people tend to reach the level that's demanded of them. If their job only requires basic emails, that's where they stop. If they're expected to give presentations, they get to that level. Teaching matters, of course, but the requirement seems to be the main driver."],["Woman","And the misunderstandings themselves. Are they getting worse?"],["Anthony","I wouldn't say that. My view is that when millions of people are using a language in so many different ways, some misunderstandings are inevitable. You can reduce them, but you'll never get rid of them completely. And by the way, native speakers cause just as many. They often speak too fast and use idioms nobody else understands."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["What games did you like playing when you were a child?","What did you dislike doing when you were a child?","What was your favourite thing about school when you were a child?","What is the most difficult aspect of the English language for you?","Why is English such an important language in the world today?"],"talk":["‘Childhood is the most important part of everyone’s life.’","‘Americans shouldn’t have to learn foreign languages.’","‘It is not necessary for everyone to learn a f","in","with"],"a":0},{"t":"mc","q":"The king was very proud ___ his soldiers for winning the battle.","o":["with","of","for"],"a":1}],"ex":"In the past, warriors used bows to shoot arrows at the enemy. bullets  bows  shields"}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"sie<b>ge</b>","a":"joke","grp":null,"slot":0},{"t":"match","q":"l<b>oo</b>t","a":"troops","grp":null,"slot":0},{"t":"match","q":"execu<b>ti</b>on","a":"short","grp":null,"slot":0},{"t":"match","q":"<b>v</b>ictorious <span class=\"hint\">(1 of 2)</span>","a":["civil","nerves"],"grp":"snd7-4","slot":0},{"t":"match","q":"<b>v</b>ictorious <span class=\"hint\">(2 of 2)</span>","a":["civil","nerves"],"grp":"snd7-4","slot":1}],"ex":"resear<b>ch</b> → capture","bankHtml":["cap<b>t</b>ure","ci<b>v</b>il","<b>j</b>oke","ner<b>v</b>es","<b>sh</b>ort","tr<b>oo</b>ps"],"opts":["capture","civil","joke","nerves","short","troops"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["his","tor","i","an"],"a":1,"word":"historian"},{"t":"stress","w":["sur","vi","ving"],"a":1,"word":"surviving"},{"t":"stress","w":["ci","vi","lized"],"a":0,"word":"civilized"},{"t":"stress","w":["re","bel","li","on"],"a":1,"word":"rebellion"},{"t":"stress","w":["vic","tor","i","ous"],"a":1,"word":"victorious"}],"ex":"cas|ual|ties"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article about the uses of history and choose A, B, C, or D.","passage":{"title":"The uses of history","paras":[["","The popular interest in history reflects a desire to know more about ourselves. This is all well and good, but does history possess sufficient value to warrant an extensive formal programme of history instruction in schools? Four experts give their views."],["A","A historian is interested in the past because he is interested in life. The true historian’s interest in the past answers a deeply felt need to assure the continuity of human life and discover its meaning, even if the goal is never fully realized. However, the most commonly cited practical reason for studying history is that it improves judgment. It offers the opportunity to avail ourselves of the experiences of other times and other nations; it qualifies them as judges of the actions and designs of men. History doesn’t tell us the answers to our questions, but it helps to inform us so that we might make better decisions in the future. And this has never been as important as it is nowadays in this era of the World Wide Web and globalism, when knowledge of the larger world is not only desirable, but increasingly important."],["B","The use of historical examples is ancient and no doubt predates written language. We can imagine cave dwellers sitting around the evening campfire sharing anecdotes of admired ancestors worthy of emulation. People need models, and historical examples are especially powerful models because they actually existed. Joan of Arc demonstrates the power of individual belief and action. Galileo symbolizes the fight against authority for freedom of thought, while Thomas Becket represents integrity in the face of deadly intimidation. As we know, humans are pattern makers. While many philosophers of history have believed that history is revealed only through its unique events, others have been unable to resist the urge to ascribe pattern to history. One view put forward is that historical cultures, like plants and animals, follow the cycle of growth, flowering and decline. Certainly, history shows us that individuals and empires may rise, but eventually they will fall."],["C","Some of history’s greatest historians have seen human self-awareness as the very essence of history. Arnold Toynbee said, ‘History is a search for light on the nature and destiny of man.’ The value of history, then, is that it teaches"],["","us what man has done and thus what man is. Psychologist Bruno Bettelheim asserted that human self-knowledge is the most important role of formal instruction and that most of all, our schools ought to teach the true nature of man; teach about his troubles with himself, his inner turmoils and about his difficulties in living with others. They should teach the prevalence and the power of both man’s social and anti-social tendencies, and how the one can domesticate the other, without destroying the individual’s independence or self-love."],["D","The concept of identity is key. Questions of identity are a central concern of psychology, which has found that loss of identity results in loss of significance; without identity there is little meaning and purpose to life. As Beverly Southgate puts it, history – the memories of things past – is of supreme importance in maintaining a sense of identity. In this context, Southgate quotes a character from a Saul Bellow novel who says, ‘Everyone needs his memories. They keep the wolf of insignificance from the door.’ And I think that sums it up rather nicely. Southgate says the need for identity applies to nations as well as to individuals; cultural identity contributes to meaning, purpose and cohesion in society; without it, society would be as rootless and adrift as an individual with amnesia."]]},"parts":[{"instr":"Which expert:","items":[{"t":"match","q":"draws a comparison between history and a process in the natural world.","a":"B"},{"t":"match","q":"explains that the study of history is fundamentally a quest to understand humans.","a":"C"},{"t":"match","q":"gives an example of a person who had strong faith in their own principles.","a":"B"},{"t":"match","q":"explains the popularity of the belief that examining history leads people to come to better conclusions.","a":"A"},{"t":"match","q":"states that communicating an understanding of ourselves is the ultimate aim of education.","a":"C"},{"t":"match","q":"believes the use of an animal metaphor effectively communicates an idea.","a":"D"},{"t":"match","q":"states that humans fundamentally feel lost if we haven’t got a sense of who we really are.","a":"D"},{"t":"match","q":"suggests that the habit of telling each other stories was common even in historic times.","a":"B"},{"t":"match","q":"refers to two contradictory attributes of humans.","a":"C"},{"t":"match","q":"mentions the current significance of adding to our understanding of international events.","a":"A"}],"opts":["A","B","C","D"]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Write an article of approximately 250 words.</p>","<p>Imagine you are a historian in the year 2200. Choose an event that has happened in the last five years, and tell the story of that event as if you are looking back on it from the year 2200.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about various historical films. Match the speakers (1–5) to what they say about the films (A–H).","legend":["It was different from what I had expected before I saw it.","It has a personal connection for me.","Most people remember one particular scene from it.","I liked it so much that I saw it over and over again.","I remained affected by it for some time after I’d seen it.","One particular scene is very emotional and moving.","The acting is the most impressive aspect of it.","I found elements of it unrealistic."],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"E"},{"t":"match","q":"Speaker 2","a":"B"},{"t":"match","q":"Speaker 3","a":"D"},{"t":"match","q":"Speaker 4","a":"H"},{"t":"match","q":"Speaker 5","a":"F"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I saw a film about the Second World War a few years ago, set in a prison camp. I'd expected an ordinary war film, and in a way that's what it was. But it got to me. For days afterwards I kept thinking about the characters and couldn't get some of the images out of my head. It's rare for a film to stay with me that long."],["Narrator","Speaker two."],["Speaker 2","My favourite is a film about the building of the Trans-Siberian railway. It's not a famous film, but my great-grandfather actually worked on that railway, and there are family stories about him that match what happens on screen. When I watch it, I feel I'm seeing a bit of my own family's past."],["Narrator","Speaker three."],["Speaker 3","When I was a teenager I was completely obsessed with a film about the Roman Empire. I must have watched it twenty or thirty times. I knew all the lines and used to act out the battle scenes with my friends. I still put it on now and again, though not quite as often."],["Narrator","Speaker four."],["Speaker 4","Everyone told me it was a masterpiece, and the costumes were gorgeous. But I couldn't take some of it seriously. The hero gets stabbed and is fighting again ten minutes later, and the queen speaks as if she's in a modern office. For me it just wasn't believable."],["Narrator","Speaker five."],["Speaker 5","It's a long film about a family during the Great Depression, and a lot of it is quite slow. But there's a scene near the end where the father has to say goodbye to his daughter at the station, and I can never watch it without crying. The rest of the film is fine, but that moment is what makes it special."]]}},{"instr":"Listen to a talk about how people feel when a relationship breaks up. Complete the sentences using no more than three words.","items":[{"t":"gap","q":"When a relationship breaks up, you have to have different ideas about {}.","a":[["the future"]],"list":true},{"t":"gap","q":"The first stage involves feelings of {}.","a":[["shock and disbelief","disbelief and shock"]],"list":true},{"t":"gap","q":"In the first stage, you ask yourself questions beginning with the words ‘{}’.","a":[["what if"]],"list":true},{"t":"gap","q":"In the second stage, feelings of {} may last for more than a few weeks.","a":[["anger and panic","panic and anger"]],"list":true},{"t":"gap","q":"In the final stage, it is common to experience both {}.","a":[["ups and downs"]],"list":true}],"audio":{"script":[["Speaker","When a relationship comes to an end, it isn't just the present that changes. One of the hardest things is that you have to start thinking differently about the future. The plans you made together are gone, and you have to build new ideas about what lies ahead."],["Speaker","Psychologists usually describe three stages. The first stage involves feelings of shock and disbelief. People often can't accept what has happened, and they may go about their daily lives almost automatically."],["Speaker","In this first stage you also tend to go over and over what happened. You ask yourself questions beginning with the words 'what if'. What if I'd said something different? What if I hadn't taken that job?"],["Speaker","The second stage is often the most painful. Feelings of anger and panic are common, and they may last for more than a few weeks. People can feel furious with their ex-partner one moment and terrified of being alone the next."],["Speaker","In the final stage, things gradually get better, but not in a straight line. It is common to experience both ups and downs. One day you feel you've completely recovered, and the next something reminds you and you feel low again. That's perfectly normal, and over time the good days begin to outnumber the bad."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["Which historical films have you seen and enjoyed?","What historical event would you make a movie about if you could?","Why do you think directors change historical facts when they make films?","What is a bad way to end a friendship?","When have you taken revenge on someone?"],"talk":["‘It does not matter if a historical film is factually inaccurate.’","‘Online dating is a good way of meeting new people.’","‘There is never a good way of ending a relationship.’"],"mode":"crit","crit":[["Interact
