<b>i</b>de","<b>u</b>nity"],"opts":["ashamed","deep","flash","high","stride","unity"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["com","pro","mise"],"a":0,"word":"compromise"},{"t":"stress","w":["e","co","nom","ic"],"a":2,"word":"economic"},{"t":"stress","w":["ac","tu","al","ly"],"a":0,"word":"actually"},{"t":"stress","w":["cur","rent","ly"],"a":0,"word":"currently"},{"t":"stress","w":["aer","o","bics"],"a":1,"word":"aerobics"}],"ex":"chal|lenge"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"What Sports Teach Children","paras":[["","Many parents think that their children can learn a lot about good values and behaviour through sports. And it is certainly true that sports can teach children about such things as teamwork, complying with the rules of how something is done, fair play, and decency towards others. However, they also find that these good values are often contradicted when children watch sports on TV."],["","Professional sports people and coaches sometimes don’t exhibit the standards of behaviour and fair play that parents hope their children will learn and show when they are playing sports, and indeed in all other areas of life. While watching sports on TV, the chances are that children will see professional players cheating, having tantrums, fighting, or abusing officials such as referees. In addition, it is highly likely that children will be aware of well-known cases of sports people being caught using drugs to improve their performance. The danger of all this is that it could give children the idea that winning is all that counts and that the key point about sports is that you should win at all costs. Good behaviour and fair play aren’t the message that comes across."],["","Instead, it looks as if cheating and bad behaviour are perfectly reasonable ways of getting what you want. This message is reinforced by the fact that some of these sports people acquire enormous fame and wealth, making it seem that they are being handsomely rewarded, either despite or because of their bad behaviour."],["","What can parents do about this? Well, they can regard sports on television as a good opportunity to discuss attitudes and behaviour with their children, both in sports and in life in general. They can sit down and watch the sport with the child. If the child likes a particular team or player, find out what it is about that team or player that appeals to the child. If you see a player swearing at the referee, get the child’s opinion on that behaviour. Discuss whether that player’s skill is more important than their behaviour. Ask what the child thinks the player’s contribution to the team is – how should the player be behaving in that situation, is the player displaying a good attitude towards teamwork? Point out that no player can win a team game on their own, and that it’s important for team members to work well together. Another thing to focus on is what the commentators say. Do they frown on bad behaviour from players, think it’s very amusing, or even seem to think it’s a good thing? What do the officials do about bad behaviour? If they seem to let"],["","players get away with it, parents can discuss with children whether this is right or not and what effect it has on the game. If they punish a player, perhaps by ejecting him, parents can discuss with children the consequences of bad behaviour, both for that player and his teammates. And look, too, at the reactions of coaches and managers. Do they accept losing with good grace, or scowl and show a bad attitude to it? Parents can use this to discuss attitudes to winning and losing, and to remind children that both are a part of sports – nobody can win all the time."],["","However, what children can learn from watching sports is by no means all about the negatives and parents should make sure they accentuate the positives, too. They should emphasize to children the high reputation that well-behaved players have, not just with their teammates, but also with spectators and the media. They can focus on the contribution made by such players during a game, discussing how valuable they are to the team. The message from this is that you can be the best possible player without any kind of bad behaviour. In the interviews after a game, they can point out to a child that the well-behaved players don’t gloat when they win, or sulk when they lose. Parents can draw attention to well-behaved sports people who achieve great fame and wealth, showing that a good attitude can lead to enormous success. And they can draw attention to how well these people conduct themselves in their personal lives and the good work they do for others when they are not playing. In other words, parents should get their children to focus on the positive role models, rather than the antics of the badly behaved, but often more publicized players."]]},"parts":[{"items":[{"t":"mc","q":"In the first paragraph, the writer contrasts ___.","o":["what sports people say about sports with how they behave","what parents think about sports with what children think about it","what children learn about sports with what they see on TV"],"a":2},{"t":"mc","q":"What does the writer say about the bad behaviour of professional sports people?","o":["They are unaware of its effect on children.","It can take many different forms.","Children don’t like seeing or hearing about it."],"a":1},{"t":"mc","q":"The writer says that children can be given the message that ___.","o":["bad behaviour can be regarded as a good thing","you are only going to win if you behave badly","cheating at sport is often not noticed"],"a":0},{"t":"mc","q":"The writer says that parents watching sports on TV with their children should ___.","o":["point out behaviour they disapprove of","find out their children’s views on what they see","correct things that the children say about behaviour"],"a":1},{"t":"mc","q":"Which of the following should parents discuss with children?","o":["The idea that teamwork is more important than individual skill.","The reason why a team with a badly behaved player lost a game.","Why a team member is behaving badly."],"a":0},{"t":"mc","q":"What does the writer say about commentators and officials?","o":["Their reaction to bad behaviour is often unclear.","Their words and actions have a particularly significant effect on children.","They don’t always show that they disapprove of bad behaviour."],"a":2},{"t":"mc","q":"After watching the reactions of managers and coaches, parents should point out that ___.","o":["someone loses every game","bad behaviour can cause a team to lose","your reaction to losing is more important than your attitude when you win"],"a":0},{"t":"mc","q":"What does the writer mean by ‘accentuate the positives?’","o":["Emphasize that most sports people behave well.","Focus on the benefits of good behaviour.","Stress that children’s opinions are right."],"a":1},{"t":"mc","q":"The writer says that parents should draw attention to the connection between ___.","o":["how players behave and the amount of publicity they get","how players behave and how often they win","how players behave and what they do when they aren’t playing"],"a":2},{"t":"mc","q":"Which of the following best summarizes the writer’s view in the article as a whole?","o":["The way that sports are covered on TV should change.","Both good and bad behaviour in sports can teach children valuable lessons.","Children should not be encouraged to connect sports with fame and wealth."],"a":1}]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>You have seen this announcement in an international magazine. Write your answer in 220–260 words.</p>","<p><b>Articles Invited</b></p>","<p>As part of International Sports Week, we’re looking for articles from readers about promoting sport amongst the young. Whose job is it to encourage young people to become more active and get involved in sport? Is it the responsibility of their parents? Should teachers do more to promote the benefits of sport? Or is it down to governments to run healthy living campaigns?</p>","<p>Tell us what you think and why. Send your articles to the address below.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to a talk about Ellis Island near New York, a place where many immigrants went when they arrived in the USA. Complete the sentences using no more than three words.","items":[{"t":"gap","q":"Immigrants were received and processed at the {} on Ellis Island.","a":[["Immigration Station","Immigration Station building"]],"list":true},{"t":"gap","q":"First and second class passengers were inspected {} and then went straight into the USA.","a":[["on board","on board ship","on board the ship","on board (ship)","on the ship"]],"list":true},{"t":"gap","q":"Steerage and third class passengers were inspected by doctors so quickly that doctors called these inspections ‘{}’.","a":[["six-second physicals","six second physicals","6-second physicals"]],"list":true},{"t":"gap","q":"The legal inspection of steerage and third class passengers was based on a document containing {}.","a":[["29 questions","twenty-nine questions"]],"list":true},{"t":"gap","q":"Just {} of the people arriving at Ellis Island were not allowed to enter the USA.","a":[["two per cent","2 per cent","2%","two percent","2 percent"]],"list":true}],"audio":{"script":[["Speaker","Between 1892 and 1954, around twelve million immigrants arrived in the United States through Ellis Island in New York Harbor. They were received and processed at the Immigration Station on Ellis Island, a large building where they were examined and questioned before they could enter the country."],["Speaker","Not everyone had the same experience. First and second class passengers were inspected on board the ship, often very briefly, and then they went straight into the USA. They never saw Ellis Island at all."],["Speaker","Steerage and third class passengers were taken to the island. Doctors watched them climb the stairs and checked them so quickly that the doctors themselves called these inspections 'six-second physicals'."],["Speaker","Next came the legal inspection. Officials asked each person a series of questions based on the ship's passenger list, a document containing twenty-nine questions, about their name, job, destination and how much money they had."],["Speaker","Despite its reputation as the 'Island of Tears', only about two per cent of the people who arrived at Ellis Island were refused entry and sent back. For the great majority, it was the first step towards a new life."]]}},{"instr":"Listen to five people talking about sports. Match the speakers (1–5) to the opinions (A–H).","legend":["desire to be a professional athlete one day","scepticism of one activity’s classification as exercise","desire for a child to be a professional athlete","concern about what children learn from sports","concern about the use of foul language in sports","concern about the use of steroids and other drugs in sports","hatred of professional sports and the athletes who play them","hatred of having to participate in sports"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"F"},{"t":"match","q":"Speaker 2","a":"D"},{"t":"match","q":"Speaker 3","a":"C"},{"t":"match","q":"Speaker 4","a":"H"},{"t":"match","q":"Speaker 5","a":"B"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I used to love athletics, but I find it hard to watch now. Every time someone breaks a record, my first thought is, 'What's he taking?' So many athletes have been caught using steroids and other drugs that I don't trust any results any more."],["Narrator","Speaker two."],["Speaker 2","My kids watch football every weekend, and I worry about what they're picking up. They see players diving to fool the referee and arguing every decision, and then they do the same in their own games. Sport is supposed to teach fair play, not cheating."],["Narrator","Speaker three."],["Speaker 3","My daughter is twelve and she's already the best tennis player in the region. Her coach thinks she could go professional, and I'd love that for her. We spend every weekend at tournaments, and if she makes it, it'll all be worth it."],["Narrator","Speaker four."],["Speaker 4","At school I dreaded PE. Standing in the cold, always picked last for teams. Now the company I work for has a compulsory sports day, and I feel exactly the same. I'd much rather just go to work and do my job."],["Narrator","Speaker five."],["Speaker 5","My brother says golf keeps him fit. Golf! He drives round the course in a little cart and stops at the clubhouse for lunch. I'm sorry, but I can't see how that counts as exercise."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["What do you think is a good reason to leave one’s country for another one?","What do you like most about professional sports?","Which sports are the most popular in your country?","Which sport would you most like to be good at?","If you went to live in another country, what would you miss most?"],"talk":["‘I could never go and live in another country.’","‘Money has a bad effect on sports.’","‘Immigrants bring many benefits to the countries they go to.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft10b","kind":"file","group":"ft10","ver":"B","title":"File 10 Test B","focus":"10A Sport, 10B Migration: relative clauses, adding emphasis (cleft sentences), word building, sport.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Underline the correct word.","items":[{"t":"pick","q":"In spite of the horrendous weather, the place [that|where] I enjoyed most was Ireland.","a":"that"},{"t":"pick","q":"Boris Becker, [who|that] was a tennis cha d by the fact that some of these sports people acquire enormous fame and wealth, making it seem that they are being handsomely rewarded, either despite or because of their bad behaviour."],["","What can parents do about this? Well, they can regard sports on television as a good opportunity to discuss attitudes and behaviour with their children, both in sports and in life in general. They can sit down and watch the sport with the child. If the child likes a particular team or player, find out what it is about that team or player that appeals to the child. If you see a player swearing at the referee, get the child’s opinion on that behaviour. Discuss whether that player’s skill is more important than their behaviour. Ask what the child thinks the player’s contribution to the team is – how should the player be behaving in that situation, is the player displaying a good attitude towards teamwork? Point out that no player can win a team game on their own, and that it’s important for team members to work well together. Another thing to focus on is what the commentators say. Do they frown on bad behaviour from players, think it’s very amusing, or even seem to think it’s a good thing? What do the officials do about bad behaviour? If they seem to let"],["","players get away with it, parents can discuss with children whether this is right or not and what effect it has on the game. If they punish a player, perhaps by ejecting him, parents can discuss with children the consequences of bad behaviour, both for that player and his teammates. And look, too, at the reactions of coaches and managers. Do they accept losing with good grace, or scowl and show a bad attitude to it? Parents can use this to discuss attitudes to winning and losing, and to remind children that both are a part of sports – nobody can win all the time."],["","However, what children can learn from watching sports is by no means all about the negatives and parents should make sure they accentuate the positives, too. They should emphasize to children the high reputation that well-behaved players have, not just with their teammates, but also with spectators and the media. They can focus on the contribution made by such players during a game, discussing how valuable they are to the team. The message from this is that you can be the best possible player without any kind of bad behaviour. In the interviews after a game, they can point out to a child that the well-behaved players don’t gloat when they win, or sulk when they lose. Parents can draw attention to well-behaved sports people who achieve great fame and wealth, showing that a good attitude can lead to enormous success. And they can draw attention to how well these people conduct themselves in their personal lives and the good work they do for others when they are not playing. In other words, parents should get their children to focus on the positive role models, rather than the antics of the badly behaved, but often more publicized players."]]},"parts":[{"items":[{"t":"mc","q":"In the first paragraph, the writer contrasts ___.","o":["what sports people say about sports with how they behave","what parents think about sports with what children think about it","what children learn about sports with what they see on TV"],"a":2},{"t":"mc","q":"What does the writer say about the bad behaviour of professional sports people?","o":["It can take many different forms.","They are unaware of its effect on children.","Children don’t like seeing or hearing about it."],"a":0},{"t":"mc","q":"The writer says that children can be given the message that ___.","o":["cheating at sport is often not noticed","bad behavior can be regarded as a good thing","you are only going to win if you behave badly"],"a":1},{"t":"mc","q":"The writer says that parents watching sports on TV with their children should ___.","o":["correct things that the children say about behaviour","find out their children’s views on what they see","point out behaviour they dis people to become more active and get involved in sport? Is it the responsibility of their parents? Should teachers do more to promote the benefits of sport? Or is it down to governments to run healthy living campaigns?</p>","<p>Tell us what you think and why. Send your articles to the address below.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to a talk about Ellis Island near New York, a place where many immigrants went when they arrived in the USA. Complete the sentences using no more than three words.","items":[{"t":"gap","q":"Immigrants were received and processed at the {} on Ellis Island.","a":[["Immigration Station","Immigration Station building"]],"list":true},{"t":"gap","q":"First and second class passengers were inspected {} and then went straight into the USA.","a":[["on board","on board ship","on board the ship","on board (ship)","on the ship"]],"list":true},{"t":"gap","q":"Steerage and third class passengers were inspected by doctors so quickly that doctors called these inspections ‘{}’.","a":[["six-second physicals","six second physicals","6-second physicals"]],"list":true},{"t":"gap","q":"The legal inspection of steerage and third class passengers was based on a document containing {}.","a":[["29 questions","twenty-nine questions"]],"list":true},{"t":"gap","q":"Just {} of the people arriving at Ellis Island were not allowed to enter the USA.","a":[["two per cent","2 per cent","2%","two percent","2 percent"]],"list":true}],"audio":{"script":[["Speaker","Between 1892 and 1954, around twelve million immigrants arrived in the United States through Ellis Island in New York Harbor. They were received and processed at the Immigration Station on Ellis Island, a large building where they were examined and questioned before they could enter the country."],["Speaker","Not everyone had the same experience. First and second class passengers were inspected on board the ship, often very briefly, and then they went straight into the USA. They never saw Ellis Island at all."],["Speaker","Steerage and third class passengers were taken to the island. Doctors watched them climb the stairs and checked them so quickly that the doctors themselves called these inspections 'six-second physicals'."],["Speaker","Next came the legal inspection. Officials asked each person a series of questions based on the ship's passenger list, a document containing twenty-nine questions, about their name, job, destination and how much money they had."],["Speaker","Despite its reputation as the 'Island of Tears', only about two per cent of the people who arrived at Ellis Island were refused entry and sent back. For the great majority, it was the first step towards a new life."]]}},{"instr":"Listen to five people talking about sports. Match the speakers (1–5) to their opinion (A–H).","legend":["concern about the use of steroids and other drugs in sports","scepticism of one activity’s classification as exercise","concern about what children learn from sports","desire for a child to be a professional athlete","concern about the use of foul language in sports","hatred of having to participate in sports","desire to be a professional athlete one day","hatred of professional sports and the athletes who play them"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"A"},{"t":"match","q":"Speaker 2","a":"C"},{"t":"match","q":"Speaker 3","a":"D"},{"t":"match","q":"Speaker 4","a":"F"},{"t":"match","q":"Speaker 5","a":"B"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I used to love athletics, but I find it hard to watch now. Every time someone breaks a record, my first thought is, 'What's he taking?' So many athletes have been caught using steroids and other drugs that I don't trust any results any more."],["Narrator","Speaker two."],["Speaker 2","My kids watch football every weekend, and I worry about what they're picking up. They see players diving to fool the referee and arguing every decision, and then they do the same in their own games. Sport is supposed to teach fair play, not cheating."],["Narrator","Speaker three."],["Speaker 3","My daughter is twelve and she's already the best tennis player in the region. Her coach thinks she could go professional, and I'd love that for her. We spend every weekend at tournaments, and if she makes it, it'll all be worth it."],["Narrator","Speaker four."],["Speaker 4","At school I dreaded PE. Standing in the cold, always picked last for teams. Now the company I work for has a compulsory sports day, and I feel exactly the same. I'd much rather just go to work and do my job."],["Narrator","Speaker five."],["Speaker 5","My brother says golf keeps him fit. Golf! He drives round the course in a little cart and stops at the clubhouse for lunch. I'm sorry, but I can't see how that counts as exercise."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["Do you think the Olympics are an important sporting event?","What do you think would be most difficult about moving to a new country?","Which sports do you like watching on TV?","What are the most important sports events in your country?","If you could live in another country, which country would it be?"],"talk":["‘I wanted to be a professional athlete when I was younger.’","‘Sports should not be compulsory in school.’","‘Second-generation immigrants have more problems than their parents.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"pt15a","kind":"progress","group":"pt15","ver":"A","title":"Progress Test Files 1–5 A","focus":"Files 1–5: grammar, vocabulary, pronunciation, reading, writing, listening and speaking.","secs":[{"k":"g","name":"Grammar","max":40,"w":1,"parts":[{"instr":"Complete the sentences with the correct form of the verb in brackets.","items":[{"t":"gap","q":"Betty isn’t very good at sh more people were as sensible and [quick|down] to earth as you are. It would make life a lot easier.","a":"down"},{"t":"pick","q":"I wanted to be a cartographer when I was little, but I [changed|swapped] my mind at secondary school and decided to be a psychologist.","a":"changed"},{"t":"pick","q":"Lucy and Robert are getting [in|along] really well. They’re really happy together.","a":"along"},{"t":"pick","q":"I need to get [around|back] home by midnight. I have an early start tomorrow.","a":"back"},{"t":"pick","q":"It took George a long time to get [over|anywhere] losing his job, but now that he’s working again, he’s happy.","a":"over"}],"ex":"The book made me laugh. The writing was really witty / moving."},{"instr":"Complete the words in the sentences.","items":[{"t":"gap","q":"My husband is very <b>s</b>{}: he decided on Saturday morning that we should go to Wales for the weekend and we were on the road an hour later!","a":[["spontaneous"]],"pre":["s"]},{"t":"gap","q":"When you buy furniture from IKEA, it’s best to follow the assembly instructions to the <b>l</b>{} if you don’t want to waste your time.","a":[["letter"]],"pre":["l"]},{"t":"gap","q":"A story that makes you feel sad is <b>d</b>{}.","a":[["depressing"]],"pre":["d"]},{"t":"gap","q":"He thinks very highly of himself and he really looks <b>d</b>{} on other people in the office.","a":[["down"]],"pre":["d"]},{"t":"gap","q":"I did a lot of <b>u</b>{} work as a volunteer, but now I really need to find a job that pays my bills.","a":[["unpaid"]],"pre":["u"]},{"t":"gap","q":"Manuel speaks English without an accent, it’s hard to believe that his mother <b>t</b>{} is actually Spanish.","a":[["tongue"]],"pre":["t"]},{"t":"gap","q":"There was this gorgeous strawberry cheesecake in the café and I just couldn’t resist the <b>t</b>{} to buy one.","a":[["temptation"]],"pre":["t"]},{"t":"gap","q":"If you want to become a children’s book writer, you need to have a very <b>v</b>{} imagination first of all.","a":[["vivid"]],"pre":["v"]},{"t":"gap","q":"You can all go back into the building now, there is no <b>i</b>{} danger anymore.","a":[["immediate"]],"pre":["i"]},{"t":"gap","q":"Roman soldiers wore a <b>h</b>{} to protect their heads from injury.","a":[["helmet"]],"pre":["h"]}],"ex":"The book was really <b>f</b>ast-moving and full of action, so it didn’t take me long to finish it."}]},{"k":"p","name":"Pronunciation","max":20,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"tedi<b>ous</b>","a":"enormous","grp":null,"slot":0},{"t":"match","q":"ques<b>t</b>ion","a":"screech","grp":null,"slot":0},{"t":"match","q":"ga<b>dg</b>et","a":"joke","grp":null,"slot":0},{"t":"match","q":"environ<b>m</b>ent","a":"synonym","grp":null,"slot":0},{"t":"match","q":"pla<b>nn</b>er","a":"turnover","grp":null,"slot":0},{"t":"match","q":"<b>u</b>sually","a":"value","grp":null,"slot":0},{"t":"match","q":"r<b>ou</b>nd","a":"profoundly","grp":null,"slot":0},{"t":"match","q":"gi<b>gg</b>le","a":"mortgage","grp":null,"slot":0},{"t":"match","q":"<b>sh</b>eep","a":"profession","grp":null,"slot":0},{"t":"match","q":"ma<b>kes</b>","a":"experience","grp":null,"slot":0}],"ex":"ye<b>ll</b> → mumble","bankHtml":["enorm<b>ous</b>","e<b>x</b>perience","<b>j</b>oke","mort<b>g</b>age","mumb<b>le</b>","profe<b>ssi</b>on","prof<b>ou</b>ndly","scree<b>ch</b>","synony<b>m</b>","tur<b>n</b>over","val<b>ue</b>"],"opts":["enormous","experience","joke","mortgage","mumble","profession","profoundly","screech","synonym","turnover","value"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["com","pete"],"a":1,"word":"compete"},{"t":"stress","w":["kid","napped"],"a":0,"word":"kidnapped"},{"t":"stress","w":["con","ti","nual","ly"],"a":1,"word":"continually"},{"t":"stress","w":["do","mi","nant"],"a":0,"word":"dominant"},{"t":"stress","w":["mere","ly"],"a":0,"word":"merely"},{"t":"stress","w":["tran","scribe"],"a":1,"word":"transcribe"},{"t":"stress","w":["re","gi","ster"],"a":0,"word":"register"},{"t":"stress","w":["mi","se","ry"],"a":0,"word":"misery"},{"t":"stress","w":["haun","ting"],"a":0,"word":"haunting"},{"t":"stress","w":["en","qui","ry"],"a":1,"word":"enquiry"}],"ex":"ma|na|ger"}]},{"k":"r","name":"Reading","max":15,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Who Wants To Be Rich? A","paras":[["","It’s very common for people to say, ‘Money doesn’t bring you happiness’. They point to the very public problems of wealthy people and the evident misery some of them have. Money, the theory goes, makes them superficial and selfish, their lives often fall apart, and they miss out on the simple pleasures of life. Money is their top priority and because of this, they’ve got it all wrong."],["B","Attitudes to the rich are also characterized by hatred. Typical images of wealthy people are that they are greedy, cruel people who’ve got what they’ve got by exploiting or abusing other people. The rich are often seen as bad characters whose pursuit of wealth has led them to treat good people with brutal force and whose behaviour has been either morally questionable or completely corrupt. They can’t have got that rich by honourable methods, the thinking goes, so they must have done something truly inexcusable. C Connected with this is a common belief that some of the rich, especially the young ones, don’t deserve their wealth. Some of them are spoilt brats, benefiting from the wealth of their parents and living empty lives of laziness and luxury, with nothing between their ears. Their lives have been all reward and no effort. And then there are the people in sport and the arts whose immense earnings are well-publicized. Surely, people say, no one can be worth such sums. It’s outrageous that these people get such high incomes for doing what they do."],["D","Even when people aren’t actually rich by most conventional definitions of the word, their lifestyles attract criticism from others. There is, among many people, a dislike of what they regard as a materialistic attitude to life. When they see people with big houses, luxury cars, and a mass of the top-of-the-range gadgets, they dismiss them as empty, foolish people with the wrong priorities in life. How can they afford these things? Have they got heavily in debt to fund this lifestyle? If so, how silly they are. Of course, some of this feeling can be attributed to envy. Most people have no direct contact with the truly rich, seeing them only via the media, but materialistic people are all around. The truly rich are considered to belong almost to another species, but the materialistic ones might well be in your neighbourhood."],["E","So there’s a fairly common belief that money is ‘a bad thing’, or at any rate, having lots of it is. But I think that in this envy and dislike of the rich, people are missing the point. Money’s a big factor in just about everyone’s life. It’s often the only reason they get up and go to work. If you haven’t got it, life is very difficult. You need to get it for food, clothes, and shelter, for yourself and maybe others. It’s the main reason why most people work – not for pleasure, but to provide the necessities of life. What they are effectively doing is exchanging their time for money."],["F","And this brings us to the key point about wealth. It buys freedom, it buys time. If you’re rich, you don’t have to exchange your time for money, you don’t have to give so much time to an employer or dedicate all that time to the business of earning a living. You can use your time in any way you please, in ways that bring you some fulfilment. If you’re wealthy, you don’t have to be materialistic, nor do you have to be superficial and selfish. These are not iron rules. Disliking the rich because of what you read or learn about some of them in the media results from only a partial view of what having wealth means. Getting annoyed with materialistic people is based on a narrow view of what money brings. Some people squander wealth, some people don’t deserve it, some people want it for reasons you might take a dim view of. But the fact is, wealth provides opportunities for the kind of life you would like to have. G So don’t knock it. Instead, think of ways you might be able to attain it. Focus on the goal of getting yourself into a position where you’re no longer trading your time for money. Take control of your own time by becoming independently wealthy. You might say that’s easier said than done. Well, you might be right, but have you tried yet?"]]},"parts":[{"items":[{"t":"mc","q":"What is the writer’s point in section A?","o":["People take too much interest in the lives of the wealthy.","There is evidence to support a common belief about money.","Being wealthy changes people."],"a":1},{"t":"mc","q":"The writer says in section B that a common view of the wealthy is that they ___.","o":["have acquired wealth dishonestly","have been exceptionally lucky","enjoy feeling superior to others"],"a":0},{"t":"mc","q":"A criticism of rich people mentioned in section C is that ___.","o":["they should keep quiet about the amount of money they have","the financial rewards in their fields are too great","they don’t appreciate the money that they receive"],"a":1},{"t":"mc","q":"In section D, the writer says that many people think that materialistic people ___.","o":["don’t care what other people think of them","don’t really enjoy their lifestyles","aren’t as rich as they might appear to be"],"a":2},{"t":"mc","q":"In section D, the writer suggests that most people ___.","o":["are materialistic to some extent","have an issue with rich neighbours","don’t understand the truly rich"],"a":2},{"t":"mc","q":"The writer’s main point in section E is that ___.","o":["money is important to everyone, not just the rich","the rich give people the wrong ideas about money","most people would like to have a lot of money"],"a":0},{"t":"mc","q":"In section F, the writer suggests that wealthy people ___.","o":["sometimes dislike other wealthy people","are able to avoid something that most people do","often sympathize with people who have little money"],"a":1},{"t":"mc","q":"The writer says in section F that common attitudes to rich people ___.","o":["fail to take into account a key advantage of wealth","are based on a false picture of what wealthy people are like","place too much emphasis on one particular group of people"],"a":0},{"t":"mc","q":"The writer’s intention in section G is to ___.","o":["emphasize that everybody can become wealthy","encourage readers to change their lives","regret the importance of wealth"],"a":1},{"t":"mc","q":"What is the writer’s purpose in the article as a whole?","o":["To argue against a common belief about money.","To defend wealthy people against criticism.","To analyse the advantages and disadvantages of wealth."],"a":0}]},{"instr":"Which section of the article (A–G) contains the following?","items":[{"t":"match","q":"agreement that an aim may be hard to achieve","a":"G"},{"t":"match","q":"a reference to something that wealthy people are unable to experience","a":"A"},{"t":"match","q":"a belief that some wealthy people lack intelligence","a":"C"},{"t":"match","q":"the opinion that not all wealthy people have certain attitudes","a":"F"},{"t":"match","q":"assumptions about what wealthy people did to get their wealth","a":"B"}],"opts":["A","B","C","D","E","F","G"]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Choose one of the titles below and write approximately 250 words.</p>","<p>1 Write an article for an English website about how education has changed in your country over the last 50 years.</p>","<p>2 Write your letter of application for the advertisement below:</p>","<p><b>Barista </b>required to work every morning in coffee shop in centre of town. <b>Job description: </b>To serve customers, bake fresh pastries, keep coffee shop clean… <b>Requirements: </b>You must be aged 16 or over, friendly, polite, and able to work in a demanding atmosphere. You should have a high level of English, and some experience of dealing with the public. <b>How to apply: </b>Email CV to Charles Combibos (coffeemate@bnet.co.uk).</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about various gadgets. Match the speakers (1–5) to what they say about the gadgets (A–H).","legend":["I intend to get a better one.","Sometimes I wish I didn’t have it.","It has had unexpected benefits for me.","It often doesn’t work properly.","I can’t imagine being without it.","I don’t use it as much as I used to.","It’s more useful to others than to me.","I sometimes can’t use it when I want to."],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"E"},{"t":"match","q":"Speaker 2","a":"B"},{"t":"match","q":"Speaker 3","a":"G"},{"t":"match","q":"Speaker 4","a":"H"},{"t":"match","q":"Speaker 5","a":"F"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","My e-reader goes everywhere with me. I've got hundreds of books on it, and I read on the bus, in queues, in bed. I honestly don't know how I managed before. If I lost it tomorrow, I'd buy another one the same day."],["Narrator","Speaker two."],["Speaker 2","My work phone is a mixed blessing. It means I can leave the office earlier, but my boss knows he can reach me any time, even on holiday. There are evenings when I'd love to throw it in the river and be completely unreachable."],["Narrator","Speaker three."],["Speaker 3","My husband bought me a smartwatch for my birthday. I hardly use it myself, but the family love it. They track where I am so they know when to put dinner on, and my son uses it to send me reminders. It does more for them than for me."],["Narrator","Speaker four."],["Speaker 4","I bought a drone to film the countryside, and it takes amazing footage. The trouble is, there are so many restrictions. I can't fly it near the airport, in the park or when it's windy, which is most of the time where I live."],["Narrator","Speaker five."],["Speaker 5","When I got my games console, I played every night for hours. These days I'm busier and I only switch it on now and again at the weekend. It's still a great machine, but it mostly sits under the TV collecting dust."]]}},{"instr":"Listen to a talk about a connection between sport and language. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"What did the research involve?","o":["Examining people’s brains while they answered questions.","People listening to sentences in two different categories.","One set of sentences for each group of people."],"a":1},{"t":"mc","q":"The results of the tests were not ___.","o":["as important as the results of the brain scans","what some of the subjects expected","consistent for all the subjects"],"a":0},{"t":"mc","q":"The research indicated a connection between ___.","o":["being interested in sports and understanding language in general","planning actions and understanding language","the language of sport and other kinds of language"],"a":1},{"t":"mc","q":"The conclusion that can be drawn is that the same parts of the brain ___.","o":["help with both learning languages and learning sports","are used by players and people watching sports differently","are used both for watching sport and understanding language"],"a":2},{"t":"mc","q":"It is suggested that people who are learning language connected with a topic should ___.","o":["learn the language and then do activities connected with it","do activities connected with that topic at the same time","do activities connected with that topic before learning the language"],"a":1}],"audio":{"script":[["Speaker","Is there a connection between playing sport and understanding language? A recent study suggests there may be."],["Speaker","Researchers took two groups: ice hockey players and fans, and people with no interest in the game. Everyone listened to sentences of two kinds: sentences describing ice hockey actions, and sentences about ordinary everyday actions. Afterwards they answered questions to check their understanding."],["Speaker","Not surprisingly, the hockey players and fans understood the hockey sentences better. But the test scores weren't really the main point. What mattered much more were the brain scans taken while they listened."],["Speaker","The scans showed that when the players and fans heard hockey sentences, a part of the brain normally used for planning and controlling movement became active. This suggests a link between planning actions and understanding language."],["Speaker","So the same parts of the brain seem to be involved both when we watch sport and when we understand language about it. Experience of an activity helps us understand words connected with it."],["Speaker","For learners, the message is clear. If you're learning the language of a topic, cooking or football, for example, it helps to do the activity while you're learning the words, not afterwards."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":15,"speaking":{"ask":["What’s the most successful thing you’ve ever done?","Which three personality characteristics do you admire the most?","What are you good at remembering and not so good at remembering?","How much do you discuss your relationships with other people?","What’s your favourite character in a novel you’ve read or film you’ve seen?"],"talk":["‘Your family are the most important people in your life.’","‘In modern life, people spend too much time on their own.’","‘It is possible to be poor but happy.’"],"mode":"overall","max":15}}]},{"id":"pt15b","kind":"progress","group":"pt15","ver":"B","title":"Progress Test Files 1–5 B","focus":"Files 1–5: grammar, vocabulary, pronunciation, reading, writing, listening and speaking.","secs":[{"k":"g","name":"Grammar","max":40,"w":1,"parts":[{"instr":"Complete the sentences with the correct word(s).","items":[{"t":"mc", ack into the building now, there is no <b>i</b>{} danger anymore.","a":[["immediate"]],"pre":["i"]}],"ex":"The book was really <b>f</b>ast-moving and full of action, so it didn’t take me long to finish it."},{"instr":"Underline the odd word out.","items":[{"t":"mc","q":"","o":["affluent","well-off","penniless","loaded"],"a":2},{"t":"mc","q":"","o":["bang","crash","crunch","whistle"],"a":3},{"t":"mc","q":"","o":["got rid of","praised","dumped","broke up with"],"a":1},{"t":"mc","q":"","o":["creak","sigh","groan","stammer"],"a":0},{"t":"mc","q":"","o":["monotonous","tedious","redundant","repetitive"],"a":2},{"t":"mc","q":"","o":["colleague","career","profession","job"],"a":0},{"t":"mc","q":"","o":["benefits","a rise","salary","skills"],"a":3},{"t":"mc","q":"","o":["thought-provoking","competitive","gripping","intriguing"],"a":1},{"t":"mc","q":"","o":["idiom","collocation","synonym","orthography"],"a":3},{"t":"mc","q":"","o":["yell","splash","slurp","drip"],"a":0}],"ex":"mumble  slam  scream  giggle"},{"instr":"Underline the correct word(s).","items":[{"t":"pick","q":"I wanted to be a cartographer when I was little, but I [changed|swapped] my mind at secondary school and decided to be a psychologist.","a":"changed"},{"t":"pick","q":"What’s got [on|into] Pat? She seems very upset.","a":"into"},{"t":"pick","q":"You have to teach kids that they can’t always get their [own way|together]. Sometimes you have to do what someone else wants you to do.","a":"own way"},{"t":"pick","q":"If you get some [qualifications|benefits], then you’ll probably get a better job.","a":"qualifications"},{"t":"pick","q":"I find it hard to work in a team where people [refuse|seem] to compromise and everything has to be done their way.","a":"refuse"},{"t":"pick","q":"I wish more people were as sensible and [quick|down] to earth as you are. It would make life a lot easier.","a":"down"},{"t":"pick","q":"I need to get [around|back] home by midnight. I have an early start tomorrow.","a":"back"},{"t":"p nce","<b>j</b>oke","mort<b>g</b>age","mumb<b>le</b>","profe<b>ssi</b>on","prof<b>ou</b>ndly","scree<b>ch</b>","synony<b>m</b>","tur<b>n</b>over","val<b>ue</b>"],"opts":["enormous","experience","joke","mortgage","mumble","profession","profoundly","screech","synonym","turnover","value"]}]},{"k":"r","name":"Reading","max":15,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Who Wants To Be Rich? A","paras":[["","It’s very common for people to say, ‘Money doesn’t bring you happiness’. They point to the very public problems of wealthy people and the evident misery some of them have. Money, the theory goes, makes them superficial and selfish, their lives often fall apart, and they miss out on the simple pleasures of life. Money is their top priority and because of this, they’ve got it all wrong."],["B","Attitudes to the rich are also characterized by hatred. Typical images of wealthy people are that they are greedy, cruel people who’ve got what they’ve got by exploiting or abusing other people. The rich are often seen as bad characters whose pursuit of wealth has led them to treat good people with brutal force and whose behaviour has been either morally questionable or completely corrupt. They can’t have got that rich by honourable methods, the thinking goes, so they must have done something truly inexcusable. C Connected with this is a common belief that some of the rich, especially the young ones, don’t deserve their wealth. Some of them are spoilt brats, benefiting from the wealth of their parents and living empty lives of laziness and luxury, with nothing between their ears. Their lives have been all reward and no effort. And then there are the people in sport and the arts whose immense earnings are well-publicized. Surely, people say, no one can be worth such sums. It’s outrageous that these people get such high incomes for doing what they do."],["D","Even when people aren’t actually rich by most conventional definitions of the word, their lifestyles attract criticism from others. There is, among many people, a dislike of what they regard as a materialistic attitude to life. When they see people with big houses, luxury cars, and a mass of the top-of-the-range gadgets, they dismiss them as empty, foolish people with the wrong priorities in life. How can they afford these things? Have they got heavily in debt to fund this lifestyle? If so, how silly they are. Of course, some of this feeling can be attributed to envy. Most people have no direct contact with the truly rich, seeing them only via the media, but materialistic people are all around. The truly rich are considered to belong almost to another species, but the materialistic ones might well be in your neighbourhood."],["E","So there’s a fairly common belief that money is ‘a bad thing’, or at any rate, having lots of it is. But I think that in this envy and dislike of the rich, people are missing the point. Money’s a big factor in just about everyone’s life. It’s often the only reason they get up and go to work. If you haven’t got it, life is very difficult. You need to get it for food, clothes, and shelter, for yourself and maybe others. It’s the main reason why most people work – not for pleasure, but to provide the necessities of life. What they are effectively doing is exchanging their time for money."],["F","And this brings us to the key point about wealth. It buys freedom, it buys time. If you’re rich, you don’t have to exchange your time for money, you don’t have to give so much time to an employer or dedicate all that time to the business of earning a living. You can use your time in any way you please, in ways that bring you some fulfilment. If you’re wealthy, you don’t have to be materialistic, nor do you have to be superficial and selfish. These are not iron rules. Disliking the rich because of what you read or learn about some of them in the media results from only a partial view of what having wealth means. Getting annoyed with materialistic people is based on a narrow view of what money brings. Some people squander wealth, some people don’t deserve it, some people want it for reasons you might take a dim view of. But the fact is, wealth provides opportunities for the kind of life you would like to have. G So don’t knock it. Instead, think of ways you might be able to attain it. Focus on the goal of getting yourself into a position where you’re no longer trading your time for money. Take control of your own time by becoming independently wealthy. You might say that’s easier said than done. Well, you might be right, but have you tried yet?"]]},"parts":[{"items":[{"t":"mc","q":"What is the writer’s point in section A?","o":["There is evidence to support a common belief about money.","People take too much interest in the lives of the wealthy.","Being wealthy changes people."],"a":0},{"t":"mc","q":"The writer says in section B that a common view of the wealthy is that they ___.","o":["have been exceptionally lucky","have acquired wealth dishonestly","enjoy feeling superior to others"],"a":1},{"t":"mc","q":"A criticism of rich people mentioned in section C is that ___.","o":["they don’t appreciate the money that they receive","the financial rewards in their fields are too great","they should keep quiet about the amount of money they have"],"a":1},{"t":"mc","q":"In section D, the writer says that many people think that materialistic people ___.","o":["don’t really enjoy their lifestyles","don’t care what other people think of them","aren’t as rich as they might appear to be"],"a":2},{"t":"mc","q":"In section D, the writer suggests that most people ___.","o":["are materialistic to some extent","have an issue with rich neighbours","don’t understand the truly rich"],"a":2},{"t":"mc","q":"The writer’s main point in section E is that ___.","o":["the rich give people the wrong ideas about money","most people would like to have a lot of money","money is important to everyone, not just the rich"],"a":2},{"t":"mc","q":"In section F, the writer suggests that wealthy people ___.","o":["often sympathize with people who have little money","sometimes dislike other wealthy people","are able to avoid something that most people do"],"a":2},{"t":"mc","q":"The writer says in section F that common attitudes to rich people ___.","o":["fail to take into account a key advantage of wealth","place too much emphasis on one particular group of people","are based on a false picture of what wealthy people are like"],"a":0},{"t":"mc","q":"The writer’s intention in section G is to ___.","o":["emphasize that everybody can become wealthy","encourage readers to change their lives","regret the importance of wealth"],"a":1},{"t":"mc","q":"What is the writer’s purpose in the article as a whole?","o":["To analyse the advantages and disadvantages of wealth.","To argue against a common belief about money.","To defend wealthy people against criticism."],"a":1}]},{"instr":"Which section of the article (A–G) contains the following?","items":[{"t":"match","q":"a reference to something that wealthy people are unable to experience","a":"A"},{"t":"match","q":"agreement that an aim may be hard to achieve","a":"G"},{"t":"match","q":"assumptions about what wealthy people did to get their wealth","a":"B"},{"t":"match","q":"a belief that some wealthy people lack intelligence","a":"C"},{"t":"match","q":"the opinion that not all wealthy people have certain attitudes","a":"F"}],"opts":["A","B","C","D","E","F","G"]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Choose one of the titles below and write approximately 250 words.</p>","<p>1 Write an article for an English website about how education has changed in your country over the last 50 years.</p>","<p>2 Write your letter of application for the advertisement below:</p>","<p><b>Barista </b>required to work every morning in coffee shop in centre of town. <b>Job description: </b>To serve customers, bake fresh pastries, keep coffee shop clean… <b>Requirements: </b>You must be aged 16 or over, friendly, polite, and able to work in a demanding atmosphere. You should have a high level of English, and some experience of dealing with the public. <b>How to apply: </b>Email CV to Charles Combibos (coffeemate@bnet.co.uk).</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about various gadgets. Match the speakers (1–5) to what they say about the gadgets (A–H).","legend":["It’s more useful to others than to me.","It often doesn’t work properly.","I sometimes can’t use it when I want to.","I intend to get a better one.","I can’t imagine being without it.","Sometimes I wish I didn’t have it.","It has had unexpected benefits for me.","I don’t use it as much as I used to."],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"E"},{"t":"match","q":"Speaker 2","a":"F"},{"t":"match","q":"Speaker 3","a":"A"},{"t":"match","q":"Speaker 4","a":"C"},{"t":"match","q":"Speaker 5","a":"H"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","My e-reader goes everywhere with me. I've got hundreds of books on it, and I read on the bus, in queues, in bed. I honestly don't know how I managed before. If I lost it tomorrow, I'd buy another one the same day."],["Narrator","Speaker two."],["Speaker 2","My work phone is a mixed blessing. It means I can leave the office earlier, but my boss knows he can reach me any time, even on holiday. There are evenings when I'd love to throw it in the river and be completely unreachable."],["Narrator","Speaker three."],["Speaker 3","My husband bought me a smartwatch for my birthday. I hardly use it myself, but the family love it. They track where I am so they know when to put dinner on, and my son uses it to send me reminders. It does more for them than for me."],["Narrator","Speaker four."],["Speaker 4","I bought a drone to film the countryside, and it takes amazing footage. The trouble is, there are so many restrictions. I can't fly it near the airport, in the park or when it's windy, which is most of the time where I live."],["Narrator","Speaker five."],["Speaker 5","When I got my games console, I played every night for hours. These days I'm busier and I only switch it on now and again at the weekend. It's still a great machine, but it mostly sits under the TV collecting dust."]]}},{"instr":"Listen to a talk about a connection between sport and language. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"What did the research involve?","o":["Examining people’s brains while they answered questions.","One set of sentences for each group of people.","People listening to sentences in two different categories."],"a":2},{"t":"mc","q":"The results of the tests were not ___.","o":["what some of the subjects expected","as important as the results of the brain scans","consistent for all the subjects"],"a":1},{"t":"mc","q":"The research indicated a connection between ___.","o":["the language of sport and other kinds of language","planning actions and understanding language","being interested in sports and understanding language in general"],"a":1},{"t":"mc","q":"The conclusion that can be drawn is that the same parts of the brain ___.","o":["help with both learning languages and learning sports","are used by players and people watching sports differently","are used both for watching sport and understanding language"],"a":2},{"t":"mc","q":"It is suggested that people who are learning language connected with a topic should ___.","o":["do activities connected with that topic at the same time","learn the language and then do activities connected with it","do activities connected with that topic before learning the language"],"a":0}],"audio":{"script":[["Speaker","Is there a connection between playing sport and understanding language? A recent study suggests there may be."],["Speaker","Researchers took two groups: ice hockey players and fans, and people with no interest in the game. Everyone listened to sentences of two kinds: sentences describing ice hockey actions, and sentences about ordinary everyday actions. Afterwards they answered questions to check their understanding."],["Speaker","Not surprisingly, the hockey players and fans understood the hockey sentences better. But the test scores weren't really the main point. What mattered much more were the brain scans taken while they listened."],["Speaker","The scans showed that when the players and fans heard hockey sentences, a part of the brain normally used for planning and controlling movement became active. This suggests a link between planning actions and understanding language."],["Speaker","So the same parts of the brain seem to be involved both when we watch sport and when we understand language about it. Experience of an activity helps us understand words connected with it."],["Speaker","For learners, the message is clear. If you're learning the language of a topic, cooking or football, for example, it helps to do the activity while you're learning the words, not afterwards."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":15,"speaking":{"ask":["What’s your definition of success in life?","How important do you think it is to be busy all the time?","What’s the first sound you hear when you wake up in the morning?","How easy or difficult do you find it to meet new people?","Which book or movie has had the greatest influence on you?"],"talk":["‘There are many things in life that are more important than work.’","‘It is hard to keep the friends you make as a child.’","‘Materialism leads to unhappiness.’"],"mode":"overall","max":15}}]},{"id":"pt610a","kind":"progress","group":"pt610","ver":"A","title":"Progress Test Files 6–10 A","focus":"Files 6–10: grammar, vocabulary, pronunciation, reading, writing, listening and speaking.","secs":[{"k":"g","name":"Grammar","max":40,"w":1,"parts":[{"instr":"Complete the sentences with the cor verrated"},{"t":"stress","w":["cap","ti","vi","ty"],"a":1,"word":"captivity"},{"t":"stress","w":["mu","ssels"],"a":0,"word":"mussels"},{"t":"stress","w":["ca","na","ry"],"a":1,"word":"canary"}],"ex":"sur|vi|vors"}]},{"k":"r","name":"Reading","max":15,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"A Traveller Or A Tourist? A","paras":[["","What is the difference between a traveller and a tourist? Well, the easy distinction often made concerns what kind of trip people are on. To put it simply, someone visiting other countries with a backpack and roaming from place to place without a fixed itinerary is often regarded, especially by themselves, as a ‘traveller’. Someone on holiday, especially someone on a package holiday for one or two weeks, is generally regarded as a ‘tourist’. According to this distinction, the traveller gains an understanding of the place as it really is – mixing in with the locals, learning about the culture – whereas the tourist merely skates over the surface, seeing the sights but ignoring the people and their culture. This is why many people who consider themselves ‘travellers’ sneer dismissively at ‘tourists’ and are so anxious to distance themselves from them."],["B","However, this distinction does not seem to me to hold water in many cases. First of all, let’s accept that a traveller is someone who fully experiences the place they visit rather than simply observing it from the outside, as a tourist does. Does everyone calling themselves a traveller really do this? Of course not. There are herds of young backpackers out there in all corners of the world who see and learn very little of the places they visit. Sticking together in groups, their tales on return are seldom of what they learnt of other cultures, but of the other backpackers they met. Contact with local people is negligible, and there is the suspicion that they are merely ticking boxes so that they can say they have visited all the places that their peers go to. This seems to me not to distinguish them at all from the package tourists boasting about the places they have been to, but who the backpackers so deride. Secondly, there are plenty of people much older than the backpackers who do immerse themselves in the cultures of the places they visit, even if they are only on short holidays. It’s not about how long your stay is, how old you are, how you got there, or how you move around there. It’s all about attitude. C If you really are a traveller, there’s a purpose to your trip beyond simply getting away from work, taking it easy, or enjoying the weather. You broaden your mind, see other people’s lives through their eyes, gain new perspectives. You meet and have real conversations with local people. You learn that some of your expectations and assumptions were wrong. Your trip has an effect on you. You are wiser"],["","about another culture, other ways of thinking and living. A tourist, on the other hand, isn’t interested in any of that. Tourists hardly engage at all with the place they are visiting, preferring to confirm their own preconceptions rather than challenge them, keeping the local people and culture at arm’s length, seeing everything through the lens of a camera. D One of the first rules of being a traveller is that you have to accept the place for what it is. Don’t complain that it’s hot, that there are bugs, that life moves at a different pace, that local people sometimes stare at you. Don’t keep comparing the place with home or other places you’ve been. Don’t let disappointments about the quality of service or level of facilities in your accommodation dominate your thoughts. Instead, get out and about. Watch how local people interact, how they go about their daily business. Learn some words of the language that you can use in shops and other places and go where the local people go. Ask questions rather than thinking you know all the answers. Once you’ve found the various bits of key information you need, leave the guidebook behind – you’ll learn more from personal contact and direct experience than you can get from any book. Put the camera away for a while and instead store images of what you see in your mind. Anyone can do these things, no matter what kind of trip they’re on. Even if you’re on a short annual holiday, you can be a traveller rather than a tourist; plenty of people who call themselves travellers are actually tourists. It’s all in the mind."]]},"parts":[{"items":[{"t":"mc","q":"The writer’s intention in section A is to ___.","o":["compare what ‘travellers’ and ‘tourists’ say about themselves","explain why it is important to distinguish between a ‘traveller’ and a ‘tourist’","present common definitions of ‘traveller’ and ‘tourist’"],"a":2},{"t":"mc","q":"Which of the following does the writer describe in section A?","o":["The attitude of travellers towards tourists.","The attitude of local people towards both travellers and tourists.","The attitude of tourists towards travellers."],"a":0},{"t":"mc","q":"What does the writer mean by the phrase ‘hold water’ at the beginning of section B?","o":["be generally agreed","be true","be discussed"],"a":1},{"t":"mc","q":"What does the writer suggest about ‘travellers’ in section B?","o":["Their attitudes change during their trips.","They don’t really enjoy the trips they make.","They are not really interested in the places they visit."],"a":2},{"t":"mc","q":"Which of the following opinions does the writer express in section B?","o":["Some people who call themselves travellers behave like tourists.","Some travellers have a worse attitude than some tourists.","Travellers and tourists should have more contact with each other."],"a":0},{"t":"mc","q":"What does the writer say about some older people in section B?","o":["They could be considered to be ‘travellers’.","They dislike being referred to as ‘tourists’.","They disapprove of the attitude of some travellers."],"a":0},{"t":"mc","q":"The writer’s intention in nteen for their employees. You have been asked to get feedback from as many employees as possible and to write a report detailing whether or not they want a canteen, what food they would expect, and to make suggestions for getting more people to use the canteen. You have made notes covering the views of the majority of people:</p>","<p>People like idea of canteen and want it open from 7.00 a.m. for breakfast to 4.00 p.m. for tea.</p>","<p>They will only use it if cheap (if prices same as local shops, they prefer going out). Want hot and cold food; meat and vegetarian options. If very crowded (too many people, slow service), they will go to shops outside.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about various laws banning certain things. Match the speakers (1–5) to what they say about the law or ban (A–H).","legend":["It is impossible to enforce it.","It should not have been introduced.","Many people are not aware of the law.","It has caused confusion.","It has had an unforeseen result.","It has had the desired effect.","It doesn’t cover everything it should cover.","People frequently ignore it."],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"E"},{"t":"match","q":"Speaker 2","a":"D"},{"t":"match","q":"Speaker 3","a":"B"},{"t":"match","q":"Speaker 4","a":"H"},{"t":"match","q":"Speaker 5","a":"F"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","When they banned plastic bags in our shops, the idea was to reduce waste. But now everyone buys thick reusable bags, uses them twice and throws them away. Apparently we're using more plastic than before. Nobody saw that coming."],["Narrator","Speaker two."],["Speaker 2","Our city introduced a low-emission zone last year, and nobody seems to understand it. Some cars are allowed in, some aren't, some have to pay at certain times. Even the taxi drivers aren't sure. I've had three different explanations from three different officials."],["Narrator","Speaker three."],["Speaker 3","The ban on dogs in all the town's parks is ridiculous. Most owners are responsible, and now everyone suffers because of a few. It was never necessary, and the council should never have brought it in."],["Narrator","Speaker four."],["Speaker 4","Using a phone while driving has been illegal here for years. But stand at any junction and count. Half the drivers who go past are texting or talking. Everyone knows the law; they just don't obey it."],["Narrator","Speaker five."],["Speaker 5","When they banned smoking in restaurants, people said business would collapse. In fact, restaurants are busier than ever, and far fewer people smoke now. It's done exactly what it was meant to do."]]}},{"instr":"Listen to a talk about celebrity chefs who have appeared on TV in Britain. Complete the sentences using no more than three words.","items":[{"t":"gap","q":"The phrase ‘Delia effect’ refers to something that happens in {}.","a":[["supermarkets","the supermarkets"]],"list":true},{"t":"gap","q":"British people ate, but did not cook {} and {} dishes until the 1980s.","a":[["Chinese"],["Indian"]],"list":true,"any":true},{"t":"gap","q":"Jamie Oliver has encouraged people to eat meals that are both {} and {}.","a":[["healthy"],["home-cooked","home cooked"]],"list":true,"any":true},{"t":"gap","q":"Anton Mosimann’s attempt to get British people to replace salt with {} failed.","a":[["herbs"]],"list":true},{"t":"gap","q":"The most influential chefs have been the ones whose recipes appeal to {} people.","a":[["ordinary","more ordinary"]],"list":true}],"audio":{"script":[["Speaker","Celebrity chefs have had an enormous influence on the way British people cook and eat. Take Delia Smith. Whenever she uses an ingredient on TV, sales of it in supermarkets rise dramatically, sometimes overnight. This is known as the 'Delia effect'."],["Speaker","Chefs have also widened people's tastes. For years British people happily ate Chinese and Indian food in restaurants and takeaways, but until the 1980s hardly anyone cooked those dishes at home. TV chefs changed that."],["Speaker","More recently, Jamie Oliver has campaigned against processed food. He has encouraged families to eat meals that are both healthy and home-cooked, and he has changed what children eat at school."],["Speaker","Not every campaign has worked. The Swiss chef Anton Mosimann tried to persuade British people to replace salt with herbs to make their food healthier. Few people took his advice, and the attempt failed."],["Speaker","Looking back, the most influential chefs have not been the most sophisticated. They have been the ones whose recipes appeal to ordinary people, cooking in ordinary kitchens with ingredients they can buy at the corner shop."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["What do you think of alternative medicine?","Which famous sights in the world would you really like to see?","If you could paint a picture of someone or something, what would you paint?","When do you go out to eat in restaurants?","What do you do to keep fit?"],"talk":["‘Self-help books can cause a lot of trouble.’","‘All public buildings should have some art in them.’","‘Food is a necessity not an art.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"pt610b","kind":"progress","group":"pt610","ver":"B","title":"Progress Test Files 6–10 B","focus":"Files 6–10: grammar, vocabulary, pronunciation, reading, writing, listening and speaking.","secs":[{"k":"g","name":"Grammar","max":40,"w":1,"parts":[{"instr":"Complete the sentences with the correct word(s).","items":[{"t":"mc","q":"We didn’t have enough time to go camping last weekend. ___, the weather was really rainy.","o":["Talking of","Anyway","In other words"],"a":1},{"t":"mc","q":"On ___ hand, I’d like to go out tonight. On the ot
