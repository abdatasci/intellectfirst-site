l is never fully realized. However, the most commonly cited practical reason for studying history is that it improves judgment. It offers the opportunity to avail ourselves of the experiences of other times and other nations; it qualifies them as judges of the actions and designs of men. History doesn’t tell us the answers to our questions, but it helps to inform us so that we might make better decisions in the future. And this has never been as important as it is nowadays in this era of the World Wide Web and globalism, when knowledge of the larger world is not only desirable, but increasingly important."],["B","The use of historical examples is ancient and no doubt predates written language. We can imagine cave dwellers sitting around the evening campfire sharing anecdotes of admired ancestors worthy of emulation. People need models, and historical examples are especially powerful models because they actually existed. Joan of Arc demonstrates the power of individual belief and action. Galileo symbolizes the fight against authority for freedom of thought, while Thomas Becket represents integrity in the face of deadly intimidation. As we know, humans are pattern makers. While many philosophers of history have believed that history is revealed only through its unique events, others have been unable to resist the urge to ascribe pattern to history. One view put forward is that historical cultures, like plants and animals, follow the cycle of growth, flowering and decline. Certainly, history shows us that individuals and empires may rise, but eventually they will fall."],["C","Some of history’s greatest historians have seen human self-awareness as the very essence of history. Arnold Toynbee said, ‘History is a search for light on the nature and destiny of man.’ The value of history, then, is that it teaches"],["","us what man has done and thus what man is. Psychologist Bruno Bettelheim asserted that human self-knowledge is the most important role of formal instruction and that most of all, our schools ought to teach the true nature of man; teach about his troubles with himself, his inner turmoils and about his difficulties in living with others. They should teach the prevalence and the power of both man’s social and anti-social tendencies, and how the one can domesticate the other, without destroying the individual’s independence or self-love."],["D","The concept of identity is key. Questions of identity are a central concern of psychology, which has found that loss of identity results in loss of significance; without identity there is little meaning and purpose to life. As Beverly Southgate puts it, history – the memories of things past – is of supreme importance in maintaining a sense of identity. In this context, Southgate quotes a character from a Saul Bellow novel who says, ‘Everyone needs his memories. They keep the wolf of insignificance from the door.’ And I think that sums it up rather nicely. Southgate says the need for identity applies to nations as well as to individuals; cultural identity contributes to meaning, purpose and cohesion in society; without it, society would be as rootless and adrift as an individual with amnesia."]]},"parts":[{"instr":"Which expert:","items":[{"t":"match","q":"states that humans fundamentally feel lost if we haven’t got a sense of who we really are.","a":"D"},{"t":"match","q":"gives an example of a person who had strong faith in their own principles.","a":"B"},{"t":"match","q":"explains that the study of history is fundamentally a quest to understand humans.","a":"C"},{"t":"match","q":"mentions the current significance of adding to our understanding of international events.","a":"A"},{"t":"match","q":"explains the popularity of the belief that examining history leads people to come to better conclusions.","a":"A"},{"t":"match","q":"states that communicating an understanding of ourselves is the ultimate aim of education.","a":"C"},{"t":"match","q":"suggests that the habit of telling each other stories was common even in historic times.","a":"B"},{"t":"match","q":"draws a comparison between history and a process in the natural world.","a":"B"},{"t":"match","q":"believes the use of an animal metaphor effectively communicates an idea.","a":"D"},{"t":"match","q":"refers to two contradictory attributes of humans.","a":"C"}],"opts":["A","B","C","D"]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Write an article of approximately 250 words.</p>","<p>Imagine you are a historian in the year 2200. Choose an event that has happened in the last five years, and tell the story of that event as if you are looking back on it from the year 2200.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about various historical films. Match the speakers (1–5) to what they say about the films (A–H).","legend":["I remained affected by it for some time after I’d seen it.","It was different from what I had expected before I saw it.","I found elements of it unrealistic.","It has a personal connection for me.","Most people remember one particular scene from it.","The acting is the most impressive aspect of it.","I liked it so much that I saw it over and over again.","One particular scene is very emotional and moving."],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"A"},{"t":"match","q":"Speaker 2","a":"D"},{"t":"match","q":"Speaker 3","a":"G"},{"t":"match","q":"Speaker 4","a":"C"},{"t":"match","q":"Speaker 5","a":"H"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I saw a film about the Second World War a few years ago, set in a prison camp. I'd expected an ordinary war film, and in a way that's what it was. But it got to me. For days afterwards I kept thinking about the characters and couldn't get some of the images out of my head. It's rare for a film to stay with me that long."],["Narrator","Speaker two."],["Speaker 2","My favourite is a film about the building of the Trans-Siberian railway. It's not a famous film, but my great-grandfather actually worked on that railway, and there are family stories about him that match what happens on screen. When I watch it, I feel I'm seeing a bit of my own family's past."],["Narrator","Speaker three."],["Speaker 3","When I was a teenager I was completely obsessed with a film about the Roman Empire. I must have watched it twenty or thirty times. I knew all the lines and used to act out the battle scenes with my friends. I still put it on now and again, though not quite as often."],["Narrator","Speaker four."],["Speaker 4","Everyone told me it was a masterpiece, and the costumes were gorgeous. But I couldn't take some of it seriously. The hero gets stabbed and is fighting again ten minutes later, and the queen speaks as if she's in a modern office. For me it just wasn't believable."],["Narrator","Speaker five."],["Speaker 5","It's a long film about a family during the Great Depression, and a lot of it is quite slow. But there's a scene near the end where the father has to say goodbye to his daughter at the station, and I can never watch it without crying. The rest of the film is fine, but that moment is what makes it special."]]}},{"instr":"Listen to a talk about how people feel when a relationship breaks up. Complete the sentences using no more than three words.","items":[{"t":"gap","q":"When a relationship breaks up, you have to have different ideas about {}.","a":[["the future"]],"list":true},{"t":"gap","q":"The first stage involves feelings of {}.","a":[["shock and disbelief","disbelief and shock"]],"list":true},{"t":"gap","q":"In the first stage, you ask yourself questions beginning with the words ‘{}’.","a":[["what if"]],"list":true},{"t":"gap","q":"In the second stage, feelings of {} may last for more than a few weeks.","a":[["anger and panic","panic and anger"]],"list":true},{"t":"gap","q":"In the final stage, it is common to experience both {}.","a":[["ups and downs"]],"list":true}],"audio":{"script":[["Speaker","When a relationship comes to an end, it isn't just the present that changes. One of the hardest things is that you have to start thinking differently about the future. The plans you made together are gone, and you have to build new ideas about what lies ahead."],["Speaker","Psychologists usually describe three stages. The first stage involves feelings of shock and disbelief. People often can't accept what has happened, and they may go about their daily lives almost automatically."],["Speaker","In this first stage you also tend to go over and over what happened. You ask yourself questions beginning with the words 'what if'. What if I'd said something different? What if I hadn't taken that job?"],["Speaker","The second stage is often the most painful. Feelings of anger and panic are common, and they may last for more than a few weeks. People can feel furious with their ex-partner one moment and terrified of being alone the next."],["Speaker","In the final stage, things gradually get better, but not in a straight line. It is common to experience both ups and downs. One day you feel you've completely recovered, and the next something reminds you and you feel low again. That's perfectly normal, and over time the good days begin to outnumber the bad."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["Which recent historical films have been very popular?","What fictional films do you wish were historically real?","Why is it important to have friends as an adult?","What is the best way to make a new friend?","What causes teenagers’ relationships to break up?"],"talk":["‘Historical films are a good way for people to learn about history.’","‘Being dumped can sometimes be a good thing even though it hurts at first.’","‘Revenge is never a good thing.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft04a","kind":"file","group":"ft04","ver":"A","title":"File 4 Test A","focus":"4A Books and film, 4B Sounds: speculation and deduction, adding emphasis (inversion), sounds and the human voice.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Underline the correct word(s).","items":[{"t":"pick","q":"Anita [must|must have] speak Chinese very well. She lived in Shanghai for ten years.","a":"must"},{"t":"pick","q":"They [can’t|must have] been at home; no one came to the door when I knocked.","a":"can’t"},{"t":"pick","q":"They [can’t|should] be having a good picnic. It’s raining and they don’t have an umbrella.","a":"can’t"},{"t":"pick","q":"He [might|couldn’t] have been playing the piano for very long because he doesn’t play well at all.","a":"couldn’t"},{"t":"pick","q":"Bruno’s [sure to|bound] get the job. He’s got excellent qualifications.","a":"sure to"},{"t":"pick","q":"I’m afraid Malek’s [unlikely|won’t] to be here in time for the party.","a":"unlikely"},{"t":"pick","q":"Carrie [definitely|will definitely] get a promotion next month.","a":"will definitely"},{"t":"pick","q":"We’ll [probably|probably be] start working at about seven tomorrow morning.","a":"probably"}],"ex":"If we leave now, we should / should have get to the cinema by 8.00."},{"instr":"Complete the sentences with the correct words.","items":[{"t":"mc","q":"Not only ___ late, you’re also not dressed properly.","o":["you are","are you","you’re"],"a":1},{"t":"mc","q":"Never ___ such a silly excuse.","o":["have I heard","I heard","I have heard"],"a":0},{"t":"mc","q":"___ Arthur arrived than he and Evan started to fight.","o":["As soon","No sooner had","Sooner than"],"a":1},{"t":"mc","q":"Only when you watch someone make a basket ___ what an art it is.","o":["you do realize","you realize","do you realize"],"a":2},{"t":"mc","q":"Not until I see the money with my own eyes ___ that you have been paid.","o":["will I believe","do I believe","I believe"],"a":0},{"t":"mc","q":"Rarely ___ so relaxed.","o":["have felt","I have felt","have I felt"],"a":2}],"ex":"Not until you say you’re sorry will we discuss the problems we’re having.","bankHtml":["you say","say you","you’re say"]},{"instr":"Is the sentence right or wrong? Write correct or incorrect.","items":[{"t":"mc","q":"Not only he is my brother, he is also my best friend.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"It’s unlikely that he’ll be on time for the meeting.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"She may not be the right person for the job.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"They’ll probably be a little late. We can wait.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"Carlos is bound being here soon. He’s not usually late.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"I don’t think we should ask him to join us. He’s not definitely the party type.","o":["correct","incorrect"],"a":1}]}]},{"k":"v","name":"Vocabulary","max":20,"w":1,"parts":[{"instr":"Underline the odd word out.","items":[{"t":"mc","q":"","o":["bang","buzz","giggle","tap"],"a":2},{"t":"mc","q":"","o":["mumble","groan","scream","slam"],"a":3},{"t":"mc","q":"","o":["tick","sigh","whisper","yell"],"a":0},{"t":"mc","q":"","o":["rattle","drip","click","whisper"],"a":3},{"t":"mc","q":"","o":["drip","splash","hoot","slurp"],"a":2},{"t":"mc","q":"","o":["crash","crunch","bang","sniff"],"a":3}],"ex":"whistle  whisper  mumble  click"},{"instr":"Complete the words in the sentences.","items":[{"t":"gap","q":"An <b>i</b>{} story is one that seems unlikely or difficult to believe.","a":[["implausible"]],"pre":["i"]},{"t":"gap","q":"My mum doesn’t like reading reviews before going to see a film. She says they are full of <b>s</b>{}.","a":[["spoilers"]],"pre":["s"]},{"t":"gap","q":"The book was very light and <b>e</b>{}, just what you want from a summer read.","a":[["entertaining"]],"pre":["e"]},{"t":"gap","q":"A story that makes you cry or makes you feel strong emotion can be described as <b>m</b>{}.","a":[["moving"]],"pre":["m"]},{"t":"gap","q":"I really struggled to finish the book you lent me; it was so <b>h</b>{}.","a":[["heavy-going","heavy going"]],"pre":["h"]},{"t":"gap","q":"The film we watched last night was very <b>t</b>{}; we stayed up till 2 a.m. talking about it.","a":[["thought-provoking"]],"pre":["t"]},{"t":"gap","q":"You have to read this novel! A <b>h</b>{} story that you won’t find easy to get out of your mind.","a":[["haunting"]],"pre":["h"]}],"ex":"A story that makes you feel sad is <b>d</b>epressing."},{"instr":"Complete the sentences with one word.","items":[{"t":"gap","q":"When people are frightened, hurt, or overly excited they often {} out loud.","a":[["scream"]]},{"t":"gap","q":"People who often repeat sounds or words as they speak are said to have a {}.","a":[["stammer","stutter"]]},{"t":"gap","q":"When people hear a familiar tune they often {} along.","a":[["hum"]]},{"t":"gap","q":"It is considered very bad manners to {} your tea loudly.","a":[["slurp"]]},{"t":"gap","q":"Someone who is unable to speak is {}.","a":[["mute","dumb"]]},{"t":"gap","q":"A book that is so exciting and interesting that you find it impossible to put down is often described as {}.","a":[["gripping","unputdownable"]]},{"t":"gap","q":"A book that is interesting because of its unusual nature is described as {}.","a":[["intriguing"]]}],"ex":"Informal conversation, often with strangers, is called small talk."}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"hi<b>ss</b> <span class=\"hint\">(1 of 2)</span>","a":["smooth","whistle"],"grp":"snd7-1","slot":0},{"t":"match","q":"hi<b>ss</b> <span class=\"hint\">(2 of 2)</span>","a":["smooth","whistle"],"grp":"snd7-1","slot":1},{"t":"match","q":"<b>b</b>arely","a":"sob","grp":null,"slot":0},{"t":"match","q":"<b>t</b>ick <span class=\"hint\">(1 of 2)</span>","a":["approached","vast"],"grp":"snd7-3","slot":0},{"t":"match","q":"<b>t</b>ick <span class=\"hint\">(2 of 2)</span>","a":["approached","vast"],"grp":"snd7-3","slot":1}],"ex":"bu<b>zz</b> → fees","bankHtml":["approach<b>ed</b>","fee<b>s</b>","<b>s</b>mooth","so<b>b</b>","vas<b>t</b>","whi<b>st</b>le"],"opts":["approached","fees","smooth","sob","vast","whistle"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["im","plau","si","ble"],"a":1,"word":"implausible"},{"t":"stress","w":["mere","ly"],"a":0,"word":"merely"},{"t":"stress","w":["in","trigu","ing"],"a":1,"word":"intriguing"},{"t":"stress","w":["prox","im","i","ty"],"a":1,"word":"proximity"},{"t":"stress","w":["con","tin","u","al","ly"],"a":1,"word":"continually"}],"ex":"child|care"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Lost In Translation?","paras":[["","There’s a well-known story in the world of literary translators about the translator who was thrilled to see his work appear at great length in an article in a prestigious magazine. He had translated a number of novels by a little-known Scandinavian novelist, who he believed had been neglected and not received the attention or praise he deserved. He had dedicated much of his working life to trying to get this novelist some recognition. The article agreed with his assessment of the novelist’s work and illustrated its view of his worth by quoting long passages from the translations. But something was missing. The translator searched in vain for a mention of his name. It didn’t appear anywhere. The translator’s joy at the coverage of his favourite author was considerably spoiled by this. He felt that he himself should have had some recognition in the article. The implication was that the translations had just appeared from nowhere, or even perhaps that the novelist had done them himself. It was as if the translator did not exist, and all the efforts he had made had never happened."],["","This incident raises a fundamental question about the status and function of the literary translator. Most people would agree that it was wrong of the magazine to omit any mention of the translator. However, it is also true that readers themselves operate in exactly the same way, and for them it is also as if the translator didn’t exist. When people read a translation of a novel, they want to feel they are reading what the novelist, and not someone else, wrote. They don’t want to be reminded that they are not reading, and would not be able to read, the original novel as created by the novelist. The translator has fulfilled a necessary function for them, but they do not wish to know who the translator was or pay any attention to what they have done. Readers are simply the receivers of what the translator does. So even though we might wish for direct contact with the novelist, we depend on the translator. In this global age, translators have become even more important. More and more works of fiction are being translated into more and more languages. Readers are now able to experience and understand other cultures more than ever through the reading of translated novels. The works of more and more novelists are now accessible to people in other parts of the world. This applies not only to new novels, but also to fresh translations of old classics. The adventurous reader can now enjoy novels from many eras and many cultures that previously they would not have been able to."],["","And central to this is the translator, working heroically to come up with the translation that captures exactly what is in the original work, and often poorly paid. Although readers may be happy for them to remain obscure, perhaps they should be getting the recognition they deserve."]]},"parts":[{"items":[{"t":"mc","q":"What do we learn about the translator mentioned in the first paragraph?","o":["He sent an article about a certain novelist to an important magazine.","His opinion of a certain novelist was shared by an important magazine.","He had worked with a certain novelist on translations of his novels."],"a":1},{"t":"mc","q":"When the translator looked closely at the article, ___.","o":["he did not mind the fact that his name did not appear","he was annoyed that some of the information was false","he felt that his own efforts had not been rewarded"],"a":2},{"t":"mc","q":"The writer says that the example of the article illustrates ___.","o":["something that literary translators should realize","a general attitude towards literary translators","a point often made by literary translators"],"a":1},{"t":"mc","q":"The writer says that readers of translated novels ___.","o":["would prefer to be reading the original work","assume that the translation is not as good as the original work","are sometimes unaware that it is a translation"],"a":0},{"t":"mc","q":"The writer says that readers ___.","o":["wish to know who the translator was","do not wish to know who the translator was","want to pay attention to what the translator has done"],"a":1},{"t":"mc","q":"The writer says that translators have become even more important in this global age because ___.","o":["there are fewer translators in the world","there aren’t many translators who can do a good job","more works of fiction are being translated in more languages"],"a":2},{"t":"mc","q":"When talking about the global age, the writer emphasizes ___.","o":["the variety of fiction now available to readers","the importance of fiction in comparison with other forms of literature","the number of readers who may read a particular work of fiction"],"a":0},{"t":"mc","q":"The writer uses the phrase ‘working heroically’ in the last paragraph in order to ___.","o":["describe how enjoyable translation work can be","make a joke about translators","express sympathy with translators"],"a":2},{"t":"mc","q":"What is the main topic of the article?","o":["Changing attitudes to translators","The importance of translators","What translators are trying to do"],"a":1},{"t":"mc","q":"Which of the following does the writer express in the article as a whole?","o":["Understanding of why translators do not receive recognition","Annoyance at the attitude of some readers","Doubts about the whole idea of reading translated novels"],"a":0}]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Write a review of a film or book for an online magazine. Write approximately 250 words.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about various books. Match the speakers (1–5) to what they say about the books (A–H).","legend":["I’m planning to read some more of it one day.","I felt it was the wrong time for me to read it.","I found it rather confusing.","I read it all in a short time.","I wouldn’t like it if I read it now.","The story was rather upsetting for me.","I benefited from studying it.","I found out that I didn’t need to read it."],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"D"},{"t":"match","q":"Speaker 2","a":"G"},{"t":"match","q":"Speaker 3","a":"B"},{"t":"match","q":"Speaker 4","a":"H"},{"t":"match","q":"Speaker 5","a":"F"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","A friend lent me a crime novel just before a long weekend. I only meant to read a chapter before bed, but I couldn't stop. I finished the whole thing by Saturday lunchtime, all four hundred pages. I hadn't done that since I was a teenager."],["Narrator","Speaker two."],["Speaker 2","We had to study a Shakespeare play for our final exams, and I groaned when I saw how long it was. But going through it line by line with our teacher really changed how I read. I learnt to notice how language works, and that helped me with every other subject too. I'm grateful we had to do it."],["Narrator","Speaker three."],["Speaker 3","I started a big Russian novel the summer my father was ill. Everyone said it was a masterpiece, and I'm sure it is, but I couldn't concentrate on it. My head was full of other things. I gave up after a hundred pages, and I think I'll try again one day when life is calmer."],["Narrator","Speaker four."],["Speaker 4","Our book club chose a five-hundred-page biography, and I dreaded it. I'd read about a third of it when I discovered the meeting had been cancelled and we were moving on to a different book. So all that effort turned out to be unnecessary. I haven't picked it up since."],["Narrator","Speaker five."],["Speaker 5","I read a novel about a family that loses everything in a war. It's beautifully written, but some of the things that happen to the children were really hard for me to read. A couple of times I had to put it down and go for a walk. I'm glad I read it, but it left me feeling quite shaken."]]}},{"instr":"Listen to a talk about the history of Muzak. Complete the sentences using no more than three words.","items":[{"t":"gap","q":"Muzak’s inventor developed it from work he had done on technology connected with {}.","a":[["telephone lines","telephone wires","phone lines"]],"list":true},{"t":"gap","q":"When radio became widespread, Muzak was no longer in demand in {}.","a":[["homes","people’s homes","the home","private homes"]],"list":true},{"t":"gap","q":"Muzak’s product for workplaces arranged music in order of how {} it was.","a":[["stimulating"]],"list":true},{"t":"gap","q":"Until 1968, all of Muzak’s music was played by the {} at the company.","a":[["in-house orchestra","house orchestra","company orchestra","orchestra"]],"list":true},{"t":"gap","q":"The company does not want to be known for producing {}.","a":[["elevator music","lift music"]],"list":true}],"audio":{"script":[["Speaker","Most people have heard background music in a shop or a lift, but few know where it came from. The company that made it famous, Muzak, was founded in the 1930s by an army officer called George Squier. He had been working on technology for sending signals along telephone lines, and he realized the same method could be used to deliver music."],["Speaker","At first, Muzak sold its service to private households. But when radio became widespread and almost every family owned one, nobody needed Muzak in their homes any more. So the company turned to businesses instead: restaurants, hotels, offices and factories."],["Speaker","For workplaces, Muzak developed a system called Stimulus Progression. The music in each fifteen-minute block was arranged in order of how stimulating it was, starting gently and becoming livelier, to keep workers alert when they usually felt tired."],["Speaker","For decades, the company recorded everything itself. Until 1968, all of Muzak's music was played by the in-house orchestra at the company, and the arrangements were deliberately smooth so that nothing would distract listeners."],["Speaker","Today the company uses original recordings by well-known artists, and it is keen to change its image. It does not want to be known for producing elevator music, the bland sound that so many people still associate with its name."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["Which noises annoy you the most?","When do you talk to strangers?","What kind of books interest you the most?","If you wrote a book, what kind of book would it be?","Is translating a book easy or hard? Why?"],"talk":["‘In modern life, it is very hard to get to know new people.’","‘It is best to read reviews of a book before buying it.’","‘You should always read the last page of the book first.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft04b","kind":"file","group":"ft04","ver":"B","title":"File 4 Test B","focus":"4A Books and film, 4B Sounds: speculation and deduction, adding emphasis (inversion), sounds and the human voice.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Complete the sentences often with strangers, is called small talk."},{"instr":"Complete the words in the sentences.","items":[{"t":"gap","q":"An <b>i</b>{} story is one that seems unlikely or difficult to believe.","a":[["implausible"]],"pre":["i"]},{"t":"gap","q":"A story that makes you cry or makes you feel strong emotion can be described as <b>m</b>{}.","a":[["moving"]],"pre":["m"]},{"t":"gap","q":"The film we watched last night was very <b>t</b>{}; we stayed up till 2 a.m. talking about it.","a":[["thought-provoking"]],"pre":["t"]},{"t":"gap","q":"My mum doesn’t like reading reviews before going to see a film. She says they are full of <b>s</b>{}.","a":[["spoilers"]],"pre":["s"]},{"t":"gap","q":"The book was very light and <b>e</b>{}, just what you want from a summer read.","a":[["entertaining"]],"pre":["e"]},{"t":"gap","q":"I really struggled to finish the book you lent me; it was so <b>h</b>{}.","a":[["heavy-going","heavy going"]],"pre":["h"]},{"t":"gap","q":"You have to read this novel! A <b>h</b>{} story that you won’t find easy to get out of your mind.","a":[["haunting"]],"pre":["h"]}],"ex":"A story that makes you feel sad is <b>d</b>epressing."}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"<b>b</b>arely","a":"sob","grp":null,"slot":0},{"t":"match","q":"hi<b>ss</b> <span class=\"hint\">(1 of 2)</span>","a":["smooth","whistle"],"grp":"snd7-2","slot":0},{"t":"match","q":"hi<b>ss</b> <span class=\"hint\">(2 of 2)</span>","a":["smooth","whistle"],"grp":"snd7-2","slot":1},{"t":"match","q":"<b>t</b>ick <span class=\"hint\">(1 of 2)</span>","a":["approached","vast"],"grp":"snd7-3","slot":0},{"t":"match","q":"<b>t</b>ick <span class=\"hint\">(2 of 2)</span>","a":["approached","vast"],"grp":"snd7-3","slot":1}],"ex":"bu<b>zz</b> → fees","bankHtml":["approach<b>ed</b>","fee<b>s</b>","<b>s</b>mooth","so<b>b</b>","vas<b>t</b>","whi<b>st</b>le"],"opts":["approached","fees","smooth","sob","vast","whistle"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["prox","im","i","ty"],"a":1,"word":"proximity"},{"t":"stress","w":["im","plau","si","ble"],"a":1,"word":"implausible"},{"t":"stress","w":["in","trigu","ing"],"a":1,"word":"intriguing"},{"t":"stress","w":["mere","ly"],"a":0,"word":"merely"},{"t":"stress","w":["con","tin","u","al","ly"],"a":1,"word":"continually"}],"ex":"child|care"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Lost In Translation?","paras":[["","There’s a well-known story in the world of literary translators about the translator who was thrilled to see his work appear at great length in an article in a prestigious magazine. He had translated a number of novels by a little-known Scandinavian novelist, who he believed had been neglected and not received the attention or praise he deserved. He had dedicated much of his working life to trying to get this novelist some recognition. The article agreed with his assessment of the novelist’s work and illustrated its view of his worth by quoting long passages from the translations. But something was missing. The translator searched in vain for a mention of his name. It didn’t appear anywhere. The translator’s joy at the coverage of his favourite author was considerably spoiled by this. He felt that he himself should have had some recognition in the article. The implication was that the translations had just appeared from nowhere, or even perhaps that the novelist had done them himself. It was as if the translator did not exist, and all the efforts he had made had never happened."],["","This incident raises a fundamental question about the status and function of the literary translator. Most people would agree that it was wrong of the magazine to omit any mention of the translator. However, it is also true that readers themselves operate in exactly the same way, and for them it is also as if the translator didn’t exist. When people read a translation of a novel, they want to feel they are reading what the novelist, and not someone else, wrote. They don’t want to be reminded that they are not reading, and would not be able to read, the original novel as created by the novelist. The translator has fulfilled a necessary function for them, but they do not wish to know who the translator was or pay any attention to what they have done. Readers are simply the receivers of what the translator does. So even though we might wish for direct contact with the novelist, we depend on the translator. In this global age, translators have become even more important. More and more works of fiction are being translated into more and more languages. Readers are now able to experience and understand other cultures more than ever through the reading of translated novels. The works of more and more novelists are now accessible to people in other parts of the world. This applies not only to new novels but also to fresh translations of old classics. The adventurous reader can now enjoy novels from many eras and many cultures that previously they would not have been able to."],["","And central to this is the translator, working heroically to come up with the translation that captures exactly what is in the original work, and often poorly paid. Although readers may be happy for them to remain obscure, perhaps they should be getting the recognition they deserve."]]},"parts":[{"items":[{"t":"mc","q":"What do we learn about the translator mentioned in the first paragraph?","o":["He sent an article about a certain novelist to an important magazine.","His opinion of a certain novelist was shared by an important magazine.","He had worked with a certain novelist on translations of his novels."],"a":1},{"t":"mc","q":"When the translator looked closely at the article, ___.","o":["he did not mind the fact that his name did not appear","he was annoyed that some of the information was false","he felt that his own efforts had not been rewarded"],"a":2},{"t":"mc","q":"The writer says that the example of the article illustrates ___.","o":["something that literary translators should realize","a general attitude towards literary translators","a point often made by literary translators"],"a":1},{"t":"mc","q":"The writer says that readers of translated novels ___.","o":["would prefer to be reading the original work","assume that the translation is not as good as the original work","are sometimes unaware that it is a translation"],"a":0},{"t":"mc","q":"The writer says that the readers ___.","o":["wish to know who the translator was","do not wish to know who the translator was","want to pay attention to what the translator has done"],"a":1},{"t":"mc","q":"The writer says that translators have become even more important in this global age because ___.","o":["there are fewer translators in the world","there aren’t many translators who can do a good job","more works of fiction are being translated in more languages"],"a":2},{"t":"mc","q":"When talking about the global age, the writer emphasizes ___.","o":["the variety of fiction now available to readers","the importance of fiction in comparison with other forms of literature","the number of readers who may read a particular work of fiction"],"a":0},{"t":"mc","q":"The writer uses the phrase ‘working heroically’ in the last paragraph in order to ___.","o":["describe how enjoyable translation work can be","make a joke about translators","express sympathy with translators"],"a":2},{"t":"mc","q":"What is the main topic of the article?","o":["Changing attitudes to translators","The importance of translators","What translators are trying to do"],"a":1},{"t":"mc","q":"Which of the following does the writer express in the article as a whole?","o":["Understanding of why translators do not receive recognition","Annoyance at the attitude of some readers","Doubts about the whole idea of reading translated novels"],"a":0}]}]},{"k":"w","name":"Writing","max":1  ten <b>q</b>{}!","a":[["quid"]],"pre":["q"]},{"t":"gap","q":"We were amazed when the <b>w</b>{} was read out and we learnt that our grandfather had left us all that money.","a":[["will"]],"pre":["w"]},{"t":"gap","q":"Our <b>st</b>{} of living has improved greatly since we both got new jobs in the IT sector.","a":[["standard"]],"pre":["st"]}],"ex":"It’s good to have some <b>s</b>avings – you never know when there’ll be an emergency and you’ll need some money."},{"instr":"Complete the time expressions in the sentences.","items":[{"t":"gap","q":"Time’s {}. The bell’s rung so we have to stop now.","a":[["up"]]},{"t":"gap","q":"It’s {} time things started to get better for Tony. He’s had some really bad luck recently.","a":[["about"]]},{"t":"gap","q":"We needn’t have worried because we made it to the wedding on time. In fact, we had time {}.","a":[["to spare"]]},{"t":"gap","q":"I know you’re {} time this evening, so I’ll pick up some Chinese or Indian takeaway for us on the way home. I’ll get some of that rice you like.","a":[["short of","pressed for","pushed for"]]},{"t":"gap","q":"It’s only a {} time before someone discovers that he’s stealing from his employer.","a":[["matter of"]]},{"t":"gap","q":"If you’ve got some time on {} this weekend, there’s a great exhibition at the National Art Gallery you might be interested in.","a":[["your hands"]]}],"ex":"We won’t be able to decorate the whole house in one weekend. Painting’s a very time-consuming job."}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"r<b>e</b>cent","a":"meantime","grp":null,"slot":0},{"t":"match","q":"m<b>e</b>ditation","a":"exercising","grp":null,"slot":0},{"t":"match","q":"f<b>o</b>cus <span class=\"hint\">(1 of 2)</span>","a":["process","trophy"],"grp":"snd7-3","slot":0},{"t":"match","q":"f<b>o</b>cus <span class=\"hint\">(2 of 2)</span>","a":["process","trophy"],"grp":"snd7-3","slot":1},{"t":"match","q":"c<b>o</b>nclude","a":"collide","grp":null,"slot":0}],"ex":"d<b>i</b>stance → risk","bankHtml":["c<b>o</b>llide","<b>e</b>xercising","m<b>e</b>antime","pr<b>o</b>cess","r<b>i</b>sk","tr<b>o</b>phy"],"opts":["collide","exercising","meantime","process","risk","trophy"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["de","ter","mined"],"a":1,"word":"determined"},{"t":"stress","w":["con","tent","ment"],"a":1,"word":"contentment"},{"t":"stress","w":["dis","tin","guish"],"a":1,"word":"distinguish"},{"t":"stress","w":["al","ter","na","tive"],"a":1,"word":"alternative"},{"t":"stress","w":["ex","ten","sion"],"a":1,"word":"extension"}],"ex":"time|table"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"A Study Of Multitasking","paras":[["","Technology increasingly makes it possible for people to do more than one task at a time, for example moving between browsing the web and using other computer programs, talking on mobile phones while driving, or flying a jet and monitoring air traffic. Indeed, the word describing this – ‘multitasking’ – has gone from being invented to being commonly used in everyday life in a remarkably short time. A recent study has looked at whether multitasking is purely beneficial or whether it has a downside, especially when the tasks being done together are complicated ones. The researchers concluded that when people are multitasking, they are using what they call ‘executive control’ processes. These processes concern different parts of the brain and involve the brain allocating different mental resources to different tasks and deciding which tasks are more important than others. The brain’s executive control gives the appropriate resources to the different aspects of tasks, such as understanding what the task requires, thinking about what to do, and taking action. The researchers conducted an experiment into how much time was lost when people repeatedly switched between two tasks. The tasks varied in terms of how complex they were and how familiar the subjects were with doing those tasks, and they included such things as solving mathematical problems and classifying geometric objects. The researchers measured how long it took the subjects to carry out the tasks and considered the speed in connection with whether the tasks were familiar or unfamiliar, and whether the rules for doing them were simple or complicated. The results of the experiments were the same for every kind of task. In each case, the subjects lost time when they moved from one task to another, and the amount of time they lost increased when the tasks were complex or unfamiliar. When they were familiar with a task, they were able to adapt to changing to it and get on with it much more quickly. The researchers say that these results indicate that the brain’s executive control consists of two separate stages. They called the first stage ‘goal shifting’, meaning a preference to do one of the tasks rather than the other at a particular moment. The second stage they named ‘rule activation’, meaning moving from engaging with the rules associated with how to go about one task to engaging with the rules involved in doing the other task. The second stage, rule activation, takes a significant amount of time, and this delay multiplies when people keep switching between tasks. The result is that quite a lot of time is lost"],["","when multitasking, in comparison with the time that would be taken if each task was completed separately."],["","This has major implications for multitasking, suggesting that although people may think that it saves time without affecting efficiency, in reality it actually takes more time, and this may have an adverse effect on efficiency. In the case of someone using a phone while driving, multitasking could mean that they are not in full control of their vehicle during the short period when they are switching to using the phone. The researchers feel that their research has important consequences for multitasking. Their conclusions regarding executive control and how it works may, they believe, help people to look for strategies that will enable them to operate in the most efficient way possible when they are multitasking. And an understanding of executive mental control could have an impact on the design of the technology involved in such areas as operating aircraft and air traffic control, as well as other activities where the interface between humans and computers is crucial to efficiency. In addition, there are other possible applications of this research. Understanding how people function while multitasking could assist with recruitment, training, and assessment of personnel in the workplace. It could also have an influence on government and industrial regulations, assist in the diagnosis and treatment of brain-damaged patients, and increase our general understanding of how the brain works."]]},"parts":[{"items":[{"t":"mc","q":"What does the writer suggest about the word ‘multitasking’?","o":["It has changed in meaning since it was invented.","It is not always used appropriately.","Its increased use reflects a change in everyday life."],"a":2},{"t":"mc","q":"The aim of the research was to ___.","o":["compare the advantages and disadvantages of multitasking","discover why multitasking is regarded as a wholly good thing","find out if there are any negative effects of multitasking"],"a":2},{"t":"mc","q":"The researchers use the term ‘executive control’ to describe how the brain ___.","o":["controls some actions more than others","organizes how different tasks are carried out","distinguishes between easier and harder tasks"],"a":1},{"t":"mc","q":"What do we learn about the experiment?","o":["The researchers knew that some of the subjects had done similar tasks before.","Not all of the subjects did the same tasks.","The subjects started with simple tasks and moved on to more complicated ones."],"a":0},{"t":"mc","q":"Which of the following happened during the experiment?","o":["Sometimes little time was lost moving from one task to another.","Some subjects always found it hard to move from one task to another.","Complex tasks presented more problems than unfamiliar tasks."],"a":0},{"t":"mc","q":"One of the two stages of the brain’s executive control ___.","o":["leads to a major disadvantage of multitasking","takes longer for some people than for others","has no connection with multitasking"],"a":0},{"t":"mc","q":"One of the implications of the research is that ___.","o":["some people are not suited to multitasking","multitasking always results in less efficiency","a common attitude to multitasking is wrong"],"a":2},{"t":"mc","q":"The researchers believe that their research might ___.","o":["encourage people not to do multitasking in some situations","affect the way that people approach multitasking","result in technology replacing people for certain tasks"],"a":1},{"t":"mc","q":"In the final paragraph, the writer says that multitasking is something that ___.","o":["is likely to increase in the future","people in authority have paid too little attention to","is relevant in many areas of life"],"a":2},{"t":"mc","q":"What is the main topic of the text?","o":["The growth of multitasking","How complicated the brain’s processes for multitasking are","The relationship between multitasking and efficiency"],"a":2}]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Write an article of approximately 250 words for an English-language magazine about how one of the areas below has changed in the last 20 years in your country and say whether you think the changes are positive or negative.</p>","<p>1 People’s work-life balance</p>","<p>2 Family life</p>","<p>3 How people spend their free time</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about the disadvantages of various jobs. Match the speakers (1–5) to their feelings about money (A–H).","legend":["the saver who wants to get as much as possible out of every pound spent","the professional who wants everyone to know how their money works","the budget-conscious person who wants to spend as little as possible regardless of quality","the person who recommends planning for what to do about money after finishing a career","the person who wants to start life without debt, but knows it’s not possible","the student who wants to know how to budget before leaving school","the person who doesn’t know where the money goes","the person who doesn’t understand why everyone is so anxious about money"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"G"},{"t":"match","q":"Speaker 2","a":"A"},{"t":"match","q":"Speaker 3","a":"E"},{"t":"match","q":"Speaker 4","a":"D"},{"t":"match","q":"Speaker 5","a":"H"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I earn a reasonable salary, I don't go on expensive holidays, and I don't buy designer clothes. And yet by the twentieth of every month my account is almost empty. I honestly couldn't tell you what I spend it on. I keep promising myself I'll write it all down, but I never do."],["Narrator","Speaker two."],["Speaker 2","I'm careful with money, but I'm not mean. I don't automatically buy the cheapest thing. I'll happily pay more for shoes if they'll last five years instead of one. What I want is real value: the most use I can get out of every pound I part with."],["Narrator","Speaker three."],["Speaker 3","I'm about to go to university, and I'd love to finish my degree without owing anyone anything. I've worked every summer since I was fifteen and saved most of it. But I've done the maths, and with fees and rent it's just not realistic. I'll have a loan like everyone else. I'll just try to keep it as small as I can."],["Narrator","Speaker four."],["Speaker 4","I've just retired after forty years as a teacher, and the one piece of advice I'd give younger colleagues is to think now about the years after work. Everyone plans their career, but very few people plan how they'll live once the salary stops. Start early and you'll be glad you did."],["Narrator","Speaker five."],["Speaker 5","My friends are always talking about prices, savings and interest rates, and some of them lose sleep over it. I find it a bit strange, to be honest. I pay my bills, I've got a little put aside, and I don't see the point of getting so stressed about it all. Life's too short."]]}},{"instr":"Listen to an interview about time management. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"What does Margaret Cooper do?","o":["She is a time management specialist with a university in the area.","She helps students by scheduling their work and free time for them.","She works at the local university helping students with their homework."],"a":0},{"t":"mc","q":"According to Margaret Cooper, what is the first step to good time management?","o":["Knowing what your priorities are for how you spend your time.","Keeping an organized planner or scheduler.","Knowing how you spend your time now."],"a":2},{"t":"mc","q":"Where do many students find something to help them schedule their time?","o":["In the back of their textbooks.","Right on their mobile phones.","On their laptops."],"a":1},{"t":"mc","q":"What is an example Cooper gives of something that should be a higher priority on a student’s planner?","o":["dating","parties","work schedule"],"a":2},{"t":"mc","q":"What does Cooper say is an added benefit of organizing one’s time?","o":["Students were able to enjoy their social time more.","Students were able to enjoy their video games more.","Students were able to enjoy their homework more."],"a":0}],"audio":{"script":[["Interviewer","With exams coming up, many students are feeling the pressure. With me is Margaret Cooper. Margaret, tell us what you do."],["Margaret","I'm a time management specialist, and I work for the university here in town. Students come to me when they're struggling to fit everything in. I don't do their homework, and I don't plan their week for them. I teach them how to do that themselves."],["Interviewer","So where should a student begin?"],["Margaret","Most people think the first step is buying a nice planner or deciding on their priorities. Those come later. The very first thing is to find out how you actually use your time at the moment. I ask students to keep a record for one week, every hour. They're always shocked by how much time disappears."],["Interviewer","And then they need some kind of schedule?"],["Margaret","Yes, but they don't need to buy anything. Most of them are carrying the perfect tool around already. Every smartphone has a calendar app. Students can set reminders and colour-code their week right there on their phones."],["Interviewer","How do they decide what goes in first?"],["Margaret","That's about priorities. Lectures and deadlines come first, obviously. But many students also have part-time jobs, and their shifts often get forgotten until the last minute. I tell them to put their work schedule in before anything else, before parties or dates or anything social."],["Interviewer","That sounds like it leaves very little time for fun."],["Margaret","Actually, the opposite happens. When students know their work is under control, they stop feeling guilty when they go out. Several told me they enjoyed time with their friends far more once they'd got organized, because they weren't worrying all evening about an essay."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["What would you most like to be able to buy?","Why is it important to keep a budget?","Which modern gadget is the most useful for you?","What kind of multitasking do you do?","How do people view money in your country?"],"talk":["‘Today, people are encouraged to be too materialistic.’","‘Technology has had a bad effect on communication between people.’","‘It’s important for me to save money for my retirement.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft05b","kind":"file","group":"ft05","ver":"B","title":"File 5 Test B","focus":"5A Time, 5B Money: distancing, unreal uses of past tenses, time and money.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Is the sentence right or wrong? Write correct or incorrect.","items":[{"t":"mc","q":"It has been announced that the company president is leaving next month.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"Apparently to the newspaper this morning, there were several robberies in the city last night.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"It is said that there are some animals that recognize themselves in the mirror.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"According to what I read on the internet, there will be a special election for mayor next month.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"There are thought being several ways to achieve lifelong happiness.","o":["correct","incorrect"],"a":1}]},{"instr":"Complete the sentences with the correct form of the verb in brackets.","items":[{"t":"gap","q":"If only you {} (not forget) to bring your wallet, we’d be able to buy a drink.","a":[["hadn’t forgotten"]]},{"t":"gap","q":"If only Stephen {} (be) a bit more reliable, then we wouldn’t have to wonder if the job is being done correctly.","a":[["were","was"]]},{"t":"gap","q":"I’d rather you {} (not call) my father. He’s probably not awake yet.","a":[["didn’t call"]]},{"t":"gap","q":"Don’t you think it’s time you {} (take) a holiday?","a":[["took"]]},{"t":"gap","q":"I wish I {} (know) the answer to your question.","a":[["knew"]]},{"t":"gap","q":"Would you rather we {} (go) to the park?","a":[["went"]]},{"t":"gap","q":"I wish I {} (able to) find a job closer to home.","a":[["were able to","was able to"]]}],"ex":"I think it’s ti
