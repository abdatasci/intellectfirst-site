[{"t":"gap","q":"Do you think it would be {}appropriate of me to buy them a little gift as a token of my appreciation?","a":[["in"]]},{"t":"gap","q":"Sally’s been {}mobile for months now. Haven’t you heard? She’s broken both her legs.","a":[["im"]]},{"t":"gap","q":"Let’s buy a few more of those chairs for the sun-room. They’re going to be {}continued soon.","a":[["dis"]]},{"t":"gap","q":"I honestly don’t know what we’ll do if Chloe leaves. As far as I’m concerned, she’s {}replaceable.","a":[["ir"]]},{"t":"gap","q":"It’s {}legal to record any part of the film on your phone when you’re in the cinema.","a":[["il"]]},{"t":"gap","q":"What I can tell you, {}officially of course, is that there may be some changes to the team soon.","a":[["un"]]}],"ex":"H elen had a major disagreement with her business partner and sold her share of the company."}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"miniat<b>ure</b> <span class=\"hint\">(1 of 2)</span>","a":["endure","treasure"],"grp":"snd7-1","slot":0},{"t":"match","q":"miniat<b>ure</b> <span class=\"hint\">(2 of 2)</span>","a":["endure","treasure"],"grp":"snd7-1","slot":1},{"t":"match","q":"sn<b>a</b>ke","a":"safety","grp":null,"slot":0},{"t":"match","q":"st<b>a</b>tistics <span class=\"hint\">(1 of 2)</span>","a":["abstract","probability"],"grp":"snd7-3","slot":0},{"t":"match","q":"st<b>a</b>tistics <span class=\"hint\">(2 of 2)</span>","a":["abstract","probability"],"grp":"snd7-3","slot":1}],"ex":"w<b>or</b>k → turnover","bankHtml":["<b>a</b>bstract","end<b>ure</b>","prob<b>a</b>bility","s<b>a</b>fety","treas<b>ure</b>","t<b>ur</b>nover"],"opts":["abstract","endure","probability","safety","treasure","turnover"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["su","per","vi","sor"],"a":0,"word":"supervisor"},{"t":"stress","w":["an","ti","bi","ot","ic"],"a":3,"word":"antibiotic"},{"t":"stress","w":["min","ia","ture"],"a":0,"word":"miniature"},{"t":"stress","w":["co","in","ci","dence"],"a":1,"word":"coincidence"},{"t":"stress","w":["ex","pe","di","tion"],"a":2,"word":"expedition"}],"ex":"time|table"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article about what makes good art and choose A, B, C, or D.","passage":{"title":"What makes good art?","paras":[["","If you’re a fan of art like I am, but often wondered how to tell a good painting from an average one, then help is at hand. Four experts tell us how to separate out the best art from the rest."],["A","For me, it’s when art has its own internal logic and you just know it when you see it. It is unique in conception and well-executed. I didn’t come to this realization overnight, however. It comes with experience and developing your eye, training it. While art has become, in the experimental 20th and 21st centuries, impossible to define – critics learnt long ago to stop being prescriptive, perhaps a little too well. Good visual art looks stunningly right and, in retrospect, obvious, or inevitable, yet it’s also continually surprising. It is a powerful paradox. How can someone have possibly made this? How in the world could it not have been made?"],["B","Reality is by agreement. The reality of art is usually by some kind of agreement. The arbiters are the museums, the museum curators, the people who spend their lives and their time actually being critical of what they see and judging what they see. If you add in four or five art critics who are then able to write about it, if you get four or five major collectors who are passionate about what they collect to patronize it, and several major auction houses to auction it, then a consensus or vetting process begins to unfold. Of course there’s magic dust involved, so this is not a sure way, but it’s a safe way to go about judging what is good art. It’s hard to answer the question ‘What makes good art?’ without stating something that appears pretentious. The perception of what makes art ‘good’ revolves around the application of that difficult word ‘taste’ which I observe to be in considerably short supply in society today."],["C","Quality, quality, quality. This is the mysterious and subjective key to good art. In all periods of art there are good and bad works of art. I find that defining quality in representational art is easier than in modern and abstract art. The other key word is looking. Everything looks good when you first start looking at art, as you have nothing to compare it to. As you hone your eye, you begin to discriminate between good and bad. The more you look at art, the easier it is to determine what is good and what is bad."],["","Also, there are two schools of thought as to what’s good and bad. Some people believe that good and bad are personal distinctions and entirely in the eye of the viewer. Others believe that there is good art and terrible art and no one can tell them otherwise. I think the real answer is somewhere in-between, and this is based entirely on the quality of the eye of the viewer."],["D","At its most fundamental level, good art is an effective combination of concept, vision, and mastery of medium (the ability to get the point across). Good art is also uncompromisingly honest, unselfconscious, bold, ambitious, enlightening, original, challenging, and a feast for the senses. It doesn’t necessarily have to have all of these qualities, but at the very least it has to keep you coming back for more...and never ever bore. What makes art good is when you see a piece from across the room, you immediately fall in love with it without knowing anything about it and are in love with it forever."]]},"parts":[{"instr":"Which expert:","items":[{"t":"match","q":"states that art, by its very nature, is a contradiction in terms.","a":"A"},{"t":"match","q":"believes that art may appeal to more than just an individual’s sight.","a":"D"},{"t":"match","q":"feels that the peculiarities of a piece constitute its superiority.","a":"A"},{"t":"match","q":"believes that commenting on a piece of art is not necessarily as simple as some experts would have us believe.","a":"C"},{"t":"match","q":"believes that style and good judgment are lacking among the general public.","a":"B"},{"t":"match","q":"acknowledges the limitations of characterizing art in modern times.","a":"A"},{"t":"match","q":"likens the emotion involved in discovering a piece of good art to experiencing feelings of tenderness.","a":"D"},{"t":"match","q":"believes the ability to distinguish between inferior and superior art comes with practice.","a":"C"},{"t":"match","q":"acknowledges the difficulty of defining art in a simple way.","a":"B"},{"t":"match","q":"points out that an appreciation of art is not a solitary affair.","a":"B"}],"opts":["A","B","C","D"]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>A British school would like to send some of its students on a cultural exchange trip to your country next summer. The students would like to spend some time with students at your language school. Write a report for the head of the British school giving information about your town / city; say why it is famous, what cultural activities it’s possible to do there, and also what people can do there in the evenings. Remember to include headings and write in an appropriate style. Write your report in 220–260 words.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to two people discussing a survey connected to the ‘nanny state’. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"What does the man say about the woman’s opinion of the ‘nanny state’?","o":["It may not be widely shared.","He used to agree with it.","It isn’t logical."],"a":0},{"t":"mc","q":"The man says that the survey indicates that most people ___.","o":["feel that there is no such thing as the ‘nanny state’","have changed their minds about the ‘nanny state’","want the government to tell them what to do on certain issues"],"a":2},{"t":"mc","q":"The woman believes that government action on various health issues ___.","o":["annoys a great many people","shows that the ‘nanny state’ can be a good thing","is the right thing for the government to do"],"a":2},{"t":"mc","q":"The woman thinks that the survey results ___.","o":["suggest that people have the wrong attitude","show that people have become very confused","do not indicate approval of the ‘nanny state’"],"a":2},{"t":"mc","q":"The woman says that the report in the paper ___.","o":["may change people’s view on the ‘nanny state’","has interpreted people’s opinions incorrectly","won’t be believed by most readers"],"a":1}],"audio":{"script":[["Man","Have you seen this survey about the 'nanny state'? You're always saying that people hate being told what to do by the government. But I'm not sure many people feel the way you do."],["Woman","Why, what does it say?"],["Man","Most of the people they asked actually want the government to tell them what to do on certain things, like food labelling, smoking in cars with children, and helmets for cyclists."],["Woman","Well, I don't object to those. Banning smoking in cars with children is just sensible. It protects people who can't protect themselves, and that's exactly what a government should be doing."],["Man","So you agree with the nanny state after all?"],["Woman","No, that's the point. Those aren't examples of a nanny state. A nanny state is when the government interferes in things that only affect you. Wanting a few sensible health laws doesn't mean people approve of that."],["Man","The newspaper says the survey proves people want more government control over their lives."],["Woman","Then the newspaper has got it wrong. People said yes to specific laws. The paper has taken those answers and turned them into something people never said."]]}},{"instr":"Listen to five people talking about their opinions of art. Match the speakers (1–5) to the opinions (A–H).","legend":["I can’t imagine what it would be like to be a performing artist.","Art is silly. I don’t know why people do it.","I think my friend is crazy trying to make a living off his art.","Art is something that should be enjoyed whenever possible.","Art is too ambiguous to enjoy fully.","I only like art because my significant other likes it.","I enjoy performing, rather than visual, arts.","Art is a really difficult profession to make a living from."],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"D"},{"t":"match","q":"Speaker 2","a":"F"},{"t":"match","q":"Speaker 3","a":"A"},{"t":"match","q":"Speaker 4","a":"H"},{"t":"match","q":"Speaker 5","a":"E"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","For me, art is one of life's great pleasures. Whenever I travel, the first thing I do is find the local gallery. Even at home I try to see an exhibition or a play every couple of weeks. Why wouldn't you take every chance to enjoy something so wonderful?"],["Narrator","Speaker two."],["Speaker 2","To be honest, I wouldn't go near a gallery if it weren't for my wife. She's the art lover. I go along because she enjoys it so much, and I've grown to quite like it, but only because she's there explaining everything."],["Narrator","Speaker three."],["Speaker 3","My sister's a ballet dancer, and I've watched her perform many times. I honestly have no idea how she does it, walking out in front of two thousand people and being judged on every move. I can't even picture myself on a stage. Just the thought of it makes me feel sick."],["Narrator","Speaker four."],["Speaker 4","I studied fine art and I still paint, but I work in a bank. Very few artists earn enough to pay the rent from their work alone. Galleries take a huge commission and sales are unpredictable. Most of my old classmates have given up or have second jobs."],["Narrator","Speaker five."],["Speaker 5","I do go to exhibitions, but I often come away frustrated. With a lot of modern art, I can't tell what it's supposed to mean, and the labels don't help. I need to know what I'm looking at to really appreciate it. When it's that open to interpretation, I can't fully enjoy it."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["What aspect of life requires more laws than there are?","Which laws do people most commonly disobey?","What’s your opinion of modern art?","What is your favourite piece of art?","Are there any laws that should be stricter?"],"talk":["‘Too many things are banned these days.’","‘Government money should be used to support artists.’","‘The government should control people’s use of cars in order to improve the environment.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft08a","kind":"file","group":"ft08","ver":"A","title":"File 8 Test A","focus":"8A Health, 8B Travel: gerunds and infinitives, expressing future plans and arrangements, health and medicine, travel.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Complete the sentences with the gerund or the infinitive form of the verb in brackets.","items":[{"t":"gap","q":"Our piano needs {} (be) repaired because the movers dropped it.","a":[["to be"]]},{"t":"gap","q":"We would rather {} (have) gone to Germany for Christmas.","a":[["have"]]},{"t":"gap","q":"I thanked your parents for {} (have) helped me when I was in trouble.","a":[["having"]]},{"t":"gap","q":"I’d like {} (be) sitting in a café in Thailand right now.","a":[["to be"]]},{"t":"gap","q":"By the time I’m 40, I hope {} (have) started my own company.","a":[["to have"]]},{"t":"gap","q":"I’m tired of {} (be) told to wait. I’ve been standing here for three hours already!","a":[["being"]]},{"t":"gap","q":"I had to ask for help. I didn’t know what {} (do).","a":[["to do"]]},{"t":"gap","q":"There isn’t enough milk {} (make) a banana milkshake.","a":[["to make"]]}],"ex":"It’s no use worrying (worry). You’ll just have to wait and see what happens."},{"instr":"Underline the correct word(s).","items":[{"t":"pick","q":"The team [is due to|due] arrive at six o’clock.","a":"is due to"},{"t":"pick","q":"Bob’s [will go|going] to New York next week.","a":"going"},{"t":"pick","q":"[Will|Are] we be meeting outside the cinema?","a":"Will"},{"t":"pick","q":"I’m about [going|to go] to the shop. Do we need more milk?","a":"to go"},{"t":"pick","q":"We [’re move|move] into our new flat next month.","a":"move"},{"t":"pick","q":"You’re going [getting|to get] a new car next year, aren’t you?","a":"to get"},{"t":"pick","q":"I’m [to|about to] go for lunch. Would you like to join me?","a":"about to"}],"ex":"My bus to leave / leaves in five minutes."},{"instr":"Is the sentence right or wrong? Write correct or incorrect.","items":[{"t":"mc","q":"My parents are due to arrive at 7.00 tonight. Can you help me clean?","o":["correct","incorrect"],"a":0},{"t":"mc","q":"We’re to be make sure he’s there on time because he’s usually late.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"My sister-in-law is about to have a baby, so my brother is very nervous.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"Will we be eating at the usual time? Your brother wants to know.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"The Prime Minister is going open the new shopping centre here on Saturday.","o":["correct","incorrect"],"a":1}],"ex":"I see some friends after class tonight.  incorrect"}]},{"k":"v","name":"Vocabulary","max":20,"w":1,"parts":[{"instr":"Underline the odd word(s) out.","items":[{"t":"mc","q":"","o":["a bruise","a surgeon","a blister","a rash"],"a":1},{"t":"mc","q":"","o":["a cold","flu","asthma","a bandage"],"a":3},{"t":"mc","q":"","o":["ineffective","mainstream","unproven","useless"],"a":1},{"t":"mc","q":"","o":["a rip-off","an X-ray","antibiotics","stitches"],"a":0},{"t":"mc","q":"","o":["mild","severe","real","prematurely"],"a":3},{"t":"mc","q":"","o":["across","through","on top of","put"],"a":3},{"t":"mc","q":"","o":["breathtaking","dull","spoiled","overcrowded"],"a":0},{"t":"mc","q":"","o":["delay","postpone","cancel","put off"],"a":2}],"ex":"hailstorm  flood  drought  mild"},{"instr":"Complete the words in the sentences.","items":[{"t":"gap","q":"If you go on a <b>l</b>{}-haul flight, you should stretch and get up and move around as often as possible.","a":[["long"]],"pre":["l"]},{"t":"gap","q":"Don’t forget to <b>t</b>{} out travel insurance before you set off.","a":[["take"]],"pre":["t"]},{"t":"gap","q":"I really like to get off the beaten <b>t</b>{} when I go on holiday.","a":[["track"]],"pre":["t"]},{"t":"gap","q":"I don’t like holidays where the beaches are <b>o</b>{}. I like to be by myself on the beach.","a":[["overcrowded"]],"pre":["o"]},{"t":"gap","q":"She wants to take photos of <b>p</b>{} scenery on her next holiday, so she’s going to the Lake District.","a":[["picturesque"]],"pre":["p"]},{"t":"gap","q":"Sam and his wife disagree on what their next holiday should be; he thinks her ideas are too <b>d</b>{} and lack excitement.","a":[["dull"]],"pre":["d"]}],"ex":"We went on a <b>p</b>ackage holiday to Greece last year."},{"instr":"Complete the sentences with one word.","items":[{"t":"gap","q":"My grandmother is as {} as a post. We always have to shout when she’s around.","a":[["deaf"]]},{"t":"gap","q":"I hope this solution to the problem works like a {}. We don’t have time to mess around.","a":[["charm"]]},{"t":"gap","q":"She turned as white as a {} just before she fainted.","a":[["ghost"]]},{"t":"gap","q":"Without my contact lenses, I’m as blind as a {}.","a":[["bat"]]},{"t":"gap","q":"Go for it, little one! Quick as a {}!","a":[["flash"]]},{"t":"gap","q":"My uncle drinks like a {}. I wish he’d stop.","a":[["fish"]]}],"ex":"She can be as stubborn as a mule. I can never convince her of anything."}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"<b>u</b>p <span class=\"hint\">(1 of 2)</span>","a":["acupuncture","stub"],"grp":"snd7-1","slot":0},{"t":"match","q":"<b>u</b>p <span class=\"hint\">(2 of 2)</span>","a":["acupuncture","stub"],"grp":"snd7-1","slot":1},{"t":"match","q":"<b>a</b>long <span class=\"hint\">(1 of 2)</span>","a":["reflexology","upon"],"grp":"snd7-2","slot":0},{"t":"match","q":"<b>a</b>long <span class=\"hint\">(2 of 2)</span>","a":["reflexology","upon"],"grp":"snd7-2","slot":1},{"t":"match","q":"deval<b>ue</b>d","a":"useless","grp":null,"slot":0}],"ex":"p<b>u</b>t → pull","bankHtml":["acup<b>u</b>ncture","p<b>u</b>ll","reflexol<b>o</b>gy","st<b>u</b>b","<b>u</b>pon","<b>u</b>seless"],"opts":["acupuncture","pull","reflexology","stub","upon","useless"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["be","low"],"a":1,"word":"below"},{"t":"stress","w":["a","round"],"a":1,"word":"around"},{"t":"stress","w":["ban","dage"],"a":0,"word":"bandage"},{"t":"stress","w":["vi","rus"],"a":0,"word":"virus"},{"t":"stress","w":["sys","tem"],"a":0,"word":"system"}],"ex":"con|ven|tional"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Does Complementary And Alternative Medicine Work?","paras":[["","The main point made by people who dismiss Complementary and Alternative Medicine (CAM) as a pointless waste of time and money is that there is no scientific evidence whatsoever that it works. For conventional medicine there is, of course, an enormous amount of scientific research to back up the effectiveness of medical treatments. This is because of the fundamental difference between conventional medicine and CAM. Conventional medicine regards the body as a complex and sophisticated machine and illness as a breakdown of one or more parts of the machine. Its aim is to get the machine working properly again by removing the problem parts or treating them so that they return to working order. CAM, in the form of such things as homeopathy, acupuncture, and medical herbalism, regards illness as a breakdown of the body’s natural healing systems. It believes that there is a natural, non-physical force in all of us that enables the body to heal itself and its aim is to make that force powerful enough to overcome illness and restore health."],["","This natural, non-physical force, however, cannot be detected using the usual scientific techniques. So it is impossible to prove its existence scientifically, and this has led some people to reject the whole idea of CAM. With conventional medicine, we can test scientifically whether treatments have an effect on the body by looking for changes in the body’s cells, nerves, organs, and systems as a result of treatment. With CAM, we cannot prove whether or not the natural force for restoring health exists."],["","However, it is possible to see what effects CAM treatments have had on the cells and structures of the body in order to assess their effectiveness."],["","One example of scientific evidence for the effectiveness of CAM treatments is a study which showed that homeopathic medicine had an effect on the brain activity of sufferers of fibromyalgia, a painful muscle disorder. Research also indicated that acupuncture was effective in the treatment of patients suffering from Crohn’s disease, a painful disorder of the digestive system. Tests on their digestive systems showed that they had less inflammation after acupuncture treatment. Another study concerned the highly diluted solutions used in homeopathic medicines. Sceptics claim that these cannot possibly have any effect because they are so diluted and little or nothing of the original substance remains. But a study showed that"],["","ultra-high dilutions of histamine (a protein involved in allergies) have an influence on cell activity in the body. One of the most common tools of conventional medical research is a test called an RCT. This is a comparative test to discover the effectiveness of, for example, a new drug. Some subjects are given the drug and others are given a dummy pill. The subjects do not know whether they have taken a real pill or a dummy one, known as a placebo. Researchers then look at whether the people who took the real pill showed more improvement than the people who took the dummy pill, or placebo. The same kind of test is also carried out for CAM treatments, and it seems an obvious thing to do in order to get evidence of their effectiveness. However, a number of CAM practitioners feel that these RCT tests are not appropriate for CAM treatments. This is for two reasons."],["","Firstly, they say, this is because CAM therapies are entirely focused on each individual as a separate case. Treatment isn’t dictated by the specific medical problem the patient is suffering from, but by the need to restore to full power that individual’s natural force for maintaining health. So the result of an RCT test for one person may be wholly different for another, meaning that no general conclusion could be drawn about a particular treatment. Secondly, the practitioners say, a key factor in CAM treatments is the relationship between the patient and the practitioner. Many people, especially those with severe or long-standing medical problems, opt for CAM treatments because they do not want to take drugs for a long time or because they do not have faith in conventional medicine to improve their condition. Some of these people may feel that they get benefits from CAM treatments and from their consultations with CAM practitioners, even if the treatments do not work for their original problem. So CAM treatments may be beneficial in ways that RCT tests would not reveal. Some patients, for example, say that they prefer the holistic approach of CAM and feel that the decisions about treatment give them greater control over their own lives than conventional medicine. They like the feeling that they are taking personal responsibility for their own health."]]},"parts":[{"items":[{"t":"mc","q":"The writer says in the first paragraph that criticism of CAM is ___.","o":["based on ignorance","understandable","increasing"],"a":1},{"t":"mc","q":"The writer says that the difference between CAM and conventional medicine ___.","o":["is a very great one","is not as great as people may think","is greater in some forms of CAM than others"],"a":0},{"t":"mc","q":"The writer’s point in the second paragraph is that ___.","o":["you can’t prove that CAM treatments have had any effect","you can’t prove that the main principle of CAM is true","you can’t use the same tests for CAM and conventional medicine"],"a":1},{"t":"mc","q":"The writer uses fibromyalgia and Crohn’s disease as examples of ___.","o":["conditions that don’t respond to conventional medicine","conditions that CAM has been shown to improve","how different kinds of CAM treatment can be compared"],"a":1},{"t":"mc","q":"The study of highly diluted solutions ___.","o":["disproved a common criticism of homeopathy","provided different results from previous studies of them","showed that some solutions are more effective than others"],"a":0},{"t":"mc","q":"When describing what RCT tests involve, the writer says that ___.","o":["some people disapprove of their use in conventional medicine","they have proved the effectiveness of some CAM treatments","they appear suitable for testing CAM treatments"],"a":2},{"t":"mc","q":"The first objection to the use of RCT tests for CAM treatments is that ___.","o":["the tests do not work for certain medical problems","tests on a single individual may produce very different results","the tests do not produce a consistent pattern of results"],"a":2},{"t":"mc","q":"The writer says in the last paragraph that the attitude of patients to CAM treatments ___.","o":["depends entirely on whether the treatments are effective or not","is not necessarily connected with whether the treatments are effective or not","may make them think tha l abroad needs a good relationship with the town council and officials, and that depends on understanding how things are done locally."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["Which part of the world would you most like to visit?","Which place in your own country would you most recommend to visitors?","Have you ever used alternative medicine?","How healthy is your lifestyle?","What causes people to use alternative medicine?"],"talk":["‘Tourism does more harm than good.’","‘I would use alternative medicine if modern medicine didn’t work.’","‘It is very hard to have a healthy lifestyle in the modern world.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft08b","kind":"file","group":"ft08","ver":"B","title":"File 8 Test B","focus":"8A Health, 8B Travel: gerunds and infinitives, expressing future plans and arrangements, health and medicine, travel.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Underline the correct word(s).","items":[{"t":"pick","q":"I’m about [going|to go] to the store. Do we need more milk?","a":"to go"},{"t":"pick","q":"Bob’s [will go|going] to New York next week.","a":"going"},{"t":"pick","q":"[Will|Are] we be meeting outside the cinema?","a":"Will"},{"t":"pick","q":"The team [is due to|due] arrive at six o’clock.","a":"is due to"},{"t":"pick","q":"I’m [to|about to] go for lunch. Would you like to join me?","a":"about to"},{"t":"pick","q":"You’re going [getting|to get] a new car next year, aren’t you?","a":"to get"},{"t":"pick","q":"We [’re move|move] into our new flat next month.","a":"move"}],"ex":"My bus to leave / leaves in five minutes."},{"instr":"Is the sentence right or wrong? Write correct or incorrect.","items":[{"t":"mc","q":"My parents are due to arrive at 7.00 tonight. Can you help me clean?","o":["correct","incorrect"],"a":0},{"t":"mc","q":"We’re to be make sure he’s there on time because he’s usually late.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"My sister-in-law is about to have a baby, so my brother is very nervous.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"The Prime Minister is going open the new shopping centre here on Saturday.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"Will we be eating at the usual time? Your brother wants to know.","o":["correct","incorrect"],"a":0}],"ex":"I see some friends after class tonight.  incorrect"},{"instr":"Complete the sentences with the gerund or the infinitive form of the verb in brackets.","items":[{"t":"gap","q":"Our piano needs {} (be) repaired because the movers dropped it.","a":[["to be"]]},{"t":"gap","q":"I’d like {} (be) sitting in a café in Thailand right now.","a":[["to be"]]},{"t":"gap","q":"I thanked your parents for {} (have) helped me when I was in trouble.","a":[["having"]]},{"t":"gap","q":"We would rather {} (have) gone to Germany for Christmas.","a":[["have"]]},{"t":"gap","q":"By the time I’m 40, I hope {} (have) started my own company.","a":[["to have"]]},{"t":"gap","q":"There isn’t enough milk {} (make) a banana milkshake.","a":[["to make"]]},{"t":"gap","q":"I’m tired of {} (be) told to wait. I’ve been standing here for three hours already!","a":[["being"]]},{"t":"gap","q":"I had to ask for help. I didn’t know what {} (do).","a":[["to do"]]}],"ex":"It’s no use worrying (worry). You’ll just have to wait and see what happens."}]},{"k":"v","name":"Vocabulary","max":20,"w":1,"parts":[{"instr":"Underline the odd word(s) out.","items":[{"t":"mc","q":"","o":["mild","severe","real","prematurely"],"a":3},{"t":"mc","q":"","o":["a cold","flu","asthma","a bandage"],"a":3},{"t":"mc","q":"","o":["ineffective","mainstream","unproven","useless"],"a":1},{"t":"mc","q":"","o":["across","through","on top of","put"],"a":3},{"t":"mc","q":"","o":["a bruise","a surgeon","a blister","a rash"],"a":1},{"t":"mc","q":"","o":["a rip-off","an X-ray","antibiotics","stitches"],"a":0},{"t":"mc","q":"","o":["breathtaking","dull","spoiled","overcrowded"],"a":0},{"t":"mc","q":"","o":["delay","postpone","cancel","put off"],"a":2}],"ex":"hailstorm  flood  drought  mild"},{"instr":"Complete the words in the sentences.","items":[{"t":"gap","q":"If you go on a <b>l</b>{}-haul flight, you should stretch and get up and move around as often as possible.","a":[["long"]],"pre":["l"]},{"t":"gap","q":"Don’t forget to <b>t</b>{} out travel insurance before you set off.","a":[["take"]],"pre":["t"]},{"t":"gap","q":"Sam and his wife disagree on what their next holiday should be; he thinks her ideas are too <b>d</b>{} and lack excitement.","a":[["dull"]],"pre":["d"]},{"t":"gap","q":"I don’t like holidays where the beaches are <b>o</b>{}. I like to be by myself on the beach.","a":[["overcrowded"]],"pre":["o"]},{"t":"gap","q":"She wants to take photos of <b>p</b>{} scenery on her next holiday, so she’s going to the Lake District.","a":[["picturesque"]],"pre":["p"]},{"t":"gap","q":"I really like to get off the beaten <b>t</b>{} when I go on holiday.","a":[["track"]],"pre":["t"]}],"ex":"We went on a <b>p</b>ackage holiday to Greece last year."},{"instr":"Complete the sentences with one word.","items":[{"t":"gap","q":"Without my contact lenses, I’m as blind as a {}.","a":[["bat"]]},{"t":"gap","q":"I hope this solution to the problem works like a {}. We don’t have time to mess around.","a":[["charm"]]},{"t":"gap","q":"She turned as white as a {} just before she fainted.","a":[["ghost"]]},{"t":"gap","q":"My grandmother is as {} as a post. We always have to shout when she’s around.","a":[["deaf"]]},{"t":"gap","q":"My uncle drinks like a {}. I wish he’d stop.","a":[["fish"]]},{"t":"gap","q":"Go for it, little one! Quick as a {}!","a":[["flash"]]}],"ex":"She can be as stubborn as a mule. I can never convince her of anything."}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"deval<b>ue</b>d","a":"useless","grp":null,"slot":0},{"t":"match","q":"<b>a</b>long <span class=\"hint\">(1 of 2)</span>","a":["upon","reflexology"],"grp":"snd7-2","slot":0},{"t":"match","q":"<b>a</b>long <span class=\"hint\">(2 of 2)</span>","a":["upon","reflexology"],"grp":"snd7-2","slot":1},{"t":"match","q":"<b>u</b>p <span class=\"hint\">(1 of 2)</span>","a":["stub","acupuncture"],"grp":"snd7-3","slot":0},{"t":"match","q":"<b>u</b>p <span class=\"hint\">(2 of 2)</span>","a":["stub","acupuncture"],"grp":"snd7-3","slot":1}],"ex":"p<b>u</b>t → pull","bankHtml":["acup<b>u</b>ncture","p<b>u</b>ll","reflexol<b>o</b>gy","st<b>u</b>b","<b>u</b>pon","<b>u</b>seless"],"opts":["acupuncture","pull","reflexology","stub","upon","useless"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["ban","dage"],"a":0,"word":"bandage"},{"t":"stress","w":["a","round"],"a":1,"word":"around"},{"t":"stress","w":["be","low"],"a":1,"word":"below"},{"t":"stress","w":["vi","rus"],"a":0,"word":"virus"},{"t":"stress","w":["sys","tem"],"a":0,"word":"system"}],"ex":"con|ven|tional"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Does Complementary And Alternative Medicine Work?","paras":[["","The main point made by people who dismiss Complementary and Alternative Medicine (CAM) as a pointless waste of time and money is that there is no scientific evidence whatsoever that it works. For conventional medicine there is, of course, an enormous amount of scientific research to back up the effectiveness of medical treatments. This is because of the fundamental difference between conventional medicine and CAM. Conventional medicine regards the body as a complex and sophisticated machine and illness as a breakdown of one or more parts of the machine. Its aim is to get the machine working properly again by removing the problem parts or treating them so that they return to working order. CAM, in the form of such things as homeopathy, acupuncture, and medical herbalism, regards illness as a breakdown of the body’s natural healing systems. It believes that there is a natural, non-physical force in all of us that enables the body to heal itself and its aim is to make that force powerful enough to overcome illness and restore health."],["","This natural, non-physical force, however, cannot be detected using the usual scientific techniques. So it is impossible to prove its existence scientifically, and this has led some people to reject the whole idea of CAM. With conventional medicine, we can test scientifically whether treatments have an effect on the body by looking for changes in the body’s cells, nerves, organs, and systems as a result of treatment. With CAM, we cannot prove whether or not the natural force for restoring health exists."],["","However, it is possible to see what effects CAM treatments have had on the cells and structures of the body in order to assess their effectiveness."],["","One example of scientific evidence for the effectiveness of CAM treatments is a study which showed that homeopathic medicine had an effect on the brain activity of sufferers of fibromyalgia, a painful muscle disorder. Research also indicated that acupuncture was effective in the treatment of patients suffering from Crohn’s disease, a painful disorder of the digestive system. Tests on their digestive systems showed that they had less inflammation after acupuncture treatment. Another study concerned the highly diluted solutions used in homeopathic medicines. Sceptics claim that these cannot possibly have any effect because they are so diluted and little or nothing of the original substance remains. But a study showed that"],["","ultra-high dilutions of histamine (a protein involved in allergies) have an influence on cell activity in the body. One of the most common tools of conventional medical research is a test called an RCT. This is a comparative test to discover the effectiveness of, for example, a new drug. Some subjects are given the drug and others are given a dummy pill. The subjects do not know whether they have taken a real pill or a dummy one, known as a placebo. Researchers then look at whether the people who took the real pill showed more improvement than the people who took the dummy pill, or placebo. The same kind of test is also carried out for CAM treatments, and it seems an obvious thing to do in order to get evidence of their effectiveness. However, a number of CAM practitioners feel that these RCT tests are not appropriate for CAM treatments. This is for two reasons."],["","Firstly, they say, this is because CAM therapies are entirely focused on each individual as a separate case. Treatment isn’t dictated by the specific medical problem the patient is suffering from, but by the need to restore to full power that individual’s natural force for maintaining health. So the result of an RCT test for one person may be wholly different for another, meaning that no general conclusion could be drawn about a particular treatment. Secondly, the practitioners say, a key factor in CAM treatments is the relationship between the patient and the practitioner. Many people, especially those with severe or long-standing medical problems, opt for CAM treatments because they do not want to take drugs for a long time or because they do not have faith in conventional medicine to improve their condition. Some of these people may feel that they get benefits from CAM treatments and from their consultations with CAM practitioners, even if the treatments do not work for their original problem. So CAM treatments may be beneficial in ways that RCT tests would not reveal. Some patients, for example, say that they prefer the holistic approach of CAM and feel that the decisions about treatment give them greater control over their own lives than conventional medicine. They like the feeling that they are taking personal responsibility for their own health."]]},"parts":[{"items":[{"t":"mc","q":"The writer says in e <b>ch</b>{} parsley before he sent it out with the waiter.","a":[["chopped"]],"pre":["ch"]},{"t":"gap","q":"My mum used to have her coffee with <b>wh</b>{} cream on top. It looked fabulous, but it must have tasted very rich.","a":[["whipped"]],"pre":["wh"]},{"t":"gap","q":"When you don’t know how to cook, even choosing the right <b>u</b>{} is a difficult task.","a":[["utensils"]],"pre":["u"]},{"t":"gap","q":"Tim’s brownies are delicious. They taste very <b>ch</b>{}.","a":[["chocolatey","chocolaty"]],"pre":["ch"]}],"ex":"A light dish served at the beginning of a meal is called a <b>s</b>tarter."}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"w<b>i</b>ngs","a":"spit","grp":null,"slot":0},{"t":"match","q":"b<b>ea</b>k","a":"peeled","grp":null,"slot":0},{"t":"match","q":"gr<b>a</b>ted <span class=\"hint\">(1 of 2)</span>","a":["drain","potato"],"grp":"snd7-3","slot":0},{"t":"match","q":"gr<b>a</b>ted <span class=\"hint\">(2 of 2)</span>","a":["drain","potato"],"grp":"snd7-3","slot":1},{"t":"match","q":"h<b>er</b>bs","a":"fur","grp":null,"slot":0}],"ex":"st<b>i</b>ng → kick","bankHtml":["dr<b>ai</b>n","f<b>ur</b>","k<b>i</b>ck","p<b>ee</b>led","pot<b>a</b>to","sp<b>i</b>t"],"opts":["drain","fur","kick","peeled","potato","spit"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["shell","fish"],"a":0,"word":"shellfish"},{"t":"stress","w":["scram","bled"],"a":0,"word":"scrambled"},{"t":"stress","w":["po","ta","to"],"a":1,"word":"potato"},{"t":"stress","w":["ba","king"],"a":0,"word":"baking"},{"t":"stress","w":["sand","wich"],"a":0,"word":"sandwich"}],"ex":"con|ven|tional"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Learning About Animals At School","paras":[["","How do children learn about wildlife? And is what they learn the sort of thing they should be learning? It is my belief that children should not just be acquiring knowledge of animals, but also developing attitudes and feelings towards them based on exposure to the real lives of animals in their natural habitats. But is this happening?"],["","Some research in this area indicates that it is not. Learning about animals in school is often completely disconnected from the real lives of real animals, with the result that children often end up with little or no understanding or lasting knowledge of them. They learn factual information about animals, aimed at enabling them to identify them and have various abstract ideas about them, but that is the extent of their learning. Children’s storybooks tend to personify animals as characters rather than teach about them. For direct contact with wild and international animals, the only opportunity most children have is visiting a zoo. The educational benefit of this for children is often given as the main reason for doing it, but research has shown that zoo visits seldom add to children’s knowledge of animals – the animals are simply like exhibits in a museum that the children look at without engaging with them as living creatures. Children who belong to wildlife or environmental organizations or who watch wildlife TV programmes, however, show significantly higher knowledge than any other group of children studied in research. The studies show that if children learn about animals in their natural habitats, particularly through wildlife-based activities, they know more about them than they do as a result of visiting zoos or learning about them in the classroom."],["","Research has also been done into the attitudes of children towards animals. It shows that in general terms, children form strong attachments to individual animals, usually their pets, but do not have strong feelings for animals in general. This attitude is the norm regardless of the amount or kind of learning about animals they have at school. However, those children who watch TV wildlife programmes show an interest in and affection for wildlife in its natural environment, and their regard for animals in general is higher. However, there is evidence that all of this is changing, and changing fast. The advent of the computer and interactive multimedia instruction in schools is changing the way that children learn about and perceive animals. The inclusion of pictures and audio enables children to look at and hear an"],["","animal at the same time. There is evidence that children recall more when they have learnt about animals in this way, and furthermore, this is the case whether the animal is one they were previously familiar or unfamiliar with."],["","Interactive multimedia instruction has opened up a whole new world of learning about animals. It has made it possible to educate children about wildlife beyond simple facts and to inspire in children an understanding of their real lives and affection and respect for them. This is particularly important in modern urban life, where children’s only direct experience of animals is likely to be with domestic pets. Without first-hand experiences of wildlife, children need other ways of gaining an appreciation of and respect for animals. Previously, only the minority of children who belonged to wildlife organizations or watched TV wildlife programmes developed this attitude. Now, computer technology is transforming the way children gain knowledge of wildlife. Games, stories, audio recordings, photographs, films, and spoken narration all combine in multimedia form to present animals as real living creatures, as well as providing factual information about them."],["","In this way, children can appreciate the unique qualities of different animals and engage with wildlife in a more personal way than in the past. This is important, because what happens to the world’s wildlife will depend, to at least some extent, on the attitudes towards animals that people acquire as children. If they learn about them as real, living creatures in their natural habitats, they are more likely to have respect for them and to be concerned about their treatment when they are older."]]},"parts":[{"items":[{"t":"mc","q":"What issue does the writer raise in the first paragraph?","o":["The outcome of what children learn about animals.","The amount of learning about animals that children do.","The level of interest that children have in learning about animals."],"a":0},{"t":"mc","q":"What opinion does the writer express in the second paragraph?","o":["Children’s learning about animals at school has the wrong emphasis.","What children learn about animals at school is often inaccurate.","Children’s storybooks are an effective way of teaching them about animals."],"a":0},{"t":"mc","q":"What does the writer say about zoo visits?","o":["Children don’t enjoy them as much as adults think they do.","They have less educational benefit than they are believed to have.","They can be upsetting for some children."],"a":1},{"t":"mc","q":"What does the writer say about learning about animals in their natural habitats?","o":["It is very difficult for most children to do this.","It teaches children more about animals than other methods.","It requires a lot of effort from children."],"a":1},{"t":"mc","q":"Research shows that children’s attitudes to animals ___.","o":["differ from what adults might expect them to be","depend on whether or not they have pets","are not affected by what they learn about them at school"],"a":2},{"t":"mc","q":"The writer says that the use of interactive multimedia instruction ___.","o":["is most effective for teaching about animals children know nothing about","increases the amount that children can remember after lessons","works better for some children than for others"],"a":1},{"t":"mc","q":"The writer says that in modern urban life, interactive multimedia instruction ___.","o":["is a good substitute for direct contact with wildlife","is particularly effective for children who do not have pets","can relate the lives of animals to children’s own lives"],"a":0},{"t":"mc","q":"What does the writer say about children who watch TV wildlife programmes?","o":["They are very fond of interactive multimedia instruction about animals.","They no longer know more about animals than other children.","There are now more of them because of interactive multimedia instruction."],"a":1},{"t":"mc","q":"The writer says in the last paragraph that what children learn about animals at school ___.","o":["has an effect on how their personalities develop","may change as they get older","will have some effect on attitudes to wildlife in the future"],"a":2},{"t":"mc","q":"The writer’s main point in the text as a whole is that ___.","o":["children should learn about how animals really live","children enjoy learning about animals with interactive multimedia instruction","some children are much more interested in animals than others"],"a":0}]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Read the beginning of an email to Simon from a friend and then write an email to the restaurant. It should be approximately 250 words.</p>","<p>Hi Simon, As you know, I went to Edinburgh last weekend to see Alex. We had a great time except that we spent way too much money on a very mediocre meal.</p>","<p>We went to The Dragon, which according to the website, serves exceptional food at affordable prices. We didn’t look at the menu before going in so we couldn’t believe it when we saw the prices.</p>","<p>I wanted to leave, but Alex thought it would be rude. The waiters couldn’t explain half the dishes on the menu – they had to ask the chef. The air conditioning wasn’t working, and it was incredibly hot. The food, when it finally arrived, wasn’t even very good (everything tasted the same) and the portions were tiny. I’m going to email the restaurant and complain. It was a complete waste of money!</p>","<p>Apart from that, the weekend was wonderful…</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people discussing issues connected with animals. Match the speakers (1–5) to what their main topic is (A–H).","legend":["people who think their attitude to animals makes them superior","people whose attitude to animals is inconsistent","the way attitudes to animals have changed","the danger presented by certain animals","the difficulties involved in treating certain animals well","the conditions in which certain animals are kept","people who assume their attitude towards certain animals is widely shared","people who take no interest in animals at all"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"B"},{"t":"match","q":"Speaker 2","a":"F"},{"t":"match","q":"Speaker 3","a":"A"},{"t":"match","q":"Speaker 4","a":"C"},{"t":"match","q":"Speaker 5","a":"G"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","What amazes me is how people can cry over a dog in a film and then go and eat a burger without a second thought. They'll pay a fortune for their cat's vet bills, but never ask how a pig or a chicken lived. It just doesn't add up."],["Narrator","Speaker two."],["Speaker 2","I visited a farm where hens are kept in cages so small they can't even spread their wings. Thousands of them in one shed, with the lights on day and night. Whatever you think about eating eggs, nobody should have to live like that."],["Narrator","Speaker three."],["Speaker 3","There's a certain kind of vegetarian who really gets on my nerves. Not because of what they eat, but because they act as if it makes them a better person than everyone else. They look down on you at every meal, as if they're morally superior."],["Narrator","Speaker four."],["Speaker 4","When my grandfather was a boy, dogs lived outside and were there to work. Nobody would have dreamed of letting one sleep on the sofa. Now we buy them birthday cakes and winter coats. The way we think about animals has completely transformed in two generations."],["Narrator","Speaker five."],["Speaker 5","My neighbour keeps snakes, and she can't understand why I won't come round. She seems to think that because she loves reptiles, everybody secretly does too and just needs to hold one. She never imagines that most people find them terrifying."]]}},{"instr":"Listen to five people talking about things that went badly wrong when they were cooking. Match the speakers (1–5) to what caused their problem (A–H).","legend":["forgetting how to make something","cooking a large amount of food at once","reading a recipe incorrectly","cooking something for too long","not knowing how to prepare a particular ingredient","a belief that something was ready to be eaten","an attempt to do something impressive","being given incorrect information"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"C"},{"t":"match","q":"Speaker 2","a":"F"},{"t":"match","q":"Speaker 3","a":"G"},{"t":"match","q":"Speaker 4","a":"E"},{"t":"match","q":"Speaker 5","a":"H"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I was making a cake for my son's birthday and I put in a tablespoon of salt instead of a teaspoon. I'd misread the recipe. It looked fantastic, but the first bite was like eating the sea. We had shop-bought biscuits in the end."],["Narrator","Speaker two."],["Speaker 2","I was barbecuing chicken for friends. It was nicely brown on the outside, so I was sure it was cooked and started serving it. Then someone cut into theirs and it was pink in the middle. We had to put everything back on and wait another half hour."],["Narrator","Speaker three."],["Speaker 3","My girlfriend's parents were coming for dinner and I wanted to impress them, so I tried to flambé the dessert like they do in restaurants. I poured in far too much brandy, the flames shot up and I set off the smoke alarm. Not quite the impression I'd hoped for."],["Narrator","Speaker four."],["Speaker 4","I bought a whole fresh fish at the market because it looked lovely. When I got home I realized I had no idea what to do with it: how to clean it, how to take the bones out. I made such a mess of it that there was hardly anything left to cook."],["Narrator","Speaker five."],["Speaker 5","A friend told me you should cook rice with exactly one cup of water per cup of rice. I followed what she said, and I ended up with a pan of burnt, crunchy rice. It turns out she'd got it wrong. You need at least twice as much water."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["How good are you at cooking?","What are the most common dishes in your country?","What’s your favourite animal?","Which animal frightens you the most?","Why is it important to learn about animals?"],"talk":["‘Frozen foods have been a terrible invention.’","‘Too many animals are badly treated.’","‘Cooking is not something that I enjoy doing.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft09b","kind":"file","group":"ft09","ver":"B","title":"File 9 Test B","focus":"9A Animals, 9B Food: ellipsis and substitution, nouns (compound and possessive), animals, preparing food.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Underline the correct word(s).","items":[{"t":"pick","q":"This is my colleague Jonathan. He works with [my brother|the brother of me].","a":"my brother"},{"t":"pick","q":"I know she liked the surprise party, but she [doesn’t say so|didn’t say so].","a":"didn’t say so"},{"t":"pick","q":"She is [my brother’s friend|the friend of mine], but we don’t talk often.","a":"my brother’s friend"},{"t":"pick","q":"I haven’t been to China, but [I’d love go|I’d love to].","a":"I’d love to"},{"t":"pick","q":"I thought I’d be able to join you for the film, but [I can’t|I don’t].","a":"I can’t"}],"ex":"S hould I make chicken soup <b>/ </b>soup of chicken for dinner ton ,"sp<b>i</b>t"],"opts":["drain","fur","kick","peeled","potato","spit"]}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Learning About Animals At School","paras":[["","How do children learn about wildlife? And is what they learn the sort of thing they should be learning? It is my belief that children should not just be acquiring knowledge of animals, but also developing attitudes and feelings towards them based on exposure to the real lives of animals in their natural habitats. But is this happening?"],["","Some research in this area indicates that it is not. Learning about animals in school is often completely disconnected from the real lives of real animals, with the result that children often end up with little or no understanding or lasting knowledge of them. They learn factual information about animals, aimed at enabling them to identify them and have various abstract ideas about them, but that is the extent of their learning. Children’s storybooks tend to personify animals as characters rather than teach about them. For direct contact with wild and international animals, the only opportunity most children have is visiting a zoo. The educational benefit of this for children is often given as the main reason for doing it, but research has shown that zoo visits seldom add to children’s knowledge of animals – the animals are simply like exhibits in a museum that the children look at without engaging with them as living creatures. Children who belong to wildlife or environmental organizations or who watch wildlife TV programmes, however, show significantly higher knowledge than any other group of children studied in research. The studies show that if children learn about animals in their natural habitats, particularly through wildlife-based activities, they know more about them than they do as a result of visiting zoos or learning about them in the classroom."],["","Research has also been done into the attitudes of children towards animals. It shows that in general terms, children form strong attachments to individual animals, usually their pets, but do not have strong feelings for animals in general. This attitude is the norm regardless of the amount or kind of learning about animals they have at school. However, those children who watch television wildlife programmes show an interest in and affection for wildlife in its natural environment, and their regard for animals in general is higher. However, there is evidence that all of this is changing, and changing fast. The advent of the computer and interactive multimedia instruction in schools is changing the way that children learn about and perceive animals. The inclusion of pictures and audio enables children to look at and hear an"],["","animal at the same time. There is evidence that children recall more when they have learnt about animals in this way, and furthermore, this is the case whether the animal is one they were previously familiar or unfamiliar with."],["","Interactive multimedia instruction has opened up a whole new world of learning about animals. It has made it possible to educate children about wildlife beyond simple facts and to inspire in children an understanding of their real lives and affection and respect for them. This is particularly important in modern urban life, where children’s only direct experience of animals is likely to be with domestic pets. Without first-hand experiences of wildlife, children need other ways of gaining an appreciation of and respect for animals. Previously, only the minority of children who belonged to wildlife organizations or watched TV wildlife programmes developed this attitude. Now, computer technology is transforming the way children gain knowledge of wildlife. Games, stories, audio recordings, photographs, films, and spoken narration all combine in multimedia form to present animals as real living creatures, as well as providing factual information about them."],["","In this way, children can appreciate the unique qualities of different animals and engage with wildlife in a more personal way than in the past. This is important, because what happens to the world’s wildlife will depend, to at least some extent, on the attitudes towards animals that people acquire as children. If they learn about them as real, living creatures in their natural habitats, they are more likely to have respect for them and to be concerned about their treatment when they are older."]]},"parts":[{"items":[{"t":"mc","q":"What issue does the writer raise in the first paragraph?","o":["The level of interest that children have in learning about animals.","The outcome of what children learn about animals.","The amount of learning about animals that children do."],"a":1},{"t":"mc","q":"What opinion does the writer express in the second paragraph?","o":["What children learn about animals at school is often inaccurate.","Children’s learning about animals at school has the wrong emphasis.","Children’s storybooks are an effective way of teaching them about animals."],"a":1},{"t":"mc","q":"What does the writer say about zoo visits?","o":["Children don’t enjoy them as much as adults think they do.","They have less educational benefit than they are believed to have.","They can be upsetting for some children."],"a":1},{"t":"mc","q":"What does the writer say about learning about animals in their natural habitats?","o":["It is very difficult for most children to do this.","It requires a lot of effort from children.","It teaches children more about animals than other methods."],"a":2},{"t":"mc","q":"Research shows that children’s attitudes to animals ___.","o":["are not affected by what they learn about them at school","depend on whether or not they have pets","differ from what adults might expect them to be"],"a":0},{"t":"mc","q":"The writer says that the use of interactive multimedia instruction ___.","o":["works better for some children than for others","is most effective for teaching about animals children know nothing about","increases the amount that children can remember after lessons"],"a":2},{"t":"mc","q":"The writer says that in modern urban life, interactive multimedia instruction ___.","o":["is particularly effective for children who do not have pets","can relate the lives of animals to children’s own lives","is a good substitute for direct contact with wildlife"],"a":2},{"t":"mc","q":"What does the writer say about children who watch TV wildlife programmes?","o":["They no longer know more about animals than other children.","They are very fond of interactive multimedia instruction about animals.","There are now more of them because of interactive multimedia instruction."],"a":0},{"t":"mc","q":"The writer says in the last paragraph that what children learn about animals at school ___.","o":["has an effect on how their personalities develop","may change as they get older","will have some effect on attitudes to wildlife in the future"],"a":2},{"t":"mc","q":"The writer’s main point in the text as a whole is that ___.","o":["some children are much more interested in animals than others","children should learn about how animals really live","children enjoy learning about animals with interactive multimedia instruction"],"a":1}]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Read the beginning of an email to Simon from a friend and then write an email to the restaurant. It should be approximately 250 words.</p>","<p>Hi Simon, As you know, I went to Edinburgh last weekend to see Alex. We had a great time except that we spent way too much money on a very mediocre meal.</p>","<p>We went to The Dragon, which according to the website, serves exceptional food at affordable prices. We didn’t look at the menu before going in so we couldn’t believe it when we saw the prices.</p>","<p>I wanted to leave, but Alex thought it would be rude. The waiters couldn’t explain half the dishes on the menu – they had to ask the chef. The air conditioning wasn’t working, and it was incredibly hot. The food, when it finally arrived, wasn’t even very good (everything tasted the same) and the portions were tiny. I’m going to email the restaurant and complain. It was a complete waste of money!</p>","<p>Apart from that, the weekend was wonderful…</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people discussing issues connected with animals. Match the speakers (1–5) to what their main topic is (A–H).","legend":["the danger presented by certain animals","people who think their attitude to animals makes them superior","the way attitudes to animals have changed","people who take no interest in animals at all","the conditions in which certain animals are kept","people whose attitude to animals is inconsistent","the difficulties involved in treating certain animals well","people who assume their attitude towards certain animals is widely shared"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"F"},{"t":"match","q":"Speaker 2","a":"E"},{"t":"match","q":"Speaker 3","a":"B"},{"t":"match","q":"Speaker 4","a":"C"},{"t":"match","q":"Speaker 5","a":"H"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","What amazes me is how people can cry over a dog in a film and then go and eat a burger without a second thought. They'll pay a fortune for their cat's vet bills, but never ask how a pig or a chicken lived. It just doesn't add up."],["Narrator","Speaker two."],["Speaker 2","I visited a farm where hens are kept in cages so small they can't even spread their wings. Thousands of them in one shed, with the lights on day and night. Whatever you think about eating eggs, nobody should have to live like that."],["Narrator","Speaker three."],["Speaker 3","There's a certain kind of vegetarian who really gets on my nerves. Not because of what they eat, but because they act as if it makes them a better person than everyone else. They look down on you at every meal, as if they're morally superior."],["Narrator","Speaker four."],["Speaker 4","When my grandfather was a boy, dogs lived outside and were there to work. Nobody would have dreamed of letting one sleep on the sofa. Now we buy them birthday cakes and winter coats. The way we think about animals has completely transformed in two generations."],["Narrator","Speaker five."],["Speaker 5","My neighbour keeps snakes, and she can't understand why I won't come round. She seems to think that because she loves reptiles, everybody secretly does too and just needs to hold one. She never imagines that most people find them terrifying."]]}},{"instr":"Listen to five people talking about things that went badly wrong when they were cooking. Match the speakers (1–5) to what caused their problem (A–H).","legend":["an attempt to do something impressive","cooking a large amount of food at once","reading a recipe incorrectly","being given incorrect information","cooking something for too long","not knowing how to prepare a particular ingredient","forgetting how to make something","a belief that something was ready to be eaten"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"C"},{"t":"match","q":"Speaker 2","a":"H"},{"t":"match","q":"Speaker 3","a":"A"},{"t":"match","q":"Speaker 4","a":"F"},{"t":"match","q":"Speaker 5","a":"D"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I was making a cake for my son's birthday and I put in a tablespoon of salt instead of a teaspoon. I'd misread the recipe. It looked fantastic, but the first bite was like eating the sea. We had shop-bought biscuits in the end."],["Narrator","Speaker two."],["Speaker 2","I was barbecuing chicken for friends. It was nicely brown on the outside, so I was sure it was cooked and started serving it. Then someone cut into theirs and it was pink in the middle. We had to put everything back on and wait another half hour."],["Narrator","Speaker three."],["Speaker 3","My girlfriend's parents were coming for dinner and I wanted to impress them, so I tried to flambé the dessert like they do in restaurants. I poured in far too much brandy, the flames shot up and I set off the smoke alarm. Not quite the impression I'd hoped for."],["Narrator","Speaker four."],["Speaker 4","I bought a whole fresh fish at the market because it looked lovely. When I got home I realized I had no idea what to do with it: how to clean it, how to take the bones out. I made such a mess of it that there was hardly anything left to cook."],["Narrator","Speaker five."],["Speaker 5","A friend told me you should cook rice with exactly one cup of water per cup of rice. I followed what she said, and I ended up with a pan of burnt, crunchy rice. It turns out she'd got it wrong. You need at least twice as much water."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["What’s your favourite meal?","What’s your opinion of celebrity chefs?","Which animals do you have most contact with?","What are the most common pets in your country?","What is your opinion of zoos?"],"talk":["‘Everyone should be taught how to cook at school.’","‘There is no reason for anyone to have a pet.’","‘I think that there aren’t enough zoos in the world.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft10a","kind":"file","group":"ft10","ver":"A","title":"File 10 Test A","focus":"10A Sport, 10B Migration: relative clauses, adding emphasis (cleft sentences), word building, sport.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Order the words to make emphatic sentences.","items":[{"t":"gap","q":"<span class=\"hint\">happy be to is want I all</span><br>{}","a":[["All I want is to be happy"]],"loose":true,"wide":true},{"t":"gap","q":"<span class=\"hint\">happened that was late he what was<
