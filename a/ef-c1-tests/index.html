roast|baked] chicken on Sunday. Would you like to come for lunch?","a":"roast"}],"ex":"C olds are caused by a virus <b>/ </b>bacteria which can be passed from person to person."}]},{"k":"p","name":"Pronunciation","max":20,"w":1,"parts":[{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["stu","bborn"],"a":0,"word":"stubborn"},{"t":"stress","w":["re","mote"],"a":1,"word":"remote"},{"t":"stress","w":["an","ti","bi","o","tics"],"a":3,"word":"antibiotics"},{"t":"stress","w":["ca","na","ry"],"a":1,"word":"canary"},{"t":"stress","w":["an","nounce"],"a":1,"word":"announce"},{"t":"stress","w":["be","sides"],"a":1,"word":"besides"},{"t":"stress","w":["post","pone"],"a":1,"word":"postpone"},{"t":"stress","w":["mu","ssels"],"a":0,"word":"mussels"},{"t":"stress","w":["o","ver","ra","ted"],"a":2,"word":"overrated"},{"t":"stress","w":["cap","ti","vi","ty"],"a":1,"word":"captivity"}],"ex":"sur|vi|vors"},{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"fr<b>ie</b>d","a":"wild","grp":null,"slot":0},{"t":"match","q":"compromi<b>se</b>","a":"ribs","grp":null,"slot":0},{"t":"match","q":"sp<b>e</b>cies","a":"steamed","grp":null,"slot":0},{"t":"match","q":"awkw<b>ar</b>d","a":"simmer","grp":null,"slot":0},{"t":"match","q":"ba<b>ked</b>","a":"protect","grp":null,"slot":0},{"t":"match","q":"dep<b>ar</b>t","a":"bark","grp":null,"slot":0},{"t":"match","q":"<b>ph</b>ysiotherapist","a":"stuffed","grp":null,"slot":0},{"t":"match","q":"c<b>a</b>ll","a":"straw","grp":null,"slot":0},{"t":"match","q":"toa<b>s</b>ted","a":"saucepan","grp":null,"slot":0},{"t":"match","q":"avocad<b>o</b>","a":"joke","grp":null,"slot":0}],"ex":"wor<b>k</b>out → chicken","bankHtml":["j<b>o</b>ke","str<b>aw</b>","simm<b>er</b>","w<b>i</b>ld","sau<b>ce</b>pan","rib<b>s</b>","b<b>ar</b>k","prote<b>ct</b>","chi<b>ck</b>en","st<b>ea</b>med","stu<b>ff</b>ed"],"opts":["joke","straw","simmer","wild","saucepan","ribs","bark","protect","chicken","steamed","stuffed"]}]},{"k":"r","name":"Reading","max":15,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"A Traveller Or A Tourist? A","paras":[["","What is the difference between a traveller and a tourist? Well, the easy distinction often made concerns what kind of trip people are on. To put it simply, someone visiting other countries with a backpack and roaming from place to place without a fixed itinerary is often regarded, especially by themselves, as a ‘traveller’. Someone on holiday, especially someone on a package holiday for one or two weeks, is generally regarded as a ‘tourist’. According to this distinction, the traveller gains an understanding of the place as it really is – mixing in with the locals, learning about the culture – whereas the tourist merely skates over the surface, seeing the sights but ignoring the people and their culture. This is why many people who consider themselves ‘travellers’ sneer dismissively at ‘tourists’ and are so anxious to distance themselves from them."],["B","However, this distinction does not seem to me to hold water in many cases. First of all, let’s accept that a traveller is someone who fully experiences the place they visit rather than simply observing it from the outside, as a tourist does. Does everyone calling themselves a traveller really do this? Of course not. There are herds of young backpackers out there in all corners of the world who see and learn very little of the places they visit. Sticking together in groups, their tales on return are seldom of what they learnt of other cultures, but of the other backpackers they met. Contact with local people is negligible, and there is the suspicion that they are merely ticking boxes so that they can say they have visited all the places that their peers go to. This seems to me not to distinguish them at all from the package tourists boasting about the places they have been to, but who the backpackers so deride. Secondly, there are plenty of people much older than the backpackers who do immerse themselves in the cultures of the places they visit, even if they are only on short holidays. It’s not about how long your stay is, how old you are, how you got there, or how you move around there. It’s all about attitude. C If you really are a traveller, there’s a purpose to your trip beyond simply getting away from work, taking it easy, or enjoying the weather. You broaden your mind, see other people’s lives through their eyes, gain new perspectives. You meet and have real conversations with local people. You learn that some of your expectations and assumptions were wrong. Your trip has an effect on you. You are wiser"],["","about another culture, other ways of thinking and living. A tourist, on the other hand, isn’t interested in any of that. Tourists hardly engage at all with the place they are visiting, preferring to confirm their own preconceptions rather than challenge them, keeping the local people and culture at arm’s length, seeing everything through the lens of a camera. D One of the first rules of being a traveller is that you have to accept the place for what it is. Don’t complain that it’s hot, that there are bugs, that life moves at a different pace, that local people sometimes stare at you. Don’t keep comparing the place with home or other places you’ve been. Don’t let disappointments about the quality of service or level of facilities in your accommodation dominate your thoughts. Instead, get out and about. Watch how local people interact, how they go about their daily business. Learn some words of the language that you can use in shops and other places and go where the local people go. Ask questions rather than thinking you know all the answers. Once you’ve found the various bits of key information you need, leave the guidebook behind – you’ll learn more from personal contact and direct experience than you can get from any book. Put the camera away for a while and instead store images of what you see in your mind. Anyone can do these things, no matter what kind of trip they’re on. Even if you’re on a short annual holiday, you can be a traveller rather than a tourist; plenty of people who call themselves travellers are actually tourists. It’s all in the mind."]]},"parts":[{"items":[{"t":"mc","q":"The writer’s intention in section A is to ___.","o":["explain why it is important to distinguish between a ‘traveller’ and a ‘tourist’","compare what ‘travellers’ and ‘tourists’ say about themselves","present common definitions of ‘traveller’ and ‘tourist’"],"a":2},{"t":"mc","q":"Which of the following does the writer describe in section A?","o":["The attitude of tourists towards travellers.","The attitude of local people towards both travellers and tourists.","The attitude of travellers towards tourists."],"a":2},{"t":"mc","q":"What does the writer mean by the phrase ‘hold water’ at the beginning of section B?","o":["be generally agreed","be true","be discussed"],"a":1},{"t":"mc","q":"What does the writer suggest about ‘travellers’ in section B?","o":["They don’t really enjoy the trips they make.","They are not really interested in the places they visit.","Their attitudes change during their trips."],"a":1},{"t":"mc","q":"Which of the following opinions does the writer express in section B?","o":["Some people who call themselves travellers behave like tourists.","Travellers and tourists should have more contact with each other.","Some travellers have a worse attitude than some tourists."],"a":0},{"t":"mc","q":"What does the writer say about some older people in section B?","o":["They could be considered to be ‘travellers’.","They dislike being referred to as ‘tourists’.","They disapprove of the attitude of some travellers."],"a":0},{"t":"mc","q":"The writer’s intention in section C is to ___.","o":["present his own definitions of ‘traveller’ and ‘tourist’","defend travellers against criticism","encourage readers to be travellers rather than tourists"],"a":0},{"t":"mc","q":"The writer compares travellers and tourists in section C in connection with ___.","o":["whether or not they change their views of the places they visit","what local people in the places they visit think of them","what they tell other people about their trips when they return"],"a":0},{"t":"mc","q":"At the beginning of section D, the writer lists things that ___.","o":["people he regards as tourists do","travellers usually don’t notice","cause annoyance to local people"],"a":0},{"t":"mc","q":"The writer’s main point in the text as a whole is that ___.","o":["the kind of trip you take is less important than your attitude towards it","your attitude towards a trip greatly affects your enjoyment of it","the attitude of a traveller is no better than the attitude of a tourist"],"a":0}]},{"instr":"In which section of the article (A–D) are the following mentioned?","items":[{"t":"match","q":"a desire to relax for a period of time","a":"C"},{"t":"match","q":"not relying on one particular source of information about a place","a":"D"},{"t":"match","q":"a reaction of local people when they see a visitor from another part of the world","a":"D"},{"t":"match","q":"the desire of travellers not to be considered tourists","a":"A"},{"t":"match","q":"people trying to impress others by talking about the places they have visited","a":"B"}],"opts":["A","B","C","D"]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Choose one of the titles below and write approximately 250 words.</p>","<p>1 Your teacher has asked you to write an essay on the following topic: ‘Alternative medicine is as effective as mainstream medicine.’</p>","<p>2 Write a report using the information below.</p>","<p>The directors of the company you work for would like to know whether or not they should open a canteen for their employees. You have been asked to get feedback from as many employees as possible and to write a report detailing whether or not they want a canteen, what food they would expect, and to make suggestions for getting more people to use the canteen. You have made notes covering the views of the majority of people:</p>","<p>People like idea of canteen and want it open from 7.00 a.m. for breakfast to 4.00 p.m. for tea.</p>","<p>They will only use it if cheap (if prices same as local shops, they prefer going out). Want hot and cold food; meat and vegetarian options. If very crowded (too many people, slow service), they will go to shops outside.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about various laws banning certain things. Match the speakers (1–5) to what they say about the law or ban (A–H).","legend":["Many people are not aware of it.","It should not have been introduced.","It has caused confusion.","It has had an unforeseen result.","People frequently ignore it.","It has had the desired effect.","It is impossible to enforce it.","It doesn’t cover everything it should cover."],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"D"},{"t":"match","q":"Speaker 2","a":"C"},{"t":"match","q":"Speaker 3","a":"B"},{"t":"match","q":"Speaker 4","a":"E"},{"t":"match","q":"Speaker 5","a":"F"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","When they banned plastic bags in our shops, the idea was to reduce waste. But now everyone buys thick reusable bags, uses them twice and throws them away. Apparently we're using more plastic than before. Nobody saw that coming."],["Narrator","Speaker two."],["Speaker 2","Our city introduced a low-emission zone last year, and nobody seems to understand it. Some cars are allowed in, some aren't, some have to pay at certain times. Even the taxi drivers aren't sure. I've had three different explanations from three different officials."],["Narrator","Speaker three."],["Speaker 3","The ban on dogs in all the town's parks is ridiculous. Most owners are responsible, and now everyone suffers because of a few. It was never necessary, and the council should never have brought it in."],["Narrator","Speaker four."],["Speaker 4","Using a phone while driving has been illegal here for years. But stand at any junction and count. Half the drivers who go past are texting or talking. Everyone knows the law; they just don't obey it."],["Narrator","Speaker five."],["Speaker 5","When they banned smoking in restaurants, people said business would collapse. In fact, restaurants are busier than ever, and far fewer people smoke now. It's done exactly what it was meant to do."]]}},{"instr":"Listen to a talk about celebrity chefs who have appeared on TV in Britain. Complete the sentences using no more than three words.","items":[{"t":"gap","q":"The phrase ‘Delia effect’ refers to something that happens in {}.","a":[["supermarkets","the supermarkets"]],"list":true},{"t":"gap","q":"British people ate, but did not cook {} and {} dishes until the 1980s.","a":[["Chinese"],["Indian"]],"list":true,"any":true},{"t":"gap","q":"Jamie Oliver has encouraged people to eat meals that are both {} and {}.","a":[["healthy"],["home-cooked","home cooked"]],"list":true,"any":true},{"t":"gap","q":"Anton Mosimann’s attempt to get British people to replace salt with {} failed.","a":[["herbs"]],"list":true},{"t":"gap","q":"The most influential chefs have been the ones whose recipes appeal to {} people.","a":[["ordinary","more ordinary"]],"list":true}],"audio":{"script":[["Speaker","Celebrity chefs have had an enormous influence on the way British people cook and eat. Take Delia Smith. Whenever she uses an ingredient on TV, sales of it in supermarkets rise dramatically, sometimes overnight. This is known as the 'Delia effect'."],["Speaker","Chefs have also widened people's tastes. For years British people happily ate Chinese and Indian food in restaurants and takeaways, but until the 1980s hardly anyone cooked those dishes at home. TV chefs changed that."],["Speaker","More recently, Jamie Oliver has campaigned against processed food. He has encouraged families to eat meals that are both healthy and home-cooked, and he has changed what children eat at school."],["Speaker","Not every campaign has worked. The Swiss chef Anton Mosimann tried to persuade British people to replace salt with herbs to make their food healthier. Few people took his advice, and the attempt failed."],["Speaker","Looking back, the most influential chefs have not been the most sophisticated. They have been the ones whose recipes appeal to ordinary people, cooking in ordinary kitchens with ingredients they can buy at the corner shop."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["If you could travel anywhere, where would you travel?","Which famous sights in the world would you really like to see?","If you could paint a picture of someone or something, what would you paint?","When do you go out to eat in restaurants?","What do you do to keep fit?"],"talk":["‘Computer games have a totally negative effect on people.’","‘People’s pets cause too much trouble for other people.’","‘People who don’t travel only see a limited view of the world.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"eoc","kind":"eoc","title":"End-of-course Test","focus":"Final assessment of the whole course, Files 1–10.","secs":[{"k":"g","name":"Grammar","max":40,"w":1,"parts":[{"title":"Verb forms","instr":"Complete the sentences. Use the correct form of the verb in brackets.","items":[{"t":"gap","q":"How long {} you and Stan {} (be going out)?","a":[["have"],["been going out"]]},{"t":"gap","q":"Darren {} (have to) work late last Friday night.","a":[["had to"]]},{"t":"gap","q":"I was watching TV when the telephone {} (ring).","a":[["rang"]]},{"t":"gap","q":"We {} (not used to) see many people at this beach, but now it’s very crowded.","a":[["didn’t use to","did not use to"]]},{"t":"gap","q":"It {} (be) announced by a co ason"],"a":0},{"t":"mc","q":"I don’t really like loud music, but Stephen ___.","o":["doesn’t","is","does"],"a":2},{"t":"mc","q":"It’s ___ more difficult to find a good job these days.","o":["more than","more and","the"],"a":1},{"t":"mc","q":"Could you wash these ___ cups, please?","o":["coffee’s","coffee","coffee of"],"a":1}],"ex":"I’ve started running every day <b>because</b> I want to enter the London Marathon. (owing / because / due to)"}]},{"k":"v","name":"Vocabulary","max":40,"w":1,"parts":[{"title":"Key words","instr":"Read the definitions and complete the key words. Type the whole word.","items":[{"t":"gap","q":"humour made from using words in unexpected ways = w{}","a":[["wordplay"]]},{"t":"gap","q":"leave out or not include = to o{}","a":[["omit"]]},{"t":"gap","q":"a group of words whose meaning is different from the meaning of the individual words, e.g. <i>it was a piece of cake</i> = an i{}","a":[["idiom"]]},{"t":"gap","q":"listen to someone speaking and write down their words = to t{}","a":[["transcribe"]]},{"t":"gap","q":"monotonous, boring = t{}","a":[["tedious"]]},{"t":"gap","q":"speak in a very soft voice = to w{}","a":[["whisper"]]},{"t":"gap","q":"a legal agreement where the bank lends you money to buy a house = a m{}","a":[["mortgage"]]},{"t":"gap","q":"money that a bank lends and somebody borrows = a l{}","a":[["loan"]]},{"t":"gap","q":"remove from power using force = to o{}","a":[["overthrow"]]},{"t":"gap","q":"put off until later = to p{}","a":[["postpone"]]}],"ex":"very funny = <b>hilarious</b>","lead":true},{"title":"Complete with the correct word","instr":"Choose the word that completes each sentence.","items":[{"t":"mc","q":"I don’t know my neighbours well at all. We ___ and smile when we see one another, but we’ve never spoken.","o":["nod","make small talk","come round"],"a":0},{"t":"mc","q":"Being a rubbish collector seems like a ___ job, but if it isn’t done, the city becomes an unbearable place to be.","o":["barely","arguable","lowly"], lease take some money [outside|out] of my wallet and go to the shop for some tea bags?","a":"out"},{"t":"pick","q":"We had to [cut|take] our holiday short because there was an unexpected crisis at Malcolm’s office.","a":"cut"},{"t":"pick","q":"David yells a lot, but his bark is worse than his [sting|bite].","a":"bite"},{"t":"pick","q":"Look, here’s some [chopped|sliced] bread. Let’s make sandwiches.","a":"sliced"},{"t":"pick","q":"For dessert, I plan to serve ice cream with [melted|poached] chocolate on top.","a":"melted"}],"ex":"It’s the summer holidays, so I’ve got time on my <b>hands</b> / head."},{"title":"Word formation","instr":"Complete the sentences with one word made from the word in brackets.","items":[{"t":"gap","q":"We had a big {} (celebrate) for my uncle’s 75th birthday.","a":[["celebration"]]},{"t":"gap","q":"When we finished university, Axel and I formed a {} (partner) and started our own business.","a":[["partnership"]]},{"t":"gap","q":"{} (apparent) Luke wants to quit his job and move to Bolivia.","a":[["Apparently"]]},{"t":"gap","q":"After the crash, the {} (wound) were taken to the local hospital for treatment.","a":[["wounded"]]},{"t":"gap","q":"A famous {} (history) visited our school and told us a lot of stories about the past.","a":[["historian"]]},{"t":"gap","q":"Many animals are fighting for {} (survive) as humans continue to destroy the environment.","a":[["survival"]]},{"t":"gap","q":"At the school disco, the boys {} (number) the girls. There were three times as many boys.","a":[["outnumbered"]]},{"t":"gap","q":"I’m afraid we {} (estimate) how popular the tour would be. 1,200 people asked to join, but we only have 100 places.","a":[["underestimated"]]},{"t":"gap","q":"The villa has an {} (door) tennis court so we can only play if it isn’t raining or too hot.","a":[["outdoor"]]},{"t":"gap","q":"After my illness, it took me several weeks to get back my {} (strong).","a":[["strength"]]}],"ex":"In many countries, smoking has been <b>outlawed</b> (law) in public places."}]},{"k":"p","name":"Pronunciation","max":20,"w":1,"parts":[{"title":"Same sound","instr":"Match each word with a word from the box that has the same sound (shown in bold).","items":[{"t":"match","q":"qualifications","a":"buzz","qh":"qualification<b>s</b>"},{"t":"match","q":"chance","a":"hiss","qh":"chan<b>ce</b>"},{"t":"match","q":"feelings","a":"tedious","qh":"f<b>ee</b>lings"},{"t":"match","q":"mortgage","a":"impressive","qh":"mortg<b>a</b>ge"},{"t":"match","q":"revolution","a":"troops","qh":"revol<b>u</b>tion"},{"t":"match","q":"neighbourhood","a":"put off","qh":"neighbourh<b>oo</b>d"},{"t":"match","q":"cut short","a":"comfort","qh":"c<b>u</b>t short"},{"t":"match","q":"impression","a":"donation","qh":"impre<b>ssi</b>on"},{"t":"match","q":"joke","a":"charge","qh":"<b>j</b>oke"},{"t":"match","q":"used","a":"yell","qh":"<b>u</b>sed"}],"ex":"kn<b>ow</b> → <b><i>socially</i></b>","opts":["yell","tedious","buzz","comfort","impressive","hiss","troops","put off","donation","charge"],"bankHtml":["<b>y</b>ell","t<b>e</b>dious","bu<b>zz</b>","c<b>o</b>mfort","<b>i</b>mpressive","hi<b>ss</b>","tr<b>oo</b>ps","p<b>u</b>t off","dona<b>ti</b>on","char<b>ge</b>"]},{"title":"Word stress","instr":"Tap the stressed syllable.","items":[{"t":"stress","w":["ma","ter","ni","ty"],"a":1},{"t":"stress","w":["nu","cle","ar"],"a":0},{"t":"stress","w":["fig","ure"],"a":0},{"t":"stress","w":["trou","ble"],"a":0},{"t":"stress","w":["af","ford"],"a":1},{"t":"stress","w":["in","come"],"a":0},{"t":"stress","w":["with","draw"],"a":1},{"t":"stress","w":["de","feat"],"a":1},{"t":"stress","w":["cap","tiv","i","ty"],"a":1},{"t":"stress","w":["poached"],"a":0}],"ex":"re<b>pe</b>titive"}]},{"k":"r","name":"Reading","max":15,"w":1,"parts":[{"title":"Multiple choice","instr":"Read the article and choose A, B, or C.","items":[{"t":"mc","q":"In section A, the writer raises the question of whether or not ___.","o":["business is different from other walks in life with regard to persuasion","persuasion is as important as people say it is","it is possible to generalize about how persuasion works"],"a":2},{"t":"mc","q":"The writer says that the instruction mentioned in section B ___.","o":["sounds like a bad idea","was given by mistake","was necessary in the circumstances"],"a":0},{"t":"mc","q":"How did some people react to the instruction mentioned in section B?","o":["Many of them bought more than one of the product.","Their interest in the product increased.","They bought something they didn’t want."],"a":1},{"t":"mc","q":"In both of the studies mentioned in section C, ___.","o":["some of the choices proved more attractive than others","the number of choices affected what people did","only a few people selected any of the choices"],"a":1},{"t":"mc","q":"What is said about the leaflets mentioned in section D?","o":["Some of them contained images that were not frightening.","Some of them contained images and information.","Some of them contained only images."],"a":1},{"t":"mc","q":"What did the experiment described in section D show?","o":["Fear alone can prevent people from taking action.","Fear always causes people to take action.","Fear persuades people to take action more than information does."],"a":0},{"t":"mc","q":"The research described in section E involved ___.","o":["asking people to do different things","making the same request more than once","people agreeing to a request"],"a":2},{"t":"mc","q":"In section F, the writer says that trying to persuade people to change their minds can ___.","o":["take longer with some people than with others","seem like a challenge to ordinary behaviour","fail for reasons that do not seem logical"],"a":1},{"t":"mc","q":"The writer advises in section F that you should not ___.","o":["discuss the other person’s attitude in general","make your suggestion too strongly","criticize a previous decision"],"a":2},{"t":"mc","q":"The writer’s purpose in the article as a whole is to ___.","o":["discuss a number of different forms of persuasion","advise the reader on how to get better at persuasion","compare the results of various research into persuasion"],"a":0}]},{"title":"Which section?","instr":"In which section of the article (A–F) are the following mentioned?","items":[{"t":"match","q":"the effect of too much thinking being required","a":"C"},{"t":"match","q":"the number of people who don’t take a certain action","a":"E"},{"t":"match","q":"the importance of telling people how to deal with a problem","a":"D"},{"t":"match","q":"the possibility that being good at persuasion is a natural skill that some people have","a":"A"},{"t":"match","q":"the way that people are usually invited to do something","a":"B"}],"opts":["A","B","C","D","E","F"]}],"passage":{"title":"The science of persuasion","paras":[["A","Persuasion is key to business and to much more besides. In many walks of life and in many situations, persuading people to do what you want them to do is the key to success. Is persuasion a science with rules that can be taught and learnt, or is it simply a matter of instinct and personal experience? Researchers have looked into different aspects of persuasion and come up with some interesting results."],["B","One advertising copywriter, for example, came up with an approach to selling a product on a TV shopping channel via phone sales that differed from the norm for such advertising. Instead of being instructed: ‘Operators are waiting, please call now’, viewers were told ‘If operators are busy, please call again’. This might appear to have been a risky tactic, putting potential buyers off by suggesting that they would have to waste their time calling repeatedly until they finally got through to someone to take their order. But the results were extraordinary and an unprecedented number of sales resulted. The advert suggested that instead of there being lots of operators sitting there and hoping people would call, there were so many people who wanted the product that people might have to wait until they could get it. This showed just how desirable the product was. Potential customers decided that, if so many other people wanted it, they definitely wanted it too."],["C","What role does choice have in persuading people to buy or get something? One study looked at the choices employees made when offered different retirement programmes. This showed that the more choices people were given, the less likely they were to choose anything at all. Another study in a supermarket revealed a similar effect of choice. A particular supermarket displayed either 6 or 24 different kinds of jam. When there were 24 jams to choose from, 3% of customers went to the display and bought one of the jams. When there were 6 jams on display, 30% of customers did so."],["D","To what extent can fear play a part in persuasion? One experiment involved public health leaflets on the dangers of tetanus infection. Some of the leaflets consisted almost entirely of frightening images of infected people, with a bit of information about infection, while some contained no images at all, only information about infection. Some included information on where people should go to get tetanus injections to protect themselves, while others only gave this information and nothing else. The outcome was that the greatest number of people who went for injections were those who had been given the leaflet with both frightening images and instructions on where to go for injections. People who had been given the leaflets dealing only with infection did nothing. The conclusion was that fear paralyses people if no solution is offered, but if people are frightened and offered a solution they are motivated to take action."],["E","Research has also looked into the issue of restaurants persuading people who have booked to let them know if they are not going to turn up. This shows that getting people to promise to do something makes them more likely to do it than simply asking them to do it. If the restaurant asks people to call if they can’t make it, 30% of them simply don’t turn up and don’t tell the restaurant. If, however, the restaurant asks them to call if they have to cancel and they reply that they will do so, only 10% fail to notify the restaurant in advance that they will not be coming."],["F","Another aspect of persuasion concerns getting someone to change their mind. Everyone knows how hard this can be. It’s hard to prove to someone that a previous decision was wrong, and as people get older they get less and less willing to change their minds. This is because people want things to be consistent, they want their attitudes, statements, values and actions to follow a set pattern. The only way to persuade them to change is to acknowledge this by agreeing that the previous decision they made was a perfectly understandable one. This allows them to focus on your suggestion without feeling that their previous decision was wrong in any way. As a result, they may be persuaded to break out of their established pattern without feeling uncomfortable about doing so."]]},"intro":"Read the article and answer the questions. One mark for each answer."},{"k":"w","name":"Writing","max":10,"w":1,"writing":{"tasks":["You have been asked to write a review of a TV programme for a local English paper.","You have been asked to write an essay with the title ‘Sport at school is as important as any other subject.’","You have been asked to write an article about how people’s diets have changed over the last 30 years."],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"title":"Journeys to work","instr":"Listen to five people talking about their journeys to work every day. Match the speakers (1–5) to what they mention (A–H).","items":[{"t":"match","q":"Speaker 1","a":"F"},{"t":"match","q":"Speaker 2","a":"D"},{"t":"match","q":"Speaker 3","a":"A"},{"t":"match","q":"Speaker 4","a":"C"},{"t":"match","q":"Speaker 5","a":"H"}],"legend":["the journey being unpredictable","moving to a different work location","other modes of transport being too complicated","being lucky","numbers of commuters increasing","having a low opinion of other commuters","other people changing the way they get to work","remaining calm despite a problem"],"opts":["A","B","C","D","E","F","G","H"],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I take the train into the city every morning, and honestly, my fellow passengers drive me mad. They put their bags on seats, eat smelly breakfasts and shout into their phones. Most of them seem to have no idea how to behave in public."],["Narrator","Speaker two."],["Speaker 2","I've cycled to work for ten years and never had a single accident, not even a puncture. When I think of the traffic I ride through every day, I know I've been very fortunate. Touch wood it stays that way."],["Narrator","Speaker three."],["Speaker 3","I drive to work, and I can never tell how long it will take. Some days it's twenty minutes, other days, for no obvious reason, it's an hour and a half. I've given up trying to plan around it. I just leave early and hope."],["Narrator","Speaker four."],["Speaker 4","People ask why I don't take public transport. I've looked into it, but it would mean a bus, then the metro, then another bus, with three different tickets. It's far too complicated. I'd rather sit in my car and listen to the radio."],["Narrator","Speaker five."],["Speaker 5","Last week the tram broke down halfway across the bridge and we were stuck for forty minutes. Everyone around me was getting angry and phoning their offices. I just thought, there's nothing I can do about it, so I read my book. Getting stressed wouldn't have made it move any faster."]]}},{"title":"Being an artist","instr":"Listen to an interview about being an artist. Choose A, B, or C.","items":[{"t":"mc","q":"What question does the interviewer raise in his introduction to the interview?","o":["How many people say ‘I’m an artist’","Why people who say ‘I am an artist’ are often not believed","What entitles someone to say ‘I am an artist’"],"a":2},{"t":"mc","q":"Sophia says that if you believe that you are an artist, you should not ___.","o":["talk about wanting to be an artist","lie about what you do for a living","allow other people’s comments to discourage you"],"a":0},{"t":"mc","q":"What is Sophia’s advice if you have a job?","o":["Think about your art while you’re working.","Spend the minimum amount of time possible working.","Try to do some art while you’re at work."],"a":1},{"t":"mc","q":"What does Sophia say about personal relationships?","o":["Tell people that you are sorry you can’t spend more time with them.","Be aware that your art causes you to change moods frequently.","Explain to people how important your art is to you."],"a":2},{"t":"mc","q":"Sophia says that meeting other artists will show you that ___.","o":["it is possible to find people who like the art you create","people like you are able to make a living from their art","there are other people with the same attitude as you"],"a":2}],"audio":{"script":[["Interviewer","Lots of people paint or write in their spare time. But when can you really call yourself an artist? Is it when you sell your first work? When you've had some training? My guest today is the painter Sophia Lane."],["Sophia","I think the answer is simpler than people imagine. If you make art seriously and regularly, you're an artist. But there's one thing I'd say: stop talking about wanting to be an artist. Saying 'one day I'd like to be an artist' keeps it in the future. Just say 'I'm an artist' and get on with the work."],["Interviewer","What about money? Most artists have other jobs."],["Sophia","Of course, and there's no shame in that. But my advice is to keep that job as small as you possibly can. Work only the hours you need to pay the bills, and protect the rest of your time for your art."],["Interviewer","And relationships? Being an artist can be quite selfish."],["Sophia","It can look that way. The people close to you need to understand. Sit down with them and explain how much your art means to you and why you need time alone. Most people will respect that once they understand it."],["Interviewer","Any final advice?"],["Sophia","Find other artists. Join a group, go to openings, take a class. You'll discover that there are lots of people who think exactly the way you do. That's enormously encouraging when you're working alone."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":15,"w":1,"speaking":{"mode":"overall","max":15,"tasks":[{"name":"Student A","mins":4,"lead":"Student A asks first. Then Student B asks. Then each student talks for about a minute on one statement.","prompts":["What aspect of your personality would you most like to change?","What would you like to have more free time to do?","How careful are you with money?","How much do you know about art and famous artists?","What’s the best journey you’ve ever taken?"],"talk":["Taking revenge on someone does not make you feel better.","It is better to read books than newspapers.","Travel does not necessarily teach you anything about other places."]},{"name":"Student B","mins":4,"lead":"Student B answers A's questions, asks these, then talks about one statement.","prompts":["What are your strengths and weaknesses in English?","What sounds do you most associate with your childhood?","How materialistic do you think you are?","How much travelling would you like to do in your life?","What do you think the life of a celebrity chef is like?"],"talk":["Money is more important than love.","People should enjoy themselves rather than worry about their health.","Every child should have a pet."]}]}}]}];

function gapOK(it,i,x){const alts=(it.a[i]||[]);const f=it.loose?loose:norm;const pre=(it.pre||[])[i];const g=f(x);
  return alts.some(al=>{const n=f(al);if(g===n)return true;if(pre&&n.startsWith(pre.toLowerCase())&&g===n.slice(pre.length))return true;return false})}
function correct(it,v,A){
  if(it.t==='gap'){if(!Array.isArray(v))return false;
    if(it.any){const used=new Set();return v.length>=it.a.length&&it.a.every((_,k)=>{const x=v[k];const j=it.a.findIndex((al,i)=>!used.has(i)&&gapOK(it,i,x));if(j<0)return false;used.add(j);return true})}
    return it.a.every((al,i)=>gapOK(it,i,v[i]||''))}
  if(it.t==='match'&&Array.isArray(it.a)){if(!it.a.includes(v))return false;return !(it.sibs||[]).some(id=>A&&A[id]===v)}
  if(it.t==='pick'&&Array.isArray(it.a))return it.a.includes(v);
  return v===it.a}
function keyText(it){if(it.t==='gap')return it.a.map(a=>(a||[]).join(' / ')).join(' … ');if(it.t==='mc')return L[it.a]+'  '+strip(it.o[it.a]);if(it.t==='pron')return L[it.a]+'  '+it.o[it.a].replace(/[*_]/g,'');if(it.t==='stress')return it.w.map((s,i)=>i===it.a?s.toUpperCase():s).join('·');if(Array.isArray(it.a))return it.a.join(' / ');return it.a}
function ansText(it,v){if(!filled(it,v))return '—';if(it.t==='gap')return v.filter(Boolean).join(' … ');if(it.t==='mc'||it.t==='pron')return L[v]+'  '+strip((it.o[v]||'')).replace(/[*_]/g,'');if(it.t==='stress')return it.w.map((s,i)=>i===v?s.toUpperCase():s).join('·');return String(v)}
const reveal=t=>state.mode==='practice'||ts(t.id).marked;
function final(t,it){const st=ts(t.id),v=st.a[it.id];if(st.marked)return true;if(state.mode!=='practice')return false;return it.t==='gap'?!!st.chk[it.id]:filled(it,v)}

/* ---------- scoring (works for local state and stored records) ---------- */
const secOf=(t,k)=>t.secs.find(s=>s.k===k);
const isTeacherSec=s=>!!(s.writing||s.speaking||(s.k==='l'&&s.manual));
function critMax(s){if(s.writing)return s.writing.crit.reduce((a,c)=>a+c[1],0);const S=s.speaking;if(S.mode==='crit')return S.crit.reduce((a,c)=>a+c[1],0);if(S.mode==='overall')return S.max;return S.tasks.length*10}
function teacherScore(s,marks){if(!marks)return 0;const v=Object.values(marks).reduce((a,b)=>a+(+b||0),0);return Math.min(v,s.max)}
function recScore(t,rec){ // rec: {a, s, w, all:true}
  const out={};let tot=0,auto=0,autoMax=0,pending=false;
  t.secs.forEach(s=>{let sc;
    if(s.writing){sc=teacherScore(s,rec.w);if(!rec.w||!Object.keys(rec.w).length)pending=true}
    else if(s.speaking){sc=teacherScore(s,rec.s);if(!rec.s||!Object.keys(rec.s).length)pending=true}
    else{sc=s.items.reduce((a,it)=>a+((rec.fin?rec.fin(it):true)&&correct(it,rec.a[it.id],rec.a)?s.w:0),0);auto+=sc;autoMax+=s.max}
    out[s.k]=sc;tot+=sc});
  return {secs:out,tot,auto,autoMax,pending,max:t.secs.reduce((a,s)=>a+s.max,0)}}
/* stored answers and marks are JSON strings so a later write replaces them (the class record merges nested objects) */
function recA(r){if(!r)return {};if(typeof r.aj==='string'){try{return JSON.parse(r.aj)}catch(e){}}return r.a||{}}
function recTM(r){if(!r)return null;if(typeof r.tmj==='string'){try{return JSON.parse(r.tmj)}catch(e){}}return r.tm||null}
function localRec(t){const st=ts(t.id);const tm=recTM(RT.remote&&RT.remote.tests&&RT.remote.tests[t.id]);
  const useRemote=studentLocked()&&tm;return {a:st.a,s:useRemote?(tm.s||{}):st.s,w:useRemote?(tm.w||{}):st.w,fin:it=>final(t,it)}}
function secScore(t,s){return recScore(t,localRec(t)).secs[s.k]}
function secDone(t,s){const st=ts(t.id);const r=localRec(t);
  if(s.writing)return Object.keys(r.w||{}).length;if(s.speaking)return Object.keys(r.s||{}).length;
  return s.items.filter(it=>state.mode==='practice'&&!st.marked?final(t,it):filled(it,st.a[it.id])).length}
function secCount(t,s){if(s.writing)return s.writing.crit.length;if(s.speaking){const S=s.speaking;return S.mode==='crit'?S.crit.length:S.mode==='overall'?1:S.tasks.length}return s.items.length}
function secAttempted(t,s){if(s.writing||s.speaking)return secDone(t,s)?s.max:0;return s.items.filter(it=>final(t,it)).length*s.w}
function band(p){if(p>=90)return'Excellent';if(p>=75)return'Good';if(p>=60)return'Satisfactory';if(p>=40)return'Needs revision';return'Needs a lot of revision'}

/* ---------- formatting ---------- */
function fmtPron(s){return esc(s).replace(/\*(.+?)\*/g,'<b class="snd">$1</b>').replace(/_(.+?)_/g,'<u class="str">$1</u>')}
function safeHtml(s){return esc(s).replace(/&lt;(\/?)(b|i|em|u|br|p)&gt;/g,'<$1$2>').replace(/&lt;span class=&quot;hint&quot;&gt;/g,'<span class="hint">').replace(/&lt;\/span&gt;/g,'</span>')}
function fmtStem(s,fill){
  return String(s).split('\n').map(line=>{let m=line.match(/^([AB]):\s*(.*)$/);let pre='';if(m){pre='<span class="spk">'+m[1]+'</span>';line=m[2]}
    const parts=line.split(/_{3,}/);
    return pre+parts.map(safeHtml).join(fill!=null?'<span class="blank filled">'+esc(fill)+'</span>':'<span class="blank" aria-label="gap"></span>')}).join('<br>')}

function syncNote(){

function badge(t,s){return reveal(t)?secScore(t,s)+'/'+s.max:secDone(t,s)+'/'+secCount(t,s)}

/* ---------- question blocks ---------- */
function qBlock(t,it,n){
  const st=ts(t.id),v=st.a[it.id],fin=final(t,it),rv=reveal(t)&&fin,locked=fin||(st.handed&&!RT.owner);
  let h='<div class="q" id="q-'+it.id+'"><div class="n">'+n+'</div><div>';
  const ok=correct(it,v,st.a);
  if(it.t==='mc'||it.t==='pron'){
    if(it.t==='mc'&&it.q)h+='<div class="stem">'+fmtStem(it.q,(v!=null&&String(it.q).indexOf('___')>-1)?strip(it.o[v]):null)+'</div>';
    h+='<div class="opts">';
    it.o.forEach((o,j)=>{let c='opt';if(v===j)c+=' sel';if(rv&&(v!=null||st.marked)){if(j===v)c+=(j===it.a?' ok':' no');else if(j===it.a)c+=' key'}
      h+='<button class="'+c+'" data-id="'+it.id+'" data-j="'+j+'"'+(locked?' disabled':'')+' aria-pressed="'+(v===j)+'"><span class="l">'+L[j]+'</span><span>'+(it.t==='pron'?fmtPron(o):safeHtml(o))+'</span></button>'});
    h+='</div>';
  }else if(it.t==='gap'){
    const vals=Array.isArray(v)?v:[];const parts=String(it.q).split('{}');
    h+='<div class="stem" style="margin:0">';
    parts.forEach((p,i)=>{h+=safeHtml(p);
      if(i<parts.length-1){const cls=rv?(ok?' ok':' no'):'';const w=it.wide?' wide':'';
        h+='<input class="gap'+cls+w+'" data-gid="'+it.id+'" data-gi="'+i+'" value="'+esc(vals[i]||'')+'" size="'+(it.wide?36:Math.max(8,(vals[i]||'').length+2))+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer '+n+(parts.length>2?' gap '+(i+1):'')+'"'+(locked?' disabled':'')+'>'}});
    if(state.mode==='practice'&&!locked)h+='<button class="chk" data-chk="'+it.id+'">Check</button>';
    h+='</div>';
  }else if(it.t==='pick'){
    const okset=Array.isArray(it.a)?it.a:[it.a];
    h+='<div class="stem" style="margin:0">'+String(it.q).split(/(\[[^\]]+\])/).map(seg=>{
      if(!seg.startsWith('['))return safeHtml(seg);
      return'<span class="pk" role="group">'+seg.slice(1,-1).split('|').map(o=>{let c=v===o?'sel':'';if(rv){if(o===v)c=(okset.includes(o)?'ok':'no');else if(okset.includes(o))c='key'}
        return'<button class="'+c+'" data-pid="'+it.id+'" data-o="'+esc(o)+'"'+(locked?' disabled':'')+' aria-pressed="'+(v===o)+'">'+esc(o)+'</button>'}).join('')+'</span>'}).join('')+'</div>';
  }else if(it.t==='match'){
    const cls=rv?(ok?' ok':' no'):'';
    h+='<div class="mrow"><span class="mq">'+(it.qh?safeHtml(it.qh):safeHtml(it.q))+'</span><select data-mid="'+it.id+'" class="'+cls.trim()+'"'+(locked?' disabled':'')+' aria-label="Answer for '+esc(strip(it.q))+'"><option value="">Choose…</option>'+(it.part.opts||[]).map(o=>'<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>';
  }else if(it.t==='stress'){
    h+='<div class="syl" role="group" aria-label="'+esc(it.w.join(''))+'">'+it.w.map((s,j)=>{let c=v===j?'sel':'';if(rv){if(j===v)c=(j===it.a?'ok':'no');else if(j===it.a)c='key'}
      return'<button class="'+c+'" data-sid="'+it.id+'" data-j="'+j+'"'+(locked?' disabled':'')+' aria-pressed="'+(v===j)+'">'+esc(s)+'</button>'}).join('')+'</div>';
  }
  if(rv&&(filled(it,v)||st.marked))h+='<div class="verdict '+(ok?'ok">Correct':'no">Answer: '+esc(keyText(it)))+'</div>';
  return h+'</div></div>';
}
function partsBlock(t,s,withAudio){
  let h='',n=0;
  (s.parts||[]).forEach((p,pi)=>{
    if(p.title||(s.parts.length>1&&p.instr)){h+='<h3 class="part">'+(s.parts.length>1?'Exercise '+(pi+1)+(p.title?': '+esc(p.title):''):esc(p.title||''))+'</h3>';n=0}
    if(p.instr)h+='<p class="ex-note">'+esc(p.instr)+'</p>';
    if(withAudio&&p.audio)h+=playerHtml(t,pi);
    if(p.ex)h+='<p class="ex-note">Example: '+safeHtml(p.ex)+'</p>';
    if(p.legend)h+='<div class="legend">'+p.legend.map((l,i)=>'<span><b>'+L[i]+'</b>'+esc(l)+'</span>').join('')+'</div>';
    if(p.bankHtml)h+='<div class="bankbox">'+p.bankHtml.map(b=>'<span>'+safeHtml(b)+'</span>').join('')+'</div>';
    if(withAudio&&p.audio&&teacherUI()&&ts(t.id).script&&ts(t.id).script[pi])h+='<div class="script" id="lscript'+pi+'">'+p.audio.script.map((ln,i)=>'<p data-line="'+i+'"><b>'+esc(ln[0])+':</b> '+esc(ln[1])+'</p>').join('')+'</div>';
    p.items.forEach(it=>{n++;h+=qBlock(t,it,n)});
  });
  return h;
}
function renderSec(t,s){
  let h='<h2>'+esc(s.name)+'</h2>';
  if(s.passage){
    h+='<p class="focus" style="color:var(--muted)">'+esc(s.intro||'')+'</p><div class="reading"><article class="text"><h3>'+esc(s.passage.title)+'</h3>'+s.passage.paras.map(([l,p])=>'<p>'+(l?'<b class="lab">'+esc(l)+'</b>':'')+esc(p)+'</p>').join('')+'</article><div>'+partsBlock(t,s)+'</div></div>';
    return h;
  }
  if(s.listen)return h+renderListening(t,s);
  if(s.writing)return h+renderWriting(t,s);

function afterAnswer(t,it){refreshQ(t,it);renderTabs();renderLedger();renderNav();queueSync()}
function bindSec(t,s){
  const st=ts(t.id),root=$('#sec');
  const item=id=>s.items.find(x=>x.id===id);
  const lockedAll=()=>st.handed&&!RT.owner;
  root.onclick=e=>{
    const b=e.target.closest('button');if(!b||b.disabled||lockedAll())return;
    if(b.dataset.id!=null||b.dataset.sid!=null){const it=item(b.dataset.id||b.dataset.sid);if(final(t,it))return;st.a[it.id]=+b.dataset.j;save();afterAnswer(t,it);return}
    if(b.dataset.pid!=null){const it=item(b.dataset.pid);if(final(t,it))return;st.a[it.id]=b.dataset.o;save();afterAnswer(t,it);return}
    if(b.dataset.chk!=null){const it=item(b.dataset.chk);if(!filled(it,st.a[it.id])){const inp=root.querySelector('[data-gid="'+it.id+'"]');if(inp)inp.focus();return}st.chk[it.id]=true;save();afterAnswer(t,it);return}
  };
  root.oninput=e=>{const el=e.target;if(el.dataset.gid==null||lockedAll())return;const it=item(el.dataset.gid);const arr=Array.isArray(st.a[it.id])?st.a[it.id].slice():[];arr[+el.dataset.gi]=el.value;st.a[it.id]=arr;if(!it.wide)el.size=Math.max(8,el.value.length+2);save();queueSync();if(state.mode==='exam'){renderTabs();renderLedger()}};
  root.onkeydown=e=>{const el=e.target;if(e.key!=='Enter'||el.dataset.gid==null||state.mode!=='practice')return;const it=item(el.dataset.gid);if(filled(it,st.a[it.id])){st.chk[it.id]=true;save();afterAnswer(t,it)}};
  root.onchange=e=>{const el=e.target;if(el.dataset.mid==null||lockedAll())return;const it=item(el.dataset.mid);if(final(t,it))return;if(el.value)st.a[it.id]=el.value;else delete st.a[it.id];save();afterAnswer(t,it)};
  if(s.listen)bindListening(t,s);
  if(s.writing)bindWriting(t,s);
  if(s.speaking)bindSpeaking(t,s);
}

const slug=s=>ifTr(String(s||'').toLowerCase()).normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x';

let syncing=false,syncAgain=false,docExists={};
function queueSync(now){if(!RT.db||(RT.sync!=='live'&&!RT.owner))return;clearTimeout(saveTimer);saveTimer=setTimeout(doSync,now?50:2500)}
function currentKey(){if(RT.owner){if(!state.name.trim())return null;return 'dev-'+slug(state.name)+'--'+slug(state.cls)}return RT.uid}
async function doSync(){
  if(syncing){syncAgain=true;return}
  const key=currentKey();if(!key||!RT.db)return;const t=T();if(!t)return;
  syncing=true;
  try{
    const ref=RT.db.doc('results/'+key);
    const rec=recordFor(t);
    if(RT.owner){const st=ts(t.id);rec.tmj=JSON.stringify({w:st.w||{},s:st.s||{}})}
    const head={name:state.name||'',cls:state.cls||'',updated:new Date().toISOString(),src:RT.owner?'device':'student'};
    if(!docExists[key]){const g=await ref.get();docExists[key]=g.exists;
      if(!g.exists){await ref.set(Object.assign({},head,{tests:{[t.id]:rec}}));docExists[key]=true;syncing=false;if(syncAgain){syncAgain=false;doSync()}return}}
    await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}));
    RT.writeErr=null;
  }catch(e){
    if(!RT.owner&&e&&e.code==='invalid_argument'){RT.sync='code';RT.writeErr=null;renderAll()}
    else if(e&&e.code==='quota_exceeded'){RT.writeErr='The class record is full. Ask your teacher to remove old results.';renderLedger()}

}

  let p='<div class="rtpanel"><h3 class="part">Attempts and retakes</h3><p class="meta"><b>Attempt '+att+'</b>'+(R.tout?' (time ran out)':'')+'. '+(hist.length?'Earlier: '+hist.map(x=>'attempt '+x.n+', '+x.tot+' / '+x.max+' ('+rtPct(x)+'%), '+esc(fmtTime(x.at))).join('; ')+'.':'No earlier attempts.')+'</p>';
  if(live){
    if(R.ok===att)p+='<div class="rtact"><b>Retake approved.</b> <span class="meta">The student can start it now.</span><button class="ghost" id="rtcancel">Cancel approval</button></div>';
    else p+='<div class="rtact">'+(R.rq===att?'<b>The student has asked for a retake.</b>':'')+'<button class="go" id="rtok">Approve a retake</button></div>';
    p+='<div class="rtact"><span class="meta">Extra time: '+(R.tx||0)+' min</span><button class="ghost" id="rtx">Give 5 more minutes</button></div>';
  }
  p+='<p class="meta">'+esc(r.name)+'’s retake code: <span class="rtcode">'+rtCode(r.name)+'</span><br>The same code works for every test and every retake, so you only give it once. The student types it into the retake box; each retake updates this record with the new attempt.</p></div>';
  const i=h.lastIndexOf('</section>');return i>-1?h.slice(0,i)+p+h.slice(i):h+p};
const _rtBind=bindDetail;
bindDetail=function(all){_rtBind(all);if(!TV.sel)return;const r=all.find(x=>x.doc+'|'+x.id===TV.sel);if(!r)return;const att=r.r.att||1;
  const put=async(o,msg)=>{Object.assign(r.r,o);try{await RT.db.doc('results/'+r.doc).update({tests:{[r.id]:o}});TV.msg=''}catch(e){TV.msg=msg}renderTeacher(true)};
  const ok=$('#rtok');if(ok)ok.onclick=()=>put({ok:att},'Couldn’t save the approval. Try again.');
  const cn=$('#rtcancel');if(cn)cn.onclick=()=>put({ok:0},'Couldn’t save that. Try again.');
  const tx=$('#rtx');if(tx)tx.onclick=()=>put({tx:(r.r.tx||0)+5},'Couldn’t save the extra time. Try again.')};
function rtFiltered(){return rows().filter(r=>(!TV.test||r.id===TV.test)&&(!TV.cls||r.cls===TV.cls)&&(!TV.q||r.name.toLowerCase().includes(TV.q.toLowerCase())))}
async function rtCsv(list){
  const names=[],keys=[];TESTS.forEach(t=>AD.secInfo(t).forEach(s=>{if(!keys.includes(s.k)){keys.push(s.k);names.push(s.name)}}));
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const head=['Student','Class','Test','Status','Attempt','Earlier attempts','Time ran out','Updated'].concat(names,['Total','Max','Percent']);
  const lines=[head.map(q).join(',')].concat(list.map(r=>{const R=r.r;const h=rtHist(R.hj);
    return [r.name,r.cls,r.t.title,R.handed?'Handed in':R.marked?'Marked':'In progress',R.att||1,h.map(x=>x.n+': '+x.tot+'/'+x.max).join('; '),R.tout?'yes':'',r.upd]
      .concat(keys.map(k=>{const v=r.sc.secs[k];return v==null?'':v}),[r.sc.tot,r.sc.max,r.sc.max?Math.round(r.sc.tot/r.sc.max*100):''])
      .map(q).join(',')}));
  const dl=RT.dl||RT.downloads;
  try{await dl.save({filename:document.title.replace(/[^\w\- ]+/g,'').trim().slice(0,50)+' results.csv',data:new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'})})}catch(e){}
}
const _rtTeacher=renderTeacher;
renderTeacher=function(keep){
  const y=window.scrollY;_rtTeacher(keep);
  const all=rows();
  const hr=document.querySelector('#main .rtable thead tr');if(hr&&hr.children[3])hr.children[3].insertAdjacentHTML('afterend','<th class="num">Attempts</th>');
  document.querySelectorAll('#main .rtable td.empty').forEach(td=>td.colSpan=(+td.colSpan||7)+1);
  document.querySelectorAll('#main tr[data-row]').forEach(tr=>{const r=all.find(x=>x.doc+'|'+x.id===tr.dataset.row);if(!r)return;const R=r.r,att=R.att||1;const td=tr.children[3];if(!td)return;
    let tg='';if(R.tout)tg+='<span class="tag">time ran out</span>';
    if(R.ok===att)tg+='<span class="tag">retake approved</span>';else if(R.rq===att)tg+='<span class="tag warn">retake requested</span>';
    if(tg)td.insertAdjacentHTML('beforeend',' '+tg);
    td.insertAdjacentHTML('afterend','<td class="num"><b>'+att+'</b></td>')});
  const cb=$('#csvbtn');if(cb)cb.onclick=()=>rtCsv(rtFiltered());
  const imp=document.getElementById('impta');const sec=imp&&imp.closest('section');
  const g='<section class="task" id="rtgen"><h3>Retake codes</h3><p class="meta">Each student has one personal retake code for this page. It works for every test and every retake, so they only need it once. Type the name exactly as the student types it on their tests.</p><div class="rtgen"><label>Student name<input id="rtgn" value="'+esc(RTK.gn||'')+'" autocomplete="off"></label></div><div class="rtout meta" id="rtgo2"></div></section>';
  if(sec)sec.insertAdjacentHTML('afterend',g);else{const m=$('#main');if(m)m.insertAdjacentHTML('beforeend',g)}
  const upd=()=>{RTK.gn=$('#rtgn').value;$('#rtgo2').innerHTML=RTK.gn.trim()?'Retake code: <span class="rtcode">'+rtCode(RTK.gn)+'</span>':'Type a name to see the code.'};
  const gn=$('#rtgn');if(gn){gn.oninput=upd;upd()}
  if(keep)window.scrollTo(0,y);
};
const _rtImport=importCode;
importCode=async function(){
  let o=null,prevAtt=0,key='';
  try{o=await unpack($('#impta').value);key='imp-'+slug(o.n)+'--'+slug(o.c);
    if(RT.db){const g=await RT.db.doc('results/'+key).get();const P=g.exists&&g.data().tests&&g.data().tests[o.id];prevAtt=P?(P.att||1):0}}catch(e){o=null}
  await _rtImport();
  if(o&&o.id&&RT.db&&/^Imported/.test(TV.msg||'')){const att=o.att||1;const up={att,hj:o.hj||'[]',tout:!!o.tout};
    if(prevAtt&&att>prevAtt){const m=o.m||{};const has=Object.keys(m.s||{}).length||(m.w&&(typeof m.w==='object'?Object.keys(m.w).length:m.w!=null));up.tmj=has?JSON.stringify({s:m.s||{},w:m.w==null?null:m.w}):'';if(has)up.dm=true}
    try{await RT.db.doc('results/'+key).update({tests:{[o.id]:up}})}catch(e){}
    TV.msg+=' Attempt '+att+(prevAtt&&att>prevAtt?' (updated from attempt '+prevAtt+')':'')+'.';renderTeacher(true)}
};

/* adapter: English File Advanced engine */
const AD={
 sum(t){const sc=recScore(t,localRec(t));return {tot:sc.tot,max:sc.max}},
 firstSec(t){return t.secs[0].k},
 anyAnswered(t){return t.secs.some(s=>!isTeacherSec(s)&&s.items&&s.items.some(it=>final(t,it)))},
 restore(t,R){delete state.tests[t.id];const ns=ts(t.id);ns.a=recA(R);ns.wt=R.wt==null?null:R.wt;ns.wr=R.wr||'';if(R.wai){try{ns.ai=JSON.parse(R.wai)}catch(e){}}ns.plays=R.plays||{};
   ns.marked=!!R.marked;ns.handed=!!R.handed;ns.seen=!!(R.seen||R.marked||R.handed);ns.att=R.att||1;ns.hist=rtHist(R.hj)},
 secInfo(t){return t.secs.map(s=>({k:s.writing?'w':s.speaking?'s':s.k,name:s.name,items:(s.items||[]).length,words:wordsIn(s)}))},
 rate(t){return 0.6},rRate(t){return 1},writeMins(t){return 25}
};
subscribeMine=function(){try{RT.db.doc('results/'+RT.uid).onSnapshot(s=>{RT.remote=s.exists?JSON.parse(JSON.stringify(s.data()||{})):null;if(s.exists)docExists[RT.uid]=true;
  if(rtOnRemote()){renderAll();return}
  renderLedger();if(state.sec==='w'||state.sec==='s'){const t=T();const sec=secOf(t,state.sec);if(sec&&isTeacherSec(sec)){$('#sec').innerHTML=renderSec(t,sec);bindSec(t,sec)}}},e=>{})}catch(e){}};

renderAll();
initRuntime();
})();
