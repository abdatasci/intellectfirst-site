{} was read out and we learnt that our grandfather had left us all that money.","a":[["will"]],"pre":["w"]}],"ex":"It’s good to have some <b>s</b>avings – you never know when there’ll be an emergency and you’ll need some money."}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["al","ter","na","tive"],"a":1,"word":"alternative"},{"t":"stress","w":["de","ter","mined"],"a":1,"word":"determined"},{"t":"stress","w":["dis","tin","guish"],"a":1,"word":"distinguish"},{"t":"stress","w":["con","tent","ment"],"a":1,"word":"contentment"},{"t":"stress","w":["ex","ten","sion"],"a":1,"word":"extension"}],"ex":"time|table"},{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"c<b>o</b>nclude","a":"collide","grp":null,"slot":0},{"t":"match","q":"r<b>e</b>cent","a":"meantime","grp":null,"slot":0},{"t":"match","q":"f<b>o</b>cus <span class=\"hint\">(1 of 2)</span>","a":["process","trophy"],"grp":"snd8-3","slot":0},{"t":"match","q":"f<b>o</b>cus <span class=\"hint\">(2 of 2)</span>","a":["process","trophy"],"grp":"snd8-3","slot":1},{"t":"match","q":"m<b>e</b>ditation","a":"exercising","grp":null,"slot":0}],"ex":"d<b>i</b>stance → risk","bankHtml":["c<b>o</b>llide","<b>e</b>xercising","m<b>e</b>antime","pr<b>o</b>cess","r<b>i</b>sk","tr<b>o</b>phy"],"opts":["collide","exercising","meantime","process","risk","trophy"]}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"A Study Of Multitasking","paras":[["","Technology increasingly makes it possible for people to do more than one task at a time, for example moving between browsing the web and using other computer programs, talking on mobile phones while driving, or flying a jet and monitoring air traffic. Indeed, the word describing this – ‘multitasking’ – has gone from being invented to being commonly used in everyday life in a remarkably short time. A recent study has looked at whether multitasking is purely beneficial or whether it has a downside, especially when the tasks being done together are complicated ones. The researchers concluded that when people are multitasking, they are using what they call ‘executive control’ processes. These processes concern different parts of the brain and involve the brain allocating different mental resources to different tasks and deciding which tasks are more important than others. The brain’s executive control gives the appropriate resources to the different aspects of tasks, such as understanding what the task requires, thinking about what to do, and taking action. The researchers conducted an experiment into how much time was lost when people repeatedly switched between two tasks. The tasks varied in terms of how complex they were and how familiar the subjects were with doing those tasks, and they included such things as solving mathematical problems and classifying geometric objects. The researchers measured how long it took the subjects to carry out the tasks and considered the speed in connection with whether the tasks were familiar or unfamiliar, and whether the rules for doing them were simple or complicated. The results of the experiments were the same for every kind of task. In each case, the subjects lost time when they moved from one task to another, and the amount of time they lost increased when the tasks were complex or unfamiliar. When they were familiar with a task, they were able to adapt to changing to it and get on with it much more quickly. The researchers say that these results indicate that the brain’s executive control consists of two separate stages. They called the first stage ‘goal shifting’, meaning a preference to do one of the tasks rather than the other at a particular moment. The second stage they named ‘rule activation’, meaning moving from engaging with the rules associated with how to go about one task to engaging with the rules involved in doing the other task. The second stage, rule activation, takes a significant amount of time, and this delay multiplies when people keep switching between tasks. The result is that quite a lot of time is lost"],["","when multitasking, in comparison with the time that would be taken if each task was completed separately."],["","This has major implications for multitasking, suggesting that although people may think that it saves time without affecting efficiency, in reality it actually takes more time, and this may have an adverse effect on efficiency. In the case of someone using a phone while driving, multitasking could mean that they are not in full control of their vehicle during the short period when they are switching to using the phone. The researchers feel that their research has important consequences for multitasking. Their conclusions regarding executive control and how it works may, they believe, help people to look for strategies that will enable them to operate in the most efficient way possible when they are multitasking. And an understanding of executive mental control could have an impact on the design of the technology involved in such areas as operating aircraft and air traffic control, as well as other activities where the interface between humans and computers is crucial to efficiency. In addition, there are other possible applications of this research. Understanding how people function while multitasking could assist with recruitment, training, and assessment of personnel in the workplace. It could also have an influence on government and industrial regulations, assist in the diagnosis and treatment of brain-damaged patients, and increase our general understanding of how the brain works."]]},"parts":[{"items":[{"t":"mc","q":"What does the writer suggest about the word ‘multitasking’?","o":["It has changed in meaning since it was invented.","It is not always used appropriately.","Its increased use reflects a change in everyday life."],"a":2},{"t":"mc","q":"The aim of the research was to ___.","o":["compare the advantages and disadvantages of multitasking","discover why multitasking is regarded as a wholly good thing","find out if there are any negative effects of multitasking"],"a":2},{"t":"mc","q":"The researchers use the term ‘executive control’ to describe how the brain ___.","o":["controls some actions more than others","organizes how different tasks are carried out","distinguishes between easier and harder tasks"],"a":1},{"t":"mc","q":"What do we learn about the experiment?","o":["The researchers knew that some of the subjects had done similar tasks before.","Not all of the subjects did the same tasks.","The subjects started with simple tasks and moved on to more complicated ones."],"a":0},{"t":"mc","q":"Which of the following happened during the experiment?","o":["Sometimes little time was lost moving from one task to another.","Some subjects always found it hard to move from one task to another.","Complex tasks presented more problems than unfamiliar tasks."],"a":0},{"t":"mc","q":"One of the two stages of the brain’s executive control ___.","o":["leads to a major disadvantage of multitasking","takes longer for some people than for others","has no connection with multitasking"],"a":0},{"t":"mc","q":"One of the implications of the research is that ___.","o":["some people are not suited to multitasking","multitasking always results in less efficiency","a common attitude to multitasking is wrong"],"a":2},{"t":"mc","q":"The researchers believe that their research might ___.","o":["encourage people not to do multitasking in some situations","affect the way that people approach multitasking","result in technology replacing people for certain tasks"],"a":1},{"t":"mc","q":"In the final paragraph, the writer says that multitasking is something that ___.","o":["is likely to increase in the future","people in authority have paid too little attention to","is relevant in many areas of life"],"a":2},{"t":"mc","q":"What is the main topic of the text?","o":["The growth of multitasking","How complicated the brain’s processes for multitasking are","The relationship between multitasking and efficiency"],"a":2}]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Write an article of approximately 250 words for an English-language magazine about how one of the areas below has changed in the last 20 years in your country and say whether you think the changes are positive or negative.</p>","<p>1 People’s work-life balance</p>","<p>2 Family life</p>","<p>3 How people spend their free time</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to five people talking about the disadvantages of various jobs. Match the speakers (1–5) to their feelings about money (A–H).","legend":["the budget-conscious person who wants to spend as little as possible regardless of quality","the saver who wants to get as much as possible out of every pound spent","the professional who wants everyone to know how their money works","the student who wants to know how to budget before leaving school","the person who doesn’t understand why everyone is so anxious about money","the person who wants to start life without debt, but knows it’s not possible","the person who recommends planning for what to do about money after finishing a career","the person who doesn’t know where the money goes"],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"H"},{"t":"match","q":"Speaker 2","a":"B"},{"t":"match","q":"Speaker 3","a":"F"},{"t":"match","q":"Speaker 4","a":"G"},{"t":"match","q":"Speaker 5","a":"E"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","I earn a reasonable salary, I don't go on expensive holidays, and I don't buy designer clothes. And yet by the twentieth of every month my account is almost empty. I honestly couldn't tell you what I spend it on. I keep promising myself I'll write it all down, but I never do."],["Narrator","Speaker two."],["Speaker 2","I'm careful with money, but I'm not mean. I don't automatically buy the cheapest thing. I'll happily pay more for shoes if they'll last five years instead of one. What I want is real value: the most use I can get out of every pound I part with."],["Narrator","Speaker three."],["Speaker 3","I'm about to go to university, and I'd love to finish my degree without owing anyone anything. I've worked every summer since I was fifteen and saved most of it. But I've done the maths, and with fees and rent it's just not realistic. I'll have a loan like everyone else. I'll just try to keep it as small as I can."],["Narrator","Speaker four."],["Speaker 4","I've just retired after forty years as a teacher, and the one piece of advice I'd give younger colleagues is to think now about the years after work. Everyone plans their career, but very few people plan how they'll live once the salary stops. Start early and you'll be glad you did."],["Narrator","Speaker five."],["Speaker 5","My friends are always talking about prices, savings and interest rates, and some of them lose sleep over it. I find it a bit strange, to be honest. I pay my bills, I've got a little put aside, and I don't see the point of getting so stressed about it all. Life's too short."]]}},{"instr":"Listen to an interview about time management. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"What does Margaret Cooper do?","o":["She is a time management specialist with a university in the area.","She helps students by scheduling their work and free time for them.","She works at the local university helping students with their homework."],"a":0},{"t":"mc","q":"According to Margaret Cooper, what is the first step to good time management?","o":["Knowing what your priorities are for how you spend your time.","Keeping an organized planner or scheduler.","Knowing how you spend your time now."],"a":2},{"t":"mc","q":"Where do many students find something to help them schedule their time?","o":["In the back of their textbooks.","Right on their mobile phones.","On their laptops."],"a":1},{"t":"mc","q":"What is an example Cooper gives of something that should be a higher priority on a student’s planner?","o":["dating","parties","work schedule"],"a":2},{"t":"mc","q":"What does Cooper say is an added benefit of organizing one’s time?","o":["Students were able to enjoy their social time more.","Students were able to enjoy their video games more.","Students were able to enjoy their homework more."],"a":0}],"audio":{"script":[["Interviewer","With exams coming up, many students are feeling the pressure. With me is Margaret Cooper. Margaret, tell us what you do."],["Margaret","I'm a time management specialist, and I work for the university here in town. Students come to me when they're struggling to fit everything in. I don't do their homework, and I don't plan their week for them. I teach them how to do that themselves."],["Interviewer","So where should a student begin?"],["Margaret","Most people think the first step is buying a nice planner or deciding on their priorities. Those come later. The very first thing is to find out how you actually use your time at the moment. I ask students to keep a record for one week, every hour. They're always shocked by how much time disappears."],["Interviewer","And then they need some kind of schedule?"],["Margaret","Yes, but they don't need to buy anything. Most of them are carrying the perfect tool around already. Every smartphone has a calendar app. Students can set reminders and colour-code their week right there on their phones."],["Interviewer","How do they decide what goes in first?"],["Margaret","That's about priorities. Lectures and deadlines come first, obviously. But many students also have part-time jobs, and their shifts often get forgotten until the last minute. I tell them to put their work schedule in before anything else, before parties or dates or anything social."],["Interviewer","That sounds like it leaves very little time for fun."],["Margaret","Actually, the opposite happens. When students know their work is under control, they stop feeling guilty when they go out. Several told me they enjoyed time with their friends far more once they'd got organized, because they weren't worrying all evening about an essay."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["How do most people get their knowledge of wealthy people?","Are you good at managing your money? Why or why not?","Which modern gadget do you think wastes people’s time?","How do you communicate most with friends and family?","Which gadget would it be difficult for you to live without?"],"talk":["‘There is nothing wrong with wanting to be wealthy.’","‘It is better to be very busy than not busy at all.’","‘I need to learn how to manage my time better.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft06a","kind":"file","group":"ft06","ver":"A","title":"File 6 Test A","focus":"6A Help and advice, 6B Technology: verb + object + infinitive or gerund, conditional sentences, phones and technology.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Underline the correct word(s).","items":[{"t":"pick","q":"Provided Mel [brought|brings] his guitar tomorrow, we’re going to have a sing-along.","a":"brings"},{"t":"pick","q":"If we [have|had] two more people, we’d have enough to play a proper football match.","a":"had"},{"t":"pick","q":"I would [call|have called] to say I was going to be late if I hadn’t lost my mobile.","a":"have called"},{"t":"pick","q":"[Suppose|Supposing] you got lost and couldn’t find your way home. What would you do?","a":["Supposing","Suppose"]},{"t":"pick","q":"Had I known it was your birthday, I would [have made|made] a cake.","a":"have made"},{"t":"pick","q":"I’ll tell you everything as long as you [will promise|promise] not to laugh at me.","a":"promise"},{"t":"pick","q":"[Even if|Provided that] I win the lottery, I will still go to work every day.","a":"Even if"}],"ex":"Can I borrow / borrowed 20 euros until tomorrow as long as you don’t need it?"},{"instr":"Complete the sentences with the gerund or the infinitive form of the verb in brackets.","items":[{"t":"gap","q":"I would hate him {} (think) I’m not interested in his project.","a":[["to think"]]},{"t":"gap","q":"He dislikes people {} (make) a noise while he’s studying.","a":[["making"]]},{"t":"gap","q":"He’s waiting for his train {} (arrive).","a":[["to arrive"]]},{"t":"gap","q":"My uncle advised me {} (visit) Italy before the weather gets too hot.","a":[["to visit"]]},{"t":"gap","q":"They’d better not keep me {} (wait). I’m too busy to waste time sitting here.","a":[["waiting"]]},{"t":"gap","q":"Please let me {} (come) with you. I am bored all on my own.","a":[["come"]]},{"t":"gap","q":"Would you mind {} (take) your shoes off? I’ve just cleaned the floor.","a":[["taking"]]}],"ex":"I’d like you to phone (phone) my office and tell them I’m ill."},{"instr":"Is the sentence right or wrong? Write correct or incorrect.","items":[{"t":"mc","q":"I’d like you to send me a confirmation email for this transaction.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"He has advised to us to keep the party a secret.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"I would hate for you to think that we’d forgotten you.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"We’ve arranged for you departing at 5.00 tonight.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"I dislike people to make decisions for me when I can make them myself.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"He warned us to watch out for internet scams. I guess we should have listened.","o":["correct","incorrect"],"a":0}],"ex":"We expect the game to end around 8.00.  correct"}]},{"k":"v","name":"Vocabulary","max":20,"w":1,"parts":[{"instr":"Complete the sentences with the correct word.","items":[{"t":"mc","q":"You often find that if you’re driving through an area with lots of trees, your ___ will be very poor.","o":["signal","battery","beep"],"a":0},{"t":"mc","q":"It’s frustrating when you call a number and it’s constantly ___!","o":["unavailable","engaged","occupied"],"a":1},{"t":"mc","q":"You could try the ___, but it’s unlikely that anyone’s at home at this time of day.","o":["voicemail","reception","landline"],"a":2},{"t":"mc","q":"Oh no! I’ve left my mobile at home – I forgot to ___ it before I left this morning.","o":["call","unplug","do"],"a":1},{"t":"mc","q":"There must be some issue at work. I have six ___ calls from the office.","o":["missed","lost","busy"],"a":0},{"t":"mc","q":"Hang on – the ___ isn’t great here. I’ll just move to another room.","o":["tone","reception","sign"],"a":1}],"ex":"I always forget to charge my phone at night, so it often stops working early the next morning. unplug  call  charge"},{"instr":"Complete the sentences with the correct preposition.","items":[{"t":"gap","q":"Some students are obsessed {} getting the highest marks possible.","a":[["with"]]},{"t":"gap","q":"Some actors are famous {} their work, others for the things they do off-screen.","a":[["for"]]},{"t":"gap","q":"I’m so sick {} eating jam sandwiches! I really need to go shopping.","a":[["of"]]},{"t":"gap","q":"He’s really fond {} going to the restaurant around the corner. They treat him well.","a":[["of"]]},{"t":"gap","q":"I’m afraid to admit that I’m hooked {} the doughnuts from the shop down the street.","a":[["on"]]},{"t":"gap","q":"Even though they don’t always show it, parents are often proud {} their children.","a":[["of"]]}],"ex":"Y oung children are dependent on their parents for help."},{"instr":"Choose one word to form a compound adjective with the word in italics.","items":[{"t":"mc","q":"blue-___","o":["heeled","sighted","eyed"],"a":2},{"t":"mc","q":"air-___","o":["conditioned","behaved","minded"],"a":0},{"t":"mc","q":"last-___","o":["hand","minute","term"],"a":1},{"t":"mc","q":"narrow-___","o":["behaved","made","minded"],"a":2},{"t":"mc","q":"long-___","o":["term","out","free"],"a":0},{"t":"mc","q":"kind-___","o":["hearted","handed","heeled"],"a":0},{"t":"mc","q":"absent-___","o":["heeled","minded","produced"],"a":1},{"t":"mc","q":"easy-___","o":["hearted","free","going"],"a":2}],"ex":"produced → sighted → minded →  mass-produced"}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"r<b>e</b>cords <span class=\"hint\">(1 of 2)</span>","a":["concentrate","novel"],"grp":"snd7-1","slot":0},{"t":"match","q":"r<b>e</b>cords <span class=\"hint\">(2 of 2)</span>","a":["concentrate","novel"],"grp":"snd7-1","slot":1},{"t":"match","q":"t<b>e</b>dious","a":"colleague","grp":null,"slot":0},{"t":"match","q":"d<b>e</b>vice <span class=\"hint\">(1 of 2)</span>","a":["devote","emotionally"],"grp":"snd7-3","slot":0},{"t":"match","q":"d<b>e</b>vice <span class=\"hint\">(2 of 2)</span>","a":["devote","emotionally"],"grp":"snd7-3","slot":1}],"ex":"t<b>ur</b>nover → work","bankHtml":["coll<b>ea</b>gue","conc<b>e</b>ntrate","d<b>e</b>vote","<b>e</b>motionally","nov<b>e</b>l","w<b>or</b>k"],"opts":["colleague","concentrate","devote","emotionally","novel","work"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["con","tac","ta","ble"],"a":1,"word":"contactable"},{"t":"stress","w":["glam","or","ous"],"a":0,"word":"glamorous"},{"t":"stress","w":["per","cep","tion"],"a":1,"word":"perception"},{"t":"stress","w":["sub","stan","tial"],"a":1,"word":"substantial"},{"t":"stress","w":["plau","si","bil","i","ty"],"a":2,"word":"plausibility"}],"ex":"con|ference"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Help Yourself","paras":[["","In the last couple of decades, self-help books have been a publishing phenomenon, often topping the best-seller lists. Readers have lapped up their advice on how to do a wide variety of things, from becoming successful and rich to improving their relationships. If you’re facing a particular problem in your life, there’s a host of self-help books for you. If you have the idea that you want to improve yourself in some way, there are any number of self-help titles just waiting to advise you. If you want a successful career, no problem – step-by-step guides will tell you exactly what to do. But, despite their enormous success, there’s a question many people ask: do these books actually do what they claim to? Obviously, as in any field of publishing, some self-help books are better than others. Some may be based on actual research and case studies – there’s some substance to them that suggests they can, at least to some extent, be taken seriously. Others, however, amount to little more than psychobabble – empty nonsense dressed up as serious psychological insight. These books bombard the reader with a mass of meaningless jargon, disguising the fact that they have nothing to say beyond the obvious that you would not need to buy a book to know. It’s the latter category that has given self-help books a bad name among critics of the genre. The kind of advice given in self-help books is often more or less the same. What really amounts to pretty standard statements are made in many of them, but does this advice stand up to scrutiny? Psychologists who have studied a range of self-help books connected with happiness say the answer to this is ‘not always’. They say that although the emphasis the books place on aiming for good relationships with families, friends, and colleagues has, in some ways, some scientific basis in terms of what does actually lead to personal happiness, in other ways the advice given is actually false. For example, the books commonly tell you that it is good to express your anger; the psychologists say this simply causes you to remain angry. You are often told to try to think happy thoughts when you are sad; the psychologists say that attempting to do this simply emphasizes your unhappiness for you. The books tell you to focus entirely on your aims in life, looking only at the desired outcome; psychologists say you need to focus just as much on the problems you have to overcome in order to reach your goals. The books tell you to keep praising yourself to increase and maintain a high level of self-belief; the psychologists say that actually this doesn’t work because"],["","you need praise from other people in order to increase your self-esteem. Perhaps the key question on self-help books is: do they work? Do people feel they have directly helped them? Whatever critics may say, do the people who buy and read them get real results from them? The answer to this question appears to be ‘sometimes’. Research indicates that the kind of book that deals with a particular problem can be effective in helping people with that problem, particularly if the problem in question isn’t a severe one, for example mild depression or anxiety. The situation is less clear with books dealing with personal growth or development. Some people do say that these books have helped them but it is by no means certain, and hard to measure, whether this is really the case."],["","What is clear about all self-help books, however, is that they offer people hope. The actual advice they give and whether or not this is accurate or effective is probably less important than the fact that they tell the reader that change is possible, that there is hope of a better life, that people can overcome difficulties and improve themselves and their situation. While this may sound like a good thing, there is, however, a downside to it. To get people to buy them, these books often make exaggerated claims about what they will do for people. They can raise unrealistic expectations in the reader, suggesting that a better life can quite easily be achieved, that anyone can get what they want out of life. The truth is, of course, that changing yourself and your life may be very difficult indeed and require an immense amount of effort, if it is even achievable at all. So self-help books are open to the claim that they present a false picture that can only lead to disappointment in the end."]]},"parts":[{"items":[{"t":"mc","q":"In the first paragraph, what does the writer emphasize about self-help books?","o":["The fact that one person might buy many of them.","How quickly the genre became popular.","The number of them available."],"a":2},{"t":"mc","q":"In the second paragraph, the writer expresses a preference for self-help books which ___.","o":["don’t use any jargon at all","explain technical terms in a clear way","give examples to support their advice"],"a":2},{"t":"mc","q":"The writer says that self-help books containing a lot of ‘psychobabble’ ___.","o":["are seldom popular with readers","have affected the reputation of all self-help books","exist in greater numbers than other kinds of self-help books"],"a":1},{"t":"mc","q":"What does the writer say about self-help books connected with happiness?","o":["There is evidence to support some of the advice they give.","They vary more than other kinds of self-help books.","They are the most popular kind of self-help book."],"a":0},{"t":"mc","q":"Psychologists say that some advice in books about happiness ___.","o":["could produce different bad feelings in people","could make people feel worse than they did","is too hard for people to carry out"],"a":1},{"t":"mc","q":"Which of the following do psychologists believe?","o":["You won’t have greater self-confidence unless other people praise you.","Focusing on problems is more important than focusing on goals.","Thinking only about aims can result in greater unhappiness."],"a":0},{"t":"mc","q":"Research into whether self-help books really help people suggests that ___.","o":["those dealing with personal growth and development are the least useful","people want to believe that they have helped them a lot","they are not very useful for serious problems"],"a":2},{"t":"mc","q":"What do all self-help books have in common, according to the writer?","o":["They all contain some useful advice.","They all have the same basic message.","They all sympathize with the reader."],"a":1},{"t":"mc","q":"When asking whether self-help books work, the writer suggests that ___.","o":["this may be more important than whether the advice is correct","not enough attention has been paid to this","readers may not be honest about this"],"a":0},{"t":"mc","q":"The writer concludes in the last paragraph that self-help books ___.","o":["are more influential than is generally thought","may actually be harmful to people","are only taken seriously by certain kinds of people"],"a":1}]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>Choose one of the essay titles below and write about the pros and cons in approximately 250 words.</p>","<p>1 Gadgets make daily life easier – or do they?</p>","<p>2 The success of a company depends on the happiness of its employees.</p>","<p>3 Self-help books can do more harm than good.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to an interview about computer addiction. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"What does the interviewer say about computer addiction in her introduction?","o":["It causes disagreement among experts.","It affects a great many people.","It is unlikely that it really exists."],"a":0},{"t":"mc","q":"Colin says that one reason why computer addiction is a difficult subject is that ___.","o":["it is easy for people to be addicted to computers without realizing it","people don’t want to think that it is similar to common addictions","reasons why people use computers for a long time vary considerably"],"a":2},{"t":"mc","q":"What is Colin’s point about hobbies?","o":["Many people spend longer doing hobbies than using computers.","People don’t usually think that a hobby can be an addiction.","They can be just as addictive as computer use."],"a":1},{"t":"mc","q":"What does Colin say about computer-game addiction?","o":["Official organizations are likely to accept that it exists in the future.","It has not been officially identified as a medical problem.","Experts consider it to be an addiction when it is very serious."],"a":1},{"t":"mc","q":"What is Colin’s personal opinion on computer addiction?","o":["Some people think they have an addiction, but they don’t.","More people will believe that computer use can become an addiction.","Certain behaviour probably indicates the existence of an addiction."],"a":2}],"audio":{"script":[["Interviewer","Today we're talking about computer addiction, a subject on which the experts simply can't agree. Some say it's a real condition, while others say the term is meaningless. My guest is Colin Hart, a psychologist. Colin, why is it so difficult?"],["Colin","One reason is that people spend long hours on computers for completely different reasons. One person is working, another is chatting to family abroad, another is gaming all night. You can't put all of those into one category and call it an addiction."],["Interviewer","But surely some of them are addicted?"],["Colin","Perhaps. But think about hobbies. Someone might spend every weekend fishing or building model trains, and nobody calls that an addiction. We tend to see hobbies as healthy and harmless, whatever the time involved. Yet when the activity is on a screen, we immediately start using medical language."],["Interviewer","What about computer games specifically?"],["Colin","There's been a lot of research, but as things stand, game addiction isn't officially recognized as a medical condition. It doesn't appear on the official lists of disorders. Whether that will change, I really couldn't say."],["Interviewer","And what's your own view?"],["Colin","I think we should look at behaviour rather than hours. If someone misses meals, lies to their family about how long they've been online, or feels anxious and irritable when they can't get on a computer, then I'd say that's very likely to be an addiction, whatever we call it officially."]]}},{"instr":"Listen to a teenager called Zak talking about a social experiment called ‘Digital Detox’ that he did with his friends. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"Where does Zak say the inspiration came from for the ‘Digital Detox’ experiment?","o":["some of his friends responding to a bet","one of his teachers setting the students a challenge","a similar experiment in a recent film about social networking"],"a":1},{"t":"mc","q":"Who does Zak say was responsible for keeping an eye on the students during the experiment?","o":["some of his teachers","some students from his class","some students from another class"],"a":2},{"t":"mc","q":"What does Zak say he found particularly strange during the experiment?","o":["resorting to the landline to call his girlfriend","refraining from making posts on Facebook","realizing that his phone wasn’t in his pocket"],"a":2},{"t":"mc","q":"How does Zak say one of his friends managed to deal with the rules of the experiment?","o":["by notifying her Facebook friends of her intentions","by having her security details changed","by giving her phone to her parents"],"a":1},{"t":"mc","q":"What does Zak say he did once the experiment had come to an end?","o":["He continued to limit his daily use of social media.","He decided to give up using social media for an extended period of time.","He carried on using social media exactly as he had beforehand."],"a":0}],"audio":{"script":[["Zak","It all started in our IT lesson. Our teacher, Mr Patel, said he didn't believe any of us could survive a week without our phones and social media. He challenged the whole class to try it, so we did. We called it 'Digital Detox'."],["Zak","We had to hand our phones in on Monday morning, and we weren't allowed to log in to anything from home. To make sure nobody cheated, some students from the class next door kept an eye on us. They checked our accounts every day to see if we'd posted anything."],["Zak","Not posting on Facebook was easier than I expected, and I used our landline to call my girlfriend, which was quite funny. The weirdest thing was the reflex. I'd keep putting my hand in my pocket to check my phone, and every time I'd get a shock that it wasn't there."],["Zak","Some people found it really hard. My friend Leila knew she'd be tempted to log in, so she asked her brother to change her password and keep it secret until the end of the week. That way she couldn't get into her accounts even if she wanted to."],["Zak","When the week ended, I didn't go back to how I was. I didn't give up social media either, but now I only allow myself half an hour a day, and I've kept to that ever since."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["What, in your opinion, are the main causes of stress in modern society?","How do you personally cope with stress?","Which aspect of your life would you like to improve and why?","Which contemporary gadget could you not live without and why?","What are the main problems caused by our over-reliance on technology?"],"talk":["‘Exams are the best way of measuring a student’s progress.’","‘It’s best to live at home with your parents until you decide to get married.’","‘Addictions are the greatest problem in society today.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft06b","kind":"file","group":"ft06","ver":"B","title":"File 6 Test B","focus":"6A Help and advice, 6B Technology: verb + object + infinitive or gerund, conditional sentences, phones and technology.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Is the sentence right or wrong? Write correct or incorrect.","items":[{"t":"mc","q":"I dislike people to make decisions for me when I can make them myself.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"He has advised to us to keep the party a secret.","o":["correct","incorrect"],"a":1},{"t":"mc","q":"I’d like you to send me a confirmation email for this transaction.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"He warned us to watch out for internet scams. I guess we should have listened.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"I would hate for you to think that we’d forgotten you.","o":["correct","incorrect"],"a":0},{"t":"mc","q":"We’ve arranged for you departing at 5.00 tonight.","o":["correct","incorrect"],"a":1}],"ex":"We expect the game to end around 8.00.  correct"},{"instr":"Underline the correct word(s).","items":[{"t":"pick","q":"I’ll tell you everything as long as you [will promise|promise] not to laugh at me.","a":"promise"},{"t":"pick","q":"Provided Mel [brought|brings] his guitar tomorrow, we’re going to have a sing-along.","a":"brings"},{"t":"pick","q":"[Even if|Provided that] I win the lottery, I will still go to work every day.","a":"Even if"},{"t":"pick","q":"I would [call|have called] to say I was going to be late if I hadn’t lost my mobile.","a":"have called"},{"t":"pick","q":"[Suppose|Supposing] you got lost and couldn’t find your way home. What would you do?","a":["Supposing","Suppose"]},{"t":"pick","q":"If we [have|had] two more people, we’d have enough to play a proper football match.","a":"had"},{"t":"pick","q":"Had I known it was your birthday, I would [have made|made] a cake.","a":"have made"}],"ex":"Can I borrow / borrowed 20 euros until tomorrow as long as you don’t need it?"},{"instr":"Complete the sentences with the gerund or the infinitive form of the verb in brackets.","items":[{"t":"gap","q":"Would you mind {} (take) your shoes off? I’ve just cleaned the floor.","a":[["taking"]]},{"t":"gap","q":"Please let me {} (come) with you. I am bored all on my own.","a":[["come"]]},{"t":"gap","q":"He dislikes people {} (make) noise while he’s studying.","a":[["making"]]},{"t":"gap","q":"I would hate him {} (think) I’m not interested in his project.","a":[["to think"]]},{"t":"gap","q":"They’d better not keep me {} (wait). I’m too busy to waste time sitting here.","a":[["waiting"]]},{"t":"gap","q":"My uncle advised me {} (visit) Italy before the weather gets too hot.","a":[["to visit"]]},{"t":"gap","q":"He’s waiting for his train {} (arrive).","a":[["to arrive"]]}],"ex":"I’d like you to phone (phone) my office and tell them I’m ill."}]},{"k":"v","name":"Vocabulary","max":20,"w":1,"parts":[{"instr":"Complete the sentences with the correct word.","items":[{"t":"mc","q":"It’s frustrating when you call a number and it’s constantly ___!","o":["unavailable","engaged","occupied"],"a":1},{"t":"mc","q":"Hang on – the ___ isn’t great here. I’ll just move to another room.","o":["tone","reception","sign"],"a":1},{"t":"mc","q":"Oh no! I’ve left my mobile at home – I forgot to ___ it before I left this morning.","o":["call","unplug","do"],"a":1},{"t":"mc","q":"You could try the ___, but it’s unlikely that anyone’s at home at this time of day.","o":["voicemail","reception","landline"],"a":2},{"t":"mc","q":"You often find that if you’re driving through an area with lots of trees, your ___ will be very poor.","o":["signal","battery","beep"],"a":0},{"t":"mc","q":"There must be some issue at work. I have six ___ calls from the office.","o":["missed","lost","busy"],"a":0}],"ex":"I always forget to charge my phone at night, so it often stops working early the next morning. unplug  call  charge"},{"instr":"Complete the senteneces with the correct preposition.","items":[{"t":"gap","q":"I’m so sick {} eating jam sandwiches! I really need to go shopping.","a":[["of"]]},{"t":"gap","q":"Some students are obsessed {} getting the highest marks possible.","a":[["with"]]},{"t":"gap","q":"Even though they don’t always show it, parents are often proud {} their children.","a":[["of"]]},{"t":"gap","q":"Some actors are famous {} their work, others for the things they do off-screen.","a":[["for"]]},{"t":"gap","q":"I’m afraid to admit that I’m hooked {} the doughnuts from the shop down the street.","a":[["on"]]},{"t":"gap","q":"He’s really fond {} going to the restaurant around the corner. They treat him well.","a":[["of"]]}],"ex":"Y oung children are dependent on their parents for help."},{"instr":"Choose one word to form a compound adjective with the word in italics.","items":[{"t":"mc","q":"long-___","o":["term","out","free"],"a":0},{"t":"mc","q":"blue-___","o":["heeled","sighted","eyed"],"a":2},{"t":"mc","q":"absent-___","o":["heeled","minded","produced"],"a":1},{"t":"mc","q":"air-___","o":["conditioned","behaved","minded"],"a":0},{"t":"mc","q":"last-___","o":["hand","minute","term"],"a":1},{"t":"mc","q":"kind-___","o":["hearted","handed","heeled"],"a":0},{"t":"mc","q":"narrow-___","o":["behaved","made","minded"],"a":2},{"t":"mc","q":"easy-___","o":["hearted","free","going"],"a":2}],"ex":"produced → sighted → minded →  mass-produced"}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["sub","stan","tial"],"a":1,"word":"substantial"},{"t":"stress","w":["con","tac","ta","ble"],"a":1,"word":"contactable"},{"t":"stress","w":["per","cep","tion"],"a":1,"word":"perception"},{"t":"stress","w":["glam","or","ous"],"a":0,"word":"glamorous"},{"t":"stress","w":["plau","si","bil","i","ty"],"a":2,"word":"plausibility"}],"ex":"con|ference"},{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"d<b>e</b>vice <span class=\"hint\">(1 of 2)</span>","a":["devote","emotionally"],"grp":"snd8-1","slot":0},{"t":"match","q":"d<b>e</b>vice <span class=\"hint\">(2 of 2)</span>","a":["devote","emotionally"],"grp":"snd8-1","slot":1},{"t":"match","q":"r<b>e</b>cords <span class=\"hint\">(1 of 2)</span>","a":["concentrate","novel"],"grp":"snd8-2","slot":0},{"t":"match","q":"r<b>e</b>cords <span class=\"hint\">(2 of 2)</span>","a":["concentrate","novel"],"grp":"snd8-2","slot":1},{"t":"match","q":"t<b>e</b>dious","a":"colleague","grp":null,"slot":0}],"ex":"t<b>ur</b>nover → work","bankHtml":["coll<b>ea</b>gue","conc<b>e</b>ntrate","d<b>e</b>vote","<b>e</b>motionally","nov<b>e</b>l","w<b>or</b>k"],"opts":["colleague","concentrate","devote","emotionally","novel","work"]}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article and tick (✓) A, B, or C.","passage":{"title":"Help Yourself","paras":[["","In the last couple of decades, self-help books have been a publishing phenomenon, often topping the best-seller lists. Readers have lapped up their advice on how to do a wide variety of things, from becoming successful and rich to improving their relationships. If you’re facing a particular problem in your life, there’s a host of self-help books for you. If you have the idea that you want to improve yourself in some way, there are any number of self-help titles just waiting to advise you. If you want a successful career, no problem – step-by-step guides will tell you exactly what to do. But, despite their enormous success, there’s a question many people ask: do these books actually do what they claim to? Obviously, as in any field of publishing, some self-help books are better than others. Some may be based on actual research and case studies – there’s some substance to them that suggests they can, at least to some extent, be taken seriously. Others, however, amount to little more than psychobabble – empty nonsense dressed up as serious psychological insight. These books bombard the reader with a mass of meaningless jargon, disguising the fact that they have nothing to say beyond the obvious that you would not need to buy a book to know. It’s the latter category that has given self-help books a bad name among critics of the genre. The kind of advice given in self-help books is often more or less the same. What really amounts to pretty standard statements are made in many of them, but does this advice stand up to scrutiny? Psychologists who have studied a range of self-help books connected with happiness say the answer to this is ‘not always’. They say that although the emphasis the books place on aiming for good relationships with families, friends, and colleagues has, in some ways, some scientific basis in terms of what does actually lead to personal happiness, in other ways the advice given is actually false. For example, the books commonly tell you that it is good to express your anger; the psychologists say this simply causes you to remain angry. You are often told to try to think happy thoughts when you are sad; the psychologists say that attempting to do this simply emphasizes your unhappiness for you. The books tell you to focus entirely on your aims in life, looking only at the desired outcome; psychologists say you need to focus just as much on the problems you have to overcome in order to reach your goals. The books tell you to keep praising yourself to increase and maintain a high level of self-belief; the psychologists say that actually this doesn’t work because"],["","you need praise from other people in order to increase your self-esteem. Perhaps the key question on self-help books is: do they work? Do people feel they have directly helped them? Whatever critics may say, do the people who buy and read them get real results from them? The answer to this question appears to be ‘sometimes’. Research indicates that the kind of book that deals with a particular problem can be effective in helping people with that problem, particularly if the problem in question isn’t a severe one, for example mild depression or anxiety. The situation is less clear with books dealing with personal growth or development. Some people do say that these books have helped them but it is by no means certain, and hard to measure, whether this is really the case."],["","What is clear about all self-help books, however, is that they offer people hope. The actual advice they give and whether or not this is accurate or effective is probably less important than the fact that they tell the reader that change is possible, that there is hope of a better life, that people can overcome difficulties and improve themselves and their situation. While this may sound like a good thing, there is, however, a downside to it. To get people to buy them, these books often make exaggerated claims about what they will do for people. They can raise unrealistic expectations in the reader, suggesting that a better life can quite easily be achieved, that anyone can get what they want out of life. The truth is, of course, that changing yourself and your life may be very difficult indeed and require an immense amount of effort, if it is even achievable at all. So self-help books are open to the claim that they present a false picture that can only lead to disappointment in the end."]]},"parts":[{"items":[{"t":"mc","q":"In the first paragraph, what does the writer emphasize about self-help books?","o":["How quickly the genre became popular.","The fact that one person might buy many of them.","The number of them available."],"a":2},{"t":"mc","q":"In the second paragraph, the writer expresses a preference for self-help books which ___.","o":["explain technical terms in a clear way","give examples to support their advice","don’t use any jargon at all"],"a":1},{"t":"mc","q":"The writer says that self-help books containing a lot of ‘psychobabble’ ___.","o":["exist in greater numbers than other kinds of self-help books","have affected the reputation of all self-help books","are seldom popular with readers"],"a":1},{"t":"mc","q":"What does the writer say about self-help books connected with happiness?","o":["They are the most popular kind of self-help book.","They vary more than other kinds of self-help books.","There is evidence to support some of the advice they give."],"a":2},{"t":"mc","q":"Psychologists say that some advice in books e might spend every weekend fishing or building model trains, and nobody calls that an addiction. We tend to see hobbies as healthy and harmless, whatever the time involved. Yet when the activity is on a screen, we immediately start using medical language."],["Interviewer","What about computer games specifically?"],["Colin","There's been a lot of research, but as things stand, game addiction isn't officially recognized as a medical condition. It doesn't appear on the official lists of disorders. Whether that will change, I really couldn't say."],["Interviewer","And what's your own view?"],["Colin","I think we should look at behaviour rather than hours. If someone misses meals, lies to their family about how long they've been online, or feels anxious and irritable when they can't get on a computer, then I'd say that's very likely to be an addiction, whatever we call it officially."]]}},{"instr":"Listen to a teenager called Zak talking about a social experiment called ‘Digital Detox’ that he did with his friends. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"Where does Zak say the inspiration came from for the ‘Digital Detox’ experiment?","o":["a similar experiment in a recent film about social networking","one of his teachers setting the students a challenge","some of his friends responding to a bet"],"a":1},{"t":"mc","q":"Who does Zak say was responsible for keeping an eye on the students during the experiment?","o":["some students from his class","some of his teachers","some students from another class"],"a":2},{"t":"mc","q":"What does Zak say he found particularly strange during the experiment?","o":["realizing that his phone wasn’t in his pocket","resorting to the landline to call his girlfriend","refraining from making posts on Facebook"],"a":0},{"t":"mc","q":"How does Zak say one of his friends managed to deal with the rules of the experiment?","o":["by notifying her Facebook friends of her intentions","by having her security details changed","by giving her phone to her parents"],"a":1},{"t":"mc","q":"What does Zak say he did once the experiment had come to an end?","o":["He continued to limit his daily use of social media.","He decided to give up using social media for an extended period of time.","He carried on using social media exactly as he had beforehand."],"a":0}],"audio":{"script":[["Zak","It all started in our IT lesson. Our teacher, Mr Patel, said he didn't believe any of us could survive a week without our phones and social media. He challenged the whole class to try it, so we did. We called it 'Digital Detox'."],["Zak","We had to hand our phones in on Monday morning, and we weren't allowed to log in to anything from home. To make sure nobody cheated, some students from the class next door kept an eye on us. They checked our accounts every day to see if we'd posted anything."],["Zak","Not posting on Facebook was easier than I expected, and I used our landline to call my girlfriend, which was quite funny. The weirdest thing was the reflex. I'd keep putting my hand in my pocket to check my phone, and every time I'd get a shock that it wasn't there."],["Zak","Some people found it really hard. My friend Leila knew she'd be tempted to log in, so she asked her brother to change her password and keep it secret until the end of the week. That way she couldn't get into her accounts even if she wanted to."],["Zak","When the week ended, I didn't go back to how I was. I didn't give up social media either, but now I only allow myself half an hour a day, and I've kept to that ever since."]]}}],"listen":{"mode":"tts"}},{"k":"s","name":"Speaking","max":20,"speaking":{"ask":["How can people reduce the amount of stress they have to deal with in modern-day life?","What’s the best way of dealing with stress?","Do you prefer the life you have at this age or the life you had when you were younger? Why?","If you had to choose one gadget only to use for the rest of your life, which one would you choose and why?","How do you think life was better before the invention of the smartphone?"],"talk":["‘There are better ways to assess students’ progress than exams.’","‘Parents know best so we should always follow their advice.’","‘An obsession is not necessarily a bad thing.’"],"mode":"crit","crit":[["Interactive communication",10],["Grammar and vocabulary",5],["Pronunciation",5]]}}]},{"id":"ft07a","kind":"file","group":"ft07","ver":"A","title":"File 7 Test A","focus":"7A Rules, 7B Art: permission, obligation and necessity, verbs of the senses, prefixes, colour idioms.","secs":[{"k":"g","name":"Grammar","max":20,"w":1,"parts":[{"instr":"Underline the correct word(s).","items":[{"t":"pick","q":"You [mustn’t|must] use your mobile phone while you’re putting petrol into your car.","a":"mustn’t"},{"t":"pick","q":"We [ought|should] to have set off earlier.","a":"ought"},{"t":"pick","q":"You don’t [got|have to] tip taxi drivers, but they always appreciate it.","a":"have to"},{"t":"pick","q":"Everyone will [have to|better] show their passport when we cross the border.","a":"have to"},{"t":"pick","q":"We [need|needn’t] call Maria – she’s expecting us.","a":"needn’t"},{"t":"pick","q":"You [didn’t need|needn’t have] to pay for dinner, but it was nice that you did.","a":"didn’t need"},{"t":"pick","q":"It is [not able|not permitted] to bring your own food into this dining area.","a":"not permitted"}],"ex":"You won’t be able / allowed to go into the laboratory with me. It’s for employees only."},{"instr":"Complete the sentences with the correct word(s).","items":[{"t":"mc","q":"When I was at the Summer Music Festival I saw your brother’s band ___.","o":["to play","playing","played"],"a":1},{"t":"mc","q":"I ___ someone say ‘hello’, but I couldn’t see who it was.","o":["heard","hear","was heard"],"a":0},{"t":"mc","q":"You ___ my friend Marco.","o":["look","look like","are the look of"],"a":1},{"t":"mc","q":"This soup tastes ___ garlic. It’s delicious!","o":["of","for","as if"],"a":0},{"t":"mc","q":"He ___ unhappy. Is r"]]},{"t":"gap","q":"What’s your opinion of these so-called {}foods like blueberries? Do you think they can really be so great?","a":[["super"]]},{"t":"gap","q":"Unfortunately my computer crashed just as I was finishing the assignment, so I had to {}do the charts and graphs.","a":[["re"]]},{"t":"gap","q":"The building work that had been carried out was {}standard, so we had to knock the garage down and start again.","a":[["sub"]]}],"ex":"The main complaint was that the children who visited were very ill-mannered.","bankHtml":["ill","mis","over","pre-","re","sub","super","under"]}]},{"k":"p","name":"Pronunciation","max":10,"w":1,"parts":[{"instr":"Match the words to the same sound.","items":[{"t":"match","q":"st<b>a</b>tistics <span class=\"hint\">(1 of 2)</span>","a":["abstract","probability"],"grp":"snd7-1","slot":0},{"t":"match","q":"st<b>a</b>tistics <span class=\"hint\">(2 of 2)</span>","a":["abstract","probability"],"grp":"snd7-1","slot":1},{"t":"match","q":"sn<b>a</b>ke","a":"safety","grp":null,"slot":0},{"t":"match","q":"miniat<b>ure</b> <span class=\"hint\">(1 of 2)</span>","a":["endure","treasure"],"grp":"snd7-3","slot":0},{"t":"match","q":"miniat<b>ure</b> <span class=\"hint\">(2 of 2)</span>","a":["endure","treasure"],"grp":"snd7-3","slot":1}],"ex":"w<b>or</b>k → turnover","bankHtml":["<b>a</b>bstract","end<b>ure</b>","prob<b>a</b>bility","s<b>a</b>fety","treas<b>ure</b>","t<b>ur</b>nover"],"opts":["abstract","endure","probability","safety","treasure","turnover"]},{"instr":"Underline the stressed syllable.","items":[{"t":"stress","w":["an","ti","bi","ot","ic"],"a":3,"word":"antibiotic"},{"t":"stress","w":["min","ia","ture"],"a":0,"word":"miniature"},{"t":"stress","w":["ex","pe","di","tion"],"a":2,"word":"expedition"},{"t":"stress","w":["co","in","ci","dence"],"a":1,"word":"coincidence"},{"t":"stress","w":["su","per","vi","sor"],"a":0,"word":"supervisor"}],"ex":"time|table"}]},{"k":"r","name":"Reading","max":10,"w":1,"intro":"Read the article about what makes good art and choose A, B, C, or D.","passage":{"title":"What makes good art?","paras":[["","If you’re a fan of art like I am, but often wondered how to tell a good painting from an average one, then help is at hand. Four experts tell us how to separate out the best art from the rest."],["A","For me, it’s when art has its own internal logic and you just know it when you see it. It is unique in conception and well-executed. I didn’t come to this realization overnight, however. It comes with experience and developing your eye, training it. While art has become, in the experimental 20th and 21st centuries, impossible to define – critics learnt long ago to stop being prescriptive, perhaps a little too well. Good visual art looks stunningly right and, in retrospect, obvious, or inevitable, yet it’s also continually surprising. It is a powerful paradox. How can someone have possibly made this? How in the world could it not have been made?"],["B","Reality is by agreement. The reality of art is usually by some kind of agreement. The arbiters are the museums, the museum curators, the people who spend their lives and their time actually being critical of what they see and judging what they see. If you add in four or five art critics who are then able to write about it, if you get four or five major collectors who are passionate about what they collect to patronize it, and several major auction houses to auction it, then a consensus or vetting process begins to unfold. Of course there’s magic dust involved, so this is not a sure way, but it’s a safe way to go about judging what is good art. It’s hard to answer the question ‘What makes good art?’ without stating something that appears pretentious. The perception of what makes art ‘good’ revolves around the application of that difficult word ‘taste’ which I observe to be in considerably short supply in society today."],["C","Quality, quality, quality. This is the mysterious and subjective key to good art. In all periods of art there are good and bad works of art. I find that defining quality in representational art is easier than in modern and abstract art. The other key word is looking. Everything looks good when you first start looking at art, as you have nothing to compare it to. As you hone your eye, you begin to discriminate between good and bad. The more you look at art, the easier it is to determine what is good and what is bad."],["","Also, there are two schools of thought as to what’s good and bad. Some people believe that good and bad are personal distinctions and entirely in the eye of the viewer. Others believe that there is good art and terrible art and no one can tell them otherwise. I think the real answer is somewhere in-between, and this is based entirely on the quality of the eye of the viewer."],["D","At its most fundamental level, good art is an effective combination of concept, vision, and mastery of medium (the ability to get the point across). Good art is also uncompromisingly honest, unselfconscious, bold, ambitious, enlightening, original, challenging, and a feast for the senses. It doesn’t necessarily have to have all of these qualities, but at the very least it has to keep you coming back for more...and never ever bore. What makes art good is when you see a piece from across the room, you immediately fall in love with it without knowing anything about it and are in love with it forever."]]},"parts":[{"instr":"Which expert:","items":[{"t":"match","q":"acknowledges the difficulty of defining art in a simple way.","a":"B"},{"t":"match","q":"believes that art may appeal to more than just an individual’s sight.","a":"D"},{"t":"match","q":"feels that the peculiarities of a piece constitute its superiority.","a":"A"},{"t":"match","q":"believes that style and good judgment are lacking among the general public.","a":"B"},{"t":"match","q":"likens the emotion involved in discovering a piece of good art to experiencing feelings of tenderness.","a":"D"},{"t":"match","q":"believes the ability to distinguish between inferior and superior art comes with practice.","a":"C"},{"t":"match","q":"states that art, by its very nature, is a contradiction in terms.","a":"A"},{"t":"match","q":"believes that commenting on a piece of art is not necessarily as simple as some experts would have us believe.","a":"C"},{"t":"match","q":"points out that an appreciation of art is not a solitary affair.","a":"B"},{"t":"match","q":"acknowledges the limitations of characterizing art in modern times.","a":"A"}],"opts":["A","B","C","D"]}]},{"k":"w","name":"Writing","max":10,"writing":{"html":["<p>A British school would like to send some of its students on a cultural exchange trip to your country next summer. The students would like to spend some time with students at your language school. Write a report for the head of the British school giving information about your town / city; say why it is famous, what cultural activities it’s possible to do there, and also what people can do there in the evenings. Remember to include headings and write in an appropriate style. Write your report in 220–260 words.</p>"],"crit":[["Task completion",4],["Grammar",3],["Vocabulary",3]]}},{"k":"l","name":"Listening","max":10,"w":1,"parts":[{"instr":"Listen to two people discussing a survey connected to the ‘nanny state’. Tick (✓) A, B, or C.","items":[{"t":"mc","q":"What does the man say about the woman’s opinion of the ‘nanny state’?","o":["He used to agree with it.","It may not be widely shared.","It isn’t logical."],"a":1},{"t":"mc","q":"The man says that the survey indicates that most people ___.","o":["have changed their minds about the ‘nanny state’","want the government to tell them what to do on certain issues","feel that there is no such thing as the ‘nanny state’"],"a":1},{"t":"mc","q":"The woman believes that government action on various health issues ___.","o":["is the right thing for the government to do","shows that the ‘nanny state’ can be a good thing","annoys a great many people"],"a":0},{"t":"mc","q":"The woman thinks that the survey results ___.","o":["suggest that people have the wrong attitude","show that people have become very confused","do not indicate approval of the ‘nanny state’"],"a":2},{"t":"mc","q":"The woman says that the report in the paper ___.","o":["has interpreted people’s opinions incorrectly","won’t be believed by most readers","may change people’s view on the ‘nanny state’"],"a":0}],"audio":{"script":[["Man","Have you seen this survey about the 'nanny state'? You're always saying that people hate being told what to do by the government. But I'm not sure many people feel the way you do."],["Woman","Why, what does it say?"],["Man","Most of the people they asked actually want the government to tell them what to do on certain things, like food labelling, smoking in cars with children, and helmets for cyclists."],["Woman","Well, I don't object to those. Banning smoking in cars with children is just sensible. It protects people who can't protect themselves, and that's exactly what a government should be doing."],["Man","So you agree with the nanny state after all?"],["Woman","No, that's the point. Those aren't examples of a nanny state. A nanny state is when the government interferes in things that only affect you. Wanting a few sensible health laws doesn't mean people approve of that."],["Man","The newspaper says the survey proves people want more government control over their lives."],["Woman","Then the newspaper has got it wrong. People said yes to specific laws. The paper has taken those answers and turned them into something people never said."]]}},{"instr":"Listen to five people talking about their opinions of art. Match the speakers (1–5) to the opinions (A–H).","legend":["Art is silly. I don’t know why people do it.","Art is something that should be enjoyed whenever possible.","Art is too ambiguous to enjoy fully.","I can’t imagine what it would be like to be a performing artist.","I enjoy performing, rather than visual, arts.","Art is a really difficult profession to live off.","I only like art because my significant other likes it.","I think my friend is crazy trying to make a living from his art."],"opts":["A","B","C","D","E","F","G","H"],"items":[{"t":"match","q":"Speaker 1","a":"B"},{"t":"match","q":"Speaker 2","a":"G"},{"t":"match","q":"Speaker 3","a":"D"},{"t":"match","q":"Speaker 4","a":"F"},{"t":"match","q":"Speaker 5","a":"C"}],"audio":{"script":[["Narrator","Speaker one."],["Speaker 1","For me, art is one of life's great pleasures. Whenever I travel, the first thing I do is find the local gallery. Even at home I try to see an exhibition or a play every couple of weeks. Why wouldn't you take every chance to enjoy something so wonderful?"],["Narrator","Speaker two."],["Speaker 2","To be honest, I wouldn't go near a gallery if it weren't for my wife. She's the art lover. I go along because she enjoys it so much, and I've grown to quite like it, but only because she's there explaining everything."],["Narrator","Speaker three."],["Speaker 3","My sister's a ballet dancer, and I've watched her perform many times. I honestly have no idea how she does it, walking out in front of two thousand people and being judged on every move. I can't even picture myself on a stage. Just the thought of it makes me feel sick."],["Narrator","Speaker four."],["Speaker 4","I studied fine art and I still paint, but I work in a bank. Very few artists earn enough to pay the rent from their work alone. Galleries take a huge commission and sales are unpredictable. Most of my old classmates have given up or have second jobs."],["Narrator","Speaker five."],["Speaker 5","I do go to exhibitions, but I often come away frustrated. With a lot of modern art, I can't tell what it's supposed to mean, and the labels don't help. I need to know what I'm looking at to really appreciate it. When it's that open to interpretation, I can't fully enjoy it."]]}}],"listen":{"mode":"tts"}},{"k":"s","nam
