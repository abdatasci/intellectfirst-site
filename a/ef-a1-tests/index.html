"put through", "put on"], ["I'm sorry, you have the wrong _____.", "number", "name", "phone"], ["I'll _____ you back later.", "call", "answer", "ring up"], ["1st = _____", "oneth", "firsth", "first"], ["2nd = _____", "secondth", "second", "twoth"], ["22nd = _____", "twentieth-second", "twenty-two", "twenty-second"], ["31st = _____", "thirtieth-one", "thirty-one", "thirty-first"], ["The tenth month is _____.", "September", "October", "November"], ["Valentine's Day is on February the _____.", "fourteenth", "fourteen", "fortieth"], ["I was born on the _____ of July.", "twelveth", "twelve", "twelfth"], ["New Year's Day is January the _____.", "first", "once", "one"], ["He plays the _____ in a rock band.", "drums", "violin", "flute"], ["She's a famous opera _____.", "player", "singer", "composer"], ["I love that _____. Can you play it again?", "singer", "song", "sing"], ["They play _____ music – it's very loud.", "heavy metal", "classical", "jazzy"], ["Who's your favourite _____? Beyoncé or Rihanna?", "instrument", "band player", "singer"], ["I go to a lot of _____ – I love live music.", "concerts", "stages", "albums"], ["Do you play a musical _____?", "band", "instrument", "music"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "AACBBCCABA", "q": [["th*ir*ty", "f*or*ty", "f*our*th"], ["*th*em", "fif*th*", "mon*th*"], ["*u*s", "b*u*s", "m*u*sic"], ["*g*ym", "*g*uitar", "*j*azz"], ["t*oo*", "dr*u*ms", "y*ou*"], ["mu_si_cal", "musi_cal_", "_mu_sical"], ["_Oc_tober", "Octo_ber_", "Oc_to_ber"], ["No_vem_ber", "Novem_ber_", "_No_vember"], ["dif_fi_cult", "_dif_ficult", "diffi_cult_"], ["_in_strument", "in_stru_ment", "instru_ment_"]]}, "r": {"title": "Our national instrument", "k": "BACAB", "text": ["The dombra is the national instrument of Kazakhstan. It has a long neck and only two strings, but people can play very fast and beautiful music on it.", "There's a big dombra festival every year on the first Sunday of July. Thousands of people come to play together. In 2012 more than 7,000 people played the dombra at the same time in Kazakhstan!", "'Children start learning the dombra at school,' says Kanat, a music teacher in Kostanay. 'They love it because it's easy to begin. But it's very difficult to play really well. I practise every day for three hours.'", "Kanat plays in a group with four friends. 'We love mixing traditional music with rock,' he says. 'Young people really like it. We're playing a concert in Astana on the twenty-second of May.'"], "q": [["How many strings has a dombra got?", "seven", "two", "four"], ["When is the dombra festival?", "the first Sunday of July", "every Sunday", "22nd May"], ["Where do children start learning the dombra?", "at home", "at festivals", "at school"], ["How long does Kanat practise every day?", "three hours", "four hours", "one hour"], ["What music does Kanat's group play?", "only classical music", "traditional music and rock", "only rock"]]}, "l": {"setting": "You will hear Leila phoning her friend's house.", "k": "ABBCA", "script": [["Mr Ivanov", "Hello?"], ["Leila", "Hello, is that Mr Ivanov? It's Leila, Masha's friend."], ["Mr Ivanov", "Oh, hi Leila. Masha isn't here, I'm afraid. She's at her piano lesson."], ["Leila", "Oh. Can I leave a message?"], ["Mr Ivanov", "Of course. Just a moment, I need a pen… OK."], ["Leila", "Can you tell her that the concert is on Friday, the eighteenth, not Saturday?"], ["Mr Ivanov", "The eighteenth. OK. What time?"], ["Leila", "It starts at seven thirty. And can she call me back tonight? My number is 8 707 455 2190."], ["Mr Ivanov", "OK, I've got it. I'll give her the message."], ["Leila", "Thank you very much. Bye!"]], "q": [["Where is Masha?", "at a piano lesson", "at school", "at a concert"], ["What day is the concert?", "Thursday", "Friday", "Saturday"], ["What date is the concert?", "8th", "18th", "28th"], ["What time does the concert start?", "7.00", "8.30", "7.30"], ["What does Leila want Masha to do?", "call her back", "come to her house", "buy tickets"]]}, "s": {"focus": "object pronouns, like / love / hate + -ing, be or do?, dates, music.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["When is your birthday? What do you usually do?", "What do you like doing in your free time?", "What do you hate doing?", "What kind of music do you listen to?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about your favourite singer or band.", "prompts": ["who he / she / they are and where from", "what kind of music", "your favourite song", "why you like him / her / them"]}, {"name": "Role play", "mins": 2, "lead": "Teacher and student act out the situation on the card.", "card": "Phone a language school. The teacher is the receptionist.", "prompts": ["ask for information about a course", "ask about the start date", "ask about the days and times", "leave your name and phone number"]}]}});
TESTS.push({"id": "q7", "kind": "quick", "title": "Quick Test 7", "focus": "File 7: past simple of be (was / were), past simple regular and irregular verbs, word formation, past time expressions, go, have, get.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CACBABCAAB", "q": [["I _____ at home last night.", "were", "am", "was"], ["_____ your parents at the party?", "Were", "Was", "Did"], ["We _____ tired after the trip.", "was", "did", "were"], ["She _____ in London in 2020.", "livied", "lived", "lives"], ["I _____ that film. It was boring.", "didn't like", "didn't liked", "not liked"], ["_____ you watch the match yesterday?", "Do", "Did", "Were"], ["They _____ to Turkey last summer.", "goed", "go", "went"], ["He _____ a new phone last week.", "bought", "buy", "buyed"], ["Where _____ you born?", "were", "did", "was"], ["I _____ my keys this morning.", "losed", "lost", "lose"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "AABCBCAACB", "q": [["A person who paints is a _____.", "painter", "painting", "paintist"], ["A person who writes books is a _____.", "writer", "writing", "writist"], ["A person who plays the piano is a _____.", "pianer", "pianist", "pianoer"], ["I went to Almaty _____.", "the last week", "yesterday week", "last week"], ["She called me _____.", "three days before now", "three days ago", "before three days"], ["I _____ a shower and went to bed.", "went", "got", "had"], ["We _____ home very late.", "got", "went", "had"], ["They _____ shopping on Saturday.", "went", "got", "had"], ["I _____ a taxi to the airport.", "went", "had", "got"], ["We _____ a great time at the party.", "got", "had", "went"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "BBAAC", "q": [["w*a*tched", "h*a*d", "w*a*s"], ["want*ed*", "stopp*ed*", "start*ed*"], ["w*e*nt", "b*ou*ght", "s*aw*"], ["_scien_tist", "sci_en_tist", "scien_tist_"], ["inven_tor_", "_in_ventor", "in_ven_tor"]]}, "r": {"title": "A famous Kazakh poet", "k": "ABACB", "text": ["Abai Kunanbayuly was a famous Kazakh poet. He was born in 1845 in the east of Kazakhstan. His father was a rich and important man.", "As a boy, Abai studied in a school in Semey. He learned Arabic and Persian and he read a lot of books. Later he also learned Russian and translated poems into Kazakh.", "Abai wrote a lot of poems and songs. He also wrote a famous book called 'Book of Words'. He died in 1904. Today there are streets and schools with his name in every city in Kazakhstan."], "q": [["When was Abai born?", "in 1845", "in 1945", "in 1904"], ["Where did he study as a boy?", "in Russia", "in Semey", "in Almaty"], ["Which language did he translate poems from?", "Russian", "Persian", "Arabic"], ["What was the name of his famous book?", "Book of Poems", "Book of Songs", "Book of Words"], ["What has his name today?", "a university only", "streets and schools", "a city"]]}, "l": {"setting": "You will hear Aigerim telling her friend Tom about her weekend.", "k": "ABACB", "script": [["Tom", "Hi Aigerim. How was your weekend?"], ["Aigerim", "Great, thanks. On Saturday I went to my cousin's wedding in Astana."], ["Tom", "Really? Was it nice?"], ["Aigerim", "Yes, it was amazing. There were four hundred people!"], ["Tom", "Four hundred! Did you dance?"], ["Aigerim", "Yes, all night. I got home at three in the morning."], ["Tom", "What did you do on Sunday?"], ["Aigerim", "Nothing! I slept until twelve and then I watched TV."], ["Tom", "Sounds perfect."]], "q": [["Where was the wedding?", "in Astana", "in Kostanay", "in Almaty"], ["Whose wedding was it?", "her friend's", "her cousin's", "her sister's"], ["How many people were there?", "400", "4,000", "40"], ["What time did she get home?", "at 12 a.m.", "at 4 a.m.", "at 3 a.m."], ["What did she do on Sunday?", "danced", "slept and watched TV", "went to a wedding"]]}, "s": {"focus": "was / were, past simple, past time expressions.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Where were you last Saturday?", "What did you do yesterday evening?", "Where were you born?", "When did you last go to a restaurant?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Tell the teacher about your last birthday", "Talk about a famous person from your country who lived in the past."]}]}});
TESTS.push({"id": "f7", "kind": "file", "title": "File Test 7", "focus": "File 7: past simple of be, past simple regular and irregular verbs, word formation (paint → painter), past time expressions, go, have, get.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ABBCBBAACBBAACACBACC", "q": [["My grandfather _____ a teacher.", "was", "is", "were"], ["We _____ at the cinema last night.", "was", "were", "are"], ["_____ you at school yesterday?", "Was", "Were", "Did"], ["A: Was the film good?\nB: No, it _____.", "weren't", "didn't", "wasn't"], ["They _____ happy with the hotel.", "didn't", "weren't", "wasn't"], ["Where _____ your sister born?", "were", "was", "did"], ["I _____ TV for two hours last night.", "watched", "watch", "watchd"], ["She _____ her friend at the station.", "met", "meeted", "meets"], ["We _____ a new car last year.", "buyed", "buys", "bought"], ["He _____ to work yesterday because he was ill.", "didn't went", "didn't go", "not went"], ["_____ you see the news last night?", "Were", "Did", "Was"], ["What _____ you have for dinner?", "did", "were", "do"], ["I _____ my homework after dinner.", "did", "do", "done"], ["They _____ a lot of photos on holiday.", "taked", "take", "took"], ["She _____ the train to Almaty.", "caught", "catch", "catched"], ["The children _____ in the river.", "swum", "swimmed", "swam"], ["We _____ our grandparents last weekend.", "visit", "visited", "visitted"], ["I _____ you yesterday, but you didn't answer.", "phoned", "phone", "phoneed"], ["He _____ the window and it broke.", "hits", "hitted", "hit"], ["When _____ they arrive?", "do", "were", "did"]]}, "v": {"parts": [[0, "Word formation: choose the correct word."], [6, "Past time expressions: choose the correct answer."], [11, "go, have, get: choose the correct word."]], "k": "ABCCBCCBABABAACACABB", "q": [["A person who acts in films is an _____.", "actor", "acter", "actist"], ["A person who invents things is an _____.", "inventer", "inventor", "inventist"], ["A person who studies science is a _____.", "sciencer", "sciencist", "scientist"], ["A person who writes music is a _____.", "composor", "composist", "composer"], ["A person who leads a country is a _____.", "leador", "leader", "leadist"], ["A person who sings opera is an opera _____.", "singist", "songer", "singer"], ["I saw her _____.", "yesterday night", "the last night", "last night"], ["We moved here _____.", "two years before", "two years ago", "before two years"], ["They got married _____ 2019.", "in", "on", "at"], ["I called you _____ morning.", "last", "yesterday", "ago"], ["She arrived _____ Monday.", "last", "ago", "yesterday"], ["We _____ for a walk after lunch.", "had", "went", "got"], ["I _____ a lot of emails yesterday.", "got", "had", "went"], ["She _____ a sandwich for lunch.", "had", "went", "got"], ["They _____ dressed and left the house.", "went", "had", "got"], ["He _____ on holiday to Egypt.", "went", "got", "had"], ["We _____ a party for my birthday.", "went", "got", "had"], ["I _____ up early this morning.", "got", "had", "went"], ["They _____ out with friends on Friday.", "got", "went", "had"], ["She _____ a new job last month.", "went", "got", "had"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "CCABBABCAA", "q": [["w*ere*", "f*ir*st", "h*ere*"], ["play*ed*", "liv*ed*", "watch*ed*"], ["want*ed*", "lik*ed*", "stopp*ed*"], ["b*ough*t", "b*oa*t", "c*augh*t"], ["r*ea*d (past)", "s*a*w", "m*e*t"], ["_his_tory", "histo_ry_", "his_to_ry"], ["hospi_tal_", "_hos_pital", "hos_pi_tal"], ["_pho_tographer", "photogra_pher_", "pho_to_grapher"], ["poli_ti_cian", "_po_litician", "po_li_tician"], ["_yes_terday", "yes_ter_day", "yester_day_"]]}, "r": {"title": "The woman who flew to space", "k": "BBCAA", "text": ["Valentina Tereshkova was the first woman in space. She was born in 1937 in a small village in Russia. Her family was very poor. Her father died when she was two, and her mother worked in a factory.", "Valentina left school at sixteen and started work in a factory too. In her free time she went to a parachute club. She loved jumping from planes, and she did more than one hundred parachute jumps.", "In 1962 she joined the space programme. A year later, on 16th June 1963, she flew into space in a spaceship called Vostok 6. Her flight started at Baikonur in Kazakhstan. She was in space for almost three days and she went around the Earth 48 times.", "After her flight she studied at university and later she became a politician. She is a hero for many women around the world."], "q": [["What did Valentina's mother do?", "She was a pilot.", "She worked in a factory.", "She was a teacher."], ["How old was Valentina when she left school?", "26", "16", "2"], ["What was her hobby?", "flying planes", "swimming", "parachute jumping"], ["When did she fly into space?", "in 1963", "in 1962", "in 1937"], ["How long was she in space?", "almost three days", "48 days", "one day"]]}, "l": {"setting": "You will hear Marat talking about his first day at a new job.", "k": "BBACA", "script": [["Friend", "So, Marat, how was your first day at the bank?"], ["Marat", "Terrible! First, I woke up late. My alarm didn't ring."], ["Friend", "Oh no! Were you late?"], ["Marat", "Yes, twenty minutes. I didn't have time for breakfast. I took a taxi."], ["Friend", "Was your boss angry?"], ["Marat", "No, she was very nice. But then I went to the wrong office! I was on the third floor, not the fifth."], ["Friend", "And in the afternoon?"], ["Marat", "That was better. I met my new colleagues and we had lunch together."], ["Friend", "Good. Are you going back tomorrow?"], ["Marat", "Of course! I bought a new alarm clock on the way home."]], "q": [["Why did Marat wake up late?", "He was ill.", "His alarm didn't ring.", "He went to bed late."], ["How did he go to work?", "by bus", "by taxi", "on foot"], ["How late was he?", "20 minutes", "15 minutes", "50 minutes"], ["Which floor was his office on?", "the first", "the third", "the fifth"], ["What did he buy on the way home?", "an alarm clock", "a new phone", "breakfast"]]}, "s": {"focus": "was / were, past simple regular and irregular, past time expressions, go / have / get.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Where were you at 8 o'clock last night?", "What did you do last weekend?", "When did you last go to the cinema? What did you see?", "Where did you go on your last holiday?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about a famous person from the past.", "prompts": ["who he / she was", "when and where he / she was born", "what he / she did", "why he / she is famous"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["What did you like doing when you were a child?", "Tell the teacher about a good day you had recently", "Who was your favourite teacher at school? Why?"]}]}});
TESTS.push({"id": "q8", "kind": "quick", "title": "Quick Test 8", "focus": "File 8: past simple regular and irregular, there is / there are, some / any, there was / there were, the house, prepositions of place.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BAACABCCAB", "q": [["There _____ a big sofa in the living room.", "are", "'s", "have"], ["There _____ two bathrooms in our flat.", "are", "is", "be"], ["Are there _____ shops near here?", "any", "some", "a"], ["There are _____ pictures on the wall.", "any", "a", "some"], ["There _____ any milk in the fridge.", "isn't", "not", "aren't"], ["_____ a garden?", "Has there", "Is there", "There is"], ["There _____ a lot of people at the concert last night.", "was", "are", "were"], ["There _____ a cinema here ten years ago.", "is", "were", "was"], ["_____ any problems yesterday?", "Were there", "Was there", "There were"], ["We _____ a strange noise in the night.", "hear", "heard", "heared"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CBBABCAACA", "q": [["You wash your hands in the _____.", "cooker", "fridge", "washbasin"], ["You keep food cold in the _____.", "wardrobe", "fridge", "oven"], ["You put your clothes in the _____.", "bookshelf", "wardrobe", "cupboard bed"], ["You go up the _____ to the bedrooms.", "stairs", "ceiling", "floor"], ["The cat is _____ the bed. I can't see it.", "over", "under", "on"], ["The bank is _____ the café and the shop.", "next", "opposite to", "between"], ["The chemist's is _____ the bank. They are face to face.", "opposite", "between", "behind"], ["My keys are _____ my bag.", "in", "at", "of"], ["The picture is _____ the sofa.", "between", "under to", "above"], ["There's a car _____ the house.", "in front of", "front of", "in front"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "ABCAB", "q": [["f*ir*st", "st*air*s", "ch*air*"], ["*th*in", "*th*ere", "*th*ree"], ["br*ow*n", "h*ou*se", "wind*ow*"], ["_fur_niture", "furni_ture_", "fur_ni_ture"], ["op_po_site", "_op_posite", "oppo_site_"]]}, "r": {"title": "A strange hotel", "k": "ABBCA", "text": ["Last summer I stayed in a very strange hotel in Sweden. It was a tree hotel! The rooms were in the trees, about six metres above the ground.", "My room was small but beautiful. There was a big bed next to the window, a small table and two chairs. There wasn't a TV, but there were a lot of books. There was a bathroom, but there wasn't a shower – only a washbasin!", "In the morning I opened the window and saw birds in the tree next to my room. It was very quiet. I loved it."], "q": [["Where was the hotel?", "in Sweden", "in Kazakhstan", "in Switzerland"], ["Where were the rooms?", "under the ground", "in the trees", "on a lake"], ["What was next to the bed?", "a TV", "the window", "the bathroom"], ["What wasn't in the bathroom?", "a washbasin", "a toilet", "a shower"], ["What did the writer see in the morning?", "birds", "a TV", "other guests"]]}, "l": {"setting": "You will hear Dana describing her new flat to her friend.", "k": "BBAAC", "script": [["Friend", "So, Dana, tell me about your new flat."], ["Dana", "It's lovely! It's on the fourth floor. There are two bedrooms and a big living room."], ["Friend", "Is there a balcony?"], ["Dana", "Yes, there is. It's next to the kitchen. I have breakfast there every day."], ["Friend", "And is there a lift?"], ["Dana", "No, there isn't. I walk up the stairs every day – it's good exercise!"], ["Friend", "Are there any shops near the flat?"], ["Dana", "Yes, there's a supermarket opposite and a bakery next to it."]], "q": [["Which floor is the flat on?", "the fifth", "the fourth", "the second"], ["How many bedrooms are there?", "three", "two", "one"], ["Where is the balcony?", "next to the kitchen", "in the living room", "next to the bedroom"], ["What isn't there in the building?", "a lift", "a balcony", "stairs"], ["What is opposite the flat?", "a park", "a bakery", "a supermarket"]]}, "s": {"focus": "there is / there are, some / any, there was / were, the house, prepositions.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Do you live in a house or a flat?", "How many rooms are there?", "Is there a park near your home?", "What's your favourite room? Why?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Describe the room you are in now (What's there? Where is it?)", "What was there in your town 20 years ago that isn't there now?"]}]}});
TESTS.push({"id": "f8", "kind": "file", "title": "File Test 8", "focus": "File 8: past simple regular and irregular verbs, there is / there are, some / any + plural nouns, there was / there were, the house, prepositions of place and movement.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CBCACCABBACBABAACBBA", "q": [["We _____ a great film on TV last night.", "seen", "seed", "saw"], ["She _____ her bag on the bus.", "leaved", "left", "leaves"], ["I _____ a strange email this morning.", "getted", "get", "got"], ["They _____ for us for an hour.", "waited", "waits", "waitted"], ["He _____ me a story about his trip.", "tells", "telled", "told"], ["There _____ a big supermarket near my house.", "are", "has", "'s"], ["There _____ two beds in the room.", "are", "is", "be"], ["_____ a bank near here?", "There is", "Is there", "Are there"], ["There aren't _____ chairs in the kitchen.", "some", "any", "a"], ["There are _____ flowers on the table.", "some", "a", "any"], ["Are there _____ eggs in the fridge?", "some", "an", "any"], ["There _____ any towels in the bathroom.", "not", "aren't", "isn't"], ["A: Is there a TV in your room?\nB: No, there _____.", "isn't", "not", "aren't"], ["There _____ a lot of snow last winter.", "were", "was", "is"], ["There _____ many people at the party.", "weren't", "didn't", "wasn't"], ["_____ a lift in the old building?", "Was there", "There was", "Were there"], ["_____ any good shops in your town when you were a child?", "Was there", "Did there", "Were there"], ["There _____ a fire in the hotel last year.", "is", "was", "were"], ["How many students _____ in the class yesterday?", "was there", "were there", "there were"], ["The thieves _____ through the window.", "came in", "come in", "comed in"]]}, "v": {"parts": [[0, "The house: choose the correct word."], [8, "Prepositions: choose the correct word."]], "k": "ABAACBBACBACCBBACBAC", "q": [["You cook in the _____.", "kitchen", "garage", "hall"], ["You put your car in the _____.", "balcony", "garage", "basement shelf"], ["You have a bath in the _____.", "bathroom", "dining room", "study"], ["The room at the top of a house, under the roof, is the _____.", "attic", "hall", "basement"], ["You sit on the _____ to watch TV.", "cooker", "shelf", "sofa"], ["You put books on a _____.", "lamp", "shelf", "cupboard door"], ["At night you turn on the _____.", "wall", "light", "heating fire"], ["You cook food in the _____.", "oven", "sink", "fridge"], ["The lamp is _____ the table.", "in", "at", "on"], ["The dog is sleeping _____ the table.", "over the", "under", "above"], ["The post office is _____ the bank and the café.", "between", "next", "opposite"], ["My house is _____ the park. I can see it from my window.", "between", "in", "opposite"], ["The bus stop is _____ the school.", "next", "near to of", "next to"], ["The garden is _____ the house.", "between", "behind", "in"], ["The clock is _____ the door.", "under to", "above", "on top"], ["Put the milk _____ the fridge, please.", "in", "at", "on"], ["Walk _____ the bridge and turn left.", "into", "under of", "over"], ["The cat jumped _____ the box.", "in to", "into", "onto of"], ["The children ran _____ the stairs.", "up", "on", "over of"], ["Go _____ the park and you'll see the museum.", "across of", "between", "through"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "ABCABAACBC", "q": [["h*ere*", "wh*ere*", "th*ere*"], ["*sh*ower", "*ch*air", "*sh*elf"], ["b*oo*k", "c*oo*ker", "r*oo*f"], ["c*ei*ling", "sh*e*lf", "b*e*d"], ["m*a*de", "s*ai*d", "c*a*me"], ["_bal_cony", "balco_ny_", "bal_co_ny"], ["a_part_ment", "_a_partment", "apart_ment_"], ["libra_ry_", "li_bra_ry", "_li_brary"], ["oppo_site_", "_op_posite", "op_po_site"], ["fur_ni_ture", "furni_ture_", "_fur_niture"]]}, "r": {"title": "The house with no walls", "k": "BAABC", "text": ["In 2010, a young architect called Lisa Morgan built a very unusual house near the sea in Portugal. There are no walls inside the house. There is only one big room and everything is in it: the kitchen, the bed, the sofa and even the bath!", "'When I was a child, our house was very dark,' says Lisa. 'There were a lot of small rooms and I hated it. I wanted a house with a lot of light.'", "The outside walls of the house are glass, so you can see the sea from every part of the room. There aren't any curtains. 'Is it strange to have a bath in the living room?' we asked. 'Not at all,' Lisa said. 'I love it. I can look at the sea when I'm in the bath.'", "But there is one problem. 'Friends don't stay the night very often,' she laughs. 'There isn't a guest room!'"], "q": [["Where is Lisa's house?", "in Sweden", "in Portugal", "in the city"], ["What is unusual about the house?", "There are no walls inside.", "It has no kitchen.", "It is under the sea."], ["Why did Lisa want this house?", "She wanted a lot of light.", "She liked small rooms.", "She wanted to be near her friends."], ["What hasn't the house got?", "a kitchen", "curtains", "a bath"], ["What is the problem with the house?", "It is very dark.", "It is very cold.", "There isn't a room for guests."]]}, "l": {"setting": "You will hear a police officer asking a woman about a burglary.", "k": "BCBAA", "script": [["Officer", "Good evening, madam. Can you tell me what happened?"], ["Woman", "Yes. I came home at about seven o'clock and the front door was open."], ["Officer", "Where were you before that?"], ["Woman", "At work. I left the house at eight this morning."], ["Officer", "What did the burglars take?"], ["Woman", "My laptop, which was on the desk in the study, and some money. There was some jewellery in the bedroom, but they didn't take it."], ["Officer", "Was there anything else?"], ["Woman", "Yes, my bike. It was in the garden, behind the house."], ["Officer", "Did your neighbours see anything?"], ["Woman", "The man opposite saw two young men with a car at about three o'clock."]], "q": [["What time did the woman come home?", "about 8 p.m.", "about 7 p.m.", "about 3 p.m."], ["Where was the laptop?", "in the bedroom", "in the garden", "in the study"], ["What didn't the burglars take?", "the money", "the jewellery", "the bike"], ["Where was the bike?", "behind the house", "in front of the house", "in the garage"], ["Who saw the burglars?", "a neighbour", "the woman", "the police"]]}, "s": {"focus": "past simple, there is / there are / there was / there were, prepositions, the house.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Describe your bedroom. What's in it?", "Where is your home? What's near it?", "What did you do at home last night?", "What's your favourite place in your home? Why?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Describe the house or flat you lived in as a child.", "prompts": ["where it was", "how many rooms there were", "what your room was like", "what you liked or didn't like about it"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Is it better to live in a house or a flat? Why?", "What is important for you in a home?", "Describe your dream house."]}]}});
TESTS.push({"id": "q9", "kind": "quick", "title": "Quick Test 9", "focus": "File 9: countable and uncountable nouns, a / an, some / any, how much / how many, quantifiers, comparative adjectives, food, food containers, high numbers.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACBACAACBB", "q": [["I'd like _____ egg, please.", "an", "a", "some"], ["There's _____ bread on the table.", "an", "a", "some"], ["We haven't got _____ rice.", "a", "any", "some"], ["_____ water do you drink a day?", "How much", "How", "How many"], ["_____ apples are there?", "How much", "How", "How many"], ["I don't eat _____ chocolate.", "much", "a lot", "many"], ["My brother eats a _____ of meat.", "lot", "lots", "much"], ["Tea is _____ than coffee here.", "cheapest", "more cheap", "cheaper"], ["My sister is _____ than me.", "tall", "taller", "more tall"], ["This exam is _____ than the last one.", "most difficult", "more difficult", "difficulter"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CACBCBABAA", "q": [["A _____ of milk", "tin", "packet", "carton"], ["A _____ of crisps", "packet", "jar", "bottle"], ["A _____ of jam", "carton", "bag", "jar"], ["A _____ of tuna", "box", "tin", "bowl"], ["Mushrooms, carrots and onions are _____.", "fruit", "meat", "vegetables"], ["Salmon and tuna are types of _____.", "meat", "fish", "vegetables"], ["You make an omelette with _____.", "eggs", "rice", "bread"], ["1,000 = one _____", "million", "thousand", "hundred"], ["550 = five hundred _____ fifty", "and", "plus", "with"], ["1,000,000 = one _____", "million", "billion", "thousand thousand"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "ABABC", "q": [["br*ea*d", "m*ea*t", "b*ea*ns"], ["p*o*tato", "p*a*sta", "t*o*mato"], ["t*o*mato", "ch*o*colate", "b*o*ttle"], ["bana_na_", "ba_na_na", "_ba_nana"], ["cho_co_late", "choco_late_", "_cho_colate"]]}, "r": {"title": "What do you eat in a day?", "k": "BAABC", "text": ["We asked two people about their food.", "Alibek, 25, is a footballer. 'I eat a lot of food – about 4,000 calories a day. For breakfast I have four eggs, some bread and a lot of fruit. I don't eat much sugar and I never drink fizzy drinks. I drink about three litres of water a day.'", "Laura, 40, is a writer. 'I'm not very healthy! I don't eat breakfast – I just have two or three cups of coffee. For lunch I usually have a sandwich and a packet of crisps. In the evening I cook pasta or rice with vegetables.'"], "q": [["How many calories does Alibek eat a day?", "about 40,000", "about 4,000", "about 400"], ["What does Alibek never drink?", "fizzy drinks", "coffee", "water"], ["How much water does Alibek drink?", "about 3 litres", "about 4 litres", "about 1 litre"], ["What does Laura have for breakfast?", "eggs", "coffee", "a sandwich"], ["What does Laura cook in the evening?", "eggs", "sandwiches", "pasta or rice"]]}, "l": {"setting": "You will hear Anna and Ben deciding what to buy at the supermarket.", "k": "BBCAA", "script": [["Anna", "OK, what do we need for the dinner tonight?"], ["Ben", "Well, we haven't got any potatoes. Let's get a big bag."], ["Anna", "And some meat? How many people are coming?"], ["Ben", "Six, with us. Let's get a kilo of chicken."], ["Anna", "Is there any cheese at home?"], ["Ben", "Yes, there's some in the fridge. But we need some milk – two cartons."], ["Anna", "And for dessert?"], ["Ben", "Let's make a cake. We need eggs and some sugar."], ["Anna", "We've got sugar. Just the eggs, then – a box of twelve."]], "q": [["What do they need first?", "cheese", "potatoes", "sugar"], ["How many people are coming to dinner, including Anna and Ben?", "eight", "six", "four"], ["How much chicken do they buy?", "half a kilo", "two kilos", "a kilo"], ["How many cartons of milk do they need?", "two", "one", "twelve"], ["What are they going to make for dessert?", "a cake", "ice cream", "a fruit salad"]]}, "s": {"focus": "countable and uncountable nouns, some / any, how much / how many, comparatives, food.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What do you usually have for breakfast?", "How much water do you drink every day?", "What's your favourite food?", "Is there any food you don't like?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Compare two cities or two foods you know (Which is bigger / better / healthier?)", "What do you buy at the supermarket every week?"]}]}});
TESTS.push({"id": "f9", "kind": "file", "title": "File Test 9", "focus": "File 9: countable and uncountable nouns, a / an, some / any, how much / how many, quantifiers (a lot, not much…), comparative adjectives, food, food containers, high numbers.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACCACABABBACBBCBAABC", "q": [["Can I have _____ orange juice, please?", "some", "a", "an"], ["I'd like _____ sandwich and a coffee.", "an", "some", "a"], ["Have you got _____ milk?", "an", "a", "any"], ["There isn't _____ sugar in my tea.", "any", "a", "some"], ["I need _____ advice.", "an", "a", "some"], ["We've got _____ apples, but no bananas.", "some", "an", "any"], ["_____ coffee do you drink every day?", "How many", "How much", "How often"], ["_____ bottles of water did you buy?", "How many", "How long", "How much"], ["I eat _____ fruit. About five pieces a day.", "much", "a lot of", "many"], ["I don't eat _____ meat. Maybe once a week.", "many", "much", "a lot"], ["She doesn't have _____ friends in her new town.", "many", "much", "a lot"], ["A: How much bread is there?\nB: _____.", "No one", "Not many", "None"], ["My car is _____ than your car.", "oldest", "older", "more old"], ["Your flat is _____ than mine.", "more big", "bigger", "biger"], ["Almaty is _____ than Astana in winter.", "more warm", "warmest", "warmer"], ["This book is _____ than the film.", "more good", "better", "gooder"], ["My cold is _____ today than yesterday.", "worse", "badder", "more bad"], ["Fruit is _____ than chocolate.", "healthier", "healthyer", "more healthy"], ["Is Kostanay _____ from Almaty than from Astana?", "farer", "further", "more far"], ["Dogs are _____ than cats, I think.", "most intelligent", "intelligenter", "more intelligent"]]}, "v": {"parts": [[0, "Food: choose the correct word."], [6, "Food containers: choose the correct word."], [13, "High numbers: choose the correct answer."]], "k": "AABBABCBBACACBBCACAC", "q": [["_____ are red and you use them in salads and sauces.", "Tomatoes", "Grapes", "Peas"], ["Cheese, milk and yogurt are _____ products.", "dairy", "meat", "fruit"], ["A _____ is a long yellow fruit.", "lemon", "banana", "pear"], ["Rice, bread and pasta are high in _____.", "fat", "carbohydrates", "vitamins"], ["_____ is a type of meat.", "Lamb", "Cabbage", "Salmon"], ["I put _____ on my chips.", "sugar", "salt", "jam"], ["a _____ of cola", "bag", "jar", "can"], ["a _____ of chocolate", "bottle", "bar", "tin"], ["a _____ of biscuits", "carton", "packet", "jar"], ["a _____ of olive oil", "bottle", "bar", "packet"], ["a _____ of honey", "packet", "can", "jar"], ["a _____ of soup", "bowl", "packet", "bar"], ["a _____ of potatoes", "jar", "carton", "bag"], ["150 = one hundred _____ fifty", "with", "and", "plus"], ["2,500 = two _____ five hundred", "hundred", "thousand", "thousands"], ["1,000,000 = one _____", "thousand", "millions", "million"], ["70,000 = seventy _____", "thousand", "hundred", "thousands"], ["The population of Kazakhstan is about twenty _____ people.", "thousand", "hundred", "million"], ["365 = three hundred and sixty-_____", "five", "fifty", "fifteen"], ["900 = nine _____", "thousand", "hundreds", "hundred"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "AACACBABBC", "q": [["s*u*gar", "c*u*p", "b*u*tter"], ["p*ea*r", "m*ea*t", "ch*ee*se"], ["gr*ea*t", "st*ea*k", "l*e*mon"], ["*o*nion", "p*o*tato", "t*o*mato"], ["c*a*ke", "gr*a*pes", "j*a*m"], ["pota_to_", "po_ta_to", "_po_tato"], ["_veg_etable", "vege_ta_ble", "veg_e_table"], ["_to_mato", "to_ma_to", "toma_to_"], ["straw_ber_ry", "_straw_berry", "strawber_ry_"], ["hambur_ger_", "ham_bur_ger", "_ham_burger"]]}, "r": {"title": "The world's most expensive food", "k": "BACAB", "text": ["Some foods are very expensive. Here are three of them.", "Saffron is a spice from a purple flower. It's more expensive than gold! A kilo costs about 10,000 dollars because you need about 150,000 flowers to make one kilo. People pick the flowers by hand.", "White truffles grow under trees in Italy. People use dogs to find them. In 2021 a businessman paid 118,000 euros for one white truffle. It was bigger than a tennis ball.", "And then there's the Densuke watermelon from Japan. It's black and very sweet, and farmers only grow about 10,000 a year. One watermelon was sold for 6,100 dollars. 'It's a great present,' says one Japanese shop owner. 'People don't buy them to eat at home!'"], "q": [["Why is saffron so expensive?", "It comes from Italy.", "You need a lot of flowers.", "Dogs find it."], ["How much does a kilo of saffron cost?", "about $10,000", "about $1,000", "about $150,000"], ["How do people find white truffles?", "by hand from flowers", "with machines", "with dogs"], ["What was bigger than a tennis ball?", "a white truffle", "a saffron flower", "a watermelon"], ["Why do people usually buy Densuke watermelons?", "to grow them", "as a present", "to eat at home"]]}, "l": {"setting": "You will hear Chef Marco answering questions on a cooking programme.", "k": "BAABC", "script": [["Presenter", "Chef Marco, what's the secret of a good pizza?"], ["Marco", "Good bread, of course! And not too much cheese."], ["Presenter", "How much cheese do you use?"], ["Marco", "About a hundred and fifty grams for a big pizza. Many people put three hundred – it's too much."], ["Presenter", "And the tomato sauce?"], ["Marco", "I use a tin of tomatoes, some olive oil and some salt. That's all. No sugar!"], ["Presenter", "How many pizzas do you make in a day at your restaurant?"], ["Marco", "About four hundred on a Saturday. On Mondays, only about a hundred."], ["Presenter", "What's your favourite pizza?"], ["Marco", "A simple one – tomato, cheese and fresh basil. Simple is better."]], "q": [["What is Marco's secret?", "sugar in the sauce", "good bread", "a lot of cheese"], ["How much cheese does Marco use for a big pizza?", "150 grams", "300 grams", "100 grams"], ["What doesn't he put in his tomato sauce?", "sugar", "salt", "olive oil"], ["How many pizzas does he make on a Saturday?", "about 100", "about 400", "about 150"], ["What is his favourite pizza?", "meat and cheese", "tomato and olive oil", "tomato, cheese and basil"]]}, "s": {"focus": "countable / uncountable nouns, some / any, how much / how many, quantifiers, comparatives, food.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What did you have for lunch yesterday?", "How much fruit do you eat?", "How many cups of tea or coffee do you drink a day?", "Is there a food from your country that you love?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Describe a typical meal in your family.", "prompts": ["when you have it", "what you eat and drink", "who cooks it", "why you like or don't like it"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Is food in Kazakhstan healthier than food in other countries?", "Compare eating at home and eating in a restaurant", "Is fast food cheaper than home-cooked food?"]}]}});
TESTS.push({"id": "q10", "kind": "quick", "title": "Quick Test 10", "focus": "File 10: superlative adjectives, be going to for plans and predictions, places and buildings, holidays, future time expressions.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACAABCBCAB", "q": [["Mount Everest is the _____ mountain in the world.", "highest", "higher", "most high"], ["This is the _____ restaurant in town.", "goodest", "better", "best"], ["It was the _____ day of my life.", "worst", "baddest", "most bad"], ["She's the _____ person in our class.", "most intelligent", "more intelligent", "intelligentest"], ["I'm _____ visit my aunt next week.", "going", "going to", "go to"], ["_____ you going to study tonight?", "Will", "Do", "Are"], ["They _____ going to buy a new car.", "don't", "aren't", "not"], ["Look at those clouds. It's going _____.", "raining", "rain", "to rain"], ["What _____ going to do tomorrow?", "are you", "do you", "you are"], ["He _____ going to be a doctor.", "does", "'s", "will"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "AABCBAACBC", "q": [["You can see old paintings in a _____.", "museum", "market", "castle"], ["You can borrow books from a _____.", "library", "bookshop", "church"], ["Trains arrive and leave from the _____.", "port", "station", "town hall"], ["We're going to stay in a _____ by the sea.", "museum", "bridge", "hotel"], ["I'm going to _____ my suitcase tonight.", "make", "pack", "do"], ["We're going to _____ the sights in Rome.", "see", "watch", "look"], ["Let's go _____ in the mountains.", "camping", "camp", "to camping"], ["I'm going to Paris _____.", "the next week", "in next week", "next week"], ["They're going to get married _____ June.", "next", "in", "on"], ["See you _____ tomorrow.", "after", "the next", "the day after"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "ABBAC", "q": [["sh*o*pping", "h*o*tel", "g*o*ing"], ["c*a*stle", "c*a*mping", "p*a*rk"], ["b*i*ggest", "m*ar*ket", "br*i*dge"], ["mu_se_um", "_mu_seum", "muse_um_"], ["hol_i_day", "holi_day_", "_hol_iday"]]}, "r": {"title": "Our holiday plans", "k": "AACBB", "text": ["Every year my family goes to the same place on holiday – a lake near Burabay. But this year we're going to do something different.", "We're going to fly to Istanbul for ten days. My dad is going to visit the old mosques and the museums. My mum is going to go shopping in the Grand Bazaar – it's the biggest market in the city.", "And me? I'm going to try all the food! My brother is only four, so he's going to sleep a lot. We're going to stay in a small hotel near the sea."], "q": [["Where does the family usually go on holiday?", "to a lake", "to the sea", "to Istanbul"], ["How long are they going to stay in Istanbul?", "ten days", "four days", "two weeks"], ["Who is going to visit the museums?", "the writer", "the mum", "the dad"], ["What is the Grand Bazaar?", "a museum", "a market", "a hotel"], ["Where is their hotel?", "near the museums", "near the sea", "near the bazaar"]]}, "l": {"setting": "You will hear Max and Lina talking about their plans for the weekend.", "k": "ABCAB", "script": [["Lina", "Max, what are you going to do this weekend?"], ["Max", "I'm going to visit my grandparents. They live in a village near the river."], ["Lina", "Nice. Are you going to go fishing?"], ["Max", "Maybe. If the weather is good. What about you?"], ["Lina", "On Saturday I'm going to see the new film at the cinema. It's the best film of the year, they say."], ["Max", "And on Sunday?"], ["Lina", "I'm not going to do anything! I'm going to sleep all day."]], "q": [["Who is Max going to visit?", "his grandparents", "his friends", "his parents"], ["Where do they live?", "in the city", "near a river", "near the sea"], ["What might Max do there?", "go to the cinema", "go swimming", "go fishing"], ["When is Lina going to the cinema?", "on Saturday", "on Sunday", "on Friday"], ["What is Lina going to do on Sunday?", "go fishing", "sleep", "visit friends"]]}, "s": {"focus": "superlatives, be going to, places, holidays.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What are you going to do this weekend?", "Where are you going to go on your next holiday?", "What's the most beautiful place in your town?", "What's the best restaurant you know?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Talk about the best holiday of your life", "What are your plans for next year?"]}]}});
TESTS.push({"id": "f10", "kind": "file", "title": "File Test 10", "focus": "File 10: superlative adjectives, be going to (plans), be going to (predictions), places and buildings, holidays, future time expressions.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ABBABCBCCACABACBBACA", "q": [["The Caspian is the _____ lake in the world.", "biggest", "bigest", "most big"], ["This is the _____ pizza I know.", "better", "best", "most good"], ["It was the _____ winter for 50 years.", "most cold", "coldest", "colder"], ["That was the _____ meal of my holiday.", "worst", "worse", "baddest"], ["He's the _____ person in my family.", "funnyest", "funniest", "most funny"], ["What's the _____ city in your country?", "more interesting", "interestingest", "most interesting"], ["Which is the _____ way to the airport?", "most quick", "quickest", "quicker"], ["Mount Khan Tengri is one of the _____ mountains in Kazakhstan.", "higher", "high", "highest"], ["I _____ going to learn to drive this year.", "am be", "do", "'m"], ["We're going _____ a new flat next year.", "to buy", "buy", "buying"], ["_____ he going to come to the party?", "Does", "Will", "Is"], ["They _____ going to watch the match. They're busy.", "aren't", "won't", "don't"], ["What _____ going to wear tonight?", "you are", "are you", "do you"], ["She's going to _____ a doctor when she grows up.", "be", "being", "is"], ["Where are you going to _____ your holiday?", "spends", "spending", "spend"], ["Be careful! You're going to _____!", "fell", "fall", "falling"], ["Look at the sky. It _____ going to snow.", "will", "'s", "does"], ["Our team is playing really badly. We're going to _____.", "lose", "losing", "lost"], ["I'm sure you _____ going to love this film.", "will", "do", "'re"], ["She's not studying. She _____ going to pass the exam.", "isn't", "won't", "doesn't"]]}, "v": {"parts": [[0, "Places and buildings: choose the correct word."], [6, "Holidays: choose the correct word."], [14, "Future time expressions: choose the correct answer."]], "k": "BACBBACBACCAABBACACB", "q": [["You can see old kings and queens' homes – a _____.", "factory", "castle", "church"], ["People pray in a mosque, a _____ or a temple.", "church", "library", "town hall"], ["You can buy fresh fruit and vegetables at the _____.", "gallery", "castle", "market"], ["The mayor works in the _____.", "sports centre", "town hall", "police station"], ["You can see modern art in an art _____.", "market", "gallery", "hall"], ["You can cross the river on a _____.", "bridge", "square", "tower"], ["I'm going to _____ a hotel online.", "pay", "make", "book"], ["We're going to _____ a car at the airport.", "take", "hire", "buy"], ["Don't forget to _____ some postcards!", "send", "go", "make"], ["Let's _____ photos of the old town.", "do", "make", "take"], ["We're going to _____ on the beach every day.", "sightsee", "camp out of", "sunbathe"], ["I want to _____ the sights.", "see", "visit to", "look"], ["They're going to _____ in a tent.", "stay", "live at", "sleep at"], ["We're going to _____ the night in Paris.", "pass", "spend", "do"], ["I'm going to call you _____.", "yesterday night", "tonight", "last night"], ["We're going to move house _____.", "next year", "in next year", "the next year"], ["She's going to start her new job _____ Monday.", "at", "in", "on"], ["I'm going to finish this _____.", "tomorrow morning", "morning tomorrow", "the tomorrow morning"], ["They're going to arrive _____ two days.", "on", "after", "in"], ["We're going to see them the day _____ tomorrow.", "next", "after", "before"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "CAACCBAABB", "q": [["m*a*rket", "c*a*stle", "c*a*mping"], ["sn*ow*", "t*ow*er", "t*ow*n"], ["p*or*t", "w*or*ld", "ch*ur*ch"], ["b*ea*ch", "m*ee*t", "br*ea*kfast"], ["st*a*tion", "v*a*cation", "squ*are*"], ["galle_ry_", "_gal_lery", "gal_le_ry"], ["mu_se_um", "_mu_seum", "muse_um_"], ["reser_va_tion", "_re_servation", "re_ser_vation"], ["super_mar_ket", "_su_permarket", "su_per_market"], ["apart_ment_", "a_part_ment", "_a_partment"]]}, "r": {"title": "Kazakhstan's most amazing places", "k": "BCBAA", "text": ["Kazakhstan is the ninth biggest country in the world, and it has some amazing places. Here are three of them.", "Charyn Canyon is about 200 kilometres from Almaty. It's 154 kilometres long and in some places it's 300 metres deep. People call it 'the little brother of the Grand Canyon'. The best time to visit is in spring or autumn, because summer is very hot.", "Kolsai Lakes are three beautiful lakes in the mountains. The highest lake is at 2,850 metres. You can walk from the first lake to the second, but it's a long walk – about four hours.", "Baikonur is the oldest space centre in the world. In 1961, Yuri Gagarin flew into space from here. You can visit the museum and, if you're lucky, see a rocket launch.", "Next summer I'm going to visit all three places with my friends. We're going to hire a car and stay in tents. I'm sure it's going to be the best trip of my life!"], "q": [["What is Kazakhstan's position in size in the world?", "first", "ninth", "third"], ["When is the best time to visit Charyn Canyon?", "winter", "summer", "spring or autumn"], ["How long does it take to walk from the first Kolsai lake to the second?", "a day", "about four hours", "about two hours"], ["What happened at Baikonur in 1961?", "Yuri Gagarin flew into space.", "They opened a museum.", "They built the first rocket."], ["How is the writer going to travel?", "by hired car", "by plane", "by bus"]]}, "l": {"setting": "You will hear a travel agent talking to a customer, Mr Ospanov.", "k": "BABCA", "script": [["Agent", "Good morning. How can I help you?"], ["Mr Ospanov", "Hello. My wife and I are going to have our anniversary in October. We want a holiday somewhere warm."], ["Agent", "How about Egypt? It's very warm in October – about thirty degrees."], ["Mr Ospanov", "Hmm, we went there last year. Something different, please."], ["Agent", "OK. What about Vietnam? We have a twelve-day trip with beautiful beaches and old cities."], ["Mr Ospanov", "That sounds interesting. How much is it?"], ["Agent", "It's eight hundred and fifty dollars per person, with the flights and the hotel."], ["Mr Ospanov", "Is breakfast included?"], ["Agent", "Yes, breakfast every day. Lunch and dinner are not included."], ["Mr Ospanov", "Great. I'm going to talk to my wife tonight, and I'll call you tomorrow."]], "q": [["When is the anniversary?", "in November", "in October", "in August"], ["Why doesn't Mr Ospanov want to go to Egypt?", "They went there last year.", "It's too hot.", "It's too expensive."], ["How long is the Vietnam trip?", "2 weeks", "12 days", "10 days"], ["How much does the trip cost for two people?", "$1,500", "$850", "$1,700"], ["What does the price include?", "flights, hotel and breakfast", "only the flights", "everything"]]}, "s": {"focus": "superlatives, be going to for plans and predictions, places, holidays.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What's the most interesting place in your city?", "What are you going to do after the lesson?", "Where are you going to go on your next holiday?", "What are you going to do next summer?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about your plans for your next holiday (real or imaginary).", "prompts": ["where you are going to go and who with", "how you are going to travel", "where you are going to stay", "what you are going to do there"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["What's the best place in Kazakhstan for tourists? Why?", "Is it better to go on holiday in your country or abroad?", "What do you think your life is going to be like in ten years?"]}]}});
TESTS.push({"id": "q11", "kind": "quick", "title": "Quick Test 11", "focus": "File 11: adverbs of manner and modifiers, verbs + to + infinitive, articles (a / an, the, no article), common adverbs, the internet.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BAACCAABCB", "q": [["She speaks English very _____.", "good", "well", "goodly"], ["Please drive _____.", "carefully", "careful", "carefuly"], ["He works very _____.", "hard", "harder", "hardly"], ["I want _____ a new laptop.", "buy", "buying", "to buy"], ["We decided _____ at home.", "stay", "staying", "to stay"], ["I'd like _____ to Japan one day.", "to go", "going", "go"], ["I love _____ cats.", "–", "a", "the"], ["Can you close _____ door, please?", "a", "the", "–"], ["She's _____ engineer.", "a", "the", "an"], ["I go to _____ work by bus.", "a", "–", "the"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CAABCABCBA", "q": [["I don't understand. Speak more _____, please.", "slow", "slowy", "slowly"], ["He came into the room very _____.", "quietly", "quiet", "quite"], ["I need to _____ my email.", "check", "look", "control"], ["You can _____ this file from the website.", "send in", "download", "upload"], ["I forgot my _____. I can't log in.", "website", "link", "password"], ["Click on the _____ to see the video.", "link", "email", "mouse pad"], ["I _____ to call you, but I forgot.", "tried to", "wanted", "decided"], ["Do you _____ to come with us?", "hope it", "like", "want"], ["He _____ to learn Chinese next year.", "hopes for", "is planning", "thinks"], ["I _____ to be a doctor when I grow up.", "want", "like", "wish"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "ACBBA", "q": [["qu*ie*tly", "b*a*dly", "h*a*ppily"], ["*th*ink", "*th*ing", "*th*e"], ["kn*ow*", "w*e*ll", "sl*ow*ly"], ["care_ful_ly", "_care_fully", "careful_ly_"], ["_in_ternet", "inter_net_", "in_ter_net"]]}, "r": {"title": "My grandmother's new hobby", "k": "BCAAB", "text": ["My grandmother, Rosa, is seventy-six. Last year she decided to learn to use the internet.", "At first it was very difficult. She typed very slowly and she forgot her password every day. But she wanted to talk to her grandchildren in Canada, so she practised every day.", "Now she uses the internet really well. She video-calls my cousins every Sunday, she reads the news online, and she even sells her old books on a website! 'I'm not old,' she says. 'I'm just new to the internet!'"], "q": [["How old is Rosa?", "70", "76", "67"], ["Why did she want to use the internet?", "to read the news", "to sell books", "to talk to her grandchildren"], ["What was difficult for her at first?", "remembering her password", "speaking English", "buying a computer"], ["When does she video-call her cousins' family?", "every Sunday", "every month", "every day"], ["What does she sell online?", "clothes", "books", "cakes"]]}, "l": {"setting": "You will hear Kevin calling a computer helpline.", "k": "CAABB", "script": [["Helpline", "Hello, PC Help. How can I help?"], ["Kevin", "Hi. I can't connect to the internet. My laptop is new."], ["Helpline", "OK. Do you see the Wi-Fi symbol at the bottom of the screen?"], ["Kevin", "Yes, I do. I clicked on it, but nothing happened."], ["Helpline", "Did you type the password correctly?"], ["Kevin", "I think so. It's on the back of the router."], ["Helpline", "Try typing it again slowly. The password has capital letters."], ["Kevin", "Oh… one moment… Yes! It works! Thank you very much."]], "q": [["What is Kevin's problem?", "He forgot his email.", "His laptop is broken.", "He can't connect to the internet."], ["How old is his laptop?", "new", "one year old", "very old"], ["Where is the Wi-Fi password?", "on the back of the router", "on the screen", "in an email"], ["What does the helpline tell him to do?", "buy a new router", "type the password slowly", "restart the laptop"], ["Why was there a problem?", "The router was off.", "The password has capital letters.", "The laptop was old."]]}, "s": {"focus": "adverbs, verbs + to infinitive, articles, the internet.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What do you want to do next year?", "What do you do on the internet every day?", "What can you do really well?", "Do you type quickly or slowly?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Talk about something you decided to do recently", "Is the internet good or bad for children? Why?"]}]}});
TESTS.push({"id": "f11", "kind": "file", "title": "File Test 11", "focus": "File 11: adverbs of manner and modifiers, verbs + to + infinitive (want, need, would like, decide, try…), articles, common adverbs, the internet.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BACAABBCACBBAACCACBB", "q": [["He plays the piano _____.", "beautiful", "beautifully", "beautifuly"], ["You're driving too _____. Slow down!", "fast", "quick", "fastly"], ["She sings very _____.", "badily", "bad", "badly"], ["We worked _____ all day.", "hard", "hardy", "hardly"], ["I can't hear you. Can you speak _____?", "louder", "more loud", "loudlier"], ["The test was _____ easy.", "quietly", "quite", "quiet"], ["The children played _____ in the garden.", "happyly", "happily", "happy"], ["My English is getting _____ every day.", "more well", "more good", "better"], ["I need _____ some milk.", "to buy", "buy", "buying"], ["She decided _____ the job.", "take", "taking", "to take"], ["They hope _____ the match on Saturday.", "win", "to win", "winning"], ["I forgot _____ the door.", "locking", "to lock", "lock"], ["Would you like _____ a coffee?", "to have", "have", "having"], ["I'm trying _____ fewer sweets.", "to eat", "eat", "eaten"], ["_____ moon goes round the Earth.", "–", "A", "The"], ["I usually have _____ breakfast at seven.", "a", "the", "–"], ["She's _____ best student in the class.", "the", "a", "–"], ["I don't like _____ horror films.", "the", "a", "–"], ["We went to _____ cinema last night.", "a", "the", "–"], ["My uncle is _____ architect.", "a", "an", "the"]]}, "v": {"parts": [[0, "Common adverbs: choose the correct word."], [6, "Verbs + infinitive: choose the correct word."], [12, "The internet: choose the correct word."]], "k": "ABABCBCCACBAACABABBC", "q": [["I _____ remember her name. I'm not sure.", "can't", "do", "can"], ["I'm _____ sorry. I didn't see you.", "real", "really", "reallly"], ["It's _____ late. Let's go home.", "quite", "quiet", "quietly"], ["He _____ arrived. He's taking off his coat now.", "ever", "just", "yet"], ["The film was good, but the book was _____ better.", "very", "too much", "even"], ["I _____ go to the gym on Mondays.", "yet", "always", "ever"], ["I _____ to go to university next year.", "enjoy", "mind", "hope"], ["We _____ to have a picnic, but it rained.", "enjoyed", "finished", "planned"], ["She _____ to help me with my homework.", "offered", "enjoyed", "stopped"], ["I _____ to call him, but he didn't answer.", "liked it", "finished", "tried"], ["They _____ to leave early.", "mind", "need", "finish"], ["He _____ to tell anyone the secret.", "promised not", "didn't promise not to", "promised don't"], ["I want to _____ a photo on social media.", "post", "put up on", "send to"], ["Can you _____ me the link?", "log", "sign", "send"], ["_____ in with your username and password.", "Log", "Sign up", "Click"], ["I _____ for information on Google.", "find", "search", "look"], ["Don't _____ on that link – it's dangerous.", "click", "press on", "open in"], ["I'm going to _____ up for an online course.", "log", "sign", "send"], ["This _____ has a lot of useful information.", "password", "website", "browser button"], ["She has 2,000 _____ on Instagram.", "friends lists", "users of", "followers"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "CABAABBACC", "q": [["qu*ie*tly", "qu*i*te", "qu*i*ck"], ["l*a*te", "f*a*st", "h*ar*d"], ["*th*ink", "*th*e", "*th*ree"], ["s*i*gn", "cl*i*ck", "l*i*nk"], ["ear*ly*", "sh*ow*", "sl*ow*ly"], ["dan_ger_ously", "_dan_gerously", "dange_rous_ly"], ["careful_ly_", "_care_fully", "care_ful_ly"], ["_in_ternet", "in_ter_net", "inter_net_"], ["_re_member", "remem_ber_", "re_mem_ber"], ["_com_puter", "compu_ter_", "com_pu_ter"]]}, "r": {"title": "A digital detox", "k": "CABBA", "text": ["Last month, twenty teenagers from a school in Almaty decided to try something difficult: a week with no internet. They gave their phones to their teachers and went to a camp in the mountains.", "'The first day was terrible,' says Aruzhan, 15. 'I wanted to check my messages every five minutes. I didn't know what to do with my hands!'", "But slowly things changed. The teenagers played football, cooked together and walked in the mountains. In the evenings they sat around a fire and talked. 'I learned to play the guitar,' says Daniyar, 16. 'And I slept really well for the first time in months.'", "When they got their phones back, some students had more than 500 messages. 'I read them quickly and then I put my phone away,' says Aruzhan. 'Now I try to use it less. I don't need to look at it all the time.'"], "q": [["Where did the students spend the week?", "at home", "at school", "at a camp in the mountains"], ["How did Aruzhan feel on the first day?", "She wanted to check her messages.", "She was tired.", "She was very happy."], ["What did they do in the evenings?", "played football", "talked around a fire", "watched films"], ["What did Daniyar learn?", "to play football", "to play the guitar", "to cook"], ["What does Aruzhan do now?", "uses her phone less", "checks her phone more", "doesn't use her phone"]]}, "l": {"setting": "You will hear Gulnara asking her son, Arman, to help her with the internet.", "k": "ABABC", "script": [["Gulnara", "Arman, can you help me? I'd like to buy a train ticket online."], ["Arman", "Sure, Mum. Which website?"], ["Gulnara", "The railway website. I tried to do it yesterday, but I couldn't."], ["Arman", "OK. First you need to sign up. Type your email here."], ["Gulnara", "Done. Now what?"], ["Arman", "Now choose a password. It needs to be eight letters or more."], ["Gulnara", "Is \"Arman2010\" OK?"], ["Arman", "Mum! Don't use my name and my birthday – it's too easy. Choose something different."], ["Gulnara", "Fine. OK, I'm in. I want to go to Astana on Friday."], ["Arman", "Click on \"Friday\"… there's a train at 8.15 in the morning, or 10 at night."], ["Gulnara", "The night train, please. I like sleeping on trains."]], "q": [["What does Gulnara want to buy?", "a train ticket", "a plane ticket", "a phone"], ["When did she try to do it before?", "this morning", "yesterday", "last week"], ["How long must the password be?", "eight letters or more", "exactly eight letters", "ten letters"], ["Why doesn't Arman like her first password?", "It has no numbers.", "It's too easy.", "It's too short."], ["Which train does Gulnara choose?", "the one on Saturday", "the one at 8.15 a.m.", "the one at 10 p.m."]]}, "s": {"focus": "adverbs (quickly, well, quite…), verbs + to infinitive, articles, the internet.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What do you use the internet for?", "What do you do really well? What do you do badly?", "What do you want to do next weekend?", "What did you decide to do this year?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about how you use your phone and the internet.", "prompts": ["how many hours a day", "what apps or websites you use", "what you like doing online", "is it a good or a bad thing for you?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Could you live without the internet for a week? Why / why not?", "Should children have phones? At what age?", "Is it better to study online or in a classroom?"]}]}});
TESTS.push({"id": "q12", "kind": "quick", "title": "Quick Test 12", "focus": "File 12: present perfect (+, –, ?), ever / never, present perfect or past simple, past participles, travel and holidays.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BABABACACC", "q": [["I _____ to Paris.", "'ve gone", "'ve been", "was been"], ["_____ you ever eaten sushi?", "Have", "Did", "Are"], ["She _____ never seen snow.", "is", "has", "have"], ["They _____ finished their homework.", "haven't", "didn't", "hasn't"], ["A: Have you ever been to London?\nB: Yes, I _____.", "been", "have", "did"], ["He _____ to Turkey last year.", "went", "has been", "has gone"], ["I've _____ that book three times.", "readed", "reading", "read"], ["Have you ever _____ a horse?", "ridden", "rided", "rode"], ["When _____ you see her? Yesterday.", "do", "have", "did"], ["We _____ in Almaty for two years when I was a child.", "live", "'ve lived", "lived"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BABACCACBA", "q": [["I've _____ my keys. Can you help me find them?", "lose", "lost", "losed"], ["She's never _____ a plane.", "flown", "flew", "flied"], ["Have you ever _____ a famous person?", "meet", "met", "meeted"], ["I've _____ my passport at home!", "left", "leaved", "leave"], ["Our flight is _____. It leaves in three hours, not one.", "late away", "cancelled out", "delayed"], ["You need to go through passport _____.", "office", "check in", "control"], ["_____ in two hours before your flight.", "Check in", "Look in", "Check out"], ["I always sit by the _____ on planes.", "door way", "gate", "window"], ["We're going to miss our _____. Hurry up!", "trip in", "flight", "travel"], ["The plane takes _____ at ten o'clock.", "off", "out", "up"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "BACAB", "q": [["kn*ow*n", "d*o*ne", "fl*ow*n"], ["l*e*ft", "b*ee*n", "s*ee*n"], ["w*o*n", "d*o*ne", "g*o*ne"], ["_pas_senger", "pas_sen_ger", "passen_ger_"], ["_va_cation", "va_ca_tion", "vaca_tion_"]]}, "r": {"title": "A woman who has visited every country", "k": "CBABA", "text": ["Cassie De Pecol from the USA has done something amazing: she has visited every country in the world – all 195 of them!", "She started her trip in 2015 and finished it in 2017, so she did it in only eighteen months. She took more than 250 flights and she has visited some very dangerous places.", "'People ask me what my favourite country is,' she says. 'It's very difficult to say. I've loved Pakistan, Bhutan and Kazakhstan – the people there were very kind to me.' Has she stopped travelling? No, she hasn't. Now she gives talks about her trip around the world."], "q": [["How many countries has Cassie visited?", "250", "18", "195"], ["How long did the trip take?", "two years exactly", "eighteen months", "five years"], ["How many flights did she take?", "more than 250", "2,015", "195"], ["What does she say about the people in Kazakhstan?", "They were dangerous.", "They were very kind.", "They asked a lot of questions."], ["What does she do now?", "gives talks", "works for an airline", "writes books"]]}, "l": {"setting": "You will hear Sam and Dina talking about travel experiences.", "k": "CABBA", "script": [["Sam", "Dina, have you ever been to China?"], ["Dina", "Yes, I have. I went there in 2019 with my company. We went to Beijing."], ["Sam", "Did you see the Great Wall?"], ["Dina", "Yes, I did! It was amazing. Have you ever been abroad, Sam?"], ["Sam", "Only to Russia. I've never flown on a plane."], ["Dina", "Really? Never?"], ["Sam", "Never. I always go by train. I'm afraid of flying."]], "q": [["When did Dina go to China?", "last year", "in 2009", "in 2019"], ["Why did she go?", "for work", "to study", "on holiday"], ["Which city did she visit?", "Hong Kong", "Beijing", "Shanghai"], ["Which country has Sam been to?", "China", "Russia", "Turkey"], ["How does Sam travel?", "by train", "by car", "by plane"]]}, "s": {"focus": "present perfect (Have you ever…?), past simple, travel.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Have you ever been abroad? Where?", "Have you ever eaten something strange?", "What's the best place you've ever visited?", "Have you ever lost something important?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Ask the teacher three Have you ever…? questions and then ask one more question about each", "Talk about a journey you remember."]}]}});
TESTS.push({"id": "f12", "kind": "file", "title": "File Test 12", "focus": "File 12: present perfect (+, –, ?), ever / never, present perfect or past simple?, irregular past participles, travel and the airport.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BABABCBCCBCAACABCBAA", "q": [["I _____ this film before.", "'ve saw", "'ve seen", "saw before"], ["She _____ never been to the sea.", "has", "is", "have"], ["We _____ visited the new museum yet.", "didn't", "haven't", "hasn't"], ["_____ your brother ever lived abroad?", "Has", "Did", "Have"], ["A: Have they ever met him?\nB: No, they _____.", "hasn't", "haven't", "didn't"], ["He's _____ his leg. He can't walk.", "broke", "breaked", "broken"], ["Have you ever _____ in a big competition?", "win", "won", "winned"], ["I've never _____ such a good book.", "readed", "red", "read"], ["They've _____ a new house.", "buy", "buyed", "bought"], ["Have you ever _____ a cake?", "make", "made", "maked"], ["I've _____ to her about it.", "speaked", "spoke", "spoken"], ["She's _____ her phone. She can't find it anywhere.", "lost", "loss", "losed"], ["I _____ my grandparents last weekend.", "visited", "'ve visited", "visit"], ["_____ you ever been to Japan?", "Are", "Did", "Have"], ["A: Have you ever been to Astana?\nB: Yes. I _____ there in 2023.", "went", "'ve been", "'ve gone"], ["When _____ you start learning English?", "have", "did", "do"], ["She's lived in five countries, but she _____ never lived in Asia.", "have", "did", "has"], ["We _____ a wonderful time on holiday last month.", "have", "had", "'ve had"], ["Have you _____ any good films recently?", "seen", "saw", "see"], ["How many times _____ you been to Almaty?", "have", "are", "did"]]}, "v": {"parts": [[0, "Past participles: choose the correct word."], [7, "Travel and the airport: choose the correct word."]], "k": "BCABBABAACBBCCACBAAC", "q": [["I've _____ my homework.", "did", "done", "do"], ["She's _____ to Spain twice.", "went", "gone", "been"], ["Have you _____ the dog today?", "fed", "feed", "feeded"], ["I've _____ too much. I feel ill.", "eated", "eaten", "ate"], ["We've _____ all the milk.", "drank", "drunk", "drinked"], ["They've _____ me a lot about you.", "told", "tell", "telled"], ["Have you ever _____ a song?", "wrote", "written", "writed"], ["You show your passport at _____.", "passport control", "check-in out", "baggage claim"], ["You get your suitcases at _____.", "baggage reclaim", "the gate", "departures"], ["Your flight leaves from _____ 12.", "door", "terminal hall", "gate"], ["You can buy cheap perfume in _____.", "security out", "duty free", "arrivals"], ["Our flight is _____. It leaves at 10.00, not 8.00.", "cancelled", "delayed", "boarded"], ["The plane is going to _____ in Almaty at 15.20.", "take off", "arrive in to", "land"], ["Please put your bags through _____.", "the gate desk", "customs out", "security"], ["You need a _____ to get on the plane.", "boarding pass", "luggage", "check-in"], ["I'm going to _____ my suitcase. It's very heavy.", "check out", "look in", "check in"], ["I like to _____ light – just one small bag.", "go on", "travel", "take"], ["We _____ our flight because of the traffic.", "missed", "lost", "left"], ["Have a good _____!", "flight", "way in", "travel"], ["Let's take a taxi to the _____.", "flight", "journey", "airport"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "BACBACAABC", "q": [["sh*ow*n", "d*o*ne", "fl*ow*n"], ["g*o*ne", "w*o*n", "d*o*ne"], ["b*ough*t", "c*augh*t", "b*oa*t"], ["p*ai*d", "s*ai*d", "m*a*de"], ["b*ee*n", "s*u*ng", "dr*u*nk"], ["pass_en_ger", "passen_ger_", "_pass_enger"], ["_trav_elling", "trav_el_ling", "travel_ling_"], ["de_par_tures", "_de_partures", "depar_tures_"], ["_at_tendant", "at_ten_dant", "atten_dant_"], ["arri_vals_", "_a_rrivals", "a_rri_vals"]]}, "r": {"title": "My first time abroad", "k": "ABCAB", "text": ["Hi! I'm Erlan and I'm nineteen. I've lived in Kostanay all my life. Until last month I never travelled abroad, and I never flew on a plane!", "Last month I went to Dubai with my older brother. He has travelled a lot – he has been to twelve countries – so he helped me at the airport. We checked in, went through passport control and security, and then we had a coffee before our flight.", "The flight was four hours. I was a bit nervous when we took off, but then I watched two films and it was fine. When we landed, it was forty-two degrees! I've never felt anything so hot.", "We stayed in Dubai for five days. We went up the Burj Khalifa, the tallest building in the world, and we swam in the sea every day. I've already started saving money for my next trip!"], "q": [["Before last month, Erlan _____.", "never travelled abroad", "lived in Dubai", "flew once a year"], ["How many countries has his brother been to?", "five", "twelve", "four"], ["How did Erlan feel at the start of the flight?", "very happy", "bored", "a bit nervous"], ["What was the weather like when they landed?", "very hot", "rainy", "cold"], ["What is Erlan doing now?", "working in Dubai", "saving money for another trip", "studying at university"]]}, "l": {"setting": "You will hear an announcement and a conversation at an airport.", "k": "AACBB", "script": [["Announcement", "Good afternoon. Flight KC 852 to Istanbul is now delayed. The new departure time is 17.45. Passengers should go to gate 14."], ["Aliya", "Oh no. Did you hear that? Our flight is delayed."], ["Timur", "Yes. Seventeen forty-five – that's two hours late."], ["Aliya", "What shall we do? Have you ever been to this airport before?"], ["Timur", "Yes, I've been here many times. There's a nice café upstairs."], ["Aliya", "Let's go there. Have you got the boarding passes?"], ["Timur", "Yes, they're in my bag. Don't worry."], ["Aliya", "And did you remember to bring the passports?"], ["Timur", "Of course. They're here too. Come on, let's get a coffee."]], "q": [["Where is the flight going?", "Istanbul", "London", "Almaty"], ["What is the new departure time?", "17.45", "15.45", "14.00"], ["Which gate should passengers go to?", "4", "40", "14"], ["Where is the café?", "outside the airport", "upstairs", "next to gate 14"], ["Who has the boarding passes?", "Aliya", "Timur", "the airline"]]}, "s": {"focus": "present perfect (I've been…, Have you ever…?), past simple, travel.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Have you ever been on a plane? Where to?", "What countries have you visited?", "Have you ever lost your luggage or missed a flight?", "What's the most beautiful place you've ever been to?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about a journey you have made.", "prompts": ["where you went and when", "how you travelled", "who you went with", "what happened"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Have you ever done anything dangerous or exciting? Tell the teacher", "Which countries would you like to visit? Why?", "Is it better to travel by plane, train or car?"]}]}});
