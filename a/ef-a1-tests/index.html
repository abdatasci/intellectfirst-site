], ["I'm _____. I want to go to bed.", "angry", "tired", "hungry"], ["He flies planes. He's a _____.", "builder", "pilot", "lawyer"], ["She works in a hospital. She's a _____.", "farmer", "chef", "nurse"], ["I _____ a lot of water.", "cook", "drink", "eat"], ["My mother's sister is my _____.", "uncle", "niece", "aunt"], ["My brother's son is my _____.", "nephew", "niece", "cousin"], ["I _____ a shower every morning.", "make", "do", "have"], ["I _____ to bed at eleven.", "go", "have", "get"], ["It's 4.45. It's quarter _____ five.", "to", "past", "after"], ["It's very _____. Take your umbrella.", "dry", "wet", "sunny"], ["In _____ it's very cold in Kazakhstan.", "winter", "spring", "summer"], ["You wear _____ on your hands.", "boots", "gloves", "socks"], ["Can I _____ to Mr Smith, please?", "tell", "say", "speak"], ["My birthday is on May the _____.", "two", "second", "twoth"], ["He plays the _____ in a rock band.", "violin", "orchestra", "drums"], ["I can't stand _____ music. It's too loud.", "classical", "soft", "heavy metal"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "ACBACAABCB", "q": [["m*y*", "m*e*", "thr*ee*"], ["*ch*ef", "*sh*op", "*ch*air"], ["w*or*k", "d*oe*s", "f*ir*st"], ["c*a*n't", "c*a*n", "h*a*t"], ["fif*th*", "mon*th*", "*th*em"], ["_Sat_urday", "Satur_day_", "Sat_ur_day"], ["_beau_tiful", "beau_ti_ful", "beauti_ful_"], ["police_man_", "po_lice_man", "_po_liceman"], ["grandmo_ther_", "grand_mo_ther", "_grand_mother"], ["musi_cian_", "mu_si_cian", "_mu_sician"]]}, "r": {"title": "A message from a new pen friend", "k": "BACAB", "text": ["Hi Lily!", "My name's Kamila and I'm your new pen friend. I'm fourteen and I live in Taraz, a city in the south of Kazakhstan. I live with my parents and my two brothers. My dad is a bus driver and my mum is a dentist. My older brother, Ruslan, is seventeen and he's very funny. My little brother, Azat, is only six.", "I go to school from Monday to Saturday. Yes, we have school on Saturday! My favourite subject is biology because I want to be a vet. After school I usually do my homework and then I play volleyball with my friends.", "I love music – I can play the dombra, a traditional Kazakh instrument with two strings. I don't like doing housework, but I always help my mum in the kitchen on Sunday.", "Right now I'm sitting in my room and it's snowing outside. What's the weather like in Manchester? Please write soon and tell me about your family!", "Kamila"], "q": [["Where does Kamila live?", "in Almaty", "in Taraz", "in Manchester"], ["What does Kamila's mother do?", "She's a dentist.", "She's a bus driver.", "She's a vet."], ["Why does she like biology?", "Her mother is a dentist.", "It's easy.", "She wants to be a vet."], ["What does she always do on Sunday?", "help in the kitchen", "go to school", "play volleyball"], ["What is the weather like now in Taraz?", "It's raining.", "It's snowing.", "It's sunny."]]}, "l": {"setting": "You will hear Jake asking Saule about her new job at a hotel.", "k": "CBBAA", "script": [["Jake", "Hi Saule! I hear you have a new job."], ["Saule", "Yes! I'm a receptionist at the Grand Hotel."], ["Jake", "Great! Do you like it?"], ["Saule", "Yes, I love it. I meet a lot of people from different countries."], ["Jake", "What time do you start?"], ["Saule", "It depends. This week I'm working in the evening, from four to midnight."], ["Jake", "That's late! Do you work at the weekend?"], ["Saule", "Yes, I work on Saturday, but Sunday and Monday are my days off."], ["Jake", "Can you speak a lot of languages?"], ["Saule", "Kazakh, Russian and English. And I'm learning Chinese now – a lot of guests are from China."]], "q": [["What is Saule's job?", "cleaner", "waitress", "receptionist"], ["What does she like about it?", "the hours", "meeting people from different countries", "the money"], ["When does she finish work this week?", "at 10 p.m.", "at midnight", "at 4 p.m."], ["Which days does she NOT work?", "Sunday and Monday", "Saturday and Sunday", "Monday and Tuesday"], ["Why is she learning Chinese?", "Many guests are from China.", "She wants to work in China.", "Her friend is Chinese."]]}, "s": {"focus": "Files 1–6: be, present simple, adverbs of frequency, can, present continuous, like + -ing.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["Where are you from? What's your town like?", "What do you usually do on Sunday?", "What can you do well?", "What do you like doing with your friends?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about a person in your family.", "prompts": ["who he / she is and how old", "what he / she does", "what he / she usually does at the weekend", "what he / she likes doing"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["What do you do every day? What do you never do?", "What's the weather like in your town in each season?", "Describe what you're wearing today and what you usually wear to work or school."]}]}});
TESTS.push({"id": "p2", "kind": "progress", "title": "Progress Test: Files 7–12", "focus": "Files 7–12 review: past simple (was / were, regular and irregular), there is / there are / there was, some / any, how much / how many, comparatives and superlatives, be going to, adverbs, verbs + to infinitive, articles, present perfect.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ABCCAABBABBCCABAACBC", "q": [["I _____ at the theatre last night.", "was", "am", "were"], ["We _____ a great time at the party.", "have", "had", "haved"], ["She _____ her keys yesterday.", "loses", "losed", "lost"], ["_____ you see the match on Saturday?", "Do", "Were", "Did"], ["They _____ go to school yesterday. It was a holiday.", "didn't", "don't", "weren't"], ["There _____ two supermarkets near my house.", "are", "is", "be"], ["There _____ a park here twenty years ago.", "were", "was", "is"], ["Is there _____ milk in the fridge?", "a", "any", "some"], ["I'd like _____ biscuits, please.", "some", "any", "a"], ["_____ sugar do you want?", "How often", "How much", "How many"], ["This sofa is _____ than the old one.", "most comfortable", "more comfortable", "comfortabler"], ["My brother is _____ than me.", "more young", "youngest", "younger"], ["It's the _____ hotel in the city.", "more expensive", "expensivest", "most expensive"], ["We're going _____ to the beach tomorrow.", "to go", "go", "going"], ["Look at that car! It's going _____!", "crash", "to crash", "crashing"], ["He speaks Spanish very _____.", "well", "good", "goodly"], ["I want _____ a teacher.", "to be", "be", "being"], ["I usually go to _____ bed at eleven.", "the", "a", "–"], ["_____ you ever been to Paris?", "Are", "Have", "Did"], ["She _____ never eaten caviar.", "have", "did", "has"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BBCAACABABBACCBAACCB", "q": [["A person who writes books is a _____.", "writist", "writer", "writing"], ["I saw her _____.", "ago two days", "two days ago", "before two days"], ["We _____ home at midnight.", "had", "went", "got"], ["You keep food cold in a _____.", "fridge", "wardrobe", "cooker"], ["The bank is _____ the café and the cinema.", "between", "opposite", "in front"], ["The cat is _____ the table.", "between", "opposite", "under"], ["a _____ of crisps", "packet", "bottle", "jar"], ["a _____ of jam", "packet", "jar", "carton"], ["Salmon is a type of _____.", "fish", "fruit", "meat"], ["1,000,000 = one _____", "thousand", "million", "billion"], ["You can see paintings in an art _____.", "market", "gallery", "station"], ["We're going to _____ a car on holiday.", "hire", "take on", "book in"], ["I'm going to call you _____.", "ago", "yesterday", "tomorrow"], ["Please drive _____. The roads are icy.", "care", "careful", "carefully"], ["Click on the _____ to open the website.", "follower", "link", "password"], ["Log _____ with your username.", "in", "on to", "up"], ["I've _____ my homework.", "done", "did", "do"], ["Have you ever _____ a horse?", "rode", "ride", "ridden"], ["You show your passport at passport _____.", "gate", "check", "control"], ["Our flight is _____. It leaves two hours late.", "cancelled", "delayed", "boarded"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "ABACACABBC", "q": [["h*a*d", "w*a*s", "w*a*tched"], ["start*ed*", "stopp*ed*", "want*ed*"], ["h*ere*", "wh*ere*", "th*ere*"], ["m*ee*t", "b*ea*ch", "br*ea*kfast"], ["d*o*ne", "fl*ow*n", "kn*ow*n"], ["his_to_ry", "histo_ry_", "_his_tory"], ["_op_posite", "op_po_site", "oppo_site_"], ["bana_na_", "ba_na_na", "_ba_nana"], ["muse_um_", "mu_se_um", "_mu_seum"], ["in_ter_net", "inter_net_", "_in_ternet"]]}, "r": {"title": "The town that changed", "k": "BBACA", "text": ["Twenty years ago, Saryagash was a small, quiet town in the south of Kazakhstan. There weren't many shops and there wasn't a cinema. Young people usually left the town to work in Almaty or Shymkent.", "Then thing ve never _____ to Japan.", "went", "been", "gone"], ["_____ you ever met a famous person?", "Are", "Did", "Have"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "ABCABCABCCBCBBABCBABAABCAACACC", "q": [["He's from Germany. He's _____.", "German", "Germany", "Germanish"], ["sixty + fifteen = _____", "seventy", "seventy-five", "sixty-five"], ["It isn't heavy. It's _____.", "thin", "small", "light"], ["I've got an exam tomorrow. I'm _____.", "worried", "relaxed", "bored"], ["She looks after sick people. She's a _____.", "builder", "nurse", "lawyer"], ["I _____ a lot of money. I'm rich!", "take", "win", "earn"], ["My father's father is my _____.", "grandfather", "uncle", "grandson"], ["I _____ dressed and have breakfast.", "go", "get", "have"], ["It's 7.15. It's quarter _____ seven.", "to", "half", "past"], ["It's _____ today. You can't see far.", "sunny", "windy", "foggy"], ["Wear a _____. It's cold.", "shorts", "coat", "T-shirt"], ["The fifth month is _____.", "March", "June", "May"], ["I _____ my homework after school.", "have", "do", "make"], ["We _____ to the beach for the day.", "had", "went", "got"], ["A person who invents things is an _____.", "inventor", "inventist", "inventer"], ["You cook food in the _____.", "fridge", "oven", "wardrobe"], ["The museum is _____ the bank. Cross the road and you're there.", "under", "between", "opposite"], ["a _____ of cola", "jar", "can", "packet"], ["_____ are a type of fruit.", "Grapes", "Onions", "Carrots"], ["You can borrow books from a _____.", "bookshop", "library", "gallery"], ["I'm going to _____ a hotel online.", "book", "make", "hire"], ["I'll see you the day _____ tomorrow.", "after", "next", "later"], ["He drives very _____.", "quick", "fast", "fastly"], ["I _____ to visit China one day.", "enjoy", "mind", "hope"], ["I need to _____ my emails.", "check", "look", "see"], ["Don't forget your _____ – you need it to log in.", "password", "link", "website"], ["I've _____ my phone. I can't find it.", "lose", "l The student talks alone. The teacher only listens.", "card": "Talk about how your English has changed this year.", "prompts": ["what you couldn't do before", "what you can do now", "what was the most difficult", "what you are going to do next"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["What's the best way to learn new words?", "Is it better to live in a big city or a small town? Why?", "What was the most interesting thing you learned this year?"]}]}});

<script>
(function(){
const L=['A','B','C'];
const ALLSECS=[
 {k:'g',name:'Grammar',max:20},{k:'v',name:'Vocabulary',max:20},{k:'p',name:'Pronunciation',max:10},
 {k:'r',name:'Reading',max:10},{k:'l',name:'Listening',max:10},{k:'s',name:'Speaking',max:30}];
function secsFor(t){return ALLSECS.filter(s=>t[s.k]).map(s=>Object.assign({},s,{max:(s.k==='g'||s.k==='v'||s.k==='p')?t[s.k].q.length:(s.k==='r'||s.k==='l')?t[s.k].q.length*(t.rw||2):s.k==='s'?t.s.tasks.length*10:s.max}))}
const COLLECTIONS=[
 {name:'Entry test',ids:TESTS.filter(t=>t.kind==='entry').map(t=>t.id)},
 {name:'Quick tests',ids:TESTS.filter(t=>t.kind==='quick').map(t=>t.id)},
 {name:'File tests',ids:TESTS.filter(t=>t.kind==='file').map(t=>t.id)},
 {name:'Progress tests',ids:TESTS.filter(t=>t.kind==='progress').map(t=>t.id)},
 {name:'End-of-course test',ids:TESTS.filter(t=>t.kind==='end').map(t=>t.id)}];
const KEY='ifa-ef-a1-testcentre-v1';
let state;
try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}
if(!state||typeof state!=='object')state={mode:'practice',name:'',cls:'',cur:TESTS[0].id,sec:'g',tests:{},theme:''};
if(!TESTS.find(t=>t.id===state.cur))state.cur=TESTS[0].id;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const T=()=>TESTS.find(t=>t.id===state.cur);
function ts(id){if(!state.tests[id])state.tests[id]={a:{g:{},v:{},p:{},r:{},l:{}},s:{},marked:false,plays:0};return state.tests[id]}

/* theme */
const themeSel=$('#theme');
function applyTheme(){if(state.theme)document.documentElement.setAttribute('data-theme',state.theme);else document.documentElement.removeAttribute('data-theme');themeSel.value=state.theme||''}
themeSel.onchange=()=>{state.theme=themeSel.value;applyTheme();save()};
applyTheme();

/* scoring */
function secData(t,k){if(k==='r')return{q:t.r.q,k:t.r.k,w:t.rw||2};if(k==='l')return{q:t.l.q,k:t.l.k,w:t.rw||2};return{q:t[k].q,k:t[k].k,w:1}}
function secScore(t,k){const st=ts(t.id);if(k==='s')return Object.values(st.s).reduce((a,b)=>a+b,0);const d=secData(t,k);let c=0;for(const i in st.a[k]){if(L[st.a[k][i]]===d.k[i])c+=d.w}return c}
function secDone(t,k){const st=ts(t.id);if(k==='s')return Object.keys(st.s).length;return Object.keys(st.a[k]).length}
function secCount(t,k){if(k==='s')return t.s.tasks.length;return secData(t,k).q.length}
const reveal=t=>state.mode==='practice'||ts(t.id).marked;
function band(p){if(p>=90)return'Excellent';if(p>=75)return'Good';if(p>=60)return'Satisfactory';if(p>=40)return'Needs revision';return'Needs a lot of revision'}

/* text formatting */
function fmtPron(s){return esc(s).replace(/\*(.+?)\*/g,'<b class="snd">$1</b>').replace(/_(.+?)_/g,'<u class="str">$1</u>')}
function fmtStem(s,filled){
  return s.split('\n').map(line=>{
    let m=line.match(/^([AB]):\s*(.*)$/);let pre='';
    if(m){pre='<span class="spk">'+m[1]+'</span>';line=m[2]}
    const parts=line.split(/_{3,}/);
    return pre+parts.map(esc).join(filled!=null?'<span class="blank filled">'+esc(filled)+'</span>':'<span class="blank" aria-label="gap"></span>')
  }).join('<br>');
}

/* nav */
function renderNav(){
  let h='';
  for(const c of COLLECTIONS){
    h+='<h2>'+esc(c.name)+'</h2>';
    if(!c.ids.length){h+=c.link?'<p class="soon"><a href="'+c.link+'" target="_blank" rel="noopener" style="color:inherit">'+esc(c.linkText)+'</a></p>':'<p class="soon">Not added yet</p>';continue}
    h+='<ul>';
    for(const id of c.ids){const t=TESTS.find(x=>x.id===id);const tot=secsFor(t).reduce((a,s)=>a+secScore(t,s.k),0);const any=secsFor(t).some(s=>secDone(t,s.k)>0);
      h+='<li><button data-test="'+id+'" aria-current="'+(id===state.cur)+'"><span>'+esc(t.title)+'</span><span class="mini">'+(any&&reveal(t)?tot:'')+'</span></button></li>'}
    h+='</ul>';
  }
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>goTest(b.dataset.test));
}
function goTest(id){stopAudio();stopTimer();state.cur=id;state.sec='g';save();renderAll();window.scrollTo(0,0)}

/* main */
function renderMain(){
  const t=T(),st=ts(t.id),SECS=secsFor(t);if(!SECS.find(s=>s.k===state.sec))state.sec='g';
  let h='<div class="mobile-pick"><label for="mpick" class="sub" style="font-size:.85rem;color:var(--muted)">Test</label><select id="mpick">'+TESTS.map(x=>'<option value="'+x.id+'"'+(x.id===t.id?' selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select></div>';
  h+='<section class="head"><h1>'+esc(t.title)+'</h1><p class="focus">'+esc(t.focus)+'</p><div class="who">'+
     '<label>Student name<input id="sname" value="'+esc(state.name)+'" autocomplete="off"></label>'+
     '<label>Class<input id="sclass" value="'+esc(state.cls)+'" autocomplete="off" style="min-width:110px"></label>'+
     '<div class="mode" role="group" aria-label="Marking mode"><button data-mode="practice" aria-pressed="'+(state.mode==='practice')+'">Instant marking</button><button data-mode="exam" aria-pressed="'+(state.mode==='exam')+'">Exam mode</button></div>'+
     '<p class="modehint">'+(state.mode==='practice'?'Each answer is marked as soon as it is chosen, and the score updates live. First answer counts.':'Answers stay hidden until you press “Mark test”. Answers can be changed until then.')+'</p></div></section>';
  h+='<div class="tabs" role="tablist">'+SECS.map(s=>{const done=secDone(t,s.k),n=secCount(t,s.k);const b=reveal(t)?secScore(t,s.k)+'/'+s.max:done+'/'+n;return'<button role="tab" data-sec="'+s.k+'" aria-selected="'+(state.sec===s.k)+'">'+s.name+'<span class="badge">'+b+'</span></button>'}).join('')+'</div>';
  h+='<section class="sec" id="sec">'+renderSec(t,state.sec)+'</section>';
  const i=SECS.findIndex(s=>s.k===state.sec);
  h+='<div class="pager">'+(i>0?'<button data-go="'+SECS[i-1].k+'">Back to '+SECS[i-1].name+'</button>':'<span></span>')+(i<SECS.length-1?'<button data-go="'+SECS[i+1].k+'">Continue to '+SECS[i+1].name+'</button>':'<span></span>')+'</div>';
  const m=$('#main');m.innerHTML=h;
  $('#mpick').onchange=e=>goTest(e.target.value);
  $('#sname').oninput=e=>{state.name=e.target.value;save();renderLedger()};
  $('#sclass').oninput=e=>{state.cls=e.target.value;save();renderLedger()};
  m.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();renderAll()});
  m.querySelectorAll('[data-sec],[data-go]').forEach(b=>b.onclick=()=>{stopAudio();stopTimer();state.sec=b.dataset.sec||b.dataset.go;save();renderAll();$('.tabs').scrollIntoView({block:'start'})});
  bindSec(t);
}

function qBlock(t,k,i,item,isPron){
  const st=ts(t.id),d=secData(t,k),ch=st.a[k][i],rv=reveal(t),right=L.indexOf(d.k[i]);
  const stem=isPron?null:item[0],opts=isPron?item:item.slice(1);
  const locked=(state.mode==='practice'&&ch!=null)||st.marked;
  let h='<div class="q" id="q-'+k+'-'+i+'"><div class="n">'+(i+1)+'</div><div>';
  if(stem!=null)h+='<div class="stem">'+fmtStem(stem,(ch!=null&&stem.indexOf('___')>-1)?opts[ch]:null)+'</div>';
  h+='<div class="opts">';
  opts.forEach((o,j)=>{let c='opt';
    if(ch===j)c+=' sel';
    if(rv&&ch!=null){if(j===ch)c+=(j===right?' ok':' no');else if(j===right)c+=' key'}
    h+='<button class="'+c+'" data-k="'+k+'" data-i="'+i+'" data-j="'+j+'"'+(locked?' disabled':'')+' aria-pressed="'+(ch===j)+'"><span class="l">'+L[j]+'</span><span>'+(isPron?fmtPron(o):esc(o))+'</span></button>'});
  h+='</div>';
  if(rv&&ch!=null)h+='<div class="verdict '+(ch===right?'ok">Correct':'no">Answer: '+L[right]+'  '+(isPron?opts[right].replace(/[*_]/g,''):esc(opts[right])))+'</div>';
  return h+'</div></div>';
}
function listBlock(t,k,obj,isPron){
  let h='',pi=0;
  obj.q.forEach((item,i)=>{
    if(obj.parts&&pi<obj.parts.length&&obj.parts[pi][0]===i){h+='<h3 class="part">'+esc(obj.parts[pi][1])+'</h3>';pi++}
    h+=qBlock(t,k,i,item,isPron)});
  return h;
}

function renderSec(t,k){
  if(k==='g')return'<h2>Grammar</h2>'+listBlock(t,'g',t.g,false);
  if(k==='v')return'<h2>Vocabulary</h2>'+listBlock(t,'v',t.v,false);
  if(k==='p')return'<h2>Pronunciation</h2>'+listBlock(t,'p',t.p,true);
  if(k==='r'){
    return'<h2>Reading</h2><p class="focus" style="color:var(--muted)">Read the text and choose A, B, or C. '+((t.rw||2)===1?'One mark':'Two marks')+' for each answer.</p><div class="reading"><article class="text"><h3>'+esc(t.r.title)+'</h3>'+t.r.text.map(p=>'<p>'+esc(p)+'</p>').join('')+'</article><div>'+t.r.q.map((q,i)=>qBlock(t,'r',i,q,false)).join('')+'</div></div>';
  }
  if(k==='l')return renderListening(t);
  if(k==='s')return renderSpeaking(t);
}
function bindSec(t){
  document.querySelectorAll('#sec .opt').forEach(b=>b.onclick=()=>{
    const st=ts(t.id),k=b.dataset.k,i=+b.dataset.i,j=+b.dataset.j;
    if(st.marked)return;
    if(state.mode==='practice'&&st.a[k][i]!=null)return;
    st.a[k][i]=j;save();refreshQ(t,k,i);renderTabs();renderLedger();renderNav();
  });
  if(state.sec==='l')bindListening(t);
  if(state.sec==='s')bindSpeaking(t);
}
function refreshQ(t,k,i){
  const el=document.getElementById('q-'+k+'-'+i);if(!el)return;
  const src=k==='r'?t.r.q[i]:k==='l'?t.l.q[i]:t[k].q[i];
  el.outerHTML=qBlock(t,k,i,src,k==='p');
  const nel=document.getElementById('q-'+k+'-'+i);
  nel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const st=ts(t.id),j=+b.dataset.j;if(st.marked)return;if(state.mode==='practice'&&st.a[k][i]!=null)return;
    st.a[k][i]=j;save();refreshQ(t,k,i);renderTabs();renderLedger();renderNav()});
}
function renderTabs(){const t=T(),SECS=secsFor(t);document.querySelectorAll('.tabs [data-sec]').forEach(b=>{const s=SECS.find(x=>x.k===b.dataset.sec);b.querySelector('.badge').textContent=reveal(t)?secScore(t,s.k)+'/'+s.max:secDone(t,s.k)+'/'+secCount(t,s.k)})}

/* listening */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let voices=[],playing=false,paused=false,chosenVoice='';
function loadVoices(){if(!synth)return;const all=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang)||v.lang==='en');
  const rank=v=>(/en[-_]GB/i.test(v.lang)?3:/en[-_](IE|AU|NZ)/i.test(v.lang)?2:/en[-_]US/i.test(v.lang)?1:0)+(v.localService?0.5:0);
  voices=all.sort((a,b)=>rank(b)-rank(a));
  const sel=document.getElementById('voice');if(sel)fillVoices(sel)}
function fillVoices(sel){sel.innerHTML='<option value="">Automatic (British first)</option>'+voices.map(v=>'<option value="'+esc(v.name)+'"'+(v.name===chosenVoice?' selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('')}
if(synth){loadVoices();if(synth.addEventListener)synth.addEventListener('voiceschanged',loadVoices);else synth.onvoiceschanged=loadVoices}
function stopAudio(){if(synth){synth.cancel()}playing=false;paused=false}
function renderListening(t){
  const st=ts(t.id);const lim=2;

function bindListening(t){
  const st=ts(t.id),lim=2;
  const tg=$('#ltoggle');if(tg)tg.onclick=()=>{st.showScript=!st.showScript;save();$('#sec').innerHTML=renderSec(t,'l');bindSec(t)};
  if(!synth)return;
  const vs=$('#voice');fillVoices(vs);vs.onchange=()=>{chosenVoice=vs.value};
  $('#lreset').onclick=()=>{st.plays=Math.max(0,st.plays-1);save();$('#lplays').textContent='Plays used: '+st.plays+' of '+lim;$('#lstatus').textContent='One more play allowed.'};
  $('#lpause').onclick=()=>{if(playing&&!paused){synth.pause();paused=true;$('#lplay').textContent='Resume';$('#lstatus').textContent='Paused.'}};
  $('#lstop').onclick=()=>{stopAudio();$('#lplay').textContent='Play recording';$('#lstatus').textContent='Stopped.';markLine(-1)};
  $('#lplay').onclick=()=>{
    if(paused){synth.resume();paused=false;$('#lplay').textContent='Play recording';$('#lstatus').textContent='Playing…';return}
    if(playing)return;
    if(st.plays>=lim){$('#lstatus').textContent='Both plays used. The teacher can allow another play.';return}
    st.plays++;save();$('#lplays').textContent='Plays used: '+st.plays+' of '+lim;

}
function markLine(i){document.querySelectorAll('#lscript p').forEach(p=>p.classList.toggle('now',+p.dataset.line===i))}
function speakScript(t,rate){
  synth.cancel();
  const speakers=[...new Set(t.l.script.map(l=>l[0]))];
  const base=chosenVoice?voices.find(v=>v.name===chosenVoice):voices[0];
  const pool=chosenVoice?[base]:voices.slice(0,4);
  const pitches=[1,1.18,0.88,1.08];
  const q=[];
  t.l.script.forEach((ln,li)=>{
    const si=speakers.indexOf(ln[0]);
    const v=pool.length?pool[si%pool.length]:null;
    const pitch=(pool.length>si)?1:pitches[si%pitches.length];
    (ln[1].match(/[^.!?…]+[.!?…]*[”"’']?\s*/g)||[ln[1]]).forEach(s=>{s=s.trim();if(!s)return;
      const u=new SpeechSynthesisUtterance(s);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
      u.rate=rate;u.pitch=pitch;u.onstart=()=>markLine(li);q.push(u)});
  });
  if(!q.length)return;
  playing=true;paused=false;$('#lstatus').textContent='Playing…';
  q[q.length-1].onend=()=>{playing=false;paused=false;const s=$('#lstatus');if(s)s.textContent='Finished. Answer the questions below.';markLine(-1)};
  q.forEach(u=>{u.onerror=()=>{playing=false}});
  q.forEach(u=>synth.speak(u));
}

/* answers and marks are stored as JSON strings so each write replaces them (the class record merges nested objects) */
function recA(r){if(!r)return {};if(typeof r.aj==='string'){try{return JSON.parse(r.aj)}catch(e){}}return r.a||{}}
function recTM(r){if(!r)return null;if(typeof r.tmj==='string'){try{return JSON.parse(r.tmj)}catch(e){}}return r.tm||null}
const teacherSec=k=>k==='s'||k==='w';

/* score any stored record with the engine's own scoring */
function withRec(t,r,fn){
  const had=Object.prototype.hasOwnProperty.call(state.tests,t.id),orig=state.tests[t.id];
  const tm=recTM(r)||{},a=JSON.parse(JSON.stringify(recA(r)));
  if(!isF(t))['g','v','p','r','l'].forEach(k=>{if(!a[k])a[k]={}});
  const rec={a,s:Object.assign({},tm.s||{}),marked:true,plays:0};
  if(isF(t))rec.w={text:r.wt||'',mark:tm.w==null?null:tm.w};
  state.tests[t.id]=rec;
  try{return fn()}finally{if(had)state.tests[t.id]=orig;else delete state.tests[t.id]}
}
function recScore(t,r){return withRec(t,r,()=>{
  const S=secsFor(t),secs={};let tot=0,auto=0,autoMax=0,pending=false,answered=0,items=0;
  S.forEach(s=>{const sc=secScore(t,s.k);secs[s.k]=sc;tot+=sc;
    if(teacherSec(s.k)){if(!secDone(t,s.k))pending=true}
    else{auto+=sc;autoMax+=s.max;answered+=secDone(t,s.k);items+=secCount(t,s.k)}});
  return {secs,tot,auto,autoMax,pending,answered,items,S,max:S.reduce((a,s)=>a+s.max,0)}})}

/* ---------- result codes ---------- */
function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function pack(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if('CompressionStream' in window){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return 'IFA1.'+b64u(buf)}catch(e){}}
  return 'IFA0.'+b64u(raw)}
async function unpack(code){{const mm=String(code).match(/IFA[01]\.[A-Za-z0-9_-]+/);if(mm)code=mm[0]}code=String(code).trim().replace(/\s+/g,'');const m=code.match(/^IFA([01])\.(.+)$/);if(!m)throw new Error('This doesn’t look like an IF Academy result code.');
  let bytes=unb64u(m[2]);if(m[1]==='1'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(bytes))}
async function showCode(){
  const t=T(),st=ts(t.id);
  if(!state.name.trim()){await uiAlert('Please type your name and class at the top of the test first.');const f=$('#sname');if(f)f.focus();return}

  renderAll();
  const box=$('#codebox');if(!box)return;setTimeout(()=>{try{if(!window.IFR)return;if(!st.rid){st.rid=IFR.newId();try{(typeof _save==='function'?_save:save)()}catch(e){}}const S=secsFor(t).map(s=>[s.name,teacherSec(s.k)&&!secDone(t,s.k)?null:secScore(t,s.k),s.max]);const W=[isF(t)?(fw(t).text||''):''];box.innerHTML='';IFR.box(box,{id:st.rid,c:'English File Elementary Test Centre',lv:'A1',t:t.title,v:'',n:state.name,cl:state.cls,s:S,w:W,x:code})}catch(e){console.error('IFR',e)}},0);
  box.innerHTML='<div class="codebox"><p><b>Your result code.</b> Copy it and send it to your teacher, for example in a message.</p><textarea readonly id="codeta">'+esc(code)+'</textarea><button class="go" id="copycode">Copy code</button></div>';
  const ta=$('#codeta');ta.focus();ta.select();

}

/* ---------- saving to the class record ---------- */
let saveTimer=null,syncing=false,syncAgain=false,lastSent={};const docExists={};
function recordFor(t){const st=ts(t.id);const r={aj:JSON.stringify(st.a||{}),wt:isF(t)?(fw(t).text||''):'',marked:!!st.marked,handed:!!st.handed,mode:state.mode};
  if(RT.owner)r.tmj=JSON.stringify({s:st.s||{},w:isF(t)?(fw(t).mark==null?null:fw(t).mark):null});return r}
function currentKey(){if(RT.owner){if(!state.name.trim())return null;return 'dev-'+slug(state.name)+'--'+slug(state.cls)}return RT.uid}
function queueSync(now){if(!RT.db||(RT.sync!=='live'&&!RT.owner))return;clearTimeout(saveTimer);saveTimer=setTimeout(doSync,now?50:2500)}
async function doSync(){
  if(syncing){syncAgain=true;return}
  const key=currentKey();if(!key||!RT.db)return;const t=T();if(!t)return;
  const rec=recordFor(t);const sig=key+'|'+t.id+'|'+state.name+'|'+state.cls+'|'+JSON.stringify(rec);if(lastSent[key+'|'+t.id]===sig)return;
  syncing=true;
  try{
    rec.upd=new Date().toISOString();
    const ref=RT.db.doc('results/'+key);
    const head={name:state.name||'',cls:state.cls||'',updated:rec.upd,src:RT.owner?'device':'student'};
    if(!docExists[key]){const g=await ref.get();docExists[key]=g.exists;
      if(!g.exists){await ref.set(Object.assign({},head,{tests:{[t.id]:rec}}));docExists[key]=true}
      else await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}))}
    else await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}));
    lastSent[key+'|'+t.id]=sig;RT.writeErr=null;
  }catch(e){
    if(!RT.owner&&e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='permission_denied')){RT.sync='code';RT.writeErr=null;renderAll()}
    else if(e&&e.code==='quota_exceeded'){RT.writeErr='The class record is full. Ask your teacher to remove old results.';renderLedger()}
    else if(e&&e.code==='unavailable'){setTimeout(()=>queueSync(),4000)}
  }
  syncing=false;if(syncAgain){syncAgain=false;doSync()}
}
function applyTeacherMarks(){
  if(!studentLocked()||!RT.remote||!RT.remote.tests)return false;let changed=false;
  for(const id in RT.remote.tests){const t=TESTS.find(x=>x.id===id);if(!t)continue;const tm=recTM(RT.remote.tests[id]);if(!tm)continue;
    const st=ts(id);const s=tm.s||{};if(JSON.stringify(st.s||{})!==JSON.stringify(s)){st.s=Object.assign({},s);changed=true}
    if(isF(t)){const W=fw(t),wm=tm.w==null?null:tm.w;if(W.mark!==wm){W.mark=wm;changed=true}}}
  return changed;
}
function subscribeMine(){try{RT.db.doc('results/'+RT.uid).onSnapshot(s=>{RT.remote=s.exists?JSON.parse(JSON.stringify(s.data()||{})):null;if(s.exists)docExists[RT.uid]=true;
  if(applyTeacherMarks()){_save();renderAll()}},e=>{})}catch(e){}}
function subscribeAll(){try{RT.db.collection('results').onSnapshot(s=>{RT.all=s.docs.map(d=>Object.assign({_id:d.id},JSON.parse(JSON.stringify(d.data()||{}))));
  if(state.view==='teacher'){renderTeacher(true);renderTeacherLedger()}else{const c=$('#vcount');if(c)c.textContent=RT.all.length?RT.all.length+' student'+(RT.all.length===1?'':'s'):'class record'}},e=>{})}catch(e){}}
async function initRuntime(){
  if(!window.claude||typeof window.claude.use!=='function'){RT.ready=true;RT.sync='local';return}
  let user=null,db=null,dl=null;
  try{[user,db,dl]=await Promise.all([claude.use('user'),claude.use('db'),claude.use('downloads')])}catch(e){}
  RT.user=user;RT.db=db;RT.dl=dl;
  if(user){try{RT.owner=await user.isOwner();RT.uid=await user.id();RT.canWrite=await user.can('data.write')}catch(e){}}
  if(RT.owner&&db){RT.sync='owner';subscribeAll()}
  else if(db&&user&&RT.uid&&RT.canWrite!==false){RT.sync='live';subscribeMine()}
  else if(user){RT.sync='code'}
  else RT.sync='local';
  if(!RT.owner&&state.view==='teacher')state.view='tests';
  RT.ready=true;renderAll();
}

function rows(){
  const out=[];
  RT.all.forEach(d=>{const tests=d.tests||{};Object.keys(tests).forEach(id=>{const t=TESTS.find(x=>x.id===id);const r=tests[id];if(!t||!r)return;
    let sc;try{sc=recScore(t,r)}catch(e){return}
    out.push({doc:d._id,id,t,r,d,sc,name:d.name||'(no name)',cls:d.cls||'',upd:r.upd||d.updated||'',src:d.src||''})})});
  return out.sort((a,b)=>String(b.upd).localeCompare(String(a.upd)));
}

function rateRow(attr,i,max,cur,label){let h='<div class="rate crit" role="group" aria-label="'+esc(label)+'"><span class="lab">'+esc(label)+'</span>';for(let n=0;n<=max;n++)h+='<button '+attr+'="'+i+'" data-n="'+n+'" aria-pressed="'+(cur===n)+'">'+n+'</button>';return h+'</div>'}
const clean=s=>String(s==null?'':s).replace(/[*_]/g,'');
function reviewRows(t,k,A){
  const out=[];
  if(isF(t)){const sec=fsec(t,k);fitems(sec).forEach(x=>{const it=x.it,v=A[x.id];
    const q=it.t==='ord'?it.wd.join(' / '):it.t==='syl'?it.o.join('·'):clean(it.s||'').replace(/_{3,}/g,'___');
    const opt=j=>(it.abcd||it.gap?L8[j]+'  ':'')+clean(it.o[j]);
    let ans='—';if(v!=null){if(it.t==='mc')ans=opt(v);else if(it.t==='syl')ans=it.o.map((o,j)=>j===v?o.toUpperCase():o).join('');else if(it.t==='ms')ans=v.map(opt).join(', ');else ans=v.v||'—'}
    let key;if(it.t==='mc')key=Array.isArray(it.a)?it.a.map(opt).join(' or '):opt(it.a);else if(it.t==='syl')key=it.o.map((o,j)=>j===it.a?o.toUpperCase():o).join('');else if(it.t==='ms')key=it.a.map(opt).join(', ');else if(it.t==='tx')key=it.show||it.a[0];else key=it.a[0];
    out.push({q,ans,key,ok:iscore(it,v)===iw(it)})})}
  else{const d=secData(t,k);d.q.forEach((item,i)=>{const isP=k==='p';const opts=isP?item:item.slice(1);const v=(A[k]||{})[i];const right=L.indexOf(d.k[i]);
    out.push({q:isP?opts.map(clean).join(' / '):clean(item[0]).replace(/_{3,}/g,'___'),ans:v==null?'—':L[v]+'  '+clean(opts[v]),key:L[right]+'  '+clean(opts[right]),ok:v===right})})}

  document.querySelectorAll('[data-tw]').forEach(b=>b.onclick=()=>{const tm=JSON.parse(JSON.stringify(recTM(r.r)||{s:{},w:null}));const n=+b.dataset.n;tm.w=tm.w===n?null:n;write(tm)});

      if(Object.keys(d.tests||{}).length)await ref.set(d);else await ref.delete()}TV.sel=null}catch(e){TV.msg='Couldn’t remove that result.'}renderTeacher(true)};
}
async function importCode(){
  const raw=$('#impta').value;if(!raw.trim())return;
  try{const o=await unpack(raw);const t=TESTS.find(x=>x.id===o.id);if(!t)throw new Error('That code is for a test this page doesn’t have.');
    if(!o.n)throw new Error('The code has no student name.');
    const key='imp-'+slug(o.n)+'--'+slug(o.c);const ref=RT.db.doc('results/'+key);const g=await ref.get();
    const rec={aj:JSON.stringify(o.a||{}),wt:o.wt||'',marked:true,handed:true,upd:o.at||new Date().toISOString(),mode:'code'};
    const prev=g.exists&&g.data().tests&&recTM(g.data().tests[o.id]);const dm=o.m&&(Object.keys(o.m.s||{}).length||o.m.w!=null);if(prev&&(Object.keys(prev.s||{}).length||prev.w!=null))rec.tmj=JSON.stringify(prev);else if(dm){rec.tmj=JSON.stringify({s:o.m.s||{},w:o.m.w==null?null:o.m.w});rec.dm=true}
    const body={name:o.n,cls:o.c||'',updated:new Date().toISOString(),src:'import',tests:{[o.id]:rec}};
    if(g.exists)await ref.update(body);else await ref.set(body);
    const sc=recScore(t,rec);
    TV.msg='Imported '+o.n+(o.c?' ('+o.c+')':'')+', '+t.title+': '+sc.auto+' / '+sc.autoMax+' on the automatically marked sections.';TV.sel=key+'|'+o.id;

async function downloadCsv(list){
  const names=['Grammar','Vocabulary','Pronunciation','Reading','Writing','Listening','Speaking'],keyOf={Grammar:'g',Vocabulary:'v',Pronunciation:'p',Reading:'r',Writing:'w',Listening:'l',Speaking:'s'};
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const lines=[['Student','Class','Test','Status','Updated'].concat(names,['Total','Max','Percent']).map(q).join(',')].concat(list.map(r=>[r.name,r.cls,r.t.title,r.r.handed?'Handed in':r.r.marked?'Marked':'In progress',r.upd].concat(names.map(n=>{const v=r.sc.secs[keyOf[n]];return v==null?'':v}),[r.sc.tot,r.sc.max,Math.round(r.sc.tot/r.sc.max*100)]).map(q).join(',')));
  try{await RT.dl.save({filename:document.title.replace(/[^\w\- ]+/g,'').trim().slice(0,50)+' results.csv',data:new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'})})}catch(e){}
}

/* ===== IF Academy exam layer: retakes with teacher approval, attempt counts, timed tests =====
   Retakes: once answers have been shown or the test is marked / handed in, a student can't restart it.
   The teacher approves on the dashboard (students who save to the class record) or gives the student
   their personal retake code, which stays the same for every test and every retake on this page.
   Every retake keeps the earlier scores and updates the same student record with the new attempt.
   Timing: each test has a time allowed, worked out from its sections (with reading, listening and

const IF_GROUPS=['C1','B2-Adults','B2 Teen','B1 A','B1 B','B1 C','B1 D','A2-Teens','PET','KET','Flyers','Movers'];
function normCls(s){
  const raw=String(s==null?'':s).trim().replace(/\s+/g,' ');if(!raw)return '';
  const hg={'а':'a','в':'b','б':'b','с':'c','д':'d','е':'e','к':'k','м':'m','н':'h','о':'o','р':'p','т':'t','х':'x'};
  const x=raw.toLowerCase().replace(/[абвсдекмнортх]/g,c=>hg[c]).replace(/\b(group|gr|class|grp|level)\b\.?/g,'').replace(/[^a-z0-9]/g,'');
  let m=x.match(/^b1([abcd])$/);if(m)return 'B1 '+m[1].toUpperCase();
  if(/flyer/.test(x))return 'Flyers';if(/mover/.test(x))return 'Movers';
  if(/pet|b1prelim|preliminary/.test(x))return 'PET';if(/ket|a2key/.test(x))return 'KET';
  if(/a2/.test(x))return 'A2-Teens';
  if(/c1/.test(x))return 'C1';
  if(/b2/.test(x))return /te[ea]n/.test(x)?'B2 Teen':'B2-Adults';
  return raw}

function wordsIn(o){let n=0;const skip={items:1,q:1,o:1,a:1,ins:1,instr:1,k:1,id:1,name:1,setting:1,title:1,ex:1,sents:1,list:1,bankHtml:1,opts:1};
  (function w(x){if(x==null)return;if(typeof x==='string'){n+=(x.replace(/<[^>]+>/g,' ').match(/[A-Za-z’'-]+/g)||[]).length;return}
    if(Array.isArray(x)){x.forEach(w);return}if(typeof x==='object')for(const k in x){if(!skip[k])w(x[k])}})(o);return n}
function timePlan(t){
  const out=[];
  AD.secInfo(t).forEach(s=>{
    if(s.k==='s')return;
    if(s.k==='w'){const wm=AD.writeMins(t);out.push({k:'w',name:s.name,prep:5,what:'to plan before you write',mins:5+wm});return}
    if(s.k==='r'){const prep=Math.max(2,Math.ceil(s.words/130));out.push({k:'r',name:s.name,prep,what:'to read the text before you answer',mins:prep+Math.ceil(s.items*AD.rRate(t))});return}
    if(s.k==='l'){const play=Math.ceil(2*s.words/140+0.5);out.push({k:'l',name:s.name,prep:1,what:'to read the questions before the recording',mins:1+play+1});return}
    out.push({k:s.k,name:s.name,mins:Math.max(2,Math.ceil(s.items*AD.rate(t)))});
  });
  const sum=out.reduce((a,x)=>a+x.mins,0);

const tmFmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function tmLimit(t){const st=ts(t.id);return (timePlan(t).total+(st.tadd||0)+(st.txs||0))*60000}
function tmUsed(st){if(!st.t0)return 0;const now=st.tend||Date.now();return now-st.t0-(st.tpd||0)-(st.tpz?now-st.tpz:0)}

const tmDone=st=>!!(st.marked||st.handed);
function tmStart(t){const st=ts(t.id);if(st.t0)return;st.t0=Date.now();st.pp={};save();queueSync(true);renderAll()}

/* students who save live: approvals, extra time, and a test this device lost */
function rtOnRemote(){
  if(RT.owner||!RT.remote||!RT.remote.tests)return false;let ch=false;
  const sig=JSON.stringify(Object.keys(RT.remote.tests).map(id=>{const R=RT.remote.tests[id]||{};return [id,R.att||1,R.ok||0,R.rq||0,R.tx||0]}));
  if(sig!==RTK.sig){RTK.sig=sig;ch=true}
  for(const id in RT.remote.tests){const t=TESTS.find(x=>x.id===id);const R=RT.remote.tests[id];if(!t||!R)continue;
    const cur=state.tests[id],ratt=R.att||1,latt=tAtt(cur);
    if(cur&&cur.clearTM&&ratt>=latt){cur.clearTM=false;ch=true}
    if(ratt>latt||(ratt===latt&&(((R.marked||R.handed)&&!(cur&&(cur.marked||cur.handed)))||(R.t0>0&&!(cur&&cur.t0))))){AD.restore(t,R);const n=state.tests[id];n.t0=R.t0||null;n.tout=!!R.tout;ch=true}
    const st=state.tests[id];
    if(st&&ratt===tAtt(st)&&(R.tx||0)!==(st.txs||0)){st.txs=R.tx||0;ch=true;
      if(st.tout){delete st.tend;if(tmLeft(t)>0){st.tout=false;st.marked=false;st.handed=false}else st.tend=Date.now()}}}
  if(ch)rtLocal();
  return ch;
}

const _rtBind=bindDetail;
bindDetail=function(all){_rtBind(all);if(!TV.sel)return;const r=all.find(x=>x.doc+'|'+x.id===TV.sel);if(!r)return;const att=r.r.att||1;
  const put=async(o,msg)=>{Object.assign(r.r,o);try{await RT.db.doc('results/'+r.doc).update({tests:{[r.id]:o}});TV.msg=''}catch(e){TV.msg=msg}renderTeacher(true)};
  const ok=$('#rtok');if(ok)ok.onclick=()=>put({ok:att},'Couldn’t save the approval. Try again.');
  const cn=$('#rtcancel');if(cn)cn.onclick=()=>put({ok:0},'Couldn’t save that. Try again.');
  const tx=$('#rtx');if(tx)tx.onclick=()=>put({tx:(r.r.tx||0)+5},'Couldn’t save the extra time. Try again.')};
function rtFiltered(){return rows().filter(r=>(!TV.test||r.id===TV.test)&&(!TV.cls||r.cls===TV.cls)&&(!TV.q||r.name.toLowerCase().includes(TV.q.toLowerCase())))}
async function rtCsv(list){
  const names=[],keys=[];TESTS.forEach(t=>AD.secInfo(t).forEach(s=>{if(!keys.includes(s.k)){keys.push(s.k);names.push(s.name)}}));
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const head=['Student','Class','Test','Status','Attempt','Earlier attempts','Time ran out','Updated'].concat(names,['Total','Max','Percent']);
  const lines=[head.map(q).join(',')].concat(list.map(r=>{const R=r.r;const h=rtHist(R.hj);
    return [r.name,r.cls,r.t.title,R.handed?'Handed in':R.marked?'Marked':'In progress',R.att||1,h.map(x=>x.n+': '+x.tot+'/'+x.max).join('; '),R.tout?'yes':'',r.upd]
      .concat(keys.map(k=>{const v=r.sc.secs[k];return v==null?'':v}),[r.sc.tot,r.sc.max,r.sc.max?Math.round(r.sc.tot/r.sc.max*100):''])
      .map(q).join(',')}));
  const dl=RT.dl||RT.downloads;
  try{await dl.save({filename:document.title.replace(/[^\w\- ]+/g,'').trim().slice(0,50)+' results.csv',data:new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'})})}catch(e){}
}
const _rtTeacher=renderTeacher;
renderTeacher=function(keep){
  const y=window.scrollY;_rtTeacher(keep);
  const all=rows();
  const hr=document.querySelector('#main .rtable thead tr');if(hr&&hr.children[3])hr.children[3].insertAdjacentHTML('afterend','<th class="num">Attempts</th>');
  document.querySelectorAll('#main .rtable td.empty').forEach(td=>td.colSpan=(+td.colSpan||7)+1);
  document.querySelectorAll('#main tr[data-row]').forEach(tr=>{const r=all.find(x=>x.doc+'|'+x.id===tr.dataset.row);if(!r)return;const R=r.r,att=R.att||1;const td=tr.children[3];if(!td)return;
    let tg='';if(R.tout)tg+='<span class="tag">time ran out</span>';
    if(R.ok===att)tg+='<span class="tag">retake approved</span>';else if(R.rq===att)tg+='<span class="tag warn">retake requested</span>';
    if(tg)td.insertAdjacentHTML('beforeend',' '+tg);
    td.insertAdjacentHTML('afterend','<td class="num"><b>'+att+'</b></td>')});
  const cb=$('#csvbtn');if(cb)cb.onclick=()=>rtCsv(rtFiltered());
  const imp=document.getElementById('impta');const sec=imp&&imp.closest('section');
  const g='<section class="task" id="rtgen"><h3>Retake codes</h3><p class="meta">Each student has one personal retake code for this page. It works for every test and every retake, so they only need it once. Type the name exactly as the student types it on their tests.</p><div class="rtgen"><label>Student name<input id="rtgn" value="'+esc(RTK.gn||'')+'" autocomplete="off"></label></div><div class="rtout meta" id="rtgo2"></div></section>';
  if(sec)sec.insertAdjacentHTML('afterend',g);else{const m=$('#main');if(m)m.insertAdjacentHTML('beforeend',g)}
  const upd=()=>{RTK.gn=$('#rtgn').value;$('#rtgo2').innerHTML=RTK.gn.trim()?'Retake code: <span class="rtcode">'+rtCode(RTK.gn)+'</span>':'Type a name to see the code.'};
  const gn=$('#rtgn');if(gn){gn.oninput=upd;upd()}
  if(keep)window.scrollTo(0,y);
};
const _rtImport=importCode;
importCode=async function(){
  let o=null,prevAtt=0,key='';
  try{o=await unpack($('#impta').value);key='imp-'+slug(o.n)+'--'+slug(o.c);
    if(RT.db){const g=await RT.db.doc('results/'+key).get();const P=g.exists&&g.data().tests&&g.data().tests[o.id];prevAtt=P?(P.att||1):0}}catch(e){o=null}
  await _rtImport();
  if(o&&o.id&&RT.db&&/^Imported/.test(TV.msg||'')){const att=o.att||1;const up={att,hj:o.hj||'[]',tout:!!o.tout};
    if(prevAtt&&att>prevAtt){const m=o.m||{};const has=Object.keys(m.s||{}).length||(m.w&&(typeof m.w==='object'?Object.keys(m.w).length:m.w!=null));up.tmj=has?JSON.stringify({s:m.s||{},w:m.w==null?null:m.w}):'';if(has)up.dm=true}
    try{await RT.db.doc('results/'+key).update({tests:{[o.id]:up}})}catch(e){}
    TV.msg+=' Attempt '+att+(prevAtt&&att>prevAtt?' (updated from attempt '+prevAtt+')':'')+'.';renderTeacher(true)}
};

/* adapter: English File A1/A2/B1/B2 engine */
const AD={
 sum(t){const S=secsFor(t);return {tot:S.reduce((a,s)=>a+secScore(t,s.k),0),max:S.reduce((a,s)=>a+s.max,0)}},
 firstSec(t){return secsFor(t)[0].k},
 anyAnswered(t){return secsFor(t).some(s=>!teacherSec(s.k)&&secDone(t,s.k)>0)},
 restore(t,R){delete state.tests[t.id];const ns=ts(t.id);const a=recA(R);if(!isF(t))['g','v','p','r','l'].forEach(k=>{if(!a[k])a[k]={}});
   ns.a=a;ns.marked=!!R.marked;ns.handed=!!R.handed;ns.seen=!!(R.seen||R.marked||R.handed);ns.att=R.att||1;ns.hist=rtHist(R.hj);if(isF(t)&&R.wt)fw(t).text=R.wt},
 secInfo(t){return secsFor(t).map(s=>{let items=0,words=0;
   if(isF(t)){const sec=fsec(t,s.k);if(s.k!=='w'&&s.k!=='s')items=fitems(sec).length;words=wordsIn(sec)}
   else if(s.k!=='s'){const o=t[s.k];items=o.q.length;words=s.k==='r'?wordsIn(o.text):s.k==='l'?wordsIn(o.script):0}
   return {k:s.k,name:s.name,items,words}})},
 rate(t){return isF(t)?0.6:0.5},rRate(t){return 1},writeMins(t){return 20}
};
const _rtATM=applyTeacherMarks;
applyTeacherMarks=function(){let c=false;try{c=rtOnRemote()}catch(e){}return _rtATM()||c};

renderAll();
initRuntime();
})();
