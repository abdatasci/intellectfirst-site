TESTS.push({"id": "entry", "kind": "entry", "title": "Entry Test", "focus": "A placement check before starting English File Elementary: be, have got, present simple, can, there is / are, possessives, and everyday words for people, places, food and time.", "rw": 1, "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ABCABBABBAABCBCCAACAACCBC", "q": [["My name _____ Aliya.", "is", "am", "are"], ["_____ you from Kazakhstan?", "Do", "Are", "Is"], ["We _____ students. We're teachers.", "isn't", "not", "aren't"], ["This is _____ apple.", "an", "the", "a"], ["I have two _____.", "childs", "children", "childrens"], ["_____ is your brother's name?", "Who", "What", "Where"], ["They _____ in a big flat in Astana.", "live", "living", "lives"], ["She _____ coffee in the morning.", "drinking", "drinks", "drink"], ["_____ he speak English?", "Is", "Does", "Do"], ["I _____ like fish.", "don't", "doesn't", "not"], ["Look at _____ dog over there!", "that", "these", "this"], ["Is this _____ bag?", "you", "your", "you're"], ["It's my _____ car.", "fathers", "father", "father's"], ["There _____ a café near the station.", "are", "is", "be"], ["There _____ any chairs in the room.", "isn't", "not", "aren't"], ["I can _____ the guitar.", "to play", "playing", "play"], ["_____ swim?", "Can you", "You can", "Do you can"], ["My birthday is _____ May.", "in", "on", "at"], ["The lesson starts _____ nine o'clock.", "in", "on", "at"], ["He _____ usually late for class.", "is never", "never", "never is"], ["Listen! The baby _____.", "is crying", "cries", "cry"], ["Yesterday I _____ at home.", "were", "am", "was"], ["We _____ a great film last night.", "see", "seed", "saw"], ["_____ did you go on holiday?", "Who", "Where", "What"], ["I'd like _____ water, please.", "any", "a", "some"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CAABAABACBCBABCCACBBABCAC", "q": [["Monday, Tuesday, _____, Thursday", "Weekend", "Sunday", "Wednesday"], ["twelve + eight = _____", "twenty", "eighteen", "twelve"], ["My mother's mother is my _____.", "grandmother", "sister", "aunt"], ["The opposite of 'old' (for a car) is _____.", "short", "new", "young"], ["A banana is _____.", "yellow", "purple", "blue"], ["He works in a hospital. He's a _____.", "doctor", "waiter", "pilot"], ["She works in a school. She's a _____.", "driver", "teacher", "farmer"], ["You sleep in a _____.", "bedroom", "garden", "kitchen"], ["You cook in the _____.", "living room", "bathroom", "kitchen"], ["I _____ up at seven o'clock.", "make", "get", "go"], ["I _____ my homework in the evening.", "make", "have", "do"], ["I have _____ for breakfast.", "the bus", "eggs and bread", "a shower"], ["It's very cold. Wear a _____.", "coat", "sandals", "T-shirt"], ["It's hot and sunny. It's _____.", "autumn", "summer", "winter"], ["You buy medicine at a _____.", "cinema", "bank", "chemist's"], ["You catch a train at the _____.", "museum", "park", "station"], ["The day after Friday is _____.", "Saturday", "Thursday", "Sunday"], ["The twelfth month is _____.", "October", "November", "December"], ["My father's sister is my _____.", "uncle", "aunt", "niece"], ["I'm _____. Can I have a sandwich?", "thirsty", "hungry", "tired"], ["Please _____ the door. It's cold.", "close", "open", "turn"], ["Can you _____ me the time, please?", "say", "tell", "speak"], ["I _____ the bus to work.", "walk", "drive", "take"], ["How _____ is this T-shirt? It's £10.", "much", "many", "old"], ["Excuse me, where's the _____? I need to wash my hands.", "garage", "kitchen", "toilet"]]}, "r": {"title": "Hello from Kostanay!", "k": "BABAACBACC", "text": ["Hi! My name is Dana and I'm twenty-three. I'm from Kostanay, a city in the north of Kazakhstan. I live in a small flat in the city centre with my sister, Aigerim. She's a student at the university. I'm a nurse and I work at a big hospital near our flat.", "I usually get up at six o'clock because I start work at seven. I walk to the hospital – it only takes ten minutes. I finish work at three in the afternoon. In the evening I cook dinner and then I watch TV or read. Aigerim usually studies in her room.", "At the weekend I don't work. On Saturday I go to the market with my mother and we buy fruit, vegetables and meat. On Sunday I meet my friends in a café. We drink coffee and talk for hours. In the summer we sometimes go to the lake outside the city.", "I can speak Kazakh and Russian, and now I'm learning English. My English lessons are on Tuesday and Thursday evenings. It's difficult, but I love it!"], "q": [["How old is Dana?", "33", "23", "13"], ["Who does Dana live with?", "her sister", "her friends", "her mother"], ["What does Aigerim do?", "She's a nurse.", "She's a student.", "She's a teacher."], ["Where does Dana work?", "at a hospital", "at a market", "at a university"], ["What time does Dana start work?", "at seven o'clock", "at six o'clock", "at three o'clock"], ["How does Dana go to work?", "She drives.", "She takes a bus.", "She walks."], ["What does Dana do on Saturday?", "She works.", "She goes to the market.", "She meets friends in a café."], ["Who does Dana go to the market with?", "her mother", "her friends", "her sister"], ["Where do they sometimes go in the summer?", "to the mountains", "to the sea", "to a lake"], ["When are Dana's English lessons?", "on Saturday and Sunday", "every day", "on Tuesday and Thursday"]]}, "l": {"setting": "You will hear Sam, a new student, talking to Ms Park at a language school reception.", "k": "BAACABACBC", "script": [["Ms Park", "Good morning. Can I help you?"], ["Sam", "Yes, please. I want to start an English course."], ["Ms Park", "Of course. What's your name?"], ["Sam", "Sam Bekov. That's B-E-K-O-V."], ["Ms Park", "Thank you. And how old are you, Sam?"], ["Sam", "I'm nineteen."], ["Ms Park", "What's your phone number?"], ["Sam", "It's eight, seven, zero, one, four, four, five, two, six."], ["Ms Park", "And what do you do?"], ["Sam", "I'm a student. I study computer science."], ["Ms Park", "Great. We have classes in the morning and in the evening. Which do you want?"], ["Sam", "The evening, please. I have lectures in the morning."], ["Ms Park", "OK. The evening class is on Monday and Wednesday at six o'clock."], ["Sam", "Perfect. How much is it?"], ["Ms Park", "It's forty thousand tenge a month."], ["Sam", "OK. And where is the classroom?"], ["Ms Park", "It's room twelve, on the second floor. The teacher is Mr Lee. He's very nice."]], "q": [["What does Sam want?", "to find a job", "to start an English course", "to buy a book"], ["How do you spell Sam's surname?", "B-E-K-O-V", "B-E-C-O-V", "B-A-K-O-V"], ["How old is Sam?", "19", "9", "90"], ["What does Sam study?", "music", "English", "computer science"], ["Why does Sam want the evening class?", "He has lectures in the morning.", "He gets up late.", "He works in the morning."], ["When is the evening class?", "Monday and Friday", "Monday and Wednesday", "Tuesday and Thursday"], ["What time is the class?", "at six o'clock", "at five o'clock", "at seven o'clock"], ["How much is the course?", "4,000 tenge a month", "14,000 tenge a month", "40,000 tenge a month"], ["Where is the classroom?", "room 2, second floor", "room 12, second floor", "room 20, first floor"], ["Who is the teacher?", "Ms Park", "Mr Bekov", "Mr Lee"]]}, "s": {"focus": "be, have got, present simple, can, and vocabulary for family, jobs and daily routine.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What's your name? How do you spell it?", "Where are you from?", "What do you do?", "What do you usually do at the weekend?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about your family.", "prompts": ["how many people are in your family", "their names and ages", "what they do", "where they live"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Why do you want to learn English?", "What can you do in English now?", "What do you like doing in your free time?"]}]}});
TESTS.push({"id": "q1", "kind": "quick", "title": "Quick Test 1", "focus": "File 1: verb be (+, –, ?), subject pronouns, possessive adjectives, numbers, days of the week, countries and nationalities, classroom language.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "AACCBBACBA", "q": [["I _____ from Almaty.", "'m", "'s", "'re"], ["They _____ in my class.", "'re", "'m", "'s"], ["_____ she Russian?", "Am", "Are", "Is"], ["We _____ hungry.", "isn't", "not", "aren't"], ["A: Are you a student?\nB: Yes, I _____.", "are", "am", "'m"], ["What's _____ name? He's my teacher.", "her", "his", "he"], ["_____ are my friends, Erlan and Max.", "These", "This", "It"], ["My sister and I live in Kostanay. _____ flat is small.", "We", "Their", "Our"], ["Where _____ your parents from?", "is", "are", "am"], ["It _____ cold today.", "isn't", "aren't", "not"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BCAABCBCAA", "q": [["seven + six = _____", "seventeen", "thirteen", "sixteen"], ["The day before Friday is _____.", "Saturday", "Tuesday", "Thursday"], ["She's from Spain. She's _____.", "Spanish", "Spain", "Spainish"], ["He's from China. He's _____.", "Chinese", "Chinan", "China"], ["I'm from Turkey. I'm _____.", "Turkian", "Turkish", "Turkey"], ["Saturday and Sunday are the _____.", "week", "days", "weekend"], ["_____ your books. Read page 10.", "Listen", "Open", "Look"], ["I don't understand. Can you _____ that, please?", "sit", "stand", "repeat"], ["How do you _____ your name?", "spell", "say", "write down"], ["forty + forty-five = _____", "eighty-five", "seventy-five", "fifty-eight"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "CAABB", "q": [["*i*s", "th*i*s", "h*i*"], ["*a*re", "*a*ge", "n*a*me"], ["f*i*fteen", "th*ir*ty", "th*ir*teen"], ["Satur_day_", "_Sat_urday", "Sat_ur_day"], ["_Ja_panese", "Japa_nese_", "Ja_pa_nese"]]}, "r": {"title": "My new classmates", "k": "BAACB", "text": ["My name is Nurlan and I'm a student at an English school in Astana. There are eight students in my class. They're from different countries.", "Ana is from Brazil. She's twenty-five and she's very friendly. Kenji and Yuki are from Japan. They're brothers, not friends! Kenji is eighteen and Yuki is twenty. Our teacher is Mrs Jones. She's from England and she's great.", "Our classroom is small but it's nice. Our lessons are from Monday to Thursday. On Friday we have a test!"], "q": [["How many students are in Nurlan's class?", "twenty", "eight", "eighteen"], ["Where is Ana from?", "Brazil", "England", "Japan"], ["Kenji and Yuki are _____.", "brothers", "teachers", "friends"], ["How old is Yuki?", "18", "25", "20"], ["When do they have a test?", "on Monday", "on Friday", "on Thursday"]]}, "l": {"setting": "You will hear two students, Mia and Daniyar, meeting on the first day of an English course.", "k": "AABCB", "script": [["Mia", "Hi, I'm Mia. What's your name?"], ["Daniyar", "Hello, I'm Daniyar. Nice to meet you."], ["Mia", "Nice to meet you too. Where are you from, Daniyar?"], ["Daniyar", "I'm from Kazakhstan, from Shymkent. And you?"], ["Mia", "I'm from Poland. I'm in Kazakhstan for my job."], ["Daniyar", "Oh, really? What's your job?"], ["Mia", "I'm an engineer. How old are you?"], ["Daniyar", "I'm twenty-two. Is this your first English class?"], ["Mia", "No, it's my second. Our teacher is in room fifteen."], ["Daniyar", "Room fifteen? I think it's room fifty."], ["Mia", "No, look – one, five. Fifteen."]], "q": [["Where is Daniyar from?", "Shymkent", "Almaty", "Astana"], ["Where is Mia from?", "Poland", "Portugal", "Kazakhstan"], ["What is Mia's job?", "doctor", "engineer", "teacher"], ["How old is Daniyar?", "32", "12", "22"], ["Which room is the class in?", "5", "15", "50"]]}, "s": {"focus": "be, possessive adjectives, numbers, countries and nationalities.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What's your first name? How do you spell it?", "Where are you from?", "How old are you?", "What's your phone number?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Who is your favourite singer? Where is he / she from?", "What day is it today? What's your favourite day? Why?"]}]}});
TESTS.push({"id": "f1", "kind": "file", "title": "File Test 1", "focus": "File 1: verb be (+, –, ?), subject pronouns, possessive adjectives, numbers 0–100, days of the week, countries and nationalities, classroom language.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CAABCCABBCBABBABCAAC", "q": [["I _____ a student.", "'re", "'s", "'m"], ["My brother _____ twenty-five.", "is", "are", "am"], ["We _____ from Russia. We're from Kazakhstan.", "aren't", "isn't", "not"], ["_____ they in the classroom?", "Am", "Are", "Is"], ["A: Is Anna your sister?\nB: No, she _____.", "aren't", "not", "isn't"], ["A: Are you Italian?\nB: Yes, we _____.", "is", "'re", "are"], ["_____ is your teacher? Mr Brown?", "Who", "Where", "What"], ["_____ old are you?", "Who", "How", "What"], ["Where _____ you from?", "is", "are", "do"], ["This is Asel. _____ is my friend.", "He", "Her", "She"], ["Ben and Tom are students. _____ are in my class.", "Them", "They", "We"], ["I'm Ali and this is _____ wife, Sara.", "my", "me", "I"], ["Is this your book? No, it's _____ book. He's my brother.", "her", "his", "he"], ["We're students. _____ school is in the city centre.", "Us", "Our", "We"], ["Look at those children. _____ dog is very big!", "Their", "They", "There"], ["What's _____ name? Sorry, I don't know her.", "she", "her", "his"], ["You're in room 6. _____ teacher is Ms Kim.", "You're", "You", "Your"], ["It's a nice hotel. _____ restaurant is very good.", "Its", "It", "It's"], ["A: Where's Max?\nB: He _____ here. He's at home.", "isn't", "aren't", "not"], ["I _____ late. Sorry!", "are", "is", "'m"]]}, "v": {"parts": [[0, "Numbers and days: choose the correct answer."], [6, "Countries and nationalities: choose the correct word."], [14, "Classroom language: choose the correct word."]], "k": "ACBCBACBABCBABCACABA", "q": [["fifteen + five = _____", "twenty", "twelve", "fifty"], ["eleven × two = _____", "twenty-one", "twelve", "twenty-two"], ["ninety – thirty = _____", "forty", "sixty", "seventy"], ["seventeen – four = _____", "fourteen", "thirty", "thirteen"], ["The day after Sunday is _____.", "Saturday", "Monday", "Tuesday"], ["The day after Wednesday is _____.", "Thursday", "Tuesday", "Friday"], ["I'm from Germany. I'm _____.", "Germany", "Germanish", "German"], ["They're from Brazil. They're _____.", "Brazilish", "Brazilian", "Brazil"], ["He's from the USA. He's _____.", "American", "USA", "Americish"], ["She's from Mexico. She's _____.", "Mexico", "Mexican", "Mexicish"], ["We're from France. We're _____.", "Franch", "Francian", "French"], ["Ivan is _____. He's from Russia.", "Russish", "Russian", "Russia"], ["Is she from _____? She speaks Italian.", "Italy", "Italian", "Itally"], ["Paris is in _____.", "French", "France", "Frenchy"], ["Please _____ to the conversation.", "look", "read", "listen"], ["_____ the board.", "Look at", "Open", "Listen"], ["Can you _____ it on the board, please?", "say", "listen", "write"], ["Work with a _____.", "partner", "pair", "friend group"], ["How do you _____ 'Hello' in Kazakh?", "speak", "say", "tell"], ["_____ down, please.", "Sit", "Open", "Stand"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "CABBABACAC", "q": [["m*e*", "thr*ee*", "m*y*"], ["o*f*", "*f*ive", "*f*our"], ["*Ch*inese", "*Ch*ristmas", "*ch*air"], ["b*oo*k", "fr*o*m", "g*oo*d"], ["s*i*xteen", "n*i*ne", "f*i*ve"], ["_A_merican", "A_mer_ican", "Ameri_can_"], ["Bra_zil_ian", "Brazil_ian_", "_Bra_zilian"], ["Ita_lian_", "_I_talian", "I_ta_lian"], ["_Mex_ican", "Mexi_can_", "Mex_i_can"], ["Af_ri_ca", "Afri_ca_", "_Af_rica"]]}, "r": {"title": "Welcome to Hotel Alatau", "k": "BABCA", "text": ["Hotel Alatau is a small hotel in the centre of Almaty. It's near the mountains and the park. There are thirty rooms. All the rooms are big and clean, and they're not expensive.", "The hotel restaurant is open every day from seven in the morning to ten at night. The breakfast is excellent. The receptionists are very friendly. Their names are Madina and Pierre. Madina is from Almaty and Pierre is from France. They speak English, Russian, Kazakh and French.", "Our guests are from many different countries – Germany, China, Turkey and the USA. Many of them are here for the mountains. 'It's a beautiful city,' says Mark, a guest from Canada. 'And the hotel is great. The staff are always happy to help.'"], "q": [["Where is Hotel Alatau?", "near the airport", "in the centre of Almaty", "in the mountains"], ["How many rooms are there?", "30", "13", "3"], ["When is the restaurant open?", "only in the evening", "every day", "from Monday to Friday"], ["Where is Pierre from?", "Almaty", "Canada", "France"], ["Where is Mark from?", "Canada", "Germany", "the USA"]]}, "l": {"setting": "You will hear Ruslan checking in at a hotel reception.", "k": "AABCB", "script": [["Receptionist", "Good evening. Welcome to the Hotel Central."], ["Ruslan", "Hello. I have a reservation. My name's Ruslan Akhmetov."], ["Receptionist", "Can you spell your surname, please?"], ["Ruslan", "Yes. A-K-H-M-E-T-O-V."], ["Receptionist", "Thank you. Yes, here it is. Three nights?"], ["Ruslan", "No, two nights, please. Tonight and tomorrow."], ["Receptionist", "OK, two nights. And what's your phone number?"], ["Ruslan", "It's seven, seven, zero, five, three, one, eight, two, nine."], ["Receptionist", "Thank you. You're in room forty-three. Here's your key."], ["Ruslan", "Thanks. What time is breakfast?"], ["Receptionist", "From seven to ten. The restaurant is on the first floor."], ["Ruslan", "Great. Thank you very much."]], "q": [["How many nights is Ruslan at the hotel?", "two", "three", "one"], ["What's the first letter of his surname?", "A", "H", "R"], ["What's his room number?", "13", "43", "34"], ["When is breakfast?", "7 to 9", "8 to 10", "7 to 10"], ["Where is the restaurant?", "next to reception", "on the first floor", "on the second floor"]]}, "s": {"focus": "be (I'm, you're, is he…?), possessive adjectives, numbers, countries and nationalities.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What's your name? How do you spell your surname?", "Where are you from? Where's your family from?", "How old are you? How old is your best friend?", "What's your favourite day of the week?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Introduce a friend or a family member.", "prompts": ["his / her name and age", "where he / she is from", "his / her job or school", "his / her phone number or email (you can invent it)"]}, {"name": "Role play", "mins": 2, "lead": "Teacher and student act out the situation on the card.", "card": "You are at a hotel reception. The teacher is the receptionist.", "prompts": ["say your name and spell it", "say how many nights", "give your phone number", "ask what time breakfast is"]}]}});
TESTS.push({"id": "q2", "kind": "quick", "title": "Quick Test 2", "focus": "File 2: a / an, plurals, this / that / these / those, adjectives, very / quite, imperatives, let's, feelings.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BAABCBACAC", "q": [["It's _____ umbrella.", "the", "an", "a"], ["I've got three _____.", "watches", "watch", "watchs"], ["Can I see _____ shoes over there?", "those", "this", "that"], ["_____ is my phone, here in my hand.", "That", "This", "These"], ["It's _____.", "a car big", "big a car", "a big car"], ["My bags are _____.", "a heavy", "heavy", "heavys"], ["_____ late! The class starts at nine.", "Don't be", "Not be", "No be"], ["_____ go to the cinema tonight.", "Lets", "Let", "Let's"], ["Please _____ that window. It's cold.", "close", "to close", "closes"], ["This book is _____ good. I love it!", "a very", "quite not", "very"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CABABACACB", "q": [["You use a _____ to open the door.", "pen", "wallet", "key"], ["You look at the time on your _____.", "watch", "umbrella", "glasses"], ["The sky is _____.", "brown", "blue", "pink"], ["The opposite of 'cheap' is _____.", "expensive", "big", "long"], ["The opposite of 'easy' is _____.", "dirty", "difficult", "slow"], ["I want to sleep. I'm _____.", "tired", "bored", "angry"], ["It's my birthday! I'm very _____.", "sad", "worried", "happy"], ["I'm _____. My exam is tomorrow.", "worried", "relaxed", "hungry"], ["This film is _____. Let's go home.", "boredom", "bored", "boring"], ["I'm _____. Can I have some water?", "hungry", "thirsty", "cold"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "BACBA", "q": [["b*a*g", "c*a*r", "c*a*t"], ["w*a*tch", "b*a*g", "bl*a*ck"], ["*th*ese", "*th*ose", "*th*ree"], ["_um_brella", "um_brel_la", "umbrel_la_"], ["ex_pen_sive", "expen_sive_", "_ex_pensive"]]}, "r": {"title": "What's in your bag?", "k": "CAABB", "text": ["We asked three people at Kostanay bus station: what's in your bag?", "Gulnara, a teacher, says: 'I've got two pens, a notebook, my glasses and some keys. And an apple – I'm always hungry!'", "Tom, a student from England, says: 'My bag is very big and quite heavy. There's a laptop, a phone, three books and an umbrella. It's November!'", "Saule, a doctor, says: 'Not much. My wallet, my phone and a bottle of water. I don't like big bags.'"], "q": [["Who has got an apple?", "Saule", "Tom", "Gulnara"], ["What does Gulnara wear to see?", "glasses", "an umbrella", "a watch"], ["Tom's bag is _____.", "big and heavy", "new and cheap", "small and light"], ["Why has Tom got an umbrella?", "because it's sunny", "because it's November", "because it's his friend's"], ["What does Saule NOT like?", "phones", "big bags", "water"]]}, "l": {"setting": "You will hear Lena and her friend Arman in a shop.", "k": "BBCAA", "script": [["Lena", "Look at these T-shirts, Arman. They're nice."], ["Arman", "Which ones? The blue ones?"], ["Lena", "No, those red ones over there. How much are they?"], ["Arman", "Twelve pounds each. That's quite expensive."], ["Lena", "Hmm. And this bag? It's very nice."], ["Arman", "Yes, but it's very small. Your phone isn't in it!"], ["Lena", "You're right. OK, let's look at the shoes."], ["Arman", "Wait – I'm tired. Let's have a coffee first."], ["Lena", "Good idea. There's a café next to the shop."]], "q": [["Which T-shirts does Lena like?", "the black ones", "the red ones", "the blue ones"], ["How much is one T-shirt?", "£20", "£12", "£2"], ["What's the problem with the bag?", "It's old.", "It's too expensive.", "It's too small."], ["How does Arman feel?", "tired", "bored", "hungry"], ["What do they decide to do?", "have a coffee", "go home", "buy some shoes"]]}, "s": {"focus": "a / an, plurals, this / these, adjectives, imperatives, feelings.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What's in your bag today?", "What colour is your phone?", "How do you feel today? Why?", "What do you do when you're bored?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Describe something you have in the room (its colour, size, is it old or new?)", "Give a new student three instructions for the classroom (Don't…, Please…)."]}]}});
TESTS.push({"id": "f2", "kind": "file", "title": "File Test 2", "focus": "File 2: a / an, plurals, this / that / these / those, adjectives and their position, very / quite, imperatives, let's, small things, colours, common adjectives, feelings.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACCABACCBABAABBCABCB", "q": [["I've got _____ orange in my bag.", "an", "a", "the"], ["Is that _____ new phone?", "an", "the", "a"], ["There are two _____ on the table.", "boxs", "box", "boxes"], ["I need three _____.", "knives", "knifes", "knive"], ["How many _____ have you got?", "childs", "children", "childrens"], ["Look at _____ birds in the sky!", "those", "this", "that"], ["_____ is my coat, here.", "Those", "These", "This"], ["_____ keys on the table are mine.", "That", "This", "Those"], ["It's _____.", "a old house", "an old house", "an house old"], ["They're _____.", "nice people", "people nice", "nices people"], ["My car is _____.", "old quite", "quite old", "quite an old"], ["She's got _____ eyes.", "big blue", "bigs blue", "blue big"], ["This exercise is _____ easy.", "very", "very much", "a very"], ["Please _____ your phones now.", "to turn off", "turn off", "turns off"], ["_____ in the classroom. Eat in the café.", "No eat", "Don't eat", "Not eat"], ["_____ quiet, please. The baby is sleeping.", "Are", "Is", "Be"], ["It's hot. _____ open the window.", "Let's", "Let", "Lets to"], ["_____ have a pizza tonight.", "Lets'", "Let's", "Let us to"], ["_____ worry. The test is easy.", "No", "Not", "Don't"], ["These _____ are very cheap.", "sandwich", "sandwiches", "sandwichs"]]}, "v": {"parts": [[0, "Small things: choose the correct word."], [4, "Colours and adjectives: choose the correct word."], [12, "Feelings: choose the correct word."]], "k": "ABCBBABCACBAABCABACC", "q": [["I read with my _____.", "glasses", "keys", "coins"], ["Put the money in your _____.", "umbrella", "wallet", "watch"], ["It's raining. Take an _____.", "identity", "ID card", "umbrella"], ["I write my homework in a _____.", "photo", "notebook", "tissue"], ["Grass is _____.", "orange", "green", "grey"], ["Snow is _____.", "white", "yellow", "black"], ["The opposite of 'long' is _____.", "small", "short", "tall"], ["The opposite of 'fast' is _____.", "late", "easy", "slow"], ["The opposite of 'clean' is _____.", "dirty", "ugly", "empty"], ["The opposite of 'empty' is _____.", "high", "open", "full"], ["The opposite of 'strong' is _____.", "thin", "weak", "short"], ["It's a _____ day. The sun is shining.", "beautiful", "wet", "ugly"], ["I've got an exam tomorrow. I'm _____.", "stressed", "happy", "relaxed"], ["My friend is late again. I'm _____!", "sorry", "angry", "hungry"], ["There's nothing to do. I'm _____.", "busy", "worried", "bored"], ["I'm on holiday. No work, no stress. I'm _____.", "relaxed", "stressed", "angry"], ["My cat is ill. I'm _____.", "lucky", "sad", "thirsty"], ["I can't find my keys! I'm _____.", "worried", "bored", "sleepy"], ["I want a sandwich now. I'm _____.", "cold", "thirsty", "hungry"], ["I'm very _____ – I've got a lot of work.", "bored", "free", "busy"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "AABABCCABC", "q": [["w*a*nt", "h*a*ppy", "b*a*d"], ["*s*ure", "*s*ad", "*s*ix"], ["*ea*sy", "h*ea*vy", "th*e*se"], ["c*o*ld", "b*o*x", "w*a*tch"], ["c*o*ld", "c*o*st", "*o*ld"], ["_ex_pensive", "expen_sive_", "ex_pen_sive"], ["dif_fi_cult", "diffi_cult_", "_dif_ficult"], ["_beau_tiful", "beauti_ful_", "beau_ti_ful"], ["_um_brella", "um_brel_la", "umbrel_la_"], ["hor_ri_ble", "horri_ble_", "_hor_rible"]]}, "r": {"title": "The lost property office", "k": "BABCA", "text": ["Every day people leave things on buses and trains in Almaty. Where do these things go? They go to the city's lost property office, a small room in the main bus station.", "'We get about fifty things every day,' says Bakhyt, who works there. 'The most common things are umbrellas, phones and keys. We also get bags, glasses and a lot of children's toys.'", "Some things are very strange. 'Last month we got a big white rabbit in a box,' Bakhyt laughs. 'And once a man left his wedding photos. He was very happy to get them back!'", "If you lose something, go to the office with your ID card. It's open from Monday to Saturday, from nine to six. Don't be sad – maybe your things are there!"], "q": [["Where is the lost property office?", "at the airport", "at the main bus station", "on a train"], ["How many things do they get every day?", "about 50", "about 500", "about 15"], ["Which is NOT one of the most common things?", "umbrellas", "toys", "keys"], ["What was strange last month?", "a phone", "wedding photos", "a rabbit"], ["What do you need to take to the office?", "your ID card", "a photo", "your bag"]]}, "l": {"setting": "You will hear Aruzhan and her mother looking for things before Aruzhan goes to school.", "k": "BACAB", "script": [["Mother", "Aruzhan, are you ready? It's eight o'clock!"], ["Aruzhan", "Nearly. Where are my keys, Mum?"], ["Mother", "Are these your keys? On the table?"], ["Aruzhan", "No, those are Dad's keys. Mine have got a small yellow bear on them."], ["Mother", "Look in your bag."], ["Aruzhan", "Oh yes, here they are. And where's my phone?"], ["Mother", "Is that your phone, next to the TV?"], ["Aruzhan", "Yes! Thanks, Mum. I'm so stressed today. I've got a maths exam."], ["Mother", "Don't worry. You're very good at maths. Take an umbrella, it's raining."], ["Aruzhan", "OK. Bye, Mum!"], ["Mother", "Bye! Good luck!"]], "q": [["What time is it?", "seven o'clock", "eight o'clock", "nine o'clock"], ["Whose keys are on the table?", "her father's", "her mother's", "Aruzhan's"], ["What colour is the bear on Aruzhan's keys?", "brown", "white", "yellow"], ["Where is Aruzhan's phone?", "next to the TV", "in her bag", "on the table"], ["Why is Aruzhan stressed?", "It's raining.", "She has an exam.", "She is late."]]}, "s": {"focus": "a / an and plurals, this / these, adjectives, imperatives and let's, feelings.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What's in your bag or pocket now?", "What's your favourite colour? Why?", "How do you feel today?", "What do you do when you're stressed?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Describe your favourite thing (a bag, a phone, a watch…).", "prompts": ["what it is and what colour it is", "is it big, small, old, new?", "where it's from", "why you like it"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Give advice to a friend who is stressed before an exam (use Don't… and Let's…)", "What makes you happy? What makes you angry?", "What are good rules for an English class?"]}]}});
TESTS.push({"id": "q3", "kind": "quick", "title": "Quick Test 3", "focus": "File 3: present simple (+, –, ?), word order in questions, question words, verb phrases, jobs.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACABCBACBA", "q": [["My brother _____ in a bank.", "works", "work", "working"], ["I _____ watch TV in the morning.", "not", "doesn't", "don't"], ["She _____ like coffee.", "doesn't", "don't", "isn't"], ["_____ you live near here?", "Are", "Do", "Does"], ["Where _____ your sister work?", "is", "do", "does"], ["A: Does he speak French?\nB: No, he _____.", "don't", "doesn't", "isn't"], ["My mum _____ dinner every evening.", "cooks", "cook", "cookes"], ["_____ do you go to the gym? On Mondays.", "Who", "Where", "When"], ["What time _____?", "the film starts", "does the film start", "starts the film"], ["He _____ TV every night.", "watches", "watch", "watchs"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "BABACBCCAA", "q": [["I _____ a lot of water every day.", "eat", "drink", "have got"], ["Do you _____ the piano?", "play", "make", "do"], ["She _____ to music on the bus.", "hears", "listens", "watches"], ["He works in a restaurant. He's a _____.", "waiter", "lawyer", "builder"], ["She flies planes. She's a _____.", "nurse", "receptionist", "pilot"], ["He makes houses. He's a _____.", "dentist", "builder", "singer"], ["She works in a shop. She's a _____.", "police officer", "factory worker", "shop assistant"], ["I _____ in a factory.", "study", "job", "work"], ["_____ do you live? In a flat in the centre.", "Where", "What", "Which"], ["_____ languages do you speak?", "How many", "How much", "How old"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "AABBC", "q": [["d*o*ctor", "n*ur*se", "w*or*k"], ["*ch*air", "*sh*op", "*ch*ef"], ["l*i*ve", "dr*i*ve", "dr*i*nk"], ["mana_ger_", "_ma_nager", "ma_na_ger"], ["_po_liceman", "police_man_", "po_lice_man"]]}, "r": {"title": "Three people, three jobs", "k": "ABCBA", "text": ["Erlan is a taxi driver in Astana. He works at night and he sleeps in the day. 'I meet a lot of interesting people,' he says. 'But I don't see my children very much.'", "Lucy is a nurse in a big hospital in London. She works from Monday to Friday. She doesn't earn a lot of money, but she loves her job because she helps people.", "Marat is a chef. He works in a hotel restaurant. He starts work at two o'clock and finishes at eleven. 'I don't cook at home,' he says. 'My wife cooks!'"], "q": [["When does Erlan sleep?", "in the day", "in the evening", "at night"], ["Why is Erlan's job difficult?", "He drives too far.", "He doesn't see his children much.", "He doesn't earn much money."], ["Why does Lucy love her job?", "She earns a lot of money.", "She works at weekends.", "She helps people."], ["Where does Marat work?", "at home", "in a hotel restaurant", "in a hospital"], ["Who cooks at Marat's home?", "his wife", "Marat", "his children"]]}, "l": {"setting": "You will hear a radio interview with Sofia, who works at a zoo.", "k": "BCABA", "script": [["Presenter", "Today we're talking to Sofia. Sofia, where do you work?"], ["Sofia", "I work at the city zoo. I look after the animals."], ["Presenter", "What time do you start work?"], ["Sofia", "Very early – at half past six. The animals want their breakfast!"], ["Presenter", "Which animals do you work with?"], ["Sofia", "Mostly the monkeys. There are twelve monkeys and they're very funny."], ["Presenter", "Do you work at the weekend?"], ["Sofia", "Yes, I work on Saturdays. I don't work on Mondays."], ["Presenter", "Do you like your job?"], ["Sofia", "I love it. But I don't earn a lot of money."]], "q": [["Where does Sofia work?", "at a pet shop", "at a zoo", "at a farm"], ["What time does she start work?", "6.00", "7.30", "6.30"], ["How many monkeys are there?", "12", "2", "20"], ["Which day doesn't she work?", "Saturday", "Monday", "Sunday"], ["What is the problem with her job?", "the money", "the hours", "the animals"]]}, "s": {"focus": "present simple questions and answers, jobs and verb phrases.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What do you do?", "Where do you live?", "What time do you get up?", "Do you like your job / your school? Why?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Ask the teacher three questions about his / her job", "What job do you want in the future? Why?"]}]}});
TESTS.push({"id": "f3", "kind": "file", "title": "File Test 3", "focus": "File 3: present simple (+, –, ?), word order in questions, question words, verb phrases, jobs.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CBBAABABCBCCAACCABBA", "q": [["My father _____ a newspaper every morning.", "read", "reading", "reads"], ["They _____ in a small village.", "living", "live", "lives"], ["She _____ two languages.", "speakes", "speaks", "speak"], ["My sister _____ to the gym every day.", "goes", "gos", "go"], ["He _____ his homework after dinner.", "does", "do", "dos"], ["I _____ meat. I'm a vegetarian.", "doesn't eat", "don't eat", "not eat"], ["Ali _____ TV. He thinks it's boring.", "doesn't watch", "don't watch", "not watches"], ["We _____ work on Sundays.", "doesn't", "don't", "aren't"], ["_____ your parents speak English?", "Does", "Are", "Do"], ["_____ Dana have a car?", "Do", "Does", "Is"], ["A: Do you like pizza?\nB: Yes, I _____.", "like", "does", "do"], ["A: Does your brother work here?\nB: No, he _____.", "isn't", "don't", "doesn't"], ["Where _____?", "do you work", "work you", "you work"], ["What time _____ home?", "does she get", "she gets", "gets she"], ["_____ do you go to work? By bus.", "Where", "What", "How"], ["_____ is your birthday? In June.", "What", "Who", "When"], ["_____ is your favourite actor?", "Who", "Why", "Which"], ["_____ do you study English? Because I need it for work.", "How", "Why", "What"], ["_____ brothers and sisters have you got?", "How often", "How many", "How much"], ["_____ music do you like? Rock and pop.", "What", "How", "Who"]]}, "v": {"parts": [[0, "Verb phrases: choose the correct word."], [10, "Jobs: choose the correct word."]], "k": "BAACABBCCABCBBCABCAA", "q": [["I _____ in a big flat.", "stay", "live", "have"], ["She _____ a lot of money.", "earns", "wins", "gets up"], ["Do you _____ a car?", "have", "make", "do"], ["I _____ to the radio in the car.", "hear", "watch", "listen"], ["We _____ dinner at seven o'clock.", "have", "take", "do"], ["They _____ in a band.", "make", "play", "do"], ["He _____ a lot of tea.", "eats", "drinks", "cooks"], ["I want to _____ French.", "read", "play", "study"], ["Can you _____ Chinese food?", "do", "make up", "cook"], ["I _____ my friends at the weekend.", "see", "look", "watch"], ["She looks after people in hospital. She's a _____.", "farmer", "nurse", "lawyer"], ["He drives a taxi. He's a _____.", "pilot", "receptionist", "taxi driver"], ["She works in a court. She's a _____.", "waitress", "lawyer", "dentist"], ["He works on a farm. He's a _____.", "cleaner", "farmer", "builder"], ["She checks people's teeth. She's a _____.", "doctor", "teacher", "dentist"], ["He serves food in a restaurant. He's a _____.", "waiter", "manager", "chef"], ["She works at the front desk of a hotel. She's a _____.", "cleaner", "receptionist", "pilot"], ["He sings in concerts. He's a _____.", "actor", "musician", "singer"], ["She cleans offices. She's a _____.", "cleaner", "builder", "nurse"], ["He works for the police. He's a _____.", "police officer", "lawyer", "soldier"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "BACABACBCA", "q": [["w*or*k", "d*oe*s", "f*ir*st"], ["d*oe*s", "kn*ow*s", "g*oe*s"], ["wor*ks*", "ea*ts*", "pla*ys*"], ["wa*tch*es", "*sh*op", "*sh*e"], ["*a*ctor", "f*a*rmer", "m*a*nager"], ["_fac_tory", "facto_ry_", "fac_to_ry"], ["_ac_countant", "accoun_tant_", "ac_coun_tant"], ["archi_tect_", "_ar_chitect", "ar_chi_tect"], ["en_gi_neer", "_en_gineer", "engi_neer_"], ["mu_si_cian", "_mu_sician", "musi_cian_"]]}, "r": {"title": "A day in the life of a pilot", "k": "BCBAA", "text": ["Akmaral Seitova is a pilot for an airline in Kazakhstan. She is thirty-four and she lives in Almaty with her husband and their two daughters.", "Akmaral doesn't work every day. She usually works four days a week, and then she has three days at home. On a work day she gets up at four o'clock in the morning. She drives to the airport and she has a meeting with the other pilots and the flight attendants. Her first flight usually leaves at six o'clock.", "She flies to cities in Kazakhstan, like Astana and Aktobe, and sometimes to other countries, like Turkey and the UAE. 'I love my job,' she says. 'I see the sunrise every morning from the sky. It's beautiful.'", "What's difficult about the job? 'I don't see my daughters on work days,' she says. 'But on my free days I take them to school and we cook dinner together.'"], "q": [["Where does Akmaral live?", "in Astana", "in Almaty", "in Turkey"], ["How many days a week does she usually work?", "three", "seven", "four"], ["What time does she get up on a work day?", "at 6 a.m.", "at 4 a.m.", "at 3 a.m."], ["What does she love about her job?", "seeing the sunrise", "the meetings", "visiting Turkey"], ["What does she do on her free days?", "takes her daughters to school", "sleeps all day", "flies to Aktobe"]]}, "l": {"setting": "You will hear Kate asking Nurlan about his job.", "k": "BABAC", "script": [["Kate", "So, Nurlan, what do you do?"], ["Nurlan", "I'm a vet. I look after animals – mostly cats and dogs."], ["Kate", "Really? Where do you work?"], ["Nurlan", "In a small animal hospital in Kostanay."], ["Kate", "Do you work at the weekend?"], ["Nurlan", "Yes, on Saturday mornings. I don't work on Sunday."], ["Kate", "What time do you finish work?"], ["Nurlan", "Usually at six, but sometimes at eight or nine."], ["Kate", "Do you like it?"], ["Nurlan", "Yes, I love animals. But the job is very tiring."], ["Kate", "Do you have a pet?"], ["Nurlan", "Yes, I have a big dog. Her name's Bella."]], "q": [["What is Nurlan's job?", "doctor", "vet", "nurse"], ["Where does he work?", "in an animal hospital", "on a farm", "in a zoo"], ["When does he work at the weekend?", "on Saturday afternoon", "on Saturday morning", "on Sunday"], ["What time does he usually finish?", "at 6", "at 9", "at 8"], ["What is Bella?", "his daughter", "a cat", "a dog"]]}, "s": {"focus": "present simple (I work, she doesn't…, Do you…?), question words, jobs.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What do you do? Where do you work or study?", "What time do you start and finish?", "What do you do in the evening?", "What does your best friend do?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Talk about a person you know and his / her job.", "prompts": ["who he / she is", "what he / she does", "where he / she works", "does he / she like the job? Why?"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["What jobs are interesting? Which are boring? Why?", "Is it better to work in an office or outside?", "Ask the teacher three questions about his / her day."]}]}});
TESTS.push({"id": "q4", "kind": "quick", "title": "Quick Test 4", "focus": "File 4: possessive 's, whose, prepositions of time (at, in, on), position of adverbs of frequency, family, daily routine, the time.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "BABBAACCAC", "q": [["This is _____ car.", "my father", "my father's", "my fathers"], ["_____ bag is this? It's Tim's.", "Whose", "Who", "Who's"], ["My _____ names are Tom and Ann.", "parent's", "parents'", "parents"], ["The concert is _____ Saturday.", "in", "on", "at"], ["I get up _____ seven o'clock.", "at", "in", "on"], ["We go skiing _____ the winter.", "in", "on", "at"], ["She _____ late for class.", "never", "never is", "is never"], ["I _____ breakfast.", "usually has", "have usually", "usually have"], ["He _____ at the weekend.", "doesn't often work", "doesn't work often", "often doesn't work"], ["_____ the morning I go to the gym.", "On", "At", "In"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "ABCAABACCB", "q": [["My brother's son is my _____.", "nephew", "niece", "cousin"], ["My aunt's children are my _____.", "nephews", "cousins", "uncles"], ["My sister's husband is my _____.", "stepbrother", "grandfather", "brother-in-law"], ["I _____ a shower in the morning.", "have", "do", "make"], ["I _____ to bed at eleven.", "go", "get", "have"], ["I _____ dressed after breakfast.", "do", "get", "go"], ["It's 7.30. It's half _____ seven.", "past", "to", "at"], ["It's 8.45. It's quarter _____ nine.", "after", "past", "to"], ["I go to the gym _____ a week.", "two", "second", "twice"], ["I _____ go to the cinema. Maybe once a year.", "always", "hardly ever", "usually"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "CBABA", "q": [["s*o*n", "br*o*ther", "s*o*ck"], ["*w*eek", "*wh*o", "*w*ife"], ["qu*ar*ter", "h*al*f", "f*a*ther"], ["grand_fa_ther", "_grand_father", "grandfa_ther_"], ["_u_sually", "u_su_ally", "usu_al_ly"]]}, "r": {"title": "Saturday morning at our house", "k": "AACBB", "text": ["My name's Aisulu and I live with my family in Kostanay. On Saturday mornings our house is always busy.", "My dad gets up first, at about half past six. He makes tea and goes for a walk with our dog. My mum usually sleeps until eight. Then she has a shower and makes breakfast for everybody.", "My little brother, Timur, is eight. He gets up at seven and watches cartoons on TV. I'm sixteen and I hardly ever get up before ten at the weekend!", "At eleven o'clock my grandparents come for lunch. My grandmother always brings a cake."], "q": [["Who gets up first on Saturday?", "her dad", "her mum", "Timur"], ["What does Aisulu's mum do first?", "has a shower", "walks the dog", "makes tea"], ["How old is Timur?", "7", "16", "8"], ["When does Aisulu usually get up at the weekend?", "at 7", "after 10", "at 8"], ["What does her grandmother always bring?", "lunch", "a cake", "tea"]]}, "l": {"setting": "You will hear Alan showing a photo of his family to his friend Zhanna.", "k": "BAACB", "script": [["Zhanna", "Is that your family, Alan?"], ["Alan", "Yes. This is my sister, Kate, and that's her husband, Mike."], ["Zhanna", "And who's the little boy?"], ["Alan", "That's their son, Leo. He's my nephew. He's five."], ["Zhanna", "He's lovely! And whose dog is that?"], ["Alan", "It's my parents' dog. His name's Max."], ["Zhanna", "Do you see your family often?"], ["Alan", "Not very often. My sister lives in Scotland. We usually meet in the summer, in July."]], "q": [["Who is Mike?", "Alan's father", "Kate's husband", "Alan's brother"], ["How old is Leo?", "5", "15", "50"], ["What relation is Leo to Alan?", "nephew", "cousin", "son"], ["Whose dog is Max?", "Kate's", "Alan's", "Alan's parents'"], ["When do they usually meet?", "in June", "in July", "at Christmas"]]}, "s": {"focus": "possessive 's, adverbs of frequency, prepositions of time, family and routine.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What time do you usually get up during the week?", "What do you always do on Sunday?", "Who is your favourite relative? Why?", "When is your birthday?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Describe a typical morning in your family", "What do you never do at the weekend? Why?"]}]}});
TESTS.push({"id": "f4", "kind": "file", "title": "File Test 4", "focus": "File 4: possessive 's, whose, prepositions of time (at, in, on), position of adverbs and expressions of frequency, family, everyday activities, the time.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CBBCBCACABAABBACCAAB", "q": [["This is _____ room.", "my sisters", "my sister", "my sister's"], ["Where are the _____ toys?", "childrens", "children's", "childrens'"], ["_____ phone is this? It's mine.", "Who's", "Whose", "Who"], ["_____ that man? He's my uncle.", "Who", "Whose", "Who's"], ["That's _____ car.", "James", "James's", "James' car's"], ["My _____ house is very old.", "grandparent's", "grandparents", "grandparents'"], ["I always have coffee _____ the morning.", "in", "on", "at"], ["We have English _____ Tuesday and Thursday.", "in", "at", "on"], ["The film starts _____ 8.30.", "at", "on", "in"], ["My birthday is _____ April.", "at", "in", "on"], ["She doesn't work _____ the weekend.", "at", "in", "on"], ["I was born _____ 2005.", "in", "on", "at"], ["He goes out with his friends _____ Friday nights.", "at", "on", "in"], ["I _____ in the evening.", "read usually", "usually read", "usually reads"], ["He _____ for school.", "is always late", "is late always", "always is late"], ["We _____ eat fast food.", "ever hardly", "hardly", "hardly ever"], ["She _____ tired after work.", "often", "often is", "is often"], ["I go to the gym _____.", "three times a week", "three a week times", "a week three times"], ["They _____ visit their grandparents.", "sometimes", "some times", "sometime"], ["How often _____ go swimming?", "you do", "do you", "are you"]]}, "v": {"parts": [[0, "Family: choose the correct word."], [7, "Everyday activities: choose the correct word."], [15, "The time and frequency: choose the correct answer."]], "k": "ACBCABCACACCBBABBABA", "q": [["My mother's brother is my _____.", "uncle", "cousin", "nephew"], ["My father's mother is my _____.", "mother-in-law", "aunt", "grandmother"], ["My uncle's daughter is my _____.", "niece", "cousin", "sister"], ["My sister's daughter is my _____.", "granddaughter", "nephew", "niece"], ["My father's new wife is my _____.", "stepmother", "mother-in-law", "aunt"], ["My son's son is my _____.", "nephew", "grandson", "cousin"], ["I haven't got any brothers or sisters. I'm an _____ child.", "one", "single", "only"], ["I _____ up at seven o'clock.", "wake", "go", "get on"], ["I _____ my teeth twice a day.", "wash", "clean up", "brush"], ["She _____ dressed in her bedroom.", "gets", "does", "goes"], ["We _____ lunch at one o'clock.", "make", "eat up", "have"], ["He _____ the bus to work.", "drives", "goes", "takes"], ["I _____ home at six.", "arrive to", "get", "go to"], ["They _____ the housework on Saturday.", "have", "do", "make"], ["I _____ the dog for a walk every evening.", "take", "bring", "do"], ["It's 3.15. It's quarter _____ three.", "to", "past", "at"], ["It's 6.40. It's twenty _____ seven.", "after", "to", "past"], ["It's 9.30. It's _____ past nine.", "half", "quarter", "thirty"], ["I go to the dentist _____ a year.", "one", "once", "first"], ["I _____ have breakfast. I'm never hungry in the morning.", "never", "usually", "always"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "CBBACACABA", "q": [["c*ou*sin", "m*o*ther", "m*o*rning"], ["*u*ncle", "*u*sually", "s*o*n"], ["n*ie*ce", "n*e*phew", "w*ee*k"], ["p*u*t", "br*u*sh", "l*u*nch"], ["*g*et", "*g*o", "dau*gh*ter"], ["after_noon_", "af_ter_noon", "_af_ternoon"], ["grandmo_ther_", "grand_mo_ther", "_grand_mother"], ["_hol_iday", "holi_day_", "hol_i_day"], ["e_ve_ning", "_ev_ening", "eve_ning_"], ["_fa_mily", "fa_mi_ly", "fami_ly_"]]}, "r": {"title": "Twins with different lives", "k": "ABCBA", "text": ["Dina and Diana Nurlanova are twins. They're thirty years old and they look the same, but their lives are very different.", "Dina lives in Astana. She's a journalist and she's very busy. She gets up at six every day and she usually has breakfast in a café near her office. She hardly ever cooks. In the evening she often goes to the gym or meets friends. She goes to bed late, at about midnight.", "Diana lives in a small village near Kostanay with her husband and three children. She's a teacher at the village school. She gets up at half past six and makes breakfast for the family. She always walks to school with her children. In the evening she helps them with their homework and she goes to bed at ten.", "The sisters speak on the phone every day. 'Dina is my best friend,' says Diana. 'We're very different, but we're very close.' They see each other twice a year, in the summer and at New Year."], "q": [["Where does Dina usually have breakfast?", "in a café", "at the gym", "at home"], ["What time does Dina go to bed?", "at 6 o'clock", "at about 12 o'clock", "at 10 o'clock"], ["How does Diana go to school?", "She takes a bus.", "She drives.", "She walks."], ["What does Diana do in the evening?", "meets friends", "helps her children with homework", "goes to the gym"], ["How often do the sisters see each other?", "twice a year", "once a year", "every day"]]}, "l": {"setting": "You will hear Mrs Brown talking to a TV programme about her family's busy mornings.", "k": "BCBAA", "script": [["Presenter", "Mrs Brown, you have four children. What are your mornings like?"], ["Mrs Brown", "Busy! I get up at quarter to six. I have a coffee and then I make breakfast."], ["Presenter", "When do the children get up?"], ["Mrs Brown", "At half past six. They have a shower one after the other – it takes a long time!"], ["Presenter", "Do they help in the morning?"], ["Mrs Brown", "Sometimes. My oldest son, Jack, always takes the dog for a walk. He's fourteen."], ["Presenter", "And your husband?"], ["Mrs Brown", "He leaves at seven. He drives to work. He never has breakfast at home."], ["Presenter", "How do the children go to school?"], ["Mrs Brown", "By bus. The bus comes at quarter past eight. They're often late for it!"]], "q": [["What time does Mrs Brown get up?", "6.15", "5.45", "6.30"], ["What does she do first?", "has a shower", "makes breakfast", "has a coffee"], ["Who always walks the dog?", "Mr Brown", "Jack", "Mrs Brown"], ["Where does Mr Brown have breakfast?", "not at home", "on the bus", "at home"], ["What time does the school bus come?", "8.15", "7.45", "8.30"]]}, "s": {"focus": "possessive 's, adverbs of frequency (always, usually, never…), prepositions of time, family and daily routine.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What time do you usually get up? What do you do first?", "How often do you see your grandparents?", "What do you never do on Sunday?", "What time is it now?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Describe your typical weekday.", "prompts": ["when you get up and what you have for breakfast", "how you go to work or school", "what you do in the afternoon", "what you usually do in the evening"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Is it better to have a big family or a small family? Why?", "Who does the housework in your family?", "What do you always do on your birthday?"]}]}});
TESTS.push({"id": "q5", "kind": "quick", "title": "Quick Test 5", "focus": "File 5: can / can't, present continuous, present simple or continuous, verb phrases, the weather and seasons, clothes.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CBCAABAABC", "q": [["I _____ swim. I never learned.", "not can", "don't can", "can't"], ["_____ you play the guitar?", "Do", "Can", "Are"], ["She can _____ very well.", "to dance", "dancing", "dance"], ["Look! It _____.", "'s snowing", "snows", "snow"], ["What _____ now?", "are you doing", "you are doing", "do you do"], ["They _____ TV at the moment.", "not watching", "aren't watching", "don't watching"], ["I usually _____ jeans, but today I'm wearing a dress.", "wear", "wears", "'m wearing"], ["Sh! The baby _____.", "'s sleeping", "sleep", "sleeps"], ["He _____ to work every day.", "'s driving", "drives", "drive"], ["_____ it raining?", "Do", "Does", "Is"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "ABACBACBAC", "q": [["It's very _____ today. Take your umbrella.", "wet", "dry", "sunny"], ["It's _____. I can't see the road.", "hot", "foggy", "warm"], ["In _____ the leaves fall from the trees.", "autumn", "summer", "spring"], ["It's _____. Wear a coat and a hat.", "warm", "hot", "cold"], ["I can't _____ the piano.", "do", "play", "make"], ["Can you _____ a bike?", "ride", "drive", "play"], ["Put on your _____. Your feet are cold.", "scarf", "gloves", "socks"], ["She's wearing a red _____ and a white blouse.", "shirt", "skirt", "tie"], ["Take off your _____. It's hot in here.", "jacket", "jeans", "trainers"], ["He wears a _____ and tie to work.", "dress", "skirt", "suit"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "AACBB", "q": [["c*a*n", "d*a*nce", "c*a*n't"], ["w*ear*", "sk*ir*t", "sh*ir*t"], ["sn*ow*", "c*o*ld", "s*o*cks"], ["_um_brella", "um_brel_la", "umbrel_la_"], ["tem_pe_rature", "_tem_perature", "tempe_ra_ture"]]}, "r": {"title": "A postcard from Scotland", "k": "BBAAC", "text": ["Hi Mum and Dad! I'm writing this in a café in Edinburgh. It's raining and it's quite cold – only 12 degrees. It's August, but I'm wearing a jumper and a coat!", "Today we're visiting the castle and tomorrow we're going to the mountains. Jake can drive, so we're renting a car. I can't drive, so I'm reading the map!", "People here are very friendly. Everyone speaks very fast and I can't understand them all the time. See you next week! Love, Assel"], "q": [["Where is Assel now?", "in a castle", "in a café", "in a car"], ["What's the weather like?", "snowy", "rainy and cold", "sunny and hot"], ["What month is it?", "August", "October", "April"], ["Who is driving the car?", "Jake", "Assel", "Assel's dad"], ["What is difficult for Assel?", "reading the map", "the food", "understanding people"]]}, "l": {"setting": "You will hear Ben calling his friend Sara on the phone.", "k": "BAACB", "script": [["Sara", "Hello?"], ["Ben", "Hi Sara, it's Ben. What are you doing?"], ["Sara", "I'm sitting in the park. It's lovely and sunny here."], ["Ben", "Lucky you! It's raining here. Can you come to my house tonight? We're watching a film."], ["Sara", "I'm sorry, I can't. I'm working tonight."], ["Ben", "Oh, OK. What about tomorrow? We're playing tennis."], ["Sara", "Tennis? I can't play tennis very well."], ["Ben", "That's OK. Neither can I!"], ["Sara", "OK then. See you tomorrow."]], "q": [["Where is Sara?", "at work", "in the park", "at home"], ["What's the weather like where Ben is?", "rainy", "sunny", "windy"], ["Why can't Sara go tonight?", "She's working.", "She's ill.", "She's in the park."], ["What are they doing tomorrow?", "working", "watching a film", "playing tennis"], ["How well can Ben play tennis?", "very well", "not very well", "He can't play at all."]]}, "s": {"focus": "can / can't, present continuous, clothes and weather.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What can you do well? What can't you do?", "What's the weather like today?", "What are you wearing today?", "What's your favourite season? Why?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Describe what people are doing in your street / school right now (imagine)", "What clothes do you wear in winter here?"]}]}});
TESTS.push({"id": "f5", "kind": "file", "title": "File Test 5", "focus": "File 5: can / can't, present continuous, present simple or present continuous, verb phrases, the weather and seasons, clothes.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "CCBCAACCABCBAABBABAB", "q": [["My grandmother _____ use a computer.", "doesn't can", "can't to", "can't"], ["_____ you speak Chinese?", "Are", "Do can", "Can"], ["I can _____ but I can't sing.", "dancing", "dance", "to dance"], ["A: Can your brother drive?\nB: No, he _____.", "doesn't", "isn't", "can't"], ["You _____ park here. It's a hospital.", "can't", "don't", "aren't"], ["Look! That man _____ a red hat.", "'s wearing", "wear", "wears"], ["They _____ football in the park right now.", "plays", "play", "'re playing"], ["I _____ my homework at the moment.", "does", "do", "'m doing"], ["_____ you listening to me?", "Are", "Is", "Do"], ["She _____ now. She's at work.", "not sleeping", "isn't sleeping", "doesn't sleep"], ["What _____? A letter to my aunt.", "you writing", "do you write", "are you writing"], ["We _____ in a hotel this week.", "stay", "'re staying", "stays"], ["It _____ a lot in winter in Kostanay.", "snows", "'s snowing", "snowing"], ["Look out of the window! It _____.", "'s snowing", "snow", "snows"], ["I _____ coffee, but today I'm drinking tea.", "'m usually drinking", "usually drink", "usually drinks"], ["What _____ do? He's a dentist.", "your father", "does your father", "is your father"], ["Why _____ that big coat? It's hot today!", "are you wearing", "do you wear", "you wear"], ["He _____ to school every day.", "walk", "walks", "'s walking"], ["Can I _____ the window?", "open", "to open", "opening"], ["Please be quiet. I _____ to music.", "listen", "'m listening", "listening"]]}, "v": {"parts": [[0, "Verb phrases: choose the correct word."], [6, "Weather and seasons: choose the correct word."], [13, "Clothes: choose the correct word."]], "k": "ACABCCBACBAACAABBCBB", "q": [["Can you _____ a horse?", "ride", "play", "drive"], ["I can't _____ a photo. My phone is broken.", "make", "do", "take"], ["She can _____ three languages.", "speak", "tell", "say"], ["Can you _____ me? I can't open this box.", "call", "help", "ask"], ["I can't _____ you. The music is very loud.", "listen", "sound", "hear"], ["We _____ chess on Sunday afternoons.", "do", "make", "play"], ["There's a lot of wind today. It's _____.", "foggy", "windy", "snowy"], ["The sun is shining. It's _____.", "sunny", "cloudy", "wet"], ["It's minus 25. It's very _____.", "warm", "cool", "cold"], ["It isn't hot and it isn't cold. It's _____.", "boiling", "warm", "freezing"], ["After winter comes _____.", "spring", "autumn", "summer"], ["The months June, July and August are _____ in Kazakhstan.", "summer", "winter", "spring"], ["It's _____. Let's stay at home.", "rainy day", "rain", "raining"], ["You wear _____ on your hands.", "gloves", "socks", "boots"], ["You wear a _____ on your head.", "hat", "belt", "scarf"], ["You wear _____ on your feet for sport.", "shorts", "trainers", "sandals"], ["In the summer I wear _____ and a T-shirt.", "boots", "shorts", "a coat"], ["She's wearing a beautiful long _____.", "shirt", "tie", "dress"], ["You wear a _____ around your neck.", "cap", "scarf", "belt"], ["It's cold. Put on your _____.", "sandals", "jumper", "T-shirt"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [5, "Which is the correctly stressed syllable?"]], "k": "BCCABACBAA", "q": [["c*a*n", "c*a*n't", "h*a*t"], ["c*a*n't", "p*ar*k", "w*ar*m"], ["sh*oe*s", "b*oo*ts", "sn*ow*ing"], ["w*ear*", "sk*ir*t", "sh*ir*t"], ["s*u*nny", "b*oo*ts", "s*u*mmer"], ["No_vem_ber", "Novem_ber_", "_No_vember"], ["Satur_day_", "Sat_ur_day", "_Sat_urday"], ["Decem_ber_", "De_cem_ber", "_De_cember"], ["_cha_racter", "cha_rac_ter", "charac_ter_"], ["Sep_tem_ber", "Septem_ber_", "_Sep_tember"]]}, "r": {"title": "Life in the coldest city", "k": "ABABC", "text": ["Yakutsk in Siberia is one of the coldest cities in the world. In January the temperature is often minus 40 degrees. But 300,000 people live there and they love their city.", "'In winter we wear a lot of clothes,' says Natalia, a teacher. 'A big fur coat, a hat, two pairs of gloves, a scarf and warm boots. You can't go out in normal shoes – your feet freeze!'", "Children go to school when it's minus 40, but not when it's colder. 'At minus 45 the schools close,' says Natalia. 'Then children stay at home and play computer games!'", "Summer in Yakutsk is short but hot – sometimes 30 degrees. 'Right now it's July and I'm sitting by the river,' says Natalia. 'People are swimming and having picnics. It's wonderful.'"], "q": [["What is the temperature often like in January?", "–40°", "–45°", "–30°"], ["What can't you wear in winter, according to Natalia?", "a fur coat", "normal shoes", "two pairs of gloves"], ["When do the schools close?", "at –45°", "at –40°", "in July"], ["What is summer like in Yakutsk?", "short and cold", "short and hot", "long and hot"], ["What is Natalia doing now?", "teaching", "swimming", "sitting by the river"]]}, "l": {"setting": "You will hear a weather forecast on the radio.", "k": "BAABC", "script": [["Presenter", "And now the weather for tomorrow, Saturday."], ["Presenter", "In the north of the country it's going to be cold and windy, with snow in the morning. The temperature is minus five."], ["Presenter", "In the centre, it's cloudy all day, but it isn't raining. The temperature is about two degrees."], ["Presenter", "In the south it's sunny and warm for March – about fifteen degrees. A great day for a walk in the mountains!"], ["Presenter", "In the west there's fog in the morning, so drive carefully. In the afternoon it's sunny."], ["Presenter", "And on Sunday? Rain everywhere, I'm afraid. Take your umbrellas!"]], "q": [["What's the weather like in the north in the morning?", "foggy", "snowy", "sunny"], ["What's the temperature in the centre?", "2°", "15°", "–5°"], ["Where is it warm?", "in the south", "in the west", "in the north"], ["What month is it?", "May", "March", "November"], ["What's the weather like on Sunday?", "sunny everywhere", "snowy in the north", "rainy everywhere"]]}, "s": {"focus": "can / can't, present continuous, present simple or continuous, weather and clothes.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["What sports or instruments can you play?", "What are you wearing today?", "What's the weather like today? Is it typical for this month?", "What do you usually wear at the weekend?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone. The teacher only listens.", "card": "Describe a photo you have on your phone (or imagine one).", "prompts": ["where the people are", "what they're doing", "what they're wearing", "what the weather is like"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["What's your favourite season in Kazakhstan? Why?", "What can you do in winter that you can't do in summer?", "What things can you do now that you couldn't do as a child?"]}]}});
TESTS.push({"id": "q6", "kind": "quick", "title": "Quick Test 6", "focus": "File 6: object pronouns, like / love / hate + -ing, be or do?, phone language, ordinal numbers, dates, music.", "g": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "ACBBCCAABA", "q": [["I like Tom. I see _____ every day.", "him", "he", "his"], ["Where are my keys? I can't find _____.", "they", "their", "them"], ["Can you help _____? I'm lost.", "I", "me", "my"], ["She loves _____ to music.", "listens", "listening", "listen"], ["I don't like _____ early.", "get up", "gets up", "getting up"], ["Do you like _____?", "dance", "dances", "dancing"], ["Where _____ you from?", "are", "do", "is"], ["What _____ you do at the weekend?", "do", "are", "is"], ["_____ she like jazz?", "Do", "Does", "Is"], ["_____ they busy today?", "Are", "Does", "Do"]]}, "v": {"parts": [[0, "Choose the correct word."]], "k": "CBBACAABAC", "q": [["My birthday is on the _____ of March.", "three", "thirth", "third"], ["Christmas Day is on December the _____.", "twentieth-fifth", "twenty-fifth", "twenty-five"], ["January is the _____ month.", "one", "first", "once"], ["Sorry, I can't _____ the phone now. I'm driving.", "answer", "hang", "ring"], ["Can I _____ a message?", "say", "do", "leave"], ["My phone is dead. I need to _____ it.", "charge", "send", "call"], ["She plays the _____ in an orchestra.", "violin", "band", "drums player"], ["I love _____ music. Mozart is my favourite.", "rap", "classical", "rock"], ["He's a _____. He plays in a jazz band.", "musician", "music", "musical"], ["I _____ heavy metal. It's terrible!", "really like", "love", "can't stand"]]}, "p": {"parts": [[0, "Which word has a different sound?"], [3, "Which is the correctly stressed syllable?"]], "k": "CABAB", "q": [["*th*irty", "*th*ird", "*th*at"], ["f*our*th", "th*ir*d", "f*ir*st"], ["*g*ood", "*j*azz", "*g*uitar"], ["mu_si_cian", "_mu_sician", "musi_cian_"], ["Septem_ber_", "Sep_tem_ber", "_Sep_tember"]]}, "r": {"title": "Music in our family", "k": "BACAB", "text": ["In my family everybody loves music, but we like very different things.", "My dad loves rock music. He plays the guitar in a band with his friends from work. They practise every Thursday in our garage. My mum hates it – she says it's very loud!", "My mum likes classical music. She goes to concerts at the theatre and she's learning the piano. My little sister, Amina, is ten and she loves pop music. She sings all the time.", "And me? I like rap and I write my own songs. My birthday is on 3rd May and I'm doing my first concert at school!"], "q": [["Where does the dad's band practise?", "at work", "in the garage", "at the theatre"], ["What does the mum think about the band?", "It's too loud.", "It's boring.", "It's very good."], ["What is the mum learning?", "the guitar", "to sing", "the piano"], ["What does Amina do all the time?", "sings", "plays the piano", "dances"], ["When is the writer's concert?", "on Thursday", "on 3rd May", "on 3rd March"]]}, "l": {"setting": "You will hear Olga phoning a music school.", "k": "ABCBA", "script": [["Receptionist", "Good morning, City Music School."], ["Olga", "Hello. I'd like some information about guitar lessons, please."], ["Receptionist", "Of course. Is it for you?"], ["Olga", "No, it's for my son. He's twelve."], ["Receptionist", "OK. We have lessons on Tuesdays and Fridays at five o'clock."], ["Olga", "Tuesday is good. When does the course start?"], ["Receptionist", "On the fifteenth of September."], ["Olga", "And can I have the teacher's name?"], ["Receptionist", "Yes, it's Mr Kim. He's very good with children."], ["Olga", "Thank you very much. Goodbye."]], "q": [["Who are the lessons for?", "Olga's son", "Olga's daughter", "Olga"], ["How old is he?", "15", "12", "5"], ["Which day does Olga choose?", "Friday", "Thursday", "Tuesday"], ["When does the course start?", "5th September", "15th September", "15th December"], ["Who is the teacher?", "Mr Kim", "Mrs Kim", "Mr Kemp"]]}, "s": {"focus": "object pronouns, like + -ing, dates, music.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in full sentences.", "prompts": ["When is your birthday?", "What do you like doing at the weekend?", "What kind of music do you like? Who is your favourite singer?", "What do you hate doing?"]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons.", "prompts": ["Ask the teacher three questions (Do you…? Are you…?)", "Can you play a musical instrument? Would you like to?"]}]}});
