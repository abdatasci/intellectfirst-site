<style>
/* Layout: one column; a sticky bar with section tabs and level; the play area is a single large card. */
:root {
  --navy: #0B2545; --bg: #FBFCFD; --raised: #FFFFFF; --dim: #F2F4F6; --text: #10233F; --soft: #4C5B70; --line: rgba(11,37,69,.14);
  --gold: #B8892F; --gold-soft: rgba(197,151,58,.15); --accent: #2F6F8E; --ok: #2E7D4F; --ok-soft: rgba(46,125,79,.12); --bad: #B23A3A; --bad-soft: rgba(178,58,58,.1);
  --display: 'Fraunces', Georgia, serif; --body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0A1830; --raised: #0F2140; --dim: #0C1C37; --text: #EAF0F6; --soft: #A9BAD0; --line: rgba(201,210,219,.18); --gold: #D9AE5A; --gold-soft: rgba(217,174,90,.15); --accent: #A9D6E5; --ok: #6FCF97; --ok-soft: rgba(111,207,151,.12); --bad: #F08A8A; --bad-soft: rgba(240,138,138,.1); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0A1830; --raised: #0F2140; --dim: #0C1C37; --text: #EAF0F6; --soft: #A9BAD0; --line: rgba(201,210,219,.18); --gold: #D9AE5A; --gold-soft: rgba(217,174,90,.15); --accent: #A9D6E5; --ok: #6FCF97; --ok-soft: rgba(111,207,151,.12); --bad: #F08A8A; --bad-soft: rgba(240,138,138,.1); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; padding-block: 10px 0; flex-wrap: wrap; }
.top h1 { font-size: 21px; }
.top h1 small { display: block; font-family: var(--body); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.lv { margin-left: auto; display: flex; gap: 4px; }
.lv button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--soft); font-variant-numeric: tabular-nums; }
.lv button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; width: 100%; }
.tabs a { padding: 10px 12px 9px; text-decoration: none; color: var(--soft); border-bottom: 2px solid transparent; font-size: 14.5px; font-weight: 500; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--gold); }
main { padding-block: 22px 80px; }
.lead { color: var(--soft); margin: 6px 0 18px; max-width: 60ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); text-decoration: none; color: inherit; cursor: pointer; text-align: left; }
.card:hover { border-color: var(--accent); }
.card .k { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-weight: 600; display: flex; justify-content: space-between; }
.card h3 { font-size: 20px; }
.card p { margin: 0; color: var(--soft); font-size: 14px; }
.best { font-size: 13px; color: var(--soft); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--raised); padding: 10px 18px; border-radius: var(--r); cursor: pointer; font-weight: 600; font-size: 15px; text-decoration: none; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* play */
.stage { border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 18px; display: flex; flex-direction: column; gap: 16px; min-height: 360px; }
.hud { display: flex; align-items: center; gap: 14px; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--soft); }
.hud b { color: var(--text); font-size: 18px; }
.hud .name { font-family: var(--display); font-size: 18px; color: var(--text); margin-right: auto; }
.bar { height: 6px; border-radius: 3px; background: var(--dim); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); width: 100%; transition: width .25s linear; }
.prompt { font-family: var(--display); font-size: clamp(22px, 3.4vw, 30px); line-height: 1.35; }
.words { display: flex; flex-wrap: wrap; gap: 8px; font-size: clamp(18px, 2.6vw, 22px); }
.w { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 10px; cursor: pointer; line-height: 1.2; }
.w.cut { text-decoration: line-through; color: var(--soft); background: var(--dim); }
.w.right { border-color: var(--ok); background: var(--ok-soft); }
.w.wrong { border-color: var(--bad); background: var(--bad-soft); }
.w.used { visibility: hidden; }
.built { min-height: 52px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 8px; font-size: clamp(18px, 2.6vw, 22px); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 480px) { .opts { grid-template-columns: 1fr; } }
.opt { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 14px; cursor: pointer; text-align: left; font-size: 17px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fb { min-height: 48px; font-size: 14.5px; color: var(--soft); }
.fb b.ok { color: var(--ok); } .fb b.no { color: var(--bad); }
.end { display: flex; flex-direction: column; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { border-top: 2px solid var(--gold); padding-top: 8px; }
.stat b { display: block; font-family: var(--display); font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--soft); }
.review { display: flex; flex-direction: column; gap: 10px; }
.review div { border-left: 3px solid var(--bad); padding: 4px 0 4px 12px; font-size: 14.5px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14.5px; }
td, th { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); font-weight: 600; }
.tbl { overflow-x: auto; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.shake { animation: shake .25s; }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } .bar i { transition: none; } }
</style>
</head>

<script>/* IF Skill Games item banks. All sentences are original, written for IF Academy.
   edit:    one wrong word; `bad` is the wrong word as it appears, `fix` the correction.
   build:   the sentence in the correct order; extra accepted orders in `alt`.
   trim:    words in [brackets] are the ones a good editor removes.
   precise: choose the word that fits; `a` is the index of the right option.
   colloc:  choose the natural partner.

window.SG_DATA = {
  edit: {
    A2: [
      { s: "She don't like coffee in the morning.", bad: "don't", fix: "doesn't", why: "He, she and it take doesn't in the present simple." },
      { s: "I am living in Kostanay since 2019.", bad: "am", fix: "have been", why: "With since and a time up to now, use the present perfect: I have been living / I have lived." },
      { s: "We went to the cinema yesterday and watch a comedy.", bad: "watch", fix: "watched", why: "Both actions are in the past, so both verbs are past simple." },
      { s: "There is many people at the bus stop.", bad: "is", fix: "are", why: "People is plural, so use there are." },

      { s: "Can you tell me where is the library?", bad: "is", fix: "the library is", why: "In an indirect question the word order is like a statement: where the library is." },
      { s: "I usually go to school by the bus.", bad: "the", fix: "(no word)", why: "We say by bus, by car, by train, with no article." },
      { s: "He has visited Almaty last summer.", bad: "has", fix: "(visited)", why: "With a finished time like last summer, use the past simple: he visited." },
      { s: "Do you can swim?", bad: "Do", fix: "(remove Do)", why: "Can makes its own question. Do is not needed." },
      { s: "I'm agree with you about the homework.", bad: "I'm", fix: "I", why: "Agree is a verb, so we say I agree, not I am agree." }
    ],
    B1: [
      { s: "If I will see her tomorrow, I'll give her the book.", bad: "will", fix: "(see)", why: "After if in the first conditional, use the present simple: If I see her." },
      { s: "I'm looking forward to meet your family.", bad: "meet", fix: "meeting", why: "Look forward to is followed by -ing." },
      { s: "She said me that the lesson was cancelled.", bad: "said", fix: "told", why: "Tell someone something; say something (to someone)." },
      { s: "The film was so bored that I fell asleep.", bad: "bored", fix: "boring", why: "-ing describes the thing; -ed describes how a person feels." },
      { s: "I've lived here for I was a child.", bad: "for", fix: "since", why: "Since goes with a starting point; for goes with a length of time." },
      { s: "He suggested to go to the museum on Saturday.", bad: "to", fix: "going", why: "Suggest is followed by -ing or a that-clause, not to + verb." },
      { s: "My sister is married with a doctor.", bad: "with", fix: "to", why: "We are married to someone." },
      { s: "Everybody were happy with the results.", bad: "were", fix: "was", why: "Everybody takes a singular verb." },
      { s: "We didn't went out because it was raining.", bad: "went", fix: "go", why: "After didn't, use the base form: didn't go." },
      { s: "This is the best pizza I have never eaten.", bad: "never", fix: "ever", why: "After a superlative we use ever: the best pizza I have ever eaten." }
    ],
    B2: [
      { s: "Hardly I had arrived when the phone rang.", bad: "I", fix: "had I", why: "After hardly at the start of a sentence, invert: Hardly had I arrived…" },
      { s: "I wish I would have studied harder for the exam.", bad: "would", fix: "had studied", why: "For past regrets use wish + past perfect: I wish I had studied." },
      { s: "Despite of the rain, the match went ahead.", bad: "of", fix: "(Despite the rain)", why: "Despite has no of. Use despite the rain or in spite of the rain." },
      { s: "The report must be finished until Friday.", bad: "until", fix: "by", why: "By is a deadline; until is a continuing state up to a time." },
      { s: "She is used to get up at six every day.", bad: "get", fix: "getting", why: "Be used to is followed by -ing: she is used to getting up." },
      { s: "Had I knew about the traffic, I would have left earlier.", bad: "knew", fix: "known", why: "Inverted third conditional: Had I known…" },
      { s: "It's high time we go home.", bad: "go", fix: "went", why: "It's high time is followed by the past simple." },
      { s: "The number of students have increased this year.", bad: "have", fix: "has", why: "The number of takes a singular verb (a number of takes a plural verb)." },
      { s: "I'd rather you don't tell anyone yet.", bad: "don't", fix: "didn't", why: "I'd rather + another person takes the past simple: I'd rather you didn't." },
      { s: "He denied to take the money.", bad: "to", fix: "taking", why: "Deny is followed by -ing." }
    ],
    C1: [
      { s: "Not only she speaks Kazakh, but she also writes it beautifully.", bad: "she", fix: "does she speak", why: "Not only at the start triggers inversion: Not only does she speak…" },
      { s: "The committee insisted that he resigns immediately.", bad: "resigns", fix: "resign", why: "Insist that takes the subjunctive base form: that he resign." },
      { s: "Little they knew that the decision had already been made.", bad: "they", fix: "did they know", why: "Negative adverbials at the front invert: Little did they know…" },
      { s: "She's one of those people who always knows what to say.", bad: "knows", fix: "know", why: "Who refers to people (plural), so the verb is know." },
      { s: "Under no circumstances you should share your password.", bad: "you", fix: "should you", why: "Under no circumstances triggers inversion: should you share." },
      { s: "Scarcely had we sat down than the alarm went off.", bad: "than", fix: "when", why: "Scarcely … when; no sooner … than." }
    ]
  },
  build: {
    A2: [
      { s: "I have never been to Astana" },
      { s: "What time does the lesson start" },
      { s: "She is going to visit her aunt tomorrow" },
      { s: "We usually have dinner at seven" },
      { s: "Could you open the window please" },
      { s: "My father works in a big hospital" },
      { s: "How long have you lived here" },
      { s: "There are two parks near my house" }
    ],
    B1: [
      { s: "I have been learning English for five years" },
      { s: "If it rains we will stay at home", alt: ["We will stay at home if it rains"] },
      { s: "The book that you lent me was brilliant" },
      { s: "She asked me where I was going" },
      { s: "I used to walk to school every day", alt: ["Every day I used to walk to school"] },
      { s: "You should have told me earlier" },
      { s: "The bridge was built in 1965" },
      { s: "He is the man whose car was stolen" }
    ],
    B2: [
      { s: "If I had known I would have helped you", alt: ["I would have helped you if I had known"] },
      { s: "By the time we arrived the film had started", alt: ["The film had started by the time we arrived"] },
      { s: "She is said to be the best teacher in town" },
      { s: "I would rather stay in than go out tonight" },
      { s: "The more you practise the easier it gets" },
      { s: "We had the roof repaired last month", alt: ["Last month we had the roof repaired"] },
      { s: "Not knowing what to say he left the room" },
      { s: "It was Aliya who found the answer" }
    ],
    C1: [
      { s: "Never before had the city seen such heavy snow" },
      { s: "Had they left earlier they would not have missed the train" },
      { s: "Only when the results came out did we realise our mistake" },
      { s: "So difficult was the exam that few students passed" },
      { s: "What surprised me most was how calm she remained" },
      { s: "Should you need any help do not hesitate to ask" },
      { s: "Rarely do we get the chance to travel abroad" },
      { s: "Were I in your position I would accept the offer" }
    ]
  },
  trim: {
    A2: [
      { s: "I [personally] think that this pizza is [very] really good." },
      { s: "We went back [again] to the same café on Sunday." },
      { s: "Please repeat [again] the last question." },
      { s: "She is a [female] actress from Almaty." },
      { s: "At [the time of] 8 a.m. the shop opens." },
      { s: "The meeting is at 3 p.m. [in the afternoon]." }
    ],
    B1: [
      { s: "In my [personal] opinion, the [final] outcome was fair." },
      { s: "We need to plan [ahead] for the future." },
      { s: "The two cities are [both] similar in size." },
      { s: "Each [and every] student must bring a dictionary." },
      { s: "I [actually] went to the shop and bought some bread [as well too]." },
      { s: "She returned [back] home at [about] around nine." }
    ],
    B2: [
      { s: "Because it was raining, the match was postponed [until later]." },
      { s: "The [end] result was a [completely] total success." },
      { s: "We [first] began the project [initially] in March." },
      { s: "[Basically,] the main point is that we need more time." },
      { s: "The proposal was approved [by everyone] unanimously." },
      { s: "It is [absolutely] essential that everyone attends." }
    ],
    C1: [
      { s: "The [advance] warning came [in] just in time." },
      { s: "[It is important to note that] the data are incomplete." },
      { s: "Her [own] personal views were never made public." },
      { s: "We will [collaborate together to] work together on the [new] innovation." },
      { s: "The report [clearly] shows a [clear] rise in demand." },
      { s: "The reason [why] prices rose is that demand outstripped supply." }
    ]
  },
  precise: {
    A2: [
      { s: "Can you ___ me your pen for a minute?", o: ["lend", "borrow", "give back", "keep"], a: 0, why: "You lend something to someone; you borrow something from someone." },
      { s: "It's very cold, so ___ a warm coat.", o: ["wear", "dress", "carry", "put"], a: 0, why: "Wear clothes; dress yourself; put on a coat (needs on)." },
      { s: "I ___ my keys. I can't find them anywhere.", o: ["lost", "missed", "forgot", "left"], a: 0, why: "Lose = can't find. Miss = arrive too late for, or feel sad without." },
      { s: "The museum is ___ on Mondays.", o: ["closed", "shut down", "finished", "stopped"], a: 0, why: "Shops and museums are open or closed." },
      { s: "Turn ___ the light, please. It's dark.", o: ["on", "up", "in", "over"], a: 0, why: "Turn on / off a light." },
      { s: "We ___ a great time at the party.", o: ["had", "made", "did", "spent"], a: 0, why: "Have a good time." },
      { s: "My sister is ___ in music and plays the guitar.", o: ["interested", "interesting", "keen", "fond"], a: 0, why: "Interested in. (Keen on, fond of take different prepositions.)" },
      { s: "Please ___ quietly. The baby is sleeping.", o: ["speak", "tell", "say", "talk about"], a: 0, why: "Speak quietly; say and tell need an object." }
    ],
    B1: [
      { s: "The doctor ___ some medicine for my cough.", o: ["prescribed", "described", "subscribed", "proscribed"], a: 0, why: "Doctors prescribe medicine." },
      { s: "Could you ___ me to buy milk on the way home?", o: ["remind", "remember", "recall", "memorise"], a: 0, why: "Remind someone to do something; remember is something you do yourself." },
      { s: "The new shopping centre will ___ hundreds of jobs.", o: ["create", "make up", "invent", "build up"], a: 0, why: "Create jobs is the natural collocation." },
      { s: "He ___ the exam on his second attempt.", o: ["passed", "past", "succeeded", "won"], a: 0, why: "Pass an exam; succeed in an exam; past is not a verb." },
      { s: "We need to ___ a decision before Friday.", o: ["make", "do", "take part", "give"], a: 0, why: "Make a decision (British English also accepts take)." },
      { s: "The bus was ___ because of the snow.", o: ["delayed", "late", "postponed", "slowed"], a: 0, why: "Transport is delayed; events are postponed." },
      { s: "She has a very ___ personality and makes friends easily.", o: ["outgoing", "outdoor", "outlying", "outside"], a: 0, why: "Outgoing = friendly and sociable." },
      { s: "I can't ___ the noise from the road any more.", o: ["stand", "support", "carry", "hold"], a: 0, why: "Can't stand = can't bear, can't tolerate." }
    ],
    B2: [
      { s: "The government plans to ___ a new law on recycling.", o: ["introduce", "induce", "deduce", "produce"], a: 0, why: "Introduce a law." },
      { s: "Her argument was ___: nobody could find a weak point.", o: ["compelling", "compulsive", "compulsory", "competitive"], a: 0, why: "Compelling = very convincing. Compulsory = required." },
      { s: "The company ___ its profits by cutting costs.", o: ["boosted", "raised up", "rose", "arose"], a: 0, why: "Boost profits (transitive). Rise and arise have no object." },
      { s: "The results were ___ with what we expected.", o: ["consistent", "constant", "persistent", "insistent"], a: 0, why: "Consistent with = in agreement with." },
      { s: "Please ___ from using your phone during the exam.", o: ["refrain", "restrain", "retain", "remain"], a: 0, why: "Refrain from doing something." },
      { s: "The film is ___ on a true story.", o: ["based", "founded", "grounded", "built"], a: 0, why: "Based on a true story." },
      { s: "He made a ___ effort to arrive on time.", o: ["conscious", "conscientious", "consensual", "consequent"], a: 0, why: "A conscious effort = a deliberate effort." },
      { s: "The storm caused ___ damage to the roof.", o: ["extensive", "expensive", "expansive", "extended"], a: 0, why: "Extensive damage = a lot of damage." }
    ],
    C1: [
      { s: "The minister's comments ___ a storm of criticism.", o: ["sparked", "lit", "fired", "flashed"], a: 0, why: "Spark criticism, spark a debate." },
      { s: "Her contribution to the project was ___; we couldn't have done it without her.", o: ["invaluable", "valueless", "unvalued", "devalued"], a: 0, why: "Invaluable = extremely useful." },
      { s: "The evidence is ___ at best and would not convince a court.", o: ["tenuous", "tentative", "tenacious", "tedious"], a: 0, why: "Tenuous = weak, slight." },
      { s: "We must ___ the risks before signing the contract.", o: ["weigh up", "weigh down", "weigh in", "weigh out"], a: 0, why: "Weigh up = consider carefully." },
      { s: "The policy had the ___ effect of increasing prices.", o: ["unintended", "unintentional", "inadvertent", "accidental"], a: 0, why: "Unintended effect / consequence is the fixed collocation." },
      { s: "She gave a ___ account of the events, leaving nothing out.", o: ["meticulous", "meddlesome", "momentous", "monotonous"], a: 0, why: "Meticulous = very careful and detailed." },
      { s: "The two reports are ___ different in their conclusions.", o: ["markedly", "remarkably", "notedly", "signally"], a: 0, why: "Markedly different is a strong collocation." },
      { s: "His apology seemed ___ rather than sincere.", o: ["perfunctory", "peremptory", "precocious", "prudent"], a: 0, why: "Perfunctory = done quickly, without real feeling." }

<script>
(function () {
