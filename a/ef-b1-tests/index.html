:root[data-theme="dark"]{
  --navy:#0B1731; --navy2:#22386B; --ice:#18284A; --ice2:#243A66;
  --gold:#D2AE52; --gold2:#5E4C1E; --paper:#13213F; --bg:#0D1830;
  --ink:#E6ECF6; --muted:#A3B0C8; --line:#2A3C63;
  --ok:#6FD39F; --okbg:#133A2A; --no:#F08A80; --nobg:#40191A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}

/* masthead */
.mast{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.mast-in{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.mast svg{width:44px;height:52px;flex:none}
.mast .school{font-family:var(--serif);font-size:1.25rem;letter-spacing:.01em}
.mast .sub{color:#C9D6EA;font-size:.95rem}
.mast .grow{flex:1}
.mast select{background:transparent;border:1px solid #3A5285;border-radius:6px;padding:6px 8px;color:#fff}
.mast select option{color:#000}

/* layout */
.wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:24px;padding:22px 20px 60px}
nav.tests h2{font-size:1rem;color:var(--muted);font-family:var(--sans);font-weight:700;margin:4px 0 8px}
nav.tests ul{list-style:none;margin:0 0 18px;padding:0}
nav.tests li button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 10px;border-radius:0 6px 6px 0;display:flex;justify-content:space-between;gap:8px}
nav.tests li button:hover{background:var(--ice)}
nav.tests li button[aria-current="true"]{border-left-color:var(--gold);background:var(--paper);font-weight:700}
nav.tests li button .mini{color:var(--muted);font-size:.85rem;font-weight:400}
nav.tests .soon{color:var(--muted);font-size:.92rem;padding:5px 13px}
.mobile-pick{display:none}

main{min-width:0}
.head{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.head h1{font-size:2rem;color:var(--ink)}
.head .focus{color:var(--muted);margin:4px 0 14px}
.who{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.who label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.who input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:180px}
.mode{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.mode button{border:0;background:var(--paper);padding:8px 14px;font-size:.92rem}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}
.modehint{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:0}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 12px 9px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs .badge{font-weight:400;font-size:.82rem;margin-left:5px;color:var(--muted)}

.sec h2{font-size:1.5rem;margin-bottom:4px}
.part{font-family:var(--serif);font-size:1.08rem;margin:26px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.part:first-of-type{border-top:0;padding-top:0;margin-top:10px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:32px 1fr;gap:4px 8px}
.q .n{font-family:var(--serif);font-weight:700;color:var(--gold);font-size:1.05rem;padding-top:1px}
.q .stem{margin-bottom:8px}
.q .spk{display:inline-block;font-weight:700;width:1.4em;color:var(--muted)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--muted);margin:0 3px;line-height:1.1}
.blank.filled{border-bottom-color:var(--gold);font-weight:700;padding:0 3px;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 12px;display:flex;gap:8px;align-items:baseline;text-align:left;min-height:40px}
.opt:hover:not(:disabled){border-color:var(--navy2)}
.opt .l{font-weight:700;color:var(--muted);font-size:.85rem}
.opt.sel{border-color:var(--navy2);background:var(--ice)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg);text-decoration:line-through;text-decoration-thickness:1px}
.opt.key{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt b.snd{color:var(--gold);font-weight:700}
.opt u.str{text-decoration:underline 2px;text-underline-offset:3px;font-weight:700}
.q .verdict{grid-column:2;font-size:.88rem;margin-top:6px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}

.reading{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.text{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 22px;font-family:var(--serif);line-height:1.65;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.text h3{font-size:1.25rem;margin-bottom:10px}
.text p{margin:0 0 12px}

.player{background:var(--navy);color:#fff;border-radius:10px;padding:16px 18px;margin:12px 0 18px}
.player .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.player button{border:1px solid #4A6399;background:#1C3161;color:#fff;border-radius:6px;padding:8px 14px;font-weight:700}
.player button.primary{background:var(--gold);border-color:var(--gold);color:#1a1405}
.player button:disabled{opacity:.45;cursor:not-allowed}
.player label{font-size:.85rem;color:#C9D6EA;display:flex;gap:6px;align-items:center}
.player select{background:#0B1731;color:#fff;border:1px solid #4A6399;border-radius:6px;padding:5px 6px;max-width:220px}
.player .status{font-size:.9rem;color:#C9D6EA;margin-top:10px}
.player .plays{margin-left:auto;font-size:.9rem}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;font-size:.88rem}
.script{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:16px}
.script p{margin:0 0 6px}
.script p.now{background:var(--gold2);border-radius:4px}
.script b{font-family:var(--serif)}

.bands{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:.92rem;margin:10px 0 18px}
.bands table{border-collapse:collapse;width:100%}
.bands td{padding:3px 8px 3px 0;vertical-align:top}
.bands td:first-child{font-weight:700;white-space:nowrap;color:var(--gold)}
.task{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.task h3{font-size:1.15rem}
.task .meta{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.task ul{margin:0 0 12px;padding-left:1.2em}
.task li{margin-bottom:4px}
.task .card{border-left:3px solid var(--gold);padding:6px 12px;background:var(--ice);border-radius:0 6px 6px 0;margin-bottom:10px;font-family:var(--serif)}
.timer{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.timer .clock{font-family:var(--serif);font-size:1.4rem;min-width:3.2em}
.timer button,.ghost{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px}
.rate{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rate .lab{font-size:.88rem;color:var(--muted);margin-right:4px}
.rate button{width:36px;height:36px;border:1.5px solid var(--line);background:var(--bg);border-radius:6px;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

.pager{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.pager button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;font-weight:700}

/* ledger */
aside.ledger{position:sticky;top:14px;align-self:start}
.card-l{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px}
.card-l .t{font-family:var(--serif);font-size:1.1rem}
.card-l .st{color:var(--muted);font-size:.88rem;margin-bottom:12px;min-height:1.3em}
.big{display:flex;align-items:baseline;gap:6px;font-family:var(--serif);margin:4px 0 2px}
.big .num{font-size:3.4rem;line-height:1;color:var(--ink)}
.big .of{font-size:1.2rem;color:var(--muted)}
.pct{font-size:.95rem;color:var(--muted);margin-bottom:14px}
.pct b{color:var(--ink)}
.rowl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.93rem;margin-bottom:9px}
.rowl .bar{grid-column:1/3;height:5px;background:var(--ice);border-radius:3px;overflow:hidden}
.rowl .bar i{display:block;height:100%;background:var(--navy2);transition:width .25s}
.rowl .v{font-variant-numeric:tabular-nums}
.ledger .actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ledger .actions button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:700}
.ledger .actions button.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.src{font-size:.78rem;color:var(--muted);margin-top:14px;line-height:1.4}
.mobile-total{display:none}

@media (max-width:1100px){
  .wrap{grid-template-columns:200px minmax(0,1fr)}
  aside.ledger{grid-column:1/3;position:static}
}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{grid-template-columns:minmax(0,1fr);padding:14px 12px 110px;gap:14px}
  nav.tests{display:none}
  .mobile-pick{display:block;margin-bottom:12px}
  .mobile-pick select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
  aside.ledger{grid-column:auto}
  .reading{grid-template-columns:minmax(0,1fr)}
  .text{position:static;max-height:none}
  .mode{margin-left:0}
  .head h1{font-size:1.6rem}
  .mobile-total{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;border-top:3px solid var(--gold);z-index:10}
  .mobile-total b{font-family:var(--serif);font-size:1.3rem}
  .mobile-total button{background:none;border:1px solid #4A6399;color:#fff;border-radius:6px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mast img.crest{width:47px;height:60px;flex:none;display:block}
/*CLASS-START*//* v2 additions */
.tview{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.tview button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.tview button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tview .mini{font-weight:400;font-size:.85rem;opacity:.85}
nav.tests li.pair{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 4px 13px}
nav.tests li.pair .pname{font-size:.97rem}
nav.tests li.pair .pbtns{display:flex;gap:4px}
nav.tests li.pair .pbtns button{width:auto;min-width:38px;justify-content:center;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--paper);font-weight:700}
nav.tests li.pair .pbtns button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.syncnote{flex-basis:100%;font-size:.88rem;color:var(--muted);margin:2px 0 0;padding:6px 10px;border-left:3px solid var(--gold);background:var(--ice);border-radius:0 6px 6px 0}
.syncnote.ok{border-left-color:var(--ok)}
.hint{color:var(--muted);font-size:.92em}
input.gap.wide{min-width:min(100%,24em)}
.task.prompt p{margin:0 0 8px}
.task.prompt p:last-child{margin:0}
.muted{color:var(--muted);font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:8px}
.filters label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:160px}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.rtable{width:100%;border-collapse:collapse;font-size:.93rem}
.rtable th{text-align:left;font-weight:700;color:var(--muted);font-size:.82rem;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
.rtable td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.rtable td.num,.rtable th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtable tbody tr{cursor:pointer}
.rtable tbody tr:hover{background:var(--ice)}
.rtable tbody tr.on{background:var(--ice);box-shadow:inset 3px 0 0 var(--gold)}
.rtable td.empty{color:var(--muted);text-align:center;padding:22px;cursor:default}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-left:6px;color:var(--muted);vertical-align:middle}
.tag.warn{border-color:var(--gold);color:var(--gold)}
.detail{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dhead h2{font-size:1.4rem}
.secscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0 4px}
.secscores div{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;font-size:.9rem}
.wrview{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.6;max-height:320px;overflow:auto;margin-bottom:6px}
details.ans{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
details.ans summary{padding:10px 12px;cursor:pointer}
.atable{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--paper)}
.atable th{text-align:left;color:var(--muted);font-size:.78rem;padding:6px 10px;border-bottom:1px solid var(--line)}
.atable td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.atable tr.no td:nth-child(3){color:var(--no)}
.atable tr.ok td:nth-child(4){color:var(--ok)}
.codebox{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.codebox p{margin:0 0 8px;font-size:.9rem}
.codebox textarea,textarea.imp{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);word-break:break-all}
.codebox button{margin-top:8px}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-weight:700}
.go{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:8px;padding:9px 14px;font-weight:700}
.go:disabled{opacity:.6;cursor:default}
@media print{.mast,nav.tests,.mobile-pick,.who,.tabs,.pager,.mobile-total,.ledger .actions,.player,.linkbtn{display:none!important}.wrap{display:block}aside.ledger{position:static;margin-top:20px}body{background:#fff}}

.vswitch{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.vswitch button{flex:1;border:0;background:transparent;padding:11px 12px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.vswitch button+button{border-left:1px solid var(--line)}
.vswitch button[aria-pressed="true"]{background:var(--navy);color:#fff}
.vswitch .vsub{font-weight:400;font-size:.8rem;opacity:.8}
.share ol.steps{margin:6px 0 8px;padding-left:20px}.share ol.steps li{margin:4px 0}
@media (min-width:901px){nav.tests .tview{display:none}}
@media print{.vswitch{display:none!important}}
/*CLASS-END*/

<script>
/* IF Academy – "Send result to teacher" (result code IFR1) */
(function(){
"use strict";
var DASH="/me/";
function b64url(str){var bytes=new TextEncoder().encode(str),bin="";for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function newId(){var a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789",s="";var r=new Uint8Array(14);(window.crypto||{}).getRandomValues?crypto.getRandomValues(r):r.forEach(function(_,i){r[i]=Math.random()*256});for(var i=0;i<14;i++)s+=a[r[i]%a.length];return s}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var CSS=".ifr{margin-top:18px;border:2px solid var(--gold,#C29B40);border-radius:6px;padding:14px 16px;background:var(--gold-soft,#F3E7C9)}.ifr h3{margin:0 0 4px;font-size:20px}.ifr p{margin:0 0 10px;font-size:15px}.ifr textarea{width:100%;min-height:118px;font:inherit;font-size:14px;border:1px solid var(--line,#CBD6E4);border-radius:4px;padding:8px 10px;background:var(--paper,#fff);color:var(--ink,#15213A)}.ifr .ifr-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}.ifr button{border:0;border-radius:4px;padding:9px 16px;font:inherit;font-weight:700;background:var(--navy,#0F1E3D);color:#fff;cursor:pointer}.ifr button.l{background:transparent;color:var(--ink,#15213A);border:1px solid var(--navy2,#1B2F5A);font-weight:400}.ifr .ifr-m{font-size:14px}.ifr .ifr-w{color:var(--bad,#B23A3A);font-size:14px;margin-bottom:8px}@media print{.ifr{display:none}}";
function ensureCss(){if(document.getElementById("ifr-css"))return;var st=document.createElement("style");st.id="ifr-css";st.textContent=CSS;document.head.appendChild(st)}
/* p = {id, c, lv, t, v, n, cl, s:[[label,score|null,max]...], w:[texts]} */
function message(p){
  var tot=0,max=0,pend=[];p.s.forEach(function(x){max+=x[2];tot+=x[1]||0;if(x[1]==null)pend.push(x[0])});
  var o={id:p.id,c:p.c,lv:p.lv,t:p.t,v:p.v||"",n:p.n||"",cl:p.cl||"",d:new Date().toISOString(),s:p.s,w:(p.w||[]).filter(function(x){return x&&String(x).trim()})};
  var code="IFR1."+b64url(JSON.stringify(o));
  return "IF Academy test result\nStudent: "+(p.n||"(no name)")+(p.cl?" · "+p.cl:"")+"\nTest: "+p.lv+" · "+p.t+(p.v?" "+p.v:"")+"\nScore: "+tot+" / "+max+(pend.length?" ("+pend.join(" and ")+" not marked yet)":"")+"\n"+code+(p.x?"\n"+p.x:"");
}
function box(container,p){
  ensureCss();var old=container.querySelector(".ifr");if(old)old.remove();
  var msg=message(p);var d=document.createElement("div");d.className="ifr";
  d.innerHTML="<h3>Send this result to your teacher</h3>"+(p.n?"":"<div class='ifr-w'>Write your name at the top of the test first, so your teacher knows it’s you.</div>")+
    "<p>Tap <b>Share</b> and send it on WhatsApp or Telegram, or copy the message and paste it into a chat with your teacher.</p>"+
    "<textarea readonly aria-label='Result message'>"+esc(msg)+"</textarea><div class='ifr-row'>"+(navigator.share?"<button type='button' data-a='share'>Share</button>":"")+"<button type='button' class='"+(navigator.share?"l":"")+"' data-a='copy'>Copy message</button><span class='ifr-m' aria-live='polite'></span></div>";
  container.appendChild(d);

    if(b.dataset.a==="share"){navigator.share({title:"IF Academy test result",text:msg}).catch(function(){})}
    else{var ok=function(){m.textContent="Copied. Paste it into a chat with your teacher."};
      var fb=function(){ta.focus();ta.select();try{document.execCommand("copy");ok()}catch(e){m.textContent="Select the message and copy it."}};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(msg).then(ok,fb);else fb()}
  }});
}
window.IFR={box:box,newId:newId,message:message,DASH:DASH};
})();

</script>

song on the playlist.", "better", "most best", "best"], ["This castle ___ in 1600.", "built", "was built", "was build"], ["I don’t have ___ money left, because I bought a new jacket.", "much", "many", "lots"], ["We’ve lived in the same house ___ 20 years.", "for", "since", "ago"], ["If I can borrow Tolga’s car, I ___ come and see you tonight.", "must", "might", "have to"]]}, "v": {"parts": [[0, "Choose A, B, or C to complete the sentences."]], "k": "AABCABBBCBCABABCABCCCBCAB", "q": [["The train was so ___. We couldn’t move.", "crowded", "modern", "noisy"], ["I’m going to ___ a cake for Mark’s birthday.", "make", "do", "cook"], ["My new tablet doesn’t work. I think I’ll take it ___ to the shop.", "away", "back", "on"], ["Tony’s so ___. He pays for everything when we go out.", "lazy", "mean", "generous"], ["I have ___ and brown eyes.", "long curly hair", "curly long hair", "hair curly long"], ["___ have yellow and black stripes on their bodies.", "Mosquitoes", "Bees", "Flies"], ["The meeting is ___ 16 June at 2.00 p.m.", "at", "on", "in"], ["It’s really sunny. Let’s ___ for a walk.", "get", "go", "have"], ["I ___ a lot more money in my new job.", "had", "win", "earn"], ["Can you turn ___ the radio? I want to listen to the weather forecast.", "off", "on", "down"], ["My brother’s really frightened ___ spiders.", "to", "about", "of"], ["Westminster Bridge goes ___ the River Thames.", "over", "under", "through"], ["It’s ___ to run when the floor is wet.", "safe", "dangerous", "clean"], ["Don’t be so ___! You’ll have to wait.", "impatient", "untidy", "mean"], ["This street is ___ at night – you can’t hear any traffic.", "safe", "quiet", "clean"], ["Did you ___ sightseeing in Madrid?", "do", "make", "go"], ["I’m sorry I’m late. I ___ the bus.", "missed", "left", "lost"], ["A ___ has a very long neck.", "bear", "giraffe", "kangaroo"], ["She won’t be very happy if she ___ her driving test again.", "misses", "passes", "fails"], ["I look ___ my mother. We have the same eyes and nose.", "as", "to", "like"], ["Mariana and Stephan ___ married last year.", "went", "fell in", "got"], ["I’ve bought a new ___ for the athletics competition.", "trainers", "tracksuit", "boots"], ["He fell ___ the steps and broke his leg.", "along", "into", "down"], ["Andrea asked me if I could ___ her some money.", "lend", "borrow", "take"], ["Our flight leaves from ___ 2.", "Departures", "Terminal", "Gates"]]}, "r": {"title": "The library that lends more than books", "k": "BABBAABBBA", "text": ["When Emma Clarke moved into her first flat, she needed a drill to put up some shelves. A new one cost about £60, and she knew she would only use it once or twice. Then a neighbour told her about the ‘Library of Things’ at the end of her street.", "It works like a normal library, but instead of books, people borrow everyday objects: drills, ladders, tents, sewing machines and even speakers for parties. Members pay a small fee, usually between £1 and £5 a day, and they can keep most items for up to a week. The first library of this kind in the UK opened in London in 2014, and now there are dozens around the country.", "The idea is simple. Most families own lots of things that they hardly ever use. Experts say that the average drill is used for only about thirteen minutes in its whole life. ‘It doesn’t make sense for everyone on the street to buy the same things,’ says Tom Barker, a volunteer at Emma’s local library. ‘If we share, we save money and space, and we throw away less.’", "Volunteers check every item when it comes back, and they repair anything that is broken. Once a month, the library also runs a free ‘repair café’, where people can bring their own broken things and learn how to fix them. Tom says this is the most popular event: ‘People come in with a broken lamp and leave with a new skill.’", "Not everyone likes the idea. Some people prefer to have their own things, and it isn’t always easy to get an item at the weekend, when everyone wants it. But for Emma, the library has changed the way she shops. ‘Before I buy anything now, I ask myself: can I borrow it instead? Usually, the answer is yes.’"], "q": [["Emma didn’t want to buy a drill because ___.", "it was too heavy", "she would only use it once or twice", "the shop was closed"], ["Emma found out about the library from ___.", "a neighbour", "the internet", "a newspaper"], ["At a Library of Things, people borrow ___.", "books and magazines", "everyday objects", "only tools for the garden"], ["Members can usually keep an item for ___.", "one day", "up to a week", "a month"], ["The first library of this kind in the UK opened ___.", "in 2014", "in a small village", "last year"], ["According to experts, the average drill ___.", "is used for a very short time", "breaks very quickly", "is too expensive"], ["Tom thinks that when people share, they ___.", "make new friends", "save money and throw away less", "learn to use new tools"], ["At the repair café, people ___.", "buy second-hand things", "learn to fix their own things", "sell things they don’t need"], ["One problem with the library is that ___.", "items are expensive", "it can be hard to borrow things at the weekend", "the volunteers are unfriendly"], ["In paragraph 3, “hardly ever” means ___.", "almost never", "very often", "sometimes"]]}, "l": {"setting": "Part 1: Sam leaves a message for his friend Aliya about Saturday. Part 2: A young man talks about how he learned to cook.", "k": "BBBAABABBB", "script": [["Part 1 – Sam (voicemail)", "Hi Aliya, it’s Sam. I’m calling about Saturday. The film we wanted to see isn’t on at the Star Cinema any more, so I’ve booked tickets at the City Centre cinema instead. It starts at a quarter to eight, so let’s meet at half past seven outside the main entrance. The tickets were nine pounds each, but don’t worry, you can pay me later. After the film, my brother wants to join us for a pizza, if that’s OK with you. Oh, and the weather forecast says it’s going to rain on Saturday evening, so bring an umbrella! If there’s a problem, just send me a text. See you then!"], ["Part 2 – Speaker", "Until last year, I couldn’t cook at all. When I lived with my parents, my mum did all the cooking, and when I moved into my own flat, I just ate fast food or ready meals. After a few months I started feeling tired all the time, and I was spending far too much money. So I decided to do something about it. I didn’t want to pay for an expensive course, so I started watching cooking videos online. The first dish I made was a simple chicken curry. It was a disaster! I put in too much chilli and I couldn’t eat it. But I didn’t give up. Now I cook four or five evenings a week, and I’ve even started inviting friends round for dinner. My favourite thing to make is fresh pasta, because it’s cheaper than buying it and it tastes much better. My advice to anyone who wants to learn is to start with easy recipes, and don’t worry about making mistakes."]], "q": [["The film is on at ___.", "the Star Cinema", "the City Centre cinema", "a cinema near Sam’s house"], ["They are going to meet at ___.", "7.15", "7.30", "7.45"], ["Each ticket cost ___.", "£5", "£9", "£19"], ["After the film, ___ wants to join them.", "Sam’s brother", "Sam’s sister", "Aliya’s friend"], ["Sam tells Aliya to ___.", "bring an umbrella", "call him before Saturday", "pay for the tickets online"], ["Before he learned to cook, he usually ate ___.", "at his parents’ house", "fast food or ready meals", "in restaurants"], ["He decided to learn because ___.", "he felt tired and spent too much money", "his mum told him to", "he wanted to impress a friend"], ["He learned by ___.", "doing a course", "watching videos online", "reading cookbooks"], ["His first curry was a disaster because ___.", "he burned the chicken", "it was too spicy", "he forgot the rice"], ["He likes making fresh pasta because it is ___.", "quick and easy", "cheaper and tastier", "healthier than rice"]]}, "s": {"focus": "everyday tenses (past simple, present perfect, future forms), linking words (and, but, because, so). This is a level check, so note what the student can already do.", "tasks": [{"name": "Interview", "mins": 3, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["Where are you from, and what do you like about your town?", "Do you work or study? What do you do?", "What do you usually do at the weekend?", "Why are you learning English?", "What did you do last weekend?", "What are your plans for your next holiday?"]}, {"name": "Long turn", "mins": 2, "lead": "The student talks alone for about a minute. Other cards the teacher can use: Talk about a holiday you really enjoyed; Talk about a person in your family you admire; Talk about something you would like to buy.", "card": "Talk about your favourite place in your town.", "prompts": ["where it is", "how often you go there", "what you do there", "and why you like it"]}, {"name": "Discussion", "mins": 3, "lead": "Teacher and student discuss; the student should give reasons and examples.", "prompts": ["What’s the best thing about living in your town?", "Would you prefer to live in a big city or a small village? Why?", "What would you change about your town?", "Do you prefer holidays at the beach or in a city? Why?"]}]}});

r:{title:"The restaurant run by grandmothers",k:"ABCBA",text:["In a small restaurant in New York, the chefs are not young professionals. They are grandmothers. Every night, a different grandmother cooks food from her own country – one evening it might be Italian pasta, the next evening dishes from Sri Lanka or Kazakhstan.", "The owner, Jody Scaravella, started the restaurant because he missed his own grandmother's cooking. “Grandmothers don't follow recipes,” he says. “They cook with love, and you can taste it.”", "The grandmothers are not paid very much, but most of them say they aren't doing it for the money. “At home I'm alone,” says one of them. “Here I'm cooking for sixty people and I'm meeting new people every week.”", "The restaurant is so popular that you usually have to book a table weeks in advance."],q:[["Who cooks in the restaurant?", "grandmothers from different countries", "the owner's family", "young professional chefs"], ["Why did Jody start the restaurant?", "He wanted to teach cooking.", "He missed his grandmother's food.", "His grandmother asked him to."], ["According to Jody, grandmothers…", "cook very quickly.", "always cook Italian food.", "don't use recipes."], ["Why do most of the grandmothers work there?", "because the pay is very good", "to meet people and not be alone", "to sell their recipes"], ["What does the text say about booking?", "You often need to book weeks before.", "It's always easy to get a table.", "You can't book a table."]]},
l:{setting:"You will hear a waiter talking to a customer in a restaurant.",k:"BAACB",script:[["Waiter", "Are you ready to order?"], ["Customer", "Yes. I'd like the chicken soup to start, please."], ["Waiter", "I'm sorry, we haven't got any soup left today. How about a salad?"], ["Customer", "OK, a green salad. And then the grilled fish."], ["Waiter", "Would you like rice or potatoes with that?"], ["Customer", "Rice, please. And just water to drink."], ["Waiter", "Still or sparkling?"], ["Customer", "Sparkling. Oh, and I'm in a bit of a hurry – I've got a train at eight."], ["Waiter", "No problem. The fish takes about fifteen minutes."]],q:[["Why can't the customer have soup?", "It's too hot.", "There isn't any left.", "It isn't on the menu."], ["What does the customer have as a main course?", "grilled fish", "chicken", "salad"], ["What does the customer have with the main course?", "rice", "bread", "potatoes"], ["What does the customer want to drink?", "juice", "still water", "sparkling water"], ["Why is the customer in a hurry?", "He has a meeting.", "He has a train to catch.", "The restaurant closes at eight."]]},
s:{"focus": "present simple and continuous, future forms, food, family and personality vocabulary.", "tasks": [{"name": "Interview", "mins": 2, "lead": "The teacher asks; the student answers in two or three sentences each.", "prompts": ["What are you doing at the moment, apart from this test?", "What's your favourite dish? How do you make it?", "Describe one person in your family in three words."]}, {"name": "Discussion", "mins": 2, "lead": "Teacher and student discuss; the student should give reasons and examples.", "prompts": ["Is it better to eat at home or in restaurants?", "Who is the best cook in your family? Why?"]}]}

r:{title:"The boy who sold his toys",k:"BBACB",text:["When Ryan was eleven, he wanted a new bike, but his parents said it was too expensive. So Ryan made a decision. He took photos of all the toys he hadn't played with for years and sold them online.", "In two weeks, he made £180 – almost enough for the bike. But Ryan didn't stop there. He started buying old toys at weekend markets, cleaning them and selling them online for more money.", "Now, two years later, Ryan has earned over £3,000. He has bought the bike, and he has saved the rest. “I've learned that money doesn't grow on trees,” he says. “But old toys can turn into money!”", "His mum is proud, but she has one rule: homework first, business second."],q:[["Why did Ryan start selling his toys?", "His parents told him to.", "He wanted to buy a bike.", "He needed space in his room."], ["How much did he make in the first two weeks?", "£80", "£180", "£3,000"], ["What does Ryan do now?", "buys old toys, cleans them and sells them", "makes new toys", "repairs bikes"], ["What has Ryan done with most of his money?", "given it to his parents", "spent it on toys", "saved it"], ["What is his mum's rule?", "He must give her half the money.", "He must do his homework first.", "He can only sell at weekends."]]},
l:{setting:"You will hear two flatmates, Ben and Ollie, talking about money.",k:"BBABA",script:[["Ben", "Ollie, could you lend me fifty pounds until Friday?"], ["Ollie", "Fifty? What for?"], ["Ben", "It's my sister's birthday tomorrow and I haven't bought her anything yet."], ["Ollie", "You still owe me twenty from last month."], ["Ben", "I know, I'm sorry. I'll pay you back the seventy on Friday – I get paid then."], ["Ollie", "OK. But this is the last time."], ["Ben", "Thanks! Actually, thirty is enough. I've found a cheaper present online."]],q:[["How much does Ben ask to borrow at first?", "£20", "£50", "£30"], ["Why does Ben need money?", "to go out on Friday", "to buy a birthday present", "to pay the rent"], ["How much does Ben already owe Ollie?", "£20", "£30", "£70"], ["When will Ben pay Ollie back?", "next month", "on Friday", "tomorrow"], ["Why does Ben only need £30 in the end?", "He found a cheaper present.", "His sister lent him money.", "He got paid early."]]},

r:{title:"Going to work by cable car",k:"BBBCA",text:["La Paz in Bolivia is one of the highest cities in the world, and it is built on steep hills. For years, travelling across the city was slow and difficult. Buses were crowded, and the traffic on the narrow roads was terrible.", "Then, in 2014, the city opened its first cable car lines. Today, cable cars are an ordinary part of public transport, and thousands of people use them every day to get to work and school.", "For many people, the journey is now much quicker. A trip that took an hour by bus can take less than twenty minutes by cable car. It's also quieter and cleaner than travelling by bus.", "Tourists love it too – the views of the city and the mountains are amazing."],q:[["Why was it hard to travel around La Paz?", "It is a very big flat city.", "It is built on steep hills with narrow roads.", "There were no buses."], ["When did the first cable car lines open?", "in 2004", "in 2014", "last year"], ["Who uses the cable cars?", "only students", "people going to work and school, and tourists", "only tourists"], ["How long can a cable car journey take compared to the bus?", "about the same time", "an hour instead of twenty minutes", "less than twenty minutes instead of an hour"], ["What do tourists especially like?", "the views", "the speed", "the low prices"]]},
l:{setting:"You will hear two friends deciding how to get to a concert.",k:"AAACC",script:[["Nina", "The concert starts at eight. How shall we get there?"], ["Tom", "We could drive. It's quicker than the bus."], ["Nina", "But parking near the stadium is really expensive – about twenty pounds."], ["Tom", "True. What about the train?"], ["Nina", "The train's the best idea. It takes twenty-five minutes and the station is right next to the stadium."], ["Tom", "OK. Let's get the seven o'clock train, then. I'll meet you on the platform."], ["Nina", "Great. Don't be late!"]],q:[["When does the concert start?", "at 8.00", "at 7.00", "at 7.25"], ["Why doesn't Nina want to drive?", "Parking is expensive.", "She doesn't have a car.", "The traffic is bad."], ["How long does the train take?", "25 minutes", "20 minutes", "an hour"], ["Where is the station?", "in the city centre", "near Tom's house", "next to the stadium"], ["Where will they meet?", "outside the stadium", "at the bus stop", "on the platform"]]},

r:{title:"Leave your phone, get a discount",k:"ABCAC",text:["A café in Istanbul has an unusual offer. If customers put their phones in a box when they arrive, they get 20% off their bill.", "The owner, Elif, had the idea after she noticed that many friends who came to her café didn't talk to each other – they just looked at their screens. “It was so sad,” she says. “People should enjoy their food and their friends.”", "At first, some customers were annoyed. But now about half of them use the box. “I was surprised,” says one student. “It was relaxing not to check my messages for an hour. And the cake tasted better!”", "Customers don't have to leave their phones – it's their choice. But Elif hopes more people will try it."],q:[["What happens if customers put their phones in a box?", "They pay less.", "They get a free cake.", "They can stay longer."], ["Why did Elif have the idea?", "Customers were taking photos of the food.", "People were looking at phones instead of talking.", "Phones were making too much noise."], ["How did some customers feel at first?", "bored", "excited", "annoyed"], ["How many customers use the box now?", "about half", "almost all", "very few"], ["Do customers have to leave their phones?", "Only students do.", "Yes, it's a rule.", "No, they can choose."]]},
l:{setting:"You will hear two friends, Mia and Sam, talking about a driving test.",k:"AAACA",script:[["Mia", "So? Did you pass your driving test?"], ["Sam", "No, I failed. Again. That's the third time."], ["Mia", "Oh no! What happened?"], ["Sam", "Everything was fine until the end. Then I had to park, and I hit the car behind me."], ["Mia", "Were you nervous?"], ["Sam", "Terrified. My hands were shaking."], ["Mia", "You should take a few more lessons. My instructor was brilliant – I'll give you her number."], ["Sam", "Thanks. I'm not going to give up."]],q:[["How many times has Sam failed his driving test?", "three", "one", "two"], ["When did the problem happen?", "at the end of the test", "at the start of the test", "in the middle of the test"], ["What did Sam do wrong?", "He hit another car while parking.", "He drove too fast.", "He didn't stop at the lights."], ["How did Sam feel during the test?", "bored", "relaxed", "very frightened"], ["What will Mia give Sam?", "her instructor's number", "her car", "some money"]]},

r:{title:"The runner who came back",k:"ABCAB",text:["In the middle of a marathon in 2019, Megan Lee fell and broke her ankle. She had trained for this race for two years. “I was lying on the road and I knew it was over,” she says.", "Doctors told her she probably wouldn't be able to run long distances again. For months she couldn't even walk without help. She used to run every morning before work, but now she had to sit at home.", "But Megan didn't give up. She started swimming, then walking, then running very slowly. Three years after the accident, she ran the same marathon again – and finished it in under four hours.", "“Crossing the finish line was the best moment of my life,” she says."],q:[["What happened to Megan in 2019?", "She broke her ankle during a marathon.", "She won a marathon.", "She stopped running."], ["How long had she trained for the race?", "four months", "two years", "three years"], ["What did the doctors say?", "She should run every morning.", "She would be fine in a month.", "She might not run long distances again."], ["What did Megan do first to get better?", "swimming", "running", "cycling"], ["When did she run the marathon again?", "two years later", "three years after the accident", "the next year"]]},
l:{setting:"You will hear a woman, Lucy, telling a friend how she met her husband.",k:"BCBBA",script:[["Friend", "How did you and Dan meet?"], ["Lucy", "At a football match, actually. I was standing in the rain because I'd forgotten my umbrella."], ["Friend", "And Dan had one?"], ["Lucy", "Yes! He offered to share it. We started talking, and we found out we supported the same team."], ["Friend", "How romantic."], ["Lucy", "Well, our team lost five–nil that day. But we went for a coffee afterwards, and we've been together ever since. That was eight years ago."]],q:[["Where did Lucy meet Dan?", "at a bus stop", "at a football match", "at a café"], ["What was the weather like?", "It was snowing.", "It was sunny.", "It was raining."], ["What did Lucy and Dan have in common?", "They lived in the same street.", "They supported the same team.", "They worked together."], ["What was the result of the match?", "It was a draw.", "Their team lost 5–0.", "Their team won 5–0."], ["How long have they been together?", "eight years", "since last year", "five years"]]},

r:{title:"The people in the background",k:"BCACA",text:["In almost every film, there are people in the background – walking down the street, sitting in a café or cheering in a stadium. They are called extras, and they are usually ordinary people, not professional actors.", "Paul, a retired teacher from Manchester, has been an extra in more than forty films and TV series. “You might see me for two seconds,” he laughs. “But my grandchildren always look for me.”", "The work isn't always exciting. Extras often have to wait for hours, and the same scene can be filmed twenty times. But the pay is not bad – about £100 a day – and lunch is free.", "Paul's best day? “I was a passenger on a train in a famous spy film. I sat next to one of the stars for six hours.”"],q:[["Who are extras usually?", "film directors", "ordinary people", "famous actors"], ["What did Paul do before?", "He was an actor.", "He was a train driver.", "He was a teacher."], ["Who looks for Paul in films?", "his grandchildren", "the director", "his students"], ["What is one bad thing about being an extra?", "you don't get lunch", "the pay is very low", "waiting for a long time"], ["What happened on Paul's best day?", "He sat next to a film star.", "He spoke in a film.", "He met the director."]]},

r:{title:"School at home",k:"BCBCA",text:["Ten-year-old Lily doesn't go to school. Every morning she sits at the kitchen table, and her mother teaches her maths, English and science. In the afternoons, she often goes to museums, parks or the library.", "Lily is one of thousands of children in the UK who are educated at home. Her parents decided to do it when Lily was unhappy at her primary school. “She was very shy and didn't speak in class,” says her mother. “At home she asks questions all day.”", "Some people worry that home-schooled children don't make enough friends. But Lily goes to a dance class and a chess club every week. “If I went to school, I wouldn't have time for chess,” she says.", "Lily's parents say they'll send her to secondary school if she wants to go."],q:[["Who teaches Lily?", "a private teacher", "her mother", "her father"], ["What does Lily often do in the afternoons?", "does homework", "goes to school", "visits museums, parks or the library"], ["Why did her parents decide to teach her at home?", "She wasn't learning maths.", "She was unhappy at school.", "The school was too far."], ["How does Lily make friends?", "online", "at school", "at dance class and chess club"], ["What will happen when Lily is older?", "She can go to secondary school if she wants.", "She will never go to school.", "She must go to secondary school."]]},
l:{setting:"You will hear two friends talking about their homes.",k:"CCCAA",script:[["Ali", "How's the new flat?"], ["Sara", "It's nice, but it's really small. If it had a balcony, it would be perfect."], ["Ali", "What's the area like?"], ["Sara", "It's quiet. And it's only ten minutes from my office, so I can walk to work."], ["Ali", "That's great. I spend an hour on the bus every day."], ["Sara", "Why don't you move closer?"], ["Ali", "If I lived in the centre, I'd pay twice as much rent. I'll stay where I am until I get a better job."]],q:[["What's the problem with Sara's flat?", "It's far from work.", "It's noisy.", "It's very small."], ["What would make Sara's flat perfect?", "a garden", "a bigger kitchen", "a balcony"], ["How does Sara get to work?", "by bus", "by car", "She walks."], ["How long is Ali's bus journey each day?", "an hour", "thirty minutes", "ten minutes"], ["Why doesn't Ali move to the centre?", "The rent is too expensive.", "He likes his area.", "His job is near his home."]]},

r:{title:"From the office to the farm",k:"CBCAA",text:["Two years ago, Aidar was a manager at a bank in Almaty. He had a good salary, a nice flat and a car. But he wasn't happy. “I was sitting in front of a computer for ten hours a day,” he says. “I hated it.”", "So he decided to leave his job and start a small farm near his grandparents' village. His friends told him he was crazy. His boss offered him more money to stay.", "Now Aidar grows vegetables and keeps bees. He earns much less than before, but he says he doesn't mind. “I enjoy working outside, and I sleep better than ever.”", "He sells his honey online, and last month a hotel in Almaty asked him to supply them every week."],q:[["What was Aidar's job before?", "a teacher", "a farmer", "a bank manager"], ["Why wasn't he happy?", "His salary was low.", "He spent too long in front of a computer.", "He didn't like his boss."], ["What did his boss do when Aidar wanted to leave?", "told him he was crazy", "gave him a car", "offered him more money"], ["What does Aidar say about money now?", "He earns less but doesn't mind.", "He has no money.", "He earns more than before."], ["What happened last month?", "A hotel asked to buy his honey.", "He went back to the bank.", "He opened a shop."]]},

r:{title:"Lost and found after 30 years",k:"AAAAB",text:["In 1994, Margaret lost her wedding ring while she was working in her garden. She and her husband looked everywhere, but they never found it. “I cried for days,” she says.", "Thirty years later, her grandson was using a metal detector in the same garden. Suddenly it started beeping. He dug a little and found a small gold ring – Margaret's ring.", "“If he hadn't bought that metal detector, I would never have seen my ring again,” says Margaret, now 82. Her husband died five years ago, so the ring is even more special to her now.", "Her grandson says it was the luckiest day of his life. “I was only looking for old coins!”"],q:[["When did Margaret lose her ring?", "in 1994", "five years ago", "thirty years ago in a shop"], ["Where did she lose it?", "in her garden", "at work", "in her house"], ["Who found the ring?", "her grandson", "a neighbour", "her husband"], ["Why is the ring even more special now?", "Her husband has died.", "It was her mother's.", "It's very valuable."], ["What was the grandson looking for?", "the ring", "old coins", "his phone"]]},

r:{title:"The thief who said sorry",k:"BABCB",text:["When Jenny Clarke came home from holiday, she found that someone had broken into her house. Her laptop, her TV and some jewellery that had belonged to her grandmother had been taken.", "The police said there wasn't much hope of finding the burglar. But two weeks later, Jenny found a box outside her front door. Inside was her grandmother's jewellery and a handwritten letter.", "“I'm very sorry,” the letter said. “When I saw the photos of your grandmother, I felt terrible. I can't give you back the laptop, which I've already sold, but I'm returning the things that are really important to you.”", "The burglar, who never wrote his name, has still not been caught."],q:[["When did Jenny discover the burglary?", "when she was at work", "when she came home from holiday", "while she was sleeping"], ["What did the police say?", "They probably wouldn't find the burglar.", "They had arrested someone.", "They had found her laptop."], ["What did Jenny find outside her door?", "her laptop", "a box with her jewellery and a letter", "the burglar"], ["Why did the burglar return the jewellery?", "The police found him.", "He couldn't sell it.", "He felt bad after seeing photos of her grandmother."], ["What does the text say about the burglar now?", "He wrote his name in the letter.", "He hasn't been caught.", "He's in prison."]]},

r:{title:"Sunday lunch at Grandma's",k:"BCACC",text:["Every Sunday at one o'clock, between twelve and twenty people arrive at Zhanna Akhmetova's flat in Kostanay. Zhanna is 74, and she has cooked Sunday lunch for her family for more than forty years. “My children come, my grandchildren come, sometimes their friends come too,” she says. “I never know exactly how many people there will be, so I always make too much food.”", "The menu doesn't change much. There is always soup, a big plate of meat and potatoes, fresh bread and at least two cakes. Zhanna starts cooking on Saturday evening and gets up at six on Sunday morning to finish everything.", "Her granddaughter Aliya, who is 19, is learning to cook with her. “Grandma doesn't use recipes,” Aliya explains. “She just knows. So I'm writing everything down while she's cooking. One day I'm going to make the same lunch for my family.”", "Not everyone in the family is good in the kitchen. Zhanna's son-in-law, Marat, once tried to make the soup when she was ill. “It was a disaster,” he laughs. “Now I just wash the dishes.”", "Zhanna says the food isn't the most important thing. “People are so busy these days. They're always looking at their phones. But on Sunday, everybody sits at the same table and talks. That's why I do it.”"],q:[["How long has Zhanna cooked Sunday lunch for her family?", "for twenty years", "for over forty years", "for twelve years"], ["Why does Zhanna always make too much food?", "She wants to give food to her neighbours.", "Her family eats a lot.", "She doesn't know how many people will come."], ["What is Aliya doing to learn Zhanna's dishes?", "writing down what Zhanna does", "reading Zhanna's recipes", "watching videos online"], ["What does Marat do on Sundays now?", "He buys the cakes.", "He cooks the soup.", "He washes the dishes."], ["According to Zhanna, the most important thing about Sunday lunch is that…", "nobody uses a phone.", "the food is traditional.", "the family spends time together."]]},

r:{title:"A year without shopping",k:"CCBCB",text:["Two years ago, Rachel Green from Bristol looked at her bank account and got a shock. She had a good job, but she hadn't saved anything for five years. “I wasn't buying expensive things,” she says. “Just coffee, clothes, things for the house. But it all added up.”", "So Rachel made a decision: for twelve months, she would only buy food, medicine and things for her bathroom. No new clothes, no takeaway coffee, no books, no presents.", "The first two months were the hardest. “I've always gone shopping when I'm bored or stressed,” she explains. “Suddenly I couldn't do that, so I had to find other things to do.” She started running, borrowing books from the library, and inviting friends home instead of meeting in cafés.", "There were some difficult moments. When her best friend got married, Rachel couldn't buy a dress, so she borrowed one from her sister. And for her mum's birthday, she cooked a special dinner instead of buying a present. “Mum said it was the best present she's ever had,” Rachel says.", "By the end of the year, Rachel had saved £6,500. She has started shopping again, but much less than before. “Now, before I buy anything, I wait three days,” she says. “Usually I find I don't want it any more.”"],q:[["Why was Rachel shocked when she looked at her bank account?", "She had spent a lot on expensive things.", "Someone had stolen money from it.", "She hadn't saved any money for years."], ["What could Rachel buy during the year?", "only food", "clothes and books", "food, medicine and bathroom things"], ["Why were the first months difficult?", "She was ill and needed medicine.", "She usually shopped when she felt bored or stressed.", "Her friends didn't support her."], ["What did Rachel give her mum for her birthday?", "nothing", "a dress", "a dinner she cooked"], ["What does Rachel do now before she buys something?", "She checks her bank account.", "She waits a few days.", "She asks her sister."]]},

r:{title:"The great city race",k:"BACCA",text:["What is the fastest way to cross a big city? To find out, a TV programme organized a race across Almaty. Four people started at the same time from the same place in the north of the city. They had to get to a café in the south, about twelve kilometres away, during the morning rush hour.", "Daniyar took his car. Aigerim took the metro and then walked. Ruslan rode his bike, and Madina used an electric scooter.", "Most people thought the car would win. But the traffic was terrible, and Daniyar spent twenty minutes in a traffic jam near the city centre. Then he couldn't find anywhere to park. He arrived last, after 68 minutes.", "The winner was Ruslan on his bike. He arrived after 41 minutes, two minutes before Madina. “The scooter was faster on the flat roads,” Madina said, “but it was slower going up the hills, and I had to be more careful in the traffic.” Aigerim arrived third, after 52 minutes. The metro was quick, but she had to walk for twenty minutes at the end.", "The bike was not only the fastest way, it was also the cheapest: it cost nothing. The car was the most expensive, because of petrol and parking. Ruslan was very pleased. “I've been cycling to work for years,” he said. “Now everybody knows I'm right!”"],q:[["When did the race take place?", "late at night", "in the morning rush hour", "at the weekend"], ["Why was the car the slowest?", "There was a lot of traffic and no parking.", "The car broke down.", "Daniyar got lost."], ["What was Madina's problem with the scooter?", "It stopped working.", "It was slow on flat roads.", "It was slow on hills."], ["What slowed Aigerim down?", "She took the wrong train.", "The metro was late.", "She had to walk a long way at the end."], ["Which way of travelling was the cheapest?", "the bike", "the metro", "the scooter"]]},
l:{setting:"You will hear a tourist asking for information at a tourist office.",k:"CBBAC",script:[["Tourist", "Hello. What's the best way to get to the old castle from here?"], ["Assistant", "The quickest way is the number 12 bus. It leaves every fifteen minutes from the stop opposite the cathedral."], ["Tourist", "How long does it take?"], ["Assistant", "About twenty-five minutes. A taxi is faster, maybe fifteen minutes, but it's much more expensive."], ["Tourist", "And how much is the bus fare?"], ["Assistant", "Two euros fifty. But if you're staying for a few days, buy a tourist card. It's twelve euros for three days, and you can use all the buses and trams."], ["Tourist", "That sounds good. Where can I buy one?"], ["Assistant", "Here, at the tourist office. And it also gives you a discount at the castle museum."], ["Tourist", "Perfect. I'll take one, please."]],q:[["Where does the bus leave from?", "next to the castle", "outside the tourist office", "opposite the cathedral"], ["How long does the bus take?", "about fifteen minutes", "about twenty-five minutes", "about fifty minutes"], ["How much is a single bus fare?", "€3", "€2.50", "€12"], ["The tourist card lasts for…", "three days.", "one day.", "one week."], ["What else does the tourist card give you?", "a free tour of the city", "a free taxi", "a cheaper ticket for the castle museum"]]},

r:{title:"The museum of failure",k:"BBBBB",text:["In the Swedish city of Helsingborg, there is a very unusual museum. It doesn't show beautiful paintings or famous inventions. Instead, it shows products that failed – things that companies spent millions on, but which nobody wanted to buy.", "The museum was started in 2017 by Dr Samuel West, a psychologist. He was tired of reading stories about success. “Everybody talks about successful people,” he says. “But about 80 to 90 per cent of new products fail. We should be able to learn from failure too.”", "Visitors can see more than 150 objects, including a toothpaste company's frozen dinners, a pen designed only for women, and a plastic face mask that was supposed to make your skin better with electricity. Some of them are very funny. Others were expensive mistakes by big companies.", "West says that failure isn't something you have to be embarrassed about. “If you're afraid of failing, you'll never try anything new. Every successful company has failed many times.”", "The museum has become so popular that it has visited other countries, including the USA, China and France. Many visitors leave feeling surprisingly positive. “I came because I thought it would be funny,” one visitor wrote, “but I left feeling more confident about my own mistakes.”"],q:[["What can you see in the museum?", "famous paintings", "products that didn't sell", "successful inventions"], ["Why did Samuel West start the museum?", "He wanted to make money.", "He thought people should learn from failure.", "He had a lot of failed products."], ["According to West, most new products…", "are very funny.", "fail.", "are successful."], ["What does West say about failure?", "It's better to avoid trying new things.", "People shouldn't be embarrassed by it.", "Big companies never fail."], ["How did the visitor feel after the museum?", "disappointed", "more confident about mistakes", "embarrassed"]]},

r:{title:"Lucky socks and other superstitions",k:"BBBAC",text:["Many top athletes have superstitions – small things they do before or during a match because they believe it will bring them luck.", "The tennis player Serena Williams used to wear the same pair of socks for every match during a tournament, and she always bounced the ball five times before her first serve. She once said that when she didn't follow her routine, she lost.", "The Spanish player Rafael Nadal is famous for his rituals. Before every point, he touches his shirt, his nose and his ears in the same order. He also puts his water bottles in an exact position next to his chair, with the labels facing the court. Nadal says it isn't really superstition – it's a way of concentrating.", "Football players have superstitions too. Some always put their left boot on first; others won't change their hairstyle while their team is winning. One famous goalkeeper used to kiss the head of a team-mate before every match because the team had won the first time he did it.", "Psychologists say these habits can actually help. When players are very nervous, doing the same thing every time gives them a feeling of control. However, it can become a problem if a player forgets a lucky object and then can't play well because they are worried about it."],q:[["What did Serena Williams use to do during a tournament?", "change her socks every game", "wear the same socks for every match", "bounce the ball ten times"], ["What does Nadal do with his water bottles?", "gives them to the fans", "puts them in exactly the same position", "drinks from them before every point"], ["How does Nadal explain his rituals?", "They bring him luck.", "They help him concentrate.", "His coach told him to do them."], ["Why did the goalkeeper kiss a team-mate's head?", "The team had won when he first did it.", "The team-mate asked him to.", "It was a team tradition."], ["According to psychologists, what can be a problem?", "not being nervous before a match", "having too many routines", "worrying when you forget a lucky object"]]},
l:{setting:"You will hear a woman called Helen telling a friend how her grandparents met.",k:"AABBA",script:[["Friend", "So how did your grandparents meet?"], ["Helen", "It's a lovely story. In 1962, my grandmother was working in a bookshop in Manchester. One rainy afternoon, a young man came in to buy a book about football."], ["Friend", "Your grandfather?"], ["Helen", "Yes. He was playing for a local team at the time. Anyway, he didn't have enough money, so she lent him two shillings."], ["Friend", "How romantic!"], ["Helen", "Well, the next day he came back to pay her, and he asked her to go to the cinema with him. She said no at first because she already had a boyfriend!"], ["Friend", "Oh no! So what happened?"], ["Helen", "He came back to the shop every week for three months. In the end, she broke up with the other boyfriend and agreed to go out with him. They got married a year later."], ["Friend", "Did they stay together?"], ["Helen", "For fifty-five years. They used to go to the cinema every Friday, all their lives."]],q:[["Where did Helen's grandmother work?", "in a bookshop", "in a football club", "in a cinema"], ["Why did the grandmother lend him money?", "He didn't have enough for a book.", "He needed a cinema ticket.", "He had lost his wallet."], ["Why did she say no to the cinema at first?", "She didn't like films.", "She already had a boyfriend.", "She had to work."], ["How long did he keep visiting the shop?", "one year", "three months", "three weeks"], ["What did they use to do every Friday?", "go to the cinema", "visit the bookshop", "go to football matches"]]},

r:{title:"The village that became a film set",k:"CBBBC",text:["Matamata is a small farming town in New Zealand. For many years, nothing very exciting happened there. Then, in 1998, a film director flying over the area in a helicopter saw a farm with green hills, a lake and a huge tree. It was exactly what he was looking for.", "The director was Peter Jackson, and he was looking for a place to film The Lord of the Rings. The farm belonged to the Alexander family. They had no idea who Jackson was when he first knocked on their door.", "Over the next year, a village for the hobbits – called Hobbiton – was built on the farm. Thirty-nine small houses were made, with round doors built into the hills. When filming finished, most of the set was taken down.", "But the story didn't end there. Fans started arriving from all over the world, asking to see the place. In 2011, when The Hobbit films were made, Hobbiton was rebuilt – this time using stone and wood so that it would last. Today, the set is visited by about 650,000 tourists a year.", "The Alexanders still have sheep on the farm, but tourism is now their main business. “We must be the luckiest farmers in New Zealand,” says one of the family."],q:[["How did Peter Jackson find the farm?", "The Alexander family wrote to him.", "A fan told him about it.", "He saw it from a helicopter."], ["What did the Alexander family think when Jackson arrived?", "They were very excited.", "They didn't know who he was.", "They didn't want to help him."], ["What happened to most of the set after the first films?", "It was given to a museum.", "It was taken down.", "It was sold to fans."], ["Why was Hobbiton rebuilt with stone and wood?", "because the director wanted a different look", "so that it would last a long time", "because it was cheaper"], ["What is the family's main business now?", "making films", "sheep farming", "tourism"]]},

r:{title:"The school with no exams",k:"AAAAA",text:["At Green Valley School in the south of England, there are no exams until students are fifteen. There are no school bells either, and students – from five to sixteen years old – can choose whether to go to lessons or not.", "It sounds like every child's dream. But head teacher Laura Price says it isn't as easy as it seems. “If students don't go to lessons, they won't learn to read or do maths. And they know that. So most of them go.” Students who don't want to study can play outside, read in the library or work in the school garden.", "The school is run by a meeting every Wednesday, where students and teachers vote on the school rules. Each person has one vote – the head teacher and a seven-year-old have exactly the same power. Last year, students voted to have no phones at lunch.", "Not everyone likes the system. Some parents worry that their children won't do well when they take national exams. But in fact, the school's exam results are about the same as other schools in the area.", "Former student Tom Ellis, who is now a doctor, says the school taught him something important. “If you choose to learn something, you'll work harder at it. Nobody made me study biology. I did it because I loved it.”"],q:[["What is unusual about Green Valley School?", "Students can choose whether to go to lessons.", "Lessons start at fifteen.", "There are no teachers."], ["According to Laura Price, why do most students go to lessons?", "They know they need to learn.", "Their parents make them.", "They are punished if they don't."], ["How are school rules decided?", "Everyone at the meeting votes.", "The head teacher decides.", "Parents decide."], ["What does the text say about the school's exam results?", "They are similar to other local schools.", "They are much worse than other schools.", "They are the best in England."], ["What did Tom Ellis learn at the school?", "You work harder when you choose to learn.", "Exams are important.", "Biology is the most important subject."]]},

r:{title:"Secret shoppers",k:"BABCC",text:["Imagine being paid to go shopping. For thousands of “mystery shoppers”, this is part of their job. Companies pay them to visit their shops, restaurants and hotels, pretending to be ordinary customers, and then report on what they saw.", "Gulnara, 28, has been a mystery shopper in Astana for three years. “Last week I went to a clothes shop,” she says. “I had to try on two things, ask the assistant if they had a different colour, and then ask whether I could return something without a receipt.” Afterwards, she wrote a report: how long she waited, if the assistant smiled, and whether the shop was clean.", "Mystery shoppers are not paid very much – usually between 3,000 and 10,000 tenge for each visit – but they can often keep what they buy or eat. “I've had free dinners in some of the best restaurants in the city,” Gulnara says.", "It isn't always fun, though. You have to remember lots of details without writing anything down, and some visits are boring. “Once I had to buy the same sandwich at five different cafés in one day,” she laughs.", "Companies say mystery shopping helps them to improve. But some shop assistants don't like it. One told a newspaper that she felt as if she was always being watched."],q:[["What do mystery shoppers do?", "help customers with complaints", "visit businesses and report on them", "sell products in shops"], ["What did Gulnara have to ask in the clothes shop?", "if she could return something without a receipt", "where the manager was", "how much the clothes cost"], ["What is one advantage of the job?", "It is a full-time job.", "Shoppers can often keep what they buy.", "It is very well paid."], ["What is difficult about the job?", "talking to managers", "writing very long reports", "remembering details without notes"], ["How do some shop assistants feel about mystery shoppers?", "They think it helps them get promoted.", "They enjoy meeting them.", "They don't like feeling watched."]]},

r:{title:"A week without my smartphone",k:"BBBAA",text:["Last month, journalist Nurlan Seitkali tried an experiment: he gave his smartphone to his sister and used an old phone that could only make calls and send texts. He did it for seven days.", "“The first morning was terrible,” he writes. “I usually check my messages before I get out of bed. Without my phone, I didn't know what to do. If I'd had a book next to the bed, it would have been easier.”", "Some things were much more difficult than he expected. He got lost twice because he didn't have a map, and he missed a meeting because he had forgotten to write it down. He also couldn't pay for his coffee with his phone, so he had to go to a cash machine for the first time in months.", "But there were good things too. Nurlan noticed that he had much more time. In the evenings, instead of looking at a screen, he cooked, read two books and phoned old friends. He also slept better – on average about forty minutes more each night.", "At the end of the week, he was happy to get his smartphone back. “I'm not going to live without it,” he says. “But I've deleted three apps, and I don't take my phone into the bedroom any more. If I hadn't done the experiment, I would never have realized how much time I was wasting.”"],q:[["What kind of phone did Nurlan use during the week?", "his sister's smartphone", "a phone for calls and texts only", "a new smartphone"], ["What does Nurlan say about the first morning?", "He enjoyed the quiet.", "A book would have helped.", "He slept very late."], ["Why did Nurlan miss a meeting?", "He got lost.", "He forgot to write it down.", "His phone didn't work."], ["What happened to Nurlan's sleep?", "He slept longer.", "It didn't change.", "He slept less."], ["What has Nurlan changed since the experiment?", "He doesn't keep his phone in the bedroom.", "He has bought an old phone.", "He has stopped using a smartphone."]]},
l:{setting:"You will hear two friends, Amy and Josh, talking about a lucky day.",k:"BAAAB",script:[["Josh", "You look happy. What's happened?"], ["Amy", "I've just had the luckiest morning of my life! My bus was late, so I took a taxi instead."], ["Josh", "That doesn't sound very lucky."], ["Amy", "Wait. The taxi driver had the radio on, and they were doing a competition. The question was about an old film I love, so I called them from the taxi."], ["Josh", "And?"], ["Amy", "I won! Two tickets to London and three nights in a hotel."], ["Josh", "No way! So if the bus had come on time…"], ["Amy", "…I wouldn't have heard the competition. Exactly. And I nearly didn't call because my battery was almost dead."], ["Josh", "Unbelievable. So who are you taking with you?"], ["Amy", "Well, it depends. How much do you like London?"]],q:[["Why did Amy take a taxi?", "It was raining.", "Her bus was late.", "She was going to the airport."], ["How did Amy hear about the competition?", "on the taxi driver's radio", "on TV", "from a friend"], ["What was the competition question about?", "a film", "London", "a song"], ["What did Amy win?", "a trip to London", "a new phone", "cinema tickets"], ["What nearly stopped Amy from calling?", "The taxi driver didn't let her.", "Her phone battery was low.", "She didn't know the answer."]]},

r:{title:"The day the Mona Lisa disappeared",k:"CCCCA",text:["On the morning of Tuesday 22nd August 1911, a painter walked into the Louvre museum in Paris to paint a copy of the Mona Lisa. But when he got to the wall where it usually hung, there were only four metal hooks. The most famous painting in the world had gone.", "At first, the museum staff thought it had been taken away to be photographed. By the afternoon, they realized it had been stolen. The museum was closed for a week, and the police started a huge investigation. Even the artist Pablo Picasso, who knew some people involved in an earlier theft from the museum, was questioned.", "In fact, the thief was Vincenzo Peruggia, an Italian man who had worked at the Louvre. He had hidden in the museum overnight, taken the painting off the wall in the morning, and simply walked out with it under his coat.", "For two years, Peruggia kept the Mona Lisa in his small flat in Paris. Then, in 1913, he took it to Florence and tried to sell it to an art dealer. The dealer, who was suspicious, called the police, and Peruggia was arrested.", "Peruggia said he had wanted to take the painting back to Italy, where it belonged. He spent only a few months in prison. And the Mona Lisa, which had been a fairly well-known painting before 1911, became the most famous painting in the world."],q:[["Who first noticed that the painting was missing?", "a police officer", "a photographer", "a painter"], ["What did the museum staff think at first?", "It had fallen off the wall.", "It had been stolen.", "It was being photographed."], ["Why was Picasso questioned?", "He had painted a copy of the Mona Lisa.", "He worked at the Louvre.", "He knew people connected to another theft."], ["How did Peruggia get the painting out of the museum?", "He climbed out of a window.", "He put it in a box.", "He hid it under his coat."], ["What does the text say about the Mona Lisa after the theft?", "It became much more famous.", "It was damaged.", "It stayed in Italy."]]},
l:{setting:"You will hear a police officer talking to a witness.",k:"CABCB",script:[["Officer", "Thank you for waiting. Can you tell me what you saw?"], ["Witness", "Yes. I was standing at the bus stop at about half past four when I saw a man running out of the jewellery shop."], ["Officer", "What did he look like?"], ["Witness", "He was quite tall, with short dark hair. He was wearing a grey jacket and jeans."], ["Officer", "Did you see his face?"], ["Witness", "Only for a second. He had a beard – that's what I remember most."], ["Officer", "And where did he go?"], ["Witness", "He jumped into a white van that was waiting outside the bank. There was another person driving it."], ["Officer", "You didn't see the number plate, did you?"], ["Witness", "Part of it. It started with K and the number seven. Sorry, it all happened so fast."], ["Officer", "That's very helpful. Thank you."]],q:[["What time did the robbery happen?", "about 4.00", "about 5.30", "about 4.30"], ["What was the man wearing?", "a grey jacket and jeans", "a black jacket and jeans", "a grey suit"], ["What does the witness remember most about his face?", "his glasses", "his beard", "his hair"], ["How did the man escape?", "on a motorbike", "on foot", "in a white van"], ["What does the witness remember about the number plate?", "Nothing at all.", "It started with K and had a seven.", "It was all sevens."]]},

r:{title:"Learning to drive at 70",k:"BCBCC",text:["Most people learn to drive when they are teenagers. Rosa Fernández waited a little longer. Last spring, at the age of 70, she passed her driving test at the first attempt.", "Rosa had never needed a car. For forty years she lived in the centre of Madrid, where she used to take the metro everywhere. But two years ago she moved to a small village to be near her daughter, and there was only one bus a day.", "“I felt like a prisoner,” she says. “If I wanted to go shopping or see a doctor, I had to ask someone to drive me.” So she booked some lessons.", "At first, it wasn't easy. “My instructor was 25 and very patient,” she laughs. “I was terrified on the motorway, and I couldn't park at all.” She had lessons twice a week for eight months.", "Now Rosa drives to the market every Saturday and visits friends in the next village. She has even driven to the coast, which is 200 kilometres away. “I should have done it years ago,” she says. “But it's never too late to learn something new.”"],q:[["Why didn't Rosa need a car in Madrid?", "She couldn't afford one.", "She used the metro.", "Her daughter drove her everywhere."], ["Why did Rosa decide to learn to drive?", "She wanted to drive to the coast.", "Her daughter told her to.", "There was very little public transport in her village."], ["What was difficult for her at first?", "understanding her instructor", "driving on the motorway and parking", "paying for lessons"], ["How long did she have lessons for?", "two years", "two weeks", "eight months"], ["What does Rosa say now?", "She's too old to drive far.", "She prefers taking the bus.", "She wishes she had learned earlier."]]},
l:{setting:"You will hear part of a radio programme about money. A listener, Karen, is talking to the presenter.",k:"ABAAB",script:[["Presenter", "Karen, you've managed to save quite a lot of money this year, haven't you?"], ["Karen", "Yes. I've saved four thousand pounds since January. I'm saving for a deposit on a flat."], ["Presenter", "That's impressive. How did you do it?"], ["Karen", "Small things, mostly. I used to buy lunch every day, but now I take sandwiches to work. That saves me about thirty pounds a week."], ["Presenter", "And anything else?"], ["Karen", "I've stopped taking taxis. I cycle everywhere now – it's cheaper, and I'm fitter than I've ever been."], ["Presenter", "Has it been difficult?"], ["Karen", "Sometimes. My friends go out a lot, and I can't always go with them. But I'm going to buy my first flat next year, so it's worth it."]],q:[["How much has Karen saved since January?", "£4,000", "£400", "£3,000"], ["What is she saving for?", "a holiday", "a deposit on a flat", "a new bike"], ["How much does she save by taking sandwiches?", "about £30 a week", "about £3 a day", "about £30 a month"], ["How does she travel now?", "by bike", "by taxi", "by bus"], ["What is sometimes difficult for Karen?", "making sandwiches", "not going out with friends", "cycling in bad weather"]]},
