<script>
(function(){
const L=['A','B','C'];
const ALLSECS=[
 {k:'g',name:'Grammar',max:20},{k:'v',name:'Vocabulary',max:20},{k:'p',name:'Pronunciation',max:10},
 {k:'r',name:'Reading',max:10},{k:'l',name:'Listening',max:10},{k:'s',name:'Speaking',max:30}];
function secsFor(t){return ALLSECS.filter(s=>t[s.k]).map(s=>Object.assign({},s,{max:(s.k==='g'||s.k==='v'||s.k==='p')?t[s.k].q.length:(s.k==='r'||s.k==='l')?t[s.k].q.length*(t.rw||2):s.k==='s'?t.s.tasks.length*10:s.max}))}
const COLLECTIONS=[
 {name:'Entry test',ids:TESTS.filter(t=>t.kind==='entry').map(t=>t.id)},
 {name:'Quick tests',ids:TESTS.filter(t=>t.kind==='quick').map(t=>t.id)},
 {name:'File tests',ids:TESTS.filter(t=>t.kind==='file').map(t=>t.id)},
 {name:'Progress tests',ids:TESTS.filter(t=>t.kind==='progress').map(t=>t.id)},
 {name:'End-of-course test',ids:TESTS.filter(t=>t.kind==='end').map(t=>t.id)}];
const KEY='ifa-ef-b1-testcentre-v1';
let state;
try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}
if(!state||typeof state!=='object')state={mode:'practice',name:'',cls:'',cur:TESTS[0].id,sec:'g',tests:{},theme:''};
if(!TESTS.find(t=>t.id===state.cur))state.cur=TESTS[0].id;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const T=()=>TESTS.find(t=>t.id===state.cur);
function ts(id){if(!state.tests[id])state.tests[id]={a:{g:{},v:{},p:{},r:{},l:{}},s:{},marked:false,plays:0};return state.tests[id]}

/* theme */
const themeSel=$('#theme');
function applyTheme(){if(state.theme)document.documentElement.setAttribute('data-theme',state.theme);else document.documentElement.removeAttribute('data-theme');themeSel.value=state.theme||''}
themeSel.onchange=()=>{state.theme=themeSel.value;applyTheme();save()};
applyTheme();

/* scoring */
function secData(t,k){if(k==='r')return{q:t.r.q,k:t.r.k,w:t.rw||2};if(k==='l')return{q:t.l.q,k:t.l.k,w:t.rw||2};return{q:t[k].q,k:t[k].k,w:1}}
function secScore(t,k){const st=ts(t.id);if(k==='s')return Object.values(st.s).reduce((a,b)=>a+b,0);const d=secData(t,k);let c=0;for(const i in st.a[k]){if(L[st.a[k][i]]===d.k[i])c+=d.w}return c}
function secDone(t,k){const st=ts(t.id);if(k==='s')return Object.keys(st.s).length;return Object.keys(st.a[k]).length}
function secCount(t,k){if(k==='s')return t.s.tasks.length;return secData(t,k).q.length}
const reveal=t=>state.mode==='practice'||ts(t.id).marked;
function band(p){if(p>=90)return'Excellent';if(p>=75)return'Good';if(p>=60)return'Satisfactory';if(p>=40)return'Needs revision';return'Needs a lot of revision'}

/* text formatting */
function fmtPron(s){return esc(s).replace(/\*(.+?)\*/g,'<b class="snd">$1</b>').replace(/_(.+?)_/g,'<u class="str">$1</u>')}
function fmtStem(s,filled){
  return s.split('\n').map(line=>{
    let m=line.match(/^([AB]):\s*(.*)$/);let pre='';
    if(m){pre='<span class="spk">'+m[1]+'</span>';line=m[2]}
    const parts=line.split(/_{3,}/);
    return pre+parts.map(esc).join(filled!=null?'<span class="blank filled">'+esc(filled)+'</span>':'<span class="blank" aria-label="gap"></span>')
  }).join('<br>');
}

/* nav */
function renderNav(){
  let h='';
  for(const c of COLLECTIONS){
    h+='<h2>'+esc(c.name)+'</h2>';
    if(!c.ids.length){h+=c.link?'<p class="soon"><a href="'+c.link+'" target="_blank" rel="noopener" style="color:inherit">'+esc(c.linkText)+'</a></p>':'<p class="soon">Not added yet</p>';continue}
    h+='<ul>';
    for(const id of c.ids){const t=TESTS.find(x=>x.id===id);const tot=secsFor(t).reduce((a,s)=>a+secScore(t,s.k),0);const any=secsFor(t).some(s=>secDone(t,s.k)>0);
      h+='<li><button data-test="'+id+'" aria-current="'+(id===state.cur)+'"><span>'+esc(t.title)+'</span><span class="mini">'+(any&&reveal(t)?tot:'')+'</span></button></li>'}
    h+='</ul>';
  }
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>goTest(b.dataset.test));
}
function goTest(id){stopAudio();stopTimer();state.cur=id;state.sec='g';save();renderAll();window.scrollTo(0,0)}

/* main */
function renderMain(){
  const t=T(),st=ts(t.id),SECS=secsFor(t);if(!SECS.find(s=>s.k===state.sec))state.sec='g';
  let h='<div class="mobile-pick"><label for="mpick" class="sub" style="font-size:.85rem;color:var(--muted)">Test</label><select id="mpick">'+TESTS.map(x=>'<option value="'+x.id+'"'+(x.id===t.id?' selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select></div>';
  h+='<section class="head"><h1>'+esc(t.title)+'</h1><p class="focus">'+esc(t.focus)+'</p><div class="who">'+
     '<label>Student name<input id="sname" value="'+esc(state.name)+'" autocomplete="off"></label>'+
     '<label>Class<input id="sclass" value="'+esc(state.cls)+'" autocomplete="off" style="min-width:110px"></label>'+
     '<div class="mode" role="group" aria-label="Marking mode"><button data-mode="practice" aria-pressed="'+(state.mode==='practice')+'">Instant marking</button><button data-mode="exam" aria-pressed="'+(state.mode==='exam')+'">Exam mode</button></div>'+
     '<p class="modehint">'+(state.mode==='practice'?'Each answer is marked as soon as it is chosen, and the score updates live. First answer counts.':'Answers stay hidden until you press “Mark test”. Answers can be changed until then.')+'</p></div></section>';
  h+='<div class="tabs" role="tablist">'+SECS.map(s=>{const done=secDone(t,s.k),n=secCount(t,s.k);const b=reveal(t)?secScore(t,s.k)+'/'+s.max:done+'/'+n;return'<button role="tab" data-sec="'+s.k+'" aria-selected="'+(state.sec===s.k)+'">'+s.name+'<span class="badge">'+b+'</span></button>'}).join('')+'</div>';
  h+='<section class="sec" id="sec">'+renderSec(t,state.sec)+'</section>';
  const i=SECS.findIndex(s=>s.k===state.sec);
  h+='<div class="pager">'+(i>0?'<button data-go="'+SECS[i-1].k+'">Back to '+SECS[i-1].name+'</button>':'<span></span>')+(i<SECS.length-1?'<button data-go="'+SECS[i+1].k+'">Continue to '+SECS[i+1].name+'</button>':'<span></span>')+'</div>';
  const m=$('#main');m.innerHTML=h;
  $('#mpick').onchange=e=>goTest(e.target.value);
  $('#sname').oninput=e=>{state.name=e.target.value;save();renderLedger()};
  $('#sclass').oninput=e=>{state.cls=e.target.value;save();renderLedger()};
  m.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();renderAll()});
  m.querySelectorAll('[data-sec],[data-go]').forEach(b=>b.onclick=()=>{stopAudio();stopTimer();state.sec=b.dataset.sec||b.dataset.go;save();renderAll();$('.tabs').scrollIntoView({block:'start'})});
  bindSec(t);
}

function qBlock(t,k,i,item,isPron){
  const st=ts(t.id),d=secData(t,k),ch=st.a[k][i],rv=reveal(t),right=L.indexOf(d.k[i]);
  const stem=isPron?null:item[0],opts=isPron?item:item.slice(1);
  const locked=(state.mode==='practice'&&ch!=null)||st.marked;
  let h='<div class="q" id="q-'+k+'-'+i+'"><div class="n">'+(i+1)+'</div><div>';
  if(stem!=null)h+='<div class="stem">'+fmtStem(stem,(ch!=null&&stem.indexOf('___')>-1)?opts[ch]:null)+'</div>';
  h+='<div class="opts">';
  opts.forEach((o,j)=>{let c='opt';
    if(ch===j)c+=' sel';
    if(rv&&ch!=null){if(j===ch)c+=(j===right?' ok':' no');else if(j===right)c+=' key'}

  synth.cancel();

  const base=chosenVoice?voices.find(v=>v.name===chosenVoice):voices[0];
  const pool=chosenVoice?[base]:voices.slice(0,4);
  const pitches=[1,1.18,0.88,1.08];
  const q=[];
  t.l.script.forEach((ln,li)=>{
    const si=speakers.indexOf(ln[0]);

    (ln[1].match(/[^.!?…]+[.!?…]*[”"’']?\s*/g)||[ln[1]]).forEach(s=>{s=s.trim();if(!s)return;

  q.forEach(u=>{u.onerror=()=>{playing=false}});
  q.forEach(u=>synth.speak(u));

const HASF=typeof FK==='function';
const isF=t=>HASF&&FK(t);
const RT={ready:false,user:null,db:null,dl:null,owner:false,uid:null,canWrite:null,sync:'local',all:[],remote:null,writeErr:null};

/* answers and marks are stored as JSON strings so each write replaces them (the class record merges nested objects) */
function recA(r){if(!r)return {};if(typeof r.aj==='string'){try{return JSON.parse(r.aj)}catch(e){}}return r.a||{}}
function recTM(r){if(!r)return null;if(typeof r.tmj==='string'){try{return JSON.parse(r.tmj)}catch(e){}}return r.tm||null}
const teacherSec=k=>k==='s'||k==='w';

/* score any stored record with the engine's own scoring */
function withRec(t,r,fn){
  const had=Object.prototype.hasOwnProperty.call(state.tests,t.id),orig=state.tests[t.id];
  const tm=recTM(r)||{},a=JSON.parse(JSON.stringify(recA(r)));
  if(!isF(t))['g','v','p','r','l'].forEach(k=>{if(!a[k])a[k]={}});
  const rec={a,s:Object.assign({},tm.s||{}),marked:true,plays:0};
  if(isF(t))rec.w={text:r.wt||'',mark:tm.w==null?null:tm.w};
  state.tests[t.id]=rec;
  try{return fn()}finally{if(had)state.tests[t.id]=orig;else delete state.tests[t.id]}
}
function recScore(t,r){return withRec(t,r,()=>{
  const S=secsFor(t),secs={};let tot=0,auto=0,autoMax=0,pending=false,answered=0,items=0;
  S.forEach(s=>{const sc=secScore(t,s.k);secs[s.k]=sc;tot+=sc;
    if(teacherSec(s.k)){if(!secDone(t,s.k))pending=true}
    else{auto+=sc;autoMax+=s.max;answered+=secDone(t,s.k);items+=secCount(t,s.k)}});
  return {secs,tot,auto,autoMax,pending,answered,items,S,max:S.reduce((a,s)=>a+s.max,0)}})}

/* ---------- result codes ---------- */
function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function pack(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if('CompressionStream' in window){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return 'IFA1.'+b64u(buf)}catch(e){}}
  return 'IFA0.'+b64u(raw)}
async function unpack(code){{const mm=String(code).match(/IFA[01]\.[A-Za-z0-9_-]+/);if(mm)code=mm[0]}code=String(code).trim().replace(/\s+/g,'');const m=code.match(/^IFA([01])\.(.+)$/);if(!m)throw new Error('This doesn’t look like an IF Academy result code.');
  let bytes=unb64u(m[2]);if(m[1]==='1'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(bytes))}

setTimeout(ifPullMarks,2500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)ifPullMarks()});

/* ---------- saving to the class record ---------- */
let saveTimer=null,syncing=false,syncAgain=false,lastSent={};const docExists={};
function recordFor(t){const st=ts(t.id);const r={aj:JSON.stringify(st.a||{}),wt:isF(t)?(fw(t).text||''):'',marked:!!st.marked,handed:!!st.handed,mode:state.mode};
  if(RT.owner)r.tmj=JSON.stringify({s:st.s||{},w:isF(t)?(fw(t).mark==null?null:fw(t).mark):null});return r}
function currentKey(){if(RT.owner){if(!state.name.trim())return null;return 'dev-'+slug(state.name)+'--'+slug(state.cls)}return RT.uid}
function queueSync(now){if(!RT.db||(RT.sync!=='live'&&!RT.owner))return;clearTimeout(saveTimer);saveTimer=setTimeout(doSync,now?50:2500)}
async function doSync(){
  if(syncing){syncAgain=true;return}
  const key=currentKey();if(!key||!RT.db)return;const t=T();if(!t)return;
  const rec=recordFor(t);const sig=key+'|'+t.id+'|'+state.name+'|'+state.cls+'|'+JSON.stringify(rec);if(lastSent[key+'|'+t.id]===sig)return;
  syncing=true;
  try{
    rec.upd=new Date().toISOString();
    const ref=RT.db.doc('results/'+key);
    const head={name:state.name||'',cls:state.cls||'',updated:rec.upd,src:RT.owner?'device':'student'};
    if(!docExists[key]){const g=await ref.get();docExists[key]=g.exists;
      if(!g.exists){await ref.set(Object.assign({},head,{tests:{[t.id]:rec}}));docExists[key]=true}
      else await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}))}
    else await ref.update(Object.assign({},head,{tests:{[t.id]:rec}}));
    lastSent[key+'|'+t.id]=sig;RT.writeErr=null;
  }catch(e){
    if(!RT.owner&&e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='permission_denied')){RT.sync='code';RT.writeErr=null;renderAll()}
    else if(e&&e.code==='quota_exceeded'){RT.writeErr='The class record is full. Ask your teacher to remove old results.';renderLedger()}
    else if(e&&e.code==='unavailable'){setTimeout(()=>queueSync(),4000)}
  }
  syncing=false;if(syncAgain){syncAgain=false;doSync()}
}
function applyTeacherMarks(){
  if(!studentLocked()||!RT.remote||!RT.remote.tests)return false;let changed=false;
  for(const id in RT.remote.tests){const t=TESTS.find(x=>x.id===id);if(!t)continue;const tm=recTM(RT.remote.tests[id]);if(!tm)continue;
    const st=ts(id);const s=tm.s||{};if(JSON.stringify(st.s||{})!==JSON.stringify(s)){st.s=Object.assign({},s);changed=true}
    if(isF(t)){const W=fw(t),wm=tm.w==null?null:tm.w;if(W.mark!==wm){W.mark=wm;changed=true}}}
  return changed;
}
function subscribeMine(){try{RT.db.doc('results/'+RT.uid).onSnapshot(s=>{RT.remote=s.exists?JSON.parse(JSON.stringify(s.data()||{})):null;if(s.exists)docExists[RT.uid]=true;
  if(applyTeacherMarks()){_save();renderAll()}},e=>{})}catch(e){}}
function subscribeAll(){try{RT.db.collection('results').onSnapshot(s=>{RT.all=s.docs.map(d=>Object.assign({_id:d.id},JSON.parse(JSON.stringify(d.data()||{}))));
  if(state.view==='teacher'){renderTeacher(true);renderTeacherLedger()}else{const c=$('#vcount');if(c)c.textContent=RT.all.length?RT.all.length+' student'+(RT.all.length===1?'':'s'):'class record'}},e=>{})}catch(e){}}
async function initRuntime(){
  if(!window.claude||typeof window.claude.use!=='function'){RT.ready=true;RT.sync='local';return}
  let user=null,db=null,dl=null;
  try{[user,db,dl]=await Promise.all([claude.use('user'),claude.use('db'),claude.use('downloads')])}catch(e){}
  RT.user=user;RT.db=db;RT.dl=dl;
  if(user){try{RT.owner=await user.isOwner();RT.uid=await user.id();RT.canWrite=await user.can('data.write')}catch(e){}}
  if(RT.owner&&db){RT.sync='owner';subscribeAll()}
  else if(db&&user&&RT.uid&&RT.canWrite!==false){RT.sync='live';subscribeMine()}
  else if(user){RT.sync='code'}
  else RT.sync='local';
  if(!RT.owner&&state.view==='teacher')state.view='tests';
  RT.ready=true;renderAll();
}

function rateRow(attr,i,max,cur,label){let h='<div class="rate crit" role="group" aria-label="'+esc(label)+'"><span class="lab">'+esc(label)+'</span>';for(let n=0;n<=max;n++)h+='<button '+attr+'="'+i+'" data-n="'+n+'" aria-pressed="'+(cur===n)+'">'+n+'</button>';return h+'</div>'}
const clean=s=>String(s==null?'':s).replace(/[*_]/g,'');

    const q=it.t==='ord'?it.wd.join(' / '):it.t==='syl'?it.o.join('·'):clean(it.s||'').replace(/_{3,}/g,'___');
    const opt=j=>(it.abcd||it.gap?L8[j]+'  ':'')+clean(it.o[j]);
    let ans='—';if(v!=null){if(it.t==='mc')ans=opt(v);else if(it.t==='syl')ans=it.o.map((o,j)=>j===v?o.toUpperCase():o).join('');else if(it.t==='ms')ans=v.map(opt).join(', ');else ans=v.v||'—'}

/* students who save live: approvals, extra time, and a test this device lost */
function rtOnRemote(){
  if(RT.owner||!RT.remote||!RT.remote.tests)return false;let ch=false;
  const sig=JSON.stringify(Object.keys(RT.remote.tests).map(id=>{const R=RT.remote.tests[id]||{};return [id,R.att||1,R.ok||0,R.rq||0,R.tx||0]}));
  if(sig!==RTK.sig){RTK.sig=sig;ch=true}
  for(const id in RT.remote.tests){const t=TESTS.find(x=>x.id===id);const R=RT.remote.tests[id];if(!t||!R)continue;
    const cur=state.tests[id],ratt=R.att||1,latt=tAtt(cur);
    if(cur&&cur.clearTM&&ratt>=latt){cur.clearTM=false;ch=true}
    if(ratt>latt||(ratt===latt&&(((R.marked||R.handed)&&!(cur&&(cur.marked||cur.handed)))||(R.t0>0&&!(cur&&cur.t0))))){AD.restore(t,R);const n=state.tests[id];n.t0=R.t0||null;n.tout=!!R.tout;ch=true}
    const st=state.tests[id];
    if(st&&ratt===tAtt(st)&&(R.tx||0)!==(st.txs||0)){st.txs=R.tx||0;ch=true;
      if(st.tout){delete st.tend;if(tmLeft(t)>0){st.tout=false;st.marked=false;st.handed=false}else st.tend=Date.now()}}}
  if(ch)rtLocal();
  return ch;
}

/* adapter: English File A1/A2/B1/B2 engine */
const AD={
 sum(t){const S=secsFor(t);return {tot:S.reduce((a,s)=>a+secScore(t,s.k),0),max:S.reduce((a,s)=>a+s.max,0)}},
 firstSec(t){return secsFor(t)[0].k},
 anyAnswered(t){return secsFor(t).some(s=>!teacherSec(s.k)&&secDone(t,s.k)>0)},
 restore(t,R){delete state.tests[t.id];const ns=ts(t.id);const a=recA(R);if(!isF(t))['g','v','p','r','l'].forEach(k=>{if(!a[k])a[k]={}});
   ns.a=a;ns.marked=!!R.marked;ns.handed=!!R.handed;ns.seen=!!(R.seen||R.marked||R.handed);ns.att=R.att||1;ns.hist=rtHist(R.hj);if(isF(t)&&R.wt)fw(t).text=R.wt},
 secInfo(t){return secsFor(t).map(s=>{let items=0,words=0;
   if(isF(t)){const sec=fsec(t,s.k);if(s.k!=='w'&&s.k!=='s')items=fitems(sec).length;words=wordsIn(sec)}
   else if(s.k!=='s'){const o=t[s.k];items=o.q.length;words=s.k==='r'?wordsIn(o.text):s.k==='l'?wordsIn(o.script):0}
   return {k:s.k,name:s.name,items,words}})},
 rate(t){return isF(t)?0.6:0.5},rRate(t){return 1},writeMins(t){return 20}
};

/* ---------- class lists: students pick their name, so each student is spelled one way everywhere ---------- */
const IF_ROSTER={
 'B2 Teen B':['Yeva Maslova','Evelina Galimzhanova','Polina Kisselyova','Zere Shunusheva'],
 'B2 Group A':['Amina Kassymova','Ekaterina Makii','Luiza Abramian','Malika Bulatova'],
 'B1 B':['Ameliya Zainullina','Kiana Brisheva','Liana Berezhnaya','Milana Berezhnaya','Nurdaulet Makhmutov','Zhan Kabayev','Amani Tuebaeva'],
 'B1 C':['Adiya Imekeeva','Iskander Kaiyr','Vilgelm Zuderman','Zhangir Mentaev'],
 'B1 D':['Amin Gusseinly','Amir Atibekov','Ansar Mukashev','Karimova Anel','Margarita Podoynikova']};
const rKey=s=>ifTr(String(s||'').toLowerCase()).normalize('NFKD').replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
function rosterName(cls,name){const L=IF_ROSTER[normCls(cls)]||[],k=rKey(name);if(!k)return null;
  const ks=k.split(' ').sort().join(' ');
  const lv=(a,b)=>{let p=Array.from({length:b.length+1},(_,j)=>j);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]};
  const near=L.filter(n=>{const x=rKey(n).split(' ').sort().join(' ');return k.indexOf(' ')>0&&lv(x,ks)<=Math.max(1,Math.floor(x.length/8))});
  return L.find(n=>rKey(n)===k||rKey(n).split(' ').sort().join(' ')===ks)||(k.indexOf(' ')<0?L.filter(n=>rKey(n).split(' ')[0]===k).length===1&&L.find(n=>rKey(n).split(' ')[0]===k):null)||(near.length===1?near[0]:null)}
function fixName(){const c=rosterName(state.cls,state.name);if(c&&c!==state.name){state.name=c;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}}

const _rUnpack=unpack;unpack=async function(c){const o=await _rUnpack(c);if(o&&typeof o==='object'){const k=rosterName(o.c,o.n);if(k)o.n=k}return o};
/* ---------- safer imports: match existing students; accept IFR1 result messages ---------- */
function lvN(a,b){let p=Array.from({length:b.length+1},(_,j)=>j);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
/* the name already saved for this student in this class (exact, word order, first name only, or a 1-letter typo — only when it points to one student) */
function knownStudent(n,c){const cc=normCls(c),k=rKey(n);if(!k)return null;const ks=k.split(' ').sort().join(' ');
  const names=[...new Set((RT.all||[]).filter(d=>normCls(d.cls)===cc&&d.name).map(d=>d.name).concat(IF_ROSTER[cc]||[]))];
  const ex=names.find(x=>rKey(x)===k||rKey(x).split(' ').sort().join(' ')===ks);if(ex)return ex;
  if(k.indexOf(' ')<0){const f=names.filter(x=>rKey(x).split(' ')[0]===k);return f.length===1?f[0]:null}
  const near=names.filter(x=>lvN(rKey(x).split(' ').sort().join(' '),ks)<=1);return near.length===1?near[0]:null}
const _ksUnpack=unpack;unpack=async function(c){const o=await _ksUnpack(c);if(o&&typeof o==='object'&&o.n){const k=knownStudent(o.n,o.c);if(k)o.n=k}return o};
function ifrDecode(raw){const m=String(raw).match(/IFR1\.[A-Za-z0-9_-]{20,}/);if(!m)return null;
  try{const o=JSON.parse(new TextDecoder().decode(unb64u(m[0].slice(5))));return o&&Array.isArray(o.s)?o:null}catch(e){return null}}
const IFR_KEYS={grammar:'g',vocabulary:'v',pronunciation:'p',reading:'r',listening:'l',speaking:'s',writing:'w'};
const _ifrImport=importCode;
importCode=async function(){
  const raw=$('#impta').value;if(!raw.trim())return;
  let okA=false;try{okA=!!(await unpack(raw))}catch(e){}
  const R=okA?null:ifrDecode(raw);
  if(!R)return _ifrImport();
  try{const t=TESTS.find(x=>x.title.toLowerCase()===String(R.t||'').toLowerCase());if(!t)throw new Error('That result is for a test this page doesn’t have ('+(R.t||'unknown')+').');
    const c=normCls(R.cl||''),n=knownStudent(R.n,c)||rosterName(c,R.n)||String(R.n||'').trim().replace(/\s+/g,' ');if(!n)throw new Error('The result has no student name.');
    const man={},mm={};R.s.forEach(x=>{const k=IFR_KEYS[String(x[0]).toLowerCase()];if(k){mm[k]=Number(x[2])||0;if(x[1]!=null)man[k]=Number(x[1])||0}});
    const key='imp-'+slug(n)+'--'+slug(c);const ref=RT.db.doc('results/'+key);const g=await ref.get();
    const d=g.exists?JSON.parse(JSON.stringify(g.data())):{name:n,cls:c,src:'import',tests:{}};d.tests=d.tests||{};
    const upd=R.d||new Date().toISOString();
    d.tests[t.id]={aj:'{}',att:1,handed:true,hj:'[]',man,mm,marked:true,mode:'message',upd};d.updated=upd;d.name=d.name||n;d.cls=d.cls||c;
    await ref.set(d);const tot=Object.values(man).reduce((a,b)=>a+b,0),max=Object.values(mm).reduce((a,b)=>a+b,0);
    TV.msg='Imported '+n+(c?' ('+c+')':'')+', '+t.title+': '+tot+' / '+max+'. The IFA code was missing or damaged, so this was read from the IFR1 code (section scores only).';TV.sel=key+'|'+t.id;
  }catch(e){TV.msg=(e&&e.message)||'That result couldn’t be read.'}
  renderTeacher(true);
};

initRuntime();
