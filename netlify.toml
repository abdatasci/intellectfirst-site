# IF Academy website.
# Static pages live at the repo root; scripts/build.mjs copies them to dist/ (without
# node_modules or function sources). Serverless functions live in netlify/functions.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# study PDFs handed out by /api/school/download/<name> to signed-in students and teachers
[functions."school-api"]
  included_files = ["netlify/files/pdf/*.pdf"]

# Lesson slides are encrypted and versioned (?v=), so browsers may keep them.
[[headers]]
  for = "/lessons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/lessons/index.json"
  [headers.values]
    Cache-Control = "no-cache"
